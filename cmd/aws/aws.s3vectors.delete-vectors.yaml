name: delete-vectors
description: Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.
flags:
    --index-arn=: The ARN of the vector index that contains a vector you want to delete.
    --index-name=: The name of the vector index that contains a vector you want to delete.
    --keys=!: The keys of the vectors to delete.
    --vector-bucket-name=: The name of the vector bucket that contains the vector index.
documentation:
    command: |-
        Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.

        Deletes one or more vectors in a vector index. To specify the vector index, you can either use both the vector bucket name and vector index name, or use the vector index Amazon Resource Name (ARN).

        Permissions

        You must have the `s3vectors:DeleteVectors` permission to use this operation.
    flag:
        index-arn: The ARN of the vector index that contains a vector you want to delete.
        index-name: The name of the vector index that contains a vector you want to delete.
        keys: The keys of the vectors to delete.
        vector-bucket-name: The name of the vector bucket that contains the vector index.
