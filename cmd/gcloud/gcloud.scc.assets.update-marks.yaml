name: update-marks
description: Update Cloud Security Command Center asset's security marks.
flags:
    --organization=: (Optional) If the full resource name isn't provided e.g. organizations/123, then provide the
    --security-marks=: SecurityMarks resource to be passed as the request body.
    --start-time=: Time at which the updated SecurityMarks take effect.
    --update-mask=: Use update-mask if you want to selectively update marks represented by --security-marks
documentation:
    command: Update Cloud Security Command Center asset's security marks.
    flag:
        organization: |-
            (Optional) If the full resource name isn't provided e.g. organizations/123, then provide the
            organization id which is the suffix of the organization. Example: organizations/123, the id is
            123.
            +

            To set the `organization` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line;
            * Set the organization property in configuration using `gcloud config set scc/organization` if it is not specified in command line..
        security-marks: |-
            SecurityMarks resource to be passed as the request body. It's a key=value pair separated
            by comma (,). For example: --security-marks="key1=val1,key2=val2".
        start-time: |-
            Time at which the updated SecurityMarks take effect. See `$ gcloud topic datetimes` for
            information on supported time formats.
        update-mask: |-
            Use update-mask if you want to selectively update marks represented by --security-marks
            flag. For example: --update-mask="marks.key1,marks.key2". If you want to override all the
            marks for the given asset either skip the update-mask flag or provide an empty value
            (--update-mask '') for it.
