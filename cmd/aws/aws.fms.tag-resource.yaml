name: tag-resource
description: Adds one or more tags to an Amazon Web Services resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to return tags for.
    --tag-list=!: The tags to add to the resource.
documentation:
    command: Adds one or more tags to an Amazon Web Services resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to return tags for. The Firewall Manager resources that support tagging are policies, applications lists, and protocols lists.
        tag-list: The tags to add to the resource.
