name: describe
description: Describe settingBindings.
flags:
    --data-sharing-with-google-setting=: The dataSharingWithGoogleSetting id of the settingBinding resource.
    --location=: The location id of the settingBinding resource.
documentation:
    command: Describe a settingBinding
    flag:
        data-sharing-with-google-setting: |-
            The dataSharingWithGoogleSetting id of the settingBinding resource.
            +
            To set the `data-sharing-with-google-setting` attribute:
            * provide the argument `setting_binding` on the command line with a fully specified name;
            * provide the argument `--data-sharing-with-google-setting` on the command line.
        location: |-
            The location id of the settingBinding resource.
            +
            To set the `location` attribute:
            * provide the argument `setting_binding` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
