name: modify-saml-properties
description: Modifies multiple properties related to SAML 2.0 authentication, including the enablement status, user access URL, and relay state parameter name that are used for configuring federation with an SAML 2.0 identity provider.
flags:
    --properties-to-delete=: The SAML properties to delete as part of your request.
    --resource-id=!: The directory identifier for which you want to configure SAML properties.
    --saml-properties=: The properties for configuring SAML 2.0 authentication.
documentation:
    command: Modifies multiple properties related to SAML 2.0 authentication, including the enablement status, user access URL, and relay state parameter name that are used for configuring federation with an SAML 2.0 identity provider.
    flag:
        properties-to-delete: |-
            The SAML properties to delete as part of your request.

            Specify one of the following options:

            - `SAML_PROPERTIES_USER_ACCESS_URL` to delete the user access URL.
            - `SAML_PROPERTIES_RELAY_STATE_PARAMETER_NAME` to delete the relay state parameter name.
        resource-id: The directory identifier for which you want to configure SAML properties.
        saml-properties: The properties for configuring SAML 2.0 authentication.
