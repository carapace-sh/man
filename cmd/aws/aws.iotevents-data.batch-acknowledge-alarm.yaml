name: batch-acknowledge-alarm
description: Acknowledges one or more alarms.
flags:
    --acknowledge-action-requests=!: The list of acknowledge action requests.
documentation:
    command: Acknowledges one or more alarms. The alarms change to the `ACKNOWLEDGED` state after you acknowledge them.
    flag:
        acknowledge-action-requests: The list of acknowledge action requests. You can specify up to 10 requests per operation.
