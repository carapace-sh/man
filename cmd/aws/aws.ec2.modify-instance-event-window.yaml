name: modify-instance-event-window
description: Modifies the specified event window.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cron-expression=: The cron expression of the event window, for example, `* 0-4,20-23 * * 1,5`.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-event-window-id=!: The ID of the event window.
    --name=: The name of the event window.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --time-ranges=: The time ranges of the event window.
documentation:
    command: |-
        Modifies the specified event window.

        You can define either a set of time ranges or a cron expression when modifying the event window, but not both.

        To modify the targets associated with the event window, use the [AssociateInstanceEventWindow]() and [DisassociateInstanceEventWindow]() API.

        If Amazon Web Services has already scheduled an event, modifying an event window won't change the time of the scheduled event.

        For more information, see [Define event windows for scheduled events](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/event-windows.html) in the *Amazon EC2 User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cron-expression: |-
            The cron expression of the event window, for example, `* 0-4,20-23 * * 1,5`.

            Constraints:

            - Only hour and day of the week values are supported.
            - For day of the week values, you can specify either integers `0` through `6`, or alternative single values `SUN` through `SAT`.
            - The minute, month, and year must be specified by `*`.
            - The hour value must be one or a multiple range, for example, `0-4` or `0-4,20-23`.
            - Each hour range must be &gt;= 2 hours, for example, `0-2` or `20-23`.
            - The event window must be &gt;= 4 hours. The combined total time ranges in the event window must be &gt;= 4 hours.

            For more information about cron expressions, see [cron](https://en.wikipedia.org/wiki/Cron) on the *Wikipedia website*.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-event-window-id: The ID of the event window.
        name: The name of the event window.
        time-ranges: The time ranges of the event window.
