name: update-identity-pool
description: Updates the configuration of an identity pool.
flags:
    --allow-classic-flow=: Enables or disables the Basic (Classic) authentication flow.
    --allow-unauthenticated-identities=!: TRUE if the identity pool supports unauthenticated logins.
    --cognito-identity-providers=: A list representing an Amazon Cognito user pool and its client ID.
    --developer-provider-name=: The "domain" by which Cognito will refer to your users.
    --identity-pool-id=!: An identity pool ID in the format REGION:GUID.
    --identity-pool-name=!: A string that you provide.
    --identity-pool-tags=: The tags that are assigned to the identity pool.
    --open-id-connect-provider-arns=: The ARNs of the OpenID Connect providers.
    --saml-provider-arns=: An array of Amazon Resource Names (ARNs) of the SAML provider for your identity pool.
    --supported-login-providers=: Optional key:value pairs mapping provider names to provider app IDs.
documentation:
    command: |-
        Updates the configuration of an identity pool.

        If you don't provide a value for a parameter, Amazon Cognito sets it to its default value.

        You must use Amazon Web Services developer credentials to call this operation.
    flag:
        allow-classic-flow: Enables or disables the Basic (Classic) authentication flow. For more information, see [Identity Pools (Federated Identities) Authentication Flow](https://docs.aws.amazon.com/cognito/latest/developerguide/authentication-flow.html) in the *Amazon Cognito Developer Guide*.
        allow-unauthenticated-identities: TRUE if the identity pool supports unauthenticated logins.
        cognito-identity-providers: A list representing an Amazon Cognito user pool and its client ID.
        developer-provider-name: The "domain" by which Cognito will refer to your users.
        identity-pool-id: An identity pool ID in the format REGION:GUID.
        identity-pool-name: A string that you provide.
        identity-pool-tags: The tags that are assigned to the identity pool. A tag is a label that you can apply to identity pools to categorize and manage them in different ways, such as by purpose, owner, environment, or other criteria.
        open-id-connect-provider-arns: The ARNs of the OpenID Connect providers.
        saml-provider-arns: An array of Amazon Resource Names (ARNs) of the SAML provider for your identity pool.
        supported-login-providers: Optional key:value pairs mapping provider names to provider app IDs.
