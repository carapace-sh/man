name: update-cluster
description: Updates an existing cluster.
flags:
    --cluster-arn=!: The Amazon Resource Name (ARN) of the cluster.
    --network-type=!: The network type of the cluster.
completion:
    flag:
        network-type:
            - IPV4
            - DUALSTACK
documentation:
    command: Updates an existing cluster. You can only update the network type of a cluster.
    flag:
        cluster-arn: The Amazon Resource Name (ARN) of the cluster.
        network-type: 'The network type of the cluster. NetworkType can be one of the following: IPV4, DUALSTACK.'
