name: get-instance-access-details
description: Returns temporary SSH keys you can use to connect to a specific virtual private server, or *instance*.
flags:
    --instance-name=!: The name of the instance to access.
    --protocol=: The protocol to use to connect to your instance.
completion:
    flag:
        protocol:
            - ssh
            - rdp
documentation:
    command: |-
        Returns temporary SSH keys you can use to connect to a specific virtual private server, or *instance*.

        The `get instance access details` operation supports tag-based access control via resource tags applied to the resource identified by `instance name`. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        instance-name: The name of the instance to access.
        protocol: The protocol to use to connect to your instance. Defaults to `ssh`.
