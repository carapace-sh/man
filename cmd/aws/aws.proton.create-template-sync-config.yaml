name: create-template-sync-config
description: Set up a template to create new template versions automatically by tracking a linked repository.
flags:
    --branch=!: The repository branch for your template.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --repository-name=!: The repository name (for example, `myrepos/myrepo`).
    --repository-provider=!: The provider type for your repository.
    --subdirectory=: A repository subdirectory path to your template bundle directory.
    --template-name=!: The name of your registered template.
    --template-type=!: The type of the registered template.
completion:
    flag:
        repository-provider:
            - GITHUB
            - GITHUB_ENTERPRISE
            - BITBUCKET
        template-type:
            - ENVIRONMENT
            - SERVICE
documentation:
    command: |-
        Set up a template to create new template versions automatically by tracking a linked repository. A linked repository is a repository that has been registered with Proton. For more information, see [CreateRepository]().

        When a commit is pushed to your linked repository, Proton checks for changes to your repository template bundles. If it detects a template bundle change, a new major or minor version of its template is created, if the version doesn’t already exist. For more information, see [Template sync configurations](https://docs.aws.amazon.com/proton/latest/userguide/ag-template-sync-configs.html) in the *Proton User Guide*.
    flag:
        branch: The repository branch for your template.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        repository-name: The repository name (for example, `myrepos/myrepo`).
        repository-provider: The provider type for your repository.
        subdirectory: A repository subdirectory path to your template bundle directory. When included, Proton limits the template bundle search to this repository directory.
        template-name: The name of your registered template.
        template-type: The type of the registered template.
