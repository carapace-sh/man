name: create-application
description: Creates a Managed Service for Apache Flink application.
flags:
    --application-configuration=: Use this parameter to configure the application.
    --application-description=: A summary description of the application.
    --application-mode=: Use the `STREAMING` mode to create a Managed Service for Apache Flink application.
    --application-name=!: The name of your application (for example, `sample-app`).
    --cloud-watch-logging-options=: Use this parameter to configure an Amazon CloudWatch log stream to monitor application configuration errors.
    --runtime-environment=!: The runtime environment for the application.
    --service-execution-role=!: The IAM role used by the application to access Kinesis data streams, Kinesis Data Firehose delivery streams, Amazon S3 objects, and other external resources.
    --tags=: A list of one or more tags to assign to the application.
completion:
    flag:
        application-mode:
            - STREAMING
            - INTERACTIVE
        runtime-environment:
            - SQL-1_0
            - FLINK-1_6
            - FLINK-1_8
            - ZEPPELIN-FLINK-1_0
            - FLINK-1_11
            - FLINK-1_13
            - ZEPPELIN-FLINK-2_0
            - FLINK-1_15
            - ZEPPELIN-FLINK-3_0
            - FLINK-1_18
            - FLINK-1_19
            - FLINK-1_20
documentation:
    command: Creates a Managed Service for Apache Flink application. For information about creating a Managed Service for Apache Flink application, see [Creating an Application](https://docs.aws.amazon.com/kinesisanalytics/latest/java/getting-started.html).
    flag:
        application-configuration: Use this parameter to configure the application.
        application-description: A summary description of the application.
        application-mode: Use the `STREAMING` mode to create a Managed Service for Apache Flink application. To create a Managed Service for Apache Flink Studio notebook, use the `INTERACTIVE` mode.
        application-name: The name of your application (for example, `sample-app`).
        cloud-watch-logging-options: Use this parameter to configure an Amazon CloudWatch log stream to monitor application configuration errors.
        runtime-environment: The runtime environment for the application.
        service-execution-role: The IAM role used by the application to access Kinesis data streams, Kinesis Data Firehose delivery streams, Amazon S3 objects, and other external resources.
        tags: A list of one or more tags to assign to the application. A tag is a key-value pair that identifies an application. Note that the maximum number of application tags includes system tags. The maximum number of user-defined application tags is 50. For more information, see [Using Tagging](https://docs.aws.amazon.com/kinesisanalytics/latest/java/how-tagging.html).
