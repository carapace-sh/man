documentation:
    command: |
        *(ALPHA)*  Redact potentially sensitive data from image content.
    flag:
        include-quote: |-
            If True, a contextual quote from the data that triggered a
            finding is included in the response. Even if the content is not
            text, it may be converted to a textual representation in the
            response. For example, given the input value 'My phone number is
            (415) 555-0890' and a search for the infoType PHONE_NUMBER, the
            contextual quote would be '(415) 555-0890.'
        info-types: |-
            Which infoTypes to scan input for. The values must correspond to
            infoType values found in documentation. For more information about
            valid infoTypes, see [infoTypes Reference](https://cloud.google.com/dlp/docs/infotypes-reference)
        min-likelihood: 'Only return findings equal to or above this threshold. _MIN_LIKELIHOOD_ must be one of: *likely*, *possible*, *unlikely*, *very-likely*, *very-unlikely*.'
        no-include-quote: |
            If True, a contextual quote from the data that triggered a
            finding is included in the response. Even if the content is not
            text, it may be converted to a textual representation in the
            response. For example, given the input value 'My phone number is
            (415) 555-0890' and a search for the infoType PHONE_NUMBER, the
            contextual quote would be '(415) 555-0890.'
        no-redact-all-text: |
            If specified, all text info in the image will be removed,
            whether it is detected as sensitive or not.
        output-file: Path to the file to write redacted contents to.
        redact-all-text: |-
            If specified, all text info in the image will be removed,
            whether it is detected as sensitive or not.
        redact-color: |-
            The color to use when redacting content from an image. If not
            specified, the default value is black. Colors should be specified as
            a string of `r,g,b` float values in the interval [0,1] representing
            the amount of red, green, and blue in the color, respectively.
            For example, `black = 0,0,0`, `red = 1.0,0,0`, `white = 1.0,1.0,1.0`,
            and so on.
