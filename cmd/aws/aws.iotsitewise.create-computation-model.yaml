name: create-computation-model
description: Create a computation model with a configuration and data binding.
flags:
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --computation-model-configuration=!: The configuration for the computation model.
    --computation-model-data-binding=!: The data binding for the computation model.
    --computation-model-description=: The description of the computation model.
    --computation-model-name=!: The name of the computation model.
    --tags=: A list of key-value pairs that contain metadata for the asset.
documentation:
    command: Create a computation model with a configuration and data binding.
    flag:
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        computation-model-configuration: The configuration for the computation model.
        computation-model-data-binding: The data binding for the computation model. Key is a variable name defined in configuration. Value is a `ComputationModelDataBindingValue` referenced by the variable.
        computation-model-description: The description of the computation model.
        computation-model-name: The name of the computation model.
        tags: A list of key-value pairs that contain metadata for the asset. For more information, see [Tagging your IoT SiteWise resources](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/tag-resources.html) in the *IoT SiteWise User Guide*.
