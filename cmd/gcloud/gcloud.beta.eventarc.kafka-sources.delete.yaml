name: delete
description: '*(BETA)*  Delete an Eventarc Kafka source.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location for the Eventarc kafka source, which should be one of the supported regions.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(BETA)*  Delete an Eventarc Kafka source.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location for the Eventarc kafka source, which should be one of the supported regions. Alternatively, set the [eventarc/location] property.
            +
            To set the `location` attribute:
            * provide the argument `kafka_source` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `eventarc/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
