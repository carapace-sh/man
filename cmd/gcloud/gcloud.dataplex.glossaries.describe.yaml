name: describe
description: Describe a Glossary.
flags:
    --location=: Location of the Dataplex resource.
documentation:
    command: |
        Describe a Glossary.
        Displays all details of a Glossary given a valid Glossary ID.
    flag:
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `glossary` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
