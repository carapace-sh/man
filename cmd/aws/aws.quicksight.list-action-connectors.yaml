name: list-action-connectors
description: Lists all action connectors in the specified Amazon Web Services account.
flags:
    --aws-account-id=!: The Amazon Web Services account ID for which to list action connectors.
    --max-results=: The maximum number of action connectors to return in a single response.
    --next-token=: A pagination token to retrieve the next set of results.
documentation:
    command: Lists all action connectors in the specified Amazon Web Services account. Returns summary information for each connector including its name, type, creation time, and status.
    flag:
        aws-account-id: The Amazon Web Services account ID for which to list action connectors.
        max-results: The maximum number of action connectors to return in a single response. Valid range is 1 to 100.
        next-token: A pagination token to retrieve the next set of results. Use the token returned from a previous call to continue listing action connectors.
