name: list-built-in-slot-types
description: Gets a list of built-in slot types that meet the specified criteria.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --locale-id=!: The identifier of the language and locale of the slot types to list.
    --max-results=: The maximum number of built-in slot types to return in each page of results.
    --next-token=: If the response from the `ListBuiltInSlotTypes` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response.
    --sort-by=: Determines the sort order for the response from the `ListBuiltInSlotTypes` operation.
documentation:
    command: Gets a list of built-in slot types that meet the specified criteria.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
