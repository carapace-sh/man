name: create-network-insights-path
description: Creates a path to analyze for reachability.
flags:
    --client-token=!: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --destination-ip=: The IP address of the destination.
    --destination-port=: The destination port.
    --destination=: The ID or ARN of the destination.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filter-at-destination=: Scopes the analysis to network paths that match specific filters at the destination.
    --filter-at-source=: Scopes the analysis to network paths that match specific filters at the source.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --protocol=!: The protocol.
    --source-ip=: The IP address of the source.
    --source=!: The ID or ARN of the source.
    --tag-specifications=: The tags to add to the path.
completion:
    flag:
        protocol:
            - tcp
            - udp
documentation:
    command: |-
        Creates a path to analyze for reachability.

        Reachability Analyzer enables you to analyze and debug network reachability between two resources in your virtual private cloud (VPC). For more information, see the [Reachability Analyzer Guide](https://docs.aws.amazon.com/vpc/latest/reachability/).
    flag:
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [How to ensure idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        destination: The ID or ARN of the destination. If the resource is in another account, you must specify an ARN.
        destination-ip: The IP address of the destination.
        destination-port: The destination port.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filter-at-destination: Scopes the analysis to network paths that match specific filters at the destination. If you specify this parameter, you can't specify the parameter for the destination IP address.
        filter-at-source: Scopes the analysis to network paths that match specific filters at the source. If you specify this parameter, you can't specify the parameters for the source IP address or the destination port.
        protocol: The protocol.
        source: The ID or ARN of the source. If the resource is in another account, you must specify an ARN.
        source-ip: The IP address of the source.
        tag-specifications: The tags to add to the path.
