    --cors-file=: Sets the Cross-Origin Resource Sharing (CORS) configuration on a bucket.
    --default-encryption-key=: Set the default KMS key for the bucket.
    --default-event-based-hold: Sets the default value for an event-based hold on the bucket.
    --default-object-acl-file=: Sets the default object ACL from file for the bucket.
    --default-storage-class=: Sets the default storage class for the bucket.
    --enable-autoclass: The Autoclass feature automatically selects the best storage class for objects based on access patterns.
    --ip-filter-file=: Sets the IP filter for the bucket.
    --labels-file=: Sets the label configuration for the bucket.
    --lifecycle-file=: Sets the lifecycle management configuration on a bucket.
    --lock-retention-period: Locks an unlocked retention policy on the buckets.
    --log-bucket=: Enables usage and storage logging for the bucket specified in the overall update command, outputting log files to the bucket specified in this flag.
    --log-object-prefix=: Specifies a prefix for the names of logs generated in the log bucket.
