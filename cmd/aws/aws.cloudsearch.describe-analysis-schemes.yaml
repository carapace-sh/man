name: describe-analysis-schemes
description: Gets the analysis schemes configured for a domain.
flags:
    --analysis-scheme-names=:
        description: The analysis schemes you want to describe.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deployed: Whether to display the deployed configuration (`true`) or include any pending changes (`false`).
    --domain-name=!: The name of the domain you want to describe.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-deployed: Whether to display the deployed configuration (`true`) or include any pending changes (`false`).
documentation:
    command: Gets the analysis schemes configured for a domain. An analysis scheme defines language-specific text processing options for a `text` field. Can be limited to specific analysis schemes by name. By default, shows all analysis schemes and includes any pending changes to the configuration. Set the `Deployed` option to `true` to show the active configuration and exclude pending changes. For more information, see [Configuring Analysis Schemes](http://docs.aws.amazon.com/cloudsearch/latest/developerguide/configuring-analysis-schemes.html) in the *Amazon CloudSearch Developer Guide*.
    flag:
        analysis-scheme-names: The analysis schemes you want to describe.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deployed: Whether to display the deployed configuration (`true`) or include any pending changes (`false`). Defaults to `false`.
        domain-name: The name of the domain you want to describe.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
