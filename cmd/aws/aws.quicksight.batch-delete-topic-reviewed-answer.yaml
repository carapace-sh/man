name: batch-delete-topic-reviewed-answer
description: Deletes reviewed answers for Q Topic.
flags:
    --answer-ids=: The Answer IDs of the Answers to be deleted.
    --aws-account-id=!: The ID of the Amazon Web Services account that you want to delete a reviewed answers in.
    --topic-id=!: The ID for the topic reviewed answer that you want to delete.
documentation:
    command: Deletes reviewed answers for Q Topic.
    flag:
        answer-ids: The Answer IDs of the Answers to be deleted.
        aws-account-id: The ID of the Amazon Web Services account that you want to delete a reviewed answers in.
        topic-id: The ID for the topic reviewed answer that you want to delete. This ID is unique per Amazon Web Services Region for each Amazon Web Services account.
