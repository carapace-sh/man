name: restart
description: Restart a Looker instance.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Looker region of the instance.
documentation:
    command: |
        Restart for a Looker instance.

        This command can fail for the following reasons:
          * The instance specified does not exist.
          * The active account does not have permission to access the given
            instance.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Looker region of the instance. Overrides the default
            looker/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `looker/region`.
