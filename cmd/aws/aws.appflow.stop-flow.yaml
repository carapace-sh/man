name: stop-flow
description: Deactivates the existing flow.
flags:
    --flow-name=!: The specified name of the flow.
documentation:
    command: Deactivates the existing flow. For on-demand flows, this operation returns an `unsupportedOperationException` error message. For schedule and event-triggered flows, this operation deactivates the flow.
    flag:
        flow-name: The specified name of the flow. Spaces are not allowed. Use underscores (\_) or hyphens (-) only.
