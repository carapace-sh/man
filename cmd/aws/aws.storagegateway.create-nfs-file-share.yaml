name: create-nfs-file-share
description: Creates a Network File System (NFS) file share on an existing S3 File Gateway.
flags:
    --audit-destination-arn=: The Amazon Resource Name (ARN) of the storage used for audit logs.
    --bucket-region=: Specifies the Region of the S3 bucket where the NFS file share stores files.
    --cache-attributes=: Specifies refresh cache information for the file share.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-list=: The list of clients that are allowed to access the S3 File Gateway.
    --client-token=!: A unique string value that you supply that is used by S3 File Gateway to ensure idempotent file share creation.
    --default-storage-class=: The default storage class for objects put into an Amazon S3 bucket by the S3 File Gateway.
    --encryption-type=: A value that specifies the type of server-side encryption that the file share will use for the data that it stores in Amazon S3.
    --file-share-name=: The name of the file share.
    --gateway-arn=!: The Amazon Resource Name (ARN) of the S3 File Gateway on which you want to create a file share.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --guess-mime-type-enabled: A value that enables guessing of the MIME type for uploaded objects based on file extensions.
    --kms-encrypted: Optional.
    --kms-key=: Optional.
    --location-arn=!: A custom ARN for the backend storage used for storing data for file shares.
    --nfs-file-share-defaults=: File share default values.
    --no-guess-mime-type-enabled: A value that enables guessing of the MIME type for uploaded objects based on file extensions.
    --no-kms-encrypted: Optional.
    --no-read-only: A value that sets the write status of a file share.
    --no-requester-pays: A value that sets who pays the cost of the request and the cost associated with data download from the S3 bucket.
    --notification-policy=: The notification policy of the file share.
    --object-acl=: A value that sets the access control list (ACL) permission for objects in the S3 bucket that a S3 File Gateway puts objects into.
    --read-only: A value that sets the write status of a file share.
    --requester-pays: A value that sets who pays the cost of the request and the cost associated with data download from the S3 bucket.
    --role=!: The ARN of the Identity and Access Management (IAM) role that an S3 File Gateway assumes when it accesses the underlying storage.
    --squash=: A value that maps a user to anonymous user.
    --tags=: A list of up to 50 tags that can be assigned to the NFS file share.
    --vpc-endpoint-dns-name=: Specifies the DNS name for the VPC endpoint that the NFS file share uses to connect to Amazon S3.
completion:
    flag:
        encryption-type:
            - SseS3
            - SseKms
            - DsseKms
        object-acl:
            - private
            - public-read
            - public-read-write
            - authenticated-read
            - bucket-owner-read
            - bucket-owner-full-control
            - aws-exec-read
documentation:
    command: |-
        Creates a Network File System (NFS) file share on an existing S3 File Gateway. In Storage Gateway, a file share is a file system mount point backed by Amazon S3 cloud storage. Storage Gateway exposes file shares using an NFS interface. This operation is only supported for S3 File Gateways.

        S3 File gateway requires Security Token Service (Amazon Web Services STS) to be activated to enable you to create a file share. Make sure Amazon Web Services STS is activated in the Amazon Web Services Region you are creating your S3 File Gateway in. If Amazon Web Services STS is not activated in the Amazon Web Services Region, activate it. For information about how to activate Amazon Web Services STS, see [Activating and deactivating Amazon Web Services STS in an Amazon Web Services Region](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp_enable-regions.html) in the *Identity and Access Management User Guide*.

        S3 File Gateways do not support creating hard or symbolic links on a file share.
    flag:
        audit-destination-arn: The Amazon Resource Name (ARN) of the storage used for audit logs.
        bucket-region: |-
            Specifies the Region of the S3 bucket where the NFS file share stores files.

            This parameter is required for NFS file shares that connect to Amazon S3 through a VPC endpoint, a VPC access point, or an access point alias that points to a VPC access point.
        cache-attributes: Specifies refresh cache information for the file share.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-list: The list of clients that are allowed to access the S3 File Gateway. The list must contain either valid IPv4/IPv6 addresses or valid CIDR blocks.
        client-token: A unique string value that you supply that is used by S3 File Gateway to ensure idempotent file share creation.
        default-storage-class: |-
            The default storage class for objects put into an Amazon S3 bucket by the S3 File Gateway. The default value is `S3_STANDARD`. Optional.

            Valid Values: `S3_STANDARD` | `S3_INTELLIGENT_TIERING` | `S3_STANDARD_IA` | `S3_ONEZONE_IA`
        encryption-type: |-
            A value that specifies the type of server-side encryption that the file share will use for the data that it stores in Amazon S3.

            We recommend using `EncryptionType` instead of `KMSEncrypted` to set the file share encryption method. You do not need to provide values for both parameters.

            If values for both parameters exist in the same request, then the specified encryption methods must not conflict. For example, if `EncryptionType` is `SseS3`, then `KMSEncrypted` must be `false`. If `EncryptionType` is `SseKms` or `DsseKms`, then `KMSEncrypted` must be `true`.
        file-share-name: |-
            The name of the file share. Optional.

            `FileShareName` must be set if an S3 prefix name is set in `LocationARN`, or if an access point or access point alias is used.

            A valid NFS file share name can only contain the following characters: `a`-`z`, `A`-`Z`, `0`-`9`, `-`, `.`, and `_`.
        gateway-arn: The Amazon Resource Name (ARN) of the S3 File Gateway on which you want to create a file share.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        guess-mime-type-enabled: |-
            A value that enables guessing of the MIME type for uploaded objects based on file extensions. Set this value to `true` to enable MIME type guessing, otherwise set to `false`. The default value is `true`.

            Valid Values: `true` | `false`
        kms-encrypted: |-
            Optional. Set to `true` to use Amazon S3 server-side encryption with your own KMS key (SSE-KMS), or `false` to use a key managed by Amazon S3 (SSE-S3). To use dual-layer encryption (DSSE-KMS), set the `EncryptionType` parameter instead.

            We recommend using `EncryptionType` instead of `KMSEncrypted` to set the file share encryption method. You do not need to provide values for both parameters.

            If values for both parameters exist in the same request, then the specified encryption methods must not conflict. For example, if `EncryptionType` is `SseS3`, then `KMSEncrypted` must be `false`. If `EncryptionType` is `SseKms` or `DsseKms`, then `KMSEncrypted` must be `true`.

            Valid Values: `true` | `false`
        kms-key: Optional. The Amazon Resource Name (ARN) of a symmetric customer master key (CMK) used for Amazon S3 server-side encryption. Storage Gateway does not support asymmetric CMKs. This value must be set if `KMSEncrypted` is `true`, or if `EncryptionType` is `SseKms` or `DsseKms`.
        location-arn: |-
            A custom ARN for the backend storage used for storing data for file shares. It includes a resource ARN with an optional prefix concatenation. The prefix must end with a forward slash (/).

            You can specify LocationARN as a bucket ARN, access point ARN or access point alias, as shown in the following examples.

            Bucket ARN:

            `arn:aws:s3:::amzn-s3-demo-bucket/prefix/`

            Access point ARN:

            `arn:aws:s3:region:account-id:accesspoint/access-point-name/prefix/`

            If you specify an access point, the bucket policy must be configured to delegate access control to the access point. For information, see [Delegating access control to access points](https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points-policies.html#access-points-delegating-control) in the *Amazon S3 User Guide*.

            Access point alias:

            `test-ap-ab123cdef4gehijklmn5opqrstuvuse1a-s3alias`
        nfs-file-share-defaults: File share default values. Optional.
        notification-policy: |-
            The notification policy of the file share. `SettlingTimeInSeconds` controls the number of seconds to wait after the last point in time a client wrote to a file before generating an `ObjectUploaded` notification. Because clients can make many small writes to files, it's best to set this parameter for as long as possible to avoid generating multiple notifications for the same file in a small time period.

            `SettlingTimeInSeconds` has no effect on the timing of the object uploading to Amazon S3, only the timing of the notification.

            This setting is not meant to specify an exact time at which the notification will be sent. In some cases, the gateway might require more than the specified delay time to generate and send notifications.

            The following example sets `NotificationPolicy` on with `SettlingTimeInSeconds` set to 60.

            `{\"Upload\": {\"SettlingTimeInSeconds\": 60}}`

            The following example sets `NotificationPolicy` off.

            `{}`
        object-acl: A value that sets the access control list (ACL) permission for objects in the S3 bucket that a S3 File Gateway puts objects into. The default value is `private`.
        read-only: |-
            A value that sets the write status of a file share. Set this value to `true` to set the write status to read-only, otherwise set to `false`.

            Valid Values: `true` | `false`
        requester-pays: |-
            A value that sets who pays the cost of the request and the cost associated with data download from the S3 bucket. If this value is set to `true`, the requester pays the costs; otherwise, the S3 bucket owner pays. However, the S3 bucket owner always pays the cost of storing data.

            `RequesterPays` is a configuration for the S3 bucket that backs the file share, so make sure that the configuration on the file share is the same as the S3 bucket configuration.

            Valid Values: `true` | `false`
        role: The ARN of the Identity and Access Management (IAM) role that an S3 File Gateway assumes when it accesses the underlying storage.
        squash: |-
            A value that maps a user to anonymous user.

            Valid values are the following:

            - `RootSquash`: Only root is mapped to anonymous user.
            - `NoSquash`: No one is mapped to anonymous user.
            - `AllSquash`: Everyone is mapped to anonymous user.
        tags: |-
            A list of up to 50 tags that can be assigned to the NFS file share. Each tag is a key-value pair.

            Valid characters for key and value are letters, spaces, and numbers representable in UTF-8 format, and the following special characters: + - = . _ : / @. The maximum length of a tag's key is 128 characters, and the maximum length for a tag's value is 256.
        vpc-endpoint-dns-name: |-
            Specifies the DNS name for the VPC endpoint that the NFS file share uses to connect to Amazon S3.

            This parameter is required for NFS file shares that connect to Amazon S3 through a VPC endpoint, a VPC access point, or an access point alias that points to a VPC access point.
