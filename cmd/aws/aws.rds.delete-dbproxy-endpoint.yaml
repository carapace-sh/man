name: delete-dbproxy-endpoint
description: Deletes a `DBProxyEndpoint`.
flags:
    --dbproxy-endpoint-name=!: The name of the DB proxy endpoint to delete.
documentation:
    command: Deletes a `DBProxyEndpoint`. Doing so removes the ability to access the DB proxy using the endpoint that you defined. The endpoint that you delete might have provided capabilities such as read/write or read-only operations, or using a different VPC than the DB proxy's default VPC.
    flag:
        dbproxy-endpoint-name: The name of the DB proxy endpoint to delete.
