name: describe-vpc-endpoint-connection-notifications
description: Describes the connection notifications for VPC endpoints and VPC endpoint services.
flags:
    --connection-notification-id=: The ID of the notification.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: The filters.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token to request the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Describes the connection notifications for VPC endpoints and VPC endpoint services.
    flag:
        connection-notification-id: The ID of the notification.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters.

            - `connection-notification-arn` - The ARN of the SNS topic for the notification.
            - `connection-notification-id` - The ID of the notification.
            - `connection-notification-state` - The state of the notification (`Enabled` | `Disabled`).
            - `connection-notification-type` - The type of notification (`Topic`).
            - `service-id` - The ID of the endpoint service.
            - `vpc-endpoint-id` - The ID of the VPC endpoint.
        max-results: The maximum number of results to return in a single call. To retrieve the remaining results, make another request with the returned `NextToken` value.
        next-token: The token to request the next page of results.
