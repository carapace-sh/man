name: list-rules
description: Lists your Amazon EventBridge rules.
flags:
    --event-bus-name=: The name or ARN of the event bus to list the rules for.
    --limit=: The maximum number of results to return.
    --name-prefix=: The prefix matching the rule name.
    --next-token=: The token returned by a previous call, which you can use to retrieve the next set of results.
documentation:
    command: |-
        Lists your Amazon EventBridge rules. You can either list all the rules or you can provide a prefix to match to the rule names.

        The maximum number of results per page for requests is 100.

        ListRules does not list the targets of a rule. To see the targets associated with a rule, use [ListTargetsByRule](https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_ListTargetsByRule.html).
    flag:
        event-bus-name: The name or ARN of the event bus to list the rules for. If you omit this, the default event bus is used.
        limit: The maximum number of results to return.
        name-prefix: The prefix matching the rule name.
        next-token: |-
            The token returned by a previous call, which you can use to retrieve the next set of results.

            The value of `nextToken` is a unique pagination token for each page. To retrieve the next page of results, make the call again using the returned token. Keep all other arguments unchanged.

            Using an expired pagination token results in an `HTTP 400 InvalidToken` error.
