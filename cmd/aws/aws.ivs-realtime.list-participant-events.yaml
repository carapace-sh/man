name: list-participant-events
description: Lists events for a specified participant that occurred during a specified stage session.
flags:
    --max-results=: Maximum number of results to return.
    --next-token=: The first participant event to retrieve.
    --participant-id=!: Unique identifier for this participant.
    --session-id=!: ID of a session within the stage.
    --stage-arn=!: Stage ARN.
documentation:
    command: Lists events for a specified participant that occurred during a specified stage session.
    flag:
        max-results: 'Maximum number of results to return. Default: 50.'
        next-token: The first participant event to retrieve. This is used for pagination; see the `nextToken` response field.
        participant-id: Unique identifier for this participant. This is assigned by IVS and returned by [CreateParticipantToken]().
        session-id: ID of a session within the stage.
        stage-arn: Stage ARN.
