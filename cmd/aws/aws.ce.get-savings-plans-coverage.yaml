name: get-savings-plans-coverage
description: Retrieves the Savings Plans covered for your account.
flags:
    --filter=: Filters Savings Plans coverage data by dimensions.
    --granularity=: The granularity of the Amazon Web Services cost data for your Savings Plans.
    --group-by=: You can group the data using the attributes `INSTANCE_FAMILY`, `REGION`, or `SERVICE`.
    --max-results=: The number of items to be returned in a response.
    --metrics=: The measurement that you want your Savings Plans coverage reported in.
    --next-token=: The token to retrieve the next set of results.
    --sort-by=: The value that you want to sort the data by.
    --time-period=!: The time period that you want the usage and costs for.
completion:
    flag:
        granularity:
            - DAILY
            - MONTHLY
            - HOURLY
documentation:
    command: |-
        Retrieves the Savings Plans covered for your account. This enables you to see how much of your cost is covered by a Savings Plan. An organization’s management account can see the coverage of the associated member accounts. This supports dimensions, Cost Categories, and nested expressions. For any time period, you can filter data for Savings Plans usage with the following dimensions:

        - `LINKED_ACCOUNT`
        - `REGION`
        - `SERVICE`
        - `INSTANCE_FAMILY`

        To determine valid values for a dimension, use the `GetDimensionValues` operation.
    flag:
        filter: |-
            Filters Savings Plans coverage data by dimensions. You can filter data for Savings Plans usage with the following dimensions:

            - `LINKED_ACCOUNT`
            - `REGION`
            - `SERVICE`
            - `INSTANCE_FAMILY`

            `GetSavingsPlansCoverage` uses the same [Expression](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_Expression.html) object as the other operations, but only `AND` is supported among each dimension. If there are multiple values for a dimension, they are OR'd together.

            Cost category is also supported.
        granularity: |-
            The granularity of the Amazon Web Services cost data for your Savings Plans. `Granularity` can't be set if `GroupBy` is set.

            The `GetSavingsPlansCoverage` operation supports only `DAILY` and `MONTHLY` granularities.
        group-by: You can group the data using the attributes `INSTANCE_FAMILY`, `REGION`, or `SERVICE`.
        max-results: The number of items to be returned in a response. The default is `20`, with a minimum value of `1`.
        metrics: The measurement that you want your Savings Plans coverage reported in. The only valid value is `SpendCoveredBySavingsPlans`.
        next-token: The token to retrieve the next set of results. Amazon Web Services provides the token when the response from a previous call has more results than the maximum page size.
        sort-by: |-
            The value that you want to sort the data by.

            The following values are supported for `Key`:

            - `SpendCoveredBySavingsPlan`
            - `OnDemandCost`
            - `CoveragePercentage`
            - `TotalCost`
            - `InstanceFamily`
            - `Region`
            - `Service`

            The supported values for `SortOrder` are `ASCENDING` and `DESCENDING`.
        time-period: The time period that you want the usage and costs for. The `Start` date must be within 13 months. The `End` date must be after the `Start` date, and before the current date. Future dates can't be used as an `End` date.
