name: update-budget
description: Updates a budget that sets spending thresholds for rendering activity.
flags:
    --actions-to-add=:
        description: The budget actions to add.
        nargs: -1
    --actions-to-remove=:
        description: The budget actions to remove from the budget.
        nargs: -1
    --approximate-dollar-limit=: The dollar limit to update on the budget.
    --budget-id=!: The budget ID to update.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The unique token which the server uses to recognize retries of the same request.
    --description=: The description of the budget to update.
    --display-name=: The display name of the budget to update.
    --farm-id=!: The farm ID of the budget to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --schedule=: The schedule to update.
    --status=: Updates the status of the budget.
completion:
    flag:
        status:
            - ACTIVE
            - INACTIVE
documentation:
    command: Updates a budget that sets spending thresholds for rendering activity.
    flag:
        actions-to-add: The budget actions to add. Budget actions specify what happens when the budget runs out.
        actions-to-remove: The budget actions to remove from the budget.
        approximate-dollar-limit: The dollar limit to update on the budget. Based on consumed usage.
        budget-id: The budget ID to update.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The unique token which the server uses to recognize retries of the same request.
        description: |-
            The description of the budget to update.

            This field can store any content. Escape or encode this content before displaying it on a webpage or any other system that might interpret the content of this field.
        display-name: |-
            The display name of the budget to update.

            This field can store any content. Escape or encode this content before displaying it on a webpage or any other system that might interpret the content of this field.
        farm-id: The farm ID of the budget to update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        schedule: The schedule to update.
        status: |-
            Updates the status of the budget.

            - `ACTIVE`–The budget is being evaluated.
            - `INACTIVE`–The budget is inactive. This can include Expired, Canceled, or deleted Deleted statuses.
