name: import
description: '*(ALPHA)*  Import an SSL policy.'
flags:
    --global: If set, the SSL policy is global.
    --no-global&: If set, the SSL policy is global.
    --region=: Region of the SSL policy to import.
    --source=: Path to a YAML file containing configuration export data.
documentation:
    command: |-
        *(ALPHA)*  If the specified SSL policy already exists, it will be overwritten.
        Otherwise, a new SSL policy will be created.
        To edit an SSL policy you can export the SSL policy to a file,
        edit its configuration, and then import the new configuration.
    flag:
        global: If set, the SSL policy is global.
        no-global: If set, the SSL policy is global.
        region: Region of the SSL policy to import. Overrides the default *compute/region* property value for this command invocation.
        source: |-
            Path to a YAML file containing configuration export data.
                      Alternatively, you may omit this flag to read from standard input.For a schema describing the export/import format, see:
                      $CLOUDSDKROOT/lib/googlecloudsdk/schemas/compute/alpha/SslPolicy.yaml.
            +

                  Note: $CLOUDSDKROOT represents the Google Cloud CLI's installation directory.
