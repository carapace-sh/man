name: assume-fleet-role-for-read
description: Get Amazon Web Services credentials from the fleet role.
flags:
    --farm-id=!: The farm ID for the fleet's farm.
    --fleet-id=!: The fleet ID.
documentation:
    command: Get Amazon Web Services credentials from the fleet role. The IAM permissions of the credentials are scoped down to have read-only access.
    flag:
        farm-id: The farm ID for the fleet's farm.
        fleet-id: The fleet ID.
