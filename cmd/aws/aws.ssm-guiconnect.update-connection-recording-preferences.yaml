name: update-connection-recording-preferences
description: Updates the preferences for recording RDP connections.
flags:
    --client-token=: User-provided idempotency token.
    --connection-recording-preferences=!: The set of preferences used for recording RDP connections in the requesting Amazon Web Services account and Amazon Web Services Region.
documentation:
    command: Updates the preferences for recording RDP connections.
    flag:
        client-token: User-provided idempotency token.
        connection-recording-preferences: The set of preferences used for recording RDP connections in the requesting Amazon Web Services account and Amazon Web Services Region. This includes details such as which S3 bucket recordings are stored in.
