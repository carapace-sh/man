name: decrease-replica-count
description: Dynamically decreases the number of replicas in a Valkey or Redis OSS (cluster mode disabled) replication group or the number of replica nodes in one or more node groups (shards) of a Valkey or Redis OSS (cluster mode enabled) replication group.
flags:
    --apply-immediately!: If `True`, the number of replica nodes is decreased immediately.
    --new-replica-count=: The number of read replica nodes you want at the completion of this operation.
    --no-apply-immediately!&: If `True`, the number of replica nodes is decreased immediately.
    --replica-configuration=: A list of `ConfigureShard` objects that can be used to configure each shard in a Valkey or Redis OSS replication group.
    --replicas-to-remove=: A list of the node ids to remove from the replication group or node group (shard).
    --replication-group-id=!: The id of the replication group from which you want to remove replica nodes.
documentation:
    command: Dynamically decreases the number of replicas in a Valkey or Redis OSS (cluster mode disabled) replication group or the number of replica nodes in one or more node groups (shards) of a Valkey or Redis OSS (cluster mode enabled) replication group. This operation is performed with no cluster down time.
    flag:
        apply-immediately: If `True`, the number of replica nodes is decreased immediately. `ApplyImmediately=False` is not currently supported.
        new-replica-count: "The number of read replica nodes you want at the completion of this operation. For Valkey or Redis OSS (cluster mode disabled) replication groups, this is the number of replica nodes in the replication group. For Valkey or Redis OSS (cluster mode enabled) replication groups, this is the number of replica nodes in each of the replication group's node groups.\n\nThe minimum number of replicas in a shard or replication group is:\n\n- Valkey or Redis OSS (cluster mode disabled)\n  \n  - If Multi-AZ is enabled: 1\n  - If Multi-AZ is not enabled: 0\n- Valkey or Redis OSS (cluster mode enabled): 0 (though you will not be able to failover to a replica if your primary node fails)"
        replica-configuration: 'A list of `ConfigureShard` objects that can be used to configure each shard in a Valkey or Redis OSS replication group. The `ConfigureShard` has three members: `NewReplicaCount`, `NodeGroupId`, and `PreferredAvailabilityZones`.'
        replicas-to-remove: A list of the node ids to remove from the replication group or node group (shard).
        replication-group-id: The id of the replication group from which you want to remove replica nodes.
