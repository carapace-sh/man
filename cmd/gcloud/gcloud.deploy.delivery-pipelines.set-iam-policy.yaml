name: set-iam-policy
description: Set the IAM policy for a Cloud Deploy delivery pipeline.
flags:
    --region=: Location of the delivery_pipeline.
documentation:
    command: |
        Set the IAM policy associated with a Cloud Deploy delivery pipeline.

        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.
    flag:
        region: |-
            Location of the delivery_pipeline.
            +

            To set the `region` attribute:
            * provide the argument `delivery_pipeline` on the command line with a fully specified name;
            * set the property `deploy/delivery_pipeline` with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
