name: seed
description: Seed a Database Migration Service conversion workspace.
flags:
    --auto-commit: Auto commits the conversion workspace.
    --destination-connection-profile=!: ID of the connection_profile or fully qualified identifier for the connection_profile.
    --no-async: Waits for the operation in progress to complete before returning.
    --no-auto-commit&: Auto commits the conversion workspace.
    --region=: The Cloud region for the conversion_workspace.
    --source-connection-profile=!: ID of the connection_profile or fully qualified identifier for the connection_profile.
documentation:
    command: |
        Seed a Database Migration Service conversion workspace.
    flag:
        auto-commit: Auto commits the conversion workspace.
        destination-connection-profile: |-
            ID of the connection_profile or fully qualified identifier for the connection_profile.
            +
            To set the `connection_profile` attribute:
            * provide the argument `--destination-connection-profile` on the command line.
        no-async: Waits for the operation in progress to complete before returning.
        no-auto-commit: Auto commits the conversion workspace.
        region: |-
            The Cloud region for the conversion_workspace.
            +
            To set the `region` attribute:
            * provide the argument `conversion_workspace` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        source-connection-profile: |-
            ID of the connection_profile or fully qualified identifier for the connection_profile.
            +
            To set the `connection_profile` attribute:
            * provide the argument `--source-connection-profile` on the command line.
