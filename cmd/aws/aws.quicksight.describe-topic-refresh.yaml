name: describe-topic-refresh
description: Describes the status of a topic refresh.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the topic whose refresh you want to describe.
    --refresh-id=!: The ID of the refresh, which is performed when the topic is created or updated.
    --topic-id=!: The ID of the topic that you want to describe.
documentation:
    command: Describes the status of a topic refresh.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the topic whose refresh you want to describe.
        refresh-id: The ID of the refresh, which is performed when the topic is created or updated.
        topic-id: The ID of the topic that you want to describe. This ID is unique per Amazon Web Services Region for each Amazon Web Services account.
