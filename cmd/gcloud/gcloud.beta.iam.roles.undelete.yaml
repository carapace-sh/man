name: undelete
description: '*(BETA)*  Undelete a custom role from an organization or a project.'
flags:
    --organization=: Organization of the role you want to undelete.
documentation:
    command: |-
        *(BETA)*  This command undeletes a role. Roles that have been deleted for certain long
        time can't be undeleted.

        This command can fail for the following reasons:
        * The role specified does not exist.
        * The active user does not have permission to access the given role.

        ## EXAMPLES

        To undelete the role ``ProjectUpdater'' of the organization ``1234567'', run:

          $ gcloud beta iam roles undelete ProjectUpdater --organization=1234567

        To undelete the role ``ProjectUpdater'' of the project ``myproject'',
        run:

          $ gcloud beta iam roles undelete ProjectUpdater --project=myproject
    flag:
        organization: Organization of the role you want to undelete.
