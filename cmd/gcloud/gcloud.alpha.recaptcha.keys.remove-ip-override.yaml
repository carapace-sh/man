name: remove-ip-override
description: '*(ALPHA)*  Remove an IP override from a key.'
flags:
    --ip=!: IP address to override for the key.
    --override=!: If set to allow, the IP address/CIDR range will be removed from the allowlisted IPs.
completion:
    flag:
        override:
            - allow
            - override-type-unspecified
documentation:
    command: '*(ALPHA)*  Remove an IP override from a key.'
    flag:
        ip: IP address to override for the key.
        override: 'If set to allow, the IP address/CIDR range will be removed from the allowlisted IPs. _OVERRIDE_ must be one of: *allow*, *override-type-unspecified*.'
