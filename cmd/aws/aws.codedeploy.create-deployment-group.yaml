name: create-deployment-group
description: Creates a deployment group to which application revisions are deployed.
flags:
    --alarm-configuration=: Information to add about Amazon CloudWatch alarms when the deployment group is created.
    --application-name=!: The name of an CodeDeploy application associated with the user or Amazon Web Services account.
    --auto-rollback-configuration=: Configuration information for an automatic rollback that is added when a deployment group is created.
    --auto-scaling-groups=: A list of associated Amazon EC2 Auto Scaling groups.
    --blue-green-deployment-configuration=: Information about blue/green deployment options for a deployment group.
    --deployment-config-name=: If specified, the deployment configuration name can be either one of the predefined configurations provided with CodeDeploy or a custom deployment configuration that you create by calling the create deployment configuration operation.
    --deployment-group-name=!: The name of a new deployment group for the specified application.
    --deployment-style=: Information about the type of deployment, in-place or blue/green, that you want to run and whether to route deployment traffic behind a load balancer.
    --ec2-tag-filters=: The Amazon EC2 tags on which to filter.
    --ec2-tag-set=: Information about groups of tags applied to Amazon EC2 instances.
    --ecs-services=: The target Amazon ECS services in the deployment group.
    --load-balancer-info=: Information about the load balancer used in a deployment.
    --on-premises-instance-tag-filters=: The on-premises instance tags on which to filter.
    --on-premises-tag-set=: Information about groups of tags applied to on-premises instances.
    --outdated-instances-strategy=: Indicates what happens when new Amazon EC2 instances are launched mid-deployment and do not receive the deployed application revision.
    --service-role-arn=!: A service role Amazon Resource Name (ARN) that allows CodeDeploy to act on the user's behalf when interacting with Amazon Web Services services.
    --tags=: The metadata that you apply to CodeDeploy deployment groups to help you organize and categorize them.
    --termination-hook-enabled=: This parameter only applies if you are using CodeDeploy with Amazon EC2 Auto Scaling.
    --trigger-configurations=: Information about triggers to create when the deployment group is created.
completion:
    flag:
        outdated-instances-strategy:
            - UPDATE
            - IGNORE
documentation:
    command: Creates a deployment group to which application revisions are deployed.
    flag:
        alarm-configuration: Information to add about Amazon CloudWatch alarms when the deployment group is created.
        application-name: The name of an CodeDeploy application associated with the user or Amazon Web Services account.
        auto-rollback-configuration: Configuration information for an automatic rollback that is added when a deployment group is created.
        auto-scaling-groups: A list of associated Amazon EC2 Auto Scaling groups.
        blue-green-deployment-configuration: Information about blue/green deployment options for a deployment group.
        deployment-config-name: |-
            If specified, the deployment configuration name can be either one of the predefined configurations provided with CodeDeploy or a custom deployment configuration that you create by calling the create deployment configuration operation.

            `CodeDeployDefault.OneAtATime` is the default deployment configuration. It is used if a configuration isn't specified for the deployment or deployment group.

            For more information about the predefined deployment configurations in CodeDeploy, see [Working with Deployment Configurations in CodeDeploy](https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html) in the *CodeDeploy User Guide*.
        deployment-group-name: The name of a new deployment group for the specified application.
        deployment-style: Information about the type of deployment, in-place or blue/green, that you want to run and whether to route deployment traffic behind a load balancer.
        ec2-tag-filters: The Amazon EC2 tags on which to filter. The deployment group includes Amazon EC2 instances with any of the specified tags. Cannot be used in the same call as ec2TagSet.
        ec2-tag-set: Information about groups of tags applied to Amazon EC2 instances. The deployment group includes only Amazon EC2 instances identified by all the tag groups. Cannot be used in the same call as `ec2TagFilters`.
        ecs-services: The target Amazon ECS services in the deployment group. This applies only to deployment groups that use the Amazon ECS compute platform. A target Amazon ECS service is specified as an Amazon ECS cluster and service name pair using the format `<clustername>:<servicename>`.
        load-balancer-info: Information about the load balancer used in a deployment.
        on-premises-instance-tag-filters: The on-premises instance tags on which to filter. The deployment group includes on-premises instances with any of the specified tags. Cannot be used in the same call as `OnPremisesTagSet`.
        on-premises-tag-set: Information about groups of tags applied to on-premises instances. The deployment group includes only on-premises instances identified by all of the tag groups. Cannot be used in the same call as `onPremisesInstanceTagFilters`.
        outdated-instances-strategy: |-
            Indicates what happens when new Amazon EC2 instances are launched mid-deployment and do not receive the deployed application revision.

            If this option is set to `UPDATE` or is unspecified, CodeDeploy initiates one or more 'auto-update outdated instances' deployments to apply the deployed application revision to the new Amazon EC2 instances.

            If this option is set to `IGNORE`, CodeDeploy does not initiate a deployment to update the new Amazon EC2 instances. This may result in instances having different revisions.
        service-role-arn: A service role Amazon Resource Name (ARN) that allows CodeDeploy to act on the user's behalf when interacting with Amazon Web Services services.
        tags: The metadata that you apply to CodeDeploy deployment groups to help you organize and categorize them. Each tag consists of a key and an optional value, both of which you define.
        termination-hook-enabled: |-
            This parameter only applies if you are using CodeDeploy with Amazon EC2 Auto Scaling. For more information, see [Integrating CodeDeploy with Amazon EC2 Auto Scaling](https://docs.aws.amazon.com/codedeploy/latest/userguide/integrations-aws-auto-scaling.html) in the *CodeDeploy User Guide*.

            Set `terminationHookEnabled` to `true` to have CodeDeploy install a termination hook into your Auto Scaling group when you create a deployment group. When this hook is installed, CodeDeploy will perform termination deployments.

            For information about termination deployments, see [Enabling termination deployments during Auto Scaling scale-in events](https://docs.aws.amazon.com/codedeploy/latest/userguide/integrations-aws-auto-scaling.html#integrations-aws-auto-scaling-behaviors-hook-enable) in the *CodeDeploy User Guide*.

            For more information about Auto Scaling scale-in events, see the [Scale in](https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-lifecycle.html#as-lifecycle-scale-in) topic in the *Amazon EC2 Auto Scaling User Guide*.
        trigger-configurations: Information about triggers to create when the deployment group is created. For examples, see [Create a Trigger for an CodeDeploy Event](https://docs.aws.amazon.com/codedeploy/latest/userguide/how-to-notify-sns.html) in the *CodeDeploy User Guide*.
