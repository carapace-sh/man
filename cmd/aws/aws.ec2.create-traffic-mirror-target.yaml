name: create-traffic-mirror-target
description: Creates a target for your Traffic Mirror session.
flags:
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=: The description of the Traffic Mirror target.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --gateway-load-balancer-endpoint-id=: The ID of the Gateway Load Balancer endpoint.
    --network-interface-id=: The network interface ID that is associated with the target.
    --network-load-balancer-arn=: The Amazon Resource Name (ARN) of the Network Load Balancer that is associated with the target.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --tag-specifications=: The tags to assign to the Traffic Mirror target.
documentation:
    command: |-
        Creates a target for your Traffic Mirror session.

        A Traffic Mirror target is the destination for mirrored traffic. The Traffic Mirror source and the Traffic Mirror target (monitoring appliances) can be in the same VPC, or in different VPCs connected via VPC peering or a transit gateway.

        A Traffic Mirror target can be a network interface, a Network Load Balancer, or a Gateway Load Balancer endpoint.

        To use the target in a Traffic Mirror session, use [CreateTrafficMirrorSession](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_CreateTrafficMirrorSession.htm).
    flag:
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [How to ensure idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        description: The description of the Traffic Mirror target.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        gateway-load-balancer-endpoint-id: The ID of the Gateway Load Balancer endpoint.
        network-interface-id: The network interface ID that is associated with the target.
        network-load-balancer-arn: The Amazon Resource Name (ARN) of the Network Load Balancer that is associated with the target.
        tag-specifications: The tags to assign to the Traffic Mirror target.
