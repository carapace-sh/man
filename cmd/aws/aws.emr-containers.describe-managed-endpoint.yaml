name: describe-managed-endpoint
description: Displays detailed information about a managed endpoint.
flags:
    --id=!: This output displays ID of the managed endpoint.
    --virtual-cluster-id=!: The ID of the endpoint's virtual cluster.
documentation:
    command: Displays detailed information about a managed endpoint. A managed endpoint is a gateway that connects Amazon EMR Studio to Amazon EMR on EKS so that Amazon EMR Studio can communicate with your virtual cluster.
    flag:
        id: This output displays ID of the managed endpoint.
        virtual-cluster-id: The ID of the endpoint's virtual cluster.
