name: delete-collection
description: Deletes an OpenSearch Serverless collection.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure idempotency of the request.
    --id=!: The unique identifier of the collection.
documentation:
    command: Deletes an OpenSearch Serverless collection. For more information, see [Creating and managing Amazon OpenSearch Serverless collections](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-manage.html).
    flag:
        client-token: A unique, case-sensitive identifier to ensure idempotency of the request.
        id: The unique identifier of the collection. For example, `1iu5usc406kd`. The ID is part of the collection endpoint. You can also retrieve it using the [ListCollections](https://docs.aws.amazon.com/opensearch-service/latest/ServerlessAPIReference/API_ListCollections.html) API.
