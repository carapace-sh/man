name: create
description: Create a VMware Engine private cloud.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --autoscaling-cool-down-period=&: Cool down period (in minutes) between consecutive cluster expansions/contractions
    --autoscaling-max-cluster-node-count=&: Maximum number of nodes in the cluster
    --autoscaling-min-cluster-node-count=&: Minimum number of nodes in the cluster
    --autoscaling-policy=&: Autoscaling policy to be applied to the cluster
    --autoscaling-settings-from-file=&: A YAML file containing the autoscaling settings to be applied to the cluster
    --cluster=!: ID of the cluster or fully qualified identifier for the cluster.
    --description=: Text describing the private cloud.
    --location=: Location of the private cloud or cluster.
    --management-range=!: IP address range in the private cloud to use for management appliances, in CIDR format.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --node-type-config=!: Information about the type and number of nodes associated with the cluster.
    --preferred-zone=: Zone that will remain operational when connection between the two zones is
    --secondary-zone=: Additional zone for a higher level of availability and load balancing.
    --service-subnet=&: A non-overlapping CIDR range and prefix length for the service subnets.
    --type=: Type of the private cloud.
    --vmware-engine-network=!: Resource ID of the VMware Engine network attached to the private cloud.
completion:
    flag:
        type:
            - STANDARD
            - STRETCHED
            - TIME_LIMITED
documentation:
    command: |
        Create a VMware Engine private cloud. Private cloud creation is considered finished when the private cloud is in READY state. Check the progress of a private cloud using `gcloud vmware private-clouds list`.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        autoscaling-cool-down-period: Cool down period (in minutes) between consecutive cluster expansions/contractions
        autoscaling-max-cluster-node-count: Maximum number of nodes in the cluster
        autoscaling-min-cluster-node-count: Minimum number of nodes in the cluster
        autoscaling-policy: Autoscaling policy to be applied to the cluster
        autoscaling-settings-from-file: A YAML file containing the autoscaling settings to be applied to the cluster
        cluster: |-
            ID of the cluster or fully qualified identifier for the cluster.
            +
            To set the `cluster` attribute:
            * provide the argument `--cluster` on the command line.
        description: Text describing the private cloud.
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `private_cloud` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        management-range: IP address range in the private cloud to use for management appliances, in CIDR format. Use an IP address range that meets the [VMware Engine networking requirements](https://cloud.google.com/vmware-engine/docs/quickstart-networking-requirements).
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        node-type-config: |-
            Information about the type and number of nodes associated with the cluster.
            +
            type (required): canonical identifier of the node type.
            +
            count (required): number of nodes of this type in the cluster.
            +
            custom-core-count (optional): customized number of cores available to each node of the type.
            To get a list of valid values for your node type,
            run the gcloud vmware node-types describe command and reference the
            availableCustomCoreCounts field in the output.
        preferred-zone: |-
            Zone that will remain operational when connection between the two zones is
            lost. Specify the resource name of a zone that belongs to the region of the
            private cloud.
        secondary-zone: |-
            Additional zone for a higher level of availability and load balancing.
            Specify the resource name of a zone that belongs to the region of the
            private cloud.
        service-subnet: |
            A non-overlapping CIDR range and prefix length for the service subnets.
            The service subnets are used for appliance or service deployment, such as storage,
            backup, disaster recovery, and media streaming.
        type: |-
            Type of the private cloud. _TYPE_ must be one of:
            +
            *STANDARD*::: Standard private is a zonal resource, with 3 or more nodes nodes. Default type.
            *STRETCHED*::: Stretched private cloud is a regional resource with redundancy,
                        with a minimum of 6 nodes, nodes count has to be even.
            *TIME_LIMITED*::: Time limited private cloud is a zonal resource, can have only 1 node and
                        has limited life span. Will be deleted after defined period of time,
                        can be converted into standard private cloud by expanding it up to 3
                        or more nodes.
            :::
            +
        vmware-engine-network: Resource ID of the VMware Engine network attached to the private cloud.
