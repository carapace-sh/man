name: delete-access-log-settings
description: Deletes the AccessLogSettings for a Stage.
flags:
    --api-id=!: The API identifier.
    --stage-name=!: The stage name.
documentation:
    command: Deletes the AccessLogSettings for a Stage. To disable access logging for a Stage, delete its AccessLogSettings.
    flag:
        api-id: The API identifier.
        stage-name: The stage name. Stage names can only contain alphanumeric characters, hyphens, and underscores. Maximum length is 128 characters.
