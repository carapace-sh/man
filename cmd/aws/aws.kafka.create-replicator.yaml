name: create-replicator
description: Creates the replicator.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A summary description of the replicator.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kafka-clusters=!:
        description: Kafka Clusters to use in setting up sources / targets for replication.
        nargs: -1
    --replication-info-list=!:
        description: A list of replication configurations, where each configuration targets a given source cluster to target cluster replication flow.
        nargs: -1
    --replicator-name=!: The name of the replicator.
    --service-execution-role-arn=!: The ARN of the IAM role used by the replicator to access resources in the customer's account (e.g source and target clusters)
    --tags=: List of tags to attach to created Replicator.
documentation:
    command: Creates the replicator.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A summary description of the replicator.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kafka-clusters: Kafka Clusters to use in setting up sources / targets for replication.
        replication-info-list: A list of replication configurations, where each configuration targets a given source cluster to target cluster replication flow.
        replicator-name: The name of the replicator. Alpha-numeric characters with '-' are allowed.
        service-execution-role-arn: The ARN of the IAM role used by the replicator to access resources in the customer's account (e.g source and target clusters)
        tags: List of tags to attach to created Replicator.
