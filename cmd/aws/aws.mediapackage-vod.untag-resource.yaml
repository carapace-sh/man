name: untag-resource
description: Removes tags from the specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) for the resource.
    --tag-keys=!: A comma-separated list of the tag keys to remove from the resource.
documentation:
    command: Removes tags from the specified resource. You can specify one or more tags to remove.
    flag:
        resource-arn: The Amazon Resource Name (ARN) for the resource. You can get this from the response to any request to the resource.
        tag-keys: A comma-separated list of the tag keys to remove from the resource.
