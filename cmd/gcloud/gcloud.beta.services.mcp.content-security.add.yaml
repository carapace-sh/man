name: add
description: '*(BETA)*  Add MCP content security provider of a project.'
hidden: true
documentation:
    command: |-
        *(BETA)*  Add MCP content security provider of a project.

        ## EXAMPLES

        Add MCP content security provider  of a project:

          $ gcloud beta services mcp content-security add my-mcp-content-security-provider

        Add MCP content security provider of a project `my-project`:

          $ gcloud beta services mcp content-security add my-mcp-content-security-provider --project=my-project
