name: update-snapshot-schedule
description: Updates a snapshot schedule configured for a gateway volume.
flags:
    --description=: Optional description of the snapshot that overwrites the existing description.
    --recurrence-in-hours=!: Frequency of snapshots.
    --start-at=!: The hour of the day at which the snapshot schedule begins represented as *hh*, where *hh* is the hour (0 to 23).
    --tags=: A list of up to 50 tags that can be assigned to a snapshot.
    --volume-arn=!: The Amazon Resource Name (ARN) of the volume.
documentation:
    command: |-
        Updates a snapshot schedule configured for a gateway volume. This operation is only supported in the cached volume and stored volume gateway types.

        The default snapshot schedule for volume is once every 24 hours, starting at the creation time of the volume. You can use this API to change the snapshot schedule configured for the volume.

        In the request you must identify the gateway volume whose snapshot schedule you want to update, and the schedule information, including when you want the snapshot to begin on a day and the frequency (in hours) of snapshots.
    flag:
        description: Optional description of the snapshot that overwrites the existing description.
        recurrence-in-hours: Frequency of snapshots. Specify the number of hours between snapshots.
        start-at: The hour of the day at which the snapshot schedule begins represented as *hh*, where *hh* is the hour (0 to 23). The hour of the day is in the time zone of the gateway.
        tags: |-
            A list of up to 50 tags that can be assigned to a snapshot. Each tag is a key-value pair.

            Valid characters for key and value are letters, spaces, and numbers representable in UTF-8 format, and the following special characters: + - = . _ : / @. The maximum length of a tag's key is 128 characters, and the maximum length for a tag's value is 256.
        volume-arn: The Amazon Resource Name (ARN) of the volume. Use the [ListVolumes]() operation to return a list of gateway volumes.
