name: create-savings-plan
description: Creates a Savings Plan.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --commitment=!: The hourly commitment, in the same currency of the `savingsPlanOfferingId`.
    --purchase-time=: The purchase time of the Savings Plan in UTC format (YYYY-MM-DDTHH:MM:SSZ).
    --savings-plan-offering-id=!: The ID of the offering.
    --tags=: One or more tags.
    --upfront-payment-amount=: The up-front payment amount.
documentation:
    command: Creates a Savings Plan.
    flag:
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        commitment: The hourly commitment, in the same currency of the `savingsPlanOfferingId`. This is a value between 0.001 and 1 million. You cannot specify more than five digits after the decimal point.
        purchase-time: The purchase time of the Savings Plan in UTC format (YYYY-MM-DDTHH:MM:SSZ).
        savings-plan-offering-id: The ID of the offering.
        tags: One or more tags.
        upfront-payment-amount: The up-front payment amount. This is a whole number between 50 and 99 percent of the total value of the Savings Plan. This parameter is only supported if the payment option is `Partial Upfront`.
