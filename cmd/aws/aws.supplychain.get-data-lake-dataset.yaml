name: get-data-lake-dataset
description: Enables you to programmatically view an Amazon Web Services Supply Chain data lake dataset.
flags:
    --instance-id=!: The Amazon Web Services Supply Chain instance identifier.
    --name=!: The name of the dataset.
    --namespace=!: 'The namespace of the dataset, besides the custom defined namespace, every instance comes with below pre-defined namespaces:'
documentation:
    command: Enables you to programmatically view an Amazon Web Services Supply Chain data lake dataset. Developers can view the data lake dataset information such as namespace, schema, and so on for a given instance ID, namespace, and dataset name.
    flag:
        instance-id: The Amazon Web Services Supply Chain instance identifier.
        name: The name of the dataset. For **asc** namespace, the name must be one of the supported data entities under [https://docs.aws.amazon.com/aws-supply-chain/latest/userguide/data-model-asc.html](https://docs.aws.amazon.com/aws-supply-chain/latest/userguide/data-model-asc.html).
        namespace: |-
            The namespace of the dataset, besides the custom defined namespace, every instance comes with below pre-defined namespaces:

            - **asc** - For information on the Amazon Web Services Supply Chain supported datasets see [https://docs.aws.amazon.com/aws-supply-chain/latest/userguide/data-model-asc.html](https://docs.aws.amazon.com/aws-supply-chain/latest/userguide/data-model-asc.html).
            - **default** - For datasets with custom user-defined schemas.
