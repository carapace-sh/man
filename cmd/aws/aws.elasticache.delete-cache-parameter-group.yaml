name: delete-cache-parameter-group
description: Deletes the specified cache parameter group.
flags:
    --cache-parameter-group-name=!: The name of the cache parameter group to delete.
documentation:
    command: Deletes the specified cache parameter group. You cannot delete a cache parameter group if it is associated with any cache clusters. You cannot delete the default cache parameter groups in your account.
    flag:
        cache-parameter-group-name: |-
            The name of the cache parameter group to delete.

            The specified cache security group must not be associated with any clusters.
