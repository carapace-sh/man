name: get-status
description: Get the status of a specified Distributed Cloud Edge Network network.
flags:
    --location=: The Cloud location for the network.
    --zone=: The zone of the network.
documentation:
    command: Get the status of a specified Distributed Cloud Edge Network network.
    flag:
        location: |-
            The Cloud location for the network.
            +
            To set the `location` attribute:
            * provide the argument `network` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        zone: |-
            The zone of the network.
            +
            To set the `zone` attribute:
            * provide the argument `network` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
