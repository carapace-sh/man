name: list-lftag-expressions
description: Returns the LF-Tag expressions in caller’s account filtered based on caller's permissions.
flags:
    --catalog-id=: The identifier for the Data Catalog.
    --max-results=: The maximum number of results to return.
    --next-token=: A continuation token, if this is not the first call to retrieve this list.
documentation:
    command: Returns the LF-Tag expressions in caller’s account filtered based on caller's permissions. Data Lake and read only admins implicitly can see all tag expressions in their account, else caller needs DESCRIBE permissions on tag expression.
    flag:
        catalog-id: The identifier for the Data Catalog. By default, the account ID.
        max-results: The maximum number of results to return.
        next-token: A continuation token, if this is not the first call to retrieve this list.
