name: update-notification-rule
description: Updates a notification rule for a resource.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the notification rule.
    --detail-type=: The level of detail to include in the notifications for this resource.
    --event-type-ids=: A list of event types associated with this notification rule.
    --name=: The name of the notification rule.
    --status=: The status of the notification rule.
    --targets=: The address and type of the targets to receive notifications from this notification rule.
completion:
    flag:
        detail-type:
            - BASIC
            - FULL
        status:
            - ENABLED
            - DISABLED
documentation:
    command: |-
        Updates a notification rule for a resource. You can change the events that trigger the notification rule, the status of the rule, and the targets that receive the notifications.

        To add or remove tags for a notification rule, you must use [TagResource]() and [UntagResource]().
    flag:
        arn: The Amazon Resource Name (ARN) of the notification rule.
        detail-type: The level of detail to include in the notifications for this resource. BASIC will include only the contents of the event as it would appear in Amazon CloudWatch. FULL will include any supplemental information provided by CodeStar Notifications and/or the service for the resource for which the notification is created.
        event-type-ids: A list of event types associated with this notification rule. For a complete list of event types and IDs, see [Notification concepts](https://docs.aws.amazon.com/codestar-notifications/latest/userguide/concepts.html#concepts-api) in the *Developer Tools Console User Guide*.
        name: The name of the notification rule.
        status: The status of the notification rule. Valid statuses include enabled (sending notifications) or disabled (not sending notifications).
        targets: The address and type of the targets to receive notifications from this notification rule.
