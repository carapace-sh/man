name: create-security-policy
description: Creates a security policy to be used by one or more OpenSearch Serverless collections.
flags:
    --client-token=: Unique, case-sensitive identifier to ensure idempotency of the request.
    --description=: A description of the policy.
    --name=!: The name of the policy.
    --policy=!: The JSON policy document to use as the content for the new policy.
    --type=!: The type of security policy.
completion:
    flag:
        type:
            - encryption
            - network
documentation:
    command: Creates a security policy to be used by one or more OpenSearch Serverless collections. Security policies provide access to a collection and its OpenSearch Dashboards endpoint from public networks or specific VPC endpoints. They also allow you to secure a collection with a KMS encryption key. For more information, see [Network access for Amazon OpenSearch Serverless](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-network.html) and [Encryption at rest for Amazon OpenSearch Serverless](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-encryption.html).
    flag:
        client-token: Unique, case-sensitive identifier to ensure idempotency of the request.
        description: A description of the policy. Typically used to store information about the permissions defined in the policy.
        name: The name of the policy.
        policy: The JSON policy document to use as the content for the new policy.
        type: The type of security policy.
