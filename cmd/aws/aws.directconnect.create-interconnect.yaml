name: create-interconnect
description: Creates an interconnect between an Direct Connect Partner's network and a specific Direct Connect location.
flags:
    --bandwidth=!: The port bandwidth, in Gbps.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --interconnect-name=!: The name of the interconnect.
    --lag-id=: The ID of the LAG.
    --location=!: The location of the interconnect.
    --no-request-mac-sec: Indicates whether you want the interconnect to support MAC Security (MACsec).
    --provider-name=: The name of the service provider associated with the interconnect.
    --request-mac-sec: Indicates whether you want the interconnect to support MAC Security (MACsec).
    --tags=:
        description: The tags to associate with the interconnect.
        nargs: -1
documentation:
    command: |-
        Creates an interconnect between an Direct Connect Partner's network and a specific Direct Connect location.

        An interconnect is a connection that is capable of hosting other connections. The Direct Connect Partner can use an interconnect to provide Direct Connect hosted connections to customers through their own network services. Like a standard connection, an interconnect links the partner's network to an Direct Connect location over a standard Ethernet fiber-optic cable. One end is connected to the partner's router, the other to an Direct Connect router.

        You can automatically add the new interconnect to a link aggregation group (LAG) by specifying a LAG ID in the request. This ensures that the new interconnect is allocated on the same Direct Connect endpoint that hosts the specified LAG. If there are no available ports on the endpoint, the request fails and no interconnect is created.

        For each end customer, the Direct Connect Partner provisions a connection on their interconnect by calling [AllocateHostedConnection](). The end customer can then connect to Amazon Web Services resources by creating a virtual interface on their connection, using the VLAN assigned to them by the Direct Connect Partner.

        Intended for use by Direct Connect Partners only.
    flag:
        bandwidth: The port bandwidth, in Gbps. The possible values are 1, 10, and 100.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        interconnect-name: The name of the interconnect.
        lag-id: The ID of the LAG.
        location: The location of the interconnect.
        provider-name: The name of the service provider associated with the interconnect.
        request-mac-sec: Indicates whether you want the interconnect to support MAC Security (MACsec).
        tags: The tags to associate with the interconnect.
