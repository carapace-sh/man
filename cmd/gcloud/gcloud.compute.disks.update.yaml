name: update
description: Update a Compute Engine persistent disk.
flags:
    --access-mode=: Specifies how VMs attached to the disk can access the data on the disk.
    --append-licenses=: '"A list of license URIs or license codes.'
    --clear-architecture: Removes the architecture or processor type annotation from the disk.
    --clear-labels: Remove all labels.
    --no-clear-architecture&: Removes the architecture or processor type annotation from the disk.
    --no-clear-labels&: Remove all labels.
    --provisioned-iops=: Provisioned IOPS of disk to update.
    --provisioned-throughput=: Provisioned throughput of disk to update.
    --region=: Region of the disk to update.
    --remove-labels=: List of label keys to remove.
    --remove-licenses=: A list of license URIs or license codes.
    --replace-license=: A list of license URIs or license codes.
    --size=: Size of the disks.
    --update-architecture=: Updates the architecture or processor type that this disk can support.
    --update-labels=: List of label KEY=VALUE pairs to update.
    --zone=: Zone of the disk to update.
completion:
    flag:
        access-mode:
            - READ_ONLY_MANY
            - READ_WRITE_MANY
            - READ_WRITE_SINGLE
        update-architecture:
            - ARM64
            - X86_64
documentation:
    command: '*gcloud compute disks update* updates a Compute Engine persistent disk.'
    flag:
        access-mode: 'Specifies how VMs attached to the disk can access the data on the disk. To grant read-only access to multiple VMs attached to the disk, set access-mode to READ_ONLY_MANY. To grant read-write access to only one VM attached to the disk, use READ_WRITE_SINGLE. READ_WRITE_SINGLE is used if omitted. _ACCESS_MODE_ must be one of: *READ_ONLY_MANY*, *READ_WRITE_MANY*, *READ_WRITE_SINGLE*.'
        append-licenses: '"A list of license URIs or license codes. These licenses will be appended to the existing licenses on the disk. Provided licenses can be either license URIs or license codes but not a mix of both.'
        clear-architecture: Removes the architecture or processor type annotation from the disk.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-clear-architecture: Removes the architecture or processor type annotation from the disk.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        provisioned-iops: Provisioned IOPS of disk to update. Only for use with disks of type hyperdisk-extreme.
        provisioned-throughput: Provisioned throughput of disk to update. The throughput unit is  MB per sec.
        region: |-
            Region of the disk to update. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        remove-licenses: A list of license URIs or license codes. If present in the set of existing licenses, these licenses will be removed. If not present, this is a no-op. Provided licenses can be either license URIs or license codes but not a mix of both.
        replace-license: A list of license URIs or license codes. The first license is the license to be replaced and the second license is the replacement license. Provided licenses can be either license URIs or license codes but not a mix of both.
        size: |-
            Size of the disks. The value must be a whole
            number followed by a size unit of ``GB'' for gigabyte, or ``TB''
            for terabyte. If no size unit is specified, GB is
            assumed. For details about disk size limits, refer to:
            https://cloud.google.com/compute/docs/disks
        update-architecture: 'Updates the architecture or processor type that this disk can support. For available processor types on Compute Engine, see https://cloud.google.com/compute/docs/cpu-platforms. _UPDATE_ARCHITECTURE_ must be one of: *ARM64*, *X86_64*.'
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        zone: |-
            Zone of the disk to update. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
