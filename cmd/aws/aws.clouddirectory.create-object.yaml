name: create-object
description: Creates an object in a [Directory]().
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --directory-arn=!: The Amazon Resource Name (ARN) that is associated with the [Directory]() in which the object will be created.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --link-name=: The name of link that is used to attach this object to a parent.
    --object-attribute-list=:
        description: The attribute map whose attribute ARN contains the key and attribute value as the map value.
        nargs: -1
    --parent-reference=: If specified, the parent reference to which this object will be attached.
    --schema-facets=!:
        description: A list of schema facets to be associated with the object.
        nargs: -1
documentation:
    command: Creates an object in a [Directory](). Additionally attaches the object to a parent, if a parent reference and `LinkName` is specified. An object is simply a collection of [Facet]() attributes. You can also use this API call to create a policy object, if the facet from which you create the object is a policy facet.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        directory-arn: The Amazon Resource Name (ARN) that is associated with the [Directory]() in which the object will be created. For more information, see [arns]().
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        link-name: The name of link that is used to attach this object to a parent.
        object-attribute-list: The attribute map whose attribute ARN contains the key and attribute value as the map value.
        parent-reference: If specified, the parent reference to which this object will be attached.
        schema-facets: A list of schema facets to be associated with the object. Do not provide minor version components. See [SchemaFacet]() for details.
