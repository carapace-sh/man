name: get-partitions
description: Retrieves information about the partitions in a table.
flags:
    --catalog-id=: The ID of the Data Catalog where the partitions in question reside.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --database-name=!: The name of the catalog database where the partitions reside.
    --exclude-column-schema: When true, specifies not returning the partition column schema.
    --expression=: An expression that filters the partitions to be returned.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of partitions to return in a single response.
    --next-token=: A continuation token, if this is not the first call to retrieve these partitions.
    --no-exclude-column-schema: When true, specifies not returning the partition column schema.
    --page-size=: The size of each page to get in the AWS service call.
    --query-as-of-time=: The time as of when to read the partition contents.
    --segment=: The segment of the table's partitions to scan in this request.
    --starting-token=: A token to specify where to start paginating.
    --table-name=!: The name of the partitions' table.
    --transaction-id=: The transaction ID at which to read the partition contents.
documentation:
    command: Retrieves information about the partitions in a table.
    flag:
        catalog-id: The ID of the Data Catalog where the partitions in question reside. If none is provided, the Amazon Web Services account ID is used by default.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        database-name: The name of the catalog database where the partitions reside.
        exclude-column-schema: When true, specifies not returning the partition column schema. Useful when you are interested only in other partition attributes such as partition values or location. This approach avoids the problem of a large response by not returning duplicate data.
        expression: |-
            An expression that filters the partitions to be returned.

            The expression uses SQL syntax similar to the SQL `WHERE` filter clause. The SQL statement parser [JSQLParser](http://jsqlparser.sourceforge.net/home.php) parses the expression.

            *Operators*: The following are the operators that you can use in the `Expression` API call:

            =

            Checks whether the values of the two operands are equal; if yes, then the condition becomes true.

            Example: Assume 'variable a' holds 10 and 'variable b' holds 20.

            (a = b) is not true.

            &lt; &gt;

            Checks whether the values of two operands are equal; if the values are not equal, then the condition becomes true.

            Example: (a &lt; &gt; b) is true.

            &gt;

            Checks whether the value of the left operand is greater than the value of the right operand; if yes, then the condition becomes true.

            Example: (a &gt; b) is not true.

            &lt;

            Checks whether the value of the left operand is less than the value of the right operand; if yes, then the condition becomes true.

            Example: (a &lt; b) is true.

            &gt;=

            Checks whether the value of the left operand is greater than or equal to the value of the right operand; if yes, then the condition becomes true.

            Example: (a &gt;= b) is not true.

            &lt;=

            Checks whether the value of the left operand is less than or equal to the value of the right operand; if yes, then the condition becomes true.

            Example: (a &lt;= b) is true.

            AND, OR, IN, BETWEEN, LIKE, NOT, IS NULL

            Logical operators.

            *Supported Partition Key Types*: The following are the supported partition keys.

            - `string`
            - `date`
            - `timestamp`
            - `int`
            - `bigint`
            - `long`
            - `tinyint`
            - `smallint`
            - `decimal`

            If an type is encountered that is not valid, an exception is thrown.

            The following list shows the valid operators on each type. When you define a crawler, the `partitionKey` type is created as a `STRING`, to be compatible with the catalog partitions.

            *Sample API Call*:
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of partitions to return in a single response.
        next-token: A continuation token, if this is not the first call to retrieve these partitions.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        query-as-of-time: The time as of when to read the partition contents. If not set, the most recent transaction commit time will be used. Cannot be specified along with `TransactionId`.
        segment: The segment of the table's partitions to scan in this request.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        table-name: The name of the partitions' table.
        transaction-id: The transaction ID at which to read the partition contents.
