name: get-unfiltered-partitions-metadata
description: Retrieves partition metadata from the Data Catalog that contains unfiltered metadata.
flags:
    --audit-context=: A structure containing Lake Formation audit context information.
    --catalog-id=!: The ID of the Data Catalog where the partitions in question reside.
    --database-name=!: The name of the catalog database where the partitions reside.
    --expression=: An expression that filters the partitions to be returned.
    --max-results=: The maximum number of partitions to return in a single response.
    --next-token=: A continuation token, if this is not the first call to retrieve these partitions.
    --query-session-context=: A structure used as a protocol between query engines and Lake Formation or Glue.
    --region=: Specified only if the base tables belong to a different Amazon Web Services Region.
    --segment=: The segment of the table's partitions to scan in this request.
    --supported-permission-types=!: A list of supported permission types.
    --table-name=!: The name of the table that contains the partition.
documentation:
    command: |-
        Retrieves partition metadata from the Data Catalog that contains unfiltered metadata.

        For IAM authorization, the public IAM action associated with this API is `glue:GetPartitions`.
    flag:
        audit-context: A structure containing Lake Formation audit context information.
        catalog-id: The ID of the Data Catalog where the partitions in question reside. If none is provided, the AWS account ID is used by default.
        database-name: The name of the catalog database where the partitions reside.
        expression: |-
            An expression that filters the partitions to be returned.

            The expression uses SQL syntax similar to the SQL `WHERE` filter clause. The SQL statement parser [JSQLParser](http://jsqlparser.sourceforge.net/home.php) parses the expression.

            *Operators*: The following are the operators that you can use in the `Expression` API call:

            =

            Checks whether the values of the two operands are equal; if yes, then the condition becomes true.

            Example: Assume 'variable a' holds 10 and 'variable b' holds 20.

            (a = b) is not true.

            &lt; &gt;

            Checks whether the values of two operands are equal; if the values are not equal, then the condition becomes true.

            Example: (a &lt; &gt; b) is true.

            &gt;

            Checks whether the value of the left operand is greater than the value of the right operand; if yes, then the condition becomes true.

            Example: (a &gt; b) is not true.

            &lt;

            Checks whether the value of the left operand is less than the value of the right operand; if yes, then the condition becomes true.

            Example: (a &lt; b) is true.

            &gt;=

            Checks whether the value of the left operand is greater than or equal to the value of the right operand; if yes, then the condition becomes true.

            Example: (a &gt;= b) is not true.

            &lt;=

            Checks whether the value of the left operand is less than or equal to the value of the right operand; if yes, then the condition becomes true.

            Example: (a &lt;= b) is true.

            AND, OR, IN, BETWEEN, LIKE, NOT, IS NULL

            Logical operators.

            *Supported Partition Key Types*: The following are the supported partition keys.

            - `string`
            - `date`
            - `timestamp`
            - `int`
            - `bigint`
            - `long`
            - `tinyint`
            - `smallint`
            - `decimal`

            If an type is encountered that is not valid, an exception is thrown.
        max-results: The maximum number of partitions to return in a single response.
        next-token: A continuation token, if this is not the first call to retrieve these partitions.
        query-session-context: A structure used as a protocol between query engines and Lake Formation or Glue. Contains both a Lake Formation generated authorization identifier and information from the request's authorization context.
        region: Specified only if the base tables belong to a different Amazon Web Services Region.
        segment: The segment of the table's partitions to scan in this request.
        supported-permission-types: A list of supported permission types.
        table-name: The name of the table that contains the partition.
