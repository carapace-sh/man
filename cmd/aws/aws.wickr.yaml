                This may  not  be  specified  along with --cli-input-yaml.
            group-id: The ID of the security group to which the bot will be assigned.
            network-id: The ID of the Wickr network where the bot will be created.
            username: The username for the bot. This must be unique within the network and follow the network's naming conventions.
