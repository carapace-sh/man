name: list-usage-for-license-configuration
description: Lists all license usage records for a license configuration, displaying license consumption details by resource at a selected point in time.
flags:
    --filters=: Filters to scope the results.
    --license-configuration-arn=!: Amazon Resource Name (ARN) of the license configuration.
    --max-results=: Maximum number of results to return in a single call.
    --next-token=: Token for the next set of results.
documentation:
    command: Lists all license usage records for a license configuration, displaying license consumption details by resource at a selected point in time. Use this action to audit the current license consumption for any license inventory and configuration.
    flag:
        filters: |-
            Filters to scope the results. The following filters and logical operators are supported:

            - `resourceArn` - The ARN of the license configuration resource.
            - `resourceType` - The resource type (`EC2_INSTANCE` | `EC2_HOST` | `EC2_AMI` | `SYSTEMS_MANAGER_MANAGED_INSTANCE`).
            - `resourceAccount` - The ID of the account that owns the resource.
        license-configuration-arn: Amazon Resource Name (ARN) of the license configuration.
        max-results: Maximum number of results to return in a single call.
        next-token: Token for the next set of results.
