name: update
description: '*(BETA)*  Update Compute Engine commitments.'
flags:
    --auto-renew: Enable auto renewal for the commitment.
    --custom-end-time=: Specifies a custom future end date and extends the commitment's ongoing term.
    --no-auto-renew&: Enable auto renewal for the commitment.
    --plan=: Duration of the commitment.
    --region=: Region of the commitment to update.
completion:
    flag:
        plan:
            - 36-month
documentation:
    command: '*(BETA)*  Update Compute Engine commitments.'
    flag:
        auto-renew: Enable auto renewal for the commitment.
        custom-end-time: Specifies a custom future end date and extends the commitment's ongoing term.
        no-auto-renew: Enable auto renewal for the commitment.
        plan: 'Duration of the commitment. _PLAN_ must be (only one value is supported): *36-month*.'
        region: |-
            Region of the commitment to update. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
