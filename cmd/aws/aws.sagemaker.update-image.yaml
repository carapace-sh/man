name: update-image
description: Updates the properties of a SageMaker AI image.
flags:
    --delete-properties=: A list of properties to delete.
    --description=: The new description for the image.
    --display-name=: The new display name for the image.
    --image-name=!: The name of the image to update.
    --role-arn=: The new ARN for the IAM role that enables Amazon SageMaker AI to perform tasks on your behalf.
documentation:
    command: Updates the properties of a SageMaker AI image. To change the image's tags, use the [AddTags](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_AddTags.html) and [DeleteTags](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_DeleteTags.html) APIs.
    flag:
        delete-properties: A list of properties to delete. Only the `Description` and `DisplayName` properties can be deleted.
        description: The new description for the image.
        display-name: The new display name for the image.
        image-name: The name of the image to update.
        role-arn: The new ARN for the IAM role that enables Amazon SageMaker AI to perform tasks on your behalf.
