name: export-license-recommendations
description: Export optimization recommendations for your licenses.
flags:
    --account-ids=:
        description: The IDs of the Amazon Web Services accounts for which to export license recommendations.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --fields-to-export=:
        description: The recommendations data to include in the export file.
        nargs: -1
    --file-format=: The format of the export file.
    --filters=:
        description: An array of objects to specify a filter that exports a more specific set of license recommendations.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-member-accounts: Indicates whether to include recommendations for resources in all member accounts of the organization if your account is the management account of an organization.
    --no-include-member-accounts: Indicates whether to include recommendations for resources in all member accounts of the organization if your account is the management account of an organization.
    --s3-destination-config=!: ""
completion:
    flag:
        file-format:
            - Csv
documentation:
    command: |-
        Export optimization recommendations for your licenses.

        Recommendations are exported in a comma-separated values (CSV) file, and its metadata in a JavaScript Object Notation (JSON) file, to an existing Amazon Simple Storage Service (Amazon S3) bucket that you specify. For more information, see [Exporting Recommendations](https://docs.aws.amazon.com/compute-optimizer/latest/ug/exporting-recommendations.html) in the *Compute Optimizer User Guide*.

        You can have only one license export job in progress per Amazon Web Services Region.
    flag:
        account-ids: |-
            The IDs of the Amazon Web Services accounts for which to export license recommendations.

            If your account is the management account of an organization, use this parameter to specify the member account for which you want to export recommendations.

            This parameter can't be specified together with the include member accounts parameter. The parameters are mutually exclusive.

            If this parameter is omitted, recommendations for member accounts aren't included in the export.

            You can specify multiple account IDs per request.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        fields-to-export: The recommendations data to include in the export file. For more information about the fields that can be exported, see [Exported files](https://docs.aws.amazon.com/compute-optimizer/latest/ug/exporting-recommendations.html#exported-files) in the *Compute Optimizer User Guide*.
        file-format: |-
            The format of the export file.

            A CSV file is the only export format currently supported.
        filters: An array of objects to specify a filter that exports a more specific set of license recommendations.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-member-accounts: |-
            Indicates whether to include recommendations for resources in all member accounts of the organization if your account is the management account of an organization.

            The member accounts must also be opted in to Compute Optimizer, and trusted access for Compute Optimizer must be enabled in the organization account. For more information, see [Compute Optimizer and Amazon Web Services Organizations trusted access](https://docs.aws.amazon.com/compute-optimizer/latest/ug/security-iam.html#trusted-service-access) in the *Compute Optimizer User Guide*.

            If this parameter is omitted, recommendations for member accounts of the organization aren't included in the export file .

            This parameter cannot be specified together with the account IDs parameter. The parameters are mutually exclusive.
        s3-destination-config: ""
