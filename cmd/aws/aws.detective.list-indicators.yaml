name: list-indicators
description: Gets the indicators from an investigation.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --graph-arn=!: The Amazon Resource Name (ARN) of the behavior graph.
    --indicator-type=: For the list of indicators of compromise that are generated by Detective investigations, see [Detective investigations](https://docs.aws.amazon.com/detective/latest/userguide/detective-investigation-about.html).
    --investigation-id=!: The investigation ID of the investigation report.
    --max-results=: Lists the maximum number of indicators in a page.
    --next-token=: Lists if there are more results available.
completion:
    flag:
        indicator-type:
            - TTP_OBSERVED
            - IMPOSSIBLE_TRAVEL
            - FLAGGED_IP_ADDRESS
            - NEW_GEOLOCATION
            - NEW_ASO
            - NEW_USER_AGENT
            - RELATED_FINDING
            - RELATED_FINDING_GROUP
documentation:
    command: Gets the indicators from an investigation. You can use the information from the indicators to determine if an IAM user and/or IAM role is involved in an unusual activity that could indicate malicious behavior and its impact.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        graph-arn: The Amazon Resource Name (ARN) of the behavior graph.
        indicator-type: For the list of indicators of compromise that are generated by Detective investigations, see [Detective investigations](https://docs.aws.amazon.com/detective/latest/userguide/detective-investigation-about.html).
        investigation-id: The investigation ID of the investigation report.
        max-results: Lists the maximum number of indicators in a page.
        next-token: |-
            Lists if there are more results available. The value of nextToken is a unique pagination token for each page. Repeat the call using the returned token to retrieve the next page. Keep all other arguments unchanged.

            Each pagination token expires after 24 hours. Using an expired pagination token will return a Validation Exception error.
