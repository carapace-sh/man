name: create-customer-gateway
description: Provides information to Amazon Web Services about your customer gateway device.
flags:
    --bgp-asn-extended=: For customer gateway devices that support BGP, specify the device's ASN.
    --bgp-asn=: For customer gateway devices that support BGP, specify the device's ASN.
    --certificate-arn=: The Amazon Resource Name (ARN) for the customer gateway certificate.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --device-name=: A name for the customer gateway device.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip-address=: The IP address for the customer gateway device's outside interface.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --public-ip=: '*This member has been deprecated.* The Internet-routable IP address for the customer gateway''s outside interface.'
    --tag-specifications=: The tags to apply to the customer gateway.
    --type=!: The type of VPN connection that this customer gateway supports (`ipsec.1`).
completion:
    flag:
        type:
            - ipsec.1
documentation:
    command: |-
        Provides information to Amazon Web Services about your customer gateway device. The customer gateway device is the appliance at your end of the VPN connection. You must provide the IP address of the customer gateway device’s external interface. The IP address must be static and can be behind a device performing network address translation (NAT).

        For devices that use Border Gateway Protocol (BGP), you can also provide the device's BGP Autonomous System Number (ASN). You can use an existing ASN assigned to your network. If you don't have an ASN already, you can use a private ASN. For more information, see [Customer gateway options for your Site-to-Site VPN connection](https://docs.aws.amazon.com/vpn/latest/s2svpn/cgw-options.html) in the *Amazon Web Services Site-to-Site VPN User Guide*.

        To create more than one customer gateway with the same VPN type, IP address, and BGP ASN, specify a unique device name for each customer gateway. An identical request returns information about the existing customer gateway; it doesn't create a new customer gateway.
    flag:
        bgp-asn: |-
            For customer gateway devices that support BGP, specify the device's ASN. You must specify either `BgpAsn` or `BgpAsnExtended` when creating the customer gateway. If the ASN is larger than `2,147,483,647`, you must use `BgpAsnExtended`.

            Default: 65000

            Valid values: `1` to `2,147,483,647`
        bgp-asn-extended: |-
            For customer gateway devices that support BGP, specify the device's ASN. You must specify either `BgpAsn` or `BgpAsnExtended` when creating the customer gateway. If the ASN is larger than `2,147,483,647`, you must use `BgpAsnExtended`.

            Valid values: `2,147,483,648` to `4,294,967,295`
        certificate-arn: The Amazon Resource Name (ARN) for the customer gateway certificate.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        device-name: |-
            A name for the customer gateway device.

            Length Constraints: Up to 255 characters.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip-address: The IP address for the customer gateway device's outside interface. The address must be static. If `OutsideIpAddressType` in your VPN connection options is set to `PrivateIpv4`, you can use an RFC6598 or RFC1918 private IPv4 address. If `OutsideIpAddressType` is set to `Ipv6`, you can use an IPv6 address.
        public-ip: '*This member has been deprecated.* The Internet-routable IP address for the customer gateway''s outside interface. The address must be static.'
        tag-specifications: The tags to apply to the customer gateway.
        type: The type of VPN connection that this customer gateway supports (`ipsec.1`).
