name: start-product-subscription
description: Starts a product subscription for a user with the specified identity provider.
flags:
    --domain=: The domain name of the Active Directory that contains the user for whom to start the product subscription.
    --identity-provider=!: An object that specifies details for the identity provider.
    --product=!: The name of the user-based subscription product.
    --tags=: The tags that apply to the product subscription.
    --username=!: The user name from the identity provider of the user.
documentation:
    command: |-
        Starts a product subscription for a user with the specified identity provider.

        Your estimated bill for charges on the number of users and related costs will take 48 hours to appear for billing periods that haven't closed (marked as **Pending** billing status) in Amazon Web Services Billing. For more information, see [Viewing your monthly charges](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/invoice.html) in the *Amazon Web Services Billing User Guide*.
    flag:
        domain: The domain name of the Active Directory that contains the user for whom to start the product subscription.
        identity-provider: An object that specifies details for the identity provider.
        product: |-
            The name of the user-based subscription product.

            Valid values: `VISUAL_STUDIO_ENTERPRISE` | `VISUAL_STUDIO_PROFESSIONAL` | `OFFICE_PROFESSIONAL_PLUS` | `REMOTE_DESKTOP_SERVICES`
        tags: The tags that apply to the product subscription.
        username: The user name from the identity provider of the user.
