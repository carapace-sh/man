name: put-application-session-configuration
description: Updates the session configuration for an application in IAM Identity Center.
flags:
    --application-arn=!: The Amazon Resource Name (ARN) of the application for which to update the session configuration.
    --user-background-session-application-status=: The status of user background sessions for the application.
completion:
    flag:
        user-background-session-application-status:
            - ENABLED
            - DISABLED
documentation:
    command: |-
        Updates the session configuration for an application in IAM Identity Center.

        The session configuration determines how users can access an application. This includes whether user background sessions are enabled. User background sessions allow users to start a job on a supported Amazon Web Services managed application without having to remain signed in to an active session while the job runs.
    flag:
        application-arn: The Amazon Resource Name (ARN) of the application for which to update the session configuration.
        user-background-session-application-status: The status of user background sessions for the application.
