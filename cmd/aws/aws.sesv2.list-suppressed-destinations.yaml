name: list-suppressed-destinations
description: Retrieves a list of email addresses that are on the suppression list for your account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-date=: Used to filter the list of suppressed email destinations so that it only includes addresses that were added to the list before a specific date.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --next-token=: A token returned from a previous call to `ListSuppressedDestinations` to indicate the position in the list of suppressed email addresses.
    --page-size=: The number of results to show in a single call to `ListSuppressedDestinations`.
    --reasons=: The factors that caused the email address to be added to .
    --start-date=: Used to filter the list of suppressed email destinations so that it only includes addresses that were added to the list after a specific date.
documentation:
    command: Retrieves a list of email addresses that are on the suppression list for your account.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-date: Used to filter the list of suppressed email destinations so that it only includes addresses that were added to the list before a specific date.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
