name: update-mission-profile
description: Updates a mission profile.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --contact-post-pass-duration-seconds=: Amount of time after a contact ends that you’d like to receive a Ground Station Contact State Change event indicating the pass has finished.
    --contact-pre-pass-duration-seconds=: Amount of time after a contact ends that you’d like to receive a Ground Station Contact State Change event indicating the pass has finished.
    --dataflow-edges=:
        description: A list of lists of ARNs.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --minimum-viable-contact-duration-seconds=: Smallest amount of time in seconds that you’d like to see for an available contact.
    --mission-profile-id=!: UUID of a mission profile.
    --name=: Name of a mission profile.
    --streams-kms-key=: KMS key to use for encrypting streams.
    --streams-kms-role=: Role to use for encrypting streams with KMS key.
    --tracking-config-arn=: ARN of a tracking `Config`.
documentation:
    command: |-
        Updates a mission profile.

        Updating a mission profile will not update the execution parameters for existing future contacts.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        contact-post-pass-duration-seconds: Amount of time after a contact ends that you’d like to receive a Ground Station Contact State Change event indicating the pass has finished.
        contact-pre-pass-duration-seconds: Amount of time after a contact ends that you’d like to receive a Ground Station Contact State Change event indicating the pass has finished.
        dataflow-edges: A list of lists of ARNs. Each list of ARNs is an edge, with a *from* `Config` and a *to* `Config`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        minimum-viable-contact-duration-seconds: Smallest amount of time in seconds that you’d like to see for an available contact. AWS Ground Station will not present you with contacts shorter than this duration.
        mission-profile-id: UUID of a mission profile.
        name: Name of a mission profile.
        streams-kms-key: KMS key to use for encrypting streams.
        streams-kms-role: Role to use for encrypting streams with KMS key.
        tracking-config-arn: ARN of a tracking `Config`.
