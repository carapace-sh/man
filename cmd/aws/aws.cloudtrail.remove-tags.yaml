name: remove-tags
description: Removes the specified tags from a trail, event data store, dashboard, or channel.
flags:
    --resource-id=!: Specifies the ARN of the trail, event data store, dashboard, or channel from which tags should be removed.
    --tags-list=!: Specifies a list of tags to be removed.
documentation:
    command: Removes the specified tags from a trail, event data store, dashboard, or channel.
    flag:
        resource-id: |-
            Specifies the ARN of the trail, event data store, dashboard, or channel from which tags should be removed.

            Example trail ARN format: `arn:aws:cloudtrail:us-east-2:123456789012:trail/MyTrail`

            Example event data store ARN format: `arn:aws:cloudtrail:us-east-2:123456789012:eventdatastore/EXAMPLE-f852-4e8f-8bd1-bcf6cEXAMPLE`

            Example dashboard ARN format: `arn:aws:cloudtrail:us-east-1:123456789012:dashboard/exampleDash`

            Example channel ARN format: `arn:aws:cloudtrail:us-east-2:123456789012:channel/01234567890`
        tags-list: Specifies a list of tags to be removed.
