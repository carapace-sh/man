name: create-progress-update-stream
description: Creates a progress update stream which is an AWS resource used for access control as well as a namespace for migration task names that is implicitly linked to your AWS account.
flags:
    --dry-run=: Optional boolean flag to indicate whether any effect should take place.
    --progress-update-stream-name=!: The name of the ProgressUpdateStream.
documentation:
    command: Creates a progress update stream which is an AWS resource used for access control as well as a namespace for migration task names that is implicitly linked to your AWS account. It must uniquely identify the migration tool as it is used for all updates made by the tool; however, it does not need to be unique for each AWS account because it is scoped to the AWS account.
    flag:
        dry-run: Optional boolean flag to indicate whether any effect should take place. Used to test if the caller has permission to make the call.
        progress-update-stream-name: The name of the ProgressUpdateStream. *Do not store personal data in this field.*
