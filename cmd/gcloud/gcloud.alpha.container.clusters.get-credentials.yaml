name: get-credentials
description: '*(ALPHA)*  Fetch credentials for a running cluster.'
flags:
    --cross-connect-subnetwork=&: full path of cross connect subnet whose endpoint to persist
    --dns-endpoint: Whether to use the DNS-based endpoint for the cluster address.
    --internal-ip: Whether to use the internal IP address of the cluster endpoint.
    --kubecontext-override=&: Name of kubectl context to use.
    --location=: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster.
    --no-dns-endpoint&: Whether to use the DNS-based endpoint for the cluster address.
    --no-internal-ip&: Whether to use the internal IP address of the cluster endpoint.
    --no-private-endpoint-fqdn&: ""
    --no-use-iam-token&: Whether to generate and persist an IAM token in the kubeconfig file.
    --private-endpoint-fqdn&: ""
    --region=: Compute region (e.g. us-central1) for a regional cluster.
    --use-iam-token&: Whether to generate and persist an IAM token in the kubeconfig file.
    --zone=: Compute zone (e.g. us-central1-a) for a zonal cluster.
documentation:
    command: |-
        *(ALPHA)*  gcloud alpha container clusters get-credentials updates a `kubeconfig` file with appropriate credentials and
        endpoint information to point `kubectl` at a specific cluster in Google
        Kubernetes Engine.

        It takes a project and a zone as parameters, passed through by set
        defaults or flags. By default, credentials are written to `HOME/.kube/config`.
        You can provide an alternate path by setting the `KUBECONFIG` environment
        variable. If `KUBECONFIG` contains multiple paths, the first one is used.

        This command enables switching to a specific cluster, when working
        with multiple clusters. It can also be used to access a previously created
        cluster from a new workstation.

        By default, gcloud alpha container clusters get-credentials will configure kubectl to automatically refresh its
        credentials using the same identity as gcloud. If you are running kubectl as
        part of an application, it is recommended to use [application default
        credentials](https://cloud.google.com/docs/authentication/production).
        To configure a `kubeconfig` file to use application default credentials, set
        the container/use_application_default_credentials
        [Cloud SDK property](https://cloud.google.com/sdk/docs/properties) to true
        before running gcloud alpha container clusters get-credentials

        See [](https://cloud.google.com/kubernetes-engine/docs/kubectl) for
        kubectl documentation.
    flag:
        cross-connect-subnetwork: full path of cross connect subnet whose endpoint to persist
        dns-endpoint: Whether to use the DNS-based endpoint for the cluster address.
        internal-ip: Whether to use the internal IP address of the cluster endpoint.
        kubecontext-override: |
            Name of kubectl context to use.

            $ {command} cluster-1 --kubecontext-override=my-kubecontext
        location: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster. Overrides the default compute/region or compute/zone value for this command invocation. Prefer using this flag over the --region or --zone flags.
        no-dns-endpoint: |
            Whether to use the DNS-based endpoint for the cluster address.
        no-internal-ip: Whether to use the internal IP address of the cluster endpoint.
        no-private-endpoint-fqdn: ""
        no-use-iam-token: |
            Whether to generate and persist an IAM token in the kubeconfig file.
        private-endpoint-fqdn: ""
        region: Compute region (e.g. us-central1) for a regional cluster. Overrides the default compute/region property value for this command invocation.
        use-iam-token: |
            Whether to generate and persist an IAM token in the kubeconfig file.
        zone: Compute zone (e.g. us-central1-a) for a zonal cluster. Overrides the default compute/zone property value for this command invocation.
