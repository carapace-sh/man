name: update
description: '*(BETA)*  Update snapshot settings.'
flags:
    --access-location-policy=: The access location policy.
    --add-access-locations=: Access locations to add to snapshot settings
    --async: Return immediately, without waiting for the operation in progress to complete.
    --no-async&: Return immediately, without waiting for the operation in progress to complete.
    --region=: region for regional snapshot settings
    --remove-access-locations=: Access locations to remove from snapshot settings
    --storage-location-names=: The custom storage location that you specify for the project's
    --storage-location-policy=: The storage location policy.
documentation:
    command: |
        *(BETA)*  Update the snapshot settings of a project.
    flag:
        access-location-policy: 'The access location policy. ACCESS_LOCATION_POLICY must be one of: all-regions, specific-regions.'
        add-access-locations: Access locations to add to snapshot settings
        async: Return immediately, without waiting for the operation in progress to complete.
        no-async: Return immediately, without waiting for the operation in progress to complete.
        region: region for regional snapshot settings
        remove-access-locations: Access locations to remove from snapshot settings
        storage-location-names: |-
            The custom storage location that you specify for the project's
                    snapshots. You can specify only a single location. Use this flag only
                    when you use the specific-locations value for the
                    `--storage-location-policy` flag. For more information, refer to the
                    snapshot settings documentation at
                    https://cloud.google.com/compute/docs/disks/snapshot-settings.
        storage-location-policy: |-
            The storage location policy. For more information, refer to the
                    snapshot settings documentation at
                    https://cloud.google.com/compute/docs/disks/snapshot-settings.
                    STORAGE_LOCATION_POLICY must be one of: local-region,
                    nearest-multi-region, specific-locations.
