name: describe-global-clusters
description: Returns information about Amazon DocumentDB global clusters.
flags:
    --filters=: A filter that specifies one or more global DB clusters to describe.
    --global-cluster-identifier=: The user-supplied cluster identifier.
    --marker=: An optional pagination token provided by a previous `DescribeGlobalClusters` request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: |-
        Returns information about Amazon DocumentDB global clusters. This API supports pagination.

        This action only applies to Amazon DocumentDB clusters.
    flag:
        filters: |-
            A filter that specifies one or more global DB clusters to describe.

            Supported filters: `db-cluster-id` accepts cluster identifiers and cluster Amazon Resource Names (ARNs). The results list will only include information about the clusters identified by these ARNs.
        global-cluster-identifier: The user-supplied cluster identifier. If this parameter is specified, information from only the specific cluster is returned. This parameter isn't case-sensitive.
        marker: An optional pagination token provided by a previous `DescribeGlobalClusters` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.
