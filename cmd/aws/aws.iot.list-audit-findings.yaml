name: list-audit-findings
description: Lists the findings (results) of a Device Defender audit or of the audits performed during a specified time period.
flags:
    --check-name=: A filter to limit results to the findings for the specified audit check.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=: A filter to limit results to those found before the specified time.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --list-suppressed-findings: Boolean flag indicating whether only the suppressed findings or the unsuppressed findings should be listed.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The token for the next set of results.
    --no-list-suppressed-findings: Boolean flag indicating whether only the suppressed findings or the unsuppressed findings should be listed.
    --page-size=: The size of each page to get in the AWS service call.
    --resource-identifier=: Information identifying the noncompliant resource.
    --start-time=: A filter to limit results to those found after the specified time.
    --starting-token=: A token to specify where to start paginating.
    --task-id=: A filter to limit results to the audit with the specified ID.
documentation:
    command: |-
        Lists the findings (results) of a Device Defender audit or of the audits performed during a specified time period. (Findings are retained for 90 days.)

        Requires permission to access the [ListAuditFindings](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        check-name: A filter to limit results to the findings for the specified audit check.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: A filter to limit results to those found before the specified time. You must specify either the startTime and endTime or the taskId, but not both.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        list-suppressed-findings: Boolean flag indicating whether only the suppressed findings or the unsuppressed findings should be listed. If this parameter isn't provided, the response will list both suppressed and unsuppressed findings.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of results to return at one time. The default is 25.
        next-token: The token for the next set of results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        resource-identifier: Information identifying the noncompliant resource.
        start-time: A filter to limit results to those found after the specified time. You must specify either the startTime and endTime or the taskId, but not both.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        task-id: A filter to limit results to the audit with the specified ID. You must specify either the taskId or the startTime and endTime, but not both.
