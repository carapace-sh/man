name: describe-fleet-advisor-schemas
description: 'End of support notice: On May 20, 2026, Amazon Web Services will end support for Amazon Web Services DMS Fleet Advisor;.'
flags:
    --filters=: 'If you specify any of the following filters, the output includes information for only those schemas that meet the filter criteria:'
    --max-records=: Sets the maximum number of records returned in the response.
    --next-token=: If `NextToken` is returned by a previous response, there are more results available.
documentation:
    command: |-
        End of support notice: On May 20, 2026, Amazon Web Services will end support for Amazon Web Services DMS Fleet Advisor;. After May 20, 2026, you will no longer be able to access the Amazon Web Services DMS Fleet Advisor; console or Amazon Web Services DMS Fleet Advisor; resources. For more information, see [Amazon Web Services DMS Fleet Advisor end of support](https://docs.aws.amazon.com/dms/latest/userguide/dms_fleet.advisor-end-of-support.html).

        Returns a list of schemas detected by Fleet Advisor Collectors in your account.
    flag:
        filters: |-
            If you specify any of the following filters, the output includes information for only those schemas that meet the filter criteria:

            - `complexity` – The schema's complexity, for example `Simple`.
            - `database-id` – The ID of the schema's database.
            - `database-ip-address` – The IP address of the schema's database.
            - `database-name` – The name of the schema's database.
            - `database-engine` – The name of the schema database's engine.
            - `original-schema-name` – The name of the schema's database's main schema.
            - `schema-id` – The ID of the schema, for example `15`.
            - `schema-name` – The name of the schema.
            - `server-ip-address` – The IP address of the schema database's server.

            An example is: `describe-fleet-advisor-schemas --filter Name="schema-id",Values="50"`
        max-records: Sets the maximum number of records returned in the response.
        next-token: If `NextToken` is returned by a previous response, there are more results available. The value of `NextToken` is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged.
