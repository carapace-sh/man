name: get-linked-whats-app-business-account
description: Get the details of your linked WhatsApp Business Account.
flags:
    --id=!: The unique identifier, from Amazon Web Services, of the linked WhatsApp Business Account.
documentation:
    command: Get the details of your linked WhatsApp Business Account.
    flag:
        id: The unique identifier, from Amazon Web Services, of the linked WhatsApp Business Account. WABA identifiers are formatted as `waba-01234567890123456789012345678901`. Use [ListLinkedWhatsAppBusinessAccounts](https://docs.aws.amazon.com/social-messaging/latest/APIReference/API_ListLinkedWhatsAppBusinessAccounts.html) to list all WABAs and their details.
