name: update
description: Update a key.
flags:
    --allowed-access-reasons=: The list of allowed Key Access Justifications access reasons on the key.
    --clear-labels: Remove all labels.
    --default-algorithm=: The default algorithm for the crypto key.
    --keyring=: The KMS keyring of the key.
    --location=: The Google Cloud location for the key.
    --next-rotation-time=: Next automatic rotation time of the key.
    --no-clear-labels&: Remove all labels.
    --no-remove-key-access-justifications-policy&: Removes the Key Access Justifications policy on the key, making all justification codes allowed.
    --no-remove-rotation-schedule&: Remove any existing rotation schedule on the key.
    --primary-version=: Primary version to make primary.
    --remove-key-access-justifications-policy: Removes the Key Access Justifications policy on the key, making all justification codes allowed.
    --remove-labels=: List of label keys to remove.
    --remove-rotation-schedule: Remove any existing rotation schedule on the key.
    --rotation-period=: Automatic rotation period of the key.
    --update-labels=: List of label KEY=VALUE pairs to update.
