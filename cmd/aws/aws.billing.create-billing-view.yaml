name: create-billing-view
description: Creates a billing view with the specified billing view attributes.
flags:
    --client-token=: A unique, case-sensitive identifier you specify to ensure idempotency of the request.
    --data-filter-expression=: See [Expression](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_billing_Expression.html).
    --description=: The description of the billing view.
    --name=!: The name of the billing view.
    --resource-tags=: A list of key value map specifying tags associated to the billing view being created.
    --source-views=!: A list of billing views used as the data source for the custom billing view.
documentation:
    command: Creates a billing view with the specified billing view attributes.
    flag:
        client-token: A unique, case-sensitive identifier you specify to ensure idempotency of the request. Idempotency ensures that an API request completes no more than one time. If the original request completes successfully, any subsequent retries complete successfully without performing any further actions with an idempotent request.
        data-filter-expression: See [Expression](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_billing_Expression.html). Billing view only supports `LINKED_ACCOUNT` and `Tags`.
        description: The description of the billing view.
        name: The name of the billing view.
        resource-tags: A list of key value map specifying tags associated to the billing view being created.
        source-views: A list of billing views used as the data source for the custom billing view.
