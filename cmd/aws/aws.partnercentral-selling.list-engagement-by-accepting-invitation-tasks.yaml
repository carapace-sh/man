name: list-engagement-by-accepting-invitation-tasks
description: Lists all in-progress, completed, or failed StartEngagementByAcceptingInvitationTask tasks that were initiated by the caller's account.
flags:
    --catalog=!: Specifies the catalog related to the request.
    --engagement-invitation-identifier=: Filters tasks by the identifiers of the engagement invitations they are processing.
    --max-results=: Use this parameter to control the number of items returned in each request, which can be useful for performance tuning and managing large result sets.
    --next-token=: Use this parameter for pagination when the result set spans multiple pages.
    --opportunity-identifier=: Filters tasks by the identifiers of the opportunities they created or are associated with.
    --sort=: Specifies the sorting criteria for the returned results.
    --task-identifier=: Filters tasks by their unique identifiers.
    --task-status=: Filters the tasks based on their current status.
documentation:
    command: Lists all in-progress, completed, or failed StartEngagementByAcceptingInvitationTask tasks that were initiated by the caller's account.
    flag:
        catalog: |-
            Specifies the catalog related to the request. Valid values are:

            - AWS: Retrieves the request from the production AWS environment.
            - Sandbox: Retrieves the request from a sandbox environment used for testing or development purposes.
        engagement-invitation-identifier: Filters tasks by the identifiers of the engagement invitations they are processing.
        max-results: Use this parameter to control the number of items returned in each request, which can be useful for performance tuning and managing large result sets.
        next-token: Use this parameter for pagination when the result set spans multiple pages. This value is obtained from the NextToken field in the response of a previous call to this API.
        opportunity-identifier: Filters tasks by the identifiers of the opportunities they created or are associated with.
        sort: Specifies the sorting criteria for the returned results. This allows you to order the tasks based on specific attributes.
        task-identifier: Filters tasks by their unique identifiers. Use this when you want to retrieve information about specific tasks.
        task-status: Filters the tasks based on their current status. This allows you to focus on tasks in specific states.
