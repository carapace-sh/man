name: update-routing-profile-name
description: Updates the name and description of a routing profile.
flags:
    --description=: The description of the routing profile.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --name=: The name of the routing profile.
    --routing-profile-id=!: The identifier of the routing profile.
documentation:
    command: Updates the name and description of a routing profile. The request accepts the following data in JSON format. At least `Name` or `Description` must be provided.
    flag:
        description: The description of the routing profile. Must not be more than 250 characters.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        name: The name of the routing profile. Must not be more than 127 characters.
        routing-profile-id: The identifier of the routing profile.
