name: list-compilation-jobs
description: Lists model compilation jobs that satisfy various filters.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creation-time-after=: A filter that returns the model compilation jobs that were created after a specified time.
    --creation-time-before=: A filter that returns the model compilation jobs that were created before a specified time.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --last-modified-time-after=: A filter that returns the model compilation jobs that were modified after a specified time.
    --last-modified-time-before=: A filter that returns the model compilation jobs that were modified before a specified time.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of model compilation jobs to return in the response.
    --name-contains=: A filter that returns the model compilation jobs whose name contains a specified string.
    --next-token=: If the result of the previous `ListCompilationJobs` request was truncated, the response includes a `NextToken`.
    --page-size=: The size of each page to get in the AWS service call.
    --sort-by=: The field by which to sort results.
    --sort-order=: The sort order for results.
    --starting-token=: A token to specify where to start paginating.
    --status-equals=: A filter that retrieves model compilation jobs with a specific `CompilationJobStatus` status.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
            - Status
        sort-order:
            - Ascending
            - Descending
        status-equals:
            - INPROGRESS
            - COMPLETED
            - FAILED
            - STARTING
            - STOPPING
            - STOPPED
documentation:
    command: |-
        Lists model compilation jobs that satisfy various filters.

        To create a model compilation job, use [CreateCompilationJob](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateCompilationJob.html). To get information about a particular model compilation job you have created, use [DescribeCompilationJob](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_DescribeCompilationJob.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        creation-time-after: A filter that returns the model compilation jobs that were created after a specified time.
        creation-time-before: A filter that returns the model compilation jobs that were created before a specified time.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        last-modified-time-after: A filter that returns the model compilation jobs that were modified after a specified time.
        last-modified-time-before: A filter that returns the model compilation jobs that were modified before a specified time.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of model compilation jobs to return in the response.
        name-contains: A filter that returns the model compilation jobs whose name contains a specified string.
        next-token: If the result of the previous `ListCompilationJobs` request was truncated, the response includes a `NextToken`. To retrieve the next set of model compilation jobs, use the token in the next request.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sort-by: The field by which to sort results. The default is `CreationTime`.
        sort-order: The sort order for results. The default is `Ascending`.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status-equals: A filter that retrieves model compilation jobs with a specific `CompilationJobStatus` status.
