name: create-security-profile
description: Creates a security profile.
flags:
    --allowed-access-control-hierarchy-group-id=: The identifier of the hierarchy group that a security profile uses to restrict access to resources in Amazon Connect.
    --allowed-access-control-tags=: The list of tags that a security profile uses to restrict access to resources in Amazon Connect.
    --applications=:
        description: A list of third-party applications that the security profile will give access to.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the security profile.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hierarchy-restricted-resources=:
        description: The list of resources that a security profile applies hierarchy restrictions to in Amazon Connect.
        nargs: -1
    --instance-id=!: The identifier of the Amazon Connect instance.
    --permissions=:
        description: Permissions assigned to the security profile.
        nargs: -1
    --security-profile-name=!: The name of the security profile.
    --tag-restricted-resources=:
        description: The list of resources that a security profile applies tag restrictions to in Amazon Connect.
        nargs: -1
    --tags=: The tags used to organize, track, or control access for this resource.
documentation:
    command: |-
        Creates a security profile.

        For information about security profiles, see [Security Profiles](https://docs.aws.amazon.com/connect/latest/adminguide/connect-security-profiles.html) in the *Amazon Connect Administrator Guide*. For a mapping of the API name and user interface name of the security profile permissions, see [List of security profile permissions](https://docs.aws.amazon.com/connect/latest/adminguide/security-profile-list.html).
    flag:
        allowed-access-control-hierarchy-group-id: The identifier of the hierarchy group that a security profile uses to restrict access to resources in Amazon Connect.
        allowed-access-control-tags: The list of tags that a security profile uses to restrict access to resources in Amazon Connect.
        applications: A list of third-party applications that the security profile will give access to.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the security profile.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hierarchy-restricted-resources: 'The list of resources that a security profile applies hierarchy restrictions to in Amazon Connect. Following are acceptable ResourceNames: `User`.'
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        permissions: Permissions assigned to the security profile. For a list of valid permissions, see [List of security profile permissions](https://docs.aws.amazon.com/connect/latest/adminguide/security-profile-list.html).
        security-profile-name: The name of the security profile.
        tag-restricted-resources: The list of resources that a security profile applies tag restrictions to in Amazon Connect. For a list of Amazon Connect resources that you can tag, see [Add tags to resources in Amazon Connect](https://docs.aws.amazon.com/connect/latest/adminguide/tagging.html) in the *Amazon Connect Administrator Guide*.
        tags: 'The tags used to organize, track, or control access for this resource. For example, { "Tags": {"key1":"value1", "key2":"value2"} }.'
