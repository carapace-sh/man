name: check-schema-version-validity
description: Validates the supplied schema.
flags:
    --data-format=!: The data format of the schema definition.
    --schema-definition=!: The definition of the schema that has to be validated.
completion:
    flag:
        data-format:
            - AVRO
            - JSON
            - PROTOBUF
documentation:
    command: Validates the supplied schema. This call has no side effects, it simply validates using the supplied schema using `DataFormat` as the format. Since it does not take a schema set name, no compatibility checks are performed.
    flag:
        data-format: The data format of the schema definition. Currently `AVRO`, `JSON` and `PROTOBUF` are supported.
        schema-definition: The definition of the schema that has to be validated.
