name: get-value
description: '*(BETA)*  Output values of variable resources.'
flags:
    --config-name=!: The name of the configuration resource to use.
documentation:
    command: |-
        *(BETA)*  This command prints only the value of the variable resource with the
        specified name, and does not append a trailing newline character.
        It can be used as part of shell expansions.
    flag:
        config-name: The name of the configuration resource to use.
