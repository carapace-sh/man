name: list-reports
description: Returns a list of ARNs for the reports in the current Amazon Web Services account.
flags:
    --filter=: A `ReportFilter` object used to filter the returned reports.
    --max-results=: The maximum number of paginated reports returned per response.
    --next-token=: During a previous call, the maximum number of items that can be returned is the value specified in `maxResults`.
    --sort-order=: Specifies the sort order for the list of returned reports.
completion:
    flag:
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Returns a list of ARNs for the reports in the current Amazon Web Services account.
    flag:
        filter: A `ReportFilter` object used to filter the returned reports.
        max-results: The maximum number of paginated reports returned per response. Use `nextToken` to iterate pages in the list of returned `Report` objects. The default value is 100.
        next-token: During a previous call, the maximum number of items that can be returned is the value specified in `maxResults`. If there more items in the list, then a unique string called a *nextToken* is returned. To get the next batch of items in the list, call this operation again, adding the next token to the call. To get all of the items in the list, keep calling this operation with each subsequent next token that is returned, until no more next tokens are returned.
        sort-order: |-
            Specifies the sort order for the list of returned reports. Valid values are:

            - `ASCENDING`: return reports in chronological order based on their creation date.
            - `DESCENDING`: return reports in the reverse chronological order based on their creation date.
