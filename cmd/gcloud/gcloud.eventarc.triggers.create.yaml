name: create
description: Create an Eventarc trigger.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --channel=!: ID of the channel or fully qualified identifier for the channel.
    --destination-function-location=&: Location that the destination Function is running in.
    --destination-function=!&: ID of the Function that receives the events for the trigger.
    --destination-gke-cluster=!: Name of the GKE cluster that the destination GKE service is running in.
    --destination-gke-location=: Location of the GKE cluster that the destination GKE service is running in.
    --destination-gke-namespace=: Namespace that the destination GKE service is running in.
    --destination-gke-path=: Relative path on the destination GKE service to which the events for the trigger should be sent.
    --destination-gke-service=!: Name of the destination GKE service that receives the events for the trigger.
    --destination-http-endpoint-uri=!: URI that the destination HTTP Endpoint is connecting to.
    --destination-run-job=&: Name of the Cloud Run fully-managed job that receives the events for the trigger.
    --destination-run-path=: Relative path on the destination Cloud Run service to which the events for the trigger should be sent.
    --destination-run-region=: Region in which the destination Cloud Run service can be found.
    --destination-run-service=: Name of the Cloud Run fully-managed service that receives the events for the trigger.
    --destination-workflow-location=: Location that the destination workflow is running in.
    --destination-workflow=!: ID of the workflow that receives the events for the trigger.
    --event-data-content-type=: Depending on the event provider, you can specify the encoding of the event data payload that will be delivered to your destination, to either be encoded in ``application/json'' or ``application/protobuf''.
    --event-filters-path-pattern=: The trigger's list of filters in path pattern format that apply to CloudEvent attributes.
    --event-filters=!: The trigger's list of filters that apply to CloudEvents attributes.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location for the Eventarc trigger, which should be either ``global'' or one of the supported regions.
    --network-attachment=!: The network attachment associated with the trigger that allows access to the destination VPC.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --service-account=: The IAM service account email associated with the trigger.
    --transport-topic=!: ID of the Pub/Sub topic or fully qualified identifier for the Pub/Sub topic.
documentation:
    command: Create an Eventarc trigger.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        channel: |-
            ID of the channel or fully qualified identifier for the channel.
            +
            To set the `channel` attribute:
            * provide the argument `--channel` on the command line.
        destination-function: ID of the Function that receives the events for the trigger. The Function must be in the same project as the trigger.
        destination-function-location: Location that the destination Function is running in. If not specified, it is assumed that the Function is in the same location as the trigger.
        destination-gke-cluster: Name of the GKE cluster that the destination GKE service is running in.  The cluster must be in the same project as the trigger.
        destination-gke-location: Location of the GKE cluster that the destination GKE service is running in. If not specified, it is assumed that the cluster is a regional cluster and is in the same region as the trigger.
        destination-gke-namespace: Namespace that the destination GKE service is running in. If not specified, the ``default'' namespace is used.
        destination-gke-path: 'Relative path on the destination GKE service to which the events for the trigger should be sent. Examples: ``/route'''', ``route'''', ``route/subroute''''.'
        destination-gke-service: Name of the destination GKE service that receives the events for the trigger.
        destination-http-endpoint-uri: URI that the destination HTTP Endpoint is connecting to.
        destination-run-job: Name of the Cloud Run fully-managed job that receives the events for the trigger. The job must be in the same project as the trigger.
        destination-run-path: 'Relative path on the destination Cloud Run service to which the events for the trigger should be sent. Examples: ``/route'''', ``route'''', ``route/subroute''''.'
        destination-run-region: Region in which the destination Cloud Run service can be found. If not specified, it is assumed that the service is in the same region as the trigger.
        destination-run-service: Name of the Cloud Run fully-managed service that receives the events for the trigger. The service must be in the same project as the trigger.
        destination-workflow: ID of the workflow that receives the events for the trigger. The workflow must be in the same project as the trigger.
        destination-workflow-location: Location that the destination workflow is running in. If not specified, it is assumed that the workflow is in the same location as the trigger.
        event-data-content-type: Depending on the event provider, you can specify the encoding of the event data payload that will be delivered to your destination, to either be encoded in ``application/json'' or ``application/protobuf''. The default encoding is ``application/json''. Note that for custom sources or third-party providers, or for direct events from Cloud Pub/Sub, this formatting option is not supported.
        event-filters: The trigger's list of filters that apply to CloudEvents attributes. This flag can be repeated to add more filters to the list. Only events that match all these filters will be sent to the destination. The filters must include the ``type'' attribute, as well as any other attributes that are expected for the chosen type.
        event-filters-path-pattern: The trigger's list of filters in path pattern format that apply to CloudEvent attributes. This flag can be repeated to add more filters to the list. Only events that match all these filters will be sent to the destination. Currently, path pattern format is only available for the resourceName attribute for Cloud Audit Log events.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location for the Eventarc trigger, which should be either ``global'' or one of the supported regions. Alternatively, set the [eventarc/location] property.
            +
            To set the `location` attribute:
            * provide the argument `trigger` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `eventarc/location`.
        network-attachment: The network attachment associated with the trigger that allows access to the destination VPC.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        service-account: The IAM service account email associated with the trigger.
        transport-topic: |-
            ID of the Pub/Sub topic or fully qualified identifier for the Pub/Sub topic.
            +
            To set the `transport-topic` attribute:
            * provide the argument `--transport-topic` on the command line.
