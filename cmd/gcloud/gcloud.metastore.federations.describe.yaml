name: describe
description: Describe a Dataproc Metastore federation.
flags:
    --location=: The location of the Dataproc Metastore service.
documentation:
    command: |
        Describe a Dataproc Metastore federation.

        Displays all details of a Dataproc Metastore federation given a valid federation ID.
    flag:
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `federation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
