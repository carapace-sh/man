name: untag-user
description: Removes the specified tags from the user.
flags:
    --tag-keys=!: A list of key names as a simple array of strings.
    --user-name=!: The name of the IAM user from which you want to remove tags.
documentation:
    command: Removes the specified tags from the user. For more information about tagging, see [Tagging IAM resources](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_tags.html) in the *IAM User Guide*.
    flag:
        tag-keys: A list of key names as a simple array of strings. The tags with matching keys are removed from the specified user.
        user-name: |-
            The name of the IAM user from which you want to remove tags.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
