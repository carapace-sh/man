name: update-ca-certificate
description: Updates a registered CA certificate.
flags:
    --certificate-id=!: The CA certificate identifier.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --new-auto-registration-status=: The new value for the auto registration status.
    --new-status=: The updated status of the CA certificate.
    --no-remove-auto-registration: If true, removes auto registration.
    --registration-config=: Information about the registration configuration.
    --remove-auto-registration: If true, removes auto registration.
completion:
    flag:
        new-auto-registration-status:
            - ENABLE
            - DISABLE
        new-status:
            - ACTIVE
            - INACTIVE
documentation:
    command: |-
        Updates a registered CA certificate.

        Requires permission to access the [UpdateCACertificate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        certificate-id: The CA certificate identifier.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        new-auto-registration-status: 'The new value for the auto registration status. Valid values are: "ENABLE" or "DISABLE".'
        new-status: |-
            The updated status of the CA certificate.

            **Note:** The status value REGISTER\_INACTIVE is deprecated and should not be used.
        registration-config: Information about the registration configuration.
        remove-auto-registration: If true, removes auto registration.
