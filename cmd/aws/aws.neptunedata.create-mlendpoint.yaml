name: create-mlendpoint
description: Creates a new Neptune ML inference endpoint that lets you query one specific model that the model-training process constructed.
flags:
    --id=: A unique identifier for the new inference endpoint.
    --instance-count=: The minimum number of Amazon EC2 instances to deploy to an endpoint for prediction.
    --instance-type=: The type of Neptune ML instance to use for online servicing.
    --ml-model-training-job-id=: The job Id of the completed model-training job that has created the model that the inference endpoint will point to.
    --ml-model-transform-job-id=: The job Id of the completed model-transform job.
    --model-name=: Model type for training.
    --neptune-iam-role-arn=: The ARN of an IAM role providing Neptune access to SageMaker and Amazon S3 resources.
    --no-update: If set to `true`, `update` indicates that this is an update request.
    --update: If set to `true`, `update` indicates that this is an update request.
    --volume-encryption-kmskey=: The Amazon Key Management Service (Amazon KMS) key that SageMaker uses to encrypt data on the storage volume attached to the ML compute instances that run the training job.
documentation:
    command: |-
        Creates a new Neptune ML inference endpoint that lets you query one specific model that the model-training process constructed. See [Managing inference endpoints using the endpoints command](https://docs.aws.amazon.com/neptune/latest/userguide/machine-learning-api-endpoints.html).

        When invoking this operation in a Neptune cluster that has IAM authentication enabled, the IAM user or role making the request must have a policy attached that allows the [neptune-db:CreateMLEndpoint](https://docs.aws.amazon.com/neptune/latest/userguide/iam-dp-actions.html#createmlendpoint) IAM action in that cluster.
    flag:
        id: A unique identifier for the new inference endpoint. The default is an autogenerated timestamped name.
        instance-count: The minimum number of Amazon EC2 instances to deploy to an endpoint for prediction. The default is 1
        instance-type: The type of Neptune ML instance to use for online servicing. The default is `ml.m5.xlarge`. Choosing the ML instance for an inference endpoint depends on the task type, the graph size, and your budget.
        ml-model-training-job-id: The job Id of the completed model-training job that has created the model that the inference endpoint will point to. You must supply either the `mlModelTrainingJobId` or the `mlModelTransformJobId`.
        ml-model-transform-job-id: The job Id of the completed model-transform job. You must supply either the `mlModelTrainingJobId` or the `mlModelTransformJobId`.
        model-name: 'Model type for training. By default the Neptune ML model is automatically based on the `modelType` used in data processing, but you can specify a different model type here. The default is `rgcn` for heterogeneous graphs and `kge` for knowledge graphs. The only valid value for heterogeneous graphs is `rgcn`. Valid values for knowledge graphs are: `kge`, `transe`, `distmult`, and `rotate`.'
        neptune-iam-role-arn: The ARN of an IAM role providing Neptune access to SageMaker and Amazon S3 resources. This must be listed in your DB cluster parameter group or an error will be thrown.
        update: If set to `true`, `update` indicates that this is an update request. The default is `false`. You must supply either the `mlModelTrainingJobId` or the `mlModelTransformJobId`.
        volume-encryption-kmskey: The Amazon Key Management Service (Amazon KMS) key that SageMaker uses to encrypt data on the storage volume attached to the ML compute instances that run the training job. The default is None.
