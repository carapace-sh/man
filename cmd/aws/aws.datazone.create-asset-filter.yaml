name: create-asset-filter
description: Creates a data asset filter.
flags:
    --asset-identifier=!: The ID of the data asset.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
    --configuration=!: The configuration of the asset filter.
    --description=: The description of the asset filter.
    --domain-identifier=!: The ID of the domain in which you want to create an asset filter.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the asset filter.
documentation:
    command: |-
        Creates a data asset filter.

        Asset filters provide a sophisticated way to create controlled views of data assets by selecting specific columns or applying row-level filters. This capability is crucial for organizations that need to share data while maintaining security and privacy controls. For example, your database might be filtered to show only non-PII fields to certain users, or sales data might be filtered by region for different regional teams. Asset filters enable fine-grained access control while maintaining a single source of truth.

        Prerequisites:

        - A valid domain (`--domain-identifier`) must exist.
        - A data asset (`--asset-identifier`) must already be created under that domain.
        - The asset must have the referenced columns available in its schema for column-based filtering.
        - You cannot specify both (`columnConfiguration`, `rowConfiguration`)at the same time.
    flag:
        asset-identifier: The ID of the data asset.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
        configuration: The configuration of the asset filter.
        description: The description of the asset filter.
        domain-identifier: The ID of the domain in which you want to create an asset filter.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the asset filter.
