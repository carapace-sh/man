name: import-image
description: To import your virtual machines (VMs) with a console-based experience, you can use the *Import virtual machine images to Amazon Web Services* template in the [Migration Hub Orchestrator console](https://console.aws.amazon.com/migrationhub/orchestrator). For more information, see the [*Migration Hub Orchestrator User Guide*](https://docs.aws.amazon.com/migrationhub-orchestrator/latest/userguide/import-vm-images.html) .
flags:
    --architecture=: The architecture of the virtual machine.
    --boot-mode=: The boot mode of the virtual machine.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-data=: The client-specific data.
    --client-token=: The token to enable idempotency for VM import requests.
    --description=: A description string for the import image task.
    --disk-containers=:
        description: Information about the disk containers.
        nargs: -1
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --encrypted: Specifies whether the destination AMI of the imported image should be encrypted.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hypervisor=: The target hypervisor platform.
    --kms-key-id=: An identifier for the symmetric KMS key to use when creating the encrypted AMI.
    --license-specifications=:
        description: The ARNs of the license configurations.
        nargs: -1
    --license-type=: The license type to be used for the Amazon Machine Image (AMI) after importing.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-encrypted: Specifies whether the destination AMI of the imported image should be encrypted.
    --platform=: The operating system of the virtual machine.
    --role-name=: The name of the role to use when not using the default role, 'vmimport'.
    --tag-specifications=:
        description: The tags to apply to the import image task during creation.
        nargs: -1
    --usage-operation=: The usage operation value.
completion:
    flag:
        boot-mode:
            - legacy-bios
            - uefi
            - uefi-preferred
documentation:
    command: |-
        To import your virtual machines (VMs) with a console-based experience, you can use the *Import virtual machine images to Amazon Web Services* template in the [Migration Hub Orchestrator console](https://console.aws.amazon.com/migrationhub/orchestrator). For more information, see the [*Migration Hub Orchestrator User Guide*](https://docs.aws.amazon.com/migrationhub-orchestrator/latest/userguide/import-vm-images.html) .

        Import single or multi-volume disk images or EBS snapshots into an Amazon Machine Image (AMI).

        Amazon Web Services VM Import/Export strongly recommends specifying a value for either the `--license-type` or `--usage-operation` parameter when you create a new VM Import task. This ensures your operating system is licensed appropriately and your billing is optimized.

        For more information, see [Importing a VM as an image using VM Import/Export](https://docs.aws.amazon.com/vm-import/latest/userguide/vmimport-image-import.html) in the *VM Import/Export User Guide*.
    flag:
        architecture: |-
            The architecture of the virtual machine.

            Valid values: `i386` | `x86_64`
        boot-mode: |-
            The boot mode of the virtual machine.

            The `uefi-preferred` boot mode isn't supported for importing images. For more information, see [Boot modes](https://docs.aws.amazon.com/vm-import/latest/userguide/prerequisites.html#vmimport-boot-modes) in the *VM Import/Export User Guide*.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-data: The client-specific data.
        client-token: The token to enable idempotency for VM import requests.
        description: A description string for the import image task.
        disk-containers: Information about the disk containers.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        encrypted: Specifies whether the destination AMI of the imported image should be encrypted. The default KMS key for EBS is used unless you specify a non-default KMS key using `KmsKeyId`. For more information, see [Amazon EBS Encryption](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html) in the *Amazon Elastic Compute Cloud User Guide*.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hypervisor: |-
            The target hypervisor platform.

            Valid values: `xen`
        kms-key-id: |-
            An identifier for the symmetric KMS key to use when creating the encrypted AMI. This parameter is only required if you want to use a non-default KMS key; if this parameter is not specified, the default KMS key for EBS is used. If a `KmsKeyId` is specified, the `Encrypted` flag must also be set.

            The KMS key identifier may be provided in any of the following formats:

            - Key ID
            - Key alias
            - ARN using key ID. The ID ARN contains the `arn:aws:kms` namespace, followed by the Region of the key, the Amazon Web Services account ID of the key owner, the `key` namespace, and then the key ID. For example, arn:aws:kms:*us-east-1*:*012345678910*:key/*abcd1234-a123-456a-a12b-a123b4cd56ef*.
            - ARN using key alias. The alias ARN contains the `arn:aws:kms` namespace, followed by the Region of the key, the Amazon Web Services account ID of the key owner, the `alias` namespace, and then the key alias. For example, arn:aws:kms:*us-east-1*:*012345678910*:alias/*ExampleAlias*.

            Amazon Web Services parses `KmsKeyId` asynchronously, meaning that the action you call may appear to complete even though you provided an invalid identifier. This action will eventually report failure.

            The specified KMS key must exist in the Region that the AMI is being copied to.

            Amazon EBS does not support asymmetric KMS keys.
        license-specifications: The ARNs of the license configurations.
        license-type: |-
            The license type to be used for the Amazon Machine Image (AMI) after importing.

            Specify `AWS` to replace the source-system license with an Amazon Web Services license or `BYOL` to retain the source-system license. Leaving this parameter undefined is the same as choosing `AWS` when importing a Windows Server operating system, and the same as choosing `BYOL` when importing a Windows client operating system (such as Windows 10) or a Linux operating system.

            To use `BYOL`, you must have existing licenses with rights to use these licenses in a third party cloud, such as Amazon Web Services. For more information, see [Prerequisites](https://docs.aws.amazon.com/vm-import/latest/userguide/vmimport-image-import.html#prerequisites-image) in the VM Import/Export User Guide.
        platform: |-
            The operating system of the virtual machine. If you import a VM that is compatible with Unified Extensible Firmware Interface (UEFI) using an EBS snapshot, you must specify a value for the platform.

            Valid values: `Windows` | `Linux`
        role-name: The name of the role to use when not using the default role, 'vmimport'.
        tag-specifications: The tags to apply to the import image task during creation.
        usage-operation: The usage operation value. For more information, see [Licensing options](https://docs.aws.amazon.com/vm-import/latest/userguide/vmie_prereqs.html#prerequisites) in the *VM Import/Export User Guide*.
