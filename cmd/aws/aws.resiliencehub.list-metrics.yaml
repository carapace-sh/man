name: list-metrics
description: Lists the metrics that can be exported.
flags:
    --conditions=: Indicates the list of all the conditions that were applied on the metrics.
    --data-source=: Indicates the data source of the metrics.
    --fields=: Indicates the list of fields in the data source.
    --max-results=: Maximum number of results to include in the response.
    --next-token=: Null, or the token from a previous call to get the next set of results.
    --sorts=: (Optional) Indicates the order in which you want to sort the fields in the metrics.
documentation:
    command: Lists the metrics that can be exported.
    flag:
        conditions: Indicates the list of all the conditions that were applied on the metrics.
        data-source: Indicates the data source of the metrics.
        fields: Indicates the list of fields in the data source.
        max-results: Maximum number of results to include in the response. If more results exist than the specified `MaxResults` value, a token is included in the response so that the remaining results can be retrieved.
        next-token: Null, or the token from a previous call to get the next set of results.
        sorts: (Optional) Indicates the order in which you want to sort the fields in the metrics. By default, the fields are sorted in the ascending order.
