name: create-code-security-integration
description: Creates a code security integration with a source code repository provider.
flags:
    --details=: The integration details specific to the repository provider type.
    --name=!: The name of the code security integration.
    --tags=: The tags to apply to the code security integration.
    --type=!: The type of repository provider for the integration.
completion:
    flag:
        type:
            - GITLAB_SELF_MANAGED
            - GITHUB
documentation:
    command: |-
        Creates a code security integration with a source code repository provider.

        After calling the `CreateCodeSecurityIntegration` operation, you complete authentication and authorization with your provider. Next you call the `UpdateCodeSecurityIntegration` operation to provide the `details` to complete the integration setup
    flag:
        details: The integration details specific to the repository provider type.
        name: The name of the code security integration.
        tags: The tags to apply to the code security integration.
        type: The type of repository provider for the integration.
