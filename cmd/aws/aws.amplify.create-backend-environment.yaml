name: create-backend-environment
description: Creates a new backend environment for an Amplify app.
flags:
    --app-id=!: The unique ID for an Amplify app.
    --deployment-artifacts=: The name of deployment artifacts.
    --environment-name=!: The name for the backend environment.
    --stack-name=: The AWS CloudFormation stack name of a backend environment.
documentation:
    command: |-
        Creates a new backend environment for an Amplify app.

        This API is available only to Amplify Gen 1 applications where the backend is created using Amplify Studio or the Amplify command line interface (CLI). This API isn’t available to Amplify Gen 2 applications. When you deploy an application with Amplify Gen 2, you provision the app's backend infrastructure using Typescript code.
    flag:
        app-id: The unique ID for an Amplify app.
        deployment-artifacts: The name of deployment artifacts.
        environment-name: The name for the backend environment.
        stack-name: The AWS CloudFormation stack name of a backend environment.
