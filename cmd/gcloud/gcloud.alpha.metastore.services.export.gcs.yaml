name: gcs
description: '*(ALPHA)*  Export metadata from a Dataproc Metastore service to Google Cloud Storage.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --destination-folder=!: A Cloud Storage URI of a folder that metadata is exported to, in the format
    --dump-type=: The type of the database dump.
    --location=: The location of the Dataproc Metastore service.
    --no-async&: Return immediately, without waiting for the operation in progress to
completion:
    flag:
        dump-type:
            - avro
            - mysql
documentation:
    command: |
        *(ALPHA)*  Export metadata from a Dataproc Metastore service to Google Cloud Storage.

        If run asynchronously with `--async`, exits after printing
        the operation name that can be used to poll the status of the
        export via:

          {top_command} metastore operations describe
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        destination-folder: |-
            A Cloud Storage URI of a folder that metadata is exported to, in the format
            `gs://<bucket_name>/<path_inside_bukcet>`. A sub-folder containing
            exported files will be created below it.
        dump-type: |-
            The type of the database dump. If unspecified, defaults to `mysql`. _DUMP_TYPE_ must be one of:
            +
            *avro*::: Database dump contains AVRO files.
            +
            *mysql*::: Database dump is a MYSQL dump file.
            +
            :::
            +
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
