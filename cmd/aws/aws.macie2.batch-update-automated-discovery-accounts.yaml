name: batch-update-automated-discovery-accounts
description: Changes the status of automated sensitive data discovery for one or more accounts.
flags:
    --accounts=: An array of objects, one for each account to change the status of automated sensitive data discovery for.
documentation:
    command: Changes the status of automated sensitive data discovery for one or more accounts.
    flag:
        accounts: An array of objects, one for each account to change the status of automated sensitive data discovery for. Each object specifies the Amazon Web Services account ID for an account and a new status for that account.
