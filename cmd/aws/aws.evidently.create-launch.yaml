name: create-launch
description: Creates a *launch* of a given feature.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: An optional description for the launch.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --groups=!: An array of structures that contains the feature and variations that are to be used for the launch.
    --metric-monitors=: An array of structures that define the metrics that will be used to monitor the launch performance.
    --name=!: The name for the new launch.
    --project=!: The name or ARN of the project that you want to create the launch in.
    --randomization-salt=: When Evidently assigns a particular user session to a launch, it must use a randomization ID to determine which variation the user session is served.
    --scheduled-splits-config=: An array of structures that define the traffic allocation percentages among the feature variations during each step of the launch.
    --tags=: Assigns one or more tags (key-value pairs) to the launch.
documentation:
    command: |-
        Creates a *launch* of a given feature. Before you create a launch, you must create the feature to use for the launch.

        You can use a launch to safely validate new features by serving them to a specified percentage of your users while you roll out the feature. You can monitor the performance of the new feature to help you decide when to ramp up traffic to more users. This helps you reduce risk and identify unintended consequences before you fully launch the feature.

        Don't use this operation to update an existing launch. Instead, use [UpdateLaunch](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_UpdateLaunch.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: An optional description for the launch.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        groups: An array of structures that contains the feature and variations that are to be used for the launch.
        metric-monitors: An array of structures that define the metrics that will be used to monitor the launch performance.
        name: The name for the new launch.
        project: The name or ARN of the project that you want to create the launch in.
        randomization-salt: When Evidently assigns a particular user session to a launch, it must use a randomization ID to determine which variation the user session is served. This randomization ID is a combination of the entity ID and `randomizationSalt`. If you omit `randomizationSalt`, Evidently uses the launch name as the `randomizationSalt`.
        scheduled-splits-config: An array of structures that define the traffic allocation percentages among the feature variations during each step of the launch.
        tags: |-
            Assigns one or more tags (key-value pairs) to the launch.

            Tags can help you organize and categorize your resources. You can also use them to scope user permissions by granting a user permission to access or change only resources with certain tag values.

            Tags don't have any semantic meaning to Amazon Web Services and are interpreted strictly as strings of characters.

            You can associate as many as 50 tags with a launch.

            For more information, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html).
