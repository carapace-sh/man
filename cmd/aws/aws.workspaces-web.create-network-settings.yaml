name: create-network-settings
description: Creates a network settings resource that can be associated with a web portal.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --security-group-ids=!: One or more security groups used to control access from streaming instances to your VPC.
    --subnet-ids=!: The subnets in which network interfaces are created to connect streaming instances to your VPC.
    --tags=: The tags to add to the network settings resource.
    --vpc-id=!: The VPC that streaming instances will connect to.
documentation:
    command: Creates a network settings resource that can be associated with a web portal. Once associated with a web portal, network settings define how streaming instances will connect with your specified VPC.
    flag:
        client-token: |-
            A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, subsequent retries with the same client token returns the result from the original successful request.

            If you do not specify a client token, one is automatically generated by the Amazon Web Services SDK.
        security-group-ids: One or more security groups used to control access from streaming instances to your VPC.
        subnet-ids: The subnets in which network interfaces are created to connect streaming instances to your VPC. At least two of these subnets must be in different availability zones.
        tags: The tags to add to the network settings resource. A tag is a key-value pair.
        vpc-id: The VPC that streaming instances will connect to.
