name: list-call-analytics-categories
description: Provides a list of Call Analytics categories, including all rules that make up each category.
flags:
    --max-results=: The maximum number of Call Analytics categories to return in each page of results.
    --next-token=: If your `ListCallAnalyticsCategories` request returns more results than can be displayed, `NextToken` is displayed in the response with an associated string.
documentation:
    command: |-
        Provides a list of Call Analytics categories, including all rules that make up each category.

        To get detailed information about a specific Call Analytics category, use the operation.
    flag:
        max-results: The maximum number of Call Analytics categories to return in each page of results. If there are fewer results than the value that you specify, only the actual results are returned. If you do not specify a value, a default of 5 is used.
        next-token: If your `ListCallAnalyticsCategories` request returns more results than can be displayed, `NextToken` is displayed in the response with an associated string. To get the next page of results, copy this string and repeat your request, including `NextToken` with the value of the copied string. Repeat as needed to view all your results.
