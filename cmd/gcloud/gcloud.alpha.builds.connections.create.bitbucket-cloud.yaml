name: bitbucket-cloud
description: '*(ALPHA)*  Create a Cloud Build Connection for Bitbucket Cloud.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --authorizer-token-secret-version=!: Secret containing the `repository_read`,`repository_admin`, `pullrequest_read`, `webhook` repository/project/workspace access token.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --read-authorizer-token-secret-version=!: Secret containing the `repository_read` repository/project/workspace access token.
    --region=: The Google Cloud region.
    --webhook-secret-secret-version=!: Secret containing the webhook secret string for validating webhook events sent by
    --workspace=!: Workspace of the Bitbucket Cloud instance.
documentation:
    command: |
        *(ALPHA)*  Create a Cloud Build Connection for Bitbucket Cloud.

        A Bitbucket Cloud Connection can be created by using a repository/project/workspace access token with `repository_read`,`repository_admin`, `pullrequest_read`, `webhook`
        scope permission and a repository/project/workspace access token with `repository_read` scope permission.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        authorizer-token-secret-version: Secret containing the `repository_read`,`repository_admin`, `pullrequest_read`, `webhook` repository/project/workspace access token.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        read-authorizer-token-secret-version: Secret containing the `repository_read` repository/project/workspace access token.
        region: |-
            The Google Cloud region.
            +
            To set the `region` attribute:
            * provide the argument `connection` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `builds/region`.
        webhook-secret-secret-version: |-
            Secret containing the webhook secret string for validating webhook events sent by
            Bitbucket Cloud.
        workspace: Workspace of the Bitbucket Cloud instance.
