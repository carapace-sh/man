name: register-notification-hub
description: Registers a `NotificationConfiguration` in the specified Region.
flags:
    --notification-hub-region=!: The Region of the `NotificationHub`.
documentation:
    command: |-
        Registers a `NotificationConfiguration` in the specified Region.

        There is a maximum of one `NotificationConfiguration` per Region. You can have a maximum of 3 `NotificationHub` resources at a time.
    flag:
        notification-hub-region: The Region of the `NotificationHub`.
