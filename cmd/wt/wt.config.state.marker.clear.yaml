name: clear
description: Clear marker for a branch
flags:
    --all: Clear all markers
    --branch=: Target branch (defaults to current)
    -h, --help: Print help (see more with '--help')
completion:
    flag:
        C:
            - $files
        config:
            - $files
documentation:
    flag:
        help: Print help (see a summary with '-h')
