name: describe
description: Describe a virtual machine instance template.
flags:
    --global: If set, the instance template is global.
    --no-global&: If set, the instance template is global.
    --region=: Region of the instance template to describe.
documentation:
    command: |
        *gcloud compute instance-templates describe* displays all data associated with a Google Compute
        Engine virtual machine instance template.
    flag:
        global: If set, the instance template is global.
        no-global: If set, the instance template is global.
        region: Region of the instance template to describe. Overrides the default *compute/region* property value for this command invocation.
