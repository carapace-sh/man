name: deidentify
description: '*(BETA)*  De-identify data from the source store and write it to the destination store.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --dataset=: Cloud Healthcare dataset.
    --destination-store=!: The name of the FHIR store to which the redacted data should be written
    --location=: Google Cloud location.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(BETA)*  De-identify data from the source store and write it to the destination store.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        dataset: |-
            Cloud Healthcare dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `fhir_store` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
        destination-store: |-
            The name of the FHIR store to which the redacted data should be written
            (e.g., projects/{projectId}/locations/{locationId}/datasets/{datasetId}/fhirStores/{fhirStoreId}).
            The destination FHIR store must already exist, or the request will fail.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `fhir_store` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
