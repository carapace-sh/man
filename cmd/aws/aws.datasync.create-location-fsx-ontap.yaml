name: create-location-fsx-ontap
description: Creates a transfer *location* for an Amazon FSx for NetApp ONTAP file system.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --protocol=!: ""
    --security-group-arns=!: Specifies the Amazon EC2 security groups that provide access to your file system's preferred subnet.
    --storage-virtual-machine-arn=!: Specifies the ARN of the storage virtual machine (SVM) in your file system where you want to copy data to or from.
    --subdirectory=: Specifies a path to the file share in the SVM where you want to transfer data to or from.
    --tags=: Specifies labels that help you categorize, filter, and search for your Amazon Web Services resources.
documentation:
    command: |-
        Creates a transfer *location* for an Amazon FSx for NetApp ONTAP file system. DataSync can use this location as a source or destination for transferring data.

        Before you begin, make sure that you understand how DataSync [accesses FSx for ONTAP file systems](https://docs.aws.amazon.com/datasync/latest/userguide/create-ontap-location.html#create-ontap-location-access).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        protocol: ""
        security-group-arns: |-
            Specifies the Amazon EC2 security groups that provide access to your file system's preferred subnet.

            The security groups must allow outbound traffic on the following ports (depending on the protocol you use):

            - **Network File System (NFS)**: TCP ports 111, 635, and 2049
            - **Server Message Block (SMB)**: TCP port 445

            Your file system's security groups must also allow inbound traffic on the same ports.
        storage-virtual-machine-arn: Specifies the ARN of the storage virtual machine (SVM) in your file system where you want to copy data to or from.
        subdirectory: |-
            Specifies a path to the file share in the SVM where you want to transfer data to or from.

            You can specify a junction path (also known as a mount point), qtree path (for NFS file shares), or share name (for SMB file shares). For example, your mount path might be `/vol1`, `/vol1/tree1`, or `/share1`.

            Don't specify a junction path in the SVM's root volume. For more information, see [Managing FSx for ONTAP storage virtual machines](https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/managing-svms.html) in the *Amazon FSx for NetApp ONTAP User Guide*.
        tags: Specifies labels that help you categorize, filter, and search for your Amazon Web Services resources. We recommend creating at least a name tag for your location.
