name: delete-cleanup-policies
description: Delete cleanup policies from an Artifact Registry repository.
flags:
    --location=: Location of the repository.
    --policynames=!: Comma-separated list of cleanup policy names to delete.
documentation:
    command: |
        Delete cleanup policies from an Artifact Registry repository.

        This command can fail for the following reasons:
          * The given repository does not exist.
          * The active account does not have permission to update repositories.
    flag:
        location: |-
            Location of the repository. Overrides the default artifacts/location property value
            for this command invocation. To configure the default location, use the command:
            gcloud config set artifacts/location.
            +

            To set the `location` attribute:
            * provide the argument `repository` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        policynames: Comma-separated list of cleanup policy names to delete.
