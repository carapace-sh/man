name: describe-events
description: Returns events related to DAX clusters and parameter groups.
flags:
    --duration=: The number of minutes' worth of events to retrieve.
    --end-time=: The end of the time interval for which to retrieve events, specified in ISO 8601 format.
    --max-results=: The maximum number of results to include in the response.
    --next-token=: An optional token returned from a prior request.
    --source-name=: The identifier of the event source for which events will be returned.
    --source-type=: The event source to retrieve events for.
    --start-time=: The beginning of the time interval to retrieve events for, specified in ISO 8601 format.
completion:
    flag:
        source-type:
            - CLUSTER
            - PARAMETER_GROUP
            - SUBNET_GROUP
documentation:
    command: |-
        Returns events related to DAX clusters and parameter groups. You can obtain events specific to a particular DAX cluster or parameter group by providing the name as a parameter.

        By default, only the events occurring within the last 24 hours are returned; however, you can retrieve up to 14 days' worth of events if necessary.
    flag:
        duration: The number of minutes' worth of events to retrieve.
        end-time: The end of the time interval for which to retrieve events, specified in ISO 8601 format.
        max-results: |-
            The maximum number of results to include in the response. If more results exist than the specified `MaxResults` value, a token is included in the response so that the remaining results can be retrieved.

            The value for `MaxResults` must be between 20 and 100.
        next-token: An optional token returned from a prior request. Use this token for pagination of results from this action. If this parameter is specified, the response includes only results beyond the token, up to the value specified by `MaxResults`.
        source-name: The identifier of the event source for which events will be returned. If not specified, then all sources are included in the response.
        source-type: The event source to retrieve events for. If no value is specified, all events are returned.
        start-time: The beginning of the time interval to retrieve events for, specified in ISO 8601 format.
