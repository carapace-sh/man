name: list-distributions-by-realtime-log-config
description: Gets a list of distributions that have a cache behavior that's associated with the specified real-time log configuration.
flags:
    --marker=: Use this field when paginating results to indicate where to begin in your list of distributions.
    --max-items=: The maximum number of distributions that you want in the response.
    --realtime-log-config-arn=: The Amazon Resource Name (ARN) of the real-time log configuration whose associated distributions you want to list.
    --realtime-log-config-name=: The name of the real-time log configuration whose associated distributions you want to list.
documentation:
    command: |-
        Gets a list of distributions that have a cache behavior that's associated with the specified real-time log configuration.

        You can specify the real-time log configuration by its name or its Amazon Resource Name (ARN). You must provide at least one. If you provide both, CloudFront uses the name to identify the real-time log configuration to list distributions for.

        You can optionally specify the maximum number of items to receive in the response. If the total number of items in the list exceeds the maximum that you specify, or the default maximum, the response is paginated. To get the next page of items, send a subsequent request that specifies the `NextMarker` value from the current response as the `Marker` value in the subsequent request.
    flag:
        marker: Use this field when paginating results to indicate where to begin in your list of distributions. The response includes distributions in the list that occur after the marker. To get the next page of the list, set this field's value to the value of `NextMarker` from the current page's response.
        max-items: The maximum number of distributions that you want in the response.
        realtime-log-config-arn: The Amazon Resource Name (ARN) of the real-time log configuration whose associated distributions you want to list.
        realtime-log-config-name: The name of the real-time log configuration whose associated distributions you want to list.
