name: get-workload-deployment-pattern
description: Returns details for a given workload and deployment pattern, including the available specifications.
flags:
    --deployment-pattern-name=!: The name of the deployment pattern.
    --workload-name=!: The name of the workload.
documentation:
    command: Returns details for a given workload and deployment pattern, including the available specifications. You can use the [ListWorkloads](https://docs.aws.amazon.com/launchwizard/latest/APIReference/API_ListWorkloads.html) operation to discover the available workload names and the [ListWorkloadDeploymentPatterns](https://docs.aws.amazon.com/launchwizard/latest/APIReference/API_ListWorkloadDeploymentPatterns.html) operation to discover the available deployment pattern names of a given workload.
    flag:
        deployment-pattern-name: The name of the deployment pattern.
        workload-name: The name of the workload.
