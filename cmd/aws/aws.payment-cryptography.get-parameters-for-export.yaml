name: get-parameters-for-export
description: Gets the export token and the signing key certificate to initiate a TR-34 key export from Amazon Web Services Payment Cryptography.
flags:
    --key-material-type=!: The key block format type (for example, TR-34 or TR-31) to use during key material export.
    --signing-key-algorithm=!: The signing key algorithm to generate a signing key certificate.
completion:
    flag:
        key-material-type:
            - TR34_KEY_BLOCK
            - TR31_KEY_BLOCK
            - ROOT_PUBLIC_KEY_CERTIFICATE
            - TRUSTED_PUBLIC_KEY_CERTIFICATE
            - KEY_CRYPTOGRAM
        signing-key-algorithm:
            - TDES_2KEY
            - TDES_3KEY
            - AES_128
            - AES_192
            - AES_256
            - HMAC_SHA256
            - HMAC_SHA384
            - HMAC_SHA512
            - HMAC_SHA224
            - RSA_2048
            - RSA_3072
            - RSA_4096
            - ECC_NIST_P256
            - ECC_NIST_P384
            - ECC_NIST_P521
documentation:
    command: |-
        Gets the export token and the signing key certificate to initiate a TR-34 key export from Amazon Web Services Payment Cryptography.

        The signing key certificate signs the wrapped key under export within the TR-34 key payload. The export token and signing key certificate must be in place and operational before calling [ExportKey](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_ExportKey.html). The export token expires in 30 days. You can use the same export token to export multiple keys from your service account.

        **Cross-account use:** This operation can't be used across different Amazon Web Services accounts.

        **Related operations:**

        - [ExportKey](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_ExportKey.html)
        - [GetParametersForImport](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_GetParametersForImport.html)
    flag:
        key-material-type: The key block format type (for example, TR-34 or TR-31) to use during key material export. Export token is only required for a TR-34 key export, `TR34_KEY_BLOCK`. Export token is not required for TR-31 key export.
        signing-key-algorithm: The signing key algorithm to generate a signing key certificate. This certificate signs the wrapped key under export within the TR-34 key block. `RSA_2048` is the only signing key algorithm allowed.
