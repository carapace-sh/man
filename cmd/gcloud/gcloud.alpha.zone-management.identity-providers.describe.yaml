name: describe
description: '*(ALPHA)*  describes an identity provider.'
flags:
    --location=: The global location name.
    --organization=: The organization name.
    --zone=!: Zone of the identity provider.
documentation:
    command: |
        *(ALPHA)*  Describes an identity provider.
    flag:
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `identity_provider` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        organization: |-
            The organization name.
            +
            To set the `organization` attribute:
            * provide the argument `identity_provider` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        zone: Zone of the identity provider.
