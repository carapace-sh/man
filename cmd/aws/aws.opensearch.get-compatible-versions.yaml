name: get-compatible-versions
description: Returns a map of OpenSearch or Elasticsearch versions and the versions you can upgrade them to.
flags:
    --domain-name=: The name of an existing domain.
documentation:
    command: Returns a map of OpenSearch or Elasticsearch versions and the versions you can upgrade them to.
    flag:
        domain-name: The name of an existing domain. Provide this parameter to limit the results to a single domain.
