name: remove-interconnect
description: '*(ALPHA)*  Remove interconnect from a wire group.'
flags:
    --cross-site-network=!: Name of the crossSiteNetwork to operate on.
    --endpoint-label=!: The endpoint label for the wire group.
    --interconnect-label=!: The interconnect label for the wire group endpoint.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute interconnects wire-groups remove-interconnect* is used to remove interconnects from a wire group endpoint.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        cross-site-network: Name of the crossSiteNetwork to operate on.
        endpoint-label: The endpoint label for the wire group.
        interconnect-label: The interconnect label for the wire group endpoint.
