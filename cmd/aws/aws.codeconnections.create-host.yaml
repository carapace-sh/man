name: create-host
description: Creates a resource that represents the infrastructure where a third-party provider is installed.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the host to be created.
    --provider-endpoint=!: The endpoint of the infrastructure to be represented by the host after it is created.
    --provider-type=!: The name of the installed provider to be associated with your connection.
    --tags=:
        description: Tags for the host to be created.
        nargs: -1
    --vpc-configuration=: The VPC configuration to be provisioned for the host.
completion:
    flag:
        provider-type:
            - Bitbucket
            - GitHub
            - GitHubEnterpriseServer
            - GitLab
            - GitLabSelfManaged
            - AzureDevOps
documentation:
    command: |-
        Creates a resource that represents the infrastructure where a third-party provider is installed. The host is used when you create connections to an installed third-party provider type, such as GitHub Enterprise Server. You create one host for all connections to that provider.

        A host created through the CLI or the SDK is in \`PENDING\` status by default. You can make its status \`AVAILABLE\` by setting up the host in the console.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the host to be created.
        provider-endpoint: The endpoint of the infrastructure to be represented by the host after it is created.
        provider-type: The name of the installed provider to be associated with your connection. The host resource represents the infrastructure where your provider type is installed. The valid provider type is GitHub Enterprise Server.
        tags: Tags for the host to be created.
        vpc-configuration: The VPC configuration to be provisioned for the host. A VPC must be configured and the infrastructure to be represented by the host must already be connected to the VPC.
