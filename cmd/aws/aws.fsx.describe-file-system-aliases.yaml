name: describe-file-system-aliases
description: Returns the DNS aliases that are associated with the specified Amazon FSx for Windows File Server file system.
flags:
    --client-request-token=: ""
    --file-system-id=!: The ID of the file system to return the associated DNS aliases for (String).
    --max-results=: Maximum number of DNS aliases to return in the response (integer).
    --next-token=: Opaque pagination token returned from a previous `DescribeFileSystemAliases` operation (String).
documentation:
    command: Returns the DNS aliases that are associated with the specified Amazon FSx for Windows File Server file system. A history of all DNS aliases that have been associated with and disassociated from the file system is available in the list of [AdministrativeAction]() provided in the [DescribeFileSystems]() operation response.
    flag:
        client-request-token: ""
        file-system-id: The ID of the file system to return the associated DNS aliases for (String).
        max-results: Maximum number of DNS aliases to return in the response (integer). This parameter value must be greater than 0. The number of items that Amazon FSx returns is the minimum of the `MaxResults` parameter specified in the request and the service's internal maximum number of items per page.
        next-token: Opaque pagination token returned from a previous `DescribeFileSystemAliases` operation (String). If a token is included in the request, the action continues the list from where the previous returning call left off.
