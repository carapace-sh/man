name: remove-backend
description: '*(ALPHA)*  Remove a backend from a backend service.'
flags:
    --global: If set, the backend service is global.
    --global-network-endpoint-group: If set, the network endpoint group is global.
    --instance-group-region=: Region of the instance group to remove from the backend service.
    --instance-group-zone=: Zone of the instance group to remove from the backend service.
    --instance-group=!: Name of the instance group to remove from the backend service.
    --network-endpoint-group-region=: Region of the network endpoint group to remove from the backend service.
    --network-endpoint-group-zone=: Zone of the network endpoint group to remove from the backend service.
    --network-endpoint-group=!: Name of the network endpoint group to remove from the backend service.
    --no-global&: If set, the backend service is global.
    --no-global-network-endpoint-group&: If set, the network endpoint group is global.
    --region=: Region of the backend service to operate on.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute backend-services remove-backend* is used to remove a backend from a backend
        service.

        Before removing a backend, it is a good idea to "drain" the
        backend first. A backend can be drained by setting its
        capacity scaler to zero through 'gcloud compute
        backend-services edit'.
    flag:
        global: If set, the backend service is global.
        global-network-endpoint-group: If set, the network endpoint group is global.
        instance-group: 'Name of the instance group to remove from the backend service. For details on valid instance names, refer to the criteria documented under the field ''name'' at: https://cloud.google.com/compute/docs/reference/rest/v1/instances'
        instance-group-region: |-
            Region of the instance group to remove from the backend service. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        instance-group-zone: |-
            Zone of the instance group to remove from the backend service. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
        network-endpoint-group: Name of the network endpoint group to remove from the backend service.
        network-endpoint-group-region: |-
            Region of the network endpoint group to remove from the backend service. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        network-endpoint-group-zone: |-
            Zone of the network endpoint group to remove from the backend service. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
        no-global: If set, the backend service is global.
        no-global-network-endpoint-group: If set, the network endpoint group is global.
        region: Region of the backend service to operate on. Overrides the default *compute/region* property value for this command invocation.
