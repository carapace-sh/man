name: restart
description: Restart a Database Migration Service migration job.
flags:
    --databases-filter=: A list of databases to be migrated to the destination instance.
    --no-restart-failed-objects&: Restart the failed objects in the migration job.
    --no-skip-validation&: Restart the migration job without running prior configuration verification.
    --object-filter=&: A list of schema and table names to be migrated to the destination instance.
    --region=: The Cloud region for the migration_job.
    --restart-failed-objects: Restart the failed objects in the migration job.
    --skip-validation: Restart the migration job without running prior configuration verification.
documentation:
    command: |
        Restart a Database Migration Service migration job.
    flag:
        databases-filter: |-
            A list of databases to be migrated to the destination instance.
            Provide databases as a comma separated list. This flag is used only for
            SQL Server to Cloud SQL SQL Server migrations.
        no-restart-failed-objects: |
            Restart the failed objects in the migration job. This flag is used only for
            Postgres to AlloyDB migrations and Postgres to Cloud SQL Postgres migrations.
        no-skip-validation: |
            Restart the migration job without running prior configuration verification.
        object-filter: |
            A list of schema and table names to be migrated to the destination instance.
            Usage: --object-filter schema=schema1,table=table1 --object-filter schema=schema2,table=table2
            This flag is used only for heterogeneous migrations.
        region: |-
            The Cloud region for the migration_job.
            +
            To set the `region` attribute:
            * provide the argument `migration_job` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        restart-failed-objects: |-
            Restart the failed objects in the migration job. This flag is used only for
            Postgres to AlloyDB migrations and Postgres to Cloud SQL Postgres migrations.
        skip-validation: Restart the migration job without running prior configuration verification.
