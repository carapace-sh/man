name: describe-fleet-location-utilization
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Retrieves current usage data for a fleet location.
flags:
    --fleet-id=!: A unique identifier for the fleet to request location utilization for.
    --location=!: The fleet location to retrieve utilization information for.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Retrieves current usage data for a fleet location. Utilization data provides a snapshot of current game hosting activity at the requested location. Use this operation to retrieve utilization information for a fleet's remote location or home Region (you can also retrieve home Region utilization by calling `DescribeFleetUtilization`).

        To retrieve utilization data, identify a fleet and location.

        If successful, a `FleetUtilization` object is returned for the requested fleet location.

        **Learn more**

        [Setting up Amazon GameLift Servers fleets](https://docs.aws.amazon.com/gamelift/latest/developerguide/fleets-intro.html)

        [Amazon GameLift Servers service locations](https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-regions.html) for managed hosting

        [GameLift metrics for fleets](https://docs.aws.amazon.com/gamelift/latest/developerguide/monitoring-cloudwatch.html#gamelift-metrics-fleet)
    flag:
        fleet-id: A unique identifier for the fleet to request location utilization for. You can use either the fleet ID or ARN value.
        location: The fleet location to retrieve utilization information for. Specify a location in the form of an Amazon Web Services Region code, such as `us-west-2`.
