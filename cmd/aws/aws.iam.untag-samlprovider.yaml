name: untag-samlprovider
description: Removes the specified tags from the specified Security Assertion Markup Language (SAML) identity provider in IAM.
flags:
    --samlprovider-arn=!: The ARN of the SAML identity provider in IAM from which you want to remove tags.
    --tag-keys=!: A list of key names as a simple array of strings.
documentation:
    command: Removes the specified tags from the specified Security Assertion Markup Language (SAML) identity provider in IAM. For more information about these providers, see [About web identity federation](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html). For more information about tagging, see [Tagging IAM resources](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_tags.html) in the *IAM User Guide*.
    flag:
        samlprovider-arn: |-
            The ARN of the SAML identity provider in IAM from which you want to remove tags.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
        tag-keys: A list of key names as a simple array of strings. The tags with matching keys are removed from the specified SAML identity provider.
