name: search-local-gateway-routes
description: Searches for routes in the specified local gateway route table.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --local-gateway-route-table-id=!: The ID of the local gateway route table.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token for the next page of results.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Searches for routes in the specified local gateway route table.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters.

            - `prefix-list-id` - The ID of the prefix list.
            - `route-search.exact-match` - The exact match of the specified filter.
            - `route-search.longest-prefix-match` - The longest prefix that matches the route.
            - `route-search.subnet-of-match` - The routes with a subnet that match the specified CIDR filter.
            - `route-search.supernet-of-match` - The routes with a CIDR that encompass the CIDR filter. For example, if you have 10.0.1.0/29 and 10.0.1.0/31 routes in your route table and you specify `supernet-of-match` as 10.0.1.0/30, then the result returns 10.0.1.0/29.
            - `state` - The state of the route.
            - `type` - The route type.
        local-gateway-route-table-id: The ID of the local gateway route table.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The token for the next page of results.
