name: associate-member
description: Associates an Amazon Web Services account with an Amazon Inspector delegated administrator.
flags:
    --account-id=!: The Amazon Web Services account ID of the member account to be associated.
documentation:
    command: Associates an Amazon Web Services account with an Amazon Inspector delegated administrator. An HTTP 200 response indicates the association was successfully started, but doesn’t indicate whether it was completed. You can check if the association completed by using [ListMembers](https://docs.aws.amazon.com/inspector/v2/APIReference/API_ListMembers.html) for multiple accounts or [GetMembers](https://docs.aws.amazon.com/inspector/v2/APIReference/API_GetMember.html) for a single account.
    flag:
        account-id: The Amazon Web Services account ID of the member account to be associated.
