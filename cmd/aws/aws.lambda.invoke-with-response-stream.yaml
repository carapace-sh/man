name: invoke-with-response-stream
description: Configure your Lambda functions to stream response payloads back to clients.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-context=: Up to 3,583 bytes of base64-encoded data about the invoking client to pass to the function in the context object.
    --function-name=!: The name or ARN of the Lambda function.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --invocation-type=: 'Use one of the following options:'
    --log-type=: Set to `Tail` to include the execution log in the response.
    --payload=: The JSON that you want to provide to your Lambda function as input.
    --qualifier=: The alias name.
completion:
    flag:
        invocation-type:
            - RequestResponse
            - DryRun
        log-type:
            - None
            - Tail
documentation:
    command: |-
        Configure your Lambda functions to stream response payloads back to clients. For more information, see [Configuring a Lambda function to stream responses](https://docs.aws.amazon.com/lambda/latest/dg/configuration-response-streaming.html).

        This operation requires permission for the [lambda:InvokeFunction](https://docs.aws.amazon.com/IAM/latest/UserGuide/list_awslambda.html) action. For details on how to set up permissions for cross-account invocations, see [Granting function access to other accounts](https://docs.aws.amazon.com/lambda/latest/dg/access-control-resource-based.html#permissions-resource-xaccountinvoke).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-context: Up to 3,583 bytes of base64-encoded data about the invoking client to pass to the function in the context object.
        function-name: |-
            The name or ARN of the Lambda function.

            **Name formats**

            - **Function name** – `my-function`.
            - **Function ARN** – `arn:aws:lambda:us-west-2:123456789012:function:my-function`.
            - **Partial ARN** – `123456789012:function:my-function`.

            The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        invocation-type: |-
            Use one of the following options:

            - `RequestResponse` (default) – Invoke the function synchronously. Keep the connection open until the function returns a response or times out. The API operation response includes the function response and additional data.
            - `DryRun` – Validate parameter values and verify that the IAM user or role has permission to invoke the function.
        log-type: Set to `Tail` to include the execution log in the response. Applies to synchronously invoked functions only.
        payload: |-
            The JSON that you want to provide to your Lambda function as input.

            You can enter the JSON directly. For example, `--payload '{ "key": "value" }'`. You can also specify a file path. For example, `--payload file://payload.json`.
        qualifier: The alias name.
