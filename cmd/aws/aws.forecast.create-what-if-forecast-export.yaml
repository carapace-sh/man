name: create-what-if-forecast-export
description: Exports a forecast created by the [CreateWhatIfForecast]() operation to your Amazon Simple Storage Service (Amazon S3) bucket.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destination=!: The location where you want to save the forecast and an Identity and Access Management (IAM) role that Amazon Forecast can assume to access the location.
    --format=: The format of the exported data, CSV or PARQUET.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --tags=:
        description: A list of [tags](https://docs.aws.amazon.com/forecast/latest/dg/tagging-forecast-resources.html) to apply to the what if forecast.
        nargs: -1
    --what-if-forecast-arns=!:
        description: The list of what-if forecast Amazon Resource Names (ARNs) to export.
        nargs: -1
    --what-if-forecast-export-name=!: The name of the what-if forecast to export.
documentation:
    command: |-
        Exports a forecast created by the [CreateWhatIfForecast]() operation to your Amazon Simple Storage Service (Amazon S3) bucket. The forecast file name will match the following conventions:

        `≈<ForecastExportJobName>_<ExportTimestamp>_<PartNumber>`

        The &lt;ExportTimestamp&gt; component is in Java SimpleDateFormat (yyyy-MM-ddTHH-mm-ssZ).

        You must specify a [DataDestination]() object that includes an Identity and Access Management (IAM) role that Amazon Forecast can assume to access the Amazon S3 bucket. For more information, see [aws-forecast-iam-roles]().

        For more information, see [howitworks-forecast]().

        To get a list of all your what-if forecast export jobs, use the [ListWhatIfForecastExports]() operation.

        The `Status` of the forecast export job must be `ACTIVE` before you can access the forecast in your Amazon S3 bucket. To get the status, use the [DescribeWhatIfForecastExport]() operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        destination: |-
            The location where you want to save the forecast and an Identity and Access Management (IAM) role that Amazon Forecast can assume to access the location. The forecast must be exported to an Amazon S3 bucket.

            If encryption is used, `Destination` must include an Key Management Service (KMS) key. The IAM role must allow Amazon Forecast permission to access the key.
        format: The format of the exported data, CSV or PARQUET.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tags: A list of [tags](https://docs.aws.amazon.com/forecast/latest/dg/tagging-forecast-resources.html) to apply to the what if forecast.
        what-if-forecast-arns: The list of what-if forecast Amazon Resource Names (ARNs) to export.
        what-if-forecast-export-name: The name of the what-if forecast to export.
