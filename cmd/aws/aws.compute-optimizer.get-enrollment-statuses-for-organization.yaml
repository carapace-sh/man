name: get-enrollment-statuses-for-organization
description: Returns the Compute Optimizer enrollment (opt-in) status of organization member accounts, if your account is an organization management account.
flags:
    --filters=: An array of objects to specify a filter that returns a more specific list of account enrollment statuses.
    --max-results=: The maximum number of account enrollment statuses to return with a single request.
    --next-token=: The token to advance to the next page of account enrollment statuses.
documentation:
    command: |-
        Returns the Compute Optimizer enrollment (opt-in) status of organization member accounts, if your account is an organization management account.

        To get the enrollment status of standalone accounts, use the [GetEnrollmentStatus]() action.
    flag:
        filters: An array of objects to specify a filter that returns a more specific list of account enrollment statuses.
        max-results: |-
            The maximum number of account enrollment statuses to return with a single request. You can specify up to 100 statuses to return with each request.

            To retrieve the remaining results, make another request with the returned `nextToken` value.
        next-token: The token to advance to the next page of account enrollment statuses.
