name: deprovision-ipam-byoasn
description: Deprovisions your Autonomous System Number (ASN) from your Amazon Web Services account.
flags:
    --asn=!: An ASN.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --ipam-id=!: The IPAM ID.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: 'Deprovisions your Autonomous System Number (ASN) from your Amazon Web Services account. This action can only be called after any BYOIP CIDR associations are removed from your Amazon Web Services account with [DisassociateIpamByoasn](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DisassociateIpamByoasn.html). For more information, see [Tutorial: Bring your ASN to IPAM](https://docs.aws.amazon.com/vpc/latest/ipam/tutorials-byoasn.html) in the *Amazon VPC IPAM guide*.'
    flag:
        asn: An ASN.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ipam-id: The IPAM ID.
