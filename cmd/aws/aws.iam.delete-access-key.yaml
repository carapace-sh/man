name: delete-access-key
description: Deletes the access key pair associated with the specified IAM user.
flags:
    --access-key-id=!: The access key ID for the access key ID and secret access key you want to delete.
    --user-name=: The name of the user whose access key pair you want to delete.
documentation:
    command: |-
        Deletes the access key pair associated with the specified IAM user.

        If you do not specify a user name, IAM determines the user name implicitly based on the Amazon Web Services access key ID signing the request. This operation works for access keys under the Amazon Web Services account. Consequently, you can use this operation to manage Amazon Web Services account root user credentials even if the Amazon Web Services account has no associated users.
    flag:
        access-key-id: |-
            The access key ID for the access key ID and secret access key you want to delete.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters that can consist of any upper or lowercased letter or digit.
        user-name: |-
            The name of the user whose access key pair you want to delete.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
