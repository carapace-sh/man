name: list
description: List the status of all Google Cloud CLI components.
flags:
    --architecture-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --no-only-local-state&: Only show locally installed components.
    --no-show-hidden&: Show installed and available versions of all components.
    --no-show-platform&: Show operating system and architecture of all components
    --no-show-versions&: Show installed and available versions of all components.
    --only-local-state: Only show locally installed components.
    --operating-system-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --sdk-root-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --show-hidden&: Show installed and available versions of all components.
    --show-platform: Show operating system and architecture of all components
    --show-versions: Show installed and available versions of all components.
    --snapshot-url-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --sort-by=: Comma-separated list of resource field key names to sort by.
documentation:
    command: |-
        This command lists all the available components in the Google Cloud CLI. For
        each component, the command lists the following information:

        * Status on your local workstation: not installed, installed (and
          up to date), and update available (installed, but not up to date)
        * Name of the component (a description)
        * ID of the component (used to refer to the component in other
          [gcloud components] commands)
        * Size of the component

        ## EXAMPLES
        To list the status of all Google Cloud CLI components, run:

          $ gcloud components list

        To show the currently installed version (if any) and the latest available
        version of each component, run:

          $ gcloud components list --show-versions
    flag:
        architecture-override: THIS ARGUMENT NEEDS HELP TEXT.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        no-only-local-state: Only show locally installed components.
        no-show-hidden: Show installed and available versions of all components.
        no-show-platform: Show operating system and architecture of all components
        no-show-versions: Show installed and available versions of all components.
        only-local-state: Only show locally installed components.
        operating-system-override: THIS ARGUMENT NEEDS HELP TEXT.
        sdk-root-override: THIS ARGUMENT NEEDS HELP TEXT.
        show-hidden: Show installed and available versions of all components.
        show-platform: Show operating system and architecture of all components
        show-versions: Show installed and available versions of all components.
        snapshot-url-override: THIS ARGUMENT NEEDS HELP TEXT.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
