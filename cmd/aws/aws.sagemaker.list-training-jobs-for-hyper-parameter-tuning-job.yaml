name: list-training-jobs-for-hyper-parameter-tuning-job
description: Gets a list of [TrainingJobSummary](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_TrainingJobSummary.html) objects that describe the training jobs that a hyperparameter tuning job launched.
flags:
    --hyper-parameter-tuning-job-name=!: The name of the tuning job whose training jobs you want to list.
    --max-results=: The maximum number of training jobs to return.
    --next-token=: If the result of the previous `ListTrainingJobsForHyperParameterTuningJob` request was truncated, the response includes a `NextToken`.
    --sort-by=: The field to sort results by.
    --sort-order=: The sort order for results.
    --status-equals=: A filter that returns only training jobs with the specified status.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
            - Status
            - FinalObjectiveMetricValue
        sort-order:
            - Ascending
            - Descending
        status-equals:
            - InProgress
            - Completed
            - Failed
            - Stopping
            - Stopped
            - Deleting
documentation:
    command: Gets a list of [TrainingJobSummary](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_TrainingJobSummary.html) objects that describe the training jobs that a hyperparameter tuning job launched.
    flag:
        hyper-parameter-tuning-job-name: The name of the tuning job whose training jobs you want to list.
        max-results: The maximum number of training jobs to return. The default value is 10.
        next-token: If the result of the previous `ListTrainingJobsForHyperParameterTuningJob` request was truncated, the response includes a `NextToken`. To retrieve the next set of training jobs, use the token in the next request.
        sort-by: |-
            The field to sort results by. The default is `Name`.

            If the value of this field is `FinalObjectiveMetricValue`, any training jobs that did not return an objective metric are not listed.
        sort-order: The sort order for results. The default is `Ascending`.
        status-equals: A filter that returns only training jobs with the specified status.
