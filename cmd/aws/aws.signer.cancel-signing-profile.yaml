name: cancel-signing-profile
description: Changes the state of an `ACTIVE` signing profile to `CANCELED`.
flags:
    --profile-name=!: The name of the signing profile to be canceled.
documentation:
    command: Changes the state of an `ACTIVE` signing profile to `CANCELED`. A canceled profile is still viewable with the `ListSigningProfiles` operation, but it cannot perform new signing jobs, and is deleted two years after cancelation.
    flag:
        profile-name: The name of the signing profile to be canceled.
