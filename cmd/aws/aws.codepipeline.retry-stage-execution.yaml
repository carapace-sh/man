name: retry-stage-execution
description: You can retry a stage that has failed without having to run a pipeline again from the beginning.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --pipeline-execution-id=!: The ID of the pipeline execution in the failed stage to be retried.
    --pipeline-name=!: The name of the pipeline that contains the failed stage.
    --retry-mode=!: The scope of the retry attempt.
    --stage-name=!: The name of the failed stage to be retried.
completion:
    flag:
        retry-mode:
            - FAILED_ACTIONS
            - ALL_ACTIONS
documentation:
    command: You can retry a stage that has failed without having to run a pipeline again from the beginning. You do this by either retrying the failed actions in a stage or by retrying all actions in the stage starting from the first action in the stage. When you retry the failed actions in a stage, all actions that are still in progress continue working, and failed actions are triggered again. When you retry a failed stage from the first action in the stage, the stage cannot have any actions in progress. Before a stage can be retried, it must either have all actions failed or some actions failed and some succeeded.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        pipeline-execution-id: The ID of the pipeline execution in the failed stage to be retried. Use the [GetPipelineState]() action to retrieve the current pipelineExecutionId of the failed stage
        pipeline-name: The name of the pipeline that contains the failed stage.
        retry-mode: The scope of the retry attempt.
        stage-name: The name of the failed stage to be retried.
