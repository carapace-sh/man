name: list-run-groups
description: Retrieves a list of all run groups and returns the metadata for each run group.
flags:
    --max-results=: The maximum number of run groups to return in one page of results.
    --name=: The run groups' name.
    --starting-token=: Specify the pagination token from a previous request to retrieve the next page of results.
