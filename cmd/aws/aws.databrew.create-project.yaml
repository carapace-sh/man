name: create-project
description: Creates a new DataBrew project.
flags:
    --dataset-name=!: The name of an existing dataset to associate this project with.
    --name=!: A unique name for the new project.
    --recipe-name=!: The name of an existing recipe to associate with the project.
    --role-arn=!: The Amazon Resource Name (ARN) of the Identity and Access Management (IAM) role to be assumed for this request.
    --sample=: ""
    --tags=: Metadata tags to apply to this project.
documentation:
    command: Creates a new DataBrew project.
    flag:
        dataset-name: The name of an existing dataset to associate this project with.
        name: A unique name for the new project. Valid characters are alphanumeric (A-Z, a-z, 0-9), hyphen (-), period (.), and space.
        recipe-name: The name of an existing recipe to associate with the project.
        role-arn: The Amazon Resource Name (ARN) of the Identity and Access Management (IAM) role to be assumed for this request.
        sample: ""
        tags: Metadata tags to apply to this project.
