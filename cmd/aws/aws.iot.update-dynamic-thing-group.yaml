name: update-dynamic-thing-group
description: Updates a dynamic thing group.
flags:
    --expected-version=: The expected version of the dynamic thing group to update.
    --index-name=: The dynamic thing group index to update.
    --query-string=: The dynamic thing group search query string to update.
    --query-version=: The dynamic thing group query version to update.
    --thing-group-name=!: The name of the dynamic thing group to update.
    --thing-group-properties=!: The dynamic thing group properties to update.
documentation:
    command: |-
        Updates a dynamic thing group.

        Requires permission to access the [UpdateDynamicThingGroup](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        expected-version: The expected version of the dynamic thing group to update.
        index-name: |-
            The dynamic thing group index to update.

            Currently one index is supported: `AWS_Things`.
        query-string: The dynamic thing group search query string to update.
        query-version: |-
            The dynamic thing group query version to update.

            Currently one query version is supported: "2017-09-30". If not specified, the query version defaults to this value.
        thing-group-name: The name of the dynamic thing group to update.
        thing-group-properties: The dynamic thing group properties to update.
