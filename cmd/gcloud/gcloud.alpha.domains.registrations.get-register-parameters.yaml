name: get-register-parameters
description: '*(ALPHA)*  Get register parameters (including availability) of a specific domain.'
documentation:
    command: |-
        *(ALPHA)*  Get parameters needed to register a new domain, including
        price, availability, supported privacy modes and notices.

        In contrast to the search-domains command, this command returns up-to-date
        domain name availability information.

        ## EXAMPLES

        To check if ``example.com'' is available for registration, run:

          $ gcloud alpha domains registrations get-register-parameters example.com
