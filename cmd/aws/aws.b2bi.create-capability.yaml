name: create-capability
description: Instantiates a capability based on the specified parameters.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Reserved for future use.
    --configuration=!: Specifies a structure that contains the details for a capability.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instructions-documents=: Specifies one or more locations in Amazon S3, each specifying an EDI document that can be used with this capability.
    --name=!: Specifies the name of the capability, used to identify it.
    --tags=: Specifies the key-value pairs assigned to ARNs that you can use to group and search for resources by type.
    --type=!: Specifies the type of the capability.
completion:
    flag:
        type:
            - edi
documentation:
    command: Instantiates a capability based on the specified parameters. A trading capability contains the information required to transform incoming EDI documents into JSON or XML outputs.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Reserved for future use.
        configuration: Specifies a structure that contains the details for a capability.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instructions-documents: Specifies one or more locations in Amazon S3, each specifying an EDI document that can be used with this capability. Each item contains the name of the bucket and the key, to identify the document's location.
        name: Specifies the name of the capability, used to identify it.
        tags: Specifies the key-value pairs assigned to ARNs that you can use to group and search for resources by type. You can attach this metadata to resources (capabilities, partnerships, and so on) for any purpose.
        type: Specifies the type of the capability. Currently, only `edi` is supported.
