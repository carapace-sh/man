name: modify-network-interface-attribute
description: Modifies the specified network interface attribute.
flags:
    --associate-public-ip-address: Indicates whether to assign a public IPv4 address to a network interface.
    --associated-subnet-ids=: A list of subnet IDs to associate with the network interface.
    --attachment=: Information about the interface attachment.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connection-tracking-specification=: A connection tracking specification.
    --description=: A description for the network interface.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --ena-srd-specification=: Updates the ENA Express configuration for the network interface that’s attached to the instance.
    --enable-primary-ipv6: If you’re modifying a network interface in a dual-stack or IPv6-only subnet, you have the option to assign a primary IPv6 IP address.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --groups=: Changes the security groups for the network interface.
    --network-interface-id=!: The ID of the network interface.
    --no-associate-public-ip-address: Indicates whether to assign a public IPv4 address to a network interface.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-enable-primary-ipv6: If you’re modifying a network interface in a dual-stack or IPv6-only subnet, you have the option to assign a primary IPv6 IP address.
    --no-source-dest-check: Enable or disable source/destination checks, which ensure that the instance is either the source or the destination of any traffic that it receives.
    --source-dest-check: Enable or disable source/destination checks, which ensure that the instance is either the source or the destination of any traffic that it receives.
documentation:
    command: Modifies the specified network interface attribute. You can specify only one attribute at a time. You can use this action to attach and detach security groups from an existing EC2 instance.
    flag:
        associate-public-ip-address: Indicates whether to assign a public IPv4 address to a network interface. This option can be enabled for any network interface but will only apply to the primary network interface (eth0).
        associated-subnet-ids: A list of subnet IDs to associate with the network interface.
        attachment: Information about the interface attachment. If modifying the `delete on termination` attribute, you must specify the ID of the interface attachment.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connection-tracking-specification: A connection tracking specification.
        description: A description for the network interface.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ena-srd-specification: Updates the ENA Express configuration for the network interface that’s attached to the instance.
        enable-primary-ipv6: If you’re modifying a network interface in a dual-stack or IPv6-only subnet, you have the option to assign a primary IPv6 IP address. A primary IPv6 address is an IPv6 GUA address associated with an ENI that you have enabled to use a primary IPv6 address. Use this option if the instance that this ENI will be attached to relies on its IPv6 address not changing. Amazon Web Services will automatically assign an IPv6 address associated with the ENI attached to your instance to be the primary IPv6 address. Once you enable an IPv6 GUA address to be a primary IPv6, you cannot disable it. When you enable an IPv6 GUA address to be a primary IPv6, the first IPv6 GUA will be made the primary IPv6 address until the instance is terminated or the network interface is detached. If you have multiple IPv6 addresses associated with an ENI attached to your instance and you enable a primary IPv6 address, the first IPv6 GUA address associated with the ENI becomes the primary IPv6 address.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        groups: Changes the security groups for the network interface. The new set of groups you specify replaces the current set. You must specify at least one group, even if it's just the default security group in the VPC. You must specify the ID of the security group, not the name.
        network-interface-id: The ID of the network interface.
        source-dest-check: Enable or disable source/destination checks, which ensure that the instance is either the source or the destination of any traffic that it receives. If the value is `true`, source/destination checks are enabled; otherwise, they are disabled. The default value is `true`. You must disable source/destination checks if the instance runs services such as network address translation, routing, or firewalls.
