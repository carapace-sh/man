name: get-tags
description: Gets the Tags collection for a given resource.
flags:
    --limit=: (Not currently supported) The maximum number of returned results per page.
    --position=: (Not currently supported) The current pagination position in the paged result set.
    --resource-arn=!: The ARN of a resource that can be tagged.
documentation:
    command: Gets the Tags collection for a given resource.
    flag:
        limit: (Not currently supported) The maximum number of returned results per page. The default value is 25 and the maximum value is 500.
        position: (Not currently supported) The current pagination position in the paged result set.
        resource-arn: The ARN of a resource that can be tagged.
