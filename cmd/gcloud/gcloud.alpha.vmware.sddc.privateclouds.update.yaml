name: update
description: '*(ALPHA)*  Update a VMware Engine private cloud.'
hidden: true
flags:
    --description=: Text describing the private cloud
    --external-ip-access: Enable public ips for management vms.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-external-ip-access&: Enable public ips for management vms.
    --region=: Region of the private cloud or cluster.
documentation:
    command: |
        *(ALPHA)*  Update a VMware Engine private cloud. Private cloud update is
        considered finished when the private cloud is in READY state. Check
        the progress of a private cloud using
        `gcloud alpha vmware privateclouds list`.
    flag:
        description: Text describing the private cloud
        external-ip-access: |-
            Enable public ips for management vms.
            Use --no-external-ip-access to disable
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-external-ip-access: |
            Enable public ips for management vms.
            Use --no-external-ip-access to disable
        region: |-
            Region of the private cloud or cluster.
            +
            To set the `region` attribute:
            * provide the argument `privatecloud` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `vmware/region`.
