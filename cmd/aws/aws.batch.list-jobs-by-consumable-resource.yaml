name: list-jobs-by-consumable-resource
description: Returns a list of Batch jobs that require a specific consumable resource.
flags:
    --consumable-resource=!: The name or ARN of the consumable resource.
    --filters=: The filters to apply to the job list query.
    --max-results=: The maximum number of results returned by `ListJobsByConsumableResource` in paginated output.
    --next-token=: The `nextToken` value returned from a previous paginated `ListJobsByConsumableResource` request where `maxResults` was used and the results exceeded the value of that parameter.
documentation:
    command: Returns a list of Batch jobs that require a specific consumable resource.
    flag:
        consumable-resource: The name or ARN of the consumable resource.
        filters: "The filters to apply to the job list query. If used, only those jobs requiring the specified consumable resource (`consumableResource`) and that match the value of the filters are listed. The filter names and values can be:\n\n- name: `JOB_STATUS`\n  \n  values: `SUBMITTED | PENDING | RUNNABLE | STARTING | RUNNING | SUCCEEDED | FAILED`\n- name: `JOB_NAME`\n  \n  The values are case-insensitive matches for the job name. If a filter value ends with an asterisk (\\*), it matches any job name that begins with the string before the '\\*'."
        max-results: The maximum number of results returned by `ListJobsByConsumableResource` in paginated output. When this parameter is used, `ListJobsByConsumableResource` only returns `maxResults` results in a single page and a `nextToken` response element. The remaining results of the initial request can be seen by sending another `ListJobsByConsumableResource` request with the returned `nextToken` value. This value can be between 1 and 100. If this parameter isn't used, then `ListJobsByConsumableResource` returns up to 100 results and a `nextToken` value if applicable.
        next-token: |-
            The `nextToken` value returned from a previous paginated `ListJobsByConsumableResource` request where `maxResults` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `nextToken` value. This value is `null` when there are no more results to return.

            Treat this token as an opaque identifier that's only used to retrieve the next items in a list and not for other programmatic purposes.
