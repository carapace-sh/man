name: remove
description: '*(BETA)*  Remove MCP content security provider of a project.'
hidden: true
documentation:
    command: |-
        *(BETA)*  Remove MCP content security provider of a project.

        ## EXAMPLES

        Remove MCP content security provider of a project:

          $ gcloud beta services mcp content-security remove my-mcp-content-security-provider

        Remove MCP content security provider of a project `my-project`:

          $ gcloud beta services mcp content-security remove my-mcp-content-security-provider --project=my-project
