name: set-subscription-attributes
description: Allows a subscription owner to set an attribute of the subscription to a new value.
flags:
    --attribute-name=!: A map of attributes with their corresponding values.
    --attribute-value=: The new value for the attribute in JSON format.
    --subscription-arn=!: The ARN of the subscription to modify.
documentation:
    command: Allows a subscription owner to set an attribute of the subscription to a new value.
    flag:
        attribute-name: "A map of attributes with their corresponding values.\n\nThe following lists the names, descriptions, and values of the special request parameters that this action uses:\n\n- `DeliveryPolicy` – The policy that defines how Amazon SNS retries failed deliveries to HTTP/S endpoints.\n- `FilterPolicy` – The simple JSON object that lets your subscriber receive only a subset of messages, rather than receiving every message published to the topic.\n- `FilterPolicyScope` – This attribute lets you choose the filtering scope by using one of the following string value types:\n  \n  - `MessageAttributes` (default) – The filter is applied on the message attributes.\n  - `MessageBody` – The filter is applied on the message body.\n- `RawMessageDelivery` – When set to `true`, enables raw message delivery to Amazon SQS or HTTP/S endpoints. This eliminates the need for the endpoints to process JSON formatting, which is otherwise created for Amazon SNS metadata.\n- `RedrivePolicy` – When specified, sends undeliverable messages to the specified Amazon SQS dead-letter queue. Messages that can't be delivered due to client errors (for example, when the subscribed endpoint is unreachable) or server errors (for example, when the service that powers the subscribed endpoint becomes unavailable) are held in the dead-letter queue for further analysis or reprocessing.\n\nThe following attribute applies only to Amazon Data Firehose delivery stream subscriptions:\n\n- `SubscriptionRoleArn` – The ARN of the IAM role that has the following:\n  \n  - Permission to write to the Firehose delivery stream\n  - Amazon SNS listed as a trusted entity\n  \n  Specifying a valid ARN for this attribute is required for Firehose delivery stream subscriptions. For more information, see [Fanout to Firehose delivery streams](https://docs.aws.amazon.com/sns/latest/dg/sns-firehose-as-subscriber.html) in the *Amazon SNS Developer Guide*."
        attribute-value: The new value for the attribute in JSON format.
        subscription-arn: The ARN of the subscription to modify.
