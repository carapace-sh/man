name: gcs
description: '*(ALPHA)*  Import metadata into a Dataproc Metastore service from Google Cloud Storage.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --database-dump=!: A Cloud Storage object URI that specifies a database dump from which to import metadata.
    --description=: The description of this metadata import.
    --dump-type=: The type of the database dump;.
    --import-id=!: The ID of this metadata import.
    --location=: The location of the Dataproc Metastore service.
    --no-async&: Return immediately, without waiting for the operation in progress to
completion:
    flag:
        dump-type:
            - avro
            - mysql
documentation:
    command: |
        *(ALPHA)*  Import metadata into a Dataproc Metastore service from Google Cloud Storage.

        If run asynchronously with `--async`, exits after printing
        the operation name that can be used to poll the status of the
        export via:

          {top_command} metastore operations describe
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        database-dump: |-
            A Cloud Storage object URI that specifies a database dump from which to import metadata.
            It must begin with `gs://`.
        description: The description of this metadata import.
        dump-type: |-
            The type of the database dump;. If unspecified, defaults to `mysql`. _DUMP_TYPE_ must be one of:
            +
            *avro*::: Database dump contains AVRO files.
            +
            *mysql*::: Database dump is a MYSQL dump file.
            +
            :::
            +
        import-id: The ID of this metadata import.
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
