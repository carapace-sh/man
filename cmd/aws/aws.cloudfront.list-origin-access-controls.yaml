name: list-origin-access-controls
description: Gets the list of CloudFront origin access controls (OACs) in this Amazon Web Services account.
flags:
    --marker=: Use this field when paginating results to indicate where to begin in your list of origin access controls.
    --max-items=: The maximum number of origin access controls that you want in the response.
documentation:
    command: |-
        Gets the list of CloudFront origin access controls (OACs) in this Amazon Web Services account.

        You can optionally specify the maximum number of items to receive in the response. If the total number of items in the list exceeds the maximum that you specify, or the default maximum, the response is paginated. To get the next page of items, send another request that specifies the `NextMarker` value from the current response as the `Marker` value in the next request.

        If you're not using origin access controls for your Amazon Web Services account, the `ListOriginAccessControls` operation doesn't return the `Items` element in the response.
    flag:
        marker: Use this field when paginating results to indicate where to begin in your list of origin access controls. The response includes the items in the list that occur after the marker. To get the next page of the list, set this field's value to the value of `NextMarker` from the current page's response.
        max-items: The maximum number of origin access controls that you want in the response.
