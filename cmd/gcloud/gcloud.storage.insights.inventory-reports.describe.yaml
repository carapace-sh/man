name: describe
description: Describe an inventory report config.
flags:
    --location=: Google Cloud location for the report-config.
documentation:
    command: |
        Describe an inventory report config.
    flag:
        location: |-
            Google Cloud location for the report-config.
            +
            To set the `location` attribute:
            * provide the argument `report_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
