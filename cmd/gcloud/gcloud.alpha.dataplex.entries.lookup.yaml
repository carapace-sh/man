name: lookup
description: '*(ALPHA)*  Lookup a Dataplex entry.'
flags:
    --aspect-types=: Limits the aspects returned to the provided aspect types.
    --entry-group=: Entry group containing Dataplex Entries.
    --location=: Location of the Dataplex resource.
    --paths=: Limits the aspects returned to those associated with the provided paths within the Entry.
    --view=: Controls which parts of an entry are to be returned.
completion:
    flag:
        view:
            - all
            - basic
            - custom
            - full
documentation:
    command: |
        *(ALPHA)*  Lookup a Dataplex entry.

        Displays the details of a Dataplex entry resource given a valid entry ID.
        Unlike `describe`, where the Dataplex permission is required for access, for `lookup` the
        permission from the original source system is required on the entry instead. For example, if
        the source is a BigQuery table, you need the `bigquery.tables.get` permission to lookup an
        entry.
    flag:
        aspect-types: |-
            Limits the aspects returned to the provided aspect types.
            Only works if the `--view=custom` is selected.
            +
            For example, if two aspect types are specified:
            "projects/projectA/locations/us-central1/my-aspect-type,projects/projectB/locations/us/my-aspect-type2"
            then only aspects matching these aspect types will be returned.
            +
            Can be further constrained by the `--paths` argument.
        entry-group: |-
            Entry group containing Dataplex Entries.
            +

            To set the `entry-group` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--entry-group` on the command line.
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        paths: |-
            Limits the aspects returned to those associated with the provided paths within the Entry.
            Only works if the `--view=custom` is selected.
            +
            For example, if two paths are specified:
            "--paths=property1,property2"
            then only aspects on these paths will be returned.
            +
            To return aspects without any path, the empty (root) path can be specified. For this "." can be
            used. For example, when "--paths=.,property1" are specified, then only aspects on the path
            "property1" and on the entry itself will be returned.
            +
            Can be further constrained by `--aspect-types` argument.
        view: |-
            Controls which parts of an entry are to be returned. _VIEW_ must be one of:
            +
            *all*::: Returns all aspects.
            If the number of aspects would exceed 100, the first 100 will be returned.
            +
            *basic*::: Returns entry only, without aspects.
            *custom*::: Returns aspects filtered based on `--aspect-types` AND `--paths` arguments specified.
            When used, at least one of `--aspect-types` and `--paths` arguments must be specified.
            If the number of aspects would exceed 100, the first 100 will be returned.
            +
            *full*::: Default value. Returns all required aspects, as well as the keys of all non-required aspects.
            +
            :::
            +
