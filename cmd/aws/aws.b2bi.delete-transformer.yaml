name: delete-transformer
description: Deletes the specified transformer.
flags:
    --transformer-id=!: Specifies the system-assigned unique identifier for the transformer.
documentation:
    command: Deletes the specified transformer. A transformer can take an EDI file as input and transform it into a JSON-or XML-formatted document. Alternatively, a transformer can take a JSON-or XML-formatted document as input and transform it into an EDI file.
    flag:
        transformer-id: Specifies the system-assigned unique identifier for the transformer.
