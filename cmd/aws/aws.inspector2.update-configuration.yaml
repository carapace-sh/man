name: update-configuration
description: Updates setting configurations for your Amazon Inspector account.
flags:
    --ec2-configuration=: Specifies how the Amazon EC2 automated scan will be updated for your environment.
    --ecr-configuration=: Specifies how the ECR automated re-scan will be updated for your environment.
documentation:
    command: Updates setting configurations for your Amazon Inspector account. When you use this API as an Amazon Inspector delegated administrator this updates the setting for all accounts you manage. Member accounts in an organization cannot update this setting.
    flag:
        ec2-configuration: Specifies how the Amazon EC2 automated scan will be updated for your environment.
        ecr-configuration: Specifies how the ECR automated re-scan will be updated for your environment.
