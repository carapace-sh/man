name: delete-application-cloud-watch-logging-option
description: Deletes an Amazon CloudWatch log stream from an SQL-based Kinesis Data Analytics application.
flags:
    --application-name=!: The application name.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cloud-watch-logging-option-id=!: The `CloudWatchLoggingOptionId` of the Amazon CloudWatch logging option to delete.
    --conditional-token=: A value you use to implement strong concurrency for application updates.
    --current-application-version-id=: The version ID of the application.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: Deletes an Amazon CloudWatch log stream from an SQL-based Kinesis Data Analytics application.
    flag:
        application-name: The application name.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cloud-watch-logging-option-id: The `CloudWatchLoggingOptionId` of the Amazon CloudWatch logging option to delete. You can get the `CloudWatchLoggingOptionId` by using the [DescribeApplication]() operation.
        conditional-token: A value you use to implement strong concurrency for application updates. You must provide the `CurrentApplicationVersionId` or the `ConditionalToken`. You get the application's current `ConditionalToken` using [DescribeApplication](). For better concurrency support, use the `ConditionalToken` parameter instead of `CurrentApplicationVersionId`.
        current-application-version-id: The version ID of the application. You must provide the `CurrentApplicationVersionId` or the `ConditionalToken`. You can retrieve the application version ID using [DescribeApplication](). For better concurrency support, use the `ConditionalToken` parameter instead of `CurrentApplicationVersionId`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
