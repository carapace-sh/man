name: create
description: Create a Cloud Security Command Center (SCC) IaC Validation Report.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --tf-plan-file=!: Path to a JSON file containing the IaC plan to be validated.
documentation:
    command: |
        Create a  Cloud Security Command Center (SCC) IaC Validation Report. First argument is the
        parent of the IaC defined in the plan file. It is followed by path of the terraform plan
        file in JSON format.

        LRO operation ID is returned as the response of the command.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        tf-plan-file: Path to a JSON file containing the IaC plan to be validated. Use a full or relative path to a local file containing the value of tf_plan_file.
