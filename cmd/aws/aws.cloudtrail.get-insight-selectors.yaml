name: get-insight-selectors
description: Describes the settings for the Insights event selectors that you configured for your trail or event data store.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --event-data-store=: Specifies the ARN (or ID suffix of the ARN) of the event data store for which you want to get Insights selectors.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --trail-name=: Specifies the name of the trail or trail ARN.
documentation:
    command: |-
        Describes the settings for the Insights event selectors that you configured for your trail or event data store. `GetInsightSelectors` shows if CloudTrail Insights logging is enabled and which Insights types are configured with corresponding event categories. If you run `GetInsightSelectors` on a trail or event data store that does not have Insights events enabled, the operation throws the exception `InsightNotEnabledException`

        Specify either the `EventDataStore` parameter to get Insights event selectors for an event data store, or the `TrailName` parameter to the get Insights event selectors for a trail. You cannot specify these parameters together.

        For more information, see [Working with CloudTrail Insights](https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-insights-events-with-cloudtrail.html) in the *CloudTrail User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        event-data-store: |-
            Specifies the ARN (or ID suffix of the ARN) of the event data store for which you want to get Insights selectors.

            You cannot use this parameter with the `TrailName` parameter.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        trail-name: |-
            Specifies the name of the trail or trail ARN. If you specify a trail name, the string must meet the following requirements:

            - Contain only ASCII letters (a-z, A-Z), numbers (0-9), periods (.), underscores (\_), or dashes (-)
            - Start with a letter or number, and end with a letter or number
            - Be between 3 and 128 characters
            - Have no adjacent periods, underscores or dashes. Names like `my-_namespace` and `my--namespace` are not valid.
            - Not be in IP address format (for example, 192.168.5.4)

            If you specify a trail ARN, it must be in the format:

            `arn:aws:cloudtrail:us-east-2:123456789012:trail/MyTrail`

            You cannot use this parameter with the `EventDataStore` parameter.
