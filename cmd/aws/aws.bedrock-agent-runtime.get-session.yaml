name: get-session
description: Retrieves details about a specific session.
flags:
    --session-identifier=!: A unique identifier for the session to retrieve.
documentation:
    command: Retrieves details about a specific session. For more information about sessions, see [Store and retrieve conversation history and context with Amazon Bedrock sessions](https://docs.aws.amazon.com/bedrock/latest/userguide/sessions.html).
    flag:
        session-identifier: A unique identifier for the session to retrieve. You can specify either the session's `sessionId` or its Amazon Resource Name (ARN).
