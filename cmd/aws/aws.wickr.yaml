        --user-id=!: The ID of the user whose devices will be reset.
      documentation:
        command: Resets multiple devices for a specific user in a Wickr network. This operation forces the selected devices to log out and requires users to re-authenticate, which is useful for security purposes or when devices need to be revoked.
