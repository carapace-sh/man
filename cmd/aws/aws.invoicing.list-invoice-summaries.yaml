name: list-invoice-summaries
description: Retrieves your invoice details programmatically, without line item details.
flags:
    --filter=: Filters you can use to customize your invoice summary.
    --max-results=: The maximum number of invoice summaries a paginated response can contain.
    --next-token=: The token to retrieve the next set of results.
    --selector=!: The option to retrieve details for a specific invoice by providing its unique ID.
documentation:
    command: Retrieves your invoice details programmatically, without line item details.
    flag:
        filter: Filters you can use to customize your invoice summary.
        max-results: The maximum number of invoice summaries a paginated response can contain.
        next-token: The token to retrieve the next set of results. Amazon Web Services provides the token when the response from a previous call has more results than the maximum page size.
        selector: The option to retrieve details for a specific invoice by providing its unique ID. Alternatively, access information for all invoices linked to the account by providing an account ID.
