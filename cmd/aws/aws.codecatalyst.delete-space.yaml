name: delete-space
description: Deletes a space.
flags:
    --name=!: The name of the space.
documentation:
    command: |-
        Deletes a space.

        Deleting a space cannot be undone. Additionally, since space names must be unique across Amazon CodeCatalyst, you cannot reuse names of deleted spaces.
    flag:
        name: The name of the space. To retrieve a list of space names, use [ListSpaces]().
