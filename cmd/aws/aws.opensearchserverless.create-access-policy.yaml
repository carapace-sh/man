name: create-access-policy
description: Creates a data access policy for OpenSearch Serverless.
flags:
    --client-token=: Unique, case-sensitive identifier to ensure idempotency of the request.
    --description=: A description of the policy.
    --name=!: The name of the policy.
    --policy=!: The JSON policy document to use as the content for the policy.
    --type=!: The type of policy.
completion:
    flag:
        type:
            - data
documentation:
    command: Creates a data access policy for OpenSearch Serverless. Access policies limit access to collections and the resources within them, and allow a user to access that data irrespective of the access mechanism or network source. For more information, see [Data access control for Amazon OpenSearch Serverless](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-data-access.html).
    flag:
        client-token: Unique, case-sensitive identifier to ensure idempotency of the request.
        description: A description of the policy. Typically used to store information about the permissions defined in the policy.
        name: The name of the policy.
        policy: The JSON policy document to use as the content for the policy.
        type: The type of policy.
