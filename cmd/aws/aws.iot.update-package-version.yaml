name: update-package-version
description: Updates the supported fields for a specific package version.
flags:
    --action=: The status that the package version should be assigned.
    --artifact=: The various components that make up a software package version.
    --attributes=: Metadata that can be used to define a package version’s configuration.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --description=: The package version description.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --package-name=!: The name of the associated software package.
    --recipe=: The inline job document associated with a software package version used for a quick job deployment.
    --version-name=!: The name of the target package version.
completion:
    flag:
        action:
            - PUBLISH
            - DEPRECATE
documentation:
    command: |-
        Updates the supported fields for a specific package version.

        Requires permission to access the [UpdatePackageVersion](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) and [GetIndexingConfiguration](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) actions.
    flag:
        action: The status that the package version should be assigned. For more information, see [Package version lifecycle](https://docs.aws.amazon.com/iot/latest/developerguide/preparing-to-use-software-package-catalog.html#package-version-lifecycle).
        artifact: The various components that make up a software package version.
        attributes: |-
            Metadata that can be used to define a package version’s configuration. For example, the Amazon S3 file location, configuration options that are being sent to the device or fleet.

            **Note:** Attributes can be updated only when the package version is in a draft state.

            The combined size of all the attributes on a package version is limited to 3KB.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        description: The package version description.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        package-name: The name of the associated software package.
        recipe: The inline job document associated with a software package version used for a quick job deployment.
        version-name: The name of the target package version.
