name: get-findings-statistics
description: Lists GuardDuty findings statistics for the specified detector ID.
flags:
    --detector-id=!: The ID of the detector whose findings statistics you want to retrieve.
    --finding-criteria=: Represents the criteria that is used for querying findings.
    --finding-statistic-types=: The types of finding statistics to retrieve.
    --group-by=: Displays the findings statistics grouped by one of the listed valid values.
    --max-results=: The maximum number of results to be returned in the response.
    --order-by=: Displays the sorted findings in the requested order.
completion:
    flag:
        group-by:
            - ACCOUNT
            - DATE
            - FINDING_TYPE
            - RESOURCE
            - SEVERITY
        order-by:
            - ASC
            - DESC
documentation:
    command: |-
        Lists GuardDuty findings statistics for the specified detector ID.

        You must provide either `findingStatisticTypes` or `groupBy` parameter, and not both. You can use the `maxResults` and `orderBy` parameters only when using `groupBy`.

        There might be regional differences because some flags might not be available in all the Regions where GuardDuty is currently supported. For more information, see [Regions and endpoints](https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_regions.html).
    flag:
        detector-id: |-
            The ID of the detector whose findings statistics you want to retrieve.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        finding-criteria: Represents the criteria that is used for querying findings.
        finding-statistic-types: The types of finding statistics to retrieve.
        group-by: Displays the findings statistics grouped by one of the listed valid values.
        max-results: |-
            The maximum number of results to be returned in the response. The default value is 25.

            You can use this parameter only with the `groupBy` parameter.
        order-by: |-
            Displays the sorted findings in the requested order. The default value of `orderBy` is `DESC`.

            You can use this parameter only with the `groupBy` parameter.
