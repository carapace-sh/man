name: delete-access-control-configuration
description: Deletes an access control configuration that you created for your documents in an index.
flags:
    --id=!: The identifier of the access control configuration you want to delete.
    --index-id=!: The identifier of the index for an access control configuration.
documentation:
    command: Deletes an access control configuration that you created for your documents in an index. This includes user and group access information for your documents. This is useful for user context filtering, where search results are filtered based on the user or their group access to documents.
    flag:
        id: The identifier of the access control configuration you want to delete.
        index-id: The identifier of the index for an access control configuration.
