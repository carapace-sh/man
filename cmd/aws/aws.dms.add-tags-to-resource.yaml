name: add-tags-to-resource
description: Adds metadata tags to an DMS resource, including replication instance, endpoint, subnet group, and migration task.
flags:
    --resource-arn=!: Identifies the DMS resource to which tags should be added.
    --tags=!: One or more tags to be assigned to the resource.
documentation:
    command: Adds metadata tags to an DMS resource, including replication instance, endpoint, subnet group, and migration task. These tags can also be used with cost allocation reporting to track cost associated with DMS resources, or used in a Condition statement in an IAM policy for DMS. For more information, see [`Tag`](https://docs.aws.amazon.com/dms/latest/APIReference/API_Tag.html) data type description.
    flag:
        resource-arn: |-
            Identifies the DMS resource to which tags should be added. The value for this parameter is an Amazon Resource Name (ARN).

            For DMS, you can tag a replication instance, an endpoint, or a replication task.
        tags: One or more tags to be assigned to the resource.
