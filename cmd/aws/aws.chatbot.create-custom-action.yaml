name: create-custom-action
description: Creates a custom action that can be invoked as an alias or as a button on a notification.
flags:
    --action-name=!: The name of the custom action.
    --alias-name=: The name used to invoke this action in a chat channel.
    --attachments=: Defines when this custom action button should be attached to a notification.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --definition=!: The definition of the command to run when invoked as an alias or as an action button.
    --tags=: A map of tags assigned to a resource.
documentation:
    command: Creates a custom action that can be invoked as an alias or as a button on a notification.
    flag:
        action-name: The name of the custom action. This name is included in the Amazon Resource Name (ARN).
        alias-name: The name used to invoke this action in a chat channel. For example, `@aws run my-alias`.
        attachments: Defines when this custom action button should be attached to a notification.
        client-token: |-
            A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, subsequent retries with the same client token returns the result from the original successful request.

            If you do not specify a client token, one is automatically generated by the SDK.
        definition: The definition of the command to run when invoked as an alias or as an action button.
        tags: A map of tags assigned to a resource. A tag is a string-to-string map of key-value pairs.
