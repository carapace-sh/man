name: describe-client-authentication-settings
description: Retrieves information about the type of client authentication for the specified directory, if the type is specified.
flags:
    --directory-id=!: The identifier of the directory for which to retrieve information.
    --limit=: The maximum number of items to return.
    --next-token=: The *DescribeClientAuthenticationSettingsResult.NextToken* value from a previous call to [DescribeClientAuthenticationSettings]().
    --type=: The type of client authentication for which to retrieve information.
completion:
    flag:
        type:
            - SmartCard
            - SmartCardOrPassword
documentation:
    command: Retrieves information about the type of client authentication for the specified directory, if the type is specified. If no type is specified, information about all client authentication types that are supported for the specified directory is retrieved. Currently, only `SmartCard` is supported.
    flag:
        directory-id: The identifier of the directory for which to retrieve information.
        limit: The maximum number of items to return. If this value is zero, the maximum number of items is specified by the limitations of the operation.
        next-token: The *DescribeClientAuthenticationSettingsResult.NextToken* value from a previous call to [DescribeClientAuthenticationSettings](). Pass null if this is the first call.
        type: The type of client authentication for which to retrieve information. If no type is specified, a list of all client authentication types that are supported for the specified directory is retrieved.
