name: update
description: Update a Cloud Healthcare API DICOM store.
flags:
    --dataset=: Cloud Healthcare dataset.
    --location=: Google Cloud location.
    --no-send-for-bulk-import&: Indicates whether or not to send Cloud Pub/Sub notifications on bulk import.
    --pubsub-topic=: Google Cloud Pub/Sub topic to send updates to.
    --send-for-bulk-import: Indicates whether or not to send Cloud Pub/Sub notifications on bulk import.
    --stream-configs=: Configuration that indicates the BigQuery destinations for streaming instances of a DICOM store.
documentation:
    command: Update a Cloud Healthcare API DICOM store.
    flag:
        dataset: |-
            Cloud Healthcare dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `dicom_store` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `dicom_store` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
        no-send-for-bulk-import: |
            Indicates whether or not to send Cloud Pub/Sub notifications on bulk import.
            Only supported for DICOM imports.
        pubsub-topic: |-
            Google Cloud Pub/Sub topic to send updates to.
            +
            Note: A topic must be created before publishing or subscribing to it. For instructions
            on creating topics, refer to: https://cloud.google.com/pubsub/docs/admin#create_a_topic
        send-for-bulk-import: |-
            Indicates whether or not to send Cloud Pub/Sub notifications on bulk import.
            Only supported for DICOM imports.
        stream-configs: Configuration that indicates the BigQuery destinations for streaming instances of a DICOM store. To specify StreamConfigs, list all BigQuery destinations into one string separated by comma. (e.g., --stream-configs bq://{bigqueryProjectId1}.{bigqueryDatasetId1}.{bigqueryTableId1},bq://{bigqueryProjectId2}.{bigqueryDatasetId2}.{bigqueryTableId2}).
