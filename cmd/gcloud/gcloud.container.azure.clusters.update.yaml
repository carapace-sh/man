name: update
description: '*(DEPRECATED)*  Update an Anthos cluster on Azure.'
flags:
    --admin-groups=: Groups of users that can perform operations as a cluster administrator.
    --admin-users=: Users that can perform operations as a cluster administrator.
    --annotations=: Annotations for the cluster.
    --async: Return immediately, without waiting for the operation in progress to
    --azure-application-id=: ID of the Azure Application to manage Azure resources.
    --azure-tenant-id=: ID of the Azure Tenant to manage Azure resources.
    --clear-annotations: Clear the annotations for the cluster.
    --clear-client: Clear the Azure client.
    --clear-description: Clear the description for the cluster.
    --client=!: ID of the client or fully qualified identifier for the client.
    --cluster-version=: Kubernetes version to use for the cluster.
    --description=: Description for the cluster.
    --disable-managed-prometheus: Disable managed collection for Managed Service for Prometheus.
    --enable-managed-prometheus: Enable managed collection for Managed Service for Prometheus.
    --location=: Google Cloud location for the cluster.
    --logging=: Set the components that have logging enabled.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-annotations&: Clear the annotations for the cluster.
    --no-clear-client&: Clear the Azure client.
    --no-clear-description&: Clear the description for the cluster.
    --no-disable-managed-prometheus&: Disable managed collection for Managed Service for Prometheus.
    --no-enable-managed-prometheus&: Enable managed collection for Managed Service for Prometheus.
    --no-validate-only&: Validate the update of the cluster, but don't actually perform it.
    --ssh-public-key=: SSH public key to use for authentication.
    --validate-only: Validate the update of the cluster, but don't actually perform it.
    --vm-size=: Azure Virtual Machine Size (e.g. Standard_DS1_v).
documentation:
    command: |+
        *(DEPRECATED)*  Update an Anthos cluster on Azure.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/azure/deprecations/deprecation-announcement for more details.

    flag:
        admin-groups: Groups of users that can perform operations as a cluster administrator.
        admin-users: Users that can perform operations as a cluster administrator.
        annotations: Annotations for the cluster.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        azure-application-id: ID of the Azure Application to manage Azure resources.
        azure-tenant-id: ID of the Azure Tenant to manage Azure resources.
        clear-annotations: Clear the annotations for the cluster.
        clear-client: Clear the Azure client. This flag is required when updating to use Azure workload identity federation from Azure client to manage  Azure resources.
        clear-description: Clear the description for the cluster.
        client: |-
            ID of the client or fully qualified identifier for the client.
            +
            To set the `client` attribute:
            * provide the argument `--client` on the command line.
        cluster-version: Kubernetes version to use for the cluster.
        description: Description for the cluster.
        disable-managed-prometheus: Disable managed collection for Managed Service for Prometheus.
        enable-managed-prometheus: Enable managed collection for Managed Service for Prometheus.
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_azure/location`.
        logging: |-
            Set the components that have logging enabled.
            +
            Examples:
            +
              $ {command} --logging=SYSTEM
              $ {command} --logging=SYSTEM,WORKLOAD
            +
            _COMPONENT_ must be one of: *SYSTEM*, *WORKLOAD*.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-annotations: Clear the annotations for the cluster.
        no-clear-client: Clear the Azure client. This flag is required when updating to use Azure workload identity federation from Azure client to manage  Azure resources.
        no-clear-description: Clear the description for the cluster.
        no-disable-managed-prometheus: Disable managed collection for Managed Service for Prometheus.
        no-enable-managed-prometheus: Enable managed collection for Managed Service for Prometheus.
        no-validate-only: Validate the update of the cluster, but don't actually perform it.
        ssh-public-key: SSH public key to use for authentication.
        validate-only: Validate the update of the cluster, but don't actually perform it.
        vm-size: Azure Virtual Machine Size (e.g. Standard_DS1_v).
