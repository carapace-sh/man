name: authorize-data-share
description: From a data producer account, authorizes the sharing of a datashare with one or more consumer accounts or managing entities.
flags:
    --allow-writes: If set to true, allows write operations for a datashare.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --consumer-identifier=!: The identifier of the data consumer that is authorized to access the datashare.
    --data-share-arn=!: The Amazon Resource Name (ARN) of the datashare namespace that producers are to authorize sharing for.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-allow-writes: If set to true, allows write operations for a datashare.
documentation:
    command: From a data producer account, authorizes the sharing of a datashare with one or more consumer accounts or managing entities. To authorize a datashare for a data consumer, the producer account must have the correct access permissions.
    flag:
        allow-writes: If set to true, allows write operations for a datashare.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        consumer-identifier: The identifier of the data consumer that is authorized to access the datashare. This identifier is an Amazon Web Services account ID or a keyword, such as ADX.
        data-share-arn: The Amazon Resource Name (ARN) of the datashare namespace that producers are to authorize sharing for.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
