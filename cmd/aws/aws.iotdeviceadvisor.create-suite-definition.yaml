name: create-suite-definition
description: Creates a Device Advisor test suite.
flags:
    --client-token=: The client token for the test suite definition creation.
    --suite-definition-configuration=!: Creates a Device Advisor test suite with suite definition configuration.
    --tags=: The tags to be attached to the suite definition.
documentation:
    command: |-
        Creates a Device Advisor test suite.

        Requires permission to access the [CreateSuiteDefinition](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        client-token: The client token for the test suite definition creation. This token is used for tracking test suite definition creation using retries and obtaining its status. This parameter is optional.
        suite-definition-configuration: Creates a Device Advisor test suite with suite definition configuration.
        tags: The tags to be attached to the suite definition.
