name: list-studios
description: Returns a list of all Amazon EMR Studios associated with the Amazon Web Services account.
flags:
    --marker=: The pagination token that indicates the set of results to retrieve.
documentation:
    command: Returns a list of all Amazon EMR Studios associated with the Amazon Web Services account. The list includes details such as ID, Studio Access URL, and creation time for each Studio.
    flag:
        marker: The pagination token that indicates the set of results to retrieve.
