    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --host-key-id=!: The identifier of the host key that you are updating.
    --server-id=!: The identifier of the server that contains the host key that you are updating.
documentation:
    command: Updates the description for the host key that's specified by the `ServerId` and `HostKeyId` parameters.
