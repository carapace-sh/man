name: describe-rule-group-summary
description: Returns detailed information for a stateful rule group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --rule-group-arn=: Required.
    --rule-group-name=: The descriptive name of the rule group.
    --type=: The type of rule group you want a summary for.
completion:
    flag:
        type:
            - STATELESS
            - STATEFUL
documentation:
    command: |-
        Returns detailed information for a stateful rule group.

        For active threat defense Amazon Web Services managed rule groups, this operation provides insight into the protections enabled by the rule group, based on Suricata rule metadata fields. Summaries are available for rule groups you manage and for active threat defense Amazon Web Services managed rule groups.

        To modify how threat information appears in summaries, use the `SummaryConfiguration` parameter in [UpdateRuleGroup]().
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        rule-group-arn: |-
            Required. The Amazon Resource Name (ARN) of the rule group.

            You must specify the ARN or the name, and you can specify both.
        rule-group-name: |-
            The descriptive name of the rule group. You can't change the name of a rule group after you create it.

            You must specify the ARN or the name, and you can specify both.
        type: |-
            The type of rule group you want a summary for. This is a required field.

            Valid value: `STATEFUL`

            Note that `STATELESS` exists but is not currently supported. If you provide `STATELESS`, an exception is returned.
