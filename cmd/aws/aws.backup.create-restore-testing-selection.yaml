name: create-restore-testing-selection
description: This request can be sent after CreateRestoreTestingPlan request returns successfully.
flags:
    --creator-request-id=: This is an optional unique string that identifies the request and allows failed requests to be retried without the risk of running the operation twice.
    --restore-testing-plan-name=!: Input the restore testing plan name that was returned from the related CreateRestoreTestingPlan request.
    --restore-testing-selection=!: 'This consists of `RestoreTestingSelectionName`, `ProtectedResourceType`, and one of the following:'
documentation:
    command: |-
        This request can be sent after CreateRestoreTestingPlan request returns successfully. This is the second part of creating a resource testing plan, and it must be completed sequentially.

        This consists of `RestoreTestingSelectionName`, `ProtectedResourceType`, and one of the following:

        - `ProtectedResourceArns`
        - `ProtectedResourceConditions`

        Each protected resource type can have one single value.

        A restore testing selection can include a wildcard value ("\*") for `ProtectedResourceArns` along with `ProtectedResourceConditions`. Alternatively, you can include up to 30 specific protected resource ARNs in `ProtectedResourceArns`.

        Cannot select by both protected resource types AND specific ARNs. Request will fail if both are included.
    flag:
        creator-request-id: This is an optional unique string that identifies the request and allows failed requests to be retried without the risk of running the operation twice. If used, this parameter must contain 1 to 50 alphanumeric or '-\_.' characters.
        restore-testing-plan-name: Input the restore testing plan name that was returned from the related CreateRestoreTestingPlan request.
        restore-testing-selection: |-
            This consists of `RestoreTestingSelectionName`, `ProtectedResourceType`, and one of the following:

            - `ProtectedResourceArns`
            - `ProtectedResourceConditions`

            Each protected resource type can have one single value.

            A restore testing selection can include a wildcard value ("\*") for `ProtectedResourceArns` along with `ProtectedResourceConditions`. Alternatively, you can include up to 30 specific protected resource ARNs in `ProtectedResourceArns`.
