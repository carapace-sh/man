name: get-user-id
description: Retrieves the `UserId` in an identity store.
flags:
    --alternate-identifier=!: A unique identifier for a user or group that is not the primary identifier.
    --identity-store-id=!: The globally unique identifier for the identity store.
documentation:
    command: |-
        Retrieves the `UserId` in an identity store.

        If you have access to a member account, you can use this API operation from the member account. For more information, see [Limiting access to the identity store from member accounts](https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-accounts.html#limiting-access-from-member-accounts) in the *IAM Identity Center User Guide*.
    flag:
        alternate-identifier: A unique identifier for a user or group that is not the primary identifier. This value can be an identifier from an external identity provider (IdP) that is associated with the user, the group, or a unique attribute. For the unique attribute, the only valid paths are `userName` and `emails.value`.
        identity-store-id: The globally unique identifier for the identity store.
