name: delete
description: '*(ALPHA)*  Delete a Database Migration Service migration job.'
flags:
    --force: The destination Cloud SQL connection profile is always deleted with the
    --no-force&: The destination Cloud SQL connection profile is always deleted with the
    --region=: The name of the region.
documentation:
    command: |
        *(ALPHA)*  Delete a Database Migration Service migration job.
    flag:
        force: |-
            The destination Cloud SQL connection profile is always deleted with the
            migration job. In case of force delete, the destination Cloud SQL replica
            database is also deleted.
        no-force: |
            The destination Cloud SQL connection profile is always deleted with the
            migration job. In case of force delete, the destination Cloud SQL replica
            database is also deleted.
        region: |-
            The name of the region.
            +
            To set the `region` attribute:
            * provide the argument `migration_job` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
