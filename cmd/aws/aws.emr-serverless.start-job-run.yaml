name: start-job-run
description: Starts a job run.
flags:
    --application-id=!: The ID of the application on which to run the job.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: The client idempotency token of the job run to start.
    --configuration-overrides=: The configuration overrides for the job run.
    --execution-iam-policy=: You can pass an optional IAM policy.
    --execution-role-arn=!: The execution role ARN for the job run.
    --execution-timeout-minutes=: The maximum duration for the job run to run.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-driver=: The job driver for the job run.
    --mode=: The mode of the job run when it starts.
    --name=: The optional job run name.
    --retry-policy=: The retry policy when job run starts.
    --tags=: The tags assigned to the job run.
completion:
    flag:
        mode:
            - BATCH
            - STREAMING
documentation:
    command: Starts a job run.
    flag:
        application-id: The ID of the application on which to run the job.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The client idempotency token of the job run to start. Its value must be unique for each request.
        configuration-overrides: The configuration overrides for the job run.
        execution-iam-policy: You can pass an optional IAM policy. The resulting job IAM role permissions will be an intersection of this policy and the policy associated with your job execution role.
        execution-role-arn: The execution role ARN for the job run.
        execution-timeout-minutes: The maximum duration for the job run to run. If the job run runs beyond this duration, it will be automatically cancelled.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-driver: The job driver for the job run.
        mode: The mode of the job run when it starts.
        name: The optional job run name. This doesn't have to be unique.
        retry-policy: The retry policy when job run starts.
        tags: The tags assigned to the job run.
