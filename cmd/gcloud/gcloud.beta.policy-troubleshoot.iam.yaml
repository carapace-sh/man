name: iam
description: '*(BETA)*  Troubleshoot the IAM Policy.'
flags:
    --destination-ip=: The request destination IP address to use when checking conditional bindings.
    --destination-port=: The request destination port to use when checking conditional bindings.
    --permission=!: Cloud IAM permission to check, e.g. "resourcemanager.projects.get".
    --principal-email=!: Email address that identifies the principal to check.
    --request-time=: The request timestamp to use when checking conditional bindings.
    --resource-name=: The resource name value to use when checking conditional bindings.
    --resource-service=: The resource service value to use when checking conditional bindings.
    --resource-type=: The resource type value to use when checking conditional bindings.
documentation:
    command: |
        *(BETA)*  Performs a check on whether a principal is granted a
        permission on a resource and how that access is determined according to
        the resource's effective IAM policy interpretation.
    flag:
        destination-ip: The request destination IP address to use when checking conditional bindings. For example, `198.1.1.1`.
        destination-port: The request destination port to use when checking conditional bindings. For example, 8080.
        permission: Cloud IAM permission to check, e.g. "resourcemanager.projects.get".
        principal-email: |-
            Email address that identifies the principal to check. Only Google Accounts and
            service accounts are supported.
        request-time: |-
            The request timestamp to use when checking conditional bindings. This string must adhere to UTC format
            (RFC 3339). For example,2021-01-01T00:00:00Z. See:
            https://tools.ietf.org/html/rfc3339
        resource-name: |-
            The resource name value to use when checking conditional bindings.
            See:  https://cloud.google.com/iam/docs/conditions-resource-attributes#resource-name.
        resource-service: |-
            The resource service value to use when checking conditional bindings.
            See: https://cloud.google.com/iam/docs/conditions-resource-attributes#resource-service
        resource-type: |-
            The resource type value to use when checking conditional bindings.
            See: https://cloud.google.com/iam/docs/conditions-resource-attributes#resource-type
