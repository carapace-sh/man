name: set-drained-zones
description: '*(ALPHA)*  Sets the zone drains for an instance.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --drains=!: A list of zone drains to set.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Sets a list of zones to drain for an instance. Draining a zone prevents tasks from being
        scheduled there. Zone can be drained fully or partially, with higher drain percentage
        preventing more tasks from being scheduled there.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        drains: A list of zone drains to set.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
