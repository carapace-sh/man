name: create-key-signing-key
description: Creates a new key-signing key (KSK) associated with a hosted zone.
flags:
    --caller-reference=!: A unique string that identifies the request.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hosted-zone-id=!: The unique string (ID) used to identify a hosted zone.
    --key-management-service-arn=!: The Amazon resource name (ARN) for a customer managed key in Key Management Service (KMS).
    --name=!: A string used to identify a key-signing key (KSK).
    --status=!: A string specifying the initial status of the key-signing key (KSK).
documentation:
    command: Creates a new key-signing key (KSK) associated with a hosted zone. You can only have two KSKs per hosted zone.
    flag:
        caller-reference: A unique string that identifies the request.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hosted-zone-id: The unique string (ID) used to identify a hosted zone.
        key-management-service-arn: |-
            The Amazon resource name (ARN) for a customer managed key in Key Management Service (KMS). The `KeyManagementServiceArn` must be unique for each key-signing key (KSK) in a single hosted zone. To see an example of `KeyManagementServiceArn` that grants the correct permissions for DNSSEC, scroll down to **Example**.

            You must configure the customer managed customer managed key as follows:

            Status

            Enabled

            Key spec

            ECC\_NIST\_P256

            Key usage

            Sign and verify

            Key policy

            The key policy must give permission for the following actions:

            - DescribeKey
            - GetPublicKey
            - Sign

            The key policy must also include the Amazon Route 53 service in the principal for your account. Specify the following:

            - `"Service": "dnssec-route53.amazonaws.com"`

            For more information about working with a customer managed key in KMS, see [Key Management Service concepts](https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html).
        name: A string used to identify a key-signing key (KSK). `Name` can include numbers, letters, and underscores (\_). `Name` must be unique for each key-signing key in the same hosted zone.
        status: A string specifying the initial status of the key-signing key (KSK). You can set the value to `ACTIVE` or `INACTIVE`.
