name: batch-get-crawlers
description: Returns a list of resource metadata for a given list of crawler names.
flags:
    --crawler-names=!: A list of crawler names, which might be the names returned from the `ListCrawlers` operation.
documentation:
    command: Returns a list of resource metadata for a given list of crawler names. After calling the `ListCrawlers` operation, you can call this operation to access the data to which you have been granted permissions. This operation supports all IAM permissions, including permission conditions that uses tags.
    flag:
        crawler-names: A list of crawler names, which might be the names returned from the `ListCrawlers` operation.
