name: create-target-group
description: Creates a target group.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --config=: The target group configuration.
    --name=!: The name of the target group.
    --tags=: The tags for the target group.
    --type=!: The type of target group.
completion:
    flag:
        type:
            - IP
            - LAMBDA
            - INSTANCE
            - ALB
documentation:
    command: |-
        Creates a target group. A target group is a collection of targets, or compute resources, that run your application or service. A target group can only be used by a single service.

        For more information, see [Target groups](https://docs.aws.amazon.com/vpc-lattice/latest/ug/target-groups.html) in the *Amazon VPC Lattice User Guide*.
    flag:
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you retry a request that completed successfully using the same client token and parameters, the retry succeeds without performing any actions. If the parameters aren't identical, the retry fails.
        config: The target group configuration.
        name: The name of the target group. The name must be unique within the account. The valid characters are a-z, 0-9, and hyphens (-). You can't use a hyphen as the first or last character, or immediately after another hyphen.
        tags: The tags for the target group.
        type: The type of target group.
