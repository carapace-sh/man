name: describe-snomedctinference-job
description: Gets the properties associated with an InferSNOMEDCT job.
flags:
    --job-id=!: The identifier that Amazon Comprehend Medical generated for the job.
documentation:
    command: Gets the properties associated with an InferSNOMEDCT job. Use this operation to get the status of an inference job.
    flag:
        job-id: The identifier that Amazon Comprehend Medical generated for the job. The StartSNOMEDCTInferenceJob operation returns this identifier in its response.
