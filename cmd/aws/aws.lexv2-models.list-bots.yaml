name: list-bots
description: Gets a list of available bots.
flags:
    --filters=: Provides the specification of a filter used to limit the bots in the response to only those that match the filter specification.
    --max-results=: The maximum number of bots to return in each page of results.
    --next-token=: If the response from the `ListBots` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response.
    --sort-by=: Specifies sorting parameters for the list of bots.
documentation:
    command: Gets a list of available bots.
    flag:
        filters: Provides the specification of a filter used to limit the bots in the response to only those that match the filter specification. You can only specify one filter and one string to filter on.
        max-results: The maximum number of bots to return in each page of results. If there are fewer results than the maximum page size, only the actual number of results are returned.
        next-token: |-
            If the response from the `ListBots` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response.

            Use the returned token in the `nextToken` parameter of a `ListBots` request to return the next page of results. For a complete set of results, call the `ListBots` operation until the `nextToken` returned in the response is null.
        sort-by: Specifies sorting parameters for the list of bots. You can specify that the list be sorted by bot name in ascending or descending order.
