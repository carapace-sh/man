name: describe-reserved-dbinstances
description: Returns information about reserved DB instances for this account, or about a specified reserved DB instance.
flags:
    --dbinstance-class=: The DB instance class filter value.
    --duration=: The duration filter value, specified in years or seconds.
    --filters=: This parameter isn't currently supported.
    --lease-id=: The lease identifier filter value.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
    --multi-az=: Specifies whether to show only those reservations that support Multi-AZ.
    --offering-type=: The offering type filter value.
    --product-description=: The product description filter value.
    --reserved-dbinstance-id=: The reserved DB instance identifier filter value.
    --reserved-dbinstances-offering-id=: The offering identifier filter value.
documentation:
    command: Returns information about reserved DB instances for this account, or about a specified reserved DB instance.
    flag:
        dbinstance-class: The DB instance class filter value. Specify this parameter to show only those reservations matching the specified DB instances class.
        duration: |-
            The duration filter value, specified in years or seconds. Specify this parameter to show only reservations for this duration.

            Valid Values: `1 | 3 | 31536000 | 94608000`
        filters: This parameter isn't currently supported.
        lease-id: |-
            The lease identifier filter value. Specify this parameter to show only the reservation that matches the specified lease ID.

            Amazon Web Services Support might request the lease ID for an issue related to a reserved DB instance.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more than the `MaxRecords` value is available, a pagination token called a marker is included in the response so you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        multi-az: Specifies whether to show only those reservations that support Multi-AZ.
        offering-type: |-
            The offering type filter value. Specify this parameter to show only the available offerings matching the specified offering type.

            Valid Values: `"Partial Upfront" | "All Upfront" | "No Upfront"`
        product-description: The product description filter value. Specify this parameter to show only those reservations matching the specified product description.
        reserved-dbinstance-id: The reserved DB instance identifier filter value. Specify this parameter to show only the reservation that matches the specified reservation ID.
        reserved-dbinstances-offering-id: The offering identifier filter value. Specify this parameter to show only purchased reservations matching the specified offering identifier.
