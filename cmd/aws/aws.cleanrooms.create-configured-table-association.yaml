name: create-configured-table-association
description: Creates a configured table association.
flags:
    --configured-table-identifier=!: A unique identifier for the configured table to be associated to.
    --description=: A description for the configured table association.
    --membership-identifier=!: A unique identifier for one of your memberships for a collaboration.
    --name=!: The name of the configured table association.
    --role-arn=!: The service will assume this role to access catalog metadata and query the table.
    --tags=: An optional label that you can assign to a resource when you create it.
documentation:
    command: Creates a configured table association. A configured table association links a configured table with a collaboration.
    flag:
        configured-table-identifier: A unique identifier for the configured table to be associated to. Currently accepts a configured table ID.
        description: A description for the configured table association.
        membership-identifier: A unique identifier for one of your memberships for a collaboration. The configured table is associated to the collaboration that this membership belongs to. Currently accepts a membership ID.
        name: The name of the configured table association. This name is used to query the underlying configured table.
        role-arn: The service will assume this role to access catalog metadata and query the table.
        tags: An optional label that you can assign to a resource when you create it. Each tag consists of a key and an optional value, both of which you define. When you use tagging, you can also use tag-based access control in IAM policies to control access to this resource.
