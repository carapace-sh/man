name: update-crawler
description: Updates a crawler.
flags:
    --classifiers=:
        description: A list of custom classifiers that the user has registered.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=: Crawler configuration information.
    --crawler-security-configuration=: The name of the `SecurityConfiguration` structure to be used by this crawler.
    --database-name=: 'The Glue database where results are stored, such as: `arn:aws:daylight:us-east-1::database/sometable/*`.'
    --description=: A description of the new crawler.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --lake-formation-configuration=: Specifies Lake Formation configuration settings for the crawler.
    --lineage-configuration=: Specifies data lineage configuration settings for the crawler.
    --name=!: Name of the new crawler.
    --recrawl-policy=: A policy that specifies whether to crawl the entire dataset again, or to crawl only folders that were added since the last crawler run.
    --role=: The IAM role or Amazon Resource Name (ARN) of an IAM role that is used by the new crawler to access customer resources.
    --schedule=: 'A `cron` expression used to specify the schedule (see [Time-Based Schedules for Jobs and Crawlers](https://docs.aws.amazon.com/glue/latest/dg/monitor-data-warehouse-schedule.html). For example, to run something every day at 12:15 UTC, you would specify: `cron(15 12 * * ?'
    --schema-change-policy=: The policy for the crawler's update and deletion behavior.
    --table-prefix=: The table prefix used for catalog tables that are created.
    --targets=: A list of targets to crawl.
documentation:
    command: Updates a crawler. If a crawler is running, you must stop it using `StopCrawler` before updating it.
    flag:
        classifiers: A list of custom classifiers that the user has registered. By default, all built-in classifiers are included in a crawl, but these custom classifiers always override the default classifiers for a given classification.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: Crawler configuration information. This versioned JSON string allows users to specify aspects of a crawler's behavior. For more information, see [Setting crawler configuration options](https://docs.aws.amazon.com/glue/latest/dg/crawler-configuration.html).
        crawler-security-configuration: The name of the `SecurityConfiguration` structure to be used by this crawler.
        database-name: 'The Glue database where results are stored, such as: `arn:aws:daylight:us-east-1::database/sometable/*`.'
        description: A description of the new crawler.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        lake-formation-configuration: Specifies Lake Formation configuration settings for the crawler.
        lineage-configuration: Specifies data lineage configuration settings for the crawler.
        name: Name of the new crawler.
        recrawl-policy: A policy that specifies whether to crawl the entire dataset again, or to crawl only folders that were added since the last crawler run.
        role: The IAM role or Amazon Resource Name (ARN) of an IAM role that is used by the new crawler to access customer resources.
        schedule: 'A `cron` expression used to specify the schedule (see [Time-Based Schedules for Jobs and Crawlers](https://docs.aws.amazon.com/glue/latest/dg/monitor-data-warehouse-schedule.html). For example, to run something every day at 12:15 UTC, you would specify: `cron(15 12 * * ? *)`.'
        schema-change-policy: The policy for the crawler's update and deletion behavior.
        table-prefix: The table prefix used for catalog tables that are created.
        targets: A list of targets to crawl.
