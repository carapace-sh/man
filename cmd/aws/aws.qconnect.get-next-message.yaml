name: get-next-message
description: Retrieves next message on an Amazon Q in Connect session.
flags:
    --assistant-id=!: The identifier of the Amazon Q in Connect assistant.
    --next-message-token=!: The token for the next message.
    --session-id=!: The identifier of the Amazon Q in Connect session.
documentation:
    command: Retrieves next message on an Amazon Q in Connect session.
    flag:
        assistant-id: The identifier of the Amazon Q in Connect assistant.
        next-message-token: The token for the next message. Use the value returned in the SendMessage or previous response in the next request to retrieve the next message.
        session-id: The identifier of the Amazon Q in Connect session.
