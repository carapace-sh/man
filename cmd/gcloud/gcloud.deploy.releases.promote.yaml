name: promote
description: Promotes a release from one target (source), to another (destination).
flags:
    --annotations=: Annotations to apply to the rollout.
    --delivery-pipeline=: The delivery pipeline associated with the release.
    --labels=: Labels to apply to the rollout.
    --override-deploy-policies=: Deploy policies to override
    --region=: The Cloud region for the release.
    --release=!: ID of the release or fully qualified identifier for the release.
    --rollout-id=: ID to assign to the generated rollout for promotion.
    --starting-phase-id=: If set, starts the created rollout at the specified phase.
    --to-target=: Destination target to promote into.
documentation:
    command: |-
        If to-target is not specified the command promotes the release from the target
        that is farthest along in the promotion sequence to its next stage in the
        promotion sequence.
    flag:
        annotations: |-
            Annotations to apply to the rollout. Annotations take the form of key/value string pairs.
            +
            Examples:
            +
            Add annotations:
            +
              $ {command} --annotations="from_target=test,status=stable"
        delivery-pipeline: |-
            The delivery pipeline associated with the release.  Alternatively, set the property [deploy/delivery-pipeline].
            +
            To set the `delivery-pipeline` attribute:
            * provide the argument `--release` on the command line with a fully specified name;
            * provide the argument `--delivery-pipeline` on the command line;
            * set the property `deploy/delivery_pipeline`.
        labels: |-
            Labels to apply to the rollout. Labels take the form of key/value string pairs.
            +
            Examples:
            +
            Add labels:
            +
              $ {command} --labels="commit=abc123,author=foo"
        override-deploy-policies: Deploy policies to override
        region: |-
            The Cloud region for the release.  Alternatively, set the property [deploy/region].
            +
            To set the `region` attribute:
            * provide the argument `--release` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
        release: |-
            ID of the release or fully qualified identifier for the release.
            +
            To set the `release` attribute:
            * provide the argument `--release` on the command line.
        rollout-id: ID to assign to the generated rollout for promotion.
        starting-phase-id: |-
            If set, starts the created rollout at the specified phase.
            +
            Start rollout at `stable` phase:
            +
              $ {command} --starting-phase-id=stable
        to-target: Destination target to promote into.
