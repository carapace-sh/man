name: get-service-quota
description: Retrieves the applied quota value for the specified account-level or resource-level quota.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --context-id=: Specifies the resource with an Amazon Resource Name (ARN).
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --quota-code=!: Specifies the quota identifier.
    --service-code=!: Specifies the service identifier.
documentation:
    command: Retrieves the applied quota value for the specified account-level or resource-level quota. For some quotas, only the default values are available. If the applied quota value is not available for a quota, the quota is not retrieved.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        context-id: Specifies the resource with an Amazon Resource Name (ARN).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        quota-code: Specifies the quota identifier. To find the quota code for a specific quota, use the [ListServiceQuotas]() operation, and look for the `QuotaCode` response in the output for the quota you want.
        service-code: Specifies the service identifier. To find the service code value for an Amazon Web Services service, use the [ListServices]() operation.
