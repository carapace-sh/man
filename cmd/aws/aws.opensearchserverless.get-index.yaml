name: get-index
description: Retrieves information about an index in an OpenSearch Serverless collection, including its schema definition.
flags:
    --id=!: The unique identifier of the collection containing the index.
    --index-name=!: The name of the index to retrieve information about.
documentation:
    command: Retrieves information about an index in an OpenSearch Serverless collection, including its schema definition. The index might be configured to conduct automatic semantic enrichment ingestion and search. For more information, see [About automatic semantic enrichment](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-manage.html#serverless-semantic-enrichment).
    flag:
        id: The unique identifier of the collection containing the index.
        index-name: The name of the index to retrieve information about.
