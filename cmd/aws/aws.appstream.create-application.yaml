name: create-application
description: Creates an application.
flags:
    --app-block-arn=!: The app block ARN to which the application should be associated
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the application.
    --display-name=: The display name of the application.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --icon-s3-location=!: The location in S3 of the application icon.
    --instance-families=!: The instance families the application supports.
    --launch-parameters=: The launch parameters of the application.
    --launch-path=!: The launch path of the application.
    --name=!: The name of the application.
    --platforms=!: The platforms the application supports.
    --tags=: The tags assigned to the application.
    --working-directory=: The working directory of the application.
documentation:
    command: |-
        Creates an application.

        Applications are an Amazon AppStream 2.0 resource that stores the details about how to launch applications on Elastic fleet streaming instances. An application consists of the launch details, icon, and display name. Applications are associated with an app block that contains the application binaries and other files. The applications assigned to an Elastic fleet are the applications users can launch.

        This is only supported for Elastic fleets.
    flag:
        app-block-arn: The app block ARN to which the application should be associated
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the application.
        display-name: The display name of the application. This name is visible to users in the application catalog.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        icon-s3-location: The location in S3 of the application icon.
        instance-families: The instance families the application supports. Valid values are GENERAL\_PURPOSE and GRAPHICS\_G4.
        launch-parameters: The launch parameters of the application.
        launch-path: The launch path of the application.
        name: The name of the application. This name is visible to users when display name is not specified.
        platforms: The platforms the application supports. WINDOWS\_SERVER\_2019 and AMAZON\_LINUX2 are supported for Elastic fleets.
        tags: The tags assigned to the application.
        working-directory: The working directory of the application.
