name: create-input
description: Create an input
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destinations=:
        description: Destination settings for PUSH type inputs.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-devices=:
        description: Settings for the devices.
        nargs: -1
    --input-network-location=: The location of this input.
    --input-security-groups=:
        description: A list of security groups referenced by IDs to attach to the input.
        nargs: -1
    --media-connect-flows=:
        description: A list of the MediaConnect Flows that you want to use in this input.
        nargs: -1
    --multicast-settings=: Multicast Input settings.
    --name=: Name of the input.
    --request-id=: Unique identifier of the request to ensure the request is handled exactly once in case of retries.
    --role-arn=: The Amazon Resource Name (ARN) of the role this input assumes during and after creation.
    --router-settings=: ""
    --sdi-sources=:
        nargs: -1
    --smpte2110-receiver-group-settings=: Include this parameter if the input is a SMPTE 2110 input, to identify the stream sources for this input.
    --sources=:
        description: The source URLs for a PULL-type input.
        nargs: -1
    --srt-settings=: The settings associated with an SRT input.
    --tags=: A collection of key-value pairs.
    --type=: ""
    --vpc=: ""
completion:
    flag:
        input-network-location:
            - AWS
            - ON_PREMISES
        type:
            - UDP_PUSH
            - RTP_PUSH
            - RTMP_PUSH
            - RTMP_PULL
            - URL_PULL
            - MP4_FILE
            - MEDIACONNECT
            - INPUT_DEVICE
            - AWS_CDI
            - TS_FILE
            - SRT_CALLER
            - MULTICAST
            - SMPTE_2110_RECEIVER_GROUP
            - SDI
            - MEDIACONNECT_ROUTER
documentation:
    command: Create an input
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        destinations: Destination settings for PUSH type inputs.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-devices: Settings for the devices.
        input-network-location: The location of this input. AWS, for an input existing in the AWS Cloud, On-Prem for an input in a customer network.
        input-security-groups: A list of security groups referenced by IDs to attach to the input.
        media-connect-flows: A list of the MediaConnect Flows that you want to use in this input. You can specify as few as one Flow and presently, as many as two. The only requirement is when you have more than one is that each Flow is in a separate Availability Zone as this ensures your EML input is redundant to AZ issues.
        multicast-settings: Multicast Input settings.
        name: Name of the input.
        request-id: Unique identifier of the request to ensure the request is handled exactly once in case of retries.
        role-arn: The Amazon Resource Name (ARN) of the role this input assumes during and after creation.
        router-settings: ""
        sdi-sources: ""
        smpte2110-receiver-group-settings: Include this parameter if the input is a SMPTE 2110 input, to identify the stream sources for this input.
        sources: The source URLs for a PULL-type input. Every PULL type input needs exactly two source URLs for redundancy. Only specify sources for PULL type Inputs. Leave Destinations empty.
        srt-settings: The settings associated with an SRT input.
        tags: A collection of key-value pairs.
        type: ""
        vpc: ""
