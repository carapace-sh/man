name: create-label
description: Creates a label for an event.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: A unique identifier for the request to create a label.
    --end-time=!: The end time of the labeled event.
    --equipment=: Indicates that a label pertains to a particular piece of equipment.
    --fault-code=: Provides additional information about the label.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --label-group-name=!: The name of a group of labels.
    --notes=: Metadata providing additional information about the label.
    --rating=!: Indicates whether a labeled event represents an anomaly.
    --start-time=!: The start time of the labeled event.
completion:
    flag:
        rating:
            - ANOMALY
            - NO_ANOMALY
            - NEUTRAL
documentation:
    command: Creates a label for an event.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique identifier for the request to create a label. If you do not set the client request token, Lookout for Equipment generates one.
        end-time: The end time of the labeled event.
        equipment: |-
            Indicates that a label pertains to a particular piece of equipment.

            Data in this field will be retained for service usage. Follow best practices for the security of your data.
        fault-code: |-
            Provides additional information about the label. The fault code must be defined in the FaultCodes attribute of the label group.

            Data in this field will be retained for service usage. Follow best practices for the security of your data.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        label-group-name: |-
            The name of a group of labels.

            Data in this field will be retained for service usage. Follow best practices for the security of your data.
        notes: |-
            Metadata providing additional information about the label.

            Data in this field will be retained for service usage. Follow best practices for the security of your data.
        rating: Indicates whether a labeled event represents an anomaly.
        start-time: The start time of the labeled event.
