name: create
description: '*(ALPHA)*  Create a new Privileged Access Manager (PAM) entitlement.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --entitlement-file=!: YAML file containing the configuration of the entitlement.
    --folder=: The name of the folder
    --location=: The resource location
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: The name of the organization
documentation:
    command: '*(ALPHA)*  Create a new Privileged Access Manager (PAM) entitlement in a project/folder/organization location.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        entitlement-file: YAML file containing the configuration of the entitlement. Use a full or relative path to a local file containing the value of entitlement_file.
        folder: |-
            The name of the folder
            +
            To set the `folder` attribute:
            * provide the argument `entitlement` on the command line with a fully specified name;
            * provide the argument `--folder` on the command line. Must be specified for resource of type [privilegedaccessmanager.folders.locations.entitlements].
        location: |-
            The resource location
            +
            To set the `location` attribute:
            * provide the argument `entitlement` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            The name of the organization
            +
            To set the `organization` attribute:
            * provide the argument `entitlement` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line. Must be specified for resource of type [privilegedaccessmanager.organizations.locations.entitlements].
