name: create-connection
description: Creates a new connection.
flags:
    --aws-location=: The location where the connection is created.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
    --description=: A connection description.
    --domain-identifier=!: The ID of the domain where the connection is created.
    --enable-trusted-identity-propagation: Specifies whether the trusted identity propagation is enabled.
    --environment-identifier=: The ID of the environment where the connection is created.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The connection name.
    --no-enable-trusted-identity-propagation: Specifies whether the trusted identity propagation is enabled.
    --props=: The connection props.
    --scope=: The scope of the connection.
completion:
    flag:
        scope:
            - DOMAIN
            - PROJECT
documentation:
    command: Creates a new connection. In Amazon DataZone, a connection enables you to connect your resources (domains, projects, and environments) to external resources and services.
    flag:
        aws-location: The location where the connection is created.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
        description: A connection description.
        domain-identifier: The ID of the domain where the connection is created.
        enable-trusted-identity-propagation: Specifies whether the trusted identity propagation is enabled.
        environment-identifier: The ID of the environment where the connection is created.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The connection name.
        props: The connection props.
        scope: The scope of the connection.
