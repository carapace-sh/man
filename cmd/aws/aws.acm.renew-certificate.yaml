name: renew-certificate
description: Renews an [eligible ACM certificate](https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html).
flags:
    --certificate-arn=!: String that contains the ARN of the ACM certificate to be renewed.
documentation:
    command: Renews an [eligible ACM certificate](https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html). In order to renew your Amazon Web Services Private CA certificates with ACM, you must first [grant the ACM service principal permission to do so](https://docs.aws.amazon.com/privateca/latest/userguide/PcaPermissions.html). For more information, see [Testing Managed Renewal](https://docs.aws.amazon.com/acm/latest/userguide/manual-renewal.html) in the ACM User Guide.
    flag:
        certificate-arn: |-
            String that contains the ARN of the ACM certificate to be renewed. This must be of the form:

            `arn:aws:acm:region:123456789012:certificate/12345678-1234-1234-1234-123456789012`

            For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html).
