name: update-service-template-version
description: Update a major or minor version of a service template.
flags:
    --compatible-environment-templates=: An array of environment template objects that are compatible with this service template version.
    --description=: A description of a service template version to update.
    --major-version=!: To update a major version of a service template, include `major Version`.
    --minor-version=!: To update a minor version of a service template, include `minorVersion`.
    --status=: The status of the service template minor version to update.
    --supported-component-sources=: An array of supported component sources.
    --template-name=!: The name of the service template.
completion:
    flag:
        status:
            - REGISTRATION_IN_PROGRESS
            - REGISTRATION_FAILED
            - DRAFT
            - PUBLISHED
documentation:
    command: Update a major or minor version of a service template.
    flag:
        compatible-environment-templates: An array of environment template objects that are compatible with this service template version. A service instance based on this service template version can run in environments based on compatible templates.
        description: A description of a service template version to update.
        major-version: To update a major version of a service template, include `major Version`.
        minor-version: To update a minor version of a service template, include `minorVersion`.
        status: The status of the service template minor version to update.
        supported-component-sources: |-
            An array of supported component sources. Components with supported sources can be attached to service instances based on this service template version.

            A change to `supportedComponentSources` doesn't impact existing component attachments to instances based on this template version. A change only affects later associations.

            For more information about components, see [Proton components](https://docs.aws.amazon.com/proton/latest/userguide/ag-components.html) in the *Proton User Guide*.
        template-name: The name of the service template.
