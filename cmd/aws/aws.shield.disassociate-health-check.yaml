name: disassociate-health-check
description: Removes health-based detection from the Shield Advanced protection for a resource.
flags:
    --health-check-arn=!: The Amazon Resource Name (ARN) of the health check that is associated with the protection.
    --protection-id=!: The unique identifier (ID) for the [Protection]() object to remove the health check association from.
documentation:
    command: |-
        Removes health-based detection from the Shield Advanced protection for a resource. Shield Advanced health-based detection uses the health of your Amazon Web Services resource to improve responsiveness and accuracy in attack detection and response.

        You define the health check in Route 53 and then associate or disassociate it with your Shield Advanced protection. For more information, see [Shield Advanced Health-Based Detection](https://docs.aws.amazon.com/waf/latest/developerguide/ddos-overview.html#ddos-advanced-health-check-option) in the *WAF Developer Guide*.
    flag:
        health-check-arn: The Amazon Resource Name (ARN) of the health check that is associated with the protection.
        protection-id: The unique identifier (ID) for the [Protection]() object to remove the health check association from.
