name: enforce-all
description: '*(ALPHA)*  Enforces the dry-run mode configuration for all Service Perimeters.'
flags:
    --etag=: The etag for the version of the Access Policy that this
    --policy=: The parent Access Policy which owns all Service Perimeters in
documentation:
    command: |-
        *(ALPHA)*  An enforce operation on a Service Perimeter involves copying its dry-run mode configuration (`spec`) to that Service Perimeter's enforcement mode configration (`status`). This command performs this operation for *all* Service Perimeters in the user's Access Policy.

        Note: Only Service Perimeters with an explicit dry-run mode configuration are affected by this operation. The overall operation succeeds once the dry-run configurations of all such Service Perimeters have been enforced. If the operation fails for any given Service Perimeter, it will cause the entire operation to be aborted.
    flag:
        etag: |-
            The etag for the version of the Access Policy that this
                            operation is to be performed on. If, at the time of the
                            operation, the etag for the Access Policy stored in Access
                            Context Manager is different from the specified etag, then the
                            commit operation will not be performed and the call will fail.
                            If etag is not provided, the operation will be performed as if a
                            valid etag is provided.
        policy: |-
            The parent Access Policy which owns all Service Perimeters in
                            scope for the commit operation.
