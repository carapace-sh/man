name: describe-pools
description: Retrieves the specified pools or all pools associated with your Amazon Web Services account.
flags:
    --filters=: An array of PoolFilter objects to filter the results.
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
    --owner=: Use `SELF` to filter the list of Pools to ones your account owns or use `SHARED` to filter on Pools shared with your account.
    --pool-ids=: The unique identifier of pools to find.
completion:
    flag:
        owner:
            - SELF
            - SHARED
documentation:
    command: |-
        Retrieves the specified pools or all pools associated with your Amazon Web Services account.

        If you specify pool IDs, the output includes information for only the specified pools. If you specify filters, the output includes information for only those pools that meet the filter criteria. If you don't specify pool IDs or filters, the output includes information for all pools.

        If you specify a pool ID that isn't valid, an error is returned.

        A pool is a collection of phone numbers and SenderIds. A pool can include one or more phone numbers and SenderIds that are associated with your Amazon Web Services account.
    flag:
        filters: An array of PoolFilter objects to filter the results.
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
        owner: Use `SELF` to filter the list of Pools to ones your account owns or use `SHARED` to filter on Pools shared with your account. The `Owner` and `PoolIds` parameters can't be used at the same time.
        pool-ids: |-
            The unique identifier of pools to find. This is an array of strings that can be either the PoolId or PoolArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
