name: create-group-membership
description: Creates a relationship between a member and a group.
flags:
    --group-id=!: The identifier for a group in the identity store.
    --identity-store-id=!: The globally unique identifier for the identity store.
    --member-id=!: An object that contains the identifier of a group member.
documentation:
    command: 'Creates a relationship between a member and a group. The following identifiers must be specified: `GroupId`, `IdentityStoreId`, and `MemberId`.'
    flag:
        group-id: The identifier for a group in the identity store.
        identity-store-id: The globally unique identifier for the identity store.
        member-id: An object that contains the identifier of a group member. Setting the `UserID` field to the specific identifier for a user indicates that the user is a member of the group.
