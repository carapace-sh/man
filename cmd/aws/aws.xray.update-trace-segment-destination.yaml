name: update-trace-segment-destination
description: Modifies the destination of data sent to `PutTraceSegments`.
flags:
    --destination=: The configured destination of trace segments.
completion:
    flag:
        destination:
            - XRay
            - CloudWatchLogs
documentation:
    command: Modifies the destination of data sent to `PutTraceSegments`. The Transaction Search feature requires the CloudWatchLogs destination. For more information, see [Transaction Search](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Transaction-Search.html).
    flag:
        destination: The configured destination of trace segments.
