name: import
description: '*(BETA)*  Import a session template.'
flags:
    --location=: Dataproc location for the session template.
    --source=: Path to a YAML file containing configuration export data.
documentation:
    command: |-
        *(BETA)*  If the specified session template already exists, it will be overwritten.
        Otherwise, a new session template will be created.
        To edit an existing session template, you can export the session template
        to a file, edit its configuration, and then import the new configuration.

        This command does not allow output only fields, such as template id and
        resource name. It populates the id field based on the resource name specified
        as the first command line argument.

        ## EXAMPLES

        The following command creates or updates the contents of session template
        `example-session-template` based on a yaml file:

          $ gcloud beta dataproc session-templates import example-session-template --source=saved-template.yaml
    flag:
        location: |-
            Dataproc location for the session template. Each Dataproc location constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the location. Overrides the default `dataproc/location` property value for this command invocation.
            +
            To set the `location` attribute:
            * provide the argument `session_template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataproc/location`.
        source: |-
            Path to a YAML file containing configuration export data.
                      Alternatively, you may omit this flag to read from standard input.
