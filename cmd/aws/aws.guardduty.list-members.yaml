name: list-members
description: Lists details about all member accounts for the current GuardDuty administrator account.
flags:
    --detector-id=!: The unique ID of the detector that is associated with the member.
    --max-results=: You can use this parameter to indicate the maximum number of items you want in the response.
    --next-token=: You can use this parameter when paginating results.
    --only-associated=: Specifies whether to only return associated members or to return all members (including members who haven't been invited yet or have been disassociated).
documentation:
    command: Lists details about all member accounts for the current GuardDuty administrator account.
    flag:
        detector-id: |-
            The unique ID of the detector that is associated with the member.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        max-results: You can use this parameter to indicate the maximum number of items you want in the response. The default value is 50. The maximum value is 50.
        next-token: You can use this parameter when paginating results. Set the value of this parameter to null on your first call to the list action. For subsequent calls to the action, fill nextToken in the request with the value of NextToken from the previous response to continue listing data.
        only-associated: Specifies whether to only return associated members or to return all members (including members who haven't been invited yet or have been disassociated). Member accounts must have been previously associated with the GuardDuty administrator account using [`Create Members`](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_CreateMembers.html) .
