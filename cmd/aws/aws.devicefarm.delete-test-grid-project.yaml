name: delete-test-grid-project
description: Deletes a Selenium testing project and all content generated under it.
flags:
    --project-arn=!: The ARN of the project to delete, from [CreateTestGridProject]() or [ListTestGridProjects]().
documentation:
    command: |-
        Deletes a Selenium testing project and all content generated under it.

        You cannot undo this operation.

        You cannot delete a project if it has active sessions.
    flag:
        project-arn: The ARN of the project to delete, from [CreateTestGridProject]() or [ListTestGridProjects]().
