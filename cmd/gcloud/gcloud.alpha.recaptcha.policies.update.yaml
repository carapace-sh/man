name: update
description: '*(ALPHA)*  Update a reCAPTCHA key''s policy.'
hidden: true
flags:
    --key=!: ID of the key or fully qualified identifier for the key.
    --policy=!: Path to a YAML file or a JSON file containing the policy definition.
documentation:
    command: |-
        ## EXAMPLES

        To update a policy for a reCAPTCHA key:

            $ gcloud alpha recaptcha policies update --key=test-key  --policy=policy.yaml

        See [https://cloud.google.com/sdk/gcloud/reference/recaptcha/keys] for more
        details for recaptcha keys.
    flag:
        key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `key` attribute:
            * provide the argument `--key` on the command line.
        policy: Path to a YAML file or a JSON file containing the policy definition.
