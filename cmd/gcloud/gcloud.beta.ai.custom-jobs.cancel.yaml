name: cancel
description: '*(BETA)*  Cancel a running custom job.'
flags:
    --region=: Cloud region for the custom job.
documentation:
    command: |-
        *(BETA)*  If the job is already finished,
        the command will not perform any operation.

        To cancel a job ``123'' under project ``example'' in region
        ``us-central1'', run:

          $ gcloud beta ai custom-jobs cancel 123 --project=example --region=us-central1
    flag:
        region: |-
            Cloud region for the custom job.
            +
            To set the `region` attribute:
            * provide the argument `custom_job` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
