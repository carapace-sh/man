name: create-batch-prediction-job
description: Creates a batch prediction job.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --detector-name=!: The name of the detector.
    --detector-version=: The detector version.
    --event-type-name=!: The name of the event type.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role-arn=!: The ARN of the IAM role to use for this job request.
    --input-path=!: The Amazon S3 location of your training file.
    --job-id=!: The ID of the batch prediction job.
    --output-path=!: The Amazon S3 location of your output file.
    --tags=:
        description: A collection of key and value pairs.
        nargs: -1
documentation:
    command: Creates a batch prediction job.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        detector-name: The name of the detector.
        detector-version: The detector version.
        event-type-name: The name of the event type.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role-arn: |-
            The ARN of the IAM role to use for this job request.

            The IAM Role must have read permissions to your input S3 bucket and write permissions to your output S3 bucket. For more information about bucket permissions, see [User policy examples](https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-policies-s3.html) in the *Amazon S3 User Guide*.
        input-path: The Amazon S3 location of your training file.
        job-id: The ID of the batch prediction job.
        output-path: The Amazon S3 location of your output file.
        tags: A collection of key and value pairs.
