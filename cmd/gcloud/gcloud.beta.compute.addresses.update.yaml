name: update
description: '*(BETA)*  Update a Compute Engine address.'
flags:
    --clear-labels: Remove all labels.
    --global: If set, the address is global.
    --no-clear-labels&: Remove all labels.
    --no-global&: If set, the address is global.
    --region=: Region of the address to operate on.
    --remove-labels=: List of label keys to remove.
    --update-labels=: List of label KEY=VALUE pairs to update.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute addresses update* updates labels for a Compute Engine
        address.

        ## EXAMPLES

        To add/update labels 'k0' and 'k1' and remove labels with key 'k3' for address
        'example-address', run:

          $ gcloud beta compute addresses update example-address --region=us-central1 \
            --update-labels=k0=value1,k1=value2 --remove-labels=k3

        Labels can be used to identify the address and to filter them as in:

          $ gcloud beta compute addresses list --filter='labels.k1:value2'

        To list existing labels for address 'example-address', run:

          $ gcloud beta compute addresses describe example-address --format="default(labels)"
    flag:
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        global: If set, the address is global.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-global: If set, the address is global.
        region: Region of the address to operate on. Overrides the default *compute/region* property value for this command invocation.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
