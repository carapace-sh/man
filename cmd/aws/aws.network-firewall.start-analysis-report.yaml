name: start-analysis-report
description: Generates a traffic analysis report for the timeframe and traffic type you specify.
flags:
    --analysis-type=!: The type of traffic that will be used to generate a report.
    --firewall-arn=: The Amazon Resource Name (ARN) of the firewall.
    --firewall-name=: The descriptive name of the firewall.
completion:
    flag:
        analysis-type:
            - TLS_SNI
            - HTTP_HOST
documentation:
    command: |-
        Generates a traffic analysis report for the timeframe and traffic type you specify.

        For information on the contents of a traffic analysis report, see [AnalysisReport]().
    flag:
        analysis-type: The type of traffic that will be used to generate a report.
        firewall-arn: |-
            The Amazon Resource Name (ARN) of the firewall.

            You must specify the ARN or the name, and you can specify both.
        firewall-name: |-
            The descriptive name of the firewall. You can't change the name of a firewall after you create it.

            You must specify the ARN or the name, and you can specify both.
