name: describe-trusts
description: Obtains information about the trust relationships for this account.
flags:
    --directory-id=: The Directory ID of the Amazon Web Services directory that is a part of the requested trust relationship.
    --limit=: The maximum number of objects to return.
    --next-token=: The *DescribeTrustsResult.NextToken* value from a previous call to [DescribeTrusts]().
    --trust-ids=: A list of identifiers of the trust relationships for which to obtain the information.
documentation:
    command: |-
        Obtains information about the trust relationships for this account.

        If no input parameters are provided, such as DirectoryId or TrustIds, this request describes all the trust relationships belonging to the account.
    flag:
        directory-id: The Directory ID of the Amazon Web Services directory that is a part of the requested trust relationship.
        limit: The maximum number of objects to return.
        next-token: The *DescribeTrustsResult.NextToken* value from a previous call to [DescribeTrusts](). Pass null if this is the first call.
        trust-ids: |-
            A list of identifiers of the trust relationships for which to obtain the information. If this member is null, all trust relationships that belong to the current account are returned.

            An empty list results in an `InvalidParameterException` being thrown.
