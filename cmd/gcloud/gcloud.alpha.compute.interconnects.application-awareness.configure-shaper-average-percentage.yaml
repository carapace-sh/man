name: configure-shaper-average-percentage
description: '*(ALPHA)*  Configure shaper average percentage for application awareness configuration of a Compute Engine interconnect.'
flags:
    --bandwidth-percentages=!: A list of bandwidth percentages, for configuring the bandwidth percentage policy or traffic shaping.
    --enabled: Enable or disable application awareness on the interconnect.
    --no-enabled&: Enable or disable application awareness on the interconnect.
    --profile-description=: Add profile description for application awareness.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute interconnects application-awareness configure-shaper-average-percentage* is used to configure shaper average percentage for using
        application awareness on interconnect. Note that an application awareness
        policy (strict priority or bandwidth percentage) should be configure before
        configuring traffic shaping.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        bandwidth-percentages: |-
            A list of bandwidth percentages, for configuring the bandwidth percentage policy or traffic shaping.
            +
            For configuring bandwidth percentages for the bandwidth percentage policy:
            +
            1. Each bandwidth percentage value must be an integer between 1-100.
            2. It is required to provide a percentage value for each class.
            3. The sum of all bandwidth percentages must be 100.
            +
            For configuring bandwidth percentages for traffic shaping:
            +
            1. Each bandwidth percentage value must be an integer between 1-100.
            2. It is not required to provide a percentage value for each class.
            3. The sum of all bandwidth percentages does not need to be 100.
        enabled: |-
            Enable or disable application awareness on the interconnect. Application awareness enablement will fail
            if the application awareness configuration is not specified. Use --no-enabled to disable
            it.
        no-enabled: |-
            Enable or disable application awareness on the interconnect. Application awareness enablement will fail
            if the application awareness configuration is not specified. Use --no-enabled to disable
            it.
        profile-description: Add profile description for application awareness.
