name: delete-public-key
description: Deletes the specified public key used to sign stage participant tokens.
flags:
    --arn=!: ARN of the public key to be deleted.
documentation:
    command: Deletes the specified public key used to sign stage participant tokens. This invalidates future participant tokens generated using the key pair’s private key.
    flag:
        arn: ARN of the public key to be deleted.
