name: generate-command
description: Generate YAML file to implement given command.
hidden: true
flags:
    --output-dir=: The directory where the generated command YAML files will be written.
documentation:
    command: The command YAML file is generated in the --output-dir directory.
    flag:
        output-dir: The directory where the generated command YAML files will be written. If not specified then yaml files will not be generated. If no output directory is specified, the new YAML file will be written to stdout.
