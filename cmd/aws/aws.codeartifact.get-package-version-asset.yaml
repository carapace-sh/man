name: get-package-version-asset
description: Returns an asset (or file) that is in a package.
flags:
    --asset=!: The name of the requested asset.
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the repository that contains the package version with the requested asset.
    --format=!: A format that specifies the type of the package version with the requested asset file.
    --namespace=: The namespace of the package version with the requested asset file.
    --package-version-revision=: The name of the package version revision that contains the requested asset.
    --package-version=!: A string that contains the package version (for example, `3.5.2`).
    --package=!: The name of the package that contains the requested asset.
    --repository=!: The repository that contains the package version with the requested asset.
completion:
    flag:
        format:
            - npm
            - pypi
            - maven
            - nuget
            - generic
            - ruby
            - swift
            - cargo
documentation:
    command: Returns an asset (or file) that is in a package. For example, for a Maven package version, use `GetPackageVersionAsset` to download a `JAR` file, a `POM` file, or any other assets in the package version.
    flag:
        asset: The name of the requested asset.
        domain: The name of the domain that contains the repository that contains the package version with the requested asset.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        format: A format that specifies the type of the package version with the requested asset file.
        namespace: |-
            The namespace of the package version with the requested asset file. The package component that specifies its namespace depends on its type. For example:

            The namespace is required when requesting assets from package versions of the following formats:

            - Maven
            - Swift
            - generic

            <!--THE END-->

            - The namespace of a Maven package version is its `groupId`.
            - The namespace of an npm or Swift package version is its `scope`.
            - The namespace of a generic package is its `namespace`.
            - Python, NuGet, Ruby, and Cargo package versions do not contain a corresponding component, package versions of those formats do not have a namespace.
        package: The name of the package that contains the requested asset.
        package-version: A string that contains the package version (for example, `3.5.2`).
        package-version-revision: The name of the package version revision that contains the requested asset.
        repository: The repository that contains the package version with the requested asset.
