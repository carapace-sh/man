name: describe
description: '*(ALPHA)*  Describe a fleet scope.'
flags:
    --location=: The location name.
    --no-show-cluster-upgrade&: Shows the cluster upgrade feature information for the current scope.
    --no-show-linked-cluster-upgrade&: Shows the cluster upgrade feature information for the current scope as well as
    --show-cluster-upgrade: Shows the cluster upgrade feature information for the current scope.
    --show-linked-cluster-upgrade: Shows the cluster upgrade feature information for the current scope as well as
documentation:
    command: '*(ALPHA)*  Describe a Fleet Scope.'
    flag:
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `scope` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * global is the only supported location.
        no-show-cluster-upgrade: |
            Shows the cluster upgrade feature information for the current scope.

            To view the cluster upgrade feature information for ``SCOPE_NAME'', run:

              $ {command} SCOPE_NAME --show-cluster-upgrade
        no-show-linked-cluster-upgrade: |
            Shows the cluster upgrade feature information for the current scope as well as
            information for all other scopes linked in the same rollout sequence (provided that the
            caller has permission to view the upstream and downstream scopes that exist in other
            fleets). This displays cluster upgrade information for scopes in the current scope's
            rollout sequence in order of furthest upstream to downstream.

            To view the cluster upgrade feature information for the rollout sequence containing
            ``SCOPE_NAME'', run:

              $ {command} SCOPE_NAME --show-linked-cluster-upgrade
        show-cluster-upgrade: |-
            Shows the cluster upgrade feature information for the current scope.
            +
            To view the cluster upgrade feature information for ``SCOPE_NAME'', run:
            +
              $ {command} SCOPE_NAME --show-cluster-upgrade
        show-linked-cluster-upgrade: |-
            Shows the cluster upgrade feature information for the current scope as well as
            information for all other scopes linked in the same rollout sequence (provided that the
            caller has permission to view the upstream and downstream scopes that exist in other
            fleets). This displays cluster upgrade information for scopes in the current scope's
            rollout sequence in order of furthest upstream to downstream.
            +
            To view the cluster upgrade feature information for the rollout sequence containing
            ``SCOPE_NAME'', run:
            +
              $ {command} SCOPE_NAME --show-linked-cluster-upgrade
