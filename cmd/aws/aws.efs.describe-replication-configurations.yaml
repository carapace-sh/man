name: describe-replication-configurations
description: Retrieves the replication configuration for a specific file system.
flags:
    --file-system-id=: You can retrieve the replication configuration for a specific file system by providing its file system ID.
    --max-results=: (Optional) To limit the number of objects returned in a response, you can specify the `MaxItems` parameter.
    --next-token=: '`NextToken` is present if the response is paginated.'
documentation:
    command: Retrieves the replication configuration for a specific file system. If a file system is not specified, all of the replication configurations for the Amazon Web Services account in an Amazon Web Services Region are retrieved.
    flag:
        file-system-id: You can retrieve the replication configuration for a specific file system by providing its file system ID. For cross-account,cross-region replication, an account can only describe the replication configuration for a file system in its own Region.
        max-results: (Optional) To limit the number of objects returned in a response, you can specify the `MaxItems` parameter. The default value is 100.
        next-token: '`NextToken` is present if the response is paginated. You can use `NextToken` in a subsequent request to fetch the next page of output.'
