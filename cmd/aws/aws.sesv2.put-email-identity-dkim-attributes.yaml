name: put-email-identity-dkim-attributes
description: Used to enable or disable DKIM authentication for an email identity.
flags:
    --email-identity=!: The email identity.
    --signing-enabled=: Sets the DKIM signing configuration for the identity.
documentation:
    command: Used to enable or disable DKIM authentication for an email identity.
    flag:
        email-identity: The email identity.
        signing-enabled: |-
            Sets the DKIM signing configuration for the identity.

            When you set this value `true`, then the messages that are sent from the identity are signed using DKIM. If you set this value to `false`, your messages are sent without DKIM signing.
