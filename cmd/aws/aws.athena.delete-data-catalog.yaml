name: delete-data-catalog
description: Deletes a data catalog.
flags:
    --delete-catalog-only: Deletes the Athena Data Catalog.
    --name=!: The name of the data catalog to delete.
    --no-delete-catalog-only: Deletes the Athena Data Catalog.
documentation:
    command: Deletes a data catalog.
    flag:
        delete-catalog-only: Deletes the Athena Data Catalog. You can only use this with the `FEDERATED` catalogs. You usually perform this before registering the connector with Glue Data Catalog. After deletion, you will have to manage the Glue Connection and Lambda function.
        name: The name of the data catalog to delete.
