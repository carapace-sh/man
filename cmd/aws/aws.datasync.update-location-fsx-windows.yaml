name: update-location-fsx-windows
description: Modifies the following configuration parameters of the Amazon FSx for Windows File Server transfer location that you're using with DataSync.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain=: Specifies the name of the Windows domain that your FSx for Windows File Server file system belongs to.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --location-arn=!: Specifies the ARN of the FSx for Windows File Server transfer location that you're updating.
    --password=: Specifies the password of the user with the permissions to mount and access the files, folders, and file metadata in your FSx for Windows File Server file system.
    --subdirectory=: Specifies a mount path for your file system using forward slashes.
    --user=: Specifies the user with the permissions to mount and access the files, folders, and file metadata in your FSx for Windows File Server file system.
documentation:
    command: |-
        Modifies the following configuration parameters of the Amazon FSx for Windows File Server transfer location that you're using with DataSync.

        For more information, see [Configuring DataSync transfers with FSx for Windows File Server](https://docs.aws.amazon.com/datasync/latest/userguide/create-fsx-location.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain: |-
            Specifies the name of the Windows domain that your FSx for Windows File Server file system belongs to.

            If you have multiple Active Directory domains in your environment, configuring this parameter makes sure that DataSync connects to the right file system.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        location-arn: Specifies the ARN of the FSx for Windows File Server transfer location that you're updating.
        password: Specifies the password of the user with the permissions to mount and access the files, folders, and file metadata in your FSx for Windows File Server file system.
        subdirectory: Specifies a mount path for your file system using forward slashes. DataSync uses this subdirectory to read or write data (depending on whether the file system is a source or destination location).
        user: |-
            Specifies the user with the permissions to mount and access the files, folders, and file metadata in your FSx for Windows File Server file system.

            For information about choosing a user with the right level of access for your transfer, see [required permissions](https://docs.aws.amazon.com/datasync/latest/userguide/create-fsx-location.html#create-fsx-windows-location-permissions) for FSx for Windows File Server locations.
