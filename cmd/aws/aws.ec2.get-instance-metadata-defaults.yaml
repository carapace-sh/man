name: get-instance-metadata-defaults
description: "Gets the default instance metadata service (IMDS) settings that are set at the account level in the specified Amazon Web Services\L Region."
flags:
    --dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --no-dry-run&: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
documentation:
    command: |-
        Gets the default instance metadata service (IMDS) settings that are set at the account level in the specified Amazon Web Services          Region.

        For more information, see [Order of precedence for instance metadata options](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-options.html#instance-metadata-options-order-of-precedence) in the *Amazon EC2 User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
