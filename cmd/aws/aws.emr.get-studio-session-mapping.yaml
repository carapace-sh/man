name: get-studio-session-mapping
description: Fetches mapping details for the specified Amazon EMR Studio and identity (user or group).
flags:
    --identity-id=: The globally unique identifier (GUID) of the user or group.
    --identity-name=: The name of the user or group to fetch.
    --identity-type=!: Specifies whether the identity to fetch is a user or a group.
    --studio-id=!: The ID of the Amazon EMR Studio.
completion:
    flag:
        identity-type:
            - USER
            - GROUP
documentation:
    command: Fetches mapping details for the specified Amazon EMR Studio and identity (user or group).
    flag:
        identity-id: The globally unique identifier (GUID) of the user or group. For more information, see [UserId](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_User.html#singlesignon-Type-User-UserId) and [GroupId](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_Group.html#singlesignon-Type-Group-GroupId) in the *IAM Identity Center Identity Store API Reference*. Either `IdentityName` or `IdentityId` must be specified.
        identity-name: The name of the user or group to fetch. For more information, see [UserName](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_User.html#singlesignon-Type-User-UserName) and [DisplayName](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_Group.html#singlesignon-Type-Group-DisplayName) in the *IAM Identity Center Identity Store API Reference*. Either `IdentityName` or `IdentityId` must be specified.
        identity-type: Specifies whether the identity to fetch is a user or a group.
        studio-id: The ID of the Amazon EMR Studio.
