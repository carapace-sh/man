name: batch-delete-featured-results-set
description: Removes one or more sets of featured results.
flags:
    --featured-results-set-ids=!: The identifiers of the featured results sets that you want to delete.
    --index-id=!: The identifier of the index used for featuring results.
documentation:
    command: Removes one or more sets of featured results. Features results are placed above all other results for certain queries. If there's an exact match of a query, then one or more specific documents are featured in the search results.
    flag:
        featured-results-set-ids: The identifiers of the featured results sets that you want to delete.
        index-id: The identifier of the index used for featuring results.
