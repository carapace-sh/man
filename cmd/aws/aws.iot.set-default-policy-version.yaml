name: set-default-policy-version
description: Sets the specified version of the specified policy as the policy's default (operative) version.
flags:
    --policy-name=!: The policy name.
    --policy-version-id=!: The policy version ID.
documentation:
    command: |-
        Sets the specified version of the specified policy as the policy's default (operative) version. This action affects all certificates to which the policy is attached. To list the principals the policy is attached to, use the [ListPrincipalPolicies]() action.

        Requires permission to access the [SetDefaultPolicyVersion](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        policy-name: The policy name.
        policy-version-id: The policy version ID.
