name: update-function-code
description: Updates a Lambda function's code.
flags:
    --architectures=: The instruction set architecture that the function supports.
    --dry-run: Set to true to validate the request parameters and access permissions without modifying the function code.
    --function-name=!: The name or ARN of the Lambda function.
    --image-uri=: URI of a container image in the Amazon ECR registry.
    --no-dry-run&: Set to true to validate the request parameters and access permissions without modifying the function code.
    --no-publish&: Set to true to publish a new version of the function after updating the code.
    --publish: Set to true to publish a new version of the function after updating the code.
    --revision-id=: Update the function only if the revision ID matches the ID that's specified.
    --s3-bucket=: An Amazon S3 bucket in the same Amazon Web Services Region as your function.
    --s3-key=: The Amazon S3 key of the deployment package.
    --s3-object-version=: For versioned objects, the version of the deployment package object to use.
    --source-kmskey-arn=: The ARN of the Key Management Service (KMS) customer managed key that's used to encrypt your function's .zip deployment package.
    --zip-file=: The base64-encoded contents of the deployment package.
documentation:
    command: |-
        Updates a Lambda function's code. If code signing is enabled for the function, the code package must be signed by a trusted publisher. For more information, see [Configuring code signing for Lambda](https://docs.aws.amazon.com/lambda/latest/dg/configuration-codesigning.html).

        If the function's package type is `Image`, then you must specify the code package in `ImageUri` as the URI of a [container image](https://docs.aws.amazon.com/lambda/latest/dg/lambda-images.html) in the Amazon ECR registry.

        If the function's package type is `Zip`, then you must specify the deployment package as a [.zip file archive](https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-package.html#gettingstarted-package-zip). Enter the Amazon S3 bucket and key of the code .zip file location. You can also provide the function code inline using the `ZipFile` field.

        The code in the deployment package must be compatible with the target instruction set architecture of the function (`x86-64` or `arm64`).

        The function's code is locked when you publish a version. You can't modify the code of a published version, only the unpublished version.

        For a function defined as a container image, Lambda resolves the image tag to an image digest. In Amazon ECR, if you update the image tag to a new image, Lambda does not automatically update the function.
    flag:
        architectures: The instruction set architecture that the function supports. Enter a string array with one of the valid values (arm64 or x86\_64). The default value is `x86_64`.
        dry-run: Set to true to validate the request parameters and access permissions without modifying the function code.
        function-name: |-
            The name or ARN of the Lambda function.

            **Name formats**

            - **Function name** – `my-function`.
            - **Function ARN** – `arn:aws:lambda:us-west-2:123456789012:function:my-function`.
            - **Partial ARN** – `123456789012:function:my-function`.

            The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        image-uri: URI of a container image in the Amazon ECR registry. Do not use for a function defined with a .zip file archive.
        publish: Set to true to publish a new version of the function after updating the code. This has the same effect as calling [PublishVersion]() separately.
        revision-id: Update the function only if the revision ID matches the ID that's specified. Use this option to avoid modifying a function that has changed since you last read it.
        s3-bucket: An Amazon S3 bucket in the same Amazon Web Services Region as your function. The bucket can be in a different Amazon Web Services account. Use only with a function defined with a .zip file archive deployment package.
        s3-key: The Amazon S3 key of the deployment package. Use only with a function defined with a .zip file archive deployment package.
        s3-object-version: For versioned objects, the version of the deployment package object to use.
        source-kmskey-arn: The ARN of the Key Management Service (KMS) customer managed key that's used to encrypt your function's .zip deployment package. If you don't provide a customer managed key, Lambda uses an Amazon Web Services managed key.
        zip-file: The base64-encoded contents of the deployment package. Amazon Web Services SDK and CLI clients handle the encoding for you. Use only with a function defined with a .zip file archive deployment package.
