name: update-authorizer
description: Updates an authorizer.
flags:
    --authorizer-function-arn=: The ARN of the authorizer's Lambda function.
    --authorizer-name=!: The authorizer name.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enable-caching-for-http: When `true`, the result from the authorizer’s Lambda function is cached for the time specified in `refreshAfterInSeconds`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enable-caching-for-http: When `true`, the result from the authorizer’s Lambda function is cached for the time specified in `refreshAfterInSeconds`.
    --status=: The status of the update authorizer request.
    --token-key-name=: The key used to extract the token from the HTTP headers.
    --token-signing-public-keys=: The public keys used to verify the token signature.
completion:
    flag:
        status:
            - ACTIVE
            - INACTIVE
documentation:
    command: |-
        Updates an authorizer.

        Requires permission to access the [UpdateAuthorizer](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        authorizer-function-arn: The ARN of the authorizer's Lambda function.
        authorizer-name: The authorizer name.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enable-caching-for-http: When `true`, the result from the authorizer’s Lambda function is cached for the time specified in `refreshAfterInSeconds`. The cached result is used while the device reuses the same HTTP connection.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        status: The status of the update authorizer request.
        token-key-name: The key used to extract the token from the HTTP headers.
        token-signing-public-keys: The public keys used to verify the token signature.
