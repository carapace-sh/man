name: list-grouping-attribute-definitions
description: Retrieves the available grouping attribute definitions that can be used to create grouping configurations.
flags:
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        Retrieves the available grouping attribute definitions that can be used to create grouping configurations. These definitions specify the attributes and rules available for organizing services.

        Use this operation to discover what grouping options are available before creating or updating grouping configurations.
    flag:
        next-token: The token for the next set of results. Use this token to retrieve additional pages of grouping attribute definitions when the result set is large.
