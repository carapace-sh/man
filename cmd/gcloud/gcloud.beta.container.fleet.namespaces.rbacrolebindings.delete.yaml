name: delete
description: '*(BETA)*  *(REMOVED)*  Delete a fleet namespace RBAC RoleBinding.'
hidden: true
flags:
    --location=: Location for the rbacrolebinding.
    --namespace=: Name of the rbacrolebinding.
documentation:
    command: |-
        *(BETA)*  *(REMOVED)*  Delete a fleet namespace RBAC RoleBinding.

        This command has been removed as of version 447.0.0. Use `gcloud fleet scopes rbacrolebindings delete` instead.

        This command can fail for the following reasons:
        * The RoleBinding specified does not exist.
        * The caller does not have permission to access the given RoleBinding.

        ## EXAMPLES

        To delete RBAC RoleBinding `RBRB` in namespace `NAMESPACE` in the active
        project:

          $ gcloud beta container fleet namespaces rbacrolebindings delete RBRB --namespace=NAMESPACE
    flag:
        location: |-
            Location for the rbacrolebinding.
            +
            To set the `location` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        namespace: |-
            Name of the rbacrolebinding.
            +
            To set the `namespace` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--namespace` on the command line.
