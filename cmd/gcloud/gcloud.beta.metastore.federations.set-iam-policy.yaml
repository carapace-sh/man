name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for the federation.'
flags:
    --location=: The location of the Dataproc Metastore service.
documentation:
    command: |
        *(BETA)*  Sets the IAM policy for the given federation as defined in a JSON or YAML file.

        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.
    flag:
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `federation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
