name: put-dedicated-ip-pool-scaling-attributes
description: Used to convert a dedicated IP pool to a different scaling mode.
flags:
    --pool-name=!: The name of the dedicated IP pool.
    --scaling-mode=!: The scaling mode to apply to the dedicated IP pool.
completion:
    flag:
        scaling-mode:
            - STANDARD
            - MANAGED
documentation:
    command: |-
        Used to convert a dedicated IP pool to a different scaling mode.

        `MANAGED` pools cannot be converted to `STANDARD` scaling mode.
    flag:
        pool-name: The name of the dedicated IP pool.
        scaling-mode: |-
            The scaling mode to apply to the dedicated IP pool.

            Changing the scaling mode from `MANAGED` to `STANDARD` is not supported.
