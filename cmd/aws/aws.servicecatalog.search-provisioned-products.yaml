name: search-provisioned-products
description: Gets information about the provisioned products that meet the specified criteria.
flags:
    --accept-language=: The language code.
    --access-level-filter=: The access level to use to obtain results.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=: The search filters.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --page-size=: The maximum number of items to return with this call.
    --page-token=: The page token for the next set of results.
    --sort-by=: The sort field.
    --sort-order=: The sort order.
completion:
    flag:
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Gets information about the provisioned products that meet the specified criteria.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        access-level-filter: The access level to use to obtain results. The default is `Account`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: |-
            The search filters.

            When the key is `SearchQuery`, the searchable fields are `arn`, `createdTime`, `id`, `lastRecordId`, `idempotencyToken`, `name`, `physicalId`, `productId`, `provisioningArtifactId`, `type`, `status`, `tags`, `userArn`, `userArnSession`, `lastProvisioningRecordId`, `lastSuccessfulProvisioningRecordId`, `productName`, and `provisioningArtifactName`.

            Example: `"SearchQuery":["status:AVAILABLE"]`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        page-size: The maximum number of items to return with this call.
        page-token: The page token for the next set of results. To retrieve the first set of results, use null.
        sort-by: The sort field. If no value is specified, the results are not sorted. The valid values are `arn`, `id`, `name`, and `lastRecordId`.
        sort-order: The sort order. If no value is specified, the results are not sorted.
