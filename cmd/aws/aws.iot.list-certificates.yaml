name: list-certificates
description: Lists the certificates registered in your Amazon Web Services account.
flags:
    --ascending-order=: Specifies the order for results.
    --marker=: The marker for the next set of results.
    --page-size=: The result page size.
documentation:
    command: |-
        Lists the certificates registered in your Amazon Web Services account.

        The results are paginated with a default page size of 25. You can use the returned marker to retrieve additional results.

        Requires permission to access the [ListCertificates](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        ascending-order: Specifies the order for results. If True, the results are returned in ascending order, based on the creation date.
        marker: The marker for the next set of results.
        page-size: The result page size.
