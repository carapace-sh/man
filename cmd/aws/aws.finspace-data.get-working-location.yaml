name: get-working-location
description: A temporary Amazon S3 location, where you can copy your files from a source location to stage or use as a scratch space in FinSpace notebook.
flags:
    --location-type=: Specify the type of the working location.
completion:
    flag:
        location-type:
            - INGESTION
            - SAGEMAKER
documentation:
    command: A temporary Amazon S3 location, where you can copy your files from a source location to stage or use as a scratch space in FinSpace notebook.
    flag:
        location-type: |-
            Specify the type of the working location.

            - `SAGEMAKER` – Use the Amazon S3 location as a temporary location to store data content when working with FinSpace Notebooks that run on SageMaker studio.
            - `INGESTION` – Use the Amazon S3 location as a staging location to copy your data content and then use the location with the Changeset creation operation.
