name: get-group-query
description: Retrieves the resource query associated with the specified resource group.
flags:
    --group-name=: Don't use this parameter.
    --group=: The name or the Amazon resource name (ARN) of the resource group to query.
documentation:
    command: |-
        Retrieves the resource query associated with the specified resource group. For more information about resource queries, see [Create a tag-based group in Resource Groups](https://docs.aws.amazon.com/ARG/latest/userguide/gettingstarted-query.html#gettingstarted-query-cli-tag).

        **Minimum permissions**

        To run this command, you must have the following permissions:

        - `resource-groups:GetGroupQuery`
    flag:
        group: The name or the Amazon resource name (ARN) of the resource group to query.
        group-name: Don't use this parameter. Use `Group` instead.
