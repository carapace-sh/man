name: delete
description: Delete a Compute Engine organization security policy rule.
flags:
    --organization=: Organization which the organization security policy belongs to.
    --security-policy=!: short name of the security policy into which the rule should be deleted.
documentation:
    command: '*gcloud compute org-security-policies rules delete* is used to delete organization security policy rule.'
    flag:
        organization: Organization which the organization security policy belongs to. Must be set if SECURITY_POLICY is short name.
        security-policy: short name of the security policy into which the rule should be deleted.
