name: env-init
description: '*(ALPHA)*  Print the commands required to export pubsub emulator''s env variables.'
flags:
    --data-dir=: The directory to be used to store/retrieve data/config for an emulator run.
documentation:
    command: |-
        *(ALPHA)*  After starting the emulator, you need to set environment variables so that
        your application connects to the emulator instead of the production
        environment. Environment variables need to be set each time you start the
        emulator. The environment variables depend on dynamically assigned port
        numbers that could change when you restart the emulator.
    flag:
        data-dir: |-
            The directory to be used to store/retrieve data/config for an emulator run. The default value is `<USER_CONFIG_DIR>/emulators/pubsub`. The value of USER_CONFIG_DIR can be found by running:
            +
              $ gcloud info --format='get(config.paths.global_config_dir)'
