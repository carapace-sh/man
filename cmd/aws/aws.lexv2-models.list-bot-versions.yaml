name: list-bot-versions
description: Gets information about all of the versions of a bot.
flags:
    --bot-id=!: The identifier of the bot to list versions for.
    --max-results=: The maximum number of versions to return in each page of results.
    --next-token=: If the response to the `ListBotVersion` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response.
    --sort-by=: Specifies sorting parameters for the list of versions.
documentation:
    command: |-
        Gets information about all of the versions of a bot.

        The `ListBotVersions` operation returns a summary of each version of a bot. For example, if a bot has three numbered versions, the `ListBotVersions` operation returns for summaries, one for each numbered version and one for the `DRAFT` version.

        The `ListBotVersions` operation always returns at least one version, the `DRAFT` version.
    flag:
        bot-id: The identifier of the bot to list versions for.
        max-results: The maximum number of versions to return in each page of results. If there are fewer results than the max page size, only the actual number of results are returned.
        next-token: If the response to the `ListBotVersion` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response. Use that token in the `nextToken` parameter to return the next page of results.
        sort-by: Specifies sorting parameters for the list of versions. You can specify that the list be sorted by version name in either ascending or descending order.
