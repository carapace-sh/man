name: list-performance-analysis-reports
description: Lists all the analysis reports created for the DB instance.
flags:
    --identifier=!: An immutable identifier for a data source that is unique for an Amazon Web Services Region.
    --list-tags: Specifies whether or not to include the list of tags in the response.
    --max-results=: The maximum number of items to return in the response.
    --next-token=: An optional pagination token provided by a previous request.
    --no-list-tags&: Specifies whether or not to include the list of tags in the response.
    --service-type=!: The Amazon Web Services service for which Performance Insights returns metrics.
completion:
    flag:
        service-type:
            - RDS
            - DOCDB
documentation:
    command: Lists all the analysis reports created for the DB instance. The reports are sorted based on the start time of each report.
    flag:
        identifier: |-
            An immutable identifier for a data source that is unique for an Amazon Web Services Region. Performance Insights gathers metrics from this data source. In the console, the identifier is shown as *ResourceID*. When you call `DescribeDBInstances`, the identifier is returned as `DbiResourceId`.

            To use a DB instance as a data source, specify its `DbiResourceId` value. For example, specify `db-ABCDEFGHIJKLMNOPQRSTU1VW2X`.
        list-tags: Specifies whether or not to include the list of tags in the response.
        max-results: The maximum number of items to return in the response. If more items exist than the specified `MaxResults` value, a pagination token is included in the response so that the remaining results can be retrieved.
        next-token: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the token, up to the value specified by `MaxResults`.
        service-type: The Amazon Web Services service for which Performance Insights returns metrics. Valid value is `RDS`.
