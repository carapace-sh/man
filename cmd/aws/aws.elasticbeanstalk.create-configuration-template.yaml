name: create-configuration-template
description: Creates an AWS Elastic Beanstalk configuration template, associated with a specific Elastic Beanstalk application.
flags:
    --application-name=!: The name of the Elastic Beanstalk application to associate with this configuration template.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: An optional description for this configuration.
    --environment-id=: The ID of an environment whose settings you want to use to create the configuration template.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --option-settings=:
        description: Option values for the Elastic Beanstalk configuration, such as the instance type.
        nargs: -1
    --platform-arn=: The Amazon Resource Name (ARN) of the custom platform.
    --solution-stack-name=: The name of an Elastic Beanstalk solution stack (platform version) that this configuration uses.
    --source-configuration=: An Elastic Beanstalk configuration template to base this one on.
    --tags=:
        description: Specifies the tags applied to the configuration template.
        nargs: -1
    --template-name=!: The name of the configuration template.
documentation:
    command: |-
        Creates an AWS Elastic Beanstalk configuration template, associated with a specific Elastic Beanstalk application. You define application configuration settings in a configuration template. You can then use the configuration template to deploy different versions of the application with the same configuration settings.

        Templates aren't associated with any environment. The `EnvironmentName` response element is always `null`.

        Related Topics

        - [DescribeConfigurationOptions]()
        - [DescribeConfigurationSettings]()
        - [ListAvailableSolutionStacks]()
    flag:
        application-name: The name of the Elastic Beanstalk application to associate with this configuration template.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: An optional description for this configuration.
        environment-id: The ID of an environment whose settings you want to use to create the configuration template. You must specify `EnvironmentId` if you don't specify `PlatformArn`, `SolutionStackName`, or `SourceConfiguration`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        option-settings: Option values for the Elastic Beanstalk configuration, such as the instance type. If specified, these values override the values obtained from the solution stack or the source configuration template. For a complete list of Elastic Beanstalk configuration options, see [Option Values](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/command-options.html) in the *AWS Elastic Beanstalk Developer Guide*.
        platform-arn: |-
            The Amazon Resource Name (ARN) of the custom platform. For more information, see [Custom Platforms](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/custom-platforms.html) in the *AWS Elastic Beanstalk Developer Guide*.

            If you specify `PlatformArn`, then don't specify `SolutionStackName`.
        solution-stack-name: |-
            The name of an Elastic Beanstalk solution stack (platform version) that this configuration uses. For example, `64bit Amazon Linux 2013.09 running Tomcat 7 Java 7`. A solution stack specifies the operating system, runtime, and application server for a configuration template. It also determines the set of configuration options as well as the possible and default values. For more information, see [Supported Platforms](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/concepts.platforms.html) in the *AWS Elastic Beanstalk Developer Guide*.

            You must specify `SolutionStackName` if you don't specify `PlatformArn`, `EnvironmentId`, or `SourceConfiguration`.

            Use the [`ListAvailableSolutionStacks`](https://docs.aws.amazon.com/elasticbeanstalk/latest/api/API_ListAvailableSolutionStacks.html) API to obtain a list of available solution stacks.
        source-configuration: |-
            An Elastic Beanstalk configuration template to base this one on. If specified, Elastic Beanstalk uses the configuration values from the specified configuration template to create a new configuration.

            Values specified in `OptionSettings` override any values obtained from the `SourceConfiguration`.

            You must specify `SourceConfiguration` if you don't specify `PlatformArn`, `EnvironmentId`, or `SolutionStackName`.

            Constraint: If both solution stack name and source configuration are specified, the solution stack of the source configuration template must match the specified solution stack name.
        tags: Specifies the tags applied to the configuration template.
        template-name: |-
            The name of the configuration template.

            Constraint: This name must be unique per application.
