name: put-external-model
description: Creates or updates an Amazon SageMaker model endpoint.
flags:
    --input-configuration=!: The model endpoint input configuration.
    --invoke-model-endpoint-role-arn=!: The IAM role used to invoke the model endpoint.
    --model-endpoint-status=!: The model endpoint’s status in Amazon Fraud Detector.
    --model-endpoint=!: The model endpoints name.
    --model-source=!: The source of the model.
    --output-configuration=!: The model endpoint output configuration.
    --tags=: A collection of key and value pairs.
completion:
    flag:
        model-endpoint-status:
            - ASSOCIATED
            - DISSOCIATED
        model-source:
            - SAGEMAKER
documentation:
    command: Creates or updates an Amazon SageMaker model endpoint. You can also use this action to update the configuration of the model endpoint, including the IAM role and/or the mapped variables.
    flag:
        input-configuration: The model endpoint input configuration.
        invoke-model-endpoint-role-arn: The IAM role used to invoke the model endpoint.
        model-endpoint: The model endpoints name.
        model-endpoint-status: The model endpoint’s status in Amazon Fraud Detector.
        model-source: The source of the model.
        output-configuration: The model endpoint output configuration.
        tags: A collection of key and value pairs.
