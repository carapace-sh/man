name: list-ops-item-events
description: Returns a list of all OpsItem events in the current Amazon Web Services Region and Amazon Web Services account.
flags:
    --filters=: One or more OpsItem filters.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: A token to start the list.
documentation:
    command: Returns a list of all OpsItem events in the current Amazon Web Services Region and Amazon Web Services account. You can limit the results to events associated with specific OpsItems by specifying a filter.
    flag:
        filters: One or more OpsItem filters. Use a filter to return a more specific list of results.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: A token to start the list. Use this token to get the next set of results.
