name: list-applications
description: Lists Amazon Q Business applications.
flags:
    --max-results=: The maximum number of Amazon Q Business applications to return.
    --next-token=: If the `maxResults` response was incomplete because there is more data to retrieve, Amazon Q Business returns a pagination token in the response.
documentation:
    command: |-
        Lists Amazon Q Business applications.

        Amazon Q Business applications may securely transmit data for processing across Amazon Web Services Regions within your geography. For more information, see [Cross region inference in Amazon Q Business](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/cross-region-inference.html).
    flag:
        max-results: The maximum number of Amazon Q Business applications to return.
        next-token: If the `maxResults` response was incomplete because there is more data to retrieve, Amazon Q Business returns a pagination token in the response. You can use this pagination token to retrieve the next set of Amazon Q Business applications.
