name: import
description: '*(ALPHA)*  Import one or more GooGet packages into an artifact repository.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --gcs-source=!: The Google Cloud Storage location of a package to import.
    --location=: Location of the repository.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha artifacts googet import* imports GooGet packages from Google Cloud Storage into the specified
        artifact repository.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        gcs-source: |-
            The Google Cloud Storage location of a package to import.
            Wildcards may be added at the end to import multiple packages.
        location: |-
            Location of the repository.
            +
            To set the `location` attribute:
            * provide the argument `repository` on the command line with a fully specified name;
            * set the property `artifacts/repository` with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
