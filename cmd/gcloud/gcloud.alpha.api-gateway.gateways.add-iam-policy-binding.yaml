name: add-iam-policy-binding
description: '*(ALPHA)*  Add IAM policy binding to a gateway.'
flags:
    --location=: Cloud location for gateway.
    --member=!: The principal to add the binding for.
    --role=!: Role name to assign to the principal.
documentation:
    command: '*(ALPHA)*  Add IAM policy binding to a gateway.'
    flag:
        location: |-
            Cloud location for gateway.
            +
            To set the `location` attribute:
            * provide the argument `gateway` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        member: |-
            The principal to add the binding for. Should be of the form `user|group|serviceAccount:email` or
            `domain:domain`.
            +
            Examples: `user:test-user@gmail.com`, `group:admins@example.com`,
            `serviceAccount:test123@example.domain.com`, or
            `domain:example.domain.com`.
            +
            Some resources also accept the following special values:
            * `allUsers` - Special identifier that represents anyone who is on the internet,
               with or without a Google account.
            * `allAuthenticatedUsers` - Special identifier that represents anyone who is
               authenticated with a Google account or a service account.
        role: |-
            Role name to assign to the principal. The role name is the complete path of
            a predefined role, such as `roles/logging.viewer`, or the role ID for a
            custom role, such as `organizations/{ORGANIZATION_ID}/roles/logging.viewer`.
