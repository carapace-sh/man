name: batch-disable-alarm
description: Disables one or more alarms.
flags:
    --disable-action-requests=!: The list of disable action requests.
documentation:
    command: Disables one or more alarms. The alarms change to the `DISABLED` state after you disable them.
    flag:
        disable-action-requests: The list of disable action requests. You can specify up to 10 requests per operation.
