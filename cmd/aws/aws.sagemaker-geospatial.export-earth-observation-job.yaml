name: export-earth-observation-job
description: Use this operation to export results of an Earth Observation job and optionally source images used as input to the EOJ to an Amazon S3 location.
flags:
    --arn=!: The input Amazon Resource Name (ARN) of the Earth Observation job being exported.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique token that guarantees that the call to this API is idempotent.
    --execution-role-arn=!: The Amazon Resource Name (ARN) of the IAM role that you specified for the job.
    --export-source-images: The source images provided to the Earth Observation job being exported.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-export-source-images: The source images provided to the Earth Observation job being exported.
    --output-config=!: An object containing information about the output file.
documentation:
    command: Use this operation to export results of an Earth Observation job and optionally source images used as input to the EOJ to an Amazon S3 location.
    flag:
        arn: The input Amazon Resource Name (ARN) of the Earth Observation job being exported.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique token that guarantees that the call to this API is idempotent.
        execution-role-arn: The Amazon Resource Name (ARN) of the IAM role that you specified for the job.
        export-source-images: The source images provided to the Earth Observation job being exported.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        output-config: An object containing information about the output file.
