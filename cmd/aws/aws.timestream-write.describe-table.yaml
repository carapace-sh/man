name: describe-table
description: Returns information about the table, including the table name, database name, retention duration of the memory store and the magnetic store.
flags:
    --database-name=!: The name of the Timestream database.
    --table-name=!: The name of the Timestream table.
documentation:
    command: Returns information about the table, including the table name, database name, retention duration of the memory store and the magnetic store. [Service quotas apply](https://docs.aws.amazon.com/timestream/latest/developerguide/ts-limits.html). See [code sample](https://docs.aws.amazon.com/timestream/latest/developerguide/code-samples.describe-table.html) for details.
    flag:
        database-name: The name of the Timestream database.
        table-name: The name of the Timestream table.
