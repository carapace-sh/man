name: set-iam-policy
description: '*(BETA)*  Set the IAM policy of the given storage pool.'
flags:
    --zone=: The name of the Google Compute Engine zone.
documentation:
    command: '*(BETA)*  Set the IAM policy of the given storage pool.'
    flag:
        zone: |-
            The name of the Google Compute Engine zone.
            +
            To set the `zone` attribute:
            * provide the argument `storage_pool` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
