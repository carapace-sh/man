name: list-tables
description: Returns an array of table names associated with the current account and endpoint.
flags:
    --exclusive-start-table-name=: The first table name that this operation will evaluate.
    --limit=: A maximum number of table names to return.
documentation:
    command: Returns an array of table names associated with the current account and endpoint. The output from `ListTables` is paginated, with each page returning a maximum of 100 table names.
    flag:
        exclusive-start-table-name: The first table name that this operation will evaluate. Use the value that was returned for `LastEvaluatedTableName` in a previous operation, so that you can obtain the next page of results.
        limit: A maximum number of table names to return. If this parameter is not specified, the limit is 100.
