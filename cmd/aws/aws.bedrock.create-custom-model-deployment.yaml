name: create-custom-model-deployment
description: Deploys a custom model for on-demand inference in Amazon Bedrock.
flags:
    --client-request-token=: A unique, case-sensitive identifier to ensure that the operation completes no more than one time.
    --description=: A description for the custom model deployment to help you identify its purpose.
    --model-arn=!: The Amazon Resource Name (ARN) of the custom model to deploy for on-demand inference.
    --model-deployment-name=!: The name for the custom model deployment.
    --tags=: Tags to assign to the custom model deployment.
documentation:
    command: |-
        Deploys a custom model for on-demand inference in Amazon Bedrock. After you deploy your custom model, you use the deployment's Amazon Resource Name (ARN) as the `modelId` parameter when you submit prompts and generate responses with model inference.

        For more information about setting up on-demand inference for custom models, see [Set up inference for a custom model](https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-use.html).

        The following actions are related to the `CreateCustomModelDeployment` operation:

        - [GetCustomModelDeployment](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_GetCustomModelDeployment.html)
        - [ListCustomModelDeployments](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_ListCustomModelDeployments.html)
        - [DeleteCustomModelDeployment](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_DeleteCustomModelDeployment.html)
    flag:
        client-request-token: A unique, case-sensitive identifier to ensure that the operation completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-idempotency.html).
        description: A description for the custom model deployment to help you identify its purpose.
        model-arn: The Amazon Resource Name (ARN) of the custom model to deploy for on-demand inference. The custom model must be in the `Active` state.
        model-deployment-name: The name for the custom model deployment. The name must be unique within your Amazon Web Services account and Region.
        tags: Tags to assign to the custom model deployment. You can use tags to organize and track your Amazon Web Services resources for cost allocation and management purposes.
