name: list-resources-for-web-acl
description: This is **AWS WAF Classic Regional** documentation.
flags:
    --resource-type=: The type of resource to list, either an application load balancer or Amazon API Gateway.
    --web-aclid=!: The unique identifier (ID) of the web ACL for which to list the associated resources.
completion:
    flag:
        resource-type:
            - APPLICATION_LOAD_BALANCER
            - API_GATEWAY
documentation:
    command: |-
        This is **AWS WAF Classic Regional** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.

        **For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.

        Returns an array of resources associated with the specified web ACL.
    flag:
        resource-type: The type of resource to list, either an application load balancer or Amazon API Gateway.
        web-aclid: The unique identifier (ID) of the web ACL for which to list the associated resources.
