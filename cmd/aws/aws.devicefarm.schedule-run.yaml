name: schedule-run
description: Schedules a run.
flags:
    --app-arn=: The ARN of an application package to run tests against, created with [CreateUpload]().
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=: Information about the settings for the run to be scheduled.
    --device-pool-arn=: The ARN of the device pool for the run to be scheduled.
    --device-selection-configuration=: The filter criteria used to dynamically select a set of devices for a test run and the maximum number of devices to be included in the run.
    --execution-configuration=: Specifies configuration information about a test run, such as the execution timeout (in minutes).
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: The name for the run to be scheduled.
    --project-arn=!: The ARN of the project for the run to be scheduled.
    --test=!: Information about the test for the run to be scheduled.
documentation:
    command: Schedules a run.
    flag:
        app-arn: The ARN of an application package to run tests against, created with [CreateUpload](). See [ListUploads]().
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: Information about the settings for the run to be scheduled.
        device-pool-arn: The ARN of the device pool for the run to be scheduled.
        device-selection-configuration: |-
            The filter criteria used to dynamically select a set of devices for a test run and the maximum number of devices to be included in the run.

            Either **`devicePoolArn`** or **`deviceSelectionConfiguration`** is required in a request.
        execution-configuration: Specifies configuration information about a test run, such as the execution timeout (in minutes).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name for the run to be scheduled.
        project-arn: The ARN of the project for the run to be scheduled.
        test: Information about the test for the run to be scheduled.
