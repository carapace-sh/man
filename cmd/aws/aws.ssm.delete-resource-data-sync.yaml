    --sync-type=: Specify the type of resource data sync to delete.
documentation:
    command: Deletes a resource data sync configuration. After the configuration is deleted, changes to data on managed nodes are no longer synced to or from the target. Deleting a sync configuration doesn't delete data.
    flag:
