name: update-contact
description: Updates the contact or escalation plan specified.
flags:
    --contact-id=!: The Amazon Resource Name (ARN) of the contact or escalation plan you're updating.
    --display-name=: The full name of the contact or escalation plan.
    --plan=: A list of stages.
documentation:
    command: Updates the contact or escalation plan specified.
    flag:
        contact-id: The Amazon Resource Name (ARN) of the contact or escalation plan you're updating.
        display-name: The full name of the contact or escalation plan.
        plan: A list of stages. A contact has an engagement plan with stages for specified contact channels. An escalation plan uses these stages to contact specified contacts.
