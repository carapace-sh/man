name: describe-dbcluster-backtracks
description: Returns information about backtracks for a DB cluster.
flags:
    --backtrack-identifier=: If specified, this value is the backtrack identifier of the backtrack to be described.
    --dbcluster-identifier=!: The DB cluster identifier of the DB cluster to be described.
    --filters=: A filter that specifies one or more DB clusters to describe.
    --marker=: An optional pagination token provided by a previous `DescribeDBClusterBacktracks` request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: |-
        Returns information about backtracks for a DB cluster.

        For more information on Amazon Aurora, see [What is Amazon Aurora?](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html) in the *Amazon Aurora User Guide*.

        This action only applies to Aurora MySQL DB clusters.
    flag:
        backtrack-identifier: |-
            If specified, this value is the backtrack identifier of the backtrack to be described.

            Constraints:

            - Must contain a valid universally unique identifier (UUID). For more information about UUIDs, see [Universally unique identifier](https://en.wikipedia.org/wiki/Universally_unique_identifier).

            Example: `123e4567-e89b-12d3-a456-426655440000`
        dbcluster-identifier: |-
            The DB cluster identifier of the DB cluster to be described. This parameter is stored as a lowercase string.

            Constraints:

            - Must contain from 1 to 63 alphanumeric characters or hyphens.
            - First character must be a letter.
            - Can't end with a hyphen or contain two consecutive hyphens.

            Example: `my-cluster1`
        filters: "A filter that specifies one or more DB clusters to describe. Supported filters include the following:\n\n- `db-cluster-backtrack-id` - Accepts backtrack identifiers. The results list includes information about only the backtracks identified by these identifiers.\n- `db-cluster-backtrack-status` - Accepts any of the following backtrack status values:\n  \n  - `applying`\n  - `completed`\n  - `failed`\n  - `pending`\n  \n  The results list includes information about only the backtracks identified by these values."
        marker: An optional pagination token provided by a previous `DescribeDBClusterBacktracks` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
