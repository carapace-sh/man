name: list-connectors
description: Lists the connectors belonging to your Amazon Web Services account.
flags:
    --max-results=: The maximum number of objects that you want Connector for SCEP to return for this request.
    --next-token=: When you request a list of objects with a `MaxResults` setting, if the number of objects that are still available for retrieval exceeds the maximum you requested, Connector for SCEP returns a `NextToken` value in the response.
documentation:
    command: Lists the connectors belonging to your Amazon Web Services account.
    flag:
        max-results: The maximum number of objects that you want Connector for SCEP to return for this request. If more objects are available, in the response, Connector for SCEP provides a `NextToken` value that you can use in a subsequent call to get the next batch of objects.
        next-token: When you request a list of objects with a `MaxResults` setting, if the number of objects that are still available for retrieval exceeds the maximum you requested, Connector for SCEP returns a `NextToken` value in the response. To retrieve the next batch of objects, use the token returned from the prior request in your next request.
