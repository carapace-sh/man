name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for the named repository.'
documentation:
    command: |-
        *(BETA)*  This command sets the IAM policy for the given repository from the
        policy in the provided file.

        ## EXAMPLES

        To set the IAM policy, issue the following command:

          $ gcloud beta source repos set-iam-policy REPOSITORY_NAME POLICY_FILE
