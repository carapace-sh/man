name: delete
description: '*(BETA)*  Delete a sink.'
flags:
    --billing-account=: Billing account of the sink to delete.
    --folder=: Folder of the sink to delete.
    --organization=: Organization of the sink to delete.
documentation:
    command: |-
        *(BETA)*  Delete a sink and halt the export of log entries associated with that sink.
        Deleting a sink does not affect log entries already exported through
        the deleted sink, and will not affect other sinks that are exporting
        the same log(s).

        ## EXAMPLES

        To delete a sync 'my-bq-sync':

          $ gcloud beta logging sinks delete my-bq-sink
    flag:
        billing-account: Billing account of the sink to delete.
        folder: Folder of the sink to delete.
        organization: Organization of the sink to delete.
