name: update
description: Update a workforce pool.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: A description for the workforce pool.
    --disable-programmatic-signin: Disables the programmatic sign-in for workforce pool users.
    --disabled: Disables the workforce pool.
    --display-name=: A display name for the workforce pool.
    --location=: The location for the workforce pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disable-programmatic-signin&: Disables the programmatic sign-in for workforce pool users.
    --no-disabled&: Disables the workforce pool.
    --session-duration=: How long the Google Cloud access tokens, console sign-in sessions, and gcloud sign-in sessions
documentation:
    command: Update a workforce pool.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: A description for the workforce pool. Cannot exceed 256 characters in length.
        disable-programmatic-signin: |-
            Disables the programmatic sign-in for workforce pool users. Specify
             `--no-disable-security-token-exchange` to enable programmatic sign-in. For more
            information, refer to Obtain short-lived tokens for workforce identity federation at
            https://cloud.google.com/iam/docs/workforce-obtaining-short-lived-credentials
        disabled: |-
            Disables the workforce pool. You cannot use a disabled workforce pool to
            perform new token exchanges or sign-ins using any provider in the workforce pool. Specify
            `--no-disabled` to enable a disabled pool.
        display-name: A display name for the workforce pool. Cannot exceed 32 characters in length.
        location: |-
            The location for the workforce pool.
            +
            To set the `location` attribute:
            * provide the argument `workforce_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disable-programmatic-signin: |-
            Disables the programmatic sign-in for workforce pool users. Specify
             `--no-disable-security-token-exchange` to enable programmatic sign-in. For more
            information, refer to Obtain short-lived tokens for workforce identity federation at
            https://cloud.google.com/iam/docs/workforce-obtaining-short-lived-credentials
        no-disabled: |-
            Disables the workforce pool. You cannot use a disabled workforce pool to
            perform new token exchanges or sign-ins using any provider in the workforce pool. Specify
            `--no-disabled` to enable a disabled pool.
        session-duration: |-
            How long the Google Cloud access tokens, console sign-in sessions, and gcloud sign-in sessions
            from this workforce pool are valid. Must be greater than 15 minutes (900s) and less than 12
            hours (43200s). If not configured, minted credentials will have a default duration of one
            hour (3600s).
