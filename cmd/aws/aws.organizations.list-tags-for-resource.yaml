name: list-tags-for-resource
description: Lists tags that are attached to the specified resource.
flags:
    --next-token=: The parameter for receiving additional results if you receive a `NextToken` response in a previous request.
    --resource-id=!: The ID of the resource with the tags to list.
documentation:
    command: |-
        Lists tags that are attached to the specified resource.

        You can attach tags to the following resources in Organizations.

        - Amazon Web Services account
        - Organization root
        - Organizational unit (OU)
        - Policy (any type)

        This operation can be called only from the organization's management account or by a member account that is a delegated administrator.
    flag:
        next-token: The parameter for receiving additional results if you receive a `NextToken` response in a previous request. A `NextToken` response indicates that more output is available. Set this parameter to the value of the previous call's `NextToken` response to indicate where the output should continue from.
        resource-id: |-
            The ID of the resource with the tags to list.

            You can specify any of the following taggable resources.

            - Amazon Web Services account – specify the account ID number.
            - Organizational unit – specify the OU ID that begins with `ou-` and looks similar to: `ou-1a2b-34uvwxyz`
            - Root – specify the root ID that begins with `r-` and looks similar to: `r-1a2b`
            - Policy – specify the policy ID that begins with `p-` andlooks similar to: `p-12abcdefg3`
