documentation:
    command: |-
        *(BETA)*  This command waits for the variable resource with the specified name to either
        have its value changed or be deleted.
    flag:
        config-name: The name of the configuration resource to use.
        max-wait: |-
            An optional maximum time to wait. For example, "30s".
            See $ gcloud topic datetimes for information on duration formats.
        newer-than: |-
            Return immediately if the stored variable is
                                    newer than this time. See $ gcloud topic datetimes
                                    for information on time formats.
