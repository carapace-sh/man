name: update-theme-permissions
description: Updates the resource permissions for a theme.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the theme.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --grant-permissions=:
        description: A list of resource permissions to be granted for the theme.
        nargs: -1
    --revoke-permissions=:
        description: A list of resource permissions to be revoked from the theme.
        nargs: -1
    --theme-id=!: The ID for the theme.
documentation:
    command: "Updates the resource permissions for a theme. Permissions apply to the action to grant or revoke permissions on, for example `\"quicksight:DescribeTheme\"`.\n\nTheme permissions apply in groupings. Valid groupings include the following for the three levels of permissions, which are user, owner, or no permissions:\n\n- User\n  \n  - `\"quicksight:DescribeTheme\"`\n  - `\"quicksight:DescribeThemeAlias\"`\n  - `\"quicksight:ListThemeAliases\"`\n  - `\"quicksight:ListThemeVersions\"`\n- Owner\n  \n  - `\"quicksight:DescribeTheme\"`\n  - `\"quicksight:DescribeThemeAlias\"`\n  - `\"quicksight:ListThemeAliases\"`\n  - `\"quicksight:ListThemeVersions\"`\n  - `\"quicksight:DeleteTheme\"`\n  - `\"quicksight:UpdateTheme\"`\n  - `\"quicksight:CreateThemeAlias\"`\n  - `\"quicksight:DeleteThemeAlias\"`\n  - `\"quicksight:UpdateThemeAlias\"`\n  - `\"quicksight:UpdateThemePermissions\"`\n  - `\"quicksight:DescribeThemePermissions\"`\n- To specify no permissions, omit the permissions list."
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the theme.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        grant-permissions: A list of resource permissions to be granted for the theme.
        revoke-permissions: A list of resource permissions to be revoked from the theme.
        theme-id: The ID for the theme.
