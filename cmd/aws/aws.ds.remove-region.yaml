name: remove-region
description: Stops all replication and removes the domain controllers from the specified Region.
flags:
    --directory-id=!: The identifier of the directory for which you want to remove Region replication.
documentation:
    command: Stops all replication and removes the domain controllers from the specified Region. You cannot remove the primary Region with this operation. Instead, use the `DeleteDirectory` API.
    flag:
        directory-id: The identifier of the directory for which you want to remove Region replication.
