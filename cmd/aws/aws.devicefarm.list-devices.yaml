documentation:
    command: Gets information about unique device types.
    flag:
        arn: The Amazon Resource Name (ARN) of the project.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: "Used to select a set of devices. A filter is made up of an attribute, an operator, and one or more values.\n\n- Attribute: The aspect of a device such as platform or model used as the selection criteria in a device filter.\n  \n  Allowed values include:\n  \n  - ARN: The Amazon Resource Name (ARN) of the device (for example, `arn:aws:devicefarm:us-west-2::device:12345Example`).\n  - PLATFORM: The device platform. Valid values are ANDROID or IOS.\n  - OS\\_VERSION: The operating system version (for example, 10.3.2).\n  - MODEL: The device model (for example, iPad 5th Gen).\n  - AVAILABILITY: The current availability of the device. Valid values are AVAILABLE, HIGHLY\\_AVAILABLE, BUSY, or TEMPORARY\\_NOT\\_AVAILABLE.\n  - FORM\\_FACTOR: The device form factor. Valid values are PHONE or TABLET.\n  - MANUFACTURER: The device manufacturer (for example, Apple).\n  - REMOTE\\_ACCESS\\_ENABLED: Whether the device is enabled for remote access. Valid values are TRUE or FALSE.\n  - REMOTE\\_DEBUG\\_ENABLED: Whether the device is enabled for remote debugging. Valid values are TRUE or FALSE. Because remote debugging is [no longer supported](https://docs.aws.amazon.com/devicefarm/latest/developerguide/history.html), this attribute is ignored.\n  - INSTANCE\\_ARN: The Amazon Resource Name (ARN) of the device instance.\n  - INSTANCE\\_LABELS: The label of the device instance.\n  - FLEET\\_TYPE: The fleet type. Valid values are PUBLIC or PRIVATE.\n- Operator: The filter operator.\n  \n  - The EQUALS operator is available for every attribute except INSTANCE\\_LABELS.\n  - The CONTAINS operator is available for the INSTANCE\\_LABELS and MODEL attributes.\n  - The IN and NOT\\_IN operators are available for the ARN, OS\\_VERSION, MODEL, MANUFACTURER, and INSTANCE\\_ARN attributes.\n  - The LESS\\_THAN, GREATER\\_THAN, LESS\\_THAN\\_OR\\_EQUALS, and GREATER\\_THAN\\_OR\\_EQUALS operators are also available for the OS\\_VERSION attribute.\n- Values: An array of one or more filter values.\n  \n  - The IN and NOT\\_IN operators take a values array that has one or more elements.\n  - The other operators require an array with a single element.\n  - In a request, the AVAILABILITY attribute takes the following values: AVAILABLE, HIGHLY\\_AVAILABLE, BUSY, or TEMPORARY\\_NOT\\_AVAILABLE."
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        next-token: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
