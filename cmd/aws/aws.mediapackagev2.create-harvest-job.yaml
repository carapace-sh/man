name: create-harvest-job
description: Creates a new harvest job to export content from a MediaPackage v2 channel to an S3 bucket.
flags:
    --channel-group-name=!: The name of the channel group containing the channel from which to harvest content.
    --channel-name=!: The name of the channel from which to harvest content.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=: An optional description for the harvest job.
    --destination=!: The S3 destination where the harvested content will be placed.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --harvest-job-name=: A name for the harvest job.
    --harvested-manifests=!: A list of manifests to be harvested.
    --origin-endpoint-name=!: The name of the origin endpoint from which to harvest content.
    --schedule-configuration=!: The configuration for when the harvest job should run, including start and end times.
    --tags=: A collection of tags associated with the harvest job.
documentation:
    command: Creates a new harvest job to export content from a MediaPackage v2 channel to an S3 bucket.
    flag:
        channel-group-name: The name of the channel group containing the channel from which to harvest content.
        channel-name: The name of the channel from which to harvest content.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        description: An optional description for the harvest job.
        destination: The S3 destination where the harvested content will be placed.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        harvest-job-name: A name for the harvest job. This name must be unique within the channel.
        harvested-manifests: A list of manifests to be harvested.
        origin-endpoint-name: The name of the origin endpoint from which to harvest content.
        schedule-configuration: The configuration for when the harvest job should run, including start and end times.
        tags: A collection of tags associated with the harvest job.
