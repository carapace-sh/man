name: search-cases
description: Searches for cases within their associated Cases domain.
flags:
    --domain-id=!: The unique identifier of the Cases domain.
    --fields=: The list of field identifiers to be returned as part of the response.
    --filter=: A list of filter objects.
    --max-results=: The maximum number of cases to return.
    --next-token=: The token for the next set of results.
    --search-term=: A word or phrase used to perform a quick search.
    --sorts=: A list of sorts where each sort specifies a field and their sort order to be applied to the results.
documentation:
    command: |-
        Searches for cases within their associated Cases domain. Search results are returned as a paginated list of abridged case documents.

        For `customer_id` you must provide the full customer profile ARN in this format: `arn:aws:profile:your AWS Region:your AWS account ID:domains/profiles domain name/profiles/profile ID`.
    flag:
        domain-id: The unique identifier of the Cases domain.
        fields: The list of field identifiers to be returned as part of the response.
        filter: A list of filter objects.
        max-results: The maximum number of cases to return. When no value is provided, 25 is the default.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        search-term: A word or phrase used to perform a quick search.
        sorts: A list of sorts where each sort specifies a field and their sort order to be applied to the results.
