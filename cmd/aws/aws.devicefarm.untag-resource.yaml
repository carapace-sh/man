name: untag-resource
description: Deletes the specified tags from a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource or resources from which to delete tags.
    --tag-keys=!: The keys of the tags to be removed.
documentation:
    command: Deletes the specified tags from a resource.
    flag:
        resource-arn: 'The Amazon Resource Name (ARN) of the resource or resources from which to delete tags. You can associate tags with the following Device Farm resources: `PROJECT`, `RUN`, `NETWORK_PROFILE`, `INSTANCE_PROFILE`, `DEVICE_INSTANCE`, `SESSION`, `DEVICE_POOL`, `DEVICE`, and `VPCE_CONFIGURATION`.'
        tag-keys: The keys of the tags to be removed.
