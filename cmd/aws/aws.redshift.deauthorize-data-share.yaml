name: deauthorize-data-share
description: From a datashare producer account, removes authorization from the specified datashare.
flags:
    --consumer-identifier=!: The identifier of the data consumer that is to have authorization removed from the datashare.
    --data-share-arn=!: The namespace Amazon Resource Name (ARN) of the datashare to remove authorization from.
documentation:
    command: From a datashare producer account, removes authorization from the specified datashare.
    flag:
        consumer-identifier: The identifier of the data consumer that is to have authorization removed from the datashare. This identifier is an Amazon Web Services account ID or a keyword, such as ADX.
        data-share-arn: The namespace Amazon Resource Name (ARN) of the datashare to remove authorization from.
