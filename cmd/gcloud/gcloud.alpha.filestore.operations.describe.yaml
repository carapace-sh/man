name: describe
description: '*(ALPHA)*  Describe a Filestore operation.'
flags:
    --location=: Location of the Cloud Filestore instance/operation.
    --zone=: The zone of the operation.
documentation:
    command: '*(ALPHA)*  Describe a Filestore operation.'
    flag:
        location: Location of the Cloud Filestore instance/operation.
        zone: |-
            The zone of the operation.
            +
            To set the `zone` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * provide the argument `region` on the command line;
            * provide the argument `location` on the command line;
            * set the property `filestore/zone`;
            * set the property `filestore/region`;
            * set the property `filestore/location`.
