name: update
description: '*(ALPHA)*  Update TrustConfig.'
flags:
    --add-allowlisted-certificates=: Add allowlisted PEM-encoded certificates.
    --async: Return immediately, without waiting for the operation in progress to
    --clear-allowlisted-certificates: Clear all allowlisted certificates.
    --clear-labels: Remove all labels.
    --description=: Human-readable description of the resource.
    --location=: Certificate Manager location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-allowlisted-certificates&: Clear all allowlisted certificates.
    --no-clear-labels&: Remove all labels.
    --remove-allowlisted-certificates=: Remove allowlisted PEM-encoded certificates.
    --remove-labels=: List of label keys to remove.
    --trust-store=: Trust Store with the given trust anchor and intermediate CA PEM-encoded certificates.
    --update-labels=: List of label KEY=VALUE pairs to update.
documentation:
    command: |
        *(ALPHA)*  Update a TrustConfig.
    flag:
        add-allowlisted-certificates: |-
            Add allowlisted PEM-encoded certificates.
            Certificates should be provided in files. For multiple file names, separate them by a comma (',').
            One file can contain multiple certificates.
            +
            Examples:
            +
              Single file: --add-allowlisted-certificates=ac.pem
            +
              Multiple files: --add-allowlisted-certificates=ac1.pem,ac2.pem
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-allowlisted-certificates: Clear all allowlisted certificates.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        description: Human-readable description of the resource.
        location: |-
            Certificate Manager location.
            +
            To set the `location` attribute:
            * provide the argument `trust_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * default value of location is [global].
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-allowlisted-certificates: |
            Clear all allowlisted certificates.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        remove-allowlisted-certificates: |-
            Remove allowlisted PEM-encoded certificates.
            Certificates should be provided in files. For multiple file names, separate them by a comma (',').
            One file can contain multiple certificates.
            +
            Examples:
            +
              Single file: --remove-allowlisted-certificates=ac.pem
            +
              Multiple files: --remove-allowlisted-certificates=ac1.pem,ac2.pem
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        trust-store: |-
            Trust Store with the given trust anchor and intermediate CA PEM-encoded certificates.
            Certificates should be provided in files. For multiple file names, separate them by a semicolon (';') and quote them ('"').
            One file can contain multiple certificates.
            Intermediate CAs are optional.
            +
            Examples:
            +
              Single files: --trust-store trust-anchors=ta.pem,intermediate-cas=ica.pem
            +
              No intermediate CAs: --trust-store trust-anchors=ta.pem
            +
              Multiple files: --trust-store trust-anchors="ta1.pem;ta2.pem",intermediate-cas="ica1.pem;ica2.pem"
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
