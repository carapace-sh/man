name: create
description: Creates a TagValue resource.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: User-assigned description of the TagKey or TagValue.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --parent=!: Parent of the TagValue in either in the form of tagKeys/{id} or {org_id}/{tagkey_short_name}
documentation:
    command: |-
        Creates a TagValue resource given the short_name and description (optional)
        as well as the parent, the of the TagValue. The parent of the
        TagValue can be a TagKey or TagValue. The parent  can be specified by
        its numeric ID or its namespaced name.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: User-assigned description of the TagKey or TagValue. Must not exceed 256 characters.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        parent: Parent of the TagValue in either in the form of tagKeys/{id} or {org_id}/{tagkey_short_name}
