name: detect-text
description: '*(ALPHA)*  Detect and extract text within an image.'
flags:
    --language-hints=: List of languages to use for text detection.
    --model-version=: Model version to use for the feature.
completion:
    flag:
        model-version:
            - builtin/latest
            - builtin/stable
documentation:
    command: |
        *(ALPHA)*  Detect and extract text within an image.

        Google Cloud Vision uses OCR (Optical Character Recognition) to detect
        text within an image, with support for a broad array of languages and
        automatic label detection.

        {language_hints}
    flag:
        language-hints: List of languages to use for text detection.
        model-version: 'Model version to use for the feature. _MODEL_VERSION_ must be one of: *builtin/latest*, *builtin/stable*.'
