name: copy-db-cluster-parameter-group
description: Copies the specified cluster parameter group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --source-db-cluster-parameter-group-identifier=!: The identifier or Amazon Resource Name (ARN) for the source cluster parameter group.
    --tags=: The tags that are to be assigned to the parameter group.
    --target-db-cluster-parameter-group-description=!: A description for the copied cluster parameter group.
    --target-db-cluster-parameter-group-identifier=!: The identifier for the copied cluster parameter group.
documentation:
    command: Copies the specified cluster parameter group.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        source-db-cluster-parameter-group-identifier: |-
            The identifier or Amazon Resource Name (ARN) for the source cluster parameter group.

            Constraints:

            - Must specify a valid cluster parameter group.
            - If the source cluster parameter group is in the same Amazon Web Services Region as the copy, specify a valid parameter group identifier; for example, `my-db-cluster-param-group`, or a valid ARN.
            - If the source parameter group is in a different Amazon Web Services Region than the copy, specify a valid cluster parameter group ARN; for example, `arn:aws:rds:us-east-1:123456789012:sample-cluster:sample-parameter-group`.
        tags: The tags that are to be assigned to the parameter group.
        target-db-cluster-parameter-group-description: A description for the copied cluster parameter group.
        target-db-cluster-parameter-group-identifier: |-
            The identifier for the copied cluster parameter group.

            Constraints:

            - Cannot be null, empty, or blank.
            - Must contain from 1 to 255 letters, numbers, or hyphens.
            - The first character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.

            Example: `my-cluster-param-group1`
