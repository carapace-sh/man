name: set-status
description: Requests that the status of the specified physical or logical pipeline objects be updated in the specified pipeline.
flags:
    --object-ids=!: The IDs of the objects.
    --pipeline-id=!: The ID of the pipeline that contains the objects.
    --status=!: The status to be set on all the objects specified in `objectIds`.
documentation:
    command: Requests that the status of the specified physical or logical pipeline objects be updated in the specified pipeline. This update might not occur immediately, but is eventually consistent. The status that can be set depends on the type of object (for example, DataNode or Activity). You cannot perform this operation on `FINISHED` pipelines and attempting to do so returns `InvalidRequestException`.
    flag:
        object-ids: The IDs of the objects. The corresponding objects can be either physical or components, but not a mix of both types.
        pipeline-id: The ID of the pipeline that contains the objects.
        status: The status to be set on all the objects specified in `objectIds`. For components, use `PAUSE` or `RESUME`. For instances, use `TRY_CANCEL`, `RERUN`, or `MARK_FINISHED`.
