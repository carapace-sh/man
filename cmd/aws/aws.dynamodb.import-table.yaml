name: import-table
description: Imports table data from an S3 bucket.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Providing a `ClientToken` makes the call to `ImportTableInput` idempotent, meaning that multiple identical calls have the same effect as one single call.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-compression-type=: Type of compression to be used on the input coming from the imported table.
    --input-format-options=: Additional properties that specify how the input is formatted,
    --input-format=!: The format of the source data.
    --s3-bucket-source=!: The S3 bucket that provides the source for the import.
    --table-creation-parameters=!: Parameters for the table to import the data into.
completion:
    flag:
        input-compression-type:
            - GZIP
            - ZSTD
            - NONE
        input-format:
            - DYNAMODB_JSON
            - ION
            - CSV
documentation:
    command: Imports table data from an S3 bucket.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            Providing a `ClientToken` makes the call to `ImportTableInput` idempotent, meaning that multiple identical calls have the same effect as one single call.

            A client token is valid for 8 hours after the first request that uses it is completed. After 8 hours, any request with the same client token is treated as a new request. Do not resubmit the same request with the same client token for more than 8 hours, or the result might not be idempotent.

            If you submit a request with the same client token but a change in other parameters within the 8-hour idempotency window, DynamoDB returns an `IdempotentParameterMismatch` exception.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-compression-type: Type of compression to be used on the input coming from the imported table.
        input-format: The format of the source data. Valid values for `ImportFormat` are `CSV`, `DYNAMODB_JSON` or `ION`.
        input-format-options: Additional properties that specify how the input is formatted,
        s3-bucket-source: The S3 bucket that provides the source for the import.
        table-creation-parameters: Parameters for the table to import the data into.
