name: delete
description: Delete a `WasmPlugin` resource.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location ID.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        Delete a `WasmPlugin` resource.

        Please note that all WasmPluginVersions associated with the WasmPlugin will also be deleted.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location ID.
            +

            To set the `location` attribute:
            * provide the argument `wasm_plugin` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * use global location.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
