name: delete-studio-lifecycle-config
description: Deletes the Amazon SageMaker AI Studio Lifecycle Configuration.
flags:
    --studio-lifecycle-config-name=!: The name of the Amazon SageMaker AI Studio Lifecycle Configuration to delete.
documentation:
    command: Deletes the Amazon SageMaker AI Studio Lifecycle Configuration. In order to delete the Lifecycle Configuration, there must be no running apps using the Lifecycle Configuration. You must also remove the Lifecycle Configuration from UserSettings in all Domains and UserProfiles.
    flag:
        studio-lifecycle-config-name: The name of the Amazon SageMaker AI Studio Lifecycle Configuration to delete.
