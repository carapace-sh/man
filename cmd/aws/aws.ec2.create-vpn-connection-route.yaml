name: create-vpn-connection-route
description: Creates a static route associated with a VPN connection between an existing virtual private gateway and a VPN customer gateway.
flags:
    --destination-cidr-block=!: The CIDR block associated with the local subnet of the customer network.
    --vpn-connection-id=!: The ID of the VPN connection.
documentation:
    command: |-
        Creates a static route associated with a VPN connection between an existing virtual private gateway and a VPN customer gateway. The static route allows traffic to be routed from the virtual private gateway to the VPN customer gateway.

        For more information, see [Amazon Web Services Site-to-Site VPN](https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html) in the *Amazon Web Services Site-to-Site VPN User Guide*.
    flag:
        destination-cidr-block: The CIDR block associated with the local subnet of the customer network.
        vpn-connection-id: The ID of the VPN connection.
