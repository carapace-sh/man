name: list-containers
description: Lists the properties of all containers in AWS Elemental MediaStore.
flags:
    --max-results=: Enter the maximum number of containers in the response.
    --next-token=: Only if you used `MaxResults` in the first command, enter the token (which was included in the previous response) to obtain the next set of containers.
documentation:
    command: |-
        Lists the properties of all containers in AWS Elemental MediaStore.

        You can query to receive all the containers in one response. Or you can include the `MaxResults` parameter to receive a limited number of containers in each response. In this case, the response includes a token. To get the next set of containers, send the command again, this time with the `NextToken` parameter (with the returned token as its value). The next set of responses appears, with a token if there are still more containers to receive.

        See also [DescribeContainer](), which gets the properties of one container.
    flag:
        max-results: Enter the maximum number of containers in the response. Use from 1 to 255 characters.
        next-token: Only if you used `MaxResults` in the first command, enter the token (which was included in the previous response) to obtain the next set of containers. This token is included in a response only if there actually are more containers to list.
