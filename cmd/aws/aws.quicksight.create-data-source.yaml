name: create-data-source
description: Creates a data source.
flags:
    --aws-account-id=!: The Amazon Web Services account ID.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --credentials=: The credentials Amazon Quick Sight that uses to connect to your underlying source.
    --data-source-id=!: An ID for the data source.
    --data-source-parameters=: The parameters that Amazon Quick Sight uses to connect to your underlying source.
    --folder-arns=:
        description: When you create the data source, Amazon Quick Sight adds the data source to these folders.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A display name for the data source.
    --permissions=:
        description: A list of resource permissions on the data source.
        nargs: -1
    --ssl-properties=: Secure Socket Layer (SSL) properties that apply when Amazon Quick Sight connects to your underlying source.
    --tags=:
        description: Contains a map of the key-value pairs for the resource tag or tags assigned to the data source.
        nargs: -1
    --type=!: The type of the data source.
    --vpc-connection-properties=: Use this parameter only when you want Amazon Quick Sight to use a VPC connection when connecting to your underlying source.
