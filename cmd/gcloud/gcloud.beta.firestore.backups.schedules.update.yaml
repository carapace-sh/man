name: update
description: '*(BETA)*  Updates a Cloud Firestore backup schedule.'
flags:
    --backup-schedule=!: The backup schedule to operate on.
    --database=!: The database to operate on.
    --retention=: The rention of the backup.
documentation:
    command: |-
        ## EXAMPLES

        To update backup schedule 'cf9f748a-7980-4703-b1a1-d1ffff591db0' under
        database testdb to 7 days retention.

            $ gcloud beta firestore backups schedules update --database='testdb'
            --backup-schedule='cf9f748a-7980-4703-b1a1-d1ffff591db0'
            --retention='7d'
    flag:
        backup-schedule: |-
            The backup schedule to operate on.
            +
            For example, to operate on backup schedule `091a49a0-223f-4c98-8c69-a284abbdb26b`:
            +
              $ {command} --backup-schedule='091a49a0-223f-4c98-8c69-a284abbdb26b'
        database: |-
            The database to operate on.
            +
            For example, to operate on database `foo`:
            +
              $ {command} --database='foo'
        retention: |-
            The rention of the backup. At what relative time in the future,
            compared to the creation time of the backup should the backup be
            deleted, i.e. keep backups for 7 days.
            +
            For example, to set retention as 7 days.
            +
            $ {command} --retention=7d
