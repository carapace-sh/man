name: list-dataset-import-jobs
description: Returns a list of dataset import jobs that use the given dataset.
flags:
    --dataset-arn=: The Amazon Resource Name (ARN) of the dataset to list the dataset import jobs for.
    --max-results=: The maximum number of dataset import jobs to return.
    --next-token=: A token returned from the previous call to `ListDatasetImportJobs` for getting the next set of dataset import jobs (if they exist).
documentation:
    command: Returns a list of dataset import jobs that use the given dataset. When a dataset is not specified, all the dataset import jobs associated with the account are listed. The response provides the properties for each dataset import job, including the Amazon Resource Name (ARN). For more information on dataset import jobs, see [CreateDatasetImportJob](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateDatasetImportJob.html). For more information on datasets, see [CreateDataset](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateDataset.html).
    flag:
        dataset-arn: The Amazon Resource Name (ARN) of the dataset to list the dataset import jobs for.
        max-results: The maximum number of dataset import jobs to return.
        next-token: A token returned from the previous call to `ListDatasetImportJobs` for getting the next set of dataset import jobs (if they exist).
