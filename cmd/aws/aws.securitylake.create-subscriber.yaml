name: create-subscriber
description: Creates a subscriber for accounts that are already enabled in Amazon Security Lake.
flags:
    --access-types=: The Amazon S3 or Lake Formation access type.
    --sources=!: The supported Amazon Web Services services from which logs and events are collected.
    --subscriber-description=: The description for your subscriber account in Security Lake.
    --subscriber-identity=!: The Amazon Web Services identity used to access your data.
    --subscriber-name=!: The name of your Security Lake subscriber account.
    --tags=: An array of objects, one for each tag to associate with the subscriber.
documentation:
    command: Creates a subscriber for accounts that are already enabled in Amazon Security Lake. You can create a subscriber with access to data in the current Amazon Web Services Region.
    flag:
        access-types: The Amazon S3 or Lake Formation access type.
        sources: The supported Amazon Web Services services from which logs and events are collected. Security Lake supports log and event collection for natively supported Amazon Web Services services.
        subscriber-description: The description for your subscriber account in Security Lake.
        subscriber-identity: The Amazon Web Services identity used to access your data.
        subscriber-name: The name of your Security Lake subscriber account.
        tags: An array of objects, one for each tag to associate with the subscriber. For each tag, you must specify both a tag key and a tag value. A tag value cannot be null, but it can be an empty string.
