name: describe
description: '*(BETA)*  Describe a BeyondCorp client connector operation (Deprecated).'
flags:
    --location=: The location of the BeyondCorp Enterprise client connector.
documentation:
    command: |
        *(BETA)*  Describe a BeyondCorp client connector operation given a valid operation name.
    flag:
        location: |-
            The location of the BeyondCorp Enterprise client connector.
            +

            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
