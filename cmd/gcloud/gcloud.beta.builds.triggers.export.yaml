name: export
description: '*(BETA)*  Export a build trigger.'
flags:
    --destination=!: File path where trigger should be exported.
    --region=: The Cloud location for the trigger.
documentation:
    command: '*(BETA)*  Export a build trigger.'
    flag:
        destination: File path where trigger should be exported.
        region: |-
            The Cloud location for the trigger.
            +
            To set the `region` attribute:
            * provide the argument `TRIGGER` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `builds/region`.
