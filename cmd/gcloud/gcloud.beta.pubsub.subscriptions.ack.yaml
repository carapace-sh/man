name: ack
description: '*(BETA)*  Acknowledges one or more messages on the specified subscription.'
flags:
    --ack-ids=: One or more ACK_IDs to acknowledge.
documentation:
    command: |
        *(BETA)*  Acknowledges one or more messages as having been successfully received.
        If a delivered message is not acknowledged within the Subscription's
        ack deadline, Cloud Pub/Sub will attempt to deliver it again.

        To automatically acknowledge messages when pulling from a Subscription,
        you can use the `--auto-ack` flag on `gcloud pubsub subscriptions pull`.
    flag:
        ack-ids: One or more ACK_IDs to acknowledge. An ACK_ID is a [string that is returned to subscribers](https://cloud.google.com/pubsub/docs/reference/rpc/google.pubsub.v1#google.pubsub.v1.ReceivedMessage). along with the message. The ACK_ID is different from the [message ID](https://cloud.google.com/pubsub/docs/reference/rpc/google.pubsub.v1#google.pubsub.v1.PubsubMessage).
