name: switchover
description: '*(ALPHA)*  Switchovers an AutonomousDatabase to a new primary.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: For resources [autonomous_database, peer-autonomous-database], provides fallback value for resource location attribute.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --peer-autonomous-database=!: ID of the autonomousDatabase or fully qualified identifier for the autonomousDatabase.
documentation:
    command: '*(ALPHA)*  Switchovers an AutonomousDatabase from a standby database to a new primary.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: For resources [autonomous_database, peer-autonomous-database], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        peer-autonomous-database: |-
            ID of the autonomousDatabase or fully qualified identifier for the autonomousDatabase.
            +
            To set the `autonomous-database` attribute:
            * provide the argument `--peer-autonomous-database` on the command line.
