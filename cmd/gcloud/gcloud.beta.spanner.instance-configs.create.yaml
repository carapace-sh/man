name: create
description: '*(BETA)*  Create a Cloud Spanner instance configuration.'
flags:
    --add-replicas=: Add new replicas while cloning from the source config.
    --async: Return immediately, without waiting for the operation in progress to
    --base-config=!: The name of the Google-managed instance configuration, based on which your custom configuration is created.
    --clone-config=!: The ID of the instance config, based on which this configuration is created.
    --display-name=: The name of this instance configuration as it appears in UIs.
    --etag=: Used for optimistic concurrency control.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-validate-only&: If specified, validate that the creation will succeed without creating the instance configuration.
    --replicas=!: The geographic placement of nodes in this instance configuration and
    --skip-replicas=: Skip replicas from the source config while cloning.
    --validate-only: If specified, validate that the creation will succeed without creating the instance configuration.
documentation:
    command: '*(BETA)*  Create a Cloud Spanner instance configuration.'
    flag:
        add-replicas: Add new replicas while cloning from the source config.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        base-config: The name of the Google-managed instance configuration, based on which your custom configuration is created.
        clone-config: The ID of the instance config, based on which this configuration is created. The clone is an independent copy of this config. Available configurations can be found by running "gcloud spanner instance-configs list"
        display-name: The name of this instance configuration as it appears in UIs. Must specify this option if creating an instance-config with --replicas.
        etag: Used for optimistic concurrency control.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-validate-only: If specified, validate that the creation will succeed without creating the instance configuration.
        replicas: |-
            The geographic placement of nodes in this instance configuration and
            their replication types.
            +
            *location*::: The location of the serving resources, e.g. "us-central1".
            +
            *type*::: The type of replica.
            +
            Items in the list are separated by ":". The allowed values and formats
            are as follows.
            +
            *READ_ONLY*::::
            +
            Read-only replicas only support reads (not writes). Read-only
            replicas:
            +
              * Maintain a full copy of your data.
            +
              * Serve reads.
            +
              * Do not participate in voting to commit writes.
            +
              * Are not eligible to become a leader.
            +
            *READ_WRITE*::::
            +
            Read-write replicas support both reads and writes. These
            replicas:
            +
              * Maintain a full copy of your data.
            +
              * Serve reads.
            +
              * Can vote whether to commit a write.
            +
              * Participate in leadership election.
            +
              * Are eligible to become a leader.
            +
            *WITNESS*::::
            +
            Witness replicas don't support reads but do participate in
            voting to commit writes. Witness replicas:
            +
              * Do not maintain a full copy of data.
            +
              * Do not serve reads.
            +
              * Vote whether to commit writes.
            +
              * Participate in leader election but are not eligible to become
                leader.
        skip-replicas: Skip replicas from the source config while cloning. Each replica in the list must exist in the source config replicas list.
        validate-only: If specified, validate that the creation will succeed without creating the instance configuration.
