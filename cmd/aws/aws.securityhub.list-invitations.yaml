name: list-invitations
description: We recommend using Organizations instead of Security Hub invitations to manage your member accounts.
flags:
    --max-results=: The maximum number of items to return in the response.
    --next-token=: The token that is required for pagination.
documentation:
    command: |-
        We recommend using Organizations instead of Security Hub invitations to manage your member accounts. For information, see [Managing Security Hub administrator and member accounts with Organizations](https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-accounts-orgs.html) in the *Security Hub User Guide*.

        Lists all Security Hub membership invitations that were sent to the calling account.

        Only accounts that are managed by invitation can use this operation. Accounts that are managed using the integration with Organizations don't receive invitations.
    flag:
        max-results: The maximum number of items to return in the response.
        next-token: |-
            The token that is required for pagination. On your first call to the `ListInvitations` operation, set the value of this parameter to `NULL`.

            For subsequent calls to the operation, to continue listing data, set the value of this parameter to the value returned from the previous response.
