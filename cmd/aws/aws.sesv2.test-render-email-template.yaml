name: test-render-email-template
description: Creates a preview of the MIME content of an email when provided with a template and a set of replacement data.
flags:
    --template-data=!: A list of replacement values to apply to the template.
    --template-name=!: The name of the template.
documentation:
    command: |-
        Creates a preview of the MIME content of an email when provided with a template and a set of replacement data.

        You can execute this operation no more than once per second.
    flag:
        template-data: A list of replacement values to apply to the template. This parameter is a JSON object, typically consisting of key-value pairs in which the keys correspond to replacement tags in the email template.
        template-name: The name of the template.
