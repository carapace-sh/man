name: describe
description: '*(ALPHA)*  Describe a Managed Microsoft AD domain backup.'
flags:
    --domain=: The fully-qualified domain name of the Microsoft Active Directory domain.
documentation:
    command: |
        *(ALPHA)*  Show metadata for a Managed Microsoft AD domain backup.

        Displays all metadata associated with an Active Directory domain backup when provided with a
        valid domain backup name.

        This command can fail for the following reasons:
          * The specified domain backup doesn't exist.
          * The active account doesn't have permission to access the specified
            domain.
    flag:
        domain: |-
            The fully-qualified domain name of the Microsoft Active Directory domain.
            +
            To set the `domain` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--domain` on the command line.
