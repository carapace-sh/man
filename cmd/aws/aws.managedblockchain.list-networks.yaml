name: list-networks
description: Returns information about the networks in which the current Amazon Web Services account participates.
flags:
    --framework=: An optional framework specifier.
    --max-results=: The maximum number of networks to list.
    --name=: The name of the network.
    --next-token=: The pagination token that indicates the next set of results to retrieve.
    --status=: An optional status specifier.
completion:
    flag:
        framework:
            - HYPERLEDGER_FABRIC
            - ETHEREUM
        status:
            - CREATING
            - AVAILABLE
            - CREATE_FAILED
            - DELETING
            - DELETED
documentation:
    command: |-
        Returns information about the networks in which the current Amazon Web Services account participates.

        Applies to Hyperledger Fabric and Ethereum.
    flag:
        framework: An optional framework specifier. If provided, only networks of this framework type are listed.
        max-results: The maximum number of networks to list.
        name: The name of the network.
        next-token: The pagination token that indicates the next set of results to retrieve.
        status: |-
            An optional status specifier. If provided, only networks currently in this status are listed.

            Applies only to Hyperledger Fabric.
