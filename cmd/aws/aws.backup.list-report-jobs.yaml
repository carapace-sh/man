name: list-report-jobs
description: Returns details about your report jobs.
flags:
    --by-creation-after=: Returns only report jobs that were created after the date and time specified in Unix format and Coordinated Universal Time (UTC).
    --by-creation-before=: Returns only report jobs that were created before the date and time specified in Unix format and Coordinated Universal Time (UTC).
    --by-report-plan-name=: Returns only report jobs with the specified report plan name.
    --by-status=: Returns only report jobs that are in the specified status.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The number of desired results from 1 to 1000. Optional.
    --next-token=: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
documentation:
    command: Returns details about your report jobs.
    flag:
        by-creation-after: Returns only report jobs that were created after the date and time specified in Unix format and Coordinated Universal Time (UTC). For example, the value 1516925490 represents Friday, January 26, 2018 12:11:30 AM.
        by-creation-before: Returns only report jobs that were created before the date and time specified in Unix format and Coordinated Universal Time (UTC). For example, the value 1516925490 represents Friday, January 26, 2018 12:11:30 AM.
        by-report-plan-name: Returns only report jobs with the specified report plan name.
        by-status: |-
            Returns only report jobs that are in the specified status. The statuses are:

            `CREATED | RUNNING | COMPLETED | FAILED | COMPLETED_WITH_ISSUES`

            Please note that only scanning jobs finish with state completed with issues. For backup jobs this is a console interpretation of a job that finishes in completed state and has a status message.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The number of desired results from 1 to 1000. Optional. If unspecified, the query will return 1 MB of data.
        next-token: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
