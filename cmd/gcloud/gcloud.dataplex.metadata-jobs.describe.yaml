name: describe
description: Describe a Metadata Job.
flags:
    --location=: Location of the Dataplex resource.
documentation:
    command: |
        Displays all details of a Dataplex Metadata Job given a valid Metadata Job ID.
    flag:
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `metadata_job` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
