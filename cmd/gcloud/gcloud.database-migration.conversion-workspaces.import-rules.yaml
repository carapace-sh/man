name: import-rules
description: Import mapping rules in a Database Migration Service conversion workspace.
flags:
    --auto-commit: Auto commits the conversion workspace.
    --config-files=!: A list of files to import rules from.
    --file-format=: File format type to import rules from.
    --no-auto-commit&: Auto commits the conversion workspace.
    --region=: The Cloud region for the conversion_workspace.
completion:
    flag:
        file-format:
            - ORA2PG
documentation:
    command: |
        Import mapping rules in a Database Migration Service conversion
        workspace from a configuration file. For example, for Oracle to
        PostgreSQL migrations that could be an Ora2Pg config file.
    flag:
        auto-commit: Auto commits the conversion workspace.
        config-files: |-
            A list of files to import rules from. Either provide a single file path or if
            multiple files are to be provided, each file should correspond to one schema.
            Provide file paths as a comma separated list.
        file-format: 'File format type to import rules from. _FILE_FORMAT_ must be (only one value is supported): *ORA2PG*.'
        no-auto-commit: Auto commits the conversion workspace.
        region: |-
            The Cloud region for the conversion_workspace.
            +
            To set the `region` attribute:
            * provide the argument `conversion_workspace` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
