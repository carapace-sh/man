name: query-activity
description: '*(BETA)*  Query activities on cloud resource.'
hidden: true
flags:
    --activity-type=!: Type of the activities.
    --limit=: Max number of query result.
    --page-size=: Max page size for each http response.
    --query-filter=: Filter on activities, separated by "OR" if multiple filters are specified.
completion:
    flag:
        activity-type:
            - serviceAccountLastAuthentication
            - serviceAccountKeyLastAuthentication
documentation:
    command: |
        *(BETA)*  Query activities with certain types of specific container resource. For --activity-type, supported values are:
        - serviceAccountLastAuthentication
        - serviceAccountKeyLastAuthentication
    flag:
        activity-type: 'Type of the activities. _ACTIVITY_TYPE_ must be one of: *serviceAccountLastAuthentication*, *serviceAccountKeyLastAuthentication*.'
        limit: Max number of query result. Default to be 1000 and max to be unlimited, i.e., --limit=unlimited.
        page-size: Max page size for each http response. Default to be 500 and max to be 1000.
        query-filter: Filter on activities, separated by "OR" if multiple filters are specified. At most 10 filter restrictions are supported in the query-filter. e.g. --query-filter='activities.full_resource_name="//iam.googleapis.com/projects/project-id/serviceAccounts/service-account-name-1@project-id.iam.gserviceaccount.com" OR activities.full_resource_name="//iam.googleapis.com/projects/project-id/serviceAccounts/service-account-name-2@project-id.iam.gserviceaccount.com"'
