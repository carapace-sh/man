name: print-identity-token
description: Print an identity token for the specified account.
flags:
    --audiences=: Intended recipient of the token.
    --include-email: Specify whether or not service account email is included in the identity token.
    --include-license: Specify whether or not license codes for images associated with this instance are included in the identity token payload.
    --no-include-email&: Specify whether or not service account email is included in the identity token.
    --no-include-license&: Specify whether or not license codes for images associated with this instance are included in the identity token payload.
    --token-format=: Specify whether or not the project and instance details are included in the identity token payload.
completion:
    flag:
        token-format:
            - standard
            - full
documentation:
    command: |
        Print an identity token for the specified account.
    flag:
        audiences: Intended recipient of the token. Currently, only one audience can be specified.
        include-email: Specify whether or not service account email is included in the identity token. If specified, the token will contain 'email' and 'email_verified' claims. This flag should only be used for impersonate service account.
        include-license: Specify whether or not license codes for images associated with this instance are included in the identity token payload. Default is False. This flag does not have effect unless `--token-format=full`.
        no-include-email: Specify whether or not service account email is included in the identity token. If specified, the token will contain 'email' and 'email_verified' claims. This flag should only be used for impersonate service account.
        no-include-license: Specify whether or not license codes for images associated with this instance are included in the identity token payload. Default is False. This flag does not have effect unless `--token-format=full`.
        token-format: 'Specify whether or not the project and instance details are included in the identity token payload. This flag only applies to Google Compute Engine instance identity tokens. See https://cloud.google.com/compute/docs/instances/verifying-instance-identity#token_format for more details on token format. _TOKEN_FORMAT_ must be one of: *standard*, *full*.'
