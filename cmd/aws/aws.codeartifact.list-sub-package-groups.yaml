name: list-sub-package-groups
description: Returns a list of direct children of the specified package group.
flags:
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain which contains the package group from which to list sub package groups.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --package-group=!: The pattern of the package group from which to list sub package groups.
documentation:
    command: |-
        Returns a list of direct children of the specified package group.

        For information package group hierarchy, see [Package group definition syntax and matching behavior](https://docs.aws.amazon.com/codeartifact/latest/ug/package-group-definition-syntax-matching-behavior.html) in the *CodeArtifact User Guide*.
    flag:
        domain: The name of the domain which contains the package group from which to list sub package groups.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        package-group: The pattern of the package group from which to list sub package groups.
