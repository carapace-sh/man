name: describe-default-cluster-parameters
description: Returns a list of parameter settings for the specified parameter group family.
flags:
    --marker=: An optional parameter that specifies the starting point to return a set of response records.
    --max-records=: The maximum number of response records to return in each call.
    --parameter-group-family=!: The name of the cluster parameter group family.
documentation:
    command: |-
        Returns a list of parameter settings for the specified parameter group family.

        For more information about parameters and parameter groups, go to [Amazon Redshift Parameter Groups](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-parameter-groups.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        marker: An optional parameter that specifies the starting point to return a set of response records. When the results of a [DescribeDefaultClusterParameters]() request exceed the value specified in `MaxRecords`, Amazon Web Services returns a value in the `Marker` field of the response. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.
        max-records: |-
            The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.

            Default: `100`

            Constraints: minimum 20, maximum 100.
        parameter-group-family: The name of the cluster parameter group family.
