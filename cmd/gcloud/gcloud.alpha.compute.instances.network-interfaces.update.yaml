name: update
description: '*(ALPHA)*  Update a Compute Engine virtual machine network interface.'
flags:
    --aliases=: The IP alias ranges to allocate for this interface.
    --external-ipv6-address=: Assigns the given external IPv6 address to an instance.
    --external-ipv6-prefix-length=: The prefix length of the external IPv6 address range.
    --igmp-query=: Determines if the Compute Engine instance can receive and respond to IGMP query packets on the specified network interface.
    --internal-ipv6-address=: Assigns the given internal IPv6 address or range to an instance.
    --internal-ipv6-prefix-length=: Optional field that indicates the prefix length of the internal IPv6
    --ipv6-address=: Assigns the given external IPv6 address to an instance.
    --ipv6-network-tier=: Specifies the IPv6 network tier that will be used to configure the instance network interface IPv6 access config.
    --ipv6-prefix-length=: The prefix length of the external IPv6 address range.
    --network-interface=: The name of the network interface to update.
    --network=: Specifies the network this network interface belongs to.
    --private-network-ip=: Assign the given IP address to the interface.
    --security-policy-region=: Region of the security policy to operate on.
    --security-policy=: The security policy that will be set for this instance network interface.
    --stack-type=: The stack type for the network interface.
    --subnetwork=: Specifies the subnetwork this network interface belongs to.
    --zone=: Zone of the instance to operate on.
completion:
    flag:
        igmp-query:
            - IGMP_QUERY_DISABLED
            - IGMP_QUERY_V2
        ipv6-network-tier:
            - PREMIUM
        stack-type:
            - IPV4_IPV6
            - IPV4_ONLY
            - IPV6_ONLY
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute instances network-interfaces update* updates network interfaces of a Compute Engine
        virtual machine. For example:

          $ gcloud alpha compute instances network-interfaces update example-instance --zone us-central1-a --aliases r1:172.16.0.1/32

        sets 172.16.0.1/32 from range r1 of the default interface's subnetwork
        as the interface's alias IP.
    flag:
        aliases: |-
            The IP alias ranges to allocate for this interface. If there are
            multiple IP alias ranges, they are separated by semicolons.
            +
            Can be specified together with --network and/or --subnetwork to choose
            IP alias ranges in the new subnetwork. If unspecified, then the previous
            IP alias ranges will be allocated in the new subnetwork. If the previous
            IP alias ranges are not available in the new subnetwork, then other
            available IP alias ranges of the same size will be allocated in the new
            subnetwork.
            +
            For example:
            +
                --aliases="10.128.1.0/24;r1:/32"
        external-ipv6-address: |-
            Assigns the given external IPv6 address to an instance.
            The address must be the first IP in the range. This option is not
            applicable to instances with stack-type=IPV4_ONLY.
        external-ipv6-prefix-length: |-
            The prefix length of the external IPv6 address range. This flag should be used together
            with `--external-ipv6-address`. Currently only `/96` is supported and the default value
            is `96`.
        igmp-query: |-
            Determines if the Compute Engine instance can receive and respond to IGMP query packets on the specified network interface. _IGMP_QUERY_ must be one of:
            +
            *IGMP_QUERY_DISABLED*::: IGMP Query on the network interface is disabled.
            *IGMP_QUERY_V2*::: IGMP Query V2 on the network interface is enabled.
            :::
            +
        internal-ipv6-address: |-
            Assigns the given internal IPv6 address or range to an instance.
            The address must be the first IP address in the range or a /96 IP
            address range. This option can only be used on a dual stack instance
            network interface.
        internal-ipv6-prefix-length: |-
            Optional field that indicates the prefix length of the internal IPv6
            address range, should be used together with
            `--internal-ipv6-address=fd20::`. Only /96 IP address range is supported
            and the default value is 96. If not set, then  either the prefix length
            from `--internal-ipv6-address=fd20::/96` will be used or the default
            value of 96 will be assigned.
        ipv6-address: |-
            Assigns the given external IPv6 address to an instance.
            The address must be the first IP in the range. This option is applicable
            only to dual-stack instances with stack-type=IPV4_ONLY.
        ipv6-network-tier: |-
            Specifies the IPv6 network tier that will be used to configure the instance network interface IPv6 access config. _IPV6_NETWORK_TIER_ must be (only one value is supported):
            +
            *PREMIUM*::: High quality, Google-grade network tier.
            :::
            +
        ipv6-prefix-length: |-
            The prefix length of the external IPv6 address range. This flag should be used together
            with `--ipv6-address`. Currently only `/96` is supported and the default value
            is `96`.
        network: Specifies the network this network interface belongs to.
        network-interface: The name of the network interface to update.
        private-network-ip: |-
            Assign the given IP address to the interface. Can be specified only
            together with --network and/or --subnetwork to choose the IP address
            in the new subnetwork. If unspecified, then the previous IP address
            will be allocated in the new subnetwork. If the previous IP address is
            not available in the new subnetwork, then another available IP address
            will be allocated automatically from the new subnetwork CIDR range.
        security-policy: The security policy that will be set for this instance network interface. To remove the policy from this instance network interface set the policy to an empty string.
        security-policy-region: Region of the security policy to operate on. Overrides the default *compute/region* property value for this command invocation.
        stack-type: |-
            The stack type for the network interface. Determines if IPv6 is enabled on the network interface. _STACK_TYPE_ must be one of:
            +
            *IPV4_IPV6*::: The network interface can have both IPv4 and IPv6 addresses.
            *IPV4_ONLY*::: The network interface will be assigned IPv4 addresses.
            *IPV6_ONLY*::: The network interface will be assigned IPv6 addresses.
            :::
            +
        subnetwork: Specifies the subnetwork this network interface belongs to.
        zone: |-
            Zone of the instance to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
