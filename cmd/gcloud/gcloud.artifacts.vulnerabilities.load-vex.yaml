name: load-vex
description: Load VEX data from a CSAF file into Artifact Analysis.
flags:
    --location=: If specified, all requests to Artifact Analysis for occurrences will go to location specified
    --source=!: The path of the VEX file.
    --uri=!: The path of the artifact in Artifact Registry.
documentation:
    command: |-
        Command loads VEX data from a Common Security Advisory Framework (CSAF) file
        into Artifact Analysis as VulnerabilityAssessment Notes. VEX data tells
        Artifact Analysis whether vulnerabilities are relevant and how.
    flag:
        location: If specified, all requests to Artifact Analysis for occurrences will go to location specified
        source: The path of the VEX file.
        uri: The path of the artifact in Artifact Registry. A 'gcr.io' image can also be used if redirection is enabled in Artifact Registry. Make sure 'artifactregistry.projectsettings.get' permission is granted to the current gcloud user to verify the redirection status.
