name: update-limit
description: Updates the properties of the specified limit.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The new description of the limit.
    --display-name=: The new display name of the limit.
    --farm-id=!: The unique identifier of the farm that contains the limit.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit-id=!: The unique identifier of the limit to update.
    --max-count=: The maximum number of resources constrained by this limit.
documentation:
    command: Updates the properties of the specified limit.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: |-
            The new description of the limit.

            This field can store any content. Escape or encode this content before displaying it on a webpage or any other system that might interpret the content of this field.
        display-name: |-
            The new display name of the limit.

            This field can store any content. Escape or encode this content before displaying it on a webpage or any other system that might interpret the content of this field.
        farm-id: The unique identifier of the farm that contains the limit.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit-id: The unique identifier of the limit to update.
        max-count: |-
            The maximum number of resources constrained by this limit. When all of the resources are in use, steps that require the limit won't be scheduled until the resource is available.

            If more than the new maximum number is currently in use, running jobs finish but no new jobs are started until the number of resources in use is below the new maximum number.

            The `maxCount` must not be 0. If the value is -1, there is no restriction on the number of resources that can be acquired for this limit.
