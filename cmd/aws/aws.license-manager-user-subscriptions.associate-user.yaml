name: associate-user
description: Associates the user to an EC2 instance to utilize user-based subscriptions.
flags:
    --domain=: The domain name of the Active Directory that contains information for the user to associate.
    --identity-provider=!: The identity provider for the user.
    --instance-id=!: The ID of the EC2 instance that provides the user-based subscription.
    --tags=: The tags that apply for the user association.
    --username=!: The user name from the identity provider.
documentation:
    command: |-
        Associates the user to an EC2 instance to utilize user-based subscriptions.

        Your estimated bill for charges on the number of users and related costs will take 48 hours to appear for billing periods that haven't closed (marked as **Pending** billing status) in Amazon Web Services Billing. For more information, see [Viewing your monthly charges](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/invoice.html) in the *Amazon Web Services Billing User Guide*.
    flag:
        domain: The domain name of the Active Directory that contains information for the user to associate.
        identity-provider: The identity provider for the user.
        instance-id: The ID of the EC2 instance that provides the user-based subscription.
        tags: The tags that apply for the user association.
        username: The user name from the identity provider.
