name: update-connection
description: Updates a connection definition in the Data Catalog.
flags:
    --catalog-id=: The ID of the Data Catalog in which the connection resides.
    --connection-input=!: A `ConnectionInput` object that redefines the connection in question.
    --name=!: The name of the connection definition to update.
documentation:
    command: Updates a connection definition in the Data Catalog.
    flag:
        catalog-id: The ID of the Data Catalog in which the connection resides. If none is provided, the Amazon Web Services account ID is used by default.
        connection-input: A `ConnectionInput` object that redefines the connection in question.
        name: The name of the connection definition to update.
