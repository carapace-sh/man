name: describe-integrations
description: Describe one or more zero-ETL integrations with Amazon Redshift.
flags:
    --filters=: A filter that specifies one or more resources to return.
    --integration-identifier=: The unique identifier of the integration.
    --marker=: An optional pagination token provided by a previous `DescribeIntegrations` request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: Describe one or more zero-ETL integrations with Amazon Redshift.
    flag:
        filters: A filter that specifies one or more resources to return.
        integration-identifier: The unique identifier of the integration.
        marker: An optional pagination token provided by a previous `DescribeIntegrations` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
