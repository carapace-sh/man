documentation:
    command: |
        Create a Cloud NetApp Backup Vault.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup-retention-policy: |-
            Backup Retention Policy of the Backup Vault.
            +
            Backup Retention Policy allows you to configure the retention policy for
            backups created within this vault. It consists of several fields that govern
            how long backups are kept and what type of backups are immutable.
        description: A description of the Cloud NetApp Backup Vault
        kms-config: |-
            ID of the kms_config or fully qualified identifier for the kms_config.

            To set the `kms_config` attribute:
            * provide the argument `--kms-config` on the command line.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the backup_vault.
            +
            To set the `location` attribute:
            * provide the argument `backup_vault` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
