name: get-service-attributes
description: Returns the attributes associated with a specified service.
flags:
    --service-id=!: The ID or Amazon Resource Name (ARN) of the service that you want to get attributes for.
documentation:
    command: Returns the attributes associated with a specified service.
    flag:
        service-id: The ID or Amazon Resource Name (ARN) of the service that you want to get attributes for. For services created in a namespace shared with your Amazon Web Services account, specify the service ARN. For more information about shared namespaces, see [Cross-account Cloud Map namespace sharing](https://docs.aws.amazon.com/cloud-map/latest/dg/sharing-namespaces.html) in the *Cloud Map Developer Guide*.
