name: import-document
description: Uploads a file that can then be used either as a default in a `FileUploadCard` from Q App definition or as a file that is used inside a single Q App run.
flags:
    --app-id=!: The unique identifier of the Q App the file is associated with.
    --card-id=!: The unique identifier of the card the file is associated with.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --file-contents-base64=!: The base64-encoded contents of the file to upload.
    --file-name=!: The name of the file being uploaded.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-id=!: The unique identifier of the Amazon Q Business application environment instance.
    --scope=!: Whether the file is associated with a Q App definition or a specific Q App session.
    --session-id=: The unique identifier of the Q App session the file is associated with, if applicable.
completion:
    flag:
        scope:
            - APPLICATION
            - SESSION
documentation:
    command: Uploads a file that can then be used either as a default in a `FileUploadCard` from Q App definition or as a file that is used inside a single Q App run. The purpose of the document is determined by a scope parameter that indicates whether it is at the app definition level or at the app session level.
    flag:
        app-id: The unique identifier of the Q App the file is associated with.
        card-id: The unique identifier of the card the file is associated with.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        file-contents-base64: The base64-encoded contents of the file to upload.
        file-name: The name of the file being uploaded.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-id: The unique identifier of the Amazon Q Business application environment instance.
        scope: Whether the file is associated with a Q App definition or a specific Q App session.
        session-id: The unique identifier of the Q App session the file is associated with, if applicable.
