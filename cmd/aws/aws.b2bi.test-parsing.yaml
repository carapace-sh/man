name: test-parsing
description: Parses the input EDI (electronic data interchange) file.
flags:
    --advanced-options=: Specifies advanced options for parsing the input EDI file.
    --edi-type=!: Specifies the details for the EDI standard that is being used for the transformer.
    --file-format=!: Specifies that the currently supported file formats for EDI transformations are `JSON` and `XML`.
    --input-file=!: Specifies an `S3Location` object, which contains the Amazon S3 bucket and prefix for the location of the input file.
completion:
    flag:
        file-format:
            - XML
            - JSON
            - NOT_USED
documentation:
    command: Parses the input EDI (electronic data interchange) file. The input file has a file size limit of 250 KB.
    flag:
        advanced-options: Specifies advanced options for parsing the input EDI file. These options allow for more granular control over the parsing process, including split options for X12 files.
        edi-type: Specifies the details for the EDI standard that is being used for the transformer. Currently, only X12 is supported. X12 is a set of standards and corresponding messages that define specific business documents.
        file-format: Specifies that the currently supported file formats for EDI transformations are `JSON` and `XML`.
        input-file: Specifies an `S3Location` object, which contains the Amazon S3 bucket and prefix for the location of the input file.
