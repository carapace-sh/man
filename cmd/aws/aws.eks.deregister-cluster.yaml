name: deregister-cluster
description: Deregisters a connected cluster to remove it from the Amazon EKS control plane.
flags:
    --name=!: The name of the connected cluster to deregister.
documentation:
    command: |-
        Deregisters a connected cluster to remove it from the Amazon EKS control plane.

        A connected cluster is a Kubernetes cluster that you've connected to your control plane using the [Amazon EKS Connector](https://docs.aws.amazon.com/eks/latest/userguide/eks-connector.html).
    flag:
        name: The name of the connected cluster to deregister.
