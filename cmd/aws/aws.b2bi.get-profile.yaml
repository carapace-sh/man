name: get-profile
description: Retrieves the details for the profile specified by the profile ID.
flags:
    --profile-id=!: Specifies the unique, system-generated identifier for the profile.
documentation:
    command: Retrieves the details for the profile specified by the profile ID. A profile is the mechanism used to create the concept of a private network.
    flag:
        profile-id: Specifies the unique, system-generated identifier for the profile.
