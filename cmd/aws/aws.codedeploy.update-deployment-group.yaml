name: update-deployment-group
description: Changes information about a deployment group.
flags:
    --alarm-configuration=: Information to add or change about Amazon CloudWatch alarms when the deployment group is updated.
    --application-name=!: The application name that corresponds to the deployment group to update.
    --auto-rollback-configuration=: Information for an automatic rollback configuration that is added or changed when a deployment group is updated.
    --auto-scaling-groups=: The replacement list of Auto Scaling groups to be included in the deployment group, if you want to change them.
    --blue-green-deployment-configuration=: Information about blue/green deployment options for a deployment group.
    --current-deployment-group-name=!: The current name of the deployment group.
    --deployment-config-name=: The replacement deployment configuration name to use, if you want to change it.
    --deployment-style=: Information about the type of deployment, either in-place or blue/green, you want to run and whether to route deployment traffic behind a load balancer.
    --ec2-tag-filters=: The replacement set of Amazon EC2 tags on which to filter, if you want to change them.
    --ec2-tag-set=: Information about groups of tags applied to on-premises instances.
    --ecs-services=: The target Amazon ECS services in the deployment group.
    --load-balancer-info=: Information about the load balancer used in a deployment.
    --new-deployment-group-name=: The new name of the deployment group, if you want to change it.
    --on-premises-instance-tag-filters=: The replacement set of on-premises instance tags on which to filter, if you want to change them.
    --on-premises-tag-set=: Information about an on-premises instance tag set.
    --outdated-instances-strategy=: Indicates what happens when new Amazon EC2 instances are launched mid-deployment and do not receive the deployed application revision.
    --service-role-arn=: A replacement ARN for the service role, if you want to change it.
    --termination-hook-enabled=: This parameter only applies if you are using CodeDeploy with Amazon EC2 Auto Scaling.
    --trigger-configurations=: Information about triggers to change when the deployment group is updated.
completion:
    flag:
        outdated-instances-strategy:
            - UPDATE
            - IGNORE
documentation:
    command: Changes information about a deployment group.
    flag:
        alarm-configuration: Information to add or change about Amazon CloudWatch alarms when the deployment group is updated.
        application-name: The application name that corresponds to the deployment group to update.
        auto-rollback-configuration: Information for an automatic rollback configuration that is added or changed when a deployment group is updated.
        auto-scaling-groups: |-
            The replacement list of Auto Scaling groups to be included in the deployment group, if you want to change them.

            - To keep the Auto Scaling groups, enter their names or do not specify this parameter.
            - To remove Auto Scaling groups, specify a non-null empty list of Auto Scaling group names to detach all CodeDeploy-managed Auto Scaling lifecycle hooks. For examples, see [Amazon EC2 instances in an Amazon EC2 Auto Scaling group fail to launch and receive the error "Heartbeat Timeout"](https://docs.aws.amazon.com/codedeploy/latest/userguide/troubleshooting-auto-scaling.html#troubleshooting-auto-scaling-heartbeat) in the *CodeDeploy User Guide*.
        blue-green-deployment-configuration: Information about blue/green deployment options for a deployment group.
        current-deployment-group-name: The current name of the deployment group.
        deployment-config-name: The replacement deployment configuration name to use, if you want to change it.
        deployment-style: Information about the type of deployment, either in-place or blue/green, you want to run and whether to route deployment traffic behind a load balancer.
        ec2-tag-filters: The replacement set of Amazon EC2 tags on which to filter, if you want to change them. To keep the existing tags, enter their names. To remove tags, do not enter any tag names.
        ec2-tag-set: Information about groups of tags applied to on-premises instances. The deployment group includes only Amazon EC2 instances identified by all the tag groups.
        ecs-services: The target Amazon ECS services in the deployment group. This applies only to deployment groups that use the Amazon ECS compute platform. A target Amazon ECS service is specified as an Amazon ECS cluster and service name pair using the format `<clustername>:<servicename>`.
        load-balancer-info: Information about the load balancer used in a deployment.
        new-deployment-group-name: The new name of the deployment group, if you want to change it.
        on-premises-instance-tag-filters: The replacement set of on-premises instance tags on which to filter, if you want to change them. To keep the existing tags, enter their names. To remove tags, do not enter any tag names.
        on-premises-tag-set: Information about an on-premises instance tag set. The deployment group includes only on-premises instances identified by all the tag groups.
        outdated-instances-strategy: |-
            Indicates what happens when new Amazon EC2 instances are launched mid-deployment and do not receive the deployed application revision.

            If this option is set to `UPDATE` or is unspecified, CodeDeploy initiates one or more 'auto-update outdated instances' deployments to apply the deployed application revision to the new Amazon EC2 instances.

            If this option is set to `IGNORE`, CodeDeploy does not initiate a deployment to update the new Amazon EC2 instances. This may result in instances having different revisions.
        service-role-arn: A replacement ARN for the service role, if you want to change it.
        termination-hook-enabled: |-
            This parameter only applies if you are using CodeDeploy with Amazon EC2 Auto Scaling. For more information, see [Integrating CodeDeploy with Amazon EC2 Auto Scaling](https://docs.aws.amazon.com/codedeploy/latest/userguide/integrations-aws-auto-scaling.html) in the *CodeDeploy User Guide*.

            Set `terminationHookEnabled` to `true` to have CodeDeploy install a termination hook into your Auto Scaling group when you update a deployment group. When this hook is installed, CodeDeploy will perform termination deployments.

            For information about termination deployments, see [Enabling termination deployments during Auto Scaling scale-in events](https://docs.aws.amazon.com/codedeploy/latest/userguide/integrations-aws-auto-scaling.html#integrations-aws-auto-scaling-behaviors-hook-enable) in the *CodeDeploy User Guide*.

            For more information about Auto Scaling scale-in events, see the [Scale in](https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-lifecycle.html#as-lifecycle-scale-in) topic in the *Amazon EC2 Auto Scaling User Guide*.
        trigger-configurations: Information about triggers to change when the deployment group is updated. For examples, see [Edit a Trigger in a CodeDeploy Deployment Group](https://docs.aws.amazon.com/codedeploy/latest/userguide/how-to-notify-edit.html) in the *CodeDeploy User Guide*.
