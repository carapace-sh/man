name: set-primary-version
description: '*(BETA)*  Set the primary version of a key.'
flags:
    --keyring=: The KMS keyring of the key.
    --location=: The Google Cloud location for the key.
documentation:
    command: |-
        *(BETA)*  Sets the specified version as the primary version of the given key.
        The version is specified by its version number assigned on creation.

        ## EXAMPLES

        The following command sets version 9 as the primary version of the
        key `samwise` within keyring `fellowship` and location `global`:

          $ gcloud beta kms keys set-primary-version samwise --version=9 --keyring=fellowship --location=global
    flag:
        keyring: |-
            The KMS keyring of the key.
            +
            To set the `keyring` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--keyring` on the command line.
        location: |-
            The Google Cloud location for the key.
            +
            To set the `location` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
