name: list-integrations
description: Lists all of the integrations in your domain.
flags:
    --domain-name=!: The unique name of the domain.
    --include-hidden=: Boolean to indicate if hidden integration should be returned.
    --max-results=: The maximum number of objects returned per page.
    --next-token=: The pagination token from the previous ListIntegrations API call.
documentation:
    command: Lists all of the integrations in your domain.
    flag:
        domain-name: The unique name of the domain.
        include-hidden: Boolean to indicate if hidden integration should be returned. Defaults to `False`.
        max-results: The maximum number of objects returned per page.
        next-token: The pagination token from the previous ListIntegrations API call.
