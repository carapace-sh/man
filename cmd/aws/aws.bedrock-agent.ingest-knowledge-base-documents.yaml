name: ingest-knowledge-base-documents
description: Ingests documents directly into the knowledge base that is connected to the data source.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --data-source-id=!: The unique identifier of the data source connected to the knowledge base that you're adding documents to.
    --documents=!: A list of objects, each of which contains information about the documents to add.
    --knowledge-base-id=!: The unique identifier of the knowledge base to ingest the documents into.
documentation:
    command: Ingests documents directly into the knowledge base that is connected to the data source. The `dataSourceType` specified in the content for each document must match the type of the data source that you specify in the header. For more information, see [Ingest changes directly into a knowledge base](https://docs.aws.amazon.com/bedrock/latest/userguide/kb-direct-ingestion.html) in the Amazon Bedrock User Guide.
    flag:
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        data-source-id: The unique identifier of the data source connected to the knowledge base that you're adding documents to.
        documents: A list of objects, each of which contains information about the documents to add.
        knowledge-base-id: The unique identifier of the knowledge base to ingest the documents into.
