name: set-load-balancer-listener-sslcertificate
description: Sets the certificate that terminates the specified listener's SSL connections.
flags:
    --load-balancer-name=!: The name of the load balancer.
    --load-balancer-port=!: The port that uses the specified SSL certificate.
    --sslcertificate-id=!: The Amazon Resource Name (ARN) of the SSL certificate.
documentation:
    command: |-
        Sets the certificate that terminates the specified listener's SSL connections. The specified certificate replaces any prior certificate that was used on the same load balancer and port.

        For more information about updating your SSL certificate, see [Replace the SSL Certificate for Your Load Balancer](https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/elb-update-ssl-cert.html) in the *Classic Load Balancers Guide*.
    flag:
        load-balancer-name: The name of the load balancer.
        load-balancer-port: The port that uses the specified SSL certificate.
        sslcertificate-id: The Amazon Resource Name (ARN) of the SSL certificate.
