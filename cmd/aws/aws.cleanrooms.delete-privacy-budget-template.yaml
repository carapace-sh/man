name: delete-privacy-budget-template
description: Deletes a privacy budget template for a specified collaboration.
flags:
    --membership-identifier=!: A unique identifier for one of your memberships for a collaboration.
    --privacy-budget-template-identifier=!: A unique identifier for your privacy budget template.
documentation:
    command: Deletes a privacy budget template for a specified collaboration.
    flag:
        membership-identifier: A unique identifier for one of your memberships for a collaboration. The privacy budget template is deleted from the collaboration that this membership belongs to. Accepts a membership ID.
        privacy-budget-template-identifier: A unique identifier for your privacy budget template.
