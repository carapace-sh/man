name: update-provisioned-product
description: Requests updates to the configuration of the specified provisioned product.
flags:
    --accept-language=: The language code.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --path-id=: The path identifier.
    --path-name=: The name of the path.
    --product-id=: The identifier of the product.
    --product-name=: The name of the product.
    --provisioned-product-id=: The identifier of the provisioned product.
    --provisioned-product-name=: The name of the provisioned product.
    --provisioning-artifact-id=: The identifier of the provisioning artifact.
    --provisioning-artifact-name=: The name of the provisioning artifact.
    --provisioning-parameters=:
        description: The new parameters.
        nargs: -1
    --provisioning-preferences=: An object that contains information about the provisioning preferences for a stack set.
    --tags=:
        description: One or more tags.
        nargs: -1
    --update-token=!: The idempotency token that uniquely identifies the provisioning update request.
documentation:
    command: |-
        Requests updates to the configuration of the specified provisioned product.

        If there are tags associated with the object, they cannot be updated or added. Depending on the specific updates requested, this operation can update with no interruption, with some interruption, or replace the provisioned product entirely.

        You can check the status of this request using [DescribeRecord]().
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        path-id: The path identifier. This value is optional if the product has a default path, and required if the product has more than one path. You must provide the name or ID, but not both.
        path-name: The name of the path. You must provide the name or ID, but not both.
        product-id: The identifier of the product. You must provide the name or ID, but not both.
        product-name: The name of the product. You must provide the name or ID, but not both.
        provisioned-product-id: The identifier of the provisioned product. You must provide the name or ID, but not both.
        provisioned-product-name: The name of the provisioned product. You cannot specify both `ProvisionedProductName` and `ProvisionedProductId`.
        provisioning-artifact-id: The identifier of the provisioning artifact.
        provisioning-artifact-name: The name of the provisioning artifact. You must provide the name or ID, but not both.
        provisioning-parameters: The new parameters.
        provisioning-preferences: An object that contains information about the provisioning preferences for a stack set.
        tags: One or more tags. Requires the product to have `RESOURCE_UPDATE` constraint with `TagUpdatesOnProvisionedProduct` set to `ALLOWED` to allow tag updates.
        update-token: The idempotency token that uniquely identifies the provisioning update request.
