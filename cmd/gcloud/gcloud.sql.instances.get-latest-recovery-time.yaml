name: get-latest-recovery-time
description: Displays the latest recovery time to which a Cloud SQL instance can be restored to.
flags:
    --source-instance-deletion-time=: The deletion time of the source instance.
documentation:
    command: |
        *gcloud sql instances get-latest-recovery-time* retrieves the latest recovery time for a Cloud SQL instance.
        This is the latest time that can be used to perform point in time recovery
        for the Cloud SQL instance.
    flag:
        source-instance-deletion-time: The deletion time of the source instance. This is used to identify the instance if it has been deleted.
