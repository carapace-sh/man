name: list-tags-for-resource
description: Lists the key-value tag pairs associated to the Amazon Managed Workflows for Apache Airflow (MWAA) environment.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the Amazon MWAA environment.
documentation:
    command: 'Lists the key-value tag pairs associated to the Amazon Managed Workflows for Apache Airflow (MWAA) environment. For example, `"Environment": "Staging"`.'
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the Amazon MWAA environment. For example, `arn:aws:airflow:us-east-1:123456789012:environment/MyMWAAEnvironment`.
