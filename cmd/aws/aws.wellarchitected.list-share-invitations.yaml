name: list-share-invitations
description: List the share invitations.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --lens-name-prefix=: An optional string added to the beginning of each lens name returned in the results.
    --max-results=: The maximum number of results to return for this request.
    --next-token=: ""
    --profile-name-prefix=: An optional string added to the beginning of each profile name returned in the results.
    --share-resource-type=: The type of share invitations to be returned.
    --template-name-prefix=: An optional string added to the beginning of each review template name returned in the results.
    --workload-name-prefix=: ""
completion:
    flag:
        share-resource-type:
            - WORKLOAD
            - LENS
            - PROFILE
            - TEMPLATE
documentation:
    command: |-
        List the share invitations.

        `WorkloadNamePrefix`, `LensNamePrefix`, `ProfileNamePrefix`, and `TemplateNamePrefix` are mutually exclusive. Use the parameter that matches your `ShareResourceType`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        lens-name-prefix: An optional string added to the beginning of each lens name returned in the results.
        max-results: The maximum number of results to return for this request.
        next-token: ""
        profile-name-prefix: An optional string added to the beginning of each profile name returned in the results.
        share-resource-type: The type of share invitations to be returned.
        template-name-prefix: An optional string added to the beginning of each review template name returned in the results.
        workload-name-prefix: ""
