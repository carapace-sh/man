name: list-templates
description: Lists all of the templates in a Cases domain.
flags:
    --domain-id=!: The unique identifier of the Cases domain.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --status=: A list of status values to filter on.
documentation:
    command: |-
        Lists all of the templates in a Cases domain. Each list item is a condensed summary object of the template.

        Other template APIs are:

        - [CreateTemplate](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_CreateTemplate.html)
        - [DeleteTemplate](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_DeleteTemplate.html)
        - [GetTemplate](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_GetTemplate.html)
        - [UpdateTemplate](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_UpdateTemplate.html)
    flag:
        domain-id: The unique identifier of the Cases domain.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        status: A list of status values to filter on.
