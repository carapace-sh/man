name: disassociate-environment-operations-role
description: Disassociate the operations role from an environment.
flags:
    --environment-name=!: The name of the environment from which to disassociate the operations role.
documentation:
    command: Disassociate the operations role from an environment. After this call is made, Elastic Beanstalk uses the caller's permissions for permissions to downstream services during subsequent calls acting on this environment. For more information, see [Operations roles](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/iam-operationsrole.html) in the *AWS Elastic Beanstalk Developer Guide*.
    flag:
        environment-name: The name of the environment from which to disassociate the operations role.
