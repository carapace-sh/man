name: update-configuration-profile
description: Updates a configuration profile.
flags:
    --application-id=!: The application ID.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-profile-id=!: The ID of the configuration profile.
    --description=: A description of the configuration profile.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-identifier=: The identifier for a Key Management Service key to encrypt new configuration data versions in the AppConfig hosted configuration store.
    --name=: The name of the configuration profile.
    --retrieval-role-arn=: The ARN of an IAM role with permission to access the configuration at the specified `LocationUri`.
    --validators=:
        description: A list of methods for validating the configuration.
        nargs: -1
documentation:
    command: Updates a configuration profile.
    flag:
        application-id: The application ID.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-profile-id: The ID of the configuration profile.
        description: A description of the configuration profile.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-identifier: The identifier for a Key Management Service key to encrypt new configuration data versions in the AppConfig hosted configuration store. This attribute is only used for `hosted` configuration types. The identifier can be an KMS key ID, alias, or the Amazon Resource Name (ARN) of the key ID or alias. To encrypt data managed in other configuration stores, see the documentation for how to specify an KMS key for that particular service.
        name: The name of the configuration profile.
        retrieval-role-arn: |-
            The ARN of an IAM role with permission to access the configuration at the specified `LocationUri`.

            A retrieval role ARN is not required for configurations stored in CodePipeline or the AppConfig hosted configuration store. It is required for all other sources that store your configuration.
        validators: A list of methods for validating the configuration.
