name: get-speech-synthesis-task
description: Retrieves a specific SpeechSynthesisTask object based on its TaskID.
flags:
    --task-id=!: The Amazon Polly generated identifier for a speech synthesis task.
documentation:
    command: Retrieves a specific SpeechSynthesisTask object based on its TaskID. This object contains information about the given speech synthesis task, including the status of the task, and a link to the S3 bucket containing the output of the task.
    flag:
        task-id: The Amazon Polly generated identifier for a speech synthesis task.
