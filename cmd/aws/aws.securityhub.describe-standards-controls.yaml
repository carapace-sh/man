name: describe-standards-controls
description: Returns a list of security standards controls.
flags:
    --max-results=: The maximum number of security standard controls to return.
    --next-token=: The token that is required for pagination.
    --standards-subscription-arn=!: The ARN of a resource that represents your subscription to a supported standard.
documentation:
    command: |-
        Returns a list of security standards controls.

        For each control, the results include information about whether it is currently enabled, the severity, and a link to remediation information.

        This operation returns an empty list for standard subscriptions where `StandardsControlsUpdatable` has value `NOT_READY_FOR_UPDATES`.
    flag:
        max-results: The maximum number of security standard controls to return.
        next-token: |-
            The token that is required for pagination. On your first call to the `DescribeStandardsControls` operation, set the value of this parameter to `NULL`.

            For subsequent calls to the operation, to continue listing data, set the value of this parameter to the value returned from the previous response.
        standards-subscription-arn: The ARN of a resource that represents your subscription to a supported standard. To get the subscription ARNs of the standards you have enabled, use the `GetEnabledStandards` operation.
