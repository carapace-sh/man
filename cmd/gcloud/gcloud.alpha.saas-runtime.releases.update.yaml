name: update
description: '*(ALPHA)*  Update a Release.'
hidden: true
flags:
    --add-input-variable-defaults=: Add new value to input_variable_defaults list.
    --add-upgradeable-from-releases=: Add new value to upgradeable_from_releases list.
    --clear-input-variable-defaults: Clear input_variable_defaults value and set to empty list.
    --clear-labels: Clear labels value and set to empty map.
    --clear-upgradeable-from-releases: Clear upgradeable_from_releases value and set to empty list.
    --input-variable-defaults=: Set input_variable_defaults to new value.
    --labels=: Set labels to new value.
    --location=: Location ID
    --no-clear-input-variable-defaults&: Clear input_variable_defaults value and set to empty list.
    --no-clear-labels&: Clear labels value and set to empty map.
    --no-clear-upgradeable-from-releases&: Clear upgradeable_from_releases value and set to empty list.
    --remove-input-variable-defaults=: Remove existing value from input_variable_defaults list.
    --remove-labels=: Remove existing value from map labels.
    --remove-upgradeable-from-releases=: Remove existing value from upgradeable_from_releases list.
    --update-labels=: Update labels value or add key value pair.
    --upgradeable-from-releases=: Set upgradeable_from_releases to new value.
documentation:
    command: '*(ALPHA)*  Update a Release'
    flag:
        add-input-variable-defaults: |-
            Add new value to input_variable_defaults list. Mapping of input variables to default values. Maximum 100.
            +
            *type*:::
            Name of a supported variable type. Supported types are string, int, bool.
            +
            *value*:::
            String encoded value for the variable.
            +
            *variable*:::
            Name of the variable from actuation configs.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-input-variable-defaults=type=string,value=string,variable=string --add-input-variable-defaults=type=string,value=string,variable=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-input-variable-defaults='[{"type": "string", "value": "string", "variable": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-input-variable-defaults=path_to_file.(yaml|json)
            +
            ```
        add-upgradeable-from-releases: Add new value to upgradeable_from_releases list.
        clear-input-variable-defaults: Clear input_variable_defaults value and set to empty list.
        clear-labels: Clear labels value and set to empty map.
        clear-upgradeable-from-releases: Clear upgradeable_from_releases value and set to empty list.
        input-variable-defaults: |-
            Set input_variable_defaults to new value. Mapping of input variables to default values. Maximum 100.
            +
            *type*:::
            Name of a supported variable type. Supported types are string, int, bool.
            +
            *value*:::
            String encoded value for the variable.
            +
            *variable*:::
            Name of the variable from actuation configs.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --input-variable-defaults=type=string,value=string,variable=string --input-variable-defaults=type=string,value=string,variable=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --input-variable-defaults='[{"type": "string", "value": "string", "variable": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --input-variable-defaults=path_to_file.(yaml|json)
            +
            ```
        labels: |-
            Set labels to new value. The labels on the resource, which can be used for categorization.
            similar to Kubernetes resource labels.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            Location ID
            +
            To set the `location` attribute:
            * provide the argument `release` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-clear-input-variable-defaults: Clear input_variable_defaults value and set to empty list.
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-upgradeable-from-releases: Clear upgradeable_from_releases value and set to empty list.
        remove-input-variable-defaults: |-
            Remove existing value from input_variable_defaults list. Mapping of input variables to default values. Maximum 100.
            +
            *type*:::
            Name of a supported variable type. Supported types are string, int, bool.
            +
            *value*:::
            String encoded value for the variable.
            +
            *variable*:::
            Name of the variable from actuation configs.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-input-variable-defaults=type=string,value=string,variable=string --remove-input-variable-defaults=type=string,value=string,variable=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-input-variable-defaults='[{"type": "string", "value": "string", "variable": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-input-variable-defaults=path_to_file.(yaml|json)
            +
            ```
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        remove-upgradeable-from-releases: Remove existing value from upgradeable_from_releases list.
        update-labels: |-
            Update labels value or add key value pair. The labels on the resource, which can be used for categorization.
            similar to Kubernetes resource labels.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-labels=path_to_file.(yaml|json)
            +
            ```
        upgradeable-from-releases: Set upgradeable_from_releases to new value.
