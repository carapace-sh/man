name: update
description: Update the DDL for a Cloud Spanner database.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --ddl-file=: Path of a file containing semi-colon separated DDL (data definition language) statements to run inside the database.
    --ddl=: Semi-colon separated DDL (data definition language) statements to run inside the database.
    --instance=: The Cloud Spanner instance for the database.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --proto-descriptors-file=: Path of a file that contains a protobuf-serialized google.protobuf.FileDescriptorSet message.
documentation:
    command: Update the DDL for a Cloud Spanner database.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        ddl: Semi-colon separated DDL (data definition language) statements to run inside the database. If a statement fails, all subsequent statements in the batch are automatically cancelled.
        ddl-file: Path of a file containing semi-colon separated DDL (data definition language) statements to run inside the database. If a statement fails, all subsequent statements in the batch are automatically cancelled. If --ddl_file is set, --ddl is ignored. One line comments starting with -- are ignored.
        instance: |-
            The Cloud Spanner instance for the database.
            +
            To set the `instance` attribute:
            * provide the argument `database` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        proto-descriptors-file: Path of a file that contains a protobuf-serialized google.protobuf.FileDescriptorSet message. To generate it, install and run `protoc` with --include_imports and --descriptor_set_out.
