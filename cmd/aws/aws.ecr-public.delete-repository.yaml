name: delete-repository
description: Deletes a repository in a public registry.
flags:
    --force=: The force option can be used to delete a repository that contains images.
    --registry-id=: The Amazon Web Services account ID that's associated with the public registry that contains the repository to delete.
    --repository-name=!: The name of the repository to delete.
documentation:
    command: Deletes a repository in a public registry. If the repository contains images, you must either manually delete all images in the repository or use the `force` option. This option deletes all images on your behalf before deleting the repository.
    flag:
        force: The force option can be used to delete a repository that contains images. If the force option is not used, the repository must be empty prior to deletion.
        registry-id: The Amazon Web Services account ID that's associated with the public registry that contains the repository to delete. If you do not specify a registry, the default public registry is assumed.
        repository-name: The name of the repository to delete.
