name: list-workspaces
description: Returns a list of Amazon Managed Grafana workspaces in the account, with some information about each workspace.
flags:
    --max-results=: The maximum number of workspaces to include in the results.
    --next-token=: The token for the next set of workspaces to return.
documentation:
    command: Returns a list of Amazon Managed Grafana workspaces in the account, with some information about each workspace. For more complete information about one workspace, use [DescribeWorkspace](https://docs.aws.amazon.com/AAMG/latest/APIReference/API_DescribeWorkspace.html).
    flag:
        max-results: The maximum number of workspaces to include in the results.
        next-token: The token for the next set of workspaces to return. (You receive this token from a previous `ListWorkspaces` operation.)
