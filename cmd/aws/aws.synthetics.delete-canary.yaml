name: delete-canary
description: Permanently deletes the specified canary.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --delete-lambda: Specifies whether to also delete the Lambda functions and layers used by this canary.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the canary that you want to delete.
    --no-delete-lambda: Specifies whether to also delete the Lambda functions and layers used by this canary.
documentation:
    command: |-
        Permanently deletes the specified canary.

        If the canary's `ProvisionedResourceCleanup` field is set to `AUTOMATIC` or you specify `DeleteLambda` in this operation as `true`, CloudWatch Synthetics also deletes the Lambda functions and layers that are used by the canary.

        Other resources used and created by the canary are not automatically deleted. After you delete a canary, you should also delete the following:

        - The CloudWatch alarms created for this canary. These alarms have a name of `Synthetics-Alarm-first-198-characters-of-canary-name-canaryId-alarm number`
        - Amazon S3 objects and buckets, such as the canary's artifact location.
        - IAM roles created for the canary. If they were created in the console, these roles have the name `role/service-role/CloudWatchSyntheticsRole-First-21-Characters-of-CanaryName`
        - CloudWatch Logs log groups created for the canary. These logs groups have the name `/aws/lambda/cwsyn-First-21-Characters-of-CanaryName`

        Before you delete a canary, you might want to use `GetCanary` to display the information about this canary. Make note of the information returned by this operation so that you can delete these resources after you delete the canary.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        delete-lambda: |-
            Specifies whether to also delete the Lambda functions and layers used by this canary. The default is `false`.

            Your setting for this parameter is used only if the canary doesn't have `AUTOMATIC` for its `ProvisionedResourceCleanup` field. If that field is set to `AUTOMATIC`, then the Lambda functions and layers will be deleted when this canary is deleted.

            Type: Boolean
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the canary that you want to delete. To find the names of your canaries, use [DescribeCanaries](https://docs.aws.amazon.com/AmazonSynthetics/latest/APIReference/API_DescribeCanaries.html).
