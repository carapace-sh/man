name: get-aggregate-config-rule-compliance-summary
description: Returns the number of compliant and noncompliant rules for one or more accounts and regions in an aggregator.
flags:
    --configuration-aggregator-name=!: The name of the configuration aggregator.
    --filters=: Filters the results based on the ConfigRuleComplianceSummaryFilters object.
    --group-by-key=: Groups the result based on ACCOUNT\_ID or AWS\_REGION.
    --limit=: The maximum number of evaluation results returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
completion:
    flag:
        group-by-key:
            - ACCOUNT_ID
            - AWS_REGION
documentation:
    command: |-
        Returns the number of compliant and noncompliant rules for one or more accounts and regions in an aggregator.

        The results can return an empty result page, but if you have a nextToken, the results are displayed on the next page.
    flag:
        configuration-aggregator-name: The name of the configuration aggregator.
        filters: Filters the results based on the ConfigRuleComplianceSummaryFilters object.
        group-by-key: Groups the result based on ACCOUNT\_ID or AWS\_REGION.
        limit: The maximum number of evaluation results returned on each page. The default is 1000. You cannot specify a number greater than 1000. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
