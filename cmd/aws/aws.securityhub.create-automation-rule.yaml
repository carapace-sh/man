name: create-automation-rule
description: Creates an automation rule based on input parameters.
flags:
    --actions=!:
        description: One or more actions to update finding fields if a finding matches the conditions specified in `Criteria`.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --criteria=!: A set of ASFF finding field attributes and corresponding expected values that Security Hub uses to filter findings.
    --description=!: A description of the rule.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --is-terminal: Specifies whether a rule is the last to be applied with respect to a finding that matches the rule criteria.
    --no-is-terminal: Specifies whether a rule is the last to be applied with respect to a finding that matches the rule criteria.
    --rule-name=!: The name of the rule.
    --rule-order=!: An integer ranging from 1 to 1000 that represents the order in which the rule action is applied to findings.
    --rule-status=: Whether the rule is active after it is created.
    --tags=: User-defined tags associated with an automation rule.
completion:
    flag:
        rule-status:
            - ENABLED
            - DISABLED
documentation:
    command: Creates an automation rule based on input parameters.
    flag:
        actions: One or more actions to update finding fields if a finding matches the conditions specified in `Criteria`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        criteria: A set of ASFF finding field attributes and corresponding expected values that Security Hub uses to filter findings. If a rule is enabled and a finding matches the conditions specified in this parameter, Security Hub applies the rule action to the finding.
        description: A description of the rule.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        is-terminal: Specifies whether a rule is the last to be applied with respect to a finding that matches the rule criteria. This is useful when a finding matches the criteria for multiple rules, and each rule has different actions. If a rule is terminal, Security Hub applies the rule action to a finding that matches the rule criteria and doesn't evaluate other rules for the finding. By default, a rule isn't terminal.
        rule-name: The name of the rule.
        rule-order: An integer ranging from 1 to 1000 that represents the order in which the rule action is applied to findings. Security Hub applies rules with lower values for this parameter first.
        rule-status: Whether the rule is active after it is created. If this parameter is equal to `ENABLED`, Security Hub starts applying the rule to findings and finding updates after the rule is created. To change the value of this parameter after creating a rule, use [`BatchUpdateAutomationRules`](https://docs.aws.amazon.com/securityhub/1.0/APIReference/API_BatchUpdateAutomationRules.html) .
        tags: User-defined tags associated with an automation rule.
