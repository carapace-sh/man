name: describe-forecast-export-job
description: Describes a forecast export job created using the [CreateForecastExportJob]() operation.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --forecast-export-job-arn=!: The Amazon Resource Name (ARN) of the forecast export job.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: |-
        Describes a forecast export job created using the [CreateForecastExportJob]() operation.

        In addition to listing the properties provided by the user in the `CreateForecastExportJob` request, this operation lists the following properties:

        - `CreationTime`
        - `LastModificationTime`
        - `Status`
        - `Message` - If an error occurred, information about the error.
