name: remove-key-replication-regions
description: Removes Replication Regions from an existing Amazon Web Services Payment Cryptography key, disabling the key's availability for cryptographic operations in the specified Amazon Web Services Regions.
flags:
    --key-identifier=!: The key identifier (ARN or alias) of the key from which to remove replication regions.
    --replication-regions=!: The list of Amazon Web Services Regions to remove from the key's replication configuration.
documentation:
    command: |-
        Removes Replication Regions from an existing Amazon Web Services Payment Cryptography key, disabling the key's availability for cryptographic operations in the specified Amazon Web Services Regions.

        When you remove Replication Regions, the key material is securely deleted from those regions and can no longer be used for cryptographic operations there. This operation is irreversible for the specified Amazon Web Services Regions. For more information, see [Multi-Region key replication](https://docs.aws.amazon.com/payment-cryptography/latest/userguide/keys-multi-region-replication.html).

        Ensure that no active cryptographic operations or applications depend on the key in the regions you're removing before performing this operation.

        **Cross-account use:** This operation can't be used across different Amazon Web Services accounts.

        **Related operations:**

        - [AddKeyReplicationRegions](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_AddKeyReplicationRegions.html)
        - [DisableDefaultKeyReplicationRegions](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_DisableDefaultKeyReplicationRegions.html)
    flag:
        key-identifier: |-
            The key identifier (ARN or alias) of the key from which to remove replication regions.

            This key must exist and have replication enabled in the specified regions.
        replication-regions: |-
            The list of Amazon Web Services Regions to remove from the key's replication configuration.

            The key will no longer be available for cryptographic operations in these regions after removal. Ensure no active operations depend on the key in these regions before removal.
