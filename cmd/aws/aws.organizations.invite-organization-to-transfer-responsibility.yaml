name: invite-organization-to-transfer-responsibility
description: Sends an invitation to another organization's management account to designate your account with the specified responsibilities for their organization.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --notes=: Additional information that you want to include in the invitation.
    --source-name=!: Name you want to assign to the transfer.
    --start-timestamp=!: Timestamp when the recipient will begin managing the specified responsibilities.
    --tags=: A list of tags that you want to attach to the transfer.
    --target=!: A `HandshakeParty` object.
    --type=!: The type of responsibility you want to designate to your organization.
completion:
    flag:
        type:
            - BILLING
documentation:
    command: |-
        Sends an invitation to another organization's management account to designate your account with the specified responsibilities for their organization. The invitation is implemented as a [Handshake]() whose details are in the response.

        You can only call this operation from the management account.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        notes: Additional information that you want to include in the invitation.
        source-name: Name you want to assign to the transfer.
        start-timestamp: Timestamp when the recipient will begin managing the specified responsibilities.
        tags: |-
            A list of tags that you want to attach to the transfer. For each tag in the list, you must specify both a tag key and a value. You can set the value to an empty string, but you can't set it to `null`. For more information about tagging, see [Tagging Organizations resources](https://docs.aws.amazon.com/organizations/latest/userguide/orgs_tagging.html) in the Organizations User Guide.

            Any tags in the request are checked for compliance with any applicable tag policies when the request is made. The request is rejected if the tags in the request don't match the requirements of the policy at that time. Tag policy compliance is ***not*** checked again when the invitation is accepted and the tags are actually attached to the transfer. That means that if the tag policy changes between the invitation and the acceptance, then that tags could potentially be non-compliant.

            If any one of the tags is not valid or if you exceed the allowed number of tags for a transfer, then the entire request fails and invitations are not sent.
        target: A `HandshakeParty` object. Contains details for the account you want to invite. Currently, only `ACCOUNT` and `EMAIL` are supported.
        type: The type of responsibility you want to designate to your organization. Currently, only `BILLING` is supported.
