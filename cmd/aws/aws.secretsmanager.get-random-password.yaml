name: get-random-password
description: Generates a random password.
flags:
    --exclude-characters=: A string of the characters that you don't want in the password.
    --exclude-lowercase=: Specifies whether to exclude lowercase letters from the password.
    --exclude-numbers=: Specifies whether to exclude numbers from the password.
    --exclude-punctuation=: 'Specifies whether to exclude the following punctuation characters from the password: ``!'
    --exclude-uppercase=: Specifies whether to exclude uppercase letters from the password.
    --include-space=: Specifies whether to include the space character.
    --password-length=: The length of the password.
    --require-each-included-type=: Specifies whether to include at least one upper and lowercase letter, one number, and one punctuation.
documentation:
    command: |-
        Generates a random password. We recommend that you specify the maximum length and include every character type that the system you are generating a password for can support. By default, Secrets Manager uses uppercase and lowercase letters, numbers, and the following characters in passwords: ``!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~``

        Secrets Manager generates a CloudTrail log entry when you call this action.

        **Required permissions:** `secretsmanager:GetRandomPassword`. For more information, see [IAM policy actions for Secrets Manager](https://docs.aws.amazon.com/secretsmanager/latest/userguide/reference_iam-permissions.html#reference_iam-permissions_actions) and [Authentication and access control in Secrets Manager](https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access.html).
    flag:
        exclude-characters: A string of the characters that you don't want in the password.
        exclude-lowercase: Specifies whether to exclude lowercase letters from the password. If you don't include this switch, the password can contain lowercase letters.
        exclude-numbers: Specifies whether to exclude numbers from the password. If you don't include this switch, the password can contain numbers.
        exclude-punctuation: 'Specifies whether to exclude the following punctuation characters from the password: ``! " # $ % & '' ( ) * + , - . / : ; < = > ? @ [ \ ] ^ _ ` { | } ~``. If you don''t include this switch, the password can contain punctuation.'
        exclude-uppercase: Specifies whether to exclude uppercase letters from the password. If you don't include this switch, the password can contain uppercase letters.
        include-space: Specifies whether to include the space character. If you include this switch, the password can contain space characters.
        password-length: The length of the password. If you don't include this parameter, the default length is 32 characters.
        require-each-included-type: Specifies whether to include at least one upper and lowercase letter, one number, and one punctuation. If you don't include this switch, the password contains at least one of every character type.
