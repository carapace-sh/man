name: open-instance-public-ports
description: Opens ports for a specific Amazon Lightsail instance, and specifies the IP addresses allowed to connect to the instance through the ports, and the protocol.
flags:
    --instance-name=!: The name of the instance for which to open ports.
    --port-info=!: An object to describe the ports to open for the specified instance.
documentation:
    command: |-
        Opens ports for a specific Amazon Lightsail instance, and specifies the IP addresses allowed to connect to the instance through the ports, and the protocol.

        The `OpenInstancePublicPorts` action supports tag-based access control via resource tags applied to the resource identified by `instanceName`. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        instance-name: The name of the instance for which to open ports.
        port-info: An object to describe the ports to open for the specified instance.
