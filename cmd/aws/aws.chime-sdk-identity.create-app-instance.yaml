name: create-app-instance
description: Creates an Amazon Chime SDK messaging `AppInstance` under an AWS account.
flags:
    --client-request-token=!: The unique ID of the request.
    --metadata=: The metadata of the `AppInstance`.
    --name=!: The name of the `AppInstance`.
    --tags=: Tags assigned to the `AppInstance`.
documentation:
    command: |-
        Creates an Amazon Chime SDK messaging `AppInstance` under an AWS account. Only SDK messaging customers use this API. `CreateAppInstance` supports idempotency behavior as described in the AWS API Standard.

        identity
    flag:
        client-request-token: The unique ID of the request. Use different tokens to create different `AppInstances`.
        metadata: The metadata of the `AppInstance`. Limited to a 1KB string in UTF-8.
        name: The name of the `AppInstance`.
        tags: Tags assigned to the `AppInstance`.
