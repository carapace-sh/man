name: delete-query-definition
description: Deletes a saved CloudWatch Logs Insights query definition.
flags:
    --query-definition-id=!: The ID of the query definition that you want to delete.
documentation:
    command: |-
        Deletes a saved CloudWatch Logs Insights query definition. A query definition contains details about a saved CloudWatch Logs Insights query.

        Each `DeleteQueryDefinition` operation can delete one query definition.

        You must have the `logs:DeleteQueryDefinition` permission to be able to perform this operation.
    flag:
        query-definition-id: The ID of the query definition that you want to delete. You can use [DescribeQueryDefinitions](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_DescribeQueryDefinitions.html) to retrieve the IDs of your saved query definitions.
