name: attach-volume
description: Attaches an Amazon EBS volume to a `running` or `stopped` instance, and exposes it to the instance with the specified device name.
flags:
    --device=!: The device name (for example, `/dev/sdh` or `xvdh`).
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --instance-id=!: The ID of the instance.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --volume-id=!: The ID of the EBS volume.
documentation:
    command: |-
        Attaches an Amazon EBS volume to a `running` or `stopped` instance, and exposes it to the instance with the specified device name.

        The maximum number of Amazon EBS volumes that you can attach to an instance depends on the instance type. If you exceed the volume attachment limit for an instance type, the attachment request fails with the `AttachmentLimitExceeded` error. For more information, see [Instance volume limits](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/volume_limits.html).

        After you attach an EBS volume, you must make it available for use. For more information, see [Make an EBS volume available for use](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-using-volumes.html).

        If a volume has an Amazon Web Services Marketplace product code:

        - The volume can be attached only to a stopped instance.
        - Amazon Web Services Marketplace product codes are copied from the volume to the instance.
        - You must be subscribed to the product.
        - The instance type and operating system of the instance must support the product. For example, you can't detach a volume from a Windows instance and attach it to a Linux instance.

        For more information, see [Attach an Amazon EBS volume to an instance](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-attaching-volume.html) in the *Amazon EBS User Guide*.
    flag:
        device: The device name (for example, `/dev/sdh` or `xvdh`).
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        instance-id: The ID of the instance.
        volume-id: The ID of the EBS volume. The volume and instance must be within the same Availability Zone.
