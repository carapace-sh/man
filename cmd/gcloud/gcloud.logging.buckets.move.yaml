name: move
description: Move a bucket.
hidden: true
flags:
    --billing-account=: Billing account of the bucket to move.
    --folder=: Folder of the bucket to move.
    --location=!: Location of the bucket.
    --new-location=!: New location to move the bucket to.
    --organization=: Organization of the bucket to move.
documentation:
    command: |-
        In order to be movable, a bucket must satisfy the following restrictions:

         - Be a ```_Default``` or ```_Required``` bucket
         - Have a location of global
         - Have a non-project parent when it is a ```_Default``` bucket

        ## EXAMPLES

        To move the ```_Required``` bucket from `global` to another location, run:

          $ gcloud logging buckets move _Required --location=global --new-location=us-central1
    flag:
        billing-account: Billing account of the bucket to move.
        folder: Folder of the bucket to move.
        location: Location of the bucket.
        new-location: New location to move the bucket to.
        organization: Organization of the bucket to move.
