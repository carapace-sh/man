name: register-data-lake-delegated-administrator
description: Designates the Amazon Security Lake delegated administrator account for the organization.
flags:
    --account-id=!: The Amazon Web Services account ID of the Security Lake delegated administrator.
documentation:
    command: Designates the Amazon Security Lake delegated administrator account for the organization. This API can only be called by the organization management account. The organization management account cannot be the delegated administrator account.
    flag:
        account-id: The Amazon Web Services account ID of the Security Lake delegated administrator.
