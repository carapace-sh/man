name: untag-resource
description: Deletes tags from an PCS resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
    --tag-keys=!: 1 or more tag keys to remove from the resource.
documentation:
    command: Deletes tags from an PCS resource. To delete a tag, specify the tag key and the Amazon Resource Name (ARN) of the PCS resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource.
        tag-keys: 1 or more tag keys to remove from the resource. Specify only tag keys and not tag values.
