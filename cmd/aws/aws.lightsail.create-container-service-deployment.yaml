name: create-container-service-deployment
description: Creates a deployment for your Amazon Lightsail container service.
flags:
    --containers=: An object that describes the settings of the containers that will be launched on the container service.
    --public-endpoint=: An object that describes the settings of the public endpoint for the container service.
    --service-name=!: The name of the container service for which to create the deployment.
documentation:
    command: |-
        Creates a deployment for your Amazon Lightsail container service.

        A deployment specifies the containers that will be launched on the container service and their settings, such as the ports to open, the environment variables to apply, and the launch command to run. It also specifies the container that will serve as the public endpoint of the deployment and its settings, such as the HTTP or HTTPS port to use, and the health check configuration.

        You can deploy containers to your container service using container images from a public registry such as Amazon ECR Public, or from your local machine. For more information, see [Creating container images for your Amazon Lightsail container services](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-creating-container-images) in the *Amazon Lightsail Developer Guide*.
    flag:
        containers: An object that describes the settings of the containers that will be launched on the container service.
        public-endpoint: An object that describes the settings of the public endpoint for the container service.
        service-name: The name of the container service for which to create the deployment.
