name: get-domain-deliverability-campaign
description: Retrieve all the deliverability data for a specific campaign.
flags:
    --campaign-id=!: The unique identifier for the campaign.
documentation:
    command: Retrieve all the deliverability data for a specific campaign. This data is available for a campaign only if the campaign sent email by using a domain that the Deliverability dashboard is enabled for (`PutDeliverabilityDashboardOption` operation).
    flag:
        campaign-id: The unique identifier for the campaign. Amazon Pinpoint automatically generates and assigns this identifier to a campaign. This value is not the same as the campaign identifier that Amazon Pinpoint assigns to campaigns that you create and manage by using the Amazon Pinpoint API or the Amazon Pinpoint console.
