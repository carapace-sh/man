name: set-platform-application-attributes
description: Sets the attributes of the platform application object for the supported push notification services, such as APNS and GCM (Firebase Cloud Messaging).
flags:
    --attributes=!: A map of the platform application attributes.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --platform-application-arn=!: '`PlatformApplicationArn` for `SetPlatformApplicationAttributes` action.'
documentation:
    command: Sets the attributes of the platform application object for the supported push notification services, such as APNS and GCM (Firebase Cloud Messaging). For more information, see [Using Amazon SNS Mobile Push Notifications](https://docs.aws.amazon.com/sns/latest/dg/SNSMobilePush.html). For information on configuring attributes for message delivery status, see [Using Amazon SNS Application Attributes for Message Delivery Status](https://docs.aws.amazon.com/sns/latest/dg/sns-msg-status.html).
    flag:
        attributes: "A map of the platform application attributes. Attributes in this map include the following:\n\n- `PlatformCredential` – The credential received from the notification service.\n  \n  - For ADM, `PlatformCredential`is client secret.\n  - For Apple Services using certificate credentials, `PlatformCredential` is private key.\n  - For Apple Services using token credentials, `PlatformCredential` is signing key.\n  - For GCM (Firebase Cloud Messaging) using key credentials, there is no `PlatformPrincipal`. The `PlatformCredential` is `API key`.\n  - For GCM (Firebase Cloud Messaging) using token credentials, there is no `PlatformPrincipal`. The `PlatformCredential` is a JSON formatted private key file. When using the Amazon Web Services CLI, the file must be in string format and special characters must be ignored. To format the file correctly, Amazon SNS recommends using the following command: ``SERVICE_JSON=`jq @json <<< cat service.json` ``.\n\n<!--THE END-->\n\n- `PlatformPrincipal` – The principal received from the notification service.\n  \n  - For ADM, `PlatformPrincipal`is client id.\n  - For Apple Services using certificate credentials, `PlatformPrincipal` is SSL certificate.\n  - For Apple Services using token credentials, `PlatformPrincipal` is signing key ID.\n  - For GCM (Firebase Cloud Messaging), there is no `PlatformPrincipal`.\n\n<!--THE END-->\n\n- `EventEndpointCreated` – Topic ARN to which `EndpointCreated` event notifications are sent.\n- `EventEndpointDeleted` – Topic ARN to which `EndpointDeleted` event notifications are sent.\n- `EventEndpointUpdated` – Topic ARN to which `EndpointUpdate` event notifications are sent.\n- `EventDeliveryFailure` – Topic ARN to which `DeliveryFailure` event notifications are sent upon Direct Publish delivery failure (permanent) to one of the application's endpoints.\n- `SuccessFeedbackRoleArn` – IAM role ARN used to give Amazon SNS write access to use CloudWatch Logs on your behalf.\n- `FailureFeedbackRoleArn` – IAM role ARN used to give Amazon SNS write access to use CloudWatch Logs on your behalf.\n- `SuccessFeedbackSampleRate` – Sample rate percentage (0-100) of successfully delivered messages.\n\nThe following attributes only apply to `APNs` token-based authentication:\n\n- `ApplePlatformTeamID` – The identifier that's assigned to your Apple developer account team.\n- `ApplePlatformBundleID` – The bundle identifier that's assigned to your iOS app."
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        platform-application-arn: '`PlatformApplicationArn` for `SetPlatformApplicationAttributes` action.'
