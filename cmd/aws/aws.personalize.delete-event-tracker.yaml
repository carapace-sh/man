name: delete-event-tracker
description: Deletes the event tracker.
flags:
    --event-tracker-arn=!: The Amazon Resource Name (ARN) of the event tracker to delete.
documentation:
    command: Deletes the event tracker. Does not delete the dataset from the dataset group. For more information on event trackers, see [CreateEventTracker](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateEventTracker.html).
    flag:
        event-tracker-arn: The Amazon Resource Name (ARN) of the event tracker to delete.
