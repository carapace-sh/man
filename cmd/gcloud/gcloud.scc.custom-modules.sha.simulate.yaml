name: simulate
description: Validates a Security Health Analytics custom module.
flags:
    --custom-config-from-file=!: Path to a YAML file that contains the configuration for the Security Health Analytics custom module.
    --folder=: Folder that will own the Security Health Analytics custom module.
    --organization=: Organization that will own the Security Health Analytics custom module.
    --resource-from-file=!: Path to a YAML file that contains the resource data to validate the Security Health Analytics custom module against.
documentation:
    command: Validates a given Security Health Analytics custom module and resource.
    flag:
        custom-config-from-file: Path to a YAML file that contains the configuration for the Security Health Analytics custom module. Use a full or relative path to a local file containing the value of custom_config.
        folder: Folder that will own the Security Health Analytics custom module. Formatted as `folders/456` or just `456`.
        organization: Organization that will own the Security Health Analytics custom module. Formatted as `organizations/123` or just `123`.
        resource-from-file: Path to a YAML file that contains the resource data to validate the Security Health Analytics custom module against. Use a full or relative path to a local file containing the value of resource.
