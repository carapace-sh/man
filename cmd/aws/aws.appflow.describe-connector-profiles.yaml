name: describe-connector-profiles
description: Returns a list of `connector-profile` details matching the provided `connector-profile` names and `connector-types`.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connector-label=: The name of the connector.
    --connector-profile-names=:
        description: The name of the connector profile.
        nargs: -1
    --connector-type=: The type of connector, such as Salesforce, Amplitude, and so on.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: Specifies the maximum number of items that should be returned in the result set.
    --next-token=: The pagination token for the next page of data.
completion:
    flag:
        connector-type:
            - Salesforce
            - Singular
            - Slack
            - Redshift
            - S3
            - Marketo
            - Googleanalytics
            - Zendesk
            - Servicenow
            - Datadog
            - Trendmicro
            - Snowflake
            - Dynatrace
            - Infornexus
            - Amplitude
            - Veeva
            - EventBridge
            - LookoutMetrics
            - Upsolver
            - Honeycode
            - CustomerProfiles
            - SAPOData
            - CustomConnector
            - Pardot
documentation:
    command: |-
        Returns a list of `connector-profile` details matching the provided `connector-profile` names and `connector-types`. Both input lists are optional, and you can use them to filter the result.

        If no names or `connector-types` are provided, returns all connector profiles in a paginated form. If there is no match, this operation returns an empty list.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connector-label: The name of the connector. The name is unique for each `ConnectorRegistration` in your Amazon Web Services account. Only needed if calling for CUSTOMCONNECTOR connector type/.
        connector-profile-names: The name of the connector profile. The name is unique for each `ConnectorProfile` in the Amazon Web Services account.
        connector-type: The type of connector, such as Salesforce, Amplitude, and so on.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: Specifies the maximum number of items that should be returned in the result set. The default for `maxResults` is 20 (for all paginated API operations).
        next-token: The pagination token for the next page of data.
