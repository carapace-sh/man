name: delete
description: '*(ALPHA)*  Delete a Queued Resource.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --force: If set to true, any nodes in this queued resource will also be deleted.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-force&: If set to true, any nodes in this queued resource will also be deleted.
    --zone=: The compute/zone of the Cloud TPU.
documentation:
    command: |
        *(ALPHA)*  Delete an existing Queued Resource.

        To get a list of Queued Resources for deletion, run:

          $ gcloud alpha compute tpus queued-resources list
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        force: |-
            If set to true, any nodes in this queued resource will also be deleted.
            Otherwise, the request will only work if the queued resource has no nodes.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-force: |
            If set to true, any nodes in this queued resource will also be deleted.
            Otherwise, the request will only work if the queued resource has no nodes.
        zone: |-
            The compute/zone of the Cloud TPU.
            +
            If not specified, will use `default` compute/zone.
            +

            To set the `zone` attribute:
            * provide the argument `queued_resource` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
