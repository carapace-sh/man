name: move-account
description: Moves an account from its current source parent root or organizational unit (OU) to the specified destination parent root or OU.
flags:
    --account-id=!: ID for the account that you want to move.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destination-parent-id=!: ID for the root or organizational unit that you want to move the account to.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --source-parent-id=!: ID for the root or organizational unit that you want to move the account from.
documentation:
    command: |-
        Moves an account from its current source parent root or organizational unit (OU) to the specified destination parent root or OU.

        You can only call this operation from the management account.
    flag:
        account-id: |-
            ID for the account that you want to move.

            The [regex pattern](http://wikipedia.org/wiki/regex) for an account ID string requires exactly 12 digits.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        destination-parent-id: |-
            ID for the root or organizational unit that you want to move the account to.

            The [regex pattern](http://wikipedia.org/wiki/regex) for a parent ID string requires one of the following:

            - **Root** - A string that begins with "r-" followed by from 4 to 32 lowercase letters or digits.
            - **Organizational unit (OU)** - A string that begins with "ou-" followed by from 4 to 32 lowercase letters or digits (the ID of the root that the OU is in). This string is followed by a second "-" dash and from 8 to 32 additional lowercase letters or digits.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        source-parent-id: |-
            ID for the root or organizational unit that you want to move the account from.

            The [regex pattern](http://wikipedia.org/wiki/regex) for a parent ID string requires one of the following:

            - **Root** - A string that begins with "r-" followed by from 4 to 32 lowercase letters or digits.
            - **Organizational unit (OU)** - A string that begins with "ou-" followed by from 4 to 32 lowercase letters or digits (the ID of the root that the OU is in). This string is followed by a second "-" dash and from 8 to 32 additional lowercase letters or digits.
