name: stop-cluster
description: Stops the running elastic cluster that is specified by `clusterArn`.
flags:
    --cluster-arn=!: The ARN identifier of the elastic cluster.
documentation:
    command: Stops the running elastic cluster that is specified by `clusterArn`. The elastic cluster must be in the *available* state.
    flag:
        cluster-arn: The ARN identifier of the elastic cluster.
