name: list-vocabularies
description: Provides a list of custom vocabularies that match the specified criteria.
flags:
    --max-results=: The maximum number of custom vocabularies to return in each page of results.
    --name-contains=: Returns only the custom vocabularies that contain the specified string.
    --next-token=: If your `ListVocabularies` request returns more results than can be displayed, `NextToken` is displayed in the response with an associated string.
    --state-equals=: Returns only custom vocabularies with the specified state.
completion:
    flag:
        state-equals:
            - PENDING
            - READY
            - FAILED
documentation:
    command: |-
        Provides a list of custom vocabularies that match the specified criteria. If no criteria are specified, all custom vocabularies are returned.

        To get detailed information about a specific custom vocabulary, use the operation.
    flag:
        max-results: The maximum number of custom vocabularies to return in each page of results. If there are fewer results than the value that you specify, only the actual results are returned. If you do not specify a value, a default of 5 is used.
        name-contains: Returns only the custom vocabularies that contain the specified string. The search is not case sensitive.
        next-token: If your `ListVocabularies` request returns more results than can be displayed, `NextToken` is displayed in the response with an associated string. To get the next page of results, copy this string and repeat your request, including `NextToken` with the value of the copied string. Repeat as needed to view all your results.
        state-equals: Returns only custom vocabularies with the specified state. Vocabularies are ordered by creation date, with the newest vocabulary first. If you do not include `StateEquals`, all custom medical vocabularies are returned.
