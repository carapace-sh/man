name: describe
description: '*(BETA)*  Describe an accelerator type available for Cloud TPUs.'
flags:
    --zone=: The compute/zone of the Cloud TPU.
documentation:
    command: |
        *(BETA)*  Get details on an accelerator type.

        To get a list of available accelerator types for your location run:

          $ gcloud beta compute tpus accelerator-types list
    flag:
        zone: |-
            The compute/zone of the Cloud TPU.
            +
            If not specified, will use `default` compute/zone.
            +

            To set the `zone` attribute:
            * provide the argument `accelerator_type` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
