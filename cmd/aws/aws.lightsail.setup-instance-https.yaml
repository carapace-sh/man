name: setup-instance-https
description: Creates an SSL/TLS certificate that secures traffic for your website.
flags:
    --certificate-provider=!: The certificate authority that issues the SSL/TLS certificate.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-names=!:
        description: The name of the domain and subdomains that were specified for the SSL/TLS certificate.
        nargs: -1
    --email-address=!: The contact method for SSL/TLS certificate renewal alerts.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-name=!: The name of the Lightsail instance.
completion:
    flag:
        certificate-provider:
            - LetsEncrypt
documentation:
    command: |-
        Creates an SSL/TLS certificate that secures traffic for your website. After the certificate is created, it is installed on the specified Lightsail instance.

        If you provide more than one domain name in the request, at least one name must be less than or equal to 63 characters in length.
    flag:
        certificate-provider: The certificate authority that issues the SSL/TLS certificate.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-names: The name of the domain and subdomains that were specified for the SSL/TLS certificate.
        email-address: The contact method for SSL/TLS certificate renewal alerts. You can enter one email address.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-name: The name of the Lightsail instance.
