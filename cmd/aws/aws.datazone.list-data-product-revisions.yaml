name: list-data-product-revisions
description: Lists data product revisions.
flags:
    --domain-identifier=!: The ID of the domain of the data product revisions that you want to list.
    --identifier=!: The ID of the data product revision.
    --max-results=: The maximum number of asset filters to return in a single call to `ListDataProductRevisions`.
    --next-token=: When the number of data product revisions is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of data product revisions, the response includes a pagination token named `NextToken`.
documentation:
    command: |-
        Lists data product revisions.

        Prerequisites:

        - The data product ID must exist within the domain.
        - User must have view permissions on the data product.
        - The domain must be in a valid and accessible state.
    flag:
        domain-identifier: The ID of the domain of the data product revisions that you want to list.
        identifier: The ID of the data product revision.
        max-results: The maximum number of asset filters to return in a single call to `ListDataProductRevisions`. When the number of data product revisions to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `ListDataProductRevisions` to list the next set of data product revisions.
        next-token: When the number of data product revisions is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of data product revisions, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `ListDataProductRevisions` to list the next set of data product revisions.
