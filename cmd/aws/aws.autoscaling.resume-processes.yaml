name: resume-processes
description: Resumes the specified suspended auto scaling processes, or all suspended process, for the specified Auto Scaling group.
flags:
    --auto-scaling-group-name=!: The name of the Auto Scaling group.
    --scaling-processes=: 'One or more of the following processes:'
documentation:
    command: |-
        Resumes the specified suspended auto scaling processes, or all suspended process, for the specified Auto Scaling group.

        For more information, see [Suspend and resume Amazon EC2 Auto Scaling processes](https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-suspend-resume-processes.html) in the *Amazon EC2 Auto Scaling User Guide*.
    flag:
        auto-scaling-group-name: The name of the Auto Scaling group.
        scaling-processes: |-
            One or more of the following processes:

            - `Launch`
            - `Terminate`
            - `AddToLoadBalancer`
            - `AlarmNotification`
            - `AZRebalance`
            - `HealthCheck`
            - `InstanceRefresh`
            - `ReplaceUnhealthy`
            - `ScheduledActions`

            If you omit this property, all processes are specified.
