name: start-replay
description: Starts the specified replay.
flags:
    --description=: A description for the replay to start.
    --destination=!: A `ReplayDestination` object that includes details about the destination for the replay.
    --event-end-time=!: A time stamp for the time to stop replaying events.
    --event-source-arn=!: The ARN of the archive to replay events from.
    --event-start-time=!: A time stamp for the time to start replaying events.
    --replay-name=!: The name of the replay to start.
documentation:
    command: Starts the specified replay. Events are not necessarily replayed in the exact same order that they were added to the archive. A replay processes events to replay based on the time in the event, and replays them using 1 minute intervals. If you specify an `EventStartTime` and an `EventEndTime` that covers a 20 minute time range, the events are replayed from the first minute of that 20 minute range first. Then the events from the second minute are replayed. You can use `DescribeReplay` to determine the progress of a replay. The value returned for `EventLastReplayedTime` indicates the time within the specified time range associated with the last event replayed.
    flag:
        description: A description for the replay to start.
        destination: A `ReplayDestination` object that includes details about the destination for the replay.
        event-end-time: A time stamp for the time to stop replaying events. Only events that occurred between the `EventStartTime` and `EventEndTime` are replayed.
        event-source-arn: The ARN of the archive to replay events from.
        event-start-time: A time stamp for the time to start replaying events. Only events that occurred between the `EventStartTime` and `EventEndTime` are replayed.
        replay-name: The name of the replay to start.
