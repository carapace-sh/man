    --cli-input-yaml=: Read arguments from the YAML string provided.
    --consumer-identifiers=!:
        description: An array containing the ID of the consumer account that you want to register the namespace to.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --namespace-identifier=!: The unique identifier of the cluster or serverless namespace that you want to register.
documentation:
    command: Registers a cluster or serverless namespace to the Amazon Web Services Glue Data Catalog.
