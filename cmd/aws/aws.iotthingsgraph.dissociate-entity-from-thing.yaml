name: dissociate-entity-from-thing
description: Dissociates a device entity from a concrete thing.
flags:
    --entity-type=!: The entity type from which to disassociate the thing.
    --thing-name=!: The name of the thing to disassociate.
completion:
    flag:
        entity-type:
            - DEVICE
            - SERVICE
            - DEVICE_MODEL
            - CAPABILITY
            - STATE
            - ACTION
            - EVENT
            - PROPERTY
            - MAPPING
            - ENUM
documentation:
    command: Dissociates a device entity from a concrete thing. The action takes only the type of the entity that you need to dissociate because only one entity of a particular type can be associated with a thing.
    flag:
        entity-type: The entity type from which to disassociate the thing.
        thing-name: The name of the thing to disassociate.
