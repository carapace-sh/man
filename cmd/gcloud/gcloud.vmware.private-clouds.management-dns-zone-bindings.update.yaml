name: update
description: Update a management DNS zone binding.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=!: Text describing the binding resource that represents the network getting bound to the management DNS zone.
    --location=: Location of the private cloud or cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --private-cloud=: VMware Engine private cloud.
documentation:
    command: |
        Update a management DNS zone binding.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        description: Text describing the binding resource that represents the network getting bound to the management DNS zone.
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `management_dns_zone_binding` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        private-cloud: |-
            VMware Engine private cloud.
            +
            To set the `private-cloud` attribute:
            * provide the argument `management_dns_zone_binding` on the command line with a fully specified name;
            * provide the argument `--private-cloud` on the command line.
