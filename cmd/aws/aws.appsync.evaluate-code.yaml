name: evaluate-code
description: Evaluates the given code and returns the response.
flags:
    --code=!: The code definition to be evaluated.
    --context=!: The map that holds all of the contextual information for your resolver invocation.
    --function=: The function within the code to be evaluated.
    --runtime=!: The runtime to be used when evaluating the code.
documentation:
    command: Evaluates the given code and returns the response. The code definition requirements depend on the specified runtime. For `APPSYNC_JS` runtimes, the code defines the request and response functions. The request function takes the incoming request after a GraphQL operation is parsed and converts it into a request configuration for the selected data source operation. The response function interprets responses from the data source and maps it to the shape of the GraphQL field output type.
    flag:
        code: The code definition to be evaluated. Note that `code` and `runtime` are both required for this action. The `runtime` value must be `APPSYNC_JS`.
        context: The map that holds all of the contextual information for your resolver invocation. A `context` is required for this action.
        function: The function within the code to be evaluated. If provided, the valid values are `request` and `response`.
        runtime: The runtime to be used when evaluating the code. Currently, only the `APPSYNC_JS` runtime is supported.
