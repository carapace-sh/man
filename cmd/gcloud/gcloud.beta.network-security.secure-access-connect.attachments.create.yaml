name: create
description: '*(BETA)*  Create a SAC attachment.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --country=: ISO 3166 alpha-2 country code associated with this attachment for localization.
    --gateway=!: NCC gateway whose traffic will be inspected by this attachment.
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --realm=!: SAC realm to which this attachment belongs.
    --symantec-location-name=: Name of the Symantec Location that should be created along with this attachment.
    --symantec-site=: Identifier of the Symantec site to which this attachment connects.
    --time-zone=: tzinfo time zone associated with this attachment for localization.
documentation:
    command: |
        *(BETA)*  Create a new attachment linked to an existing SAC realm and NCC gateway.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        country: |-
            ISO 3166 alpha-2 country code associated with this attachment for localization. Does not need
            to match the region where this attachment is created.
        gateway: NCC gateway whose traffic will be inspected by this attachment.
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `sac_attachment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        realm: SAC realm to which this attachment belongs.
        symantec-location-name: Name of the Symantec Location that should be created along with this attachment.
        symantec-site: Identifier of the Symantec site to which this attachment connects.
        time-zone: |-
            tzinfo time zone associated with this attachment for localization. Does not need to match the
            region where this attachment is created.
