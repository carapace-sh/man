name: stop-stack-set-operation
description: Stops an in-progress operation on a StackSet and its associated stack instances.
flags:
    --call-as=: Specifies whether you are acting as an account administrator in the organization's management account or as a delegated administrator in a member account.
    --operation-id=!: The ID of the stack operation.
    --stack-set-name=!: The name or unique ID of the StackSet that you want to stop the operation for.
completion:
    flag:
        call-as:
            - SELF
            - DELEGATED_ADMIN
documentation:
    command: Stops an in-progress operation on a StackSet and its associated stack instances. StackSets will cancel all the unstarted stack instance deployments and wait for those are in-progress to complete.
    flag:
        call-as: "Specifies whether you are acting as an account administrator in the organization's management account or as a delegated administrator in a member account. Valid only if the StackSet uses service-managed permissions.\n\nBy default, `SELF` is specified. Use `SELF` for StackSets with self-managed permissions.\n\n- If you are signed in to the management account, specify `SELF`.\n- If you are signed in to a delegated administrator account, specify `DELEGATED_ADMIN`.\n  \n  Your Amazon Web Services account must be registered as a delegated administrator in the management account. For more information, see [Register a delegated administrator](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-delegated-admin.html) in the *CloudFormation User Guide*."
        operation-id: The ID of the stack operation.
        stack-set-name: The name or unique ID of the StackSet that you want to stop the operation for.
