name: list-compliance-summaries
description: Returns a summary count of compliant and non-compliant resources for a compliance type.
flags:
    --filters=: One or more compliance or inventory filters.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: A token to start the list.
documentation:
    command: Returns a summary count of compliant and non-compliant resources for a compliance type. For example, this call can return State Manager associations, patches, or custom compliance types according to the filter criteria that you specify.
    flag:
        filters: One or more compliance or inventory filters. Use a filter to return a more specific list of results.
        max-results: The maximum number of items to return for this call. Currently, you can specify null or 50. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: A token to start the list. Use this token to get the next set of results.
