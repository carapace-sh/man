name: associate-sbom-with-package-version
description: Associates the selected software bill of materials (SBOM) with a specific software package version.
flags:
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --package-name=!: The name of the new software package.
    --sbom=!: ""
    --version-name=!: The name of the new package version.
documentation:
    command: |-
        Associates the selected software bill of materials (SBOM) with a specific software package version.

        Requires permission to access the [AssociateSbomWithPackageVersion](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        package-name: The name of the new software package.
        sbom: ""
        version-name: The name of the new package version.
