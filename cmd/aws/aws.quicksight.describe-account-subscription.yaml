name: describe-account-subscription
description: Use the DescribeAccountSubscription operation to receive a description of an QuickSight account's subscription.
flags:
    --aws-account-id=!: The Amazon Web Services account ID associated with your QuickSight account.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
