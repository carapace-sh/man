name: alter-table-properties
description: '*(ALPHA)*  Alter metadata table properties.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location of the Dataproc Metastore service.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --properties=!: A string where field names are separated by a comma.
    --table-name=!: The name of the table containing the properties you're altering in the
    --update-mask=!: A string where field names are separated by a comma.
documentation:
    command: |
        *(ALPHA)*  Alter metadata table properties from a Dataproc Metastore service's underlying metadata store.

        If run asynchronously with `--async`, exits after printing
        one operation name that can be used to poll the status of the
        creation via:

          {top_command} metastore operations describe
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        properties: |-
            A string where field names are separated by a comma. Describes the desired values to mutate.
            If update-mask is empty, the properties will not update. Otherwise, the properties only
            alter the values whose associated paths exist in the update mask.
            +
            For example, the desired key-value pairs.
            +
            a=2,b=3,c=4
        table-name: |-
            The name of the table containing the properties you're altering in the
            following format.
            +
            `databases/{database_id}/tables/{table_id}`
        update-mask: |-
            A string where field names are separated by a comma. Specifies the metadata table properties
             fields that are overwritten by the update. Fields specified in the `update-mask` are
              relative to the resource (not to the full request). A field is overwritten if it is in
              the mask.
            +
            For example, given the target properties:
            +
                properties {
                  a: 1
                  b: 2
                }
            +
            And an update properties:
            +
                properties {
                  a: 2
                  b: 3
                  c: 4
                }
            +
            then if the field mask is:
            +
            `properties.b,properties.c`
            +
            then the updated result will be:
            +
                properties {
                  a: 1
                  b: 3
                  c: 4
                }
