name: set-repository-policy
description: Applies a repository policy to the specified public repository to control access permissions.
flags:
    --force=: If the policy that you want to set on a repository policy would prevent you from setting another policy in the future, you must force the [SetRepositoryPolicy]() operation.
    --policy-text=!: The JSON repository policy text to apply to the repository.
    --registry-id=: The Amazon Web Services account ID that's associated with the registry that contains the repository.
    --repository-name=!: The name of the repository to receive the policy.
documentation:
    command: Applies a repository policy to the specified public repository to control access permissions. For more information, see [Amazon ECR Repository Policies](https://docs.aws.amazon.com/AmazonECR/latest/userguide/repository-policies.html) in the *Amazon Elastic Container Registry User Guide*.
    flag:
        force: If the policy that you want to set on a repository policy would prevent you from setting another policy in the future, you must force the [SetRepositoryPolicy]() operation. This prevents accidental repository lockouts.
        policy-text: The JSON repository policy text to apply to the repository. For more information, see [Amazon ECR Repository Policies](https://docs.aws.amazon.com/AmazonECR/latest/userguide/repository-policy-examples.html) in the *Amazon Elastic Container Registry User Guide*.
        registry-id: The Amazon Web Services account ID that's associated with the registry that contains the repository. If you do not specify a registry, the default public registry is assumed.
        repository-name: The name of the repository to receive the policy.
