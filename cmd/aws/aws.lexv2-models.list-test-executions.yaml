name: list-test-executions
description: The list of test set executions.
flags:
    --max-results=: The maximum number of test executions to return in each page.
    --next-token=: If the response from the ListTestExecutions operation contains more results than specified in the maxResults parameter, a token is returned in the response.
    --sort-by=: The sort order of the test set executions.
documentation:
    command: The list of test set executions.
    flag:
        max-results: The maximum number of test executions to return in each page. If there are fewer results than the max page size, only the actual number of results are returned.
        next-token: If the response from the ListTestExecutions operation contains more results than specified in the maxResults parameter, a token is returned in the response. Use that token in the nextToken parameter to return the next page of results.
        sort-by: The sort order of the test set executions.
