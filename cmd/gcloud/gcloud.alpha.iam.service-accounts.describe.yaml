name: describe
description: '*(ALPHA)*  Show metadata for a service account from a project.'
documentation:
    command: |
        *(ALPHA)*  This command shows metadata for a service account.

        This call can fail for the following reasons:
            * The specified service account does not exist. In this case, you
              receive a `PERMISSION_DENIED` error.
            * The active user does not have permission to access the given
              service account.
