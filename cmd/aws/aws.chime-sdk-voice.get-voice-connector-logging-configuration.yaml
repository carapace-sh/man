name: get-voice-connector-logging-configuration
description: Retrieves the logging configuration settings for the specified Voice Connector.
flags:
    --voice-connector-id=!: The Voice Connector ID.
documentation:
    command: Retrieves the logging configuration settings for the specified Voice Connector. Shows whether SIP message logs are enabled for sending to Amazon CloudWatch Logs.
    flag:
        voice-connector-id: The Voice Connector ID.
