name: delete-account-alias
description: Deletes the specified Amazon Web Services account alias.
flags:
    --account-alias=!: The name of the account alias to delete.
documentation:
    command: Deletes the specified Amazon Web Services account alias. For information about using an Amazon Web Services account alias, see [Creating, deleting, and listing an Amazon Web Services account alias](https://docs.aws.amazon.com/signin/latest/userguide/CreateAccountAlias.html) in the *Amazon Web Services Sign-In User Guide*.
    flag:
        account-alias: |-
            The name of the account alias to delete.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of lowercase letters, digits, and dashes. You cannot start or finish with a dash, nor can you have two dashes in a row.
