name: create-authentication-profile
description: Creates an authentication profile with the specified parameters.
flags:
    --authentication-profile-content=!: The content of the authentication profile in JSON format.
    --authentication-profile-name=!: The name of the authentication profile to be created.
documentation:
    command: Creates an authentication profile with the specified parameters.
    flag:
        authentication-profile-content: The content of the authentication profile in JSON format. The maximum length of the JSON string is determined by a quota for your account.
        authentication-profile-name: The name of the authentication profile to be created.
