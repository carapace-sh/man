name: log
description: '*(BETA)*  Show the logs for a PipelineRun/TaskRun/Build.'
hidden: true
flags:
    --no-stream&: If a run is ongoing, stream the logs to stdout until the run completes.
    --region=: ID of the region or fully qualified identifier for the region.
    --stream: If a run is ongoing, stream the logs to stdout until the run completes.
    --type=: Type of Run.
completion:
    flag:
        type:
            - pipelinerun
            - taskrun
documentation:
    command: '*(BETA)*  Show the logs for a PipelineRun/TaskRun/Build.'
    flag:
        no-stream: If a run is ongoing, stream the logs to stdout until the run completes.
        region: |-
            ID of the region or fully qualified identifier for the region.
            +
            To set the `region` attribute:
            * provide the argument `--region` on the command line;
            * set the property `builds/region`.
        stream: If a run is ongoing, stream the logs to stdout until the run completes.
        type: 'Type of Run. _TYPE_ must be one of: *pipelinerun*, *taskrun*.'
