name: describe
description: '*(ALPHA)*  Show details for a job run.'
flags:
    --delivery-pipeline=: The name of the Cloud Deploy delivery pipeline.
    --region=: Location of the job run.
    --release=: The name of the Cloud Deploy release.
    --rollout=: The name of the Cloud Deploy rollout.
documentation:
    command: '*(ALPHA)*  Show details for a specified job run.'
    flag:
        delivery-pipeline: |-
            The name of the Cloud Deploy delivery pipeline.
            +

            To set the `delivery-pipeline` attribute:
            * provide the argument `job_run` on the command line with a fully specified name;
            * provide the argument `--delivery-pipeline` on the command line;
            * set the property `deploy/delivery_pipeline`.
        region: |-
            Location of the job run.
            +

            To set the `region` attribute:
            * provide the argument `job_run` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
        release: |-
            The name of the Cloud Deploy release.
            +

            To set the `release` attribute:
            * provide the argument `job_run` on the command line with a fully specified name;
            * provide the argument `--release` on the command line.
        rollout: |-
            The name of the Cloud Deploy rollout.
            +

            To set the `rollout` attribute:
            * provide the argument `job_run` on the command line with a fully specified name;
            * provide the argument `--rollout` on the command line.
