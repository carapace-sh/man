name: list-security-profiles
description: Provides summary information about the security profiles for the specified Amazon Connect instance.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        Provides summary information about the security profiles for the specified Amazon Connect instance.

        For more information about security profiles, see [Security Profiles](https://docs.aws.amazon.com/connect/latest/adminguide/connect-security-profiles.html) in the *Amazon Connect Administrator Guide*. For a mapping of the API name and user interface name of the security profile permissions, see [List of security profile permissions](https://docs.aws.amazon.com/connect/latest/adminguide/security-profile-list.html).
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        max-results: The maximum number of results to return per page. The default MaxResult size is 100.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
