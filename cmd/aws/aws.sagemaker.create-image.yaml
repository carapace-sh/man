name: create-image
description: Creates a custom SageMaker AI image.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the image.
    --display-name=: The display name of the image.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --image-name=!: The name of the image.
    --role-arn=!: The ARN of an IAM role that enables Amazon SageMaker AI to perform tasks on your behalf.
    --tags=:
        description: A list of tags to apply to the image.
        nargs: -1
documentation:
    command: Creates a custom SageMaker AI image. A SageMaker AI image is a set of image versions. Each image version represents a container image stored in Amazon ECR. For more information, see [Bring your own SageMaker AI image](https://docs.aws.amazon.com/sagemaker/latest/dg/studio-byoi.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the image.
        display-name: The display name of the image. If not provided, `ImageName` is displayed.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        image-name: The name of the image. Must be unique to your account.
        role-arn: The ARN of an IAM role that enables Amazon SageMaker AI to perform tasks on your behalf.
        tags: A list of tags to apply to the image.
