name: create-dev-endpoint
description: Creates a new development endpoint.
flags:
    --arguments=: A map of arguments used to configure the `DevEndpoint`.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --endpoint-name=!: The name to be assigned to the new `DevEndpoint`.
    --extra-jars-s3-path=: The path to one or more Java `.jar` files in an S3 bucket that should be loaded in your `DevEndpoint`.
    --extra-python-libs-s3-path=: The paths to one or more Python libraries in an Amazon S3 bucket that should be loaded in your `DevEndpoint`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --glue-version=: Glue version determines the versions of Apache Spark and Python that Glue supports.
    --number-of-nodes=: The number of Glue Data Processing Units (DPUs) to allocate to this `DevEndpoint`.
    --number-of-workers=: The number of workers of a defined `workerType` that are allocated to the development endpoint.
    --public-key=: The public key to be used by this `DevEndpoint` for authentication.
    --public-keys=:
        description: A list of public keys to be used by the development endpoints for authentication.
        nargs: -1
    --role-arn=!: The IAM role for the `DevEndpoint`.
    --security-configuration=: The name of the `SecurityConfiguration` structure to be used with this `DevEndpoint`.
    --security-group-ids=:
        description: Security group IDs for the security groups to be used by the new `DevEndpoint`.
        nargs: -1
    --subnet-id=: The subnet ID for the new `DevEndpoint` to use.
    --tags=: The tags to use with this DevEndpoint.
    --worker-type=: The type of predefined worker that is allocated to the development endpoint.
completion:
    flag:
        worker-type:
            - Standard
            - G.1X
            - G.2X
            - G.025X
            - G.4X
            - G.8X
            - Z.2X
documentation:
    command: Creates a new development endpoint.
    flag:
        arguments: A map of arguments used to configure the `DevEndpoint`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        endpoint-name: The name to be assigned to the new `DevEndpoint`.
        extra-jars-s3-path: The path to one or more Java `.jar` files in an S3 bucket that should be loaded in your `DevEndpoint`.
        extra-python-libs-s3-path: |-
            The paths to one or more Python libraries in an Amazon S3 bucket that should be loaded in your `DevEndpoint`. Multiple values must be complete paths separated by a comma.

            You can only use pure Python libraries with a `DevEndpoint`. Libraries that rely on C extensions, such as the [pandas](http://pandas.pydata.org/) Python data analysis library, are not yet supported.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        glue-version: |-
            Glue version determines the versions of Apache Spark and Python that Glue supports. The Python version indicates the version supported for running your ETL scripts on development endpoints.

            For more information about the available Glue versions and corresponding Spark and Python versions, see [Glue version](https://docs.aws.amazon.com/glue/latest/dg/add-job.html) in the developer guide.

            Development endpoints that are created without specifying a Glue version default to Glue 0.9.

            You can specify a version of Python support for development endpoints by using the `Arguments` parameter in the `CreateDevEndpoint` or `UpdateDevEndpoint` APIs. If no arguments are provided, the version defaults to Python 2.
        number-of-nodes: The number of Glue Data Processing Units (DPUs) to allocate to this `DevEndpoint`.
        number-of-workers: |-
            The number of workers of a defined `workerType` that are allocated to the development endpoint.

            The maximum number of workers you can define are 299 for `G.1X`, and 149 for `G.2X`.
        public-key: The public key to be used by this `DevEndpoint` for authentication. This attribute is provided for backward compatibility because the recommended attribute to use is public keys.
        public-keys: |-
            A list of public keys to be used by the development endpoints for authentication. The use of this attribute is preferred over a single public key because the public keys allow you to have a different private key per client.

            If you previously created an endpoint with a public key, you must remove that key to be able to set a list of public keys. Call the `UpdateDevEndpoint` API with the public key content in the `deletePublicKeys` attribute, and the list of new keys in the `addPublicKeys` attribute.
        role-arn: The IAM role for the `DevEndpoint`.
        security-configuration: The name of the `SecurityConfiguration` structure to be used with this `DevEndpoint`.
        security-group-ids: Security group IDs for the security groups to be used by the new `DevEndpoint`.
        subnet-id: The subnet ID for the new `DevEndpoint` to use.
        tags: The tags to use with this DevEndpoint. You may use tags to limit access to the DevEndpoint. For more information about tags in Glue, see [Amazon Web Services Tags in Glue](https://docs.aws.amazon.com/glue/latest/dg/monitor-tags.html) in the developer guide.
        worker-type: |-
            The type of predefined worker that is allocated to the development endpoint. Accepts a value of Standard, G.1X, or G.2X.

            - For the `Standard` worker type, each worker provides 4 vCPU, 16 GB of memory and a 50GB disk, and 2 executors per worker.
            - For the `G.1X` worker type, each worker maps to 1 DPU (4 vCPU, 16 GB of memory, 64 GB disk), and provides 1 executor per worker. We recommend this worker type for memory-intensive jobs.
            - For the `G.2X` worker type, each worker maps to 2 DPU (8 vCPU, 32 GB of memory, 128 GB disk), and provides 1 executor per worker. We recommend this worker type for memory-intensive jobs.

            Known issue: when a development endpoint is created with the `G.2X` `WorkerType` configuration, the Spark drivers for the development endpoint will run on 4 vCPU, 16 GB of memory, and a 64 GB disk.
