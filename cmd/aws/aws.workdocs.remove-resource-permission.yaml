name: remove-resource-permission
description: Removes the permission for the specified principal from the specified resource.
flags:
    --authentication-token=: Amazon WorkDocs authentication token.
    --principal-id=!: The principal ID of the resource.
    --principal-type=: The principal type of the resource.
    --resource-id=!: The ID of the resource.
completion:
    flag:
        principal-type:
            - USER
            - GROUP
            - INVITE
            - ANONYMOUS
            - ORGANIZATION
documentation:
    command: Removes the permission for the specified principal from the specified resource.
    flag:
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        principal-id: The principal ID of the resource.
        principal-type: The principal type of the resource.
        resource-id: The ID of the resource.
