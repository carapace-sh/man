name: create-index
description: Creates an index object.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --directory-arn=!: The ARN of the directory where the index should be created.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --is-unique!: Indicates whether the attribute that is being indexed has unique values or not.
    --link-name=: The name of the link between the parent object and the index object.
    --no-is-unique!: Indicates whether the attribute that is being indexed has unique values or not.
    --ordered-indexed-attribute-list=!: Specifies the attributes that should be indexed on.
    --parent-reference=: A reference to the parent object that contains the index object.
documentation:
    command: Creates an index object. See [Indexing and search](https://docs.aws.amazon.com/clouddirectory/latest/developerguide/indexing_search.html) for more information.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        directory-arn: The ARN of the directory where the index should be created.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        is-unique: Indicates whether the attribute that is being indexed has unique values or not.
        link-name: The name of the link between the parent object and the index object.
        ordered-indexed-attribute-list: Specifies the attributes that should be indexed on. Currently only a single attribute is supported.
        parent-reference: A reference to the parent object that contains the index object.
