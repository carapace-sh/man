name: describe-asset-model-interface-relationship
description: Retrieves information about an interface relationship between an asset model and an interface asset model.
flags:
    --asset-model-id=!: The ID of the asset model.
    --interface-asset-model-id=!: The ID of the interface asset model.
documentation:
    command: Retrieves information about an interface relationship between an asset model and an interface asset model.
    flag:
        asset-model-id: 'The ID of the asset model. This can be either the actual ID in UUID format, or else externalId: followed by the external ID.'
        interface-asset-model-id: 'The ID of the interface asset model. This can be either the actual ID in UUID format, or else externalId: followed by the external ID.'
