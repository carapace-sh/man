name: describe-capacity-blocks
description: Describes details about Capacity Blocks in the Amazon Web Services Region that you're currently using.
flags:
    --capacity-block-ids=: The IDs of the Capacity Blocks.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token to use to retrieve the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Describes details about Capacity Blocks in the Amazon Web Services Region that you're currently using.
    flag:
        capacity-block-ids: The IDs of the Capacity Blocks.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters.

            - `capacity-block-id` - The ID of the Capacity Block.
            - `ultraserver-type` - The Capacity Block type. The type can be `instances` or `ultraservers`.
            - `availability-zone` - The Availability Zone of the Capacity Block.
            - `start-date` - The date and time at which the Capacity Block was started.
            - `end-date` - The date and time at which the Capacity Block expires. When a Capacity Block expires, all instances in the Capacity Block are terminated.
            - `create-date` - The date and time at which the Capacity Block was created.
            - `state` - The state of the Capacity Block (`active` | `expired` | `unavailable` | `cancelled` | `failed` | `scheduled` | `payment-pending` | `payment-failed`).
            - `tags` - The tags assigned to the Capacity Block.
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token to use to retrieve the next page of results.
