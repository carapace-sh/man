name: list-apps
description: Returns a list of the existing Amplify apps.
flags:
    --max-results=: The maximum number of records to list in a single response.
    --next-token=: A pagination token.
documentation:
    command: Returns a list of the existing Amplify apps.
    flag:
        max-results: The maximum number of records to list in a single response.
        next-token: A pagination token. If non-null, the pagination token is returned in a result. Pass its value in another request to retrieve more entries.
