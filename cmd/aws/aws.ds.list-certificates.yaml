name: list-certificates
description: For the specified directory, lists all the certificates registered for a secure LDAP or client certificate authentication.
flags:
    --directory-id=!: The identifier of the directory.
    --limit=: The number of items that should show up on one page
    --next-token=: A token for requesting another page of certificates if the `NextToken` response element indicates that more certificates are available.
documentation:
    command: For the specified directory, lists all the certificates registered for a secure LDAP or client certificate authentication.
    flag:
        directory-id: The identifier of the directory.
        limit: The number of items that should show up on one page
        next-token: A token for requesting another page of certificates if the `NextToken` response element indicates that more certificates are available. Use the value of the returned `NextToken` element in your request until the token comes back as `null`. Pass `null` if this is the first call.
