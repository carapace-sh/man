name: get-usage-statistics
description: Lists Amazon GuardDuty usage statistics over the last 30 days for the specified detector ID.
flags:
    --detector-id=!: The ID of the detector that specifies the GuardDuty service whose usage statistics you want to retrieve.
    --max-results=: The maximum number of results to return in the response.
    --next-token=: A token to use for paginating results that are returned in the response.
    --unit=: The currency unit you would like to view your usage statistics in.
    --usage-criteria=!: Represents the criteria used for querying usage.
    --usage-statistic-type=!: The type of usage statistics to retrieve.
completion:
    flag:
        usage-statistic-type:
            - SUM_BY_ACCOUNT
            - SUM_BY_DATA_SOURCE
            - SUM_BY_RESOURCE
            - TOP_RESOURCES
            - SUM_BY_FEATURES
            - TOP_ACCOUNTS_BY_FEATURE
documentation:
    command: Lists Amazon GuardDuty usage statistics over the last 30 days for the specified detector ID. For newly enabled detectors or data sources, the cost returned will include only the usage so far under 30 days. This may differ from the cost metrics in the console, which project usage over 30 days to provide a monthly cost estimate. For more information, see [Understanding How Usage Costs are Calculated](https://docs.aws.amazon.com/guardduty/latest/ug/monitoring_costs.html#usage-calculations).
    flag:
        detector-id: |-
            The ID of the detector that specifies the GuardDuty service whose usage statistics you want to retrieve.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        max-results: The maximum number of results to return in the response.
        next-token: A token to use for paginating results that are returned in the response. Set the value of this parameter to null for the first request to a list action. For subsequent calls, use the NextToken value returned from the previous request to continue listing results after the first page.
        unit: The currency unit you would like to view your usage statistics in. Current valid values are USD.
        usage-criteria: Represents the criteria used for querying usage.
        usage-statistic-type: The type of usage statistics to retrieve.
