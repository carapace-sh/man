name: redact
description: '*(ALPHA)*  Redact potentially sensitive data from text content.'
flags:
    --content-file=: Text file to scan for sensitive data to redact.
    --content=: Text content to redact sensitive data from.
    --info-types=!: Which infoTypes to scan input for.
    --min-likelihood=: Only return findings equal to or above this threshold.
    --no-remove-findings&: If specified, all sensitive data will be removed, instead of
    --no-replace-with-info-type&: If specified, all sensitive data will be replaced with its infoType.
    --output-file=: Path to the file to write redacted contents to.
    --remove-findings: If specified, all sensitive data will be removed, instead of
    --replace-with-info-type: If specified, all sensitive data will be replaced with its infoType.
    --replacement-text=: Text to replace each sensitive data finding with.
completion:
    flag:
        min-likelihood:
            - likely
            - possible
            - unlikely
            - very-likely
            - very-unlikely
documentation:
    command: |
        *(ALPHA)*  Redacts potentially sensitive data from text content.
    flag:
        content: Text content to redact sensitive data from.
        content-file: |-
            Text file to scan for sensitive data to redact. Can also be a CSV
            file specifying tabular data. For CSV files, up to 50,000 values
            per request are allowed. To read from stdin pass '-' as the file
            name. Use a full or relative path to a local file containing the value of content_file.
        info-types: |-
            Which infoTypes to scan input for. The values must correspond to
            infoType values found in documentation. For more information about
            valid infoTypes, see [infoTypes Reference](https://cloud.google.com/dlp/docs/infotypes-reference)
        min-likelihood: 'Only return findings equal to or above this threshold. _MIN_LIKELIHOOD_ must be one of: *likely*, *possible*, *unlikely*, *very-likely*, *very-unlikely*.'
        no-remove-findings: |
            If specified, all sensitive data will be removed, instead of
            replaced.
        no-replace-with-info-type: |
            If specified, all sensitive data will be replaced with its infoType.
            For example, 'email:guest@example.com' would become
            'email:[EMAIL_ADDRESS]'.
        output-file: Path to the file to write redacted contents to.
        remove-findings: |-
            If specified, all sensitive data will be removed, instead of
            replaced.
        replace-with-info-type: |-
            If specified, all sensitive data will be replaced with its infoType.
            For example, 'email:guest@example.com' would become
            'email:[EMAIL_ADDRESS]'.
        replacement-text: Text to replace each sensitive data finding with.
