name: create-project
description: Creates a machine learning (ML) project that can contain one or more templates that set up an ML pipeline from training to deploying an approved model.
flags:
    --project-description=: A description for the project.
    --project-name=!: The name of the project.
    --service-catalog-provisioning-details=: The product ID and provisioning artifact ID to provision a service catalog.
    --tags=: An array of key-value pairs that you want to use to organize and track your Amazon Web Services resource costs.
    --template-providers=: An array of template provider configurations for creating infrastructure resources for the project.
documentation:
    command: Creates a machine learning (ML) project that can contain one or more templates that set up an ML pipeline from training to deploying an approved model.
    flag:
        project-description: A description for the project.
        project-name: The name of the project.
        service-catalog-provisioning-details: The product ID and provisioning artifact ID to provision a service catalog. The provisioning artifact ID will default to the latest provisioning artifact ID of the product, if you don't provide the provisioning artifact ID. For more information, see [What is Amazon Web Services Service Catalog](https://docs.aws.amazon.com/servicecatalog/latest/adminguide/introduction.html).
        tags: An array of key-value pairs that you want to use to organize and track your Amazon Web Services resource costs. For more information, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html) in the *Amazon Web Services General Reference Guide*.
        template-providers: An array of template provider configurations for creating infrastructure resources for the project.
