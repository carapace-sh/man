name: import-decoder-manifest
description: Creates a decoder manifest using your existing CAN DBC file from your local device.
flags:
    --name=!: The name of the decoder manifest to import.
    --network-file-definitions=!: The file to load into an Amazon Web Services account.
documentation:
    command: |-
        Creates a decoder manifest using your existing CAN DBC file from your local device.

        The CAN signal name must be unique and not repeated across CAN message definitions in a .dbc file.
    flag:
        name: The name of the decoder manifest to import.
        network-file-definitions: The file to load into an Amazon Web Services account.
