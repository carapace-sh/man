name: create-provisioning-artifact
description: Creates a provisioning artifact (also known as a version) for the specified product.
flags:
    --accept-language=: The language code.
    --idempotency-token=!: A unique identifier that you provide to ensure idempotency.
    --parameters=!: The configuration for the provisioning artifact.
    --product-id=!: The product identifier.
documentation:
    command: |-
        Creates a provisioning artifact (also known as a version) for the specified product.

        You cannot create a provisioning artifact for a product that was shared with you.

        The user or role that performs this operation must have the `cloudformation:GetTemplate` IAM policy permission. This policy permission is required when using the `ImportFromPhysicalId` template source in the information data section.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        idempotency-token: A unique identifier that you provide to ensure idempotency. If multiple requests differ only by the idempotency token, the same response is returned for each repeated request.
        parameters: The configuration for the provisioning artifact.
        product-id: The product identifier.
