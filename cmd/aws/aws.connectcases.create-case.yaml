name: create-case
description: |-
    If you provide a value for `PerformedBy.UserArn` you must also have [connect:DescribeUser](https://docs.aws.amazon.com/connect/latest/APIReference/API_DescribeUser.html) permission on the User ARN resource that you provide

    Creates a case in the specified Cases domain.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --domain-id=!: The unique identifier of the Cases domain.
    --fields=!: An array of objects with field ID (matching ListFields/DescribeField) and value union data.
    --performed-by=: ""
    --template-id=!: A unique identifier of a template.
documentation:
    command: |-
        If you provide a value for `PerformedBy.UserArn` you must also have [connect:DescribeUser](https://docs.aws.amazon.com/connect/latest/APIReference/API_DescribeUser.html) permission on the User ARN resource that you provide

        Creates a case in the specified Cases domain. Case system and custom fields are taken as an array id/value pairs with a declared data types.

        The following fields are required when creating a case:

        - `customer_id` - You must provide the full customer profile ARN in this format: `arn:aws:profile:your_AWS_Region:your_AWS_account ID:domains/your_profiles_domain_name/profiles/profile_ID`
        - `title`
    flag:
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        domain-id: The unique identifier of the Cases domain.
        fields: An array of objects with field ID (matching ListFields/DescribeField) and value union data.
        performed-by: ""
        template-id: A unique identifier of a template.
