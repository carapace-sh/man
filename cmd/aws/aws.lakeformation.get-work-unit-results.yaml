name: get-work-unit-results
description: Returns the work units resulting from the query.
flags:
    --query-id=!: The ID of the plan query operation for which to get results.
    --work-unit-id=!: The work unit ID for which to get results.
    --work-unit-token=!: A work token used to query the execution service.
completion:
    positional:
        - - $files
documentation:
    command: Returns the work units resulting from the query. Work units can be executed in any order and in parallel.
    flag:
        query-id: The ID of the plan query operation for which to get results.
        work-unit-id: The work unit ID for which to get results. Value generated by enumerating `WorkUnitIdMin` to `WorkUnitIdMax` (inclusive) from the `WorkUnitRange` in the output of `GetWorkUnits`.
        work-unit-token: A work token used to query the execution service. Token output from `GetWorkUnits`.
