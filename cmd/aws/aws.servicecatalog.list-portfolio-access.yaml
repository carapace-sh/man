name: list-portfolio-access
description: Lists the account IDs that have access to the specified portfolio.
flags:
    --accept-language=: The language code.
    --organization-parent-id=: The ID of an organization node the portfolio is shared with.
    --page-size=: The maximum number of items to return with this call.
    --page-token=: The page token for the next set of results.
    --portfolio-id=!: The portfolio identifier.
documentation:
    command: |-
        Lists the account IDs that have access to the specified portfolio.

        A delegated admin can list the accounts that have access to the shared portfolio. Note that if a delegated admin is de-registered, they can no longer perform this operation.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        organization-parent-id: The ID of an organization node the portfolio is shared with. All children of this node with an inherited portfolio share will be returned.
        page-size: The maximum number of items to return with this call.
        page-token: The page token for the next set of results. To retrieve the first set of results, use null.
        portfolio-id: The portfolio identifier.
