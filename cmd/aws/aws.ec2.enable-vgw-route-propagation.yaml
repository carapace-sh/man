name: enable-vgw-route-propagation
description: Enables a virtual private gateway (VGW) to propagate routes to the specified route table of a VPC.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --gateway-id=!: The ID of the virtual private gateway that is attached to a VPC.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --route-table-id=!: The ID of the route table.
documentation:
    command: Enables a virtual private gateway (VGW) to propagate routes to the specified route table of a VPC.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        gateway-id: The ID of the virtual private gateway that is attached to a VPC. The virtual private gateway must be attached to the same VPC that the routing tables are associated with.
        route-table-id: The ID of the route table. The routing table must be associated with the same VPC that the virtual private gateway is attached to.
