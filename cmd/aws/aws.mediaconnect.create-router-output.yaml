name: create-router-output
description: Creates a new router output in AWS Elemental MediaConnect.
flags:
    --availability-zone=: The Availability Zone where you want to create the router output.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique identifier for the request to ensure idempotency.
    --configuration=!: The configuration settings for the router output.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --maintenance-configuration=: The maintenance configuration settings for the router output, including preferred maintenance windows and schedules.
    --maximum-bitrate=!: The maximum bitrate for the router output.
    --name=!: The name of the router output.
    --region-name=: The AWS Region for the router output.
    --routing-scope=!: Specifies whether the router output can take inputs that are in different Regions.
    --tags=: Key-value pairs that can be used to tag this router output.
    --tier=!: The tier level for the router output.
completion:
    flag:
        routing-scope:
            - REGIONAL
            - GLOBAL
        tier:
            - OUTPUT_100
            - OUTPUT_50
            - OUTPUT_20
documentation:
    command: Creates a new router output in AWS Elemental MediaConnect.
    flag:
        availability-zone: The Availability Zone where you want to create the router output. This must be a valid Availability Zone for the region specified by `regionName`, or the current region if no `regionName` is provided.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique identifier for the request to ensure idempotency.
        configuration: The configuration settings for the router output.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        maintenance-configuration: The maintenance configuration settings for the router output, including preferred maintenance windows and schedules.
        maximum-bitrate: The maximum bitrate for the router output.
        name: The name of the router output.
        region-name: The AWS Region for the router output. Defaults to the current region if not specified.
        routing-scope: Specifies whether the router output can take inputs that are in different Regions. REGIONAL (default) - can only take inputs from same Region. GLOBAL - can take inputs from any Region.
        tags: Key-value pairs that can be used to tag this router output.
        tier: The tier level for the router output.
