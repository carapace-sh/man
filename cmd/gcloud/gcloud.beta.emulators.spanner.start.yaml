name: start
description: '*(BETA)*  Start a local Cloud Spanner emulator.'
flags:
    --enable-fault-injection=: If true, the emulator will randomly inject faults into transactions.
    --host-port=: The host:port to which the emulator should be bound.
    --rest-port=: The port at which REST requests are served.
    --use-docker=: Use the Cloud Spanner emulator docker image even if the platform has a native binary available in the gcloud CLI.
documentation:
    command: '*(BETA)*  This command starts a local Cloud Spanner emulator.'
    flag:
        enable-fault-injection: If true, the emulator will randomly inject faults into transactions. This facilitates application abort-retry testing.
        host-port: The host:port to which the emulator should be bound. The default value is localhost:9010. Note that this port serves gRPC requests. To override the default port serving REST requests, use --rest-port. If using Docker to run the emulator, the host must be specified as an ipaddress.
        rest-port: The port at which REST requests are served. gcloud uses REST to communicate with the emulator. The default value is 9020.
        use-docker: Use the Cloud Spanner emulator docker image even if the platform has a native binary available in the gcloud CLI. Currently we only provide a native binary for Linux. For other systems, you must install Docker for your platform before starting the emulator.
