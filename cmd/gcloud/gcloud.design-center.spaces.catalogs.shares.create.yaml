name: create
description: Create a share.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --catalog=: The catalog id of the share resource.
    --destination-space=!: ID of the space or fully qualified identifier for the space.
    --location=: For resources [share, destination-space], provides fallback value for resource location attribute.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --space=: The space id of the share resource.
documentation:
    command: Create a share in a catalog.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        catalog: |-
            The catalog id of the share resource.
            +
            To set the `catalog` attribute:
            * provide the argument `share` on the command line with a fully specified name;
            * provide the argument `--catalog` on the command line.
        destination-space: |-
            ID of the space or fully qualified identifier for the space.
            +
            To set the `space` attribute:
            * provide the argument `--destination-space` on the command line.
        location: For resources [share, destination-space], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        space: |-
            The space id of the share resource.
            +
            To set the `space` attribute:
            * provide the argument `share` on the command line with a fully specified name;
            * provide the argument `--space` on the command line.
