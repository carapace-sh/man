name: create-smssandbox-phone-number
description: Adds a destination phone number to an Amazon Web Services account in the SMS sandbox and sends a one-time password (OTP) to that phone number.
flags:
    --language-code=: The language to use for sending the OTP.
    --phone-number=!: The destination phone number to verify.
completion:
    flag:
        language-code:
            - en-US
            - en-GB
            - es-419
            - es-ES
            - de-DE
            - fr-CA
            - fr-FR
            - it-IT
            - ja-JP
            - pt-BR
            - kr-KR
            - zh-CN
            - zh-TW
documentation:
    command: |-
        Adds a destination phone number to an Amazon Web Services account in the SMS sandbox and sends a one-time password (OTP) to that phone number.

        When you start using Amazon SNS to send SMS messages, your Amazon Web Services account is in the *SMS sandbox*. The SMS sandbox provides a safe environment for you to try Amazon SNS features without risking your reputation as an SMS sender. While your Amazon Web Services account is in the SMS sandbox, you can use all of the features of Amazon SNS. However, you can send SMS messages only to verified destination phone numbers. For more information, including how to move out of the sandbox to send messages without restrictions, see [SMS sandbox](https://docs.aws.amazon.com/sns/latest/dg/sns-sms-sandbox.html) in the *Amazon SNS Developer Guide*.
    flag:
        language-code: The language to use for sending the OTP. The default value is `en-US`.
        phone-number: The destination phone number to verify. On verification, Amazon SNS adds this phone number to the list of verified phone numbers that you can send SMS messages to.
