name: modify-instance-groups
description: ModifyInstanceGroups modifies the number of nodes and configuration settings of an instance group.
flags:
    --cluster-id=: The ID of the cluster to which the instance group belongs.
    --instance-groups=: Instance groups to change.
documentation:
    command: ModifyInstanceGroups modifies the number of nodes and configuration settings of an instance group. The input parameters include the new target instance count for the group and the instance group ID. The call will either succeed or fail atomically.
    flag:
        cluster-id: The ID of the cluster to which the instance group belongs.
        instance-groups: Instance groups to change.
