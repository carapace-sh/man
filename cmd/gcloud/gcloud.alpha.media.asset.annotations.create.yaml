name: create
description: '*(ALPHA)*  Create a new Cloud Media Annotation.'
hidden: true
flags:
    --annotation-data-file=!: File path to a file contains annotation data in JSON format.
    --annotation-set=: Google Cloud Media Asset annotation set
    --asset-type=: Google Cloud Media Asset asset type.
    --asset=: Google Cloud Media Asset asset.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Google Cloud location.
documentation:
    command: '*(ALPHA)*  Create a new Media Annotation.'
    flag:
        annotation-data-file: File path to a file contains annotation data in JSON format. Use a full or relative path to a local file containing the value of annotation_data_file.
        annotation-set: |-
            Google Cloud Media Asset annotation set
            +
            To set the `annotation_set` attribute:
            * provide the argument `annotation` on the command line with a fully specified name;
            * provide the argument `--annotation_set` on the command line.
        asset: |-
            Google Cloud Media Asset asset.
            +
            To set the `asset` attribute:
            * provide the argument `annotation` on the command line with a fully specified name;
            * provide the argument `--asset` on the command line.
        asset-type: |-
            Google Cloud Media Asset asset type.
            +
            To set the `asset_type` attribute:
            * provide the argument `annotation` on the command line with a fully specified name;
            * provide the argument `--asset_type` on the command line.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `annotation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `media_asset/location`.
