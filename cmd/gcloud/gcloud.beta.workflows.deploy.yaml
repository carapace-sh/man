name: deploy
description: '*(BETA)*  Create or update a workflow.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: The description of the workflow to deploy.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Cloud location for the workflow.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --service-account=: The service account that should be used as the workflow identity.
    --source=: Location of a workflow source code to deploy.
documentation:
    command: '*(BETA)*  Create or update a workflow.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: The description of the workflow to deploy.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Cloud location for the workflow.  Alternatively, set the property [workflows/location].
            +
            To set the `location` attribute:
            * provide the argument `workflow` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `workflows/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        service-account: The service account that should be used as the workflow identity. "projects/PROJECT_ID/serviceAccounts/" prefix may be skipped from the full resource name, in that case "projects/-/serviceAccounts/" is prepended to the service account ID.
        source: Location of a workflow source code to deploy. Required on first deployment. Location needs to be defined as a path to a local file with the source code.
