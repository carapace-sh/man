name: describe-reserved-db-instances
description: Returns information about reserved DB instances for this account, or about a specified reserved DB instance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-instance-class=: The DB instance class filter value.
    --duration=: The duration filter value, specified in years or seconds.
    --filters=:
        description: This parameter isn't currently supported.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --lease-id=: The lease identifier filter value.
    --marker=: An optional pagination token provided by a previous request.
    --max-items=: The  total number of items to return in the command's output.
    --max-records=: The maximum number of records to include in the response.
    --multi-az: Specifies whether to show only those reservations that support Multi-AZ.
    --no-multi-az: Specifies whether to show only those reservations that support Multi-AZ.
    --offering-type=: The offering type filter value.
    --page-size=: The size of each page to get in the AWS service call.
    --product-description=: The product description filter value.
    --reserved-db-instance-id=: The reserved DB instance identifier filter value.
    --reserved-db-instances-offering-id=: The offering identifier filter value.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: Returns information about reserved DB instances for this account, or about a specified reserved DB instance.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-instance-class: The DB instance class filter value. Specify this parameter to show only those reservations matching the specified DB instances class.
        duration: |-
            The duration filter value, specified in years or seconds. Specify this parameter to show only reservations for this duration.

            Valid Values: `1 | 3 | 31536000 | 94608000`
        filters: This parameter isn't currently supported.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        lease-id: |-
            The lease identifier filter value. Specify this parameter to show only the reservation that matches the specified lease ID.

            Amazon Web Services Support might request the lease ID for an issue related to a reserved DB instance.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-records: |-
            The maximum number of records to include in the response. If more than the `MaxRecords` value is available, a pagination token called a marker is included in the response so you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        multi-az: Specifies whether to show only those reservations that support Multi-AZ.
        offering-type: |-
            The offering type filter value. Specify this parameter to show only the available offerings matching the specified offering type.

            Valid Values: `"Partial Upfront" | "All Upfront" | "No Upfront"`
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        product-description: The product description filter value. Specify this parameter to show only those reservations matching the specified product description.
        reserved-db-instance-id: The reserved DB instance identifier filter value. Specify this parameter to show only the reservation that matches the specified reservation ID.
        reserved-db-instances-offering-id: The offering identifier filter value. Specify this parameter to show only purchased reservations matching the specified offering identifier.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
