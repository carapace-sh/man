name: list-archives
description: Returns a list of all email archives in your account.
flags:
    --next-token=: If NextToken is returned, there are more results available.
    --page-size=: The maximum number of archives that are returned per call.
documentation:
    command: Returns a list of all email archives in your account.
    flag:
        next-token: If NextToken is returned, there are more results available. The value of NextToken is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page.
        page-size: The maximum number of archives that are returned per call. You can use NextToken to obtain further pages of archives.
