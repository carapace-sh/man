name: list-cases
description: Lists all cases the requester has access to.
flags:
    --max-results=: Optional element for ListCases to limit the number of responses.
    --next-token=: An optional string that, if supplied, must be copied from the output of a previous call to ListCases.
documentation:
    command: Lists all cases the requester has access to.
    flag:
        max-results: Optional element for ListCases to limit the number of responses.
        next-token: An optional string that, if supplied, must be copied from the output of a previous call to ListCases. When provided in this manner, the API fetches the next page of results.
