name: create-batch-import-job
description: Creates a batch import job.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --event-type-name=!: The name of the event type.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role-arn=!: The ARN of the IAM role created for Amazon S3 bucket that holds your data file.
    --input-path=!: The URI that points to the Amazon S3 location of your data file.
    --job-id=!: The ID of the batch import job.
    --output-path=!: The URI that points to the Amazon S3 location for storing your results.
    --tags=:
        description: A collection of key-value pairs associated with this request.
        nargs: -1
documentation:
    command: Creates a batch import job.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        event-type-name: The name of the event type.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role-arn: |-
            The ARN of the IAM role created for Amazon S3 bucket that holds your data file.

            The IAM role must have read permissions to your input S3 bucket and write permissions to your output S3 bucket. For more information about bucket permissions, see [User policy examples](https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-policies-s3.html) in the *Amazon S3 User Guide*.
        input-path: The URI that points to the Amazon S3 location of your data file.
        job-id: The ID of the batch import job. The ID cannot be of a past job, unless the job exists in `CREATE_FAILED` state.
        output-path: The URI that points to the Amazon S3 location for storing your results.
        tags: A collection of key-value pairs associated with this request.
