name: describe-option-groups
description: Describes the available option groups.
flags:
    --engine-name=: A filter to only include option groups associated with this database engine.
    --filters=: This parameter isn't currently supported.
    --major-engine-version=: Filters the list of option groups to only include groups associated with a specific database engine version.
    --marker=: An optional pagination token provided by a previous DescribeOptionGroups request.
    --max-records=: The maximum number of records to include in the response.
    --option-group-name=: The name of the option group to describe.
documentation:
    command: Describes the available option groups.
    flag:
        engine-name: |-
            A filter to only include option groups associated with this database engine.

            Valid Values:

            - `db2-ae`
            - `db2-se`
            - `mariadb`
            - `mysql`
            - `oracle-ee`
            - `oracle-ee-cdb`
            - `oracle-se2`
            - `oracle-se2-cdb`
            - `postgres`
            - `sqlserver-ee`
            - `sqlserver-se`
            - `sqlserver-ex`
            - `sqlserver-web`
        filters: This parameter isn't currently supported.
        major-engine-version: Filters the list of option groups to only include groups associated with a specific database engine version. If specified, then EngineName must also be specified.
        marker: An optional pagination token provided by a previous DescribeOptionGroups request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        option-group-name: The name of the option group to describe. Can't be supplied together with EngineName or MajorEngineVersion.
