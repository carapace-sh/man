    --max-nodes=!: Maximum number of nodes in the node pool.
    --max-pods-per-node=!: Maximum number of pods per node.
    --max-surge-update=: Maximum number of extra (surge) nodes to be created beyond the current size of
    --max-unavailable-update=: Maximum number of nodes that can be simultaneously unavailable during this node
    --min-nodes=!: Minimum number of nodes in the node pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-autorepair&: Enable node autorepair feature for a node pool.
    --no-validate-only&: Validate the node pool to create, but don't actually perform it.
    --node-labels=: Labels assigned to the node pool's nodes.
    --node-taints=: Taints assigned to nodes of the node pool.
    --node-version=!: Kubernetes version to use for the node pool.
    --proxy-secret-arn=!: ARN of the AWS Secrets Manager secret that contains a proxy configuration.
    --proxy-secret-version-id=!: Version ID string of the AWS Secrets Manager secret that contains a proxy configuration.
    --root-volume-iops=: Number of I/O operations per second (IOPS) to provision for the root volume.
    --root-volume-kms-key-arn=: Amazon Resource Name (ARN) of the AWS KMS key to encrypt the root volume.
    --root-volume-size=: Size of the root volume.
    --root-volume-throughput=: Throughput to provision for the root volume, in MiB/s.
    --root-volume-type=: Type of the root volume.
    --security-group-ids=: IDs of additional security groups to add to the node pool's nodes.
    --spot-instance-types=: List of AWS EC2 instance types for creating a spot node pool's nodes.
    --ssh-ec2-key-pair=: Name of the EC2 key pair authorized to login to the node pool's nodes.
    --subnet-id=!: Subnet ID of an existing VNET to use for the node pool.
