name: list-rules
description: List all rules for the specified Amazon Connect instance.
flags:
    --event-source-name=: The name of the event source.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --publish-status=: The publish status of the rule.
completion:
    flag:
        event-source-name:
            - OnPostCallAnalysisAvailable
            - OnRealTimeCallAnalysisAvailable
            - OnRealTimeChatAnalysisAvailable
            - OnPostChatAnalysisAvailable
            - OnZendeskTicketCreate
            - OnZendeskTicketStatusUpdate
            - OnSalesforceCaseCreate
            - OnContactEvaluationSubmit
            - OnMetricDataUpdate
            - OnCaseCreate
            - OnCaseUpdate
            - OnSlaBreach
        publish-status:
            - DRAFT
            - PUBLISHED
documentation:
    command: List all rules for the specified Amazon Connect instance.
    flag:
        event-source-name: The name of the event source.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        publish-status: The publish status of the rule.
