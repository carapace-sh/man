name: describe-document-classification-job
description: Gets the properties associated with a document classification job.
flags:
    --job-id=!: The identifier that Amazon Comprehend generated for the job.
documentation:
    command: Gets the properties associated with a document classification job. Use this operation to get the status of a classification job.
    flag:
        job-id: The identifier that Amazon Comprehend generated for the job. The `StartDocumentClassificationJob` operation returns this identifier in its response.
