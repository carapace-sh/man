name: associate-default-vocabulary
description: Associates an existing vocabulary as the default.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --language-code=!: The language code of the vocabulary entries.
    --vocabulary-id=: The identifier of the custom vocabulary.
