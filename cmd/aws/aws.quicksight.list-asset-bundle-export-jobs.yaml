name: list-asset-bundle-export-jobs
description: Lists all asset bundle export jobs that have been taken place in the last 14 days.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that the export jobs were executed in.
    --max-results=: The maximum number of results to be returned per request.
    --next-token=: The token for the next set of results, or null if there are no more results.
documentation:
    command: Lists all asset bundle export jobs that have been taken place in the last 14 days. Jobs created more than 14 days ago are deleted forever and are not returned. If you are using the same job ID for multiple jobs, `ListAssetBundleExportJobs` only returns the most recent job that uses the repeated job ID.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that the export jobs were executed in.
        max-results: The maximum number of results to be returned per request.
        next-token: The token for the next set of results, or null if there are no more results.
