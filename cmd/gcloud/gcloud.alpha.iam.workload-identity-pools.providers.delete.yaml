name: delete
description: '*(ALPHA)*  Delete a workload identity pool provider.'
flags:
    --location=: The location name.
    --workload-identity-pool=: The ID to use for the pool, which becomes the final component of the resource name.
documentation:
    command: '*(ALPHA)*  Delete a workload identity pool provider.'
    flag:
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `provider` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        workload-identity-pool: |-
            The ID to use for the pool, which becomes the final component of the resource name. This value
            should be 4-32 characters, and may contain the characters [a-z0-9-]. The prefix `gcp-` is
            reserved for use by Google, and may not be specified.
            +

            To set the `workload-identity-pool` attribute:
            * provide the argument `provider` on the command line with a fully specified name;
            * provide the argument `--workload-identity-pool` on the command line.
