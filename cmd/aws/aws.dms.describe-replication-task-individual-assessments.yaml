name: describe-replication-task-individual-assessments
description: Returns a paginated list of individual assessments based on filter settings.
flags:
    --filters=: Filters applied to the individual assessments described in the form of key-value pairs.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: |-
        Returns a paginated list of individual assessments based on filter settings.

        These filter settings can specify a combination of premigration assessment runs, migration tasks, and assessment status values.
    flag:
        filters: |-
            Filters applied to the individual assessments described in the form of key-value pairs.

            Valid filter names: `replication-task-assessment-run-arn`, `replication-task-arn`, `status`
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.
