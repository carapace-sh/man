name: regen
description: Regenerate given API(s) in gcloud.
hidden: true
flags:
    --api-discovery-doc=: Path to json file describing the api.
    --base-dir=: Directory where generated code will be written.
    --config=: Regeneration config yaml filename.
documentation:
    command: Regenerate given API(s) in gcloud.
    flag:
        api-discovery-doc: Path to json file describing the api. If not specified, an existing discovery doc will be used.
        base-dir: Directory where generated code will be written. By default googlecloudsdk/generated_clients/apis.
        config: Regeneration config yaml filename. If not specified canonical config will be used.
