name: services
description: View and manage your App Engine services.
documentation:
    command: |-
        This set of commands can be used to view and manage your existing App Engine
        services.

        To create new deployments, use `gcloud app deploy`.

        For more information on App Engine services, see:
        https://cloud.google.com/appengine/docs/python/an-overview-of-app-engine
