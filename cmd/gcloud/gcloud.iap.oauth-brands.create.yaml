name: create
description: '*(DEPRECATED)*  Create a Cloud OAuth brand for the project.'
flags:
    --application-title=!: Application name displayed on the OAuth consent screen.
    --support-email=!: Support email displayed on the OAuth consent screen.
documentation:
    command: |4
        *(DEPRECATED)*  This command is deprecated and will be non-functional after the IAP OAuth Admin APIs are turned down. Jan 19, 2026: Google will discontinue support for the IAP OAuth Admin APIs. New projects will not be able to use these APIs. March 19, 2026: The IAP OAuth Admin APIs will be permanently shut down. Access to this feature will no longer be available.

        *gcloud iap oauth-brands create* is used to create a Cloud OAuth brand for the project. The brand is 'internal only',
        meaning OAuth clients created under it only accept requests from users who belong to the same
        G Suite account as the project. The brand is created in unreviewed status. Your domain will not
        appear on the OAuth consent screen until it is reviewed after you manually start a review
        process in Google Cloud Platform Console. Note that the
        'internal only' setting can be manually changed in Google Cloud Platform Console
        (https://console.cloud.google.com/apis/credentials/consent). A project can only have one brand.
    flag:
        application-title: Application name displayed on the OAuth consent screen.
        support-email: Support email displayed on the OAuth consent screen.
