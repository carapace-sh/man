name: describe
description: Describes a Cloud Firestore backup schedule.
flags:
    --backup-schedule=!: The backup schedule to operate on.
    --database=!: The database to operate on.
documentation:
    command: |-
        ## EXAMPLES

        To describe backup schedule 'cf9f748a-7980-4703-b1a1-d1ffff591db0' under
        database testdb.

            $ gcloud firestore backups schedules describe --database='testdb'
            --backup-schedule='cf9f748a-7980-4703-b1a1-d1ffff591db0'
    flag:
        backup-schedule: |-
            The backup schedule to operate on.
            +
            For example, to operate on backup schedule `091a49a0-223f-4c98-8c69-a284abbdb26b`:
            +
              $ {command} --backup-schedule='091a49a0-223f-4c98-8c69-a284abbdb26b'
        database: |-
            The database to operate on.
            +
            For example, to operate on database `foo`:
            +
              $ {command} --database='foo'
