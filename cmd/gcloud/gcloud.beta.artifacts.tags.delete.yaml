name: delete
description: '*(BETA)*  Delete an Artifact Registry tag.'
flags:
    --location=: Location of the tag.
    --package=: The package associated with the tag.
    --repository=: The repository associated with the tag.
documentation:
    command: |
        *(BETA)*  Delete an Artifact Registry tag.

        This command can fail for the following reasons:
          * The specified tag does not exist.
          * The specified version or package does not exist.
          * The active account does not have permission to delete tags.
          * The specified package format doesn't support tag operations (e.g. maven).
    flag:
        location: |-
            Location of the tag. Overrides the default artifacts/location property value
            for this command invocation. To configure the default location, use the command:
            gcloud config set artifacts/location.
            +

            To set the `location` attribute:
            * provide the argument `tag` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        package: |-
            The package associated with the tag.
            +

            To set the `package` attribute:
            * provide the argument `tag` on the command line with a fully specified name;
            * provide the argument `--package` on the command line.
        repository: |-
            The repository associated with the tag. Overrides the default artifacts/repository property value
            for this command invocation. To configure the default repository, use the command:
            gcloud config set artifacts/repository.
            +

            To set the `repository` attribute:
            * provide the argument `tag` on the command line with a fully specified name;
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
