documentation:
    command: |
        *(BETA)*  Create a new `WasmPluginVersion` resource.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: A human-readable description of the resource.
        image: |-
            URI of the image containing the plugin's Wasm module, stored in the
            Artifact Registry.
        labels: List of KEY=VALUE labels to attach to this resource.
        location: |-
            The location ID.
            +

            To set the `location` attribute:
            * provide the argument `wasm_plugin_version` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * use global location.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        plugin-config: Plugin configuration in the textual format.
        plugin-config-file: Path to a file containing the plugin configuration. Use a full or relative path to a local file containing the value of plugin_config_file.
        plugin-config-uri: |-
            URI of the image containing the plugin's configuration, stored in the
            Artifact Registry.
        wasm-plugin: |-
            The ID of the `WasmPlugin`.
            +
            To set the `wasm-plugin` attribute:
            * provide the argument `wasm_plugin_version` on the command line with a fully specified name;
            * provide the argument `--wasm-plugin` on the command line.
