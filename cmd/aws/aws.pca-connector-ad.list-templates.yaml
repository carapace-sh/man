name: list-templates
description: Lists the templates, if any, that are associated with a connector.
flags:
    --connector-arn=!: The Amazon Resource Name (ARN) that was returned when you called [CreateConnector](https://docs.aws.amazon.com/pca-connector-ad/latest/APIReference/API_CreateConnector.html).
    --max-results=: Use this parameter when paginating results to specify the maximum number of items to return in the response on each page.
    --next-token=: Use this parameter when paginating results in a subsequent request after you receive a response with truncated results.
documentation:
    command: Lists the templates, if any, that are associated with a connector.
    flag:
        connector-arn: The Amazon Resource Name (ARN) that was returned when you called [CreateConnector](https://docs.aws.amazon.com/pca-connector-ad/latest/APIReference/API_CreateConnector.html).
        max-results: Use this parameter when paginating results to specify the maximum number of items to return in the response on each page. If additional items exist beyond the number you specify, the `NextToken` element is sent in the response. Use this `NextToken` value in a subsequent request to retrieve additional items.
        next-token: Use this parameter when paginating results in a subsequent request after you receive a response with truncated results. Set it to the value of the `NextToken` parameter from the response you just received.
