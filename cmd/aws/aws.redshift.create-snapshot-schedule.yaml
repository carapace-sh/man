name: create-snapshot-schedule
description: Create a snapshot schedule that can be associated to a cluster and which overrides the default system backup schedule.
flags:
    --dry-run=: ""
    --next-invocations=: ""
    --schedule-definitions=: The definition of the snapshot schedule.
    --schedule-description=: The description of the snapshot schedule.
    --schedule-identifier=: A unique identifier for a snapshot schedule.
    --tags=: An optional set of tags you can use to search for the schedule.
documentation:
    command: Create a snapshot schedule that can be associated to a cluster and which overrides the default system backup schedule.
    flag:
        dry-run: ""
        next-invocations: ""
        schedule-definitions: The definition of the snapshot schedule. The definition is made up of schedule expressions, for example "cron(30 12 \*)" or "rate(12 hours)".
        schedule-description: The description of the snapshot schedule.
        schedule-identifier: A unique identifier for a snapshot schedule. Only alphanumeric characters are allowed for the identifier.
        tags: An optional set of tags you can use to search for the schedule.
