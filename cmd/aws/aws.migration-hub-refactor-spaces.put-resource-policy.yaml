name: put-resource-policy
description: Attaches a resource-based permission policy to the Amazon Web Services Migration Hub Refactor Spaces environment.
flags:
    --policy=!: A JSON-formatted string for an Amazon Web Services resource-based policy.
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to which the policy is being attached.
documentation:
    command: Attaches a resource-based permission policy to the Amazon Web Services Migration Hub Refactor Spaces environment. The policy must contain the same actions and condition statements as the `arn:aws:ram::aws:permission/AWSRAMDefaultPermissionRefactorSpacesEnvironment` permission in Resource Access Manager. The policy must not contain new lines or blank lines.
    flag:
        policy: A JSON-formatted string for an Amazon Web Services resource-based policy.
        resource-arn: The Amazon Resource Name (ARN) of the resource to which the policy is being attached.
