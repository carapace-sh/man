name: create-load-balancer
description: Creates a Classic Load Balancer.
flags:
    --availability-zones=:
        description: One or more Availability Zones from the same region as the load balancer.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --listeners=!:
        description: The listeners.
        nargs: -1
    --load-balancer-name=!: The name of the load balancer.
    --scheme=: The type of a load balancer.
    --security-groups=:
        description: The IDs of the security groups to assign to the load balancer.
        nargs: -1
    --subnets=:
        description: The IDs of the subnets in your VPC to attach to the load balancer.
        nargs: -1
    --tags=:
        description: A list of tags to assign to the load balancer.
        nargs: -1
documentation:
    command: |-
        Creates a Classic Load Balancer.

        You can add listeners, security groups, subnets, and tags when you create your load balancer, or you can add them later using [CreateLoadBalancerListeners](), [ApplySecurityGroupsToLoadBalancer](), [AttachLoadBalancerToSubnets](), and [AddTags]().

        To describe your current load balancers, see [DescribeLoadBalancers](). When you are finished with a load balancer, you can delete it using [DeleteLoadBalancer]().

        You can create up to 20 load balancers per region per account. You can request an increase for the number of load balancers for your account. For more information, see [Limits for Your Classic Load Balancer](https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/elb-limits.html) in the *Classic Load Balancers Guide*.
    flag:
        availability-zones: |-
            One or more Availability Zones from the same region as the load balancer.

            You must specify at least one Availability Zone.

            You can add more Availability Zones after you create the load balancer using [EnableAvailabilityZonesForLoadBalancer]().
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        listeners: |-
            The listeners.

            For more information, see [Listeners for Your Classic Load Balancer](https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/elb-listener-config.html) in the *Classic Load Balancers Guide*.
        load-balancer-name: |-
            The name of the load balancer.

            This name must be unique within your set of load balancers for the region, must have a maximum of 32 characters, must contain only alphanumeric characters or hyphens, and cannot begin or end with a hyphen.
        scheme: |-
            The type of a load balancer. Valid only for load balancers in a VPC.

            By default, Elastic Load Balancing creates an Internet-facing load balancer with a DNS name that resolves to public IP addresses. For more information about Internet-facing and Internal load balancers, see [Load Balancer Scheme](https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html#load-balancer-scheme) in the *Elastic Load Balancing User Guide*.

            Specify `internal` to create a load balancer with a DNS name that resolves to private IP addresses.
        security-groups: The IDs of the security groups to assign to the load balancer.
        subnets: The IDs of the subnets in your VPC to attach to the load balancer. Specify one subnet per Availability Zone specified in `AvailabilityZones`.
        tags: |-
            A list of tags to assign to the load balancer.

            For more information about tagging your load balancer, see [Tag Your Classic Load Balancer](https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/add-remove-tags.html) in the *Classic Load Balancers Guide*.
