name: describe
description: Show fleet namespace info.
flags:
    --scope=: the
documentation:
    command: |-
        This command can fail for the following reasons:
        * The project specified does not exist.
        * The namespace specified does not exist in the project.
        * The caller does not have permission to access the project or namespace.

        ## EXAMPLES

        To print metadata for the namespace `NAMESPACE` in the active project,
        run:

          $ gcloud container hub scopes namespaces describe NAMESPACE

        To print metadata for the namespace `NAMESPACE` in project `PROJECT_ID`,
        run:

          $ gcloud container hub scopes namespaces describe NAMESPACE --project=PROJECT_ID
    flag:
        scope: |-
            the
            +
            To set the `scope` attribute:
            * provide the argument `NAMESPACE` on the command line with a fully specified name;
            * provide the argument `--scope` on the command line.
