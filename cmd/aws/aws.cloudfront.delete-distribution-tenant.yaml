name: delete-distribution-tenant
description: Deletes a distribution tenant.
flags:
    --id=!: The ID of the distribution tenant to delete.
    --if-match=!: The value of the `ETag` header that you received when retrieving the distribution tenant.
documentation:
    command: |-
        Deletes a distribution tenant. If you use this API operation to delete a distribution tenant that is currently enabled, the request will fail.

        To delete a distribution tenant, you must first disable the distribution tenant by using the `UpdateDistributionTenant` API operation.
    flag:
        id: The ID of the distribution tenant to delete.
        if-match: The value of the `ETag` header that you received when retrieving the distribution tenant. This value is returned in the response of the `GetDistributionTenant` API operation.
