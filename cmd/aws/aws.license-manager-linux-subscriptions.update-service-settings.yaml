name: update-service-settings
description: Updates the service settings for Linux subscriptions.
flags:
    --allow-update: Describes if updates are allowed to the service settings for Linux subscriptions.
    --linux-subscriptions-discovery-settings=!: The settings defined for Linux subscriptions discovery.
    --linux-subscriptions-discovery=!: Describes if the discovery of Linux subscriptions is enabled.
    --no-allow-update&: Describes if updates are allowed to the service settings for Linux subscriptions.
completion:
    flag:
        linux-subscriptions-discovery:
            - Enabled
            - Disabled
documentation:
    command: Updates the service settings for Linux subscriptions.
    flag:
        allow-update: Describes if updates are allowed to the service settings for Linux subscriptions. If you allow updates, you can aggregate Linux subscription data in more than one home Region.
        linux-subscriptions-discovery: Describes if the discovery of Linux subscriptions is enabled.
        linux-subscriptions-discovery-settings: The settings defined for Linux subscriptions discovery. The settings include if Organizations integration has been enabled, and which Regions data will be aggregated from.
