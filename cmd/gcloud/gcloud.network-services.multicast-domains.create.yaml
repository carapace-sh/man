name: create
description: Create a multicast domain.
flags:
    --admin-network=!: The URI of the admin network to be used.
    --async: Return immediately, without waiting for the operation in progress to
    --connection-type=: The connection type for authorizing multicast traffic.
    --description=: The description for the multicast domain.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location Id.
    --multicast-domain-group=: The URI of the multicast domain group to be used.
    --ncc-hub=: The URI of the NCC hub to be used.
    --no-async&: Return immediately, without waiting for the operation in progress to
completion:
    flag:
        connection-type:
            - connection-type-unspecified
            - ncc
            - same-vpc
documentation:
    command: |
        Create a multicast domain in the specified location of the current project.
    flag:
        admin-network: The URI of the admin network to be used.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        connection-type: 'The connection type for authorizing multicast traffic. _CONNECTION_TYPE_ must be one of: *connection-type-unspecified*, *ncc*, *same-vpc*.'
        description: The description for the multicast domain.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location Id.
            +
            To set the `location` attribute:
            * provide the argument `multicast_domain` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        multicast-domain-group: The URI of the multicast domain group to be used.
        ncc-hub: The URI of the NCC hub to be used.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
