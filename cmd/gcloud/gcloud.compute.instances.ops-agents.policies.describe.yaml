name: describe
description: Describe a Google Cloud Observability agents policy for the Ops Agent.
flags:
    --zone=!: Zone of the agents policy.
documentation:
    command: |-
        *gcloud compute instances ops-agents policies describe* describes a policy that facilitates agent management across
        Compute Engine instances based on user specified instance filters. This policy
        installs, specifies versioning, and removes Ops Agents.

        The command returns the content of one policy. For instance:

          agentsRule:
            packageState: installed
            version: latest
          instanceFilter:
            inclusionLabels:
            - labels:
                env: prod

        If no policies are found, then the command returns a `NOT_FOUND` error.
    flag:
        zone: Zone of the agents policy.
