name: create-web-app
description: Creates a web app based on specified parameters, and returns the ID for the new web app.
flags:
    --access-endpoint=: The `AccessEndpoint` is the URL that you provide to your users for them to interact with the Transfer Family web app.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --endpoint-details=: The endpoint configuration for the web app.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-provider-details=!: You can provide a structure that contains the details for the identity provider to use with your web app.
    --tags=: Key-value pairs that can be used to group and search for web apps.
    --web-app-endpoint-policy=: Setting for the type of endpoint policy for the web app.
    --web-app-units=: A union that contains the value for number of concurrent connections or the user sessions on your web app.
completion:
    flag:
        web-app-endpoint-policy:
            - FIPS
            - STANDARD
documentation:
    command: |-
        Creates a web app based on specified parameters, and returns the ID for the new web app. You can configure the web app to be publicly accessible or hosted within a VPC.

        For more information about using VPC endpoints with Transfer Family, see [Create a Transfer Family web app in a VPC](https://docs.aws.amazon.com/transfer/latest/userguide/create-webapp-in-vpc.html).
    flag:
        access-endpoint: |-
            The `AccessEndpoint` is the URL that you provide to your users for them to interact with the Transfer Family web app. You can specify a custom URL or use the default value.

            Before you enter a custom URL for this parameter, follow the steps described in [Update your access endpoint with a custom URL](https://docs.aws.amazon.com/transfer/latest/userguide/webapp-customize.html).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        endpoint-details: The endpoint configuration for the web app. You can specify whether the web app endpoint is publicly accessible or hosted within a VPC.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identity-provider-details: |-
            You can provide a structure that contains the details for the identity provider to use with your web app.

            For more details about this parameter, see [Configure your identity provider for Transfer Family web apps](https://docs.aws.amazon.com/transfer/latest/userguide/webapp-identity-center.html).
        tags: Key-value pairs that can be used to group and search for web apps.
        web-app-endpoint-policy: |-
            Setting for the type of endpoint policy for the web app. The default value is `STANDARD`.

            If you are creating the web app in an Amazon Web Services GovCloud (US) Region, you can set this parameter to `FIPS`.
        web-app-units: A union that contains the value for number of concurrent connections or the user sessions on your web app.
