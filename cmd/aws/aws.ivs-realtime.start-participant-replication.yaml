name: start-participant-replication
description: Starts replicating a publishing participant from a source stage to a destination stage.
flags:
    --attributes=: Application-provided attributes to set on the replicated participant in the destination stage.
    --destination-stage-arn=!: ARN of the stage to which the participant will be replicated.
    --participant-id=!: Participant ID of the publisher that will be replicated.
    --reconnect-window-seconds=: If the participant disconnects and then reconnects within the specified interval, replication will continue to be `ACTIVE`.
    --source-stage-arn=!: ARN of the stage where the participant is publishing.
documentation:
    command: Starts replicating a publishing participant from a source stage to a destination stage.
    flag:
        attributes: |-
            Application-provided attributes to set on the replicated participant in the destination stage. Map keys and values can contain UTF-8 encoded text. The maximum length of this field is 1 KB total. *This field is exposed to all stage participants and should not be used for personally identifying, confidential, or sensitive information.*

            These attributes are merged with any attributes set for this participant when creating the token. If there is overlap in keys, the values in these attributes are replaced.
        destination-stage-arn: ARN of the stage to which the participant will be replicated.
        participant-id: Participant ID of the publisher that will be replicated. This is assigned by IVS and returned by [CreateParticipantToken]() or the `jti` (JWT ID) used to [create a self signed token](https://docs.aws.amazon.com/ivs/latest/RealTimeUserGuide/getting-started-distribute-tokens.html#getting-started-distribute-tokens-self-signed).
        reconnect-window-seconds: 'If the participant disconnects and then reconnects within the specified interval, replication will continue to be `ACTIVE`. Default: 0.'
        source-stage-arn: ARN of the stage where the participant is publishing.
