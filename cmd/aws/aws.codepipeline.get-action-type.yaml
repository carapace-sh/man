name: get-action-type
description: Returns information about an action type created for an external provider, where the action is to be used by customers of the external provider.
flags:
    --category=!: Defines what kind of action can be taken in the stage.
    --owner=!: The creator of an action type that was created with any supported integration model.
    --provider=!: The provider of the action type being called.
    --version=!: A string that describes the action type version.
completion:
    flag:
        category:
            - Source
            - Build
            - Deploy
            - Test
            - Invoke
            - Approval
            - Compute
documentation:
    command: Returns information about an action type created for an external provider, where the action is to be used by customers of the external provider. The action can be created with any supported integration model.
    flag:
        category: |-
            Defines what kind of action can be taken in the stage. The following are the valid values:

            - `Source`
            - `Build`
            - `Test`
            - `Deploy`
            - `Approval`
            - `Invoke`
            - `Compute`
        owner: 'The creator of an action type that was created with any supported integration model. There are two valid values: `AWS` and `ThirdParty`.'
        provider: The provider of the action type being called. The provider name is specified when the action type is created.
        version: A string that describes the action type version.
