name: update-dynamic-thing-group
description: Updates a dynamic thing group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --expected-version=: The expected version of the dynamic thing group to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --index-name=: The dynamic thing group index to update.
    --query-string=: The dynamic thing group search query string to update.
    --query-version=: The dynamic thing group query version to update.
    --thing-group-name=!: The name of the dynamic thing group to update.
    --thing-group-properties=!: The dynamic thing group properties to update.
documentation:
    command: |-
        Updates a dynamic thing group.

        Requires permission to access the [UpdateDynamicThingGroup](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        expected-version: The expected version of the dynamic thing group to update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        index-name: |-
            The dynamic thing group index to update.

            Currently one index is supported: `AWS_Things`.
        query-string: The dynamic thing group search query string to update.
        query-version: |-
            The dynamic thing group query version to update.

            Currently one query version is supported: "2017-09-30". If not specified, the query version defaults to this value.
        thing-group-name: The name of the dynamic thing group to update.
        thing-group-properties: The dynamic thing group properties to update.
