name: stop-labeling-job
description: Stops a running labeling job.
flags:
    --labeling-job-name=!: The name of the labeling job to stop.
documentation:
    command: Stops a running labeling job. A job that is stopped cannot be restarted. Any results obtained before the job is stopped are placed in the Amazon S3 output bucket.
    flag:
        labeling-job-name: The name of the labeling job to stop.
