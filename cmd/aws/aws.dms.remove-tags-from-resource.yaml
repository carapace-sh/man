name: remove-tags-from-resource
description: Removes metadata tags from an DMS resource, including replication instance, endpoint, subnet group, and migration task.
flags:
    --resource-arn=!: An DMS resource from which you want to remove tag(s).
    --tag-keys=!: The tag key (name) of the tag to be removed.
documentation:
    command: Removes metadata tags from an DMS resource, including replication instance, endpoint, subnet group, and migration task. For more information, see [`Tag`](https://docs.aws.amazon.com/dms/latest/APIReference/API_Tag.html) data type description.
    flag:
        resource-arn: An DMS resource from which you want to remove tag(s). The value for this parameter is an Amazon Resource Name (ARN).
        tag-keys: The tag key (name) of the tag to be removed.
