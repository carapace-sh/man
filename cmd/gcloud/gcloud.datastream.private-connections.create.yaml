name: create
description: Create a Datastream private connection.
flags:
    --display-name=!: Friendly name for the private connection.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The Cloud location for the private_connection.
    --network-attachment=!: Full URI of the network attachment that datastream will connect to.For example, this would be of the form:`network-attachment=projects/test-project/regions/us-central1/networkAttachments/my-na`
    --no-validate-only&: If set, the request will retrieve the project id to allow in the  network attachment Datastream will connect to.
    --subnet=!: A free subnet for peering.
    --validate-only: If set, the request will retrieve the project id to allow in the  network attachment Datastream will connect to.
    --vpc=!: ID of the vpc or fully qualified identifier for the vpc.
documentation:
    command: Create a Datastream private connection
    flag:
        display-name: Friendly name for the private connection.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The Cloud location for the private_connection.
            +
            To set the `location` attribute:
            * provide the argument `private_connection` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        network-attachment: Full URI of the network attachment that datastream will connect to.For example, this would be of the form:`network-attachment=projects/test-project/regions/us-central1/networkAttachments/my-na`
        no-validate-only: If set, the request will retrieve the project id to allow in the  network attachment Datastream will connect to.
        subnet: A free subnet for peering. (CIDR of /29).
        validate-only: If set, the request will retrieve the project id to allow in the  network attachment Datastream will connect to.
        vpc: |-
            ID of the vpc or fully qualified identifier for the vpc.
            +
            To set the `vpc` attribute:
            * provide the argument `--vpc` on the command line.
