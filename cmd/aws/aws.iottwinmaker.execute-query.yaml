name: execute-query
description: Run queries to access information from your knowledge graph of entities within individual workspaces.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The string that specifies the next page of results.
    --query-statement=!: The query statement.
    --workspace-id=!: The ID of the workspace.
documentation:
    command: |-
        Run queries to access information from your knowledge graph of entities within individual workspaces.

        The ExecuteQuery action only works with [Amazon Web Services Java SDK2](https://docs.aws.amazon.com/sdk-for-java/latest/developer-guide/home.html). ExecuteQuery will not work with any Amazon Web Services Java SDK version &lt; 2.x.
    flag:
        max-results: The maximum number of results to return at one time. The default is 50.
        next-token: The string that specifies the next page of results.
        query-statement: The query statement.
        workspace-id: The ID of the workspace.
