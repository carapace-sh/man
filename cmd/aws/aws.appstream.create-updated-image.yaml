name: create-updated-image
description: Creates a new image with the latest Windows operating system updates, driver updates, and AppStream 2.0 agent software.
flags:
    --dry-run: Indicates whether to display the status of image update availability before AppStream 2.0 initiates the process of creating a new updated image.
    --existing-image-name=!: The name of the image to update.
    --new-image-description=: The description to display for the new image.
    --new-image-display-name=: The name to display for the new image.
    --new-image-name=!: The name of the new image.
    --new-image-tags=: The tags to associate with the new image.
    --no-dry-run: Indicates whether to display the status of image update availability before AppStream 2.0 initiates the process of creating a new updated image.
documentation:
    command: |-
        Creates a new image with the latest Windows operating system updates, driver updates, and AppStream 2.0 agent software.

        For more information, see the "Update an Image by Using Managed AppStream 2.0 Image Updates" section in [Administer Your AppStream 2.0 Images](https://docs.aws.amazon.com/appstream2/latest/developerguide/administer-images.html), in the *Amazon AppStream 2.0 Administration Guide*.
    flag:
        dry-run: Indicates whether to display the status of image update availability before AppStream 2.0 initiates the process of creating a new updated image. If this value is set to `true`, AppStream 2.0 displays whether image updates are available. If this value is set to `false`, AppStream 2.0 initiates the process of creating a new updated image without displaying whether image updates are available.
        existing-image-name: The name of the image to update.
        new-image-description: The description to display for the new image.
        new-image-display-name: The name to display for the new image.
        new-image-name: The name of the new image. The name must be unique within the AWS account and Region.
        new-image-tags: |-
            The tags to associate with the new image. A tag is a key-value pair, and the value is optional. For example, Environment=Test. If you do not specify a value, Environment=.

            Generally allowed characters are: letters, numbers, and spaces representable in UTF-8, and the following special characters:

            _ . : / = + \\ - @

            If you do not specify a value, the value is set to an empty string.

            For more information about tags, see [Tagging Your Resources](https://docs.aws.amazon.com/appstream2/latest/developerguide/tagging-basic.html) in the *Amazon AppStream 2.0 Administration Guide*.
