name: get-catalogs
description: Retrieves all catalogs defined in a catalog in the Glue Data Catalog.
flags:
    --include-root=: Whether to list the default catalog in the account and region in the response.
    --max-results=: The maximum number of catalogs to return in one response.
    --next-token=: A continuation token, if this is a continuation call.
    --no-recursive&: Whether to list all catalogs across the catalog hierarchy, starting from the `ParentCatalogId`.
    --parent-catalog-id=: The ID of the parent catalog in which the catalog resides.
    --recursive: Whether to list all catalogs across the catalog hierarchy, starting from the `ParentCatalogId`.
documentation:
    command: Retrieves all catalogs defined in a catalog in the Glue Data Catalog. For a Redshift-federated catalog use case, this operation returns the list of catalogs mapped to Redshift databases in the Redshift namespace catalog.
    flag:
        include-root: |-
            Whether to list the default catalog in the account and region in the response. Defaults to `false`. When `true` and `ParentCatalogId = NULL | Amazon Web Services Account ID`, all catalogs and the default catalog are enumerated in the response.

            When the `ParentCatalogId` is not equal to null, and this attribute is passed as `false` or `true`, an `InvalidInputException` is thrown.
        max-results: The maximum number of catalogs to return in one response.
        next-token: A continuation token, if this is a continuation call.
        parent-catalog-id: The ID of the parent catalog in which the catalog resides. If none is provided, the Amazon Web Services Account Number is used by default.
        recursive: Whether to list all catalogs across the catalog hierarchy, starting from the `ParentCatalogId`. Defaults to `false` . When `true`, all catalog objects in the `ParentCatalogID` hierarchy are enumerated in the response.
