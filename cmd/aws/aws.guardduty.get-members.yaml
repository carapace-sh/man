name: get-members
description: Retrieves GuardDuty member accounts (of the current GuardDuty administrator account) specified by the account IDs.
flags:
    --account-ids=!: A list of account IDs of the GuardDuty member accounts that you want to describe.
    --detector-id=!: The unique ID of the detector of the GuardDuty account whose members you want to retrieve.
documentation:
    command: Retrieves GuardDuty member accounts (of the current GuardDuty administrator account) specified by the account IDs.
    flag:
        account-ids: A list of account IDs of the GuardDuty member accounts that you want to describe.
        detector-id: |-
            The unique ID of the detector of the GuardDuty account whose members you want to retrieve.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
