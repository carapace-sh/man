name: disassociate-capacity-reservation-billing-owner
description: Cancels a pending request to assign billing of the unused capacity of a Capacity Reservation to a consumer account, or revokes a request that has already been accepted.
flags:
    --capacity-reservation-id=!: The ID of the Capacity Reservation.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --unused-reservation-billing-owner-id=!: The ID of the consumer account to which the request was sent.
documentation:
    command: Cancels a pending request to assign billing of the unused capacity of a Capacity Reservation to a consumer account, or revokes a request that has already been accepted. For more information, see [Billing assignment for shared Amazon EC2 Capacity Reservations](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/assign-billing.html).
    flag:
        capacity-reservation-id: The ID of the Capacity Reservation.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        unused-reservation-billing-owner-id: The ID of the consumer account to which the request was sent.
