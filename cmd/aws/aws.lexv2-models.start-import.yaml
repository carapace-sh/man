name: start-import
description: Starts importing a bot, bot locale, or custom vocabulary from a zip archive that you uploaded to an S3 bucket.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --file-password=: The password used to encrypt the zip archive that contains the resource definition.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --import-id=!: The unique identifier for the import.
    --merge-strategy=!: The strategy to use when there is a name conflict between the imported resource and an existing resource.
    --resource-specification=!: Parameters for creating the bot, bot locale or custom vocabulary.
completion:
    flag:
        merge-strategy:
            - Overwrite
            - FailOnConflict
            - Append
documentation:
    command: Starts importing a bot, bot locale, or custom vocabulary from a zip archive that you uploaded to an S3 bucket.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        file-password: The password used to encrypt the zip archive that contains the resource definition. You should always encrypt the zip archive to protect it during transit between your site and Amazon Lex.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        import-id: The unique identifier for the import. It is included in the response from the [CreateUploadUrl](https://docs.aws.amazon.com/lexv2/latest/APIReference/API_CreateUploadUrl.html) operation.
        merge-strategy: The strategy to use when there is a name conflict between the imported resource and an existing resource. When the merge strategy is `FailOnConflict` existing resources are not overwritten and the import fails.
        resource-specification: Parameters for creating the bot, bot locale or custom vocabulary.
