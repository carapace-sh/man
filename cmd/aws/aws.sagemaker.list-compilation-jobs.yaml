name: list-compilation-jobs
description: Lists model compilation jobs that satisfy various filters.
flags:
    --creation-time-after=: A filter that returns the model compilation jobs that were created after a specified time.
    --creation-time-before=: A filter that returns the model compilation jobs that were created before a specified time.
    --last-modified-time-after=: A filter that returns the model compilation jobs that were modified after a specified time.
    --last-modified-time-before=: A filter that returns the model compilation jobs that were modified before a specified time.
    --max-results=: The maximum number of model compilation jobs to return in the response.
    --name-contains=: A filter that returns the model compilation jobs whose name contains a specified string.
    --next-token=: If the result of the previous `ListCompilationJobs` request was truncated, the response includes a `NextToken`.
    --sort-by=: The field by which to sort results.
    --sort-order=: The sort order for results.
    --status-equals=: A filter that retrieves model compilation jobs with a specific `CompilationJobStatus` status.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
            - Status
        sort-order:
            - Ascending
            - Descending
        status-equals:
            - INPROGRESS
            - COMPLETED
            - FAILED
            - STARTING
            - STOPPING
            - STOPPED
documentation:
    command: |-
        Lists model compilation jobs that satisfy various filters.

        To create a model compilation job, use [CreateCompilationJob](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateCompilationJob.html). To get information about a particular model compilation job you have created, use [DescribeCompilationJob](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_DescribeCompilationJob.html).
    flag:
        creation-time-after: A filter that returns the model compilation jobs that were created after a specified time.
        creation-time-before: A filter that returns the model compilation jobs that were created before a specified time.
        last-modified-time-after: A filter that returns the model compilation jobs that were modified after a specified time.
        last-modified-time-before: A filter that returns the model compilation jobs that were modified before a specified time.
        max-results: The maximum number of model compilation jobs to return in the response.
        name-contains: A filter that returns the model compilation jobs whose name contains a specified string.
        next-token: If the result of the previous `ListCompilationJobs` request was truncated, the response includes a `NextToken`. To retrieve the next set of model compilation jobs, use the token in the next request.
        sort-by: The field by which to sort results. The default is `CreationTime`.
        sort-order: The sort order for results. The default is `Ascending`.
        status-equals: A filter that retrieves model compilation jobs with a specific `CompilationJobStatus` status.
