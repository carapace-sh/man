name: get-unfiltered-table-metadata
description: Allows a third-party analytical engine to retrieve unfiltered table metadata from the Data Catalog.
flags:
    --audit-context=: A structure containing Lake Formation audit context information.
    --catalog-id=!: The catalog ID where the table resides.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --database-name=!: (Required) Specifies the name of a database that contains the table.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: (Required) Specifies the name of a table for which you are requesting metadata.
    --parent-resource-arn=: The resource ARN of the view.
    --permissions=: The Lake Formation data permissions of the caller on the table.
    --query-session-context=: A structure used as a protocol between query engines and Lake Formation or Glue.
    --resource-region=: Specified only if the base tables belong to a different Amazon Web Services Region.
    --root-resource-arn=: The resource ARN of the root view in a chain of nested views.
    --supported-dialect=: A structure specifying the dialect and dialect version used by the query engine.
    --supported-permission-types=!: Indicates the level of filtering a third-party analytical engine is capable of enforcing when calling the `GetUnfilteredTableMetadata` API operation.
documentation:
    command: |-
        Allows a third-party analytical engine to retrieve unfiltered table metadata from the Data Catalog.

        For IAM authorization, the public IAM action associated with this API is `glue:GetTable`.
    flag:
        audit-context: A structure containing Lake Formation audit context information.
        catalog-id: The catalog ID where the table resides.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        database-name: (Required) Specifies the name of a database that contains the table.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: (Required) Specifies the name of a table for which you are requesting metadata.
        parent-resource-arn: The resource ARN of the view.
        permissions: The Lake Formation data permissions of the caller on the table. Used to authorize the call when no view context is found.
        query-session-context: A structure used as a protocol between query engines and Lake Formation or Glue. Contains both a Lake Formation generated authorization identifier and information from the request's authorization context.
        resource-region: Specified only if the base tables belong to a different Amazon Web Services Region.
        root-resource-arn: The resource ARN of the root view in a chain of nested views.
        supported-dialect: A structure specifying the dialect and dialect version used by the query engine.
        supported-permission-types: |-
            Indicates the level of filtering a third-party analytical engine is capable of enforcing when calling the `GetUnfilteredTableMetadata` API operation. Accepted values are:

            - `COLUMN_PERMISSION` - Column permissions ensure that users can access only specific columns in the table. If there are particular columns contain sensitive data, data lake administrators can define column filters that exclude access to specific columns.
            - `CELL_FILTER_PERMISSION` - Cell-level filtering combines column filtering (include or exclude columns) and row filter expressions to restrict access to individual elements in the table.
            - `NESTED_PERMISSION` - Nested permissions combines cell-level filtering and nested column filtering to restrict access to columns and/or nested columns in specific rows based on row filter expressions.
            - `NESTED_CELL_PERMISSION` - Nested cell permissions combines nested permission with nested cell-level filtering. This allows different subsets of nested columns to be restricted based on an array of row filter expressions.

            Note: Each of these permission types follows a hierarchical order where each subsequent permission type includes all permission of the previous type.

            Important: If you provide a supported permission type that doesn't match the user's level of permissions on the table, then Lake Formation raises an exception. For example, if the third-party engine calling the `GetUnfilteredTableMetadata` operation can enforce only column-level filtering, and the user has nested cell filtering applied on the table, Lake Formation throws an exception, and will not return unfiltered table metadata and data access credentials.
