name: create
description: '*(ALPHA)*  create a reference image.'
flags:
    --bounding-polygon=: Bounding polygon around the areas of interest in the reference image.
    --location=: The location of reference image.
    --product=: The ID of product.
    --storage-location=!: The Google Cloud Storage URI of the reference image.
documentation:
    command: '*(ALPHA)*  create a reference image.'
    flag:
        bounding-polygon: |-
            Bounding polygon around the areas of interest in the reference image.
            If this field is empty, the system will try to detect regions of interest.
            This flag is repeatable to specify multiple bounding polygons. At most 10
            bounding polygons will be used.
            +
            A bounding polygon can be specified by a list of vertices or normalized
            vertices or both. A vertex (x, y) represents a 2D point in the image. x, y
            are integers and are in the same scale as the original image.
            The normalized vertex coordinates are relative to original image and
            range from 0 to 1.
            +
            Because of the complexity of this flag, it should be specified
            with the `--flags-file`. See $ gcloud topic flags-file for details.
            See the examples section for how to use `--bounding-polygon` in
            `--flags-file`.
        location: |-
            The location of reference image.
            +
            To set the `location` attribute:
            * provide the argument `reference_image` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        product: |-
            The ID of product.
            +
            To set the `product` attribute:
            * provide the argument `reference_image` on the command line with a fully specified name;
            * provide the argument `--product` on the command line.
        storage-location: The Google Cloud Storage URI of the reference image. The URI must start with 'gs://'.
