name: get-folder
description: Returns the contents of a specified folder in a repository.
flags:
    --commit-specifier=: A fully qualified reference used to identify a commit that contains the version of the folder's content to return.
    --folder-path=!: The fully qualified path to the folder whose contents are returned, including the folder name.
    --repository-name=!: The name of the repository.
documentation:
    command: Returns the contents of a specified folder in a repository.
    flag:
        commit-specifier: A fully qualified reference used to identify a commit that contains the version of the folder's content to return. A fully qualified reference can be a commit ID, branch name, tag, or reference such as HEAD. If no specifier is provided, the folder content is returned as it exists in the HEAD commit.
        folder-path: The fully qualified path to the folder whose contents are returned, including the folder name. For example, /examples is a fully-qualified path to a folder named examples that was created off of the root directory (/) of a repository.
        repository-name: The name of the repository.
