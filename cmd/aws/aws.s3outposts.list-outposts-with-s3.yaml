name: list-outposts-with-s3
description: Lists the Outposts with S3 on Outposts capacity for your Amazon Web Services account.
flags:
    --max-results=: The maximum number of Outposts to return.
    --next-token=: When you can get additional results from the `ListOutpostsWithS3` call, a `NextToken` parameter is returned in the output.
documentation:
    command: Lists the Outposts with S3 on Outposts capacity for your Amazon Web Services account. Includes S3 on Outposts that you have access to as the Outposts owner, or as a shared user from Resource Access Manager (RAM).
    flag:
        max-results: The maximum number of Outposts to return. The limit is 100.
        next-token: When you can get additional results from the `ListOutpostsWithS3` call, a `NextToken` parameter is returned in the output. You can then pass in a subsequent command to the `NextToken` parameter to continue listing additional Outposts.
