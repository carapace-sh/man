name: create-integration
description: Creates a zero-ETL integration or S3 event integration with Amazon Redshift.
flags:
    --additional-encryption-context=: An optional set of non-secret key–value pairs that contains additional contextual information about the data.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the integration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --integration-name=!: The name of the integration.
    --kms-key-id=: An Key Management Service (KMS) key identifier for the key to use to encrypt the integration.
    --source-arn=!: The Amazon Resource Name (ARN) of the database to use as the source for replication.
    --tag-list=:
        description: A list of tags.
        nargs: -1
    --target-arn=!: The Amazon Resource Name (ARN) of the Amazon Redshift data warehouse to use as the target for replication.
documentation:
    command: Creates a zero-ETL integration or S3 event integration with Amazon Redshift.
    flag:
        additional-encryption-context: |-
            An optional set of non-secret key–value pairs that contains additional contextual information about the data. For more information, see [Encryption context](https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#encrypt_context) in the *Amazon Web Services Key Management Service Developer Guide*.

            You can only include this parameter if you specify the `KMSKeyId` parameter.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the integration.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        integration-name: The name of the integration.
        kms-key-id: An Key Management Service (KMS) key identifier for the key to use to encrypt the integration. If you don't specify an encryption key, the default Amazon Web Services owned key is used.
        source-arn: The Amazon Resource Name (ARN) of the database to use as the source for replication.
        tag-list: A list of tags.
        target-arn: The Amazon Resource Name (ARN) of the Amazon Redshift data warehouse to use as the target for replication.
