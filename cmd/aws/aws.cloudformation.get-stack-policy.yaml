name: get-stack-policy
description: Returns the stack policy for a specified stack.
flags:
    --stack-name=!: The name or unique stack ID that's associated with the stack whose policy you want to get.
documentation:
    command: Returns the stack policy for a specified stack. If a stack doesn't have a policy, a null value is returned.
    flag:
        stack-name: The name or unique stack ID that's associated with the stack whose policy you want to get.
