name: delete-target-group
description: Deletes a target group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --target-group-identifier=!: The ID or ARN of the target group.
documentation:
    command: Deletes a target group. You can't delete a target group if it is used in a listener rule or if the target group creation is in progress.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
