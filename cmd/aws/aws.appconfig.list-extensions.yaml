name: list-extensions
description: Lists all custom and Amazon Web Services authored AppConfig extensions in the account.
flags:
    --max-results=: The maximum number of items to return for this call.
    --name=: The extension name.
    --next-token=: A token to start the list.
documentation:
    command: Lists all custom and Amazon Web Services authored AppConfig extensions in the account. For more information about extensions, see [Extending workflows](https://docs.aws.amazon.com/appconfig/latest/userguide/working-with-appconfig-extensions.html) in the *AppConfig User Guide*.
    flag:
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        name: The extension name.
        next-token: A token to start the list. Use this token to get the next set of results.
