name: list-memories
description: Lists the available Amazon Bedrock AgentCore Memory resources in the current Amazon Web Services Region.
flags:
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token for the next set of results.
documentation:
    command: Lists the available Amazon Bedrock AgentCore Memory resources in the current Amazon Web Services Region.
    flag:
        max-results: The maximum number of results to return in a single call. The default value is 10. The maximum value is 50.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
