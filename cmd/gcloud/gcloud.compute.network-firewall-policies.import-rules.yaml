name: import-rules
description: Import a Compute Engine network firewall policy rules.
flags:
    --global: If set, the firewall policy is global.
    --no-global&: If set, the firewall policy is global.
    --region=: Region of the firewall policy to import-rules.
    --source=: Path to a YAML file containing configuration export data.
documentation:
    command: |
        Imports Firewall Policy rules configuration from a file.
    flag:
        global: If set, the firewall policy is global.
        no-global: If set, the firewall policy is global.
        region: Region of the firewall policy to import-rules. Overrides the default *compute/region* property value for this command invocation.
        source: |-
            Path to a YAML file containing configuration export data.
                      Alternatively, you may omit this flag to read from standard input.For a schema describing the export/import format, see:
                      $CLOUDSDKROOT/lib/googlecloudsdk/schemas/compute/v1/FirewallPolicy.yaml.
            +

                  Note: $CLOUDSDKROOT represents the Google Cloud CLI's installation directory.
