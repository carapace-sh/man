name: describe
description: Describe a Compute Engine machine type.
flags:
    --zone=: Zone of the machine type to describe.
documentation:
    command: |-
        *gcloud compute machine-types describe* displays all data associated with a Compute Engine
        machine type.

        ## EXAMPLES
        To describe a machine type 'MACHINE-TYPE' in zone 'us-central1-f', run:

          $ gcloud compute machine-types describe MACHINE-TYPE --zone=us-central1-f
    flag:
        zone: |-
            Zone of the machine type to describe. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
