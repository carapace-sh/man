name: create
description: '*(BETA)*  Create a certificate.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --certificate-file=!: Certificate data in PEM-encoded form.
    --description=: Human-readable description of the resource.
    --dns-authorizations=: Name(s) of the DNS authorizations for each listed domain.
    --domains=!: Public domain name(s) to create a certificate for.
    --issuance-config=: Name of the Certificate Issuance Config to use for issuance.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Certificate Manager location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --private-key-file=!: Private key data in PEM-encoded form.
    --scope=: Scope of the managed certificate.
    --tags=&: List of tag KEY=VALUE pairs to add.
completion:
    flag:
        scope:
            - all-regions
            - client-auth
            - default
            - edge-cache
documentation:
    command: |
        *(BETA)*  Create a new certificate.

        * Managed certificates can be created by supplying one or more domain names
          and an (optional) list of DNS authorizations for those domain names.
        * Self-managed certificates can be created by uploading a certificate
          and its corresponding private key (both in PEM format).
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        certificate-file: Certificate data in PEM-encoded form. Use a full or relative path to a local file containing the value of certificate_file.
        description: Human-readable description of the resource.
        dns-authorizations: |-
            Name(s) of the DNS authorizations for each listed domain.
            +
            Note that each domain requires a matching authorization, and any domain that
            fails authorization will prevent issuance and/or renewal of the certificate.
            +
            To reference multiple DNS authorizations, provide a list of comma separated DNS
            authorization resource names or URLs. For example:
            +
             $ {command} --dns-authorizations=api-example-com,www-example-com
        domains: |-
            Public domain name(s) to create a certificate for.
            +
            * If a DNS authorization is provided for the domain, the certificate will be
            validated against the DNS record you added as part of the authorization flow.
            * If no DNS authorization is provided, Certificate Manager will attempt to validate
            the domain against the serving endpoint directly.
            +
            You may list multiple, comma-separated domain names to include multiple
            names as Subject Alternative Names on the issued certificate.
        issuance-config: Name of the Certificate Issuance Config to use for issuance.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Certificate Manager location.
            +
            To set the `location` attribute:
            * provide the argument `certificate` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * default value of location is [global].
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        private-key-file: Private key data in PEM-encoded form. Use a full or relative path to a local file containing the value of private_key_file.
        scope: |-
            Scope of the managed certificate. This determines which services the certificate can
            be attached to/associated with. Defaults to `DEFAULT`. _SCOPE_ must be one of:
            +
            *all-regions*::: Certificates with scope ALL_REGIONS are currently used for
            Cross-region Internal Application Load Balancer only.
            +
            *client-auth*::: Certificates with scope CLIENT_AUTH are used for client authentication.
            +
            *default*::: Certificates with DEFAULT scope are used for Load Balancing and Cloud CDN.
            +
            If unsure, choose this option.
            +
            *edge-cache*::: Certificates with scope EDGE_CACHE are special-purposed certificates,
            scoped for use with Media Edge services only.
            +
            :::
            +
        tags: |
            List of tag KEY=VALUE pairs to add.
