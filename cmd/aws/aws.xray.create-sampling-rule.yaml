name: create-sampling-rule
description: Creates a rule to control sampling behavior for instrumented applications.
flags:
    --sampling-rule=!: The rule definition.
    --tags=: A map that contains one or more tag keys and tag values to attach to an X-Ray sampling rule.
documentation:
    command: Creates a rule to control sampling behavior for instrumented applications. Services retrieve rules with [GetSamplingRules](https://docs.aws.amazon.com/xray/latest/api/API_GetSamplingRules.html), and evaluate each rule in ascending order of *priority* for each request. If a rule matches, the service records a trace, borrowing it from the reservoir size. After 10 seconds, the service reports back to X-Ray with [GetSamplingTargets](https://docs.aws.amazon.com/xray/latest/api/API_GetSamplingTargets.html) to get updated versions of each in-use rule. The updated rule contains a trace quota that the service can use instead of borrowing from the reservoir.
    flag:
        sampling-rule: The rule definition.
        tags: |-
            A map that contains one or more tag keys and tag values to attach to an X-Ray sampling rule. For more information about ways to use tags, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html) in the *Amazon Web Services General Reference*.

            The following restrictions apply to tags:

            - Maximum number of user-applied tags per resource: 50
            - Maximum tag key length: 128 Unicode characters
            - Maximum tag value length: 256 Unicode characters
            - Valid values for key and value: a-z, A-Z, 0-9, space, and the following characters: _ . : / = + - and @
            - Tag keys and values are case sensitive.
            - Don't use `aws:` as a prefix for keys; it's reserved for Amazon Web Services use.
