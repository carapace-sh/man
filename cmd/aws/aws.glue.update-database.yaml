name: update-database
description: Updates an existing database definition in a Data Catalog.
flags:
    --catalog-id=: The ID of the Data Catalog in which the metadata database resides.
    --database-input=!: A `DatabaseInput` object specifying the new definition of the metadata database in the catalog.
    --name=!: The name of the database to update in the catalog.
documentation:
    command: Updates an existing database definition in a Data Catalog.
    flag:
        catalog-id: The ID of the Data Catalog in which the metadata database resides. If none is provided, the Amazon Web Services account ID is used by default.
        database-input: A `DatabaseInput` object specifying the new definition of the metadata database in the catalog.
        name: The name of the database to update in the catalog. For Hive compatibility, this is folded to lowercase.
