name: list-servers
description: Returns a list of all the servers.
flags:
    --filter-value=: Specifies the filter value, which is based on the type of server criteria.
    --group-id-filter=: Specifies the group ID to filter on.
    --max-results=: The maximum number of items to include in the response.
    --next-token=: The token from a previous call that you use to retrieve the next set of results.
    --server-criteria=: Criteria for filtering servers.
    --sort=: Specifies whether to sort by ascending (`ASC`) or descending (`DESC`) order.
completion:
    flag:
        server-criteria:
            - NOT_DEFINED
            - OS_NAME
            - STRATEGY
            - DESTINATION
            - SERVER_ID
            - ANALYSIS_STATUS
            - ERROR_CATEGORY
        sort:
            - ASC
            - DESC
documentation:
    command: Returns a list of all the servers.
    flag:
        filter-value: Specifies the filter value, which is based on the type of server criteria. For example, if `serverCriteria` is `OS_NAME`, and the `filterValue` is equal to `WindowsServer`, then `ListServers` returns all of the servers matching the OS name `WindowsServer`.
        group-id-filter: Specifies the group ID to filter on.
        max-results: The maximum number of items to include in the response. The maximum value is 100.
        next-token: The token from a previous call that you use to retrieve the next set of results. For example, if a previous call to this action returned 100 items, but you set `maxResults` to 10. You'll receive a set of 10 results along with a token. You then use the returned token to retrieve the next set of 10.
        server-criteria: Criteria for filtering servers.
        sort: Specifies whether to sort by ascending (`ASC`) or descending (`DESC`) order.
