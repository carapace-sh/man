name: delete-repository
description: Deletes a repository.
flags:
    --force=: If true, deleting the repository force deletes the contents of the repository.
    --registry-id=: The Amazon Web Services account ID associated with the registry that contains the repository to delete.
    --repository-name=!: The name of the repository to delete.
documentation:
    command: Deletes a repository. If the repository isn't empty, you must either delete the contents of the repository or use the `force` option to delete the repository and have Amazon ECR delete all of its contents on your behalf.
    flag:
        force: If true, deleting the repository force deletes the contents of the repository. If false, the repository must be empty before attempting to delete it.
        registry-id: The Amazon Web Services account ID associated with the registry that contains the repository to delete. If you do not specify a registry, the default registry is assumed.
        repository-name: The name of the repository to delete.
