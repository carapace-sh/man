name: list-archive-exports
description: Returns a list of email archive export jobs.
flags:
    --archive-id=!: The identifier of the archive.
    --next-token=: If NextToken is returned, there are more results available.
    --page-size=: The maximum number of archive export jobs that are returned per call.
documentation:
    command: Returns a list of email archive export jobs.
    flag:
        archive-id: The identifier of the archive.
        next-token: If NextToken is returned, there are more results available. The value of NextToken is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page.
        page-size: The maximum number of archive export jobs that are returned per call. You can use NextToken to obtain further pages of archives.
