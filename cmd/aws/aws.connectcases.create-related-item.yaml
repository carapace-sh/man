name: create-related-item
description: Creates a related item (comments, tasks, and contacts) and associates it with a case.
flags:
    --case-id=!: A unique identifier of the case.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --content=!: The content of a related item to be created.
    --domain-id=!: The unique identifier of the Cases domain.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --performed-by=: Represents the creator of the related item.
    --type=!: The type of a related item.
completion:
    flag:
        type:
            - Contact
            - Comment
            - File
            - Sla
            - ConnectCase
            - Custom
documentation:
    command: |-
        Creates a related item (comments, tasks, and contacts) and associates it with a case.

        - A Related Item is a resource that is associated with a case. It may or may not have an external identifier linking it to an external resource (for example, a `contactArn`). All Related Items have their own internal identifier, the `relatedItemArn`. Examples of related items include `comments` and `contacts`.
        - If you provide a value for `performedBy.userArn` you must also have [DescribeUser](https://docs.aws.amazon.com/connect/latest/APIReference/API_DescribeUser.html) permission on the ARN of the user that you provide.
        - The `type` field is reserved for internal use only.
    flag:
        case-id: A unique identifier of the case.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
