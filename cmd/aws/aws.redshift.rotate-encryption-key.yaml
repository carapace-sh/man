name: rotate-encryption-key
description: Rotates the encryption keys for a cluster.
flags:
    --cluster-identifier=!: The unique identifier of the cluster that you want to rotate the encryption keys for.
documentation:
    command: Rotates the encryption keys for a cluster.
    flag:
        cluster-identifier: |-
            The unique identifier of the cluster that you want to rotate the encryption keys for.

            Constraints: Must be the name of valid cluster that has encryption enabled.
