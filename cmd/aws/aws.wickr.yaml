        --network-name=!: The name for the new network.
        --no-enable-premium-free-trial: Specifies whether to enable a premium free trial for the network.
      completion:
        flag:
            access-level:
                - STANDARD
                - PREMIUM
      documentation:
        command: Creates a new Wickr network with specified access level and configuration. This operation provisions a new communication network for your organization.
        flag:
            access-level: The access level for the network. Valid values are STANDARD or PREMIUM, which determine the features and capabilities available to network members.
