name: cancel-service-pipeline-deployment
description: Attempts to cancel a service pipeline deployment on an [UpdateServicePipeline]() action, if the deployment is `IN_PROGRESS`.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --service-name=!: The name of the service with the service pipeline deployment to cancel.
documentation:
    command: |-
        Attempts to cancel a service pipeline deployment on an [UpdateServicePipeline]() action, if the deployment is `IN_PROGRESS`. For more information, see [Update a service pipeline](https://docs.aws.amazon.com/proton/latest/userguide/ag-svc-pipeline-update.html) in the *Proton User guide*.

        The following list includes potential cancellation scenarios.

        - If the cancellation attempt succeeds, the resulting deployment state is `CANCELLED`.
        - If the cancellation attempt fails, the resulting deployment state is `FAILED`.
        - If the current [UpdateServicePipeline]() action succeeds before the cancellation attempt starts, the resulting deployment state is `SUCCEEDED` and the cancellation attempt has no effect.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
