name: start-deployment
description: Starts a deployment.
flags:
    --application-id=!: The application ID.
    --configuration-profile-id=!: The configuration profile ID.
    --configuration-version=!: The configuration version to deploy.
    --deployment-strategy-id=!: The deployment strategy ID.
    --description=: A description of the deployment.
    --dynamic-extension-parameters=: A map of dynamic extension parameter names to values to pass to associated extensions with `PRE_START_DEPLOYMENT` actions.
    --environment-id=!: The environment ID.
    --kms-key-identifier=: The KMS key identifier (key ID, key alias, or key ARN).
    --tags=: Metadata to assign to the deployment.
documentation:
    command: Starts a deployment.
    flag:
        application-id: The application ID.
        configuration-profile-id: The configuration profile ID.
        configuration-version: The configuration version to deploy. If deploying an AppConfig hosted configuration version, you can specify either the version number or version label. For all other configurations, you must specify the version number.
        deployment-strategy-id: The deployment strategy ID.
        description: A description of the deployment.
        dynamic-extension-parameters: A map of dynamic extension parameter names to values to pass to associated extensions with `PRE_START_DEPLOYMENT` actions.
        environment-id: The environment ID.
        kms-key-identifier: The KMS key identifier (key ID, key alias, or key ARN). AppConfig uses this ID to encrypt the configuration data using a customer managed key.
        tags: Metadata to assign to the deployment. Tags help organize and categorize your AppConfig resources. Each tag consists of a key and an optional value, both of which you define.
