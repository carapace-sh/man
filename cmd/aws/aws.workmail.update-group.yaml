name: update-group
description: Updates attributes in a group.
flags:
    --group-id=!: The identifier for the group to be updated.
    --hidden-from-global-address-list=: If enabled, the group is hidden from the global address list.
    --organization-id=!: The identifier for the organization under which the group exists.
documentation:
    command: Updates attributes in a group.
    flag:
        group-id: |-
            The identifier for the group to be updated.

            The identifier can accept *GroupId*, *Groupname*, or *email*. The following identity formats are available:

            - Group ID: 12345678-1234-1234-1234-123456789012 or S-1-1-12-1234567890-123456789-123456789-1234
            - Email address: group@domain.tld
            - Group name: group
        hidden-from-global-address-list: If enabled, the group is hidden from the global address list.
        organization-id: The identifier for the organization under which the group exists.
