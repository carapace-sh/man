name: list-environments
description: Lists the Amazon EVS environments in your Amazon Web Services account in the specified Amazon Web Services Region.
flags:
    --max-results=: The maximum number of results to return.
    --next-token=: A unique pagination token for each page.
    --state=: The state of an environment.
documentation:
    command: Lists the Amazon EVS environments in your Amazon Web Services account in the specified Amazon Web Services Region.
    flag:
        max-results: The maximum number of results to return. If you specify `MaxResults` in the request, the response includes information up to the limit specified.
        next-token: A unique pagination token for each page. If `nextToken` is returned, there are more results available. Make the call again using the returned token with all other arguments unchanged to retrieve the next page. Each pagination token expires after 24 hours. Using an expired pagination token will return an *HTTP 400 InvalidToken* error.
        state: The state of an environment. Used to filter response results to return only environments with the specified `environmentState`.
