    --next-token=: The `string that specifies which page of results to return in a paginated response.
    --page-size=: The maximum number of items to include in each page of a paginated response.
documentation:
    command: Retrieves (queries) pre-aggregated data for a standard execution metric that applies to a journey activity.
    flag:
        application-id: The unique identifier for the application. This identifier is displayed as the **Project ID** on the Amazon Pinpoint console.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
