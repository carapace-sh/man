name: list-channel-memberships
description: Lists all channel memberships in a channel.
flags:
    --channel-arn=!: The maximum number of channel memberships that you want returned.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
    --max-results=: The maximum number of channel memberships that you want returned.
    --next-token=: The token passed by previous API calls until all requested channel memberships are returned.
    --sub-channel-id=: The ID of the SubChannel in the request.
    --type=: The membership type of a user, `DEFAULT` or `HIDDEN`.
completion:
    flag:
        type:
            - DEFAULT
            - HIDDEN
documentation:
    command: |-
        Lists all channel memberships in a channel.

        The `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call as the value in the header.

        If you want to list the channels to which a specific app instance user belongs, see the [ListChannelMembershipsForAppInstanceUser](https://docs.aws.amazon.com/chime-sdk/latest/APIReference/API_messaging-chime_ListChannelMembershipsForAppInstanceUser.html) API.
    flag:
        channel-arn: The maximum number of channel memberships that you want returned.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
        max-results: The maximum number of channel memberships that you want returned.
        next-token: The token passed by previous API calls until all requested channel memberships are returned.
        sub-channel-id: |-
            The ID of the SubChannel in the request.

            Only required when listing a user's memberships in a particular sub-channel of an elastic channel.
        type: The membership type of a user, `DEFAULT` or `HIDDEN`. Default members are returned as part of `ListChannelMemberships` if no type is specified. Hidden members are only returned if the type filter in `ListChannelMemberships` equals `HIDDEN`.
