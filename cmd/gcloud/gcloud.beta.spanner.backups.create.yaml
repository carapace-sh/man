name: create
description: '*(BETA)*  Creates a backup of a Cloud Spanner database.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --database=!: ID of the database from which the backup will be created.
    --encryption-type=: The encryption type of the backup.
    --expiration-date=: Expiration time of the backup, must be at least 6 hours and at most 30 days from the time the request is received.
    --instance=: The Cloud Spanner instance for the backup.
    --kms-key=!: ID of the key or fully qualified identifier for the key.
    --kms-keyring=: KMS keyring id of the key.
    --kms-keys=!: IDs of the keys or fully qualified identifiers for the keys.
    --kms-location=: Cloud location for the key.
    --kms-project=: Cloud project id for the key.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --retention-period=: Retention period of the backup relative from now, must be at least 6 hours and at most 30 days.
    --version-time=: The backup will contain an externally consistent copy of the database at the timestamp specified by `--version-time`.
completion:
    flag:
        encryption-type:
            - customer-managed-encryption
            - google-default-encryption
            - use-database-encryption
documentation:
    command: '*(BETA)*  Creates a backup of a Cloud Spanner database.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        database: ID of the database from which the backup will be created.
        encryption-type: |-
            The encryption type of the backup. _ENCRYPTION_TYPE_ must be one of:
            +
            *customer-managed-encryption*::: Use the provided Cloud KMS key for encryption.If this option is selected, kms-key must be set.
            *google-default-encryption*::: Use Google default encryption.
            *use-database-encryption*::: Use the same encryption configuration as the database.
            :::
            +
        expiration-date: Expiration time of the backup, must be at least 6 hours and at most 30 days from the time the request is received. See `$ gcloud topic datetimes` for information on date/time formats.
        instance: |-
            The Cloud Spanner instance for the backup.
            +
            To set the `instance` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
        kms-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key` on the command line.
        kms-keyring: |-
            KMS keyring id of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-keys: |-
            IDs of the keys or fully qualified identifiers for the keys.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-keys` on the command line.
        kms-location: |-
            Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line.
        kms-project: |-
            Cloud project id for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        retention-period: Retention period of the backup relative from now, must be at least 6 hours and at most 30 days. See `$ gcloud topic datetimes` for information on duration formats.
        version-time: The backup will contain an externally consistent copy of the database at the timestamp specified by `--version-time`. If `--version-time` is not specified, the system will use the creation time of the backup.
