name: delete
description: '*(ALPHA)*  Delete a BigQuery Engine for Apache Flink deployment.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: ID of the location of the Apache Flink for BigQuery resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Delete a BigQuery Engine for Apache Flink deployment.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            ID of the location of the Apache Flink for BigQuery resource. See
            https://cloud.google.com/managed-flink/docs/locations for a list of supported
            locations.
            +

            To set the `location` attribute:
            * provide the argument `deployment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
