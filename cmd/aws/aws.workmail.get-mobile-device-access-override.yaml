name: get-mobile-device-access-override
description: Gets the mobile device access override for the given WorkMail organization, user, and device.
flags:
    --device-id=!: The mobile device to which the override applies.
    --organization-id=!: The WorkMail organization to which you want to apply the override.
    --user-id=!: Identifies the WorkMail user for the override.
documentation:
    command: Gets the mobile device access override for the given WorkMail organization, user, and device.
    flag:
        device-id: The mobile device to which the override applies. `DeviceId` is case insensitive.
        organization-id: The WorkMail organization to which you want to apply the override.
        user-id: |-
            Identifies the WorkMail user for the override. Accepts the following types of user identities:

            - User ID: `12345678-1234-1234-1234-123456789012` or `S-1-1-12-1234567890-123456789-123456789-1234`
            - Email address: `user@domain.tld`
            - User name: `user`
