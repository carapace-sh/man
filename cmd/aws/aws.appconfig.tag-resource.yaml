name: tag-resource
description: Assigns metadata to an AppConfig resource.
flags:
    --resource-arn=!: The ARN of the resource for which to retrieve tags.
    --tags=!: The key-value string map.
documentation:
    command: Assigns metadata to an AppConfig resource. Tags help organize and categorize your AppConfig resources. Each tag consists of a key and an optional value, both of which you define. You can specify a maximum of 50 tags for a resource.
    flag:
        resource-arn: The ARN of the resource for which to retrieve tags.
        tags: The key-value string map. The valid character set is \[a-zA-Z+-=.\_:/]. The tag key can be up to 128 characters and must not start with `aws:`. The tag value can be up to 256 characters.
