name: get-database
description: Retrieves the definition of a specified database.
flags:
    --catalog-id=: The ID of the Data Catalog in which the database resides.
    --name=!: The name of the database to retrieve.
documentation:
    command: Retrieves the definition of a specified database.
    flag:
        catalog-id: The ID of the Data Catalog in which the database resides. If none is provided, the Amazon Web Services account ID is used by default.
        name: The name of the database to retrieve. For Hive compatibility, this should be all lowercase.
