name: remove-thing-from-billing-group
description: Removes the given thing from the billing group.
flags:
    --billing-group-arn=: The ARN of the billing group.
    --billing-group-name=: The name of the billing group.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --thing-arn=: The ARN of the thing to be removed from the billing group.
    --thing-name=: The name of the thing to be removed from the billing group.
documentation:
    command: |-
        Removes the given thing from the billing group.

        Requires permission to access the [RemoveThingFromBillingGroup](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.

        This call is asynchronous. It might take several seconds for the detachment to propagate.
    flag:
        billing-group-arn: The ARN of the billing group.
        billing-group-name: The name of the billing group.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
