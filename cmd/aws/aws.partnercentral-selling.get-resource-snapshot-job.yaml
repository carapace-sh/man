name: get-resource-snapshot-job
description: Use this action to retrieves information about a specific resource snapshot job.
flags:
    --catalog=!: Specifies the catalog related to the request.
    --resource-snapshot-job-identifier=!: The unique identifier of the resource snapshot job to be retrieved.
documentation:
    command: Use this action to retrieves information about a specific resource snapshot job.
    flag:
        catalog: |-
            Specifies the catalog related to the request. Valid values are:

            - AWS: Retrieves the snapshot job from the production AWS environment.
            - Sandbox: Retrieves the snapshot job from a sandbox environment used for testing or development purposes.
        resource-snapshot-job-identifier: The unique identifier of the resource snapshot job to be retrieved. This identifier is crucial for pinpointing the specific job you want to query.
