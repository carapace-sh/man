name: create-environment-template
description: Create an environment template for Proton.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the environment template.
    --display-name=: The environment template name as displayed in the developer interface.
    --encryption-key=: A customer provided encryption key that Proton uses to encrypt data.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the environment template.
    --provisioning=: When included, indicates that the environment template is for customer provisioned and managed infrastructure.
    --tags=: An optional list of metadata items that you can associate with the Proton environment template.
completion:
    flag:
        provisioning:
            - CUSTOMER_MANAGED
documentation:
    command: |-
        Create an environment template for Proton. For more information, see [Environment Templates](https://docs.aws.amazon.com/proton/latest/userguide/ag-templates.html) in the *Proton User Guide*.

        You can create an environment template in one of the two following ways:

        - Register and publish a *standard* environment template that instructs Proton to deploy and manage environment infrastructure.
        - Register and publish a *customer managed* environment template that connects Proton to your existing provisioned infrastructure that you manage. Proton *doesn't* manage your existing provisioned infrastructure. To create an environment template for customer provisioned and managed infrastructure, include the `provisioning` parameter and set the value to `CUSTOMER_MANAGED`. For more information, see [Register and publish an environment template](https://docs.aws.amazon.com/proton/latest/userguide/template-create.html) in the *Proton User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the environment template.
        display-name: The environment template name as displayed in the developer interface.
        encryption-key: A customer provided encryption key that Proton uses to encrypt data.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the environment template.
        provisioning: When included, indicates that the environment template is for customer provisioned and managed infrastructure.
        tags: |-
            An optional list of metadata items that you can associate with the Proton environment template. A tag is a key-value pair.

            For more information, see [Proton resources and tagging](https://docs.aws.amazon.com/proton/latest/userguide/resources.html) in the *Proton User Guide*.
