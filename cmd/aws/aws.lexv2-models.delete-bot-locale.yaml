name: delete-bot-locale
description: Removes a locale from a bot.
flags:
    --bot-id=!: The unique identifier of the bot that contains the locale.
    --bot-version=!: The version of the bot that contains the locale.
    --locale-id=!: The identifier of the language and locale that will be deleted.
documentation:
    command: |-
        Removes a locale from a bot.

        When you delete a locale, all intents, slots, and slot types defined for the locale are also deleted.
    flag:
        bot-id: The unique identifier of the bot that contains the locale.
        bot-version: The version of the bot that contains the locale.
        locale-id: The identifier of the language and locale that will be deleted. The string must match one of the supported locales. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
