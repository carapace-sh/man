name: describe-network-interface-permissions
description: Describes the permissions for your network interfaces.
flags:
    --filters=: One or more filters.
    --max-results=: The maximum number of items to return for this request.
    --network-interface-permission-ids=: The network interface permission IDs.
    --next-token=: The token returned from a previous paginated request.
documentation:
    command: Describes the permissions for your network interfaces.
    flag:
        filters: |-
            One or more filters.

            - `network-interface-permission.network-interface-permission-id` - The ID of the permission.
            - `network-interface-permission.network-interface-id` - The ID of the network interface.
            - `network-interface-permission.aws-account-id` - The Amazon Web Services account ID.
            - `network-interface-permission.aws-service` - The Amazon Web Services service.
            - `network-interface-permission.permission` - The type of permission (`INSTANCE-ATTACH` | `EIP-ASSOCIATE`).
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. If this parameter is not specified, up to 50 results are returned by default. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        network-interface-permission-ids: The network interface permission IDs.
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
