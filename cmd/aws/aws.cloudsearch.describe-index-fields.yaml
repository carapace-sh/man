name: describe-index-fields
description: Gets information about the index fields configured for the search domain.
flags:
    --deployed: Whether to display the deployed configuration (`true`) or include any pending changes (`false`).
    --domain-name=!: The name of the domain you want to describe.
    --field-names=: A list of the index fields you want to describe.
    --no-deployed&: Whether to display the deployed configuration (`true`) or include any pending changes (`false`).
documentation:
    command: Gets information about the index fields configured for the search domain. Can be limited to specific fields by name. By default, shows all fields and includes any pending changes to the configuration. Set the `Deployed` option to `true` to show the active configuration and exclude pending changes. For more information, see [Getting Domain Information](http://docs.aws.amazon.com/cloudsearch/latest/developerguide/getting-domain-info.html) in the *Amazon CloudSearch Developer Guide*.
    flag:
        deployed: Whether to display the deployed configuration (`true`) or include any pending changes (`false`). Defaults to `false`.
        domain-name: The name of the domain you want to describe.
        field-names: A list of the index fields you want to describe. If not specified, information is returned for all configured index fields.
