    --tags=: The tags to add to the connectorV2 when you create.
documentation:
    command: Grants permission to create a connectorV2 based on input parameters. This API is in preview release and subject to change.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
