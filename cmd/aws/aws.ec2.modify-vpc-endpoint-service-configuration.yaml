name: modify-vpc-endpoint-service-configuration
description: Modifies the attributes of the specified VPC endpoint service configuration.
flags:
    --acceptance-required: Indicates whether requests to create an endpoint to the service must be accepted.
    --add-gateway-load-balancer-arns=:
        description: The Amazon Resource Names (ARNs) of Gateway Load Balancers to add to the service configuration.
        nargs: -1
    --add-network-load-balancer-arns=:
        description: The Amazon Resource Names (ARNs) of Network Load Balancers to add to the service configuration.
        nargs: -1
    --add-supported-ip-address-types=:
        description: The IP address types to add to the service configuration.
        nargs: -1
    --add-supported-regions=:
        description: The supported Regions to add to the service configuration.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-acceptance-required: Indicates whether requests to create an endpoint to the service must be accepted.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-remove-private-dns-name: (Interface endpoint configuration) Removes the private DNS name of the endpoint service.
    --private-dns-name=: (Interface endpoint configuration) The private DNS name to assign to the endpoint service.
    --remove-gateway-load-balancer-arns=:
        description: The Amazon Resource Names (ARNs) of Gateway Load Balancers to remove from the service configuration.
        nargs: -1
    --remove-network-load-balancer-arns=:
        description: The Amazon Resource Names (ARNs) of Network Load Balancers to remove from the service configuration.
        nargs: -1
    --remove-private-dns-name: (Interface endpoint configuration) Removes the private DNS name of the endpoint service.
    --remove-supported-ip-address-types=:
        description: The IP address types to remove from the service configuration.
        nargs: -1
    --remove-supported-regions=:
        description: The supported Regions to remove from the service configuration.
        nargs: -1
    --service-id=!: The ID of the service.
documentation:
    command: |-
        Modifies the attributes of the specified VPC endpoint service configuration.

        If you set or modify the private DNS name, you must prove that you own the private DNS domain name.
    flag:
        acceptance-required: Indicates whether requests to create an endpoint to the service must be accepted.
        add-gateway-load-balancer-arns: The Amazon Resource Names (ARNs) of Gateway Load Balancers to add to the service configuration.
        add-network-load-balancer-arns: The Amazon Resource Names (ARNs) of Network Load Balancers to add to the service configuration.
        add-supported-ip-address-types: The IP address types to add to the service configuration.
        add-supported-regions: The supported Regions to add to the service configuration.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        private-dns-name: (Interface endpoint configuration) The private DNS name to assign to the endpoint service.
        remove-gateway-load-balancer-arns: The Amazon Resource Names (ARNs) of Gateway Load Balancers to remove from the service configuration.
        remove-network-load-balancer-arns: The Amazon Resource Names (ARNs) of Network Load Balancers to remove from the service configuration.
        remove-private-dns-name: (Interface endpoint configuration) Removes the private DNS name of the endpoint service.
        remove-supported-ip-address-types: The IP address types to remove from the service configuration.
        remove-supported-regions: The supported Regions to remove from the service configuration.
        service-id: The ID of the service.
