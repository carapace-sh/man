name: list-profile-history-records
description: Returns a list of history records for a specific profile, for a specific domain.
flags:
    --action-type=: Applies a filter to include profile history records only with the specified `ActionType` value in the response.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-name=!: The unique name of the domain for which to return profile history records.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --object-type-name=: Applies a filter to include profile history records only with the specified `ObjectTypeName` value in the response.
    --performed-by=: Applies a filter to include profile history records only with the specified `PerformedBy` value in the response.
    --profile-id=!: The identifier of the profile to be taken.
completion:
    flag:
        action-type:
            - ADDED_PROFILE_KEY
            - DELETED_PROFILE_KEY
            - CREATED
            - UPDATED
            - INGESTED
            - DELETED_BY_CUSTOMER
            - EXPIRED
            - MERGED
            - DELETED_BY_MERGE
documentation:
    command: Returns a list of history records for a specific profile, for a specific domain.
    flag:
        action-type: Applies a filter to include profile history records only with the specified `ActionType` value in the response.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-name: The unique name of the domain for which to return profile history records.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        object-type-name: Applies a filter to include profile history records only with the specified `ObjectTypeName` value in the response.
        performed-by: Applies a filter to include profile history records only with the specified `PerformedBy` value in the response. The `PerformedBy` value can be the Amazon Resource Name (ARN) of the person or service principal who performed the action.
        profile-id: The identifier of the profile to be taken.
