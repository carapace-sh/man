name: describe
description: Describe an existing Bigtable materialized view.
flags:
    --instance=: Bigtable instance for the materialized view.
    --view=: Specifies what type of information to return about the view.
completion:
    flag:
        view:
            - full
            - replication
            - schema
documentation:
    command: Describe an existing Bigtable materialized view.
    flag:
        instance: |-
            Bigtable instance for the materialized view.
            +
            To set the `instance` attribute:
            * provide the argument `materialized_view` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        view: 'Specifies what type of information to return about the view. _VIEW_ must be one of: *full*, *replication*, *schema*.'
