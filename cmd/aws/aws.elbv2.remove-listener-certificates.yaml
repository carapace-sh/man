name: remove-listener-certificates
description: Removes the specified certificate from the certificate list for the specified HTTPS or TLS listener.
flags:
    --certificates=!: The certificate to remove.
    --listener-arn=!: The Amazon Resource Name (ARN) of the listener.
documentation:
    command: Removes the specified certificate from the certificate list for the specified HTTPS or TLS listener.
    flag:
        certificates: The certificate to remove. You can specify one certificate per call. Set `CertificateArn` to the certificate ARN but do not set `IsDefault`.
        listener-arn: The Amazon Resource Name (ARN) of the listener.
