name: move
description: '*(BETA)*  Move a Compute Engine organization security policy.'
flags:
    --folder=: Folder to which the organization security policy is to be moved.
    --organization=: Organization in which the organization security policy is to be moved.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute org-security-policies move* is used to move is used to move organization security policies to
        new parent nodes.
    flag:
        folder: Folder to which the organization security policy is to be moved.
        organization: Organization in which the organization security policy is to be moved. Must be set if SECURITY_POLICY is the short name.
