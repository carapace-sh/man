name: spark-sql
description: '*(BETA)*  Submit a Spark SQL batch job.'
flags:
    --async: Return immediately without waiting for the operation in progress to complete.
    --autotuning-cohort=&: Autotuning cohort identifier.
    --autotuning-scenarios=&: Scenarios for which tunings are applied.
    --batch=: The ID of the batch job to submit.
    --cohort=&: Cohort identifier.
    --container-image=: Optional custom container image to use for the batch/session runtime environment.
    --deps-bucket=: A Cloud Storage bucket to upload workload dependencies.
    --enable-autotuning&: Enable autotuning got the workload.
    --history-server-cluster=: Spark History Server configuration for the batch/session job.
    --jars=: Comma-separated list of jar files to be provided to the classpaths.
    --kms-key=: Cloud KMS key to use for encryption.
    --labels=: List of label KEY=VALUE pairs to add.
    --metastore-service=: 'Name of a Dataproc Metastore service to be used as an external metastore in the format: "projects/{project-id}/locations/{region}/services/{service-name}".'
    --network=: Network URI to connect network to.
    --no-async&: Return immediately without waiting for the operation in progress to complete.
    --no-enable-autotuning&: Enable autotuning got the workload.
    --properties=: Specifies configuration properties for the workload.
    --region=: ID of the region or fully qualified identifier for the region.
    --request-id=: A unique ID that identifies the request.
    --service-account=: The IAM service account to be used for a batch/session job.
    --staging-bucket=: The Cloud Storage bucket to use to store job dependencies, config files,
    --subnet=: Subnetwork URI to connect network to.
    --tags=: Network tags for traffic control.
    --ttl=: The duration after the workload will be unconditionally terminated,
    --user-workload-authentication-type=: Whether to use END_USER_CREDENTIALS or SERVICE_ACCOUNT to run the workload.
    --vars=: 'Mapping of query variable names to values (equivalent to the Spark SQL command: SET name="value";).'
    --version=: Optional runtime version.
documentation:
    command: '*(BETA)*  Submit a Spark SQL batch job.'
    flag:
        async: Return immediately without waiting for the operation in progress to complete.
        autotuning-cohort: Autotuning cohort identifier. Identifies families of the workloads having the similar structure and inputs, e.g. daily ETL jobs.
        autotuning-scenarios: Scenarios for which tunings are applied.
        batch: The ID of the batch job to submit. The ID must contain only lowercase letters (a-z), numbers (0-9) and hyphens (-). The length of the name must be between 4 and 63 characters. If this argument is not provided, a random generated UUID will be used.
        cohort: Cohort identifier. Identifies families of the workloads having the similar structure and inputs, e.g. daily ETL jobs.
        container-image: 'Optional custom container image to use for the batch/session runtime environment. If not specified, a default container image will be used. The value should follow the container image naming format: {registry}/{repository}/{name}:{tag}, for example, gcr.io/my-project/my-image:1.2.3'
        deps-bucket: A Cloud Storage bucket to upload workload dependencies.
        enable-autotuning: Enable autotuning got the workload.
        history-server-cluster: 'Spark History Server configuration for the batch/session job. Resource name of an existing Dataproc cluster to act as a Spark History Server for the workload in the format: "projects/{project_id}/regions/{region}/clusters/{cluster_name}".'
        jars: Comma-separated list of jar files to be provided to the classpaths.
        kms-key: Cloud KMS key to use for encryption.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        metastore-service: 'Name of a Dataproc Metastore service to be used as an external metastore in the format: "projects/{project-id}/locations/{region}/services/{service-name}".'
        network: Network URI to connect network to.
        no-async: Return immediately without waiting for the operation in progress to complete.
        no-enable-autotuning: Enable autotuning got the workload.
        properties: |-
            Specifies configuration properties for the workload. See
            [Dataproc Serverless for Spark documentation](https://cloud.google.com/dataproc-serverless/docs/concepts/properties)
            for the list of supported properties.
        region: |-
            ID of the region or fully qualified identifier for the region.
            +
            To set the `region` attribute:
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        request-id: 'A unique ID that identifies the request. If the service receives two batch create requests with the same request_id, the second request is ignored and the operation that corresponds to the first batch created and stored in the backend is returned. Recommendation:  Always set this value to a UUID. The value must contain only letters (a-z, A-Z), numbers (0-9), underscores (_), and hyphens (-). The maximum length is 40 characters.'
        service-account: The IAM service account to be used for a batch/session job.
        staging-bucket: |-
            The Cloud Storage bucket to use to store job dependencies, config files,
            and job driver console output. If not specified, the default [staging bucket]
            (https://cloud.google.com/dataproc-serverless/docs/concepts/buckets) is used.
        subnet: Subnetwork URI to connect network to. Subnet must have Private Google Access enabled.
        tags: Network tags for traffic control.
        ttl: |-
            The duration after the workload will be unconditionally terminated,
            for example, '20m' or '1h'. Run
            [gcloud topic datetimes](https://cloud.google.com/sdk/gcloud/reference/topic/datetimes)
            for information on duration formats.
        user-workload-authentication-type: Whether to use END_USER_CREDENTIALS or SERVICE_ACCOUNT to run the workload.
        vars: 'Mapping of query variable names to values (equivalent to the Spark SQL command: SET name="value";).'
        version: Optional runtime version.  If not specified, a default version will be used.
