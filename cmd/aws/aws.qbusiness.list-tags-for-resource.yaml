name: list-tags-for-resource
description: Gets a list of tags associated with a specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the Amazon Q Business application or data source to get a list of tags for.
documentation:
    command: Gets a list of tags associated with a specified resource. Amazon Q Business applications and data sources can have tags associated with them.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the Amazon Q Business application or data source to get a list of tags for.
