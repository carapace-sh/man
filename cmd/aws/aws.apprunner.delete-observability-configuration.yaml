name: delete-observability-configuration
description: Delete an App Runner observability configuration resource.
flags:
    --observability-configuration-arn=!: The Amazon Resource Name (ARN) of the App Runner observability configuration that you want to delete.
documentation:
    command: Delete an App Runner observability configuration resource. You can delete a specific revision or the latest active revision. You can't delete a configuration that's used by one or more App Runner services.
    flag:
        observability-configuration-arn: |-
            The Amazon Resource Name (ARN) of the App Runner observability configuration that you want to delete.

            The ARN can be a full observability configuration ARN, or a partial ARN ending with either `.../name` or `.../name/revision`. If a revision isn't specified, the latest active revision is deleted.
