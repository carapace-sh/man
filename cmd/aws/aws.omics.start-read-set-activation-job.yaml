name: start-read-set-activation-job
description: Activates an archived read set and returns its metadata in a JSON formatted output.
flags:
    --client-token=: To ensure that jobs don't run multiple times, specify a unique token for each job.
    --sequence-store-id=!: The read set's sequence store ID.
    --sources=!: The job's source files.
documentation:
    command: |-
        Activates an archived read set and returns its metadata in a JSON formatted output. AWS HealthOmics automatically archives unused read sets after 30 days. To monitor the status of your read set activation job, use the `GetReadSetActivationJob` operation.

        To learn more, see [Activating read sets](https://docs.aws.amazon.com/omics/latest/dev/activating-read-sets.html) in the *Amazon Web Services HealthOmics User Guide*.
    flag:
        client-token: To ensure that jobs don't run multiple times, specify a unique token for each job.
        sequence-store-id: The read set's sequence store ID.
        sources: The job's source files.
