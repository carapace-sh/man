name: list-ultra-servers-by-reserved-capacity
description: Lists all UltraServers that are part of a specified reserved capacity.
flags:
    --max-results=: The maximum number of UltraServers to return in the response.
    --next-token=: If the previous response was truncated, you receive this token.
    --reserved-capacity-arn=!: The ARN of the reserved capacity to list UltraServers for.
documentation:
    command: Lists all UltraServers that are part of a specified reserved capacity.
    flag:
        max-results: The maximum number of UltraServers to return in the response. The default value is 10.
        next-token: If the previous response was truncated, you receive this token. Use it in your next request to receive the next set of results.
        reserved-capacity-arn: The ARN of the reserved capacity to list UltraServers for.
