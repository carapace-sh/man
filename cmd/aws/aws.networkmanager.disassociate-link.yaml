name: disassociate-link
description: Disassociates an existing device from a link.
flags:
    --device-id=!: The ID of the device.
    --global-network-id=!: The ID of the global network.
    --link-id=!: The ID of the link.
documentation:
    command: Disassociates an existing device from a link. You must first disassociate any customer gateways that are associated with the link.
    flag:
        device-id: The ID of the device.
        global-network-id: The ID of the global network.
        link-id: The ID of the link.
