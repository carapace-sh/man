name: describe-rx-norm-inference-job
description: Gets the properties associated with an InferRxNorm job.
flags:
    --job-id=!: The identifier that Amazon Comprehend Medical generated for the job.
documentation:
    command: Gets the properties associated with an InferRxNorm job. Use this operation to get the status of an inference job.
    flag:
        job-id: The identifier that Amazon Comprehend Medical generated for the job. The StartRxNormInferenceJob operation returns this identifier in its response.
