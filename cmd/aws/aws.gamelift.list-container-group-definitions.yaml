name: list-container-group-definitions
description: |-
    **This API works with the following fleet types:** Container

    Retrieves container group definitions for the Amazon Web Services account and Amazon Web Services Region.
flags:
    --container-group-type=: The type of container group to retrieve.
    --limit=: The maximum number of results to return.
    --next-token=: A token that indicates the start of the next sequential page of results.
completion:
    flag:
        container-group-type:
            - GAME_SERVER
            - PER_INSTANCE
documentation:
    command: |-
        **This API works with the following fleet types:** Container

        Retrieves container group definitions for the Amazon Web Services account and Amazon Web Services Region. Use the pagination parameters to retrieve results in a set of sequential pages.

        This operation returns only the latest version of each definition. To retrieve all versions of a container group definition, use [ListContainerGroupDefinitionVersions](https://docs.aws.amazon.com/gamelift/latest/apireference/API_ListContainerGroupDefinitionVersions.html).

        **Request options:**

        - Retrieve the most recent versions of all container group definitions.
        - Retrieve the most recent versions of all container group definitions, filtered by type. Specify the container group type to filter on.

        **Results:**

        If successful, this operation returns the complete properties of a set of container group definition versions that match the request.

        This operation returns the list of container group definitions in no particular order.
    flag:
        container-group-type: The type of container group to retrieve. Container group type determines how Amazon GameLift Servers deploys the container group on each fleet instance.
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
