name: claim-device
description: Send a request to claim an AWS Elemental device that you have purchased from a third-party vendor.
flags:
    --id=: The id of the device you want to claim.
documentation:
    command: Send a request to claim an AWS Elemental device that you have purchased from a third-party vendor. After the request succeeds, you will own the device.
    flag:
        id: The id of the device you want to claim.
