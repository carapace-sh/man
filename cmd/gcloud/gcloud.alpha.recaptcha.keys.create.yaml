documentation:
    command: '*(ALPHA)*  Create a reCAPTCHA Key.'
    flag:
        action-score-thresholds: |-
            The action to score threshold used for POLICY_BASED_CHALLENGE. For example:
            --action-score-thresholds=login='{"scoreThreshold": "0.3"}',signup='{"scoreThreshold": "0.1"}'
            or --action-score-thresholds=file_path.(json|yaml).
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            *scoreThreshold*::::
            Sets `scoreThreshold` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --action-score-thresholds=string={scoreThreshold=float}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --action-score-thresholds='{"string": {"scoreThreshold": float}}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --action-score-thresholds=path_to_file.(yaml|json)
            +
            ```
        allow-all-bundle-ids: If set, bundle id enforcement will NOT be enabled on this key.
        allow-all-domains: If set, domain name enforcement will NOT be enabled on this key.
        allow-all-package-names: If set, package name enforcement will NOT be enabled on this key.
        allow-amp-traffic: Whether this key can be used on AMP (Accelerated Mobile Pages) websites.
        android: Creates a Key configured for Android devices.
        bundle-ids: |-
            iOS bundle ids of apps allowed to use the key.
            +
            Example of a valid bundle id:
               'com.companyname.productname.appname'
        default-score-threshold: The global threshold to be used for POLICY_BASED_CHALLENGE if no action specific one exists.
        display-name: A human-readable name for the key. Typically a site or app name.
        domains: |-
            Domains or subdomains of websites allowed to use the key. All subdomains of an
            allowed domain are automatically allowed. A valid domain requires a host and must
            not include any path, port, query or fragment.
            +
            Examples of valid domains:
                 'example.com'
                 'subdomain.example.com'
        express: Creates a Key configured for Express assessments.
        integration-type: |-
            Configures how reCAPTCHA will operate on your site. This only applies to 'web'
            platform. _INTEGRATION_TYPE_ must be one of:
            +
            *checkbox*::: Renders the classic "I'm not a robot" checkbox, and a captcha challenge
            for low scoring events
            +
            *invisible*::: Does not display the "I'm not a robot" checkbox, but may show CAPTCHA
            challenges after risk analysis
            +
            *policy-based-challenge*::: Conditionally displays a challenge based on the score
            +
            *score*::: Shows no CAPTCHA challenge on the page
            +
            :::
            +
        ios: Creates a Key configured for iOS devices.
        key-id: The Apple developer key ID (10-character string).
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-allow-all-bundle-ids: |
            If set, bundle id enforcement will NOT be enabled on this key.
        no-allow-all-domains: |
            If set, domain name enforcement will NOT be enabled on this key.
        no-allow-all-package-names: |
            If set, package name enforcement will NOT be enabled on this key.
        no-allow-amp-traffic: |
            Whether this key can be used on AMP (Accelerated Mobile Pages) websites.
        no-android: |
            Creates a Key configured for Android devices.
        no-express: |
            Creates a Key configured for Express assessments.
        no-ios: |
            Creates a Key configured for iOS devices.
        no-support-non-google-app-store-distribution: |
            If set, this key can be used in an Android application that is
            available for download in app stores other than the Google Play Store.

            This setting allows your key to accept traffic from devices without Google
            Mobile Services (GMS) installed.
        no-web: |
            Creates a Key configured for websites.
        package-names: |-
            Android package names of apps allowed to use the key.
            +
            Example of a valid package name:
               'com.companyname.appname'
        private-key-file: |-
            File path to a private key (downloaded as a text file with a .p8 file extension)
            generated for your Apple Developer account. Ensure that DeviceCheck is
            enabled for the private key. Use a full or relative path to a local file containing the value of private_key_file.
        security-preference: |-
            Represents the possible challenge frequency and difficulty configurations for a web
            key.
                        usability: show fewer and easier challenges.
                        balance: show balanced (in amount and difficulty) challenges.
                        security: show more and harder challenges.
            +
            _SECURITY_PREFERENCE_ must be one of: *balance*, *challenge-security-preference-unspecified*, *security*, *usability*.
        support-non-google-app-store-distribution: |-
            If set, this key can be used in an Android application that is
            available for download in app stores other than the Google Play Store.
            +
            This setting allows your key to accept traffic from devices without Google
            Mobile Services (GMS) installed.
        team-id: |-
            The Apple team ID (10-character string) owning the provisioning profile
            used to build your application.
        testing-challenge: |-
            For CHECKBOX and INVISIBLE Keys only, this option configures
            whether challenges will be issued for execute requests. _TESTING_CHALLENGE_ must be one of:
            +
            *challenge*::: Execute requests for this key will always return an unsolvable
            challenge consisting of a message about this testing key.
            +
            *nocaptcha*::: Execute requests for this key will always return nocaptcha.
            +
            :::
            +
        testing-score: |-
            If set, all assessments for this key will return this score. Must be between 0
            (likely not legitimate) and 1 (likely legitimate) inclusive.
        waf-feature: |-
            The WAF feature to use. For more information, see
            https://cloud.google.com/recaptcha-enterprise/docs/usecase#comparison_of_features. _WAF_FEATURE_ must be one of:
            +
            *action-token*::: Use reCAPTCHA action-tokens to protect user actions.
            +
            *challenge-page*::: Redirects suspicious traffic to reCAPTCHA challenge page.
            +
            *express*::: Assesses requests without tokens or frontend integration. This option is deprecated, use --express instead.
            +
            *session-token*::: Use reCAPTCHA session-tokens to protect the whole user session on the
            site's domain.
            +
            :::
            +
        waf-service: |-
            The WAF service provider to use. _WAF_SERVICE_ must be one of:
            +
            *akamai*::: Akamai
            +
            *ca*::: Cloud Armor
            +
            *cloudflare*::: Cloudflare
            +
            *fastly*::: Fastly
            +
            :::
            +
        web: Creates a Key configured for websites.
