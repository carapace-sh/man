name: list-users
description: Returns metadata of the User such as `UserID` in the specified collection.
flags:
    --collection-id=!: The ID of an existing collection.
    --max-results=: Maximum number of UsersID to return.
    --next-token=: Pagingation token to receive the next set of UsersID.
documentation:
    command: Returns metadata of the User such as `UserID` in the specified collection. Anonymous User (to reserve faces without any identity) is not returned as part of this request. The results are sorted by system generated primary key ID. If the response is truncated, `NextToken` is returned in the response that can be used in the subsequent request to retrieve the next set of identities.
    flag:
        collection-id: The ID of an existing collection.
        max-results: Maximum number of UsersID to return.
        next-token: Pagingation token to receive the next set of UsersID.
