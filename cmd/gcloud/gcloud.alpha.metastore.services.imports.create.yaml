name: create
description: '*(ALPHA)*  *(DEPRECATED)*  Import metadata into a service.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --database-dump-type=: The type of the database dump.
    --database-dump=!: A Cloud Storage object URI that specifies a database dump from which to import metadata.
    --database-type=: (DEPRECATED) The type of the database.
    --description=: The description of this metadata import.
    --location=: The location of the Dataproc Metastore service.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --service=: The identifier of the Dataproc Metastore service
completion:
    flag:
        database-dump-type:
            - mysql
        database-type:
            - mysql
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  This command has been deprecated.
        Please use `gcloud metastore services import gcs` instead.


        Import metadata with the given name and configurations in to a service.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        database-dump: |-
            A Cloud Storage object URI that specifies a database dump from which to import metadata.
            It must begin with `gs://`.
        database-dump-type: |-
            The type of the database dump. If unspecified, defaults to `MYSQL`. _DATABASE_DUMP_TYPE_ must be (only one value is supported):
            +
            *mysql*::: Database dump is a MYSQL dump file.
            +
            :::
            +
        database-type: |-
            (DEPRECATED) The type of the database. If unspecified, defaults to `MYSQL`.
            +
            The --database-type option is deprecated; use --database-dump-type instead. _DATABASE_TYPE_ must be (only one value is supported):
            +
            *mysql*::: MySQL Database
            +
            :::
            +
        description: The description of this metadata import.
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `import` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        service: |-
            The identifier of the Dataproc Metastore service
            +
            To set the `service` attribute:
            * provide the argument `import` on the command line with a fully specified name;
            * provide the argument `--service` on the command line.
