name: create-repository
description: Creates a repository in a public registry.
flags:
    --catalog-data=: The details about the repository that are publicly visible in the Amazon ECR Public Gallery.
    --repository-name=!: The name to use for the repository.
    --tags=: The metadata that you apply to each repository to help categorize and organize your repositories.
documentation:
    command: Creates a repository in a public registry. For more information, see [Amazon ECR repositories](https://docs.aws.amazon.com/AmazonECR/latest/userguide/Repositories.html) in the *Amazon Elastic Container Registry User Guide*.
    flag:
        catalog-data: The details about the repository that are publicly visible in the Amazon ECR Public Gallery.
        repository-name: The name to use for the repository. This appears publicly in the Amazon ECR Public Gallery. The repository name can be specified on its own (for example `nginx-web-app`) or prepended with a namespace to group the repository into a category (for example `project-a/nginx-web-app`).
        tags: The metadata that you apply to each repository to help categorize and organize your repositories. Each tag consists of a key and an optional value. You define both of them. Tag keys can have a maximum character length of 128 characters, and tag values can have a maximum length of 256 characters.
