name: delete
description: '*(DEPRECATED)*  Delete an Azure client.'
flags:
    --allow-missing: Allow idempotent deletion of client.
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Google Cloud location for the client.
    --no-allow-missing&: Allow idempotent deletion of client.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |+
        *(DEPRECATED)*  Delete an Azure client.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/azure/deprecations/deprecation-announcement for more details.

    flag:
        allow-missing: |-
            Allow idempotent deletion of client.
              The request will still succeed in case the client does not exist.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Google Cloud location for the client.
            +
            To set the `location` attribute:
            * provide the argument `client` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_azure/location`.
        no-allow-missing: |
            Allow idempotent deletion of client.
              The request will still succeed in case the client does not exist.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
