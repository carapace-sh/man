name: insert
description: '*(ALPHA)*  Insert records specified into an existing table.'
flags:
    --data=!: The file containing the newline-delimited array of JSON objects representing rows to insert.
    --dataset=: The id of the BigQuery dataset.
documentation:
    command: '*(ALPHA)*  Insert records specified into an existing table.'
    flag:
        data: |-
            The file containing the newline-delimited array of JSON objects representing rows to insert.
            +
            * For example:
               [
                {"string_col": "value1", "bool_col": false},
                {"string_col": "value2", "bool_col": true},
                {"string_col": "value3", "bool_col": false},
                {"string_col": "value4", "bool_col": true},
                {"string_col": "value5", "bool_col": false},
              ]
            +
            Use a full or relative path to a local file containing the value of data.
        dataset: |-
            The id of the BigQuery dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `table` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
