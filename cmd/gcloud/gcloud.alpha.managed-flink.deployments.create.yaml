name: create
description: '*(ALPHA)*  Create a BigQuery Engine for Apache Flink deployment.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --display-name=: display name of the Flink deployment.
    --location=: ID of the location of the Apache Flink for BigQuery resource.
    --max-slots=!: max slots of the Flink deployment.
    --network-config-subnetwork=!: subnetwork for the Flink deployment network config.
    --network-config-vpc=!: fully qualified VPC network for the Flink deployment network config.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --secrets-paths=&: path to the secrets manager for the Flink deployment.
    --workload-identity=: The workload identity to use for the deployment.
documentation:
    command: '*(ALPHA)*  Create a BigQuery Engine for Apache Flink deployment.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        display-name: display name of the Flink deployment.
        location: |-
            ID of the location of the Apache Flink for BigQuery resource. See
            https://cloud.google.com/managed-flink/docs/locations for a list of supported
            locations.
            +

            To set the `location` attribute:
            * provide the argument `deployment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        max-slots: max slots of the Flink deployment.
        network-config-subnetwork: subnetwork for the Flink deployment network config.
        network-config-vpc: |-
            fully qualified VPC network for the Flink deployment network config.
            Formatted as: projects/{project}/global/networks/{network_id}.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        secrets-paths: |
            path to the secrets manager for the Flink deployment. (ie. projects/{my-project}/secrets/{my-secret}/versions/{1})
        workload-identity: The workload identity to use for the deployment. Managed Flink Default Workload Identity will be used if not specified.
