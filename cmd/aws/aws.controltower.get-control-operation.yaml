name: get-control-operation
description: Returns the status of a particular `EnableControl` or `DisableControl` operation.
flags:
    --operation-identifier=!: The ID of the asynchronous operation, which is used to track status.
documentation:
    command: Returns the status of a particular `EnableControl` or `DisableControl` operation. Displays a message in case of error. Details for an operation are available for 90 days. For usage examples, see the [*Controls Reference Guide*](https://docs.aws.amazon.com/controltower/latest/controlreference/control-api-examples-short.html) .
    flag:
        operation-identifier: The ID of the asynchronous operation, which is used to track status. The operation is available for 90 days.
