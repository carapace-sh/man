name: unarchive-findings
description: Unarchives GuardDuty findings specified by the `findingIds`.
flags:
    --detector-id=!: The ID of the detector associated with the findings to unarchive.
    --finding-ids=!: The IDs of the findings to unarchive.
documentation:
    command: Unarchives GuardDuty findings specified by the `findingIds`.
    flag:
        detector-id: |-
            The ID of the detector associated with the findings to unarchive.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        finding-ids: The IDs of the findings to unarchive.
