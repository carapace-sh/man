name: update-cis-scan-configuration
description: Updates a CIS scan configuration.
flags:
    --scan-configuration-arn=!: The CIS scan configuration ARN.
    --scan-name=: The scan name for the CIS scan configuration.
    --schedule=: The schedule for the CIS scan configuration.
    --security-level=: The security level for the CIS scan configuration.
    --targets=: The targets for the CIS scan configuration.
completion:
    flag:
        security-level:
            - LEVEL_1
            - LEVEL_2
documentation:
    command: Updates a CIS scan configuration.
    flag:
        scan-configuration-arn: The CIS scan configuration ARN.
        scan-name: The scan name for the CIS scan configuration.
        schedule: The schedule for the CIS scan configuration.
        security-level: The security level for the CIS scan configuration. Security level refers to the Benchmark levels that CIS assigns to a profile.
        targets: The targets for the CIS scan configuration.
