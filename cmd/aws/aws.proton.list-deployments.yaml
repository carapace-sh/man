name: list-deployments
description: List deployments.
flags:
    --component-name=: The name of a component for result list filtering.
    --environment-name=: The name of an environment for result list filtering.
    --max-results=: The maximum number of deployments to list.
    --next-token=: A token that indicates the location of the next deployment in the array of deployment, after the list of deployment that was previously requested.
    --service-instance-name=: The name of a service instance for result list filtering.
    --service-name=: The name of a service for result list filtering.
documentation:
    command: List deployments. You can filter the result list by environment, service, or a single service instance.
    flag:
        component-name: The name of a component for result list filtering. Proton returns deployments associated with that component.
        environment-name: The name of an environment for result list filtering. Proton returns deployments associated with the environment.
        max-results: The maximum number of deployments to list.
        next-token: A token that indicates the location of the next deployment in the array of deployment, after the list of deployment that was previously requested.
        service-instance-name: The name of a service instance for result list filtering. Proton returns the deployments associated with the service instance.
        service-name: The name of a service for result list filtering. Proton returns deployments associated with service instances of the service.
