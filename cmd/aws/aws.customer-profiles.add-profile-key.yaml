name: add-profile-key
description: Associates a new key value with a specific profile, such as a Contact Record ContactId.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-name=!: The unique name of the domain.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --key-name=!: A searchable identifier of a customer profile.
    --profile-id=!: The unique identifier of a customer profile.
    --values=!:
        description: A list of key values.
        nargs: -1
documentation:
    command: |-
        Associates a new key value with a specific profile, such as a Contact Record ContactId.

        A profile object can have a single unique key and any number of additional keys that can be used to identify the profile that it belongs to.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-name: The unique name of the domain.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        key-name: 'A searchable identifier of a customer profile. The predefined keys you can use include: \_account, \_profileId, \_assetId, \_caseId, \_orderId, \_fullName, \_phone, \_email, \_ctrContactId, \_marketoLeadId, \_salesforceAccountId, \_salesforceContactId, \_salesforceAssetId, \_zendeskUserId, \_zendeskExternalId, \_zendeskTicketId, \_serviceNowSystemId, \_serviceNowIncidentId, \_segmentUserId, \_shopifyCustomerId, \_shopifyOrderId.'
        profile-id: The unique identifier of a customer profile.
        values: A list of key values.
