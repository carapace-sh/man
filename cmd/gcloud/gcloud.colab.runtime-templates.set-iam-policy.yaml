name: set-iam-policy
description: Set IAM policy for a Colab Enterprise runtime template as defined in a JSON or YAML file.
flags:
    --region=: Cloud region for the runtime template.
documentation:
    command: |
        Set the IAM policy for a Colab Enterprise runtime template as defined in a JSON or YAML file.

        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.
    flag:
        region: |-
            Cloud region for the runtime template.
            +
            To set the `region` attribute:
            * provide the argument `runtime_template` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `colab/region`.
