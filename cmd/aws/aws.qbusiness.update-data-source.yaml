    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=: ""
    --data-source-id=!: The identifier of the data source connector.
    --description=: The description of the data source connector.
    --display-name=: A name of the data source connector.
    --document-enrichment-configuration=: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --index-id=!: The identifier of the index attached to the data source connector.
    --media-extraction-configuration=: The configuration for extracting information from media in documents for your data source.
    --role-arn=: The Amazon Resource Name (ARN) of an IAM role with permission to access the data source and required resources.
    --sync-schedule=: The chosen update frequency for your data source.
    --vpc-configuration=: ""
