name: read
description: '*(BETA)*  Read the Tensorboard time series data from the given Tensorboard time series id.'
flags:
    --filter=: Filter for the tensorboard-time-series.
    --max-data-points=: Max data points to read from the Tensorboard time series
    --region=: Cloud region for the tensorboard_time_series.
    --tensorboard-experiment-id=: ID of the tensorboard experiment for the tensorboard_time_series.
    --tensorboard-id=: ID of the tensorboard for the tensorboard_time_series.
    --tensorboard-run-id=: ID of the tensorboard run for the tensorboard_time_series.
documentation:
    command: '*(BETA)*  Read the Tensorboard time series data from the given Tensorboard time series id.'
    flag:
        filter: Filter for the tensorboard-time-series.
        max-data-points: Max data points to read from the Tensorboard time series
        region: |-
            Cloud region for the tensorboard_time_series.
            +
            To set the `region` attribute:
            * provide the argument `tensorboard_time_series` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
        tensorboard-experiment-id: |-
            ID of the tensorboard experiment for the tensorboard_time_series.
            +
            To set the `tensorboard-experiment-id` attribute:
            * provide the argument `tensorboard_time_series` on the command line with a fully specified name;
            * provide the argument `--tensorboard-experiment-id` on the command line.
        tensorboard-id: |-
            ID of the tensorboard for the tensorboard_time_series.
            +
            To set the `tensorboard-id` attribute:
            * provide the argument `tensorboard_time_series` on the command line with a fully specified name;
            * provide the argument `--tensorboard-id` on the command line.
        tensorboard-run-id: |-
            ID of the tensorboard run for the tensorboard_time_series.
            +
            To set the `tensorboard-run-id` attribute:
            * provide the argument `tensorboard_time_series` on the command line with a fully specified name;
            * provide the argument `--tensorboard-run-id` on the command line.
