name: allocate-connection-on-interconnect
description: Deprecated.
flags:
    --bandwidth=!: The bandwidth of the connection.
    --connection-name=!: The name of the provisioned connection.
    --interconnect-id=!: The ID of the interconnect on which the connection will be provisioned.
    --owner-account=!: The ID of the Amazon Web Services account of the customer for whom the connection will be provisioned.
    --vlan=!: The dedicated VLAN provisioned to the connection.
documentation:
    command: |-
        Deprecated. Use [AllocateHostedConnection]() instead.

        Creates a hosted connection on an interconnect.

        Allocates a VLAN number and a specified amount of bandwidth for use by a hosted connection on the specified interconnect.

        Intended for use by Direct Connect Partners only.
    flag:
        bandwidth: The bandwidth of the connection. The possible values are 50Mbps, 100Mbps, 200Mbps, 300Mbps, 400Mbps, 500Mbps, 1Gbps, 2Gbps, 5Gbps, and 10Gbps. Note that only those Direct Connect Partners who have met specific requirements are allowed to create a 1Gbps, 2Gbps, 5Gbps or 10Gbps hosted connection.
        connection-name: The name of the provisioned connection.
        interconnect-id: The ID of the interconnect on which the connection will be provisioned.
        owner-account: The ID of the Amazon Web Services account of the customer for whom the connection will be provisioned.
        vlan: The dedicated VLAN provisioned to the connection.
