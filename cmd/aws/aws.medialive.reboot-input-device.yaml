name: reboot-input-device
description: Send a reboot command to the specified input device.
flags:
    --force=: Force a reboot of an input device.
    --input-device-id=!: The unique ID of the input device to reboot.
completion:
    flag:
        force:
            - "NO"
            - "YES"
documentation:
    command: Send a reboot command to the specified input device. The device will begin rebooting within a few seconds of sending the command. When the reboot is complete, the device’s connection status will change to connected.
    flag:
        force: Force a reboot of an input device. If the device is streaming, it will stop streaming and begin rebooting within a few seconds of sending the command. If the device was streaming prior to the reboot, the device will resume streaming when the reboot completes.
        input-device-id: The unique ID of the input device to reboot. For example, hd-123456789abcdef.
