name: bak
description: '*(BETA)*  Export data from a Cloud SQL instance to a BAK file.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --bak-type=: Type of bak file that will be exported, FULL or DIFF.
    --database=: Database from which the export is made.
    --differential-base: Whether the bak file export can be used as differential base for future differential backup.
    --export-log-end-time=: Optional flag.
    --export-log-start-time=: Optional flag.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-differential-base&: Whether the bak file export can be used as differential base for future differential backup.
    --no-striped&: Whether SQL Server export should be striped.
    --stripe-count=: Specifies the number of stripes to use for SQL Server exports.
    --striped: Whether SQL Server export should be striped.
completion:
    flag:
        bak-type:
            - FULL
            - DIFF
            - TLOG
documentation:
    command: |-
        *(BETA)*  Export data from a Cloud SQL instance to a Google Cloud Storage
        bucket as a BAK backup file. This is only supported for SQL Server.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        bak-type: 'Type of bak file that will be exported, FULL or DIFF. SQL Server only. _BAK_TYPE_ must be one of: *FULL*, *DIFF*, *TLOG*.'
        database: 'Database from which the export is made. Information on requirements can be found here: https://cloud.google.com/sql/docs/sqlserver/admin-api/v1beta4/instances/export#exportContext.databases'
        differential-base: Whether the bak file export can be used as differential base for future differential backup. SQL Server only
        export-log-end-time: 'Optional flag. The end time of the transaction log files that are included in the export file. Use this flag to export transaction logs for Cloud SQL for SQL Server only. Format: YYYY-MM-DDTHH:MM:SSZ, UTC timezone only.'
        export-log-start-time: 'Optional flag. The start time of the transaction log files that are included in the export file. Use this flag to export transaction logs for Cloud SQL for SQL Server only. Format: YYYY-MM-DDTHH:MM:SSZ, UTC timezone only.'
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-differential-base: Whether the bak file export can be used as differential base for future differential backup. SQL Server only
        no-striped: Whether SQL Server export should be striped.
        stripe-count: Specifies the number of stripes to use for SQL Server exports.
        striped: Whether SQL Server export should be striped. Use *--striped* to enable and *--no-striped* to disable.
