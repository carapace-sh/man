name: create-model-package
description: Creates a model package that you can use to create SageMaker models or list on Amazon Web Services Marketplace, or a versioned model that is part of a model group.
flags:
    --additional-inference-specifications=:
        description: An array of additional Inference Specification objects.
        nargs: -1
    --certify-for-marketplace: Whether to certify the model package for listing on Amazon Web Services Marketplace.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique token that guarantees that the call to this API is idempotent.
    --customer-metadata-properties=: The metadata properties associated with the model package versions.
    --domain=: The machine learning domain of your model package and its components.
    --drift-check-baselines=: Represents the drift check baselines that can be used when the model monitor is set using the model package.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inference-specification=: 'Specifies details about inference jobs that you can run with models based on this model package, including the following information:'
    --metadata-properties=: ""
    --model-approval-status=: Whether the model is approved for deployment.
    --model-card=: The model card associated with the model package.
    --model-life-cycle=: A structure describing the current state of the model in its life cycle.
    --model-metrics=: A structure that contains model metrics reports.
    --model-package-description=: A description of the model package.
    --model-package-group-name=: The name or Amazon Resource Name (ARN) of the model package group that this model version belongs to.
    --model-package-name=: The name of the model package.
    --no-certify-for-marketplace: Whether to certify the model package for listing on Amazon Web Services Marketplace.
    --sample-payload-url=: The Amazon Simple Storage Service (Amazon S3) path where the sample payload is stored.
    --security-config=: The KMS Key ID (`KMSKeyId`) used for encryption of model package information.
    --skip-model-validation=: Indicates if you want to skip model validation.
    --source-algorithm-specification=: Details about the algorithm that was used to create the model package.
    --source-uri=: The URI of the source for the model package.
    --tags=:
        description: A list of key value pairs associated with the model.
        nargs: -1
    --task=: The machine learning task your model package accomplishes.
    --validation-specification=: Specifies configurations for one or more transform jobs that SageMaker runs to test the model package.
completion:
    flag:
        model-approval-status:
            - Approved
            - Rejected
            - PendingManualApproval
        skip-model-validation:
            - All
            - None
documentation:
    command: |-
        Creates a model package that you can use to create SageMaker models or list on Amazon Web Services Marketplace, or a versioned model that is part of a model group. Buyers can subscribe to model packages listed on Amazon Web Services Marketplace to create models in SageMaker.

        To create a model package by specifying a Docker container that contains your inference code and the Amazon S3 location of your model artifacts, provide values for `InferenceSpecification`. To create a model from an algorithm resource that you created or subscribed to in Amazon Web Services Marketplace, provide a value for `SourceAlgorithmSpecification`.

        There are two types of model packages:

        - Versioned - a model that is part of a model group in the model registry.
        - Unversioned - a model package that is not part of a model group.
    flag:
        additional-inference-specifications: An array of additional Inference Specification objects. Each additional Inference Specification specifies artifacts based on this model package that can be used on inference endpoints. Generally used with SageMaker Neo to store the compiled artifacts.
        certify-for-marketplace: |-
            Whether to certify the model package for listing on Amazon Web Services Marketplace.

            This parameter is optional for unversioned models, and does not apply to versioned models.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique token that guarantees that the call to this API is idempotent.
        customer-metadata-properties: The metadata properties associated with the model package versions.
        domain: The machine learning domain of your model package and its components. Common machine learning domains include computer vision and natural language processing.
        drift-check-baselines: Represents the drift check baselines that can be used when the model monitor is set using the model package. For more information, see the topic on [Drift Detection against Previous Baselines in SageMaker Pipelines](https://docs.aws.amazon.com/sagemaker/latest/dg/pipelines-quality-clarify-baseline-lifecycle.html#pipelines-quality-clarify-baseline-drift-detection) in the *Amazon SageMaker Developer Guide*.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        inference-specification: |-
            Specifies details about inference jobs that you can run with models based on this model package, including the following information:

            - The Amazon ECR paths of containers that contain the inference code and model artifacts.
            - The instance types that the model package supports for transform jobs and real-time endpoints used for inference.
            - The input and output content formats that the model package supports for inference.
        metadata-properties: ""
        model-approval-status: |-
            Whether the model is approved for deployment.

            This parameter is optional for versioned models, and does not apply to unversioned models.

            For versioned models, the value of this parameter must be set to `Approved` to deploy the model.
        model-card: The model card associated with the model package. Since `ModelPackageModelCard` is tied to a model package, it is a specific usage of a model card and its schema is simplified compared to the schema of `ModelCard`. The `ModelPackageModelCard` schema does not include `model_package_details`, and `model_overview` is composed of the `model_creator` and `model_artifact` properties. For more information about the model package model card schema, see [Model package model card schema](https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-details.html#model-card-schema). For more information about the model card associated with the model package, see [View the Details of a Model Version](https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-details.html).
        model-life-cycle: A structure describing the current state of the model in its life cycle.
        model-metrics: A structure that contains model metrics reports.
        model-package-description: A description of the model package.
        model-package-group-name: |-
            The name or Amazon Resource Name (ARN) of the model package group that this model version belongs to.

            This parameter is required for versioned models, and does not apply to unversioned models.
        model-package-name: |-
            The name of the model package. The name must have 1 to 63 characters. Valid characters are a-z, A-Z, 0-9, and - (hyphen).

            This parameter is required for unversioned models. It is not applicable to versioned models.
        sample-payload-url: The Amazon Simple Storage Service (Amazon S3) path where the sample payload is stored. This path must point to a single gzip compressed tar archive (.tar.gz suffix). This archive can hold multiple files that are all equally used in the load test. Each file in the archive must satisfy the size constraints of the [InvokeEndpoint](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_runtime_InvokeEndpoint.html#API_runtime_InvokeEndpoint_RequestSyntax) call.
        security-config: The KMS Key ID (`KMSKeyId`) used for encryption of model package information.
        skip-model-validation: Indicates if you want to skip model validation.
        source-algorithm-specification: Details about the algorithm that was used to create the model package.
        source-uri: The URI of the source for the model package. If you want to clone a model package, set it to the model package Amazon Resource Name (ARN). If you want to register a model, set it to the model ARN.
        tags: |-
            A list of key value pairs associated with the model. For more information, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html) in the *Amazon Web Services General Reference Guide*.

            If you supply `ModelPackageGroupName`, your model package belongs to the model group you specify and uses the tags associated with the model group. In this case, you cannot supply a `tag` argument.
        task: |-
            The machine learning task your model package accomplishes. Common machine learning tasks include object detection and image classification. The following tasks are supported by Inference Recommender: `"IMAGE_CLASSIFICATION"` | `"OBJECT_DETECTION"` | `"TEXT_GENERATION"` |`"IMAGE_SEGMENTATION"` | `"FILL_MASK"` | `"CLASSIFICATION"` | `"REGRESSION"` | `"OTHER"`.

            Specify "OTHER" if none of the tasks listed fit your use case.
        validation-specification: Specifies configurations for one or more transform jobs that SageMaker runs to test the model package.
