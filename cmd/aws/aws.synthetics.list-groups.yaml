name: list-groups
description: Returns a list of all groups in the account, displaying their names, unique IDs, and ARNs.
flags:
    --max-results=: Specify this parameter to limit how many groups are returned each time you use the `ListGroups` operation.
    --next-token=: A token that indicates that there is more data available.
documentation:
    command: Returns a list of all groups in the account, displaying their names, unique IDs, and ARNs. The groups from all Regions are returned.
    flag:
        max-results: Specify this parameter to limit how many groups are returned each time you use the `ListGroups` operation. If you omit this parameter, the default of 20 is used.
        next-token: A token that indicates that there is more data available. You can use this token in a subsequent operation to retrieve the next set of results.
