name: update-flow
description: Updates an existing flow.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The `clientToken` parameter is an idempotency token.
    --description=: A description of the flow.
    --destination-flow-config-list=!:
        description: The configuration that controls how Amazon AppFlow transfers data to the destination connector.
        nargs: -1
    --flow-name=!: The specified name of the flow.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metadata-catalog-config=: Specifies the configuration that Amazon AppFlow uses when it catalogs the data that's transferred by the associated flow.
    --source-flow-config=!: ""
    --tasks=!:
        description: A list of tasks that Amazon AppFlow performs while transferring the data in the flow run.
        nargs: -1
    --trigger-config=!: The trigger settings that determine how and when the flow runs.
documentation:
    command: Updates an existing flow.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            The `clientToken` parameter is an idempotency token. It ensures that your `UpdateFlow` request completes only once. You choose the value to pass. For example, if you don't receive a response from your request, you can safely retry the request with the same `clientToken` parameter value.

            If you omit a `clientToken` value, the Amazon Web Services SDK that you are using inserts a value for you. This way, the SDK can safely retry requests multiple times after a network error. You must provide your own value for other use cases.

            If you specify input parameters that differ from your first request, an error occurs. If you use a different value for `clientToken`, Amazon AppFlow considers it a new call to `UpdateFlow`. The token is active for 8 hours.
        description: A description of the flow.
        destination-flow-config-list: The configuration that controls how Amazon AppFlow transfers data to the destination connector.
        flow-name: The specified name of the flow. Spaces are not allowed. Use underscores (\_) or hyphens (-) only.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metadata-catalog-config: Specifies the configuration that Amazon AppFlow uses when it catalogs the data that's transferred by the associated flow. When Amazon AppFlow catalogs the data from a flow, it stores metadata in a data catalog.
        source-flow-config: ""
        tasks: A list of tasks that Amazon AppFlow performs while transferring the data in the flow run.
        trigger-config: The trigger settings that determine how and when the flow runs.
