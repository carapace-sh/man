name: delete-client-branding
description: Deletes customized client branding.
flags:
    --platforms=!: The device type for which you want to delete client branding.
    --resource-id=!: The directory identifier of the WorkSpace for which you want to delete client branding.
documentation:
    command: |-
        Deletes customized client branding. Client branding allows you to customize your WorkSpace's client login portal. You can tailor your login portal company logo, the support email address, support link, link to reset password, and a custom message for users trying to sign in.

        After you delete your customized client branding, your login portal reverts to the default client branding.
    flag:
        platforms: The device type for which you want to delete client branding.
        resource-id: The directory identifier of the WorkSpace for which you want to delete client branding.
