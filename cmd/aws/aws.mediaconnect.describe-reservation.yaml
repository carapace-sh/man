name: describe-reservation
description: Displays the details of a reservation.
flags:
    --reservation-arn=!: The Amazon Resource Name (ARN) of the offering.
documentation:
    command: Displays the details of a reservation. The response includes the reservation name, state, start date and time, and the details of the offering that make up the rest of the reservation (such as price, duration, and outbound bandwidth).
    flag:
        reservation-arn: The Amazon Resource Name (ARN) of the offering.
