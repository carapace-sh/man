name: describe-export-tasks
description: Retrieve status of one or more export tasks.
flags:
    --export-ids=: One or more unique identifiers used to query the status of an export request.
    --filters=: One or more filters.
    --max-results=: The maximum number of volume results returned by `DescribeExportTasks` in paginated output.
    --next-token=: The `nextToken` value returned from a previous paginated `DescribeExportTasks` request where `maxResults` was used and the results exceeded the value of that parameter.
documentation:
    command: Retrieve status of one or more export tasks. You can retrieve the status of up to 100 export tasks.
    flag:
        export-ids: One or more unique identifiers used to query the status of an export request.
        filters: |-
            One or more filters.

            - `AgentId` - ID of the agent whose collected data will be exported
        max-results: The maximum number of volume results returned by `DescribeExportTasks` in paginated output. When this parameter is used, `DescribeExportTasks` only returns `maxResults` results in a single page along with a `nextToken` response element.
        next-token: The `nextToken` value returned from a previous paginated `DescribeExportTasks` request where `maxResults` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `nextToken` value. This value is null when there are no more results to return.
