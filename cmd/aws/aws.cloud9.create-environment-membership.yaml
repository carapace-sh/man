name: create-environment-membership
description: Adds an environment member to an Cloud9 development environment.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --environment-id=!: The ID of the environment that contains the environment member you want to add.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --permissions=!: The type of environment member permissions you want to associate with this environment member.
    --user-arn=!: The Amazon Resource Name (ARN) of the environment member you want to add.
completion:
    flag:
        permissions:
            - read-write
            - read-only
documentation:
    command: |-
        Adds an environment member to an Cloud9 development environment.

        Cloud9 is no longer available to new customers. Existing customers of Cloud9 can continue to use the service as normal. [Learn more"](http://aws.amazon.com/blogs/devops/how-to-migrate-from-aws-cloud9-to-aws-ide-toolkits-or-aws-cloudshell/)
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        environment-id: The ID of the environment that contains the environment member you want to add.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        permissions: |-
            The type of environment member permissions you want to associate with this environment member. Available values include:

            - `read-only`: Has read-only access to the environment.
            - `read-write`: Has read-write access to the environment.
        user-arn: The Amazon Resource Name (ARN) of the environment member you want to add.
