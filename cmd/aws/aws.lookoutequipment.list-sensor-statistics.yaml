name: list-sensor-statistics
description: Lists statistics about the data collected for each of the sensors that have been successfully ingested in the particular dataset.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dataset-name=!: The name of the dataset associated with the list of Sensor Statistics.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ingestion-job-id=: The ingestion job id associated with the list of Sensor Statistics.
    --max-results=: Specifies the maximum number of sensors for which to retrieve statistics.
    --next-token=: An opaque pagination token indicating where to continue the listing of sensor statistics.
documentation:
    command: Lists statistics about the data collected for each of the sensors that have been successfully ingested in the particular dataset. Can also be used to retreive Sensor Statistics for a previous ingestion job.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dataset-name: The name of the dataset associated with the list of Sensor Statistics.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ingestion-job-id: The ingestion job id associated with the list of Sensor Statistics. To get sensor statistics for a particular ingestion job id, both dataset name and ingestion job id must be submitted as inputs.
        max-results: Specifies the maximum number of sensors for which to retrieve statistics.
        next-token: An opaque pagination token indicating where to continue the listing of sensor statistics.
