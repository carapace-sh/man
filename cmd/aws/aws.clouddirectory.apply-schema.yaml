name: apply-schema
description: Copies the input published schema, at the specified version, into the [Directory]() with the same name and version as that of the published schema.
flags:
    --directory-arn=!: The Amazon Resource Name (ARN) that is associated with the [Directory]() into which the schema is copied.
    --published-schema-arn=!: Published schema Amazon Resource Name (ARN) that needs to be copied.
documentation:
    command: Copies the input published schema, at the specified version, into the [Directory]() with the same name and version as that of the published schema.
    flag:
        directory-arn: The Amazon Resource Name (ARN) that is associated with the [Directory]() into which the schema is copied. For more information, see [arns]().
        published-schema-arn: Published schema Amazon Resource Name (ARN) that needs to be copied. For more information, see [arns]().
