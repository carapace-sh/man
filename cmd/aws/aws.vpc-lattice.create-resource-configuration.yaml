name: create-resource-configuration
description: Creates a resource configuration.
flags:
    --allow-association-to-shareable-service-network: (SINGLE, GROUP, ARN) Specifies whether the resource configuration can be associated with a sharable service network.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --custom-domain-name=: A custom domain name for your resource configuration.
    --domain-verification-identifier=: The domain verification ID of your verified custom domain name.
    --group-domain=: (GROUP) The group domain for a group resource configuration.
    --name=!: The name of the resource configuration.
    --no-allow-association-to-shareable-service-network&: (SINGLE, GROUP, ARN) Specifies whether the resource configuration can be associated with a sharable service network.
    --port-ranges=: '(SINGLE, GROUP, CHILD) The TCP port ranges that a consumer can use to access a resource configuration (for example: 1-65535).'
    --protocol=: (SINGLE, GROUP) The protocol accepted by the resource configuration.
    --resource-configuration-definition=: 'Identifies the resource configuration in one of the following ways:'
    --resource-configuration-group-identifier=: (CHILD) The ID or ARN of the parent resource configuration of type `GROUP`.
    --resource-gateway-identifier=: (SINGLE, GROUP, ARN) The ID or ARN of the resource gateway used to connect to the resource configuration.
    --tags=: The tags for the resource configuration.
    --type=!: The type of resource configuration.
completion:
    flag:
        protocol:
            - TCP
        type:
            - GROUP
            - CHILD
            - SINGLE
            - ARN
documentation:
    command: Creates a resource configuration. A resource configuration defines a specific resource. You can associate a resource configuration with a service network or a VPC endpoint.
    flag:
        allow-association-to-shareable-service-network: (SINGLE, GROUP, ARN) Specifies whether the resource configuration can be associated with a sharable service network. The default is false.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you retry a request that completed successfully using the same client token and parameters, the retry succeeds without performing any actions. If the parameters aren't identical, the retry fails.
        custom-domain-name: A custom domain name for your resource configuration. Additionally, provide a DomainVerificationID to prove your ownership of a domain.
        domain-verification-identifier: The domain verification ID of your verified custom domain name. If you don't provide an ID, you must configure the DNS settings yourself.
        group-domain: (GROUP) The group domain for a group resource configuration. Any domains that you create for the child resource are subdomains of the group domain. Child resources inherit the verification status of the domain.
        name: The name of the resource configuration. The name must be unique within the account. The valid characters are a-z, 0-9, and hyphens (-). You can't use a hyphen as the first or last character, or immediately after another hyphen.
        port-ranges: '(SINGLE, GROUP, CHILD) The TCP port ranges that a consumer can use to access a resource configuration (for example: 1-65535). You can separate port ranges using commas (for example: 1,2,22-30).'
        protocol: (SINGLE, GROUP) The protocol accepted by the resource configuration.
        resource-configuration-definition: |-
            Identifies the resource configuration in one of the following ways:

            - **Amazon Resource Name (ARN)** - Supported resource-types that are provisioned by Amazon Web Services services, such as RDS databases, can be identified by their ARN.
            - **Domain name** - Any domain name that is publicly resolvable.
            - **IP address** - For IPv4 and IPv6, only IP addresses in the VPC are supported.
        resource-configuration-group-identifier: (CHILD) The ID or ARN of the parent resource configuration of type `GROUP`. This is used to associate a child resource configuration with a group resource configuration.
        resource-gateway-identifier: (SINGLE, GROUP, ARN) The ID or ARN of the resource gateway used to connect to the resource configuration. For a child resource configuration, this value is inherited from the parent resource configuration.
        tags: The tags for the resource configuration.
        type: |-
            The type of resource configuration. A resource configuration can be one of the following types:

            - **SINGLE** - A single resource.
            - **GROUP** - A group of resources. You must create a group resource configuration before you create a child resource configuration.
            - **CHILD** - A single resource that is part of a group resource configuration.
            - **ARN** - An Amazon Web Services resource.
