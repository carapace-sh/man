name: describe-slack-user-identities
description: Lists all Slack user identities with a mapped role.
flags:
    --chat-configuration-arn=: The Amazon Resource Name (ARN) of the SlackChannelConfiguration associated with the user identities to describe.
    --max-results=: The maximum number of results to include in the response.
    --next-token=: An optional token returned from a prior request.
documentation:
    command: Lists all Slack user identities with a mapped role.
    flag:
        chat-configuration-arn: The Amazon Resource Name (ARN) of the SlackChannelConfiguration associated with the user identities to describe.
        max-results: The maximum number of results to include in the response. If more results exist than the specified MaxResults value, a token is included in the response so that the remaining results can be retrieved.
        next-token: An optional token returned from a prior request. Use this token for pagination of results from this action. If this parameter is specified, the response includes only results beyond the token, up to the value specified by MaxResults.
