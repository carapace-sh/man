name: list-realtime-contact-analysis-segments-v2
description: Provides a list of analysis segments for a real-time chat analysis session.
flags:
    --contact-id=!: The identifier of the contact in this instance of Amazon Connect.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --output-type=!: The Contact Lens output type to be returned.
    --segment-types=!: Enum with segment types .
completion:
    flag:
        output-type:
            - Raw
            - Redacted
documentation:
    command: |-
        Provides a list of analysis segments for a real-time chat analysis session. This API supports CHAT channels only.

        This API does not support VOICE. If you attempt to use it for VOICE, an `InvalidRequestException` occurs.
    flag:
        contact-id: The identifier of the contact in this instance of Amazon Connect.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        output-type: The Contact Lens output type to be returned.
        segment-types: Enum with segment types . Each value corresponds to a segment type returned in the segments list of the API. Each segment type has its own structure. Different channels may have different sets of supported segment types.
