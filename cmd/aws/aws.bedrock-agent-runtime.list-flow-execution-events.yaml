name: list-flow-execution-events
description: Lists events that occurred during a flow execution.
flags:
    --event-type=!: The type of events to retrieve.
    --execution-identifier=!: The unique identifier of the flow execution.
    --flow-alias-identifier=!: The unique identifier of the flow alias used for the execution.
    --flow-identifier=!: The unique identifier of the flow.
    --max-results=: The maximum number of events to return in a single response.
    --next-token=: A token to retrieve the next set of results.
completion:
    flag:
        event-type:
            - Node
            - Flow
documentation:
    command: |-
        Lists events that occurred during a flow execution. Events provide detailed information about the execution progress, including node inputs and outputs, flow inputs and outputs, condition results, and failure events.

        Flow executions is in preview release for Amazon Bedrock and is subject to change.
    flag:
        event-type: The type of events to retrieve. Specify `Node` for node-level events or `Flow` for flow-level events.
        execution-identifier: The unique identifier of the flow execution.
        flow-alias-identifier: The unique identifier of the flow alias used for the execution.
        flow-identifier: The unique identifier of the flow.
        max-results: The maximum number of events to return in a single response. If more events exist than the specified maxResults value, a token is included in the response so that the remaining results can be retrieved.
        next-token: A token to retrieve the next set of results. This value is returned in the response if more results are available.
