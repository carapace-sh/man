name: request-service-quota-increase
description: Submits a quota increase request for the specified quota at the account or resource level.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --context-id=: Specifies the resource with an Amazon Resource Name (ARN).
    --desired-value=!: Specifies the new, increased value for the quota.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-support-case-allowed: Specifies if an Amazon Web Services Support case can be opened for the quota increase request.
    --quota-code=!: Specifies the quota identifier.
    --service-code=!: Specifies the service identifier.
    --support-case-allowed: Specifies if an Amazon Web Services Support case can be opened for the quota increase request.
documentation:
    command: Submits a quota increase request for the specified quota at the account or resource level.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        context-id: Specifies the resource with an Amazon Resource Name (ARN).
        desired-value: Specifies the new, increased value for the quota.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        quota-code: Specifies the quota identifier. To find the quota code for a specific quota, use the [ListServiceQuotas]() operation, and look for the `QuotaCode` response in the output for the quota you want.
        service-code: Specifies the service identifier. To find the service code value for an Amazon Web Services service, use the [ListServices]() operation.
        support-case-allowed: |-
            Specifies if an Amazon Web Services Support case can be opened for the quota increase request. This parameter is optional.

            By default, this flag is set to `True` and Amazon Web Services may create a support case for some quota increase requests. You can set this flag to `False` if you do not want a support case created when you request a quota increase. If you set the flag to `False`, Amazon Web Services does not open a support case and updates the request status to `Not approved`.
