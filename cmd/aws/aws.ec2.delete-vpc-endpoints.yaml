name: delete-vpc-endpoints
description: Deletes the specified VPC endpoints.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --vpc-endpoint-ids=!: The IDs of the VPC endpoints.
documentation:
    command: |-
        Deletes the specified VPC endpoints.

        When you delete a gateway endpoint, we delete the endpoint routes in the route tables for the endpoint.

        When you delete a Gateway Load Balancer endpoint, we delete its endpoint network interfaces. You can only delete Gateway Load Balancer endpoints when the routes that are associated with the endpoint are deleted.

        When you delete an interface endpoint, we delete its endpoint network interfaces.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        vpc-endpoint-ids: The IDs of the VPC endpoints.
