name: create
description: '*(BETA)*  Create a new Beyondcorp application connection.'
flags:
    --app-gateway=&: The gateway used by the AppConnection.
    --application-endpoint-host=!: Hostname or IP address of the remote application endpoint.
    --application-endpoint-port=!: Port of the remote application endpoint.
    --application-endpoint=: Address of the remote application endpoint for the Beyondcorp Connection in form of <host>:<port>.
    --async: Return immediately, without waiting for the operation in progress to
    --connectors=: List of connectors names that are authorised to be associated with this Connection.
    --display-name=: An arbitrary user-provided name for the connection.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the beyondcorp service.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --type=: The type of network connnectivity used by the connection.
completion:
    flag:
        type:
            - tcp
documentation:
    command: '*(BETA)*  Create a new Beyondcorp application connection.'
    flag:
        app-gateway: The gateway used by the AppConnection.
        application-endpoint: Address of the remote application endpoint for the Beyondcorp Connection in form of <host>:<port>.
        application-endpoint-host: Hostname or IP address of the remote application endpoint.
        application-endpoint-port: Port of the remote application endpoint.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        connectors: List of connectors names that are authorised to be associated with this Connection.
        display-name: An arbitrary user-provided name for the connection. Cannot exceed 64 characters.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the beyondcorp service.
            +

            To set the `location` attribute:
            * provide the argument `connection` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        type: |-
            The type of network connnectivity used by the connection. _TYPE_ must be (only one value is supported):
            +
            *tcp*::: TCP connection
            :::
            +
