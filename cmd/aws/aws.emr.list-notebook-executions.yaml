name: list-notebook-executions
description: Provides summaries of all notebook executions.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --editor-id=: The unique ID of the editor associated with the notebook execution.
    --execution-engine-id=: The unique ID of the execution engine.
    --from=: The beginning of time range filter for listing notebook executions.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --marker=: The pagination token, returned by a previous `ListNotebookExecutions` call, that indicates the start of the list for this `ListNotebookExecutions` call.
    --max-items=: The  total number of items to return in the command's output.
    --starting-token=: A token to specify where to start paginating.
    --status=: The status filter for listing notebook executions.
    --to=: The end of time range filter for listing notebook executions.
completion:
    flag:
        status:
            - START_PENDING
            - STARTING
            - RUNNING
            - FINISHING
            - FINISHED
            - FAILING
            - FAILED
            - STOP_PENDING
            - STOPPING
            - STOPPED
documentation:
    command: Provides summaries of all notebook executions. You can filter the list based on multiple criteria such as status, time range, and editor id. Returns a maximum of 50 notebook executions and a marker to track the paging of a longer notebook execution list across multiple `ListNotebookExecutions` calls.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        editor-id: The unique ID of the editor associated with the notebook execution.
        execution-engine-id: The unique ID of the execution engine.
        from: The beginning of time range filter for listing notebook executions. The default is the timestamp of 30 days ago.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        marker: The pagination token, returned by a previous `ListNotebookExecutions` call, that indicates the start of the list for this `ListNotebookExecutions` call.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status: |-
            The status filter for listing notebook executions.

            - `START_PENDING` indicates that the cluster has received the execution request but execution has not begun.
            - `STARTING` indicates that the execution is starting on the cluster.
            - `RUNNING` indicates that the execution is being processed by the cluster.
            - `FINISHING` indicates that execution processing is in the final stages.
            - `FINISHED` indicates that the execution has completed without error.
            - `FAILING` indicates that the execution is failing and will not finish successfully.
            - `FAILED` indicates that the execution failed.
            - `STOP_PENDING` indicates that the cluster has received a `StopNotebookExecution` request and the stop is pending.
            - `STOPPING` indicates that the cluster is in the process of stopping the execution as a result of a `StopNotebookExecution` request.
            - `STOPPED` indicates that the execution stopped because of a `StopNotebookExecution` request.
        to: The end of time range filter for listing notebook executions. The default is the current timestamp.
