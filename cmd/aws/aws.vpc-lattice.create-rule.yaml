name: create-rule
description: Creates a listener rule.
flags:
    --action=!: The action for the default rule.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --listener-identifier=!: The ID or ARN of the listener.
    --match=!: The rule match.
    --name=!: The name of the rule.
    --priority=!: The priority assigned to the rule.
    --service-identifier=!: The ID or ARN of the service.
    --tags=: The tags for the rule.
documentation:
    command: Creates a listener rule. Each listener has a default rule for checking connection requests, but you can define additional rules. Each rule consists of a priority, one or more actions, and one or more conditions. For more information, see [Listener rules](https://docs.aws.amazon.com/vpc-lattice/latest/ug/listeners.html#listener-rules) in the *Amazon VPC Lattice User Guide*.
    flag:
        action: The action for the default rule.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you retry a request that completed successfully using the same client token and parameters, the retry succeeds without performing any actions. If the parameters aren't identical, the retry fails.
        listener-identifier: The ID or ARN of the listener.
        match: The rule match.
        name: The name of the rule. The name must be unique within the listener. The valid characters are a-z, 0-9, and hyphens (-). You can't use a hyphen as the first or last character, or immediately after another hyphen.
        priority: The priority assigned to the rule. Each rule for a specific listener must have a unique priority. The lower the priority number the higher the priority.
        service-identifier: The ID or ARN of the service.
        tags: The tags for the rule.
