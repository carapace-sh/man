name: delete
description: '*(BETA)*  Delete a resource from the Identity Service Feature.'
flags:
    --fleet-default-member-config: If specified, deletes the default membership
    --location=: Location for the membership.
    --membership=!: ID of the membership or fully qualified identifier for the membership.
    --no-fleet-default-member-config&: If specified, deletes the default membership
documentation:
    command: |-
        *(BETA)*  Deletes a resource from the Identity Service Feature.

        ## EXAMPLES

        To delete the Identity Service configuration from a membership, run:

          $ gcloud beta container hub identity-service delete --membership=MEMBERSHIP_NAME

        To delete the fleet-level default membership configuration, run:

          $ gcloud beta container hub identity-service delete --fleet-default-member-config
    flag:
        fleet-default-member-config: |-
            If specified, deletes the default membership
                    configuration present in your fleet.
            +
                    To delete the default membership configuration present in your
                    fleet, run:
            +
                      $ {command} --fleet-default-member-config
        location: |-
            Location for the membership.
            +
            To set the `location` attribute:
            * provide the argument `--membership` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        membership: |-
            ID of the membership or fully qualified identifier for the membership.
            +
            To set the `membership` attribute:
            * provide the argument `--membership` on the command line.
        no-fleet-default-member-config: |-
            If specified, deletes the default membership
                    configuration present in your fleet.

                    To delete the default membership configuration present in your
                    fleet, run:

                      $ {command} --fleet-default-member-config
