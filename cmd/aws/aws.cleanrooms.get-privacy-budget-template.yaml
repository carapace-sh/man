name: get-privacy-budget-template
description: Returns details for a specified privacy budget template.
flags:
    --membership-identifier=!: A unique identifier for one of your memberships for a collaboration.
    --privacy-budget-template-identifier=!: A unique identifier for your privacy budget template.
documentation:
    command: Returns details for a specified privacy budget template.
    flag:
        membership-identifier: A unique identifier for one of your memberships for a collaboration. The privacy budget template is retrieved from the collaboration that this membership belongs to. Accepts a membership ID.
        privacy-budget-template-identifier: A unique identifier for your privacy budget template.
