name: delete-attendee
description: Deletes an attendee from the specified Amazon Chime SDK meeting and deletes their `JoinToken`.
flags:
    --attendee-id=!: The Amazon Chime SDK attendee ID.
    --meeting-id=!: The Amazon Chime SDK meeting ID.
documentation:
    command: Deletes an attendee from the specified Amazon Chime SDK meeting and deletes their `JoinToken`. Attendees are automatically deleted when a Amazon Chime SDK meeting is deleted. For more information about the Amazon Chime SDK, see [Using the Amazon Chime SDK](https://docs.aws.amazon.com/chime-sdk/latest/dg/meetings-sdk.html) in the *Amazon Chime Developer Guide*.
    flag:
        attendee-id: The Amazon Chime SDK attendee ID.
        meeting-id: The Amazon Chime SDK meeting ID.
