name: deauthorize
description: Deauthorize a service agent from managing resources.
flags:
    --bigquery-dataset-resource=!: The identifier of the BigQuery dataset that the service agent will no longer manage.
    --project-resource=: The identifier of the project whose resources the service agent will no longer manage.
    --secondary-project=!: The identifier of the project where the BigQuery dataset is located.
    --storage-bucket-resource=: The identifier of the Cloud Storage bucket that the service agent will no longer manage.
documentation:
    command: |-
        The service agent for the primary project will have its IAM role revoked from
        a secondary project, a Cloud Storage bucket, or a BigQuery dataset.
    flag:
        bigquery-dataset-resource: The identifier of the BigQuery dataset that the service agent will no longer manage.
        project-resource: The identifier of the project whose resources the service agent will no longer manage.
        secondary-project: The identifier of the project where the BigQuery dataset is located.
        storage-bucket-resource: The identifier of the Cloud Storage bucket that the service agent will no longer manage.
