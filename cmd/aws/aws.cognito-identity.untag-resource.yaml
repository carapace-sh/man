name: untag-resource
description: Removes the specified tags from the specified Amazon Cognito identity pool.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the identity pool.
    --tag-keys=!: The keys of the tags to remove from the user pool.
documentation:
    command: Removes the specified tags from the specified Amazon Cognito identity pool. You can use this action up to 5 times per second, per account
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the identity pool.
        tag-keys: The keys of the tags to remove from the user pool.
