name: suspend
description: '*(ALPHA)*  Suspend in-progress Rollout.'
flags:
    --fleet-package=: Fleet Package name.
    --location=: Google Cloud zone or region for the rollout.
    --reason=: Reason for suspending rollout.
documentation:
    command: '*(ALPHA)*  Suspend in-progress Rollout.'
    flag:
        fleet-package: |-
            Fleet Package name.
            +
            To set the `fleet-package` attribute:
            * provide the argument `rollout` on the command line with a fully specified name;
            * provide the argument `--fleet-package` on the command line.
        location: |-
            Google Cloud zone or region for the rollout.
            +
            To set the `location` attribute:
            * provide the argument `rollout` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `config_delivery/location`.
        reason: Reason for suspending rollout.
