name: create-vpn-connection
description: Creates a VPN connection between an existing virtual private gateway or transit gateway and a customer gateway.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --customer-gateway-id=!: The ID of the customer gateway.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --options=: The options for the VPN connection.
    --pre-shared-key-storage=: Specifies the storage mode for the pre-shared key (PSK).
    --tag-specifications=: The tags to apply to the VPN connection.
    --transit-gateway-id=: The ID of the transit gateway.
    --type=!: The type of VPN connection (`ipsec.1`).
    --vpn-gateway-id=: The ID of the virtual private gateway.
documentation:
    command: |-
        Creates a VPN connection between an existing virtual private gateway or transit gateway and a customer gateway. The supported connection type is `ipsec.1`.

        The response includes information that you need to give to your network administrator to configure your customer gateway.

        We strongly recommend that you use HTTPS when calling this operation because the response contains sensitive cryptographic information for configuring your customer gateway device.

        If you decide to shut down your VPN connection for any reason and later create a new VPN connection, you must reconfigure your customer gateway with the new information returned from this call.

        This is an idempotent operation. If you perform the operation more than once, Amazon EC2 doesn't return an error.

        For more information, see [Amazon Web Services Site-to-Site VPN](https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html) in the *Amazon Web Services Site-to-Site VPN User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        customer-gateway-id: The ID of the customer gateway.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        options: The options for the VPN connection.
        pre-shared-key-storage: Specifies the storage mode for the pre-shared key (PSK). Valid values are `Standard`" (stored in the Site-to-Site VPN service) or `SecretsManager` (stored in Amazon Web Services Secrets Manager).
        tag-specifications: The tags to apply to the VPN connection.
        transit-gateway-id: The ID of the transit gateway. If you specify a transit gateway, you cannot specify a virtual private gateway.
        type: The type of VPN connection (`ipsec.1`).
        vpn-gateway-id: The ID of the virtual private gateway. If you specify a virtual private gateway, you cannot specify a transit gateway.
