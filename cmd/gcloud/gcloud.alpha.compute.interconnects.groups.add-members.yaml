name: add-members
description: '*(ALPHA)*  Add member interconnects to a Compute Engine interconnect group.'
flags:
    --interconnects=!: Member interconnects to add to or remove from the interconnect group.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute interconnects groups add-members* is used to add member interconnects to an interconnect
        group.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        interconnects: Member interconnects to add to or remove from the interconnect group.
