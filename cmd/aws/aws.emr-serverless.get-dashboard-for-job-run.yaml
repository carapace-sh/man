name: get-dashboard-for-job-run
description: Creates and returns a URL that you can use to access the application UIs for a job run.
flags:
    --access-system-profile-logs: Allows access to system profile logs for Lake Formation-enabled jobs.
    --application-id=!: The ID of the application.
    --attempt=: An optimal parameter that indicates the amount of attempts for the job.
    --job-run-id=!: The ID of the job run.
    --no-access-system-profile-logs: Allows access to system profile logs for Lake Formation-enabled jobs.
documentation:
    command: |-
        Creates and returns a URL that you can use to access the application UIs for a job run.

        For jobs in a running state, the application UI is a live user interface such as the Spark or Tez web UI. For completed jobs, the application UI is a persistent application user interface such as the Spark History Server or persistent Tez UI.

        The URL is valid for one hour after you generate it. To access the application UI after that hour elapses, you must invoke the API again to generate a new URL.
    flag:
        access-system-profile-logs: Allows access to system profile logs for Lake Formation-enabled jobs. Default is false.
        application-id: The ID of the application.
        attempt: An optimal parameter that indicates the amount of attempts for the job. If not specified, this value defaults to the attempt of the latest job.
        job-run-id: The ID of the job run.
