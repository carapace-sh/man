name: remove-lftags-from-resource
description: Removes an LF-tag from the resource.
flags:
    --catalog-id=: The identifier for the Data Catalog.
    --lftags=!: The LF-tags to be removed from the resource.
    --resource=!: The database, table, or column resource where you want to remove an LF-tag.
documentation:
    command: Removes an LF-tag from the resource. Only database, table, or tableWithColumns resource are allowed. To tag columns, use the column inclusion list in `tableWithColumns` to specify column input.
    flag:
        catalog-id: The identifier for the Data Catalog. By default, the account ID. The Data Catalog is the persistent metadata store. It contains database definitions, table definitions, and other control information to manage your Lake Formation environment.
        lftags: The LF-tags to be removed from the resource.
        resource: The database, table, or column resource where you want to remove an LF-tag.
