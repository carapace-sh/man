name: delete-stack-instances
description: Deletes stack instances for the specified accounts, in the specified Amazon Web Services Regions.
flags:
    --accounts=: \[Self-managed permissions] The account IDs of the Amazon Web Services accounts that you want to delete stack instances for.
    --call-as=: \[Service-managed permissions] Specifies whether you are acting as an account administrator in the organization's management account or as a delegated administrator in a member account.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deployment-targets=: \[Service-managed permissions] The Organizations accounts from which to delete stack instances.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-retain-stacks!: Removes the stack instances from the specified StackSet, but doesn't delete the stacks.
    --operation-id=: The unique identifier for this StackSet operation.
    --operation-preferences=: Preferences for how CloudFormation performs this StackSet operation.
    --regions=!: The Amazon Web Services Regions where you want to delete StackSet instances.
    --retain-stacks!: Removes the stack instances from the specified StackSet, but doesn't delete the stacks.
    --stack-set-name=!: The name or unique ID of the StackSet that you want to delete stack instances for.
completion:
    flag:
        call-as:
            - SELF
            - DELEGATED_ADMIN
documentation:
    command: |-
        Deletes stack instances for the specified accounts, in the specified Amazon Web Services Regions.

        The maximum number of organizational unit (OUs) supported by a `DeleteStackInstances` operation is 50.

        If you need more than 50, consider the following options:

        - *Batch processing:* If you don't want to expose your OU hierarchy, split up the operations into multiple calls with less than 50 OUs each.
        - *Parent OU strategy:* If you don't mind exposing the OU hierarchy, target a parent OU that contains all desired child OUs.
    flag:
        accounts: |-
            \[Self-managed permissions] The account IDs of the Amazon Web Services accounts that you want to delete stack instances for.

            You can specify `Accounts` or `DeploymentTargets`, but not both.
        call-as: "\\[Service-managed permissions] Specifies whether you are acting as an account administrator in the organization's management account or as a delegated administrator in a member account.\n\nBy default, `SELF` is specified. Use `SELF` for StackSets with self-managed permissions.\n\n- If you are signed in to the management account, specify `SELF`.\n- If you are signed in to a delegated administrator account, specify `DELEGATED_ADMIN`.\n  \n  Your Amazon Web Services account must be registered as a delegated administrator in the management account. For more information, see [Register a delegated administrator](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-delegated-admin.html) in the *CloudFormation User Guide*."
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deployment-targets: |-
            \[Service-managed permissions] The Organizations accounts from which to delete stack instances.

            You can specify `Accounts` or `DeploymentTargets`, but not both.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        operation-id: |-
            The unique identifier for this StackSet operation.

            If you don't specify an operation ID, the SDK generates one automatically.

            The operation ID also functions as an idempotency token, to ensure that CloudFormation performs the StackSet operation only once, even if you retry the request multiple times. You can retry StackSet operation requests to ensure that CloudFormation successfully received them.

            Repeating this StackSet operation with a new operation ID retries all stack instances whose status is `OUTDATED`.
        operation-preferences: Preferences for how CloudFormation performs this StackSet operation.
        regions: The Amazon Web Services Regions where you want to delete StackSet instances.
        retain-stacks: |-
            Removes the stack instances from the specified StackSet, but doesn't delete the stacks. You can't reassociate a retained stack or add an existing, saved stack to a new stack set.

            For more information, see [StackSet operation options](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-concepts.html#stackset-ops-options).
        stack-set-name: The name or unique ID of the StackSet that you want to delete stack instances for.
