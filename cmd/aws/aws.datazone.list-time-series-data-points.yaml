name: list-time-series-data-points
description: Lists time series data points.
flags:
    --domain-identifier=!: The ID of the Amazon DataZone domain that houses the assets for which you want to list time series data points.
    --ended-at=: The timestamp at which the data points that you wanted to list ended.
    --entity-identifier=!: The ID of the asset for which you want to list data points.
    --entity-type=!: The type of the asset for which you want to list data points.
    --form-name=!: The name of the time series data points form.
    --max-results=: The maximum number of data points to return in a single call to ListTimeSeriesDataPoints.
    --next-token=: When the number of data points is greater than the default value for the MaxResults parameter, or if you explicitly specify a value for MaxResults that is less than the number of data points, the response includes a pagination token named NextToken.
    --started-at=: The timestamp at which the data points that you want to list started.
completion:
    flag:
        entity-type:
            - ASSET
            - LISTING
documentation:
    command: Lists time series data points.
    flag:
        domain-identifier: The ID of the Amazon DataZone domain that houses the assets for which you want to list time series data points.
        ended-at: The timestamp at which the data points that you wanted to list ended.
        entity-identifier: The ID of the asset for which you want to list data points.
        entity-type: The type of the asset for which you want to list data points.
        form-name: The name of the time series data points form.
        max-results: The maximum number of data points to return in a single call to ListTimeSeriesDataPoints. When the number of data points to be listed is greater than the value of MaxResults, the response contains a NextToken value that you can use in a subsequent call to ListTimeSeriesDataPoints to list the next set of data points.
        next-token: When the number of data points is greater than the default value for the MaxResults parameter, or if you explicitly specify a value for MaxResults that is less than the number of data points, the response includes a pagination token named NextToken. You can specify this NextToken value in a subsequent call to ListTimeSeriesDataPoints to list the next set of data points.
        started-at: The timestamp at which the data points that you want to list started.
