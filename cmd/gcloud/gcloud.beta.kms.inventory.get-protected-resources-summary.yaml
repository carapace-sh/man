name: get-protected-resources-summary
description: '*(BETA)*  Gets the protected resources summary.'
flags:
    --keyname=!: ID of the key or fully qualified identifier for the key.
    --keyring=: The KMS keyring of the key.
    --location=: The Google Cloud location for the key.
documentation:
    command: |
        *(BETA)*  *gcloud beta kms inventory get-protected-resources-summary* returns a summary of the resources a key is protecting.

        The summary includes how many projects contain protected resources,
        how many protected resources there are, what are the types of protected
        resources, and the count for each type of protected resource.
    flag:
        keyname: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `key` attribute:
            * provide the argument `--keyname` on the command line.
        keyring: |-
            The KMS keyring of the key.
            +
            To set the `keyring` attribute:
            * provide the argument `--keyname` on the command line with a fully specified name;
            * provide the argument `--keyring` on the command line.
        location: |-
            The Google Cloud location for the key.
            +
            To set the `location` attribute:
            * provide the argument `--keyname` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
