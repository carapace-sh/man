name: list-resolver-rules
description: Lists the Resolver rules that were created using the current Amazon Web Services account.
flags:
    --filters=: An optional specification to return a subset of Resolver rules, such as all Resolver rules that are associated with the same Resolver endpoint.
    --max-results=: The maximum number of Resolver rules that you want to return in the response to a `ListResolverRules` request.
    --next-token=: For the first `ListResolverRules` request, omit this value.
documentation:
    command: Lists the Resolver rules that were created using the current Amazon Web Services account.
    flag:
        filters: |-
            An optional specification to return a subset of Resolver rules, such as all Resolver rules that are associated with the same Resolver endpoint.

            If you submit a second or subsequent `ListResolverRules` request and specify the `NextToken` parameter, you must use the same values for `Filters`, if any, as in the previous request.
        max-results: The maximum number of Resolver rules that you want to return in the response to a `ListResolverRules` request. If you don't specify a value for `MaxResults`, Resolver returns up to 100 Resolver rules.
        next-token: |-
            For the first `ListResolverRules` request, omit this value.

            If you have more than `MaxResults` Resolver rules, you can submit another `ListResolverRules` request to get the next group of Resolver rules. In the next request, specify the value of `NextToken` from the previous response.
