name: tag-resource
description: This operation puts tags on the resource you indicate.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) that uniquely identifies the resource.
    --tags=!: Required tags to include.
documentation:
    command: This operation puts tags on the resource you indicate.
    flag:
        resource-arn: |-
            The Amazon Resource Name (ARN) that uniquely identifies the resource.

            This is the resource that will have the indicated tags.
        tags: 'Required tags to include. A tag is a key-value pair you can use to manage, filter, and search for your resources. Allowed characters include UTF-8 letters, numbers, spaces, and the following characters: + - = . _ : /.'
