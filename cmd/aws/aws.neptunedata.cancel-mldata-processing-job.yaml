name: cancel-mldata-processing-job
description: Cancels a Neptune ML data processing job.
flags:
    --clean: If set to `TRUE`, this flag specifies that all Neptune ML S3 artifacts should be deleted when the job is stopped.
    --id=!: The unique identifier of the data-processing job.
    --neptune-iam-role-arn=: The ARN of an IAM role that provides Neptune access to SageMaker and Amazon S3 resources.
    --no-clean&: If set to `TRUE`, this flag specifies that all Neptune ML S3 artifacts should be deleted when the job is stopped.
documentation:
    command: |-
        Cancels a Neptune ML data processing job. See [The `dataprocessing` command](https://docs.aws.amazon.com/neptune/latest/userguide/machine-learning-api-dataprocessing.html).

        When invoking this operation in a Neptune cluster that has IAM authentication enabled, the IAM user or role making the request must have a policy attached that allows the [neptune-db:CancelMLDataProcessingJob](https://docs.aws.amazon.com/neptune/latest/userguide/iam-dp-actions.html#cancelmldataprocessingjob) IAM action in that cluster.
    flag:
        clean: If set to `TRUE`, this flag specifies that all Neptune ML S3 artifacts should be deleted when the job is stopped. The default is `FALSE`.
        id: The unique identifier of the data-processing job.
        neptune-iam-role-arn: The ARN of an IAM role that provides Neptune access to SageMaker and Amazon S3 resources. This must be listed in your DB cluster parameter group or an error will occur.
