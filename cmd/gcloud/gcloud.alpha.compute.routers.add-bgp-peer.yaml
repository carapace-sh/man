    --bfd-min-transmit-interval=: The minimum transmit interval between BFD control packets.
    --bfd-multiplier=: The number of consecutive BFD control packets that must be missed before BFD declares that a peer is unavailable.
    --bfd-session-initialization-mode=: The BFD session initialization mode for this BGP peer.
    --custom-learned-route-priority=: An integral value `0` <= priority <= `65535`, to be applied to all
    --enable-ipv4: If IPv4 is enabled, the peer connection can be established with IPv4 route exchange.
    --enable-ipv6: If IPv6 is enabled, the peer connection can be established with IPv6 route exchange.
    --enabled: If enabled, the peer connection can be established with routing information.
    --export-policies=: Comma-separated list of export policies.
