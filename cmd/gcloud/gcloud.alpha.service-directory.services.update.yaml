name: update
description: '*(ALPHA)*  Updates a service.'
flags:
    --location=: The name of the region for the service.
    --metadata=: Metadata for the service.
    --namespace=: The name of the namespace for the service.
documentation:
    command: '*(ALPHA)*  Updates a service.'
    flag:
        location: |-
            The name of the region for the service.
            +
            To set the `location` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        metadata: |-
            Metadata for the service.
            +
            Metadata takes the form of key/value string pairs. Keys are
            composed of an optional prefix and a name segment, separated by a
            slash(/). Prefixes and names must be composed of alphanumeric
            characters, dashes, and dots. Names may also use underscores. There
            are no character restrictions on what may go into the value of a
            metadata. The entire dictionary is limited to 2000 characters, spread
            across all key-value pairs.
        namespace: |-
            The name of the namespace for the service.
            +
            To set the `namespace` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--namespace` on the command line.
