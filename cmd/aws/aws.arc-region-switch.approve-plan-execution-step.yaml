name: approve-plan-execution-step
description: Approves a step in a plan execution that requires manual approval.
flags:
    --approval=!: The status of approval for a plan execution step.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --comment=: A comment that you can enter about a plan execution.
    --execution-id=!: The execution identifier of a plan execution.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --plan-arn=!: The Amazon Resource Name (ARN) of the plan.
    --step-name=!: The name of a step in a plan execution.
completion:
    flag:
        approval:
            - approve
            - decline
documentation:
    command: |-
        Approves a step in a plan execution that requires manual approval. When you create a plan, you can include approval steps that require manual intervention before the execution can proceed. This operation allows you to provide that approval.

        You must specify the plan ARN, execution ID, step name, and approval status. You can also provide an optional comment explaining the approval decision.
    flag:
        approval: The status of approval for a plan execution step.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        comment: A comment that you can enter about a plan execution.
        execution-id: The execution identifier of a plan execution.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        plan-arn: The Amazon Resource Name (ARN) of the plan.
        step-name: The name of a step in a plan execution.
