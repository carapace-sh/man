name: update
description: '*(ALPHA)*  Update a Marketplace Solution instance.'
hidden: true
flags:
    --memory-gib=: The memory size used to create instance in Gib
    --region=: Region of the resource.
    --virtual-cpu-cores=: Processor for the instance
documentation:
    command: |
        *(ALPHA)*  Update a Marketplace Solution instance.

        This call returns immediately, but the update operation may take
        several minutes to complete. To check if the operation is complete,
        use the `describe` command for the instance.
    flag:
        memory-gib: The memory size used to create instance in Gib
        region: |-
            Region of the resource.
            +
            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        virtual-cpu-cores: Processor for the instance
