name: concurrency-limit
description: '*(ALPHA)*  Create a Compute Engine VM Maintenance Resource Policy.'
flags:
    --description=: An optional, textual description for the backend.
    --max-percent=: Sets maximum percentage of instances in the group that can undergo simultaneous maintenance.
    --region=: Region of the resource policy to operate on.
documentation:
    command: |
        *(ALPHA)*  Create a Compute Engine VM Maintenance Resource Policy that,
        when attached to an instance, recognizes that instance as a part of a group of
        instances where only up the configured amount of instances in that group can
        undergo simultaneous maintenance.
    flag:
        description: An optional, textual description for the backend.
        max-percent: 'Sets maximum percentage of instances in the group that can undergo simultaneous maintenance. If this flag is not specified default value of 1% will be set. Usage example: `--max-percent=10` sets to 10%.'
        region: |-
            Region of the resource policy to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
