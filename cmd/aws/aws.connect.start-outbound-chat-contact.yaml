name: start-outbound-chat-contact
description: Initiates a new outbound SMS contact to a customer.
flags:
    --attributes=: A custom key-value pair using an attribute map.
    --chat-duration-in-minutes=: The total duration of the newly started chat session.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --contact-flow-id=!: The identifier of the flow for the call.
    --destination-endpoint=!: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --initial-system-message=: ""
    --instance-id=!: The identifier of the Amazon Connect instance.
    --participant-details=: ""
    --related-contact-id=: The unique identifier for an Amazon Connect contact.
    --segment-attributes=!: A set of system defined key-value pairs stored on individual contact segments using an attribute map.
    --source-endpoint=!: ""
    --supported-messaging-content-types=: The supported chat message content types.
documentation:
    command: |-
        Initiates a new outbound SMS contact to a customer. Response of this API provides the `ContactId` of the outbound SMS contact created.

        **SourceEndpoint** only supports Endpoints with `CONNECT_PHONENUMBER_ARN` as Type and **DestinationEndpoint** only supports Endpoints with `TELEPHONE_NUMBER` as Type. **ContactFlowId** initiates the flow to manage the new SMS contact created.

        This API can be used to initiate outbound SMS contacts for an agent, or it can also deflect an ongoing contact to an outbound SMS contact by using the [StartOutboundChatContact](https://docs.aws.amazon.com/connect/latest/APIReference/API_StartOutboundChatContact.html) Flow Action.

        For more information about using SMS in Amazon Connect, see the following topics in the *Amazon Connect Administrator Guide*:

        - [Set up SMS messaging](https://docs.aws.amazon.com/connect/latest/adminguide/setup-sms-messaging.html)
        - [Request an SMS-enabled phone number through AWS End User Messaging SMS](https://docs.aws.amazon.com/connect/latest/adminguide/sms-number.html)
    flag:
        attributes: A custom key-value pair using an attribute map. The attributes are standard Amazon Connect attributes, and can be accessed in flows just like any other contact attributes.
        chat-duration-in-minutes: The total duration of the newly started chat session. If not specified, the chat session duration defaults to 25 hour. The minimum configurable time is 60 minutes. The maximum configurable time is 10,080 minutes (7 days).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the AWS SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/). The token is valid for 7 days after creation. If a contact is already started, the contact ID is returned.
        contact-flow-id: |-
            The identifier of the flow for the call. To see the ContactFlowId in the Amazon Connect console user interface, on the navigation menu go to **Routing, Contact Flows**. Choose the flow. On the flow page, under the name of the flow, choose **Show additional flow information**. The ContactFlowId is the last part of the ARN, shown here in bold:

            - arn:aws:connect:us-west-2:xxxxxxxxxxxx:instance/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx/contact-flow/**123ec456-a007-89c0-1234-xxxxxxxxxxxx**
        destination-endpoint: ""
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        initial-system-message: ""
        instance-id: The identifier of the Amazon Connect instance. You can find the instance ID in the Amazon Resource Name (ARN) of the instance.
        participant-details: ""
        related-contact-id: The unique identifier for an Amazon Connect contact. This identifier is related to the contact starting.
        segment-attributes: |-
            A set of system defined key-value pairs stored on individual contact segments using an attribute map. The attributes are standard Amazon Connect attributes. They can be accessed in flows.

            - Attribute keys can include only alphanumeric, `-`, and `_`.
            - This field can be used to show channel subtype, such as `connect:Guide` and `connect:SMS`.
        source-endpoint: ""
        supported-messaging-content-types: |-
            The supported chat message content types. Supported types are:

            - `text/plain`
            - `text/markdown`
            - `application/json, application/vnd.amazonaws.connect.message.interactive`
            - `application/vnd.amazonaws.connect.message.interactive.response`

            Content types must always contain `text/plain`. You can then put any other supported type in the list. For example, all the following lists are valid because they contain `text/plain`:

            - `[text/plain, text/markdown, application/json]`
            - `[text/markdown, text/plain]`
            - `[text/plain, application/json, application/vnd.amazonaws.connect.message.interactive.response]`
