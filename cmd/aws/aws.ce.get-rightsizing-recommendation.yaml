name: get-rightsizing-recommendation
description: Creates recommendations that help you save cost by identifying idle and underutilized Amazon EC2 instances.
flags:
    --configuration=: You can use Configuration to customize recommendations across two attributes.
    --filter=: ""
    --next-page-token=: The pagination token that indicates the next set of results that you want to retrieve.
    --page-size=: The number of recommendations that you want returned in a single response object.
    --service=!: The specific service that you want recommendations for.
documentation:
    command: |-
        Creates recommendations that help you save cost by identifying idle and underutilized Amazon EC2 instances.

        Recommendations are generated to either downsize or terminate instances, along with providing savings detail and metrics. For more information about calculation and function, see [Optimizing Your Cost with Rightsizing Recommendations](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/ce-rightsizing.html) in the *Billing and Cost Management User Guide*.
    flag:
        configuration: You can use Configuration to customize recommendations across two attributes. You can choose to view recommendations for instances within the same instance families or across different instance families. You can also choose to view your estimated savings that are associated with recommendations with consideration of existing Savings Plans or RI benefits, or neither.
        filter: ""
        next-page-token: The pagination token that indicates the next set of results that you want to retrieve.
        page-size: The number of recommendations that you want returned in a single response object.
        service: The specific service that you want recommendations for. The only valid value for `GetRightsizingRecommendation` is "`AmazonEC2`".
