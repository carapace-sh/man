name: list-jobs
description: Returns an array of `JobListEntry` objects of the specified length.
flags:
    --max-results=: The number of `JobListEntry` objects to return.
    --next-token=: HTTP requests are stateless.
documentation:
    command: Returns an array of `JobListEntry` objects of the specified length. Each `JobListEntry` object contains a job's state, a job's ID, and a value that indicates whether the job is a job part, in the case of export jobs. Calling this API action in one of the US regions will return jobs from the list of all jobs associated with this account in all US regions.
    flag:
        max-results: The number of `JobListEntry` objects to return.
        next-token: HTTP requests are stateless. To identify what object comes "next" in the list of `JobListEntry` objects, you have the option of specifying `NextToken` as the starting point for your returned list.
