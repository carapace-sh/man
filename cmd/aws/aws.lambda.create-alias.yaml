name: create-alias
description: Creates an [alias](https://docs.aws.amazon.com/lambda/latest/dg/configuration-aliases.html) for a Lambda function version.
flags:
    --description=: A description of the alias.
    --function-name=!: The name or ARN of the Lambda function.
    --function-version=!: The function version that the alias invokes.
    --name=!: The name of the alias.
    --routing-config=: The [routing configuration](https://docs.aws.amazon.com/lambda/latest/dg/configuration-aliases.html#configuring-alias-routing) of the alias.
documentation:
    command: |-
        Creates an [alias](https://docs.aws.amazon.com/lambda/latest/dg/configuration-aliases.html) for a Lambda function version. Use aliases to provide clients with a function identifier that you can update to invoke a different version.

        You can also map an alias to split invocation requests between two versions. Use the `RoutingConfig` parameter to specify a second version and the percentage of invocation requests that it receives.
    flag:
        description: A description of the alias.
        function-name: |-
            The name or ARN of the Lambda function.

            **Name formats**

            - **Function name** - `MyFunction`.
            - **Function ARN** - `arn:aws:lambda:us-west-2:123456789012:function:MyFunction`.
            - **Partial ARN** - `123456789012:function:MyFunction`.

            The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        function-version: The function version that the alias invokes.
        name: The name of the alias.
        routing-config: The [routing configuration](https://docs.aws.amazon.com/lambda/latest/dg/configuration-aliases.html#configuring-alias-routing) of the alias.
