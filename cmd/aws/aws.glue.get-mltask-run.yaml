name: get-mltask-run
description: Gets details for a specific task run on a machine learning transform.
flags:
    --task-run-id=!: The unique identifier of the task run.
    --transform-id=!: The unique identifier of the machine learning transform.
documentation:
    command: Gets details for a specific task run on a machine learning transform. Machine learning task runs are asynchronous tasks that Glue runs on your behalf as part of various machine learning workflows. You can check the stats of any task run by calling `GetMLTaskRun` with the `TaskRunID` and its parent transform's `TransformID`.
    flag:
        task-run-id: The unique identifier of the task run.
        transform-id: The unique identifier of the machine learning transform.
