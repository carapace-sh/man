name: update
description: Update a service connection policy.
flags:
    --allowed-google-producers-resource-hierarchy-level=: List of projects, folders, or orgs where the producer instance can be located in the form "projects/123456789", folders/123456789", or "organizations/123456789".
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the Service Connection Policy to be updated.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --producer-instance-location=: Option that determines where the producer instances can be located for which connections can be created in the network controlled by this policy.
    --psc-connection-limit=: Max number of PSC connections for this policy.
    --region=: For resources [service_connection_policy, subnets], provides fallback value for resource region attribute.
    --subnets=!: IDs of the subnetworks or fully qualified identifiers for the subnetworks.
completion:
    flag:
        producer-instance-location:
            - custom-resource-hierarchy-levels
            - none
documentation:
    command: Update a Service Connection Policy with the given name.
    flag:
        allowed-google-producers-resource-hierarchy-level: List of projects, folders, or orgs where the producer instance can be located in the form "projects/123456789", folders/123456789", or "organizations/123456789".
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description of the Service Connection Policy to be updated.
        labels: List of label KEY=VALUE pairs to add.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        producer-instance-location: |-
            Option that determines where the producer instances can be located for which connections can be created in the network controlled by this policy. _PRODUCER_INSTANCE_LOCATION_ must be one of:
            +
            *custom-resource-hierarchy-levels*::: The producer instance must be located in one of the values provided in the allowed-google-producers-resource-hierarchy-level flag.
            *none*::: The producer instance must be within the same project as this connection policy.
            :::
            +
        psc-connection-limit: Max number of PSC connections for this policy.
        region: For resources [service_connection_policy, subnets], provides fallback value for resource region attribute. When the resource's full URI path is not provided, region will fallback to this flag value.
        subnets: |-
            IDs of the subnetworks or fully qualified identifiers for the subnetworks.
            +
            To set the `subnetwork` attribute:
            * provide the argument `--subnets` on the command line.
