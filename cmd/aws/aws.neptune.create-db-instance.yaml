name: create-db-instance
description: Creates a new DB instance.
flags:
    --allocated-storage=: Not supported by Neptune.
    --auto-minor-version-upgrade: Indicates that minor engine upgrades are applied automatically to the DB instance during the maintenance window.
    --availability-zone=: The EC2 Availability Zone that the DB instance is created in
    --backup-retention-period=: The number of days for which automated backups are retained.
    --character-set-name=: '*(Not supported by Neptune)*'
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --copy-tags-to-snapshot: True to copy all tags from the DB instance to snapshots of the DB instance, and otherwise false.
    --db-cluster-identifier=!: The identifier of the DB cluster that the instance will belong to.
    --db-instance-class=!: The compute and memory capacity of the DB instance, for example, `db.m4.large`. Not all DB instance classes are available in all Amazon Regions.
    --db-instance-identifier=!: The DB instance identifier.
    --db-name=: Not supported.
    --db-parameter-group-name=: The name of the DB parameter group to associate with this DB instance.
    --db-security-groups=:
        description: A list of DB security groups to associate with this DB instance.
        nargs: -1
    --db-subnet-group-name=: A DB subnet group to associate with this DB instance.
    --deletion-protection: A value that indicates whether the DB instance has deletion protection enabled.
    --domain-iam-role-name=: Specify the name of the IAM role to be used when making API calls to the Directory Service.
    --domain=: Specify the Active Directory Domain to create the instance in.
    --enable-cloudwatch-logs-exports=:
        description: The list of log types that need to be enabled for exporting to CloudWatch Logs.
        nargs: -1
    --enable-iam-database-authentication: Not supported by Neptune (ignored).
    --enable-performance-insights: '*(Not supported by Neptune)*'
    --engine-version=: The version number of the database engine to use.
    --engine=!: The name of the database engine to be used for this instance.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iops=: The amount of Provisioned IOPS (input/output operations per second) to be initially allocated for the DB instance.
    --kms-key-id=: The Amazon KMS key identifier for an encrypted DB instance.
    --license-model=: License model information for this DB instance.
    --master-user-password=: Not supported by Neptune.
    --master-username=: Not supported by Neptune.
    --monitoring-interval=: The interval, in seconds, between points when Enhanced Monitoring metrics are collected for the DB instance.
    --monitoring-role-arn=: The ARN for the IAM role that permits Neptune to send enhanced monitoring metrics to Amazon CloudWatch Logs.
    --multi-az: Specifies if the DB instance is a Multi-AZ deployment.
    --no-auto-minor-version-upgrade: Indicates that minor engine upgrades are applied automatically to the DB instance during the maintenance window.
    --no-copy-tags-to-snapshot: True to copy all tags from the DB instance to snapshots of the DB instance, and otherwise false.
    --no-deletion-protection: A value that indicates whether the DB instance has deletion protection enabled.
    --no-enable-iam-database-authentication: Not supported by Neptune (ignored).
    --no-enable-performance-insights: '*(Not supported by Neptune)*'
    --no-multi-az: Specifies if the DB instance is a Multi-AZ deployment.
    --no-publicly-accessible: Indicates whether the DB instance is publicly accessible.
    --no-storage-encrypted: Specifies whether the DB instance is encrypted.
    --option-group-name=: '*(Not supported by Neptune)*'
    --performance-insights-kms-key-id=: '*(Not supported by Neptune)*'
    --port=: The port number on which the database accepts connections.
    --preferred-backup-window=: The daily time range during which automated backups are created.
    --preferred-maintenance-window=: The time range each week during which system maintenance can occur, in Universal Coordinated Time (UTC).
    --promotion-tier=: A value that specifies the order in which an Read Replica is promoted to the primary instance after a failure of the existing primary instance.
    --publicly-accessible: Indicates whether the DB instance is publicly accessible.
    --storage-encrypted: Specifies whether the DB instance is encrypted.
    --storage-type=: Not applicable.
    --tags=:
        description: The tags to assign to the new instance.
        nargs: -1
    --tde-credential-arn=: The ARN from the key store with which to associate the instance for TDE encryption.
    --tde-credential-password=: The password for the given ARN from the key store in order to access the device.
    --timezone=: The time zone of the DB instance.
    --vpc-security-group-ids=:
        description: A list of EC2 VPC security groups to associate with this DB instance.
        nargs: -1
documentation:
    command: Creates a new DB instance.
    flag:
        allocated-storage: Not supported by Neptune.
        auto-minor-version-upgrade: |-
            Indicates that minor engine upgrades are applied automatically to the DB instance during the maintenance window.

            Default: `true`
        availability-zone: |-
            The EC2 Availability Zone that the DB instance is created in

            Default: A random, system-chosen Availability Zone in the endpoint's Amazon Region.

            Example: `us-east-1d`

            Constraint: The AvailabilityZone parameter can't be specified if the MultiAZ parameter is set to `true`. The specified Availability Zone must be in the same Amazon Region as the current endpoint.
        backup-retention-period: |-
            The number of days for which automated backups are retained.

            Not applicable. The retention period for automated backups is managed by the DB cluster. For more information, see [CreateDBCluster]().

            Default: 1

            Constraints:

            - Must be a value from 0 to 35
            - Cannot be set to 0 if the DB instance is a source to Read Replicas
        character-set-name: '*(Not supported by Neptune)*'
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        copy-tags-to-snapshot: True to copy all tags from the DB instance to snapshots of the DB instance, and otherwise false. The default is false.
        db-cluster-identifier: |-
            The identifier of the DB cluster that the instance will belong to.

            For information on creating a DB cluster, see [CreateDBCluster]().

            Type: String
        db-instance-class: The compute and memory capacity of the DB instance, for example, `db.m4.large`. Not all DB instance classes are available in all Amazon Regions.
        db-instance-identifier: |-
            The DB instance identifier. This parameter is stored as a lowercase string.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens.
            - First character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.

            Example: `mydbinstance`
        db-name: Not supported.
        db-parameter-group-name: |-
            The name of the DB parameter group to associate with this DB instance. If this argument is omitted, the default DBParameterGroup for the specified engine is used.

            Constraints:

            - Must be 1 to 255 letters, numbers, or hyphens.
            - First character must be a letter
            - Cannot end with a hyphen or contain two consecutive hyphens
        db-security-groups: |-
            A list of DB security groups to associate with this DB instance.

            Default: The default DB security group for the database engine.
        db-subnet-group-name: |-
            A DB subnet group to associate with this DB instance.

            If there is no DB subnet group, then it is a non-VPC DB instance.
        deletion-protection: |-
            A value that indicates whether the DB instance has deletion protection enabled. The database can't be deleted when deletion protection is enabled. By default, deletion protection is disabled. See [Deleting a DB Instance](https://docs.aws.amazon.com/neptune/latest/userguide/manage-console-instances-delete.html).

            DB instances in a DB cluster can be deleted even when deletion protection is enabled in their parent DB cluster.
        domain: Specify the Active Directory Domain to create the instance in.
        domain-iam-role-name: Specify the name of the IAM role to be used when making API calls to the Directory Service.
        enable-cloudwatch-logs-exports: The list of log types that need to be enabled for exporting to CloudWatch Logs.
        enable-iam-database-authentication: Not supported by Neptune (ignored).
        enable-performance-insights: '*(Not supported by Neptune)*'
        engine: |-
            The name of the database engine to be used for this instance.

            Valid Values: `neptune`
        engine-version: The version number of the database engine to use. Currently, setting this parameter has no effect.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iops: The amount of Provisioned IOPS (input/output operations per second) to be initially allocated for the DB instance.
        kms-key-id: |-
            The Amazon KMS key identifier for an encrypted DB instance.

            The KMS key identifier is the Amazon Resource Name (ARN) for the KMS encryption key. If you are creating a DB instance with the same Amazon account that owns the KMS encryption key used to encrypt the new DB instance, then you can use the KMS key alias instead of the ARN for the KM encryption key.

            Not applicable. The KMS key identifier is managed by the DB cluster. For more information, see [CreateDBCluster]().

            If the `StorageEncrypted` parameter is true, and you do not specify a value for the `KmsKeyId` parameter, then Amazon Neptune will use your default encryption key. Amazon KMS creates the default encryption key for your Amazon account. Your Amazon account has a different default encryption key for each Amazon Region.
        license-model: |-
            License model information for this DB instance.

            Valid values: `license-included` | `bring-your-own-license` | `general-public-license`
        master-user-password: Not supported by Neptune.
        master-username: Not supported by Neptune.
        monitoring-interval: |-
            The interval, in seconds, between points when Enhanced Monitoring metrics are collected for the DB instance. To disable collecting Enhanced Monitoring metrics, specify 0. The default is 0.

            If `MonitoringRoleArn` is specified, then you must also set `MonitoringInterval` to a value other than 0.

            Valid Values: `0, 1, 5, 10, 15, 30, 60`
        monitoring-role-arn: |-
            The ARN for the IAM role that permits Neptune to send enhanced monitoring metrics to Amazon CloudWatch Logs. For example, `arn:aws:iam:123456789012:role/emaccess`.

            If `MonitoringInterval` is set to a value other than 0, then you must supply a `MonitoringRoleArn` value.
        multi-az: Specifies if the DB instance is a Multi-AZ deployment. You can't set the AvailabilityZone parameter if the MultiAZ parameter is set to true.
        option-group-name: '*(Not supported by Neptune)*'
        performance-insights-kms-key-id: '*(Not supported by Neptune)*'
        port: |-
            The port number on which the database accepts connections.

            Not applicable. The port is managed by the DB cluster. For more information, see [CreateDBCluster]().

            Default: `8182`

            Type: Integer
        preferred-backup-window: |-
            The daily time range during which automated backups are created.

            Not applicable. The daily time range for creating automated backups is managed by the DB cluster. For more information, see [CreateDBCluster]().
        preferred-maintenance-window: |-
            The time range each week during which system maintenance can occur, in Universal Coordinated Time (UTC).

            Format: `ddd:hh24:mi-ddd:hh24:mi`

            The default is a 30-minute window selected at random from an 8-hour block of time for each Amazon Region, occurring on a random day of the week.

            Valid Days: Mon, Tue, Wed, Thu, Fri, Sat, Sun.

            Constraints: Minimum 30-minute window.
        promotion-tier: |-
            A value that specifies the order in which an Read Replica is promoted to the primary instance after a failure of the existing primary instance.

            Default: 1

            Valid Values: 0 - 15
        publicly-accessible: |-
            Indicates whether the DB instance is publicly accessible.

            When the DB instance is publicly accessible and you connect from outside of the DB instance's virtual private cloud (VPC), its Domain Name System (DNS) endpoint resolves to the public IP address. When you connect from within the same VPC as the DB instance, the endpoint resolves to the private IP address. Access to the DB instance is ultimately controlled by the security group it uses. That public access isn't permitted if the security group assigned to the DB cluster doesn't permit it.

            When the DB instance isn't publicly accessible, it is an internal DB instance with a DNS name that resolves to a private IP address.
        storage-encrypted: |-
            Specifies whether the DB instance is encrypted.

            Not applicable. The encryption for DB instances is managed by the DB cluster. For more information, see [CreateDBCluster]().

            Default: false
        storage-type: Not applicable. In Neptune the storage type is managed at the DB Cluster level.
        tags: The tags to assign to the new instance.
        tde-credential-arn: The ARN from the key store with which to associate the instance for TDE encryption.
        tde-credential-password: The password for the given ARN from the key store in order to access the device.
        timezone: The time zone of the DB instance.
        vpc-security-group-ids: |-
            A list of EC2 VPC security groups to associate with this DB instance.

            Not applicable. The associated list of EC2 VPC security groups is managed by the DB cluster. For more information, see [CreateDBCluster]().

            Default: The default EC2 VPC security group for the DB subnet group's VPC.
