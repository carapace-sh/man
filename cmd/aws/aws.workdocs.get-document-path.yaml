name: get-document-path
description: Retrieves the path information (the hierarchy from the root folder) for the requested document.
flags:
    --authentication-token=: Amazon WorkDocs authentication token.
    --document-id=!: The ID of the document.
    --fields=: A comma-separated list of values.
    --limit=: The maximum number of levels in the hierarchy to return.
    --marker=: This value is not supported.
documentation:
    command: |-
        Retrieves the path information (the hierarchy from the root folder) for the requested document.

        By default, Amazon WorkDocs returns a maximum of 100 levels upwards from the requested document and only includes the IDs of the parent folders in the path. You can limit the maximum number of levels. You can also request the names of the parent folders.
    flag:
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        document-id: The ID of the document.
        fields: A comma-separated list of values. Specify `NAME` to include the names of the parent folders.
        limit: The maximum number of levels in the hierarchy to return.
        marker: This value is not supported.
