name: describe
description: '*(BETA)*  Describe a Compute Engine external VPN gateway.'
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute external-vpn-gateways describe* is used to display all data associated with a Compute Engine
        external VPN gateway in a project.

        An external VPN gateway provides the information to Google Cloud
        about your on-premises side or another Cloud provider's VPN gateway.
