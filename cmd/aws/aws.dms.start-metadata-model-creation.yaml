name: start-metadata-model-creation
description: Creates source metadata model of the given type with the specified properties for schema conversion operations.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metadata-model-name=!: The name of the metadata model.
    --migration-project-identifier=!: The migration project name or Amazon Resource Name (ARN).
    --properties=!: The properties of metadata model in JSON format.
    --selection-rules=!: The JSON string that specifies the location where the metadata model will be created.
documentation:
    command: |-
        Creates source metadata model of the given type with the specified properties for schema conversion operations.

        This action supports only these directions: from SQL Server to Aurora PostgreSQL, or from SQL Server to RDS for PostgreSQL.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metadata-model-name: The name of the metadata model.
        migration-project-identifier: The migration project name or Amazon Resource Name (ARN).
        properties: The properties of metadata model in JSON format. This object is a Union. Only one member of this object can be specified or returned.
        selection-rules: The JSON string that specifies the location where the metadata model will be created. Selection rules must specify a single schema. For more information, see Selection Rules in the DMS User Guide.
