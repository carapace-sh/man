name: delete-signaling-channel
description: Deletes a specified signaling channel.
flags:
    --channel-arn=!: The Amazon Resource Name (ARN) of the signaling channel that you want to delete.
    --current-version=: The current version of the signaling channel that you want to delete.
documentation:
    command: Deletes a specified signaling channel. `DeleteSignalingChannel` is an asynchronous operation. If you don't specify the channel's current version, the most recent version is deleted.
    flag:
        channel-arn: The Amazon Resource Name (ARN) of the signaling channel that you want to delete.
        current-version: The current version of the signaling channel that you want to delete. You can obtain the current version by invoking the `DescribeSignalingChannel` or `ListSignalingChannels` API operations.
