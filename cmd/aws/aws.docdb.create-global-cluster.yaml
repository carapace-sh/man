name: create-global-cluster
description: Creates an Amazon DocumentDB global cluster that can span multiple multiple Amazon Web Services Regions.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --database-name=: The name for your database of up to 64 alpha-numeric characters.
    --deletion-protection: The deletion protection setting for the new global cluster.
    --engine-version=: The engine version of the global cluster.
    --engine=: The name of the database engine to be used for this cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-cluster-identifier=!: The cluster identifier of the new global cluster.
    --no-deletion-protection: The deletion protection setting for the new global cluster.
    --no-storage-encrypted: The storage encryption setting for the new global cluster.
    --source-db-cluster-identifier=: The Amazon Resource Name (ARN) to use as the primary cluster of the global cluster.
    --storage-encrypted: The storage encryption setting for the new global cluster.
documentation:
    command: |-
        Creates an Amazon DocumentDB global cluster that can span multiple multiple Amazon Web Services Regions. The global cluster contains one primary cluster with read-write capability, and up-to 10 read-only secondary clusters. Global clusters uses storage-based fast replication across regions with latencies less than one second, using dedicated infrastructure with no impact to your workload’s performance.

        You can create a global cluster that is initially empty, and then add a primary and a secondary to it. Or you can specify an existing cluster during the create operation, and this cluster becomes the primary of the global cluster.

        This action only applies to Amazon DocumentDB clusters.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        database-name: The name for your database of up to 64 alpha-numeric characters. If you do not provide a name, Amazon DocumentDB will not create a database in the global cluster you are creating.
        deletion-protection: The deletion protection setting for the new global cluster. The global cluster can't be deleted when deletion protection is enabled.
        engine: The name of the database engine to be used for this cluster.
        engine-version: The engine version of the global cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-cluster-identifier: The cluster identifier of the new global cluster.
        source-db-cluster-identifier: The Amazon Resource Name (ARN) to use as the primary cluster of the global cluster. This parameter is optional.
        storage-encrypted: The storage encryption setting for the new global cluster.
