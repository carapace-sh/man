name: datastore-indexes-xml-to-yaml
description: '*(BETA)*  Translates a datastore-indexes.xml into index.yaml.'
flags:
    --generated-indexes-file=: If specified, include the auto-generated xml file too, and merge the resulting entries appropriately.
documentation:
    command: '*(BETA)*  Convert a datastore-indexes.xml file to index.yaml.'
    flag:
        generated-indexes-file: If specified, include the auto-generated xml file too, and merge the resulting entries appropriately. Note that this file is usually named `WEB-INF/appengine-generated/datastore-indexes-auto.xml`.
