name: update-organization-configuration
description: Updates the configuration of your organization in Security Hub.
flags:
    --auto-enable!: Whether to automatically enable Security Hub in new member accounts when they join the organization.
    --auto-enable-standards=: Whether to automatically enable Security Hub [default standards](https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards-enable-disable.html) in new member accounts when they join the organization.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-auto-enable!: Whether to automatically enable Security Hub in new member accounts when they join the organization.
    --organization-configuration=: ""
completion:
    flag:
        auto-enable-standards:
            - NONE
            - DEFAULT
documentation:
    command: Updates the configuration of your organization in Security Hub. Only the Security Hub administrator account can invoke this operation.
    flag:
        auto-enable: |-
            Whether to automatically enable Security Hub in new member accounts when they join the organization.

            If set to `true`, then Security Hub is automatically enabled in new accounts. If set to `false`, then Security Hub isn't enabled in new accounts automatically. The default value is `false`.

            If the `ConfigurationType` of your organization is set to `CENTRAL`, then this field is set to `false` and can't be changed in the home Region and linked Regions. However, in that case, the delegated administrator can create a configuration policy in which Security Hub is enabled and associate the policy with new organization accounts.
        auto-enable-standards: |-
            Whether to automatically enable Security Hub [default standards](https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards-enable-disable.html) in new member accounts when they join the organization.

            The default value of this parameter is equal to `DEFAULT`.

            If equal to `DEFAULT`, then Security Hub default standards are automatically enabled for new member accounts. If equal to `NONE`, then default standards are not automatically enabled for new member accounts.

            If the `ConfigurationType` of your organization is set to `CENTRAL`, then this field is set to `NONE` and can't be changed in the home Region and linked Regions. However, in that case, the delegated administrator can create a configuration policy in which specific security standards are enabled and associate the policy with new organization accounts.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        organization-configuration: ""
