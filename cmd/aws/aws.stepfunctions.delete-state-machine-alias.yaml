name: delete-state-machine-alias
description: Deletes a state machine [alias](https://docs.aws.amazon.com/step-functions/latest/dg/concepts-state-machine-alias.html).
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --state-machine-alias-arn=!: The Amazon Resource Name (ARN) of the state machine alias to delete.
documentation:
    command: |-
        Deletes a state machine [alias](https://docs.aws.amazon.com/step-functions/latest/dg/concepts-state-machine-alias.html).

        After you delete a state machine alias, you can't use it to start executions. When you delete a state machine alias, Step Functions doesn't delete the state machine versions that alias references.

        **Related operations:**

        - [CreateStateMachineAlias]()
        - [DescribeStateMachineAlias]()
        - [ListStateMachineAliases]()
        - [UpdateStateMachineAlias]()
    flag:
