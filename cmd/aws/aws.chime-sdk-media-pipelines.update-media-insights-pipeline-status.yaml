name: update-media-insights-pipeline-status
description: Updates the status of a media insights pipeline.
flags:
    --identifier=!: The unique identifier of the resource to be updated.
    --update-status=!: The requested status of the media insights pipeline.
completion:
    flag:
        update-status:
            - Pause
            - Resume
documentation:
    command: Updates the status of a media insights pipeline.
    flag:
        identifier: The unique identifier of the resource to be updated. Valid values include the ID and ARN of the media insights pipeline.
        update-status: The requested status of the media insights pipeline.
