name: untag-resource
description: Deletes specified tags from an Batch resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource from which to delete tags.
    --tag-keys=!: The keys of the tags to be removed.
documentation:
    command: Deletes specified tags from an Batch resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource from which to delete tags. Batch resources that support tags are compute environments, jobs, job definitions, job queues, and scheduling policies. ARNs for child jobs of array and multi-node parallel (MNP) jobs aren't supported.
        tag-keys: The keys of the tags to be removed.
