name: update-application
description: Updates the specified application.
flags:
    --app-block-arn=: The ARN of the app block.
    --attributes-to-delete=:
        description: The attributes to delete for an application.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the application.
    --display-name=: The display name of the application.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --icon-s3-location=: The icon S3 location of the application.
    --launch-parameters=: The launch parameters of the application.
    --launch-path=: The launch path of the application.
    --name=!: The name of the application.
    --working-directory=: The working directory of the application.
documentation:
    command: Updates the specified application.
    flag:
        app-block-arn: The ARN of the app block.
        attributes-to-delete: The attributes to delete for an application.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the application.
        display-name: The display name of the application. This name is visible to users in the application catalog.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        icon-s3-location: The icon S3 location of the application.
        launch-parameters: The launch parameters of the application.
        launch-path: The launch path of the application.
        name: The name of the application. This name is visible to users when display name is not specified.
        working-directory: The working directory of the application.
