name: start-trained-model-export-job
description: Provides the information necessary to start a trained model export job.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the trained model export job.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --membership-identifier=!: The membership ID of the member that is receiving the exported trained model artifacts.
    --name=!: The name of the trained model export job.
    --output-configuration=!: The output configuration information for the trained model export job.
    --trained-model-arn=!: The Amazon Resource Name (ARN) of the trained model that you want to export.
    --trained-model-version-identifier=: The version identifier of the trained model to export.
documentation:
    command: Provides the information necessary to start a trained model export job.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the trained model export job.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        membership-identifier: The membership ID of the member that is receiving the exported trained model artifacts.
        name: The name of the trained model export job.
        output-configuration: The output configuration information for the trained model export job.
        trained-model-arn: The Amazon Resource Name (ARN) of the trained model that you want to export.
        trained-model-version-identifier: The version identifier of the trained model to export. This specifies which version of the trained model should be exported to the specified destination.
