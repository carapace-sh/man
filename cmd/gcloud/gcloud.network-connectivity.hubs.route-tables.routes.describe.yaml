name: describe
description: Describe a route.
flags:
    --hub=: Id of the hub.
    --route-table=: Id of the route table.
documentation:
    command: |
        Retrieve and display details about a route.
    flag:
        hub: |-
            Id of the hub.
            +
            To set the `hub` attribute:
            * provide the argument `route` on the command line with a fully specified name;
            * provide the argument `--hub` on the command line.
        route-table: |-
            Id of the route table.
            +
            To set the `route_table` attribute:
            * provide the argument `route` on the command line with a fully specified name;
            * provide the argument `--route_table` on the command line.
