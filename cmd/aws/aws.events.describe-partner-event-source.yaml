name: describe-partner-event-source
description: An SaaS partner can use this operation to list details about a partner event source that they have created.
flags:
    --name=!: The name of the event source to display.
documentation:
    command: An SaaS partner can use this operation to list details about a partner event source that they have created. Amazon Web Services customers do not use this operation. Instead, Amazon Web Services customers can use [DescribeEventSource](https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_DescribeEventSource.html) to see details about a partner event source that is shared with them.
    flag:
        name: The name of the event source to display.
