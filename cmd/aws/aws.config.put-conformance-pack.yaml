name: put-conformance-pack
description: Creates or updates a conformance pack.
flags:
    --conformance-pack-input-parameters=: A list of `ConformancePackInputParameter` objects.
    --conformance-pack-name=!: The unique name of the conformance pack you want to deploy.
    --delivery-s3-bucket=: The name of the Amazon S3 bucket where Config stores conformance pack templates.
    --delivery-s3-key-prefix=: The prefix for the Amazon S3 bucket.
    --template-body=: A string that contains the full conformance pack template body.
    --template-s3-uri=: The location of the file containing the template body (`s3://bucketname/prefix`).
    --template-ssmdocument-details=: An object of type `TemplateSSMDocumentDetails`, which contains the name or the Amazon Resource Name (ARN) of the Amazon Web Services Systems Manager document (SSM document) and the version of the SSM document that is used to create a conformance pack.
documentation:
    command: |-
        Creates or updates a conformance pack. A conformance pack is a collection of Config rules that can be easily deployed in an account and a region and across an organization. For information on how many conformance packs you can have per account, see [**Service Limits**](https://docs.aws.amazon.com/config/latest/developerguide/configlimits.html) in the *Config Developer Guide*.

        When you use `PutConformancePack` to deploy conformance packs in your account, the operation can create Config rules and remediation actions without requiring `config:PutConfigRule` or `config:PutRemediationConfigurations` permissions in your account IAM policies.

        This API uses the `AWSServiceRoleForConfigConforms` service-linked role in your account to create conformance pack resources. This service-linked role includes the permissions to create Config rules and remediation configurations, even if your account IAM policies explicitly deny these actions.

        This API creates a service-linked role `AWSServiceRoleForConfigConforms` in your account. The service-linked role is created only when the role does not exist in your account.

        You must specify only one of the follow parameters: `TemplateS3Uri`, `TemplateBody` or `TemplateSSMDocumentDetails`.
    flag:
        conformance-pack-input-parameters: A list of `ConformancePackInputParameter` objects.
        conformance-pack-name: The unique name of the conformance pack you want to deploy.
        delivery-s3-bucket: |-
            The name of the Amazon S3 bucket where Config stores conformance pack templates.

            This field is optional.
        delivery-s3-key-prefix: |-
            The prefix for the Amazon S3 bucket.

            This field is optional.
        template-body: |-
            A string that contains the full conformance pack template body. The structure containing the template body has a minimum length of 1 byte and a maximum length of 51,200 bytes.

            You can use a YAML template with two resource types: Config rule (`AWS::Config::ConfigRule`) and remediation action (`AWS::Config::RemediationConfiguration`).
        template-s3-uri: |-
            The location of the file containing the template body (`s3://bucketname/prefix`). The uri must point to a conformance pack template (max size: 300 KB) that is located in an Amazon S3 bucket in the same Region as the conformance pack.

            You must have access to read Amazon S3 bucket. In addition, in order to ensure a successful deployment, the template object must not be in an [archived storage class](https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html) if this parameter is passed.
        template-ssmdocument-details: An object of type `TemplateSSMDocumentDetails`, which contains the name or the Amazon Resource Name (ARN) of the Amazon Web Services Systems Manager document (SSM document) and the version of the SSM document that is used to create a conformance pack.
