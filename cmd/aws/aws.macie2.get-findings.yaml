name: get-findings
description: Retrieves the details of one or more findings.
flags:
    --finding-ids=!: An array of strings that lists the unique identifiers for the findings to retrieve.
    --sort-criteria=: The criteria for sorting the results of the request.
documentation:
    command: Retrieves the details of one or more findings.
    flag:
        finding-ids: An array of strings that lists the unique identifiers for the findings to retrieve. You can specify as many as 50 unique identifiers in this array.
        sort-criteria: The criteria for sorting the results of the request.
