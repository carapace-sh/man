name: batch-disable-standards
description: Disables the standards specified by the provided `StandardsSubscriptionArns`.
flags:
    --standards-subscription-arns=!: The ARNs of the standards subscriptions to disable.
documentation:
    command: |-
        Disables the standards specified by the provided `StandardsSubscriptionArns`.

        For more information, see [Security Standards](https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards.html) section of the *Security Hub User Guide*.
    flag:
        standards-subscription-arns: The ARNs of the standards subscriptions to disable.
