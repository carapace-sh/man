name: restore-table-from-backup
description: Creates a new table from an existing backup.
flags:
    --backup-arn=!: The Amazon Resource Name (ARN) associated with the backup.
    --billing-mode-override=: The billing mode of the restored table.
    --global-secondary-index-override=: List of global secondary indexes for the restored table.
    --local-secondary-index-override=: List of local secondary indexes for the restored table.
    --on-demand-throughput-override=: ""
    --provisioned-throughput-override=: Provisioned throughput settings for the restored table.
    --ssespecification-override=: The new server-side encryption settings for the restored table.
    --target-table-name=!: The name of the new table to which the backup must be restored.
completion:
    flag:
        billing-mode-override:
            - PROVISIONED
            - PAY_PER_REQUEST
documentation:
    command: |-
        Creates a new table from an existing backup. Any number of users can execute up to 50 concurrent restores (any type of restore) in a given account.

        You can call `RestoreTableFromBackup` at a maximum rate of 10 times per second.

        You must manually set up the following on the restored table:

        - Auto scaling policies
        - IAM policies
        - Amazon CloudWatch metrics and alarms
        - Tags
        - Stream settings
        - Time to Live (TTL) settings
    flag:
        backup-arn: The Amazon Resource Name (ARN) associated with the backup.
        billing-mode-override: The billing mode of the restored table.
        global-secondary-index-override: List of global secondary indexes for the restored table. The indexes provided should match existing secondary indexes. You can choose to exclude some or all of the indexes at the time of restore.
        local-secondary-index-override: List of local secondary indexes for the restored table. The indexes provided should match existing secondary indexes. You can choose to exclude some or all of the indexes at the time of restore.
        on-demand-throughput-override: ""
        provisioned-throughput-override: Provisioned throughput settings for the restored table.
        ssespecification-override: The new server-side encryption settings for the restored table.
        target-table-name: The name of the new table to which the backup must be restored.
