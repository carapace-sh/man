name: describe-retention-configurations
description: Returns the details of one or more retention configurations.
flags:
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
    --retention-configuration-names=: A list of names of retention configurations for which you want details.
documentation:
    command: |-
        Returns the details of one or more retention configurations. If the retention configuration name is not specified, this operation returns the details for all the retention configurations for that account.

        Currently, Config supports only one retention configuration per region in your account.
    flag:
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
        retention-configuration-names: |-
            A list of names of retention configurations for which you want details. If you do not specify a name, Config returns details for all the retention configurations for that account.

            Currently, Config supports only one retention configuration per region in your account.
