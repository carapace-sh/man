name: get-statistics
description: Returns the count, average, sum, minimum, maximum, sum of squares, variance, and standard deviation for the specified aggregated field.
flags:
    --aggregation-field=: The aggregation field name.
    --index-name=: The name of the index to search.
    --query-string=!: The query used to search.
    --query-version=: The version of the query used to search.
documentation:
    command: |-
        Returns the count, average, sum, minimum, maximum, sum of squares, variance, and standard deviation for the specified aggregated field. If the aggregation field is of type `String`, only the count statistic is returned.

        Requires permission to access the [GetStatistics](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        aggregation-field: The aggregation field name.
        index-name: The name of the index to search. The default value is `AWS_Things`.
        query-string: The query used to search. You can specify "\*" for the query string to get the count of all indexed things in your Amazon Web Services account.
        query-version: The version of the query used to search.
