name: call
description: Calls an API method with specific parameters.
hidden: true
flags:
    --api-version=: The version of the given API to use.
    --collection=!: The name of the collection to specify the method for.
    --enforce-collection: Fail unless resource belongs to specified collection.
    --no-enforce-collection&: Fail unless resource belongs to specified collection.
    --no-raw&: For list commands, the response is flattened to return the items as a list rather than returning the list response verbatim.
    --raw: For list commands, the response is flattened to return the items as a list rather than returning the list response verbatim.
documentation:
    command: Calls an API method with specific parameters.
    flag:
        api-version: The version of the given API to use. If not provided, the default version of the API will be used.
        collection: The name of the collection to specify the method for.
        enforce-collection: Fail unless resource belongs to specified collection. This is applicable only if method being called is GET or DELETE and resource identifier is URL. Enabled by default, use *--no-enforce-collection* to disable.
        no-enforce-collection: Fail unless resource belongs to specified collection. This is applicable only if method being called is GET or DELETE and resource identifier is URL.
        no-raw: For list commands, the response is flattened to return the items as a list rather than returning the list response verbatim. Use this flag to disable this behavior and return the raw response.
        raw: For list commands, the response is flattened to return the items as a list rather than returning the list response verbatim. Use this flag to disable this behavior and return the raw response.
