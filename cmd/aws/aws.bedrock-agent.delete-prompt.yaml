name: delete-prompt
description: Deletes a prompt or a version of it, depending on whether you include the `promptVersion` field or not.
flags:
    --prompt-identifier=!: The unique identifier of the prompt.
    --prompt-version=: The version of the prompt to delete.
documentation:
    command: Deletes a prompt or a version of it, depending on whether you include the `promptVersion` field or not. For more information, see [Delete prompts from the Prompt management tool](https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-manage.html#prompt-management-delete.html) and [Delete a version of a prompt from the Prompt management tool](https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-deploy.html#prompt-management-versions-delete.html) in the Amazon Bedrock User Guide.
    flag:
        prompt-identifier: The unique identifier of the prompt.
        prompt-version: The version of the prompt to delete. To delete the prompt, omit this field.
