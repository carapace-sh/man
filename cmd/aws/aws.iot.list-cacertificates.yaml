name: list-cacertificates
description: Lists the CA certificates registered for your Amazon Web Services account.
flags:
    --ascending-order=: Determines the order of the results.
    --marker=: The marker for the next set of results.
    --page-size=: The result page size.
    --template-name=: The name of the provisioning template.
documentation:
    command: |-
        Lists the CA certificates registered for your Amazon Web Services account.

        The results are paginated with a default page size of 25. You can use the returned marker to retrieve additional results.

        Requires permission to access the [ListCACertificates](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        ascending-order: Determines the order of the results.
        marker: The marker for the next set of results.
        page-size: The result page size.
        template-name: The name of the provisioning template.
