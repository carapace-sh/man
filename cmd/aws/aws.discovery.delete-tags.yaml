name: delete-tags
description: Deletes the association between configuration items and one or more tags.
flags:
    --configuration-ids=!: A list of configuration items with tags that you want to delete.
    --tags=: Tags that you want to delete from one or more configuration items.
documentation:
    command: Deletes the association between configuration items and one or more tags. This API accepts a list of multiple configuration items.
    flag:
        configuration-ids: A list of configuration items with tags that you want to delete.
        tags: |-
            Tags that you want to delete from one or more configuration items. Specify the tags that you want to delete in a *key*-*value* format. For example:

            `{"key": "serverType", "value": "webServer"}`
