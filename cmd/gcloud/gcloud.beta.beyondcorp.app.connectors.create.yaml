documentation:
    command: '*(BETA)*  Create a new Beyondcorp application connector.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        display-name: An arbitrary user-provided name for the connector. Cannot exceed 64 characters.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the beyondcorp service.
            +

            To set the `location` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        member: Connector service account email in form of 'serviceAccount:email'.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
