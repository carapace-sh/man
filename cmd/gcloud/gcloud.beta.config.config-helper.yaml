name: config-helper
description: '*(BETA)*  A helper for providing auth and config data to external tools.'
hidden: true
flags:
    --force-auth-refresh: Force a refresh of the credentials even if they have not yet expired.
    --min-expiry=: If given, refresh the credentials if they are within MIN_EXPIRY from expiration.
    --no-force-auth-refresh&: Force a refresh of the credentials even if they have not yet expired.
documentation:
    command: |
        *(BETA)*  A helper for providing auth and config data to external tools.

        Tools can call out to this command to get gcloud's current auth and
        configuration context when needed. This is appropriate when external
        tools want to operate within the context of the user's current
        gcloud session.

        This command returns a nested data structure with the following
        schema:

        *  credential
           *  access_token - string, The current OAuth2 access token
           *  token_expiry - string, The time the token will expire. This
              can be empty for some credential types. It is a UTC time
              formatted as: '%Y-%m-%dT%H:%M:%SZ'
        *  configuration
           *  active_configuration - string, The name of the active gcloud
              configuration
           *  properties - {string: {string: string}}, The full set of
              active gcloud properties
    flag:
        force-auth-refresh: Force a refresh of the credentials even if they have not yet expired. By default, credentials will only refreshed when necessary.
        min-expiry: If given, refresh the credentials if they are within MIN_EXPIRY from expiration.
        no-force-auth-refresh: Force a refresh of the credentials even if they have not yet expired. By default, credentials will only refreshed when necessary.
