name: switch
description: Request for switching runtimes.
flags:
    --accelerator-core-count=: Count of cores of this accelerator.
    --accelerator-type=: Type of this accelerator.
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Google Cloud location of this runtime https://cloud.google.com/compute/docs/regions-zones/#locations.
    --machine-type=: machine type
    --no-async&: Return immediately, without waiting for the operation in progress to
completion:
    flag:
        accelerator-type:
            - NVIDIA_TESLA_A100
            - NVIDIA_TESLA_K80
            - NVIDIA_TESLA_P100
            - NVIDIA_TESLA_V100
            - NVIDIA_TESLA_P4
            - NVIDIA_TESLA_T4
            - NVIDIA_TESLA_T4_VWS
            - NVIDIA_TESLA_P100_VWS
            - NVIDIA_TESLA_P4_VWS
            - TPU_V2
            - TPU_V3
documentation:
    command: |
        Request for switching notebook runtimes.
    flag:
        accelerator-core-count: Count of cores of this accelerator.
        accelerator-type: 'Type of this accelerator. _ACCELERATOR_TYPE_ must be one of: *NVIDIA_TESLA_A100*, *NVIDIA_TESLA_K80*, *NVIDIA_TESLA_P100*, *NVIDIA_TESLA_V100*, *NVIDIA_TESLA_P4*, *NVIDIA_TESLA_T4*, *NVIDIA_TESLA_T4_VWS*, *NVIDIA_TESLA_P100_VWS*, *NVIDIA_TESLA_P4_VWS*, *TPU_V2*, *TPU_V3*.'
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Google Cloud location of this runtime https://cloud.google.com/compute/docs/regions-zones/#locations.
            +
            To set the `location` attribute:
            * provide the argument `runtime` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `notebooks/location`.
        machine-type: machine type
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
