name: delete-trusted-token-issuer
description: Deletes a trusted token issuer configuration from an instance of IAM Identity Center.
flags:
    --trusted-token-issuer-arn=!: Specifies the ARN of the trusted token issuer configuration to delete.
documentation:
    command: |-
        Deletes a trusted token issuer configuration from an instance of IAM Identity Center.

        Deleting this trusted token issuer configuration will cause users to lose access to any applications that are configured to use the trusted token issuer.
    flag:
        trusted-token-issuer-arn: Specifies the ARN of the trusted token issuer configuration to delete.
