name: list-retraining-schedulers
description: Lists all retraining schedulers in your account, filtering by model name prefix and status.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: Specifies the maximum number of retraining schedulers to list.
    --model-name-begins-with=: Specify this field to only list retraining schedulers whose machine learning models begin with the value you specify.
    --next-token=: If the number of results exceeds the maximum, a pagination token is returned.
    --status=: Specify this field to only list retraining schedulers whose status matches the value you specify.
completion:
    flag:
        status:
            - PENDING
            - RUNNING
            - STOPPING
            - STOPPED
documentation:
    command: Lists all retraining schedulers in your account, filtering by model name prefix and status.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: Specifies the maximum number of retraining schedulers to list.
        model-name-begins-with: Specify this field to only list retraining schedulers whose machine learning models begin with the value you specify.
        next-token: If the number of results exceeds the maximum, a pagination token is returned. Use the token in the request to show the next page of retraining schedulers.
        status: Specify this field to only list retraining schedulers whose status matches the value you specify.
