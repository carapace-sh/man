name: create-odb-peering-connection
description: Creates a peering connection between an ODB network and a VPC.
flags:
    --client-token=: The client token for the ODB peering connection request.
    --display-name=: The display name for the ODB peering connection.
    --odb-network-id=!: The unique identifier of the ODB network that initiates the peering connection.
    --peer-network-cidrs-to-be-added=: A list of CIDR blocks to add to the peering connection.
    --peer-network-id=!: The unique identifier of the peer network.
    --tags=: The tags to assign to the ODB peering connection.
documentation:
    command: |-
        Creates a peering connection between an ODB network and a VPC.

        A peering connection enables private connectivity between the networks for application-tier communication.
    flag:
        client-token: |-
            The client token for the ODB peering connection request.

            Constraints:

            - Must be unique for each request.
        display-name: The display name for the ODB peering connection.
        odb-network-id: The unique identifier of the ODB network that initiates the peering connection.
        peer-network-cidrs-to-be-added: A list of CIDR blocks to add to the peering connection. These CIDR blocks define the IP address ranges that can communicate through the peering connection.
        peer-network-id: The unique identifier of the peer network. This can be either a VPC ID or another ODB network ID.
        tags: The tags to assign to the ODB peering connection.
