name: describe
description: '*(BETA)*  Describe a restore plan.'
flags:
    --location=: Google Cloud location.
documentation:
    command: |
        *(BETA)*  Describe a Backup for GKE restore plan.

        ## EXAMPLES

        To describe a restore plan ``my-restore-plan'' in project ``my-project'' in location ``us-central1'', run:

          $ gcloud beta container backup-restore restore-plans describe my-restore-plan --project=my-project --location=us-central1
    flag:
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `restore_plan` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
