name: list-resource-snapshots
description: Retrieves a list of resource view snapshots based on specified criteria.
flags:
    --catalog=!: Specifies the catalog related to the request.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --created-by=: Filters the response to include only snapshots of resources owned by the specified AWS account.
    --engagement-identifier=!: The unique identifier of the engagement associated with the snapshots.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token for the next set of results.
    --page-size=: The size of each page to get in the AWS service call.
    --resource-identifier=: Filters the response to include only snapshots of the specified resource.
    --resource-snapshot-template-identifier=: Filters the response to include only snapshots created using the specified template.
    --resource-type=: Filters the response to include only snapshots of the specified resource type.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        resource-type:
            - Opportunity
documentation:
    command: |-
        Retrieves a list of resource view snapshots based on specified criteria. This operation supports various use cases, including:

        - Fetching all snapshots associated with an engagement.
        - Retrieving snapshots of a specific resource type within an engagement.
        - Obtaining snapshots for a particular resource using a specified template.
        - Accessing the latest snapshot of a resource within an engagement.
        - Filtering snapshots by resource owner.
