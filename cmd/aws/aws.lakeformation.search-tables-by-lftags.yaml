name: search-tables-by-lftags
description: This operation allows a search on `TABLE` resources by `LFTag`s.
flags:
    --catalog-id=: The identifier for the Data Catalog.
    --expression=!: A list of conditions (`LFTag` structures) to search for in table resources.
    --max-results=: The maximum number of results to return.
    --next-token=: A continuation token, if this is not the first call to retrieve this list.
documentation:
    command: This operation allows a search on `TABLE` resources by `LFTag`s. This will be used by admins who want to grant user permissions on certain LF-tags. Before making a grant, the admin can use `SearchTablesByLFTags` to find all resources where the given `LFTag`s are valid to verify whether the returned resources can be shared.
    flag:
        catalog-id: The identifier for the Data Catalog. By default, the account ID. The Data Catalog is the persistent metadata store. It contains database definitions, table definitions, and other control information to manage your Lake Formation environment.
        expression: A list of conditions (`LFTag` structures) to search for in table resources.
        max-results: The maximum number of results to return.
        next-token: A continuation token, if this is not the first call to retrieve this list.
