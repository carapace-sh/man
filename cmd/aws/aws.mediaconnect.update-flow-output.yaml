name: update-flow-output
description: Updates an existing flow output.
flags:
    --cidr-allow-list=:
        description: The range of IP addresses that should be allowed to initiate output requests to this flow.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the output.
    --destination=: The IP address where you want to send the output.
    --encryption=: The type of key used for the encryption.
    --flow-arn=!: The Amazon Resource Name (ARN) of the flow that is associated with the output that you want to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-latency=: The maximum latency in milliseconds.
    --media-stream-output-configurations=:
        description: The media streams that are associated with the output, and the parameters for those associations.
        nargs: -1
    --min-latency=: The minimum latency in milliseconds for SRT-based streams.
    --ndi-program-name=: A suffix for the names of the NDI sources that the flow creates.
    --ndi-speed-hq-quality=: A quality setting for the NDI Speed HQ encoder.
    --output-arn=!: The ARN of the output that you want to update.
    --output-status=: An indication of whether the output should transmit data or not.
    --port=: The port to use when content is distributed to this output.
    --protocol=: The protocol to use for the output.
    --remote-id=: The remote ID for the Zixi-pull stream.
    --router-integration-state=: Indicates whether to enable or disable router integration for this flow output.
    --router-integration-transit-encryption=: ""
    --sender-control-port=: The port that the flow uses to send outbound requests to initiate connection with the sender.
    --sender-ip-address=: The IP address that the flow communicates with to initiate connection with the sender.
    --smoothing-latency=: The smoothing latency in milliseconds for RIST, RTP, and RTP-FEC streams.
    --stream-id=: The stream ID that you want to use for this transport.
    --vpc-interface-attachment=: The name of the VPC interface attachment to use for this output.
completion:
    flag:
        output-status:
            - ENABLED
            - DISABLED
        protocol:
            - zixi-push
            - rtp-fec
            - rtp
            - zixi-pull
            - rist
            - st2110-jpegxs
            - cdi
            - srt-listener
            - srt-caller
            - fujitsu-qos
            - udp
            - ndi-speed-hq
        router-integration-state:
            - ENABLED
            - DISABLED
documentation:
    command: Updates an existing flow output.
    flag:
        cidr-allow-list: The range of IP addresses that should be allowed to initiate output requests to this flow. These IP addresses should be in the form of a Classless Inter-Domain Routing (CIDR) block; for example, 10.0.0.0/16.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the output. This description appears only on the MediaConnect console and will not be seen by the end user.
        destination: The IP address where you want to send the output.
        encryption: 'The type of key used for the encryption. If no `keyType` is provided, the service will use the default setting (static-key). Allowable encryption types: static-key.'
        flow-arn: The Amazon Resource Name (ARN) of the flow that is associated with the output that you want to update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-latency: The maximum latency in milliseconds. This parameter applies only to RIST-based and Zixi-based streams.
        media-stream-output-configurations: The media streams that are associated with the output, and the parameters for those associations.
        min-latency: The minimum latency in milliseconds for SRT-based streams. In streams that use the SRT protocol, this value that you set on your MediaConnect source or output represents the minimal potential latency of that connection. The latency of the stream is set to the highest number between the sender’s minimum latency and the receiver’s minimum latency.
        ndi-program-name: A suffix for the names of the NDI sources that the flow creates. If a custom name isn't specified, MediaConnect uses the output name.
        ndi-speed-hq-quality: A quality setting for the NDI Speed HQ encoder.
        output-arn: The ARN of the output that you want to update.
        output-status: An indication of whether the output should transmit data or not. If you don't specify the `outputStatus` field in your request, MediaConnect leaves the value unchanged.
        port: The port to use when content is distributed to this output.
        protocol: |-
            The protocol to use for the output.

            Elemental MediaConnect no longer supports the Fujitsu QoS protocol. This reference is maintained for legacy purposes only.
        remote-id: The remote ID for the Zixi-pull stream.
        router-integration-state: Indicates whether to enable or disable router integration for this flow output.
        router-integration-transit-encryption: ""
        sender-control-port: The port that the flow uses to send outbound requests to initiate connection with the sender.
        sender-ip-address: The IP address that the flow communicates with to initiate connection with the sender.
        smoothing-latency: The smoothing latency in milliseconds for RIST, RTP, and RTP-FEC streams.
        stream-id: The stream ID that you want to use for this transport. This parameter applies only to Zixi and SRT caller-based streams.
        vpc-interface-attachment: The name of the VPC interface attachment to use for this output.
