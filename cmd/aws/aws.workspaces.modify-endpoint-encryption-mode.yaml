name: modify-endpoint-encryption-mode
description: Modifies the endpoint encryption mode that allows you to configure the specified directory between Standard TLS and FIPS 140-2 validated mode.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --directory-id=!: The identifier of the directory.
    --endpoint-encryption-mode=!: The encryption mode used for endpoint connections when streaming to WorkSpaces Personal or WorkSpace Pools.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
completion:
    flag:
        endpoint-encryption-mode:
            - STANDARD_TLS
            - FIPS_VALIDATED
documentation:
    command: Modifies the endpoint encryption mode that allows you to configure the specified directory between Standard TLS and FIPS 140-2 validated mode.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
