name: update-traffic-policy
description: Update attributes of an already provisioned traffic policy resource.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-action=: Default action instructs the traﬃc policy to either Allow or Deny (block) messages that fall outside of (or not addressed by) the conditions of your policy statements
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-message-size-bytes=: The maximum message size in bytes of email which is allowed in by this traffic policy—anything larger will be blocked.
    --policy-statements=:
        description: The list of conditions to be updated for filtering email traffic.
        nargs: -1
    --traffic-policy-id=!: The identifier of the traffic policy that you want to update.
    --traffic-policy-name=: A user-friendly name for the traffic policy resource.
completion:
    flag:
        default-action:
            - ALLOW
            - DENY
documentation:
    command: Update attributes of an already provisioned traffic policy resource.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-action: Default action instructs the traﬃc policy to either Allow or Deny (block) messages that fall outside of (or not addressed by) the conditions of your policy statements
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-message-size-bytes: The maximum message size in bytes of email which is allowed in by this traffic policy—anything larger will be blocked.
        policy-statements: The list of conditions to be updated for filtering email traffic.
        traffic-policy-id: The identifier of the traffic policy that you want to update.
        traffic-policy-name: A user-friendly name for the traffic policy resource.
