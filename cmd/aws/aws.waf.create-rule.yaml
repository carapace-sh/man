name: create-rule
description: This is **AWS WAF Classic** documentation.
flags:
    --change-token=!: The value returned by the most recent call to [GetChangeToken]().
    --metric-name=!: A friendly name or description for the metrics for this `Rule`.
    --name=!: A friendly name or description of the [Rule]().
    --tags=: ""
documentation:
    command: |-
        This is **AWS WAF Classic** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.

        **For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.

        Creates a `Rule`, which contains the `IPSet` objects, `ByteMatchSet` objects, and other predicates that identify the requests that you want to block. If you add more than one predicate to a `Rule`, a request must match all of the specifications to be allowed or blocked. For example, suppose that you add the following to a `Rule`:

        - An `IPSet` that matches the IP address `192.0.2.44/32`
        - A `ByteMatchSet` that matches `BadBot` in the `User-Agent` header

        You then add the `Rule` to a `WebACL` and specify that you want to blocks requests that satisfy the `Rule`. For a request to be blocked, it must come from the IP address 192.0.2.44 *and* the `User-Agent` header in the request must contain the value `BadBot`.

        To create and configure a `Rule`, perform the following steps:

        1. Create and update the predicates that you want to include in the `Rule`. For more information, see [CreateByteMatchSet](), [CreateIPSet](), and [CreateSqlInjectionMatchSet]().
        2. Use [GetChangeToken]() to get the change token that you provide in the `ChangeToken` parameter of a `CreateRule` request.
        3. Submit a `CreateRule` request.
        4. Use `GetChangeToken` to get the change token that you provide in the `ChangeToken` parameter of an [UpdateRule]() request.
        5. Submit an `UpdateRule` request to specify the predicates that you want to include in the `Rule`.
        6. Create and update a `WebACL` that contains the `Rule`. For more information, see [CreateWebACL]().

        For more information about how to use the AWS WAF API to allow or block HTTP requests, see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/).
    flag:
        change-token: The value returned by the most recent call to [GetChangeToken]().
        metric-name: A friendly name or description for the metrics for this `Rule`. The name can contain only alphanumeric characters (A-Z, a-z, 0-9), with maximum length 128 and minimum length one. It can't contain whitespace or metric names reserved for AWS WAF, including "All" and "Default\_Action." You can't change the name of the metric after you create the `Rule`.
        name: A friendly name or description of the [Rule](). You can't change the name of a `Rule` after you create it.
        tags: ""
