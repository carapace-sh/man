name: describe-data-shares
description: Shows the status of any inbound or outbound datashares available in the specified account.
flags:
    --data-share-arn=: The Amazon resource name (ARN) of the datashare to describe details of.
    --marker=: An optional parameter that specifies the starting point to return a set of response records.
    --max-records=: The maximum number of response records to return in each call.
documentation:
    command: Shows the status of any inbound or outbound datashares available in the specified account.
    flag:
        data-share-arn: The Amazon resource name (ARN) of the datashare to describe details of.
        marker: An optional parameter that specifies the starting point to return a set of response records. When the results of a [DescribeDataShares]() request exceed the value specified in `MaxRecords`, Amazon Web Services returns a value in the `Marker` field of the response. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.
        max-records: The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.
