name: tag-resource
description: Adds metadata tags to the Amazon RDS Performance Insights resource.
flags:
    --resource-arn=!: The Amazon RDS Performance Insights resource that the tags are added to.
    --service-type=!: The Amazon Web Services service for which Performance Insights returns metrics.
    --tags=!: The metadata assigned to an Amazon RDS resource consisting of a key-value pair.
completion:
    flag:
        service-type:
            - RDS
            - DOCDB
documentation:
    command: Adds metadata tags to the Amazon RDS Performance Insights resource.
    flag:
        resource-arn: The Amazon RDS Performance Insights resource that the tags are added to. This value is an Amazon Resource Name (ARN). For information about creating an ARN, see [Constructing an RDS Amazon Resource Name (ARN)](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Tagging.ARN.html#USER_Tagging.ARN.Constructing).
        service-type: The Amazon Web Services service for which Performance Insights returns metrics. Valid value is `RDS`.
        tags: The metadata assigned to an Amazon RDS resource consisting of a key-value pair.
