name: create-dataset
description: Creates a new FinSpace Dataset.
flags:
    --alias=: The unique resource identifier for a Dataset.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token that ensures idempotency.
    --dataset-description=: Description of a Dataset.
    --dataset-title=!: Display title for a FinSpace Dataset.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kind=!: The format in which Dataset data is structured.
    --owner-info=: Contact information for a Dataset owner.
    --permission-group-params=!: Permission group parameters for Dataset permissions.
    --schema-definition=: Definition for a schema on a tabular Dataset.
completion:
    flag:
        kind:
            - TABULAR
            - NON_TABULAR
documentation:
    command: Creates a new FinSpace Dataset.
    flag:
        alias: The unique resource identifier for a Dataset.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        dataset-description: Description of a Dataset.
        dataset-title: Display title for a FinSpace Dataset.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kind: |-
            The format in which Dataset data is structured.

            - `TABULAR` – Data is structured in a tabular format.
            - `NON_TABULAR` – Data is structured in a non-tabular format.
        owner-info: Contact information for a Dataset owner.
        permission-group-params: Permission group parameters for Dataset permissions.
        schema-definition: Definition for a schema on a tabular Dataset.
