name: list-solutions
description: Returns a list of solutions in a given dataset group.
flags:
    --dataset-group-arn=: The Amazon Resource Name (ARN) of the dataset group.
    --max-results=: The maximum number of solutions to return.
    --next-token=: A token returned from the previous call to `ListSolutions` for getting the next set of solutions (if they exist).
documentation:
    command: Returns a list of solutions in a given dataset group. When a dataset group is not specified, all the solutions associated with the account are listed. The response provides the properties for each solution, including the Amazon Resource Name (ARN). For more information on solutions, see [CreateSolution](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateSolution.html).
    flag:
        dataset-group-arn: The Amazon Resource Name (ARN) of the dataset group.
        max-results: The maximum number of solutions to return.
        next-token: A token returned from the previous call to `ListSolutions` for getting the next set of solutions (if they exist).
