name: cancel-batch-import-job
description: Cancels an in-progress batch import job.
flags:
    --job-id=!: The ID of an in-progress batch import job to cancel.
documentation:
    command: Cancels an in-progress batch import job.
    flag:
        job-id: |-
            The ID of an in-progress batch import job to cancel.

            Amazon Fraud Detector will throw an error if the batch import job is in `FAILED`, `CANCELED`, or `COMPLETED` state.
