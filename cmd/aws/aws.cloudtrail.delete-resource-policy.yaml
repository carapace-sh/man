name: delete-resource-policy
description: Deletes the resource-based policy attached to the CloudTrail event data store, dashboard, or channel.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the CloudTrail event data store, dashboard, or channel you're deleting the resource-based policy from.
documentation:
    command: Deletes the resource-based policy attached to the CloudTrail event data store, dashboard, or channel.
    flag:
        resource-arn: |-
            The Amazon Resource Name (ARN) of the CloudTrail event data store, dashboard, or channel you're deleting the resource-based policy from.

            Example event data store ARN format: `arn:aws:cloudtrail:us-east-2:123456789012:eventdatastore/EXAMPLE-f852-4e8f-8bd1-bcf6cEXAMPLE`

            Example dashboard ARN format: `arn:aws:cloudtrail:us-east-1:123456789012:dashboard/exampleDash`

            Example channel ARN format: `arn:aws:cloudtrail:us-east-2:123456789012:channel/01234567890`
