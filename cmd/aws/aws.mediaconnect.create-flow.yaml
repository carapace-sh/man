name: create-flow
description: Creates a new flow.
flags:
    --availability-zone=: The Availability Zone that you want to create the flow in.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --entitlements=:
        description: The entitlements that you want to grant on a flow.
        nargs: -1
    --flow-size=: Determines the processing capacity and feature set of the flow.
    --flow-tags=: The key-value pairs that can be used to tag and organize the flow.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --maintenance=: The maintenance settings you want to use for the flow.
    --media-streams=:
        description: The media streams that you want to add to the flow.
        nargs: -1
    --name=!: The name of the flow.
    --ndi-config=: Specifies the configuration settings for NDI outputs.
    --outputs=:
        description: The outputs that you want to add to this flow.
        nargs: -1
    --source-failover-config=: The settings for source failover.
    --source-monitoring-config=: The settings for source monitoring.
    --source=: The settings for the source that you want to use for the new flow.
    --sources=:
        description: The sources that are assigned to the flow.
        nargs: -1
    --vpc-interfaces=:
        description: The VPC interfaces you want on the flow.
        nargs: -1
completion:
    flag:
        flow-size:
            - MEDIUM
            - LARGE
documentation:
    command: Creates a new flow. The request must include one source. The request optionally can include outputs (up to 50) and entitlements (up to 50).
    flag:
        availability-zone: The Availability Zone that you want to create the flow in. These options are limited to the Availability Zones within the current Amazon Web Services Region.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        entitlements: The entitlements that you want to grant on a flow.
        flow-size: Determines the processing capacity and feature set of the flow. Set this optional parameter to `LARGE` if you want to enable NDI outputs on the flow.
        flow-tags: The key-value pairs that can be used to tag and organize the flow.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        maintenance: The maintenance settings you want to use for the flow.
        media-streams: The media streams that you want to add to the flow. You can associate these media streams with sources and outputs on the flow.
        name: The name of the flow.
        ndi-config: Specifies the configuration settings for NDI outputs. Required when the flow includes NDI outputs.
        outputs: The outputs that you want to add to this flow.
        source: The settings for the source that you want to use for the new flow.
        source-failover-config: The settings for source failover.
        source-monitoring-config: The settings for source monitoring.
        sources: The sources that are assigned to the flow.
        vpc-interfaces: The VPC interfaces you want on the flow.
