name: disassociate-vehicle-fleet
description: Removes, or disassociates, a vehicle from a fleet.
flags:
    --fleet-id=!: The unique ID of a fleet.
    --vehicle-name=!: The unique ID of the vehicle to disassociate from the fleet.
documentation:
    command: Removes, or disassociates, a vehicle from a fleet. Disassociating a vehicle from a fleet doesn't delete the vehicle.
    flag:
        fleet-id: The unique ID of a fleet.
        vehicle-name: The unique ID of the vehicle to disassociate from the fleet.
