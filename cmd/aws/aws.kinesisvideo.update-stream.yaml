name: update-stream
description: Updates stream metadata, such as the device name and media type.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --current-version=!: The version of the stream whose metadata you want to update.
    --device-name=: The name of the device that is writing to the stream.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --media-type=: The stream's media type.
    --stream-arn=: The ARN of the stream whose metadata you want to update.
    --stream-name=: The name of the stream whose metadata you want to update.
documentation:
    command: |-
        Updates stream metadata, such as the device name and media type.

        You must provide the stream name or the Amazon Resource Name (ARN) of the stream.

        To make sure that you have the latest version of the stream before updating it, you can specify the stream version. Kinesis Video Streams assigns a version to each stream. When you update a stream, Kinesis Video Streams assigns a new version number. To get the latest stream version, use the `DescribeStream` API.

        `UpdateStream` is an asynchronous operation, and takes time to complete.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        current-version: The version of the stream whose metadata you want to update.
        device-name: |-
            The name of the device that is writing to the stream.

            In the current implementation, Kinesis Video Streams does not use this name.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        media-type: |-
            The stream's media type. Use `MediaType` to specify the type of content that the stream contains to the consumers of the stream. For more information about media types, see [Media Types](http://www.iana.org/assignments/media-types/media-types.xhtml). If you choose to specify the `MediaType`, see [Naming Requirements](https://tools.ietf.org/html/rfc6838#section-4.2).

            To play video on the console, you must specify the correct video type. For example, if the video in the stream is H.264, specify `video/h264` as the `MediaType`.
        stream-arn: The ARN of the stream whose metadata you want to update.
        stream-name: |-
            The name of the stream whose metadata you want to update.

            The stream name is an identifier for the stream, and must be unique for each account and region.
