name: list-versions
description: Retrieve a JSON array of all available Job engine versions and the date they expire.
flags:
    --max-results=: Optional.
    --next-token=: Optional.
documentation:
    command: Retrieve a JSON array of all available Job engine versions and the date they expire.
    flag:
        max-results: Optional. Number of valid Job engine versions, up to twenty, that will be returned at one time.
        next-token: Optional. Use this string, provided with the response to a previous request, to request the next batch of Job engine versions.
