name: put-graphql-api-environment-variables
description: Creates a list of environmental variables in an API by its ID value.
flags:
    --api-id=!: The ID of the API to which the environmental variable list will be written.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --environment-variables=!: The list of environmental variables to add to the API.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: |-
        Creates a list of environmental variables in an API by its ID value.

        When creating an environmental variable, it must follow the constraints below:

        - Both JavaScript and VTL templates support environmental variables.
        - Environmental variables are not evaluated before function invocation.
        - Environmental variables only support string values.
        - Any defined value in an environmental variable is considered a string literal and not expanded.
        - Variable evaluations should ideally be performed in the function code.

        When creating an environmental variable key-value pair, it must follow the additional constraints below:

        - Keys must begin with a letter.
        - Keys must be at least two characters long.
        - Keys can only contain letters, numbers, and the underscore character (\_).
        - Values can be up to 512 characters long.
        - You can configure up to 50 key-value pairs in a GraphQL API.

        You can create a list of environmental variables by adding it to the `environmentVariables` payload as a list in the format `{"key1":"value1","key2":"value2", …}`. Note that each call of the `PutGraphqlApiEnvironmentVariables` action will result in the overwriting of the existing environmental variable list of that API. This means the existing environmental variables will be lost. To avoid this, you must include all existing and new environmental variables in the list each time you call this action.
    flag:
        api-id: The ID of the API to which the environmental variable list will be written.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        environment-variables: |-
            The list of environmental variables to add to the API.

            When creating an environmental variable key-value pair, it must follow the additional constraints below:

            - Keys must begin with a letter.
            - Keys must be at least two characters long.
            - Keys can only contain letters, numbers, and the underscore character (\_).
            - Values can be up to 512 characters long.
            - You can configure up to 50 key-value pairs in a GraphQL API.

            You can create a list of environmental variables by adding it to the `environmentVariables` payload as a list in the format `{"key1":"value1","key2":"value2", …}`. Note that each call of the `PutGraphqlApiEnvironmentVariables` action will result in the overwriting of the existing environmental variable list of that API. This means the existing environmental variables will be lost. To avoid this, you must include all existing and new environmental variables in the list each time you call this action.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
