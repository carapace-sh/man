name: list-cluster-events
description: Retrieves a list of event summaries for a specified HyperPod cluster.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-name=!: The name or Amazon Resource Name (ARN) of the HyperPod cluster for which to list events.
    --event-time-after=: The start of the time range for filtering events.
    --event-time-before=: The end of the time range for filtering events.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-group-name=: The name of the instance group to filter events.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of events to return in the response.
    --next-token=: A token to retrieve the next set of results.
    --node-id=: The EC2 instance ID to filter events.
    --page-size=: The size of each page to get in the AWS service call.
    --resource-type=: The type of resource for which to filter events.
    --sort-by=: The field to use for sorting the event list.
    --sort-order=: The order in which to sort the results.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        resource-type:
            - Cluster
            - InstanceGroup
            - Instance
        sort-by:
            - EventTime
        sort-order:
            - Ascending
            - Descending
documentation:
    command: Retrieves a list of event summaries for a specified HyperPod cluster. The operation supports filtering, sorting, and pagination of results. This functionality is only supported when the `NodeProvisioningMode` is set to `Continuous`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-name: The name or Amazon Resource Name (ARN) of the HyperPod cluster for which to list events.
        event-time-after: The start of the time range for filtering events. Only events that occurred after this time are included in the results.
        event-time-before: The end of the time range for filtering events. Only events that occurred before this time are included in the results.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-group-name: The name of the instance group to filter events. If specified, only events related to this instance group are returned.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of events to return in the response. Valid range is 1 to 100.
        next-token: A token to retrieve the next set of results. This token is obtained from the output of a previous `ListClusterEvents` call.
        node-id: The EC2 instance ID to filter events. If specified, only events related to this instance are returned.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        resource-type: The type of resource for which to filter events. Valid values are `Cluster`, `InstanceGroup`, or `Instance`.
        sort-by: The field to use for sorting the event list. Currently, the only supported value is `EventTime`.
        sort-order: The order in which to sort the results. Valid values are `Ascending` or `Descending` (the default is `Descending`).
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
