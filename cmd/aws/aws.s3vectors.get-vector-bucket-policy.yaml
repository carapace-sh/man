name: get-vector-bucket-policy
description: Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.
flags:
    --vector-bucket-arn=: The ARN of the vector bucket.
    --vector-bucket-name=: The name of the vector bucket.
documentation:
    command: |-
        Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.

        Gets details about a vector bucket policy. To specify the bucket, you must use either the vector bucket name or the vector bucket Amazon Resource Name (ARN).

        Permissions

        You must have the `s3vectors:GetVectorBucketPolicy` permission to use this operation.
    flag:
        vector-bucket-arn: The ARN of the vector bucket.
        vector-bucket-name: The name of the vector bucket.
