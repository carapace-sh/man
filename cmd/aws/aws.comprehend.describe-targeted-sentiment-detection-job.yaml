name: describe-targeted-sentiment-detection-job
description: Gets the properties associated with a targeted sentiment detection job.
flags:
    --job-id=!: The identifier that Amazon Comprehend generated for the job.
documentation:
    command: Gets the properties associated with a targeted sentiment detection job. Use this operation to get the status of the job.
    flag:
        job-id: The identifier that Amazon Comprehend generated for the job. The `StartTargetedSentimentDetectionJob` operation returns this identifier in its response.
