name: create
description: Create a new association between a firewall policy and a network.
flags:
    --firewall-policy-region=: Region of the firewall policy to create.
    --firewall-policy=!: Firewall policy ID with which to create association.
    --global-firewall-policy: If set, the firewall policy is global.
    --name=: Name of the association.
    --network=!: Name of the network with which the association is created.
    --no-global-firewall-policy&: If set, the firewall policy is global.
    --no-replace-association-on-target&: By default, if you attempt to insert an association to a network that is already associated with a firewall policy the method will fail.
    --replace-association-on-target: By default, if you attempt to insert an association to a network that is already associated with a firewall policy the method will fail.
documentation:
    command: |-
        *gcloud compute network-firewall-policies associations create* is used to create network firewall policy associations. A
        network firewall policy is a set of rules that controls access to various
        resources.
    flag:
        firewall-policy: Firewall policy ID with which to create association.
        firewall-policy-region: Region of the firewall policy to create. Overrides the default *compute/region* property value for this command invocation.
        global-firewall-policy: If set, the firewall policy is global.
        name: Name of the association.
        network: Name of the network with which the association is created.
        no-global-firewall-policy: If set, the firewall policy is global.
        no-replace-association-on-target: By default, if you attempt to insert an association to a network that is already associated with a firewall policy the method will fail. If this is set, the existing association will be deleted at the same time that the new association is created.
        replace-association-on-target: By default, if you attempt to insert an association to a network that is already associated with a firewall policy the method will fail. If this is set, the existing association will be deleted at the same time that the new association is created.
