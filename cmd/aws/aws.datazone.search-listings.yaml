name: search-listings
description: Searches listings in Amazon DataZone.
flags:
    --additional-attributes=: Specifies additional attributes for the search.
    --aggregations=: Enables you to specify one or more attributes to compute and return counts grouped by field values.
    --domain-identifier=!: The identifier of the domain in which to search listings.
    --filters=: Specifies the filters for the search of listings.
    --max-results=: The maximum number of results to return in a single call to `SearchListings`.
    --next-token=: When the number of results is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of results, the response includes a pagination token named `NextToken`.
    --search-in=: The details of the search.
    --search-text=: Specifies the text for which to search.
    --sort=: Specifies the way for sorting the search results.
documentation:
    command: |-
        Searches listings in Amazon DataZone.

        SearchListings is a powerful capability that enables users to discover and explore published assets and data products across their organization. It provides both basic and advanced search functionality, allowing users to find resources based on names, descriptions, metadata, and other attributes. SearchListings also supports filtering using various criteria such as creation date, owner, or status. This API is essential for making the wealth of data resources in an organization discoverable and usable, helping users find the right data for their needs quickly and efficiently.

        SearchListings returns results in a paginated format. When the result set is large, the response will include a nextToken, which can be used to retrieve the next page of results.

        The SearchListings API gives users flexibility in specifying what kind of search is run.

        To run a free-text search, the `searchText` parameter must be supplied. By default, all searchable fields are indexed for semantic search and will return semantic matches for SearchListings queries. To prevent semantic search indexing for a custom form attribute, see the [CreateFormType API documentation](https://docs.aws.amazon.com/datazone/latest/APIReference/API_CreateFormType.html). To run a lexical search query, enclose the query with double quotes (""). This will disable semantic search even for fields that have semantic search enabled and will only return results that contain the keywords wrapped by double quotes (order of tokens in the query is not enforced). Free-text search is supported for all attributes annotated with @amazon.datazone#searchable.

        To run a filtered search, provide filter clause using the filters parameter. To filter on glossary terms, use the special attribute `__DataZoneGlossaryTerms`.

        To find out whether an attribute has been annotated and indexed for a given search type, use the GetFormType API to retrieve the form containing the attribute.
    flag:
        additional-attributes: Specifies additional attributes for the search.
        aggregations: Enables you to specify one or more attributes to compute and return counts grouped by field values.
        domain-identifier: The identifier of the domain in which to search listings.
        filters: Specifies the filters for the search of listings.
        max-results: The maximum number of results to return in a single call to `SearchListings`. When the number of results to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `SearchListings` to list the next set of results.
        next-token: When the number of results is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of results, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `SearchListings` to list the next set of results.
        search-in: The details of the search.
        search-text: Specifies the text for which to search.
        sort: Specifies the way for sorting the search results.
