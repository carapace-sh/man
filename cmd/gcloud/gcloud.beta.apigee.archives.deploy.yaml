name: deploy
description: '*(BETA)*  Deploy an Apigee archive deployment to an environment.'
flags:
    --async: If set, returns immediately and outputs a description of the long running operation that was launched.
    --bundle-file=: The zip file containing an archive to upload.
    --environment=!: ID of the environment or fully qualified identifier for the environment.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: If set, returns immediately and outputs a description of the long running operation that was launched.
    --organization=: Apigee organization containing the environment.
    --source=: The source directory of the archive to upload.
documentation:
    command: |4
         *(BETA)*  Deploy an Apigee archive deployment to an environment.

        `gcloud beta apigee archives deploy` installs an archive deployment in an Apigee environment.

        By default, the archive deployment will be deployed on the remote management
        plane for the specified Apigee organization. To deploy on a locally running
        Apigee emulator, use the `--local` flag.
    flag:
        async: |-
            If set, returns immediately and outputs a description of the long running operation that was launched. Else, `{command}` will block until the archive deployment has been successfully deployed to the specified environment.
            +
            To monitor the operation once it's been launched, run `{grandparent_command} operations describe OPERATION_NAME`.
        bundle-file: The zip file containing an archive to upload.
        environment: |-
            ID of the environment or fully qualified identifier for the environment.
            +
            To set the `environment` attribute:
            * provide the argument `--environment` on the command line.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-async: |-
            If set, returns immediately and outputs a description of the long running operation that was launched. Else, `{command}` will block until the archive deployment has been successfully deployed to the specified environment.

            To monitor the operation once it's been launched, run `{grandparent_command} operations describe OPERATION_NAME`.
        organization: |-
            Apigee organization containing the environment. If unspecified, the Cloud Platform project's associated organization will be used.
            +
            To set the `organization` attribute:
            * provide the argument `--environment` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line;
            * set the property [project] or provide the argument [--project] on the command line, using a Cloud Platform project with an associated Apigee organization.
        source: The source directory of the archive to upload.
