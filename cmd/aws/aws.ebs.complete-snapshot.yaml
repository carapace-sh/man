name: complete-snapshot
description: Seals and completes the snapshot after all of the required blocks of data have been written to it.
flags:
    --changed-blocks-count=!: The number of blocks that were written to the snapshot.
    --checksum-aggregation-method=: The aggregation method used to generate the checksum.
    --checksum-algorithm=: The algorithm used to generate the checksum.
    --checksum=: An aggregated Base-64 SHA256 checksum based on the checksums of each written block.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --snapshot-id=!: The ID of the snapshot.
completion:
    flag:
        checksum-aggregation-method:
            - LINEAR
        checksum-algorithm:
            - SHA256
documentation:
    command: |-
        Seals and completes the snapshot after all of the required blocks of data have been written to it. Completing the snapshot changes the status to `completed`. You cannot write new blocks to a snapshot after it has been completed.

        You should always retry requests that receive server (`5xx`) error responses, and `ThrottlingException` and `RequestThrottledException` client error responses. For more information see [Error retries](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/error-retries.html) in the *Amazon Elastic Compute Cloud User Guide*.
    flag:
        changed-blocks-count: The number of blocks that were written to the snapshot.
        checksum: |-
            An aggregated Base-64 SHA256 checksum based on the checksums of each written block.

            To generate the aggregated checksum using the linear aggregation method, arrange the checksums for each written block in ascending order of their block index, concatenate them to form a single string, and then generate the checksum on the entire string using the SHA256 algorithm.
        checksum-aggregation-method: The aggregation method used to generate the checksum. Currently, the only supported aggregation method is `LINEAR`.
        checksum-algorithm: The algorithm used to generate the checksum. Currently, the only supported algorithm is `SHA256`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        snapshot-id: The ID of the snapshot.
