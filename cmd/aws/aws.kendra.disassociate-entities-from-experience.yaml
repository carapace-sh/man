name: disassociate-entities-from-experience
description: Prevents users or groups in your IAM Identity Center identity source from accessing your Amazon Kendra experience.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --entity-list=!:
        description: Lists users or groups in your IAM Identity Center identity source.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The identifier of your Amazon Kendra experience.
    --index-id=!: The identifier of the index for your Amazon Kendra experience.
documentation:
    command: Prevents users or groups in your IAM Identity Center identity source from accessing your Amazon Kendra experience. You can create an Amazon Kendra experience such as a search application. For more information on creating a search application experience, see [Building a search experience with no code](https://docs.aws.amazon.com/kendra/latest/dg/deploying-search-experience-no-code.html).
