name: disable-image-deregistration-protection
description: Disables deregistration protection for an AMI.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --image-id=!: The ID of the AMI.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: |-
        Disables deregistration protection for an AMI. When deregistration protection is disabled, the AMI can be deregistered.

        If you chose to include a 24-hour cooldown period when you enabled deregistration protection for the AMI, then, when you disable deregistration protection, you won’t immediately be able to deregister the AMI.

        For more information, see [Protect an Amazon EC2 AMI from deregistration](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ami-deregistration-protection.html) in the *Amazon EC2 User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        image-id: The ID of the AMI.
