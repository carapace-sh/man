name: execute-transaction
description: This operation allows you to perform transactional reads or writes on data stored in DynamoDB, using PartiQL.
flags:
    --client-request-token=: Set this value to get remaining results, if `NextToken` was returned in the statement response.
    --return-consumed-capacity=: Determines the level of detail about either provisioned or on-demand throughput consumption that is returned in the response.
    --transact-statements=!: The list of PartiQL statements representing the transaction to run.
completion:
    flag:
        return-consumed-capacity:
            - INDEXES
            - TOTAL
            - NONE
documentation:
    command: |-
        This operation allows you to perform transactional reads or writes on data stored in DynamoDB, using PartiQL.

        The entire transaction must consist of either read statements or write statements, you cannot mix both in one transaction. The EXISTS function is an exception and can be used to check the condition of specific attributes of the item in a similar manner to `ConditionCheck` in the [TransactWriteItems](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html#transaction-apis-txwriteitems) API.
    flag:
        client-request-token: Set this value to get remaining results, if `NextToken` was returned in the statement response.
        return-consumed-capacity: Determines the level of detail about either provisioned or on-demand throughput consumption that is returned in the response. For more information, see [TransactGetItems](https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_TransactGetItems.html) and [TransactWriteItems](https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_TransactWriteItems.html).
        transact-statements: The list of PartiQL statements representing the transaction to run.
