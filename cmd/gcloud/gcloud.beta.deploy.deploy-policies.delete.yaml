name: delete
description: '*(BETA)*  Delete a deploy policy.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Location of the deploy policy.
documentation:
    command: '*(BETA)*  Delete a deploy policy for a specified region.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            Location of the deploy policy.
            +

            To set the `region` attribute:
            * provide the argument `deploy_policy` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
