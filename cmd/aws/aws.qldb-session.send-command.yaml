name: send-command
description: Sends a command to an Amazon QLDB ledger.
flags:
    --abort-transaction=: Command to abort the current transaction.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --commit-transaction=: Command to commit the specified transaction.
    --end-session=: Command to end the current session.
    --execute-statement=: Command to execute a statement in the specified transaction.
    --fetch-page=: Command to fetch a page.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --session-token=: Specifies the session token for the current command.
    --start-session=: Command to start a new session.
    --start-transaction=: Command to start a new transaction.
documentation:
    command: |-
        Sends a command to an Amazon QLDB ledger.

        Instead of interacting directly with this API, we recommend using the QLDB driver or the QLDB shell to execute data transactions on a ledger.

        - If you are working with an AWS SDK, use the QLDB driver. The driver provides a high-level abstraction layer above this *QLDB Session* data plane and manages `SendCommand` API calls for you. For information and a list of supported programming languages, see [Getting started with the driver](https://docs.aws.amazon.com/qldb/latest/developerguide/getting-started-driver.html) in the *Amazon QLDB Developer Guide*.
        - If you are working with the AWS Command Line Interface (AWS CLI), use the QLDB shell. The shell is a command line interface that uses the QLDB driver to interact with a ledger. For information, see [Accessing Amazon QLDB using the QLDB shell](https://docs.aws.amazon.com/qldb/latest/developerguide/data-shell.html).
    flag:
        abort-transaction: Command to abort the current transaction.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        commit-transaction: Command to commit the specified transaction.
        end-session: Command to end the current session.
        execute-statement: Command to execute a statement in the specified transaction.
        fetch-page: Command to fetch a page.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        session-token: |-
            Specifies the session token for the current command. A session token is constant throughout the life of the session.

            To obtain a session token, run the `StartSession` command. This `SessionToken` is required for every subsequent command that is issued during the current session.
        start-session: Command to start a new session. A session token is obtained as part of the response.
        start-transaction: Command to start a new transaction.
