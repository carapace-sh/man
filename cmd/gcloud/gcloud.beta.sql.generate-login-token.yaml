name: generate-login-token
description: '*(BETA)*  Generate an IAM login token for Cloud SQL.'
flags:
    --application-default-credential: Use application default credentials to generate the login token.
    --instance=: Cloud SQL instance ID.
    --no-application-default-credential&: Use application default credentials to generate the login token.
documentation:
    command: |
        *(BETA)*  gcloud beta sql generate-login-token generates an IAM token to use for logging in to Cloud SQL instances.
    flag:
        application-default-credential: Use application default credentials to generate the login token.
        instance: Cloud SQL instance ID.
        no-application-default-credential: Use application default credentials to generate the login token.
