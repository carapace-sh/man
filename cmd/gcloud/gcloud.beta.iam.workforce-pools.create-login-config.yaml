name: create-login-config
description: '*(BETA)*  Create a login configuration file to enable sign-in via a web-based authorization flow using Workforce Identity Federation.'
flags:
    --activate: Sets the property `auth/login_config_file` to the created login configuration file.
    --enable-mtls&: Use mTLS for STS endpoints.
    --no-activate&: Sets the property `auth/login_config_file` to the created login configuration file.
    --no-enable-mtls&: Use mTLS for STS endpoints.
    --output-file=!: Location to store the generated login configuration file.
    --universe-cloud-web-domain=&: The universe cloud web domain.
documentation:
    command: |-
        *(BETA)*  This command creates a configuration file to enable browser based
        third-party sign in with Workforce Identity Federation through
        `gcloud auth login --login-config=/path/to/config.json`.
    flag:
        activate: Sets the property `auth/login_config_file` to the created login configuration file. Calling `gcloud auth login` will automatically use this login configuration unless it is explicitly unset.
        enable-mtls: Use mTLS for STS endpoints.
        no-activate: Sets the property `auth/login_config_file` to the created login configuration file. Calling `gcloud auth login` will automatically use this login configuration unless it is explicitly unset.
        no-enable-mtls: Use mTLS for STS endpoints.
        output-file: Location to store the generated login configuration file.
        universe-cloud-web-domain: The universe cloud web domain.
