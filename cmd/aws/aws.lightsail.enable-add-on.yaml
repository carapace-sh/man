name: enable-add-on
description: Enables or modifies an add-on for an Amazon Lightsail resource.
flags:
    --add-on-request=!: An array of strings representing the add-on to enable or modify.
    --resource-name=!: The name of the source resource for which to enable or modify the add-on.
documentation:
    command: Enables or modifies an add-on for an Amazon Lightsail resource. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-configuring-automatic-snapshots).
    flag:
        add-on-request: An array of strings representing the add-on to enable or modify.
        resource-name: The name of the source resource for which to enable or modify the add-on.
