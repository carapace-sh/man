name: set
description: Set a secret's replication.
flags:
    --replication-policy-file=!: JSON or YAML file to use to read the replication policy.
documentation:
    command: |-
        Sets the replication policy for the given secret as defined in a JSON or YAML
        file. The locations that a Secret is replicated to cannot be changed.

        ## EXAMPLES

        To set the replication of a secret named 'my-secret' to the contents of
        my-file.json, run:

          $ gcloud secrets replication set my-secret --replication-policy-file=my-file.json
    flag:
        replication-policy-file: JSON or YAML file to use to read the replication policy. The file must conform to https://cloud.google.com/secret-manager/docs/reference/rest/v1/projects.secrets#replication.Set this to "-" to read from stdin.
