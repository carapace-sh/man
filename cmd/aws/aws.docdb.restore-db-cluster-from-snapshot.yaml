name: restore-db-cluster-from-snapshot
description: Creates a new cluster from a snapshot or cluster snapshot.
flags:
    --availability-zones=: Provides the list of Amazon EC2 Availability Zones that instances in the restored DB cluster can be created in.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-cluster-identifier=!: The name of the cluster to create from the snapshot or cluster snapshot.
    --db-cluster-parameter-group-name=: The name of the DB cluster parameter group to associate with this DB cluster.
    --db-subnet-group-name=: The name of the subnet group to use for the new cluster.
    --deletion-protection: Specifies whether this cluster can be deleted.
    --enable-cloudwatch-logs-exports=: A list of log types that must be enabled for exporting to Amazon CloudWatch Logs.
    --engine-version=: The version of the database engine to use for the new cluster.
    --engine=!: The database engine to use for the new cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-id=: The KMS key identifier to use when restoring an encrypted cluster from a DB snapshot or cluster snapshot.
    --no-deletion-protection: Specifies whether this cluster can be deleted.
    --port=: The port number on which the new cluster accepts connections.
    --serverless-v2-scaling-configuration=: Contains the scaling configuration of an Amazon DocumentDB Serverless cluster.
    --snapshot-identifier=!: The identifier for the snapshot or cluster snapshot to restore from.
    --storage-type=: The storage type to associate with the DB cluster.
    --tags=: The tags to be assigned to the restored cluster.
    --vpc-security-group-ids=: A list of virtual private cloud (VPC) security groups that the new cluster will belong to.
documentation:
    command: |-
        Creates a new cluster from a snapshot or cluster snapshot.

        If a snapshot is specified, the target cluster is created from the source DB snapshot with a default configuration and default security group.

        If a cluster snapshot is specified, the target cluster is created from the source cluster restore point with the same configuration as the original source DB cluster, except that the new cluster is created with the default security group.
    flag:
        availability-zones: Provides the list of Amazon EC2 Availability Zones that instances in the restored DB cluster can be created in.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-cluster-identifier: |-
            The name of the cluster to create from the snapshot or cluster snapshot. This parameter isn't case sensitive.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens.
            - The first character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.

            Example: `my-snapshot-id`
        db-cluster-parameter-group-name: |-
            The name of the DB cluster parameter group to associate with this DB cluster.

            *Type:* String.       *Required:* No.

            If this argument is omitted, the default DB cluster parameter group is used. If supplied, must match the name of an existing default DB cluster parameter group. The string must consist of from 1 to 255 letters, numbers or hyphens. Its first character must be a letter, and it cannot end with a hyphen or contain two consecutive hyphens.
        db-subnet-group-name: |-
            The name of the subnet group to use for the new cluster.

            Constraints: If provided, must match the name of an existing `DBSubnetGroup`.

            Example: `mySubnetgroup`
        deletion-protection: Specifies whether this cluster can be deleted. If `DeletionProtection` is enabled, the cluster cannot be deleted unless it is modified and `DeletionProtection` is disabled. `DeletionProtection` protects clusters from being accidentally deleted.
        enable-cloudwatch-logs-exports: A list of log types that must be enabled for exporting to Amazon CloudWatch Logs.
        engine: |-
            The database engine to use for the new cluster.

            Default: The same as source.

            Constraint: Must be compatible with the engine of the source.
        engine-version: The version of the database engine to use for the new cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-id: |-
            The KMS key identifier to use when restoring an encrypted cluster from a DB snapshot or cluster snapshot.

            The KMS key identifier is the Amazon Resource Name (ARN) for the KMS encryption key. If you are restoring a cluster with the same Amazon Web Services account that owns the KMS encryption key used to encrypt the new cluster, then you can use the KMS key alias instead of the ARN for the KMS encryption key.

            If you do not specify a value for the `KmsKeyId` parameter, then the following occurs:

            - If the snapshot or cluster snapshot in `SnapshotIdentifier` is encrypted, then the restored cluster is encrypted using the KMS key that was used to encrypt the snapshot or the cluster snapshot.
            - If the snapshot or the cluster snapshot in `SnapshotIdentifier` is not encrypted, then the restored DB cluster is not encrypted.
        port: |-
            The port number on which the new cluster accepts connections.

            Constraints: Must be a value from `1150` to `65535`.

            Default: The same port as the original cluster.
        serverless-v2-scaling-configuration: Contains the scaling configuration of an Amazon DocumentDB Serverless cluster.
        snapshot-identifier: |-
            The identifier for the snapshot or cluster snapshot to restore from.

            You can use either the name or the Amazon Resource Name (ARN) to specify a cluster snapshot. However, you can use only the ARN to specify a snapshot.

            Constraints:

            - Must match the identifier of an existing snapshot.
        storage-type: |-
            The storage type to associate with the DB cluster.

            For information on storage types for Amazon DocumentDB clusters, see Cluster storage configurations in the *Amazon DocumentDB Developer Guide*.

            Valid values for storage type - `standard | iopt1`

            Default value is `standard`
        tags: The tags to be assigned to the restored cluster.
        vpc-security-group-ids: A list of virtual private cloud (VPC) security groups that the new cluster will belong to.
