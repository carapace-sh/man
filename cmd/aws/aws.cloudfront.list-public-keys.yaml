name: list-public-keys
description: List all public keys that have been added to CloudFront for this account.
flags:
    --marker=: Use this when paginating results to indicate where to begin in your list of public keys.
    --max-items=: The maximum number of public keys you want in the response body.
documentation:
    command: List all public keys that have been added to CloudFront for this account.
    flag:
        marker: Use this when paginating results to indicate where to begin in your list of public keys. The results include public keys in the list that occur after the marker. To get the next page of results, set the `Marker` to the value of the `NextMarker` from the current page's response (which is also the ID of the last public key on that page).
        max-items: The maximum number of public keys you want in the response body.
