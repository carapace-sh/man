name: create-scan
description: Use to create a scan using code uploaded to an Amazon S3 bucket.
flags:
    --analysis-type=: The type of analysis you want CodeGuru Security to perform in the scan, either `Security` or `All`.
    --client-token=: The idempotency token for the request.
    --resource-id=!: The identifier for the resource object to be scanned.
    --scan-name=!: The unique name that CodeGuru Security uses to track revisions across multiple scans of the same resource.
    --scan-type=: The type of scan, either `Standard` or `Express`.
    --tags=: An array of key-value pairs used to tag a scan.
completion:
    flag:
        analysis-type:
            - Security
            - All
        scan-type:
            - Standard
            - Express
documentation:
    command: Use to create a scan using code uploaded to an Amazon S3 bucket.
    flag:
        analysis-type: The type of analysis you want CodeGuru Security to perform in the scan, either `Security` or `All`. The `Security` type only generates findings related to security. The `All` type generates both security findings and quality findings. Defaults to `Security` type if missing.
        client-token: The idempotency token for the request. Amazon CodeGuru Security uses this value to prevent the accidental creation of duplicate scans if there are failures and retries.
        resource-id: The identifier for the resource object to be scanned.
        scan-name: The unique name that CodeGuru Security uses to track revisions across multiple scans of the same resource. Only allowed for a `STANDARD` scan type.
        scan-type: |-
            The type of scan, either `Standard` or `Express`. Defaults to `Standard` type if missing.

            `Express` scans run on limited resources and use a limited set of detectors to analyze your code in near-real time. `Standard` scans have standard resource limits and use the full set of detectors to analyze your code.
        tags: |-
            An array of key-value pairs used to tag a scan. A tag is a custom attribute label with two parts:

            - A tag key. For example, `CostCenter`, `Environment`, or `Secret`. Tag keys are case sensitive.
            - An optional tag value field. For example, `111122223333`, `Production`, or a team name. Omitting the tag value is the same as using an empty string. Tag values are case sensitive.
