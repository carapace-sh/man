name: update-flow-entitlement
description: Updates an entitlement.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the entitlement.
    --encryption=: The type of encryption that will be used on the output associated with this entitlement.
    --entitlement-arn=!: The Amazon Resource Name (ARN) of the entitlement that you want to update.
    --entitlement-status=: An indication of whether you want to enable the entitlement to allow access, or disable it to stop streaming content to the subscriber’s flow temporarily.
    --flow-arn=!: The ARN of the flow that is associated with the entitlement that you want to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --subscribers=: The Amazon Web Services account IDs that you want to share your content with.
completion:
    flag:
        entitlement-status:
            - ENABLED
            - DISABLED
documentation:
    command: Updates an entitlement. You can change an entitlement's description, subscribers, and encryption. If you change the subscribers, the service will remove the outputs that are are used by the subscribers that are removed.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the entitlement. This description appears only on the MediaConnect console and will not be seen by the subscriber or end user.
        encryption: 'The type of encryption that will be used on the output associated with this entitlement. Allowable encryption types: static-key, speke.'
        entitlement-arn: The Amazon Resource Name (ARN) of the entitlement that you want to update.
        entitlement-status: An indication of whether you want to enable the entitlement to allow access, or disable it to stop streaming content to the subscriber’s flow temporarily. If you don’t specify the `entitlementStatus` field in your request, MediaConnect leaves the value unchanged.
        flow-arn: The ARN of the flow that is associated with the entitlement that you want to update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        subscribers: The Amazon Web Services account IDs that you want to share your content with. The receiving accounts (subscribers) will be allowed to create their own flow using your content as the source.
