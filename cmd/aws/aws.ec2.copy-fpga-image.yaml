name: copy-fpga-image
description: Copies the specified Amazon FPGA Image (AFI) to the current Region.
flags:
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=: The description for the new AFI.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --name=: The name for the new AFI.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --source-fpga-image-id=!: The ID of the source AFI.
    --source-region=!: The Region that contains the source AFI.
documentation:
    command: Copies the specified Amazon FPGA Image (AFI) to the current Region.
    flag:
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        description: The description for the new AFI.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        name: The name for the new AFI. The default is the name of the source AFI.
        source-fpga-image-id: The ID of the source AFI.
        source-region: The Region that contains the source AFI.
