name: provision
description: '*(ALPHA)*  Provision a new Spectrum Access System''s deployment.'
hidden: true
flags:
    --deployment-name=: The display name to use in case a new SAS Portal deployment needs to be created.
    --organization-id=: The id of the organization to create a new deployment under.
    --organization-name=: The display name to use in case a new SAS Portal organization needs to be created.
documentation:
    command: |-
        ## EXAMPLES

        The following command provisions a new SAS deployment:

          $ gcloud cbrs-spectrum-access provision --organization-name=MyOrgName
          --deployment-name=MyDeploymentName
    flag:
        deployment-name: The display name to use in case a new SAS Portal deployment needs to be created. If not set, a default display name of the form "[ID]" will be used where ID is the current Cloud Platform Project ID.
        organization-id: The id of the organization to create a new deployment under. If left empty a new organization will be created with the name entered via the `--organization-name` flag. Either this or `--organization-name` must be set.
        organization-name: The display name to use in case a new SAS Portal organization needs to be created. If creating a deployment under an existing organization then the `--organization-id` flag must be set instead.
