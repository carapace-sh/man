name: create
description: '*(ALPHA)*  Backup a service.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: The description of this backup.
    --location=: The location of the Dataproc Metastore service.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --service=: The identifier of the Dataproc Metastore service
documentation:
    command: |
        *(ALPHA)*  Backup metadata and the resource configuration of a service.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: The description of this backup.
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        service: |-
            The identifier of the Dataproc Metastore service
            +
            To set the `service` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--service` on the command line.
