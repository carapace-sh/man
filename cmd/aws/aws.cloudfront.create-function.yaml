name: create-function
description: Creates a CloudFront function.
flags:
    --function-code=!: The function code.
    --function-config=!: Configuration information about the function, including an optional comment and the function's runtime.
    --name=!: A name to identify the function.
documentation:
    command: |-
        Creates a CloudFront function.

        To create a function, you provide the function code and some configuration information about the function. The response contains an Amazon Resource Name (ARN) that uniquely identifies the function.

        When you create a function, it's in the `DEVELOPMENT` stage. In this stage, you can test the function with `TestFunction`, and update it with `UpdateFunction`.

        When you're ready to use your function with a CloudFront distribution, use `PublishFunction` to copy the function from the `DEVELOPMENT` stage to `LIVE`. When it's live, you can attach the function to a distribution's cache behavior, using the function's ARN.
    flag:
        function-code: The function code. For more information about writing a CloudFront function, see [Writing function code for CloudFront Functions](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/writing-function-code.html) in the *Amazon CloudFront Developer Guide*.
        function-config: Configuration information about the function, including an optional comment and the function's runtime.
        name: A name to identify the function.
