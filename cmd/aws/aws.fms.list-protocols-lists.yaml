name: list-protocols-lists
description: Returns an array of `ProtocolsListDataSummary` objects.
flags:
    --default-lists: Specifies whether the lists to retrieve are default lists owned by Firewall Manager.
    --max-results=!: The maximum number of objects that you want Firewall Manager to return for this request.
    --next-token=: If you specify a value for `MaxResults` in your list request, and you have more objects than the maximum, Firewall Manager returns this token in the response.
    --no-default-lists: Specifies whether the lists to retrieve are default lists owned by Firewall Manager.
documentation:
    command: Returns an array of `ProtocolsListDataSummary` objects.
    flag:
        default-lists: Specifies whether the lists to retrieve are default lists owned by Firewall Manager.
        max-results: |-
            The maximum number of objects that you want Firewall Manager to return for this request. If more objects are available, in the response, Firewall Manager provides a `NextToken` value that you can use in a subsequent call to get the next batch of objects.

            If you don't specify this, Firewall Manager returns all available objects.
        next-token: If you specify a value for `MaxResults` in your list request, and you have more objects than the maximum, Firewall Manager returns this token in the response. For all but the first request, you provide the token returned by the prior request in the request parameters, to retrieve the next batch of objects.
