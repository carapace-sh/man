name: update-channel
description: Update the specified channel.
flags:
    --channel-group-name=!: The name that describes the channel group.
    --channel-name=!: The name that describes the channel.
    --description=: Any descriptive information that you want to add to the channel for future identification purposes.
    --etag=: The expected current Entity Tag (ETag) for the resource.
    --input-switch-configuration=: The configuration for input switching based on the media quality confidence score (MQCS) as provided from AWS Elemental MediaLive.
    --output-header-configuration=: The settings for what common media server data (CMSD) headers AWS Elemental MediaPackage includes in responses to the CDN.
documentation:
    command: |-
        Update the specified channel. You can edit if MediaPackage sends ingest or egress access logs to the CloudWatch log group, if content will be encrypted, the description on a channel, and your channel's policy settings. You can't edit the name of the channel or CloudFront distribution details.

        Any edits you make that impact the video output may not be reflected for a few minutes.
    flag:
        channel-group-name: The name that describes the channel group. The name is the primary identifier for the channel group, and must be unique for your account in the AWS Region.
        channel-name: The name that describes the channel. The name is the primary identifier for the channel, and must be unique for your account in the AWS Region and channel group.
        description: Any descriptive information that you want to add to the channel for future identification purposes.
        etag: The expected current Entity Tag (ETag) for the resource. If the specified ETag does not match the resource's current entity tag, the update request will be rejected.
        input-switch-configuration: The configuration for input switching based on the media quality confidence score (MQCS) as provided from AWS Elemental MediaLive. This setting is valid only when `InputType` is `CMAF`.
        output-header-configuration: The settings for what common media server data (CMSD) headers AWS Elemental MediaPackage includes in responses to the CDN. This setting is valid only when `InputType` is `CMAF`.
