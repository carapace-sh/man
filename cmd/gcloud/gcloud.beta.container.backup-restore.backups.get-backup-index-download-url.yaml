name: get-backup-index-download-url
description: '*(BETA)*  Get a backup index download URL.'
flags:
    --backup-plan=: Backup Plan name.
    --location=: Google Cloud location.
documentation:
    command: |-
        *(BETA)*  Get backup index download URL for a Backup for GKE backup. Backup index
        displays resources' basic information stored in the backup.

        ## EXAMPLES

        To get the backup index associated with a backup ``my-backup'' in backup plan
        ``my-backup-plan'' in project ``my-project'' in location ``us-central1'', run:

          $ gcloud beta container backup-restore backups get-backup-index-download-url my-backup --project=my-project --location=us-central1
          --backup-plan=my-backup-plan
    flag:
        backup-plan: |-
            Backup Plan name.
            +
            To set the `backup-plan` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--backup-plan` on the command line;
            * set the property `gkebackup/backup_plan`.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
