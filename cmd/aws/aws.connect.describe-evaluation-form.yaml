name: describe-evaluation-form
description: Describes an evaluation form in the specified Amazon Connect instance.
flags:
    --evaluation-form-id=!: A unique identifier for the contact evaluation.
    --evaluation-form-version=: A version of the evaluation form.
    --instance-id=!: The identifier of the Amazon Connect instance.
documentation:
    command: Describes an evaluation form in the specified Amazon Connect instance. If the version property is not provided, the latest version of the evaluation form is described.
    flag:
        evaluation-form-id: A unique identifier for the contact evaluation.
        evaluation-form-version: A version of the evaluation form.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
