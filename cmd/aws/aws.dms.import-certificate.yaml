name: import-certificate
description: Uploads the specified certificate.
flags:
    --certificate-identifier=!: A customer-assigned name for the certificate.
    --certificate-pem=: The contents of a `.pem` file, which contains an X.509 certificate.
    --certificate-wallet=: The location of an imported Oracle Wallet certificate for use with SSL.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-id=: An KMS key identifier that is used to encrypt the certificate.
    --tags=:
        description: The tags associated with the certificate.
        nargs: -1
documentation:
    command: Uploads the specified certificate.
    flag:
        certificate-identifier: A customer-assigned name for the certificate. Identifiers must begin with a letter and must contain only ASCII letters, digits, and hyphens. They can't end with a hyphen or contain two consecutive hyphens.
        certificate-pem: The contents of a `.pem` file, which contains an X.509 certificate.
        certificate-wallet: |-
            The location of an imported Oracle Wallet certificate for use with SSL. Provide the name of a `.sso` file using the `fileb://` prefix. You can't provide the certificate inline.

            Example: `filebase64("${path.root}/rds-ca-2019-root.sso")`
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-id: |-
            An KMS key identifier that is used to encrypt the certificate.

            If you don't specify a value for the `KmsKeyId` parameter, then DMS uses your default encryption key.

            KMS creates the default encryption key for your Amazon Web Services account. Your Amazon Web Services account has a different default encryption key for each Amazon Web Services Region.
        tags: The tags associated with the certificate.
