name: update-run-group
description: Updates the settings of a run group and returns a response with no body if the operation is successful.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The group's ID.
    --max-cpus=: The maximum number of CPUs to use.
    --max-duration=: A maximum run time for the group in minutes.
    --max-gpus=: The maximum GPUs that can be used by a run group.
    --max-runs=: The maximum number of concurrent runs for the group.
    --name=: A name for the group.
documentation:
    command: |-
        Updates the settings of a run group and returns a response with no body if the operation is successful.

        You can update the following settings with `UpdateRunGroup`:

        - Maximum number of CPUs
        - Run time (measured in minutes)
        - Number of GPUs
        - Number of concurrent runs
        - Group name

        To confirm that the settings have been successfully updated, use the `ListRunGroups` or `GetRunGroup` API operations to verify that the desired changes have been made.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id: The group's ID.
        max-cpus: The maximum number of CPUs to use.
        max-duration: A maximum run time for the group in minutes.
        max-gpus: The maximum GPUs that can be used by a run group.
        max-runs: The maximum number of concurrent runs for the group.
        name: A name for the group.
