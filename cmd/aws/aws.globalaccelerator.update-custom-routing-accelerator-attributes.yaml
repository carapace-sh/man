name: update-custom-routing-accelerator-attributes
description: Update the attributes for a custom routing accelerator.
flags:
    --accelerator-arn=!: The Amazon Resource Name (ARN) of the custom routing accelerator to update attributes for.
    --flow-logs-enabled=: Update whether flow logs are enabled.
    --flow-logs-s3-bucket=: The name of the Amazon S3 bucket for the flow logs.
    --flow-logs-s3-prefix=: Update the prefix for the location in the Amazon S3 bucket for the flow logs.
documentation:
    command: Update the attributes for a custom routing accelerator.
    flag:
        accelerator-arn: The Amazon Resource Name (ARN) of the custom routing accelerator to update attributes for.
        flow-logs-enabled: |-
            Update whether flow logs are enabled. The default value is false. If the value is true, `FlowLogsS3Bucket` and `FlowLogsS3Prefix` must be specified.

            For more information, see [Flow logs](https://docs.aws.amazon.com/global-accelerator/latest/dg/monitoring-global-accelerator.flow-logs.html) in the *Global Accelerator Developer Guide*.
        flow-logs-s3-bucket: The name of the Amazon S3 bucket for the flow logs. Attribute is required if `FlowLogsEnabled` is `true`. The bucket must exist and have a bucket policy that grants Global Accelerator permission to write to the bucket.
        flow-logs-s3-prefix: |-
            Update the prefix for the location in the Amazon S3 bucket for the flow logs. Attribute is required if `FlowLogsEnabled` is `true`.

            If you don’t specify a prefix, the flow logs are stored in the root of the bucket. If you specify slash (/) for the S3 bucket prefix, the log file bucket folder structure will include a double slash (//), like the following:

            DOC-EXAMPLE-BUCKET//AWSLogs/aws\_account\_id
