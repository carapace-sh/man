name: create-configured-table
description: Creates a new configured table resource.
flags:
    --allowed-columns=!: The columns of the underlying table that can be used by collaborations or analysis rules.
    --analysis-method=!: The analysis method allowed for the configured tables.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description for the configured table.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the configured table.
    --selected-analysis-methods=: The analysis methods to enable for the configured table.
    --table-reference=!: A reference to the table being configured.
    --tags=: An optional label that you can assign to a resource when you create it.
completion:
    flag:
        analysis-method:
            - DIRECT_QUERY
            - DIRECT_JOB
            - MULTIPLE
documentation:
    command: Creates a new configured table resource.
    flag:
        allowed-columns: The columns of the underlying table that can be used by collaborations or analysis rules.
        analysis-method: |-
            The analysis method allowed for the configured tables.

            `DIRECT_QUERY` allows SQL queries to be run directly on this table.

            `DIRECT_JOB` allows PySpark jobs to be run directly on this table.

            `MULTIPLE` allows both SQL queries and PySpark jobs to be run directly on this table.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description for the configured table.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the configured table.
        selected-analysis-methods: The analysis methods to enable for the configured table. When configured, you must specify at least two analysis methods.
        table-reference: A reference to the table being configured.
        tags: An optional label that you can assign to a resource when you create it. Each tag consists of a key and an optional value, both of which you define. When you use tagging, you can also use tag-based access control in IAM policies to control access to this resource.
