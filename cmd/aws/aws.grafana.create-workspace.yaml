name: create-workspace
description: Creates a *workspace*.
flags:
    --account-access-type=!: Specifies whether the workspace can access Amazon Web Services resources in this Amazon Web Services account only, or whether it can also access Amazon Web Services resources in other accounts in the same organization.
    --authentication-providers=!: Specifies whether this workspace uses SAML 2.0, IAM Identity Center, or both to authenticate users for using the Grafana console within a workspace.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive, user-provided identifier to ensure the idempotency of the request.
    --configuration=: The configuration string for the workspace that you create.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --grafana-version=: Specifies the version of Grafana to support in the new workspace.
    --network-access-control=: Configuration for network access to your workspace.
    --organization-role-name=: The name of an IAM role that already exists to use with Organizations to access Amazon Web Services data sources and notification channels in other accounts in an organization.
    --permission-type=!: When creating a workspace through the Amazon Web Services API, CLI or Amazon Web Services CloudFormation, you must manage IAM roles and provision the permissions that the workspace needs to use Amazon Web Services data sources and notification channels.
    --stack-set-name=: The name of the CloudFormation stack set to use to generate IAM roles to be used for this workspace.
    --tags=: The list of tags associated with the workspace.
    --vpc-configuration=: The configuration settings for an Amazon VPC that contains data sources for your Grafana workspace to connect to.
    --workspace-data-sources=: This parameter is for internal use only, and should not be used.
    --workspace-description=: A description for the workspace.
    --workspace-name=: The name for the workspace.
    --workspace-notification-destinations=: Specify the Amazon Web Services notification channels that you plan to use in this workspace.
    --workspace-organizational-units=: Specifies the organizational units that this workspace is allowed to use data sources from, if this workspace is in an account that is part of an organization.
    --workspace-role-arn=: Specified the IAM role that grants permissions to the Amazon Web Services resources that the workspace will view data from, including both data sources and notification channels.
completion:
    flag:
        account-access-type:
            - CURRENT_ACCOUNT
            - ORGANIZATION
        permission-type:
            - CUSTOMER_MANAGED
            - SERVICE_MANAGED
documentation:
    command: |-
        Creates a *workspace*. In a workspace, you can create Grafana dashboards and visualizations to analyze your metrics, logs, and traces. You don't have to build, package, or deploy any hardware to run the Grafana server.

        Don't use `CreateWorkspace` to modify an existing workspace. Instead, use [UpdateWorkspace](https://docs.aws.amazon.com/grafana/latest/APIReference/API_UpdateWorkspace.html).
    flag:
        account-access-type: Specifies whether the workspace can access Amazon Web Services resources in this Amazon Web Services account only, or whether it can also access Amazon Web Services resources in other accounts in the same organization. If you specify `ORGANIZATION`, you must specify which organizational units the workspace can access in the `workspaceOrganizationalUnits` parameter.
        authentication-providers: Specifies whether this workspace uses SAML 2.0, IAM Identity Center, or both to authenticate users for using the Grafana console within a workspace. For more information, see [User authentication in Amazon Managed Grafana](https://docs.aws.amazon.com/grafana/latest/userguide/authentication-in-AMG.html).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive, user-provided identifier to ensure the idempotency of the request.
        configuration: The configuration string for the workspace that you create. For more information about the format and configuration options available, see [Working in your Grafana workspace](https://docs.aws.amazon.com/grafana/latest/userguide/AMG-configure-workspace.html).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        grafana-version: |-
            Specifies the version of Grafana to support in the new workspace. If not specified, defaults to the latest version (for example, 10.4).

            To get a list of supported versions, use the `ListVersions` operation.
        network-access-control: |-
            Configuration for network access to your workspace.

            When this is configured, only listed IP addresses and VPC endpoints will be able to access your workspace. Standard Grafana authentication and authorization will still be required.

            If this is not configured, or is removed, then all IP addresses and VPC endpoints will be allowed. Standard Grafana authentication and authorization will still be required.
        organization-role-name: The name of an IAM role that already exists to use with Organizations to access Amazon Web Services data sources and notification channels in other accounts in an organization.
        permission-type: |-
            When creating a workspace through the Amazon Web Services API, CLI or Amazon Web Services CloudFormation, you must manage IAM roles and provision the permissions that the workspace needs to use Amazon Web Services data sources and notification channels.

            You must also specify a `workspaceRoleArn` for a role that you will manage for the workspace to use when accessing those datasources and notification channels.

            The ability for Amazon Managed Grafana to create and update IAM roles on behalf of the user is supported only in the Amazon Managed Grafana console, where this value may be set to `SERVICE_MANAGED`.

            Use only the `CUSTOMER_MANAGED` permission type when creating a workspace with the API, CLI or Amazon Web Services CloudFormation.

            For more information, see [Amazon Managed Grafana permissions and policies for Amazon Web Services data sources and notification channels](https://docs.aws.amazon.com/grafana/latest/userguide/AMG-manage-permissions.html).
        stack-set-name: The name of the CloudFormation stack set to use to generate IAM roles to be used for this workspace.
        tags: The list of tags associated with the workspace.
        vpc-configuration: |-
            The configuration settings for an Amazon VPC that contains data sources for your Grafana workspace to connect to.

            Connecting to a private VPC is not yet available in the Asia Pacific (Seoul) Region (ap-northeast-2).
        workspace-data-sources: This parameter is for internal use only, and should not be used.
        workspace-description: |-
            A description for the workspace. This is used only to help you identify this workspace.

            Pattern: `^[\\p{L}\\p{Z}\\p{N}\\p{P}]{0,2048}$`
        workspace-name: The name for the workspace. It does not have to be unique.
        workspace-notification-destinations: Specify the Amazon Web Services notification channels that you plan to use in this workspace. Specifying these data sources here enables Amazon Managed Grafana to create IAM roles and permissions that allow Amazon Managed Grafana to use these channels.
        workspace-organizational-units: Specifies the organizational units that this workspace is allowed to use data sources from, if this workspace is in an account that is part of an organization.
        workspace-role-arn: Specified the IAM role that grants permissions to the Amazon Web Services resources that the workspace will view data from, including both data sources and notification channels. You are responsible for managing the permissions for this role as new data sources or notification channels are added.
