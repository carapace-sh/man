name: list-package-version-dependencies
description: Returns the direct dependencies for a package version.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the repository that contains the requested package version dependencies.
    --format=!: The format of the package with the requested dependencies.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --namespace=: The namespace of the package version with the requested dependencies.
    --next-token=: The token for the next set of results.
    --package-version=!: A string that contains the package version (for example, `3.5.2`).
    --package=!: The name of the package versions' package.
    --repository=!: The name of the repository that contains the requested package version.
completion:
    flag:
        format:
            - npm
            - pypi
            - maven
            - nuget
            - generic
            - ruby
            - swift
            - cargo
documentation:
    command: Returns the direct dependencies for a package version. The dependencies are returned as [PackageDependency](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_PackageDependency.html) objects. CodeArtifact extracts the dependencies for a package version from the metadata file for the package format (for example, the `package.json` file for npm packages and the `pom.xml` file for Maven). Any package version dependencies that are not listed in the configuration file are not returned.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain: The name of the domain that contains the repository that contains the requested package version dependencies.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        format: The format of the package with the requested dependencies.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        namespace: |-
            The namespace of the package version with the requested dependencies. The package component that specifies its namespace depends on its type. For example:

            The namespace is required when listing dependencies from package versions of the following formats:

            - Maven

            <!--THE END-->

            - The namespace of a Maven package version is its `groupId`.
            - The namespace of an npm package version is its `scope`.
            - Python and NuGet package versions do not contain a corresponding component, package versions of those formats do not have a namespace.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        package: The name of the package versions' package.
        package-version: A string that contains the package version (for example, `3.5.2`).
        repository: The name of the repository that contains the requested package version.
