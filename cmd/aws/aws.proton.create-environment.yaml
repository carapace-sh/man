name: create-environment
description: Deploy a new environment.
flags:
    --codebuild-role-arn=: The Amazon Resource Name (ARN) of the IAM service role that allows Proton to provision infrastructure using CodeBuild-based provisioning on your behalf.
    --component-role-arn=: The Amazon Resource Name (ARN) of the IAM service role that Proton uses when provisioning directly defined components in this environment.
    --description=: A description of the environment that's being created and deployed.
    --environment-account-connection-id=: The ID of the environment account connection that you provide if you're provisioning your environment infrastructure resources to an environment account.
    --name=!: The name of the environment.
    --proton-service-role-arn=: The Amazon Resource Name (ARN) of the Proton service role that allows Proton to make calls to other services on your behalf.
    --provisioning-repository=: The linked repository that you use to host your rendered infrastructure templates for self-managed provisioning.
    --spec=!: A YAML formatted string that provides inputs as defined in the environment template bundle schema file.
    --tags=: An optional list of metadata items that you can associate with the Proton environment.
    --template-major-version=!: The major version of the environment template.
    --template-minor-version=: The minor version of the environment template.
    --template-name=!: The name of the environment template.
documentation:
    command: |-
        Deploy a new environment. An Proton environment is created from an environment template that defines infrastructure and resources that can be shared across services.

        **You can provision environments using the following methods:**

        - Amazon Web Services-managed provisioning: Proton makes direct calls to provision your resources.
        - Self-managed provisioning: Proton makes pull requests on your repository to provide compiled infrastructure as code (IaC) files that your IaC engine uses to provision resources.

        For more information, see [Environments](https://docs.aws.amazon.com/proton/latest/userguide/ag-environments.html) and [Provisioning methods](https://docs.aws.amazon.com/proton/latest/userguide/ag-works-prov-methods.html) in the *Proton User Guide*.
    flag:
        codebuild-role-arn: |-
            The Amazon Resource Name (ARN) of the IAM service role that allows Proton to provision infrastructure using CodeBuild-based provisioning on your behalf.

            To use CodeBuild-based provisioning for the environment or for any service instance running in the environment, specify either the `environmentAccountConnectionId` or `codebuildRoleArn` parameter.
        component-role-arn: |-
            The Amazon Resource Name (ARN) of the IAM service role that Proton uses when provisioning directly defined components in this environment. It determines the scope of infrastructure that a component can provision.

            You must specify `componentRoleArn` to allow directly defined components to be associated with this environment.

            For more information about components, see [Proton components](https://docs.aws.amazon.com/proton/latest/userguide/ag-components.html) in the *Proton User Guide*.
        description: A description of the environment that's being created and deployed.
        environment-account-connection-id: |-
            The ID of the environment account connection that you provide if you're provisioning your environment infrastructure resources to an environment account. For more information, see [Environment account connections](https://docs.aws.amazon.com/proton/latest/userguide/ag-env-account-connections.html) in the *Proton User guide*.

            To use Amazon Web Services-managed provisioning for the environment, specify either the `environmentAccountConnectionId` or `protonServiceRoleArn` parameter and omit the `provisioningRepository` parameter.
        name: The name of the environment.
        proton-service-role-arn: |-
            The Amazon Resource Name (ARN) of the Proton service role that allows Proton to make calls to other services on your behalf.

            To use Amazon Web Services-managed provisioning for the environment, specify either the `environmentAccountConnectionId` or `protonServiceRoleArn` parameter and omit the `provisioningRepository` parameter.
        provisioning-repository: |-
            The linked repository that you use to host your rendered infrastructure templates for self-managed provisioning. A linked repository is a repository that has been registered with Proton. For more information, see [CreateRepository]().

            To use self-managed provisioning for the environment, specify this parameter and omit the `environmentAccountConnectionId` and `protonServiceRoleArn` parameters.
        spec: A YAML formatted string that provides inputs as defined in the environment template bundle schema file. For more information, see [Environments](https://docs.aws.amazon.com/proton/latest/userguide/ag-environments.html) in the *Proton User Guide*.
        tags: |-
            An optional list of metadata items that you can associate with the Proton environment. A tag is a key-value pair.

            For more information, see [Proton resources and tagging](https://docs.aws.amazon.com/proton/latest/userguide/resources.html) in the *Proton User Guide*.
        template-major-version: The major version of the environment template.
        template-minor-version: The minor version of the environment template.
        template-name: The name of the environment template. For more information, see [Environment Templates](https://docs.aws.amazon.com/proton/latest/userguide/ag-templates.html) in the *Proton User Guide*.
