name: export
description: '*(BETA)*  Export Gateway Security Policy Rule.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --gateway-security-policy=: Id of the gateway security policy.
    --location=: The location Id.
documentation:
    command: |
        *(BETA)*  Export a Gateway Security Policy Rule.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
            The exported data will not contain any output-only fields.
            Alternatively, you may omit this flag to write to standard output.
            For a schema describing the export/import format, see
            $CLOUDSDKROOT/lib/googlecloudsdk/schemas/...
        gateway-security-policy: |-
            Id of the gateway security policy.
            +
            To set the `gateway-security-policy` attribute:
            * provide the argument `gateway_security_policy_rule` on the command line with a fully specified name;
            * provide the argument `--gateway-security-policy` on the command line.
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `gateway_security_policy_rule` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
