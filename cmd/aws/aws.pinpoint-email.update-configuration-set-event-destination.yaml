name: update-configuration-set-event-destination
description: Update the configuration of an event destination for a configuration set.
flags:
    --configuration-set-name=!: The name of the configuration set that contains the event destination that you want to modify.
    --event-destination-name=!: The name of the event destination that you want to modify.
    --event-destination=!: An object that defines the event destination.
documentation:
    command: |-
        Update the configuration of an event destination for a configuration set.

        In Amazon Pinpoint, *events* include message sends, deliveries, opens, clicks, bounces, and complaints. *Event destinations* are places that you can send information about these events to. For example, you can send event data to Amazon SNS to receive notifications when you receive bounces or complaints, or you can use Amazon Kinesis Data Firehose to stream data to Amazon S3 for long-term storage.
    flag:
        configuration-set-name: The name of the configuration set that contains the event destination that you want to modify.
        event-destination: An object that defines the event destination.
        event-destination-name: The name of the event destination that you want to modify.
