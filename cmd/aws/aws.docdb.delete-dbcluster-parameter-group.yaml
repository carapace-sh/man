name: delete-dbcluster-parameter-group
description: Deletes a specified cluster parameter group.
flags:
    --dbcluster-parameter-group-name=!: The name of the cluster parameter group.
documentation:
    command: Deletes a specified cluster parameter group. The cluster parameter group to be deleted can't be associated with any clusters.
    flag:
        dbcluster-parameter-group-name: |-
            The name of the cluster parameter group.

            Constraints:

            - Must be the name of an existing cluster parameter group.
            - You can't delete a default cluster parameter group.
            - Cannot be associated with any clusters.
