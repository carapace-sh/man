name: get-prefetch-schedule
description: Retrieves a prefetch schedule for a playback configuration.
flags:
    --name=!: The name of the prefetch schedule.
    --playback-configuration-name=!: Returns information about the prefetch schedule for a specific playback configuration.
documentation:
    command: Retrieves a prefetch schedule for a playback configuration. A prefetch schedule allows you to tell MediaTailor to fetch and prepare certain ads before an ad break happens. For more information about ad prefetching, see [Using ad prefetching](https://docs.aws.amazon.com/mediatailor/latest/ug/prefetching-ads.html) in the *MediaTailor User Guide*.
    flag:
        name: The name of the prefetch schedule. The name must be unique among all prefetch schedules that are associated with the specified playback configuration.
        playback-configuration-name: Returns information about the prefetch schedule for a specific playback configuration. If you call `GetPrefetchSchedule` on an expired prefetch schedule, MediaTailor returns an HTTP 404 status code.
