name: create-direct-connect-gateway
description: Creates a Direct Connect gateway, which is an intermediate object that enables you to connect a set of virtual interfaces and virtual private gateways.
flags:
    --amazon-side-asn=: The autonomous system number (ASN) for Border Gateway Protocol (BGP) to be configured on the Amazon side of the connection.
    --direct-connect-gateway-name=!: The name of the Direct Connect gateway.
    --tags=: The key-value pair tags associated with the request.
documentation:
    command: Creates a Direct Connect gateway, which is an intermediate object that enables you to connect a set of virtual interfaces and virtual private gateways. A Direct Connect gateway is global and visible in any Amazon Web Services Region after it is created. The virtual interfaces and virtual private gateways that are connected through a Direct Connect gateway can be in different Amazon Web Services Regions. This enables you to connect to a VPC in any Region, regardless of the Region in which the virtual interfaces are located, and pass traffic between them.
    flag:
        amazon-side-asn: The autonomous system number (ASN) for Border Gateway Protocol (BGP) to be configured on the Amazon side of the connection. The ASN must be in the private range of 64,512 to 65,534 or 4,200,000,000 to 4,294,967,294. The default is 64512.
        direct-connect-gateway-name: The name of the Direct Connect gateway.
        tags: The key-value pair tags associated with the request.
