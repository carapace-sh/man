name: create-batch-inference-job
description: Generates batch recommendations based on a list of items or users stored in Amazon S3 and exports the recommendations to an Amazon S3 bucket.
flags:
    --batch-inference-job-config=: The configuration details of a batch inference job.
    --batch-inference-job-mode=: The mode of the batch inference job.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filter-arn=: The ARN of the filter to apply to the batch inference job.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-input=!: The Amazon S3 path that leads to the input file to base your recommendations on.
    --job-name=!: The name of the batch inference job to create.
    --job-output=!: The path to the Amazon S3 bucket where the job's output will be stored.
    --num-results=: The number of recommendations to retrieve.
    --role-arn=!: The ARN of the Amazon Identity and Access Management role that has permissions to read and write to your input and output Amazon S3 buckets respectively.
    --solution-version-arn=!: The Amazon Resource Name (ARN) of the solution version that will be used to generate the batch inference recommendations.
    --tags=: A list of [tags](https://docs.aws.amazon.com/personalize/latest/dg/tagging-resources.html) to apply to the batch inference job.
    --theme-generation-config=: For theme generation jobs, specify the name of the column in your Items dataset that contains each item's name.
completion:
    flag:
        batch-inference-job-mode:
            - BATCH_INFERENCE
            - THEME_GENERATION
documentation:
    command: |-
        Generates batch recommendations based on a list of items or users stored in Amazon S3 and exports the recommendations to an Amazon S3 bucket.

        To generate batch recommendations, specify the ARN of a solution version and an Amazon S3 URI for the input and output data. For user personalization, popular items, and personalized ranking solutions, the batch inference job generates a list of recommended items for each user ID in the input file. For related items solutions, the job generates a list of recommended items for each item ID in the input file.

        For more information, see [Creating a batch inference job](https://docs.aws.amazon.com/personalize/latest/dg/getting-batch-recommendations.html) .

        If you use the Similar-Items recipe, Amazon Personalize can add descriptive themes to batch recommendations. To generate themes, set the job's mode to `THEME_GENERATION` and specify the name of the field that contains item names in the input data.

        For more information about generating themes, see [Batch recommendations with themes from Content Generator](https://docs.aws.amazon.com/personalize/latest/dg/themed-batch-recommendations.html) .

        You can't get batch recommendations with the Trending-Now or Next-Best-Action recipes.
    flag:
        batch-inference-job-config: The configuration details of a batch inference job.
        batch-inference-job-mode: |-
            The mode of the batch inference job. To generate descriptive themes for groups of similar items, set the job mode to `THEME_GENERATION`. If you don't want to generate themes, use the default `BATCH_INFERENCE`.

            When you get batch recommendations with themes, you will incur additional costs. For more information, see [Amazon Personalize pricing](https://aws.amazon.com/personalize/pricing/).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filter-arn: The ARN of the filter to apply to the batch inference job. For more information on using filters, see [Filtering batch recommendations](https://docs.aws.amazon.com/personalize/latest/dg/filter-batch.html).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-input: The Amazon S3 path that leads to the input file to base your recommendations on. The input material must be in JSON format.
        job-name: The name of the batch inference job to create.
        job-output: The path to the Amazon S3 bucket where the job's output will be stored.
        num-results: The number of recommendations to retrieve.
        role-arn: The ARN of the Amazon Identity and Access Management role that has permissions to read and write to your input and output Amazon S3 buckets respectively.
        solution-version-arn: The Amazon Resource Name (ARN) of the solution version that will be used to generate the batch inference recommendations.
        tags: A list of [tags](https://docs.aws.amazon.com/personalize/latest/dg/tagging-resources.html) to apply to the batch inference job.
        theme-generation-config: For theme generation jobs, specify the name of the column in your Items dataset that contains each item's name.
