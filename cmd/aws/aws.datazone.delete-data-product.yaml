name: delete-data-product
description: Deletes a data product in Amazon DataZone.
flags:
    --domain-identifier=!: The ID of the Amazon DataZone domain in which the data product is deleted.
    --identifier=!: The identifier of the data product that is deleted.
documentation:
    command: |-
        Deletes a data product in Amazon DataZone.

        Prerequisites:

        - The data product must exist and not be deleted or archived.
        - The user must have delete permissions for the data product.
        - Domain and project must be active.
    flag:
        domain-identifier: The ID of the Amazon DataZone domain in which the data product is deleted.
        identifier: The identifier of the data product that is deleted.
