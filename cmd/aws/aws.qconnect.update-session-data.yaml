name: update-session-data
description: Updates the data stored on an Amazon Q in Connect Session.
flags:
    --assistant-id=!: The identifier of the Amazon Q in Connect assistant.
    --data=!: The data stored on the Amazon Q in Connect Session.
    --namespace=: The namespace into which the session data is stored.
    --session-id=!: The identifier of the session.
completion:
    flag:
        namespace:
            - Custom
documentation:
    command: Updates the data stored on an Amazon Q in Connect Session.
    flag:
        assistant-id: The identifier of the Amazon Q in Connect assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
        data: The data stored on the Amazon Q in Connect Session.
        namespace: 'The namespace into which the session data is stored. Supported namespaces are: Custom'
        session-id: The identifier of the session. Can be either the ID or the ARN. URLs cannot contain the ARN.
