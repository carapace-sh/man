name: create-user
description: Creates a new user in FinSpace.
flags:
    --api-access-principal-arn=: The ARN identifier of an AWS user or role that is allowed to call the `GetProgrammaticAccessCredentials` API to obtain a credentials token for a specific FinSpace user.
    --api-access=: The option to indicate whether the user can use the `GetProgrammaticAccessCredentials` API to obtain credentials that can then be used to access other FinSpace Data API operations.
    --client-token=: A token that ensures idempotency.
    --email-address=!: The email address of the user that you want to register.
    --first-name=: The first name of the user that you want to register.
    --last-name=: The last name of the user that you want to register.
    --type=!: The option to indicate the type of user.
completion:
    flag:
        api-access:
            - ENABLED
            - DISABLED
        type:
            - SUPER_USER
            - APP_USER
documentation:
    command: Creates a new user in FinSpace.
    flag:
        api-access: |-
            The option to indicate whether the user can use the `GetProgrammaticAccessCredentials` API to obtain credentials that can then be used to access other FinSpace Data API operations.

            - `ENABLED` – The user has permissions to use the APIs.
            - `DISABLED` – The user does not have permissions to use any APIs.
        api-access-principal-arn: The ARN identifier of an AWS user or role that is allowed to call the `GetProgrammaticAccessCredentials` API to obtain a credentials token for a specific FinSpace user. This must be an IAM role within your FinSpace account.
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        email-address: The email address of the user that you want to register. The email address serves as a uniquer identifier for each user and cannot be changed after it's created.
        first-name: The first name of the user that you want to register.
        last-name: The last name of the user that you want to register.
        type: |-
            The option to indicate the type of user. Use one of the following options to specify this parameter:

            - `SUPER_USER` – A user with permission to all the functionality and data in FinSpace.
            - `APP_USER` – A user with specific permissions in FinSpace. The users are assigned permissions by adding them to a permission group.
