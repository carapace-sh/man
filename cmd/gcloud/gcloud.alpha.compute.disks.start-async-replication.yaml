name: start-async-replication
description: '*(ALPHA)*  Start asynchronous replication on a Compute Engine persistent disk.'
flags:
    --region=: Region of the disk to operate on.
    --secondary-disk-project=: Project of the secondary disk for asynchronous replication.
    --secondary-disk-region=: Region of the secondary disk for asynchronous replication.
    --secondary-disk-zone=: Zone of the secondary disk for asynchronous replication.
    --secondary-disk=!: Secondary disk for asynchronous replication.
    --zone=: Zone of the disk to operate on.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute disks start-async-replication* starts async replication on a Compute Engine persistent
        disk. This command must be invoked on the primary disk and
        `--secondary-disk` must be provided.
    flag:
        region: |-
            Region of the disk to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        secondary-disk: |-
            Secondary disk for asynchronous replication. This flag is required when
            starting replication.
        secondary-disk-project: Project of the secondary disk for asynchronous replication.
        secondary-disk-region: Region of the secondary disk for asynchronous replication. Overrides the default *compute/region* property value for this command invocation.
        secondary-disk-zone: Zone of the secondary disk for asynchronous replication. Overrides the default *compute/zone* property value for this command invocation.
        zone: |-
            Zone of the disk to operate on. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
