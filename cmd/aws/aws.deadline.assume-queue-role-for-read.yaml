name: assume-queue-role-for-read
description: Gets Amazon Web Services credentials from the queue role.
flags:
    --farm-id=!: The farm ID of the farm containing the queue.
    --queue-id=!: The queue ID.
documentation:
    command: Gets Amazon Web Services credentials from the queue role. The IAM permissions of the credentials are scoped down to have read-only access.
    flag:
        farm-id: The farm ID of the farm containing the queue.
        queue-id: The queue ID.
