name: describe-account-limits
description: Describes the current Elastic Load Balancing resource limits for your AWS account.
flags:
    --marker=: The marker for the next set of results.
    --page-size=: The maximum number of results to return with this call.
documentation:
    command: |-
        Describes the current Elastic Load Balancing resource limits for your AWS account.

        For more information, see [Limits for Your Classic Load Balancer](https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/elb-limits.html) in the *Classic Load Balancers Guide*.
    flag:
        marker: The marker for the next set of results. (You received this marker from a previous call.)
        page-size: The maximum number of results to return with this call.
