name: get-recommendation-preferences
description: Returns existing recommendation preferences, such as enhanced infrastructure metrics.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of recommendation preferences to return with a single request.
    --next-token=: The token to advance to the next page of recommendation preferences.
    --page-size=: The size of each page to get in the AWS service call.
    --resource-type=!: The target resource type of the recommendation preference for which to return preferences.
    --scope=: An object that describes the scope of the recommendation preference to return.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        resource-type:
            - Ec2Instance
            - AutoScalingGroup
            - EbsVolume
            - LambdaFunction
            - NotApplicable
            - EcsService
            - License
            - RdsDBInstance
            - AuroraDBClusterStorage
            - Idle
documentation:
    command: |-
        Returns existing recommendation preferences, such as enhanced infrastructure metrics.

        Use the `scope` parameter to specify which preferences to return. You can specify to return preferences for an organization, a specific account ID, or a specific EC2 instance or Amazon EC2 Auto Scaling group Amazon Resource Name (ARN).

        For more information, see [Activating enhanced infrastructure metrics](https://docs.aws.amazon.com/compute-optimizer/latest/ug/enhanced-infrastructure-metrics.html) in the *Compute Optimizer User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: |-
            The maximum number of recommendation preferences to return with a single request.

            To retrieve the remaining results, make another request with the returned `nextToken` value.
        next-token: The token to advance to the next page of recommendation preferences.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        resource-type: |-
            The target resource type of the recommendation preference for which to return preferences.

            The `Ec2Instance` option encompasses standalone instances and instances that are part of Amazon EC2 Auto Scaling groups. The `AutoScalingGroup` option encompasses only instances that are part of an Amazon EC2 Auto Scaling group.
        scope: |-
            An object that describes the scope of the recommendation preference to return.

            You can return recommendation preferences that are created at the organization level (for management accounts of an organization only), account level, and resource level. For more information, see [Activating enhanced infrastructure metrics](https://docs.aws.amazon.com/compute-optimizer/latest/ug/enhanced-infrastructure-metrics.html) in the *Compute Optimizer User Guide*.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
