name: delete
description: '*(ALPHA)*  Delete a worker-pool.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The Cloud region for the WorkerPool.
documentation:
    command: |
        *(ALPHA)*  Delete a worker-pool.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The Cloud region for the WorkerPool. Overrides the default `run/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `WORKER_POOL` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `run/region`;
            * specify the region from an interactive prompt.
