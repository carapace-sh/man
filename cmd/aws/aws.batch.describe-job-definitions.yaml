name: describe-job-definitions
description: Describes a list of job definitions.
flags:
    --job-definition-name=: The name of the job definition to describe.
    --job-definitions=: A list of up to 100 job definitions.
    --max-results=: The maximum number of results returned by `DescribeJobDefinitions` in paginated output.
    --next-token=: The `nextToken` value returned from a previous paginated `DescribeJobDefinitions` request where `maxResults` was used and the results exceeded the value of that parameter.
    --status=: The status used to filter job definitions.
documentation:
    command: Describes a list of job definitions. You can specify a `status` (such as `ACTIVE`) to only return job definitions that match that status.
    flag:
        job-definition-name: The name of the job definition to describe.
        job-definitions: A list of up to 100 job definitions. Each entry in the list can either be an ARN in the format `arn:aws:batch:${Region}:${Account}:job-definition/${JobDefinitionName}:${Revision}` or a short version using the form `${JobDefinitionName}:${Revision}`. This parameter can't be used with other parameters.
        max-results: The maximum number of results returned by `DescribeJobDefinitions` in paginated output. When this parameter is used, `DescribeJobDefinitions` only returns `maxResults` results in a single page and a `nextToken` response element. The remaining results of the initial request can be seen by sending another `DescribeJobDefinitions` request with the returned `nextToken` value. This value can be between 1 and 100. If this parameter isn't used, then `DescribeJobDefinitions` returns up to 100 results and a `nextToken` value if applicable.
        next-token: |-
            The `nextToken` value returned from a previous paginated `DescribeJobDefinitions` request where `maxResults` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `nextToken` value. This value is `null` when there are no more results to return.

            Treat this token as an opaque identifier that's only used to retrieve the next items in a list and not for other programmatic purposes.
        status: The status used to filter job definitions.
