name: import-custom-workspace-image
description: Imports the specified Windows 10 or 11 Bring Your Own License (BYOL) image into Amazon WorkSpaces using EC2 Image Builder.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --compute-type=!: The supported compute type for the WorkSpace image.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --image-description=!: The description of the WorkSpace image.
    --image-name=!: The name of the WorkSpace image.
    --image-source=!: The options for image import source.
    --infrastructure-configuration-arn=!: The infrastructure configuration ARN that specifies how the WorkSpace image is built.
    --os-version=!: The OS version for the WorkSpace image source.
    --platform=!: The platform for the WorkSpace image source.
    --protocol=!: The supported protocol for the WorkSpace image.
    --tags=:
        description: The resource tags.
        nargs: -1
completion:
    flag:
        compute-type:
            - BASE
            - GRAPHICS_G4DN
        os-version:
            - Windows_10
            - Windows_11
        platform:
            - WINDOWS
        protocol:
            - PCOIP
            - DCV
            - BYOP
documentation:
    command: Imports the specified Windows 10 or 11 Bring Your Own License (BYOL) image into Amazon WorkSpaces using EC2 Image Builder. The image must be an already licensed image that is in your Amazon Web Services account, and you must own the image. For more information about creating BYOL images, see [Bring Your Own Windows Desktop Licenses](https://docs.aws.amazon.com/workspaces/latest/adminguide/byol-windows-images.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        compute-type: The supported compute type for the WorkSpace image.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        image-description: The description of the WorkSpace image.
        image-name: The name of the WorkSpace image.
        image-source: The options for image import source.
        infrastructure-configuration-arn: The infrastructure configuration ARN that specifies how the WorkSpace image is built.
        os-version: The OS version for the WorkSpace image source.
        platform: The platform for the WorkSpace image source.
        protocol: The supported protocol for the WorkSpace image. Windows 11 does not support PCOIP protocol.
        tags: The resource tags. Each WorkSpaces resource can have a maximum of 50 tags.
