name: create-security-group
description: Creates a security group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=!: A description for the security group.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-name=!: The name of the security group.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --tag-specifications=:
        description: The tags to assign to the security group.
        nargs: -1
    --vpc-id=: The ID of the VPC.
documentation:
    command: |-
        Creates a security group.

        A security group acts as a virtual firewall for your instance to control inbound and outbound traffic. For more information, see [Amazon EC2 security groups](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-network-security.html) in the *Amazon EC2 User Guide* and [Security groups for your VPC](https://docs.aws.amazon.com/AmazonVPC/latest/UserGuide/VPC_SecurityGroups.html) in the *Amazon VPC User Guide*.

        When you create a security group, you specify a friendly name of your choice. You can't have two security groups for the same VPC with the same name.

        You have a default security group for use in your VPC. If you don't specify a security group when you launch an instance, the instance is launched into the appropriate default security group. A default security group includes a default rule that grants instances unrestricted network access to each other.

        You can add or remove rules from your security groups using [AuthorizeSecurityGroupIngress](), [AuthorizeSecurityGroupEgress](), [RevokeSecurityGroupIngress](), and [RevokeSecurityGroupEgress]().

        For more information about VPC security group limits, see [Amazon VPC Limits](https://docs.aws.amazon.com/vpc/latest/userguide/amazon-vpc-limits.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: |-
            A description for the security group.

            Constraints: Up to 255 characters in length

            Valid characters: a-z, A-Z, 0-9, spaces, and .\_-:/()#,@\[]+=&amp;;{}!$*
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-name: |-
            The name of the security group. Names are case-insensitive and must be unique within the VPC.

            Constraints: Up to 255 characters in length. Can't start with `sg-`.

            Valid characters: a-z, A-Z, 0-9, spaces, and .\_-:/()#,@\[]+=&amp;;{}!$*
        tag-specifications: The tags to assign to the security group.
        vpc-id: The ID of the VPC. Required for a nondefault VPC.
