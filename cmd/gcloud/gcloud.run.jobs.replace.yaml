name: replace
description: Create or replace a job from a YAML job specification.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --client-name=&: Name of the client handling the deployment.
    --client-version=&: Version of the client handling the deployment.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Region in which the resource can be found.
documentation:
    command: |
        Creates or replaces a job from a YAML job specification.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        client-name: Name of the client handling the deployment. Defaults to ``global'' if this and --client-version are both unspecified.
        client-version: Version of the client handling the deployment. Defaults to the current gcloud version if this and --client-name are both unspecified.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: Region in which the resource can be found. Alternatively, set the property [run/region].
