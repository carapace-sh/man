name: start-document-classification-job
description: Starts an asynchronous document classification job using a custom classification model.
flags:
    --client-request-token=: A unique identifier for the request.
    --data-access-role-arn=!: The Amazon Resource Name (ARN) of the IAM role that grants Amazon Comprehend read access to your input data.
    --document-classifier-arn=: The Amazon Resource Name (ARN) of the document classifier to use to process the job.
    --flywheel-arn=: The Amazon Resource Number (ARN) of the flywheel associated with the model to use.
    --input-data-config=!: Specifies the format and location of the input data for the job.
    --job-name=: The identifier of the job.
    --output-data-config=!: Specifies where to send the output files.
    --tags=: Tags to associate with the document classification job.
    --volume-kms-key-id=: ID for the Amazon Web Services Key Management Service (KMS) key that Amazon Comprehend uses to encrypt data on the storage volume attached to the ML compute instance(s) that process the analysis job.
    --vpc-config=: Configuration parameters for an optional private Virtual Private Cloud (VPC) containing the resources you are using for your document classification job.
documentation:
    command: Starts an asynchronous document classification job using a custom classification model. Use the `DescribeDocumentClassificationJob` operation to track the progress of the job.
    flag:
        client-request-token: A unique identifier for the request. If you do not set the client request token, Amazon Comprehend generates one.
        data-access-role-arn: The Amazon Resource Name (ARN) of the IAM role that grants Amazon Comprehend read access to your input data.
        document-classifier-arn: The Amazon Resource Name (ARN) of the document classifier to use to process the job.
        flywheel-arn: The Amazon Resource Number (ARN) of the flywheel associated with the model to use.
        input-data-config: Specifies the format and location of the input data for the job.
        job-name: The identifier of the job.
        output-data-config: Specifies where to send the output files.
        tags: Tags to associate with the document classification job. A tag is a key-value pair that adds metadata to a resource used by Amazon Comprehend. For example, a tag with "Sales" as the key might be added to a resource to indicate its use by the sales department.
        volume-kms-key-id: |-
            ID for the Amazon Web Services Key Management Service (KMS) key that Amazon Comprehend uses to encrypt data on the storage volume attached to the ML compute instance(s) that process the analysis job. The VolumeKmsKeyId can be either of the following formats:

            - KMS Key ID: `"1234abcd-12ab-34cd-56ef-1234567890ab"`
            - Amazon Resource Name (ARN) of a KMS Key: `"arn:aws:kms:us-west-2:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab"`
        vpc-config: Configuration parameters for an optional private Virtual Private Cloud (VPC) containing the resources you are using for your document classification job. For more information, see [Amazon VPC](https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html).
