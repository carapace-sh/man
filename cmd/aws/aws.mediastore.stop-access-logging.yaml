name: stop-access-logging
description: Stops access logging on the specified container.
flags:
    --container-name=!: The name of the container that you want to stop access logging on.
documentation:
    command: Stops access logging on the specified container. When you stop access logging on a container, MediaStore stops sending access logs to Amazon CloudWatch Logs. These access logs are not saved and are not retrievable.
    flag:
        container-name: The name of the container that you want to stop access logging on.
