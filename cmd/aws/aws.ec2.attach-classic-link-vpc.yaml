name: attach-classic-link-vpc
description: This action is deprecated.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --groups=!: The IDs of the security groups.
    --instance-id=!: The ID of the EC2-Classic instance.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --vpc-id=!: The ID of the ClassicLink-enabled VPC.
documentation:
    command: |-
        This action is deprecated.

        Links an EC2-Classic instance to a ClassicLink-enabled VPC through one or more of the VPC security groups. You cannot link an EC2-Classic instance to more than one VPC at a time. You can only link an instance that's in the `running` state. An instance is automatically unlinked from a VPC when it's stopped - you can link it to the VPC again when you restart it.

        After you've linked an instance, you cannot change the VPC security groups that are associated with it. To change the security groups, you must first unlink the instance, and then link it again.

        Linking your instance to a VPC is sometimes referred to as *attaching* your instance.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        groups: The IDs of the security groups. You cannot specify security groups from a different VPC.
        instance-id: The ID of the EC2-Classic instance.
        vpc-id: The ID of the ClassicLink-enabled VPC.
