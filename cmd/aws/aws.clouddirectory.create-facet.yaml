name: create-facet
description: Creates a new [Facet]() in a schema.
flags:
    --attributes=:
        description: The attributes that are associated with the [Facet]().
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --facet-style=: There are two different styles that you can define on any given facet, `Static` and `Dynamic`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the [Facet](), which is unique for a given schema.
    --object-type=: Specifies whether a given object created from this facet is of type node, leaf node, policy or index.
    --schema-arn=!: The schema ARN in which the new [Facet]() will be created.
completion:
    flag:
        facet-style:
            - STATIC
            - DYNAMIC
        object-type:
            - NODE
            - LEAF_NODE
            - POLICY
            - INDEX
documentation:
    command: Creates a new [Facet]() in a schema. Facet creation is allowed only in development or applied schemas.
    flag:
        attributes: The attributes that are associated with the [Facet]().
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        facet-style: There are two different styles that you can define on any given facet, `Static` and `Dynamic`. For static facets, all attributes must be defined in the schema. For dynamic facets, attributes can be defined during data plane operations.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the [Facet](), which is unique for a given schema.
        object-type: |-
            Specifies whether a given object created from this facet is of type node, leaf node, policy or index.

            - Node: Can have multiple children but one parent.

            <!--THE END-->

            - Leaf node: Cannot have children but can have multiple parents.

            <!--THE END-->

            - Policy: Allows you to store a policy document and policy type. For more information, see [Policies](https://docs.aws.amazon.com/clouddirectory/latest/developerguide/key_concepts_directory.html#key_concepts_policies).

            <!--THE END-->

            - Index: Can be created with the Index API.
        schema-arn: The schema ARN in which the new [Facet]() will be created. For more information, see [arns]().
