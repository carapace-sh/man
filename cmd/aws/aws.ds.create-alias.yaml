name: create-alias
description: Creates an alias for a directory and assigns the alias to the directory.
flags:
    --alias=!: The requested alias.
    --directory-id=!: The identifier of the directory for which to create the alias.
documentation:
    command: |-
        Creates an alias for a directory and assigns the alias to the directory. The alias is used to construct the access URL for the directory, such as `http://<alias>.awsapps.com`.

        After an alias has been created, it cannot be deleted or reused, so this operation should only be used when absolutely necessary.
    flag:
        alias: |-
            The requested alias.

            The alias must be unique amongst all aliases in Amazon Web Services. This operation throws an `EntityAlreadyExistsException` error if the alias already exists.
        directory-id: The identifier of the directory for which to create the alias.
