name: put-resource-policy
description: Attaches a resource-based permission policy to a service or service network.
flags:
    --policy=!: An IAM policy.
    --resource-arn=!: The ID or ARN of the service network or service for which the policy is created.
documentation:
    command: Attaches a resource-based permission policy to a service or service network. The policy must contain the same actions and condition statements as the Amazon Web Services Resource Access Manager permission for sharing services and service networks.
    flag:
        policy: An IAM policy. The policy string in JSON must not contain newlines or blank lines.
        resource-arn: The ID or ARN of the service network or service for which the policy is created.
