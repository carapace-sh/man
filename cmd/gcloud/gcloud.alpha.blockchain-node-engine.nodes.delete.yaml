name: delete
description: '*(ALPHA)*  Delete a Blockchain Node Engine node.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location of the blockchain node resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Delete a Blockchain Node Engine node.

        This command can fail for the following reasons:
          * The blockchain node specified does not exist.
          * The active account does not have permission to delete the given
            blockchain node.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Location of the blockchain node resource.
            +

            To set the `location` attribute:
            * provide the argument `node_name` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `web3/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
