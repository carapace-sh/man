name: describe
description: '*(BETA)*  Describe a restore channel.'
flags:
    --location=: Google Cloud location.
documentation:
    command: |
        *(BETA)*  Describe a Backup for GKE restore channel.

        ## EXAMPLES

        To describe a restore channel ``my-restore-channel'' in project ``my-project'' in location ``us-central1'', run:

          $ gcloud beta container backup-restore restore-channels describe my-restore-channel --project=my-project --location=us-central1
    flag:
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `restore_channel` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
