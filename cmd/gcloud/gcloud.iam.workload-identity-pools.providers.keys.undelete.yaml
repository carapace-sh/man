name: undelete
description: Undelete a workload identity pool provider key.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location name.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --provider=: The ID for the provider, which becomes the final component of the resource name.
    --workload-identity-pool=: The ID to use for the pool, which becomes the final component of the resource name.
documentation:
    command: Undelete a workload identity pool provider key.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        provider: |-
            The ID for the provider, which becomes the final component of the resource name. This value
            must be 4-32 characters, and may contain the characters [a-z0-9-]. The prefix `gcp-` is
            reserved for use by Google, and may not be specified.
            +

            To set the `provider` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--provider` on the command line.
        workload-identity-pool: |-
            The ID to use for the pool, which becomes the final component of the resource name. This value
            should be 4-32 characters, and may contain the characters [a-z0-9-]. The prefix `gcp-` is
            reserved for use by Google, and may not be specified.
            +

            To set the `workload-identity-pool` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--workload-identity-pool` on the command line.
