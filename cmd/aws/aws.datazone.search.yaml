name: search
description: Searches for assets in Amazon DataZone.
flags:
    --additional-attributes=: Specifies additional attributes for the `Search` action.
    --domain-identifier=!: The identifier of the Amazon DataZone domain.
    --filters=: Specifies the search filters.
    --max-results=: The maximum number of results to return in a single call to `Search`.
    --next-token=: When the number of results is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of results, the response includes a pagination token named `NextToken`.
    --owning-project-identifier=: The identifier of the owning project specified for the search.
    --search-in=: The details of the search.
    --search-scope=!: The scope of the search.
    --search-text=: Specifies the text for which to search.
    --sort=: Specifies the way in which the search results are to be sorted.
completion:
    flag:
        search-scope:
            - ASSET
            - GLOSSARY
            - GLOSSARY_TERM
            - DATA_PRODUCT
documentation:
    command: |-
        Searches for assets in Amazon DataZone.

        Search in Amazon DataZone is a powerful capability that enables users to discover and explore data assets, glossary terms, and data products across their organization. It provides both basic and advanced search functionality, allowing users to find resources based on names, descriptions, metadata, and other attributes. Search can be scoped to specific types of resources (like assets, glossary terms, or data products) and can be filtered using various criteria such as creation date, owner, or status. The search functionality is essential for making the wealth of data resources in an organization discoverable and usable, helping users find the right data for their needs quickly and efficiently.

        Many search commands in Amazon DataZone are paginated, including `search` and `search-types`. When the result set is large, Amazon DataZone returns a `nextToken` in the response. This token can be used to retrieve the next page of results.

        Prerequisites:

        - The --domain-identifier must refer to an existing Amazon DataZone domain.
        - --search-scope must be one of: ASSET, GLOSSARY\_TERM, DATA\_PRODUCT, or GLOSSARY.
        - The user must have search permissions in the specified domain.
        - If using --filters, ensure that the JSON is well-formed and that each filter includes valid attribute and value keys.
        - For paginated results, be prepared to use --next-token to fetch additional pages.
    flag:
        additional-attributes: Specifies additional attributes for the `Search` action.
        domain-identifier: The identifier of the Amazon DataZone domain.
        filters: Specifies the search filters.
        max-results: The maximum number of results to return in a single call to `Search`. When the number of results to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `Search` to list the next set of results.
        next-token: When the number of results is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of results, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `Search` to list the next set of results.
        owning-project-identifier: The identifier of the owning project specified for the search.
        search-in: The details of the search.
        search-scope: The scope of the search.
        search-text: Specifies the text for which to search.
        sort: Specifies the way in which the search results are to be sorted.
