name: create
description: '*(ALPHA)*  Create a Cloud Asset Inventory Feed.'
flags:
    --asset-names=: A comma-separated list of the full names of the assets to receive updates.
    --asset-types=: A comma-separated list of types of the assets types to receive updates.
    --condition-description=: Description of the feed condition.
    --condition-expression=: Feed condition expression.
    --condition-title=: Title of the feed condition.
    --content-type=: Asset content type.
    --folder=: Folder of the feed.
    --organization=: Organization of the feed.
    --pubsub-topic=!: Name of the Cloud Pub/Sub topic to publish to, of the form `projects/PROJECT_ID/topics/TOPIC_ID`.
    --relationship-types=: A comma-separated list of the relationship types (i.e., "INSTANCE_TO_INSTANCEGROUP") to receive updates.
completion:
    flag:
        content-type:
            - resource
            - iam-policy
            - org-policy
            - access-policy
            - os-inventory
            - relationship
documentation:
    command: |
        *(ALPHA)*  Create a new Cloud Asset Inventory Feed for updates on assets.
    flag:
        asset-names: 'A comma-separated list of the full names of the assets to receive updates. For example: `//compute.googleapis.com/projects/my_project_123/zones/zone1/instances/instance1`. For more information, see: https://cloud.google.com/apis/design/resource_names#full_resource_name'
        asset-types: 'A comma-separated list of types of the assets types to receive updates. For example: `compute.googleapis.com/Disk,compute.googleapis.com/Network`. Regular expressions (https://github.com/google/re2/wiki/Syntax) are also supported. For more information, see: https://cloud.google.com/resource-manager/docs/cloud-asset-inventory/overview'
        condition-description: Description of the feed condition. For reference only.
        condition-expression: 'Feed condition expression. If not specified, no condition will be applied to feed. For more information, see: https://cloud.google.com/asset-inventory/docs/monitoring-asset-changes#feed_with_condition'
        condition-title: Title of the feed condition. For reference only.
        content-type: 'Asset content type. If not specified, no content but the asset name and type will be returned in the feed. For more information, see https://cloud.google.com/resource-manager/docs/cloud-asset-inventory/overview#asset_content_type. _CONTENT_TYPE_ must be one of: *resource*, *iam-policy*, *org-policy*, *access-policy*, *os-inventory*, *relationship*.'
        folder: Folder of the feed.
        organization: Organization of the feed.
        pubsub-topic: Name of the Cloud Pub/Sub topic to publish to, of the form `projects/PROJECT_ID/topics/TOPIC_ID`. You can list existing topics with `gcloud pubsub topics list --format="text(name)"`
        relationship-types: A comma-separated list of the relationship types (i.e., "INSTANCE_TO_INSTANCEGROUP") to receive updates. This argument will only be honoured if content_type=RELATIONSHIP.See http://cloud.google.com/asset-inventory/docs/supported-asset-types for supported relationship types.
