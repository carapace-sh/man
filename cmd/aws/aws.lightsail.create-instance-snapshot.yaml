name: create-instance-snapshot
description: Creates a snapshot of a specific virtual private server, or *instance*.
flags:
    --instance-name=!: The Lightsail instance on which to base your snapshot.
    --instance-snapshot-name=!: The name for your new snapshot.
    --tags=: The tag keys and optional values to add to the resource during create.
documentation:
    command: |-
        Creates a snapshot of a specific virtual private server, or *instance*. You can use a snapshot to create a new instance that is based on that snapshot.

        The `create instance snapshot` operation supports tag-based access control via request tags. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        instance-name: The Lightsail instance on which to base your snapshot.
        instance-snapshot-name: The name for your new snapshot.
        tags: |-
            The tag keys and optional values to add to the resource during create.

            Use the `TagResource` action to tag a resource after it's created.
