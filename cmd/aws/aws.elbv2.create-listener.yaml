name: create-listener
description: Creates a listener for the specified Application Load Balancer, Network Load Balancer, or Gateway Load Balancer.
flags:
    --alpn-policy=: \[TLS listeners] The name of the Application-Layer Protocol Negotiation (ALPN) policy.
    --certificates=: \[HTTPS and TLS listeners] The default certificate for the listener.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-actions=!: The actions for the default rule.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --load-balancer-arn=!: The Amazon Resource Name (ARN) of the load balancer.
    --mutual-authentication=: The mutual authentication configuration information.
    --port=: The port on which the load balancer is listening.
    --protocol=: The protocol for connections from clients to the load balancer.
    --ssl-policy=: \[HTTPS and TLS listeners] The security policy that defines which protocols and ciphers are supported.
    --tags=: The tags to assign to the listener.
completion:
    flag:
        protocol:
            - HTTP
            - HTTPS
            - TCP
            - TLS
            - UDP
            - TCP_UDP
            - GENEVE
documentation:
    command: |-
        Creates a listener for the specified Application Load Balancer, Network Load Balancer, or Gateway Load Balancer.

        For more information, see the following:

        - [Listeners for your Application Load Balancers](https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-listeners.html)
        - [Listeners for your Network Load Balancers](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/load-balancer-listeners.html)
        - [Listeners for your Gateway Load Balancers](https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/gateway-listeners.html)

        This operation is idempotent, which means that it completes at most one time. If you attempt to create multiple listeners with the same settings, each call succeeds.
    flag:
        alpn-policy: |-
            \[TLS listeners] The name of the Application-Layer Protocol Negotiation (ALPN) policy. You can specify one policy name. The following are the possible values:

            - `HTTP1Only`
            - `HTTP2Only`
            - `HTTP2Optional`
            - `HTTP2Preferred`
            - `None`

            For more information, see [ALPN policies](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/load-balancer-listeners.html#alpn-policies) in the *Network Load Balancers Guide*.
        certificates: \[HTTPS and TLS listeners] The default certificate for the listener. You must provide exactly one certificate. Set `CertificateArn` to the certificate ARN but do not set `IsDefault`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-actions: The actions for the default rule.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        load-balancer-arn: The Amazon Resource Name (ARN) of the load balancer.
        mutual-authentication: The mutual authentication configuration information.
        port: The port on which the load balancer is listening. You can't specify a port for a Gateway Load Balancer.
        protocol: The protocol for connections from clients to the load balancer. For Application Load Balancers, the supported protocols are HTTP and HTTPS. For Network Load Balancers, the supported protocols are TCP, TLS, UDP, and TCP\_UDP. You can’t specify the UDP or TCP\_UDP protocol if dual-stack mode is enabled. You can't specify a protocol for a Gateway Load Balancer.
        ssl-policy: |-
            \[HTTPS and TLS listeners] The security policy that defines which protocols and ciphers are supported.

            For more information, see [Security policies](https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html) in the *Application Load Balancers Guide* and [Security policies](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/describe-ssl-policies.html) in the *Network Load Balancers Guide*.
        tags: The tags to assign to the listener.
