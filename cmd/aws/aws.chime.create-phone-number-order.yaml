name: create-phone-number-order
description: Creates an order for phone numbers to be provisioned.
flags:
    --e164-phone-numbers=!: List of phone numbers, in E.164 format.
    --product-type=!: The phone number product type.
completion:
    flag:
        product-type:
            - BusinessCalling
            - VoiceConnector
            - SipMediaApplicationDialIn
documentation:
    command: Creates an order for phone numbers to be provisioned. For toll-free numbers, you cannot use the Amazon Chime Business Calling product type. For numbers outside the U.S., you must use the Amazon Chime SIP Media Application Dial-In product type.
    flag:
        e164-phone-numbers: List of phone numbers, in E.164 format.
        product-type: The phone number product type.
