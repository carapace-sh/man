name: set-iam-policy
description: '*(BETA)*  Set IAM policy for an autoscaling policy.'
flags:
    --region=: Dataproc region for the autoscaling policy.
documentation:
    command: |-
        *(BETA)*  Sets the IAM policy for an autoscaling policy, given an autoscaling policy ID
        and the IAM policy.

        ## EXAMPLES
          The following command will read an IAM policy defined in a JSON file
          'policy.json' and set it for an autoscaling-policy with identifier
          'example-autoscaling-policy'

              $ gcloud beta dataproc autoscaling-policies set-iam-policy autoscaling-policies set-iam-policy \
                  example-autoscaling-policy policy.json

          See https://cloud.google.com/iam/docs/managing-policies for details of the
          policy file format and contents.
    flag:
        region: |-
            Dataproc region for the autoscaling policy. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `autoscaling_policy` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
