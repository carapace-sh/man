name: test-identity-provider
description: If the `IdentityProviderType` of a file transfer protocol-enabled server is `AWS_DIRECTORY_SERVICE` or `API_Gateway`, tests whether your identity provider is set up successfully.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --server-id=!: A system-assigned identifier for a specific server.
    --server-protocol=: The type of file transfer protocol to be tested.
    --source-ip=: The source IP address of the account to be tested.
    --user-name=!: The name of the account to be tested.
    --user-password=: The password of the account to be tested.
completion:
    flag:
        server-protocol:
            - SFTP
            - FTP
            - FTPS
            - AS2
documentation:
    command: "If the `IdentityProviderType` of a file transfer protocol-enabled server is `AWS_DIRECTORY_SERVICE` or `API_Gateway`, tests whether your identity provider is set up successfully. We highly recommend that you call this operation to test your authentication method as soon as you create your server. By doing so, you can troubleshoot issues with the identity provider integration to ensure that your users can successfully use the service.\n\nThe `ServerId` and `UserName` parameters are required. The `ServerProtocol`, `SourceIp`, and `UserPassword` are all optional.\n\nNote the following:\n\n- You cannot use `TestIdentityProvider` if the `IdentityProviderType` of your server is `SERVICE_MANAGED`.\n- `TestIdentityProvider` does not work with keys: it only accepts passwords.\n- `TestIdentityProvider` can test the password operation for a custom Identity Provider that handles keys and passwords.\n- If you provide any incorrect values for any parameters, the `Response` field is empty.\n- If you provide a server ID for a server that uses service-managed users, you get an error:\n  \n  `An error occurred (InvalidRequestException) when calling the TestIdentityProvider operation: s-server-ID not configured for external auth`\n- If you enter a Server ID for the `--server-id` parameter that does not identify an actual Transfer server, you receive the following error:\n  \n  `An error occurred (ResourceNotFoundException) when calling the TestIdentityProvider operation: Unknown server`.\n  \n  It is possible your sever is in a different region. You can specify a region by adding the following: `--region region-code`, such as `--region us-east-2` to specify a server in **US East (Ohio)**."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        server-id: A system-assigned identifier for a specific server. That server's user authentication method is tested with a user name and password.
        server-protocol: |-
            The type of file transfer protocol to be tested.

            The available protocols are:

            - Secure Shell (SSH) File Transfer Protocol (SFTP)
            - File Transfer Protocol Secure (FTPS)
            - File Transfer Protocol (FTP)
            - Applicability Statement 2 (AS2)
        source-ip: The source IP address of the account to be tested.
        user-name: The name of the account to be tested.
        user-password: The password of the account to be tested.
