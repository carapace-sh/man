name: delete
description: '*(ALPHA)*  Delete a Dataplex Content Resource.'
flags:
    --lake=: Identifier of the Dataplex lake resource.
    --location=: Location of the Dataplex resource.
documentation:
    command: |
        *(ALPHA)*  Delete a Dataplex Content resource based on project, location, lake, and content.
    flag:
        lake: |-
            Identifier of the Dataplex lake resource.
            +

            To set the `lake` attribute:
            * provide the argument `content` on the command line with a fully specified name;
            * provide the argument `--lake` on the command line.
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `content` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
