name: modify-snapshot-schedule
description: Modifies a snapshot schedule.
flags:
    --schedule-definitions=!: An updated list of schedule definitions.
    --schedule-identifier=!: A unique alphanumeric identifier of the schedule to modify.
documentation:
    command: Modifies a snapshot schedule. Any schedule associated with a cluster is modified asynchronously.
    flag:
        schedule-definitions: An updated list of schedule definitions. A schedule definition is made up of schedule expressions, for example, "cron(30 12 \*)" or "rate(12 hours)".
        schedule-identifier: A unique alphanumeric identifier of the schedule to modify.
