name: get-anomaly-monitors
description: Retrieves the cost anomaly monitor definitions for your account.
flags:
    --max-results=: The number of entries that a paginated response contains.
    --monitor-arn-list=: A list of cost anomaly monitor ARNs.
    --next-page-token=: The token to retrieve the next set of results.
documentation:
    command: Retrieves the cost anomaly monitor definitions for your account. You can filter using a list of cost anomaly monitor Amazon Resource Names (ARNs).
    flag:
        max-results: The number of entries that a paginated response contains.
        monitor-arn-list: A list of cost anomaly monitor ARNs.
        next-page-token: The token to retrieve the next set of results. Amazon Web Services provides the token when the response from a previous call has more results than the maximum page size.
