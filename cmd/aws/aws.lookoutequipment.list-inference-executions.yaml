name: list-inference-executions
description: Lists all inference executions that have been performed by the specified inference scheduler.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-end-time-before=: The time reference in the inferenced dataset before which Amazon Lookout for Equipment stopped the inference execution.
    --data-start-time-after=: The time reference in the inferenced dataset after which Amazon Lookout for Equipment started the inference execution.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inference-scheduler-name=!: The name of the inference scheduler for the inference execution listed.
    --max-results=: Specifies the maximum number of inference executions to list.
    --next-token=: An opaque pagination token indicating where to continue the listing of inference executions.
    --status=: The status of the inference execution.
completion:
    flag:
        status:
            - IN_PROGRESS
            - SUCCESS
            - FAILED
documentation:
    command: Lists all inference executions that have been performed by the specified inference scheduler.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-end-time-before: The time reference in the inferenced dataset before which Amazon Lookout for Equipment stopped the inference execution.
        data-start-time-after: The time reference in the inferenced dataset after which Amazon Lookout for Equipment started the inference execution.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        inference-scheduler-name: The name of the inference scheduler for the inference execution listed.
        max-results: Specifies the maximum number of inference executions to list.
        next-token: An opaque pagination token indicating where to continue the listing of inference executions.
        status: The status of the inference execution.
