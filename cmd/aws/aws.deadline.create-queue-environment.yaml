name: create-queue-environment
description: Creates an environment for a queue that defines how jobs in the queue run.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The unique token which the server uses to recognize retries of the same request.
    --farm-id=!: The farm ID of the farm to connect to the environment.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --priority=!: Sets the priority of the environments in the queue from 0 to 10,000, where 0 is the highest priority (activated first and deactivated last).
    --queue-id=!: The queue ID to connect the queue and environment.
    --template-type=!: The template's file type, `JSON` or `YAML`.
    --template=!: The environment template to use in the queue.
completion:
    flag:
        template-type:
            - JSON
            - YAML
documentation:
    command: Creates an environment for a queue that defines how jobs in the queue run.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The unique token which the server uses to recognize retries of the same request.
        farm-id: The farm ID of the farm to connect to the environment.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        priority: Sets the priority of the environments in the queue from 0 to 10,000, where 0 is the highest priority (activated first and deactivated last). If two environments share the same priority value, the environment created first takes higher priority.
        queue-id: The queue ID to connect the queue and environment.
        template: The environment template to use in the queue.
        template-type: The template's file type, `JSON` or `YAML`.
