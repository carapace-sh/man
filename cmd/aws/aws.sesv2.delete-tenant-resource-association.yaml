name: delete-tenant-resource-association
description: Delete an association between a tenant and a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to remove from the tenant association.
    --tenant-name=!: The name of the tenant to remove the resource association from.
documentation:
    command: |-
        Delete an association between a tenant and a resource.

        When you delete a tenant-resource association, the resource itself is not deleted, only its association with the specific tenant is removed. After removal, the resource will no longer be available for use with that tenant's email sending operations.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to remove from the tenant association.
        tenant-name: The name of the tenant to remove the resource association from.
