name: update
description: Update workload identity pool namespace.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: A description of the namespace.
    --disabled: Whether the namespace is disabled.
    --location=: The location name.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disabled&: Whether the namespace is disabled.
    --workload-identity-pool=: The ID to use for the pool, which becomes the final component of the resource name.
documentation:
    command: Update workload identity pool namespace.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: A description of the namespace.
        disabled: |-
            Whether the namespace is disabled. If disabled, credentials may no longer be issued for
            identities in this namespace. Existing credentials may continue to be accepted until they
            expire.
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `namespace` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disabled: |-
            Whether the namespace is disabled. If disabled, credentials may no longer be issued for
            identities in this namespace. Existing credentials may continue to be accepted until they
            expire.
        workload-identity-pool: |-
            The ID to use for the pool, which becomes the final component of the resource name. This value
            should be 4-32 characters, and may contain the characters [a-z0-9-]. The prefix `gcp-` is
            reserved for use by Google, and may not be specified.
            +

            To set the `workload-identity-pool` attribute:
            * provide the argument `namespace` on the command line with a fully specified name;
            * provide the argument `--workload-identity-pool` on the command line.
