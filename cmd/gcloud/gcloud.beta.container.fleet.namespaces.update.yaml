name: update
description: '*(BETA)*  *(REMOVED)*  Update a fleet namespace.'
hidden: true
flags:
    --scope=!: ID of the scope or fully qualified identifier for the scope.
documentation:
    command: |-
        *(BETA)*  *(REMOVED)*  Update a fleet namespace.

        This command has been removed as of version 447.0.0. Use `gcloud fleet scopes namespaces` instead.

        This command can fail for the following reasons:
        * The project specified does not exist.
        * The fleet namespace does not exist in the project.
        * The caller does not have permission to access the project or namespace.

        ## EXAMPLES

        To update the namespace `NAMESPACE` in the active project:

          $ gcloud beta container fleet namespaces update NAMESPACE

        To update the namespace `NAMESPACE` in project `PROJECT_ID`:

          $ gcloud beta container fleet namespaces update NAMESPACE --project=PROJECT_ID
    flag:
        scope: |-
            ID of the scope or fully qualified identifier for the scope.
            +
            To set the `scope` attribute:
            * provide the argument `--scope` on the command line.
