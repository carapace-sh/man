name: list-configuration-sets
description: List all of the configuration sets associated with your Amazon Pinpoint account in the current region.
flags:
    --next-token=: A token returned from a previous call to `ListConfigurationSets` to indicate the position in the list of configuration sets.
    --page-size=: The number of results to show in a single call to `ListConfigurationSets`.
documentation:
    command: |-
        List all of the configuration sets associated with your Amazon Pinpoint account in the current region.

        In Amazon Pinpoint, *configuration sets* are groups of rules that you can apply to the emails you send. You apply a configuration set to an email by including a reference to the configuration set in the headers of the email. When you apply a configuration set to an email, all of the rules in that configuration set are applied to the email.
    flag:
        next-token: A token returned from a previous call to `ListConfigurationSets` to indicate the position in the list of configuration sets.
        page-size: The number of results to show in a single call to `ListConfigurationSets`. If the number of results is larger than the number you specified in this parameter, then the response includes a `NextToken` element, which you can use to obtain additional results.
