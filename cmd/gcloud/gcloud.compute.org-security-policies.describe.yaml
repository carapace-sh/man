name: describe
description: Describe a Compute Engine organization security policy.
flags:
    --organization=: Organization in which the organization security policy is to be described.
documentation:
    command: |-
        *gcloud compute org-security-policies describe* is used to describe organization security policies. An
        organization security policy is a set of rules that controls access to various
        resources.
    flag:
        organization: Organization in which the organization security policy is to be described. Must be set if SECURITY_POLICY is short name.
