name: list-members
description: Lists details about all member accounts for the current Security Hub administrator account.
flags:
    --max-results=: The maximum number of items to return in the response.
    --next-token=: The token that is required for pagination.
    --no-only-associated&: Specifies which member accounts to include in the response based on their relationship status with the administrator account.
    --only-associated: Specifies which member accounts to include in the response based on their relationship status with the administrator account.
documentation:
    command: |-
        Lists details about all member accounts for the current Security Hub administrator account.

        The results include both member accounts that belong to an organization and member accounts that were invited manually.
    flag:
        max-results: The maximum number of items to return in the response.
        next-token: |-
            The token that is required for pagination. On your first call to the `ListMembers` operation, set the value of this parameter to `NULL`.

            For subsequent calls to the operation, to continue listing data, set the value of this parameter to the value returned from the previous response.
        only-associated: |-
            Specifies which member accounts to include in the response based on their relationship status with the administrator account. The default value is `TRUE`.

            If `OnlyAssociated` is set to `TRUE`, the response includes member accounts whose relationship status with the administrator account is set to `ENABLED`.

            If `OnlyAssociated` is set to `FALSE`, the response includes all existing member accounts.
