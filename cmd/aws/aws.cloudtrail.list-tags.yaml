name: list-tags
description: Lists the tags for the specified trails, event data stores, dashboards, or channels in the current Region.
flags:
    --next-token=: Reserved for future use.
    --resource-id-list=!: Specifies a list of trail, event data store, dashboard, or channel ARNs whose tags will be listed.
documentation:
    command: Lists the tags for the specified trails, event data stores, dashboards, or channels in the current Region.
    flag:
        next-token: Reserved for future use.
        resource-id-list: |-
            Specifies a list of trail, event data store, dashboard, or channel ARNs whose tags will be listed. The list has a limit of 20 ARNs.

            Example trail ARN format: `arn:aws:cloudtrail:us-east-2:123456789012:trail/MyTrail`

            Example event data store ARN format: `arn:aws:cloudtrail:us-east-2:123456789012:eventdatastore/EXAMPLE-f852-4e8f-8bd1-bcf6cEXAMPLE`

            Example dashboard ARN format: `arn:aws:cloudtrail:us-east-1:123456789012:dashboard/exampleDash`

            Example channel ARN format: `arn:aws:cloudtrail:us-east-2:123456789012:channel/01234567890`
