name: connect
description: '*(BETA)*  Connects to a Cloud SQL instance.'
flags:
    --auto-iam-authn: Enables IAM database authentication for connections to MySQL and Postgres instances.
    --auto-ip: Connect to the Cloud SQL instance with auto IP detection.
    --database=: The PostgreSQL or SQL Server database to connect to.
    --debug-logs: Enable verbose debug logs for Cloud SQL Proxy.
    --no-auto-iam-authn&: Enables IAM database authentication for connections to MySQL and Postgres instances.
    --no-auto-ip&: Connect to the Cloud SQL instance with auto IP detection.
    --no-debug-logs&: Enable verbose debug logs for Cloud SQL Proxy.
    --no-private-ip&: Connect to the Cloud SQL instance using private IP.
    --no-psc&: Connect to the Cloud SQL instance using Private Service Connect.
    --no-run-connection-test&: Run connection test for Cloud SQL Proxy.
    --no-skip-ssl&: Skip SSL certificate verification for MySQL instances.
    --port=: Port number that gcloud will use to connect to the Cloud SQL Proxy through localhost.
    --private-ip: Connect to the Cloud SQL instance using private IP.
    --psc: Connect to the Cloud SQL instance using Private Service Connect.
    --run-connection-test: Run connection test for Cloud SQL Proxy.
    --skip-ssl: Skip SSL certificate verification for MySQL instances.
    --user=: Cloud SQL instance user to connect as.
documentation:
    command: |
        *(BETA)*  Connects to a Cloud SQL instance.
    flag:
