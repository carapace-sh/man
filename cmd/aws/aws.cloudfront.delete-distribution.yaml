name: delete-distribution
description: Delete a distribution.
flags:
    --id=!: The distribution ID.
    --if-match=: The value of the `ETag` header that you received when you disabled the distribution.
documentation:
    command: |-
        Delete a distribution.

        Before you can delete a distribution, you must disable it, which requires permission to update the distribution. Once deleted, a distribution cannot be recovered.
    flag:
        id: The distribution ID.
        if-match: 'The value of the `ETag` header that you received when you disabled the distribution. For example: `E2QWRUHAPOMQZL`.'
