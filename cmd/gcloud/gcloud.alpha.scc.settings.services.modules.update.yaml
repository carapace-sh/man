name: update
description: '*(ALPHA)*  Update a module config in Security Command Center(SCC).'
flags:
    --clear-config: Clear module config in Security Command Center
    --config=: Module config in Security Command Center
    --enablement-state=!: Module enablement state in Security Command Center.
    --folder=: Folder ID
    --module=!: Module name in Security Command Center
    --no-clear-config&: Clear module config in Security Command Center
    --organization=: Organization ID
    --service=!: Service name in Security Command Center.
completion:
    flag:
        enablement-state:
            - enabled
            - disabled
        service:
            - container-threat-detection
            - event-threat-detection
            - security-health-analytics
            - virtual-machine-threat-detection
            - web-security-scanner
documentation:
    command: |
        *(ALPHA)*  Update a module config in Security Command Center(SCC).
    flag:
        clear-config: Clear module config in Security Command Center
        config: Module config in Security Command Center
        enablement-state: 'Module enablement state in Security Command Center. _ENABLEMENT_STATE_ must be one of: *enabled*, *disabled*.'
        folder: Folder ID
        module: Module name in Security Command Center
        no-clear-config: Clear module config in Security Command Center
        organization: Organization ID
        service: 'Service name in Security Command Center. _SERVICE_NAME_ must be one of: *container-threat-detection*, *event-threat-detection*, *security-health-analytics*, *virtual-machine-threat-detection*, *web-security-scanner*.'
