name: describe
description: '*(ALPHA)*  Describe a Compute Engine network edge security service.'
flags:
    --region=: Region of the network edge security service to describe.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute network-edge-security-services describe* displays all data associated with a Compute Engine network edge
        security service in a project.

        ## EXAMPLES

        To describe a network edge security service with the name 'my-service' in
        region 'us-central1', run:

          $ gcloud alpha compute network-edge-security-services describe my-service \
            --region=us-central1
    flag:
        region: Region of the network edge security service to describe. Overrides the default *compute/region* property value for this command invocation.
