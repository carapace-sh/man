name: update-queue
description: Updates the compute node group configuration of a queue.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --cluster-identifier=!: The name or ID of the cluster of the queue.
    --compute-node-group-configurations=: The list of compute node group configurations to associate with the queue.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --queue-identifier=!: The name or ID of the queue.
    --slurm-configuration=: Additional options related to the Slurm scheduler.
documentation:
    command: Updates the compute node group configuration of a queue. Use this API to change the compute node groups that the queue can send jobs to.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, the subsequent retries with the same client token return the result from the original successful request and they have no additional effect. If you don't specify a client token, the CLI and SDK automatically generate 1 for you.
        cluster-identifier: The name or ID of the cluster of the queue.
        compute-node-group-configurations: The list of compute node group configurations to associate with the queue. Queues assign jobs to associated compute node groups.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        queue-identifier: The name or ID of the queue.
        slurm-configuration: Additional options related to the Slurm scheduler.
