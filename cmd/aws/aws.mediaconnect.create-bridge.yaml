name: create-bridge
description: Creates a new bridge.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --egress-gateway-bridge=: An egress bridge is a cloud-to-ground bridge.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ingress-gateway-bridge=: An ingress bridge is a ground-to-cloud bridge.
    --name=!: The name of the bridge.
    --outputs=:
        description: The outputs that you want to add to this bridge.
        nargs: -1
    --placement-arn=!: The bridge placement Amazon Resource Number (ARN).
    --source-failover-config=: The settings for source failover.
    --sources=!:
        description: The sources that you want to add to this bridge.
        nargs: -1
documentation:
    command: Creates a new bridge. The request must include one source.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        egress-gateway-bridge: An egress bridge is a cloud-to-ground bridge. The content comes from an existing MediaConnect flow and is delivered to your premises.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ingress-gateway-bridge: An ingress bridge is a ground-to-cloud bridge. The content originates at your premises and is delivered to the cloud.
        name: The name of the bridge. This name can not be modified after the bridge is created.
        outputs: The outputs that you want to add to this bridge.
        placement-arn: The bridge placement Amazon Resource Number (ARN).
        source-failover-config: The settings for source failover.
        sources: The sources that you want to add to this bridge.
