name: list-event-integration-associations
description: Returns a paginated list of event integration associations in the account.
flags:
    --event-integration-name=!: The name of the event integration.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
documentation:
    command: Returns a paginated list of event integration associations in the account.
    flag:
        event-integration-name: The name of the event integration.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
