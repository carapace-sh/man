name: get-key-group
description: Gets a key group, including the date and time when the key group was last modified.
flags:
    --id=!: The identifier of the key group that you are getting.
documentation:
    command: |-
        Gets a key group, including the date and time when the key group was last modified.

        To get a key group, you must provide the key group's identifier. If the key group is referenced in a distribution's cache behavior, you can get the key group's identifier using `ListDistributions` or `GetDistribution`. If the key group is not referenced in a cache behavior, you can get the identifier using `ListKeyGroups`.
    flag:
        id: The identifier of the key group that you are getting. To get the identifier, use `ListKeyGroups`.
