name: create-deployment
description: Creates a deployment for a manually deployed Amplify app.
flags:
    --app-id=!: The unique ID for an Amplify app.
    --branch-name=!: The name of the branch to use for the job.
    --file-map=: An optional file map that contains the file name as the key and the file content md5 hash as the value.
documentation:
    command: |-
        Creates a deployment for a manually deployed Amplify app. Manually deployed apps are not connected to a Git repository.

        The maximum duration between the `CreateDeployment` call and the `StartDeployment` call cannot exceed 8 hours. If the duration exceeds 8 hours, the `StartDeployment` call and the associated `Job` will fail.
    flag:
        app-id: The unique ID for an Amplify app.
        branch-name: The name of the branch to use for the job.
        file-map: An optional file map that contains the file name as the key and the file content md5 hash as the value. If this argument is provided, the service will generate a unique upload URL per file. Otherwise, the service will only generate a single upload URL for the zipped files.
