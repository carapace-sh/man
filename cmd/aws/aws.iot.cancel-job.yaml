name: cancel-job
description: Cancels a job.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --comment=: An optional comment string describing why the job was canceled.
    --force: (Optional) If `true` job executions with status "IN\_PROGRESS" and "QUEUED" are canceled, otherwise only job executions with status "QUEUED" are canceled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-id=!: The unique identifier you assigned to this job when it was created.
    --no-force: (Optional) If `true` job executions with status "IN\_PROGRESS" and "QUEUED" are canceled, otherwise only job executions with status "QUEUED" are canceled.
    --reason-code=: (Optional)A reason code string that explains why the job was canceled.
documentation:
    command: |-
        Cancels a job.

        Requires permission to access the [CancelJob](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        comment: An optional comment string describing why the job was canceled.
        force: |-
            (Optional) If `true` job executions with status "IN\_PROGRESS" and "QUEUED" are canceled, otherwise only job executions with status "QUEUED" are canceled. The default is `false`.

            Canceling a job which is "IN\_PROGRESS", will cause a device which is executing the job to be unable to update the job execution status. Use caution and ensure that each device executing a job which is canceled is able to recover to a valid state.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-id: The unique identifier you assigned to this job when it was created.
        reason-code: (Optional)A reason code string that explains why the job was canceled.
