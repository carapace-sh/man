name: update
description: '*(ALPHA)*  Update a private pool used by Cloud Build.'
flags:
    --config-from-file=: File that contains updates to the configuration for worker pool to be created.
    --generation=: Generation of the worker pool.
    --no-public-egress&: If set to true, workers in the worker pool are created with an external
    --public-egress: If set to true, workers in the worker pool are created with an external
    --region=: Cloud region where the worker pool is updated.
    --worker-disk-size=: Size of the disk attached to the worker.
    --worker-machine-type=: Compute Engine machine type for a worker pool.
documentation:
    command: '*(ALPHA)*  Update a private pool used by Cloud Build.'
    flag:
        config-from-file: |-
            File that contains updates to the configuration for worker pool to be created.
            +
            Private pool options:
            +
             https://cloud.google.com/build/docs/private-pools/worker-pool-config-file-schema
        generation: Generation of the worker pool.
        no-public-egress: |
            If set to true, workers in the worker pool are created with an external
            IP address.

            If set to false, workers in the worker pool are created without an
            external IP address. If the worker pool is within a VPC Service Control
            perimeter, use this flag.
        public-egress: |-
            If set to true, workers in the worker pool are created with an external
            IP address.
            +
            If set to false, workers in the worker pool are created without an
            external IP address. If the worker pool is within a VPC Service Control
            perimeter, use this flag.
            +
            Use *--public-egress* to enable and *--no-public-egress* to disable.
        region: Cloud region where the worker pool is updated. See https://cloud.google.com/build/docs/locations for available locations.
        worker-disk-size: |-
            Size of the disk attached to the worker.
            +
            If unspecified, Cloud Build uses a standard disk size.
        worker-machine-type: |-
            Compute Engine machine type for a worker pool.
            +
            If unspecified, Cloud Build uses a standard machine type.
