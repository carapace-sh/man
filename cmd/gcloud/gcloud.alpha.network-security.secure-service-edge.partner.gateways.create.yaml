name: create
description: '*(ALPHA)*  Create a partner SSE gateway.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --gateway-reference=!: Reference ID of the customer gateway to be paired with this partner gateway.
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --partner-subnet-range=!: Address range (in CIDR format) for the partner-owned subnet which will support this gateway.
    --sse-subnet-range=: Subnet range where partner facing side of NCCGW is deployed.
documentation:
    command: |
        *(ALPHA)*  Create a new partner gateway which supports the specified customer gateway.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        gateway-reference: Reference ID of the customer gateway to be paired with this partner gateway.
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `partner_sse_gateway` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        partner-subnet-range: Address range (in CIDR format) for the partner-owned subnet which will support this gateway.
        sse-subnet-range: Subnet range where partner facing side of NCCGW is deployed. Default value is set to "100.88.255.0/24". The CIDR suffix should be less than or equal to 25.
