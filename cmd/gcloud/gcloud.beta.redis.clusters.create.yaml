name: create
description: '*(BETA)*  Create a new Memorystore for Redis Cluster instance.'
flags:
    --aof-append-fsync=: Fsync configuration.
    --async: Return immediately, without waiting for the operation in progress to
    --auth-mode=: Available authorization mode of a Redis cluster.
    --automated-backup-mode=: Automated backup mode.
    --automated-backup-start-time=: One-hour window when you want automated-backup operations to start.
    --automated-backup-ttl=: Time to live for automated backups.
    --cross-cluster-replication-role=: The role of the cluster in cross cluster replication.
    --deletion-protection: Enable deletion protection for the Redis Cluster.
    --import-gcs-object-uris=: URIs of Google Cloud Storage objects to import from.
    --import-managed-backup=: Managed backup to import from.
    --kms-key=: The resource name of the customer-managed encryption key (CMEK) to use for the cluster.
    --maintenance-window-day=: Day of week when the window starts, e.g. `sunday`.
    --maintenance-window-hour=: Hour of day (`0` to `23`) for the start of maintenance window, in UTC time zone.
    --network=: The network used to create your instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-deletion-protection&: Enable deletion protection for the Redis Cluster.
    --node-type=: Node Type of the redis cluster Node.
    --persistence-mode=: Operation mode for persistence.
    --primary-cluster=: The primary cluster that the secondary cluster will replicate from.
    --rdb-snapshot-period=: Attempted period between RDB snapshots.
    --rdb-snapshot-start-time=: Date and time of the first snapshot in the ISO 1801 format, and alignment time for future snapshots.
    --redis-config=: A list of Redis config KEY=VALUE pairs to set on the Redis Cluster according to
    --region=: The name of the Redis region of the cluster.
    --replica-count=: The replica count of each shard.
    --shard-count=: The shard count of the cluster.
    --transit-encryption-mode=: Transit encryption mode used for the Redis cluster.
    --zone-distribution-mode=: Determines how the cluster nodes are distributed across zones.
    --zone=: The zone used to allocate the cluster nodes.
completion:
    flag:
        aof-append-fsync:
            - always
            - everysec
            - "no"
        auth-mode:
            - disabled
            - iam-auth
        automated-backup-mode:
            - disabled
            - enabled
        cross-cluster-replication-role:
            - secondary
        maintenance-window-day:
            - friday
            - monday
            - saturday
            - sunday
            - thursday
            - tuesday
            - wednesday
        node-type:
            - redis-highmem-medium
            - redis-highmem-xlarge
            - redis-shared-core-nano
            - redis-standard-small
        persistence-mode:
            - aof
            - disabled
            - rdb
        rdb-snapshot-period:
            - 12h
            - 1h
            - 24h
            - 6h
        transit-encryption-mode:
            - disabled
            - server-authentication
        zone-distribution-mode:
            - multi-zone
            - single-zone
documentation:
    command: |
        *(BETA)*  Create a new Memorystore for Redis Cluster instance, and uses Private Service Connect service connectivity automation to automate connectivity for instances.

        This command can fail for the following reasons:
          * A cluster with the same name already exists.
          * The active account does not have permission to create clusters.
          * Some required APIs not enabled yet.
          * No connection policy defined yet on the network and in the region a cluster will be created.
          * Miss the steps for creating and configuring a service account (to grant permissions) in both host project and service project, if a shared VPC network is used.

        Refer to https://cloud.google.com/memorystore/docs/cluster/networking#prerequisites_required_before_creating_a_cluster for prerequisites.
    flag:
        aof-append-fsync: |-
            Fsync configuration. _AOF_APPEND_FSYNC_ must be one of:
            +
            *always*::: Redis explicitly calls fsync for every write command.
            +
            *everysec*::: (default) Redis explicitly calls fsync every second.
            +
            *no*::: Redis will not explicitly call fsync.
            +
            :::
            +
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        auth-mode: |-
            Available authorization mode of a Redis cluster. _AUTH_MODE_ must be one of:
            +
            *disabled*::: Authorization is disabled for the cluster.
            +
            *iam-auth*::: IAM basic authorization is enabled for the cluster.
            +
            :::
            +
        automated-backup-mode: |-
            Automated backup mode. _AUTOMATED_BACKUP_MODE_ must be one of:
            +
            *disabled*::: (default) Automated backup is disabled.
            +
            *enabled*::: Automated backup is enabled.
            +
            :::
            +
        automated-backup-start-time: One-hour window when you want automated-backup operations to start. Specify the time in the format HH:00 on a 24-hour cycle in UTC time.
        automated-backup-ttl: |-
            Time to live for automated backups. A backup will be deleted automatically after the TTL
            is reached. It ranges from 1 day to 365 days. For example, "10d" for 10 days. If not specified, the default value is 35 days.
        cross-cluster-replication-role: |-
            The role of the cluster in cross cluster replication. _CROSS_CLUSTER_REPLICATION_ROLE_ must be (only one value is supported):
            +
            *secondary*::: Create a secondary cluster.
            +
            :::
            +
        deletion-protection: |-
            Enable deletion protection for the Redis Cluster. Use
            `--deletion-protection`/`--no-deletion-protection` to enable/disable it.
        import-gcs-object-uris: URIs of Google Cloud Storage objects to import from. For example, `gs://bucket/folder/file1.rdb,gs://bucket/folder/file2.rdb`.
        import-managed-backup: Managed backup to import from. For example, `projects/PROJECT_ID/locations/REGION/backupCollections/BACKUP_COLLECTION_ID/backups/BACKUP_ID`.
        kms-key: |-
            The resource name of the customer-managed encryption key (CMEK) to use for the cluster.
            It must use this format:
            projects/PROJECT_ID/locations/LOCATION/keyRings/KEY_RING/cryptoKeys/CRYPTO_KEY.
            The key must be in the same region as the cluster. Otherwise, the create operation fails.
        maintenance-window-day: 'Day of week when the window starts, e.g. `sunday`. _MAINTENANCE_WINDOW_DAY_ must be one of: *friday*, *monday*, *saturday*, *sunday*, *thursday*, *tuesday*, *wednesday*.'
        maintenance-window-hour: Hour of day (`0` to `23`) for the start of maintenance window, in UTC time zone.
        network: |-
            The network used to create your instance. It must use the format:
            projects/NETWORK_PROJECT_ID/global/networks/NETWORK_ID.
            The network ID used here must match the network ID used by the service connection policy.
            Otherwise, the create operation fails
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-deletion-protection: |
            Enable deletion protection for the Redis Cluster. Use
            `--deletion-protection`/`--no-deletion-protection` to enable/disable it.
        node-type: 'Node Type of the redis cluster Node. _NODE_TYPE_ must be one of: *redis-highmem-medium*, *redis-highmem-xlarge*, *redis-shared-core-nano*, *redis-standard-small*.'
        persistence-mode: |-
            Operation mode for persistence. _PERSISTENCE_MODE_ must be one of:
            +
            *aof*::: AOF-based persistence
            *disabled*::: Persistence mode is disabled
            *rdb*::: RDB-based persistence
            :::
            +
        primary-cluster: |-
            The primary cluster that the secondary cluster will replicate from. It must use the format:
            projects/PROJECT_ID/locations/REGION/clusters/CLUSTER_ID. It must refer to an existing cluster. Otherwise, the create operation fails.
        rdb-snapshot-period: |-
            Attempted period between RDB snapshots. _RDB_SNAPSHOT_PERIOD_ must be one of:
            +
            *12h*::: 12 hours
            *1h*::: 1 hour
            *24h*::: (default) 24 hours
            *6h*::: 6 hours
            :::
            +
        rdb-snapshot-start-time: |-
            Date and time of the first snapshot in the ISO 1801 format, and alignment time for future snapshots. For example, 2024-01-01T01:00:00Z.
            If not specified, the current time will be used.
        redis-config: |-
            A list of Redis config KEY=VALUE pairs to set on the Redis Cluster according to
            http://redis.io/topics/config. Currently the supported Redis configs are:
            +
              maxmemory-clients, maxmemory, maxmemory-policy, notify-keyspace-events,
              slowlog-log-slower-than, maxclients.
        region: |-
            The name of the Redis region of the cluster. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
        replica-count: The replica count of each shard.
        shard-count: The shard count of the cluster.
        transit-encryption-mode: |-
            Transit encryption mode used for the Redis cluster.
            If not provided, encryption is disabled for the cluster. _TRANSIT_ENCRYPTION_MODE_ must be one of:
            +
            *disabled*::: In-transit encryption is disabled for the cluster.
            +
            *server-authentication*::: The cluster uses server managed encryption for in-transit encryption.
            +
            :::
            +
        zone: |-
            The zone used to allocate the cluster nodes. Applicable only if the zone-distribution-mode
            is set to single-zone.
        zone-distribution-mode: |-
            Determines how the cluster nodes are distributed across zones. _ZONE_DISTRIBUTION_MODE_ must be one of:
            +
            *multi-zone*::: Allocate cluster nodes across multiple zones.
            +
            *single-zone*::: Allocate cluster nodes in a single zone.
            +
            :::
            +
