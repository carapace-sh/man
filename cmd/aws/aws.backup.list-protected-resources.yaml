name: list-protected-resources
description: Returns an array of resources successfully backed up by Backup, including the time the resource was saved, an Amazon Resource Name (ARN) of the resource, and a resource type.
flags:
    --max-results=: The maximum number of items to be returned.
    --next-token=: The next item following a partial list of returned items.
documentation:
    command: Returns an array of resources successfully backed up by Backup, including the time the resource was saved, an Amazon Resource Name (ARN) of the resource, and a resource type.
    flag:
        max-results: The maximum number of items to be returned.
        next-token: The next item following a partial list of returned items. For example, if a request is made to return `MaxResults` number of items, `NextToken` allows you to return more items in your list starting at the location pointed to by the next token.
