name: describe
description: Get metadata for a given key.
flags:
    --keyring=: The KMS keyring of the key.
    --location=: The Google Cloud location for the key.
documentation:
    command: |-
        Returns metadata for the given key.

        ## EXAMPLES

        The following command returns metadata for the key `frodo` within
        the keyring `fellowship` in the location `us-east1`:

          $ gcloud kms keys describe frodo --keyring=fellowship --location=us-east1
    flag:
        keyring: |-
            The KMS keyring of the key.
            +
            To set the `keyring` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--keyring` on the command line.
        location: |-
            The Google Cloud location for the key.
            +
            To set the `location` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
