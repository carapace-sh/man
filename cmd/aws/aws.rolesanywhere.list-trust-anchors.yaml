name: list-trust-anchors
description: Lists the trust anchors in the authenticated account and Amazon Web Services Region.
flags:
    --next-token=: A token that indicates where the output should continue from, if a previous request did not show all results.
    --page-size=: The number of resources in the paginated list.
documentation:
    command: |-
        Lists the trust anchors in the authenticated account and Amazon Web Services Region.

        **Required permissions:** `rolesanywhere:ListTrustAnchors`.
    flag:
        next-token: A token that indicates where the output should continue from, if a previous request did not show all results. To get the next results, make the request again with this value.
        page-size: The number of resources in the paginated list.
