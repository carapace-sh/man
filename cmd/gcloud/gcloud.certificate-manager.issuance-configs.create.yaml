name: create
description: Create a Certificate Issuance Config.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --ca-pool=!: CA Pool used for issuing certificates.
    --description=: Human-readable description of the resource.
    --key-algorithm=: Key algorithm to use when generating the private key.
    --labels=: List of label KEY=VALUE pairs to add.
    --lifetime=: Lifetime of issued certificates in ISO 8601 format.
    --location=: Certificate Manager location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --rotation-window-percentage=: How long along the lifetime of the ceritificate to renew, expressed as a percentage.
    --tags=&: List of tag KEY=VALUE pairs to add.
completion:
    flag:
        key-algorithm:
            - ecdsa-p256
            - rsa-2048
documentation:
    command: |
        Create a new Certificate Issuance Config.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        ca-pool: |-
            CA Pool used for issuing certificates. For example:
            +
             $ {command} --ca-pool=projects/test-project/locations/us-west1/caPools/my-ca-pool
        description: Human-readable description of the resource.
        key-algorithm: 'Key algorithm to use when generating the private key. Defaults to `rsa-2048`. _KEY_ALGORITHM_ must be one of: *ecdsa-p256*, *rsa-2048*.'
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        lifetime: Lifetime of issued certificates in ISO 8601 format. Use `gcloud topic datetimes` for details. Defaults to `P30D`.
        location: |-
            Certificate Manager location.
            +
            To set the `location` attribute:
            * provide the argument `certificate_issuance_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * default value of location is [global].
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        rotation-window-percentage: How long along the lifetime of the ceritificate to renew, expressed as a percentage. Defaults to `66`.
        tags: |
            List of tag KEY=VALUE pairs to add.
