name: reset-snapshot-attribute
description: Resets permission settings for the specified snapshot.
flags:
    --attribute=!: The attribute to reset.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --snapshot-id=!: The ID of the snapshot.
completion:
    flag:
        attribute:
            - productCodes
            - createVolumePermission
documentation:
    command: |-
        Resets permission settings for the specified snapshot.

        For more information about modifying snapshot permissions, see [Share a snapshot](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modifying-snapshot-permissions.html) in the *Amazon EBS User Guide*.
    flag:
        attribute: The attribute to reset. Currently, only the attribute for permission to create volumes can be reset.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        snapshot-id: The ID of the snapshot.
