name: wait
description: '*(BETA)*  Waits for an operation to complete  for a given operation name.'
flags:
    --name=!: The name of operation to wait
documentation:
    command: |-
        *(BETA)*  This command will block until an operation has been marked as complete.

        ## EXAMPLES
        To wait on an operation named `operations/abc`
        to complete, run:

          $ gcloud beta services vpc-peerings operations wait --name=operations/abc
    flag:
        name: The name of operation to wait
