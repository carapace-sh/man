name: associate-time-series-to-asset-property
description: Associates a time series (data stream) with an asset property.
flags:
    --alias=!: The alias that identifies the time series.
    --asset-id=!: The ID of the asset in which the asset property was created.
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --property-id=!: The ID of the asset property.
documentation:
    command: Associates a time series (data stream) with an asset property.
    flag:
        alias: The alias that identifies the time series.
        asset-id: The ID of the asset in which the asset property was created. This can be either the actual ID in UUID format, or else `externalId:` followed by the external ID, if it has one. For more information, see [Referencing objects with external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-id-references) in the *IoT SiteWise User Guide*.
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        property-id: The ID of the asset property. This can be either the actual ID in UUID format, or else `externalId:` followed by the external ID, if it has one. For more information, see [Referencing objects with external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-id-references) in the *IoT SiteWise User Guide*.
