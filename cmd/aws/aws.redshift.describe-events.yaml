name: describe-events
description: Returns events related to clusters, security groups, snapshots, and parameter groups for the past 14 days.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --duration=: The number of minutes prior to the time of the request for which to retrieve events.
    --end-time=: The end of the time interval for which to retrieve events, specified in ISO 8601 format.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --marker=: An optional parameter that specifies the starting point to return a set of response records.
    --max-items=: The  total number of items to return in the command's output.
    --max-records=: The maximum number of response records to return in each call.
    --page-size=: The size of each page to get in the AWS service call.
    --source-identifier=: The identifier of the event source for which events will be returned.
    --source-type=: The event source to retrieve events for.
    --start-time=: The beginning of the time interval to retrieve events for, specified in ISO 8601 format.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        source-type:
            - cluster
            - cluster-parameter-group
            - cluster-security-group
            - cluster-snapshot
            - scheduled-action
documentation:
    command: Returns events related to clusters, security groups, snapshots, and parameter groups for the past 14 days. Events specific to a particular cluster, security group, snapshot or parameter group can be obtained by providing the name as a parameter. By default, the past hour of events are returned.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        duration: |-
            The number of minutes prior to the time of the request for which to retrieve events. For example, if the request is sent at 18:00 and you specify a duration of 60, then only events which have occurred after 17:00 will be returned.

            Default: `60`
        end-time: |-
            The end of the time interval for which to retrieve events, specified in ISO 8601 format. For more information about ISO 8601, go to the [ISO8601 Wikipedia page.](http://en.wikipedia.org/wiki/ISO_8601)

            Example: `2009-07-08T18:00Z`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        marker: An optional parameter that specifies the starting point to return a set of response records. When the results of a [DescribeEvents]() request exceed the value specified in `MaxRecords`, Amazon Web Services returns a value in the `Marker` field of the response. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-records: |-
            The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.

            Default: `100`

            Constraints: minimum 20, maximum 100.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        source-identifier: |-
            The identifier of the event source for which events will be returned. If this parameter is not specified, then all sources are included in the response.

            Constraints:

            If *SourceIdentifier* is supplied, *SourceType* must also be provided.

            - Specify a cluster identifier when *SourceType* is `cluster`.
            - Specify a cluster security group name when *SourceType* is `cluster-security-group`.
            - Specify a cluster parameter group name when *SourceType* is `cluster-parameter-group`.
            - Specify a cluster snapshot identifier when *SourceType* is `cluster-snapshot`.
        source-type: |-
            The event source to retrieve events for. If no value is specified, all events are returned.

            Constraints:

            If *SourceType* is supplied, *SourceIdentifier* must also be provided.

            - Specify `cluster` when *SourceIdentifier* is a cluster identifier.
            - Specify `cluster-security-group` when *SourceIdentifier* is a cluster security group name.
            - Specify `cluster-parameter-group` when *SourceIdentifier* is a cluster parameter group name.
            - Specify `cluster-snapshot` when *SourceIdentifier* is a cluster snapshot identifier.
        start-time: |-
            The beginning of the time interval to retrieve events for, specified in ISO 8601 format. For more information about ISO 8601, go to the [ISO8601 Wikipedia page.](http://en.wikipedia.org/wiki/ISO_8601)

            Example: `2009-07-08T18:00Z`
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
