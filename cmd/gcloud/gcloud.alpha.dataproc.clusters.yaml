name: clusters
description: '*(ALPHA)*  Create and manage Dataproc clusters.'
documentation:
    command: |-
        *(ALPHA)*  Create and manage Dataproc clusters.

        ## EXAMPLES

        To create a cluster, run:

          $ gcloud alpha dataproc clusters create my-cluster --region=us-central1

        To resize a cluster, run:

          $ gcloud alpha dataproc clusters update my-cluster --region=us-central1 --num-workers 5

        To delete a cluster, run:

          $ gcloud alpha dataproc clusters delete my-cluster --region=us-central1

        To view the details of a cluster, run:

          $ gcloud alpha dataproc clusters describe my-cluster --region=us-central1

        To see the list of all clusters, run:

          $ gcloud alpha dataproc clusters list
