    --shielded-secure-boot: Specifies that the TPU instances are created with secure boot enabled.
    --spot: If provided, the Node requested here will be created as Spot VMs.
    --subnetwork=: Subnetwork that this TPU will be a part of.
    --tags=: Tags to apply to the TPU Node.
    --topology=!: Chip topology for TPU.
    --type=!: Type of TPU.
    --valid-after-duration=: A duration before which the TPU must not be provisioned, relative to the current time.
    --valid-after-time=: An absolute time before which the TPU must not be provisioned.
    --valid-until-duration=: A duration after which the TPU must not be provisioned, relative to the current time.
