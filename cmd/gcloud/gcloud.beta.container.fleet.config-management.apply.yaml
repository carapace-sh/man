name: apply
description: '*(BETA)*  Update a Config Management feature spec.'
flags:
    --config=!: Path to YAML file that contains the configuration to update the target membership to.
    --location=: Location for the membership.
    --membership=!: ID of the membership or fully qualified identifier for the membership.
    --origin=: Updates the configuration of the target membership to the current [fleet-default membership configuration](https://cloud.google.com/kubernetes-engine/fleet-management/docs/manage-features).
completion:
    flag:
        origin:
            - FLEET
documentation:
    command: |-
        *(BETA)*  Update a membership configuration for the Config Management feature in a
        fleet. This command errors if the Config Management feature is not enabled on
        the fleet.
    flag:
        config: Path to YAML file that contains the configuration to update the target membership to. The file accepts the [following fields](https://cloud.google.com/anthos-config-management/docs/reference/gcloud-apply-fields).
        location: |-
            Location for the membership.
            +
            To set the `location` attribute:
            * provide the argument `--membership` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        membership: |-
            ID of the membership or fully qualified identifier for the membership.
            +
            To set the `membership` attribute:
            * provide the argument `--membership` on the command line.
        origin: 'Updates the configuration of the target membership to the current [fleet-default membership configuration](https://cloud.google.com/kubernetes-engine/fleet-management/docs/manage-features). Errors if fleet-default membership configuration is not enabled; see the `enable` command for more details. _ORIGIN_ must be (only one value is supported): *FLEET*.'
