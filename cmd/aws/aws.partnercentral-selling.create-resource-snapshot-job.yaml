name: create-resource-snapshot-job
description: Use this action to create a job to generate a snapshot of the specified resource within an engagement.
flags:
    --catalog=!: Specifies the catalog in which to create the snapshot job.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: A client-generated UUID used for idempotency check.
    --engagement-identifier=!: Specifies the identifier of the engagement associated with the resource to be snapshotted.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-identifier=!: Specifies the identifier of the specific resource to be snapshotted.
    --resource-snapshot-template-identifier=!: Specifies the name of the template that defines the schema for the snapshot.
    --resource-type=!: The type of resource for which the snapshot job is being created.
    --tags=:
        description: A map of the key-value pairs of the tag or tags to assign.
        nargs: -1
completion:
    flag:
        resource-type:
            - Opportunity
documentation:
    command: Use this action to create a job to generate a snapshot of the specified resource within an engagement. It initiates an asynchronous process to create a resource snapshot. The job creates a new snapshot only if the resource state has changed, adhering to the same access control and immutability rules as direct snapshot creation.
    flag:
        catalog: Specifies the catalog in which to create the snapshot job. Valid values are `AWS` and `Sandbox`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A client-generated UUID used for idempotency check. The token helps prevent duplicate job creations.
        engagement-identifier: Specifies the identifier of the engagement associated with the resource to be snapshotted.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        resource-identifier: Specifies the identifier of the specific resource to be snapshotted. The format depends on the `ResourceType`.
        resource-snapshot-template-identifier: Specifies the name of the template that defines the schema for the snapshot.
        resource-type: The type of resource for which the snapshot job is being created. Must be one of the supported resource types i.e. `Opportunity`
        tags: A map of the key-value pairs of the tag or tags to assign.
