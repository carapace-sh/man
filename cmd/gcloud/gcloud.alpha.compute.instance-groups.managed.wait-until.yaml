name: wait-until
description: '*(ALPHA)*  Wait until the managed instance group reaches the desired state.'
flags:
    --all-instances-config-effective: Wait until the group's all-instances configuration is applied to all VMs in the group.
    --no-all-instances-config-effective&: Wait until the group's all-instances configuration is applied to all VMs in the group.
    --no-stable&: Wait until the group is stable.
    --no-version-target-reached&: Wait until version target is reached.
    --region=: Region of the managed instance group to operate on.
    --stable: Wait until the group is stable.
    --timeout=: Waiting time in seconds for the group to reach the desired state.
    --version-target-reached: Wait until version target is reached.
    --zone=: Zone of the managed instance group to operate on.
documentation:
    command: '*(ALPHA)*  Wait until the managed instance group reaches the desired state.'
    flag:
        all-instances-config-effective: Wait until the group's all-instances configuration is applied to all VMs in the group.
        no-all-instances-config-effective: Wait until the group's all-instances configuration is applied to all VMs in the group.
        no-stable: Wait until the group is stable.
        no-version-target-reached: Wait until version target is reached.
        region: |-
            Region of the managed instance group to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        stable: Wait until the group is stable.
        timeout: Waiting time in seconds for the group to reach the desired state.
        version-target-reached: Wait until version target is reached.
        zone: |-
            Zone of the managed instance group to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
