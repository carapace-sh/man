name: create
description: '*(ALPHA)*  Create a bigtable cluster.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --autoscaling-cpu-target=!: The target CPU utilization percentage for autoscaling.
    --autoscaling-max-nodes=!: The maximum number of nodes for autoscaling.
    --autoscaling-min-nodes=!: The minimum number of nodes for autoscaling.
    --autoscaling-storage-target=: The target storage utilization gibibytes per node for autoscaling.
    --instance=: Bigtable instance for the cluster.
    --kms-key=!: ID of the key or fully qualified identifier for the key.
    --kms-keyring=: The KMS keyring id of the key.
    --kms-location=: The Cloud location for the key.
    --kms-project=: The Cloud project id for the key.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --node-scaling-factor=: Node scaling factor for the cluster.
    --num-nodes=: Number of nodes to serve.
    --zone=!: ID of the zone where the cluster is located.
completion:
    flag:
        node-scaling-factor:
            - node-scaling-factor-1x
            - node-scaling-factor-2x
documentation:
    command: '*(ALPHA)*  Create a bigtable cluster.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        autoscaling-cpu-target: The target CPU utilization percentage for autoscaling. Accepted values are from 10 to 80.
        autoscaling-max-nodes: The maximum number of nodes for autoscaling.
        autoscaling-min-nodes: The minimum number of nodes for autoscaling.
        autoscaling-storage-target: The target storage utilization gibibytes per node for autoscaling. Accepted values are from 2560 to 5120 for SSD clusters and 8192 to 16384 for HDD clusters.
        instance: |-
            Bigtable instance for the cluster.
            +
            To set the `instance` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        kms-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key` on the command line.
        kms-keyring: |-
            The KMS keyring id of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-location: |-
            The Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line.
        kms-project: |-
            The Cloud project id for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        node-scaling-factor: 'Node scaling factor for the cluster. _NODE_SCALING_FACTOR_ must be one of: *node-scaling-factor-1x*, *node-scaling-factor-2x*.'
        num-nodes: Number of nodes to serve.
        zone: ID of the zone where the cluster is located. Supported zones are listed at https://cloud.google.com/bigtable/docs/locations.
