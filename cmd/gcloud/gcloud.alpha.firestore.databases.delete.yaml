name: delete
description: '*(ALPHA)*  Delete a Google Cloud Firestore database.'
flags:
    --database=!: The database to operate on.
    --etag=: The current etag of the Database.
documentation:
    command: |-
        ## EXAMPLES

        To delete a Firestore database test.

            $ gcloud alpha firestore databases delete --database=test

        To delete the Firestore (default) database.

            $ gcloud alpha firestore databases delete --database=(default)

        To delete a Firestore database test providing etag.

            $ gcloud alpha firestore databases delete --database=test --etag=etag
    flag:
        database: The database to operate on.
        etag: The current etag of the Database. If an etag is provided and does not match the current etag of the database, deletion will be blocked and a FAILED_PRECONDITION error will be returned.
