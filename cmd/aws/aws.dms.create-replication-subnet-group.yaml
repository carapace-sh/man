name: create-replication-subnet-group
description: Creates a replication subnet group given a list of the subnet IDs in a VPC.
flags:
    --replication-subnet-group-description=!: The description for the subnet group.
    --replication-subnet-group-identifier=!: The name for the replication subnet group.
    --subnet-ids=!: Two or more subnet IDs to be assigned to the subnet group.
    --tags=: One or more tags to be assigned to the subnet group.
documentation:
    command: |-
        Creates a replication subnet group given a list of the subnet IDs in a VPC.

        The VPC needs to have at least one subnet in at least two availability zones in the Amazon Web Services Region, otherwise the service will throw a `ReplicationSubnetGroupDoesNotCoverEnoughAZs` exception.

        If a replication subnet group exists in your Amazon Web Services account, the CreateReplicationSubnetGroup action returns the following error message: The Replication Subnet Group already exists. In this case, delete the existing replication subnet group. To do so, use the [DeleteReplicationSubnetGroup](https://docs.aws.amazon.com/en_us/dms/latest/APIReference/API_DeleteReplicationSubnetGroup.html) action. Optionally, choose Subnet groups in the DMS console, then choose your subnet group. Next, choose Delete from Actions.
    flag:
        replication-subnet-group-description: |-
            The description for the subnet group.

            Constraints: This parameter Must not contain non-printable control characters.
        replication-subnet-group-identifier: |-
            The name for the replication subnet group. This value is stored as a lowercase string.

            Constraints: Must contain no more than 255 alphanumeric characters, periods, underscores, or hyphens. Must not be "default".

            Example: `mySubnetgroup`
        subnet-ids: Two or more subnet IDs to be assigned to the subnet group.
        tags: One or more tags to be assigned to the subnet group.
