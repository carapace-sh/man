name: create-dbsubnet-group
description: Creates a new DB subnet group.
flags:
    --dbsubnet-group-description=!: The description for the DB subnet group.
    --dbsubnet-group-name=!: The name for the DB subnet group.
    --subnet-ids=!: The EC2 Subnet IDs for the DB subnet group.
    --tags=: Tags to assign to the DB subnet group.
documentation:
    command: Creates a new DB subnet group. DB subnet groups must contain at least one subnet in at least two AZs in the Amazon Web Services Region.
    flag:
        dbsubnet-group-description: The description for the DB subnet group.
        dbsubnet-group-name: |-
            The name for the DB subnet group. This value is stored as a lowercase string.

            Constraints:

            - Must contain no more than 255 letters, numbers, periods, underscores, spaces, or hyphens.
            - Must not be default.
            - First character must be a letter.

            Example: `mydbsubnetgroup`
        subnet-ids: The EC2 Subnet IDs for the DB subnet group.
        tags: Tags to assign to the DB subnet group.
