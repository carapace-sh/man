name: create-glue-identity-center-configuration
description: Creates a new Glue Identity Center configuration to enable integration between Glue and Amazon Web Services IAM Identity Center for authentication and authorization.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-arn=!: The Amazon Resource Name (ARN) of the Identity Center instance to be associated with the Glue configuration.
    --no-user-background-sessions-enabled: Specifies whether users can run background sessions when using Identity Center authentication with Glue services.
    --scopes=:
        description: A list of Identity Center scopes that define the permissions and access levels for the Glue configuration.
        nargs: -1
    --user-background-sessions-enabled: Specifies whether users can run background sessions when using Identity Center authentication with Glue services.
documentation:
    command: Creates a new Glue Identity Center configuration to enable integration between Glue and Amazon Web Services IAM Identity Center for authentication and authorization.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-arn: The Amazon Resource Name (ARN) of the Identity Center instance to be associated with the Glue configuration.
        scopes: A list of Identity Center scopes that define the permissions and access levels for the Glue configuration.
        user-background-sessions-enabled: Specifies whether users can run background sessions when using Identity Center authentication with Glue services.
