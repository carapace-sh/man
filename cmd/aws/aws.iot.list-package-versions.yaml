name: list-package-versions
description: Lists the software package versions associated to the account.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The token for the next set of results.
    --package-name=!: The name of the target software package.
    --status=: The status of the package version.
completion:
    flag:
        status:
            - DRAFT
            - PUBLISHED
            - DEPRECATED
documentation:
    command: |-
        Lists the software package versions associated to the account.

        Requires permission to access the [ListPackageVersions](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at one time.
        next-token: The token for the next set of results.
        package-name: The name of the target software package.
        status: The status of the package version. For more information, see [Package version lifecycle](https://docs.aws.amazon.com/iot/latest/developerguide/preparing-to-use-software-package-catalog.html#package-version-lifecycle).
