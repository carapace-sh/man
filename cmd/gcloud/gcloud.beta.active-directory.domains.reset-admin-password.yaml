name: reset-admin-password
description: '*(BETA)*  Reset the admin password for a Managed Microsoft AD domain.'
documentation:
    command: |
        *(BETA)*  Reset the delegated admin password for a Managed Microsoft AD domain given a valid AD domain
        fully-qualified domain name.

        This command can fail for the following reasons:
          * The AD domain specified does not exist.
          * The active account does not have permission to access the given
            AD domain.
