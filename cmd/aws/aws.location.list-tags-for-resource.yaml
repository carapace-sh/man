name: list-tags-for-resource
description: Returns a list of tags that are applied to the specified Amazon Location resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource whose tags you want to retrieve.
documentation:
    command: Returns a list of tags that are applied to the specified Amazon Location resource.
    flag:
        resource-arn: |-
            The Amazon Resource Name (ARN) of the resource whose tags you want to retrieve.

            - Format example: `arn:aws:geo:region:account-id:resourcetype/ExampleResource`
