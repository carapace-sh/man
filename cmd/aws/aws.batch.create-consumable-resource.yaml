name: create-consumable-resource
description: Creates an Batch consumable resource.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --consumable-resource-name=!: The name of the consumable resource.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-type=: Indicates whether the resource is available to be re-used after a job completes.
    --tags=: The tags that you apply to the consumable resource to help you categorize and organize your resources.
    --total-quantity=: The total amount of the consumable resource that is available.
documentation:
    command: Creates an Batch consumable resource.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        consumable-resource-name: The name of the consumable resource. Must be unique.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        resource-type: |-
            Indicates whether the resource is available to be re-used after a job completes. Can be one of:

            - `REPLENISHABLE` (default)
            - `NON_REPLENISHABLE`
        tags: The tags that you apply to the consumable resource to help you categorize and organize your resources. Each tag consists of a key and an optional value. For more information, see [Tagging your Batch resources](https://docs.aws.amazon.com/batch/latest/userguide/using-tags.html).
        total-quantity: The total amount of the consumable resource that is available. Must be non-negative.
