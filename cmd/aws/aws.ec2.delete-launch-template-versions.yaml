name: delete-launch-template-versions
description: Deletes one or more versions of a launch template.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --launch-template-id=: The ID of the launch template.
    --launch-template-name=: The name of the launch template.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --versions=!: The version numbers of one or more launch template versions to delete.
documentation:
    command: |-
        Deletes one or more versions of a launch template.

        You can't delete the default version of a launch template; you must first assign a different version as the default. If the default version is the only version for the launch template, you must delete the entire launch template using [DeleteLaunchTemplate]().

        You can delete up to 200 launch template versions in a single request. To delete more than 200 versions in a single request, use [DeleteLaunchTemplate](), which deletes the launch template and all of its versions.

        For more information, see [Delete a launch template version](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/delete-launch-template.html#delete-launch-template-version) in the *Amazon EC2 User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        launch-template-id: |-
            The ID of the launch template.

            You must specify either the launch template ID or the launch template name, but not both.
        launch-template-name: |-
            The name of the launch template.

            You must specify either the launch template ID or the launch template name, but not both.
        versions: The version numbers of one or more launch template versions to delete. You can specify up to 200 launch template version numbers.
