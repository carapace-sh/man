name: get-voice-connector-streaming-configuration
description: Retrieves the streaming configuration details for the specified Amazon Chime SDK Voice Connector.
flags:
    --voice-connector-id=!: The Voice Connector ID.
documentation:
    command: Retrieves the streaming configuration details for the specified Amazon Chime SDK Voice Connector. Shows whether media streaming is enabled for sending to Amazon Kinesis. It also shows the retention period, in hours, for the Amazon Kinesis data.
    flag:
        voice-connector-id: The Voice Connector ID.
