name: deregister-gateway-instance
description: Deregisters an instance.
flags:
    --force: Force the deregistration of an instance.
    --gateway-instance-arn=!: The Amazon Resource Name (ARN) of the gateway that contains the instance that you want to deregister.
    --no-force: Force the deregistration of an instance.
documentation:
    command: Deregisters an instance. Before you deregister an instance, all bridges running on the instance must be stopped. If you want to deregister an instance without stopping the bridges, you must use the --force option.
    flag:
        force: Force the deregistration of an instance. Force will deregister an instance, even if there are bridges running on it.
        gateway-instance-arn: The Amazon Resource Name (ARN) of the gateway that contains the instance that you want to deregister.
