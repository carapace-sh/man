name: set-iam-policy
description: '*(ALPHA)*  Set the IAM policy for a restore.'
flags:
    --location=: Google Cloud location.
    --restore-plan=: Restore Plan name.
documentation:
    command: |
        *(ALPHA)*  Set the IAM policy associated with a restore.

        ## EXAMPLES

        To set the IAM policy associated with a restore ``my-restore'' in project ``my-project'' in location ``us-central1'' under restore plan ``my-restore-plan'' with the policy defined in the JSON file ``policy.json'', run:

          $ gcloud alpha container backup-restore restores set-iam-policy my-restore policy.json --project=my-project --location=us-central1 --restore-plan=my-restore-plan
    flag:
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `restore` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
        restore-plan: |-
            Restore Plan name.
            +
            To set the `restore-plan` attribute:
            * provide the argument `restore` on the command line with a fully specified name;
            * provide the argument `--restore-plan` on the command line;
            * set the property `gkebackup/restore_plan`.
