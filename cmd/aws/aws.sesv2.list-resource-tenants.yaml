name: list-resource-tenants
description: List all tenants associated with a specific resource.
flags:
    --next-token=: A token returned from a previous call to `ListResourceTenants` to indicate the position in the list of resource tenants.
    --page-size=: The number of results to show in a single call to `ListResourceTenants`.
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to list associated tenants for.
documentation:
    command: |-
        List all tenants associated with a specific resource.

        This operation returns a list of tenants that are associated with the specified resource. This is useful for understanding which tenants are currently using a particular resource such as an email identity, configuration set, or email template.
    flag:
        next-token: A token returned from a previous call to `ListResourceTenants` to indicate the position in the list of resource tenants.
        page-size: The number of results to show in a single call to `ListResourceTenants`. If the number of results is larger than the number you specified in this parameter, then the response includes a `NextToken` element, which you can use to obtain additional results.
        resource-arn: The Amazon Resource Name (ARN) of the resource to list associated tenants for.
