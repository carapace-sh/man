name: get-flow-logs-integration-template
description: Generates a CloudFormation template that streamlines and automates the integration of VPC flow logs with Amazon Athena.
flags:
    --config-delivery-s3-destination-arn=!: To store the CloudFormation template in Amazon S3, specify the location in Amazon S3.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --flow-log-id=!: The ID of the flow log.
    --integrate-services=!: Information about the service integration.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: |-
        Generates a CloudFormation template that streamlines and automates the integration of VPC flow logs with Amazon Athena. This make it easier for you to query and gain insights from VPC flow logs data. Based on the information that you provide, we configure resources in the template to do the following:

        - Create a table in Athena that maps fields to a custom log format
        - Create a Lambda function that updates the table with new partitions on a daily, weekly, or monthly basis
        - Create a table partitioned between two timestamps in the past
        - Create a set of named queries in Athena that you can use to get started quickly

        `GetFlowLogsIntegrationTemplate` does not support integration between Amazon Web Services Transit Gateway Flow Logs and Amazon Athena.
    flag:
        config-delivery-s3-destination-arn: To store the CloudFormation template in Amazon S3, specify the location in Amazon S3.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        flow-log-id: The ID of the flow log.
        integrate-services: Information about the service integration.
