name: modify-usage-limit
description: Modifies a usage limit in a cluster.
flags:
    --amount=: The new limit amount.
    --breach-action=: The new action that Amazon Redshift takes when the limit is reached.
    --usage-limit-id=!: The identifier of the usage limit to modify.
completion:
    flag:
        breach-action:
            - log
            - emit-metric
            - disable
documentation:
    command: Modifies a usage limit in a cluster. You can't modify the feature type or period of a usage limit.
    flag:
        amount: The new limit amount. For more information about this parameter, see [UsageLimit]().
        breach-action: The new action that Amazon Redshift takes when the limit is reached. For more information about this parameter, see [UsageLimit]().
        usage-limit-id: The identifier of the usage limit to modify.
