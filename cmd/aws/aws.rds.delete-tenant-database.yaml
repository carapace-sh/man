name: delete-tenant-database
description: Deletes a tenant database from your DB instance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-instance-identifier=!: The user-supplied identifier for the DB instance that contains the tenant database that you want to delete.
    --final-db-snapshot-identifier=: The `DBSnapshotIdentifier` of the new `DBSnapshot` created when the `SkipFinalSnapshot` parameter is disabled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-skip-final-snapshot: Specifies whether to skip the creation of a final DB snapshot before removing the tenant database from your DB instance.
    --skip-final-snapshot: Specifies whether to skip the creation of a final DB snapshot before removing the tenant database from your DB instance.
    --tenant-db-name=!: The user-supplied name of the tenant database that you want to remove from your DB instance.
documentation:
    command: |-
        Deletes a tenant database from your DB instance. This command only applies to RDS for Oracle container database (CDB) instances.

        You can't delete a tenant database when it is the only tenant in the DB instance.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-instance-identifier: The user-supplied identifier for the DB instance that contains the tenant database that you want to delete.
        final-db-snapshot-identifier: |-
            The `DBSnapshotIdentifier` of the new `DBSnapshot` created when the `SkipFinalSnapshot` parameter is disabled.

            If you enable this parameter and also enable `SkipFinalShapshot`, the command results in an error.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        skip-final-snapshot: Specifies whether to skip the creation of a final DB snapshot before removing the tenant database from your DB instance. If you enable this parameter, RDS doesn't create a DB snapshot. If you don't enable this parameter, RDS creates a DB snapshot before it deletes the tenant database. By default, RDS doesn't skip the final snapshot. If you don't enable this parameter, you must specify the `FinalDBSnapshotIdentifier` parameter.
        tenant-db-name: The user-supplied name of the tenant database that you want to remove from your DB instance. Amazon RDS deletes the tenant database with this name. This parameter isn’t case-sensitive.
