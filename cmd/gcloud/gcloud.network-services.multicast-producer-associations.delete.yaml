name: delete
description: Delete a multicast producer association.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        Delete a multicast producer association in the specified location of the current project.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location Id.
            +
            To set the `location` attribute:
            * provide the argument `multicast_producer_association` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
