name: create-repository
description: Creates a repository.
flags:
    --description=: A description of the created repository.
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the created repository.
    --repository=!: The name of the repository to create.
    --tags=: One or more tag key-value pairs for the repository.
    --upstreams=: A list of upstream repositories to associate with the repository.
documentation:
    command: Creates a repository.
    flag:
        description: A description of the created repository.
        domain: The name of the domain that contains the created repository.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        repository: The name of the repository to create.
        tags: One or more tag key-value pairs for the repository.
        upstreams: A list of upstream repositories to associate with the repository. The order of the upstream repositories in the list determines their priority order when CodeArtifact looks for a requested package version. For more information, see [Working with upstream repositories](https://docs.aws.amazon.com/codeartifact/latest/ug/repos-upstream.html).
