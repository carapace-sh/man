name: create-dataset
description: Creates a new dataset in an Amazon Lookout for Vision project.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: ClientToken is an idempotency token that ensures a call to `CreateDataset` completes only once.
    --dataset-source=: The location of the manifest file that Amazon Lookout for Vision uses to create the dataset.
    --dataset-type=!: The type of the dataset.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --project-name=!: The name of the project in which you want to create a dataset.
documentation:
    command: |-
        Creates a new dataset in an Amazon Lookout for Vision project. `CreateDataset` can create a training or a test dataset from a valid dataset source (`DatasetSource`).

        If you want a single dataset project, specify `train` for the value of `DatasetType`.

        To have a project with separate training and test datasets, call `CreateDataset` twice. On the first call, specify `train` for the value of `DatasetType`. On the second call, specify `test` for the value of `DatasetType`.

        This operation requires permissions to perform the `lookoutvision:CreateDataset` operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            ClientToken is an idempotency token that ensures a call to `CreateDataset` completes only once. You choose the value to pass. For example, An issue might prevent you from getting a response from `CreateDataset`. In this case, safely retry your call to `CreateDataset` by using the same `ClientToken` parameter value.

            If you don't supply a value for `ClientToken`, the AWS SDK you are using inserts a value for you. This prevents retries after a network error from making multiple dataset creation requests. You'll need to provide your own value for other use cases.

            An error occurs if the other input parameters are not the same as in the first request. Using a different value for `ClientToken` is considered a new call to `CreateDataset`. An idempotency token is active for 8 hours.
        dataset-source: |-
            The location of the manifest file that Amazon Lookout for Vision uses to create the dataset.

            If you don't specify `DatasetSource`, an empty dataset is created and the operation synchronously returns. Later, you can add JSON Lines by calling [UpdateDatasetEntries]().

            If you specify a value for `DataSource`, the manifest at the S3 location is validated and used to create the dataset. The call to `CreateDataset` is asynchronous and might take a while to complete. To find out the current status, Check the value of `Status` returned in a call to [DescribeDataset]().
        dataset-type: The type of the dataset. Specify `train` for a training dataset. Specify `test` for a test dataset.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        project-name: The name of the project in which you want to create a dataset.
