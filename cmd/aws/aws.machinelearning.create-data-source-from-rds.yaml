name: create-data-source-from-rds
description: Creates a `DataSource` object from an [Amazon Relational Database Service](http://aws.amazon.com/rds/) (Amazon RDS).
flags:
    --compute-statistics=: The compute statistics for a `DataSource`.
    --data-source-id=!: A user-supplied ID that uniquely identifies the `DataSource`.
    --data-source-name=: A user-supplied name or description of the `DataSource`.
    --rdsdata=!: 'The data specification of an Amazon RDS `DataSource`:'
    --role-arn=!: The role that Amazon ML assumes on behalf of the user to create and activate a data pipeline in the user's account and copy data using the `SelectSqlQuery` query from Amazon RDS to Amazon S3.
documentation:
    command: |-
        Creates a `DataSource` object from an [Amazon Relational Database Service](http://aws.amazon.com/rds/) (Amazon RDS). A `DataSource` references data that can be used to perform `CreateMLModel`, `CreateEvaluation`, or `CreateBatchPrediction` operations.

        `CreateDataSourceFromRDS` is an asynchronous operation. In response to `CreateDataSourceFromRDS`, Amazon Machine Learning (Amazon ML) immediately returns and sets the `DataSource` status to `PENDING`. After the `DataSource` is created and ready for use, Amazon ML sets the `Status` parameter to `COMPLETED`. `DataSource` in the `COMPLETED` or `PENDING` state can be used only to perform `>CreateMLModel`&gt;, `CreateEvaluation`, or `CreateBatchPrediction` operations.

        If Amazon ML cannot accept the input source, it sets the `Status` parameter to `FAILED` and includes an error message in the `Message` attribute of the `GetDataSource` operation response.
    flag:
        compute-statistics: The compute statistics for a `DataSource`. The statistics are generated from the observation data referenced by a `DataSource`. Amazon ML uses the statistics internally during `MLModel` training. This parameter must be set to `true` if the `DataSource needs to be used for MLModel training.`
        data-source-id: A user-supplied ID that uniquely identifies the `DataSource`. Typically, an Amazon Resource Number (ARN) becomes the ID for a `DataSource`.
        data-source-name: A user-supplied name or description of the `DataSource`.
        rdsdata: "The data specification of an Amazon RDS `DataSource`:\n\n- DatabaseInformation -\n  \n  - `DatabaseName` - The name of the Amazon RDS database.\n  - `InstanceIdentifier` - A unique identifier for the Amazon RDS database instance.\n- DatabaseCredentials - AWS Identity and Access Management (IAM) credentials that are used to connect to the Amazon RDS database.\n- ResourceRole - A role (DataPipelineDefaultResourceRole) assumed by an EC2 instance to carry out the copy task from Amazon RDS to Amazon Simple Storage Service (Amazon S3). For more information, see [Role templates](https://docs.aws.amazon.com/datapipeline/latest/DeveloperGuide/dp-iam-roles.html) for data pipelines.\n- ServiceRole - A role (DataPipelineDefaultRole) assumed by the AWS Data Pipeline service to monitor the progress of the copy task from Amazon RDS to Amazon S3. For more information, see [Role templates](https://docs.aws.amazon.com/datapipeline/latest/DeveloperGuide/dp-iam-roles.html) for data pipelines.\n- SecurityInfo - The security information to use to access an RDS DB instance. You need to set up appropriate ingress rules for the security entity IDs provided to allow access to the Amazon RDS instance. Specify a \\[`SubnetId`, `SecurityGroupIds`] pair for a VPC-based RDS DB instance.\n- SelectSqlQuery - A query that is used to retrieve the observation data for the `Datasource`.\n- S3StagingLocation - The Amazon S3 location for staging Amazon RDS data. The data retrieved from Amazon RDS using `SelectSqlQuery` is stored in this location.\n- DataSchemaUri - The Amazon S3 location of the `DataSchema`.\n- DataSchema - A JSON string representing the schema. This is not required if `DataSchemaUri` is specified.\n- DataRearrangement - A JSON string that represents the splitting and rearrangement requirements for the `Datasource`.\n  \n  Sample - `\"{\\\"splitting\\\":{\\\"percentBegin\\\":10,\\\"percentEnd\\\":60}}\"`"
        role-arn: The role that Amazon ML assumes on behalf of the user to create and activate a data pipeline in the user's account and copy data using the `SelectSqlQuery` query from Amazon RDS to Amazon S3.
