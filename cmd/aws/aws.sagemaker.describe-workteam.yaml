name: describe-workteam
description: Gets information about a specific work team.
flags:
    --workteam-name=!: The name of the work team to return a description of.
documentation:
    command: Gets information about a specific work team. You can see information such as the creation date, the last updated date, membership information, and the work team's Amazon Resource Name (ARN).
    flag:
        workteam-name: The name of the work team to return a description of.
