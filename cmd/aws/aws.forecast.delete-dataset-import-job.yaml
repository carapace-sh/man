name: delete-dataset-import-job
description: Deletes a dataset import job created using the [CreateDatasetImportJob](https://docs.aws.amazon.com/forecast/latest/dg/API_CreateDatasetImportJob.html) operation.
flags:
    --dataset-import-job-arn=!: The Amazon Resource Name (ARN) of the dataset import job to delete.
documentation:
    command: Deletes a dataset import job created using the [CreateDatasetImportJob](https://docs.aws.amazon.com/forecast/latest/dg/API_CreateDatasetImportJob.html) operation. You can delete only dataset import jobs that have a status of `ACTIVE` or `CREATE_FAILED`. To get the status, use the [DescribeDatasetImportJob](https://docs.aws.amazon.com/forecast/latest/dg/API_DescribeDatasetImportJob.html) operation.
    flag:
        dataset-import-job-arn: The Amazon Resource Name (ARN) of the dataset import job to delete.
