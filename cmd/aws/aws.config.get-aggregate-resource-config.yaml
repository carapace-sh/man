name: get-aggregate-resource-config
description: Returns configuration item that is aggregated for your specific resource in a specific source account and region.
flags:
    --configuration-aggregator-name=!: The name of the configuration aggregator.
    --resource-identifier=!: An object that identifies aggregate resource.
documentation:
    command: |-
        Returns configuration item that is aggregated for your specific resource in a specific source account and region.

        The API does not return results for deleted resources.
    flag:
        configuration-aggregator-name: The name of the configuration aggregator.
        resource-identifier: An object that identifies aggregate resource.
