name: create-db-proxy-endpoint
description: Creates a `DBProxyEndpoint`.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-proxy-endpoint-name=!: The name of the DB proxy endpoint to create.
    --db-proxy-name=!: The name of the DB proxy associated with the DB proxy endpoint that you create.
    --endpoint-network-type=: The network type of the DB proxy endpoint.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --tags=: ""
    --target-role=: The role of the DB proxy endpoint.
    --vpc-security-group-ids=: The VPC security group IDs for the DB proxy endpoint that you create.
    --vpc-subnet-ids=!: The VPC subnet IDs for the DB proxy endpoint that you create.
completion:
    flag:
        endpoint-network-type:
            - IPV4
            - IPV6
            - DUAL
        target-role:
            - READ_WRITE
            - READ_ONLY
documentation:
    command: Creates a `DBProxyEndpoint`. Only applies to proxies that are associated with Aurora DB clusters. You can use DB proxy endpoints to specify read/write or read-only access to the DB cluster. You can also use DB proxy endpoints to access a DB proxy through a different VPC than the proxy's default VPC.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-proxy-endpoint-name: The name of the DB proxy endpoint to create.
        db-proxy-name: The name of the DB proxy associated with the DB proxy endpoint that you create.
        endpoint-network-type: |-
            The network type of the DB proxy endpoint. The network type determines the IP version that the proxy endpoint supports.

            Valid values:

            - `IPV4` - The proxy endpoint supports IPv4 only.
            - `IPV6` - The proxy endpoint supports IPv6 only.
            - `DUAL` - The proxy endpoint supports both IPv4 and IPv6.

            Default: `IPV4`

            Constraints:

            - If you specify `IPV6` or `DUAL`, the VPC and all subnets must have an IPv6 CIDR block.
            - If you specify `IPV6` or `DUAL`, the VPC tenancy cannot be `dedicated`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tags: ""
        target-role: The role of the DB proxy endpoint. The role determines whether the endpoint can be used for read/write or only read operations. The default is `READ_WRITE`. The only role that proxies for RDS for Microsoft SQL Server support is `READ_WRITE`.
        vpc-security-group-ids: The VPC security group IDs for the DB proxy endpoint that you create. You can specify a different set of security group IDs than for the original DB proxy. The default is the default security group for the VPC.
        vpc-subnet-ids: The VPC subnet IDs for the DB proxy endpoint that you create. You can specify a different set of subnet IDs than for the original DB proxy.
