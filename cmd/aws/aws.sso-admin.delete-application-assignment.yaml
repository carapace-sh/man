name: delete-application-assignment
description: Revoke application access to an application by deleting application assignments for a user or group.
flags:
    --application-arn=!: Specifies the ARN of the application.
    --principal-id=!: An identifier for an object in IAM Identity Center, such as a user or group.
    --principal-type=!: The entity type for which the assignment will be deleted.
completion:
    flag:
        principal-type:
            - USER
            - GROUP
documentation:
    command: Revoke application access to an application by deleting application assignments for a user or group.
    flag:
        application-arn: Specifies the ARN of the application.
        principal-id: An identifier for an object in IAM Identity Center, such as a user or group. PrincipalIds are GUIDs (For example, f81d4fae-7dec-11d0-a765-00a0c91e6bf6). For more information about PrincipalIds in IAM Identity Center, see the [IAM Identity Center Identity Store API Reference](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/welcome.html).
        principal-type: The entity type for which the assignment will be deleted.
