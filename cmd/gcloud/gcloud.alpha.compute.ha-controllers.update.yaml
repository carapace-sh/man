name: update
description: '*(ALPHA)*  Update the settings of an existing HA Controller.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Updates the text description of the HA controller.
    --failover-initiation=: Changes the failover trigger between AUTOMATIC and MANUAL_ONLY.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Google Compute Engine region where the HA Controller exists.
    --secondary-zone-capacity=: Changes the capacity guarantee in the secondary zone between GUARANTEED_STOPPED and BEST_EFFORT.
completion:
    flag:
        failover-initiation:
            - failover-initiation-unspecified
            - manual-only
        secondary-zone-capacity:
            - best-effort
            - secondary-zone-capacity-unspecified
documentation:
    command: '*(ALPHA)*  Update an High Availability (HA) Controller to, for example, change the existing HA Controller failover initiation configuration from automatic to manual, or vice-versa.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Updates the text description of the HA controller.
        failover-initiation: 'Changes the failover trigger between AUTOMATIC and MANUAL_ONLY. _FAILOVER_INITIATION_ must be one of: *failover-initiation-unspecified*, *manual-only*.'
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Google Compute Engine region where the HA Controller exists.
            +
            Overrides the default compute/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `ha_controller` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `compute/region`.
        secondary-zone-capacity: 'Changes the capacity guarantee in the secondary zone between GUARANTEED_STOPPED and BEST_EFFORT. _SECONDARY_ZONE_CAPACITY_ must be one of: *best-effort*, *secondary-zone-capacity-unspecified*.'
