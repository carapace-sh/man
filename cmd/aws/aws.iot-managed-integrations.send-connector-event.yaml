name: send-connector-event
description: Relays third-party device events for a connector such as a new device or a device state change event.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connector-device-id=: The third-party device id as defined by the connector.
    --connector-id=!: The id of the connector between the third-party cloud provider and IoT managed integrations.
    --device-discovery-id=: The id for the device discovery job.
    --devices=: The list of devices.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --matter-endpoint=: The device endpoint.
    --message=: The device state change event payload.
    --operation-version=: The Open Connectivity Foundation (OCF) security specification version for the operation being requested on the managed thing.
    --operation=!: The Open Connectivity Foundation (OCF) operation requested to be performed on the managed thing.
    --status-code=: The status code of the Open Connectivity Foundation (OCF) operation being performed on the managed thing.
    --trace-id=: The trace request identifier.
    --user-id=: The id of the third-party cloud provider.
completion:
    flag:
        operation:
            - DEVICE_COMMAND_RESPONSE
            - DEVICE_DISCOVERY
            - DEVICE_EVENT
            - DEVICE_COMMAND_REQUEST
documentation:
    command: Relays third-party device events for a connector such as a new device or a device state change event.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connector-device-id: |-
            The third-party device id as defined by the connector. This device id must not contain personal identifiable information (PII).

            This parameter is used for cloud-to-cloud devices only.
        connector-id: The id of the connector between the third-party cloud provider and IoT managed integrations.
        device-discovery-id: The id for the device discovery job.
        devices: The list of devices.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        matter-endpoint: The device endpoint.
        message: |-
            The device state change event payload.

            This parameter will include the following three fields:

            - `uri`: `schema auc://<PARTNER-DEVICE-ID>/ResourcePath` (The `Resourcepath` corresponds to an OCF resource.)
            - `op`: For device state changes, this field must populate as `n+d`.
            - `cn`: The content depends on the OCF resource referenced in `ResourcePath`.
        operation: |-
            The Open Connectivity Foundation (OCF) operation requested to be performed on the managed thing.

            The field op can have a value of "I" or "U". The field "cn" will contain the capability types.
        operation-version: The Open Connectivity Foundation (OCF) security specification version for the operation being requested on the managed thing. For more information, see [OCF Security Specification](https://openconnectivity.org/specs/OCF_Security_Specification_v1.0.0.pdf).
        status-code: The status code of the Open Connectivity Foundation (OCF) operation being performed on the managed thing.
        trace-id: The trace request identifier. This is generated by IoT managed integrations and can be used to trace this command and its related operations in CloudWatch.
        user-id: The id of the third-party cloud provider.
