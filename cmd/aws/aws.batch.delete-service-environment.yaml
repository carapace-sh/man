name: delete-service-environment
description: Deletes a Service environment.
flags:
    --service-environment=!: The name or ARN of the service environment to delete.
documentation:
    command: Deletes a Service environment. Before you can delete a service environment, you must first set its state to `DISABLED` with the `UpdateServiceEnvironment` API operation and disassociate it from any job queues with the `UpdateJobQueue` API operation.
    flag:
        service-environment: The name or ARN of the service environment to delete.
