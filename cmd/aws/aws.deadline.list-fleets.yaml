name: list-fleets
description: Lists fleets.
flags:
    --display-name=: The display names of a list of fleets.
    --farm-id=!: The farm ID of the fleets.
    --max-results=: The maximum number of results to return.
    --next-token=: The token for the next set of results, or `null` to start from the beginning.
    --principal-id=: The principal ID of the members to include in the fleet.
    --status=: The status of the fleet.
completion:
    flag:
        status:
            - ACTIVE
            - CREATE_IN_PROGRESS
            - UPDATE_IN_PROGRESS
            - CREATE_FAILED
            - UPDATE_FAILED
            - SUSPENDED
documentation:
    command: Lists fleets.
    flag:
        display-name: |-
            The display names of a list of fleets.

            This field can store any content. Escape or encode this content before displaying it on a webpage or any other system that might interpret the content of this field.
        farm-id: The farm ID of the fleets.
        max-results: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        next-token: The token for the next set of results, or `null` to start from the beginning.
        principal-id: The principal ID of the members to include in the fleet.
        status: The status of the fleet.
