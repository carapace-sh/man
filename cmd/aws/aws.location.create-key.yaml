name: create-key
description: Creates an API key resource in your Amazon Web Services account, which lets you grant actions for Amazon Location resources to the API key bearer.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: An optional description for the API key resource.
    --expire-time=: 'The optional timestamp for when the API key resource will expire in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format: `YYYY-MM-DDThh:mm:ss.sssZ`.'
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --key-name=!: A custom name for the API key resource.
    --no-expiry: Optionally set to `true` to set no expiration time for the API key.
    --no-no-expiry: Optionally set to `true` to set no expiration time for the API key.
    --restrictions=!: The API key restrictions for the API key resource.
    --tags=: Applies one or more tags to the map resource.
documentation:
    command: |-
        Creates an API key resource in your Amazon Web Services account, which lets you grant actions for Amazon Location resources to the API key bearer.

        For more information, see [Use API keys to authenticate](https://docs.aws.amazon.com/location/latest/developerguide/using-apikeys.html) in the *Amazon Location Service Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: An optional description for the API key resource.
        expire-time: 'The optional timestamp for when the API key resource will expire in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format: `YYYY-MM-DDThh:mm:ss.sssZ`. One of `NoExpiry` or `ExpireTime` must be set.'
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        key-name: |-
            A custom name for the API key resource.

            Requirements:

            - Contain only alphanumeric characters (A–Z, a–z, 0–9), hyphens (-), periods (.), and underscores (\_).
            - Must be a unique API key name.
            - No spaces allowed. For example, `ExampleAPIKey`.
        no-expiry: Optionally set to `true` to set no expiration time for the API key. One of `NoExpiry` or `ExpireTime` must be set.
        restrictions: The API key restrictions for the API key resource.
        tags: |-
            Applies one or more tags to the map resource. A tag is a key-value pair that helps manage, identify, search, and filter your resources by labelling them.

            Format: `"key" : "value"`

            Restrictions:

            - Maximum 50 tags per resource
            - Each resource tag must be unique with a maximum of one value.
            - Maximum key length: 128 Unicode characters in UTF-8
            - Maximum value length: 256 Unicode characters in UTF-8
            - Can use alphanumeric characters (A–Z, a–z, 0–9), and the following characters: + - = . _ : / @.
            - Cannot use "aws:" as a prefix for a key.
