name: describe-event-subscriptions
description: Lists all the event subscriptions for a customer account.
flags:
    --filters=: Filters applied to event subscriptions.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
    --subscription-name=: The name of the DMS event subscription to be described.
documentation:
    command: |-
        Lists all the event subscriptions for a customer account. The description of a subscription includes `SubscriptionName`, `SNSTopicARN`, `CustomerID`, `SourceType`, `SourceID`, `CreationTime`, and `Status`.

        If you specify `SubscriptionName`, this action lists the description for that subscription.
    flag:
        filters: |-
            Filters applied to event subscriptions.

            Valid filter names: `event-subscription-arn` | `event-subscription-id`
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        subscription-name: The name of the DMS event subscription to be described.
