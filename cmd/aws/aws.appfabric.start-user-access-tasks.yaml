name: start-user-access-tasks
description: Starts the tasks to search user access status for a specific email address.
flags:
    --app-bundle-identifier=!: The Amazon Resource Name (ARN) or Universal Unique Identifier (UUID) of the app bundle to use for the request.
    --email=!: The email address of the target user.
documentation:
    command: |-
        Starts the tasks to search user access status for a specific email address.

        The tasks are stopped when the user access status data is found. The tasks are terminated when the API calls to the application time out.
    flag:
        app-bundle-identifier: The Amazon Resource Name (ARN) or Universal Unique Identifier (UUID) of the app bundle to use for the request.
        email: The email address of the target user.
