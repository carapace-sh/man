name: set-iam-policy
description: Set the IAM policy for a workload identity pool.
flags:
    --location=: The location name.
documentation:
    command: Replaces the existing IAM policy for a workload identity pool given a workload identity pool ID and a file encoded in JSON or YAML that contains the IAM policy.
    flag:
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `workload_identity_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
