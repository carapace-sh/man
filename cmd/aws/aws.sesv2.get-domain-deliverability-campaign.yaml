name: get-domain-deliverability-campaign
description: Retrieve all the deliverability data for a specific campaign.
flags:
    --campaign-id=!: The unique identifier for the campaign.
documentation:
    command: Retrieve all the deliverability data for a specific campaign. This data is available for a campaign only if the campaign sent email by using a domain that the Deliverability dashboard is enabled for.
    flag:
        campaign-id: The unique identifier for the campaign. The Deliverability dashboard automatically generates and assigns this identifier to a campaign.
