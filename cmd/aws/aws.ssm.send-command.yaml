name: send-command
description: Runs commands on one or more managed nodes.
flags:
    --alarm-configuration=: The CloudWatch alarm you want to apply to your command.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cloud-watch-output-config=: Enables Amazon Web Services Systems Manager to send Run Command output to Amazon CloudWatch Logs.
    --comment=: User-specified information about the command, such as a brief description of what the command should do.
    --document-hash-type=: Sha256 or Sha1.
    --document-hash=: The Sha256 or Sha1 hash created by the system when the document was created.
    --document-name=!: The name of the Amazon Web Services Systems Manager document (SSM document) to run.
    --document-version=: The SSM document version to use in the request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-ids=:
        description: The IDs of the managed nodes where the command should run.
        nargs: -1
    --max-concurrency=: (Optional) The maximum number of managed nodes that are allowed to run the command at the same time.
    --max-errors=: The maximum number of errors allowed without the command failing.
    --notification-config=: Configurations for sending notifications.
    --output-s3-bucket-name=: The name of the S3 bucket where command execution responses should be stored.
    --output-s3-key-prefix=: The directory structure within the S3 bucket where the responses should be stored.
    --output-s3-region=: (Deprecated) You can no longer specify this parameter.
    --parameters=: The required and optional parameters specified in the document being run.
    --service-role-arn=: The ARN of the Identity and Access Management (IAM) service role to use to publish Amazon Simple Notification Service (Amazon SNS) notifications for Run Command commands.
    --targets=:
        description: An array of search criteria that targets managed nodes using a `Key,Value` combination that you specify.
        nargs: -1
    --timeout-seconds=: If this time is reached and the command hasn't already started running, it won't run.
completion:
    flag:
        document-hash-type:
            - Sha256
            - Sha1
documentation:
    command: Runs commands on one or more managed nodes.
    flag:
        alarm-configuration: The CloudWatch alarm you want to apply to your command.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cloud-watch-output-config: Enables Amazon Web Services Systems Manager to send Run Command output to Amazon CloudWatch Logs. Run Command is a tool in Amazon Web Services Systems Manager.
        comment: User-specified information about the command, such as a brief description of what the command should do.
        document-hash: |-
            The Sha256 or Sha1 hash created by the system when the document was created.

            Sha1 hashes have been deprecated.
        document-hash-type: |-
            Sha256 or Sha1.

            Sha1 hashes have been deprecated.
        document-name: |-
            The name of the Amazon Web Services Systems Manager document (SSM document) to run. This can be a public document or a custom document. To run a shared document belonging to another account, specify the document Amazon Resource Name (ARN). For more information about how to use shared documents, see [Sharing SSM documents](https://docs.aws.amazon.com/systems-manager/latest/userguide/ssm-using-shared.html) in the *Amazon Web Services Systems Manager User Guide*.

            If you specify a document name or ARN that hasn't been shared with your account, you receive an `InvalidDocument` error.
        document-version: |-
            The SSM document version to use in the request. You can specify $DEFAULT, $LATEST, or a specific version number. If you run commands by using the Command Line Interface (Amazon Web Services CLI), then you must escape the first two options by using a backslash. If you specify a version number, then you don't need to use the backslash. For example:

            --document-version "\\$DEFAULT"

            --document-version "\\$LATEST"

            --document-version "3"
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-ids: |-
            The IDs of the managed nodes where the command should run. Specifying managed node IDs is most useful when you are targeting a limited number of managed nodes, though you can specify up to 50 IDs.

            To target a larger number of managed nodes, or if you prefer not to list individual node IDs, we recommend using the `Targets` option instead. Using `Targets`, which accepts tag key-value pairs to identify the managed nodes to send commands to, you can a send command to tens, hundreds, or thousands of nodes at once.

            For more information about how to use targets, see [Run commands at scale](https://docs.aws.amazon.com/systems-manager/latest/userguide/send-commands-multiple.html) in the *Amazon Web Services Systems Manager User Guide*.
        max-concurrency: (Optional) The maximum number of managed nodes that are allowed to run the command at the same time. You can specify a number such as 10 or a percentage such as 10%. The default value is `50`. For more information about how to use `MaxConcurrency`, see [Using concurrency controls](https://docs.aws.amazon.com/systems-manager/latest/userguide/send-commands-multiple.html#send-commands-velocity) in the *Amazon Web Services Systems Manager User Guide*.
        max-errors: The maximum number of errors allowed without the command failing. When the command fails one more time beyond the value of `MaxErrors`, the systems stops sending the command to additional targets. You can specify a number like 10 or a percentage like 10%. The default value is `0`. For more information about how to use `MaxErrors`, see [Using error controls](https://docs.aws.amazon.com/systems-manager/latest/userguide/send-commands-multiple.html#send-commands-maxerrors) in the *Amazon Web Services Systems Manager User Guide*.
        notification-config: Configurations for sending notifications.
        output-s3-bucket-name: The name of the S3 bucket where command execution responses should be stored.
        output-s3-key-prefix: The directory structure within the S3 bucket where the responses should be stored.
        output-s3-region: (Deprecated) You can no longer specify this parameter. The system ignores it. Instead, Systems Manager automatically determines the Amazon Web Services Region of the S3 bucket.
        parameters: The required and optional parameters specified in the document being run.
        service-role-arn: |-
            The ARN of the Identity and Access Management (IAM) service role to use to publish Amazon Simple Notification Service (Amazon SNS) notifications for Run Command commands.

            This role must provide the `sns:Publish` permission for your notification topic. For information about creating and using this service role, see [Monitoring Systems Manager status changes using Amazon SNS notifications](https://docs.aws.amazon.com/systems-manager/latest/userguide/monitoring-sns-notifications.html) in the *Amazon Web Services Systems Manager User Guide*.
        targets: |-
            An array of search criteria that targets managed nodes using a `Key,Value` combination that you specify. Specifying targets is most useful when you want to send a command to a large number of managed nodes at once. Using `Targets`, which accepts tag key-value pairs to identify managed nodes, you can send a command to tens, hundreds, or thousands of nodes at once.

            To send a command to a smaller number of managed nodes, you can use the `InstanceIds` option instead.

            For more information about how to use targets, see [Run commands at scale](https://docs.aws.amazon.com/systems-manager/latest/userguide/send-commands-multiple.html) in the *Amazon Web Services Systems Manager User Guide*.
        timeout-seconds: If this time is reached and the command hasn't already started running, it won't run.
