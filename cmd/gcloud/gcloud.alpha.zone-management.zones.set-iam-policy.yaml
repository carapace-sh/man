name: set-iam-policy
description: '*(ALPHA)*  set IAM policy for a project on the zone.'
flags:
    --location=: The global location name.
    --zone=!: ID of the zone or fully qualified identifier for the zone.
documentation:
    command: '*(ALPHA)*  Sets the IAM policy for a project on the zone.'
    flag:
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `--zone` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        zone: |-
            ID of the zone or fully qualified identifier for the zone.
            +
            To set the `zone` attribute:
            * provide the argument `--zone` on the command line.
