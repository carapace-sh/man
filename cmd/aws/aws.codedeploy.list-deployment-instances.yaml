name: list-deployment-instances
description: The newer `BatchGetDeploymentTargets` should be used instead because it works with all compute types.
flags:
    --deployment-id=!: The unique ID of a deployment.
    --instance-status-filter=: 'A subset of instances to list by status:'
    --instance-type-filter=: The set of instances in a blue/green deployment, either those in the original environment ("BLUE") or those in the replacement environment ("GREEN"), for which you want to view instance information.
    --next-token=: An identifier returned from the previous list deployment instances call.
documentation:
    command: |-
        The newer `BatchGetDeploymentTargets` should be used instead because it works with all compute types. `ListDeploymentInstances` throws an exception if it is used with a compute platform other than EC2/On-premises or Lambda.

        Lists the instance for a deployment associated with the user or Amazon Web Services account.
    flag:
        deployment-id: The unique ID of a deployment.
        instance-status-filter: |-
            A subset of instances to list by status:

            - `Pending`: Include those instances with pending deployments.
            - `InProgress`: Include those instances where deployments are still in progress.
            - `Succeeded`: Include those instances with successful deployments.
            - `Failed`: Include those instances with failed deployments.
            - `Skipped`: Include those instances with skipped deployments.
            - `Unknown`: Include those instances with deployments in an unknown state.
        instance-type-filter: The set of instances in a blue/green deployment, either those in the original environment ("BLUE") or those in the replacement environment ("GREEN"), for which you want to view instance information.
        next-token: An identifier returned from the previous list deployment instances call. It can be used to return the next set of deployment instances in the list.
