name: update
description: Update a Firewall Plus endpoint.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clear-labels: Remove all labels.
    --description=: Description of the endpoint
    --max-wait=: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Remove all labels.
    --organization=: Organization ID of the firewall endpoint.
    --remove-labels=: List of label keys to remove.
    --update-billing-project=: The Google Cloud project ID to use for API enablement check, quota, and endpoint uptime billing.
    --update-labels=: List of label KEY=VALUE pairs to update.
    --zone=: Zone of the firewall endpoint.
documentation:
    command: |+
        Update a firewall endpoint. Check the progress of endpoint update
        by using `gcloud network-security firewall-endpoints describe`.

        For more examples, refer to the EXAMPLES section below.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        description: Description of the endpoint
        max-wait: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously. Ignored if --no-async isn't specified. See $ gcloud topic datetimes for information on time formats.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        organization: |-
            Organization ID of the firewall endpoint.
            +
            To set the `organization` attribute:
            * provide the argument `FIREWALL_ENDPOINT` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        update-billing-project: The Google Cloud project ID to use for API enablement check, quota, and endpoint uptime billing. Overrides the default *billing/quota_project* property value for this command invocation.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        zone: |-
            Zone of the firewall endpoint.
            +
            To set the `zone` attribute:
            * provide the argument `FIREWALL_ENDPOINT` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
