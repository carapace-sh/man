name: list-scans
description: Returns a list of all scans in an account.
flags:
    --max-results=: The maximum number of results to return in the response.
    --next-token=: A token to use for paginating results that are returned in the response.
documentation:
    command: Returns a list of all scans in an account. Does not return `EXPRESS` scans.
    flag:
        max-results: The maximum number of results to return in the response. Use this parameter when paginating results. If additional results exist beyond the number you specify, the `nextToken` element is returned in the response. Use `nextToken` in a subsequent request to retrieve additional results. If not specified, returns 100 results.
        next-token: A token to use for paginating results that are returned in the response. Set the value of this parameter to null for the first request. For subsequent calls, use the `nextToken` value returned from the previous request to continue listing results after the first page.
