name: rebuild-environment
description: 'Deletes and recreates all of the AWS resources (for example: the Auto Scaling group, load balancer, etc.) for a specified environment and forces a restart.'
flags:
    --environment-id=: The ID of the environment to rebuild.
    --environment-name=: The name of the environment to rebuild.
documentation:
    command: 'Deletes and recreates all of the AWS resources (for example: the Auto Scaling group, load balancer, etc.) for a specified environment and forces a restart.'
    flag:
        environment-id: |-
            The ID of the environment to rebuild.

            Condition: You must specify either this or an EnvironmentName, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
        environment-name: |-
            The name of the environment to rebuild.

            Condition: You must specify either this or an EnvironmentId, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
