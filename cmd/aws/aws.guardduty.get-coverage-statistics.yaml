name: get-coverage-statistics
description: Retrieves aggregated statistics for your account.
flags:
    --detector-id=!: The unique ID of the GuardDuty detector.
    --filter-criteria=: Represents the criteria used to filter the coverage statistics.
    --statistics-type=!: Represents the statistics type used to aggregate the coverage details.
documentation:
    command: Retrieves aggregated statistics for your account. If you are a GuardDuty administrator, you can retrieve the statistics for all the resources associated with the active member accounts in your organization who have enabled Runtime Monitoring and have the GuardDuty security agent running on their resources.
    flag:
        detector-id: |-
            The unique ID of the GuardDuty detector.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        filter-criteria: Represents the criteria used to filter the coverage statistics.
        statistics-type: Represents the statistics type used to aggregate the coverage details.
