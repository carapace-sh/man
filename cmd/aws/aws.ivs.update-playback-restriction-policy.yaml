name: update-playback-restriction-policy
description: Updates a specified playback restriction policy.
flags:
    --allowed-countries=: A list of country codes that control geoblocking restriction.
    --allowed-origins=: A list of origin sites that control CORS restriction.
    --arn=!: ARN of the playback-restriction-policy to be updated.
    --enable-strict-origin-enforcement=: Whether channel playback is constrained by origin site.
    --name=: Playback-restriction-policy name.
documentation:
    command: Updates a specified playback restriction policy.
    flag:
        allowed-countries: 'A list of country codes that control geoblocking restriction. Allowed values are the officially assigned [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) codes. Default: All countries (an empty array).'
        allowed-origins: 'A list of origin sites that control CORS restriction. Allowed values are the same as valid values of the Origin header defined at [https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Origin](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Origin). Default: All origins (an empty array).'
        arn: ARN of the playback-restriction-policy to be updated.
        enable-strict-origin-enforcement: 'Whether channel playback is constrained by origin site. Default: `false`.'
        name: Playback-restriction-policy name. The value does not need to be unique.
