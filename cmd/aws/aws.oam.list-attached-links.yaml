name: list-attached-links
description: Returns a list of source account links that are linked to this monitoring account sink.
flags:
    --max-results=: Limits the number of returned links to the specified number.
    --next-token=: The token for the next set of items to return.
    --sink-identifier=!: The ARN of the sink that you want to retrieve links for.
documentation:
    command: |-
        Returns a list of source account links that are linked to this monitoring account sink.

        To use this operation, provide the sink ARN. To retrieve a list of sink ARNs, use [ListSinks](https://docs.aws.amazon.com/OAM/latest/APIReference/API_ListSinks.html).

        To find a list of links for one source account, use [ListLinks](https://docs.aws.amazon.com/OAM/latest/APIReference/API_ListLinks.html).
    flag:
        max-results: Limits the number of returned links to the specified number.
        next-token: The token for the next set of items to return. You received this token from a previous call.
        sink-identifier: The ARN of the sink that you want to retrieve links for.
