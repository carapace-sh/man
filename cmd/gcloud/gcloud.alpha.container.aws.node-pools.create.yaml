    --async: Return immediately, without waiting for the operation in progress to
    --autoscaling-metrics-granularity=!: Frequency at which EC2 Auto Scaling sends aggregated data to AWS CloudWatch.
    --autoscaling-metrics=: Autoscaling metrics to enable.
    --cluster=: cluster of the node_pool.
    --config-encryption-kms-key-arn=!: Amazon Resource Name (ARN) of the AWS KMS key to encrypt the user data.
    --enable-autorepair: Enable node autorepair feature for a node pool.
    --iam-instance-profile=!: Name or ARN of the IAM instance profile associated with the node pool.
    --image-type=: Set the OS image type to use on node pool instances.
    --instance-placement=: Type of the tenancy.
