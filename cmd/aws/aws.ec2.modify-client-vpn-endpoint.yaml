name: modify-client-vpn-endpoint
description: Modifies the specified Client VPN endpoint.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-connect-options=: The options for managing connection authorization for new client connections.
    --client-login-banner-options=: Options for enabling a customizable text banner that will be displayed on Amazon Web Services provided clients when a VPN session is established.
    --client-route-enforcement-options=: Client route enforcement is a feature of the Client VPN service that helps enforce administrator defined routes on devices connected through the VPN.
    --client-vpn-endpoint-id=!: The ID of the Client VPN endpoint to modify.
    --connection-log-options=: Information about the client connection logging options.
    --description=: A brief description of the Client VPN endpoint.
    --disconnect-on-session-timeout: Indicates whether the client VPN session is disconnected after the maximum timeout specified in `sessionTimeoutHours` is reached.
    --dns-servers=: Information about the DNS servers to be used by Client VPN connections.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-disconnect-on-session-timeout: Indicates whether the client VPN session is disconnected after the maximum timeout specified in `sessionTimeoutHours` is reached.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-split-tunnel: Indicates whether the VPN is split-tunnel.
    --security-group-ids=: The IDs of one or more security groups to apply to the target network.
    --self-service-portal=: Specify whether to enable the self-service portal for the Client VPN endpoint.
    --server-certificate-arn=: The ARN of the server certificate to be used.
    --session-timeout-hours=: The maximum VPN session duration time in hours.
    --split-tunnel: Indicates whether the VPN is split-tunnel.
    --vpc-id=: The ID of the VPC to associate with the Client VPN endpoint.
    --vpn-port=: The port number to assign to the Client VPN endpoint for TCP and UDP traffic.
completion:
    flag:
        self-service-portal:
            - enabled
            - disabled
documentation:
    command: Modifies the specified Client VPN endpoint. Modifying the DNS server resets existing client connections.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-connect-options: The options for managing connection authorization for new client connections.
        client-login-banner-options: Options for enabling a customizable text banner that will be displayed on Amazon Web Services provided clients when a VPN session is established.
        client-route-enforcement-options: |-
            Client route enforcement is a feature of the Client VPN service that helps enforce administrator defined routes on devices connected through the VPN. T his feature helps improve your security posture by ensuring that network traffic originating from a connected client is not inadvertently sent outside the VPN tunnel.

            Client route enforcement works by monitoring the route table of a connected device for routing policy changes to the VPN connection. If the feature detects any VPN routing policy modifications, it will automatically force an update to the route table, reverting it back to the expected route configurations.
        client-vpn-endpoint-id: The ID of the Client VPN endpoint to modify.
        connection-log-options: |-
            Information about the client connection logging options.

            If you enable client connection logging, data about client connections is sent to a Cloudwatch Logs log stream. The following information is logged:

            - Client connection requests
            - Client connection results (successful and unsuccessful)
            - Reasons for unsuccessful client connection requests
            - Client connection termination time
        description: A brief description of the Client VPN endpoint.
        disconnect-on-session-timeout: Indicates whether the client VPN session is disconnected after the maximum timeout specified in `sessionTimeoutHours` is reached. If `true`, users are prompted to reconnect client VPN. If `false`, client VPN attempts to reconnect automatically. The default value is `true`.
        dns-servers: Information about the DNS servers to be used by Client VPN connections. A Client VPN endpoint can have up to two DNS servers.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        security-group-ids: The IDs of one or more security groups to apply to the target network.
        self-service-portal: Specify whether to enable the self-service portal for the Client VPN endpoint.
        server-certificate-arn: The ARN of the server certificate to be used. The server certificate must be provisioned in Certificate Manager (ACM).
        session-timeout-hours: |-
            The maximum VPN session duration time in hours.

            Valid values: `8 | 10 | 12 | 24`

            Default value: `24`
        split-tunnel: |-
            Indicates whether the VPN is split-tunnel.

            For information about split-tunnel VPN endpoints, see [Split-tunnel Client VPN endpoint](https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/split-tunnel-vpn.html) in the *Client VPN Administrator Guide*.
        vpc-id: The ID of the VPC to associate with the Client VPN endpoint.
        vpn-port: |-
            The port number to assign to the Client VPN endpoint for TCP and UDP traffic.

            Valid Values: `443` | `1194`

            Default Value: `443`
