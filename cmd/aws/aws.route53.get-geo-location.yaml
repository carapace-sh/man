name: get-geo-location
description: Gets information about whether a specified geographic location is supported for Amazon Route 53 geolocation resource record sets.
flags:
    --continent-code=: For geolocation resource record sets, a two-letter abbreviation that identifies a continent.
    --country-code=: Amazon Route 53 uses the two-letter country codes that are specified in [ISO standard 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
    --subdivision-code=: The code for the subdivision, such as a particular state within the United States.
documentation:
    command: |-
        Gets information about whether a specified geographic location is supported for Amazon Route 53 geolocation resource record sets.

        Route 53 does not perform authorization for this API because it retrieves information that is already available to the public.

        Use the following syntax to determine whether a continent is supported for geolocation:

        `GET /2013-04-01/geolocation?continentcode=two-letter abbreviation for a continent`

        Use the following syntax to determine whether a country is supported for geolocation:

        `GET /2013-04-01/geolocation?countrycode=two-character country code`

        Use the following syntax to determine whether a subdivision of a country is supported for geolocation:

        `GET /2013-04-01/geolocation?countrycode=two-character country code&subdivisioncode=subdivision code`
    flag:
        continent-code: |-
            For geolocation resource record sets, a two-letter abbreviation that identifies a continent. Amazon Route 53 supports the following continent codes:

            - **AF**: Africa
            - **AN**: Antarctica
            - **AS**: Asia
            - **EU**: Europe
            - **OC**: Oceania
            - **NA**: North America
            - **SA**: South America
        country-code: |-
            Amazon Route 53 uses the two-letter country codes that are specified in [ISO standard 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).

            Route 53 also supports the country code **UA** for Ukraine.
        subdivision-code: 'The code for the subdivision, such as a particular state within the United States. For a list of US state abbreviations, see [Appendix B: Two–Letter State and Possession Abbreviations](https://pe.usps.com/text/pub28/28apb.htm) on the United States Postal Service website. For a list of all supported subdivision codes, use the [ListGeoLocations](https://docs.aws.amazon.com/Route53/latest/APIReference/API_ListGeoLocations.html) API.'
