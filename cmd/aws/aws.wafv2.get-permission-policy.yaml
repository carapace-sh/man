name: get-permission-policy
description: Returns the IAM policy that is attached to the specified rule group.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the rule group for which you want to get the policy.
documentation:
    command: |-
        Returns the IAM policy that is attached to the specified rule group.

        You must be the owner of the rule group to perform this operation.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the rule group for which you want to get the policy.
