name: get-cost-estimate
description: Retrieves information about the cost estimate for a specified resource.
flags:
    --end-time=!: The cost estimate end time.
    --resource-name=!: The resource name.
    --start-time=!: The cost estimate start time.
documentation:
    command: Retrieves information about the cost estimate for a specified resource. A cost estimate will not generate for a resource that has been deleted.
    flag:
        end-time: "The cost estimate end time.\n\nConstraints:\n\n- Specified in Coordinated Universal Time (UTC).\n- Specified in the Unix time format.\n  \n  For example, if you want to use an end time of October 1, 2018, at 9 PM UTC, specify `1538427600` as the end time.\n\nYou can convert a human-friendly time to Unix time format using a converter like [Epoch converter](https://www.epochconverter.com/)."
        resource-name: The resource name.
        start-time: "The cost estimate start time.\n\nConstraints:\n\n- Specified in Coordinated Universal Time (UTC).\n- Specified in the Unix time format.\n  \n  For example, if you want to use a start time of October 1, 2018, at 8 PM UTC, specify `1538424000` as the start time.\n\nYou can convert a human-friendly time to Unix time format using a converter like [Epoch converter](https://www.epochconverter.com/)."
