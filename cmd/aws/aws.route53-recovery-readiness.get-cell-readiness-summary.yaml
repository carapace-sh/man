name: get-cell-readiness-summary
description: Gets readiness for a cell.
flags:
    --cell-name=!: The name of the cell.
    --max-results=: The number of objects that you want to return with this call.
    --next-token=: The token that identifies which batch of results you want to see.
documentation:
    command: Gets readiness for a cell. Aggregates the readiness of all the resources that are associated with the cell into a single value.
    flag:
        cell-name: The name of the cell.
        max-results: The number of objects that you want to return with this call.
        next-token: The token that identifies which batch of results you want to see.
