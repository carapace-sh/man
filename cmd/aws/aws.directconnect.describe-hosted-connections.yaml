name: describe-hosted-connections
description: Lists the hosted connections that have been provisioned on the specified interconnect or link aggregation group (LAG).
flags:
    --connection-id=!: The ID of the interconnect or LAG.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token for the next page of results.
documentation:
    command: |-
        Lists the hosted connections that have been provisioned on the specified interconnect or link aggregation group (LAG).

        Intended for use by Direct Connect Partners only.
    flag:
        connection-id: The ID of the interconnect or LAG.
        max-results: |-
            The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.

            If `MaxResults` is given a value larger than 100, only 100 results are returned.
        next-token: The token for the next page of results.
