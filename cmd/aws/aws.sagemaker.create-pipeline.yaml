name: create-pipeline
description: Creates a pipeline using a JSON pipeline definition.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=!: A unique, case-sensitive identifier that you provide to ensure the idempotency of the operation.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --parallelism-configuration=: This is the configuration that controls the parallelism of the pipeline.
    --pipeline-definition-s3-location=: The location of the pipeline definition stored in Amazon S3.
    --pipeline-definition=: The [JSON pipeline definition](https://aws-sagemaker-mlops.github.io/sagemaker-model-building-pipeline-definition-JSON-schema/) of the pipeline.
    --pipeline-description=: A description of the pipeline.
    --pipeline-display-name=: The display name of the pipeline.
    --pipeline-name=!: The name of the pipeline.
    --role-arn=!: The Amazon Resource Name (ARN) of the role used by the pipeline to access and create resources.
    --tags=:
        description: A list of tags to apply to the created pipeline.
        nargs: -1
documentation:
    command: Creates a pipeline using a JSON pipeline definition.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the operation. An idempotent operation completes no more than one time.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        parallelism-configuration: This is the configuration that controls the parallelism of the pipeline. If specified, it applies to all runs of this pipeline by default.
        pipeline-definition: The [JSON pipeline definition](https://aws-sagemaker-mlops.github.io/sagemaker-model-building-pipeline-definition-JSON-schema/) of the pipeline.
        pipeline-definition-s3-location: The location of the pipeline definition stored in Amazon S3. If specified, SageMaker will retrieve the pipeline definition from this location.
        pipeline-description: A description of the pipeline.
        pipeline-display-name: The display name of the pipeline.
        pipeline-name: The name of the pipeline.
        role-arn: The Amazon Resource Name (ARN) of the role used by the pipeline to access and create resources.
        tags: A list of tags to apply to the created pipeline.
