name: list-findings
description: Lists findings that are generated by the assessment runs that are specified by the ARNs of the assessment runs.
flags:
    --assessment-run-arns=: The ARNs of the assessment runs that generate the findings that you want to list.
    --filter=: You can use this parameter to specify a subset of data to be included in the action's response.
    --max-results=: You can use this parameter to indicate the maximum number of items you want in the response.
    --next-token=: You can use this parameter when paginating results.
documentation:
    command: Lists findings that are generated by the assessment runs that are specified by the ARNs of the assessment runs.
    flag:
        assessment-run-arns: The ARNs of the assessment runs that generate the findings that you want to list.
        filter: |-
            You can use this parameter to specify a subset of data to be included in the action's response.

            For a record to match a filter, all specified filter attributes must match. When multiple values are specified for a filter attribute, any of the values can match.
        max-results: You can use this parameter to indicate the maximum number of items you want in the response. The default value is 10. The maximum value is 500.
        next-token: You can use this parameter when paginating results. Set the value of this parameter to null on your first call to the **ListFindings** action. Subsequent calls to the action fill **nextToken** in the request with the value of **NextToken** from the previous response to continue listing data.
