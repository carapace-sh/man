name: get-insight
description: Retrieves the summary information of an insight.
flags:
    --insight-id=!: The insight's unique identifier.
documentation:
    command: Retrieves the summary information of an insight. This includes impact to clients and root cause services, the top anomalous services, the category, the state of the insight, and the start and end time of the insight.
    flag:
        insight-id: The insight's unique identifier. Use the GetInsightSummaries action to retrieve an InsightId.
