name: delete
description: '*(ALPHA)*  Delete a Dataplex Data Attribute.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --data-taxonomy=: Identifier of the Dataplex DataTaxonomy resource.
    --etag=: etag value for particular Data Attribute resource.
    --location=: Location of the Dataplex resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Delete a Dataplex Data Attribute.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        data-taxonomy: |-
            Identifier of the Dataplex DataTaxonomy resource.
            +

            To set the `data_taxonomy` attribute:
            * provide the argument `data_attribute` on the command line with a fully specified name;
            * provide the argument `--data_taxonomy` on the command line.
        etag: etag value for particular Data Attribute resource.
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `data_attribute` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
