name: authorize
description: '*(ALPHA)*  Authorize a service agent to manage resources.'
flags:
    --bigquery-dataset-resource=!: The identifier of the BigQuery dataset that the service agent will manage.
    --project-resource=: The identifier of the project whose resources the service agent will manage.
    --secondary-project=!: The identifier of the project where the BigQuery dataset is located.
    --storage-bucket-resource=: The identifier of the Cloud Storage bucket that the service agent will manage.
documentation:
    command: |-
        *(ALPHA)*  The service agent for the primary project will be granted an IAM role on a
        secondary project, a Cloud Storage bucket, or a BigQuery dataset.
    flag:
        bigquery-dataset-resource: The identifier of the BigQuery dataset that the service agent will manage.
        project-resource: The identifier of the project whose resources the service agent will manage.
        secondary-project: The identifier of the project where the BigQuery dataset is located.
        storage-bucket-resource: The identifier of the Cloud Storage bucket that the service agent will manage.
