name: create-traffic-mirror-filter-rule
description: Creates a Traffic Mirror filter rule.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=: The description of the Traffic Mirror rule.
    --destination-cidr-block=!: The destination CIDR block to assign to the Traffic Mirror rule.
    --destination-port-range=: The destination port range.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --protocol=: The protocol, for example UDP, to assign to the Traffic Mirror rule.
    --rule-action=!: The action to take on the filtered traffic.
    --rule-number=!: The number of the Traffic Mirror rule.
    --source-cidr-block=!: The source CIDR block to assign to the Traffic Mirror rule.
    --source-port-range=: The source port range.
    --tag-specifications=:
        description: Traffic Mirroring tags specifications.
        nargs: -1
    --traffic-direction=!: The type of traffic.
    --traffic-mirror-filter-id=!: The ID of the filter that this rule is associated with.
completion:
    flag:
        rule-action:
            - accept
            - reject
        traffic-direction:
            - ingress
            - egress
documentation:
    command: |-
        Creates a Traffic Mirror filter rule.

        A Traffic Mirror rule defines the Traffic Mirror source traffic to mirror.

        You need the Traffic Mirror filter ID when you create the rule.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [How to ensure idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        description: The description of the Traffic Mirror rule.
        destination-cidr-block: The destination CIDR block to assign to the Traffic Mirror rule.
        destination-port-range: The destination port range.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        protocol: |-
            The protocol, for example UDP, to assign to the Traffic Mirror rule.

            For information about the protocol value, see [Protocol Numbers](https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml) on the Internet Assigned Numbers Authority (IANA) website.
        rule-action: The action to take on the filtered traffic.
        rule-number: The number of the Traffic Mirror rule. This number must be unique for each Traffic Mirror rule in a given direction. The rules are processed in ascending order by rule number.
        source-cidr-block: The source CIDR block to assign to the Traffic Mirror rule.
        source-port-range: The source port range.
        tag-specifications: Traffic Mirroring tags specifications.
        traffic-direction: The type of traffic.
        traffic-mirror-filter-id: The ID of the filter that this rule is associated with.
