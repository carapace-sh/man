name: update-api
description: Updates an Api resource.
flags:
    --api-id=!: The API identifier.
    --api-key-selection-expression=: An API key selection expression.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cors-configuration=: A CORS configuration.
    --credentials-arn=: This property is part of quick create.
    --description=: The description of the API.
    --disable-execute-api-endpoint: Specifies whether clients can invoke your API by using the default execute-api endpoint.
    --disable-schema-validation: Avoid validating models when creating a deployment.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip-address-type=: The IP address types that can invoke your API or domain name.
    --name=: The name of the API.
    --no-disable-execute-api-endpoint: Specifies whether clients can invoke your API by using the default execute-api endpoint.
    --no-disable-schema-validation: Avoid validating models when creating a deployment.
    --route-key=: This property is part of quick create.
    --route-selection-expression=: The route selection expression for the API.
    --target=: This property is part of quick create.
    --version=: A version identifier for the API.
completion:
    flag:
        ip-address-type:
            - ipv4
            - dualstack
documentation:
    command: Updates an Api resource.
    flag:
        api-id: The API identifier.
        api-key-selection-expression: An API key selection expression. Supported only for WebSocket APIs. See [API Key Selection Expressions](https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-websocket-api-selection-expressions.html#apigateway-websocket-api-apikey-selection-expressions).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cors-configuration: A CORS configuration. Supported only for HTTP APIs.
        credentials-arn: This property is part of quick create. It specifies the credentials required for the integration, if any. For a Lambda integration, three options are available. To specify an IAM Role for API Gateway to assume, use the role's Amazon Resource Name (ARN). To require that the caller's identity be passed through from the request, specify arn:aws:iam::\*:user/\*. To use resource-based permissions on supported AWS services, don't specify this parameter. Currently, this property is not used for HTTP integrations. If provided, this value replaces the credentials associated with the quick create integration. Supported only for HTTP APIs.
        description: The description of the API.
        disable-execute-api-endpoint: Specifies whether clients can invoke your API by using the default execute-api endpoint. By default, clients can invoke your API with the default https://{api\_id}.execute-api.{region}.amazonaws.com endpoint. To require that clients use a custom domain name to invoke your API, disable the default endpoint.
        disable-schema-validation: Avoid validating models when creating a deployment. Supported only for WebSocket APIs.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip-address-type: The IP address types that can invoke your API or domain name.
        name: The name of the API.
        route-key: This property is part of quick create. If not specified, the route created using quick create is kept. Otherwise, this value replaces the route key of the quick create route. Additional routes may still be added after the API is updated. Supported only for HTTP APIs.
        route-selection-expression: The route selection expression for the API. For HTTP APIs, the routeSelectionExpression must be ${request.method} ${request.path}. If not provided, this will be the default for HTTP APIs. This property is required for WebSocket APIs.
        target: This property is part of quick create. For HTTP integrations, specify a fully qualified URL. For Lambda integrations, specify a function ARN. The type of the integration will be HTTP\_PROXY or AWS\_PROXY, respectively. The value provided updates the integration URI and integration type. You can update a quick-created target, but you can't remove it from an API. Supported only for HTTP APIs.
        version: A version identifier for the API.
