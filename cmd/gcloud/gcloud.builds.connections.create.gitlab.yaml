name: gitlab
description: Create a Cloud Build Connection for gitlab.com or GitLab Enterprise.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --authorizer-token-secret-version=!: Secret containing the api personal access token.
    --host-uri=: URI of the GitLab instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --read-authorizer-token-secret-version=!: Secret containing the read_api personal access token.
    --region=: The Google Cloud region.
    --service-directory-service=!: Service Directory service resource to use for accessing the gitlab.com or GitLab Enterprise Server.
    --ssl-ca-file=: File containing the SSL_CA to be used.
    --webhook-secret-secret-version=!: Secret containing the webhook secret string for validating webhook events sent by
documentation:
    command: |
        Create a Cloud Build Connection for gitlab.com or GitLab Enterprise.

        A gitlab.com or GitLab Enterprise Connection can be created by using a personal access token with `api`
        scope permission. A `read_repository` scoped personal access token will also be required on gitlab.com or if
        the self-hosted GitLab server doesn't support project access token (GitLab Enterprise server version <
        13.10).

        If the GitLab Enterprise server can only be accessed within a VPC, a Service Directory
        service resource can be provided for connecting to it.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        authorizer-token-secret-version: Secret containing the api personal access token.
        host-uri: URI of the GitLab instance.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        read-authorizer-token-secret-version: Secret containing the read_api personal access token.
        region: |-
            The Google Cloud region.
            +
            To set the `region` attribute:
            * provide the argument `connection` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `builds/region`.
        service-directory-service: Service Directory service resource to use for accessing the gitlab.com or GitLab Enterprise Server. Necessary only if the server has no public access from the internet.
        ssl-ca-file: File containing the SSL_CA to be used.
        webhook-secret-secret-version: |-
            Secret containing the webhook secret string for validating webhook events sent by
            GitLab.
