name: create
description: Create a Dataplex Environment.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --compute-disk-size-gb=: Size in GB of the disk.
    --compute-max-node-count=: Maximum number of configurable nodes.
    --compute-node-count=: Total number of worker nodes in the cluster.
    --description=: Description of the Environment
    --display-name=: Display Name of the Environment
    --labels=: List of label KEY=VALUE pairs to add.
    --lake=: The identifier of the Dataplex lake resource.
    --location=: The location of the Dataplex resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-session-enable-fast-startup&: Enables fast startup.
    --no-validate-only&: Validate the create action, but don't actually perform it.
    --os-image-java-libraries=: List of Java jars to be included in the runtime environment.
    --os-image-properties=: Override to common configuration of open source components installed on the Dataproc cluster.
    --os-image-python-packages=: A list of python packages to be installed.
    --os-image-version=!: Dataplex Image version.
    --session-enable-fast-startup: Enables fast startup.
    --session-max-idle-duration=: The idle time configuration of the session.
    --validate-only: Validate the create action, but don't actually perform it.
documentation:
    command: Create a Dataplex Environment.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        compute-disk-size-gb: Size in GB of the disk. Default is 100 GB.
        compute-max-node-count: Maximum number of configurable nodes.
        compute-node-count: Total number of worker nodes in the cluster.
        description: Description of the Environment
        display-name: Display Name of the Environment
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        lake: |-
            The identifier of the Dataplex lake resource.
            +
            To set the `lake` attribute:
            * provide the argument `environment` on the command line with a fully specified name;
            * provide the argument `--lake` on the command line.
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `environment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-session-enable-fast-startup: Enables fast startup. This causes sessions to be pre-created and available for faster startup to enable interactive exploration use-cases.
        no-validate-only: Validate the create action, but don't actually perform it.
        os-image-java-libraries: List of Java jars to be included in the runtime environment. Valid input includes Cloud Storage URIs to Jar binaries. For example, gs://bucket-name/my/path/to/file.jar
        os-image-properties: Override to common configuration of open source components installed on the Dataproc cluster. The properties to set on daemon config files. Property keys are specified in `prefix:property` format.
        os-image-python-packages: A list of python packages to be installed. Valid formats include Cloud Storage URI to a PIP installable library. For example, gs://bucket-name/my/path/to/lib.tar.gz
        os-image-version: Dataplex Image version.
        session-enable-fast-startup: Enables fast startup. This causes sessions to be pre-created and available for faster startup to enable interactive exploration use-cases.
        session-max-idle-duration: The idle time configuration of the session. The session will be auto-terminated at the end of this period.
        validate-only: Validate the create action, but don't actually perform it.
