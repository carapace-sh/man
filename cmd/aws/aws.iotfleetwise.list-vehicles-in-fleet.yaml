name: list-vehicles-in-fleet
description: Retrieves a list of summaries of all vehicles associated with a fleet.
flags:
    --fleet-id=!: The ID of a fleet.
    --max-results=: The maximum number of items to return, between 1 and 100, inclusive.
    --next-token=: A pagination token for the next set of results.
documentation:
    command: |-
        Retrieves a list of summaries of all vehicles associated with a fleet.

        This API operation uses pagination. Specify the `nextToken` parameter in the request to return more results.
    flag:
        fleet-id: The ID of a fleet.
        max-results: The maximum number of items to return, between 1 and 100, inclusive.
        next-token: |-
            A pagination token for the next set of results.

            If the results of a search are large, only a portion of the results are returned, and a `nextToken` pagination token is returned in the response. To retrieve the next set of results, reissue the search request and include the returned token. When all results have been returned, the response does not contain a pagination token value.
