name: get-configured-table-association
description: Retrieves a configured table association.
flags:
    --configured-table-association-identifier=!: The unique ID for the configured table association to retrieve.
    --membership-identifier=!: A unique identifier for the membership that the configured table association belongs to.
documentation:
    command: Retrieves a configured table association.
    flag:
        configured-table-association-identifier: The unique ID for the configured table association to retrieve. Currently accepts the configured table ID.
        membership-identifier: A unique identifier for the membership that the configured table association belongs to. Currently accepts the membership ID.
