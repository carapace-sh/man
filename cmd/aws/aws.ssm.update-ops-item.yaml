name: update-ops-item
description: Edit or change an OpsItem.
flags:
    --actual-end-time=: The time a runbook workflow ended.
    --actual-start-time=: The time a runbook workflow started.
    --category=: Specify a new category for an OpsItem.
    --description=: User-defined text that contains information about the OpsItem, in Markdown format.
    --notifications=: The Amazon Resource Name (ARN) of an SNS topic where notifications are sent when this OpsItem is edited or changed.
    --operational-data-to-delete=: Keys that you want to remove from the OperationalData map.
    --operational-data=: Add new keys or edit existing key-value pairs of the OperationalData map in the OpsItem object.
    --ops-item-arn=: The OpsItem Amazon Resource Name (ARN).
    --ops-item-id=!: The ID of the OpsItem.
    --planned-end-time=: The time specified in a change request for a runbook workflow to end.
    --planned-start-time=: The time specified in a change request for a runbook workflow to start.
    --priority=: The importance of this OpsItem in relation to other OpsItems in the system.
    --related-ops-items=: One or more OpsItems that share something in common with the current OpsItems.
    --severity=: Specify a new severity for an OpsItem.
    --status=: The OpsItem status.
    --title=: A short heading that describes the nature of the OpsItem and the impacted resource.
completion:
    flag:
        status:
            - Open
            - InProgress
            - Resolved
            - Pending
            - TimedOut
            - Cancelling
            - Cancelled
            - Failed
            - CompletedWithSuccess
            - CompletedWithFailure
            - Scheduled
            - RunbookInProgress
            - PendingChangeCalendarOverride
            - ChangeCalendarOverrideApproved
            - ChangeCalendarOverrideRejected
            - PendingApproval
            - Approved
            - Revoked
            - Rejected
            - Closed
documentation:
    command: |-
        Edit or change an OpsItem. You must have permission in Identity and Access Management (IAM) to update an OpsItem. For more information, see [Set up OpsCenter](https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-setup.html) in the *Amazon Web Services Systems Manager User Guide*.

        Operations engineers and IT professionals use Amazon Web Services Systems Manager OpsCenter to view, investigate, and remediate operational issues impacting the performance and health of their Amazon Web Services resources. For more information, see [Amazon Web Services Systems Manager OpsCenter](https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter.html) in the *Amazon Web Services Systems Manager User Guide*.
    flag:
        actual-end-time: The time a runbook workflow ended. Currently reported only for the OpsItem type `/aws/changerequest`.
        actual-start-time: The time a runbook workflow started. Currently reported only for the OpsItem type `/aws/changerequest`.
        category: Specify a new category for an OpsItem.
        description: User-defined text that contains information about the OpsItem, in Markdown format.
        notifications: The Amazon Resource Name (ARN) of an SNS topic where notifications are sent when this OpsItem is edited or changed.
        operational-data: |-
            Add new keys or edit existing key-value pairs of the OperationalData map in the OpsItem object.

            Operational data is custom data that provides useful reference details about the OpsItem. For example, you can specify log files, error strings, license keys, troubleshooting tips, or other relevant data. You enter operational data as key-value pairs. The key has a maximum length of 128 characters. The value has a maximum size of 20 KB.

            Operational data keys *can't* begin with the following: `amazon`, `aws`, `amzn`, `ssm`, `/amazon`, `/aws`, `/amzn`, `/ssm`.

            You can choose to make the data searchable by other users in the account or you can restrict search access. Searchable data means that all users with access to the OpsItem Overview page (as provided by the [DescribeOpsItems]() API operation) can view and search on the specified data. Operational data that isn't searchable is only viewable by users who have access to the OpsItem (as provided by the [GetOpsItem]() API operation).

            Use the `/aws/resources` key in OperationalData to specify a related resource in the request. Use the `/aws/automations` key in OperationalData to associate an Automation runbook with the OpsItem. To view Amazon Web Services CLI example commands that use these keys, see [Creating OpsItems manually](https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-manually-create-OpsItems.html) in the *Amazon Web Services Systems Manager User Guide*.
        operational-data-to-delete: Keys that you want to remove from the OperationalData map.
        ops-item-arn: The OpsItem Amazon Resource Name (ARN).
        ops-item-id: The ID of the OpsItem.
        planned-end-time: The time specified in a change request for a runbook workflow to end. Currently supported only for the OpsItem type `/aws/changerequest`.
        planned-start-time: The time specified in a change request for a runbook workflow to start. Currently supported only for the OpsItem type `/aws/changerequest`.
        priority: The importance of this OpsItem in relation to other OpsItems in the system.
        related-ops-items: One or more OpsItems that share something in common with the current OpsItems. For example, related OpsItems can include OpsItems with similar error messages, impacted resources, or statuses for the impacted resource.
        severity: Specify a new severity for an OpsItem.
        status: The OpsItem status. For more information, see [Editing OpsItem details](https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-working-with-OpsItems-editing-details.html) in the *Amazon Web Services Systems Manager User Guide*.
        title: A short heading that describes the nature of the OpsItem and the impacted resource.
