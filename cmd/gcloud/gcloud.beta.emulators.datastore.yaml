name: datastore
description: '*(BETA)*  Manage your local datastore emulator.'
flags:
    --data-dir=: The directory to be used to store/retrieve data/config for an emulator run.
documentation:
    command: '*(BETA)*  This set of commands allows you to start and use a local datastore emulator.'
    flag:
        data-dir: |-
            The directory to be used to store/retrieve data/config for an emulator run. The default value is `<USER_CONFIG_DIR>/emulators/datastore`. The value of USER_CONFIG_DIR can be found by running:
            +
              $ gcloud info --format='get(config.paths.global_config_dir)'
