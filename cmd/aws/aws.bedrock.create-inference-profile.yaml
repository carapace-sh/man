name: create-inference-profile
description: Creates an application inference profile to track metrics and costs when invoking a model.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --description=: A description for the inference profile.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inference-profile-name=!: A name for the inference profile.
    --model-source=!: The foundation model or system-defined inference profile that the inference profile will track metrics and costs for.
    --tags=: An array of objects, each of which contains a tag and its value.
documentation:
    command: Creates an application inference profile to track metrics and costs when invoking a model. To create an application inference profile for a foundation model in one region, specify the ARN of the model in that region. To create an application inference profile for a foundation model across multiple regions, specify the ARN of the system-defined inference profile that contains the regions that you want to route requests to. For more information, see [Increase throughput and resilience with cross-region inference in Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html). in the Amazon Bedrock User Guide.
