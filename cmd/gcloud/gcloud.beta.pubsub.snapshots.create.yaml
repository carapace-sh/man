name: create
description: '*(BETA)*  Creates one or more Cloud Pub/Sub snapshots.'
flags:
    --labels=: List of label KEY=VALUE pairs to add.
    --subscription-project=: The name of the project the provided subscription belongs to.
    --subscription=!: The subscription whose backlog the snapshot retains.
    --tags=: List of tags KEY=VALUE pairs to bind.
documentation:
    command: '*(BETA)*  Creates one or more Cloud Pub/Sub snapshots.'
    flag:
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        subscription: The subscription whose backlog the snapshot retains.  Specifically, the created snapshot is guaranteed to retain a) The existing backlog on the subscription, i.e., the set of messages in the subscription that are unacknowledged upon the successful completion of the create snapshot request, b) Any messages published to the subscription's topic following the successful creation of the snapshot.
        subscription-project: The name of the project the provided subscription belongs to. If not set, it defaults to the currently selected cloud project.
        tags: |-
            List of tags KEY=VALUE pairs to bind. Each item must be expressed as `<tag-key-namespaced-name>=<tag-value-short-name>`.
            Example: `123/environment=production,123/costCenter=marketing`
