    flag:
        annotations: |-
            The annotations to associate with this application environment. Annotations
            may be used to store client information, but are not used by the server.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --annotations=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --annotations='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --annotations=path_to_file.(yaml|json)
            +
            ```
        display-name: User-provided human-readable name to be used in user interfaces.
        labels: |-
            The labels to associate with this application environment. Labels may be
            used for filtering and billing tracking.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            locations TBD
            +
            To set the `location` attribute:
            * provide the argument `application_environment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        namespace: |-
            The name of the namespace in which to create this ApplicationEnvironment.
            This namespace must already exist in the cluster
        service-instance: |-
            serviceInstances TBD
