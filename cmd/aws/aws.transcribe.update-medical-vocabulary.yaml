documentation:
    command: Updates an existing custom medical vocabulary with new values. This operation overwrites all existing information with your new values; you cannot append new terms onto an existing custom vocabulary.
    flag:
        language-code: The language code that represents the language of the entries in the custom vocabulary you want to update. US English (`en-US`) is the only language supported with Amazon Transcribe Medical.
        vocabulary-file-uri: |-
            The Amazon S3 location of the text file that contains your custom medical vocabulary. The URI must be located in the same Amazon Web Services Region as the resource you're calling.

            Here's an example URI path: `s3://DOC-EXAMPLE-BUCKET/my-vocab-file.txt`
        vocabulary-name: The name of the custom medical vocabulary you want to update. Custom medical vocabulary names are case sensitive.
