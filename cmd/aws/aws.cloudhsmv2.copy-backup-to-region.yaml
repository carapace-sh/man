name: copy-backup-to-region
description: Copy an CloudHSM cluster backup to a different region.
flags:
    --backup-id=!: The ID of the backup that will be copied to the destination region.
    --destination-region=!: The AWS region that will contain your copied CloudHSM cluster backup.
    --tag-list=: Tags to apply to the destination backup during creation.
documentation:
    command: |-
        Copy an CloudHSM cluster backup to a different region.

        **Cross-account use:** No. You cannot perform this operation on an CloudHSM backup in a different Amazon Web Services account.
    flag:
        backup-id: The ID of the backup that will be copied to the destination region.
        destination-region: The AWS region that will contain your copied CloudHSM cluster backup.
        tag-list: Tags to apply to the destination backup during creation. If you specify tags, only these tags will be applied to the destination backup. If you do not specify tags, the service copies tags from the source backup to the destination backup.
