name: checkout-borrow-license
description: Checks out the specified license for offline use.
flags:
    --checkout-metadata=: Information about constraints.
    --client-token=!: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --digital-signature-method=!: Digital signature method.
    --entitlements=!: License entitlements.
    --license-arn=!: Amazon Resource Name (ARN) of the license.
    --node-id=: Node ID.
completion:
    flag:
        digital-signature-method:
            - JWT_PS384
documentation:
    command: Checks out the specified license for offline use.
    flag:
        checkout-metadata: Information about constraints.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        digital-signature-method: Digital signature method. The possible value is JSON Web Signature (JWS) algorithm PS384. For more information, see [RFC 7518 Digital Signature with RSASSA-PSS](https://tools.ietf.org/html/rfc7518#section-3.5).
        entitlements: License entitlements. Partial checkouts are not supported.
        license-arn: Amazon Resource Name (ARN) of the license. The license must use the borrow consumption configuration.
        node-id: Node ID.
