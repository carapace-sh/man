name: update-service-primary-task-set
description: Modifies which task set in a service is the primary task set.
flags:
    --cluster=!: The short name or full Amazon Resource Name (ARN) of the cluster that hosts the service that the task set exists in.
    --primary-task-set=!: The short name or full Amazon Resource Name (ARN) of the task set to set as the primary task set in the deployment.
    --service=!: The short name or full Amazon Resource Name (ARN) of the service that the task set exists in.
documentation:
    command: Modifies which task set in a service is the primary task set. Any parameters that are updated on the primary task set in a service will transition to the service. This is used when a service uses the `EXTERNAL` deployment controller type. For more information, see [Amazon ECS Deployment Types](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-types.html) in the *Amazon Elastic Container Service Developer Guide*.
    flag:
        cluster: The short name or full Amazon Resource Name (ARN) of the cluster that hosts the service that the task set exists in.
        primary-task-set: The short name or full Amazon Resource Name (ARN) of the task set to set as the primary task set in the deployment.
        service: The short name or full Amazon Resource Name (ARN) of the service that the task set exists in.
