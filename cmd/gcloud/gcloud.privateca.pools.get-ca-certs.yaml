name: get-ca-certs
description: Get the root CA certs for all active CAs in the CA pool.
flags:
    --location=: The location of the CA_POOL.
    --output-file=!: The path where the concatenated PEM certificates will be written.
documentation:
    command: |-
        ## EXAMPLES

          To get the root CA certs for all active CAs in the CA pool:

            $ gcloud privateca pools get-ca-certs my-pool --output-file=ca-certificates.pem \
                --location=us-west1
    flag:
        location: |-
            The location of the CA_POOL.
            +
            To set the `location` attribute:
            * provide the argument `CA_POOL` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `privateca/location`.
        output-file: The path where the concatenated PEM certificates will be written. This will include the root CA certificate for each active CA in the CA pool.
