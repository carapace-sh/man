name: untag-resource
description: Detaches a key-value pair from the specified resource, as identified by its Amazon Resource Name (ARN).
flags:
    --resource-arn=!: Specifies an Amazon Resource Name (ARN) for a specific Amazon Web Services resource, such as a capability, partnership, profile, or transformer.
    --tag-keys=!: Specifies the key-value pairs assigned to ARNs that you can use to group and search for resources by type.
documentation:
    command: Detaches a key-value pair from the specified resource, as identified by its Amazon Resource Name (ARN). Resources are capability, partnership, profile, transformers and other entities.
    flag:
        resource-arn: Specifies an Amazon Resource Name (ARN) for a specific Amazon Web Services resource, such as a capability, partnership, profile, or transformer.
        tag-keys: Specifies the key-value pairs assigned to ARNs that you can use to group and search for resources by type. You can attach this metadata to resources (capabilities, partnerships, and so on) for any purpose.
