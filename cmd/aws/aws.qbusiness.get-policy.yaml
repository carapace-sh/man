name: get-policy
description: Retrieves the current permission policy for a Amazon Q Business application.
flags:
    --application-id=!: The unique identifier of the Amazon Q Business application.
documentation:
    command: Retrieves the current permission policy for a Amazon Q Business application. The policy is returned as a JSON-formatted string and defines the IAM actions that are allowed or denied for the application's resources.
    flag:
        application-id: The unique identifier of the Amazon Q Business application.
