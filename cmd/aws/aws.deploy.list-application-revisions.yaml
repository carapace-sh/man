name: list-application-revisions
description: Lists information about revisions for an application.
flags:
    --application-name=!: The name of an CodeDeploy application associated with the user or Amazon Web Services account.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deployed=: 'Whether to list revisions based on whether the revision is the target revision of a deployment group:'
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --next-token=: An identifier returned from the previous `ListApplicationRevisions` call.
    --s3-bucket=: An Amazon S3 bucket name to limit the search for revisions.
    --s3-key-prefix=: A key prefix for the set of Amazon S3 objects to limit the search for revisions.
    --sort-by=: 'The column name to use to sort the list results:'
    --sort-order=: 'The order in which to sort the list results:'
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        deployed:
            - include
            - exclude
            - ignore
        sort-by:
            - registerTime
            - firstUsedTime
            - lastUsedTime
        sort-order:
            - ascending
            - descending
documentation:
    command: Lists information about revisions for an application.
    flag:
        application-name: The name of an CodeDeploy application associated with the user or Amazon Web Services account.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deployed: |-
            Whether to list revisions based on whether the revision is the target revision of a deployment group:

            - `include`: List revisions that are target revisions of a deployment group.
            - `exclude`: Do not list revisions that are target revisions of a deployment group.
            - `ignore`: List all revisions.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        next-token: An identifier returned from the previous `ListApplicationRevisions` call. It can be used to return the next set of applications in the list.
        s3-bucket: |-
            An Amazon S3 bucket name to limit the search for revisions.

            If set to null, all of the user's buckets are searched.
        s3-key-prefix: A key prefix for the set of Amazon S3 objects to limit the search for revisions.
        sort-by: |-
            The column name to use to sort the list results:

            - `registerTime`: Sort by the time the revisions were registered with CodeDeploy.
            - `firstUsedTime`: Sort by the time the revisions were first used in a deployment.
            - `lastUsedTime`: Sort by the time the revisions were last used in a deployment.

            If not specified or set to null, the results are returned in an arbitrary order.
        sort-order: |-
            The order in which to sort the list results:

            - `ascending`: ascending order.
            - `descending`: descending order.

            If not specified, the results are sorted in ascending order.

            If set to null, the results are sorted in an arbitrary order.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
