name: reschedule-maintenance
description: '*(ALPHA)*  Reschedule maintenance window for an instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location id of the instance resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --reschedule-type=!: If reschedule type is SPECIFIC_TIME, schedule_time must be set.
    --schedule-time=: Timestamp when the maintenance shall be rescheduled to if
completion:
    flag:
        reschedule-type:
            - immediate
            - specific-time
documentation:
    command: '*(ALPHA)*  Reschedule maintenance window for an instance.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location id of the instance resource.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        reschedule-type: |-
            If reschedule type is SPECIFIC_TIME, schedule_time must be set. _RESCHEDULE_TYPE_ must be one of:
            +
            *immediate*::: If the user wants to schedule the maintenance to happen now.
            *specific-time*::: If the user wants to reschedule the maintenance to a specific time.
            :::
            +
        schedule-time: |-
            Timestamp when the maintenance shall be rescheduled to if
            reschedule_type=SPECIFIC_TIME, in RFC 3339 format.
            Example: `2012-11-15T16:19:00.094Z`.
