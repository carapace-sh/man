name: create-cluster
description: Creates a cluster in your account.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --cluster-name=!: A name to identify the cluster.
    --networking=!: The networking configuration used to set up the cluster's control plane.
    --scheduler=!: The cluster management and job scheduling software associated with the cluster.
    --size=!: A value that determines the maximum number of compute nodes in the cluster and the maximum number of jobs (active and queued).
    --slurm-configuration=: Additional options related to the Slurm scheduler.
    --tags=: 1 or more tags added to the resource.
completion:
    flag:
        size:
            - SMALL
            - MEDIUM
            - LARGE
documentation:
    command: |-
        Creates a cluster in your account. PCS creates the cluster controller in a service-owned account. The cluster controller communicates with the cluster resources in your account. The subnets and security groups for the cluster must already exist before you use this API action.

        It takes time for PCS to create the cluster. The cluster is in a `Creating` state until it is ready to use. There can only be 1 cluster in a `Creating` state per Amazon Web Services Region per Amazon Web Services account. `CreateCluster` fails with a `ServiceQuotaExceededException` if there is already a cluster in a `Creating` state.
    flag:
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, the subsequent retries with the same client token return the result from the original successful request and they have no additional effect. If you don't specify a client token, the CLI and SDK automatically generate 1 for you.
        cluster-name: 'A name to identify the cluster. Example: `MyCluster`'
        networking: The networking configuration used to set up the cluster's control plane.
        scheduler: The cluster management and job scheduling software associated with the cluster.
        size: |-
            A value that determines the maximum number of compute nodes in the cluster and the maximum number of jobs (active and queued).

            - `SMALL`: 32 compute nodes and 256 jobs
            - `MEDIUM`: 512 compute nodes and 8192 jobs
            - `LARGE`: 2048 compute nodes and 16,384 jobs
        slurm-configuration: Additional options related to the Slurm scheduler.
        tags: 1 or more tags added to the resource. Each tag consists of a tag key and tag value. The tag value is optional and can be an empty string.
