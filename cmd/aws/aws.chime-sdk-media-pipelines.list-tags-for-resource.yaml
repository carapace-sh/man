name: list-tags-for-resource
description: Lists the tags available for a media pipeline.
flags:
    --resource-arn=!: The ARN of the media pipeline associated with any tags.
documentation:
    command: Lists the tags available for a media pipeline.
    flag:
        resource-arn: The ARN of the media pipeline associated with any tags. The ARN consists of the pipeline's region, resource ID, and pipeline ID.
