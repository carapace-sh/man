name: get-identity-resolution-job
description: Returns information about an Identity Resolution Job in a specific domain.
flags:
    --domain-name=!: The unique name of the domain.
    --job-id=!: The unique identifier of the Identity Resolution Job.
documentation:
    command: |-
        Returns information about an Identity Resolution Job in a specific domain.

        Identity Resolution Jobs are set up using the Amazon Connect admin console. For more information, see [Use Identity Resolution to consolidate similar profiles](https://docs.aws.amazon.com/connect/latest/adminguide/use-identity-resolution.html).
    flag:
        domain-name: The unique name of the domain.
        job-id: The unique identifier of the Identity Resolution Job.
