name: set-iam-policy
description: Set the IAM policy for a bucket.
flags:
    --continue-on-error: If any operations are unsuccessful, the command will exit with a non-zero exit status after completing the remaining operations.
    --etag=: Custom etag to set on IAM policy.
documentation:
    command: |
        Set the IAM policy for a bucket. For more information, see [Cloud
        Identity and Access
        Management](https://cloud.google.com/storage/docs/access-control/iam).
    flag:
        continue-on-error: If any operations are unsuccessful, the command will exit with a non-zero exit status after completing the remaining operations. This flag takes effect only in sequential execution mode (i.e. processor and thread count are set to 1). Parallelism is default.
        etag: Custom etag to set on IAM policy. API will reject etags that do not match this value, making it useful as a precondition during concurrent operations.
