name: update
description: '*(ALPHA)*  Update a Cloud Monitoring dashboard.'
flags:
    --config-from-file=: Path to a JSON or YAML file containing the dashboard configuration.
    --config=: Dashboard configuration, in either JSON or YAML format, as a string.
documentation:
    command: |
        *(ALPHA)*  Update a Monitoring dashboard. The updated dashboard can be specified as a
        JSON/YAML value passed in as a string through the `--config` flag or
        as a file through the `--config-from-file` flag.

        Note: Etags are used to prevent concurrent updates to the same dashboard. The latest etag can
        be found in a `describe` or `list` response.

        For information about the format of a dashboard:
        https://cloud.google.com/monitoring/api/ref_v3/rest/v1/projects.dashboards
    flag:
        config: Dashboard configuration, in either JSON or YAML format, as a string.
        config-from-file: Path to a JSON or YAML file containing the dashboard configuration. Use a full or relative path to a local file containing the value of config.
