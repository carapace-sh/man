name: update
description: '*(ALPHA)*  Updates a glossary category.'
flags:
    --description=: Description of the glossary category.
    --display-name=: Display Name of the glossary category.
    --glossary=: The name of glossary category to use.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the Dataplex resource.
    --parent=: Immediate parent of the created glossary category.
documentation:
    command: '*(ALPHA)*  Updates a glossary category.'
    flag:
        description: Description of the glossary category.
        display-name: Display Name of the glossary category.
        glossary: |-
            The name of glossary category to use.
            +
            To set the `glossary` attribute:
            * provide the argument `glossary_category` on the command line with a fully specified name;
            * provide the argument `--glossary` on the command line.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `glossary_category` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        parent: Immediate parent of the created glossary category.
