name: test-invoke-authorizer
description: Tests a custom authorization behavior by invoking a specified custom authorizer.
flags:
    --authorizer-name=!: The custom authorizer name.
    --http-context=: Specifies a test HTTP authorization request.
    --mqtt-context=: Specifies a test MQTT authorization request.
    --tls-context=: Specifies a test TLS authorization request.
    --token-signature=: The signature made with the token and your custom authentication service's private key.
    --token=: The token returned by your custom authentication service.
documentation:
    command: |-
        Tests a custom authorization behavior by invoking a specified custom authorizer. Use this to test and debug the custom authorization behavior of devices that connect to the IoT device gateway.

        Requires permission to access the [TestInvokeAuthorizer](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        authorizer-name: The custom authorizer name.
        http-context: Specifies a test HTTP authorization request.
        mqtt-context: Specifies a test MQTT authorization request.
        tls-context: Specifies a test TLS authorization request.
        token: The token returned by your custom authentication service.
        token-signature: The signature made with the token and your custom authentication service's private key. This value must be Base-64-encoded.
