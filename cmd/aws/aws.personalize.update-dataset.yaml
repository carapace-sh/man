name: update-dataset
description: Update a dataset to replace its schema with a new or existing one.
flags:
    --dataset-arn=!: The Amazon Resource Name (ARN) of the dataset that you want to update.
    --schema-arn=!: The Amazon Resource Name (ARN) of the new schema you want use.
documentation:
    command: Update a dataset to replace its schema with a new or existing one. For more information, see [Replacing a dataset's schema](https://docs.aws.amazon.com/personalize/latest/dg/updating-dataset-schema.html).
    flag:
        dataset-arn: The Amazon Resource Name (ARN) of the dataset that you want to update.
        schema-arn: The Amazon Resource Name (ARN) of the new schema you want use.
