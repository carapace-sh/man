name: set-account-default-protect-configuration
description: Set a protect configuration as your account default.
flags:
    --protect-configuration-id=!: The unique identifier for the protect configuration.
documentation:
    command: Set a protect configuration as your account default. You can only have one account default protect configuration at a time. The current account default protect configuration is replaced with the provided protect configuration.
    flag:
        protect-configuration-id: The unique identifier for the protect configuration.
