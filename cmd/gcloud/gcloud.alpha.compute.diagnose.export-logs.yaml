name: export-logs
description: '*(ALPHA)*  Triggers instance to gather logs and upload them to a Cloud Storage Bucket.'
flags:
    --collect-process-traces: Collect a 10 minute trace of the running system.
    --no-collect-process-traces&: Collect a 10 minute trace of the running system.
    --zone=: Zone of the instance to operate on.
documentation:
    command: |-
        *(ALPHA)*  Gathers logs from a running Compute Engine VM and exports them to a Google
        Cloud Storage Bucket. Outputs a path to the logs within the Bucket.
    flag:
        collect-process-traces: Collect a 10 minute trace of the running system. On Windows, this utilizes Windows Performance Recorder. It records CPU, disk, file, and network activity during that time.
        no-collect-process-traces: Collect a 10 minute trace of the running system. On Windows, this utilizes Windows Performance Recorder. It records CPU, disk, file, and network activity during that time.
        zone: |-
            Zone of the instance to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
