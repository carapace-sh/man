name: get-attribute-values
description: Returns a list of attribute values.
flags:
    --attribute-name=!: The name of the attribute that you want to retrieve the values for, such as `volumeType`.
    --max-results=: The maximum number of results to return in response.
    --next-token=: The pagination token that indicates the next set of results that you want to retrieve.
    --service-code=!: The service code for the service whose attributes you want to retrieve.
documentation:
    command: Returns a list of attribute values. Attributes are similar to the details in a Price List API offer file. For a list of available attributes, see [Offer File Definitions](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/reading-an-offer.html#pps-defs) in the [Billing and Cost Management User Guide](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/billing-what-is.html).
    flag:
        attribute-name: The name of the attribute that you want to retrieve the values for, such as `volumeType`.
        max-results: The maximum number of results to return in response.
        next-token: The pagination token that indicates the next set of results that you want to retrieve.
        service-code: The service code for the service whose attributes you want to retrieve. For example, if you want the retrieve an EC2 attribute, use `AmazonEC2`.
