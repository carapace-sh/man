name: update
description: '*(ALPHA)*  Updates an alerting policy.'
flags:
    --add-notification-channels=: Append the given values to the current Notification Channels.
    --clear-notification-channels: Empty the current Notification Channels.
    --clear-user-labels: Remove all labels.
    --combiner=: The combiner for the Alert Policy.
    --display-name=: The display name for the Alert Policy.
    --documentation-format=: The MIME type that should be used with `--documentation` or `--documentation-from-file`.
    --documentation-from-file=: The path to a file containing the documentation to be included with the policy.
    --documentation=: The documentation to be included with the policy.
    --enabled: If the policy is enabled.
    --fields=: The list of fields to update.
    --no-clear-notification-channels&: Empty the current Notification Channels.
    --no-clear-user-labels&: Remove all labels.
    --no-enabled&: If the policy is enabled.
    --policy-from-file=: The path to a JSON or YAML file containing the policy.
    --policy=: The policy as a string.
    --remove-notification-channels=: Remove the given values from the current Notification Channels.
    --remove-user-labels=: List of label keys to remove.
    --set-notification-channels=: Completely replace the current Notification Channels with the given values.
    --update-user-labels=: List of label KEY=VALUE pairs to update.
completion:
    flag:
        combiner:
            - AND
            - AND_WITH_MATCHING_RESOURCE
            - COMBINE_UNSPECIFIED
            - OR
documentation:
    command: |
        *(ALPHA)*  Updates an alerting policy.

        If `--policy` or `--policy-from-file` are specified:

          * If `--fields` is specified, the only the specified fields will be
            updated.
          * Else, the policy will be replaced with the provided policy. The
            policy can be modified further using the flags from the Policy
            Settings group below.

        Otherwise, the policy will be updated with the values specified in
        the flags from the Policy Settings group.

        For information about the JSON/YAML format of an alerting policy:
        https://cloud.google.com/monitoring/api/ref_v3/rest/v3/projects.alertPolicies
    flag:
        add-notification-channels: Append the given values to the current Notification Channels.
        clear-notification-channels: Empty the current Notification Channels.
        clear-user-labels: |-
            Remove all labels. If `--update-user-labels` is also specified then
            `--clear-user-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-user-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-user-labels --update-user-labels foo=bar,baz=qux
        combiner: |-
            The combiner for the Alert Policy. _COMBINER_ must be one of:
            +
            *AND*::: An incident is created only if all conditions are met simultaneously. This combiner is satisfied if all conditions are met, even if they are met on completely different resources.
            *AND_WITH_MATCHING_RESOURCE*::: Combine conditions using logical AND operator, but unlike the regular AND option, an incident is created only if all conditions are met simultaneously on at least one resource.
            *COMBINE_UNSPECIFIED*::: An unspecified combiner
            *OR*::: An incident is created if any of the listed conditions is met.
            :::
            +
        display-name: The display name for the Alert Policy.
        documentation: The documentation to be included with the policy.
        documentation-format: The MIME type that should be used with `--documentation` or `--documentation-from-file`. Currently, only "text/markdown" is supported.
        documentation-from-file: The path to a file containing the documentation to be included with the policy. Use a full or relative path to a local file containing the value of documentation.
        enabled: If the policy is enabled. Use *--enabled* to enable and *--no-enabled* to disable.
        fields: 'The list of fields to update. Must specify `--policy` or `--policy-from-file` if using this flag. _field_ must be one of: *disabled*, *notificationChannels*.'
        no-clear-notification-channels: Empty the current Notification Channels.
        no-clear-user-labels: |
            Remove all labels. If `--update-user-labels` is also specified then
            `--clear-user-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-user-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-user-labels --update-user-labels foo=bar,baz=qux
        no-enabled: If the policy is enabled.
        policy: The policy as a string. In either JSON or YAML format.
        policy-from-file: The path to a JSON or YAML file containing the policy. Use a full or relative path to a local file containing the value of policy.
        remove-notification-channels: Remove the given values from the current Notification Channels.
        remove-user-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-user-labels` is also specified then
            `--update-user-labels` is applied first.
        set-notification-channels: Completely replace the current Notification Channels with the given values.
        update-user-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
