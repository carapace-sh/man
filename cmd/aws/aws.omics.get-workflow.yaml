name: get-workflow
description: Gets all information about a workflow using its ID.
flags:
    --export=: The export format for the workflow.
    --id=!: The workflow's ID.
    --type=: The workflow's type.
    --workflow-owner-id=: The ID of the workflow owner.
completion:
    flag:
        type:
            - PRIVATE
            - READY2RUN
documentation:
    command: |-
        Gets all information about a workflow using its ID.

        If a workflow is shared with you, you cannot export the workflow.

        For more information about your workflow status, see [Verify the workflow status](https://docs.aws.amazon.com/omics/latest/dev/using-get-workflow.html) in the *Amazon Web Services HealthOmics User Guide*.
    flag:
        export: The export format for the workflow.
        id: The workflow's ID.
        type: The workflow's type.
        workflow-owner-id: The ID of the workflow owner.
