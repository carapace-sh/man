name: detect-anomalies
description: Detects anomalies in an image that you supply.
flags:
    --body=!: The unencrypted image bytes that you want to analyze.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --content-type=!: The type of the image passed in `Body`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --model-version=!: The version of the model that you want to use.
    --project-name=!: The name of the project that contains the model version that you want to use.
documentation:
    command: |-
        Detects anomalies in an image that you supply.

        The response from `DetectAnomalies` includes a boolean prediction that the image contains one or more anomalies and a confidence value for the prediction. If the model is an image segmentation model, the response also includes segmentation information for each type of anomaly found in the image.

        Before calling `DetectAnomalies`, you must first start your model with the [StartModel]() operation. You are charged for the amount of time, in minutes, that a model runs and for the number of anomaly detection units that your model uses. If you are not using a model, use the [StopModel]() operation to stop your model.

        For more information, see *Detecting anomalies in an image* in the Amazon Lookout for Vision developer guide.

        This operation requires permissions to perform the `lookoutvision:DetectAnomalies` operation.
    flag:
        body: The unencrypted image bytes that you want to analyze.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        content-type: The type of the image passed in `Body`. Valid values are `image/png` (PNG format images) and `image/jpeg` (JPG format images).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        model-version: The version of the model that you want to use.
        project-name: The name of the project that contains the model version that you want to use.
