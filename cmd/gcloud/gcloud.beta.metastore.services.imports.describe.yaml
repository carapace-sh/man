name: describe
description: '*(BETA)*  *(DEPRECATED)*  Describe a metadata import.'
flags:
    --location=: The location of the Dataproc Metastore service.
    --service=: The identifier of the Dataproc Metastore service
documentation:
    command: |4
        *(BETA)*  *(DEPRECATED)*  This command has been deprecated.
        Please use `gcloud metastore services import` command group instead.


        Describe a metadata import.

        Displays all details of a metadata import given a valid import ID.
    flag:
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `import` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
        service: |-
            The identifier of the Dataproc Metastore service
            +
            To set the `service` attribute:
            * provide the argument `import` on the command line with a fully specified name;
            * provide the argument `--service` on the command line.
