name: update-provisioned-model-throughput
description: Updates the name or associated model for a Provisioned Throughput.
flags:
    --desired-model-id=: The Amazon Resource Name (ARN) of the new model to associate with this Provisioned Throughput.
    --desired-provisioned-model-name=: The new name for this Provisioned Throughput.
    --provisioned-model-id=!: The Amazon Resource Name (ARN) or name of the Provisioned Throughput to update.
documentation:
    command: Updates the name or associated model for a Provisioned Throughput. For more information, see [Provisioned Throughput](https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html) in the [Amazon Bedrock User Guide](https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-service.html).
    flag:
        desired-model-id: |-
            The Amazon Resource Name (ARN) of the new model to associate with this Provisioned Throughput. You can't specify this field if this Provisioned Throughput is associated with a base model.

            If this Provisioned Throughput is associated with a custom model, you can specify one of the following options:

            - The base model from which the custom model was customized.
            - Another custom model that was customized from the same base model as the custom model.
        desired-provisioned-model-name: The new name for this Provisioned Throughput.
        provisioned-model-id: The Amazon Resource Name (ARN) or name of the Provisioned Throughput to update.
