name: drain
description: Drains all jobs that match the command line arguments.
flags:
    --region=: Region ID of the jobs' regional endpoint.
documentation:
    command: |-
        Once Drain is triggered, the pipeline will stop accepting new inputs.
        The input watermark will be advanced to infinity. Elements already in the
        pipeline will continue to be processed. Drained jobs can safely be
        cancelled.
    flag:
        region: Region ID of the jobs' regional endpoint. Defaults to 'us-central1'.
