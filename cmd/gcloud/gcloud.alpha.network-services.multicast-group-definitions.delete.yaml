name: delete
description: '*(ALPHA)*  Delete a multicast group definition.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Delete a multicast group definition in the specified location of the current project.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location Id.
            +
            To set the `location` attribute:
            * provide the argument `multicast_group_definition` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
