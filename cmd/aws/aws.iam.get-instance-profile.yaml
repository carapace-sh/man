name: get-instance-profile
description: Retrieves information about the specified instance profile, including the instance profile's path, GUID, ARN, and role.
flags:
    --instance-profile-name=!: The name of the instance profile to get information about.
documentation:
    command: Retrieves information about the specified instance profile, including the instance profile's path, GUID, ARN, and role. For more information about instance profiles, see [Using instance profiles](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html) in the *IAM User Guide*.
    flag:
        instance-profile-name: |-
            The name of the instance profile to get information about.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
