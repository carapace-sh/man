name: failover-global-cluster
description: Promotes the specified secondary DB cluster to be the primary DB cluster in the global database cluster to fail over or switch over a global database.
flags:
    --allow-data-loss=: Specifies whether to allow data loss for this global database cluster operation.
    --global-cluster-identifier=!: The identifier of the global database cluster (Aurora global database) this operation should apply to.
    --switchover=: Specifies whether to switch over this global database cluster.
    --target-db-cluster-identifier=!: The identifier of the secondary Aurora DB cluster that you want to promote to the primary for the global database cluster.
documentation:
    command: "Promotes the specified secondary DB cluster to be the primary DB cluster in the global database cluster to fail over or switch over a global database. Switchover operations were previously called \"managed planned failovers.\"\n\nAlthough this operation can be used either to fail over or to switch over a global database cluster, its intended use is for global database failover. To switch over a global database cluster, we recommend that you use the [SwitchoverGlobalCluster]() operation instead.\n\nHow you use this operation depends on whether you are failing over or switching over your global database cluster:\n\n- Failing over - Specify the `AllowDataLoss` parameter and don't specify the `Switchover` parameter.\n- Switching over - Specify the `Switchover` parameter or omit it, but don't specify the `AllowDataLoss` parameter.\n\n**About failing over and switching over**\n\nWhile failing over and switching over a global database cluster both change the primary DB cluster, you use these operations for different reasons:\n\n- *Failing over* - Use this operation to respond to an unplanned event, such as a Regional disaster in the primary Region. Failing over can result in a loss of write transaction data that wasn't replicated to the chosen secondary before the failover event occurred. However, the recovery process that promotes a DB instance on the chosen seconday DB cluster to be the primary writer DB instance guarantees that the data is in a transactionally consistent state.\n  \n  For more information about failing over an Amazon Aurora global database, see [Performing managed failovers for Aurora global databases](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-disaster-recovery.html#aurora-global-database-failover.managed-unplanned) in the *Amazon Aurora User Guide*.\n- *Switching over* - Use this operation on a healthy global database cluster for planned events, such as Regional rotation or to fail back to the original primary DB cluster after a failover operation. With this operation, there is no data loss.\n  \n  For more information about switching over an Amazon Aurora global database, see [Performing switchovers for Aurora global databases](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-disaster-recovery.html#aurora-global-database-disaster-recovery.managed-failover) in the *Amazon Aurora User Guide*."
    flag:
        allow-data-loss: |-
            Specifies whether to allow data loss for this global database cluster operation. Allowing data loss triggers a global failover operation.

            If you don't specify `AllowDataLoss`, the global database cluster operation defaults to a switchover.

            Constraints:

            - Can't be specified together with the `Switchover` parameter.
        global-cluster-identifier: |-
            The identifier of the global database cluster (Aurora global database) this operation should apply to. The identifier is the unique key assigned by the user when the Aurora global database is created. In other words, it's the name of the Aurora global database.

            Constraints:

            - Must match the identifier of an existing global database cluster.
        switchover: |-
            Specifies whether to switch over this global database cluster.

            Constraints:

            - Can't be specified together with the `AllowDataLoss` parameter.
        target-db-cluster-identifier: The identifier of the secondary Aurora DB cluster that you want to promote to the primary for the global database cluster. Use the Amazon Resource Name (ARN) for the identifier so that Aurora can locate the cluster in its Amazon Web Services Region.
