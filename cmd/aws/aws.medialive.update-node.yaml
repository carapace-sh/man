name: update-node
description: Change the settings for a Node.
flags:
    --cluster-id=!: The ID of the cluster
    --name=: Include this parameter only if you want to change the current name of the Node.
    --node-id=!: The ID of the node.
    --role=: The initial role of the Node in the Cluster.
    --sdi-source-mappings=: The mappings of a SDI capture card port to a logical SDI data stream
completion:
    flag:
        role:
            - BACKUP
            - ACTIVE
documentation:
    command: Change the settings for a Node.
    flag:
        cluster-id: The ID of the cluster
        name: Include this parameter only if you want to change the current name of the Node. Specify a name that is unique in the Cluster. You can't change the name. Names are case-sensitive.
        node-id: The ID of the node.
        role: The initial role of the Node in the Cluster. ACTIVE means the Node is available for encoding. BACKUP means the Node is a redundant Node and might get used if an ACTIVE Node fails.
        sdi-source-mappings: The mappings of a SDI capture card port to a logical SDI data stream
