name: remove-tags
description: Removes the specified tags from the specified Elastic Load Balancing resources.
flags:
    --resource-arns=!: The Amazon Resource Name (ARN) of the resource.
    --tag-keys=!: The tag keys for the tags to remove.
documentation:
    command: Removes the specified tags from the specified Elastic Load Balancing resources. You can remove the tags for one or more Application Load Balancers, Network Load Balancers, Gateway Load Balancers, target groups, listeners, or rules.
    flag:
        resource-arns: The Amazon Resource Name (ARN) of the resource.
        tag-keys: The tag keys for the tags to remove.
