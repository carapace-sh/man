name: create-service-network
description: Creates a service network.
flags:
    --auth-type=: The type of IAM policy.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --name=!: The name of the service network.
    --sharing-config=: Specify if the service network should be enabled for sharing.
    --tags=: The tags for the service network.
completion:
    flag:
        auth-type:
            - NONE
            - AWS_IAM
documentation:
    command: |-
        Creates a service network. A service network is a logical boundary for a collection of services. You can associate services and VPCs with a service network.

        For more information, see [Service networks](https://docs.aws.amazon.com/vpc-lattice/latest/ug/service-networks.html) in the *Amazon VPC Lattice User Guide*.
    flag:
        auth-type: |-
            The type of IAM policy.

            - `NONE`: The resource does not use an IAM policy. This is the default.
            - `AWS_IAM`: The resource uses an IAM policy. When this type is used, auth is enabled and an auth policy is required.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you retry a request that completed successfully using the same client token and parameters, the retry succeeds without performing any actions. If the parameters aren't identical, the retry fails.
        name: The name of the service network. The name must be unique to the account. The valid characters are a-z, 0-9, and hyphens (-). You can't use a hyphen as the first or last character, or immediately after another hyphen.
        sharing-config: Specify if the service network should be enabled for sharing.
        tags: The tags for the service network.
