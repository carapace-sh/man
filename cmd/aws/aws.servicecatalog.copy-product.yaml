name: copy-product
description: Copies the specified source product to the specified target product or a new product.
flags:
    --accept-language=: The language code.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --copy-options=: The copy options.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --idempotency-token=!: A unique identifier that you provide to ensure idempotency.
    --source-product-arn=!: The Amazon Resource Name (ARN) of the source product.
    --source-provisioning-artifact-identifiers=: The identifiers of the provisioning artifacts (also known as versions) of the product to copy.
    --target-product-id=: The identifier of the target product.
    --target-product-name=: A name for the target product.
documentation:
    command: |-
        Copies the specified source product to the specified target product or a new product.

        You can copy a product to the same account or another account. You can copy a product to the same Region or another Region. If you copy a product to another account, you must first share the product in a portfolio using [CreatePortfolioShare]().

        This operation is performed asynchronously. To track the progress of the operation, use [DescribeCopyProductStatus]().
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        copy-options: The copy options. If the value is `CopyTags`, the tags from the source product are copied to the target product.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        idempotency-token: A unique identifier that you provide to ensure idempotency. If multiple requests differ only by the idempotency token, the same response is returned for each repeated request.
        source-product-arn: The Amazon Resource Name (ARN) of the source product.
        source-provisioning-artifact-identifiers: The identifiers of the provisioning artifacts (also known as versions) of the product to copy. By default, all provisioning artifacts are copied.
        target-product-id: The identifier of the target product. By default, a new product is created.
        target-product-name: A name for the target product. The default is the name of the source product.
