name: update
description: '*(ALPHA)*  Update an existing artifact guard policy.'
hidden: true
flags:
    --allow-missing: If set, the policy will be created if it does not exist.
    --location=: ID of the location where the resource exists (for example, global).
    --no-allow-missing&: If set, the policy will be created if it does not exist.
    --organization=: (Optional) If the full resource name isn't provided e.g. organizations/123, then provide the
    --policy-file-path=!: YAML file containing the body of the policy to be created.
    --update-mask=: The list of fields to update.
documentation:
    command: |
        *(ALPHA)*  Updates an existing artifact guard policy.
        Update Mask: It updates the policy with the fields specified in the update mask.
        If the update mask is not specified or is set to "*", all the fields are updated.
        Partial field updates are not supported. The following fields are supported:
        - "display_name"
        - "description"
        - "scope"
        - "enablement_state"
        - "vulnerability_policy"
        - "annotations"

        Allow missing: If set, the policy will be created if it does not exist.
    flag:
        allow-missing: If set, the policy will be created if it does not exist.
        location: |-
            ID of the location where the resource exists (for example, global).
            +

            To set the `location` attribute:
            * provide the argument `policy` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-allow-missing: |
            If set, the policy will be created if it does not exist.
        organization: |-
            (Optional) If the full resource name isn't provided e.g. organizations/123, then provide the
            organization id which is the suffix of the organization. Example: organizations/123, the id is
            123.
            +

            To set the `organization` attribute:
            * provide the argument `policy` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        policy-file-path: YAML file containing the body of the policy to be created. Use a full or relative path to a local file containing the value of policy_file_path.
        update-mask: 'The list of fields to update. Eg: "description,display_name"'
