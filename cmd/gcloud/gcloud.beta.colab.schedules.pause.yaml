name: pause
description: '*(BETA)*  Pause a schedule.'
flags:
    --region=: Cloud region for the schedule.
documentation:
    command: |
        *(BETA)*  Pause a Colab Enterprise notebook execution schedule.
    flag:
        region: |-
            Cloud region for the schedule.
            +
            To set the `region` attribute:
            * provide the argument `schedule` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `colab/region`.
