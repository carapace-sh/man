name: delete-meeting
description: Deletes the specified Amazon Chime SDK meeting.
flags:
    --meeting-id=!: The Amazon Chime SDK meeting ID.
documentation:
    command: Deletes the specified Amazon Chime SDK meeting. The operation deletes all attendees, disconnects all clients, and prevents new clients from joining the meeting. For more information about the Amazon Chime SDK, see [Using the Amazon Chime SDK](https://docs.aws.amazon.com/chime-sdk/latest/dg/meetings-sdk.html) in the *Amazon Chime Developer Guide*.
    flag:
        meeting-id: The Amazon Chime SDK meeting ID.
