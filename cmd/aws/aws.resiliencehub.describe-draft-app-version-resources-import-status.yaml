name: describe-draft-app-version-resources-import-status
description: Describes the status of importing resources to an application version.
flags:
    --app-arn=!: Amazon Resource Name (ARN) of the Resilience Hub application.
documentation:
    command: |-
        Describes the status of importing resources to an application version.

        If you get a 404 error with `ResourceImportStatusNotFoundAppMetadataException`, you must call `importResourcesToDraftAppVersion` after creating the application and before calling `describeDraftAppVersionResourcesImportStatus` to obtain the status.
    flag:
        app-arn: 'Amazon Resource Name (ARN) of the Resilience Hub application. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
