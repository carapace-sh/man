name: create-application
description: Creates an Amazon Q Business application.
flags:
    --attachments-configuration=: An option to allow end users to upload files directly during chat.
    --client-ids-for-oidc=: The OIDC client ID for a Amazon Q Business application.
    --client-token=: A token that you provide to identify the request to create your Amazon Q Business application.
    --description=: A description for the Amazon Q Business application.
    --display-name=!: A name for the Amazon Q Business application.
    --encryption-configuration=: The identifier of the KMS key that is used to encrypt your data.
    --iam-identity-provider-arn=: The Amazon Resource Name (ARN) of an identity provider being used by an Amazon Q Business application.
    --identity-center-instance-arn=: The Amazon Resource Name (ARN) of the IAM Identity Center instance you are either creating for—or connecting to—your Amazon Q Business application.
    --identity-type=: The authentication type being used by a Amazon Q Business application.
    --personalization-configuration=: Configuration information about chat response personalization.
    --q-apps-configuration=: An option to allow end users to create and use Amazon Q Apps in the web experience.
    --quick-sight-configuration=: The Amazon QuickSight configuration for an Amazon Q Business application that uses QuickSight for authentication.
    --role-arn=: The Amazon Resource Name (ARN) of an IAM role with permissions to access your Amazon CloudWatch logs and metrics.
    --tags=: A list of key-value pairs that identify or categorize your Amazon Q Business application.
completion:
    flag:
        identity-type:
            - AWS_IAM_IDP_SAML
            - AWS_IAM_IDP_OIDC
            - AWS_IAM_IDC
            - AWS_QUICKSIGHT_IDP
            - ANONYMOUS
documentation:
    command: |-
        Creates an Amazon Q Business application.

        There are new tiers for Amazon Q Business. Not all features in Amazon Q Business Pro are also available in Amazon Q Business Lite. For information on what's included in Amazon Q Business Lite and what's included in Amazon Q Business Pro, see [Amazon Q Business tiers](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/tiers.html#user-sub-tiers). You must use the Amazon Q Business console to assign subscription tiers to users.

        An Amazon Q Apps service linked role will be created if it's absent in the Amazon Web Services account when `QAppsConfiguration` is enabled in the request. For more information, see [Using service-linked roles for Q Apps](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/using-service-linked-roles-qapps.html).

        When you create an application, Amazon Q Business may securely transmit data for processing from your selected Amazon Web Services region, but within your geography. For more information, see [Cross region inference in Amazon Q Business](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/cross-region-inference.html).
    flag:
        attachments-configuration: An option to allow end users to upload files directly during chat.
        client-ids-for-oidc: The OIDC client ID for a Amazon Q Business application.
        client-token: A token that you provide to identify the request to create your Amazon Q Business application.
        description: A description for the Amazon Q Business application.
        display-name: A name for the Amazon Q Business application.
        encryption-configuration: The identifier of the KMS key that is used to encrypt your data. Amazon Q Business doesn't support asymmetric keys.
        iam-identity-provider-arn: The Amazon Resource Name (ARN) of an identity provider being used by an Amazon Q Business application.
        identity-center-instance-arn: The Amazon Resource Name (ARN) of the IAM Identity Center instance you are either creating for—or connecting to—your Amazon Q Business application.
        identity-type: The authentication type being used by a Amazon Q Business application.
        personalization-configuration: Configuration information about chat response personalization. For more information, see [Personalizing chat responses](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/personalizing-chat-responses.html)
        q-apps-configuration: An option to allow end users to create and use Amazon Q Apps in the web experience.
        quick-sight-configuration: The Amazon QuickSight configuration for an Amazon Q Business application that uses QuickSight for authentication. This configuration is required if your application uses QuickSight as the identity provider. For more information, see [Creating an Amazon QuickSight integrated application](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/create-quicksight-integrated-application.html).
        role-arn: The Amazon Resource Name (ARN) of an IAM role with permissions to access your Amazon CloudWatch logs and metrics. If this property is not specified, Amazon Q Business will create a [service linked role (SLR)](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/using-service-linked-roles.html#slr-permissions) and use it as the application's role.
        tags: 'A list of key-value pairs that identify or categorize your Amazon Q Business application. You can also use tags to help control access to the application. Tag keys and values can consist of Unicode letters, digits, white space, and any of the following symbols: _ . : / = + - @.'
