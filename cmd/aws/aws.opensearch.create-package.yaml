name: create-package
description: Creates a package for use with Amazon OpenSearch Service domains.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --engine-version=: The version of the Amazon OpenSearch Service engine for which is compatible with the package.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --package-configuration=: The configuration parameters for the package being created.
    --package-description=: Description of the package.
    --package-encryption-options=: The encryption parameters for the package being created.
    --package-name=!: Unique name for the package.
    --package-source=!: The Amazon S3 location from which to import the package.
    --package-type=!: The type of package.
    --package-vending-options=: The vending options for the package being created.
completion:
    flag:
        package-type:
            - TXT-DICTIONARY
            - ZIP-PLUGIN
            - PACKAGE-LICENSE
            - PACKAGE-CONFIG
documentation:
    command: Creates a package for use with Amazon OpenSearch Service domains. For more information, see [Custom packages for Amazon OpenSearch Service](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/custom-packages.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        engine-version: The version of the Amazon OpenSearch Service engine for which is compatible with the package. This can only be specified for package type `ZIP-PLUGIN`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        package-configuration: The configuration parameters for the package being created.
        package-description: Description of the package.
        package-encryption-options: The encryption parameters for the package being created.
        package-name: Unique name for the package.
        package-source: The Amazon S3 location from which to import the package.
        package-type: The type of package.
        package-vending-options: The vending options for the package being created. They determine if the package can be vended to other users.
