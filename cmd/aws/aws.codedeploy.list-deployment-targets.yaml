name: list-deployment-targets
description: Returns an array of target IDs that are associated a deployment.
flags:
    --deployment-id=!: The unique ID of a deployment.
    --next-token=: A token identifier returned from the previous `ListDeploymentTargets` call.
    --target-filters=: A key used to filter the returned targets.
documentation:
    command: Returns an array of target IDs that are associated a deployment.
    flag:
        deployment-id: The unique ID of a deployment.
        next-token: A token identifier returned from the previous `ListDeploymentTargets` call. It can be used to return the next set of deployment targets in the list.
        target-filters: |-
            A key used to filter the returned targets. The two valid values are:

            - `TargetStatus` - A `TargetStatus` filter string can be `Failed`, `InProgress`, `Pending`, `Ready`, `Skipped`, `Succeeded`, or `Unknown`.
            - `ServerInstanceLabel` - A `ServerInstanceLabel` filter string can be `Blue` or `Green`.
