name: create-publishing-destination
description: Creates a publishing destination where you can export your GuardDuty findings.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The idempotency token for the request.
    --destination-properties=!: The properties of the publishing destination, including the ARNs for the destination and the KMS key used for encryption.
    --destination-type=!: The type of resource for the publishing destination.
    --detector-id=!: The ID of the GuardDuty detector associated with the publishing destination.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --tags=: The tags to be added to a new publishing destination resource.
completion:
    flag:
        destination-type:
            - S3
documentation:
    command: Creates a publishing destination where you can export your GuardDuty findings. Before you start exporting the findings, the destination resource must exist.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The idempotency token for the request.
        destination-properties: The properties of the publishing destination, including the ARNs for the destination and the KMS key used for encryption.
        destination-type: The type of resource for the publishing destination. Currently only Amazon S3 buckets are supported.
        detector-id: |-
            The ID of the GuardDuty detector associated with the publishing destination.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tags: The tags to be added to a new publishing destination resource.
