name: describe-access-points
description: Returns the description of a specific Amazon EFS access point if the `AccessPointId` is provided.
flags:
    --access-point-id=: (Optional) Specifies an EFS access point to describe in the response; mutually exclusive with `FileSystemId`.
    --file-system-id=: (Optional) If you provide a `FileSystemId`, EFS returns all access points for that file system; mutually exclusive with `AccessPointId`.
    --max-results=: (Optional) When retrieving all access points for a file system, you can optionally specify the `MaxItems` parameter to limit the number of objects returned in a response.
    --next-token=: '`NextToken` is present if the response is paginated.'
documentation:
    command: |-
        Returns the description of a specific Amazon EFS access point if the `AccessPointId` is provided. If you provide an EFS `FileSystemId`, it returns descriptions of all access points for that file system. You can provide either an `AccessPointId` or a `FileSystemId` in the request, but not both.

        This operation requires permissions for the `elasticfilesystem:DescribeAccessPoints` action.
    flag:
        access-point-id: (Optional) Specifies an EFS access point to describe in the response; mutually exclusive with `FileSystemId`.
        file-system-id: (Optional) If you provide a `FileSystemId`, EFS returns all access points for that file system; mutually exclusive with `AccessPointId`.
        max-results: (Optional) When retrieving all access points for a file system, you can optionally specify the `MaxItems` parameter to limit the number of objects returned in a response. The default value is 100.
        next-token: '`NextToken` is present if the response is paginated. You can use `NextMarker` in the subsequent request to fetch the next page of access point descriptions.'
