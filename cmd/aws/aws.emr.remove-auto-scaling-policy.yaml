name: remove-auto-scaling-policy
description: Removes an automatic scaling policy from a specified instance group within an Amazon EMR cluster.
flags:
    --cluster-id=!: Specifies the ID of a cluster.
    --instance-group-id=!: Specifies the ID of the instance group to which the scaling policy is applied.
documentation:
    command: Removes an automatic scaling policy from a specified instance group within an Amazon EMR cluster.
    flag:
        cluster-id: Specifies the ID of a cluster. The instance group to which the automatic scaling policy is applied is within this cluster.
        instance-group-id: Specifies the ID of the instance group to which the scaling policy is applied.
