name: update-slot
description: Updates the settings for a slot.
flags:
    --bot-id=!: The unique identifier of the bot that contains the slot.
    --bot-version=!: The version of the bot that contains the slot.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The new description for the slot.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --intent-id=!: The identifier of the intent that contains the slot.
    --locale-id=!: The identifier of the language and locale that contains the slot.
    --multiple-values-setting=: Determines whether the slot accepts multiple values in one response.
    --obfuscation-setting=: New settings that determine how slot values are formatted in Amazon CloudWatch logs.
    --slot-id=!: The unique identifier for the slot to update.
    --slot-name=!: The new name for the slot.
    --slot-type-id=: The unique identifier of the new slot type to associate with this slot.
    --sub-slot-setting=: Specifications for the constituent sub slots and the expression for the composite slot.
    --value-elicitation-setting=!: A new set of prompts that Amazon Lex sends to the user to elicit a response the provides a value for the slot.
documentation:
    command: Updates the settings for a slot.
    flag:
        bot-id: The unique identifier of the bot that contains the slot.
        bot-version: The version of the bot that contains the slot. Must always be `DRAFT`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The new description for the slot.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        intent-id: The identifier of the intent that contains the slot.
        locale-id: The identifier of the language and locale that contains the slot. The string must match one of the supported locales. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
        multiple-values-setting: |-
            Determines whether the slot accepts multiple values in one response. Multiple value slots are only available in the en-US locale. If you set this value to `true` in any other locale, Amazon Lex throws a `ValidationException`.

            If the `multipleValuesSetting` is not set, the default value is `false`.
        obfuscation-setting: New settings that determine how slot values are formatted in Amazon CloudWatch logs.
        slot-id: The unique identifier for the slot to update.
        slot-name: The new name for the slot.
        slot-type-id: The unique identifier of the new slot type to associate with this slot.
        sub-slot-setting: Specifications for the constituent sub slots and the expression for the composite slot.
        value-elicitation-setting: A new set of prompts that Amazon Lex sends to the user to elicit a response the provides a value for the slot.
