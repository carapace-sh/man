name: update-data-catalog
description: Updates the data catalog that has the specified name.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: New or modified text that describes the data catalog.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the data catalog to update.
    --parameters=: Specifies the Lambda function or functions to use for updating the data catalog.
    --type=!: Specifies the type of data catalog to update.
completion:
    flag:
        type:
            - LAMBDA
            - GLUE
            - HIVE
            - FEDERATED
documentation:
    command: Updates the data catalog that has the specified name.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: New or modified text that describes the data catalog.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the data catalog to update. The catalog name must be unique for the Amazon Web Services account and can use a maximum of 127 alphanumeric, underscore, at sign, or hyphen characters. The remainder of the length constraint of 256 is reserved for use by Athena.
        parameters: "Specifies the Lambda function or functions to use for updating the data catalog. This is a mapping whose values depend on the catalog type.\n\n- For the `HIVE` data catalog type, use the following syntax. The `metadata-function` parameter is required. `The sdk-version` parameter is optional and defaults to the currently supported version.\n  \n  `metadata-function=lambda_arn, sdk-version=version_number`\n- For the `LAMBDA` data catalog type, use one of the following sets of required parameters, but not both.\n  \n  - If you have one Lambda function that processes metadata and another for reading the actual data, use the following syntax. Both parameters are required.\n    \n    `metadata-function=lambda_arn, record-function=lambda_arn`\n  - If you have a composite Lambda function that processes both metadata and data, use the following syntax to specify your Lambda function.\n    \n    `function=lambda_arn`"
        type: Specifies the type of data catalog to update. Specify `LAMBDA` for a federated catalog, `HIVE` for an external hive metastore, or `GLUE` for an Glue Data Catalog.
