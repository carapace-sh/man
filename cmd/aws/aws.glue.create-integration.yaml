name: create-integration
description: 'Creates a Zero-ETL integration in the caller''s account between two resources with Amazon Resource Names (ARNs): the `SourceArn` and `TargetArn`.'
flags:
    --additional-encryption-context=: An optional set of non-secret key–value pairs that contains additional contextual information for encryption.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-filter=: Selects source tables for the integration using Maxwell filter syntax.
    --description=: A description of the integration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --integration-config=: The configuration settings.
    --integration-name=!: A unique name for an integration in Glue.
    --kms-key-id=: The ARN of a KMS key used for encrypting the channel.
    --source-arn=!: The ARN of the source resource for the integration.
    --tags=:
        description: Metadata assigned to the resource consisting of a list of key-value pairs.
        nargs: -1
    --target-arn=!: The ARN of the target resource for the integration.
