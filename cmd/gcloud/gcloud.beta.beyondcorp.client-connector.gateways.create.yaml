name: create
description: '*(BETA)*  Create a new BeyondCorp client gateway (Deprecated).'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --client-connector-service=!: The client connector service that the client gateway is associated with.
    --location=: The location of the BeyondCorp Enterprise client connector.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(BETA)*  Create a new BeyondCorp client gateway.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        client-connector-service: |-
            The client connector service that the client gateway is associated with. Example -
            `projects/consumer-project-id/locations/us-central1/clientConnectorServices/my-service-resource`.
        location: |-
            The location of the BeyondCorp Enterprise client connector.
            +

            To set the `location` attribute:
            * provide the argument `client_gateway` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
