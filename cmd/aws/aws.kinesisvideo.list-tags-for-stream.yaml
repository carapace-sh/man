name: list-tags-for-stream
description: Returns a list of tags associated with the specified stream.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --next-token=: If you specify this parameter and the result of a `ListTagsForStream` call is truncated, the response includes a token that you can use in the next request to fetch the next batch of tags.
    --stream-arn=: The Amazon Resource Name (ARN) of the stream that you want to list tags for.
    --stream-name=: The name of the stream that you want to list tags for.
documentation:
    command: |-
        Returns a list of tags associated with the specified stream.

        In the request, you must specify either the `StreamName` or the `StreamARN`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
