name: update
description: '*(ALPHA)*  Update a GitLab Enterprise config for use by Cloud Build.'
flags:
    --api-access-token-secret-version=: Secret Manager resource containing the API access token.
    --api-key-secret-version=: Secret Manager resource containing the Cloud Build API key that should be associated with this config.
    --host-uri=: The host uri of the GitLab Enterprise instance.
    --read-access-token-secret-version=: Secret Manager resource containing the read access token.
    --region=: The Cloud location for the gitLabConfig.
    --service-directory-service=: Service Directory service that should be used when making calls to the GitLab Enterprise instance.
    --ssl-ca-file=: Path to a local file that contains SSL certificate to use for requests to GitLab Enterprise.
    --user-name=: The GitLab user name that should be associated with this config.
    --webhook-secret-secret-version=: Secret Manager resource containing the webhook secret.
documentation:
    command: '*(ALPHA)*  Update a GitLab Enterprise config for use by Cloud Build.'
    flag:
        api-access-token-secret-version: Secret Manager resource containing the API access token. The secret is specified in resource URL format projects/{secret_project}/secrets/{secret_name}/versions/{secret_version}.
        api-key-secret-version: Secret Manager resource containing the Cloud Build API key that should be associated with this config. The secret is specified in resource URL format projects/{secret_project}/secrets/{secret_name}/versions/{secret_version}.
        host-uri: The host uri of the GitLab Enterprise instance.
        read-access-token-secret-version: Secret Manager resource containing the read access token. The secret is specified in resource URL format projects/{secret_project}/secrets/{secret_name}/versions/{secret_version}.
        region: |-
            The Cloud location for the gitLabConfig.
            +
            To set the `region` attribute:
            * provide the argument `CONFIG` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `builds/region`.
        service-directory-service: |-
            Service Directory service that should be used when making calls to the GitLab Enterprise instance.
            +
            If not specified, calls will be made over the public internet.
        ssl-ca-file: Path to a local file that contains SSL certificate to use for requests to GitLab Enterprise. The certificate should be in PEM format. Use a full or relative path to a local file containing the value of ssl_ca_file.
        user-name: The GitLab user name that should be associated with this config.
        webhook-secret-secret-version: Secret Manager resource containing the webhook secret. The secret is specified in resource URL format projects/{secret_project}/secrets/{secret_name}/versions/{secret_version}.
