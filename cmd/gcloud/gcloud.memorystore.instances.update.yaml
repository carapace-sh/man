documentation:
    command: Update the configuration of a Memorystore instance.
    flag:
        add-cross-instance-replication-config-secondary-instances: |-
            Add new value to cross_instance_replication_config_secondary_instances list. List of secondary instances that are replicating from this primary
            instance.
            +
            This field is only set for a primary instance.
            +
            *instance*:::
            The full resource path of the remote instance in
            the format: projects/<project>/locations/<region>/instances/<instance-id>.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-cross-instance-replication-config-secondary-instances=instance=string --add-cross-instance-replication-config-secondary-instances=instance=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-cross-instance-replication-config-secondary-instances='[{"instance": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-cross-instance-replication-config-secondary-instances=path_to_file.(yaml|json)
            +
            ```
        add-endpoints: |-
            Add new value to endpoints list. Endpoints for the instance.
            +
            *connections*:::
            A group of PSC connections. They are created in the same VPC network, one
            for each service attachment in the cluster.
            +
            *pscConnection*::::
            Detailed information of a PSC connection that is created by the user.
            +
            *forwardingRule*:::::
            The URI of the consumer side forwarding rule.
            Format:
            projects/{project}/regions/{region}/forwardingRules/{forwarding_rule}.
            +
            *ipAddress*:::::
            The IP allocated on the consumer network for the PSC forwarding rule.
            +
            *network*:::::
            The consumer network where the IP address resides, in the form of
            projects/{project_id}/global/networks/{network_id}.
            +
            *port*:::::
            port will only be set for Primary/Reader or Discovery endpoint.
            +
            *pscConnectionId*:::::
            The PSC connection id of the forwarding rule connected to the
            service attachment.
            +
            *serviceAttachment*:::::
            The service attachment which is the target of the PSC connection,
            in the form of
            projects/{project-id}/regions/{region}/serviceAttachments/{service-attachment-id}.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-endpoints=connections=[{pscConnection={forwardingRule=string,ipAddress=string,network=string,port=int,pscConnectionId=string,serviceAttachment=string}}] --add-endpoints=connections=[{pscConnection={forwardingRule=string,ipAddress=string,network=string,port=int,pscConnectionId=string,serviceAttachment=string}}]
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-endpoints='[{"connections": [{"pscConnection": {"forwardingRule": "string", "ipAddress": "string", "network": "string", "port": int, "pscConnectionId": "string", "serviceAttachment": "string"}}]}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-endpoints=path_to_file.(yaml|json)
            +
            ```
        add-maintenance-policy-weekly-window: |-
            Add new value to maintenance_policy_weekly_window list. Maintenance window that is applied to resources covered by this
            policy. Minimum 1. For the current version, the maximum number of
            weekly_window is expected to be one.
            +
            *day*:::
            Allows to define schedule that runs specified day of the week.
            +
            *startTime*:::
            Start time of the window in UTC.
            +
            *hours*::::
            Hours of a day in 24 hour format. Must be greater than or equal to 0 and
            typically must be less than or equal to 23. An API may choose to allow the
            value "24:00:00" for scenarios like business closing time.
            +
            *minutes*::::
            Minutes of an hour. Must be greater than or equal to 0 and less than or
            equal to 59.
            +
            *nanos*::::
            Fractions of seconds, in nanoseconds. Must be greater than or equal to 0
            and less than or equal to 999,999,999.
            +
            *seconds*::::
            Seconds of a minute. Must be greater than or equal to 0 and typically must
            be less than or equal to 59. An API may allow the value 60 if it allows
            leap-seconds.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-maintenance-policy-weekly-window=day=string,startTime={hours=int,minutes=int,nanos=int,seconds=int} --add-maintenance-policy-weekly-window=day=string,startTime={hours=int,minutes=int,nanos=int,seconds=int}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-maintenance-policy-weekly-window='[{"day": "string", "startTime": {"hours": int, "minutes": int, "nanos": int, "seconds": int}}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-maintenance-policy-weekly-window=path_to_file.(yaml|json)
            +
            ```
        aof-config-append-fsync: |-
            The fsync mode. _AOF_CONFIG_APPEND_FSYNC_ must be one of:
            +
            *always*::: Fsync every time new write commands are appended to the AOF. The best
            data loss protection at the cost of performance.
            *every-sec*::: Fsync every second. You may lose 1 second of data if there is a
            disaster.
            *never*::: Never fsync. Normally Linux will flush data every 30 seconds with this
            configuration, but it's up to the kernel's exact tuning.
            :::
            +
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        async-instance-endpoints-deletion-enabled: |-
            If true, instance endpoints that are created and registered by customers
            can be deleted asynchronously. That is, such an instance endpoint can be
            de-registered before the forwarding rules in the instance endpoint are
            deleted. Use *--async-instance-endpoints-deletion-enabled* to enable and *--no-async-instance-endpoints-deletion-enabled* to disable.
        automated-backup-config-mode: |-
            The automated backup mode. If the mode is disabled, the other fields will
            be ignored. _AUTOMATED_BACKUP_CONFIG_MODE_ must be one of:
            +
            *disabled*::: Automated backup config disabled.
            *enabled*::: Automated backup config enabled.
            :::
            +
        automated-backup-config-retention: |-
            How long to keep automated backups before the backups are deleted. The
            value should be between 1 day and 365 days. If not specified, the default
            value is 35 days.
        clear-automated-backup-config: Set instance.automatedBackupConfig back to default value.
        clear-cross-instance-replication-config: Set instance.crossInstanceReplicationConfig back to default value.
        clear-cross-instance-replication-config-secondary-instances: Clear cross_instance_replication_config_secondary_instances value and set to empty list.
        clear-endpoints: Clear endpoints value and set to empty list.
        clear-engine-configs: Clear engine_configs value and set to empty map.
        clear-kms-key: Clear kms_key value and set to null.
        clear-labels: Clear labels value and set to empty map.
        clear-maintenance-policy: Set instance.maintenancePolicy back to default value.
        clear-maintenance-policy-weekly-window: Clear maintenance_policy_weekly_window value and set to empty list.
        clear-persistence-config: Set instance.persistenceConfig back to default value.
        clear-primary-instance: Clear primary_instance value and set to null.
        cross-instance-replication-config-role: |-
            The role of the instance in cross instance replication. _CROSS_INSTANCE_REPLICATION_CONFIG_ROLE_ must be one of:
            +
            *none*::: This instance does not participate in cross instance replication. It is
            an independent instance and does not replicate to or from any other
            instances.
            *primary*::: A instance that allows both reads and writes. Any data written to this
            instance is also replicated to the attached secondary instances.
            *secondary*::: A instance that allows only reads and replicates data from a primary
            instance.
            :::
            +
        cross-instance-replication-config-secondary-instances: |-
            Set cross_instance_replication_config_secondary_instances to new value. List of secondary instances that are replicating from this primary
            instance.
            +
            This field is only set for a primary instance.
            +
            *instance*:::
            The full resource path of the remote instance in
            the format: projects/<project>/locations/<region>/instances/<instance-id>.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --cross-instance-replication-config-secondary-instances=instance=string --cross-instance-replication-config-secondary-instances=instance=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --cross-instance-replication-config-secondary-instances='[{"instance": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --cross-instance-replication-config-secondary-instances=path_to_file.(yaml|json)
            +
            ```
        deletion-protection-enabled: If set to true deletion of the instance will fail. Use *--deletion-protection-enabled* to enable and *--no-deletion-protection-enabled* to disable.
        endpoints: |-
            Set endpoints to new value. Endpoints for the instance.
            +
            *connections*:::
            A group of PSC connections. They are created in the same VPC network, one
