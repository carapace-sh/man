name: list-resource-delegates
description: Lists the delegates associated with a resource.
flags:
    --max-results=: The number of maximum results in a page.
    --next-token=: The token used to paginate through the delegates associated with a resource.
    --organization-id=!: The identifier for the organization that contains the resource for which delegates are listed.
    --resource-id=!: The identifier for the resource whose delegates are listed.
documentation:
    command: Lists the delegates associated with a resource. Users and groups can be resource delegates and answer requests on behalf of the resource.
    flag:
        max-results: The number of maximum results in a page.
        next-token: The token used to paginate through the delegates associated with a resource.
        organization-id: The identifier for the organization that contains the resource for which delegates are listed.
        resource-id: |-
            The identifier for the resource whose delegates are listed.

            The identifier can accept *ResourceId*, *Resourcename*, or *email*. The following identity formats are available:

            - Resource ID: r-0123456789a0123456789b0123456789
            - Email address: resource@domain.tld
            - Resource name: resource
