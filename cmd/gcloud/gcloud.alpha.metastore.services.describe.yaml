name: describe
description: '*(ALPHA)*  Describe a Dataproc Metastore service.'
flags:
    --location=: The location of the Dataproc Metastore service.
documentation:
    command: |
        *(ALPHA)*  Describe a Dataproc Metastore service.

        Displays all details of a Dataproc Metastore service given a valid service ID.
    flag:
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
