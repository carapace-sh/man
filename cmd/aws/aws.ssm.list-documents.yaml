name: list-documents
description: Returns all Systems Manager (SSM) documents in the current Amazon Web Services account and Amazon Web Services Region.
flags:
    --document-filter-list=: This data type is deprecated.
    --filters=: One or more `DocumentKeyValuesFilter` objects.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
documentation:
    command: Returns all Systems Manager (SSM) documents in the current Amazon Web Services account and Amazon Web Services Region. You can limit the results of this request by using a filter.
    flag:
        document-filter-list: This data type is deprecated. Instead, use `Filters`.
        filters: |-
            One or more `DocumentKeyValuesFilter` objects. Use a filter to return a more specific list of results. For keys, you can specify one or more key-value pair tags that have been applied to a document. Other valid keys include `Owner`, `Name`, `PlatformTypes`, `DocumentType`, and `TargetType`. For example, to return documents you own use `Key=Owner,Values=Self`. To specify a custom key-value pair, use the format `Key=tag:tagName,Values=valueName`.

            This API operation only supports filtering documents by using a single tag key and one or more tag values. For example: `Key=tag:tagName,Values=valueName1,valueName2`
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
