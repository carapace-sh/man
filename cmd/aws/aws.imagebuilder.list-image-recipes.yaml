name: list-image-recipes
description: Returns a list of image recipes.
flags:
    --filters=: 'Use the following filters to streamline results:'
    --max-results=: Specify the maximum number of items to return in a request.
    --next-token=: A token to specify where to start paginating.
    --owner=: You can specify the recipe owner to filter results by that owner.
completion:
    flag:
        owner:
            - Self
            - Shared
            - Amazon
            - ThirdParty
            - AWSMarketplace
documentation:
    command: Returns a list of image recipes.
    flag:
        filters: |-
            Use the following filters to streamline results:

            - `name`
            - `parentImage`
            - `platform`
        max-results: Specify the maximum number of items to return in a request.
        next-token: A token to specify where to start paginating. This is the nextToken from a previously truncated response.
        owner: You can specify the recipe owner to filter results by that owner. By default, this request will only show image recipes owned by your account. To filter by a different owner, specify one of the `Valid Values` that are listed for this parameter.
