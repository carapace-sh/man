name: delete-billing-group
description: Deletes the billing group.
flags:
    --billing-group-name=!: The name of the billing group.
    --expected-version=: The expected version of the billing group.
documentation:
    command: |-
        Deletes the billing group.

        Requires permission to access the [DeleteBillingGroup](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        billing-group-name: The name of the billing group.
        expected-version: The expected version of the billing group. If the version of the billing group does not match the expected version specified in the request, the `DeleteBillingGroup` request is rejected with a `VersionConflictException`.
