name: create-vector-bucket
description: Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.
flags:
    --encryption-configuration=: The encryption configuration for the vector bucket.
    --vector-bucket-name=!: The name of the vector bucket to create.
documentation:
    command: |-
        Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.

        Creates a vector bucket in the Amazon Web Services Region that you want your bucket to be in.

        Permissions

        You must have the `s3vectors:CreateVectorBucket` permission to use this operation.
    flag:
        encryption-configuration: The encryption configuration for the vector bucket. By default, if you don't specify, all new vectors in Amazon S3 vector buckets use server-side encryption with Amazon S3 managed keys (SSE-S3), specifically `AES256`.
        vector-bucket-name: The name of the vector bucket to create.
