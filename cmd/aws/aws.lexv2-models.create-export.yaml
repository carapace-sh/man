name: create-export
description: Creates a zip archive containing the contents of a bot or a bot locale.
flags:
    --file-format=!: The file format of the bot or bot locale definition files.
    --file-password=: An password to use to encrypt the exported archive.
    --resource-specification=!: Specifies the type of resource to export, either a bot or a bot locale.
completion:
    flag:
        file-format:
            - LexJson
            - TSV
            - CSV
documentation:
    command: |-
        Creates a zip archive containing the contents of a bot or a bot locale. The archive contains a directory structure that contains JSON files that define the bot.

        You can create an archive that contains the complete definition of a bot, or you can specify that the archive contain only the definition of a single bot locale.

        For more information about exporting bots, and about the structure of the export archive, see [Importing and exporting bots](https://docs.aws.amazon.com/lexv2/latest/dg/importing-exporting.html)
    flag:
        file-format: The file format of the bot or bot locale definition files.
        file-password: An password to use to encrypt the exported archive. Using a password is optional, but you should encrypt the archive to protect the data in transit between Amazon Lex and your local computer.
        resource-specification: Specifies the type of resource to export, either a bot or a bot locale. You can only specify one type of resource to export.
