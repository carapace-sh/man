name: update
description: Update a Transfer Service transfer job.
flags:
    --clear-custom-storage-class: Reverts to using destination default storage class.
    --clear-delete-from: Remove a specified deletion option from the transfer job.
    --clear-description: Remove the description from the transfer job.
    --clear-destination-agent-pool: Remove the destination agent pool from the transfer job.
    --clear-event-stream: Remove the job's entire event stream configuration by clearing all scheduling all event stream flags.
    --clear-exclude-prefixes: Remove the list of object prefixes to exclude from the object conditions.
    --clear-include-modified-after-absolute: Remove the minimum modification datetime from the object conditions.
    --clear-include-modified-after-relative: Remove the minimum duration since modification from the object conditions.
    --clear-include-modified-before-absolute: Remove the maximum modification datetime from the object conditions.
    --clear-include-modified-before-relative: Remove the maximum duration since modification from the object conditions.
    --clear-include-prefixes: Remove the list of object prefixes to include from the object conditions.
    --clear-intermediate-storage-path: Remove the intermediate storage path from the transfer job.
    --clear-log-config: Remove the job's full logging config.
    --clear-manifest-file: Remove the manifest file from the transfer job.
    --clear-notification-config: Remove the job's full notification configuration to no longer receive notifications via Cloud Pub/Sub.
    --clear-notification-event-types: Remove the event types from the notification config.
    --clear-preserve-metadata: Skips preserving optional metadata fields of objects being transferred.
    --clear-s3-cloudfront-domain: Removes S3 CloudFront domain.
    --clear-schedule: Remove the job's entire schedule by clearing all scheduling flags.
    --clear-source-agent-pool: Remove the source agent pool from the transfer job.
    --clear-source-auth-method: Removes source auth method.
    --clear-source-creds-file: Remove the source creds file from the transfer job.
    --clear-source-endpoint: Removes source endpoint.
    --clear-source-list-api: Removes source list API.
    --clear-source-network-protocol: Removes source network protocol.
    --clear-source-request-model: Removes source request model.
    --clear-source-signing-region: Removes source signing region.
    --custom-storage-class=: Specifies the storage class to set on objects being transferred to Cloud Storage buckets.
    --delete-from=: By default, transfer jobs won't delete any data from your source or destination.
    --description=: An optional description to help identify the job using details that don't fit in its name.
    --destination-agent-pool=: If using a POSIX filesystem destination, specify the ID of the agent pool associated with destination filesystem.
    --destination=: The destination of your transferred data.
    --enable-posix-transfer-logs: Sets whether to generate logs for transfers with a POSIX filesystem source.
    --event-stream-expires=: Set when to stop listening for events UTC using the %Y-%m-%dT%H:%M:%S%z datetime format (e.g., 2020-04-12T06:42:12+04:00).
    --event-stream-name=: Specify an event stream that Storage Transfer Service can use to listen for when objects are created or updated.
    --event-stream-starts=: Set when to start listening for events UTC using the %Y-%m-%dT%H:%M:%S%z datetime format (e.g., 2020-04-12T06:42:12+04:00).
    --exclude-prefixes=: Exclude any objects that start with the prefix(es) entered.
    --include-modified-after-absolute=: Include objects last modified after an absolute date/time.
    --include-modified-after-relative=: Include objects that were modified after a relative date/time in the past.
    --include-modified-before-absolute=: Include objects last modified before an absolute date/time.
    --include-modified-before-relative=: Include objects that were modified before a relative date/time in the past.
    --include-prefixes=: Include only objects that start with the specified prefix(es).
    --intermediate-storage-path=: If transferring between filesystems, specify the path to a folder in a Google Cloud Storage bucket (gs://example-bucket/example-folder) to use as intermediary storage.
    --log-action-states=: The states in which the actions specified in --log-actions are logged.
    --log-actions=: Define the transfer operation actions to report in logs.
    --manifest-file=: Path to a .csv file containing a list of files to transfer from your source.
    --no-clear-custom-storage-class&: Reverts to using destination default storage class.
    --no-clear-delete-from&: Remove a specified deletion option from the transfer job.
    --no-clear-description&: Remove the description from the transfer job.
    --no-clear-destination-agent-pool&: Remove the destination agent pool from the transfer job.
    --no-clear-event-stream&: Remove the job's entire event stream configuration by clearing all scheduling all event stream flags.
    --no-clear-exclude-prefixes&: Remove the list of object prefixes to exclude from the object conditions.
    --no-clear-include-modified-after-absolute&: Remove the minimum modification datetime from the object conditions.
    --no-clear-include-modified-after-relative&: Remove the minimum duration since modification from the object conditions.
    --no-clear-include-modified-before-absolute&: Remove the maximum modification datetime from the object conditions.
    --no-clear-include-modified-before-relative&: Remove the maximum duration since modification from the object conditions.
    --no-clear-include-prefixes&: Remove the list of object prefixes to include from the object conditions.
    --no-clear-intermediate-storage-path&: Remove the intermediate storage path from the transfer job.
    --no-clear-log-config&: Remove the job's full logging config.
    --no-clear-manifest-file&: Remove the manifest file from the transfer job.
    --no-clear-notification-config&: Remove the job's full notification configuration to no longer receive notifications via Cloud Pub/Sub.
    --no-clear-notification-event-types&: Remove the event types from the notification config.
    --no-clear-preserve-metadata&: Skips preserving optional metadata fields of objects being transferred.
    --no-clear-s3-cloudfront-domain&: Removes S3 CloudFront domain.
    --no-clear-schedule&: Remove the job's entire schedule by clearing all scheduling flags.
    --no-clear-source-agent-pool&: Remove the source agent pool from the transfer job.
    --no-clear-source-auth-method&: Removes source auth method.
    --no-clear-source-creds-file&: Remove the source creds file from the transfer job.
    --no-clear-source-endpoint&: Removes source endpoint.
    --no-clear-source-list-api&: Removes source list API.
    --no-clear-source-network-protocol&: Removes source network protocol.
    --no-clear-source-request-model&: Removes source request model.
    --no-clear-source-signing-region&: Removes source signing region.
    --no-enable-posix-transfer-logs&: Sets whether to generate logs for transfers with a POSIX filesystem source.
    --notification-event-types=: Define which change of transfer operation status will trigger Pub/Sub notifications.
    --notification-payload-format=: If 'none', no transfer operation details are included with notifications.
    --notification-pubsub-topic=: Pub/Sub topic used for notifications.
    --overwrite-when=: Determine when destination objects are overwritten by source objects.
    --preserve-metadata=: Specify object metadata values that can optionally be preserved.
    --s3-cloudfront-domain=: For transfers from S3, optionally route egress traffic through a CloudFront instance.
    --schedule-repeats-every=: Set the frequency of the job using the absolute duration format (e.g., 1 month is p1m; 1 hour 30 minutes is 1h30m).
    --schedule-repeats-until=: Set when the job will stop recurring using the %Y-%m-%dT%H:%M:%S%z datetime format (e.g., 2020-04-12T06:42:12+04:00).
    --schedule-starts=: Set when the job will start using the %Y-%m-%dT%H:%M:%S%z datetime format (e.g., 2020-04-12T06:42:12+04:00).
    --source-agent-pool=: If using a POSIX filesystem source, specify the ID of the agent pool associated with source filesystem.
    --source-auth-method=: For transfers from S3-compatible sources, choose a process for adding authentication information to S3 API requests.
    --source-creds-file=: Path to a local file on your machine that includes credentials for an Amazon S3 or Azure Blob Storage source (not required for Google Cloud Storage sources).
    --source-endpoint=: For transfers from S3-compatible sources, specify your storage system's endpoint.
    --source-list-api=: For transfers from S3-compatible sources, choose the version of the S3 listing API for returning objects from the bucket.
    --source-network-protocol=: For transfers from S3-compatible sources, choose the network protocol agents should use for this job.
    --source-request-model=: For transfers from S3-compatible sources, choose which addressing style to use.
    --source-signing-region=: For transfers from S3-compatible sources, specify a region for signing requests.
    --source=: The source of your data.
    --status=: Specify this flag to change the status of the job.
completion:
    flag:
        delete-from:
            - destination-if-unique
            - source-after-transfer
        notification-payload-format:
            - json
            - none
        overwrite-when:
            - always
            - different
            - never
        source-auth-method:
            - AWS_SIGNATURE_V2
            - AWS_SIGNATURE_V4
        source-list-api:
            - LIST_OBJECTS
            - LIST_OBJECTS_V2
        source-network-protocol:
            - HTTP
            - HTTPS
        source-request-model:
            - PATH_STYLE
            - VIRTUAL_HOSTED_STYLE
        status:
            - deleted
            - disabled
            - enabled
documentation:
    command: |
        Update a Transfer Service transfer job.
    flag:
        clear-custom-storage-class: Reverts to using destination default storage class.
        clear-delete-from: Remove a specified deletion option from the transfer job. If  this flag is specified, the transfer job won't delete any data from your source or destination.
        clear-description: Remove the description from the transfer job.
        clear-destination-agent-pool: Remove the destination agent pool from the transfer job.
        clear-event-stream: Remove the job's entire event stream configuration by clearing all scheduling all event stream flags. The job will no longer listen for events unless a new configuratin is specified.
        clear-exclude-prefixes: Remove the list of object prefixes to exclude from the object conditions.
        clear-include-modified-after-absolute: Remove the minimum modification datetime from the object conditions.
        clear-include-modified-after-relative: Remove the minimum duration since modification from the object conditions.
        clear-include-modified-before-absolute: Remove the maximum modification datetime from the object conditions.
        clear-include-modified-before-relative: Remove the maximum duration since modification from the object conditions.
        clear-include-prefixes: Remove the list of object prefixes to include from the object conditions.
        clear-intermediate-storage-path: Remove the intermediate storage path from the transfer job.
        clear-log-config: Remove the job's full logging config.
        clear-manifest-file: Remove the manifest file from the transfer job.
        clear-notification-config: Remove the job's full notification configuration to no longer receive notifications via Cloud Pub/Sub.
        clear-notification-event-types: Remove the event types from the notification config.
        clear-preserve-metadata: Skips preserving optional metadata fields of objects being transferred.
        clear-s3-cloudfront-domain: Removes S3 CloudFront domain.
        clear-schedule: Remove the job's entire schedule by clearing all scheduling flags. The job will no longer run unless an operation is manually started or a new schedule is specified.
        clear-source-agent-pool: Remove the source agent pool from the transfer job.
        clear-source-auth-method: Removes source auth method.
        clear-source-creds-file: Remove the source creds file from the transfer job.
        clear-source-endpoint: Removes source endpoint.
        clear-source-list-api: Removes source list API.
        clear-source-network-protocol: Removes source network protocol.
        clear-source-request-model: Removes source request model.
        clear-source-signing-region: Removes source signing region.
        custom-storage-class: |-
            Specifies the storage class to set on objects being transferred to Cloud Storage buckets. If unspecified, the objects' storage class is set to the destination bucket default. Valid values are:
            +
             - Any of the values listed in the Cloud Storage documentation:   [Available storage classes](https://cloud.google.com/storage/docs/storage-classes#classes).
             - `preserve` - Preserves each object's original storage class. Only   supported for transfers between Cloud Storage buckets.
            +
            Custom storage class settings are ignored if the destination bucket is [Autoclass-enabled](https://cloud.google.com/storage/docs/autoclass). Objects transferred into Autoclass-enabled buckets are initially set to the `STANDARD` storage class.
        delete-from: |-
            By default, transfer jobs won't delete any data from your source or destination. These options enable you to delete data if needed for your use case. Options include:
             - 'destination-if-unique' - Delete files from destination if they're not also at source. Use to sync destination to source (i.e., make destination match source exactly)
             - 'source-after-transfer' - Delete files from source after they're transferred
            +
            _DELETE_FROM_ must be one of: *destination-if-unique*, *source-after-transfer*.
        description: An optional description to help identify the job using details that don't fit in its name.
        destination: |-
            The destination of your transferred data. Available destinations and  formatting information:
            +
            Google Cloud Storage - Specify the `gs://` scheme; name of the bucket; and, if transferring to a folder, the path to the folder. For example:
            * gs://example-bucket/example-folder/
            +
            POSIX filesystem - Specify the `posix://` scheme followed by the absolute path to the desired directory, starting from the root of the host machine (denoted by a leading slash). For example:
            * posix:///path/directory/
            +
            A file transfer agent must be installed on the POSIX filesystem, and you need an agent pool flag on this `jobs` command to activate the agent.
        destination-agent-pool: If using a POSIX filesystem destination, specify the ID of the agent pool associated with destination filesystem.
        enable-posix-transfer-logs: Sets whether to generate logs for transfers with a POSIX filesystem source. This setting will later be merged with other log configurations. Use *--enable-posix-transfer-logs* to enable and *--no-enable-posix-transfer-logs* to disable.
        event-stream-expires: Set when to stop listening for events UTC using the %Y-%m-%dT%H:%M:%S%z datetime format (e.g., 2020-04-12T06:42:12+04:00). If not set, the job will continue running and listening for events indefinitely.
        event-stream-name: Specify an event stream that Storage Transfer Service can use to listen for when objects are created or updated. For Google Cloud Storage sources, specify a Cloud Pub/Sub subscription, using format "projects/yourproject/subscriptions/yoursubscription". For Amazon S3 sources, specify the Amazon Resource Name (ARN) of an Amazon Simple Queue Service (SQS) queue using format "arn:aws:sqs:region:account_id:queue_name".
        event-stream-starts: Set when to start listening for events UTC using the %Y-%m-%dT%H:%M:%S%z datetime format (e.g., 2020-04-12T06:42:12+04:00). If not set, the job will start running and listening for events upon the successful submission of the create job command.
        exclude-prefixes: Exclude any objects that start with the prefix(es) entered. Separate multiple prefixes with commas, omitting spaces after the commas (e.g., --exclude-prefixes=foo,bar).
        include-modified-after-absolute: Include objects last modified after an absolute date/time. Ex. by specifying '2020-01-01', the transfer would include objects last modified after January 1, 2020. Use the %Y-%m-%dT%H:%M:%S%z datetime format.
        include-modified-after-relative: Include objects that were modified after a relative date/time in the past. Ex. by specifying a duration of '10d', the transfer would include objects last modified *less than* 10 days before its start time. Use the absolute duration format (ex. 1m for 1 month; 1h30m for 1 hour 30 minutes).
        include-modified-before-absolute: Include objects last modified before an absolute date/time. Ex. by specifying '2020-01-01', the transfer would include objects last modified before January 1, 2020. Use the %Y-%m-%dT%H:%M:%S%z datetime format.
        include-modified-before-relative: Include objects that were modified before a relative date/time in the past. Ex. by specifying a duration of '10d', the transfer would include objects last modified *more than* 10 days before its start time. Use the absolute duration format (ex. 1m for 1 month; 1h30m for 1 hour 30 minutes).
        include-prefixes: Include only objects that start with the specified prefix(es). Separate multiple prefixes with commas, omitting spaces after the commas (e.g., --include-prefixes=foo,bar).
        intermediate-storage-path: 'If transferring between filesystems, specify the path to a folder in a Google Cloud Storage bucket (gs://example-bucket/example-folder) to use as intermediary storage. Recommended: Use an empty folder reserved for this transfer job to ensure transferred data doesn''t interact with any of your existing Cloud Storage data.'
        log-action-states: 'The states in which the actions specified in --log-actions are logged. Separate multiple states with a comma, omitting the space after the comma (e.g., --log-action-states=succeeded,failed). _LOG_ACTION_STATES_ must be one of: *failed*, *skipped*, *succeeded*.'
        log-actions: 'Define the transfer operation actions to report in logs. Separate multiple actions with commas, omitting spaces after the commas (e.g., --log-actions=find,copy). _LOG_ACTIONS_ must be one of: *copy*, *delete*, *find*.'
        manifest-file: Path to a .csv file containing a list of files to transfer from your source. For manifest files in Cloud Storage, specify the absolute path (e.g., `gs://mybucket/manifest.csv`). For manifest files stored in a source or destination POSIX file system, provide the relative path (e.g., `source://path/to/manfest.csv` or `destination://path/to/manifest.csv`). For manifest file formatting, see https://cloud.google.com/storage-transfer/docs/manifest.
        no-clear-custom-storage-class: Reverts to using destination default storage class.
        no-clear-delete-from: Remove a specified deletion option from the transfer job. If  this flag is specified, the transfer job won't delete any data from your source or destination.
        no-clear-description: Remove the description from the transfer job.
        no-clear-destination-agent-pool: Remove the destination agent pool from the transfer job.
        no-clear-event-stream: Remove the job's entire event stream configuration by clearing all scheduling all event stream flags. The job will no longer listen for events unless a new configuratin is specified.
        no-clear-exclude-prefixes: Remove the list of object prefixes to exclude from the object conditions.
        no-clear-include-modified-after-absolute: Remove the minimum modification datetime from the object conditions.
        no-clear-include-modified-after-relative: Remove the minimum duration since modification from the object conditions.
        no-clear-include-modified-before-absolute: Remove the maximum modification datetime from the object conditions.
        no-clear-include-modified-before-relative: Remove the maximum duration since modification from the object conditions.
        no-clear-include-prefixes: Remove the list of object prefixes to include from the object conditions.
        no-clear-intermediate-storage-path: Remove the intermediate storage path from the transfer job.
        no-clear-log-config: Remove the job's full logging config.
        no-clear-manifest-file: Remove the manifest file from the transfer job.
        no-clear-notification-config: Remove the job's full notification configuration to no longer receive notifications via Cloud Pub/Sub.
        no-clear-notification-event-types: Remove the event types from the notification config.
        no-clear-preserve-metadata: Skips preserving optional metadata fields of objects being transferred.
        no-clear-s3-cloudfront-domain: Removes S3 CloudFront domain.
        no-clear-schedule: Remove the job's entire schedule by clearing all scheduling flags. The job will no longer run unless an operation is manually started or a new schedule is specified.
        no-clear-source-agent-pool: Remove the source agent pool from the transfer job.
        no-clear-source-auth-method: Removes source auth method.
        no-clear-source-creds-file: Remove the source creds file from the transfer job.
        no-clear-source-endpoint: Removes source endpoint.
        no-clear-source-list-api: Removes source list API.
        no-clear-source-network-protocol: Removes source network protocol.
        no-clear-source-request-model: Removes source request model.
        no-clear-source-signing-region: Removes source signing region.
        no-enable-posix-transfer-logs: Sets whether to generate logs for transfers with a POSIX filesystem source. This setting will later be merged with other log configurations.
        notification-event-types: 'Define which change of transfer operation status will trigger Pub/Sub notifications. Choices include ''success'', ''failed'', ''aborted''. To trigger notifications for all three status changes, you can leave this flag unspecified as long as you''ve specified a topic for the --notification-pubsub-topic flag. _EVENT_TYPES_ must be one of: *success*, *failed*, *aborted*.'
        notification-payload-format: 'If ''none'', no transfer operation details are included with notifications. If ''json'', a json representation of the relevant transfer operation is included in notification messages (e.g., to see errors after an operation fails). _NOTIFICATION_PAYLOAD_FORMAT_ must be one of: *json*, *none*.'
        notification-pubsub-topic: Pub/Sub topic used for notifications.
        overwrite-when: |-
            Determine when destination objects are overwritten by source objects. Options include:
             - 'different' - Overwrites files with the same name if the contents are different (e.g., if etags or checksums don't match)
             - 'always' - Overwrite destination file whenever source file has the same name -- even if they're identical
             - 'never' - Never overwrite destination file when source file has the same name
            +
            _OVERWRITE_WHEN_ must be one of: *always*, *different*, *never*.
        preserve-metadata: |-
            Specify object metadata values that can optionally be preserved. Example: --preserve-metadata=storage-class,uid
            +
            For more info, see: https://cloud.google.com/storage-transfer/docs/metadata-preservation.
            +
            _METADATA_FIELDS_ must be one of: *acl*, *gid*, *kms-key*, *mode*, *storage-class*, *symlink*, *temporary-hold*, *time-created*, *uid*.
        s3-cloudfront-domain: 'For transfers from S3, optionally route egress traffic through a CloudFront instance. Supply the endpoint of the CloudFront instance: https://example.cloudfront.net. See documentation (https://cloud.google.com/storage-transfer/docs/s3-cloudfront) for more information.'
        schedule-repeats-every: Set the frequency of the job using the absolute duration format (e.g., 1 month is p1m; 1 hour 30 minutes is 1h30m). If not set, the job will run once.
        schedule-repeats-until: Set when the job will stop recurring using the %Y-%m-%dT%H:%M:%S%z datetime format (e.g., 2020-04-12T06:42:12+04:00). If specified, you must also include a value for the --schedule-repeats-every flag. If not specified, the job will continue to repeat as specified in its repeat-every field unless the job is manually disabled or you add this field later.
        schedule-starts: Set when the job will start using the %Y-%m-%dT%H:%M:%S%z datetime format (e.g., 2020-04-12T06:42:12+04:00). If not set, the job will run upon the successful submission of the create job command unless the --do-not-run flag is included.
        source: |-
            The source of your data. Available sources and formatting information:
            +
            Public clouds -
            * [Google Cloud Storage] gs://example-bucket/example-folder/
            * [Amazon S3] s3://examplebucket/example-folder
            * [Azure Blob Storage or Data Lake Storage] http://examplestorageaccount.blob.core.windows.net/examplecontainer/examplefolder
            +
            POSIX filesystem - Specify the `posix://` scheme followed by the absolute path to the desired directory, starting from the root of the host machine (denoted by a leading slash). For example:
            * posix:///path/directory/
            +
            A file transfer agent must be installed on the POSIX filesystem, and you need an agent pool flag on this `jobs` command to activate the agent.
            +
            Hadoop Distributed File System (HDFS) - Specify the `hdfs://` scheme followed by the absolute path to the desired directory, starting from the root of the file system (denoted by a leading slash). For example:
            * hdfs:///path/directory/
            +
            Namenode details should not be included in the path specification, as they are required separately during the agent installation process.
            +
            A file transfer agent must be installed, and you need an agent pool flag on this `jobs` command to activate the agent.
            +
            Publicly-accessible objects - Specify the URL of a TSV file containing a list of URLs of publicly-accessible objects. For example:
            * http://example.com/tsvfile
        source-agent-pool: If using a POSIX filesystem source, specify the ID of the agent pool associated with source filesystem.
        source-auth-method: 'For transfers from S3-compatible sources, choose a process for adding authentication information to S3 API requests. Refer to AWS''s SigV4 (https://docs.aws.amazon.com/general/latest/gr/signature-version-4.html) and SigV2 (https://docs.aws.amazon.com/general/latest/gr/signature-version-2.html) documentation for more information. _SOURCE_AUTH_METHOD_ must be one of: *AWS_SIGNATURE_V2*, *AWS_SIGNATURE_V4*.'
        source-creds-file: |-
            Path to a local file on your machine that includes credentials for an Amazon S3 or Azure Blob Storage source (not required for Google Cloud Storage sources). If not specified for an S3 source, gcloud will check your system for an AWS config file. However, this flag must be specified to use AWS's "role_arn" auth service. For formatting, see:
            +
            S3: https://cloud.google.com/storage-transfer/docs/reference/rest/v1/TransferSpec#AwsAccessKey
            Note: Be sure to put quotations around the JSON value strings.
            +
            Azure: https://cloud.google.com/storage-transfer/docs/reference/rest/v1/TransferSpec#AzureCredentials
        source-endpoint: For transfers from S3-compatible sources, specify your storage system's endpoint. Check with your provider for formatting (ex. s3.us-east-1.amazonaws.com for Amazon S3).
        source-list-api: 'For transfers from S3-compatible sources, choose the version of the S3 listing API for returning objects from the bucket. Refer to AWS''s ListObjectsV2 (https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html) and ListObjects (https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjects.html) documentation for more information. _SOURCE_LIST_API_ must be one of: *LIST_OBJECTS*, *LIST_OBJECTS_V2*.'
        source-network-protocol: 'For transfers from S3-compatible sources, choose the network protocol agents should use for this job. _SOURCE_NETWORK_PROTOCOL_ must be one of: *HTTP*, *HTTPS*.'
        source-request-model: 'For transfers from S3-compatible sources, choose which addressing style to use. Determines if the bucket name is in the hostname or part of the URL. For example, https://s3.region.amazonaws.com/bucket-name/key-name for path style and Ex. https://bucket-name.s3.region.amazonaws.com/key-name for virtual-hosted style. _SOURCE_REQUEST_MODEL_ must be one of: *PATH_STYLE*, *VIRTUAL_HOSTED_STYLE*.'
        source-signing-region: For transfers from S3-compatible sources, specify a region for signing requests. You can leave this unspecified if your storage provider doesn't require a signing region.
        status: 'Specify this flag to change the status of the job. Options include ''enabled'', ''disabled'', ''deleted''. _STATUS_ must be one of: *deleted*, *disabled*, *enabled*.'
