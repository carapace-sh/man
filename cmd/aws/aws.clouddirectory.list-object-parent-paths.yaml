name: list-object-parent-paths
description: Retrieves all available parent paths for any object type such as node, leaf node, policy node, and index node objects.
flags:
    --directory-arn=!: The ARN of the directory to which the parent path applies.
    --max-results=: The maximum number of items to be retrieved in a single call.
    --next-token=: The pagination token.
    --object-reference=!: The reference that identifies the object whose parent paths are listed.
documentation:
    command: |-
        Retrieves all available parent paths for any object type such as node, leaf node, policy node, and index node objects. For more information about objects, see [Directory Structure](https://docs.aws.amazon.com/clouddirectory/latest/developerguide/key_concepts_directorystructure.html).

        Use this API to evaluate all parents for an object. The call returns all objects from the root of the directory up to the requested object. The API returns the number of paths based on user-defined `MaxResults`, in case there are multiple paths to the parent. The order of the paths and nodes returned is consistent among multiple API calls unless the objects are deleted or moved. Paths not leading to the directory root are ignored from the target object.
    flag:
        directory-arn: The ARN of the directory to which the parent path applies.
        max-results: The maximum number of items to be retrieved in a single call. This is an approximate number.
        next-token: The pagination token.
        object-reference: The reference that identifies the object whose parent paths are listed.
