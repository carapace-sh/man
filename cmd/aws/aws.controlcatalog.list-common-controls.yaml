name: list-common-controls
description: Returns a paginated list of common controls from the Amazon Web Services Control Catalog.
flags:
    --common-control-filter=: An optional filter that narrows the results to a specific objective.
    --max-results=: The maximum number of results on a page or for an API request call.
    --next-token=: The pagination token that's used to fetch the next set of results.
documentation:
    command: |-
        Returns a paginated list of common controls from the Amazon Web Services Control Catalog.

        You can apply an optional filter to see common controls that have a specific objective. If you don’t provide a filter, the operation returns all common controls.
    flag:
        common-control-filter: |-
            An optional filter that narrows the results to a specific objective.

            This filter allows you to specify one objective ARN at a time. Passing multiple ARNs in the `CommonControlFilter` isn’t supported.
        max-results: The maximum number of results on a page or for an API request call.
        next-token: The pagination token that's used to fetch the next set of results.
