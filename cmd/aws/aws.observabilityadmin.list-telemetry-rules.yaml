name: list-telemetry-rules
description: Lists all telemetry rules in your account.
flags:
    --max-results=: The maximum number of telemetry rules to return in a single call.
    --next-token=: The token for the next set of results.
    --rule-name-prefix=: A string to filter telemetry rules whose names begin with the specified prefix.
documentation:
    command: Lists all telemetry rules in your account. You can filter the results by specifying a rule name prefix.
    flag:
        max-results: The maximum number of telemetry rules to return in a single call.
        next-token: The token for the next set of results. A previous call generates this token.
        rule-name-prefix: A string to filter telemetry rules whose names begin with the specified prefix.
