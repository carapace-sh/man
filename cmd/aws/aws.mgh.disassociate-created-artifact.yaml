name: disassociate-created-artifact
description: Disassociates a created artifact of an AWS resource with a migration task performed by a migration tool that was previously associated.
flags:
    --created-artifact-name=!: An ARN of the AWS resource related to the migration (e.g., AMI, EC2 instance, RDS instance, etc.)
    --dry-run=: Optional boolean flag to indicate whether any effect should take place.
    --migration-task-name=!: Unique identifier that references the migration task to be disassociated with the artifact.
    --progress-update-stream=!: The name of the ProgressUpdateStream.
documentation:
    command: |-
        Disassociates a created artifact of an AWS resource with a migration task performed by a migration tool that was previously associated. This API has the following traits:

        - A migration user can call the `DisassociateCreatedArtifacts` operation to disassociate a created AWS Artifact from a migration task.
        - The created artifact name must be provided in ARN (Amazon Resource Name) format which will contain information about type and region; for example: `arn:aws:ec2:us-east-1:488216288981:image/ami-6d0ba87b`.
        - Examples of the AWS resource behind the created artifact are, AMI's, EC2 instance, or RDS instance, etc.
    flag:
        created-artifact-name: An ARN of the AWS resource related to the migration (e.g., AMI, EC2 instance, RDS instance, etc.)
        dry-run: Optional boolean flag to indicate whether any effect should take place. Used to test if the caller has permission to make the call.
        migration-task-name: Unique identifier that references the migration task to be disassociated with the artifact. *Do not store personal data in this field.*
        progress-update-stream: The name of the ProgressUpdateStream.
