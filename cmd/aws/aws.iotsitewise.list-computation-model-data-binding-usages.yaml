name: list-computation-model-data-binding-usages
description: Lists all data binding usages for computation models.
flags:
    --data-binding-value-filter=!: A filter used to limit the returned data binding usages based on specific data binding values.
    --max-results=: The maximum number of results returned for each paginated request.
    --next-token=: The token used for the next set of paginated results.
documentation:
    command: Lists all data binding usages for computation models. This allows to identify where specific data bindings are being utilized across the computation models. This track dependencies between data sources and computation models.
    flag:
        data-binding-value-filter: A filter used to limit the returned data binding usages based on specific data binding values. You can filter by asset, asset model, asset property, or asset model property to find all computation models using these specific data sources.
        max-results: The maximum number of results returned for each paginated request.
        next-token: The token used for the next set of paginated results.
