name: delete-dbcluster-endpoint
description: Deletes a custom endpoint and removes it from an Amazon Aurora DB cluster.
flags:
    --dbcluster-endpoint-identifier=!: The identifier associated with the custom endpoint.
documentation:
    command: |-
        Deletes a custom endpoint and removes it from an Amazon Aurora DB cluster.

        This action only applies to Aurora DB clusters.
    flag:
        dbcluster-endpoint-identifier: The identifier associated with the custom endpoint. This parameter is stored as a lowercase string.
