name: list-dashboards
description: Returns a list of the dashboards for your account.
flags:
    --dashboard-name-prefix=: If you specify this parameter, only the dashboards with names starting with the specified string are listed.
    --next-token=: The token returned by a previous call to indicate that there is more data available.
documentation:
    command: |-
        Returns a list of the dashboards for your account. If you include `DashboardNamePrefix`, only those dashboards with names starting with the prefix are listed. Otherwise, all dashboards in your account are listed.

        `ListDashboards` returns up to 1000 results on one page. If there are more than 1000 dashboards, you can call `ListDashboards` again and include the value you received for `NextToken` in the first call, to receive the next 1000 results.
    flag:
        dashboard-name-prefix: If you specify this parameter, only the dashboards with names starting with the specified string are listed. The maximum length is 255, and valid characters are A-Z, a-z, 0-9, ".", "-", and "\_".
        next-token: The token returned by a previous call to indicate that there is more data available.
