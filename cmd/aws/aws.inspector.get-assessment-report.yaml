name: get-assessment-report
description: Produces an assessment report that includes detailed and comprehensive results of a specified assessment run.
flags:
    --assessment-run-arn=!: The ARN that specifies the assessment run for which you want to generate a report.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --report-file-format=!: Specifies the file format (html or pdf) of the assessment report that you want to generate.
    --report-type=!: Specifies the type of the assessment report that you want to generate.
completion:
    flag:
        report-file-format:
            - HTML
            - PDF
        report-type:
            - FINDING
            - FULL
documentation:
    command: Produces an assessment report that includes detailed and comprehensive results of a specified assessment run.
    flag:
        assessment-run-arn: The ARN that specifies the assessment run for which you want to generate a report.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        report-file-format: Specifies the file format (html or pdf) of the assessment report that you want to generate.
        report-type: 'Specifies the type of the assessment report that you want to generate. There are two types of assessment reports: a finding report and a full report. For more information, see [Assessment Reports](https://docs.aws.amazon.com/inspector/latest/userguide/inspector_reports.html).'
