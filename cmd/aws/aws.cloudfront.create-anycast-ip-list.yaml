name: create-anycast-ip-list
description: Creates an Anycast static IP list.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip-address-type=: The IP address type for the Anycast static IP list.
    --ip-count=!: The number of static IP addresses that are allocated to the Anycast static IP list.
    --ipam-cidr-configs=:
        description: A list of IPAM CIDR configurations that specify the IP address ranges and IPAM pool settings for creating the Anycast static IP list.
        nargs: -1
    --name=!: Name of the Anycast static IP list.
    --tags=: ""
completion:
    flag:
        ip-address-type:
            - ipv4
            - ipv6
            - dualstack
documentation:
    command: Creates an Anycast static IP list.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip-address-type: |-
            The IP address type for the Anycast static IP list. You can specify one of the following options:

            - `ipv4` only
            - `ipv6` only
            - `dualstack` - Allocate a list of both IPv4 and IPv6 addresses
        ip-count: 'The number of static IP addresses that are allocated to the Anycast static IP list. Valid values: 21 or 3.'
        ipam-cidr-configs: A list of IPAM CIDR configurations that specify the IP address ranges and IPAM pool settings for creating the Anycast static IP list.
        name: Name of the Anycast static IP list.
        tags: ""
