name: get-generated-template
description: Retrieves a generated template.
flags:
    --format=: The language to use to retrieve for the generated template.
    --generated-template-name=!: The name or Amazon Resource Name (ARN) of the generated template.
completion:
    flag:
        format:
            - JSON
            - YAML
documentation:
    command: Retrieves a generated template. If the template is in an `InProgress` or `Pending` status then the template returned will be the template when the template was last in a `Complete` status. If the template has not yet been in a `Complete` status then an empty template will be returned.
    flag:
        format: |-
            The language to use to retrieve for the generated template. Supported values are:

            - `JSON`
            - `YAML`
        generated-template-name: The name or Amazon Resource Name (ARN) of the generated template. The format is `arn:${Partition}:cloudformation:${Region}:${Account}:generatedtemplate/${Id}`. For example, `arn:aws:cloudformation:us-east-1:123456789012:generatedtemplate/2e8465c1-9a80-43ea-a3a3-4f2d692fe6dc`.
