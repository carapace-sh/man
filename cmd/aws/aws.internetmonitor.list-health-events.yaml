name: list-health-events
description: Lists all health events for a monitor in Amazon CloudWatch Internet Monitor.
flags:
    --end-time=: The time when a health event ended.
    --event-status=: The status of a health event.
    --linked-account-id=: The account ID for an account that you've set up cross-account sharing for in Amazon CloudWatch Internet Monitor.
    --max-results=: The number of health event objects that you want to return with this call.
    --monitor-name=!: The name of the monitor.
    --next-token=: The token for the next set of results.
    --start-time=: The time when a health event started.
completion:
    flag:
        event-status:
            - ACTIVE
            - RESOLVED
documentation:
    command: |-
        Lists all health events for a monitor in Amazon CloudWatch Internet Monitor. Returns information for health events including the event start and end times, and the status.

        Health events that have start times during the time frame that is requested are not included in the list of health events.
    flag:
        end-time: The time when a health event ended. If the health event is still ongoing, then the end time is not set.
        event-status: The status of a health event.
        linked-account-id: The account ID for an account that you've set up cross-account sharing for in Amazon CloudWatch Internet Monitor. You configure cross-account sharing by using Amazon CloudWatch Observability Access Manager. For more information, see [Internet Monitor cross-account observability](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cwim-cross-account.html) in the Amazon CloudWatch Internet Monitor User Guide.
        max-results: The number of health event objects that you want to return with this call.
        monitor-name: The name of the monitor.
        next-token: The token for the next set of results. You receive this token from a previous call.
        start-time: The time when a health event started.
