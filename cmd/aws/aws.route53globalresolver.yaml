    - name: create-firewall-rule
      description: Creates a DNS firewall rule.
      flags:
        --action=!: 'The action that DNS Firewall should take on a DNS query when it matches one of the domains in the rule''s domain list:'
        --block-override-dns-type=: The DNS record's type.
        --block-override-domain=: The custom DNS record to send back in response to the query.
        --block-override-ttl=: The recommended amount of time, in seconds, for the DNS resolver or web browser to cache the provided override record.
        --block-response=: The response to return when the action is BLOCK.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier to ensure idempotency.
        --confidence-threshold=: The confidence threshold for advanced threat detection.
        --description=: An optional description for the firewall rule.
        --dns-advanced-protection=: Whether to enable advanced DNS threat protection for this rule.
        --dns-view-id=!: The ID of the DNS view to associate with this firewall rule.
        --firewall-domain-list-id=: The ID of the firewall domain list to use in this rule.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --name=!: A descriptive name for the firewall rule.
        --priority=: The priority of this rule.
        --q-type=: The DNS query type to match for this rule.
      completion:
        flag:
            action:
                - ALLOW
                - ALERT
                - BLOCK
            block-override-dns-type:
                - CNAME
            block-response:
                - NODATA
                - NXDOMAIN
                - OVERRIDE
            confidence-threshold:
                - LOW
                - MEDIUM
                - HIGH
            dns-advanced-protection:
                - DGA
                - DNS_TUNNELING
                - DICTIONARY_DGA
      documentation:
        command: |-
            Creates a DNS firewall rule. Firewall rules define actions (ALLOW, BLOCK, or ALERT) to take on DNS queries that match specified domain lists, managed domain lists, or advanced threat protections.

            Route 53 Global Resolver is a global service that supports resolvers in multiple Amazon Web Services Regions but you must specify the US East (Ohio) Region to create, update, or otherwise work with Route 53 Global Resolver resources. That is, for example, specify `--region us-east-2` on Amazon Web Services CLI commands.
        flag:
            action: |-
                The action that DNS Firewall should take on a DNS query when it matches one of the domains in the rule's domain list:

                - `ALLOW` - Permit the request to go through.
                - `ALERT` - Permit the request and send metrics and logs to CloudWatch.
                - `BLOCK` - Disallow the request. This option requires additional details in the rule's `BlockResponse`.
            block-override-dns-type: |-
                The DNS record's type. This determines the format of the record value that you provided in `BlockOverrideDomain`. Used for the rule action `BLOCK` with a `BlockResponse` setting of `OVERRIDE`.

                This setting is required if the `BlockResponse` setting is `OVERRIDE`.
            block-override-domain: |-
                The custom DNS record to send back in response to the query. Used for the rule action `BLOCK` with a `BlockResponse` setting of `OVERRIDE`.

                This setting is required if the `BlockResponse` setting is `OVERRIDE`.
            block-override-ttl: |-
                The recommended amount of time, in seconds, for the DNS resolver or web browser to cache the provided override record. Used for the rule action `BLOCK` with a `BlockResponse` setting of `OVERRIDE`.

                This setting is required if the `BlockResponse` setting is `OVERRIDE`.
            block-response: The response to return when the action is BLOCK. Valid values are NXDOMAIN (domain does not exist), NODATA (domain exists but no records), or OVERRIDE (return custom response).
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            client-token: A unique, case-sensitive identifier to ensure idempotency. This means that making the same request multiple times with the same `clientToken` has the same result every time.
            confidence-threshold: The confidence threshold for advanced threat detection. Valid values are HIGH, MEDIUM, or LOW, indicating the accuracy level required for threat detection.
            description: An optional description for the firewall rule.
            dns-advanced-protection: Whether to enable advanced DNS threat protection for this rule. Advanced protection can detect and block DNS tunneling and Domain Generation Algorithm (DGA) threats.
            dns-view-id: The ID of the DNS view to associate with this firewall rule.
            firewall-domain-list-id: The ID of the firewall domain list to use in this rule.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            name: A descriptive name for the firewall rule.
            priority: The priority of this rule. Rules are evaluated in priority order, with lower numbers having higher priority. When a DNS query matches multiple rules, the rule with the highest priority (lowest number) is applied.
            q-type: The DNS query type to match for this rule. Examples include A (IPv4 address), AAAA (IPv6 address), MX (mail exchange), or TXT (text record).
    - name: create-global-resolver
      description: Creates a new Route 53 Global Resolver instance.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique string that identifies the request and ensures idempotency.
        --description=: An optional description for the Route 53 Global Resolver instance.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --ip-address-type=: The IP address type for the Route 53 Global Resolver.
        --name=!: A descriptive name for the Route 53 Global Resolver instance.
        --observability-region=: The Amazon Web Services Region where query resolution logs and metrics will be aggregated and delivered.
        --regions=!:
            description: List of Amazon Web Services Regions where the Route 53 Global Resolver will operate.
            nargs: -1
        --tags=: Tags to associate with the Route 53 Global Resolver.
      completion:
        flag:
            ip-address-type:
                - IPV4
                - DUAL_STACK
      documentation:
        command: |-
            Creates a new Route 53 Global Resolver instance. A Route 53 Global Resolver is a global, internet-accessible DNS resolver that provides secure DNS resolution for both public and private domains through global anycast IP addresses.

