name: describe-what-if-analysis
description: Describes the what-if analysis created using the [CreateWhatIfAnalysis]() operation.
flags:
    --what-if-analysis-arn=!: The Amazon Resource Name (ARN) of the what-if analysis that you are interested in.
documentation:
    command: |-
        Describes the what-if analysis created using the [CreateWhatIfAnalysis]() operation.

        In addition to listing the properties provided in the `CreateWhatIfAnalysis` request, this operation lists the following properties:

        - `CreationTime`
        - `LastModificationTime`
        - `Message` - If an error occurred, information about the error.
        - `Status`
    flag:
        what-if-analysis-arn: The Amazon Resource Name (ARN) of the what-if analysis that you are interested in.
