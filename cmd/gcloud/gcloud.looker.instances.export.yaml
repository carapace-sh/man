name: export
description: Export a Looker instance.
flags:
    --kms-key=!: Fully qualified identifier (name) for the key.
    --region=: The region of the instance.
    --target-gcs-uri=: The path to the folder in Google Cloud Storage where the export will be stored.
documentation:
    command: |-
        This command can fail for the following reasons:
              * The instance specified does not exist.
              * The active account does not have permission to access the given
                instance.
              * The Google Cloud Storage bucket does not exist.
    flag:
        kms-key: Fully qualified identifier (name) for the key.
        region: |-
            The region of the instance.
            +
            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        target-gcs-uri: The path to the folder in Google Cloud Storage where the export will be stored. The URI is in the form `gs://bucketName/folderName`. The Looker Service Agent should have the role Storage Object Creator.
