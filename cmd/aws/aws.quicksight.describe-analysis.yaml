name: describe-analysis
description: Provides a summary of the metadata for an analysis.
flags:
    --analysis-id=!: The ID of the analysis that you're describing.
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the analysis.
documentation:
    command: Provides a summary of the metadata for an analysis.
    flag:
        analysis-id: The ID of the analysis that you're describing. The ID is part of the URL of the analysis.
        aws-account-id: The ID of the Amazon Web Services account that contains the analysis. You must be using the Amazon Web Services account that the analysis is in.
