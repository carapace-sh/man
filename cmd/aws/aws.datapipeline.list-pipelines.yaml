name: list-pipelines
description: Lists the pipeline identifiers for all active pipelines that you have permission to access.
flags:
    --marker=: The starting point for the results to be returned.
documentation:
    command: Lists the pipeline identifiers for all active pipelines that you have permission to access.
    flag:
        marker: The starting point for the results to be returned. For the first call, this value should be empty. As long as there are more results, continue to call `ListPipelines` with the marker value from the previous call to retrieve the next set of results.
