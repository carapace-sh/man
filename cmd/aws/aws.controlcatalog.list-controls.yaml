name: list-controls
description: Returns a paginated list of all available controls in the Control Catalog library.
flags:
    --filter=: An optional filter that narrows the results to controls with specific implementation types or identifiers.
    --max-results=: The maximum number of results on a page or for an API request call.
    --next-token=: The pagination token that's used to fetch the next set of results.
documentation:
    command: Returns a paginated list of all available controls in the Control Catalog library. Allows you to discover available controls. The list of controls is given as structures of type *controlSummary*. The ARN is returned in the global *controlcatalog* format, as shown in the examples.
    flag:
        filter: An optional filter that narrows the results to controls with specific implementation types or identifiers. If you don't provide a filter, the operation returns all available controls.
        max-results: The maximum number of results on a page or for an API request call.
        next-token: The pagination token that's used to fetch the next set of results.
