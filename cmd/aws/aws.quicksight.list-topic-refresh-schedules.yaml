name: list-topic-refresh-schedules
description: Lists all of the refresh schedules for a topic.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the topic whose refresh schedule you want described.
    --topic-id=!: The ID for the topic that you want to describe.
documentation:
    command: Lists all of the refresh schedules for a topic.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the topic whose refresh schedule you want described.
        topic-id: The ID for the topic that you want to describe. This ID is unique per Amazon Web Services Region for each Amazon Web Services account.
