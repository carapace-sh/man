            --remove-hubs=path_to_file.(yaml|json)
            +
            ```
        remove-proxy-protocol-config-allowed-client-headers: Remove existing value from proxy_protocol_config_allowed_client_headers list.
        remove-proxy-protocol-config-metadata-headers: |-
            Remove existing value from map proxy_protocol_config_metadata_headers. Sets `remove_proxy_protocol_config_metadata_headers` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-proxy-protocol-config-metadata-headers=string,string
            +
            ```
            +
            *JSON Example:*
