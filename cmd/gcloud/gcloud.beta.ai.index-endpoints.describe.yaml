name: describe
description: '*(BETA)*  Gets detailed index endpoint information about the given index endpoint id.'
flags:
    --region=: Cloud region for the index_endpoint.
documentation:
    command: |-
        ## EXAMPLES

        Describe an index endpoint `123` of project `example` in region `us-central1`,
        run:

          $ gcloud beta ai index-endpoints describe 123 --project=example --region=us-central1
    flag:
        region: |-
            Cloud region for the index_endpoint.
            +
            To set the `region` attribute:
            * provide the argument `index_endpoint` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
