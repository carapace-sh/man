name: describe-notebook-instance-lifecycle-config
description: Returns a description of a notebook instance lifecycle configuration.
flags:
    --notebook-instance-lifecycle-config-name=!: The name of the lifecycle configuration to describe.
documentation:
    command: |-
        Returns a description of a notebook instance lifecycle configuration.

        For information about notebook instance lifestyle configurations, see [Step 2.1: (Optional) Customize a Notebook Instance](https://docs.aws.amazon.com/sagemaker/latest/dg/notebook-lifecycle-config.html).
    flag:
        notebook-instance-lifecycle-config-name: The name of the lifecycle configuration to describe.
