name: create-environment
description: Creates an environment.
flags:
    --application-id=!: The application ID.
    --description=: A description of the environment.
    --monitors=: Amazon CloudWatch alarms to monitor during the deployment process.
    --name=!: A name for the environment.
    --tags=: Metadata to assign to the environment.
documentation:
    command: Creates an environment. For each application, you define one or more environments. An environment is a deployment group of AppConfig targets, such as applications in a `Beta` or `Production` environment. You can also define environments for application subcomponents such as the `Web`, `Mobile` and `Back-end` components for your application. You can configure Amazon CloudWatch alarms for each environment. The system monitors alarms during a configuration deployment. If an alarm is triggered, the system rolls back the configuration.
    flag:
        application-id: The application ID.
        description: A description of the environment.
        monitors: Amazon CloudWatch alarms to monitor during the deployment process.
        name: A name for the environment.
        tags: Metadata to assign to the environment. Tags help organize and categorize your AppConfig resources. Each tag consists of a key and an optional value, both of which you define.
