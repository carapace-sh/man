name: delete-dimension
description: Removes the specified dimension from your Amazon Web Services accounts.
flags:
    --name=!: The unique identifier for the dimension that you want to delete.
documentation:
    command: |-
        Removes the specified dimension from your Amazon Web Services accounts.

        Requires permission to access the [DeleteDimension](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        name: The unique identifier for the dimension that you want to delete.
