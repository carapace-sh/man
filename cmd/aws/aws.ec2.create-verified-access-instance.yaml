name: create-verified-access-instance
description: An Amazon Web Services Verified Access instance is a regional entity that evaluates application requests and grants access only when your security requirements are met.
flags:
    --cidr-endpoints-custom-sub-domain=: The custom subdomain.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive token that you provide to ensure idempotency of your modification request.
    --description=: A description for the Verified Access instance.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --fips-enabled: Enable or disable support for Federal Information Processing Standards (FIPS) on the instance.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-fips-enabled: Enable or disable support for Federal Information Processing Standards (FIPS) on the instance.
    --tag-specifications=: The tags to assign to the Verified Access instance.
