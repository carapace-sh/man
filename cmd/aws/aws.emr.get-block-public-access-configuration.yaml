name: get-block-public-access-configuration
description: Returns the Amazon EMR block public access configuration for your Amazon Web Services account in the current Region.
documentation:
    command: Returns the Amazon EMR block public access configuration for your Amazon Web Services account in the current Region. For more information see [Configure Block Public Access for Amazon EMR](https://docs.aws.amazon.com/emr/latest/ManagementGuide/configure-block-public-access.html) in the *Amazon EMR Management Guide*.
