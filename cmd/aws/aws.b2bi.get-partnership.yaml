name: get-partnership
description: Retrieves the details for a partnership, based on the partner and profile IDs specified.
flags:
    --partnership-id=!: Specifies the unique, system-generated identifier for a partnership.
documentation:
    command: Retrieves the details for a partnership, based on the partner and profile IDs specified. A partnership represents the connection between you and your trading partner. It ties together a profile and one or more trading capabilities.
    flag:
        partnership-id: Specifies the unique, system-generated identifier for a partnership.
