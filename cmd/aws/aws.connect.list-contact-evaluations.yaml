name: list-contact-evaluations
description: Lists contact evaluations in the specified Amazon Connect instance.
flags:
    --contact-id=!: The identifier of the contact in this instance of Amazon Connect.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --next-token=: The token for the next set of results.
documentation:
    command: Lists contact evaluations in the specified Amazon Connect instance.
    flag:
        contact-id: The identifier of the contact in this instance of Amazon Connect.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        next-token: |-
            The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.

            This is not expected to be set because the value returned in the previous response is always null.
