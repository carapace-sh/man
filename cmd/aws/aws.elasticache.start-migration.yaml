name: start-migration
description: Start the migration of data.
flags:
    --customer-node-endpoint-list=!: List of endpoints from which data should be migrated.
    --replication-group-id=!: The ID of the replication group to which data should be migrated.
documentation:
    command: Start the migration of data.
    flag:
        customer-node-endpoint-list: List of endpoints from which data should be migrated. For Valkey or Redis OSS (cluster mode disabled), the list should have only one element.
        replication-group-id: The ID of the replication group to which data should be migrated.
