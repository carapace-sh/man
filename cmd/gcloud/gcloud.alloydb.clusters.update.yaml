name: update
description: Update an AlloyDB cluster within a given project and region.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --automated-backup-days-of-week=: Comma-separated list of days of the week to perform a backup.
    --automated-backup-encryption-key-keyring=: The KMS keyring of the key.
    --automated-backup-encryption-key-location=: The Google Cloud location for the key.
    --automated-backup-encryption-key-project=: The Google Cloud project for the key.
    --automated-backup-encryption-key=!: ID of the key or fully qualified identifier for the key.
    --automated-backup-retention-count=: Number of most recent successful backups retained.
    --automated-backup-retention-period=: Retention period of the backup relative to creation time.
    --automated-backup-start-times=: Comma-separated list of times during the day to start a backup.
    --automated-backup-window=: Length of the time window beginning at start time during which a backup can be taken.
    --clear-automated-backup: Clears the automated backup policy on the cluster.
    --clear-continuous-backup-encryption-key: Clears the encryption configuration for Continuous Backups.
    --continuous-backup-encryption-key-keyring=: The KMS keyring of the key.
    --continuous-backup-encryption-key-location=: The Google Cloud location for the key.
    --continuous-backup-encryption-key-project=: The Google Cloud project for the key.
    --continuous-backup-encryption-key=!: ID of the key or fully qualified identifier for the key.
    --continuous-backup-recovery-window-days=: Recovery window of the log files and backups saved to support Continuous Backups.
    --deny-maintenance-period-end-date=!: Date when the deny maintenance period ends, that is 2020-11-01 or 11-01 for recurring.
    --deny-maintenance-period-start-date=!: Date when the deny maintenance period begins, that is 2020-11-01 or 11-01 for recurring.
    --deny-maintenance-period-time=!: Time when the deny maintenance period starts and ends, for example 05:00, in UTC time zone.
    --disable-automated-backup: Disables automated backups on the cluster.
    --enable-continuous-backup: Enables Continuous Backups on the cluster.
    --maintenance-version=: Maintenance version to update the cluster to.
    --maintenance-window-any: Remove the user-specified maintenance window.
    --maintenance-window-day=!: Day of week for maintenance window, in UTC time zone.
    --maintenance-window-hour=!: Hour of day for maintenance window, in UTC time zone.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-automated-backup&: Clears the automated backup policy on the cluster.
    --no-clear-continuous-backup-encryption-key&: Clears the encryption configuration for Continuous Backups.
    --no-disable-automated-backup&: Disables automated backups on the cluster.
    --no-enable-continuous-backup&: Enables Continuous Backups on the cluster.
    --no-maintenance-window-any&: Remove the user-specified maintenance window.
    --no-remove-deny-maintenance-period&: Remove the deny maintenance period.
    --region=!: Regional location (e.g. `asia-east1`, `us-east1`).
    --remove-deny-maintenance-period: Remove the deny maintenance period.
    --subscription-type=: Subscription type of the cluster.
completion:
    flag:
        maintenance-window-day:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
        subscription-type:
            - STANDARD
            - TRIAL
documentation:
    command: Update an AlloyDB cluster within a given project and region.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        automated-backup-days-of-week: 'Comma-separated list of days of the week to perform a backup. At least one day of the week must be provided. (e.g., --automated-backup-days-of-week=MONDAY,WEDNESDAY,SUNDAY). _DAYS_OF_WEEK_ must be one of: *MONDAY*, *TUESDAY*, *WEDNESDAY*, *THURSDAY*, *FRIDAY*, *SATURDAY*, *SUNDAY*.'
        automated-backup-encryption-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--automated-backup-encryption-key` on the command line.
        automated-backup-encryption-key-keyring: |-
            The KMS keyring of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--automated-backup-encryption-key` on the command line with a fully specified name;
            * provide the argument `--automated-backup-encryption-key-keyring` on the command line.
        automated-backup-encryption-key-location: |-
            The Google Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--automated-backup-encryption-key` on the command line with a fully specified name;
            * provide the argument `--automated-backup-encryption-key-location` on the command line.
        automated-backup-encryption-key-project: |-
            The Google Cloud project for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--automated-backup-encryption-key` on the command line with a fully specified name;
            * provide the argument `--automated-backup-encryption-key-project` on the command line;
            * set the property `core/project`.
        automated-backup-retention-count: Number of most recent successful backups retained.
        automated-backup-retention-period: Retention period of the backup relative to creation time.  See `$ gcloud topic datetimes` for information on duration formats.
        automated-backup-start-times: Comma-separated list of times during the day to start a backup. At least one start time must be provided. The start times are assumed to be in UTC and required to be an exact hour in the format HH:00. (e.g., `--automated-backup-start-times=01:00,13:00`)
        automated-backup-window: Length of the time window beginning at start time during which a backup can be taken. If a backup does not succeed within this time window, it will be canceled and considered failed. The backup window must be at least 5 minutes long. There is no upper bound on the window. If not set, it will default to 1 hour.
        clear-automated-backup: Clears the automated backup policy on the cluster. The default automated backup policy will be used.
        clear-continuous-backup-encryption-key: Clears the encryption configuration for Continuous Backups. Google default encryption will be used for future Continuous Backups.
        continuous-backup-encryption-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--continuous-backup-encryption-key` on the command line.
        continuous-backup-encryption-key-keyring: |-
            The KMS keyring of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--continuous-backup-encryption-key` on the command line with a fully specified name;
            * provide the argument `--continuous-backup-encryption-key-keyring` on the command line.
        continuous-backup-encryption-key-location: |-
            The Google Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--continuous-backup-encryption-key` on the command line with a fully specified name;
            * provide the argument `--continuous-backup-encryption-key-location` on the command line.
        continuous-backup-encryption-key-project: |-
            The Google Cloud project for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--continuous-backup-encryption-key` on the command line with a fully specified name;
            * provide the argument `--continuous-backup-encryption-key-project` on the command line;
            * set the property `core/project`.
        continuous-backup-recovery-window-days: Recovery window of the log files and backups saved to support Continuous Backups.
        deny-maintenance-period-end-date: Date when the deny maintenance period ends, that is 2020-11-01 or 11-01 for recurring.
        deny-maintenance-period-start-date: Date when the deny maintenance period begins, that is 2020-11-01 or 11-01 for recurring.
        deny-maintenance-period-time: Time when the deny maintenance period starts and ends, for example 05:00, in UTC time zone.
        disable-automated-backup: Disables automated backups on the cluster.
        enable-continuous-backup: Enables Continuous Backups on the cluster.
        maintenance-version: Maintenance version to update the cluster to. Use `latest` to apply the latest available maintenance version.
        maintenance-window-any: Remove the user-specified maintenance window.
        maintenance-window-day: 'Day of week for maintenance window, in UTC time zone. _MAINTENANCE_WINDOW_DAY_ must be one of: *MONDAY*, *TUESDAY*, *WEDNESDAY*, *THURSDAY*, *FRIDAY*, *SATURDAY*, *SUNDAY*.'
        maintenance-window-hour: Hour of day for maintenance window, in UTC time zone.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-automated-backup: Clears the automated backup policy on the cluster. The default automated backup policy will be used.
        no-clear-continuous-backup-encryption-key: Clears the encryption configuration for Continuous Backups. Google default encryption will be used for future Continuous Backups.
        no-disable-automated-backup: Disables automated backups on the cluster.
        no-enable-continuous-backup: Enables Continuous Backups on the cluster.
        no-maintenance-window-any: Remove the user-specified maintenance window.
        no-remove-deny-maintenance-period: Remove the deny maintenance period.
        region: Regional location (e.g. `asia-east1`, `us-east1`). See the full list of regions at https://cloud.google.com/sql/docs/instance-locations.
        remove-deny-maintenance-period: Remove the deny maintenance period.
        subscription-type: 'Subscription type of the cluster. _SUBSCRIPTION_TYPE_ must be one of: *STANDARD*, *TRIAL*.'
