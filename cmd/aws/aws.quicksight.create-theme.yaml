name: create-theme
description: Creates a theme.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account where you want to store the new theme.
    --base-theme-id=!: The ID of the theme that a custom theme will inherit from.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=!: The theme configuration, which contains the theme display properties.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A display name for the theme.
    --permissions=:
        description: A valid grouping of resource permissions to apply to the new theme.
        nargs: -1
    --tags=:
        description: A map of the key-value pairs for the resource tag or tags that you want to add to the resource.
        nargs: -1
    --theme-id=!: An ID for the theme that you want to create.
    --version-description=: A description of the first version of the theme that you're creating.
documentation:
    command: |-
        Creates a theme.

        A *theme* is set of configuration options for color and layout. Themes apply to analyses and dashboards. For more information, see [Using Themes in Amazon Quick Sight](https://docs.aws.amazon.com/quicksight/latest/user/themes-in-quicksight.html) in the *Amazon Quick Sight User Guide*.
    flag:
        aws-account-id: The ID of the Amazon Web Services account where you want to store the new theme.
        base-theme-id: The ID of the theme that a custom theme will inherit from. All themes inherit from one of the starting themes defined by Amazon Quick Sight. For a list of the starting themes, use `ListThemes` or choose **Themes** from within an analysis.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: The theme configuration, which contains the theme display properties.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A display name for the theme.
        permissions: A valid grouping of resource permissions to apply to the new theme.
        tags: A map of the key-value pairs for the resource tag or tags that you want to add to the resource.
        theme-id: An ID for the theme that you want to create. The theme ID is unique per Amazon Web Services Region in each Amazon Web Services account.
        version-description: A description of the first version of the theme that you're creating. Every time `UpdateTheme` is called, a new version is created. Each version of the theme has a description of the version in the `VersionDescription` field.
