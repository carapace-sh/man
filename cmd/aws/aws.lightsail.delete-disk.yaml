name: delete-disk
description: Deletes the specified block storage disk.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --disk-name=!: The unique name of the disk you want to delete (`my-disk`).
    --force-delete-add-ons: A Boolean value to indicate whether to delete all add-ons for the disk.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-force-delete-add-ons: A Boolean value to indicate whether to delete all add-ons for the disk.
documentation:
    command: |-
        Deletes the specified block storage disk. The disk must be in the `available` state (not attached to a Lightsail instance).

        The disk may remain in the `deleting` state for several minutes.

        The `delete disk` operation supports tag-based access control via resource tags applied to the resource identified by `disk name`. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        disk-name: The unique name of the disk you want to delete (`my-disk`).
        force-delete-add-ons: A Boolean value to indicate whether to delete all add-ons for the disk.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
