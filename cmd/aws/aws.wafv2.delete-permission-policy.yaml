name: delete-permission-policy
description: Permanently deletes an IAM policy from the specified rule group.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the rule group from which you want to delete the policy.
documentation:
    command: |-
        Permanently deletes an IAM policy from the specified rule group.

        You must be the owner of the rule group to perform this operation.
    flag:
        resource-arn: |-
            The Amazon Resource Name (ARN) of the rule group from which you want to delete the policy.

            You must be the owner of the rule group to perform this operation.
