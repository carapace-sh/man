name: create-reservation
description: Creates an Amazon Redshift Serverless reservation, which gives you the option to commit to a specified number of Redshift Processing Units (RPUs) for a year at a discount from Serverless on-demand (OD) rates.
flags:
    --capacity=!: The number of Redshift Processing Units (RPUs) to reserve.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --offering-id=!: The ID of the offering associated with the reservation.
documentation:
    command: Creates an Amazon Redshift Serverless reservation, which gives you the option to commit to a specified number of Redshift Processing Units (RPUs) for a year at a discount from Serverless on-demand (OD) rates.
    flag:
        capacity: The number of Redshift Processing Units (RPUs) to reserve.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. This token must be a valid UUIDv4 value. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/) .
        offering-id: The ID of the offering associated with the reservation. The offering determines the payment schedule for the reservation.
