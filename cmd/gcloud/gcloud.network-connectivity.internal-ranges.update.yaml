name: update
description: Update an internal range.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clear-labels: Clear existing labels for the range.
    --clear-overlaps: Clear existing overlap fields for the range.
    --description=: Description of the Internal Range
    --ip-cidr-range=: IP range that this internal range defines.
    --labels=: List of label KEY=VALUE pairs for the range being updated.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Clear existing labels for the range.
    --no-clear-overlaps&: Clear existing overlap fields for the range.
    --overlaps=: Overlap specifications for the range being updated.
    --prefix-length=: An alternative to ip-cidr-range.
    --region=: The location ID.
documentation:
    command: |
        Update the details of an internal range.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-labels: Clear existing labels for the range.
        clear-overlaps: Clear existing overlap fields for the range.
        description: Description of the Internal Range
        ip-cidr-range: IP range that this internal range defines.
        labels: List of label KEY=VALUE pairs for the range being updated.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: |
            Clear existing labels for the range.
        no-clear-overlaps: |
            Clear existing overlap fields for the range.
        overlaps: |-
            Overlap specifications for the range being updated. _OVERLAPS_ must be one of:
            +
            *overlap-existing-subnet-range*::: Allows for creation of internal ranges that overlap with existing subnets.
            +
            *overlap-route-range*::: Allows for creation or existence of routes that have a more specific destination
            than the created range.
            +
            :::
            +
        prefix-length: |-
            An alternative to ip-cidr-range.
            Can be set when trying to create a reservation that automatically finds a free range of
            the given size.
        region: |-
            The location ID.
            +

            To set the `region` attribute:
            * provide the argument `internal_range` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * use default global location
            .
