name: disable-add-on
description: Disables an add-on for an Amazon Lightsail resource.
flags:
    --add-on-type=!: The add-on type to disable.
    --resource-name=!: The name of the source resource for which to disable the add-on.
completion:
    flag:
        add-on-type:
            - AutoSnapshot
            - StopInstanceOnIdle
documentation:
    command: Disables an add-on for an Amazon Lightsail resource. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-configuring-automatic-snapshots).
    flag:
        add-on-type: The add-on type to disable.
        resource-name: The name of the source resource for which to disable the add-on.
