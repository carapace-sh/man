name: get-baseline-operation
description: 'Returns the details of an asynchronous baseline operation, as initiated by any of these APIs: `EnableBaseline`, `DisableBaseline`, `UpdateEnabledBaseline`, `ResetEnabledBaseline`.'
flags:
    --operation-identifier=!: The operation ID returned from mutating asynchronous APIs (Enable, Disable, Update, Reset).
documentation:
    command: 'Returns the details of an asynchronous baseline operation, as initiated by any of these APIs: `EnableBaseline`, `DisableBaseline`, `UpdateEnabledBaseline`, `ResetEnabledBaseline`. A status message is displayed in case of operation failure. For usage examples, see [*the Amazon Web Services Control Tower User Guide*](https://docs.aws.amazon.com/controltower/latest/userguide/baseline-api-examples.html) .'
    flag:
        operation-identifier: The operation ID returned from mutating asynchronous APIs (Enable, Disable, Update, Reset).
