name: enable
description: Enables storage intelligence.
flags:
    --exclude-bucket-id-regexes=: Sets filter for bucket id regexes to exclude.
    --exclude-locations=: Comma separated list of [locations](https://cloud.google.com/storage/docs/locations#available-locations) to exclude in storage intelligence filter.
    --include-bucket-id-regexes=: Sets filter for bucket id regexes to include.
    --include-locations=: Comma separated list of [locations](https://cloud.google.com/storage/docs/locations#available-locations) to include in storage intelligence filter.
    --no-trial-edition&: Enables Storage Intelligence for TRIAL edition.
    --organization=: Specifies organization id for the storage intelligence config.
    --sub-folder=: Specifies sub-folder id for the storage intelligence config.
    --trial-edition: Enables Storage Intelligence for TRIAL edition.
documentation:
    command: |
        Enable storage intelligence plan for the organization, sub-folder or project
        along with filters. The command sets `STANDARD` edition by default if
        no other edition flags like ``--trial-edition`` are specified.
    flag:
        exclude-bucket-id-regexes: Sets filter for bucket id regexes to exclude. Accepts list of bucket id regexes in comma separated format. If the regex contains special characters that may have a specific meaning in the shell, escape them using backslashes(\). To clear bucket id regexes list, provide flag with an empty list. e.g `--exclude-bucket-id-regexes=""` or `--exclude-bucket-id-regexes=` .
        exclude-locations: Comma separated list of [locations](https://cloud.google.com/storage/docs/locations#available-locations) to exclude in storage intelligence filter. To clear excluded locations, provide flag with empty list. e.g `--exclude-locations=""` or `--exclude-locations=` .
        include-bucket-id-regexes: Sets filter for bucket id regexes to include. Accepts list of bucket id regexes in comma separated format. If the regex contains special characters that may have a specific meaning in the shell, escape them using backslashes(\). To clear bucket id regexes list, provide flag with empty list. e.g `--include-bucket-id-regexes=""` or `--include-bucket-id-regexes=` .
        include-locations: Comma separated list of [locations](https://cloud.google.com/storage/docs/locations#available-locations) to include in storage intelligence filter. To clear included locations, provide flag with empty list. e.g `--include-locations=""` or `--include-locations=` .
        no-trial-edition: Enables Storage Intelligence for TRIAL edition.
        organization: Specifies organization id for the storage intelligence config.
        sub-folder: Specifies sub-folder id for the storage intelligence config.
        trial-edition: Enables Storage Intelligence for TRIAL edition.
