name: create
description: '*(BETA)*  Create a logs-based metric.'
flags:
    --bucket-name=: The Log Bucket name which owns the log-based metric.
    --config-from-file=: A path to a YAML or JSON file specifying the logs-based metric to create.
    --description=!: The metric's description.
    --log-filter=!: The metric's filter expression.
documentation:
    command: |
        *(BETA)*  Create a logs-based metric to count the number of log entries that
        match a filter expression. Logs-based metrics can also be used to
        extract values from logs and create a distribution of the values.
    flag:
        bucket-name: The Log Bucket name which owns the log-based metric.
        config-from-file: A path to a YAML or JSON file specifying the logs-based metric to create. Use a full or relative path to a local file containing the value of config.
        description: The metric's description.
        log-filter: The metric's filter expression.
