name: describe-host-reservations
description: Describes reservations that are associated with Dedicated Hosts in your account.
flags:
    --filter=: The filters.
    --host-reservation-id-set=: The host reservation IDs.
    --max-results=: The maximum number of results to return for the request in a single page.
    --next-token=: The token to use to retrieve the next page of results.
documentation:
    command: Describes reservations that are associated with Dedicated Hosts in your account.
    flag:
        filter: |-
            The filters.

            - `instance-family` - The instance family (for example, `m4`).
            - `payment-option` - The payment option (`NoUpfront` | `PartialUpfront` | `AllUpfront`).
            - `state` - The state of the reservation (`payment-pending` | `payment-failed` | `active` | `retired`).
            - `tag:<key>` - The key/value combination of a tag assigned to the resource. Use the tag key in the filter name and the tag value as the filter value. For example, to find all resources that have a tag with the key `Owner` and the value `TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.
            - `tag-key` - The key of a tag assigned to the resource. Use this filter to find all resources assigned a tag with a specific key, regardless of the tag value.
        host-reservation-id-set: The host reservation IDs.
        max-results: The maximum number of results to return for the request in a single page. The remaining results can be seen by sending another request with the returned `nextToken` value. This value can be between 5 and 500. If `maxResults` is given a larger value than 500, you receive an error.
        next-token: The token to use to retrieve the next page of results.
