name: create-notification-subscription
description: Configure Amazon WorkDocs to use Amazon SNS notifications.
flags:
    --endpoint=!: The endpoint to receive the notifications.
    --organization-id=!: The ID of the organization.
    --protocol=!: The protocol to use.
    --subscription-type=!: The notification type.
completion:
    flag:
        protocol:
            - HTTPS
            - SQS
        subscription-type:
            - ALL
documentation:
    command: |-
        Configure Amazon WorkDocs to use Amazon SNS notifications. The endpoint receives a confirmation message, and must confirm the subscription.

        For more information, see [Setting up notifications for an IAM user or role](https://docs.aws.amazon.com/workdocs/latest/developerguide/manage-notifications.html) in the *Amazon WorkDocs Developer Guide*.
    flag:
        endpoint: The endpoint to receive the notifications. If the protocol is HTTPS, the endpoint is a URL that begins with `https`.
        organization-id: The ID of the organization.
        protocol: The protocol to use. The supported value is https, which delivers JSON-encoded messages using HTTPS POST.
        subscription-type: The notification type.
