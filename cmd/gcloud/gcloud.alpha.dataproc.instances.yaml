name: instances
description: '*(ALPHA)*  Create Dataproc instances on GDCE clusters.'
hidden: true
documentation:
    command: |-
        ## EXAMPLES

        To create an instance, run:

          $ gcloud alpha dataproc instances create my-instance --region='us-central1'
          --gdce-cluster='my-gdce-cluster'

        To delete an instance, run:

          $ gcloud alpha dataproc instances delete my-instance --region=us-central1

        To view the details of an instance, run:

          $ gcloud alpha dataproc instances describe my-instance --region=us-central1
