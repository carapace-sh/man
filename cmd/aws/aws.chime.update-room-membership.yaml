name: update-room-membership
description: Updates room membership details, such as the member role, for a room in an Amazon Chime Enterprise account.
flags:
    --account-id=!: The Amazon Chime account ID.
    --member-id=!: The member ID.
    --role=: The role of the member.
    --room-id=!: The room ID.
completion:
    flag:
        role:
            - Administrator
            - Member
documentation:
    command: Updates room membership details, such as the member role, for a room in an Amazon Chime Enterprise account. The member role designates whether the member is a chat room administrator or a general chat room member. The member role can be updated only for user IDs.
    flag:
        account-id: The Amazon Chime account ID.
        member-id: The member ID.
        role: The role of the member.
        room-id: The room ID.
