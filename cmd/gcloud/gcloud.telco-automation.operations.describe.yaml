name: describe
description: Get description of a long-running telco automation operation.
flags:
    --location=: The location name.
documentation:
    command: |
        Get information about a long-running telco automation operation.
    flag:
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
