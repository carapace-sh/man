name: delete
description: '*(ALPHA)*  Delete a Cloud TPU VM node.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --zone=: Zone of the Cloud TPU.
documentation:
    command: '*(ALPHA)*  Delete a Cloud TPU VM node.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        zone: |-
            Zone of the Cloud TPU.
            +
            If not specified, will use `default` compute/zone.
            +

            To set the `zone` attribute:
            * provide the argument `tpu` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
