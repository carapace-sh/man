    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token returned from a previous paginated request.
documentation:
    command: Lists the events of a deployment.
    flag:
        deployment-id: The ID of the deployment.
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output.
