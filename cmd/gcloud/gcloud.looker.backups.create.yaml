name: create
description: Create a backup of a Looker instance.
flags:
    --instance=!: ID of the instance or fully qualified identifier for the instance.
    --region=!: The name of the Looker region of the instance.
documentation:
    command: Create a backup of a Looker instance.
    flag:
        instance: |-
            ID of the instance or fully qualified identifier for the instance.
            To set the instance attribute:
            +
            - provide the argument --instance on the command line.
        region: |-
            The name of the Looker region of the instance. Overrides the
            default looker/region property value for this command invocation.
