name: get-package-version-readme
description: Gets the readme file or descriptive text for a package version.
flags:
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the repository that contains the package version with the requested readme file.
    --format=!: A format that specifies the type of the package version with the requested readme file.
    --namespace=: The namespace of the package version with the requested readme file.
    --package-version=!: A string that contains the package version (for example, `3.5.2`).
    --package=!: The name of the package version that contains the requested readme file.
    --repository=!: The repository that contains the package with the requested readme file.
completion:
    flag:
        format:
            - npm
            - pypi
            - maven
            - nuget
            - generic
            - ruby
            - swift
            - cargo
documentation:
    command: |-
        Gets the readme file or descriptive text for a package version.

        The returned text might contain formatting. For example, it might contain formatting for Markdown or reStructuredText.
    flag:
        domain: The name of the domain that contains the repository that contains the package version with the requested readme file.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        format: A format that specifies the type of the package version with the requested readme file.
        namespace: |-
            The namespace of the package version with the requested readme file. The package component that specifies its namespace depends on its type. For example:

            The namespace is required when requesting the readme from package versions of the following formats:

            - Maven
            - Swift
            - generic

            <!--THE END-->

            - The namespace of a Maven package version is its `groupId`.
            - The namespace of an npm or Swift package version is its `scope`.
            - The namespace of a generic package is its `namespace`.
            - Python, NuGet, Ruby, and Cargo package versions do not contain a corresponding component, package versions of those formats do not have a namespace.
        package: The name of the package version that contains the requested readme file.
        package-version: A string that contains the package version (for example, `3.5.2`).
        repository: The repository that contains the package with the requested readme file.
