name: dissociate-access-grants-identity-center
description: Dissociates the Amazon Web Services IAM Identity Center instance from the S3 Access Grants instance.
flags:
    --account-id=!: The Amazon Web Services account ID of the S3 Access Grants instance.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: |-
        Dissociates the Amazon Web Services IAM Identity Center instance from the S3 Access Grants instance.

        Permissions

        You must have the `s3:DissociateAccessGrantsIdentityCenter` permission to use this operation.

        Additional Permissions

        You must have the `sso:DeleteApplication` permission to use this operation.

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The Amazon Web Services account ID of the S3 Access Grants instance.
