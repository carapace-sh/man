name: update-phone-number
description: Updates the configuration of an existing origination phone number.
flags:
    --deletion-protection-enabled: By default this is set to false.
    --international-sending-enabled: By default this is set to false.
    --no-deletion-protection-enabled: By default this is set to false.
    --no-international-sending-enabled: By default this is set to false.
    --no-self-managed-opt-outs-enabled: By default this is set to false.
    --no-two-way-enabled: By default this is set to false.
    --opt-out-list-name=: The OptOutList to add the phone number to.
    --phone-number-id=!: The unique identifier of the phone number.
    --self-managed-opt-outs-enabled: By default this is set to false.
    --two-way-channel-arn=: The Amazon Resource Name (ARN) of the two way channel.
    --two-way-channel-role=: An optional IAM Role Arn for a service to assume, to be able to post inbound SMS messages.
    --two-way-enabled: By default this is set to false.
documentation:
    command: |-
        Updates the configuration of an existing origination phone number. You can update the opt-out list, enable or disable two-way messaging, change the TwoWayChannelArn, enable or disable self-managed opt-outs, and enable or disable deletion protection.

        If the origination phone number is associated with a pool, an error is returned.
    flag:
        deletion-protection-enabled: By default this is set to false. When set to true the phone number can't be deleted.
        international-sending-enabled: By default this is set to false. When set to true the international sending of phone number is Enabled.
        opt-out-list-name: The OptOutList to add the phone number to. You can use either the opt out list name or the opt out list ARN.
        phone-number-id: |-
            The unique identifier of the phone number. Valid values for this field can be either the PhoneNumberId or PhoneNumberArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        self-managed-opt-outs-enabled: By default this is set to false. When set to false and an end recipient sends a message that begins with HELP or STOP to one of your dedicated numbers, End User MessagingSMS automatically replies with a customizable message and adds the end recipient to the OptOutList. When set to true you're responsible for responding to HELP and STOP requests. You're also responsible for tracking and honoring opt-out requests.
        two-way-channel-arn: The Amazon Resource Name (ARN) of the two way channel.
        two-way-channel-role: An optional IAM Role Arn for a service to assume, to be able to post inbound SMS messages.
        two-way-enabled: By default this is set to false. When set to true you can receive incoming text messages from your end recipients.
