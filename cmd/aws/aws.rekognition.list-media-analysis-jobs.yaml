name: list-media-analysis-jobs
description: Returns a list of media analysis jobs.
flags:
    --max-results=: The maximum number of results to return per paginated call.
    --next-token=: Pagination token, if the previous response was incomplete.
documentation:
    command: Returns a list of media analysis jobs. Results are sorted by `CreationTimestamp` in descending order.
    flag:
        max-results: The maximum number of results to return per paginated call. The largest value user can specify is 100. If user specifies a value greater than 100, an `InvalidParameterException` error occurs. The default value is 100.
        next-token: Pagination token, if the previous response was incomplete.
