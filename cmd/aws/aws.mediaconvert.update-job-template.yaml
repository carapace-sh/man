name: update-job-template
description: Modify one of your existing job templates.
flags:
    --acceleration-settings=: Accelerated transcoding can significantly speed up jobs with long, visually complex content.
    --category=: The new category for the job template, if you are changing it.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The new description for the job template, if you are changing it.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hop-destinations=: Optional list of hop destinations.
    --name=!: The name of the job template you are modifying
    --priority=: Specify the relative priority for this job.
    --queue=: The new queue for the job template, if you are changing it.
    --settings=: JobTemplateSettings contains all the transcode settings saved in the template that will be applied to jobs created from it.
    --status-update-interval=: Specify how often MediaConvert sends STATUS\_UPDATE events to Amazon CloudWatch Events.
completion:
    flag:
        status-update-interval:
            - SECONDS_10
            - SECONDS_12
            - SECONDS_15
            - SECONDS_20
            - SECONDS_30
            - SECONDS_60
            - SECONDS_120
            - SECONDS_180
            - SECONDS_240
            - SECONDS_300
            - SECONDS_360
            - SECONDS_420
            - SECONDS_480
            - SECONDS_540
            - SECONDS_600
documentation:
    command: Modify one of your existing job templates.
    flag:
        acceleration-settings: Accelerated transcoding can significantly speed up jobs with long, visually complex content. Outputs that use this feature incur pro-tier pricing. For information about feature limitations, see the AWS Elemental MediaConvert User Guide.
        category: The new category for the job template, if you are changing it.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The new description for the job template, if you are changing it.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hop-destinations: Optional list of hop destinations.
        name: The name of the job template you are modifying
        priority: Specify the relative priority for this job. In any given queue, the service begins processing the job with the highest value first. When more than one job has the same priority, the service begins processing the job that you submitted first. If you don't specify a priority, the service uses the default value 0.
        queue: The new queue for the job template, if you are changing it.
        settings: JobTemplateSettings contains all the transcode settings saved in the template that will be applied to jobs created from it.
        status-update-interval: Specify how often MediaConvert sends STATUS\_UPDATE events to Amazon CloudWatch Events. Set the interval, in seconds, between status updates. MediaConvert sends an update at this interval from the time the service begins processing your job to the time it completes the transcode or encounters an error.
