name: delete-component
description: Ungroups a custom component.
flags:
    --component-name=!: The name of the component.
    --resource-group-name=!: The name of the resource group.
documentation:
    command: Ungroups a custom component. When you ungroup custom components, all applicable monitors that are set up for the component are removed and the instances revert to their standalone status.
    flag:
        component-name: The name of the component.
        resource-group-name: The name of the resource group.
