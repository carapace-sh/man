name: update-portal
description: Updates a web portal.
flags:
    --authentication-type=: The type of authentication integration points used when signing into the web portal.
    --display-name=: The name of the web portal.
    --instance-type=: The type and resources of the underlying instance.
    --max-concurrent-sessions=: The maximum number of concurrent sessions for the portal.
    --portal-arn=!: The ARN of the web portal.
completion:
    flag:
        authentication-type:
            - Standard
            - IAM_Identity_Center
        instance-type:
            - standard.regular
            - standard.large
            - standard.xlarge
documentation:
    command: Updates a web portal.
    flag:
        authentication-type: |-
            The type of authentication integration points used when signing into the web portal. Defaults to `Standard`.

            `Standard` web portals are authenticated directly through your identity provider. You need to call `CreateIdentityProvider` to integrate your identity provider with your web portal. User and group access to your web portal is controlled through your identity provider.

            `IAM Identity Center` web portals are authenticated through IAM Identity Center. Identity sources (including external identity provider integration), plus user and group access to your web portal, can be configured in the IAM Identity Center.
        display-name: The name of the web portal. This is not visible to users who log into the web portal.
        instance-type: The type and resources of the underlying instance.
        max-concurrent-sessions: The maximum number of concurrent sessions for the portal.
        portal-arn: The ARN of the web portal.
