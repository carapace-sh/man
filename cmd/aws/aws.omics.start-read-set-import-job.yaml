name: start-read-set-import-job
description: Imports a read set from the sequence store.
flags:
    --client-token=: To ensure that jobs don't run multiple times, specify a unique token for each job.
    --role-arn=!: A service role for the job.
    --sequence-store-id=!: The read set's sequence store ID.
    --sources=!: The job's source files.
documentation:
    command: Imports a read set from the sequence store. Read set import jobs support a maximum of 100 read sets of different types. Monitor the progress of your read set import job by calling the `GetReadSetImportJob` API operation.
    flag:
        client-token: To ensure that jobs don't run multiple times, specify a unique token for each job.
        role-arn: A service role for the job.
        sequence-store-id: The read set's sequence store ID.
        sources: The job's source files.
