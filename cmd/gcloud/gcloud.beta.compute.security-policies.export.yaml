name: export
description: '*(BETA)*  Export security policy configs into YAML or JSON files.'
flags:
    --file-format=: The format of the file to export the security policy config to.
    --file-name=!: The name of the file to export the security policy config to.
    --global: If set, the security policy is global.
    --no-global&: If set, the security policy is global.
    --region=: Region of the security policy to export.
completion:
    flag:
        file-format:
            - json
            - yaml
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute security-policies export* exports all data associated with Compute Engine security
        policy into a local file.

        ## EXAMPLES

        To export a security policy in JSON format to a given file, run:

          $ gcloud beta compute security-policies export my-policy \
             --file-name=my-file-name \
             --file-format=json
    flag:
        file-format: 'The format of the file to export the security policy config to. Specify either yaml or json. Defaults to yaml if not specified. _FILE_FORMAT_ must be one of: *json*, *yaml*.'
        file-name: The name of the file to export the security policy config to.
        global: If set, the security policy is global.
        no-global: If set, the security policy is global.
        region: Region of the security policy to export. Overrides the default *compute/region* property value for this command invocation.
