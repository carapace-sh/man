name: search-quick-responses
description: Searches existing Amazon Q in Connect quick responses in an Amazon Q in Connect knowledge base.
flags:
    --attributes=: The [user-defined Amazon Connect contact attributes](https://docs.aws.amazon.com/connect/latest/adminguide/connect-attrib-list.html#user-defined-attributes) to be resolved when search results are returned.
    --knowledge-base-id=!: The identifier of the knowledge base.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --search-expression=!: The search expression for querying the quick response.
documentation:
    command: Searches existing Amazon Q in Connect quick responses in an Amazon Q in Connect knowledge base.
    flag:
        attributes: The [user-defined Amazon Connect contact attributes](https://docs.aws.amazon.com/connect/latest/adminguide/connect-attrib-list.html#user-defined-attributes) to be resolved when search results are returned.
        knowledge-base-id: The identifier of the knowledge base. This should be a QUICK\_RESPONSES type knowledge base. Can be either the ID or the ARN. URLs cannot contain the ARN.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        search-expression: The search expression for querying the quick response.
