name: analyze-entities
description: '*(ALPHA)*  Use Google Cloud Natural Language API to identify entities in text.'
flags:
    --content-file=: Specify a local file or Google Cloud Storage (format
    --content-type=: Specify the format of the input text.
    --content=: Specify input text on the command line.
    --encoding-type=: The encoding type used by the API to calculate offsets.
    --language=: Specify the language of the input text.
completion:
    flag:
        content-type:
            - html
            - plain-text
        encoding-type:
            - none
            - utf16
            - utf32
            - utf8
documentation:
    command: |
        *(ALPHA)*  Entity Analysis inspects the given text for common names or known entities
        (proper nouns such as public figures, landmarks, etc.), and returns
        information about those entities.

        {language_help}
    flag:
        content: |-
            Specify input text on the command line. Useful for experiments, or
            for extremely short text.
        content-file: |-
            Specify a local file or Google Cloud Storage (format
            `gs://bucket/object`) file path containing the text to be analyzed.
            More useful for longer text or data output from another system.
        content-type: 'Specify the format of the input text. _CONTENT_TYPE_ must be one of: *html*, *plain-text*.'
        encoding-type: |-
            The encoding type used by the API to calculate offsets. If set to `none`,
            encoding-dependent offsets will be set at -1. This is an optional flag
            only used for the entity mentions in results, and does not affect how the
            input is read or analyzed. _ENCODING_TYPE_ must be one of: *none*, *utf16*, *utf32*, *utf8*.
        language: |-
            Specify the language of the input text. If omitted, the server will
            attempt to auto-detect. Both ISO (such as `en` or `es`) and BCP-47 (such
            as `en-US` or `ja-JP`) language codes are accepted.
