name: start-extension-pack-association
description: Applies the extension pack to your target database.
flags:
    --migration-project-identifier=!: The migration project name or Amazon Resource Name (ARN).
documentation:
    command: Applies the extension pack to your target database. An extension pack is an add-on module that emulates functions present in a source database that are required when converting objects to the target database.
    flag:
        migration-project-identifier: The migration project name or Amazon Resource Name (ARN).
