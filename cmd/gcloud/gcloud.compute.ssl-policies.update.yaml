name: update
description: Update a Compute Engine SSL policy.
flags:
    --custom-features=: A comma-separated list of custom features, required when the profile being used is CUSTOM.
    --global: If set, the SSL policy is global.
    --min-tls-version=: Minimum TLS version.
    --no-global&: If set, the SSL policy is global.
    --profile=: SSL policy profile.
    --region=: Region of the SSL policy to patch.
completion:
    flag:
        min-tls-version:
            - "1.0"
            - "1.1"
            - "1.2"
            - "1.3"
        profile:
            - COMPATIBLE
            - CUSTOM
            - FIPS_202205
            - MODERN
            - RESTRICTED
documentation:
    command: |-
        *gcloud compute ssl-policies update* is used to update SSL policies.

        An SSL policy specifies the server-side support for SSL features. An SSL
        policy can be attached to a TargetHttpsProxy or a TargetSslProxy. This affects
        connections between clients and the load balancer. SSL
        policies do not affect the connection between the load balancers and the
        backends. SSL policies are used by Application Load Balancers and proxy
        Network Load Balancers.
    flag:
        custom-features: |-
            A comma-separated list of custom features, required when the profile being used is CUSTOM.
            +
            Using CUSTOM profile allows customization of the features that are part of the SSL policy. This flag allows specifying those custom features.
            +
            The list of all supported custom features can be obtained using:
            +
              gcloud compute ssl-policies list-available-features
        global: If set, the SSL policy is global.
        min-tls-version: |-
            Minimum TLS version. _MIN_TLS_VERSION_ must be one of:
            +
            *1.0*::: TLS 1.0.
            *1.1*::: TLS 1.1.
            *1.2*::: TLS 1.2.
            *1.3*::: TLS 1.3.
            :::
            +
        no-global: If set, the SSL policy is global.
        profile: |-
            SSL policy profile. Changing profile from CUSTOM to COMPATIBLE|MODERN|RESTRICTED|FIPS_202205 will clear the custom-features field. _PROFILE_ must be one of:
            +
            *COMPATIBLE*::: Compatible profile. Allows the broadest set of clients, even those which support only out-of-date SSL features, to negotiate SSL with the load balancer.
            *CUSTOM*::: Custom profile. Allows customization by selecting only the features which are required. The list of all available features can be obtained using:
            +
              gcloud compute ssl-policies list-available-features
            +
            *FIPS_202205*::: FIPS_202205 profile. Supports a reduced set of SSL features, intended to meet stricter compliance requirements.
            *MODERN*::: Modern profile. Supports a wide set of SSL features, allowing modern clients to negotiate SSL.
            *RESTRICTED*::: Restricted profile. Supports a reduced set of SSL features, intended to meet stricter compliance requirements.
            :::
            +
        region: Region of the SSL policy to patch. Overrides the default *compute/region* property value for this command invocation.
