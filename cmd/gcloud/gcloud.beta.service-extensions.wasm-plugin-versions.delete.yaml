name: delete
description: '*(BETA)*  Delete a `WasmPluginVersion` resource.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location ID.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --wasm-plugin=: The ID of the `WasmPlugin`.
documentation:
    command: |
        *(BETA)*  Delete a `WasmPluginVersion` resource.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location ID.
            +

            To set the `location` attribute:
            * provide the argument `wasm_plugin_version` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * use global location.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        wasm-plugin: |-
            The ID of the `WasmPlugin`.
            +
            To set the `wasm-plugin` attribute:
            * provide the argument `wasm_plugin_version` on the command line with a fully specified name;
            * provide the argument `--wasm-plugin` on the command line.
