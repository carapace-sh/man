name: set-security-groups
description: Associates the specified security groups with the specified Application Load Balancer or Network Load Balancer.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enforce-security-group-inbound-rules-on-private-link-traffic=: Indicates whether to evaluate inbound security group rules for traffic sent to a Network Load Balancer through Amazon Web Services PrivateLink.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --load-balancer-arn=!: The Amazon Resource Name (ARN) of the load balancer.
    --security-groups=!: The IDs of the security groups.
completion:
    flag:
        enforce-security-group-inbound-rules-on-private-link-traffic:
            - "on"
            - "off"
documentation:
    command: |-
        Associates the specified security groups with the specified Application Load Balancer or Network Load Balancer. The specified security groups override the previously associated security groups.

        You can't perform this operation on a Network Load Balancer unless you specified a security group for the load balancer when you created it.

        You can't associate a security group with a Gateway Load Balancer.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enforce-security-group-inbound-rules-on-private-link-traffic: Indicates whether to evaluate inbound security group rules for traffic sent to a Network Load Balancer through Amazon Web Services PrivateLink. The default is `on`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        load-balancer-arn: The Amazon Resource Name (ARN) of the load balancer.
        security-groups: The IDs of the security groups.
