name: troubleshoot
description: Troubleshoot issues with the setup of VM Manager on a specified VM instance.
flags:
    --zone=: Zone of the instance to operate on.
documentation:
    command: |
        *gcloud compute os-config troubleshoot* troubleshoots issues with the setup of VM Manager on a specified
        VM instance

        The troubleshoot command investigates the following settings or configurations for your VM Manager setup:

        - Checks if the OS Config API is enabled in the project.
        - Checks if the required metadata is set up correctly in the VM instance.
        - Checks if the latest version of the OS Config agent is running on the VM instance.
        - Checks if a service account is attached to the VM instance.
        - Checks if the VM Manager service agent is enabled.
        - Checks if the VM instance has a public IP or Private Google Access.
    flag:
        zone: |-
            Zone of the instance to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
