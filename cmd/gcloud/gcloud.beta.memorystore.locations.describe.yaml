name: describe
description: '*(BETA)*  Show metadata for a Memorystore for Valkey location.'
documentation:
    command: |
        *(BETA)*  Display all metadata associated with a Memorystore for Valkey location given a valid
        location name.

        This command can fail for the following reasons:
          * The location specified does not exist.
          * The active account does not have permission to access the given
            location.
