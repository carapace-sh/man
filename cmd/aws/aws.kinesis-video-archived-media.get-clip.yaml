name: get-clip
description: Downloads an MP4 file (clip) containing the archived, on-demand media from the specified video stream over the specified time range.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --clip-fragment-selector=!: The time range of the requested clip and the source of the timestamps.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --stream-arn=: The Amazon Resource Name (ARN) of the stream for which to retrieve the media clip.
    --stream-name=: The name of the stream for which to retrieve the media clip.
documentation:
    command: |-
        Downloads an MP4 file (clip) containing the archived, on-demand media from the specified video stream over the specified time range.

        Both the StreamName and the StreamARN parameters are optional, but you must specify either the StreamName or the StreamARN when invoking this API operation.

        As a prerequisite to using GetCLip API, you must obtain an endpoint using `GetDataEndpoint`, specifying GET\_CLIP for`the APIName parameter.`

        `An Amazon Kinesis video stream has the following requirements for providing data through MP4: The media must contain h.264 or h.265 encoded video and, optionally, AAC or G.711 encoded audio. Specifically, the codec ID of track 1 should be V_MPEG/ISO/AVC (for h.264) or V_MPEGH/ISO/HEVC (for H.265). Optionally, the codec ID of track 2 should be A_AAC (for AAC) or A_MS/ACM (for G.711). Data retention must be greater than 0. The video track of each fragment must contain codec private data in the Advanced Video Coding (AVC) for H.264 format and HEVC for H.265 format. For more information, see MPEG-4 specification ISO/IEC 14496-15. For information about adapting stream data to a given format, see NAL Adaptation Flags. The audio track (if present) of each fragment must contain codec private data in the AAC format (AAC specification ISO/IEC 13818-7) or the MS Wave format. You can monitor the amount of outgoing data by monitoring the GetClip.OutgoingBytes Amazon CloudWatch metric. For information about using CloudWatch to monitor Kinesis Video Streams, see Monitoring Kinesis Video Streams. For pricing information, see Amazon Kinesis Video Streams Pricing and Amazon Web Services Pricing. Charges for outgoing Amazon Web Services data apply.`
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        clip-fragment-selector: The time range of the requested clip and the source of the timestamps.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        stream-arn: |-
            The Amazon Resource Name (ARN) of the stream for which to retrieve the media clip.

            You must specify either the StreamName or the StreamARN.
        stream-name: |-
            The name of the stream for which to retrieve the media clip.

            You must specify either the StreamName or the StreamARN.
