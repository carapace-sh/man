name: rescore
description: Rescores or re-ranks search results from a search service such as OpenSearch (self managed).
flags:
    --documents=!: The list of documents for Amazon Kendra Intelligent Ranking to rescore or rank on.
    --rescore-execution-plan-id=!: The identifier of the rescore execution plan.
    --search-query=!: The input query from the search service.
documentation:
    command: Rescores or re-ranks search results from a search service such as OpenSearch (self managed). You use the semantic search capabilities of Amazon Kendra Intelligent Ranking to improve the search service's results.
    flag:
        documents: The list of documents for Amazon Kendra Intelligent Ranking to rescore or rank on.
        rescore-execution-plan-id: The identifier of the rescore execution plan. A rescore execution plan is an Amazon Kendra Intelligent Ranking resource used for provisioning the `Rescore` API.
        search-query: The input query from the search service.
