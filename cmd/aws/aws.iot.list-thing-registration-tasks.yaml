name: list-thing-registration-tasks
description: List bulk thing provisioning tasks.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
    --status=: The status of the bulk thing provisioning task.
completion:
    flag:
        status:
            - InProgress
            - Completed
            - Failed
            - Cancelled
            - Cancelling
documentation:
    command: |-
        List bulk thing provisioning tasks.

        Requires permission to access the [ListThingRegistrationTasks](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at one time.
        next-token: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
        status: The status of the bulk thing provisioning task.
