name: create-subnet-group
description: Creates a subnet group.
flags:
    --description=: A description for the subnet group.
    --subnet-group-name=!: The name of the subnet group.
    --subnet-ids=!: A list of VPC subnet IDs for the subnet group.
    --tags=: A list of tags to be added to this resource.
documentation:
    command: Creates a subnet group. A subnet group is a collection of subnets (typically private) that you can designate for your clusters running in an Amazon Virtual Private Cloud (VPC) environment. When you create a cluster in an Amazon VPC, you must specify a subnet group. MemoryDB uses that subnet group to choose a subnet and IP addresses within that subnet to associate with your nodes. For more information, see [Subnets and subnet groups](https://docs.aws.amazon.com/MemoryDB/latest/devguide/subnetgroups.html).
    flag:
        description: A description for the subnet group.
        subnet-group-name: The name of the subnet group.
        subnet-ids: A list of VPC subnet IDs for the subnet group.
        tags: A list of tags to be added to this resource. A tag is a key-value pair. A tag key must be accompanied by a tag value, although null is accepted.
