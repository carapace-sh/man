name: get-relational-database-log-events
description: Returns a list of log events for a database in Amazon Lightsail.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=: The end of the time interval from which to get log events.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --log-stream-name=!: The name of the log stream.
    --no-start-from-head: Parameter to specify if the log should start from head or tail.
    --page-token=: The token to advance to the next or previous page of results from your request.
    --relational-database-name=!: The name of your database for which to get log events.
    --start-from-head: Parameter to specify if the log should start from head or tail.
    --start-time=: The start of the time interval from which to get log events.
documentation:
    command: Returns a list of log events for a database in Amazon Lightsail.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: "The end of the time interval from which to get log events.\n\nConstraints:\n\n- Specified in Coordinated Universal Time (UTC).\n- Specified in the Unix time format.\n  \n  For example, if you wish to use an end time of October 1, 2018, at 8 PM UTC, then you input `1538424000` as the end time."
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        log-stream-name: |-
            The name of the log stream.

            Use the `get relational database log streams` operation to get a list of available log streams.
        page-token: |-
            The token to advance to the next or previous page of results from your request.

            To get a page token, perform an initial `GetRelationalDatabaseLogEvents` request. If your results are paginated, the response will return a next forward token and/or next backward token that you can specify as the page token in a subsequent request.
        relational-database-name: The name of your database for which to get log events.
        start-from-head: |-
            Parameter to specify if the log should start from head or tail. If `true` is specified, the log event starts from the head of the log. If `false` is specified, the log event starts from the tail of the log.

            For PostgreSQL, the default value of `false` is the only option available.
        start-time: "The start of the time interval from which to get log events.\n\nConstraints:\n\n- Specified in Coordinated Universal Time (UTC).\n- Specified in the Unix time format.\n  \n  For example, if you wish to use a start time of October 1, 2018, at 8 PM UTC, then you input `1538424000` as the start time."
