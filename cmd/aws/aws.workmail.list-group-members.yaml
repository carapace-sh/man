name: list-group-members
description: Returns an overview of the members of a group.
flags:
    --group-id=!: The identifier for the group to which the members (users or groups) are associated.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token to use to retrieve the next page of results.
    --organization-id=!: The identifier for the organization under which the group exists.
documentation:
    command: Returns an overview of the members of a group. Users and groups can be members of a group.
    flag:
        group-id: |-
            The identifier for the group to which the members (users or groups) are associated.

            The identifier can accept *GroupId*, *Groupname*, or *email*. The following identity formats are available:

            - Group ID: 12345678-1234-1234-1234-123456789012 or S-1-1-12-1234567890-123456789-123456789-1234
            - Email address: group@domain.tld
            - Group name: group
        max-results: The maximum number of results to return in a single call.
        next-token: The token to use to retrieve the next page of results. The first call does not contain any tokens.
        organization-id: The identifier for the organization under which the group exists.
