name: update-template
description: Updates a template from an existing Amazon QuickSight analysis or another template.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the template that you're updating.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --definition=: The definition of a template.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: The name for the template.
    --source-entity=: The entity that you are using as a source when you update the template.
    --template-id=!: The ID for the template.
    --validation-strategy=: The option to relax the validation needed to update a template with definition objects.
    --version-description=: A description of the current template version that is being updated.
documentation:
    command: Updates a template from an existing Amazon QuickSight analysis or another template.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the template that you're updating.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        definition: |-
            The definition of a template.

            A definition is the data model of all features in a Dashboard, Template, or Analysis.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name for the template.
        source-entity: |-
            The entity that you are using as a source when you update the template. In `SourceEntity`, you specify the type of object you're using as source: `SourceTemplate` for a template or `SourceAnalysis` for an analysis. Both of these require an Amazon Resource Name (ARN). For `SourceTemplate`, specify the ARN of the source template. For `SourceAnalysis`, specify the ARN of the source analysis. The `SourceTemplate` ARN can contain any Amazon Web Services account and any QuickSight-supported Amazon Web Services Region;.

            Use the `DataSetReferences` entity within `SourceTemplate` or `SourceAnalysis` to list the replacement datasets for the placeholders listed in the original. The schema in each dataset must match its placeholder.
        template-id: The ID for the template.
        validation-strategy: The option to relax the validation needed to update a template with definition objects. This skips the validation step for specific errors.
        version-description: A description of the current template version that is being updated. Every time you call `UpdateTemplate`, you create a new version of the template. Each version of the template maintains a description of the version in the `VersionDescription` field.
