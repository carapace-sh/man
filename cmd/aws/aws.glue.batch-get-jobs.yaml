name: batch-get-jobs
description: Returns a list of resource metadata for a given list of job names.
flags:
    --job-names=!: A list of job names, which might be the names returned from the `ListJobs` operation.
documentation:
    command: Returns a list of resource metadata for a given list of job names. After calling the `ListJobs` operation, you can call this operation to access the data to which you have been granted permissions. This operation supports all IAM permissions, including permission conditions that uses tags.
    flag:
        job-names: A list of job names, which might be the names returned from the `ListJobs` operation.
