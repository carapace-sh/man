name: create-queue
description: Create a new transcoding queue.
flags:
    --concurrent-jobs=: Specify the maximum number of jobs your queue can process concurrently.
    --description=: Optional.
    --name=!: The name of the queue that you are creating.
    --pricing-plan=: Specifies whether the pricing plan for the queue is on-demand or reserved.
    --reservation-plan-settings=: Details about the pricing plan for your reserved queue.
    --status=: Initial state of the queue.
    --tags=: The tags that you want to add to the resource.
completion:
    flag:
        pricing-plan:
            - ON_DEMAND
            - RESERVED
        status:
            - ACTIVE
            - PAUSED
documentation:
    command: Create a new transcoding queue. For information about queues, see Working With Queues in the User Guide at https://docs.aws.amazon.com/mediaconvert/latest/ug/working-with-queues.html
    flag:
        concurrent-jobs: Specify the maximum number of jobs your queue can process concurrently. For on-demand queues, the value you enter is constrained by your service quotas for Maximum concurrent jobs, per on-demand queue and Maximum concurrent jobs, per account. For reserved queues, specify the number of jobs you can process concurrently in your reservation plan instead.
        description: Optional. A description of the queue that you are creating.
        name: The name of the queue that you are creating.
        pricing-plan: Specifies whether the pricing plan for the queue is on-demand or reserved. For on-demand, you pay per minute, billed in increments of .01 minute. For reserved, you pay for the transcoding capacity of the entire queue, regardless of how much or how little you use it. Reserved pricing requires a 12-month commitment. When you use the API to create a queue, the default is on-demand.
        reservation-plan-settings: Details about the pricing plan for your reserved queue. Required for reserved queues and not applicable to on-demand queues.
        status: Initial state of the queue. If you create a paused queue, then jobs in that queue won't begin.
        tags: The tags that you want to add to the resource. You can tag resources with a key-value pair or with only a key.
