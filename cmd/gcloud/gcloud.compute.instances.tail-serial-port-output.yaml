name: tail-serial-port-output
description: Periodically fetch new output from a virtual machine instance's serial port and display it as it becomes available.
flags:
    --port=: Instances can support up to four serial port outputs, numbered 1 through
    --zone=: Zone of the instance to operate on.
documentation:
    command: |-
        gcloud compute instances tail-serial-port-output is used to tail the output from a Compute
        Engine virtual machine instance's serial port. The serial port output
        from the instance will be printed to standard output. This
        information can be useful for diagnostic purposes.
    flag:
        port: |-
            Instances can support up to four serial port outputs, numbered 1 through
            4. By default, this command will return the output of the first serial
            port. Setting this flag will return the output of the requested serial
            port.
        zone: |-
            Zone of the instance to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
