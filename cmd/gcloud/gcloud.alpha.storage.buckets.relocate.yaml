name: relocate
description: '*(ALPHA)*  Relocates bucket between different locations.'
flags:
    --dry-run: Prints the operations that the relocate command would perform without actually performing relocation.
    --finalize!: Schedules the write lock to occur.
    --location=!: The final [location](https://cloud.google.com/storage/docs/locations) where the bucket will be relocated to.
    --no-dry-run&: Prints the operations that the relocate command would perform without actually performing relocation.
    --no-finalize!&: Schedules the write lock to occur.
    --operation=!: Specify the relocation operation name to advance the relocation operation.The relocation operation name must include the Cloud Storage bucket and operation ID.
    --placement=: A comma-separated list of regions that form the custom [dual-region](https://cloud.google.com/storage/docs/locations#location-dr). Only regions within the same continent are or will ever be valid.
    --ttl=: Time to live for the relocation operation.
documentation:
    command: |
        *(ALPHA)*  Relocates a bucket between different locations.
    flag:
        dry-run: Prints the operations that the relocate command would perform without actually performing relocation. This is helpful to identify any issues that need to be detected asynchronously.
        finalize: Schedules the write lock to occur. Once activated, no further writes will be allowed to the associated bucket. This helps minimize disruption to bucket usage. For certain types of moves(between Multi Region and Custom Dual Regions), finalize is not required.
        location: The final [location](https://cloud.google.com/storage/docs/locations) where the bucket will be relocated to. If no location is provided, Cloud Storage will use the default location, which is us.
        no-dry-run: Prints the operations that the relocate command would perform without actually performing relocation. This is helpful to identify any issues that need to be detected asynchronously.
        no-finalize: Schedules the write lock to occur. Once activated, no further writes will be allowed to the associated bucket. This helps minimize disruption to bucket usage. For certain types of moves(between Multi Region and Custom Dual Regions), finalize is not required.
        operation: Specify the relocation operation name to advance the relocation operation.The relocation operation name must include the Cloud Storage bucket and operation ID.
        placement: A comma-separated list of regions that form the custom [dual-region](https://cloud.google.com/storage/docs/locations#location-dr). Only regions within the same continent are or will ever be valid. Invalid location pairs (such as mixed-continent, or with unsupported regions) will return an error.
        ttl: Time to live for the relocation operation. Defaults to 12h if not provided.
