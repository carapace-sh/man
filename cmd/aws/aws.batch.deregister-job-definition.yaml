name: deregister-job-definition
description: Deregisters an Batch job definition.
flags:
    --job-definition=!: The name and revision (`name:revision`) or full Amazon Resource Name (ARN) of the job definition to deregister.
documentation:
    command: Deregisters an Batch job definition. Job definitions are permanently deleted after 180 days.
    flag:
        job-definition: The name and revision (`name:revision`) or full Amazon Resource Name (ARN) of the job definition to deregister.
