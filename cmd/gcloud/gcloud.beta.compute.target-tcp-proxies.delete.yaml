name: delete
description: '*(BETA)*  Delete target TCP proxies.'
flags:
    --global: If set, the target TCP proxies are global.
    --no-global&: If set, the target TCP proxies are global.
    --region=: Region of the target TCP proxies to delete.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute target-tcp-proxies delete* deletes one or more target TCP proxies.
    flag:
        global: If set, the target TCP proxies are global.
        no-global: If set, the target TCP proxies are global.
        region: |-
            Region of the target TCP proxies to delete. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
