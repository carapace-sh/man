name: resume-unsupported-sdk
description: '*(ALPHA)*  Resumes job running with the specified job id.'
flags:
    --region=: Region ID of the job's regional endpoint.
    --token=!: The resume token unique to the job.
documentation:
    command: '*(ALPHA)*  Resumes a pipeline job which is running on an unsupported SDK version.'
    flag:
        region: Region ID of the job's regional endpoint. Defaults to 'us-central1'.
        token: The resume token unique to the job.
