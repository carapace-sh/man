name: list-components
description: Returns the list of components that can be filtered by name, or by using the listed `filters` to streamline results.
flags:
    --by-name: Returns the list of components for the specified name.
    --filters=: 'Use the following filters to streamline results:'
    --max-results=: Specify the maximum number of items to return in a request.
    --next-token=: A token to specify where to start paginating.
    --no-by-name&: Returns the list of components for the specified name.
    --owner=: Filters results based on the type of owner for the component.
completion:
    flag:
        owner:
            - Self
            - Shared
            - Amazon
            - ThirdParty
            - AWSMarketplace
documentation:
    command: |-
        Returns the list of components that can be filtered by name, or by using the listed `filters` to streamline results. Newly created components can take up to two minutes to appear in the ListComponents API Results.

        The semantic version has four nodes: &lt;major&gt;.&lt;minor&gt;.&lt;patch&gt;/&lt;build&gt;. You can assign values for the first three, and can filter on all of them.

        **Filtering:** With semantic versioning, you have the flexibility to use wildcards (x) to specify the most recent versions or nodes when selecting the base image or components for your recipe. When you use a wildcard in any node, all nodes to the right of the first wildcard must also be wildcards.
    flag:
        by-name: Returns the list of components for the specified name.
        filters: |-
            Use the following filters to streamline results:

            - `description`
            - `name`
            - `platform`
            - `supportedOsVersion`
            - `type`
            - `version`
        max-results: Specify the maximum number of items to return in a request.
        next-token: A token to specify where to start paginating. This is the nextToken from a previously truncated response.
        owner: Filters results based on the type of owner for the component. By default, this request returns a list of components that your account owns. To see results for other types of owners, you can specify components that Amazon manages, third party components, or components that other accounts have shared with you.
