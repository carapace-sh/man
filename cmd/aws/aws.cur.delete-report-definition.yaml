name: delete-report-definition
description: Deletes the specified report.
flags:
    --report-name=!: The name of the report that you want to delete.
documentation:
    command: Deletes the specified report. Any tags associated with the report are also deleted.
    flag:
        report-name: The name of the report that you want to delete. The name must be unique, is case sensitive, and can't include spaces.
