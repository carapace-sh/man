name: list-odb-peering-connections
description: Lists all ODB peering connections or those associated with a specific ODB network.
flags:
    --max-results=: The maximum number of ODB peering connections to return in the response.
    --next-token=: The pagination token for the next page of ODB peering connections.
    --odb-network-id=: The identifier of the ODB network to list peering connections for.
documentation:
    command: Lists all ODB peering connections or those associated with a specific ODB network.
    flag:
        max-results: |-
            The maximum number of ODB peering connections to return in the response.

            Default: `20`

            Constraints:

            - Must be between 1 and 100.
        next-token: The pagination token for the next page of ODB peering connections.
        odb-network-id: |-
            The identifier of the ODB network to list peering connections for.

            If not specified, lists all ODB peering connections in the account.
