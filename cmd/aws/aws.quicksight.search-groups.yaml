name: search-groups
description: Use the `SearchGroups` operation to search groups in a specified Quick Sight namespace using the supplied filters.
flags:
    --aws-account-id=!: The ID for the Amazon Web Services account that the group is in.
    --filters=!: The structure for the search filters that you want to apply to your search.
    --max-results=: The maximum number of results to return from this request.
    --namespace=!: The namespace that you want to search.
    --next-token=: A pagination token that can be used in a subsequent request.
documentation:
    command: Use the `SearchGroups` operation to search groups in a specified Quick Sight namespace using the supplied filters.
    flag:
        aws-account-id: The ID for the Amazon Web Services account that the group is in. Currently, you use the ID for the Amazon Web Services account that contains your Amazon Quick Sight account.
        filters: The structure for the search filters that you want to apply to your search.
        max-results: The maximum number of results to return from this request.
        namespace: The namespace that you want to search.
        next-token: A pagination token that can be used in a subsequent request.
