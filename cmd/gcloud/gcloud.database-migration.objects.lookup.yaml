name: lookup
description: Lookup a DMS migration job object.
flags:
    --database=: The name of the database to lookup.
    --migration-job=!: ID of the migration_job or fully qualified identifier for the migration_job.
    --region=: The Cloud region for the migration_job.
    --schema=: The name of the schema to lookup.
    --table=: The name of the table to lookup.
    --type=: The type of the object to lookup.
completion:
    flag:
        type:
            - DATABASE
            - SCHEMA
            - TABLE
documentation:
    command: Lookup a migration job object by its source object identifier (e.g. database)
    flag:
        database: The name of the database to lookup.
        migration-job: |-
            ID of the migration_job or fully qualified identifier for the migration_job.
            +
            To set the `migration_job` attribute:
            * provide the argument `--migration-job` on the command line.
        region: |-
            The Cloud region for the migration_job.
            +
            To set the `region` attribute:
            * provide the argument `--migration-job` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        schema: The name of the schema to lookup.
        table: The name of the table to lookup.
        type: 'The type of the object to lookup. If not provided, the default is DATABASE. _TYPE_ must be one of: *DATABASE*, *SCHEMA*, *TABLE*.'
