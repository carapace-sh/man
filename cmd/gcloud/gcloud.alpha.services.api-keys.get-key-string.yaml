name: get-key-string
description: '*(ALPHA)*  Get the key string of an API key.'
flags:
    --location=: Location of the key.
documentation:
    command: |-
        *(ALPHA)*  Get the key string of an API key

        ## EXAMPLES


          To get the key string of API key `1234`, run:

           $ gcloud alpha services api-keys get-key-string 1234

          To get the key string of API key `1234` in project
          `myproject` using the fully qualified API key name, run:

           $ gcloud alpha services api-keys get-key-string projects/myproject/locations/global/keys/1234
    flag:
        location: |-
            Location of the key.
            +
            To set the `location` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * location will default to global.
