name: update
description: '*(ALPHA)*  Update the specified Backup.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup-vault=: The ID of the Backup Vault.
    --data-source=: The ID of the Data Source.
    --enforced-retention-end-time=: Backups cannot be deleted until this time or later.
    --expire-time=: The date when this backup is automatically expired.
    --location=: The location of the Backup.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(ALPHA)*  Update the specified Backup.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        backup-vault: |-
            The ID of the Backup Vault.
            +
            To set the `backup-vault` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--backup-vault` on the command line.
        data-source: |-
            The ID of the Data Source.
            +
            To set the `data-source` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--data-source` on the command line.
        enforced-retention-end-time: |-
            Backups cannot be deleted until this time or later. This period can be extended, but not shortened.
            It should be specified in the format of "YYYY-MM-DD".
            +
            * For backup configured with a backup appliance, there are additional restrictions:
              1. Enforced retention cannot be extended past the expiry time.
              2. Enforced retention can only be updated for finalized backups.
        expire-time: The date when this backup is automatically expired. This date can be extended, but not shortened. It should be specified in the format of "YYYY-MM-DD".
        location: |-
            The location of the Backup.
            +
            To set the `location` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
