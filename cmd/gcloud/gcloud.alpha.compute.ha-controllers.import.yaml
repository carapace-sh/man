name: import
description: '*(ALPHA)*  Import an HA Controller.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Google Compute Engine region where the HA Controller exists.
    --source=: Path to a YAML file containing configuration export data.
documentation:
    command: |-
        *(ALPHA)*  Import an High Availability (HA) Controller, which helps
        ensure that a virtual machine (VM) instance remains operational by
        automatically managing failover across two zones.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Google Compute Engine region where the HA Controller exists.
            +
            Overrides the default compute/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `ha_controller` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `compute/region`.
        source: |-
            Path to a YAML file containing configuration export data.
                      Alternatively, you may omit this flag to read from standard input.For a schema describing the export/import format, see:
                      $CLOUDSDKROOT/lib/googlecloudsdk/schemas/compute/alpha/HaController.yaml.
            +

                  Note: $CLOUDSDKROOT represents the Google Cloud CLI's installation directory.
