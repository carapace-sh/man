name: update-facet
description: |-
    Does the following:

    1. Adds new `Attributes`, `Rules`, or `ObjectTypes`.
flags:
    --attribute-updates=: List of attributes that need to be updated in a given schema [Facet]().
    --name=!: The name of the facet.
    --object-type=: The object type that is associated with the facet.
    --schema-arn=!: The Amazon Resource Name (ARN) that is associated with the [Facet]().
completion:
    flag:
        object-type:
            - NODE
            - LEAF_NODE
            - POLICY
            - INDEX
documentation:
    command: |-
        Does the following:

        1. Adds new `Attributes`, `Rules`, or `ObjectTypes`.
        2. Updates existing `Attributes`, `Rules`, or `ObjectTypes`.
        3. Deletes existing `Attributes`, `Rules`, or `ObjectTypes`.
    flag:
        attribute-updates: List of attributes that need to be updated in a given schema [Facet](). Each attribute is followed by `AttributeAction`, which specifies the type of update operation to perform.
        name: The name of the facet.
        object-type: The object type that is associated with the facet. See [CreateFacetRequest$ObjectType]() for more details.
        schema-arn: The Amazon Resource Name (ARN) that is associated with the [Facet](). For more information, see [arns]().
