documentation:
    command: "Creates a job to import or export data between Amazon S3 and your on-premises data center. Your Amazon Web Services account must have the right trust policies and permissions in place to create a job for a Snow device. If you're creating a job for a node in a cluster, you only need to provide the `clusterId` value; the other job attributes are inherited from the cluster.\n\nOnly the Snowball; Edge device type is supported when ordering clustered jobs.\n\nThe device capacity is optional.\n\nAvailability of device types differ by Amazon Web Services Region. For more information about Region availability, see [Amazon Web Services Regional Services](https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/?p=ngi&loc=4).\n\n**Snow Family devices and their capacities.**\n\n- Device type: **SNC1\\_SSD**\n  \n  - Capacity: T14\n  - Description: Snowcone\n- Device type: **SNC1\\_HDD**\n  \n  - Capacity: T8\n  - Description: Snowcone\n- Device type: **EDGE\\_S**\n  \n  - Capacity: T98\n  - Description: Snowball Edge Storage Optimized for data transfer only\n- Device type: **EDGE\\_CG**\n  \n  - Capacity: T42\n  - Description: Snowball Edge Compute Optimized with GPU\n- Device type: **EDGE\\_C**\n  \n  - Capacity: T42\n  - Description: Snowball Edge Compute Optimized without GPU\n- Device type: **EDGE**\n  \n  - Capacity: T100\n  - Description: Snowball Edge Storage Optimized with EC2 Compute\n  \n  This device is replaced with T98.\n- Device type: **STANDARD**\n  \n  - Capacity: T50\n  - Description: Original Snowball device\n    \n    This device is only available in the Ningxia, Beijing, and Singapore Amazon Web Services Region\n- Device type: **STANDARD**\n  \n  - Capacity: T80\n  - Description: Original Snowball device\n    \n    This device is only available in the Ningxia, Beijing, and Singapore Amazon Web Services Region.\n- Snow Family device type: **RACK\\_5U\\_C**\n  \n  - Capacity: T13\n  - Description: Snowblade.\n- Device type: **V3\\_5S**\n  \n  - Capacity: T240\n  - Description: Snowball Edge Storage Optimized 210TB"
    flag:
        address-id: The ID for the address that you want the Snow device shipped to.
        cluster-id: The ID of a cluster. If you're creating a job for a node in a cluster, you need to provide only this `clusterId` value. The other job attributes are inherited from the cluster.
        description: Defines an optional description of this specific job, for example `Important Photos 2016-08-11`.
        device-configuration: |-
            Defines the device configuration for an Snowball Edge job.

            For more information, see "https://docs.aws.amazon.com/snowball/latest/snowcone-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide* or "https://docs.aws.amazon.com/snowball/latest/developer-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide*.
        forwarding-address-id: The forwarding address ID for a job. This field is not supported in most Regions.
        impact-level: The highest impact level of data that will be stored or processed on the device, provided at job creation.
        job-type: Defines the type of job that you're creating.
        kms-key-arn: The `KmsKeyARN` that you want to associate with this job. `KmsKeyARN`s are created using the [CreateKey](https://docs.aws.amazon.com/kms/latest/APIReference/API_CreateKey.html) Key Management Service (KMS) API action.
        long-term-pricing-id: The ID of the long-term pricing type for the device.
        notification: Defines the Amazon Simple Notification Service (Amazon SNS) notification settings for this job.
        on-device-service-configuration: Specifies the service or services on the Snow Family device that your transferred data will be exported from or imported into. Amazon Web Services Snow Family supports Amazon S3 and NFS (Network File System) and the Amazon Web Services Storage Gateway service Tape Gateway type.
        pickup-details: Information identifying the person picking up the device.
        remote-management: Allows you to securely operate and manage Snowcone devices remotely from outside of your internal network. When set to `INSTALLED_AUTOSTART`, remote management will automatically be available when the device arrives at your location. Otherwise, you need to use the Snowball Edge client to manage the device. When set to `NOT_INSTALLED`, remote management will not be available on the device.
        resources: |-
            Defines the Amazon S3 buckets associated with this job.

            With `IMPORT` jobs, you specify the bucket or buckets that your transferred data will be imported into.

            With `EXPORT` jobs, you specify the bucket or buckets that your transferred data will be exported from. Optionally, you can also specify a `KeyRange` value. If you choose to export a range, you define the length of the range by providing either an inclusive `BeginMarker` value, an inclusive `EndMarker` value, or both. Ranges are UTF-8 binary sorted.
        role-arn: The `RoleARN` that you want to associate with this job. `RoleArn`s are created using the [CreateRole](https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateRole.html) Identity and Access Management (IAM) API action.
        shipping-option: |-
            The shipping speed for this job. This speed doesn't dictate how soon you'll get the Snow device, rather it represents how quickly the Snow device moves to its destination while in transit. Regional shipping speeds are as follows:

            - In Australia, you have access to express shipping. Typically, Snow devices shipped express are delivered in about a day.
            - In the European Union (EU), you have access to express shipping. Typically, Snow devices shipped express are delivered in about a day. In addition, most countries in the EU have access to standard shipping, which typically takes less than a week, one way.
            - In India, Snow devices are delivered in one to seven days.
            - In the US, you have access to one-day shipping and two-day shipping.
        snowball-capacity-preference: |-
            If your job is being created in one of the US regions, you have the option of specifying what size Snow device you'd like for this job. In all other regions, Snowballs come with 80 TB in storage capacity.

            For more information, see "https://docs.aws.amazon.com/snowball/latest/snowcone-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide* or "https://docs.aws.amazon.com/snowball/latest/developer-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide*.
        snowball-type: |-
            The type of Snow Family devices to use for this job.

            For cluster jobs, Amazon Web Services Snow Family currently supports only the `EDGE` device type.

            The type of Amazon Web Services Snow device to use for this job. Currently, the only supported device type for cluster jobs is `EDGE`.

            For more information, see [Snowball Edge Device Options](https://docs.aws.amazon.com/snowball/latest/developer-guide/device-differences.html) in the Snowball Edge Developer Guide.

            For more information, see "https://docs.aws.amazon.com/snowball/latest/snowcone-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide* or "https://docs.aws.amazon.com/snowball/latest/developer-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide*.
        tax-documents: The tax documents required in your Amazon Web Services Region.
