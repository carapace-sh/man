name: search-jobs
description: Retrieve a JSON array that includes job details for up to twenty of your most recent jobs.
flags:
    --input-file=: Optional.
    --max-results=: Optional.
    --next-token=: Optional.
    --order=: Optional.
    --queue=: Optional.
    --status=: Optional.
completion:
    flag:
        order:
            - ASCENDING
            - DESCENDING
        status:
            - SUBMITTED
            - PROGRESSING
            - COMPLETE
            - CANCELED
            - ERROR
documentation:
    command: Retrieve a JSON array that includes job details for up to twenty of your most recent jobs. Optionally filter results further according to input file, queue, or status. To retrieve the twenty next most recent jobs, use the nextToken string returned with the array.
    flag:
        input-file: Optional. Provide your input file URL or your partial input file name. The maximum length for an input file is 300 characters.
        max-results: Optional. Number of jobs, up to twenty, that will be returned at one time.
        next-token: Optional. Use this string, provided with the response to a previous request, to request the next batch of jobs.
        order: Optional. When you request lists of resources, you can specify whether they are sorted in ASCENDING or DESCENDING order. Default varies by resource.
        queue: Optional. Provide a queue name, or a queue ARN, to return only jobs from that queue.
        status: Optional. A job's status can be SUBMITTED, PROGRESSING, COMPLETE, CANCELED, or ERROR.
