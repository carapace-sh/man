name: update-repository-name
description: Renames a repository.
flags:
    --new-name=!: The new name for the repository.
    --old-name=!: The current name of the repository.
documentation:
    command: Renames a repository. The repository name must be unique across the calling Amazon Web Services account. Repository names are limited to 100 alphanumeric, dash, and underscore characters, and cannot include certain characters. The suffix .git is prohibited. For more information about the limits on repository names, see [Quotas](https://docs.aws.amazon.com/codecommit/latest/userguide/limits.html) in the CodeCommit User Guide.
    flag:
        new-name: The new name for the repository.
        old-name: The current name of the repository.
