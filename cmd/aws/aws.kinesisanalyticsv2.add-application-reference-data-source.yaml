name: add-application-reference-data-source
description: Adds a reference data source to an existing SQL-based Kinesis Data Analytics application.
flags:
    --application-name=!: The name of an existing application.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --current-application-version-id=!: The version of the application for which you are adding the reference data source.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --reference-data-source=!: The reference data source can be an object in your Amazon S3 bucket.
documentation:
    command: |-
        Adds a reference data source to an existing SQL-based Kinesis Data Analytics application.

        Kinesis Data Analytics reads reference data (that is, an Amazon S3 object) and creates an in-application table within your application. In the request, you provide the source (S3 bucket name and object key name), name of the in-application table to create, and the necessary mapping information that describes how data in an Amazon S3 object maps to columns in the resulting in-application table.
    flag:
        application-name: The name of an existing application.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        current-application-version-id: The version of the application for which you are adding the reference data source. You can use the [DescribeApplication]() operation to get the current application version. If the version specified is not the current version, the `ConcurrentModificationException` is returned.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        reference-data-source: The reference data source can be an object in your Amazon S3 bucket. Kinesis Data Analytics reads the object and copies the data into the in-application table that is created. You provide an S3 bucket, object key name, and the resulting in-application table that is created.
