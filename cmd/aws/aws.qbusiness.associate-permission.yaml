name: associate-permission
description: Adds or updates a permission policy for a Amazon Q Business application, allowing cross-account access for an ISV.
flags:
    --actions=!: The list of Amazon Q Business actions that the ISV is allowed to perform.
    --application-id=!: The unique identifier of the Amazon Q Business application.
    --conditions=: The conditions that restrict when the permission is effective.
    --principal=!: The Amazon Resource Name of the IAM role for the ISV that is being granted permission.
    --statement-id=!: A unique identifier for the policy statement.
documentation:
    command: Adds or updates a permission policy for a Amazon Q Business application, allowing cross-account access for an ISV. This operation creates a new policy statement for the specified Amazon Q Business application. The policy statement defines the IAM actions that the ISV is allowed to perform on the Amazon Q Business application's resources.
    flag:
        actions: The list of Amazon Q Business actions that the ISV is allowed to perform.
        application-id: The unique identifier of the Amazon Q Business application.
        conditions: The conditions that restrict when the permission is effective. These conditions can be used to limit the permission based on specific attributes of the request.
        principal: The Amazon Resource Name of the IAM role for the ISV that is being granted permission.
        statement-id: A unique identifier for the policy statement.
