name: update
description: '*(BETA)*  Update a Compute Engine target pool.'
flags:
    --region=: Region of the target pool to update.
    --security-policy-region=: Region of the security policy to operate on.
    --security-policy=: The security policy that will be set for this target pool.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute target-pools update* updates a Compute Engine target pool.

        ## EXAMPLES

        To update the security policy run this:

          $ gcloud beta compute target-pools update TARGET_POOL --security-policy='my-policy'
    flag:
        region: |-
            Region of the target pool to update. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        security-policy: The security policy that will be set for this target pool. To remove the policy from this target pool set the policy to an empty string.
        security-policy-region: Region of the security policy to operate on. Overrides the default *compute/region* property value for this command invocation.
