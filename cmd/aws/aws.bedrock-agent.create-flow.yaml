name: create-flow
description: Creates a prompt flow that you can use to send an input through various steps to yield an output.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --customer-encryption-key-arn=: The Amazon Resource Name (ARN) of the KMS key to encrypt the flow.
    --definition=: A definition of the nodes and connections between nodes in the flow.
    --description=: A description for the flow.
    --execution-role-arn=!: The Amazon Resource Name (ARN) of the service role with permissions to create and manage a flow.
    --name=!: A name for the flow.
    --tags=: Any tags that you want to attach to the flow.
documentation:
    command: Creates a prompt flow that you can use to send an input through various steps to yield an output. Configure nodes, each of which corresponds to a step of the flow, and create connections between the nodes to create paths to different outputs. For more information, see [How it works](https://docs.aws.amazon.com/bedrock/latest/userguide/flows-how-it-works.html) and [Create a flow in Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/flows-create.html) in the Amazon Bedrock User Guide.
    flag:
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        customer-encryption-key-arn: The Amazon Resource Name (ARN) of the KMS key to encrypt the flow.
        definition: A definition of the nodes and connections between nodes in the flow.
        description: A description for the flow.
        execution-role-arn: The Amazon Resource Name (ARN) of the service role with permissions to create and manage a flow. For more information, see [Create a service role for flows in Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/flows-permissions.html) in the Amazon Bedrock User Guide.
        name: A name for the flow.
        tags: Any tags that you want to attach to the flow. For more information, see [Tagging resources in Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/tagging.html).
