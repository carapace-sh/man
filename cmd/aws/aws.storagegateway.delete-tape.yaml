name: delete-tape
description: Deletes the specified virtual tape.
flags:
    --bypass-governance-retention: Set to `TRUE` to delete an archived tape that belongs to a custom pool with tape retention lock.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --gateway-arn=!: The unique Amazon Resource Name (ARN) of the gateway that the virtual tape to delete is associated with.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-bypass-governance-retention: Set to `TRUE` to delete an archived tape that belongs to a custom pool with tape retention lock.
    --tape-arn=!: The Amazon Resource Name (ARN) of the virtual tape to delete.
documentation:
    command: Deletes the specified virtual tape. This operation is only supported in the tape gateway type.
    flag:
        bypass-governance-retention: Set to `TRUE` to delete an archived tape that belongs to a custom pool with tape retention lock. Only archived tapes with tape retention lock set to `governance` can be deleted. Archived tapes with tape retention lock set to `compliance` can't be deleted.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        gateway-arn: The unique Amazon Resource Name (ARN) of the gateway that the virtual tape to delete is associated with. Use the [ListGateways]() operation to return a list of gateways for your account and Amazon Web Services Region.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tape-arn: The Amazon Resource Name (ARN) of the virtual tape to delete.
