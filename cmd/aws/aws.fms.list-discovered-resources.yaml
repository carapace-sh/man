name: list-discovered-resources
description: Returns an array of resources in the organization's accounts that are available to be associated with a resource set.
flags:
    --max-results=: The maximum number of objects that you want Firewall Manager to return for this request.
    --member-account-ids=!: The Amazon Web Services account IDs to discover resources in.
    --next-token=: When you request a list of objects with a `MaxResults` setting, if the number of objects that are still available for retrieval exceeds the maximum you requested, Firewall Manager returns a `NextToken` value in the response.
    --resource-type=!: The type of resources to discover.
documentation:
    command: Returns an array of resources in the organization's accounts that are available to be associated with a resource set.
    flag:
        max-results: The maximum number of objects that you want Firewall Manager to return for this request. If more objects are available, in the response, Firewall Manager provides a `NextToken` value that you can use in a subsequent call to get the next batch of objects.
        member-account-ids: The Amazon Web Services account IDs to discover resources in. Only one account is supported per request. The account must be a member of your organization.
        next-token: When you request a list of objects with a `MaxResults` setting, if the number of objects that are still available for retrieval exceeds the maximum you requested, Firewall Manager returns a `NextToken` value in the response. To retrieve the next batch of objects, use the token returned from the prior request in your next request.
        resource-type: The type of resources to discover.
