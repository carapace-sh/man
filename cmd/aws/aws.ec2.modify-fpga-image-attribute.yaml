name: modify-fpga-image-attribute
description: Modifies the specified attribute of the specified Amazon FPGA Image (AFI).
flags:
    --attribute=: The name of the attribute.
    --description=: A description for the AFI.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --fpga-image-id=!: The ID of the AFI.
    --load-permission=: The load permission for the AFI.
    --name=: A name for the AFI.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --operation-type=: The operation type.
    --product-codes=: The product codes.
    --user-groups=: The user groups.
    --user-ids=: The Amazon Web Services account IDs.
completion:
    flag:
        attribute:
            - description
            - name
            - loadPermission
            - productCodes
        operation-type:
            - add
            - remove
documentation:
    command: Modifies the specified attribute of the specified Amazon FPGA Image (AFI).
    flag:
        attribute: The name of the attribute.
        description: A description for the AFI.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        fpga-image-id: The ID of the AFI.
        load-permission: The load permission for the AFI.
        name: A name for the AFI.
        operation-type: The operation type.
        product-codes: The product codes. After you add a product code to an AFI, it can't be removed. This parameter is valid only when modifying the `productCodes` attribute.
        user-groups: The user groups. This parameter is valid only when modifying the `loadPermission` attribute.
        user-ids: The Amazon Web Services account IDs. This parameter is valid only when modifying the `loadPermission` attribute.
