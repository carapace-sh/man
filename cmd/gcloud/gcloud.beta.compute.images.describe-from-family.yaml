name: describe-from-family
description: '*(BETA)*  Describe the latest image from an image family.'
flags:
    --zone=: Zone to query.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute images describe-from-family* looks up the latest image from an image family and runs a
        describe on it. If the image is not in the default project, you need to
        specify a value for `--project`.
    flag:
        zone: Zone to query. Returns the latest image available in the image family for the specified zone. If not specified, returns the latest globally available image.
