name: get-uicustomization
description: Given a user pool ID or app client, returns information about classic hosted UI branding that you applied, if any.
flags:
    --client-id=: The ID of the app client that you want to query for branding settings.
    --user-pool-id=!: The ID of the user pool that you want to query for branding settings.
documentation:
    command: Given a user pool ID or app client, returns information about classic hosted UI branding that you applied, if any. Returns user-pool level branding information if no app client branding is applied, or if you don't specify an app client ID. Returns an empty object if you haven't applied hosted UI branding to either the client or the user pool. For more information, see [Hosted UI (classic) branding](https://docs.aws.amazon.com/cognito/latest/developerguide/hosted-ui-classic-branding.html).
    flag:
        client-id: The ID of the app client that you want to query for branding settings.
        user-pool-id: The ID of the user pool that you want to query for branding settings.
