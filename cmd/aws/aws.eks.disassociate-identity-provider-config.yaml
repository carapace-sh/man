name: disassociate-identity-provider-config
description: Disassociates an identity provider configuration from a cluster.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --cluster-name=!: The name of your cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-provider-config=!: An object representing an identity provider configuration.
documentation:
    command: |-
        Disassociates an identity provider configuration from a cluster.

        If you disassociate an identity provider from your cluster, users included in the provider can no longer access the cluster. However, you can still access the cluster with IAM principals.
    flag:
