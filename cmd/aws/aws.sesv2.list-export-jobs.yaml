name: list-export-jobs
description: Lists all of the export jobs.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --export-source-type=: A value used to list export jobs that have a certain `ExportSourceType`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-status=: A value used to list export jobs that have a certain `JobStatus`.
    --next-token=: The pagination token returned from a previous call to `ListExportJobs` to indicate the position in the list of export jobs.
    --page-size=: Maximum number of export jobs to return at once.
completion:
    flag:
        export-source-type:
            - METRICS_DATA
            - MESSAGE_INSIGHTS
        job-status:
            - CREATED
            - PROCESSING
            - COMPLETED
            - FAILED
            - CANCELLED
documentation:
    command: Lists all of the export jobs.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        export-source-type: A value used to list export jobs that have a certain `ExportSourceType`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-status: A value used to list export jobs that have a certain `JobStatus`.
        next-token: The pagination token returned from a previous call to `ListExportJobs` to indicate the position in the list of export jobs.
        page-size: Maximum number of export jobs to return at once. Use this parameter to paginate results. If additional export jobs exist beyond the specified limit, the `NextToken` element is sent in the response. Use the `NextToken` value in subsequent calls to `ListExportJobs` to retrieve additional export jobs.
