name: list-tags-for-resource
description: Gets a list of tags associated with a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the index, FAQ, data source, or other resource to get a list of tags for.
documentation:
    command: Gets a list of tags associated with a resource. Indexes, FAQs, data sources, and other resources can have tags associated with them.
    flag:
        resource-arn: 'The Amazon Resource Name (ARN) of the index, FAQ, data source, or other resource to get a list of tags for. For example, the ARN of an index is constructed as follows: *arn:aws:kendra:your-region:your-account-id:index/index-id* For information on how to construct an ARN for all types of Amazon Kendra resources, see [Resource types](https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonkendra.html#amazonkendra-resources-for-iam-policies).'
