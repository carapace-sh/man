name: create-software-update-job
description: Creates a software update for a core or group of cores (specified as an IoT thing group.)
flags:
    --amzn-client-token=: A client token used to correlate requests and responses.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --s3-url-signer-role=!: ""
    --software-to-update=!: ""
    --update-agent-log-level=: ""
    --update-targets-architecture=!: ""
    --update-targets-operating-system=!: ""
    --update-targets=!: ""
completion:
    flag:
        software-to-update:
            - core
            - ota_agent
        update-agent-log-level:
            - NONE
            - TRACE
            - DEBUG
            - VERBOSE
            - INFO
            - WARN
            - ERROR
            - FATAL
        update-targets-architecture:
            - armv6l
            - armv7l
            - x86_64
            - aarch64
        update-targets-operating-system:
            - ubuntu
            - raspbian
            - amazon_linux
            - openwrt
documentation:
    command: Creates a software update for a core or group of cores (specified as an IoT thing group.) Use this to update the OTA Agent as well as the Greengrass core software. It makes use of the IoT Jobs feature which provides additional commands to manage a Greengrass core software update job.
    flag:
        amzn-client-token: A client token used to correlate requests and responses.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        s3-url-signer-role: ""
        software-to-update: ""
        update-agent-log-level: ""
        update-targets: ""
        update-targets-architecture: ""
        update-targets-operating-system: ""
