name: authorize
description: Authorize an account for all Transfer Service features.
flags:
    --add-missing: Add IAM roles necessary to use all Transfer Service features to the specified account.
    --creds-file=: The path to the creds file for an account to authorize.
    --no-add-missing&: Add IAM roles necessary to use all Transfer Service features to the specified account.
documentation:
    command: |
        Authorize a Google account for all Transfer Service features.

        This command provides admin and owner rights for simplicity. If that's
        too much authority for your use case, see custom setups here:
        https://cloud.google.com/storage-transfer/docs/on-prem-set-up
    flag:
        add-missing: Add IAM roles necessary to use all Transfer Service features to the specified account. By default, this command just prints missing roles.
        creds-file: The path to the creds file for an account to authorize. The file should be in JSON format and contain a "type" and "client_email", which are automatically generated for most creds files downloaded from Google (e.g. service account tokens). If this flag is not present, the command authorizes the user currently logged into gcloud.
        no-add-missing: Add IAM roles necessary to use all Transfer Service features to the specified account. By default, this command just prints missing roles.
