name: resolve
description: Resolves a service.
flags:
    --endpoint-filter=: Apply a Boolean filter EXPRESSION to each endpoint in the service.
    --location=: The name of the region for the service.
    --max-endpoints=: Maximum number of endpoints to return.
    --namespace=: The name of the namespace for the service.
documentation:
    command: Resolves a service.
    flag:
        endpoint-filter: |-
            Apply a Boolean filter EXPRESSION to each endpoint in the service.
            If the expression evaluates True, then that endpoint is listed.
        location: |-
            The name of the region for the service.
            +
            To set the `location` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        max-endpoints: Maximum number of endpoints to return.
        namespace: |-
            The name of the namespace for the service.
            +
            To set the `namespace` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--namespace` on the command line.
