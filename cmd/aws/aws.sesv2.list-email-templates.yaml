name: list-email-templates
description: Lists the email templates present in your Amazon SES account in the current Amazon Web Services Region.
flags:
    --next-token=: A token returned from a previous call to `ListEmailTemplates` to indicate the position in the list of email templates.
    --page-size=: The number of results to show in a single call to `ListEmailTemplates`.
documentation:
    command: |-
        Lists the email templates present in your Amazon SES account in the current Amazon Web Services Region.

        You can execute this operation no more than once per second.
    flag:
        next-token: A token returned from a previous call to `ListEmailTemplates` to indicate the position in the list of email templates.
        page-size: |-
            The number of results to show in a single call to `ListEmailTemplates`. If the number of results is larger than the number you specified in this parameter, then the response includes a `NextToken` element, which you can use to obtain additional results.

            The value you specify has to be at least 1, and can be no more than 100.
