name: removenodes
description: '*(ALPHA)*  Remove a node from the cluster in a VMware Engine private cloud.'
hidden: true
flags:
    --privatecloud=: VMware Engine private cloud.
    --region=: Region of the private cloud or cluster.
documentation:
    command: |
        *(ALPHA)*  Remove a node from the VMware Engine cluster. Successful removal
        of a node results in a cluster in READY state. Check the progress
        of a cluster using `gcloud alpha vmware clusters list`.

        For more examples, refer to the EXAMPLES section below.
    flag:
        privatecloud: |-
            VMware Engine private cloud.
            +
            To set the `privatecloud` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--privatecloud` on the command line.
        region: |-
            Region of the private cloud or cluster.
            +
            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `vmware/region`.
