name: reset-ssl-config
description: '*(BETA)*  Reset SSL materials according to the reset SSL mode.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --mode=: Selectively refresh the SSL materials.
    --no-async&: Return immediately, without waiting for the operation in progress to
completion:
    flag:
        mode:
            - ALL
            - SYNC_FROM_PRIMARY
documentation:
    command: '*(BETA)*  Reset SSL materials according to the reset SSL mode.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        mode: |-
            Selectively refresh the SSL materials. _MODE_ must be one of:
            +
            *ALL*::: Refresh all TLS configs. This is the default behaviour.
            *SYNC_FROM_PRIMARY*::: Refreshes the replication-related TLS configuration settings provided by the primary instance. Not applicable to on-premises replication instances.
            :::
            +
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
