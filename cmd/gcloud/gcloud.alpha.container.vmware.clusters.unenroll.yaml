name: unenroll
description: '*(ALPHA)*  Unenroll an Anthos cluster on VMware.'
hidden: true
flags:
    --allow-missing: If set, and the VMware Cluster is not found, the request will succeed but no action will be taken on the server and return a completed LRO.
    --async: Return immediately, without waiting for the operation in progress to
    --force: If set, any child node pools will also be unenrolled.
    --location=: Google Cloud location for the cluster.
    --no-allow-missing&: If set, and the VMware Cluster is not found, the request will succeed but no action will be taken on the server and return a completed LRO.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-force&: If set, any child node pools will also be unenrolled.
    --no-validate-only&: If set, only validate the request, but do not actually perform the operation.
    --validate-only: If set, only validate the request, but do not actually perform the operation.
documentation:
    command: '*(ALPHA)*  Unenroll an Anthos cluster on VMware.'
    flag:
        allow-missing: If set, and the VMware Cluster is not found, the request will succeed but no action will be taken on the server and return a completed LRO.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        force: If set, any child node pools will also be unenrolled. This flag is required if the cluster has any associated node pools.
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_vmware/location`.
        no-allow-missing: If set, and the VMware Cluster is not found, the request will succeed but no action will be taken on the server and return a completed LRO.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-force: If set, any child node pools will also be unenrolled. This flag is required if the cluster has any associated node pools.
        no-validate-only: If set, only validate the request, but do not actually perform the operation.
        validate-only: If set, only validate the request, but do not actually perform the operation.
