name: get-filter
description: Returns the details of the filter specified by the filter name.
flags:
    --detector-id=!: The unique ID of the detector that is associated with this filter.
    --filter-name=!: The name of the filter you want to get.
documentation:
    command: Returns the details of the filter specified by the filter name.
    flag:
        detector-id: |-
            The unique ID of the detector that is associated with this filter.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        filter-name: The name of the filter you want to get.
