name: create-storage-virtual-machine
description: Creates a storage virtual machine (SVM) for an Amazon FSx for ONTAP file system.
flags:
    --active-directory-configuration=: Describes the self-managed Microsoft Active Directory to which you want to join the SVM.
    --client-request-token=: ""
    --file-system-id=!: ""
    --name=!: The name of the SVM.
    --root-volume-security-style=: The security style of the root volume of the SVM.
    --svm-admin-password=: The password to use when managing the SVM using the NetApp ONTAP CLI or REST API.
    --tags=: ""
completion:
    flag:
        root-volume-security-style:
            - UNIX
            - NTFS
            - MIXED
documentation:
    command: Creates a storage virtual machine (SVM) for an Amazon FSx for ONTAP file system.
    flag:
        active-directory-configuration: Describes the self-managed Microsoft Active Directory to which you want to join the SVM. Joining an Active Directory provides user authentication and access control for SMB clients, including Microsoft Windows and macOS clients accessing the file system.
        client-request-token: ""
        file-system-id: ""
        name: The name of the SVM.
        root-volume-security-style: |-
            The security style of the root volume of the SVM. Specify one of the following values:

            - `UNIX` if the file system is managed by a UNIX administrator, the majority of users are NFS clients, and an application accessing the data uses a UNIX user as the service account.
            - `NTFS` if the file system is managed by a Microsoft Windows administrator, the majority of users are SMB clients, and an application accessing the data uses a Microsoft Windows user as the service account.
            - `MIXED` This is an advanced setting. For more information, see [Volume security style](https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/volume-security-style.html) in the Amazon FSx for NetApp ONTAP User Guide.
        svm-admin-password: The password to use when managing the SVM using the NetApp ONTAP CLI or REST API. If you do not specify a password, you can still use the file system's `fsxadmin` user to manage the SVM.
        tags: ""
