name: clone
description: '*(BETA)*  Clone a cloud source repository.'
flags:
    --dry-run: If provided, prints the command that would be run to standard out instead of executing it.
    --no-dry-run&: If provided, prints the command that would be run to standard out instead of executing it.
    --no-use-full-gcloud-path&: If provided, use the full gcloud path for the git credential.helper.
    --use-full-gcloud-path: If provided, use the full gcloud path for the git credential.helper.
documentation:
    command: |
        *(BETA)*  This command clones a git repository from the currently active
        Google Cloud project into the specified directory or into the current
        directory if no target directory is specified.

        Each Google Cloud project can have zero or more git repositories
        associated with it. To see the available repositories, run:

          $ gcloud beta source repos list

        The clone operation configures the local clone to use your gcloud
        credentials to authenticate future git operations. This command emits a
        warning if the cloud source repository is a mirror.
    flag:
        dry-run: If provided, prints the command that would be run to standard out instead of executing it.
        no-dry-run: If provided, prints the command that would be run to standard out instead of executing it.
        no-use-full-gcloud-path: If provided, use the full gcloud path for the git credential.helper. Using the full path means that gcloud does not need to be in the path for future git operations on the repository.
        use-full-gcloud-path: If provided, use the full gcloud path for the git credential.helper. Using the full path means that gcloud does not need to be in the path for future git operations on the repository.
