name: update-availability-options
description: Configures the availability options for a domain.
flags:
    --domain-name=!: ""
    --multi-az!: You expand an existing search domain to a second Availability Zone by setting the Multi-AZ option to true.
    --no-multi-az!&: You expand an existing search domain to a second Availability Zone by setting the Multi-AZ option to true.
documentation:
    command: Configures the availability options for a domain. Enabling the Multi-AZ option expands an Amazon CloudSearch domain to an additional Availability Zone in the same Region to increase fault tolerance in the event of a service disruption. Changes to the Multi-AZ option can take about half an hour to become active. For more information, see [Configuring Availability Options](http://docs.aws.amazon.com/cloudsearch/latest/developerguide/configuring-availability-options.html) in the *Amazon CloudSearch Developer Guide*.
    flag:
        domain-name: ""
        multi-az: You expand an existing search domain to a second Availability Zone by setting the Multi-AZ option to true. Similarly, you can turn off the Multi-AZ option to downgrade the domain to a single Availability Zone by setting the Multi-AZ option to `false`.
