name: create-acl
description: Creates an Access Control List.
flags:
    --aclname=!: The name of the Access Control List.
    --tags=: A list of tags to be added to this resource.
    --user-names=: The list of users that belong to the Access Control List.
documentation:
    command: Creates an Access Control List. For more information, see [Authenticating users with Access Contol Lists (ACLs)](https://docs.aws.amazon.com/MemoryDB/latest/devguide/clusters.acls.html).
    flag:
        aclname: The name of the Access Control List.
        tags: A list of tags to be added to this resource. A tag is a key-value pair. A tag key must be accompanied by a tag value, although null is accepted.
        user-names: The list of users that belong to the Access Control List.
