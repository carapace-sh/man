name: create-model-manifest
description: Creates a vehicle model (model manifest) that specifies signals (attributes, branches, sensors, and actuators).
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A brief description of the vehicle model.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the vehicle model to create.
    --nodes=!:
        description: A list of nodes, which are a general abstraction of signals.
        nargs: -1
    --signal-catalog-arn=!: The Amazon Resource Name (ARN) of a signal catalog.
    --tags=:
        description: Metadata that can be used to manage the vehicle model.
        nargs: -1
documentation:
    command: |-
        Creates a vehicle model (model manifest) that specifies signals (attributes, branches, sensors, and actuators).

        For more information, see [Vehicle models](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/vehicle-models.html) in the *Amazon Web Services IoT FleetWise Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A brief description of the vehicle model.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the vehicle model to create.
        nodes: A list of nodes, which are a general abstraction of signals.
        signal-catalog-arn: The Amazon Resource Name (ARN) of a signal catalog.
        tags: Metadata that can be used to manage the vehicle model.
