name: delete-asset-model-interface-relationship
description: Deletes an interface relationship between an asset model and an interface asset model.
flags:
    --asset-model-id=!: The ID of the asset model.
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --interface-asset-model-id=!: The ID of the interface asset model.
documentation:
    command: Deletes an interface relationship between an asset model and an interface asset model.
    flag:
        asset-model-id: 'The ID of the asset model. This can be either the actual ID in UUID format, or else externalId: followed by the external ID.'
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        interface-asset-model-id: 'The ID of the interface asset model. This can be either the actual ID in UUID format, or else externalId: followed by the external ID.'
