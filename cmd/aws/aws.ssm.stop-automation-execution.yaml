name: stop-automation-execution
description: Stop an Automation that is currently running.
flags:
    --automation-execution-id=!: The execution ID of the Automation to stop.
    --type=: The stop request type.
completion:
    flag:
        type:
            - Complete
            - Cancel
documentation:
    command: Stop an Automation that is currently running.
    flag:
        automation-execution-id: The execution ID of the Automation to stop.
        type: 'The stop request type. Valid types include the following: Cancel and Complete. The default type is Cancel.'
