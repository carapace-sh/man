name: set-target
description: Modify a forwarding rule to direct network traffic to a new target.
flags:
    --backend-service-region=: Region of the backend service to operate on.
    --backend-service=: Target backend service that receives the traffic.
    --global: If set, the forwarding rule is global.
    --global-backend-service: If set, the backend service is global.
    --global-target-http-proxy: If set, the http proxy is global.
    --global-target-https-proxy: If set, the https proxy is global.
    --global-target-tcp-proxy: If set, the tcp proxy is global.
    --load-balancing-scheme=: (DEPRECATED) This defines the forwarding rule's load balancing scheme.
    --network=: (DEPRECATED) Only for --load-balancing-scheme=INTERNAL or --load-balancing-scheme=INTERNAL_SELF_MANAGED or --load-balancing-scheme=EXTERNAL_MANAGED (regional) or --load-balancing-scheme=INTERNAL_MANAGED) Network that this forwarding rule applies to.
    --no-global&: If set, the forwarding rule is global.
    --no-global-backend-service&: If set, the backend service is global.
    --no-global-target-http-proxy&: If set, the http proxy is global.
    --no-global-target-https-proxy&: If set, the https proxy is global.
    --no-global-target-tcp-proxy&: If set, the tcp proxy is global.
    --region=: Region of the forwarding rule to operate on.
    --subnet-region=: (DEPRECATED) Region of the subnetwork to operate on.
    --subnet=: (DEPRECATED) Only for --load-balancing-scheme=INTERNAL and --load-balancing-scheme=INTERNAL_MANAGED) Subnetwork that this forwarding rule applies to.
    --target-grpc-proxy=: Target gRPC proxy that receives the traffic.
    --target-http-proxy-region=: Region of the http proxy to operate on.
    --target-http-proxy=: Target HTTP proxy that receives the traffic.
    --target-https-proxy-region=: Region of the https proxy to operate on.
    --target-https-proxy=: Target HTTPS proxy that receives the traffic.
    --target-instance-zone=: Zone of the target instance to operate on.
    --target-instance=: Name of the target instance that receives the traffic.
    --target-pool-region=: Region of the target pool to operate on.
    --target-pool=: Target pool that receives the traffic.
    --target-ssl-proxy=: Target SSL proxy that receives the traffic.
    --target-tcp-proxy-region=: Region of the tcp proxy to operate on.
    --target-tcp-proxy=: Target TCP proxy that receives the traffic.
    --target-vpn-gateway-region=: Region of the VPN gateway to operate on.
    --target-vpn-gateway=: Target VPN gateway (Cloud VPN Classic gateway) that receives forwarded traffic.
completion:
    flag:
        load-balancing-scheme:
            - EXTERNAL
            - EXTERNAL_MANAGED
            - INTERNAL
            - INTERNAL_MANAGED
            - INTERNAL_SELF_MANAGED
documentation:
    command: "\n          *gcloud compute forwarding-rules set-target* is used to set a new target for a forwarding\n          rule. \nA forwarding rule directs traffic that matches a destination IP address\n(and possibly a TCP or UDP port) to a forwarding target (load balancer,\nVPN gateway or VM instance).\n\nForwarding rules can be either global or regional, specified with the\n``--global'' or ``--region=REGION'' flags. For more information about\nthe scope of a forwarding rule, refer to\nhttps://cloud.google.com/load-balancing/docs/forwarding-rule-concepts.\n\nForwarding rules can be external, internal, internal managed, or\ninternal self-managed, specified with the\n``--load-balancing-scheme=[EXTERNAL|EXTERNAL_MANAGED|INTERNAL|INTERNAL_MANAGED|INTERNAL_SELF_MANAGED]''\nflag. External forwarding rules are accessible from the internet, while\ninternal forwarding rules are only accessible from within their VPC\nnetworks. You can specify a reserved static external or internal IP\naddress with the ``--address=ADDRESS'' flag for the forwarding rule.\nOtherwise, if the flag is unspecified, an ephemeral IP address is\nautomatically assigned (global IP addresses for global forwarding rules\nand regional IP addresses for regional forwarding rules); an internal\nforwarding rule is automatically assigned an ephemeral internal IP\naddress from the subnet specified with the ``--subnet'' flag. You must\nprovide an IP address for an internal self-managed forwarding rule.\n\nDifferent types of load balancers work at different layers of the OSI\nnetworking model (http://en.wikipedia.org/wiki/Network_layer). Layer 3/4\ntargets include target pools, target SSL proxies, target TCP proxies,\nand backend services. Layer 7 targets include target HTTP proxies and\ntarget HTTPS proxies. For more information, refer to\nhttps://cloud.google.com/load-balancing/docs/forwarding-rule-concepts.\n\n\n          When creating a forwarding rule, exactly one of  ``--target-instance'',\n          ``--target-pool'', ``--target-http-proxy'', ``--target-https-proxy'',\n          ``--target-grpc-proxy'', ``--target-ssl-proxy'',\n          ``--target-tcp-proxy'' or ``--target-vpn-gateway''\n          must be specified."
    flag:
        backend-service: Target backend service that receives the traffic.
        backend-service-region: Region of the backend service to operate on. If not specified, the region is set to the region of the forwarding rule. Overrides the default *compute/region* property value for this command invocation.
        global: If set, the forwarding rule is global.
        global-backend-service: If set, the backend service is global.
        global-target-http-proxy: If set, the http proxy is global.
        global-target-https-proxy: If set, the https proxy is global.
        global-target-tcp-proxy: If set, the tcp proxy is global.
        load-balancing-scheme: |-
            (DEPRECATED) This defines the forwarding rule's load balancing scheme.
            +
            The --load-balancing-scheme option is deprecated and will be removed in an upcoming release. If you're currently using this argument, you should remove it from your workflows. _LOAD_BALANCING_SCHEME_ must be one of:
            +
            *EXTERNAL*::: Classic Application Load Balancers, global external proxy Network  Load Balancers, external passthrough Network Load Balancers or  protocol forwarding, used with one of --target-http-proxy, --target-https-proxy, --target-tcp-proxy, --target-ssl-proxy, --target-pool, --target-vpn-gateway, --target-instance.
            *EXTERNAL_MANAGED*::: Global and regional external Application Load Balancers, and regional external proxy Network Load Balancers, used with --target-http-proxy, --target-https-proxy, --target-tcp-proxy.
            *INTERNAL*::: Internal passthrough Network Load Balancers or protocol forwarding, used with --backend-service.
            *INTERNAL_MANAGED*::: Internal Application Load Balancers and internal proxy Network Load Balancers, used with --target-http-proxy, --target-https-proxy, --target-tcp-proxy.
            *INTERNAL_SELF_MANAGED*::: Traffic Director, used with --target-http-proxy, --target-https-proxy, --target-grpc-proxy, --target-tcp-proxy.
            :::
            +
        network: |-
            (DEPRECATED) Only for --load-balancing-scheme=INTERNAL or --load-balancing-scheme=INTERNAL_SELF_MANAGED or --load-balancing-scheme=EXTERNAL_MANAGED (regional) or --load-balancing-scheme=INTERNAL_MANAGED) Network that this forwarding rule applies to. If this field is not specified, the default network is used. In the absence of the default network, this field must be specified.
            +
            The --network option is deprecated and will be removed in an upcoming release. If you're currently using this argument, you should remove it from your workflows.
        no-global: If set, the forwarding rule is global.
        no-global-backend-service: If set, the backend service is global.
        no-global-target-http-proxy: If set, the http proxy is global.
        no-global-target-https-proxy: If set, the https proxy is global.
        no-global-target-tcp-proxy: If set, the tcp proxy is global.
        region: |-
            Region of the forwarding rule to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        subnet: |-
            (DEPRECATED) Only for --load-balancing-scheme=INTERNAL and --load-balancing-scheme=INTERNAL_MANAGED) Subnetwork that this forwarding rule applies to. If the network is auto mode, this flag is optional. If the network is custom mode, this flag is required.
            +
            The --subnet option is deprecated and will be removed in an upcoming release. If you're currently using this argument, you should remove it from your workflows.
        subnet-region: |-
            (DEPRECATED) Region of the subnetwork to operate on. If not specified, the region is set to the region of the forwarding rule. Overrides the default compute/region property value for this command invocation.
            +
            The --subnet-region option is deprecated and will be removed in an upcoming release. If you're currently using this argument, you should remove it from your workflows.
        target-grpc-proxy: Target gRPC proxy that receives the traffic.
        target-http-proxy: Target HTTP proxy that receives the traffic. For the acceptable ports, see [Port specifications](https://cloud.google.com/load-balancing/docs/forwarding-rule-concepts#port_specifications).
        target-http-proxy-region: |-
            Region of the http proxy to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        target-https-proxy: Target HTTPS proxy that receives the traffic. For the acceptable ports, see [Port specifications](https://cloud.google.com/load-balancing/docs/forwarding-rule-concepts#port_specifications).
        target-https-proxy-region: |-
            Region of the https proxy to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        target-instance: |-
            Name of the target instance that receives the traffic. The
            target instance must be in a zone in the forwarding rule's
            region. Global forwarding rules cannot direct traffic to target
            instances.
            If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
        target-instance-zone: Zone of the target instance to operate on. Overrides the default *compute/zone* property value for this command invocation.
        target-pool: |-
            Target pool that receives the traffic. The target pool
            must be in the same region as the forwarding rule. Global
            forwarding rules cannot direct traffic to target pools.
        target-pool-region: Region of the target pool to operate on. If not specified, the region is set to the region of the forwarding rule. Overrides the default *compute/region* property value for this command invocation.
        target-ssl-proxy: Target SSL proxy that receives the traffic. For the acceptable ports, see [Port specifications](https://cloud.google.com/load-balancing/docs/forwarding-rule-concepts#port_specifications).
        target-tcp-proxy: Target TCP proxy that receives the traffic. For the acceptable ports, see [Port specifications](https://cloud.google.com/load-balancing/docs/forwarding-rule-concepts#port_specifications).
        target-tcp-proxy-region: |-
            Region of the tcp proxy to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        target-vpn-gateway: 'Target VPN gateway (Cloud VPN Classic gateway) that receives forwarded traffic. Acceptable values for --ports flag are: 500, 4500.'
        target-vpn-gateway-region: Region of the VPN gateway to operate on. If not specified, the region is set to the region of the forwarding rule. Overrides the default *compute/region* property value for this command invocation.
