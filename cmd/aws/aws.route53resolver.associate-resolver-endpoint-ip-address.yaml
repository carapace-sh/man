name: associate-resolver-endpoint-ip-address
description: Adds IP addresses to an inbound or an outbound Resolver endpoint.
flags:
    --ip-address=!: Either the IPv4 address that you want to add to a Resolver endpoint or a subnet ID.
    --resolver-endpoint-id=!: The ID of the Resolver endpoint that you want to associate IP addresses with.
documentation:
    command: |-
        Adds IP addresses to an inbound or an outbound Resolver endpoint. If you want to add more than one IP address, submit one `AssociateResolverEndpointIpAddress` request for each IP address.

        To remove an IP address from an endpoint, see [DisassociateResolverEndpointIpAddress](https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_DisassociateResolverEndpointIpAddress.html).
    flag:
        ip-address: Either the IPv4 address that you want to add to a Resolver endpoint or a subnet ID. If you specify a subnet ID, Resolver chooses an IP address for you from the available IPs in the specified subnet.
        resolver-endpoint-id: The ID of the Resolver endpoint that you want to associate IP addresses with.
