name: publish
description: '*(ALPHA)*  Publish Pub/Sub Lite messages.'
flags:
    --attributes=: Comma-separated list of attributes.
    --event-time=: A user-specified event time.
    --location=: ID of the location of the Pub/Sub Lite resource.
    --message=: The body of the message to publish to the given topic name.
    --ordering-key=: A string key, used for ordering delivery to subscribers.
documentation:
    command: |
        *(ALPHA)*  Publishes a message to the specified Pub/Sub Lite topic. This command requires
        Python 3.6 or greater, and requires the grpcio Python package to be installed.

        For MacOS, Linux, and Cloud Shell users, to install the gRPC client libraries,
        run:

          $ sudo pip3 install grpcio
          $ export CLOUDSDK_PYTHON_SITEPACKAGES=1
    flag:
        attributes: |-
            Comma-separated list of attributes. Each ATTRIBUTE has the form
                      name="value". You can specify up to 100 attributes.
        event-time: |-
            A user-specified event time. Run `gcloud topic datetimes` for
                      information on time formats.
        location: |-
            ID of the location of the Pub/Sub Lite resource.
            +

            To set the `location` attribute:
            * provide the argument `topic` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        message: The body of the message to publish to the given topic name.
        ordering-key: |-
            A string key, used for ordering delivery to subscribers. All
                      messages with the same ordering key will be assigned to the same
                      partition for ordered delivery.
