name: describe
description: Show details about the route.
flags:
    --location=: The location of the resources.
    --private-connection=: The private connection name.
documentation:
    command: Show details about the route.
    flag:
        location: |-
            The location of the resources.
            +
            To set the `location` attribute:
            * provide the argument `route` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        private-connection: |-
            The private connection name.
            +
            To set the `private-connection` attribute:
            * provide the argument `route` on the command line with a fully specified name;
            * provide the argument `--private-connection` on the command line.
