name: update
description: '*(BETA)*  Update a Compute Engine image.'
flags:
    --architecture=: Specifies the architecture or processor type that this image can support.
    --clear-labels: Remove all labels.
    --clear-user-licenses: Remove all existing user licenses on an image.
    --description=: An optional text description for the image.
    --family=: Name of the image family to use.
    --no-clear-labels&: Remove all labels.
    --no-clear-user-licenses&: Remove all existing user licenses on an image.
    --remove-labels=: List of label keys to remove.
    --update-labels=: List of label KEY=VALUE pairs to update.
    --update-user-licenses=: List of user licenses to be updated on an image.
completion:
    flag:
        architecture:
            - ARM64
            - X86_64
documentation:
    command: '*(BETA)*  *gcloud beta compute images update* updates labels for a Compute Engine image.'
    flag:
        architecture: 'Specifies the architecture or processor type that this image can support. For available processor types on Compute Engine, see https://cloud.google.com/compute/docs/cpu-platforms. _ARCHITECTURE_ must be one of: *ARM64*, *X86_64*.'
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        clear-user-licenses: Remove all existing user licenses on an image.
        description: An optional text description for the image.
        family: Name of the image family to use. If an image family is specified when you create an instance or disk, the latest non-deprecated image in the family is used.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-clear-user-licenses: Remove all existing user licenses on an image.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        update-user-licenses: List of user licenses to be updated on an image. These user licenses replace all existing user licenses. If this flag is not provided, all existing user licenses remain unchanged.
