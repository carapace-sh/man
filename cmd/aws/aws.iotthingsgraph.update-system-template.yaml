name: update-system-template
description: Updates the specified system.
flags:
    --compatible-namespace-version=: The version of the user's namespace.
    --definition=!: The `DefinitionDocument` that contains the updated system definition.
    --id=!: The ID of the system to be updated.
documentation:
    command: Updates the specified system. You don't need to run this action after updating a workflow. Any deployment that uses the system will see the changes in the system when it is redeployed.
    flag:
        compatible-namespace-version: |-
            The version of the user's namespace. Defaults to the latest version of the user's namespace.

            If no value is specified, the latest version is used by default.
        definition: The `DefinitionDocument` that contains the updated system definition.
        id: |-
            The ID of the system to be updated.

            The ID should be in the following format.

            `urn:tdm:REGION/ACCOUNT ID/default:system:SYSTEMNAME`
