name: update
description: Update an AI Platform version.
flags:
    --clear-labels: Remove all labels.
    --config=: Path to a YAML configuration file containing configuration parameters
    --description=: Description of the version.
    --model=: Model for the version.
    --no-clear-labels&: Remove all labels.
    --region=: Google Cloud region of the regional endpoint to use for this command.
    --remove-labels=: List of label keys to remove.
    --update-labels=: List of label KEY=VALUE pairs to update.
completion:
    flag:
        region:
            - global
            - asia-east1
            - asia-northeast1
            - asia-southeast1
            - australia-southeast1
            - europe-west1
            - europe-west2
            - europe-west3
            - europe-west4
            - northamerica-northeast1
            - us-central1
            - us-east1
            - us-east4
            - us-west1
documentation:
    command: Update an AI Platform version.
    flag:
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        config: |-
            Path to a YAML configuration file containing configuration parameters
            for the
            [version](https://cloud.google.com/ml/reference/rest/v1/projects.models.versions)
            to create.
            +
            The file is in YAML format. Note that not all attributes of a version
            are configurable; available attributes (with example values) are:
            +
                description: A free-form description of the version.
                manualScaling:
                  nodes: 10  # The number of nodes to allocate for this model.
                autoScaling:
                  minNodes: 0  # The minimum number of nodes to allocate for this model.
                  maxNodes: 1  # The maxinum number of nodes to allocate for this model.
                requestLoggingconfig:
                  bigqueryTableName: someTable  # Fully qualified BigQuery table name.
                  samplingPercentage: 0.5  # Percentage of requests to be logged.
            +
            The name of the version must always be specified via the required
            VERSION argument.
            +
            Only one of manualScaling or autoScaling can be specified. If both
            are specified in same yaml file, an error will be returned.
            +
            Labels cannot currently be set in the config.yaml; please use
            the command-line flags to alter them.
            +
            If an option is specified both in the configuration file and via
            command-line arguments, the command-line arguments override the
            configuration file.
        description: Description of the version.
        model: |-
            Model for the version.
            +
            To set the `model` attribute:
            * provide the argument `version` on the command line with a fully specified name;
            * provide the argument `--model` on the command line.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        region: |-
            Google Cloud region of the regional endpoint to use for this command.
            For the global endpoint, the region needs to be specified as `global`.
            +
            Learn more about regional endpoints and see a list of available regions:
             https://cloud.google.com/ai-platform/prediction/docs/regional-endpoints
            +
            _REGION_ must be one of: *global*, *asia-east1*, *asia-northeast1*, *asia-southeast1*, *australia-southeast1*, *europe-west1*, *europe-west2*, *europe-west3*, *europe-west4*, *northamerica-northeast1*, *us-central1*, *us-east1*, *us-east4*, *us-west1*.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
