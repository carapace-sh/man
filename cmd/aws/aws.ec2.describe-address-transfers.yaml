name: describe-address-transfers
description: Describes an Elastic IP address transfer.
flags:
    --allocation-ids=: The allocation IDs of Elastic IP addresses.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --max-results=: The maximum number of address transfers to return in one page of results.
    --next-token=: Specify the pagination token from a previous request to retrieve the next page of results.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: |-
        Describes an Elastic IP address transfer. For more information, see [Transfer Elastic IP addresses](https://docs.aws.amazon.com/vpc/latest/userguide/vpc-eips.html#transfer-EIPs-intro) in the *Amazon VPC User Guide*.

        When you transfer an Elastic IP address, there is a two-step handshake between the source and transfer Amazon Web Services accounts. When the source account starts the transfer, the transfer account has seven days to accept the Elastic IP address transfer. During those seven days, the source account can view the pending transfer by using this action. After seven days, the transfer expires and ownership of the Elastic IP address returns to the source account. Accepted transfers are visible to the source account for 14 days after the transfers have been accepted.
    flag:
        allocation-ids: The allocation IDs of Elastic IP addresses.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        max-results: The maximum number of address transfers to return in one page of results.
        next-token: Specify the pagination token from a previous request to retrieve the next page of results.
