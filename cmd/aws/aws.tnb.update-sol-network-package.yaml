name: update-sol-network-package
description: Updates the operational state of a network package.
flags:
    --nsd-info-id=!: ID of the network service descriptor in the network package.
    --nsd-operational-state=!: Operational state of the network service descriptor in the network package.
completion:
    flag:
        nsd-operational-state:
            - ENABLED
            - DISABLED
documentation:
    command: |-
        Updates the operational state of a network package.

        A network package is a .zip file in CSAR (Cloud Service Archive) format defines the function packages you want to deploy and the Amazon Web Services infrastructure you want to deploy them on.

        A network service descriptor is a .yaml file in a network package that uses the TOSCA standard to describe the network functions you want to deploy and the Amazon Web Services infrastructure you want to deploy the network functions on.
    flag:
        nsd-info-id: ID of the network service descriptor in the network package.
        nsd-operational-state: Operational state of the network service descriptor in the network package.
