name: create-application-presigned-url
description: Creates and returns a URL that you can use to connect to an application's extension.
flags:
    --application-name=!: The name of the application.
    --session-expiration-duration-in-seconds=: The duration in seconds for which the returned URL will be valid.
    --url-type=!: The type of the extension for which to create and return a URL.
completion:
    flag:
        url-type:
            - FLINK_DASHBOARD_URL
            - ZEPPELIN_UI_URL
documentation:
    command: |-
        Creates and returns a URL that you can use to connect to an application's extension.

        The IAM role or user used to call this API defines the permissions to access the extension. After the presigned URL is created, no additional permission is required to access this URL. IAM authorization policies for this API are also enforced for every HTTP request that attempts to connect to the extension.

        You control the amount of time that the URL will be valid using the `SessionExpirationDurationInSeconds` parameter. If you do not provide this parameter, the returned URL is valid for twelve hours.

        The URL that you get from a call to CreateApplicationPresignedUrl must be used within 3 minutes to be valid. If you first try to use the URL after the 3-minute limit expires, the service returns an HTTP 403 Forbidden error.
    flag:
        application-name: The name of the application.
        session-expiration-duration-in-seconds: The duration in seconds for which the returned URL will be valid.
        url-type: The type of the extension for which to create and return a URL. Currently, the only valid extension URL type is `FLINK_DASHBOARD_URL`.
