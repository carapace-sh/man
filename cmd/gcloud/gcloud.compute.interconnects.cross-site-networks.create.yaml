name: create
description: Create a Compute Engine cross site network.
flags:
    --description=: An optional, textual description for the cross site network.
documentation:
    command: |
        *gcloud compute interconnects cross-site-networks create* is used to create cross site networks. A cross site network
        contains wire groups.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        description: An optional, textual description for the cross site network.
