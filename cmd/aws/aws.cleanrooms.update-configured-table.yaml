name: update-configured-table
description: Updates a configured table.
flags:
    --allowed-columns=:
        description: The columns of the underlying table that can be used by collaborations or analysis rules.
        nargs: -1
    --analysis-method=: The analysis method for the configured table.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configured-table-identifier=!: The identifier for the configured table to update.
    --description=: A new description for the configured table.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: A new name for the configured table.
    --selected-analysis-methods=:
        description: The selected analysis methods for the table configuration update.
        nargs: -1
    --table-reference=: ""
completion:
    flag:
        analysis-method:
            - DIRECT_QUERY
            - DIRECT_JOB
            - MULTIPLE
documentation:
    command: Updates a configured table.
    flag:
        allowed-columns: The columns of the underlying table that can be used by collaborations or analysis rules.
        analysis-method: |-
            The analysis method for the configured table.

            `DIRECT_QUERY` allows SQL queries to be run directly on this table.

            `DIRECT_JOB` allows PySpark jobs to be run directly on this table.

            `MULTIPLE` allows both SQL queries and PySpark jobs to be run directly on this table.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configured-table-identifier: The identifier for the configured table to update. Currently accepts the configured table ID.
        description: A new description for the configured table.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A new name for the configured table.
        selected-analysis-methods: The selected analysis methods for the table configuration update.
        table-reference: ""
