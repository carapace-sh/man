name: update-source-location
description: Updates a source location.
flags:
    --access-configuration=: Access configuration parameters.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-segment-delivery-configuration=: The optional configuration for the host server that serves segments.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --http-configuration=!: The HTTP configuration for the source location.
    --segment-delivery-configurations=: A list of the segment delivery configurations associated with this resource.
    --source-location-name=!: The name of the source location.
documentation:
    command: Updates a source location. A source location is a container for sources. For more information about source locations, see [Working with source locations](https://docs.aws.amazon.com/mediatailor/latest/ug/channel-assembly-source-locations.html) in the *MediaTailor User Guide*.
    flag:
        access-configuration: Access configuration parameters. Configures the type of authentication used to access content from your source location.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-segment-delivery-configuration: The optional configuration for the host server that serves segments.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        http-configuration: The HTTP configuration for the source location.
        segment-delivery-configurations: A list of the segment delivery configurations associated with this resource.
        source-location-name: The name of the source location.
