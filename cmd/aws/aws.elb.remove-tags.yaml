name: remove-tags
description: Removes one or more tags from the specified load balancer.
flags:
    --load-balancer-names=!: The name of the load balancer.
    --tags=!: The list of tag keys to remove.
documentation:
    command: Removes one or more tags from the specified load balancer.
    flag:
        load-balancer-names: The name of the load balancer. You can specify a maximum of one load balancer name.
        tags: The list of tag keys to remove.
