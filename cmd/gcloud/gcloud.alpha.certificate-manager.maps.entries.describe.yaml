name: describe
description: '*(ALPHA)*  Describe an existing certificate map entry.'
flags:
    --location=: The Cloud location for the certificate map entry.
    --map=: The certificate map for the certificate map entry.
documentation:
    command: |-
        *(ALPHA)*  This command fetches and prints information about an existing certificate map
        entry.

        ## EXAMPLES

        To describe a certificate map entry with name simple-entry, run:

          $ gcloud alpha certificate-manager maps entries describe simple-entry --map=simple-map
    flag:
        location: |-
            The Cloud location for the certificate map entry.
            +
            To set the `location` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * default value of location is [global].
        map: |-
            The certificate map for the certificate map entry.
            +
            To set the `map` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--map` on the command line.
