name: delete-opt-out-list
description: Deletes an existing opt-out list.
flags:
    --opt-out-list-name=!: The OptOutListName or OptOutListArn of the OptOutList to delete.
documentation:
    command: |-
        Deletes an existing opt-out list. All opted out phone numbers in the opt-out list are deleted.

        If the specified opt-out list name doesn't exist or is in-use by an origination phone number or pool, an error is returned.
    flag:
        opt-out-list-name: |-
            The OptOutListName or OptOutListArn of the OptOutList to delete. You can use [DescribeOptOutLists]() to find the values for OptOutListName and OptOutListArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
