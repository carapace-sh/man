name: update-subscription
description: Updates the pricing tier for an Amazon Q Business subscription.
flags:
    --application-id=!: The identifier of the Amazon Q Business application where the subscription update should take effect.
    --subscription-id=!: The identifier of the Amazon Q Business subscription to be updated.
    --type=!: The type of the Amazon Q Business subscription to be updated.
completion:
    flag:
        type:
            - Q_LITE
            - Q_BUSINESS
documentation:
    command: Updates the pricing tier for an Amazon Q Business subscription. Upgrades are instant. Downgrades apply at the start of the next month. Subscription tier determines feature access for the user. For more information on subscriptions and pricing tiers, see [Amazon Q Business pricing](https://aws.amazon.com/q/business/pricing/).
    flag:
        application-id: The identifier of the Amazon Q Business application where the subscription update should take effect.
        subscription-id: The identifier of the Amazon Q Business subscription to be updated.
        type: The type of the Amazon Q Business subscription to be updated.
