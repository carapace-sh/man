name: list-groups
description: Returns summaries of the organization's groups.
flags:
    --filters=: Limit the search results based on the filter criteria.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token to use to retrieve the next page of results.
    --organization-id=!: The identifier for the organization under which the groups exist.
documentation:
    command: Returns summaries of the organization's groups.
    flag:
        filters: Limit the search results based on the filter criteria. Only one filter per request is supported.
        max-results: The maximum number of results to return in a single call.
        next-token: The token to use to retrieve the next page of results. The first call does not contain any tokens.
        organization-id: The identifier for the organization under which the groups exist.
