name: modify-instance-profile
description: Modifies the specified instance profile using the provided parameters.
flags:
    --availability-zone=: The Availability Zone where the instance profile runs.
    --description=: A user-friendly description for the instance profile.
    --instance-profile-identifier=!: The identifier of the instance profile.
    --instance-profile-name=: A user-friendly name for the instance profile.
    --kms-key-arn=: The Amazon Resource Name (ARN) of the KMS key that is used to encrypt the connection parameters for the instance profile.
    --network-type=: Specifies the network type for the instance profile.
    --publicly-accessible=: Specifies the accessibility options for the instance profile.
    --subnet-group-identifier=: A subnet group to associate with the instance profile.
    --vpc-security-groups=: Specifies the VPC security groups to be used with the instance profile.
documentation:
    command: |-
        Modifies the specified instance profile using the provided parameters.

        All migration projects associated with the instance profile must be deleted or modified before you can modify the instance profile.
    flag:
        availability-zone: The Availability Zone where the instance profile runs.
        description: A user-friendly description for the instance profile.
        instance-profile-identifier: The identifier of the instance profile. Identifiers must begin with a letter and must contain only ASCII letters, digits, and hyphens. They can't end with a hyphen, or contain two consecutive hyphens.
        instance-profile-name: A user-friendly name for the instance profile.
        kms-key-arn: |-
            The Amazon Resource Name (ARN) of the KMS key that is used to encrypt the connection parameters for the instance profile.

            If you don't specify a value for the `KmsKeyArn` parameter, then DMS uses an Amazon Web Services owned encryption key to encrypt your resources.
        network-type: Specifies the network type for the instance profile. A value of `IPV4` represents an instance profile with IPv4 network type and only supports IPv4 addressing. A value of `IPV6` represents an instance profile with IPv6 network type and only supports IPv6 addressing. A value of `DUAL` represents an instance profile with dual network type that supports IPv4 and IPv6 addressing.
        publicly-accessible: Specifies the accessibility options for the instance profile. A value of `true` represents an instance profile with a public IP address. A value of `false` represents an instance profile with a private IP address. The default value is `true`.
        subnet-group-identifier: A subnet group to associate with the instance profile.
        vpc-security-groups: Specifies the VPC security groups to be used with the instance profile. The VPC security group must work with the VPC containing the instance profile.
