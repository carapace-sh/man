name: describe-budget
description: Describes a budget.
flags:
    --account-id=!: The `accountId` that is associated with the budget that you want a description of.
    --budget-name=!: The name of the budget that you want a description of.
    --show-filter-expression=: Specifies whether the response includes the filter expression associated with the budget.
documentation:
    command: |-
        Describes a budget.

        The Request Syntax section shows the `BudgetLimit` syntax. For `PlannedBudgetLimits`, see the [Examples](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_budgets_DescribeBudget.html#API_DescribeBudget_Examples) section.
    flag:
        account-id: The `accountId` that is associated with the budget that you want a description of.
        budget-name: The name of the budget that you want a description of.
        show-filter-expression: Specifies whether the response includes the filter expression associated with the budget. By showing the filter expression, you can see detailed filtering logic applied to the budget, such as Amazon Web Services services or tags that are being tracked.
