name: generate-wallet
description: '*(ALPHA)*  Generate wallet for an AutonomousDatabase.'
hidden: true
flags:
    --is-regional: True when requesting regional connection strings in PDB connect info,
    --location=: The location id of the autonomousDatabase resource.
    --no-is-regional&: True when requesting regional connection strings in PDB connect info,
    --password=!: The password used to encrypt the keys inside the wallet.
    --type=: The type of wallet generation for the Autonomous Database.
completion:
    flag:
        type:
            - all
            - single
documentation:
    command: '*(ALPHA)*  Generate wallet for an AutonomousDatabase, Content is base64 encoded zip archive.'
    flag:
        is-regional: |-
            True when requesting regional connection strings in PDB connect info,
            applicable to cross-region Data Guard only.
        location: |-
            The location id of the autonomousDatabase resource.
            +
            To set the `location` attribute:
            * provide the argument `autonomous_database` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-is-regional: |-
            True when requesting regional connection strings in PDB connect info,
            applicable to cross-region Data Guard only.
        password: |-
            The password used to encrypt the keys inside the wallet. The password
            must be a minimum of 8 characters.
        type: |-
            The type of wallet generation for the Autonomous Database. The default
            value is SINGLE. _TYPE_ must be (only one value is supported):
            +
            :::
            +
