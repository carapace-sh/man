name: update-instance-metadata-options
description: Modifies the Amazon Lightsail instance metadata parameters on a running or stopped instance.
flags:
    --http-endpoint=: Enables or disables the HTTP metadata endpoint on your instances.
    --http-protocol-ipv6=: Enables or disables the IPv6 endpoint for the instance metadata service.
    --http-put-response-hop-limit=: The desired HTTP PUT response hop limit for instance metadata requests.
    --http-tokens=: The state of token usage for your instance metadata requests.
    --instance-name=!: The name of the instance for which to update metadata parameters.
completion:
    flag:
        http-endpoint:
            - disabled
            - enabled
        http-protocol-ipv6:
            - disabled
            - enabled
        http-tokens:
            - optional
            - required
documentation:
    command: Modifies the Amazon Lightsail instance metadata parameters on a running or stopped instance. When you modify the parameters on a running instance, the `GetInstance` or `GetInstances` API operation initially responds with a state of `pending`. After the parameter modifications are successfully applied, the state changes to `applied` in subsequent `GetInstance` or `GetInstances` API calls. For more information, see [Use IMDSv2 with an Amazon Lightsail instance](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-configuring-instance-metadata-service) in the *Amazon Lightsail Developer Guide*.
    flag:
        http-endpoint: |-
            Enables or disables the HTTP metadata endpoint on your instances. If this parameter is not specified, the existing state is maintained.

            If you specify a value of `disabled`, you cannot access your instance metadata.
        http-protocol-ipv6: |-
            Enables or disables the IPv6 endpoint for the instance metadata service. This setting applies only when the HTTP metadata endpoint is enabled.

            This parameter is available only for instances in the Europe (Stockholm) Amazon Web Services Region (`eu-north-1`).
        http-put-response-hop-limit: The desired HTTP PUT response hop limit for instance metadata requests. A larger number means that the instance metadata requests can travel farther. If no parameter is specified, the existing state is maintained.
        http-tokens: |-
            The state of token usage for your instance metadata requests. If the parameter is not specified in the request, the default state is `optional`.

            If the state is `optional`, you can choose whether to retrieve instance metadata with a signed token header on your request. If you retrieve the IAM role credentials without a token, the version 1.0 role credentials are returned. If you retrieve the IAM role credentials by using a valid signed token, the version 2.0 role credentials are returned.

            If the state is `required`, you must send a signed token header with all instance metadata retrieval requests. In this state, retrieving the IAM role credential always returns the version 2.0 credentials. The version 1.0 credentials are not available.
        instance-name: The name of the instance for which to update metadata parameters.
