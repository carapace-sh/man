name: create-quick-response
description: Creates a Wisdom quick response.
flags:
    --channels=: The Amazon Connect channels this quick response applies to.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --content-type=: The media type of the quick response content.
    --content=!: The content of the quick response.
    --description=: The description of the quick response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --grouping-configuration=: The configuration information of the user groups that the quick response is accessible to.
    --is-active: Whether the quick response is active.
    --knowledge-base-id=!: The identifier of the knowledge base.
    --language=: The language code value for the language in which the quick response is written.
    --name=!: The name of the quick response.
    --no-is-active: Whether the quick response is active.
    --shortcut-key=: The shortcut key of the quick response.
    --tags=: The tags used to organize, track, or control access for this resource.
documentation:
    command: Creates a Wisdom quick response.
    flag:
        channels: The Amazon Connect channels this quick response applies to.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        content: The content of the quick response.
        content-type: |-
            The media type of the quick response content.

            - Use `application/x.quickresponse;format=plain` for a quick response written in plain text.
            - Use `application/x.quickresponse;format=markdown` for a quick response written in richtext.
        description: The description of the quick response.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        grouping-configuration: The configuration information of the user groups that the quick response is accessible to.
        is-active: Whether the quick response is active.
        knowledge-base-id: The identifier of the knowledge base. This should not be a QUICK\_RESPONSES type knowledge base if you're storing Wisdom Content resource to it. Can be either the ID or the ARN. URLs cannot contain the ARN.
        language: The language code value for the language in which the quick response is written. The supported language codes include `de_DE`, `en_US`, `es_ES`, `fr_FR`, `id_ID`, `it_IT`, `ja_JP`, `ko_KR`, `pt_BR`, `zh_CN`, `zh_TW`
        name: The name of the quick response.
        shortcut-key: The shortcut key of the quick response. The value should be unique across the knowledge base.
        tags: The tags used to organize, track, or control access for this resource.
