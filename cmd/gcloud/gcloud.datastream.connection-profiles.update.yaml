documentation:
    command: Updates a Datastream connection profile
    flag:
        bucket: |-
            The full project and resource path for Cloud Storage
                  bucket including the name.
        ca-certificate: |-
            x509 PEM-encoded certificate of the CA that signed the source database
            server's certificate. The replica will use this certificate to verify
            it's connecting to the right host.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        client-certificate: |-
            x509 PEM-encoded certificate that will be used by the replica to
            authenticate against the source database server.
        client-key: |-
            Unencrypted PKCS#1 or PKCS#8 PEM-encoded private key associated with
            the Client Certificate.
        database-service: Database service for the Oracle connection.
        display-name: Friendly name for the connection profile.
        force: Update the connection profile without validating it.
        forward-ssh-hostname: Hostname for the SSH tunnel.
        forward-ssh-password: SSH password.
        forward-ssh-port: Port for the SSH tunnel, default value is 22.
        forward-ssh-private-key: SSH private key..
        forward-ssh-username: Username for the SSH tunnel.
        location: |-
            The Cloud location for the connection_profile.
            +
            To set the `location` attribute:
            * provide the argument `connection_profile` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        mongodb-ca-certificate: |-
            x509 PEM-encoded certificate of the CA that signed the source database
            server's certificate. The replica will use this certificate to verify
            it's connecting to the right host.
        mongodb-direct-connection: |-
            Connect to the mongodb hosts directly and do not try to resolve
                  any of the replicas from the replica set.
        mongodb-host-addresses: IP or hostname and port of the MongoDB source database.
        mongodb-password: |-
            Password for the user that Datastream will be using to
            connect to the database.
            This field is not returned on request, and the value is encrypted
            when stored in Datastream.
        mongodb-prompt-for-password: Prompt for the password used to connect to the database.
        mongodb-replica-set: Replica set of the MongoDB source database.
        mongodb-secret-manager-stored-password: Path to secret manager, storing the password for the user used to connect to the database.
        mongodb-srv-connection-format: SRV Connection format for the MongoDB source database.
        mongodb-standard-connection-format: Standard connection format for the MongoDB source database.
        mongodb-tls: Enable Transport Layer Security for the monogodb connection.
        mongodb-username: Username Datastream will use to connect to the database.
        mysql-hostname: IP or hostname of the MySQL source database.
        mysql-password: |-
            Password for the user that Datastream will be using to
            connect to the database.
            This field is not returned on request, and the value is encrypted
            when stored in Datastream.
        mysql-port: Network port of the MySQL source database.
        mysql-prompt-for-password: Prompt for the password used to connect to the database.
        mysql-secret-manager-stored-password: Path to secret manager, storing the password for the user used to connect to the database.
        mysql-username: Username Datastream will use to connect to the database.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-force: Update the connection profile without validating it.
        no-mongodb-direct-connection: |-
            Connect to the mongodb hosts directly and do not try to resolve
                  any of the replicas from the replica set.
        no-mongodb-prompt-for-password: Prompt for the password used to connect to the database.
        no-mongodb-srv-connection-format: SRV Connection format for the MongoDB source database.
        no-mongodb-standard-connection-format: Standard connection format for the MongoDB source database.
        no-mongodb-tls: Enable Transport Layer Security for the monogodb connection.
        no-mysql-prompt-for-password: Prompt for the password used to connect to the database.
        no-oracle-prompt-for-password: Prompt for the password used to connect to the database.
        no-postgresql-prompt-for-password: Prompt for the password used to connect to the database.
        no-salesforce-prompt-for-oauth2-client-secret: Prompt for the OAuth 2.0 Client secret used to connect to Salesforce.
        no-salesforce-prompt-for-password: Prompt for the password used to connect to Salesforce.
        no-salesforce-prompt-for-security-token: Prompt for the security token used to connect to Salesforce.
        no-sqlserver-prompt-for-password: Prompt for the password used to connect to the database.
        no-static-ip-connectivity: use static ip connectivity
        oracle-ca-certificate: |-
            PEM-encoded certificate of the CA that signed the source database
            server's certificate.
        oracle-hostname: IP or hostname of the oracle source database.
        oracle-password: |-
            Password for the user that Datastream will be using to
            connect to the database.
            This field is not returned on request, and the value is encrypted
            when stored in Datastream.
        oracle-port: Network port of the oracle source database.
        oracle-prompt-for-password: Prompt for the password used to connect to the database.
        oracle-secret-manager-stored-password: Path to secret manager, storing the password for the user used to connect to the database.
        oracle-server-certificate-distinguished-name: |-
            The distinguished name (DN) mentioned in the server
            certificate. This corresponds to the SSL_SERVER_CERT_DN sqlnet parameter.
            If this field is not provided, the DN matching is not enforced.
        oracle-username: Username Datastream will use to connect to the database.
        postgresql-ca-certificate: |-
            x509 PEM-encoded certificate of the CA that signed the source database
            server's certificate. The replica will use this certificate to verify
            it's connecting to the right host.
        postgresql-client-certificate: |-
            x509 PEM-encoded certificate that will be used by the replica to
            authenticate against the source database server.
        postgresql-client-key: |-
            Unencrypted PKCS#1 or PKCS#8 PEM-encoded private key associated with
            the Client Certificate.
        postgresql-database: Database service for the PostgreSQL connection.
        postgresql-hostname: IP or hostname of the PostgreSQL source database.
        postgresql-password: |-
            Password for the user that Datastream will be using to
            connect to the database.
            This field is not returned on request, and the value is encrypted
            when stored in Datastream.
        postgresql-port: Network port of the PostgreSQL source database.
        postgresql-prompt-for-password: Prompt for the password used to connect to the database.
        postgresql-secret-manager-stored-password: Path to secret manager, storing the password for the user used to connect to the database.
        postgresql-server-certificate-hostname: |-
            The hostname mentioned in the Subject or SAN extension of the server
            certificate. If this field is not provided, the hostname in the
            server certificate is not validated.
        postgresql-username: Username Datastream will use to connect to the database.
        private-connection: |-
            ID of the private_connection or fully qualified identifier for the private_connection.
            +
            To set the `private_connection` attribute:
            * provide the argument `--private-connection` on the command line.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        root-path: The root path inside the Cloud Storage bucket.
        salesforce-domain: Domain of the Salesforce organization. For example, 'myorg.my.salesforce.com'
        salesforce-oauth2-client-id: OAuth 2.0 Client ID used to connect to Salesforce.
        salesforce-oauth2-client-secret: OAuth 2.0 Client secret used to connect to Salesforce.
        salesforce-password: |-
            Password for the user that Datastream will be using to
            connect to Salesforce.
            This field is not returned on request, and the value is encrypted
            when stored in Datastream.
        salesforce-prompt-for-oauth2-client-secret: Prompt for the OAuth 2.0 Client secret used to connect to Salesforce.
        salesforce-prompt-for-password: Prompt for the password used to connect to Salesforce.
        salesforce-prompt-for-security-token: Prompt for the security token used to connect to Salesforce.
        salesforce-secret-manager-stored-oauth2-client-secret: Path to secret manager, storing the OAuth 2.0 Client secret used to connect to Salesforce.
        salesforce-secret-manager-stored-password: Path to secret manager, storing the password for the user used to connect to Salesforce.
        salesforce-secret-manager-stored-security-token: Path to secret manager, storing the security token used to connect to Salesforce.
        salesforce-security-token: |-
            Security token for the user that Datastream will be using to
            connect to Salesforce.
        salesforce-username: Username Datastream will use to connect to the database.
        sqlserver-database: Database service for the SQL Server connection.
        sqlserver-hostname: IP or hostname of the SQL Server source database.
        sqlserver-password: |-
            Password for the user that Datastream will be using to
            connect to the database.
            This field is not returned on request, and the value is encrypted
            when stored in Datastream.
        sqlserver-port: Network port of the SQL Server source database.
        sqlserver-prompt-for-password: Prompt for the password used to connect to the database.
        sqlserver-secret-manager-stored-password: Path to secret manager, storing the password for the user used to connect to the database.
        sqlserver-username: Username Datastream will use to connect to the database.
        static-ip-connectivity: use static ip connectivity
        type: Type can be MYSQL, ORACLE, POSTGRESQL, SQLSERVER, SALESFORCE, GOOGLE-CLOUD-STORAGE or BIGQUERY
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
