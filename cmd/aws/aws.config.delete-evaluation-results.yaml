name: delete-evaluation-results
description: Deletes the evaluation results for the specified Config rule.
flags:
    --config-rule-name=!: The name of the Config rule for which you want to delete the evaluation results.
documentation:
    command: Deletes the evaluation results for the specified Config rule. You can specify one Config rule per request. After you delete the evaluation results, you can call the [StartConfigRulesEvaluation]() API to start evaluating your Amazon Web Services resources against the rule.
    flag:
        config-rule-name: The name of the Config rule for which you want to delete the evaluation results.
