name: transfer-contact
description: Transfers `TASK` or `EMAIL` contacts from one agent or queue to another agent or queue at any point after a contact is created.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --contact-flow-id=!: The identifier of the flow.
    --contact-id=!: The identifier of the contact in this instance of Amazon Connect.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --queue-id=: The identifier for the queue.
    --user-id=: The identifier for the user.
documentation:
    command: |-
        Transfers `TASK` or `EMAIL` contacts from one agent or queue to another agent or queue at any point after a contact is created. You can transfer a contact to another queue by providing the flow which orchestrates the contact to the destination queue. This gives you more control over contact handling and helps you adhere to the service level agreement (SLA) guaranteed to your customers.

        Note the following requirements:

        - Transfer is only supported for `TASK` and `EMAIL` contacts.
        - Do not use both `QueueId` and `UserId` in the same call.
        - The following flow types are supported: Inbound flow, Transfer to agent flow, and Transfer to queue flow.
        - The `TransferContact` API can be called only on active contacts.
        - A contact cannot be transferred more than 11 times.
    flag:
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        contact-flow-id: The identifier of the flow.
        contact-id: The identifier of the contact in this instance of Amazon Connect.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        queue-id: The identifier for the queue.
        user-id: The identifier for the user. This can be the ID or the ARN of the user.
