name: start-resource-state-update
description: Begin asynchronous resource state update for lifecycle changes to the specified image resources.
flags:
    --client-token=!: Unique, case-sensitive identifier you provide to ensure idempotency of the request.
    --exclusion-rules=: Skip action on the image resource and associated resources if specified exclusion rules are met.
    --execution-role=: The name or Amazon Resource Name (ARN) of the IAM role that’s used to update image state.
    --include-resources=: A list of image resources to update state for.
    --resource-arn=!: The ARN of the Image Builder resource that is updated.
    --state=!: Indicates the lifecycle action to take for this request.
    --update-at=: The timestamp that indicates when resources are updated by a lifecycle action.
documentation:
    command: Begin asynchronous resource state update for lifecycle changes to the specified image resources.
    flag:
        client-token: Unique, case-sensitive identifier you provide to ensure idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html) in the *Amazon EC2 API Reference*.
        exclusion-rules: Skip action on the image resource and associated resources if specified exclusion rules are met.
        execution-role: The name or Amazon Resource Name (ARN) of the IAM role that’s used to update image state.
        include-resources: A list of image resources to update state for.
        resource-arn: The ARN of the Image Builder resource that is updated. The state update might also impact associated resources.
        state: Indicates the lifecycle action to take for this request.
        update-at: The timestamp that indicates when resources are updated by a lifecycle action.
