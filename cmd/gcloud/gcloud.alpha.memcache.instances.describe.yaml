name: describe
description: '*(ALPHA)*  Display metadata for a Memorystore Memcached instance.'
flags:
    --region=: The name of the Memcached region of the instance.
documentation:
    command: |
        *(ALPHA)*  Displays all metadata associated with a Memcached instance given a valid instance name.

        This command can fail for the following reasons:
          * The instance specified does not exist.
          * The active account does not have permission to access the given instance.
    flag:
        region: |-
            The name of the Memcached region of the instance. Overrides the default
            memcache/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `memcache/region`.
