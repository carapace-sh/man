name: describe-image-tags
description: Returns the image tag details for a repository in a public registry.
flags:
    --max-results=: The maximum number of repository results that's returned by `DescribeImageTags` in paginated output.
    --next-token=: The `nextToken` value that's returned from a previous paginated `DescribeImageTags` request where `maxResults` was used and the results exceeded the value of that parameter.
    --registry-id=: The Amazon Web Services account ID that's associated with the public registry that contains the repository where images are described.
    --repository-name=!: The name of the repository that contains the image tag details to describe.
documentation:
    command: Returns the image tag details for a repository in a public registry.
    flag:
        max-results: The maximum number of repository results that's returned by `DescribeImageTags` in paginated output. When this parameter is used, `DescribeImageTags` only returns `maxResults` results in a single page along with a `nextToken` response element. You can see the remaining results of the initial request by sending another `DescribeImageTags` request with the returned `nextToken` value. This value can be between 1 and 1000. If this parameter isn't used, then `DescribeImageTags` returns up to 100 results and a `nextToken` value, if applicable. If you specify images with `imageIds`, you can't use this option.
        next-token: The `nextToken` value that's returned from a previous paginated `DescribeImageTags` request where `maxResults` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `nextToken` value. If there are no more results to return, this value is `null`. If you specify images with `imageIds`, you can't use this option.
        registry-id: The Amazon Web Services account ID that's associated with the public registry that contains the repository where images are described. If you do not specify a registry, the default public registry is assumed.
        repository-name: The name of the repository that contains the image tag details to describe.
