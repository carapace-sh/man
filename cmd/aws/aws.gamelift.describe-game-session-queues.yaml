name: describe-game-session-queues
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Retrieves the properties for one or more game session queues.
flags:
    --limit=: The maximum number of results to return.
    --names=: A list of queue names to retrieve information for.
    --next-token=: A token that indicates the start of the next sequential page of results.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Retrieves the properties for one or more game session queues. When requesting multiple queues, use the pagination parameters to retrieve results as a set of sequential pages. When specifying a list of queues, objects are returned only for queues that currently exist in the Region.

        **Learn more**

        [View Your Queues](https://docs.aws.amazon.com/gamelift/latest/developerguide/queues-console.html)
    flag:
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages. You can request up to 50 results.
        names: A list of queue names to retrieve information for. You can use either the queue ID or ARN value. To request settings for all queues, leave this parameter empty.
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
