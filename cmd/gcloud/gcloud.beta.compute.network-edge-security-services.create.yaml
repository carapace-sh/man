name: create
description: '*(BETA)*  Create a Compute Engine network edge security service.'
flags:
    --description=: An optional, textual description for the network edge security service.
    --region=: Region of the network edge security service to create.
    --security-policy-region=: Region of the security policy to operate on.
    --security-policy=: The security policy that will be set for this network edge security service.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute network-edge-security-services create* is used to create network edge security services.

        ## EXAMPLES

        To create a network edge security service with the name 'my-service' in region
        'us-central1', run:

          $ gcloud beta compute network-edge-security-services create my-service \
            --region=us-central1

        To create a network edge security service with the name 'my-service' with
        security policy 'my-policy' attached in region 'us-central1', run:

          $ gcloud beta compute network-edge-security-services create my-service \
            --security-policy=my-policy \
            --region=us-central1
    flag:
        description: An optional, textual description for the network edge security service.
        region: Region of the network edge security service to create. Overrides the default *compute/region* property value for this command invocation.
        security-policy: The security policy that will be set for this network edge security service. To remove the policy from this network edge security service set the policy to an empty string.
        security-policy-region: Region of the security policy to operate on. Overrides the default *compute/region* property value for this command invocation.
