name: list-monitors
description: Returns a list of monitors created with the [CreateMonitor]() operation and [CreateAutoPredictor]() operation.
flags:
    --filters=: An array of filters.
    --max-results=: The maximum number of monitors to include in the response.
    --next-token=: If the result of the previous request was truncated, the response includes a `NextToken`.
documentation:
    command: Returns a list of monitors created with the [CreateMonitor]() operation and [CreateAutoPredictor]() operation. For each monitor resource, this operation returns of a summary of its properties, including its Amazon Resource Name (ARN). You can retrieve a complete set of properties of a monitor resource by specify the monitor's ARN in the [DescribeMonitor]() operation.
    flag:
        filters: |-
            An array of filters. For each filter, provide a condition and a match statement. The condition is either `IS` or `IS_NOT`, which specifies whether to include or exclude the resources that match the statement from the list. The match statement consists of a key and a value.

            **Filter properties**

            - `Condition` - The condition to apply. Valid values are `IS` and `IS_NOT`.
            - `Key` - The name of the parameter to filter on. The only valid value is `Status`.
            - `Value` - The value to match.

            For example, to list all monitors who's status is ACTIVE, you would specify:

            `"Filters": [ { "Condition": "IS", "Key": "Status", "Value": "ACTIVE" } ]`
        max-results: The maximum number of monitors to include in the response.
        next-token: If the result of the previous request was truncated, the response includes a `NextToken`. To retrieve the next set of results, use the token in the next request. Tokens expire after 24 hours.
