name: update-code-security-integration
description: Updates an existing code security integration.
flags:
    --details=!: The updated integration details specific to the repository provider type.
    --integration-arn=!: The Amazon Resource Name (ARN) of the code security integration to update.
documentation:
    command: |-
        Updates an existing code security integration.

        After calling the `CreateCodeSecurityIntegration` operation, you complete authentication and authorization with your provider. Next you call the `UpdateCodeSecurityIntegration` operation to provide the `details` to complete the integration setup
    flag:
        details: The updated integration details specific to the repository provider type.
        integration-arn: The Amazon Resource Name (ARN) of the code security integration to update.
