name: update-studio-session-mapping
description: Updates the session policy attached to the user or group for the specified Amazon EMR Studio.
flags:
    --identity-id=: The globally unique identifier (GUID) of the user or group.
    --identity-name=: The name of the user or group to update.
    --identity-type=!: Specifies whether the identity to update is a user or a group.
    --session-policy-arn=!: The Amazon Resource Name (ARN) of the session policy to associate with the specified user or group.
    --studio-id=!: The ID of the Amazon EMR Studio.
completion:
    flag:
        identity-type:
            - USER
            - GROUP
documentation:
    command: Updates the session policy attached to the user or group for the specified Amazon EMR Studio.
    flag:
        identity-id: The globally unique identifier (GUID) of the user or group. For more information, see [UserId](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_User.html#singlesignon-Type-User-UserId) and [GroupId](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_Group.html#singlesignon-Type-Group-GroupId) in the *IAM Identity Center Identity Store API Reference*. Either `IdentityName` or `IdentityId` must be specified.
        identity-name: The name of the user or group to update. For more information, see [UserName](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_User.html#singlesignon-Type-User-UserName) and [DisplayName](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_Group.html#singlesignon-Type-Group-DisplayName) in the *IAM Identity Center Identity Store API Reference*. Either `IdentityName` or `IdentityId` must be specified.
        identity-type: Specifies whether the identity to update is a user or a group.
        session-policy-arn: The Amazon Resource Name (ARN) of the session policy to associate with the specified user or group.
        studio-id: The ID of the Amazon EMR Studio.
