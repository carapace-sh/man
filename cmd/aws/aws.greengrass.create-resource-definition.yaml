name: create-resource-definition
description: Creates a resource definition which contains a list of resources to be used in a group.
flags:
    --amzn-client-token=: A client token used to correlate requests and responses.
    --initial-version=: Information about the initial version of the resource definition.
    --name=: The name of the resource definition.
    --tags=: Tag(s) to add to the new resource.
documentation:
    command: Creates a resource definition which contains a list of resources to be used in a group. You can create an initial version of the definition by providing a list of resources now, or use ''CreateResourceDefinitionVersion'' later.
    flag:
        amzn-client-token: A client token used to correlate requests and responses.
        initial-version: Information about the initial version of the resource definition.
        name: The name of the resource definition.
        tags: Tag(s) to add to the new resource.
