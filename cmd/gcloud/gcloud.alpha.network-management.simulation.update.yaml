name: update
description: '*(ALPHA)*  Update a simulation.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --file-format=!: Format of the proposed-config-file.
    --location=: The location ID
    --no-async&: Return immediately, without waiting for the operation in progress to
    --original-config-file=: Path to JSON file with the original config.
    --proposed-config-file=!: Path to json file containing the changes.
    --simulation-type=!: Type of simulation.
completion:
    flag:
        file-format:
            - gcp
            - tf
        simulation-type:
            - connectivity-test
            - shadowed-firewall
documentation:
    command: |
        *(ALPHA)*  Update an existing simulation.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        file-format: |-
            Format of the proposed-config-file. _FILE_FORMAT_ must be one of:
            +
            *gcp*::: The config change file is in gcp format.
            *tf*::: The config change file is in terraform format.
            :::
            +
        location: |-
            The location ID
            +
            To set the `location` attribute:
            * provide the argument `simulation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * use global location.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        original-config-file: Path to JSON file with the original config. Required when FILE_FORMAT is gcp.
        proposed-config-file: Path to json file containing the changes.
        simulation-type: 'Type of simulation. _SIMULATION_TYPE_ must be one of: *connectivity-test*, *shadowed-firewall*.'
