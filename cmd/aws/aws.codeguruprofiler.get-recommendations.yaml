name: get-recommendations
description: Returns a list of [`Recommendation`](https://docs.aws.amazon.com/codeguru/latest/profiler-api/API_Recommendation.html) objects that contain recommendations for a profiling group for a given time period.
flags:
    --end-time=!: The start time of the profile to get analysis data about.
    --locale=: The language used to provide analysis.
    --profiling-group-name=!: The name of the profiling group to get analysis data about.
    --start-time=!: The end time of the profile to get analysis data about.
documentation:
    command: Returns a list of [`Recommendation`](https://docs.aws.amazon.com/codeguru/latest/profiler-api/API_Recommendation.html) objects that contain recommendations for a profiling group for a given time period. A list of [`Anomaly`](https://docs.aws.amazon.com/codeguru/latest/profiler-api/API_Anomaly.html) objects that contains details about anomalies detected in the profiling group for the same time period is also returned.
    flag:
        end-time: The start time of the profile to get analysis data about. You must specify `startTime` and `endTime`. This is specified using the ISO 8601 format. For example, 2020-06-01T13:15:02.001Z represents 1 millisecond past June 1, 2020 1:15:02 PM UTC.
        locale: |-
            The language used to provide analysis. Specify using a string that is one of the following `BCP 47` language codes.

            - `de-DE` - German, Germany
            - `en-GB` - English, United Kingdom
            - `en-US` - English, United States
            - `es-ES` - Spanish, Spain
            - `fr-FR` - French, France
            - `it-IT` - Italian, Italy
            - `ja-JP` - Japanese, Japan
            - `ko-KR` - Korean, Republic of Korea
            - `pt-BR` - Portugese, Brazil
            - `zh-CN` - Chinese, China
            - `zh-TW` - Chinese, Taiwan
        profiling-group-name: The name of the profiling group to get analysis data about.
        start-time: The end time of the profile to get analysis data about. You must specify `startTime` and `endTime`. This is specified using the ISO 8601 format. For example, 2020-06-01T13:15:02.001Z represents 1 millisecond past June 1, 2020 1:15:02 PM UTC.
