name: list-permissions
description: Returns a list of the principal permissions on the resource, filtered by the permissions of the caller.
flags:
    --catalog-id=: The identifier for the Data Catalog.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-related=: Indicates that related permissions should be included in the results when listing permissions on a table resource.
    --max-results=: The maximum number of results to return.
    --next-token=: A continuation token, if this is not the first call to retrieve this list.
    --principal=: Specifies a principal to filter the permissions returned.
    --resource-type=: Specifies a resource type to filter the permissions returned.
    --resource=: A resource where you will get a list of the principal permissions.
completion:
    flag:
        resource-type:
            - CATALOG
            - DATABASE
            - TABLE
            - DATA_LOCATION
            - LF_TAG
            - LF_TAG_POLICY
            - LF_TAG_POLICY_DATABASE
            - LF_TAG_POLICY_TABLE
            - LF_NAMED_TAG_EXPRESSION
documentation:
    command: |-
        Returns a list of the principal permissions on the resource, filtered by the permissions of the caller. For example, if you are granted an ALTER permission, you are able to see only the principal permissions for ALTER.

        This operation returns only those permissions that have been explicitly granted. If both `Principal` and `Resource` parameters are provided, the response returns effective permissions rather than the explicitly granted permissions.

        For information about permissions, see [Security and Access Control to Metadata and Data](https://docs.aws.amazon.com/lake-formation/latest/dg/security-data-access.html).
    flag:
        catalog-id: The identifier for the Data Catalog. By default, the account ID. The Data Catalog is the persistent metadata store. It contains database definitions, table definitions, and other control information to manage your Lake Formation environment.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-related: |-
            Indicates that related permissions should be included in the results when listing permissions on a table resource.

            Set the field to `TRUE` to show the cell filters on a table resource. Default is `FALSE`. The Principal parameter must not be specified when requesting cell filter information.
        max-results: The maximum number of results to return.
        next-token: A continuation token, if this is not the first call to retrieve this list.
        principal: Specifies a principal to filter the permissions returned.
        resource: |-
            A resource where you will get a list of the principal permissions.

            This operation does not support getting privileges on a table with columns. Instead, call this operation on the table, and the operation returns the table and the table w columns.
        resource-type: Specifies a resource type to filter the permissions returned.
