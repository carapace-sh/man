name: create
description: '*(BETA)*  Create a new Vertex AI endpoint.'
flags:
    --description=: Description of the endpoint.
    --display-name=!: Display name of the endpoint.
    --encryption-kms-key-name=: The Cloud KMS resource identifier of the customer managed encryption key
    --endpoint-id=: User-specified ID of the endpoint.
    --gdc-zone=: The name of the GDC zone.
    --gdce-zone=&: The name of the GDCE zone.
    --labels=: List of label KEY=VALUE pairs to add.
    --network=: The full name of the Google Compute Engine network to which the endpoint should be peered.
    --region=: ID of the region or fully qualified identifier for the region.
    --request-response-logging-rate=: Prediction request & response sampling rate for logging to BigQuery table.
    --request-response-logging-table=: BigQuery table uri for prediction request & response logging.
documentation:
    command: |-
        ## EXAMPLES

        To create an endpoint under project ``example'' in region ``us-central1'',
        run:

          $ gcloud beta ai endpoints create --project=example --region=us-central1
          --display-name=my_endpoint
    flag:
        description: Description of the endpoint.
        display-name: Display name of the endpoint.
        encryption-kms-key-name: |-
            The Cloud KMS resource identifier of the customer managed encryption key
            used to protect a resource. Has the form:
            projects/my-project/locations/my-region/keyRings/my-kr/cryptoKeys/my-key.
            +
            The key needs to be in the same region as where the compute resource is
            created.
        endpoint-id: User-specified ID of the endpoint.
        gdc-zone: The name of the GDC zone. If set, the endpoint is for GDCc.
        gdce-zone: |
            The name of the GDCE zone. If set, the endpoint is in GDCE.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        network: The full name of the Google Compute Engine network to which the endpoint should be peered.
        region: |-
            ID of the region or fully qualified identifier for the region.
            +
            To set the `region` attribute:
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
        request-response-logging-rate: Prediction request & response sampling rate for logging to BigQuery table.
        request-response-logging-table: |-
            BigQuery table uri for prediction request & response logging.
            +
            You can provide table uri that does not exist, it will be created for you.
            +
            Value should be provided in format: bq://``PROJECT_ID''/``DATASET''/``TABLE''
