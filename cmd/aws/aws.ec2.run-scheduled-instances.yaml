name: run-scheduled-instances
description: Launches the specified Scheduled Instances.
flags:
    --client-token=: Unique, case-sensitive identifier that ensures the idempotency of the request.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --instance-count=: The number of instances.
    --launch-specification=!: The launch specification.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --scheduled-instance-id=!: The Scheduled Instance ID.
documentation:
    command: |-
        Launches the specified Scheduled Instances.

        Before you can launch a Scheduled Instance, you must purchase it and obtain an identifier using [PurchaseScheduledInstances]().

        You must launch a Scheduled Instance during its scheduled time period. You can't stop or reboot a Scheduled Instance, but you can terminate it as needed. If you terminate a Scheduled Instance before the current scheduled time period ends, you can launch it again after a few minutes.
    flag:
        client-token: Unique, case-sensitive identifier that ensures the idempotency of the request. For more information, see [Ensuring Idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        instance-count: |-
            The number of instances.

            Default: 1
        launch-specification: The launch specification. You must match the instance type, Availability Zone, network, and platform of the schedule that you purchased.
        scheduled-instance-id: The Scheduled Instance ID.
