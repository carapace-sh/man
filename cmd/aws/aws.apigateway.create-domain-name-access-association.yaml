name: create-domain-name-access-association
description: Creates a domain name access association resource between an access association source and a private custom domain name.
flags:
    --access-association-source-type=!: The type of the domain name access association source.
    --access-association-source=!: The identifier of the domain name access association source.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-name-arn=!: The ARN of the domain name.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --tags=: The key-value map of strings.
completion:
    flag:
        access-association-source-type:
            - VPCE
documentation:
    command: Creates a domain name access association resource between an access association source and a private custom domain name.
    flag:
        access-association-source: The identifier of the domain name access association source. For a VPCE, the value is the VPC endpoint ID.
        access-association-source-type: The type of the domain name access association source.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-name-arn: The ARN of the domain name.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tags: The key-value map of strings. The valid character set is \[a-zA-Z+-=.\_:/]. The tag key can be up to 128 characters and must not start with `aws:`. The tag value can be up to 256 characters.
