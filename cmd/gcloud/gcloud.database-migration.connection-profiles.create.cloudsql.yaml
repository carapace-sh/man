completion:
    flag:
        activation-policy:
            - ALWAYS
            - NEVER
        availability-type:
            - REGIONAL
            - ZONAL
        data-disk-type:
            - PD_SSD
            - PD_HDD
        database-version:
            - MYSQL_5_7
            - MYSQL_5_6
            - MYSQL_8_0
            - MYSQL_8_0_18
            - MYSQL_8_0_26
            - MYSQL_8_0_27
            - MYSQL_8_0_28
            - MYSQL_8_0_30
            - MYSQL_8_0_31
            - MYSQL_8_0_32
            - MYSQL_8_0_33
            - MYSQL_8_0_34
            - MYSQL_8_0_35
            - MYSQL_8_0_36
            - MYSQL_8_0_37
            - MYSQL_8_4
            - POSTGRES_9_6
            - POSTGRES_10
            - POSTGRES_11
            - POSTGRES_12
