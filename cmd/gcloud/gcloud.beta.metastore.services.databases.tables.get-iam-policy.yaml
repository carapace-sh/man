name: get-iam-policy
description: '*(BETA)*  Get the IAM policy for the table.'
flags:
    --database=: The identifier of the database under Dataproc Metastore services.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --location=: The location of the Dataproc Metastore service.
    --page-size=: Some services group resource list output into pages.
    --service=: The identifier of the Dataproc Metastore service
    --sort-by=: Comma-separated list of resource field key names to sort by.
documentation:
    command: |
        *(BETA)*  `gcloud beta metastore services databases tables get-iam-policy` displays the IAM policy associated with the table.
        If formatted as JSON, the output can be edited and used as a
        policy file for set-iam-policy. The output includes an "etag" field
        identifying the version emitted and allowing detection of
        concurrent policy updates. The "etag" field should be removed to be
        used as set-iam-policy input; see `gcloud beta metastore services databases tables set-iam-policy`
        for additional details.
    flag:
        database: |-
            The identifier of the database under Dataproc Metastore services.
            +
            To set the `database` attribute:
            * provide the argument `table` on the command line with a fully specified name;
            * provide the argument `--database` on the command line.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `table` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        service: |-
            The identifier of the Dataproc Metastore service
            +
            To set the `service` attribute:
            * provide the argument `table` on the command line with a fully specified name;
            * provide the argument `--service` on the command line.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
