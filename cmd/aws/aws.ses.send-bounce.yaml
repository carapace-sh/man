name: send-bounce
description: Generates and sends a bounce message to the sender of an email you received through Amazon SES.
flags:
    --bounce-sender-arn=: This parameter is used only for sending authorization.
    --bounce-sender=!: The address to use in the "From" header of the bounce message.
    --bounced-recipient-info-list=!: A list of recipients of the bounced message, including the information required to create the Delivery Status Notifications (DSNs) for the recipients.
    --explanation=: Human-readable text for the bounce message to explain the failure.
    --message-dsn=: Message-related DSN fields.
    --original-message-id=!: The message ID of the message to be bounced.
documentation:
    command: |-
        Generates and sends a bounce message to the sender of an email you received through Amazon SES. You can only use this operation on an email up to 24 hours after you receive it.

        You cannot use this operation to send generic bounces for mail that was not received by Amazon SES.

        For information about receiving email through Amazon SES, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/dg/receiving-email.html).

        You can execute this operation no more than once per second.
    flag:
        bounce-sender: The address to use in the "From" header of the bounce message. This must be an identity that you have verified with Amazon SES.
        bounce-sender-arn: This parameter is used only for sending authorization. It is the ARN of the identity that is associated with the sending authorization policy that permits you to use the address in the "From" header of the bounce. For more information about sending authorization, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/dg/sending-authorization.html).
        bounced-recipient-info-list: A list of recipients of the bounced message, including the information required to create the Delivery Status Notifications (DSNs) for the recipients. You must specify at least one `BouncedRecipientInfo` in the list.
        explanation: Human-readable text for the bounce message to explain the failure. If not specified, the text is auto-generated based on the bounced recipient information.
        message-dsn: Message-related DSN fields. If not specified, Amazon SES chooses the values.
        original-message-id: The message ID of the message to be bounced.
