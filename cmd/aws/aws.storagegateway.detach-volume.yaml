name: detach-volume
description: Disconnects a volume from an iSCSI connection and then detaches the volume from the specified gateway.
flags:
    --force-detach: Set to `true` to forcibly remove the iSCSI connection of the target volume and detach the volume.
    --no-force-detach&: Set to `true` to forcibly remove the iSCSI connection of the target volume and detach the volume.
    --volume-arn=!: The Amazon Resource Name (ARN) of the volume to detach from the gateway.
documentation:
    command: Disconnects a volume from an iSCSI connection and then detaches the volume from the specified gateway. Detaching and attaching a volume enables you to recover your data from one gateway to a different gateway without creating a snapshot. It also makes it easier to move your volumes from an on-premises gateway to a gateway hosted on an Amazon EC2 instance. This operation is only supported in the volume gateway type.
    flag:
        force-detach: |-
            Set to `true` to forcibly remove the iSCSI connection of the target volume and detach the volume. The default is `false`. If this value is set to `false`, you must manually disconnect the iSCSI connection from the target volume.

            Valid Values: `true` | `false`
        volume-arn: The Amazon Resource Name (ARN) of the volume to detach from the gateway.
