name: describe-tape-recovery-points
description: Returns a list of virtual tape recovery points that are available for the specified tape gateway.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --gateway-arn=!: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit=: Specifies that the number of virtual tape recovery points that are described be limited to the specified number.
    --marker=: An opaque string that indicates the position at which to begin describing the virtual tape recovery points.
    --max-items=: The  total number of items to return in the command's output.
    --page-size=: The size of each page to get in the AWS service call.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: |-
        Returns a list of virtual tape recovery points that are available for the specified tape gateway.

        A recovery point is a point-in-time view of a virtual tape at which all the data on the virtual tape is consistent. If your gateway crashes, virtual tapes that have recovery points can be recovered to a new gateway. This operation is only supported in the tape gateway type.
