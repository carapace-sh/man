name: list-tags-for-resource
description: Displays the tags associated with a CloudWatch investigations resource.
flags:
    --resource-arn=!: The ARN of the CloudWatch investigations resource that you want to view tags for.
documentation:
    command: Displays the tags associated with a CloudWatch investigations resource. Currently, investigation groups support tagging.
    flag:
        resource-arn: |-
            The ARN of the CloudWatch investigations resource that you want to view tags for. You can use the `ListInvestigationGroups` operation to find the ARNs of investigation groups.

            The ARN format for an investigation group is `arn:aws:aiops:Region:account-id:investigation-group:investigation-group-id`.
