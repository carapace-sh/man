name: fetch-source-objects
description: Fetch objects for a Database Migration Service migration job by connection to the source.
flags:
    --region=: The Cloud region for the migration_job.
documentation:
    command: Fetch objects for a Database Migration Service migration job by connection to the source.
    flag:
        region: |-
            The Cloud region for the migration_job.
            +
            To set the `region` attribute:
            * provide the argument `migration_job` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
