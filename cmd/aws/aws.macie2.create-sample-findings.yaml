name: create-sample-findings
description: Creates sample findings.
flags:
    --finding-types=: An array of finding types, one for each type of sample finding to create.
documentation:
    command: Creates sample findings.
    flag:
        finding-types: An array of finding types, one for each type of sample finding to create. To create a sample of every type of finding that Amazon Macie supports, don't include this array in your request.
