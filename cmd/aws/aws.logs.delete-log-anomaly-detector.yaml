name: delete-log-anomaly-detector
description: Deletes the specified CloudWatch Logs anomaly detector.
flags:
    --anomaly-detector-arn=!: The ARN of the anomaly detector to delete.
documentation:
    command: Deletes the specified CloudWatch Logs anomaly detector.
    flag:
        anomaly-detector-arn: The ARN of the anomaly detector to delete. You can find the ARNs of log anomaly detectors in your account by using the [ListLogAnomalyDetectors](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_ListLogAnomalyDetectors.html) operation.
