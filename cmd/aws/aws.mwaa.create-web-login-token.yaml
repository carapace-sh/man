name: create-web-login-token
description: Creates a web login token for the Airflow Web UI.
flags:
    --name=!: The name of the Amazon MWAA environment.
documentation:
    command: Creates a web login token for the Airflow Web UI. To learn more, see [Creating an Apache Airflow web login token](https://docs.aws.amazon.com/mwaa/latest/userguide/call-mwaa-apis-web.html).
    flag:
        name: The name of the Amazon MWAA environment. For example, `MyMWAAEnvironment`.
