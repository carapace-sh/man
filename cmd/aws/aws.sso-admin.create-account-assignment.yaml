name: create-account-assignment
description: Assigns access to a principal for a specified Amazon Web Services account using a specified permission set.
flags:
    --instance-arn=!: The ARN of the IAM Identity Center instance under which the operation will be executed.
    --permission-set-arn=!: The ARN of the permission set that the admin wants to grant the principal access to.
    --principal-id=!: An identifier for an object in IAM Identity Center, such as a user or group.
    --principal-type=!: The entity type for which the assignment will be created.
    --target-id=!: TargetID is an Amazon Web Services account identifier, (For example, 123456789012).
    --target-type=!: The entity type for which the assignment will be created.
completion:
    flag:
        principal-type:
            - USER
            - GROUP
        target-type:
            - AWS_ACCOUNT
documentation:
    command: |-
        Assigns access to a principal for a specified Amazon Web Services account using a specified permission set.

        The term *principal* here refers to a user or group that is defined in IAM Identity Center.

        As part of a successful `CreateAccountAssignment` call, the specified permission set will automatically be provisioned to the account in the form of an IAM policy. That policy is attached to the IAM role created in IAM Identity Center. If the permission set is subsequently updated, the corresponding IAM policies attached to roles in your accounts will not be updated automatically. In this case, you must call `ProvisionPermissionSet` to make these updates.

        After a successful response, call `DescribeAccountAssignmentCreationStatus` to describe the status of an assignment creation request.
    flag:
        instance-arn: The ARN of the IAM Identity Center instance under which the operation will be executed. For more information about ARNs, see [Amazon Resource Names (ARNs) and Amazon Web Services Service Namespaces](/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference*.
        permission-set-arn: The ARN of the permission set that the admin wants to grant the principal access to.
        principal-id: An identifier for an object in IAM Identity Center, such as a user or group. PrincipalIds are GUIDs (For example, f81d4fae-7dec-11d0-a765-00a0c91e6bf6). For more information about PrincipalIds in IAM Identity Center, see the [IAM Identity Center Identity Store API Reference](/singlesignon/latest/IdentityStoreAPIReference/welcome.html).
        principal-type: The entity type for which the assignment will be created.
        target-id: TargetID is an Amazon Web Services account identifier, (For example, 123456789012).
        target-type: The entity type for which the assignment will be created.
