name: terminate-provisioned-product
description: Terminates the specified provisioned product.
flags:
    --accept-language=: The language code.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ignore-errors: If set to true, Service Catalog stops managing the specified provisioned product even if it cannot delete the underlying resources.
    --no-ignore-errors: If set to true, Service Catalog stops managing the specified provisioned product even if it cannot delete the underlying resources.
    --no-retain-physical-resources: When this boolean parameter is set to true, the `TerminateProvisionedProduct` API deletes the Service Catalog provisioned product.
    --provisioned-product-id=: The identifier of the provisioned product.
    --provisioned-product-name=: The name of the provisioned product.
    --retain-physical-resources: When this boolean parameter is set to true, the `TerminateProvisionedProduct` API deletes the Service Catalog provisioned product.
    --terminate-token=!: An idempotency token that uniquely identifies the termination request.
documentation:
    command: |-
        Terminates the specified provisioned product.

        This operation does not delete any records associated with the provisioned product.

        You can check the status of this request using [DescribeRecord]().
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ignore-errors: If set to true, Service Catalog stops managing the specified provisioned product even if it cannot delete the underlying resources.
        provisioned-product-id: The identifier of the provisioned product. You cannot specify both `ProvisionedProductName` and `ProvisionedProductId`.
        provisioned-product-name: The name of the provisioned product. You cannot specify both `ProvisionedProductName` and `ProvisionedProductId`.
        retain-physical-resources: When this boolean parameter is set to true, the `TerminateProvisionedProduct` API deletes the Service Catalog provisioned product. However, it does not remove the CloudFormation stack, stack set, or the underlying resources of the deleted provisioned product. The default value is false.
        terminate-token: An idempotency token that uniquely identifies the termination request. This token is only valid during the termination process. After the provisioned product is terminated, subsequent requests to terminate the same provisioned product always return **ResourceNotFound**.
