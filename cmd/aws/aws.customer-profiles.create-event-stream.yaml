name: create-event-stream
description: Creates an event stream, which is a subscription to real-time events, such as when profiles are created and updated through Amazon Connect Customer Profiles.
flags:
    --domain-name=!: The unique name of the domain.
    --event-stream-name=!: The name of the event stream.
    --tags=: The tags used to organize, track, or control access for this resource.
    --uri=!: The StreamARN of the destination to deliver profile events to.
documentation:
    command: |-
        Creates an event stream, which is a subscription to real-time events, such as when profiles are created and updated through Amazon Connect Customer Profiles.

        Each event stream can be associated with only one Kinesis Data Stream destination in the same region and Amazon Web Services account as the customer profiles domain
    flag:
        domain-name: The unique name of the domain.
        event-stream-name: The name of the event stream.
        tags: The tags used to organize, track, or control access for this resource.
        uri: The StreamARN of the destination to deliver profile events to. For example, arn:aws:kinesis:region:account-id:stream/stream-name
