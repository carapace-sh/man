name: create-computer
description: Creates an Active Directory computer object in the specified directory.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --computer-attributes=:
        description: An array of [Attribute]() objects that contain any LDAP attributes to apply to the computer account.
        nargs: -1
    --computer-name=!: The name of the computer account.
    --directory-id=!: The identifier of the directory in which to create the computer account.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --organizational-unit-distinguished-name=: The fully-qualified distinguished name of the organizational unit to place the computer account in.
    --password=!: A one-time password that is used to join the computer to the directory.
documentation:
    command: Creates an Active Directory computer object in the specified directory.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        computer-attributes: An array of [Attribute]() objects that contain any LDAP attributes to apply to the computer account.
        computer-name: The name of the computer account.
        directory-id: The identifier of the directory in which to create the computer account.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        organizational-unit-distinguished-name: The fully-qualified distinguished name of the organizational unit to place the computer account in.
        password: A one-time password that is used to join the computer to the directory. You should generate a random, strong password to use for this parameter.
