name: list-page-resolutions
description: Returns the resolution path of an engagement.
flags:
    --next-token=: A token to start the list.
    --page-id=!: The Amazon Resource Name (ARN) of the contact engaged for the incident.
documentation:
    command: Returns the resolution path of an engagement. For example, the escalation plan engaged in an incident might target an on-call schedule that includes several contacts in a rotation, but just one contact on-call when the incident starts. The resolution path indicates the hierarchy of *escalation plan &gt; on-call schedule &gt; contact*.
    flag:
        next-token: A token to start the list. Use this token to get the next set of results.
        page-id: The Amazon Resource Name (ARN) of the contact engaged for the incident.
