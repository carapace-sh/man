name: create-routing-control
description: Creates a new routing control.
flags:
    --client-token=: A unique, case-sensitive string of up to 64 ASCII characters.
    --cluster-arn=!: The Amazon Resource Name (ARN) of the cluster that includes the routing control.
    --control-panel-arn=: The Amazon Resource Name (ARN) of the control panel that includes the routing control.
    --routing-control-name=!: The name of the routing control.
documentation:
    command: |-
        Creates a new routing control.

        A routing control has one of two states: ON and OFF. You can map the routing control state to the state of an Amazon Route 53 health check, which can be used to control traffic routing.

        To get or update the routing control state, see the Recovery Cluster (data plane) API actions for Amazon Route 53 Application Recovery Controller.
    flag:
        client-token: A unique, case-sensitive string of up to 64 ASCII characters. To make an idempotent API request with an action, specify a client token in the request.
        cluster-arn: The Amazon Resource Name (ARN) of the cluster that includes the routing control.
        control-panel-arn: The Amazon Resource Name (ARN) of the control panel that includes the routing control.
        routing-control-name: The name of the routing control.
