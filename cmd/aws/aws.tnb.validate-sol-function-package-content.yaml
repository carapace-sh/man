name: validate-sol-function-package-content
description: Validates function package content.
flags:
    --content-type=: Function package content type.
    --file=!: Function package file.
    --vnf-pkg-id=!: Function package ID.
completion:
    flag:
        content-type:
            - application/zip
documentation:
    command: |-
        Validates function package content. This can be used as a dry run before uploading function package content with [PutSolFunctionPackageContent](https://docs.aws.amazon.com/tnb/latest/APIReference/API_PutSolFunctionPackageContent.html).

        A function package is a .zip file in CSAR (Cloud Service Archive) format that contains a network function (an ETSI standard telecommunication application) and function package descriptor that uses the TOSCA standard to describe how the network functions should run on your network.
    flag:
        content-type: Function package content type.
        file: Function package file.
        vnf-pkg-id: Function package ID.
