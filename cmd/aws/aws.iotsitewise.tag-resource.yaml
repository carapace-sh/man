name: tag-resource
description: Adds tags to an IoT SiteWise resource.
flags:
    --resource-arn=!: The [ARN](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of the resource to tag.
    --tags=!: A list of key-value pairs that contain metadata for the resource.
documentation:
    command: Adds tags to an IoT SiteWise resource. If a tag already exists for the resource, this operation updates the tag's value.
    flag:
        resource-arn: The [ARN](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of the resource to tag.
        tags: A list of key-value pairs that contain metadata for the resource. For more information, see [Tagging your IoT SiteWise resources](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/tag-resources.html) in the *IoT SiteWise User Guide*.
