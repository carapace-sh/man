name: get-kx-connection-string
description: Retrieves a connection string for a user to connect to a kdb cluster.
flags:
    --cluster-name=!: A name of the kdb cluster.
    --environment-id=!: A unique identifier for the kdb environment.
    --user-arn=!: The Amazon Resource Name (ARN) that identifies the user.
documentation:
    command: Retrieves a connection string for a user to connect to a kdb cluster. You must call this API using the same role that you have defined while creating a user.
    flag:
        cluster-name: A name of the kdb cluster.
        environment-id: A unique identifier for the kdb environment.
        user-arn: The Amazon Resource Name (ARN) that identifies the user. For more information about ARNs and how to use ARNs in policies, see [IAM Identifiers](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html) in the *IAM User Guide*.
