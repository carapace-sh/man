name: get-bot-aliases
description: Returns a list of aliases for a specified Amazon Lex bot.
flags:
    --bot-name=!: The name of the bot.
    --max-results=: The maximum number of aliases to return in the response.
    --name-contains=: Substring to match in bot alias names.
    --next-token=: A pagination token for fetching the next page of aliases.
documentation:
    command: |-
        Returns a list of aliases for a specified Amazon Lex bot.

        This operation requires permissions for the `lex:GetBotAliases` action.
    flag:
        bot-name: The name of the bot.
        max-results: The maximum number of aliases to return in the response. The default is 50. .
        name-contains: Substring to match in bot alias names. An alias will be returned if any part of its name matches the substring. For example, "xyz" matches both "xyzabc" and "abcxyz."
        next-token: A pagination token for fetching the next page of aliases. If the response to this call is truncated, Amazon Lex returns a pagination token in the response. To fetch the next page of aliases, specify the pagination token in the next request.
