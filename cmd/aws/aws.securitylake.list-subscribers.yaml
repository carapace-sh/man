name: list-subscribers
description: Lists all subscribers for the specific Amazon Security Lake account ID.
flags:
    --max-results=: The maximum number of accounts for which the configuration is displayed.
    --next-token=: If nextToken is returned, there are more results available.
documentation:
    command: Lists all subscribers for the specific Amazon Security Lake account ID. You can retrieve a list of subscriptions associated with a specific organization or Amazon Web Services account.
    flag:
        max-results: The maximum number of accounts for which the configuration is displayed.
        next-token: If nextToken is returned, there are more results available. You can repeat the call using the returned token to retrieve the next page.
