name: get-cis-scan-report
description: Retrieves a CIS scan report.
flags:
    --report-format=: The format of the report.
    --scan-arn=!: The scan ARN.
    --target-accounts=: The target accounts.
completion:
    flag:
        report-format:
            - PDF
            - CSV
documentation:
    command: Retrieves a CIS scan report.
    flag:
        report-format: The format of the report. Valid values are `PDF` and `CSV`. If no value is specified, the report format defaults to `PDF`.
        scan-arn: The scan ARN.
        target-accounts: The target accounts.
