name: create-dataset
description: Creates a dataset to upload training or test data for a model associated with a flywheel.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique identifier for the request.
    --dataset-name=!: Name of the dataset.
    --dataset-type=: The dataset type.
    --description=: Description of the dataset.
    --flywheel-arn=!: The Amazon Resource Number (ARN) of the flywheel of the flywheel to receive the data.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-data-config=!: Information about the input data configuration.
    --tags=: Tags for the dataset.
completion:
    flag:
        dataset-type:
            - TRAIN
            - TEST
documentation:
    command: Creates a dataset to upload training or test data for a model associated with a flywheel. For more information about datasets, see [Flywheel overview](https://docs.aws.amazon.com/comprehend/latest/dg/flywheels-about.html) in the *Amazon Comprehend Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: A unique identifier for the request. If you don't set the client request token, Amazon Comprehend generates one.
        dataset-name: Name of the dataset.
        dataset-type: The dataset type. You can specify that the data in a dataset is for training the model or for testing the model.
        description: Description of the dataset.
        flywheel-arn: The Amazon Resource Number (ARN) of the flywheel of the flywheel to receive the data.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-data-config: Information about the input data configuration. The type of input data varies based on the format of the input and whether the data is for a classifier model or an entity recognition model.
        tags: Tags for the dataset.
