name: create
description: '*(ALPHA)*  Create a fleet namespace.'
flags:
    --labels=: List of label KEY=VALUE pairs to add.
    --namespace-labels=: List of namespace-level label KEY=VALUE pairs to add.
    --scope=: the
documentation:
    command: |-
        *(ALPHA)*  This command can fail for the following reasons:
        * The project specified does not exist.
        * The project has a fleet namespace with the same name.
        * The caller does not have permission to access the given project.

        ## EXAMPLES

        To create a fleet namespace with name `NAMESPACE` in the active project, run:

          $ gcloud alpha container fleet scopes namespaces create NAMESPACE

        To create a fleet namespace in fleet scope `SCOPE` in project `PROJECT_ID`
        with name
        `NAMESPACE`, run:

          $ gcloud alpha container fleet scopes namespaces create NAMESPACE --scope=SCOPE --project=PROJECT_ID
    flag:
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        namespace-labels: List of namespace-level label KEY=VALUE pairs to add.
        scope: |-
            the
            +
            To set the `scope` attribute:
            * provide the argument `NAMESPACE` on the command line with a fully specified name;
            * provide the argument `--scope` on the command line.
