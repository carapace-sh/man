name: create-package
description: Creates an IoT software package that can be deployed to your fleet.
flags:
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --description=: A summary of the package being created.
    --package-name=!: The name of the new software package.
    --tags=: Metadata that can be used to manage the package.
documentation:
    command: |-
        Creates an IoT software package that can be deployed to your fleet.

        Requires permission to access the [CreatePackage](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) and [GetIndexingConfiguration](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) actions.
    flag:
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        description: A summary of the package being created. This can be used to outline the package's contents or purpose.
        package-name: The name of the new software package.
        tags: Metadata that can be used to manage the package.
