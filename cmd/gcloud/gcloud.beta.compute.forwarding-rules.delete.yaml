name: delete
description: '*(BETA)*  Delete forwarding rules.'
flags:
    --global: If set, the forwarding rules are global.
    --no-global&: If set, the forwarding rules are global.
    --region=: Region of the forwarding rules to delete.
documentation:
    command: '*(BETA)*  *gcloud beta compute forwarding-rules delete* deletes one or more Compute Engine forwarding rules.'
    flag:
        global: If set, the forwarding rules are global.
        no-global: If set, the forwarding rules are global.
        region: |-
            Region of the forwarding rules to delete. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
