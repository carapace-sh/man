name: create-fleet
description: Creates an EC2 Fleet that contains the configuration information for On-Demand Instances and Spot Instances.
flags:
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --context=: Reserved.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --excess-capacity-termination-policy=: Indicates whether running instances should be terminated if the total target capacity of the EC2 Fleet is decreased below the current size of the EC2 Fleet.
    --launch-template-configs=!: The configuration for the EC2 Fleet.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-replace-unhealthy-instances&: Indicates whether EC2 Fleet should replace unhealthy Spot Instances.
    --no-terminate-instances-with-expiration&: Indicates whether running instances should be terminated when the EC2 Fleet expires.
    --on-demand-options=: Describes the configuration of On-Demand Instances in an EC2 Fleet.
    --replace-unhealthy-instances: Indicates whether EC2 Fleet should replace unhealthy Spot Instances.
    --spot-options=: Describes the configuration of Spot Instances in an EC2 Fleet.
    --tag-specifications=: The key-value pair for tagging the EC2 Fleet request on creation.
    --target-capacity-specification=!: The number of units to request.
    --terminate-instances-with-expiration: Indicates whether running instances should be terminated when the EC2 Fleet expires.
    --type=: The fleet type.
    --valid-from=: The start date and time of the request, in UTC format (for example, *YYYY*-*MM*-*DD*T*HH*:*MM*:*SS*Z).
    --valid-until=: The end date and time of the request, in UTC format (for example, *YYYY*-*MM*-*DD*T*HH*:*MM*:*SS*Z).
completion:
    flag:
        excess-capacity-termination-policy:
            - no-termination
            - termination
        type:
            - request
            - maintain
            - instant
documentation:
    command: |-
        Creates an EC2 Fleet that contains the configuration information for On-Demand Instances and Spot Instances. Instances are launched immediately if there is available capacity.

        A single EC2 Fleet can include multiple launch specifications that vary by instance type, AMI, Availability Zone, or subnet.

        For more information, see [EC2 Fleet](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-fleet.html) in the *Amazon EC2 User Guide*.
    flag:
        client-token: |-
            Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you do not specify a client token, a randomly generated token is used for the request to ensure idempotency.

            For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        context: Reserved.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        excess-capacity-termination-policy: |-
            Indicates whether running instances should be terminated if the total target capacity of the EC2 Fleet is decreased below the current size of the EC2 Fleet.

            Supported only for fleets of type `maintain`.
        launch-template-configs: The configuration for the EC2 Fleet.
        on-demand-options: Describes the configuration of On-Demand Instances in an EC2 Fleet.
        replace-unhealthy-instances: Indicates whether EC2 Fleet should replace unhealthy Spot Instances. Supported only for fleets of type `maintain`. For more information, see [EC2 Fleet health checks](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/manage-ec2-fleet.html#ec2-fleet-health-checks) in the *Amazon EC2 User Guide*.
        spot-options: Describes the configuration of Spot Instances in an EC2 Fleet.
        tag-specifications: |-
            The key-value pair for tagging the EC2 Fleet request on creation. For more information, see [Tag your resources](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Using_Tags.html#tag-resources).

            If the fleet type is `instant`, specify a resource type of `fleet` to tag the fleet or `instance` to tag the instances at launch.

            If the fleet type is `maintain` or `request`, specify a resource type of `fleet` to tag the fleet. You cannot specify a resource type of `instance`. To tag instances at launch, specify the tags in a [launch template](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-launch-templates.html#create-launch-template).
        target-capacity-specification: The number of units to request.
        terminate-instances-with-expiration: Indicates whether running instances should be terminated when the EC2 Fleet expires.
        type: |-
            The fleet type. The default value is `maintain`.

            - `maintain` - The EC2 Fleet places an asynchronous request for your desired capacity, and continues to maintain your desired Spot capacity by replenishing interrupted Spot Instances.
            - `request` - The EC2 Fleet places an asynchronous one-time request for your desired capacity, but does submit Spot requests in alternative capacity pools if Spot capacity is unavailable, and does not maintain Spot capacity if Spot Instances are interrupted.
            - `instant` - The EC2 Fleet places a synchronous one-time request for your desired capacity, and returns errors for any instances that could not be launched.

            For more information, see [EC2 Fleet request types](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-fleet-request-type.html) in the *Amazon EC2 User Guide*.
        valid-from: The start date and time of the request, in UTC format (for example, *YYYY*-*MM*-*DD*T*HH*:*MM*:*SS*Z). The default is to start fulfilling the request immediately.
        valid-until: The end date and time of the request, in UTC format (for example, *YYYY*-*MM*-*DD*T*HH*:*MM*:*SS*Z). At this point, no new EC2 Fleet requests are placed or able to fulfill the request. If no value is specified, the request remains until you cancel it.
