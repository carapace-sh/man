name: create-agent
description: Activates an DataSync agent that you deploy in your storage environment.
flags:
    --activation-key=!: Specifies your DataSync agent's activation key.
    --agent-name=: Specifies a name for your agent.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --security-group-arns=:
        description: Specifies the Amazon Resource Name (ARN) of the security group that allows traffic between your agent and VPC service endpoint.
        nargs: -1
    --subnet-arns=:
        description: Specifies the ARN of the subnet where your VPC service endpoint is located.
        nargs: -1
    --tags=:
        description: Specifies labels that help you categorize, filter, and search for your Amazon Web Services resources.
        nargs: -1
    --vpc-endpoint-id=: Specifies the ID of the [VPC service endpoint](https://docs.aws.amazon.com/datasync/latest/userguide/choose-service-endpoint.html#datasync-in-vpc) that you're using.
documentation:
    command: |-
        Activates an DataSync agent that you deploy in your storage environment. The activation process associates the agent with your Amazon Web Services account.

        If you haven't deployed an agent yet, see [Do I need a DataSync agent?](https://docs.aws.amazon.com/datasync/latest/userguide/do-i-need-datasync-agent.html)
    flag:
        activation-key: Specifies your DataSync agent's activation key. If you don't have an activation key, see [Activating your agent](https://docs.aws.amazon.com/datasync/latest/userguide/activate-agent.html).
        agent-name: Specifies a name for your agent. We recommend specifying a name that you can remember.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        security-group-arns: Specifies the Amazon Resource Name (ARN) of the security group that allows traffic between your agent and VPC service endpoint. You can only specify one ARN.
        subnet-arns: Specifies the ARN of the subnet where your VPC service endpoint is located. You can only specify one ARN.
        tags: Specifies labels that help you categorize, filter, and search for your Amazon Web Services resources. We recommend creating at least one tag for your agent.
        vpc-endpoint-id: |-
            Specifies the ID of the [VPC service endpoint](https://docs.aws.amazon.com/datasync/latest/userguide/choose-service-endpoint.html#datasync-in-vpc) that you're using. For example, a VPC endpoint ID looks like `vpce-01234d5aff67890e1`.

            The VPC service endpoint you use must include the DataSync service name (for example, `com.amazonaws.us-east-2.datasync`).
