name: update-db-instance
description: Updates a Timestream for InfluxDB DB instance.
flags:
    --allocated-storage=: The amount of storage to allocate for your DB storage type (in gibibytes).
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-instance-type=: The Timestream for InfluxDB DB instance type to run InfluxDB on.
    --db-parameter-group-identifier=: The id of the DB parameter group to assign to your DB instance.
    --db-storage-type=: The Timestream for InfluxDB DB storage type that InfluxDB stores data on.
    --deployment-type=: Specifies whether the DB instance will be deployed as a standalone instance or with a Multi-AZ standby for high availability.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identifier=!: The id of the DB instance.
    --log-delivery-configuration=: Configuration for sending InfluxDB engine logs to send to specified S3 bucket.
    --port=: The port number on which InfluxDB accepts connections.
completion:
    flag:
        db-instance-type:
            - db.influx.medium
            - db.influx.large
            - db.influx.xlarge
            - db.influx.2xlarge
            - db.influx.4xlarge
            - db.influx.8xlarge
            - db.influx.12xlarge
            - db.influx.16xlarge
            - db.influx.24xlarge
        db-storage-type:
            - InfluxIOIncludedT1
            - InfluxIOIncludedT2
            - InfluxIOIncludedT3
        deployment-type:
            - SINGLE_AZ
            - WITH_MULTIAZ_STANDBY
documentation:
    command: Updates a Timestream for InfluxDB DB instance.
    flag:
        allocated-storage: The amount of storage to allocate for your DB storage type (in gibibytes).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-instance-type: The Timestream for InfluxDB DB instance type to run InfluxDB on.
        db-parameter-group-identifier: The id of the DB parameter group to assign to your DB instance. DB parameter groups specify how the database is configured. For example, DB parameter groups can specify the limit for query concurrency.
        db-storage-type: The Timestream for InfluxDB DB storage type that InfluxDB stores data on.
        deployment-type: Specifies whether the DB instance will be deployed as a standalone instance or with a Multi-AZ standby for high availability.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identifier: The id of the DB instance.
        log-delivery-configuration: Configuration for sending InfluxDB engine logs to send to specified S3 bucket.
        port: |-
            The port number on which InfluxDB accepts connections.

            If you change the Port value, your database restarts immediately.

            Valid Values: 1024-65535

            Default: 8086

            Constraints: The value can't be 2375-2376, 7788-7799, 8090, or 51678-51680
