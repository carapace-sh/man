name: delete-kx-environment
description: Deletes the kdb environment.
flags:
    --client-token=: A token that ensures idempotency.
    --environment-id=!: A unique identifier for the kdb environment.
documentation:
    command: Deletes the kdb environment. This action is irreversible. Deleting a kdb environment will remove all the associated data and any services running in it.
    flag:
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        environment-id: A unique identifier for the kdb environment.
