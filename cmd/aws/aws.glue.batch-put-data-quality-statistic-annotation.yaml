name: batch-put-data-quality-statistic-annotation
description: Annotate datapoints over time for a specific data quality statistic.
flags:
    --client-token=: Client Token.
    --inclusion-annotations=!: A list of `DatapointInclusionAnnotation`'s.
documentation:
    command: Annotate datapoints over time for a specific data quality statistic. The API requires both profileID and statisticID as part of the InclusionAnnotation input. The API only works for a single statisticId across multiple profiles.
    flag:
        client-token: Client Token.
        inclusion-annotations: A list of `DatapointInclusionAnnotation`'s. The InclusionAnnotations must contain a profileId and statisticId. If there are multiple InclusionAnnotations, the list must refer to a single statisticId across multiple profileIds.
