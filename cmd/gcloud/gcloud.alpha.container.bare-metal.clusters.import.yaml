name: import
description: '*(ALPHA)*  Import an Anthos on bare metal user cluster.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Google Cloud location for the cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-validate-only&: If set, only validate the request, but do not actually perform the operation.
    --source=: Path to a YAML file containing configuration export data.
    --validate-only: If set, only validate the request, but do not actually perform the operation.
documentation:
    command: '*(ALPHA)*  Import an Anthos on bare metal user cluster.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-validate-only: If set, only validate the request, but do not actually perform the operation.
        source: |-
            Path to a YAML file containing configuration export data.
                      Alternatively, you may omit this flag to read from standard input.For a schema describing the export/import format, see:
                      $CLOUDSDKROOT/lib/googlecloudsdk/schemas/gkeonprem/v1/BareMetalCluster.yaml.
            +

                  Note: $CLOUDSDKROOT represents the Google Cloud CLI's installation directory.
        validate-only: If set, only validate the request, but do not actually perform the operation.
