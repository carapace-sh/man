name: update-case-status
description: Updates the state transitions for a designated cases.
flags:
    --case-id=!: Required element for UpdateCaseStatus to identify the case to update.
    --case-status=!: Required element for UpdateCaseStatus to identify the status for a case.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
completion:
    flag:
        case-status:
            - Submitted
            - Detection and Analysis
            - Containment, Eradication and Recovery
            - Post-incident Activities
documentation:
    command: |-
        Updates the state transitions for a designated cases.

        **Self-managed**: the following states are available for self-managed cases.

        - Submitted → Detection and Analysis
        - Detection and Analysis → Containment, Eradication, and Recovery
        - Detection and Analysis → Post-incident Activities
        - Containment, Eradication, and Recovery → Detection and Analysis
        - Containment, Eradication, and Recovery → Post-incident Activities
        - Post-incident Activities → Containment, Eradication, and Recovery
        - Post-incident Activities → Detection and Analysis
        - Any → Closed

        **AWS supported**: You must use the `CloseCase` API to close.
    flag:
        case-id: Required element for UpdateCaseStatus to identify the case to update.
        case-status: Required element for UpdateCaseStatus to identify the status for a case. Options include `Submitted | Detection and Analysis | Containment, Eradication and Recovery | Post-incident Activities`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
