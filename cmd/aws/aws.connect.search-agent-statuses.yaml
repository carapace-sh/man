name: search-agent-statuses
description: Searches AgentStatuses in an Amazon Connect instance, with optional filtering.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --search-criteria=: The search criteria to be used to return agent statuses.
    --search-filter=: Filters to be applied to search results.
documentation:
    command: Searches AgentStatuses in an Amazon Connect instance, with optional filtering.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can find the instanceId in the ARN of the instance.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        search-criteria: The search criteria to be used to return agent statuses.
        search-filter: Filters to be applied to search results.
