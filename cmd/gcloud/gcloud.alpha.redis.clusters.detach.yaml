name: detach
description: '*(ALPHA)*  Detach a secondary cluster.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Redis region of the cluster.
documentation:
    command: |
        *(ALPHA)*  Detach a secondary cluster from the primary cluster.

        After detachment, the secondary cluster becomes an independent cluster, i.e. it stops replicating
        from the primary cluster and it now accepts both read and write requests.

        This command is only supported on secondary clusters.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Redis region of the cluster. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
