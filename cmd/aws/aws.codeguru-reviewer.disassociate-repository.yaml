name: disassociate-repository
description: Removes the association between Amazon CodeGuru Reviewer and a repository.
flags:
    --association-arn=!: The Amazon Resource Name (ARN) of the [RepositoryAssociation](https://docs.aws.amazon.com/codeguru/latest/reviewer-api/API_RepositoryAssociation.html) object.
documentation:
    command: Removes the association between Amazon CodeGuru Reviewer and a repository.
    flag:
        association-arn: The Amazon Resource Name (ARN) of the [RepositoryAssociation](https://docs.aws.amazon.com/codeguru/latest/reviewer-api/API_RepositoryAssociation.html) object. You can retrieve this ARN by calling [ListRepositoryAssociations](https://docs.aws.amazon.com/codeguru/latest/reviewer-api/API_ListRepositoryAssociations.html).
