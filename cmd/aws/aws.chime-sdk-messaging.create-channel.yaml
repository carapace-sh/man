name: create-channel
description: Creates a channel to which you can add users and send messages.
flags:
    --app-instance-arn=!: The ARN of the channel request.
    --channel-id=: An ID for the channel being created.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=!: The client token for the request.
    --elastic-channel-configuration=: The attributes required to configure and create an elastic channel.
    --expiration-settings=: Settings that control the interval after which the channel is automatically deleted.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --member-arns=: The ARNs of the channel members in the request.
    --metadata=: The metadata of the creation request.
    --mode=: 'The channel mode: `UNRESTRICTED` or `RESTRICTED`.'
    --moderator-arns=: The ARNs of the channel moderators in the request.
    --name=!: The name of the channel.
    --privacy=: 'The channel''s privacy level: `PUBLIC` or `PRIVATE`.'
    --tags=: The tags for the creation request.
completion:
    flag:
        mode:
            - UNRESTRICTED
            - RESTRICTED
        privacy:
            - PUBLIC
            - PRIVATE
documentation:
    command: |-
        Creates a channel to which you can add users and send messages.

        **Restriction**: You can't change a channel's privacy.

        The `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call as the value in the header.
    flag:
        app-instance-arn: The ARN of the channel request.
        channel-id: An ID for the channel being created. If you do not specify an ID, a UUID will be created for the channel.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: The client token for the request. An `Idempotency` token.
        elastic-channel-configuration: The attributes required to configure and create an elastic channel. An elastic channel can support a maximum of 1-million users, excluding moderators.
        expiration-settings: Settings that control the interval after which the channel is automatically deleted.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        member-arns: The ARNs of the channel members in the request.
        metadata: The metadata of the creation request. Limited to 1KB and UTF-8.
        mode: 'The channel mode: `UNRESTRICTED` or `RESTRICTED`. Administrators, moderators, and channel members can add themselves and other members to unrestricted channels. Only administrators and moderators can add members to restricted channels.'
        moderator-arns: The ARNs of the channel moderators in the request.
        name: The name of the channel.
        privacy: 'The channel''s privacy level: `PUBLIC` or `PRIVATE`. Private channels aren''t discoverable by users outside the channel. Public channels are discoverable by anyone in the `AppInstance`.'
        tags: The tags for the creation request.
