name: search-sample-queries
description: Searches sample queries and returns a list of sample queries that are sorted by relevance.
flags:
    --max-results=: The maximum number of results to return on a single page.
    --next-token=: A token you can use to get the next page of results.
    --search-phrase=!: The natural language phrase to use for the semantic search.
documentation:
    command: Searches sample queries and returns a list of sample queries that are sorted by relevance. To search for sample queries, provide a natural language `SearchPhrase` in English.
    flag:
        max-results: The maximum number of results to return on a single page. The default value is 10.
        next-token: A token you can use to get the next page of results. The length constraint is in characters, not words.
        search-phrase: The natural language phrase to use for the semantic search. The phrase must be in English. The length constraint is in characters, not words.
