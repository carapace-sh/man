name: update-stream
description: Updates an existing stream.
flags:
    --description=: The description of the stream.
    --files=: The files associated with the stream.
    --role-arn=: An IAM role that allows the IoT service principal assumes to access your S3 files.
    --stream-id=!: The stream ID.
documentation:
    command: |-
        Updates an existing stream. The stream version will be incremented by one.

        Requires permission to access the [UpdateStream](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        description: The description of the stream.
        files: The files associated with the stream.
        role-arn: An IAM role that allows the IoT service principal assumes to access your S3 files.
        stream-id: The stream ID.
