name: put-rum-metrics-destination
description: Creates or updates a destination to receive extended metrics from CloudWatch RUM.
flags:
    --app-monitor-name=!: The name of the CloudWatch RUM app monitor that will send the metrics.
    --destination-arn=: Use this parameter only if `Destination` is `Evidently`.
    --destination=!: Defines the destination to send the metrics to.
    --iam-role-arn=: This parameter is required if `Destination` is `Evidently`.
completion:
    flag:
        destination:
            - CloudWatch
            - Evidently
documentation:
    command: |-
        Creates or updates a destination to receive extended metrics from CloudWatch RUM. You can send extended metrics to CloudWatch or to a CloudWatch Evidently experiment.

        For more information about extended metrics, see [BatchCreateRumMetricDefinitions](https://docs.aws.amazon.com/cloudwatchrum/latest/APIReference/API_BatchCreateRumMetricDefinitions.html).
    flag:
        app-monitor-name: The name of the CloudWatch RUM app monitor that will send the metrics.
        destination: Defines the destination to send the metrics to. Valid values are `CloudWatch` and `Evidently`. If you specify `Evidently`, you must also specify the ARN of the CloudWatchEvidently experiment that is to be the destination and an IAM role that has permission to write to the experiment.
        destination-arn: Use this parameter only if `Destination` is `Evidently`. This parameter specifies the ARN of the Evidently experiment that will receive the extended metrics.
        iam-role-arn: |-
            This parameter is required if `Destination` is `Evidently`. If `Destination` is `CloudWatch`, don't use this parameter.

            This parameter specifies the ARN of an IAM role that RUM will assume to write to the Evidently experiment that you are sending metrics to. This role must have permission to write to that experiment.

            If you specify this parameter, you must be signed on to a role that has [PassRole](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_passrole.html) permissions attached to it, to allow the role to be passed. The [CloudWatchAmazonCloudWatchRUMFullAccess](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/auth-and-access-control-cw.html#managed-policies-cloudwatch-RUM) policy doesn't include `PassRole` permissions.
