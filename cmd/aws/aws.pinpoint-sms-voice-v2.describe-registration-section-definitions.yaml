name: describe-registration-section-definitions
description: Retrieves the specified registration section definitions.
flags:
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
    --registration-type=!: The type of registration form.
    --section-paths=: An array of paths for the registration form section.
documentation:
    command: Retrieves the specified registration section definitions. You can use DescribeRegistrationSectionDefinitions to view the requirements for creating, filling out, and submitting each registration type.
    flag:
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
        registration-type: The type of registration form. The list of **RegistrationTypes** can be found using the [DescribeRegistrationTypeDefinitions]() action.
        section-paths: An array of paths for the registration form section.
