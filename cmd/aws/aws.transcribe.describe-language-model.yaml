name: describe-language-model
description: Provides information about the specified custom language model.
flags:
    --model-name=!: The name of the custom language model you want information about.
documentation:
    command: |-
        Provides information about the specified custom language model.

        This operation also shows if the base language model that you used to create your custom language model has been updated. If Amazon Transcribe has updated the base model, you can create a new custom language model using the updated base model.

        If you tried to create a new custom language model and the request wasn't successful, you can use `DescribeLanguageModel` to help identify the reason for this failure.
    flag:
        model-name: The name of the custom language model you want information about. Model names are case sensitive.
