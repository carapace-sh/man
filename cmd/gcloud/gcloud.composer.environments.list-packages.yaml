name: list-packages
description: List all PyPI modules installed in an Airflow worker.
flags:
    --location=: Region where Composer environment runs or in which to create the environment.
    --no-tree&: List PyPI packages, their versions and a dependency tree, as displayed by the "python -m pipdeptree --warn" command.
    --tree: List PyPI packages, their versions and a dependency tree, as displayed by the "python -m pipdeptree --warn" command.
documentation:
    command: List all PyPI modules installed in an Airflow worker.
    flag:
        location: |-
            Region where Composer environment runs or in which to create the environment.
            +
            To set the `location` attribute:
            * provide the argument `environment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `composer/location`.
        no-tree: |
            List PyPI packages, their versions and a dependency tree, as displayed by the "python -m pipdeptree --warn" command.
        tree: List PyPI packages, their versions and a dependency tree, as displayed by the "python -m pipdeptree --warn" command.
