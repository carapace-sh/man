name: create
description: '*(ALPHA)*  Create a new investigation.'
hidden: true
flags:
    --end-time=: The estimated end time of the issue you are investigating.
    --issue=!: A description of the issue you are investigating, or an error log.
    --resources=: A list of resources relevant to the investigation
    --start-time=: The estimated start time of the issue you are investigating.
    --title=: The desired title of the resulting investigation.
documentation:
    command: |-
        *(ALPHA)*  Shows metadata for the newly created investigation after creation.

        This command can fail for the following reasons:
        * The chosen investigation ID, if specified, already exists.
        * The active account does not have permission to create investigations in the
        project.

        ## EXAMPLES

        The following command creates a new investigation with the ID and some basic
        information
        `example-foo-bar-1`:

          $ gcloud alpha gemini cloud-assist investigations create example-foo-bar-1 --title="Example Investigation" --issue="I
          have a problem" --start-time=2025-07-10
    flag:
        end-time: The estimated end time of the issue you are investigating.
        issue: A description of the issue you are investigating, or an error log.
        resources: A list of resources relevant to the investigation
        start-time: The estimated start time of the issue you are investigating.
        title: The desired title of the resulting investigation.
