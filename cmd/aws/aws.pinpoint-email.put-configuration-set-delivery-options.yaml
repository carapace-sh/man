name: put-configuration-set-delivery-options
description: Associate a configuration set with a dedicated IP pool.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-set-name=!: The name of the configuration set that you want to associate with a dedicated IP pool.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --sending-pool-name=: The name of the dedicated IP pool that you want to associate with the configuration set.
    --tls-policy=: Specifies whether messages that use the configuration set are required to use Transport Layer Security (TLS).
completion:
    flag:
        tls-policy:
            - REQUIRE
            - OPTIONAL
documentation:
    command: Associate a configuration set with a dedicated IP pool. You can use dedicated IP pools to create groups of dedicated IP addresses for sending specific types of email.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-set-name: The name of the configuration set that you want to associate with a dedicated IP pool.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        sending-pool-name: The name of the dedicated IP pool that you want to associate with the configuration set.
        tls-policy: Specifies whether messages that use the configuration set are required to use Transport Layer Security (TLS). If the value is `Require`, messages are only delivered if a TLS connection can be established. If the value is `Optional`, messages can be delivered in plain text if a TLS connection can't be established.
