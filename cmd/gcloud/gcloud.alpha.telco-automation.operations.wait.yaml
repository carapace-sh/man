name: wait
description: '*(ALPHA)*  Poll long-running telco automation operation until it completes.'
flags:
    --location=: The location name.
documentation:
    command: |
        *(ALPHA)*  Poll a long-running telco automation operation until it completes. When
        the operation is complete, this command will display the results of the
        analysis.
    flag:
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
