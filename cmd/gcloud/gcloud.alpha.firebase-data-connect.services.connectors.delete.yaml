documentation:
    command: |
        *(ALPHA)*  Deletes Firebase Data Connect service connector.
    flag:
        allow-missing: |-
            If true and the Connector is not found, the request will succeed but no
            action will be taken on the server.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        etag: |-
            The etag of the Connector. If this is provided, it must match
            the server's etag.
        force: |-
            If set to true, any child resources (i.e. ConnectorRevisions) will also
            be deleted. Otherwise, the request will only work if the Connector has
            no child resources.
        location: |-
            The location id of the connector resource.
            +
            To set the `location` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-allow-missing: |-
            If true and the Connector is not found, the request will succeed but no
            action will be taken on the server.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-force: |-
            If set to true, any child resources (i.e. ConnectorRevisions) will also
            be deleted. Otherwise, the request will only work if the Connector has
            no child resources.
        no-validate-only: |-
            If set, validate the request and preview the Connector, but do not
            actually delete it.
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server will guarantee
            that for at least 60 minutes after the first request.
            +
            For example, consider a situation where you make an initial request and the
            request times out. If you make the request again with the same request
            ID, the server can check if original operation with the same request ID
            was received, and if so, will ignore the second request. This prevents
            clients from accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        service: |-
            The service id of the connector resource.
            +
            To set the `service` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--service` on the command line.
        validate-only: |-
            If set, validate the request and preview the Connector, but do not
            actually delete it.
