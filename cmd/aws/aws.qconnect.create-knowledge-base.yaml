name: create-knowledge-base
description: Creates a knowledge base.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=: The description.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --knowledge-base-type=!: The type of knowledge base.
    --name=!: The name of the knowledge base.
    --rendering-configuration=: Information about how to render the content.
    --server-side-encryption-configuration=: The configuration information for the customer managed key used for encryption.
    --source-configuration=: The source of the knowledge base content.
    --tags=: The tags used to organize, track, or control access for this resource.
    --vector-ingestion-configuration=: Contains details about how to ingest the documents in a data source.
completion:
    flag:
        knowledge-base-type:
            - EXTERNAL
            - CUSTOM
            - QUICK_RESPONSES
            - MESSAGE_TEMPLATES
            - MANAGED
documentation:
    command: |-
        Creates a knowledge base.

        When using this API, you cannot reuse [Amazon AppIntegrations](https://docs.aws.amazon.com/appintegrations/latest/APIReference/Welcome.html) DataIntegrations with external knowledge bases such as Salesforce and ServiceNow. If you do, you'll get an `InvalidRequestException` error.

        For example, you're programmatically managing your external knowledge base, and you want to add or remove one of the fields that is being ingested from Salesforce. Do the following:

        1. Call [DeleteKnowledgeBase](https://docs.aws.amazon.com/amazon-q-connect/latest/APIReference/API_DeleteKnowledgeBase.html).
        2. Call [DeleteDataIntegration](https://docs.aws.amazon.com/appintegrations/latest/APIReference/API_DeleteDataIntegration.html).
        3. Call [CreateDataIntegration](https://docs.aws.amazon.com/appintegrations/latest/APIReference/API_CreateDataIntegration.html) to recreate the DataIntegration or a create different one.
        4. Call CreateKnowledgeBase.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](http://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        description: The description.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        knowledge-base-type: The type of knowledge base. Only CUSTOM knowledge bases allow you to upload your own content. EXTERNAL knowledge bases support integrations with third-party systems whose content is synchronized automatically.
        name: The name of the knowledge base.
        rendering-configuration: Information about how to render the content.
        server-side-encryption-configuration: |-
            The configuration information for the customer managed key used for encryption.

            This KMS key must have a policy that allows `kms:CreateGrant`, `kms:DescribeKey`, `kms:Decrypt`, and `kms:GenerateDataKey*` permissions to the IAM identity using the key to invoke Amazon Q in Connect.

            For more information about setting up a customer managed key for Amazon Q in Connect, see [Enable Amazon Q in Connect for your instance](https://docs.aws.amazon.com/connect/latest/adminguide/enable-q.html).
        source-configuration: The source of the knowledge base content. Only set this argument for EXTERNAL or Managed knowledge bases.
        tags: The tags used to organize, track, or control access for this resource.
        vector-ingestion-configuration: Contains details about how to ingest the documents in a data source.
