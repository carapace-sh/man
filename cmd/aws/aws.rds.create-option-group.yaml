name: create-option-group
description: Creates a new option group.
flags:
    --engine-name=!: The name of the engine to associate this option group with.
    --major-engine-version=!: Specifies the major version of the engine that this option group should be associated with.
    --option-group-description=!: The description of the option group.
    --option-group-name=!: Specifies the name of the option group to be created.
    --tags=: Tags to assign to the option group.
documentation:
    command: |-
        Creates a new option group. You can create up to 20 option groups.

        This command doesn't apply to RDS Custom.
    flag:
        engine-name: |-
            The name of the engine to associate this option group with.

            Valid Values:

            - `db2-ae`
            - `db2-se`
            - `mariadb`
            - `mysql`
            - `oracle-ee`
            - `oracle-ee-cdb`
            - `oracle-se2`
            - `oracle-se2-cdb`
            - `postgres`
            - `sqlserver-ee`
            - `sqlserver-se`
            - `sqlserver-ex`
            - `sqlserver-web`
        major-engine-version: Specifies the major version of the engine that this option group should be associated with.
        option-group-description: The description of the option group.
        option-group-name: |-
            Specifies the name of the option group to be created.

            Constraints:

            - Must be 1 to 255 letters, numbers, or hyphens
            - First character must be a letter
            - Can't end with a hyphen or contain two consecutive hyphens

            Example: `myoptiongroup`
        tags: Tags to assign to the option group.
