name: reset-service-specific-credential
description: Resets the password for a service-specific credential.
flags:
    --service-specific-credential-id=!: The unique identifier of the service-specific credential.
    --user-name=: The name of the IAM user associated with the service-specific credential.
documentation:
    command: Resets the password for a service-specific credential. The new password is Amazon Web Services generated and cryptographically strong. It cannot be configured by the user. Resetting the password immediately invalidates the previous password associated with this user.
    flag:
        service-specific-credential-id: |-
            The unique identifier of the service-specific credential.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters that can consist of any upper or lowercased letter or digit.
        user-name: |-
            The name of the IAM user associated with the service-specific credential. If this value is not specified, then the operation assumes the user whose credentials are used to call the operation.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
