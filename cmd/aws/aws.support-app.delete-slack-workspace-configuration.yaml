name: delete-slack-workspace-configuration
description: Deletes a Slack workspace configuration from your Amazon Web Services account.
flags:
    --team-id=!: The team ID in Slack.
documentation:
    command: Deletes a Slack workspace configuration from your Amazon Web Services account. This operation doesn't delete your Slack workspace.
    flag:
        team-id: The team ID in Slack. This ID uniquely identifies a Slack workspace, such as `T012ABCDEFG`.
