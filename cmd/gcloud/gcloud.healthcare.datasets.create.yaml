name: create
description: Create a Cloud Healthcare API dataset.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --encryption-key=: KMS encryption key that is used to secure this dataset and its sub-resources.
    --location=: Google Cloud location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --time-zone=: Default timezone used by this dataset.
documentation:
    command: |
        Create a new Cloud Healthcare API dataset
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        encryption-key: |-
            KMS encryption key that is used to secure this dataset and its sub-resources.
            The key used for encryption and the dataset must be in the same location.
            If empty, the default Google encryption key will be used to secure this dataset.
            The format is projects/{projectId}/locations/{locationId}/keyRings/{keyRingId}/cryptoKeys/{keyId}.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `dataset` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        time-zone: Default timezone used by this dataset.
