name: resume-workflow-run
description: Restarts selected nodes of a previous partially completed workflow run and resumes the workflow run.
flags:
    --name=!: The name of the workflow to resume.
    --node-ids=!: A list of the node IDs for the nodes you want to restart.
    --run-id=!: The ID of the workflow run to resume.
documentation:
    command: Restarts selected nodes of a previous partially completed workflow run and resumes the workflow run. The selected nodes and all nodes that are downstream from the selected nodes are run.
    flag:
        name: The name of the workflow to resume.
        node-ids: A list of the node IDs for the nodes you want to restart. The nodes that are to be restarted must have a run attempt in the original run.
        run-id: The ID of the workflow run to resume.
