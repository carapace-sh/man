name: delete-alternate-contact
description: Deletes the specified alternate contact from an Amazon Web Services account.
flags:
    --account-id=: Specifies the 12 digit account ID number of the Amazon Web Services account that you want to access or modify with this operation.
    --alternate-contact-type=!: Specifies which of the alternate contacts to delete.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
completion:
    flag:
        alternate-contact-type:
            - BILLING
            - OPERATIONS
            - SECURITY
documentation:
    command: |-
        Deletes the specified alternate contact from an Amazon Web Services account.

        For complete details about how to use the alternate contact operations, see [Access or updating the alternate contacts](https://docs.aws.amazon.com/accounts/latest/reference/manage-acct-update-contact.html).

        Before you can update the alternate contact information for an Amazon Web Services account that is managed by Organizations, you must first enable integration between Amazon Web Services Account Management and Organizations. For more information, see [Enabling trusted access for Amazon Web Services Account Management](https://docs.aws.amazon.com/accounts/latest/reference/using-orgs-trusted-access.html).
    flag:
        account-id: |-
            Specifies the 12 digit account ID number of the Amazon Web Services account that you want to access or modify with this operation.

            If you do not specify this parameter, it defaults to the Amazon Web Services account of the identity used to call the operation.

            To use this parameter, the caller must be an identity in the [organization's management account](https://docs.aws.amazon.com/organizations/latest/userguide/orgs_getting-started_concepts.html#account) or a delegated administrator account, and the specified account ID must be a member account in the same organization. The organization must have [all features enabled](https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_org_support-all-features.html), and the organization must have [trusted access](https://docs.aws.amazon.com/organizations/latest/userguide/using-orgs-trusted-access.html) enabled for the Account Management service, and optionally a [delegated admin](https://docs.aws.amazon.com/organizations/latest/userguide/using-orgs-delegated-admin.html) account assigned.

            The management account can't specify its own `AccountId`; it must call the operation in standalone context by not including the `AccountId` parameter.

            To call this operation on an account that is not a member of an organization, then don't specify this parameter, and call the operation using an identity belonging to the account whose contacts you wish to retrieve or modify.
        alternate-contact-type: Specifies which of the alternate contacts to delete.
