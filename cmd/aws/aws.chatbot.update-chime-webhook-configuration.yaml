name: update-chime-webhook-configuration
description: Updates a Amazon Chime webhook configuration.
flags:
    --chat-configuration-arn=!: The Amazon Resource Name (ARN) of the ChimeWebhookConfiguration to update.
    --iam-role-arn=: A user-defined role that AWS Chatbot assumes.
    --logging-level=: Logging levels include `ERROR`, `INFO`, or `NONE`.
    --sns-topic-arns=: The ARNs of the SNS topics that deliver notifications to AWS Chatbot.
    --webhook-description=: A description of the webhook.
    --webhook-url=: The URL for the Amazon Chime webhook.
documentation:
    command: Updates a Amazon Chime webhook configuration.
    flag:
        chat-configuration-arn: The Amazon Resource Name (ARN) of the ChimeWebhookConfiguration to update.
        iam-role-arn: |-
            A user-defined role that AWS Chatbot assumes. This is not the service-linked role.

            For more information, see [IAM policies for AWS Chatbot](https://docs.aws.amazon.com/chatbot/latest/adminguide/chatbot-iam-policies.html) in the *AWS Chatbot Administrator Guide*.
        logging-level: Logging levels include `ERROR`, `INFO`, or `NONE`.
        sns-topic-arns: The ARNs of the SNS topics that deliver notifications to AWS Chatbot.
        webhook-description: |-
            A description of the webhook. We recommend using the convention `RoomName/WebhookName`.

            For more information, see [Tutorial: Get started with Amazon Chime](https://docs.aws.amazon.com/chatbot/latest/adminguide/chime-setup.html) in the *AWS Chatbot Administrator Guide*.
        webhook-url: The URL for the Amazon Chime webhook.
