name: create-domain
description: Creates a `Domain`.
flags:
    --app-network-access-type=: Specifies the VPC used for non-EFS traffic.
    --app-security-group-management=: The entity that creates and manages the required security groups for inter-app communication in `VPCOnly` mode.
    --auth-mode=!: The mode of authentication that members use to access the domain.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-space-settings=: The default settings for shared spaces that users create in the domain.
    --default-user-settings=!: The default settings to use to create a user profile when `UserSettings` isn't specified in the call to the `CreateUserProfile` API.
    --domain-name=!: A name for the domain.
    --domain-settings=: A collection of `Domain` settings.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --home-efs-file-system-kms-key-id=: Use `KmsKeyId`.
    --kms-key-id=: SageMaker AI uses Amazon Web Services KMS to encrypt EFS and EBS volumes attached to the domain with an Amazon Web Services managed key by default.
    --subnet-ids=:
        description: The VPC subnets that the domain uses for communication.
        nargs: -1
    --tag-propagation=: Indicates whether custom tag propagation is supported for the domain.
    --tags=:
        description: Tags to associated with the Domain.
        nargs: -1
    --vpc-id=: The ID of the Amazon Virtual Private Cloud (VPC) that the domain uses for communication.
completion:
    flag:
        app-network-access-type:
            - PublicInternetOnly
            - VpcOnly
        app-security-group-management:
            - Service
            - Customer
        auth-mode:
            - SSO
            - IAM
        tag-propagation:
            - ENABLED
            - DISABLED
documentation:
    command: "Creates a `Domain`. A domain consists of an associated Amazon Elastic File System volume, a list of authorized users, and a variety of security, application, policy, and Amazon Virtual Private Cloud (VPC) configurations. Users within a domain can share notebook files and other artifacts with each other.\n\n**EFS storage**\n\nWhen a domain is created, an EFS volume is created for use by all of the users within the domain. Each user receives a private home directory within the EFS volume for notebooks, Git repositories, and data files.\n\nSageMaker AI uses the Amazon Web Services Key Management Service (Amazon Web Services KMS) to encrypt the EFS volume attached to the domain with an Amazon Web Services managed key by default. For more control, you can specify a customer managed key. For more information, see [Protect Data at Rest Using Encryption](https://docs.aws.amazon.com/sagemaker/latest/dg/encryption-at-rest.html).\n\n**VPC configuration**\n\nAll traffic between the domain and the Amazon EFS volume is through the specified VPC and subnets. For other traffic, you can specify the `AppNetworkAccessType` parameter. `AppNetworkAccessType` corresponds to the network access type that you choose when you onboard to the domain. The following options are available:\n\n- `PublicInternetOnly` - Non-EFS traffic goes through a VPC managed by Amazon SageMaker AI, which allows internet access. This is the default value.\n- `VpcOnly` - All traffic is through the specified VPC and subnets. Internet access is disabled by default. To allow internet access, you must specify a NAT gateway.\n  \n  When internet access is disabled, you won't be able to run a Amazon SageMaker AI Studio notebook or to train or host models unless your VPC has an interface endpoint to the SageMaker AI API and runtime or a NAT gateway and your security groups allow outbound connections.\n\nNFS traffic over TCP on port 2049 needs to be allowed in both inbound and outbound rules in order to launch a Amazon SageMaker AI Studio app successfully.\n\nFor more information, see [Connect Amazon SageMaker AI Studio Notebooks to Resources in a VPC](https://docs.aws.amazon.com/sagemaker/latest/dg/studio-notebooks-and-internet-access.html)."
    flag:
        app-network-access-type: |-
            Specifies the VPC used for non-EFS traffic. The default value is `PublicInternetOnly`.

            - `PublicInternetOnly` - Non-EFS traffic is through a VPC managed by Amazon SageMaker AI, which allows direct internet access
            - `VpcOnly` - All traffic is through the specified VPC and subnets
        app-security-group-management: The entity that creates and manages the required security groups for inter-app communication in `VPCOnly` mode. Required when `CreateDomain.AppNetworkAccessType` is `VPCOnly` and `DomainSettings.RStudioServerProDomainSettings.DomainExecutionRoleArn` is provided. If setting up the domain for use with RStudio, this value must be set to `Service`.
        auth-mode: The mode of authentication that members use to access the domain.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-space-settings: The default settings for shared spaces that users create in the domain.
        default-user-settings: |-
            The default settings to use to create a user profile when `UserSettings` isn't specified in the call to the `CreateUserProfile` API.

            `SecurityGroups` is aggregated when specified in both calls. For all other settings in `UserSettings`, the values specified in `CreateUserProfile` take precedence over those specified in `CreateDomain`.
        domain-name: A name for the domain.
        domain-settings: A collection of `Domain` settings.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        home-efs-file-system-kms-key-id: Use `KmsKeyId`.
        kms-key-id: SageMaker AI uses Amazon Web Services KMS to encrypt EFS and EBS volumes attached to the domain with an Amazon Web Services managed key by default. For more control, specify a customer managed key.
        subnet-ids: |-
            The VPC subnets that the domain uses for communication.

            The field is optional when the `AppNetworkAccessType` parameter is set to `PublicInternetOnly` for domains created from Amazon SageMaker Unified Studio.
        tag-propagation: Indicates whether custom tag propagation is supported for the domain. Defaults to `DISABLED`.
        tags: |-
            Tags to associated with the Domain. Each tag consists of a key and an optional value. Tag keys must be unique per resource. Tags are searchable using the `Search` API.

            Tags that you specify for the Domain are also added to all Apps that the Domain launches.
        vpc-id: |-
            The ID of the Amazon Virtual Private Cloud (VPC) that the domain uses for communication.

            The field is optional when the `AppNetworkAccessType` parameter is set to `PublicInternetOnly` for domains created from Amazon SageMaker Unified Studio.
