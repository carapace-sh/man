name: describe
description: Describe a Cloud Security Command Center (SCC) posture template.
flags:
    --location=: ID of the location where the resource exists (for example, global).
    --organization=: ID of the organization which is the parent of the resource.
    --revision-id=: ID of the specific posture template revision to be described.
documentation:
    command: |
        Describe a Cloud Security Command Center (SCC) posture template.

        By default, the latest created revision of the posture template is described. Users must provide revision ID to describe a specific revision.
    flag:
        location: |-
            ID of the location where the resource exists (for example, global).
            +

            To set the `location` attribute:
            * provide the argument `posture_template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        organization: |-
            ID of the organization which is the parent of the resource.
            +

            To set the `organization` attribute:
            * provide the argument `posture_template` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        revision-id: ID of the specific posture template revision to be described. If not specified, latest revision is described.
