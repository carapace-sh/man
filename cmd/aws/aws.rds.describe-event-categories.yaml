name: describe-event-categories
description: Displays a list of categories for all event source types, or, if specified, for a specified source type.
flags:
    --filters=: This parameter isn't currently supported.
    --source-type=: The type of source that is generating the events.
documentation:
    command: Displays a list of categories for all event source types, or, if specified, for a specified source type. You can also see this list in the "Amazon RDS event categories and event messages" section of the [*Amazon RDS User Guide*](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Events.Messages.html) or the [*Amazon Aurora User Guide*](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_Events.Messages.html) .
    flag:
        filters: This parameter isn't currently supported.
        source-type: |-
            The type of source that is generating the events. For RDS Proxy events, specify `db-proxy`.

            Valid Values: `db-instance` | `db-cluster` | `db-parameter-group` | `db-security-group` | `db-snapshot` | `db-cluster-snapshot` | `db-proxy`
