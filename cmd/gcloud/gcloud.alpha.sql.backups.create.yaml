name: create
description: '*(ALPHA)*  Creates a backup of a Cloud SQL instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: A friendly description of the backup.
    --instance=!: Cloud SQL instance ID.
    --location=: Choose where to store your backup.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-project-level&: If true, then invoke project level backup endpoint.
    --project-level&: If true, then invoke project level backup endpoint.
documentation:
    command: '*(ALPHA)*  Creates a backup of a Cloud SQL instance.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: A friendly description of the backup.
        instance: Cloud SQL instance ID.
        location: Choose where to store your backup. Backups are stored in the closest multi-region location to you by default. Only customize if needed.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-project-level: If true, then invoke project level backup endpoint. Use 'Name' as the value for backup ID. You can find the 'Name' by running $ gcloud sql backups list.
        project-level: If true, then invoke project level backup endpoint. Use 'Name' as the value for backup ID. You can find the 'Name' by running $ gcloud sql backups list.
