name: list-tags-for-resource
description: Lists all tags for a top-level EFS resource.
flags:
    --max-results=: (Optional) Specifies the maximum number of tag objects to return in the response.
    --next-token=: (Optional) You can use `NextToken` in a subsequent request to fetch the next page of access point descriptions if the response payload was paginated.
    --resource-id=!: Specifies the EFS resource you want to retrieve tags for.
documentation:
    command: |-
        Lists all tags for a top-level EFS resource. You must provide the ID of the resource that you want to retrieve the tags for.

        This operation requires permissions for the `elasticfilesystem:DescribeAccessPoints` action.
    flag:
        max-results: (Optional) Specifies the maximum number of tag objects to return in the response. The default value is 100.
        next-token: (Optional) You can use `NextToken` in a subsequent request to fetch the next page of access point descriptions if the response payload was paginated.
        resource-id: Specifies the EFS resource you want to retrieve tags for. You can retrieve tags for EFS file systems and access points using this API endpoint.
