name: create-firewall
description: Creates an Network Firewall [Firewall]() and accompanying [FirewallStatus]() for a VPC.
flags:
    --availability-zone-change-protection: Optional.
    --availability-zone-mappings=:
        description: Required.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --delete-protection: A flag indicating whether it is possible to delete the firewall.
    --description=: A description of the firewall.
    --enabled-analysis-types=:
        description: An optional setting indicating the specific traffic analysis types to enable on the firewall.
        nargs: -1
    --encryption-configuration=: A complex type that contains settings for encryption of your firewall resources.
    --firewall-name=!: The descriptive name of the firewall.
    --firewall-policy-arn=!: The Amazon Resource Name (ARN) of the [FirewallPolicy]() that you want to use for the firewall.
    --firewall-policy-change-protection: A setting indicating whether the firewall is protected against a change to the firewall policy association.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-availability-zone-change-protection: Optional.
    --no-delete-protection: A flag indicating whether it is possible to delete the firewall.
    --no-firewall-policy-change-protection: A setting indicating whether the firewall is protected against a change to the firewall policy association.
    --no-subnet-change-protection: A setting indicating whether the firewall is protected against changes to the subnet associations.
    --subnet-change-protection: A setting indicating whether the firewall is protected against changes to the subnet associations.
    --subnet-mappings=:
        description: The public subnets to use for your Network Firewall firewalls.
        nargs: -1
    --tags=:
        description: The key:value pairs to associate with the resource.
        nargs: -1
    --transit-gateway-id=: Required when creating a transit gateway-attached firewall.
    --vpc-id=: The unique identifier of the VPC where Network Firewall should create the firewall.
documentation:
    command: |-
        Creates an Network Firewall [Firewall]() and accompanying [FirewallStatus]() for a VPC.

        The firewall defines the configuration settings for an Network Firewall firewall. The settings that you can define at creation include the firewall policy, the subnets in your VPC to use for the firewall endpoints, and any tags that are attached to the firewall Amazon Web Services resource.

        After you create a firewall, you can provide additional settings, like the logging configuration.

        To update the settings for a firewall, you use the operations that apply to the settings themselves, for example [UpdateLoggingConfiguration](), [AssociateSubnets](), and [UpdateFirewallDeleteProtection]().

        To manage a firewall's tags, use the standard Amazon Web Services resource tagging operations, [ListTagsForResource](), [TagResource](), and [UntagResource]().

        To retrieve information about firewalls, use [ListFirewalls]() and [DescribeFirewall]().

        To generate a report on the last 30 days of traffic monitored by a firewall, use [StartAnalysisReport]().
    flag:
        availability-zone-change-protection: |-
            Optional. A setting indicating whether the firewall is protected against changes to its Availability Zone configuration. When set to `TRUE`, you cannot add or remove Availability Zones without first disabling this protection using [UpdateAvailabilityZoneChangeProtection]().

            Default value: `FALSE`
        availability-zone-mappings: |-
            Required. The Availability Zones where you want to create firewall endpoints for a transit gateway-attached firewall. You must specify at least one Availability Zone. Consider enabling the firewall in every Availability Zone where you have workloads to maintain Availability Zone isolation.

            You can modify Availability Zones later using [AssociateAvailabilityZones]() or [DisassociateAvailabilityZones](), but this may briefly disrupt traffic. The `AvailabilityZoneChangeProtection` setting controls whether you can make these modifications.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        delete-protection: A flag indicating whether it is possible to delete the firewall. A setting of `TRUE` indicates that the firewall is protected against deletion. Use this setting to protect against accidentally deleting a firewall that is in use. When you create a firewall, the operation initializes this flag to `TRUE`.
        description: A description of the firewall.
        enabled-analysis-types: An optional setting indicating the specific traffic analysis types to enable on the firewall.
        encryption-configuration: A complex type that contains settings for encryption of your firewall resources.
        firewall-name: The descriptive name of the firewall. You can't change the name of a firewall after you create it.
        firewall-policy-arn: The Amazon Resource Name (ARN) of the [FirewallPolicy]() that you want to use for the firewall.
        firewall-policy-change-protection: A setting indicating whether the firewall is protected against a change to the firewall policy association. Use this setting to protect against accidentally modifying the firewall policy for a firewall that is in use. When you create a firewall, the operation initializes this setting to `TRUE`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        subnet-change-protection: A setting indicating whether the firewall is protected against changes to the subnet associations. Use this setting to protect against accidentally modifying the subnet associations for a firewall that is in use. When you create a firewall, the operation initializes this setting to `TRUE`.
        subnet-mappings: The public subnets to use for your Network Firewall firewalls. Each subnet must belong to a different Availability Zone in the VPC. Network Firewall creates a firewall endpoint in each subnet.
        tags: The key:value pairs to associate with the resource.
        transit-gateway-id: |-
            Required when creating a transit gateway-attached firewall. The unique identifier of the transit gateway to attach to this firewall. You can provide either a transit gateway from your account or one that has been shared with you through Resource Access Manager.

            After creating the firewall, you cannot change the transit gateway association. To use a different transit gateway, you must create a new firewall.

            For information about creating firewalls, see [CreateFirewall](). For specific guidance about transit gateway-attached firewalls, see [Considerations for transit gateway-attached firewalls](https://docs.aws.amazon.com/network-firewall/latest/developerguide/tgw-firewall-considerations.html) in the *Network Firewall Developer Guide*.
        vpc-id: |-
            The unique identifier of the VPC where Network Firewall should create the firewall.

            You can't change this setting after you create the firewall.
