name: create-content-association
description: Creates an association between a content resource in a knowledge base and [step-by-step guides](https://docs.aws.amazon.com/connect/latest/adminguide/step-by-step-guided-experiences.html). Step-by-step guides offer instructions to agents for resolving common customer issues.
flags:
    --association-type=!: The type of association.
    --association=!: The identifier of the associated resource.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --content-id=!: The identifier of the content.
    --knowledge-base-id=!: The identifier of the knowledge base.
    --tags=: The tags used to organize, track, or control access for this resource.
completion:
    flag:
        association-type:
            - AMAZON_CONNECT_GUIDE
documentation:
    command: |-
        Creates an association between a content resource in a knowledge base and [step-by-step guides](https://docs.aws.amazon.com/connect/latest/adminguide/step-by-step-guided-experiences.html). Step-by-step guides offer instructions to agents for resolving common customer issues. You create a content association to integrate Amazon Q in Connect and step-by-step guides.

        After you integrate Amazon Q and step-by-step guides, when Amazon Q provides a recommendation to an agent based on the intent that it's detected, it also provides them with the option to start the step-by-step guide that you have associated with the content.

        Note the following limitations:

        - You can create only one content association for each content resource in a knowledge base.
        - You can associate a step-by-step guide with multiple content resources.

        For more information, see [Integrate Amazon Q in Connect with step-by-step guides](https://docs.aws.amazon.com/connect/latest/adminguide/integrate-q-with-guides.html) in the *Amazon Connect Administrator Guide*.
    flag:
        association: The identifier of the associated resource.
        association-type: The type of association.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](http://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        content-id: The identifier of the content.
        knowledge-base-id: The identifier of the knowledge base.
        tags: The tags used to organize, track, or control access for this resource.
