name: delete-serverless-cache
description: Deletes a specified existing serverless cache.
flags:
    --final-snapshot-name=: Name of the final snapshot to be taken before the serverless cache is deleted.
    --serverless-cache-name=!: The identifier of the serverless cache to be deleted.
documentation:
    command: |-
        Deletes a specified existing serverless cache.

        `CreateServerlessCacheSnapshot` permission is required to create a final snapshot. Without this permission, the API call will fail with an `Access Denied` exception.
    flag:
        final-snapshot-name: 'Name of the final snapshot to be taken before the serverless cache is deleted. Available for Valkey, Redis OSS and Serverless Memcached only. Default: NULL, i.e. a final snapshot is not taken.'
        serverless-cache-name: The identifier of the serverless cache to be deleted.
