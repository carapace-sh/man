name: update-inference-experiment
description: Updates an inference experiment that you created.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-storage-config=: The Amazon S3 location and configuration for storing inference request and response data.
    --description=: The description of the inference experiment.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --model-variants=:
        description: An array of `ModelVariantConfig` objects.
        nargs: -1
    --name=!: The name of the inference experiment to be updated.
    --schedule=: The duration for which the inference experiment will run.
    --shadow-mode-config=: The configuration of `ShadowMode` inference experiment type.
documentation:
    command: Updates an inference experiment that you created. The status of the inference experiment has to be either `Created`, `Running`. For more information on the status of an inference experiment, see [DescribeInferenceExperiment](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_DescribeInferenceExperiment.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-storage-config: The Amazon S3 location and configuration for storing inference request and response data.
        description: The description of the inference experiment.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        model-variants: An array of `ModelVariantConfig` objects. There is one for each variant, whose infrastructure configuration you want to update.
        name: The name of the inference experiment to be updated.
        schedule: The duration for which the inference experiment will run. If the status of the inference experiment is `Created`, then you can update both the start and end dates. If the status of the inference experiment is `Running`, then you can update only the end date.
        shadow-mode-config: The configuration of `ShadowMode` inference experiment type. Use this field to specify a production variant which takes all the inference requests, and a shadow variant to which Amazon SageMaker replicates a percentage of the inference requests. For the shadow variant also specify the percentage of requests that Amazon SageMaker replicates.
