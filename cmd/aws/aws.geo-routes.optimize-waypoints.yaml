name: optimize-waypoints
description: '`OptimizeWaypoints` calculates the optimal order to travel between a set of waypoints to minimize either the travel time or the distance travelled during the journey, based on road network restrictions and the traffic pattern data.'
flags:
    --avoid=: Features that are avoided.
    --clustering=: Clustering allows you to specify how nearby waypoints can be clustered to improve the optimized sequence.
    --departure-time=: Departure time from the waypoint.
    --destination-options=: Destination related options.
    --destination=: 'The final position for the route in the World Geodetic System (WGS 84) format: `[longitude, latitude]`.'
    --driver=: Driver related options.
    --exclude=: Features to be strictly excluded while calculating the route.
    --key=: 'Optional: The API key to be used for authorization.'
    --optimize-sequencing-for=: Specifies the optimization criteria for the calculated sequence.
    --origin-options=: Origin related options.
    --origin=!: The start position for the route.
    --traffic=: Traffic-related options.
    --travel-mode-options=: Travel mode related options for the provided travel mode.
    --travel-mode=: Specifies the mode of transport when calculating a route.
    --waypoints=: List of waypoints between the `Origin` and `Destination`.
completion:
    flag:
        optimize-sequencing-for:
            - FastestRoute
            - ShortestRoute
        travel-mode:
            - Car
            - Pedestrian
            - Scooter
            - Truck
documentation:
    command: '`OptimizeWaypoints` calculates the optimal order to travel between a set of waypoints to minimize either the travel time or the distance travelled during the journey, based on road network restrictions and the traffic pattern data.'
    flag:
        avoid: Features that are avoided. Avoidance is on a best-case basis. If an avoidance can't be satisfied for a particular case, this setting is ignored.
        clustering: Clustering allows you to specify how nearby waypoints can be clustered to improve the optimized sequence.
        departure-time: |-
            Departure time from the waypoint.

            Time format:`YYYY-MM-DDThh:mm:ss.sssZ | YYYY-MM-DDThh:mm:ss.sss+hh:mm`

            Examples:

            `2020-04-22T17:57:24Z`

            `2020-04-22T17:57:24+02:00`
        destination: 'The final position for the route in the World Geodetic System (WGS 84) format: `[longitude, latitude]`.'
        destination-options: Destination related options.
        driver: Driver related options.
        exclude: Features to be strictly excluded while calculating the route.
        key: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must be provided when making a request.'
        optimize-sequencing-for: |-
            Specifies the optimization criteria for the calculated sequence.

            Default Value: `FastestRoute`.
        origin: The start position for the route.
        origin-options: Origin related options.
        traffic: Traffic-related options.
        travel-mode: |-
            Specifies the mode of transport when calculating a route. Used in estimating the speed of travel and road compatibility.

            Default Value: `Car`
        travel-mode-options: Travel mode related options for the provided travel mode.
        waypoints: List of waypoints between the `Origin` and `Destination`.
