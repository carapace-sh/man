name: create
description: '*(BETA)*  Creates a Compute Engine firewall policy rule.'
flags:
    --action=!: Action to take if the request matches the match condition.
    --description=: An optional, textual description for the rule.
    --dest-address-groups=: Destination address groups to match for this rule.
    --dest-fqdns=: Destination FQDNs to match for this rule.
    --dest-ip-ranges=: Destination IP ranges to match for this rule.
    --dest-network-scope=&: Deprecated.
    --dest-network-type=: Use this flag to indicate that the rule should match internet or non-internet traffic.
    --dest-region-codes=: Destination Region Code to match for this rule.
    --dest-threat-intelligence=: Destination Threat Intelligence lists to match for this rule.
    --direction=: Direction of the traffic the rule is applied.
    --disabled: Use this flag to disable the rule.
    --enable-logging: Use this flag to enable logging of connections that allowed or denied by this rule.
    --firewall-policy=!: Short name of the firewall policy into which the rule should be inserted.
    --layer4-configs=!: A list of destination protocols and ports to which the firewall rule will apply.
    --no-disabled&: Use this flag to disable the rule.
    --no-enable-logging&: Use this flag to enable logging of connections that allowed or denied by this rule.
    --no-tls-inspect&: Use this flag to indicate whether TLS traffic should be inspected using the TLS inspection policy when the security profile group is applied.
    --organization=: Organization which the organization firewall policy belongs to.
    --security-profile-group=: An org-based security profile group to be used with apply_security_profile_group action.
    --src-address-groups=: Source address groups to match for this rule.
    --src-fqdns=: Source FQDNs to match for this rule.
    --src-ip-ranges=: Source IP ranges to match for this rule.
    --src-network-scope=&: Deprecated.
    --src-network-type=: Use this flag to indicate that the rule should match internet, non-internet traffic or traffic coming from the network specified by --src-network.
    --src-networks=: The source VPC networks to  match for this rule.
    --src-region-codes=: Source Region Code to match for this rule.
    --src-secure-tags=: A list of instance secure tags indicating the set of instances on the network to which the rule applies if all other fields match.
    --src-threat-intelligence=: Source Threat Intelligence lists to match for this rule.
    --target-resources=: List of URLs of target resources to which the rule is applied.
    --target-secure-tags=: An optional, list of target secure tags with a name of the format tagValues/ or full namespaced name
    --target-service-accounts=: List of target service accounts for the rule.
    --tls-inspect: Use this flag to indicate whether TLS traffic should be inspected using the TLS inspection policy when the security profile group is applied.
completion:
    flag:
        action:
            - allow
            - deny
            - goto_next
            - apply_security_profile_group
        direction:
            - INGRESS
            - EGRESS
documentation:
    command: '*(BETA)*  *gcloud beta compute firewall-policies rules create* is used to create organization firewall policy rules.'
    flag:
        action: 'Action to take if the request matches the match condition. _ACTION_ must be one of: *allow*, *deny*, *goto_next*, *apply_security_profile_group*.'
        description: An optional, textual description for the rule.
        dest-address-groups: Destination address groups to match for this rule. Can only be specified if DIRECTION is egress.
        dest-fqdns: Destination FQDNs to match for this rule. Can only be specified if DIRECTION is `egress`.
        dest-ip-ranges: Destination IP ranges to match for this rule.
        dest-network-scope: Deprecated. Use --dest-network-type instead. Use this flag to indicate that the rule should match internet or non-internet traffic. It applies to destination traffic for egress rules. Valid values are INTERNET and NON_INTERNET. Use empty string to clear the field.
        dest-network-type: Use this flag to indicate that the rule should match internet or non-internet traffic. It applies to destination traffic for egress rules. Valid values are INTERNET and NON_INTERNET. Use empty string to clear the field.
        dest-region-codes: Destination Region Code to match for this rule. Can only be specified if DIRECTION is `egress`. Cannot be specified when the source network type is NON_INTERNET.
        dest-threat-intelligence: 'Destination Threat Intelligence lists to match for this rule. Can only be specified if DIRECTION is `egress`. Cannot be specified when source network type is NON_INTERNET. The available lists can be found here: https://cloud.google.com/vpc/docs/firewall-policies-rule-details#threat-intelligence-fw-policy.'
        direction: 'Direction of the traffic the rule is applied. The default is to apply on incoming traffic. _DIRECTION_ must be one of: *INGRESS*, *EGRESS*.'
        disabled: Use this flag to disable the rule. Disabled rules will not affect traffic. Use *--disabled* to enable and *--no-disabled* to disable.
        enable-logging: Use this flag to enable logging of connections that allowed or denied by this rule. Use *--enable-logging* to enable and *--no-enable-logging* to disable.
        firewall-policy: Short name of the firewall policy into which the rule should be inserted.
        layer4-configs: A list of destination protocols and ports to which the firewall rule will apply.
        no-disabled: Use this flag to disable the rule. Disabled rules will not affect traffic.
        no-enable-logging: Use this flag to enable logging of connections that allowed or denied by this rule.
        no-tls-inspect: 'Use this flag to indicate whether TLS traffic should be inspected using the TLS inspection policy when the security profile group is applied. Default: no TLS inspection.'
        organization: Organization which the organization firewall policy belongs to. Must be set if FIREWALL_POLICY is short name.
        security-profile-group: 'An org-based security profile group to be used with apply_security_profile_group action. Allowed formats are: a) http(s)://<namespace>/<api>/organizations/<org_id>/locations/global/securityProfileGroups/<profile> b) (//)<namespace>/organizations/<org_id>/locations/global/securityProfileGroups/<profile> c) <profile>. In case "c" `gcloud` CLI will create a reference matching format "a", but to make it work CLOUDSDK_API_ENDPOINT_OVERRIDES_NETWORKSECURITY property must be set. In order to set this property, please run the command `gcloud config set api_endpoint_overrides/networksecurity https://<namespace>/`.'
        src-address-groups: Source address groups to match for this rule. Can only be specified if DIRECTION is ingress.
        src-fqdns: Source FQDNs to match for this rule. Can only be specified if DIRECTION is `ingress`.
        src-ip-ranges: Source IP ranges to match for this rule.
        src-network-scope: Deprecated. Use --src-network-type instead. Use this flag to indicate that the rule should match internet, non-internet traffic or traffic coming from the network specified by --src-network. It applies to ingress rules. Valid values are INTERNET, NON_INTERNET, VPC_NETWORKS and INTRA_VPC. Use empty string to clear the field.
        src-network-type: Use this flag to indicate that the rule should match internet, non-internet traffic or traffic coming from the network specified by --src-network. It applies to ingress rules. Valid values are INTERNET, NON_INTERNET, VPC_NETWORKS and INTRA_VPC. Use empty string to clear the field.
        src-networks: The source VPC networks to  match for this rule.  It can only be specified when --src-network-type is VPC_NETWORKS. It applies to  ingress rules. It accepts full or partial URLs.
        src-region-codes: Source Region Code to match for this rule. Can only be specified if DIRECTION is `ingress`. Cannot be specified when the source network type is NON_INTERNET, VPC_NETWORK or INTRA_VPC.
        src-secure-tags: A list of instance secure tags indicating the set of instances on the network to which the rule applies if all other fields match. Either --src-ip-ranges or --src-secure-tags must be specified for ingress traffic. If both --src-ip-ranges and --src-secure-tags are specified, an inbound connection is allowed if either the range of the source matches --src-ip-ranges or the tag of the source matches --src-secure-tags. Secure Tags can be assigned to instances during instance creation.
        src-threat-intelligence: 'Source Threat Intelligence lists to match for this rule. Can only be specified if DIRECTION is `ingress`. Cannot be specified when the source network type is NON_INTERNET, VPC_NETWORK or INTRA_VPC. The available lists can be found here: https://cloud.google.com/vpc/docs/firewall-policies-rule-details#threat-intelligence-fw-policy.'
        target-resources: List of URLs of target resources to which the rule is applied.
        target-secure-tags: An optional, list of target secure tags with a name of the format tagValues/ or full namespaced name
        target-service-accounts: List of target service accounts for the rule.
        tls-inspect: 'Use this flag to indicate whether TLS traffic should be inspected using the TLS inspection policy when the security profile group is applied. Default: no TLS inspection. Use *--tls-inspect* to enable and *--no-tls-inspect* to disable.'
