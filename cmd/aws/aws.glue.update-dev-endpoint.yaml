name: update-dev-endpoint
description: Updates a specified development endpoint.
flags:
    --add-arguments=: The map of arguments to add the map of arguments used to configure the `DevEndpoint`.
    --add-public-keys=:
        description: The list of public keys for the `DevEndpoint` to use.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --custom-libraries=: Custom Python or Java libraries to be loaded in the `DevEndpoint`.
    --delete-arguments=:
        description: The list of argument keys to be deleted from the map of arguments used to configure the `DevEndpoint`.
        nargs: -1
    --delete-public-keys=:
        description: The list of public keys to be deleted from the `DevEndpoint`.
        nargs: -1
    --endpoint-name=!: The name of the `DevEndpoint` to be updated.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-update-etl-libraries: '`True` if the list of custom libraries to be loaded in the development endpoint needs to be updated, or `False` if otherwise.'
    --public-key=: The public key for the `DevEndpoint` to use.
    --update-etl-libraries: '`True` if the list of custom libraries to be loaded in the development endpoint needs to be updated, or `False` if otherwise.'
documentation:
    command: Updates a specified development endpoint.
    flag:
        add-arguments: |-
            The map of arguments to add the map of arguments used to configure the `DevEndpoint`.

            Valid arguments are:

            - `"--enable-glue-datacatalog": ""`

            You can specify a version of Python support for development endpoints by using the `Arguments` parameter in the `CreateDevEndpoint` or `UpdateDevEndpoint` APIs. If no arguments are provided, the version defaults to Python 2.
        add-public-keys: The list of public keys for the `DevEndpoint` to use.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        custom-libraries: Custom Python or Java libraries to be loaded in the `DevEndpoint`.
        delete-arguments: The list of argument keys to be deleted from the map of arguments used to configure the `DevEndpoint`.
        delete-public-keys: The list of public keys to be deleted from the `DevEndpoint`.
        endpoint-name: The name of the `DevEndpoint` to be updated.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        public-key: The public key for the `DevEndpoint` to use.
        update-etl-libraries: '`True` if the list of custom libraries to be loaded in the development endpoint needs to be updated, or `False` if otherwise.'
