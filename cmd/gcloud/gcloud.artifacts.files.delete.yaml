name: delete
description: Delete an Artifact Registry file.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location of the file.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --repository=: The repository associated with the file.
documentation:
    command: |
        Delete an Artifact Registry file.

        This command can fail for the following reasons:
          * The specified file does not exist.
          * The active account does not have permission to delete files.
          * The repository is not a Generic repository.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Location of the file. Overrides the default artifacts/location property value
            for this command invocation. To configure the default location, use the command:
            gcloud config set artifacts/location.
            +

            To set the `location` attribute:
            * provide the argument `file` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        repository: |-
            The repository associated with the file. Overrides the default artifacts/repository property value
            for this command invocation. To configure the default repository, use the command:
            gcloud config set artifacts/repository.
            +

            To set the `repository` attribute:
            * provide the argument `file` on the command line with a fully specified name;
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
