name: update-direct-connect-gateway-association
description: Updates the specified attributes of the Direct Connect gateway association.
flags:
    --add-allowed-prefixes-to-direct-connect-gateway=:
        description: The Amazon VPC prefixes to advertise to the Direct Connect gateway.
        nargs: -1
    --association-id=: The ID of the Direct Connect gateway association.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --remove-allowed-prefixes-to-direct-connect-gateway=:
        description: The Amazon VPC prefixes to no longer advertise to the Direct Connect gateway.
        nargs: -1
documentation:
    command: |-
        Updates the specified attributes of the Direct Connect gateway association.

        Add or remove prefixes from the association.
    flag:
        add-allowed-prefixes-to-direct-connect-gateway: The Amazon VPC prefixes to advertise to the Direct Connect gateway.
        association-id: The ID of the Direct Connect gateway association.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        remove-allowed-prefixes-to-direct-connect-gateway: The Amazon VPC prefixes to no longer advertise to the Direct Connect gateway.
