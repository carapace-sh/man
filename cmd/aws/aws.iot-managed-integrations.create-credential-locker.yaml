name: create-credential-locker
description: Create a credential locker.
flags:
    --client-token=: An idempotency token.
    --name=: The name of the credential locker.
    --tags=: A set of key/value pairs that are used to manage the credential locker.
documentation:
    command: |-
        Create a credential locker.

        This operation will not trigger the creation of all the manufacturing resources.
    flag:
        client-token: An idempotency token. If you retry a request that completed successfully initially using the same client token and parameters, then the retry attempt will succeed without performing any further actions.
        name: The name of the credential locker.
        tags: A set of key/value pairs that are used to manage the credential locker.
