name: start-import
description: Starts a job to import a resource to Amazon Lex.
flags:
    --merge-strategy=!: Specifies the action that the `StartImport` operation should take when there is an existing resource with the same name.
    --payload=!: A zip archive in binary format.
    --resource-type=!: Specifies the type of resource to export.
    --tags=: A list of tags to add to the imported bot.
completion:
    flag:
        merge-strategy:
            - OVERWRITE_LATEST
            - FAIL_ON_CONFLICT
        resource-type:
            - BOT
            - INTENT
            - SLOT_TYPE
documentation:
    command: Starts a job to import a resource to Amazon Lex.
    flag:
        merge-strategy: "Specifies the action that the `StartImport` operation should take when there is an existing resource with the same name.\n\n- FAIL\\_ON\\_CONFLICT - The import operation is stopped on the first conflict between a resource in the import file and an existing resource. The name of the resource causing the conflict is in the `failureReason` field of the response to the `GetImport` operation.\n  \n  OVERWRITE\\_LATEST - The import operation proceeds even if there is a conflict with an existing resource. The $LASTEST version of the existing resource is overwritten with the data from the import file."
        payload: A zip archive in binary format. The archive should contain one file, a JSON file containing the resource to import. The resource should match the type specified in the `resourceType` field.
        resource-type: |-
            Specifies the type of resource to export. Each resource also exports any resources that it depends on.

            - A bot exports dependent intents.
            - An intent exports dependent slot types.
        tags: A list of tags to add to the imported bot. You can only add tags when you import a bot, you can't add tags to an intent or slot type.
