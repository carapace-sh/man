name: untag-resource
description: Deletes the specified set of tag keys and their values from the specified Amazon Lightsail resource.
flags:
    --resource-arn=: The Amazon Resource Name (ARN) of the resource from which you want to remove a tag.
    --resource-name=!: The name of the resource from which you are removing a tag.
    --tag-keys=!: The tag keys to delete from the specified resource.
documentation:
    command: |-
        Deletes the specified set of tag keys and their values from the specified Amazon Lightsail resource.

        The `untag resource` operation supports tag-based access control via request tags and resource tags applied to the resource identified by `resource name`. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource from which you want to remove a tag.
        resource-name: The name of the resource from which you are removing a tag.
        tag-keys: The tag keys to delete from the specified resource.
