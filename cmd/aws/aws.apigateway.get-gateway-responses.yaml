name: get-gateway-responses
description: Gets the GatewayResponses collection on the given RestApi.
flags:
    --limit=: The maximum number of returned results per page.
    --position=: The current pagination position in the paged result set.
    --rest-api-id=!: The string identifier of the associated RestApi.
documentation:
    command: Gets the GatewayResponses collection on the given RestApi. If an API developer has not added any definitions for gateway responses, the result will be the API Gateway-generated default GatewayResponses collection for the supported response types.
    flag:
        limit: The maximum number of returned results per page. The default value is 25 and the maximum value is 500. The GatewayResponses collection does not support pagination and the limit does not apply here.
        position: The current pagination position in the paged result set. The GatewayResponse collection does not support pagination and the position does not apply here.
        rest-api-id: The string identifier of the associated RestApi.
