name: add
description: '*(BETA)*  Add an SSH public key to an OS Login profile.'
flags:
    --key-file=: The path to a file containing an SSH public key to add to the
    --key=: The SSH public key to add to the OS Login Profile.
    --ttl=: The amount of time before the SSH key expires.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute os-login ssh-keys add* accepts either a string containing an SSH public
        key or a filename for an SSH public key and adds that key to the
        user's OS Login profile.
    flag:
        key: The SSH public key to add to the OS Login Profile.
        key-file: |-
            The path to a file containing an SSH public key to add to the
            OS Login Profile.
        ttl: |-
            The amount of time before the SSH key expires. For example,
            specifying ``30m'' will set the expiration time on the SSH key for
            30 minutes from the current time. A value of 0 will result in no
            expiration time.
            See $ gcloud topic datetimes for information on duration formats.
