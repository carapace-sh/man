name: reject-link
description: Rejects a link request between gateways.
flags:
    --gateway-id=!: The unique identifier of the gateway.
    --link-id=!: The unique identifier of the link.
documentation:
    command: |-
        Rejects a link request between gateways.

        When a requester gateway requests to link with a responder gateway, the responder can use this operation to decline the link request.
    flag:
        gateway-id: The unique identifier of the gateway.
        link-id: The unique identifier of the link.
