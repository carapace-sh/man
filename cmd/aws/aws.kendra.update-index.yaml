name: update-index
description: Updates an Amazon Kendra index.
flags:
    --capacity-units=: Sets the number of additional document storage and query capacity units that should be used by the index.
    --description=: A new description for the index.
    --document-metadata-configuration-updates=: The document metadata configuration you want to update for the index.
    --id=!: The identifier of the index you want to update.
    --name=: A new name for the index.
    --role-arn=: An Identity and Access Management (IAM) role that gives Amazon Kendra permission to access Amazon CloudWatch logs and metrics.
    --user-context-policy=: The user context policy.
    --user-group-resolution-configuration=: Gets users and groups from IAM Identity Center identity source.
    --user-token-configurations=: The user token configuration.
completion:
    flag:
        user-context-policy:
            - ATTRIBUTE_FILTER
            - USER_TOKEN
documentation:
    command: Updates an Amazon Kendra index.
    flag:
        capacity-units: |-
            Sets the number of additional document storage and query capacity units that should be used by the index. You can change the capacity of the index up to 5 times per day, or make 5 API calls.

            If you are using extra storage units, you can't reduce the storage capacity below what is required to meet the storage needs for your index.
        description: A new description for the index.
        document-metadata-configuration-updates: The document metadata configuration you want to update for the index. Document metadata are fields or attributes associated with your documents. For example, the company department name associated with each document.
        id: The identifier of the index you want to update.
        name: A new name for the index.
        role-arn: An Identity and Access Management (IAM) role that gives Amazon Kendra permission to access Amazon CloudWatch logs and metrics.
        user-context-policy: |-
            The user context policy.

            If you're using an Amazon Kendra Gen AI Enterprise Edition index, you can only use `ATTRIBUTE_FILTER` to filter search results by user context. If you're using an Amazon Kendra Gen AI Enterprise Edition index and you try to use `USER_TOKEN` to configure user context policy, Amazon Kendra returns a `ValidationException` error.
        user-group-resolution-configuration: |-
            Gets users and groups from IAM Identity Center identity source. To configure this, see [UserGroupResolutionConfiguration](https://docs.aws.amazon.com/kendra/latest/dg/API_UserGroupResolutionConfiguration.html). This is useful for user context filtering, where search results are filtered based on the user or their group access to documents.

            If you're using an Amazon Kendra Gen AI Enterprise Edition index, `UserGroupResolutionConfiguration` isn't supported.
        user-token-configurations: |-
            The user token configuration.

            If you're using an Amazon Kendra Gen AI Enterprise Edition index and you try to use `UserTokenConfigurations` to configure user context policy, Amazon Kendra returns a `ValidationException` error.
