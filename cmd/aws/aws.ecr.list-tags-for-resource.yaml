name: list-tags-for-resource
description: List the tags for an Amazon ECR resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) that identifies the resource for which to list the tags.
documentation:
    command: List the tags for an Amazon ECR resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) that identifies the resource for which to list the tags. Currently, the only supported resource is an Amazon ECR repository.
