name: revoke-endpoint-access
description: Revokes access to a cluster.
flags:
    --account=: The Amazon Web Services account ID whose access is to be revoked.
    --cluster-identifier=: The cluster to revoke access from.
    --force: Indicates whether to force the revoke action.
    --no-force: Indicates whether to force the revoke action.
    --vpc-ids=: The virtual private cloud (VPC) identifiers for which access is to be revoked.
documentation:
    command: Revokes access to a cluster.
    flag:
        account: The Amazon Web Services account ID whose access is to be revoked.
        cluster-identifier: The cluster to revoke access from.
        force: Indicates whether to force the revoke action. If true, the Redshift-managed VPC endpoints associated with the endpoint authorization are also deleted.
        vpc-ids: The virtual private cloud (VPC) identifiers for which access is to be revoked.
