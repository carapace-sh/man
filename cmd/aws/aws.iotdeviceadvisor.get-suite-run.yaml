name: get-suite-run
description: Gets information about a Device Advisor test suite run.
flags:
    --suite-definition-id=!: Suite definition ID for the test suite run.
    --suite-run-id=!: Suite run ID for the test suite run.
documentation:
    command: |-
        Gets information about a Device Advisor test suite run.

        Requires permission to access the [GetSuiteRun](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        suite-definition-id: Suite definition ID for the test suite run.
        suite-run-id: Suite run ID for the test suite run.
