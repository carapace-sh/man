name: create-component-version
description: Creates a component.
flags:
    --client-token=: A unique, case-sensitive identifier that you can provide to ensure that the request is idempotent.
    --inline-recipe=: The recipe to use to create the component.
    --lambda-function=: The parameters to create a component from a Lambda function.
    --tags=: A list of key-value pairs that contain metadata for the resource.
documentation:
    command: "Creates a component. Components are software that run on Greengrass core devices. After you develop and test a component on your core device, you can use this operation to upload your component to IoT Greengrass. Then, you can deploy the component to other core devices.\n\nYou can use this operation to do the following:\n\n- **Create components from recipes**\n  \n  Create a component from a recipe, which is a file that defines the component's metadata, parameters, dependencies, lifecycle, artifacts, and platform capability. For more information, see [IoT Greengrass component recipe reference](https://docs.aws.amazon.com/greengrass/v2/developerguide/component-recipe-reference.html) in the *IoT Greengrass V2 Developer Guide*.\n  \n  To create a component from a recipe, specify `inlineRecipe` when you call this operation.\n- **Create components from Lambda functions**\n  \n  Create a component from an Lambda function that runs on IoT Greengrass. This creates a recipe and artifacts from the Lambda function's deployment package. You can use this operation to migrate Lambda functions from IoT Greengrass V1 to IoT Greengrass V2.\n  \n  This function accepts Lambda functions in all supported versions of Python, Node.js, and Java runtimes. IoT Greengrass doesn't apply any additional restrictions on deprecated Lambda runtime versions.\n  \n  To create a component from a Lambda function, specify `lambdaFunction` when you call this operation.\n  \n  IoT Greengrass currently supports Lambda functions on only Linux core devices."
    flag:
        client-token: A unique, case-sensitive identifier that you can provide to ensure that the request is idempotent. Idempotency means that the request is successfully processed only once, even if you send the request multiple times. When a request succeeds, and you specify the same client token for subsequent successful requests, the IoT Greengrass V2 service returns the successful response that it caches from the previous request. IoT Greengrass V2 caches successful responses for idempotent requests for up to 8 hours.
        inline-recipe: |-
            The recipe to use to create the component. The recipe defines the component's metadata, parameters, dependencies, lifecycle, artifacts, and platform compatibility.

            You must specify either `inlineRecipe` or `lambdaFunction`.
        lambda-function: |-
            The parameters to create a component from a Lambda function.

            You must specify either `inlineRecipe` or `lambdaFunction`.
        tags: A list of key-value pairs that contain metadata for the resource. For more information, see [Tag your resources](https://docs.aws.amazon.com/greengrass/v2/developerguide/tag-resources.html) in the *IoT Greengrass V2 Developer Guide*.
