name: move
description: Move a Compute Engine organization firewall policy.
flags:
    --folder=: Folder to which the organization firewall policy is to be moved.
    --organization=: Organization in which the organization firewall policy is to be moved.
documentation:
    command: |-
        *gcloud compute firewall-policies move* is used to move is used to move organization firewall policies to
        new parent nodes.
    flag:
        folder: Folder to which the organization firewall policy is to be moved.
        organization: Organization in which the organization firewall policy is to be moved. Must be set if FIREWALL_POLICY is short name.
