name: enable
description: '*(ALPHA)*  Enable a service in Security Command Center(SCC).'
flags:
    --folder=: Folder ID
    --organization=: Organization ID
    --service=!: Service name in Security Command Center.
completion:
    flag:
        service:
            - container-threat-detection
            - event-threat-detection
            - security-health-analytics
            - virtual-machine-threat-detection
            - web-security-scanner
documentation:
    command: |
        *(ALPHA)*  Enable a service in Security Command Center(SCC).
    flag:
        folder: Folder ID
        organization: Organization ID
        service: 'Service name in Security Command Center. _SERVICE_NAME_ must be one of: *container-threat-detection*, *event-threat-detection*, *security-health-analytics*, *virtual-machine-threat-detection*, *web-security-scanner*.'
