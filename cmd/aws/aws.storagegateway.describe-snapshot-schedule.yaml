name: describe-snapshot-schedule
description: Describes the snapshot schedule for the specified gateway volume.
flags:
    --volume-arn=!: The Amazon Resource Name (ARN) of the volume.
documentation:
    command: Describes the snapshot schedule for the specified gateway volume. The snapshot schedule information includes intervals at which snapshots are automatically initiated on the volume. This operation is only supported in the cached volume and stored volume types.
    flag:
        volume-arn: The Amazon Resource Name (ARN) of the volume. Use the [ListVolumes]() operation to return a list of gateway volumes.
