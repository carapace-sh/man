name: export
description: '*(DEPRECATED)*  Exports data from a Cloud SQL instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --database=: Database(s) from which the export is made.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --table=: Tables to export from the specified database.
documentation:
    command: |-
        *(DEPRECATED)*  Exports data from a Cloud SQL instance.

        This command is deprecated and will be removed in version 205.0.0. Use `gcloud sql export sql` instead.

        Exports data from a Cloud SQL instance to a Google Cloud Storage
        bucket as a MySQL dump file.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        database: 'Database(s) from which the export is made. Information on requirements can be found here: https://cloud.google.com/sql/docs/mysql/admin-api/v1beta4/instances/export#exportContext.databases'
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        table: Tables to export from the specified database. If you specify tables, specify one and only one database. For Postgres instances, only one table can be exported at a time.
