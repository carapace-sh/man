name: create-dimension
description: Create a dimension that you can use to limit the scope of a metric used in a security profile for IoT Device Defender.
flags:
    --client-request-token=!: Each dimension must have a unique client request token.
    --name=!: A unique identifier for the dimension.
    --string-values=!: Specifies the value or list of values for the dimension.
    --tags=: Metadata that can be used to manage the dimension.
    --type=!: Specifies the type of dimension.
completion:
    flag:
        type:
            - TOPIC_FILTER
documentation:
    command: |-
        Create a dimension that you can use to limit the scope of a metric used in a security profile for IoT Device Defender. For example, using a `TOPIC_FILTER` dimension, you can narrow down the scope of the metric only to MQTT topics whose name match the pattern specified in the dimension.

        Requires permission to access the [CreateDimension](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        client-request-token: Each dimension must have a unique client request token. If you try to create a new dimension with the same token as a dimension that already exists, an exception occurs. If you omit this value, Amazon Web Services SDKs will automatically generate a unique client request.
        name: A unique identifier for the dimension. Choose something that describes the type and value to make it easy to remember what it does.
        string-values: Specifies the value or list of values for the dimension. For `TOPIC_FILTER` dimensions, this is a pattern used to match the MQTT topic (for example, "admin/#").
        tags: Metadata that can be used to manage the dimension.
        type: 'Specifies the type of dimension. Supported types: `TOPIC_FILTER.`'
