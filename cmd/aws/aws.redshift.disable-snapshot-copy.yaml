name: disable-snapshot-copy
description: Disables the automatic copying of snapshots from one region to another region for a specified cluster.
flags:
    --cluster-identifier=!: The unique identifier of the source cluster that you want to disable copying of snapshots to a destination region.
documentation:
    command: |-
        Disables the automatic copying of snapshots from one region to another region for a specified cluster.

        If your cluster and its snapshots are encrypted using an encrypted symmetric key from Key Management Service, use [DeleteSnapshotCopyGrant]() to delete the grant that grants Amazon Redshift permission to the key in the destination region.
    flag:
        cluster-identifier: |-
            The unique identifier of the source cluster that you want to disable copying of snapshots to a destination region.

            Constraints: Must be the valid name of an existing cluster that has cross-region snapshot copy enabled.
