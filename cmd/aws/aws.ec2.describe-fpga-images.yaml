name: describe-fpga-images
description: Describes the Amazon FPGA Images (AFIs) available to you.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: The filters.
    --fpga-image-ids=: The AFI IDs.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token to retrieve the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --owners=: Filters the AFI by owner.
documentation:
    command: Describes the Amazon FPGA Images (AFIs) available to you. These include public AFIs, private AFIs that you own, and AFIs owned by other Amazon Web Services accounts for which you have load permissions.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters.

            - `create-time` - The creation time of the AFI.
            - `fpga-image-id` - The FPGA image identifier (AFI ID).
            - `fpga-image-global-id` - The global FPGA image identifier (AGFI ID).
            - `name` - The name of the AFI.
            - `owner-id` - The Amazon Web Services account ID of the AFI owner.
            - `product-code` - The product code.
            - `shell-version` - The version of the Amazon Web Services Shell that was used to create the bitstream.
            - `state` - The state of the AFI (`pending` | `failed` | `available` | `unavailable`).
            - `tag`:&lt;key&gt; - The key/value combination of a tag assigned to the resource. Use the tag key in the filter name and the tag value as the filter value. For example, to find all resources that have a tag with the key `Owner` and the value `TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.
            - `tag-key` - The key of a tag assigned to the resource. Use this filter to find all resources assigned a tag with a specific key, regardless of the tag value.
            - `update-time` - The time of the most recent update.
        fpga-image-ids: The AFI IDs.
        max-results: The maximum number of results to return in a single call.
        next-token: The token to retrieve the next page of results.
        owners: Filters the AFI by owner. Specify an Amazon Web Services account ID, `self` (owner is the sender of the request), or an Amazon Web Services owner alias (valid values are `amazon` | `aws-marketplace`).
