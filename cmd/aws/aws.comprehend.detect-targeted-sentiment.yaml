name: detect-targeted-sentiment
description: Inspects the input text and returns a sentiment analysis for each entity identified in the text.
flags:
    --language-code=!: The language of the input documents.
    --text=!: A UTF-8 text string.
completion:
    flag:
        language-code:
            - en
            - es
            - fr
            - de
            - it
            - pt
            - ar
            - hi
            - ja
            - ko
            - zh
            - zh-TW
documentation:
    command: |-
        Inspects the input text and returns a sentiment analysis for each entity identified in the text.

        For more information about targeted sentiment, see [Targeted sentiment](https://docs.aws.amazon.com/comprehend/latest/dg/how-targeted-sentiment.html) in the *Amazon Comprehend Developer Guide*.
    flag:
        language-code: The language of the input documents. Currently, English is the only supported language.
        text: A UTF-8 text string. The maximum string length is 5 KB.
