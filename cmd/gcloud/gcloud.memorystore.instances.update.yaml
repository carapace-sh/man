        engine-configs: |-
            Set engine_configs to new value. User-provided engine configurations for the instance.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
