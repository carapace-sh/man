name: describe-aggregate-compliance-by-config-rules
description: Returns a list of compliant and noncompliant rules with the number of resources for compliant and noncompliant rules.
flags:
    --configuration-aggregator-name=!: The name of the configuration aggregator.
    --filters=: Filters the results by ConfigRuleComplianceFilters object.
    --limit=: The maximum number of evaluation results returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
documentation:
    command: |-
        Returns a list of compliant and noncompliant rules with the number of resources for compliant and noncompliant rules. Does not display rules that do not have compliance results.

        The results can return an empty result page, but if you have a `nextToken`, the results are displayed on the next page.
    flag:
        configuration-aggregator-name: The name of the configuration aggregator.
        filters: Filters the results by ConfigRuleComplianceFilters object.
        limit: The maximum number of evaluation results returned on each page. The default is maximum. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
