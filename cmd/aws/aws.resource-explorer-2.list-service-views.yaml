name: list-service-views
description: Lists all Resource Explorer service views available in the current Amazon Web Services account.
flags:
    --max-results=: The maximum number of service view results to return in a single response.
    --next-token=: The pagination token from a previous `ListServiceViews` response.
documentation:
    command: Lists all Resource Explorer service views available in the current Amazon Web Services account. This operation returns the ARNs of available service views.
    flag:
        max-results: The maximum number of service view results to return in a single response. Valid values are between `1` and `50`.
        next-token: The pagination token from a previous `ListServiceViews` response. Use this token to retrieve the next set of results.
