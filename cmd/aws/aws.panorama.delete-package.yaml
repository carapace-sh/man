name: delete-package
description: Deletes a package.
flags:
    --force-delete: Delete the package even if it has artifacts stored in its access point.
    --no-force-delete&: Delete the package even if it has artifacts stored in its access point.
    --package-id=!: The package's ID.
documentation:
    command: |-
        Deletes a package.

        To delete a package, you need permission to call `s3:DeleteObject` in addition to permissions for the AWS Panorama API.
    flag:
        force-delete: Delete the package even if it has artifacts stored in its access point. Deletes the package's artifacts from Amazon S3.
        package-id: The package's ID.
