name: list-hits-for-qualification-type
description: The `ListHITsForQualificationType` operation returns the HITs that use the given Qualification type for a Qualification requirement.
flags:
    --max-results=: Limit the number of results returned.
    --next-token=: Pagination Token
    --qualification-type-id=!: The ID of the Qualification type to use when querying HITs.
documentation:
    command: The `ListHITsForQualificationType` operation returns the HITs that use the given Qualification type for a Qualification requirement. The operation returns HITs of any status, except for HITs that have been deleted with the `DeleteHIT` operation or that have been auto-deleted.
    flag:
        max-results: Limit the number of results returned.
        next-token: Pagination Token
        qualification-type-id: The ID of the Qualification type to use when querying HITs.
