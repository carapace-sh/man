name: modify-snapshot-tier
description: Archives an Amazon EBS snapshot.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --snapshot-id=!: The ID of the snapshot.
    --storage-tier=: The name of the storage tier.
completion:
    flag:
        storage-tier:
            - archive
documentation:
    command: Archives an Amazon EBS snapshot. When you archive a snapshot, it is converted to a full snapshot that includes all of the blocks of data that were written to the volume at the time the snapshot was created, and moved from the standard tier to the archive tier. For more information, see [Archive Amazon EBS snapshots](https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-archive.html) in the *Amazon EBS User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        snapshot-id: The ID of the snapshot.
        storage-tier: The name of the storage tier. You must specify `archive`.
