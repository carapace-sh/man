name: copy-package-versions
description: Copies package versions from one repository to another repository in the same domain.
flags:
    --allow-overwrite: Set to true to overwrite a package version that already exists in the destination repository.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destination-repository=!: The name of the repository into which package versions are copied.
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the source and destination repositories.
    --format=!: The format of the package versions to be copied.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-from-upstream: Set to true to copy packages from repositories that are upstream from the source repository to the destination repository.
    --namespace=: The namespace of the package versions to be copied.
    --no-allow-overwrite: Set to true to overwrite a package version that already exists in the destination repository.
    --no-include-from-upstream: Set to true to copy packages from repositories that are upstream from the source repository to the destination repository.
    --package=!: The name of the package that contains the versions to be copied.
    --source-repository=!: The name of the repository that contains the package versions to be copied.
    --version-revisions=: A list of key-value pairs.
    --versions=: The versions of the package to be copied.
completion:
    flag:
        format:
            - npm
            - pypi
            - maven
            - nuget
            - generic
            - ruby
            - swift
            - cargo
documentation:
    command: |-
        Copies package versions from one repository to another repository in the same domain.

        You must specify `versions` or `versionRevisions`. You cannot specify both.
    flag:
        allow-overwrite: Set to true to overwrite a package version that already exists in the destination repository. If set to false and the package version already exists in the destination repository, the package version is returned in the `failedVersions` field of the response with an `ALREADY_EXISTS` error code.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        destination-repository: The name of the repository into which package versions are copied.
        domain: The name of the domain that contains the source and destination repositories.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        format: The format of the package versions to be copied.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-from-upstream: Set to true to copy packages from repositories that are upstream from the source repository to the destination repository. The default setting is false. For more information, see [Working with upstream repositories](https://docs.aws.amazon.com/codeartifact/latest/ug/repos-upstream.html).
        namespace: |-
            The namespace of the package versions to be copied. The package component that specifies its namespace depends on its type. For example:

            The namespace is required when copying package versions of the following formats:

            - Maven
            - Swift
            - generic

            <!--THE END-->

            - The namespace of a Maven package version is its `groupId`.
            - The namespace of an npm or Swift package version is its `scope`.
            - The namespace of a generic package is its `namespace`.
            - Python, NuGet, Ruby, and Cargo package versions do not contain a corresponding component, package versions of those formats do not have a namespace.
        package: The name of the package that contains the versions to be copied.
        source-repository: The name of the repository that contains the package versions to be copied.
        version-revisions: |-
            A list of key-value pairs. The keys are package versions and the values are package version revisions. A `CopyPackageVersion` operation succeeds if the specified versions in the source repository match the specified package version revision.

            You must specify `versions` or `versionRevisions`. You cannot specify both.
        versions: |-
            The versions of the package to be copied.

            You must specify `versions` or `versionRevisions`. You cannot specify both.
