name: delete-app-input-source
description: Deletes the input source and all of its imported resources from the Resilience Hub application.
flags:
    --app-arn=!: Amazon Resource Name (ARN) of the Resilience Hub application.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Used for an idempotency token.
    --eks-source-cluster-namespace=: The namespace on your Amazon Elastic Kubernetes Service cluster that you want to delete from the Resilience Hub application.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --source-arn=: The Amazon Resource Name (ARN) of the imported resource you want to remove from the Resilience Hub application.
    --terraform-source=: The imported Terraform s3 state ﬁle you want to remove from the Resilience Hub application.
documentation:
    command: Deletes the input source and all of its imported resources from the Resilience Hub application.
    flag:
        app-arn: 'Amazon Resource Name (ARN) of the Resilience Hub application. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Used for an idempotency token. A client token is a unique, case-sensitive string of up to 64 ASCII characters. You should not reuse the same client token for other API requests.
        eks-source-cluster-namespace: The namespace on your Amazon Elastic Kubernetes Service cluster that you want to delete from the Resilience Hub application.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        source-arn: The Amazon Resource Name (ARN) of the imported resource you want to remove from the Resilience Hub application. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.
        terraform-source: The imported Terraform s3 state ﬁle you want to remove from the Resilience Hub application.
