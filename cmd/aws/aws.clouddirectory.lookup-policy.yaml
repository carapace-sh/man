name: lookup-policy
description: Lists all policies from the root of the [Directory]() to the object specified.
flags:
    --directory-arn=!: The Amazon Resource Name (ARN) that is associated with the [Directory]().
    --max-results=: The maximum number of items to be retrieved in a single call.
    --next-token=: The token to request the next page of results.
    --object-reference=!: Reference that identifies the object whose policies will be looked up.
documentation:
    command: Lists all policies from the root of the [Directory]() to the object specified. If there are no policies present, an empty list is returned. If policies are present, and if some objects don't have the policies attached, it returns the `ObjectIdentifier` for such objects. If policies are present, it returns `ObjectIdentifier`, `policyId`, and `policyType`. Paths that don't lead to the root from the target object are ignored. For more information, see [Policies](https://docs.aws.amazon.com/clouddirectory/latest/developerguide/key_concepts_directory.html#key_concepts_policies).
    flag:
        directory-arn: The Amazon Resource Name (ARN) that is associated with the [Directory](). For more information, see [arns]().
        max-results: The maximum number of items to be retrieved in a single call. This is an approximate number.
        next-token: The token to request the next page of results.
        object-reference: Reference that identifies the object whose policies will be looked up.
