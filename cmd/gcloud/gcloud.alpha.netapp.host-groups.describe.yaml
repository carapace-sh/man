name: describe
description: '*(ALPHA)*  Describe a Cloud NetApp Host Group.'
flags:
    --location=: The location of the host_group.
documentation:
    command: |
        *(ALPHA)*  Describe a Cloud NetApp Host Group.
    flag:
        location: |-
            The location of the host_group.
            +
            To set the `location` attribute:
            * provide the argument `host_group` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
