name: restore-table-from-recovery-point
description: Restores a table from a recovery point to your Amazon Redshift Serverless instance.
flags:
    --activate-case-sensitive-identifier: Indicates whether name identifiers for database, schema, and table are case sensitive.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --namespace-name=!: Namespace of the recovery point to restore from.
    --new-table-name=!: The name of the table to create from the restore operation.
    --no-activate-case-sensitive-identifier: Indicates whether name identifiers for database, schema, and table are case sensitive.
    --recovery-point-id=!: The ID of the recovery point to restore the table from.
    --source-database-name=!: The name of the source database that contains the table being restored.
    --source-schema-name=: The name of the source schema that contains the table being restored.
    --source-table-name=!: The name of the source table being restored.
    --target-database-name=: The name of the database to restore the table to.
    --target-schema-name=: The name of the schema to restore the table to.
    --workgroup-name=!: The workgroup to restore the table to.
documentation:
    command: Restores a table from a recovery point to your Amazon Redshift Serverless instance. You can't use this operation to restore tables with interleaved sort keys.
    flag:
        activate-case-sensitive-identifier: Indicates whether name identifiers for database, schema, and table are case sensitive. If true, the names are case sensitive. If false, the names are not case sensitive. The default is false.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        namespace-name: Namespace of the recovery point to restore from.
        new-table-name: The name of the table to create from the restore operation.
        recovery-point-id: The ID of the recovery point to restore the table from.
        source-database-name: The name of the source database that contains the table being restored.
        source-schema-name: The name of the source schema that contains the table being restored.
        source-table-name: The name of the source table being restored.
        target-database-name: The name of the database to restore the table to.
        target-schema-name: The name of the schema to restore the table to.
        workgroup-name: The workgroup to restore the table to.
