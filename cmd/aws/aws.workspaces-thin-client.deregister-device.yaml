    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The ID of the device to deregister.
    --target-device-status=: The desired new status for the device.
completion:
    flag:
        target-device-status:
            - DEREGISTERED
            - ARCHIVED
documentation:
    command: Deregisters a thin client device.
    flag:
