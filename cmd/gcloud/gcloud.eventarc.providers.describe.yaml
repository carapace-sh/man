name: describe
description: Describe an Eventarc event provider.
flags:
    --location=: The location for the Eventarc provider, which should be either ``global'' or one of the supported regions.
documentation:
    command: Describe an Eventarc event provider.
    flag:
        location: |-
            The location for the Eventarc provider, which should be either ``global'' or one of the supported regions. Alternatively, set the [eventarc/location] property.
            +
            To set the `location` attribute:
            * provide the argument `provider` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `eventarc/location`.
