name: update-data-source
description: Updates an Amazon Kendra data source connector.
flags:
    --configuration=: Configuration information you want to update for the data source connector.
    --custom-document-enrichment-configuration=: Configuration information you want to update for altering document metadata and content during the document ingestion process.
    --description=: A new description for the data source connector.
    --id=!: The identifier of the data source connector you want to update.
    --index-id=!: The identifier of the index used with the data source connector.
    --language-code=: The code for a language you want to update for the data source connector.
    --name=: A new name for the data source connector.
    --role-arn=: The Amazon Resource Name (ARN) of an IAM role with permission to access the data source and required resources.
    --schedule=: The sync schedule you want to update for the data source connector.
    --vpc-configuration=: Configuration information for an Amazon Virtual Private Cloud to connect to your data source.
documentation:
    command: Updates an Amazon Kendra data source connector.
    flag:
        configuration: Configuration information you want to update for the data source connector.
        custom-document-enrichment-configuration: |-
            Configuration information you want to update for altering document metadata and content during the document ingestion process.

            For more information on how to create, modify and delete document metadata, or make other content alterations when you ingest documents into Amazon Kendra, see [Customizing document metadata during the ingestion process](https://docs.aws.amazon.com/kendra/latest/dg/custom-document-enrichment.html).
        description: A new description for the data source connector.
        id: The identifier of the data source connector you want to update.
        index-id: The identifier of the index used with the data source connector.
        language-code: The code for a language you want to update for the data source connector. This allows you to support a language for all documents when updating the data source. English is supported by default. For more information on supported languages, including their codes, see [Adding documents in languages other than English](https://docs.aws.amazon.com/kendra/latest/dg/in-adding-languages.html).
        name: A new name for the data source connector.
        role-arn: The Amazon Resource Name (ARN) of an IAM role with permission to access the data source and required resources. For more information, see [IAM roles for Amazon Kendra](https://docs.aws.amazon.com/kendra/latest/dg/iam-roles.html).
        schedule: The sync schedule you want to update for the data source connector.
        vpc-configuration: Configuration information for an Amazon Virtual Private Cloud to connect to your data source. For more information, see [Configuring a VPC](https://docs.aws.amazon.com/kendra/latest/dg/vpc-configuration.html).
