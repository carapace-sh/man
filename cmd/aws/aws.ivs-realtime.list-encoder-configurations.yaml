name: list-encoder-configurations
description: Gets summary information about all EncoderConfigurations in your account, in the AWS region where the API request is processed.
flags:
    --max-results=: Maximum number of results to return.
    --next-token=: The first encoder configuration to retrieve.
documentation:
    command: Gets summary information about all EncoderConfigurations in your account, in the AWS region where the API request is processed.
    flag:
        max-results: 'Maximum number of results to return. Default: 100.'
        next-token: The first encoder configuration to retrieve. This is used for pagination; see the `nextToken` response field.
