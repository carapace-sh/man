name: create
description: Create an App Engine app within the current Google Cloud Project.
flags:
    --region=: The region to create the app within.
    --service-account=: The app-level default service account to create the app with.
    --ssl-policy=: The app-level SSL policy to create the app with.
completion:
    flag:
        ssl-policy:
            - TLS_VERSION_1_0
            - TLS_VERSION_1_2
documentation:
    command: |
        Create an App Engine app within the current Google Cloud Project.
    flag:
        region: The region to create the app within.  Use `gcloud app regions list` to list available regions.  If not provided, select region interactively.
        service-account: |-
            The app-level default service account to create the app with.
            Note that you can specify a distinct service account for each
            App Engine version with `gcloud app deploy --service-account`.
            However if you do not specify a version-level service account,
            this default will be used. If this parameter is not provided for app
            creation, the app-level default will be set to be the out-of-box
            App Engine Default Service Account,
            https://cloud.google.com/appengine/docs/standard/python3/service-account
            outlines the limitation of that service account.
        ssl-policy: 'The app-level SSL policy to create the app with. _SSL_POLICY_ must be one of: *TLS_VERSION_1_0*, *TLS_VERSION_1_2*.'
