name: unlink-developer-identity
description: Unlinks a `DeveloperUserIdentifier` from an existing identity.
flags:
    --developer-provider-name=!: The "domain" by which Cognito will refer to your users.
    --developer-user-identifier=!: A unique ID used by your backend authentication process to identify a user.
    --identity-id=!: A unique identifier in the format REGION:GUID.
    --identity-pool-id=!: An identity pool ID in the format REGION:GUID.
documentation:
    command: |-
        Unlinks a `DeveloperUserIdentifier` from an existing identity. Unlinked developer users will be considered new identities next time they are seen. If, for a given Cognito identity, you remove all federated identities as well as the developer user identifier, the Cognito identity becomes inaccessible.

        You must use Amazon Web Services developer credentials to call this operation.
    flag:
        developer-provider-name: The "domain" by which Cognito will refer to your users.
        developer-user-identifier: A unique ID used by your backend authentication process to identify a user.
        identity-id: A unique identifier in the format REGION:GUID.
        identity-pool-id: An identity pool ID in the format REGION:GUID.
