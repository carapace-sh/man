name: export
description: '*(BETA)*  Export an autoscaling policy.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --region=: Dataproc region for the autoscaling policy.
documentation:
    command: |-
        *(BETA)*  Exporting an autoscaling policy is similar to describing one, except that
        export omits output only fields, such as the policy id and resource name. This
        is to allow piping the output of export directly into import, which requires
        that output only fields are omitted.

        ## EXAMPLES

        The following command saves the contents of autoscaling policy
        `example-autoscaling-policy` to a file so that it can be imported later:

          $ gcloud beta dataproc autoscaling-policies export example-autoscaling-policy --destination=saved-policy.yaml
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output.
        region: |-
            Dataproc region for the autoscaling policy. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `autoscaling_policy` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
