name: modify-replication-instance
description: Modifies the replication instance to apply new settings.
flags:
    --allocated-storage=: The amount of storage (in gigabytes) to be allocated for the replication instance.
    --allow-major-version-upgrade: Indicates that major version upgrades are allowed.
    --apply-immediately: Indicates whether the changes should be applied immediately or during the next maintenance window.
    --auto-minor-version-upgrade=: A value that indicates that minor version upgrades are applied automatically to the replication instance during the maintenance window.
    --engine-version=: The engine version number of the replication instance.
    --kerberos-authentication-settings=: Specifies the settings required for kerberos authentication when modifying a replication instance.
    --multi-az=: Specifies whether the replication instance is a Multi-AZ deployment.
    --network-type=: The type of IP address protocol used by a replication instance, such as IPv4 only or Dual-stack that supports both IPv4 and IPv6 addressing.
    --no-allow-major-version-upgrade: Indicates that major version upgrades are allowed.
    --no-apply-immediately: Indicates whether the changes should be applied immediately or during the next maintenance window.
    --preferred-maintenance-window=: The weekly time range (in UTC) during which system maintenance can occur, which might result in an outage.
    --replication-instance-arn=!: The Amazon Resource Name (ARN) of the replication instance.
    --replication-instance-class=: The compute and memory capacity of the replication instance as defined for the specified replication instance class.
    --replication-instance-identifier=: The replication instance identifier.
    --vpc-security-group-ids=: Specifies the VPC security group to be used with the replication instance.
documentation:
    command: |-
        Modifies the replication instance to apply new settings. You can change one or more parameters by specifying these parameters and the new values in the request.

        Some settings are applied during the maintenance window.
    flag:
        allocated-storage: The amount of storage (in gigabytes) to be allocated for the replication instance.
        allow-major-version-upgrade: |-
            Indicates that major version upgrades are allowed. Changing this parameter does not result in an outage, and the change is asynchronously applied as soon as possible.

            This parameter must be set to `true` when specifying a value for the `EngineVersion` parameter that is a different major version than the replication instance's current version.
        apply-immediately: Indicates whether the changes should be applied immediately or during the next maintenance window.
        auto-minor-version-upgrade: |-
            A value that indicates that minor version upgrades are applied automatically to the replication instance during the maintenance window. Changing this parameter doesn't result in an outage, except in the case described following. The change is asynchronously applied as soon as possible.

            An outage does result if these factors apply:

            - This parameter is set to `true` during the maintenance window.
            - A newer minor version is available.
            - DMS has enabled automatic patching for the given engine version.
        engine-version: |-
            The engine version number of the replication instance.

            When modifying a major engine version of an instance, also set `AllowMajorVersionUpgrade` to `true`.
        kerberos-authentication-settings: Specifies the settings required for kerberos authentication when modifying a replication instance.
        multi-az: Specifies whether the replication instance is a Multi-AZ deployment. You can't set the `AvailabilityZone` parameter if the Multi-AZ parameter is set to `true`.
        network-type: The type of IP address protocol used by a replication instance, such as IPv4 only or Dual-stack that supports both IPv4 and IPv6 addressing. IPv6 only is not yet supported.
        preferred-maintenance-window: |-
            The weekly time range (in UTC) during which system maintenance can occur, which might result in an outage. Changing this parameter does not result in an outage, except in the following situation, and the change is asynchronously applied as soon as possible. If moving this window to the current time, there must be at least 30 minutes between the current time and end of the window to ensure pending changes are applied.

            Default: Uses existing setting

            Format: ddd:hh24:mi-ddd:hh24:mi

            Valid Days: Mon | Tue | Wed | Thu | Fri | Sat | Sun

            Constraints: Must be at least 30 minutes
        replication-instance-arn: The Amazon Resource Name (ARN) of the replication instance.
        replication-instance-class: |-
            The compute and memory capacity of the replication instance as defined for the specified replication instance class. For example to specify the instance class dms.c4.large, set this parameter to `"dms.c4.large"`.

            For more information on the settings and capacities for the available replication instance classes, see [Selecting the right DMS replication instance for your migration](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_ReplicationInstance.html#CHAP_ReplicationInstance.InDepth).
        replication-instance-identifier: The replication instance identifier. This parameter is stored as a lowercase string.
        vpc-security-group-ids: Specifies the VPC security group to be used with the replication instance. The VPC security group must work with the VPC containing the replication instance.
