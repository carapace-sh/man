name: simulate
description: Command to simulate a SHA custom module.
flags:
    --custom-config-from-file=!: Path to a YAML custom configuration file.
    --folder=: Folder associated with the custom module.
    --organization=: Organization associated with the custom module.
    --parent=: Parent associated with the custom module.
    --resource-from-file=!: Path to a YAML file that contains the resource data to validate the Security Health Analytics custom module against.
documentation:
    command: |-
        ## EXAMPLES

        To simulate a Security Health Analytics custom module with
        ID `123456` for organization `123`, run:

          $ gcloud scc manage custom-modules sha simulate 123456
          --organization=123
          --custom-config-from-file=custom_config.yaml
          --resource-from-file=test.yaml

        To simulate a Security Health Analytics custom module with
        ID `123456` for folder `456`, run:

          $ gcloud scc manage custom-modules sha simulate 123456
          --folder=456
          --custom-config-from-file=custom_config.yaml
          --resource-from-file=test.yaml

        To simulate a Security Health Analytics custom module with
        ID `123456` for project `789`, run:

          $ gcloud scc manage custom-modules sha simulate 123456
          --project=789
          --custom-config-from-file=custom_config.yaml
          --resource-from-file=test.yaml

        You can also specify the parent more generally:

          $ gcloud scc manage custom-modules sha simulate 123456
          --parent=organizations/123
          --custom-config-from-file=custom_config.yaml
          --resource-from-file=test.yaml

        Or just specify the fully qualified module name:

          $ gcloud scc manage custom-modules sha simulate
          organizations/123/locations/global/effectiveSecurityHealthAnalyticsCustomModules/123456
          --custom-config-from-file=custom_config.yaml
          --resource-from-file=test.yaml
    flag:
        custom-config-from-file: Path to a YAML custom configuration file. Use a full or relative path to a local file containing the value of custom_config.
        folder: Folder associated with the custom module.
        organization: Organization associated with the custom module.
        parent: |-
            Parent associated with the custom module. Can be one of
                          organizations/<id>, projects/<id or name>, folders/<id>
        resource-from-file: Path to a YAML file that contains the resource data to validate the Security Health Analytics custom module against. Use a full or relative path to a local file containing the value of resource.
