name: describe-feature-group
description: Use this operation to describe a `FeatureGroup`.
flags:
    --feature-group-name=!: The name or Amazon Resource Name (ARN) of the `FeatureGroup` you want described.
    --next-token=: A token to resume pagination of the list of `Features` (`FeatureDefinitions`).
documentation:
    command: Use this operation to describe a `FeatureGroup`. The response includes information on the creation time, `FeatureGroup` name, the unique identifier for each `FeatureGroup`, and more.
    flag:
        feature-group-name: The name or Amazon Resource Name (ARN) of the `FeatureGroup` you want described.
        next-token: A token to resume pagination of the list of `Features` (`FeatureDefinitions`). 2,500 `Features` are returned by default.
