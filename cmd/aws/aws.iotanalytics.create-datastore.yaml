name: create-datastore
description: Creates a data store, which is a repository for messages.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --datastore-name=!: The name of the data store.
    --datastore-partitions=: Contains information about the partition dimensions in a data store.
    --datastore-storage=: Where data in a data store is stored.. You can choose `serviceManagedS3` storage, `customerManagedS3` storage, or `iotSiteWiseMultiLayerStorage` storage.
    --file-format-configuration=: Contains the configuration information of file formats.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --retention-period=: How long, in days, message data is kept for the data store.
    --tags=:
        description: Metadata which can be used to manage the data store.
        nargs: -1
documentation:
    command: Creates a data store, which is a repository for messages.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        datastore-name: The name of the data store.
        datastore-partitions: Contains information about the partition dimensions in a data store.
        datastore-storage: Where data in a data store is stored.. You can choose `serviceManagedS3` storage, `customerManagedS3` storage, or `iotSiteWiseMultiLayerStorage` storage. The default is `serviceManagedS3`. You can't change the choice of Amazon S3 storage after your data store is created.
        file-format-configuration: |-
            Contains the configuration information of file formats. IoT Analytics data stores support JSON and [Parquet](https://parquet.apache.org/).

            The default file format is JSON. You can specify only one format.

            You can't change the file format after you create the data store.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        retention-period: How long, in days, message data is kept for the data store. When `customerManagedS3` storage is selected, this parameter is ignored.
        tags: Metadata which can be used to manage the data store.
