name: list-cloud-vm-clusters
description: Returns information about the VM clusters owned by your Amazon Web Services account or only the ones on the specified Exadata infrastructure.
flags:
    --cloud-exadata-infrastructure-id=: The unique identifier of the Oracle Exadata infrastructure.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token returned from a previous paginated request.
documentation:
    command: Returns information about the VM clusters owned by your Amazon Web Services account or only the ones on the specified Exadata infrastructure.
    flag:
        cloud-exadata-infrastructure-id: The unique identifier of the Oracle Exadata infrastructure.
        max-results: |-
            The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output.

            Default: `10`
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
