name: create-workspace-bundle
description: Creates the specified WorkSpace bundle.
flags:
    --bundle-description=!: The description of the bundle.
    --bundle-name=!: The name of the bundle.
    --compute-type=!: ""
    --image-id=!: The identifier of the image that is used to create the bundle.
    --root-storage=: ""
    --tags=: The tags associated with the bundle.
    --user-storage=!: ""
documentation:
    command: Creates the specified WorkSpace bundle. For more information about creating WorkSpace bundles, see [Create a Custom WorkSpaces Image and Bundle](https://docs.aws.amazon.com/workspaces/latest/adminguide/create-custom-bundle.html).
    flag:
        bundle-description: The description of the bundle.
        bundle-name: The name of the bundle.
        compute-type: ""
        image-id: The identifier of the image that is used to create the bundle.
        root-storage: ""
        tags: |-
            The tags associated with the bundle.

            To add tags at the same time when you're creating the bundle, you must create an IAM policy that grants your IAM user permissions to use `workspaces:CreateTags`.
        user-storage: ""
