name: create-case
description: Creates a new case.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The `clientToken` field is an idempotency key used to ensure that repeated attempts for a single action will be ignored by the server during retries.
    --description=!: Required element used in combination with CreateCase
    --engagement-type=!: Required element used in combination with CreateCase to provide an engagement type for the new cases.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --impacted-accounts=!:
        description: Required element used in combination with CreateCase to provide a list of impacted accounts.
        nargs: -1
    --impacted-aws-regions=:
        description: An optional element used in combination with CreateCase to provide a list of impacted regions.
        nargs: -1
    --impacted-services=:
        description: An optional element used in combination with CreateCase to provide a list of services impacted.
        nargs: -1
    --reported-incident-start-date=!: Required element used in combination with CreateCase to provide an initial start date for the unauthorized activity.
    --resolver-type=!: Required element used in combination with CreateCase to identify the resolver type.
    --tags=: An optional element used in combination with CreateCase to add customer specified tags to a case.
    --threat-actor-ip-addresses=:
        description: An optional element used in combination with CreateCase to provide a list of suspicious internet protocol addresses associated with unauthorized activity.
        nargs: -1
    --title=!: Required element used in combination with CreateCase to provide a title for the new case.
    --watchers=!:
        description: Required element used in combination with CreateCase to provide a list of entities to receive notifications for case updates.
        nargs: -1
completion:
    flag:
        engagement-type:
            - Security Incident
            - Investigation
        resolver-type:
            - AWS
            - Self
documentation:
    command: Creates a new case.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The `clientToken` field is an idempotency key used to ensure that repeated attempts for a single action will be ignored by the server during retries. A caller supplied unique ID (typically a UUID) should be provided.
        description: |-
            Required element used in combination with CreateCase

            to provide a description for the new case.
        engagement-type: Required element used in combination with CreateCase to provide an engagement type for the new cases. Available engagement types include Security Incident | Investigation
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        impacted-accounts: |-
            Required element used in combination with CreateCase to provide a list of impacted accounts.

            AWS account ID's may appear less than 12 characters and need to be zero-prepended. An example would be `123123123` which is nine digits, and with zero-prepend would be `000123123123`. Not zero-prepending to 12 digits could result in errors.
        impacted-aws-regions: An optional element used in combination with CreateCase to provide a list of impacted regions.
        impacted-services: An optional element used in combination with CreateCase to provide a list of services impacted.
        reported-incident-start-date: Required element used in combination with CreateCase to provide an initial start date for the unauthorized activity.
        resolver-type: Required element used in combination with CreateCase to identify the resolver type.
        tags: An optional element used in combination with CreateCase to add customer specified tags to a case.
        threat-actor-ip-addresses: An optional element used in combination with CreateCase to provide a list of suspicious internet protocol addresses associated with unauthorized activity.
        title: Required element used in combination with CreateCase to provide a title for the new case.
        watchers: Required element used in combination with CreateCase to provide a list of entities to receive notifications for case updates.
