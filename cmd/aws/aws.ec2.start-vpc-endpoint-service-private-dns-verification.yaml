name: start-vpc-endpoint-service-private-dns-verification
description: Initiates the verification process to prove that the service provider owns the private DNS name domain for the endpoint service.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --service-id=!: The ID of the endpoint service.
documentation:
    command: |-
        Initiates the verification process to prove that the service provider owns the private DNS name domain for the endpoint service.

        The service provider must successfully perform the verification before the consumer can use the name to access the service.

        Before the service provider runs this command, they must add a record to the DNS server.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        service-id: The ID of the endpoint service.
