name: create-realtime-endpoint
description: Creates a real-time endpoint for the `MLModel`.
flags:
    --mlmodel-id=!: The ID assigned to the `MLModel` during creation.
documentation:
    command: Creates a real-time endpoint for the `MLModel`. The endpoint contains the URI of the `MLModel`; that is, the location to send real-time prediction requests for the specified `MLModel`.
    flag:
        mlmodel-id: The ID assigned to the `MLModel` during creation.
