name: update
description: '*(ALPHA)*  Update Cloud Storage objects.'
flags:
    --acl-file=: Path to a local JSON or YAML formatted file containing a valid policy.
    --add-acl-grant=: Key-value pairs mirroring the JSON accepted by your cloud provider.
    --additional-headers=: Includes arbitrary headers in storage API calls.
    --all-versions: Perform the operation on all object versions.
    --cache-control=: How caches should handle requests and responses.
    --canned-acl=: Applies predefined, or "canned," ACLs to a resource.
    --clear-cache-control: Clears object cache control.
    --clear-content-disposition: Clears object content disposition.
    --clear-content-encoding: Clears content encoding.
    --clear-content-language: Clears object content language.
    --clear-content-type: Clears object content type.
    --clear-custom-contexts: Clears all custom contexts on objects.
    --clear-custom-metadata: Clears all custom metadata on objects.
    --clear-custom-time: Clears object custom time.
    --clear-encryption-key: Clears the encryption key associated with an object.
    --clear-retention: Clears object retention settings and unlocks the configuration.
    --content-disposition=: How content should be displayed.
    --content-encoding=: How content is encoded (e.g. ``gzip'').
    --content-language=: Content's language (e.g. ``en'' signifies "English").
    --content-type=: Type of data contained in the object (e.g. ``text/html'').
    --continue-on-error: If any operations are unsuccessful, the command will exit with a non-zero exit status after completing the remaining operations.
    --custom-contexts-file=: Path to a local JSON or YAML file containing custom contexts one wants to set on
    --custom-contexts=: Sets custom contexts on objects.
    --custom-metadata=: Sets custom metadata on objects.
    --custom-time=: Custom time for Cloud Storage objects in RFC 3339 format.
    --decryption-keys=: A comma-separated list of customer-supplied encryption keys (RFC 4648 section 4 base64-encoded AES256 strings) that will be used to decrypt Cloud Storage objects.
    --encryption-key=: The encryption key to use for encrypting target objects.
    --event-based-hold: Enables or disables an event-based hold on objects.
    --if-generation-match=: Execute only if the generation matches the generation of the requested object.
    --if-metageneration-match=: Execute only if the metageneration matches the metageneration of the requested object.
    --no-all-versions&: Perform the operation on all object versions.
    --no-clear-cache-control&: Clears object cache control.
    --no-clear-content-disposition&: Clears object content disposition.
    --no-clear-content-encoding&: Clears content encoding.
    --no-clear-content-language&: Clears object content language.
    --no-clear-content-type&: Clears object content type.
    --no-clear-custom-contexts&: Clears all custom contexts on objects.
    --no-clear-custom-metadata&: Clears all custom metadata on objects.
    --no-clear-custom-time&: Clears object custom time.
    --no-clear-encryption-key&: Clears the encryption key associated with an object.
    --no-clear-retention&: Clears object retention settings and unlocks the configuration.
    --no-event-based-hold&: Enables or disables an event-based hold on objects.
    --no-override-unlocked-retention&: Needed for certain retention configuration modifications, such as clearing retention settings and reducing retention time.
    --no-preserve-acl&: Preserves ACLs when copying in the cloud.
    --no-read-paths-from-stdin&: Read the list of objects to update from stdin.
    --no-temporary-hold&: Enables or disables a temporary hold on objects.
    --override-unlocked-retention: Needed for certain retention configuration modifications, such as clearing retention settings and reducing retention time.
    --predefined-acl=: Applies predefined, or "canned," ACLs to a resource.
    --preserve-acl: Preserves ACLs when copying in the cloud.
    --read-paths-from-stdin: Read the list of objects to update from stdin.
    --recursive: Recursively update objects under any buckets or directories that match the URL expression.
    --remove-acl-grant=: Key-value pairs mirroring the JSON accepted by your cloud provider.
    --remove-custom-contexts=: Removes the custom contexts on the object, if an entry is not found, it would be ignored.
    --remove-custom-metadata=: Removes individual custom metadata keys from objects.
    --retain-until=: Ensures the object is retained until the specified time in RFC 3339 format.
    --retention-mode=: Sets the object retention mode to either "Locked" or "Unlocked".
    --storage-class=: Specify the storage class of the object.
    --temporary-hold: Enables or disables a temporary hold on objects.
    --update-custom-contexts=: Updates the custom contexts on the object, if an entry is found, it would be overwritten, otherwise the entry would be added.
    --update-custom-metadata=: Adds or sets individual custom metadata key value pairs on objects.
completion:
    flag:
        retention-mode:
            - Locked
            - Unlocked
documentation:
    command: |
        *(ALPHA)*  Update Cloud Storage objects.
    flag:
        acl-file: Path to a local JSON or YAML formatted file containing a valid policy. See the [ObjectAccessControls resource](https://cloud.google.com/storage/docs/json_api/v1/objectAccessControls) for a representation of JSON formatted files. The output of `gcloud storage [buckets|objects] describe` `--format="multi(acl:format=json)"` is a valid file and can be edited for more fine-grained control.
        add-acl-grant: Key-value pairs mirroring the JSON accepted by your cloud provider. For example, for Cloud Storage,`--add-acl-grant=entity=user-tim@gmail.com,role=OWNER`
        additional-headers: Includes arbitrary headers in storage API calls. Accepts a comma separated list of key=value pairs, e.g. `header1=value1,header2=value2`. Overrides the default *storage/additional_headers* property value for this command invocation.
        all-versions: Perform the operation on all object versions.
        cache-control: How caches should handle requests and responses.
        canned-acl: 'Applies predefined, or "canned," ACLs to a resource. See docs for a list of predefined ACL constants: https://cloud.google.com/storage/docs/access-control/lists#predefined-acl'
        clear-cache-control: Clears object cache control.
        clear-content-disposition: Clears object content disposition.
        clear-content-encoding: Clears content encoding.
        clear-content-language: Clears object content language.
        clear-content-type: Clears object content type.
        clear-custom-contexts: Clears all custom contexts on objects.
        clear-custom-metadata: Clears all custom metadata on objects. When used with `--preserve-posix`, POSIX attributes will still be stored in custom metadata.
        clear-custom-time: Clears object custom time.
        clear-encryption-key: Clears the encryption key associated with an object. Using this flag triggers a rewrite of affected objects, which are then encrypted using the default encryption key set on the bucket, if one exists, or else with a Google-managed encryption key.
        clear-retention: Clears object retention settings and unlocks the configuration. Requires --override-unlocked-retention flag as confirmation.
        content-disposition: How content should be displayed.
        content-encoding: How content is encoded (e.g. ``gzip'').
        content-language: Content's language (e.g. ``en'' signifies "English").
        content-type: Type of data contained in the object (e.g. ``text/html'').
        continue-on-error: If any operations are unsuccessful, the command will exit with a non-zero exit status after completing the remaining operations. This flag takes effect only in sequential execution mode (i.e. processor and thread count are set to 1). Parallelism is default.
        custom-contexts: Sets custom contexts on objects. The existing custom contexts (if any) would be overwritten.
        custom-contexts-file: |-
            Path to a local JSON or YAML file containing custom contexts one wants to set on
            an object. For example:
            +
            1. The following JSON document shows two key value
            pairs, i.e. (key1, value1) and (key2, value2):
            +
              ```
                {
                  "key1": {"value": "value1"},
                  "key2": {"value": "value2"}
                }
              ```
            +
            2. The following YAML document shows two key value
            pairs, i.e. (key1, value1) and (key2, value2):
            +
              ```
                key1:
                  value: value1
                key2:
                  value: value2
              ```
            +
            Note: Currently object contexts only supports string format for values.
        custom-metadata: Sets custom metadata on objects. When used with `--preserve-posix`, POSIX attributes are also stored in custom metadata.
        custom-time: Custom time for Cloud Storage objects in RFC 3339 format.
        decryption-keys: A comma-separated list of customer-supplied encryption keys (RFC 4648 section 4 base64-encoded AES256 strings) that will be used to decrypt Cloud Storage objects. Data encrypted with a customer-managed encryption key (CMEK) is decrypted automatically, so CMEKs do not need to be listed here.
        encryption-key: The encryption key to use for encrypting target objects. The specified encryption key can be a customer-supplied encryption key (An RFC 4648 section 4 base64-encoded AES256 string), or a customer-managed encryption key of the form `projects/{project}/locations/{location}/keyRings/{key-ring}/cryptoKeys/{crypto-key}`. The specified key also acts as a decryption key, which is useful when copying or moving encrypted data to a new location. Using this flag in an `objects update` command triggers a rewrite of target objects.
        event-based-hold: Enables or disables an event-based hold on objects. Use *--event-based-hold* to enable and *--no-event-based-hold* to disable.
        if-generation-match: Execute only if the generation matches the generation of the requested object.
        if-metageneration-match: Execute only if the metageneration matches the metageneration of the requested object.
        no-all-versions: Perform the operation on all object versions.
        no-clear-cache-control: Clears object cache control.
        no-clear-content-disposition: Clears object content disposition.
        no-clear-content-encoding: Clears content encoding.
        no-clear-content-language: Clears object content language.
        no-clear-content-type: Clears object content type.
        no-clear-custom-contexts: Clears all custom contexts on objects.
        no-clear-custom-metadata: Clears all custom metadata on objects. When used with `--preserve-posix`, POSIX attributes will still be stored in custom metadata.
        no-clear-custom-time: Clears object custom time.
        no-clear-encryption-key: Clears the encryption key associated with an object. Using this flag triggers a rewrite of affected objects, which are then encrypted using the default encryption key set on the bucket, if one exists, or else with a Google-managed encryption key.
        no-clear-retention: Clears object retention settings and unlocks the configuration. Requires --override-unlocked-retention flag as confirmation.
        no-event-based-hold: Enables or disables an event-based hold on objects.
        no-override-unlocked-retention: Needed for certain retention configuration modifications, such as clearing retention settings and reducing retention time. Note that locked configurations cannot be edited even with this flag.
        no-preserve-acl: |-
            Preserves ACLs when copying in the cloud. This option is Cloud Storage-only, and you need OWNER access to all copied objects. If all objects in the destination bucket should have the same ACL, you can also set a default object ACL on that bucket instead of using this flag.
            Preserving ACLs is the default behavior for updating existing objects.
        no-read-paths-from-stdin: |-
            Read the list of objects to update from stdin. No need to enter a source argument if this flag is present.
            Example: "storage objects update -I --content-type=new-type"
        no-temporary-hold: Enables or disables a temporary hold on objects.
        override-unlocked-retention: Needed for certain retention configuration modifications, such as clearing retention settings and reducing retention time. Note that locked configurations cannot be edited even with this flag.
        predefined-acl: 'Applies predefined, or "canned," ACLs to a resource. See docs for a list of predefined ACL constants: https://cloud.google.com/storage/docs/access-control/lists#predefined-acl'
        preserve-acl: |-
            Preserves ACLs when copying in the cloud. This option is Cloud Storage-only, and you need OWNER access to all copied objects. If all objects in the destination bucket should have the same ACL, you can also set a default object ACL on that bucket instead of using this flag.
            Preserving ACLs is the default behavior for updating existing objects. Use *--preserve-acl* to enable and *--no-preserve-acl* to disable.
        read-paths-from-stdin: |-
            Read the list of objects to update from stdin. No need to enter a source argument if this flag is present.
            Example: "storage objects update -I --content-type=new-type"
        recursive: Recursively update objects under any buckets or directories that match the URL expression.
        remove-acl-grant: Key-value pairs mirroring the JSON accepted by your cloud provider. For example, for Cloud Storage, `--remove-acl-grant=ENTITY`, where `ENTITY` has a valid ACL entity format, such as `user-tim@gmail.com`, `group-admins`, `allUsers`, etc.
        remove-custom-contexts: Removes the custom contexts on the object, if an entry is not found, it would be ignored.
        remove-custom-metadata: Removes individual custom metadata keys from objects. This flag can be used with `--update-custom-metadata`. When used with `--preserve-posix`, POSIX attributes specified by this flag are not preserved.
        retain-until: Ensures the object is retained until the specified time in RFC 3339 format. Requires --override-unlocked-retention flag to shorten the retain-until time in unlocked configurations.
        retention-mode: 'Sets the object retention mode to either "Locked" or "Unlocked". When retention mode is "Locked", the retain until time can only be increased. _RETENTION_MODE_ must be one of: *Locked*, *Unlocked*.'
        storage-class: Specify the storage class of the object. Using this flag triggers a rewrite of underlying object data.
        temporary-hold: Enables or disables a temporary hold on objects. Use *--temporary-hold* to enable and *--no-temporary-hold* to disable.
        update-custom-contexts: Updates the custom contexts on the object, if an entry is found, it would be overwritten, otherwise the entry would be added.
        update-custom-metadata: Adds or sets individual custom metadata key value pairs on objects. Existing custom metadata not specified with this flag is not changed. This flag can be used with `--remove-custom-metadata`. When keys overlap with those provided by `--preserve-posix`, values specified by this flag are used.
