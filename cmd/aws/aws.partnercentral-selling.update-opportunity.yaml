name: update-opportunity
description: Updates the `Opportunity` record identified by a given `Identifier`.
flags:
    --catalog=!: Specifies the catalog associated with the request.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --customer=: Specifies details of the customer associated with the `Opportunity`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identifier=!: Read-only, system generated `Opportunity` unique identifier.
    --last-modified-date=!: '`DateTime` when the opportunity was last modified.'
    --life-cycle=: An object that contains lifecycle details for the `Opportunity`.
    --marketing=: An object that contains marketing details for the `Opportunity`.
    --national-security=: Specifies if the opportunity is associated with national security concerns.
    --opportunity-type=: Specifies the opportunity type as a renewal, new, or expansion.
    --partner-opportunity-identifier=: Specifies the opportunity's unique identifier in the partner's CRM system.
    --primary-needs-from-aws=:
        description: Identifies the type of support the partner needs from Amazon Web Services.
        nargs: -1
    --project=: An object that contains project details summary for the `Opportunity`.
    --software-revenue=: Specifies details of a customer's procurement terms.
completion:
    flag:
        national-security:
            - "Yes"
            - "No"
        opportunity-type:
            - Net New Business
            - Flat Renewal
            - Expansion
documentation:
    command: |-
        Updates the `Opportunity` record identified by a given `Identifier`. This operation allows you to modify the details of an existing opportunity to reflect the latest information and progress. Use this action to keep the opportunity record up-to-date and accurate.

        When you perform updates, include the entire payload with each request. If any field is omitted, the API assumes that the field is set to `null`. The best practice is to always perform a `GetOpportunity` to retrieve the latest values, then send the complete payload with the updated values to be changed.
    flag:
        catalog: 'Specifies the catalog associated with the request. This field takes a string value from a predefined list: `AWS` or `Sandbox`. The catalog determines which environment the opportunity is updated in. Use `AWS` to update real opportunities in the production environment, and `Sandbox` for testing in secure, isolated environments. When you use the `Sandbox` catalog, it allows you to simulate and validate your interactions with Amazon Web Services services without affecting live data or operations.'
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        customer: Specifies details of the customer associated with the `Opportunity`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identifier: Read-only, system generated `Opportunity` unique identifier.
        last-modified-date: '`DateTime` when the opportunity was last modified.'
        life-cycle: An object that contains lifecycle details for the `Opportunity`.
        marketing: An object that contains marketing details for the `Opportunity`.
        national-security: Specifies if the opportunity is associated with national security concerns. This flag is only applicable when the industry is `Government`. For national-security-related opportunities, validation and compliance rules may apply, impacting the opportunity's visibility and processing.
        opportunity-type: |-
            Specifies the opportunity type as a renewal, new, or expansion.

            Opportunity types:

            - New opportunity: Represents a new business opportunity with a potential customer that's not previously engaged with your solutions or services.
            - Renewal opportunity: Represents an opportunity to renew an existing contract or subscription with a current customer, ensuring continuity of service.
            - Expansion opportunity: Represents an opportunity to expand the scope of an existing contract or subscription, either by adding new services or increasing the volume of existing services for a current customer.
        partner-opportunity-identifier: Specifies the opportunity's unique identifier in the partner's CRM system. This value is essential to track and reconcile because it's included in the outbound payload sent back to the partner.
        primary-needs-from-aws: |-
            Identifies the type of support the partner needs from Amazon Web Services.

            Valid values:

            - Cosell—Architectural Validation: Confirmation from Amazon Web Services that the partner's proposed solution architecture is aligned with Amazon Web Services best practices and poses minimal architectural risks.
            - Cosell—Business Presentation: Request Amazon Web Services seller's participation in a joint customer presentation.
            - Cosell—Competitive Information: Access to Amazon Web Services competitive resources and support for the partner's proposed solution.
            - Cosell—Pricing Assistance: Connect with an AWS seller for support situations where a partner may be receiving an upfront discount on a service (for example: EDP deals).
            - Cosell—Technical Consultation: Connection with an Amazon Web Services Solutions Architect to address the partner's questions about the proposed solution.
            - Cosell—Total Cost of Ownership Evaluation: Assistance with quoting different cost savings of proposed solutions on Amazon Web Services versus on-premises or a traditional hosting environment.
            - Cosell—Deal Support: Request Amazon Web Services seller's support to progress the opportunity (for example: joint customer call, strategic positioning).
            - Cosell—Support for Public Tender/RFx: Opportunity related to the public sector where the partner needs RFx support from Amazon Web Services.
        project: An object that contains project details summary for the `Opportunity`.
        software-revenue: Specifies details of a customer's procurement terms. Required only for partners in eligible programs.
