name: untag-resource
description: Removes a tag from an index, FAQ, data source, or other resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the index, FAQ, data source, or other resource to remove a tag.
    --tag-keys=!: A list of tag keys to remove from the index, FAQ, data source, or other resource.
documentation:
    command: Removes a tag from an index, FAQ, data source, or other resource.
    flag:
        resource-arn: 'The Amazon Resource Name (ARN) of the index, FAQ, data source, or other resource to remove a tag. For example, the ARN of an index is constructed as follows: *arn:aws:kendra:your-region:your-account-id:index/index-id* For information on how to construct an ARN for all types of Amazon Kendra resources, see [Resource types](https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonkendra.html#amazonkendra-resources-for-iam-policies).'
        tag-keys: A list of tag keys to remove from the index, FAQ, data source, or other resource. If a tag key doesn't exist for the resource, it is ignored.
