name: create-workflow
description: Allows you to create a workflow with specified steps and step details the workflow invokes after file transfer completes.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A textual description for the workflow.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --on-exception-steps=:
        description: Specifies the steps (actions) to take if errors are encountered during execution of the workflow.
        nargs: -1
    --steps=!:
        description: Specifies the details for the steps that are in the specified workflow.
        nargs: -1
    --tags=:
        description: Key-value pairs that can be used to group and search for workflows.
        nargs: -1
documentation:
    command: Allows you to create a workflow with specified steps and step details the workflow invokes after file transfer completes. After creating a workflow, you can associate the workflow created with any transfer servers by specifying the `workflow-details` field in `CreateServer` and `UpdateServer` operations.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A textual description for the workflow.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        on-exception-steps: |-
            Specifies the steps (actions) to take if errors are encountered during execution of the workflow.

            For custom steps, the Lambda function needs to send `FAILURE` to the call back API to kick off the exception steps. Additionally, if the Lambda does not send `SUCCESS` before it times out, the exception steps are executed.
        steps: |-
            Specifies the details for the steps that are in the specified workflow.

            The `TYPE` specifies which of the following actions is being taken for this step.

            - **`COPY`** - Copy the file to another location.
            - **`CUSTOM`** - Perform a custom step with an Lambda function target.
            - **`DECRYPT`** - Decrypt a file that was encrypted before it was uploaded.
            - **`DELETE`** - Delete the file.
            - **`TAG`** - Add a tag to the file.

            Currently, copying and tagging are supported only on S3.

            For file location, you specify either the Amazon S3 bucket and key, or the Amazon EFS file system ID and path.
        tags: Key-value pairs that can be used to group and search for workflows. Tags are metadata attached to workflows for any purpose.
