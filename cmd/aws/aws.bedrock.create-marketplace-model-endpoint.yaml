name: create-marketplace-model-endpoint
description: Creates an endpoint for a model from Amazon Bedrock Marketplace.
flags:
    --accept-eula=: Indicates whether you accept the end-user license agreement (EULA) for the model.
    --client-request-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --endpoint-config=!: The configuration for the endpoint, including the number and type of instances to use.
    --endpoint-name=!: The name of the endpoint.
    --model-source-identifier=!: The ARN of the model from Amazon Bedrock Marketplace that you want to deploy to the endpoint.
    --tags=: An array of key-value pairs to apply to the underlying Amazon SageMaker endpoint.
documentation:
    command: Creates an endpoint for a model from Amazon Bedrock Marketplace. The endpoint is hosted by Amazon SageMaker.
    flag:
        accept-eula: Indicates whether you accept the end-user license agreement (EULA) for the model. Set to `true` to accept the EULA.
        client-request-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. This token is listed as not required because Amazon Web Services SDKs automatically generate it for you and set this parameter. If you're not using the Amazon Web Services SDK or the CLI, you must provide this token or the action will fail.
        endpoint-config: The configuration for the endpoint, including the number and type of instances to use.
        endpoint-name: The name of the endpoint. This name must be unique within your Amazon Web Services account and region.
        model-source-identifier: The ARN of the model from Amazon Bedrock Marketplace that you want to deploy to the endpoint.
        tags: An array of key-value pairs to apply to the underlying Amazon SageMaker endpoint. You can use these tags to organize and identify your Amazon Web Services resources.
