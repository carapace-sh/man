name: delete
description: Delete a Cloud Bigtable authorized view.
flags:
    --instance=: Name of the Bigtable instance.
    --table=: Name of the Bigtable table.
documentation:
    command: Delete new Cloud Bigtable authorized view.
    flag:
        instance: |-
            Name of the Bigtable instance.
            +
            To set the `instance` attribute:
            * provide the argument `authorized_view` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        table: |-
            Name of the Bigtable table.
            +
            To set the `table` attribute:
            * provide the argument `authorized_view` on the command line with a fully specified name;
            * provide the argument `--table` on the command line.
