name: create-app
description: Creates an Resilience Hub application.
flags:
    --assessment-schedule=: Assessment execution schedule with 'Daily' or 'Disabled' values.
    --aws-application-arn=: Amazon Resource Name (ARN) of Resource Groups group that is integrated with an AppRegistry application.
    --client-token=: Used for an idempotency token.
    --description=: The optional description for an app.
    --event-subscriptions=: The list of events you would like to subscribe and get notification for.
    --name=!: Name of the application.
    --permission-model=: Defines the roles and credentials that Resilience Hub would use while creating the application, importing its resources, and running an assessment.
    --policy-arn=: Amazon Resource Name (ARN) of the resiliency policy.
    --tags=: Tags assigned to the resource.
completion:
    flag:
        assessment-schedule:
            - Disabled
            - Daily
documentation:
    command: |-
        Creates an Resilience Hub application. An Resilience Hub application is a collection of Amazon Web Services resources structured to prevent and recover Amazon Web Services application disruptions. To describe a Resilience Hub application, you provide an application name, resources from one or more CloudFormation stacks, Resource Groups, Terraform state files, AppRegistry applications, and an appropriate resiliency policy. In addition, you can also add resources that are located on Amazon Elastic Kubernetes Service (Amazon EKS) clusters as optional resources. For more information about the number of resources supported per application, see [Service quotas](https://docs.aws.amazon.com/general/latest/gr/resiliencehub.html#limits_resiliencehub).

        After you create an Resilience Hub application, you publish it so that you can run a resiliency assessment on it. You can then use recommendations from the assessment to improve resiliency by running another assessment, comparing results, and then iterating the process until you achieve your goals for recovery time objective (RTO) and recovery point objective (RPO).
    flag:
        assessment-schedule: Assessment execution schedule with 'Daily' or 'Disabled' values.
        aws-application-arn: Amazon Resource Name (ARN) of Resource Groups group that is integrated with an AppRegistry application. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.
        client-token: Used for an idempotency token. A client token is a unique, case-sensitive string of up to 64 ASCII characters. You should not reuse the same client token for other API requests.
        description: The optional description for an app.
        event-subscriptions: The list of events you would like to subscribe and get notification for. Currently, Resilience Hub supports only **Drift detected** and **Scheduled assessment failure** events notification.
        name: Name of the application.
        permission-model: Defines the roles and credentials that Resilience Hub would use while creating the application, importing its resources, and running an assessment.
        policy-arn: 'Amazon Resource Name (ARN) of the resiliency policy. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:resiliency-policy/`policy-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        tags: Tags assigned to the resource. A tag is a label that you assign to an Amazon Web Services resource. Each tag consists of a key/value pair.
