name: update-rule
description: Updates a rule for the specified Amazon Connect instance.
flags:
    --actions=!: A list of actions to be run when the rule is triggered.
    --function=!: The conditions of the rule.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --name=!: The name of the rule.
    --publish-status=!: The publish status of the rule.
    --rule-id=!: A unique identifier for the rule.
completion:
    flag:
        publish-status:
            - DRAFT
            - PUBLISHED
documentation:
    command: |-
        Updates a rule for the specified Amazon Connect instance.

        Use the [Rules Function language](https://docs.aws.amazon.com/connect/latest/APIReference/connect-rules-language.html) to code conditions for the rule.
    flag:
        actions: A list of actions to be run when the rule is triggered.
        function: The conditions of the rule.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        name: 'The name of the rule. You can change the name only if `TriggerEventSource` is one of the following values: `OnZendeskTicketCreate` | `OnZendeskTicketStatusUpdate` | `OnSalesforceCaseCreate`'
        publish-status: The publish status of the rule.
        rule-id: A unique identifier for the rule.
