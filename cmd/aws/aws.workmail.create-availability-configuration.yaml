name: create-availability-configuration
description: Creates an `AvailabilityConfiguration` for the given WorkMail organization and domain.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: An idempotent token that ensures that an API request is executed only once.
    --domain-name=!: The domain to which the provider applies.
    --ews-provider=: Exchange Web Services (EWS) availability provider definition.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --lambda-provider=: Lambda availability provider definition.
    --organization-id=!: The WorkMail organization for which the `AvailabilityConfiguration` will be created.
documentation:
    command: Creates an `AvailabilityConfiguration` for the given WorkMail organization and domain.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: An idempotent token that ensures that an API request is executed only once.
        domain-name: The domain to which the provider applies.
        ews-provider: Exchange Web Services (EWS) availability provider definition. The request must contain exactly one provider definition, either `EwsProvider` or `LambdaProvider`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        lambda-provider: Lambda availability provider definition. The request must contain exactly one provider definition, either `EwsProvider` or `LambdaProvider`.
        organization-id: The WorkMail organization for which the `AvailabilityConfiguration` will be created.
