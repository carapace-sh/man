name: undelete
description: '*(ALPHA)*  Undelete an API key.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --key-string=: Key String of the key.
    --location=: Location of the key.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(ALPHA)*  API Keys that are deleted will be retained in the system for 30 days. If a
        key is still within this retention window, it can be undeleted with this
        command.

        ## EXAMPLES
        UnDelete an API Key (Key or key-string should be specified):

        To undelete with key `1234`, run:

            $ gcloud alpha services api-keys undelete 1234

        To undelete with `1234` in project `myproject` using the fully qualified API
        key name, run:

            $ gcloud alpha services api-keys undelete projects/myproject/locations/global/keys/1234

        To undelete using a Key-string, run:

          $ gcloud alpha services api-keys undelete --key-string='my-key-string'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        key-string: Key String of the key.
        location: |-
            Location of the key.
            +
            To set the `location` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * location will default to global.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
