name: get-function-configuration
description: Returns the version-specific settings of a Lambda function or version.
flags:
    --function-name=!: The name or ARN of the Lambda function, version, or alias.
    --qualifier=: Specify a version or alias to get details about a published version of the function.
documentation:
    command: |-
        Returns the version-specific settings of a Lambda function or version. The output includes only options that can vary between versions of a function. To modify these settings, use [UpdateFunctionConfiguration]().

        To get all of a function's details, including function-level settings, use [GetFunction]().
    flag:
        function-name: |-
            The name or ARN of the Lambda function, version, or alias.

            **Name formats**

            - **Function name** – `my-function` (name-only), `my-function:v1` (with alias).
            - **Function ARN** – `arn:aws:lambda:us-west-2:123456789012:function:my-function`.
            - **Partial ARN** – `123456789012:function:my-function`.

            You can append a version number or alias to any of the formats. The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        qualifier: Specify a version or alias to get details about a published version of the function.
