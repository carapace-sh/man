name: describe-configuration-aggregators
description: Returns the details of one or more configuration aggregators.
flags:
    --configuration-aggregator-names=: The name of the configuration aggregators.
    --limit=: The maximum number of configuration aggregators returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
documentation:
    command: Returns the details of one or more configuration aggregators. If the configuration aggregator is not specified, this operation returns the details for all the configuration aggregators associated with the account.
    flag:
        configuration-aggregator-names: The name of the configuration aggregators.
        limit: The maximum number of configuration aggregators returned on each page. The default is maximum. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
