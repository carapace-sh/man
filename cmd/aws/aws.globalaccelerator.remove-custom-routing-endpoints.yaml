    --cli-input-yaml=: Read arguments from the YAML string provided.
    --endpoint-group-arn=!: The Amazon Resource Name (ARN) of the endpoint group to remove endpoints from.
    --endpoint-ids=!: The IDs for the endpoints.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: Remove endpoints from a custom routing accelerator.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
