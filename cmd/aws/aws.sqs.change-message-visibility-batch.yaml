name: change-message-visibility-batch
description: Changes the visibility timeout of multiple messages.
flags:
    --entries=!: Lists the receipt handles of the messages for which the visibility timeout must be changed.
    --queue-url=!: The URL of the Amazon SQS queue whose messages' visibility is changed.
documentation:
    command: |-
        Changes the visibility timeout of multiple messages. This is a batch version of `ChangeMessageVisibility.` The result of the action on each message is reported individually in the response. You can send up to 10 `ChangeMessageVisibility` requests with each `ChangeMessageVisibilityBatch` action.

        Because the batch request can result in a combination of successful and unsuccessful actions, you should check for batch errors even when the call returns an HTTP status code of `200`.
    flag:
        entries: Lists the receipt handles of the messages for which the visibility timeout must be changed.
        queue-url: |-
            The URL of the Amazon SQS queue whose messages' visibility is changed.

            Queue URLs and names are case-sensitive.
