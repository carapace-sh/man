name: get-key-pairs
description: Returns information about all key pairs in the user's account.
flags:
    --include-default-key-pair=: A Boolean value that indicates whether to include the default key pair in the response of your request.
    --page-token=: The token to advance to the next page of results from your request.
documentation:
    command: Returns information about all key pairs in the user's account.
    flag:
        include-default-key-pair: A Boolean value that indicates whether to include the default key pair in the response of your request.
        page-token: |-
            The token to advance to the next page of results from your request.

            To get a page token, perform an initial `GetKeyPairs` request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
