name: list-data-accessors
description: Lists the data accessors for a Amazon Q Business application.
flags:
    --application-id=!: The unique identifier of the Amazon Q Business application.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token for the next set of results.
documentation:
    command: Lists the data accessors for a Amazon Q Business application. This operation returns a paginated list of data accessor summaries, including the friendly name, unique identifier, ARN, associated IAM role, and creation/update timestamps for each data accessor.
    flag:
        application-id: The unique identifier of the Amazon Q Business application.
        max-results: The maximum number of results to return in a single call.
        next-token: The token for the next set of results. (You received this token from a previous call.)
