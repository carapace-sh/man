name: delete
description: '*(BETA)*  Delete a membership.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location name.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(BETA)*  This command deletes the Fleet Membership resource corresponding to the cluster.

        This command is intended to delete stale Fleet Membership resources as doing so on a fully
        registered cluster will skip uninstalling the Connect Agent and and orphan in-cluster
        resources and agent connections to Google. To completely unregister the cluster, consider
        using the command: `gcloud beta container hub memberships unregister`.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `membership` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * global is the only supported location.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
