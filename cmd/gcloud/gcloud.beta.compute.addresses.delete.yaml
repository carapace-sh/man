name: delete
description: '*(BETA)*  Release reserved IP addresses.'
flags:
    --global: If set, the addresses are global.
    --no-global&: If set, the addresses are global.
    --region=: Region of the addresses to delete.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute addresses delete* releases one or more Compute Engine IP addresses.

        ## EXAMPLES

        To release an address with the name 'address-name', run:

          $ gcloud beta compute addresses delete address-name

        To release two addresses with the names 'address-name1' and 'address-name2',
        run:

          $ gcloud beta compute addresses delete address-name1 address-name2
    flag:
        global: If set, the addresses are global.
        no-global: If set, the addresses are global.
        region: Region of the addresses to delete. Overrides the default *compute/region* property value for this command invocation.
