name: register-transit-gateway-multicast-group-members
description: Registers members (network interfaces) with the transit gateway multicast group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-ip-address=: The IP address assigned to the transit gateway multicast group.
    --network-interface-ids=!:
        description: The group members' network interface IDs to register with the transit gateway multicast group.
        nargs: -1
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --transit-gateway-multicast-domain-id=!: The ID of the transit gateway multicast domain.
documentation:
    command: |-
        Registers members (network interfaces) with the transit gateway multicast group. A member is a network interface associated with a supported EC2 instance that receives multicast traffic. For more information, see [Multicast on transit gateways](https://docs.aws.amazon.com/vpc/latest/tgw/tgw-multicast-overview.html) in the *Amazon Web Services Transit Gateways Guide*.

        After you add the members, use [SearchTransitGatewayMulticastGroups](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_SearchTransitGatewayMulticastGroups.html) to verify that the members were added to the transit gateway multicast group.
