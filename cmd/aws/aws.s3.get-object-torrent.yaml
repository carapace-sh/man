name: get-object-torrent
description: This operation is not supported for directory buckets.
flags:
    --bucket=!: The name of the bucket containing the object for which to get the torrent files.
    --expected-bucket-owner=: The account ID of the expected bucket owner.
    --key=!: The object key for which to get the information.
    --request-payer=: ""
completion:
    flag:
        request-payer:
            - requester
documentation:
    command: |-
        This operation is not supported for directory buckets.

        Returns torrent files from a bucket. BitTorrent can save you bandwidth when you're distributing large files.

        You can get torrent only for objects that are less than 5 GB in size, and that are not encrypted using server-side encryption with a customer-provided encryption key.

        To use GET, you must have READ access to the object.

        This functionality is not supported for Amazon S3 on Outposts.

        The following action is related to `GetObjectTorrent`:

        - [GetObject](https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html)

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        bucket: The name of the bucket containing the object for which to get the torrent files.
        expected-bucket-owner: The account ID of the expected bucket owner. If the account ID that you provide does not match the actual owner of the bucket, the request fails with the HTTP status code `403 Forbidden` (access denied).
        key: The object key for which to get the information.
        request-payer: ""
