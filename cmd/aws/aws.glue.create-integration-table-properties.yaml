name: create-integration-table-properties
description: This API is used to provide optional override properties for the the tables that need to be replicated.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the target table for which to create integration table properties.
    --source-table-config=: A structure for the source table configuration.
    --table-name=!: The name of the table to be replicated.
    --target-table-config=: A structure for the target table configuration.
documentation:
    command: This API is used to provide optional override properties for the the tables that need to be replicated. These properties can include properties for filtering and partitioning for the source and target tables. To set both source and target properties the same API need to be invoked with the Glue connection ARN as `ResourceArn` with `SourceTableConfig`, and the Glue database ARN as `ResourceArn` with `TargetTableConfig` respectively.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the target table for which to create integration table properties. Currently, this API only supports creating integration table properties for target tables, and the provided ARN should be the ARN of the target table in the Glue Data Catalog. Support for creating integration table properties for source connections (using the connection ARN) is not yet implemented and will be added in a future release.
        source-table-config: A structure for the source table configuration. See the `SourceTableConfig` structure to see list of supported source properties.
        table-name: The name of the table to be replicated.
        target-table-config: A structure for the target table configuration.
