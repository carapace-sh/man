name: add-listener-certificates
description: Adds the specified SSL server certificate to the certificate list for the specified HTTPS or TLS listener.
flags:
    --certificates=!: The certificate to add.
    --listener-arn=!: The Amazon Resource Name (ARN) of the listener.
documentation:
    command: |-
        Adds the specified SSL server certificate to the certificate list for the specified HTTPS or TLS listener.

        If the certificate in already in the certificate list, the call is successful but the certificate is not added again.

        For more information, see [SSL certificates](https://docs.aws.amazon.com/elasticloadbalancing/latest/application/https-listener-certificates.html) in the *Application Load Balancers Guide* or [Server certificates](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/tls-listener-certificates.html) in the *Network Load Balancers Guide*.
    flag:
        certificates: The certificate to add. You can specify one certificate per call. Set `CertificateArn` to the certificate ARN but do not set `IsDefault`.
        listener-arn: The Amazon Resource Name (ARN) of the listener.
