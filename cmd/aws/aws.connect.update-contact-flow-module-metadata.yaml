name: update-contact-flow-module-metadata
description: Updates metadata about specified flow module.
flags:
    --contact-flow-module-id=!: The identifier of the flow module.
    --description=: The description of the flow module.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --name=: The name of the flow module.
    --state=: The state of flow module.
completion:
    flag:
        state:
            - ACTIVE
            - ARCHIVED
documentation:
    command: Updates metadata about specified flow module.
    flag:
        contact-flow-module-id: The identifier of the flow module.
        description: The description of the flow module.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        name: The name of the flow module.
        state: The state of flow module.
