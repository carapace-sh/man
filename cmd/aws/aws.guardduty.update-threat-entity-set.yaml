name: update-threat-entity-set
description: Updates the threat entity set associated with the specified `threatEntitySetId`.
flags:
    --activate: A boolean value that indicates whether GuardDuty is to start using this updated threat entity set.
    --detector-id=!: The unique ID of the GuardDuty detector associated with the threat entity set that you want to update.
    --expected-bucket-owner=: The Amazon Web Services account ID that owns the Amazon S3 bucket specified in the **location** parameter.
    --location=: The URI of the file that contains the trusted entity set.
    --name=: A user-friendly name to identify the trusted entity set.
    --no-activate&: A boolean value that indicates whether GuardDuty is to start using this updated threat entity set.
    --threat-entity-set-id=!: The ID returned by GuardDuty after updating the threat entity set resource.
documentation:
    command: Updates the threat entity set associated with the specified `threatEntitySetId`.
    flag:
        activate: A boolean value that indicates whether GuardDuty is to start using this updated threat entity set. After you update an entity set, you will need to activate it again. It might take up to 15 minutes for the updated entity set to be effective.
        detector-id: |-
            The unique ID of the GuardDuty detector associated with the threat entity set that you want to update.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        expected-bucket-owner: The Amazon Web Services account ID that owns the Amazon S3 bucket specified in the **location** parameter.
        location: The URI of the file that contains the trusted entity set.
        name: |-
            A user-friendly name to identify the trusted entity set.

            The name of your list can include lowercase letters, uppercase letters, numbers, dash (-), and underscore (\_).
        threat-entity-set-id: The ID returned by GuardDuty after updating the threat entity set resource.
