documentation:
    command: '*(ALPHA)*  List builds.'
    flag:
        filter: |-
            Apply a Boolean filter EXPRESSION to each resource item to be listed.
            If the expression evaluates True, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters.
            This flag interacts with other flags that are applied in this order:
            --flatten, --sort-by, --filter, --limit.
        limit: |-
            Maximum number of resources to list. The default is *50*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        no-ongoing: Only list builds that are currently QUEUED or WORKING.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        ongoing: Only list builds that are currently QUEUED or WORKING.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is *20*.
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        region: |-
            The region of the Cloud Build Service to use.
            Must be set to a supported region name (e.g. `us-central1`).
            If unset, `builds/region`, which is the default region to use when working with Cloud Build resources, is used. If builds/region is unset, region is set to `global`.
            Note: Region must be specified in 2nd gen repo; `global` is not supported.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
