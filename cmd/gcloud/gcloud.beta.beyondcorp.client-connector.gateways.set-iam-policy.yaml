name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a BeyondCorp client gateway (Deprecated).'
flags:
    --location=: The location of the BeyondCorp Enterprise client connector.
documentation:
    command: '*(BETA)*  Sets the IAM policy for the given BeyondCorp client gateway.'
    flag:
        location: |-
            The location of the BeyondCorp Enterprise client connector.
            +

            To set the `location` attribute:
            * provide the argument `client_gateway` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
