name: get-on-cluster-app-ui-presigned-url
description: The presigned URL properties for the cluster's application user interface.
flags:
    --application-id=: The application ID associated with the cluster's application user interface presigned URL.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-id=!: The cluster ID associated with the cluster's application user interface presigned URL.
    --dry-run: Determines if the user interface presigned URL is for a dry run.
    --execution-role-arn=: The execution role ARN associated with the cluster's application user interface presigned URL.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-dry-run: Determines if the user interface presigned URL is for a dry run.
    --on-cluster-app-ui-type=: The application UI type associated with the cluster's application user interface presigned URL.
completion:
    flag:
        on-cluster-app-ui-type:
            - SparkHistoryServer
            - YarnTimelineService
            - TezUI
            - ApplicationMaster
            - JobHistoryServer
            - ResourceManager
documentation:
    command: The presigned URL properties for the cluster's application user interface.
    flag:
        application-id: The application ID associated with the cluster's application user interface presigned URL.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
