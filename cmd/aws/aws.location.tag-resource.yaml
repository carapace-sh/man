name: tag-resource
description: Assigns one or more tags (key-value pairs) to the specified Amazon Location Service resource.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource whose tags you want to update.
    --tags=!: Applies one or more tags to specific resource.
documentation:
    command: |-
        Assigns one or more tags (key-value pairs) to the specified Amazon Location Service resource.

        Tags can help you organize and categorize your resources. You can also use them to scope user permissions, by granting a user permission to access or change only resources with certain tag values.

        You can use the `TagResource` operation with an Amazon Location Service resource that already has tags. If you specify a new tag key for the resource, this tag is appended to the tags already associated with the resource. If you specify a tag key that's already associated with the resource, the new tag value that you specify replaces the previous value for that tag.

        You can associate up to 50 tags with a resource.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        resource-arn: |-
            The Amazon Resource Name (ARN) of the resource whose tags you want to update.

            - Format example: `arn:aws:geo:region:account-id:resourcetype/ExampleResource`
        tags: |-
            Applies one or more tags to specific resource. A tag is a key-value pair that helps you manage, identify, search, and filter your resources.

            Format: `"key" : "value"`

            Restrictions:

            - Maximum 50 tags per resource.
            - Each tag key must be unique and must have exactly one associated value.
            - Maximum key length: 128 Unicode characters in UTF-8.
            - Maximum value length: 256 Unicode characters in UTF-8.
            - Can use alphanumeric characters (A–Z, a–z, 0–9), and the following characters: + - = . _ : / @
            - Cannot use "aws:" as a prefix for a key.
