            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        network-load-balancer-arns: The Amazon Resource Names (ARNs) of the Network Load Balancers.
        private-dns-name: (Interface endpoint configuration) The private DNS name to assign to the VPC endpoint service.
        supported-ip-address-types: The supported IP address types. The possible values are `ipv4` and `ipv6`.
        supported-regions: The Regions from which service consumers can access the service.
        tag-specifications: The tags to associate with the service.
