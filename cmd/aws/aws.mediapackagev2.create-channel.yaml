name: create-channel
description: Create a channel to start receiving content streams.
flags:
    --channel-group-name=!: The name that describes the channel group.
    --channel-name=!: The name that describes the channel.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive token that you provide to ensure the idempotency of the request.
    --description=: Enter any descriptive text that helps you to identify the channel.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-switch-configuration=: The configuration for input switching based on the media quality confidence score (MQCS) as provided from AWS Elemental MediaLive.
    --input-type=: The input type will be an immutable field which will be used to define whether the channel will allow CMAF ingest or HLS ingest.
    --output-header-configuration=: The settings for what common media server data (CMSD) headers AWS Elemental MediaPackage includes in responses to the CDN.
    --tags=: A comma-separated list of tag key:value pairs that you define.
completion:
    flag:
        input-type:
            - HLS
            - CMAF
documentation:
    command: Create a channel to start receiving content streams. The channel represents the input to MediaPackage for incoming live content from an encoder such as AWS Elemental MediaLive. The channel receives content, and after packaging it, outputs it through an origin endpoint to downstream devices (such as video players or CDNs) that request the content. You can create only one channel with each request. We recommend that you spread out channels between channel groups, such as putting redundant channels in the same AWS Region in different channel groups.
    flag:
        channel-group-name: The name that describes the channel group. The name is the primary identifier for the channel group, and must be unique for your account in the AWS Region.
        channel-name: The name that describes the channel. The name is the primary identifier for the channel, and must be unique for your account in the AWS Region and channel group. You can't change the name after you create the channel.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive token that you provide to ensure the idempotency of the request.
        description: Enter any descriptive text that helps you to identify the channel.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-switch-configuration: The configuration for input switching based on the media quality confidence score (MQCS) as provided from AWS Elemental MediaLive. This setting is valid only when `InputType` is `CMAF`.
        input-type: |-
            The input type will be an immutable field which will be used to define whether the channel will allow CMAF ingest or HLS ingest. If unprovided, it will default to HLS to preserve current behavior.

            The allowed values are:

            - `HLS` - The HLS streaming specification (which defines M3U8 manifests and TS segments).
            - `CMAF` - The DASH-IF CMAF Ingest specification (which defines CMAF segments with optional DASH manifests).
        output-header-configuration: The settings for what common media server data (CMSD) headers AWS Elemental MediaPackage includes in responses to the CDN. This setting is valid only when `InputType` is `CMAF`.
        tags: |-
            A comma-separated list of tag key:value pairs that you define. For example:

            `"Key1": "Value1",`

            `"Key2": "Value2"`
