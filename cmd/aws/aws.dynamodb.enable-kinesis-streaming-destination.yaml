name: enable-kinesis-streaming-destination
description: Starts table data replication to the specified Kinesis data stream at a timestamp chosen during the enable workflow.
flags:
    --enable-kinesis-streaming-configuration=: The source for the Kinesis streaming information that is being enabled.
    --stream-arn=!: The ARN for a Kinesis data stream.
    --table-name=!: The name of the DynamoDB table.
documentation:
    command: Starts table data replication to the specified Kinesis data stream at a timestamp chosen during the enable workflow. If this operation doesn't return results immediately, use DescribeKinesisStreamingDestination to check if streaming to the Kinesis data stream is ACTIVE.
    flag:
        enable-kinesis-streaming-configuration: The source for the Kinesis streaming information that is being enabled.
        stream-arn: The ARN for a Kinesis data stream.
        table-name: The name of the DynamoDB table. You can also provide the Amazon Resource Name (ARN) of the table in this parameter.
