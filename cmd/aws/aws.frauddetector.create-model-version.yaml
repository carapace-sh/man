name: create-model-version
description: Creates a version of the model using the specified model type and model id.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --external-events-detail=: Details of the external events data used for model version training.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ingested-events-detail=: Details of the ingested events data used for model version training.
    --model-id=!: The model ID.
    --model-type=!: The model type.
    --tags=: A collection of key and value pairs.
    --training-data-schema=!: The training data schema.
    --training-data-source=!: The training data source location in Amazon S3.
completion:
    flag:
        model-type:
            - ONLINE_FRAUD_INSIGHTS
            - TRANSACTION_FRAUD_INSIGHTS
            - ACCOUNT_TAKEOVER_INSIGHTS
        training-data-source:
            - EXTERNAL_EVENTS
            - INGESTED_EVENTS
documentation:
    command: Creates a version of the model using the specified model type and model id.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        external-events-detail: Details of the external events data used for model version training. Required if `trainingDataSource` is `EXTERNAL_EVENTS`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ingested-events-detail: Details of the ingested events data used for model version training. Required if `trainingDataSource` is `INGESTED_EVENTS`.
        model-id: The model ID.
        model-type: The model type.
        tags: A collection of key and value pairs.
        training-data-schema: The training data schema.
        training-data-source: The training data source location in Amazon S3.
