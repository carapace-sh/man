name: list-id-namespace-associations
description: Returns a list of ID namespace associations.
flags:
    --max-results=: The maximum size of the results that is returned per call.
    --membership-identifier=!: The unique identifier of the membership that contains the ID namespace association that you want to view.
    --next-token=: The pagination token that's used to fetch the next set of results.
documentation:
    command: Returns a list of ID namespace associations.
    flag:
        max-results: The maximum size of the results that is returned per call. Service chooses a default if it has not been set. Service may return a nextToken even if the maximum results has not been met.
        membership-identifier: The unique identifier of the membership that contains the ID namespace association that you want to view.
        next-token: The pagination token that's used to fetch the next set of results.
