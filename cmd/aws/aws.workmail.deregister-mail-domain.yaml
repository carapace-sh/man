name: deregister-mail-domain
description: Removes a domain from WorkMail, stops email routing to WorkMail, and removes the authorization allowing WorkMail use.
flags:
    --domain-name=!: The domain to deregister in WorkMail and SES.
    --organization-id=!: The WorkMail organization for which the domain will be deregistered.
documentation:
    command: Removes a domain from WorkMail, stops email routing to WorkMail, and removes the authorization allowing WorkMail use. SES keeps the domain because other applications may use it. You must first remove any email address used by WorkMail entities before you remove the domain.
    flag:
        domain-name: The domain to deregister in WorkMail and SES.
        organization-id: The WorkMail organization for which the domain will be deregistered.
