name: start-cost-allocation-tag-backfill
description: Request a cost allocation tag backfill.
flags:
    --backfill-from=!: The date you want the backfill to start from.
documentation:
    command: |-
        Request a cost allocation tag backfill. This will backfill the activation status (either `active` or `inactive`) for all tag keys from `para:BackfillFrom` up to the time this request is made.

        You can request a backfill once every 24 hours.
    flag:
        backfill-from: The date you want the backfill to start from. The date can only be a first day of the month (a billing start date). Dates can't precede the previous twelve months, or in the future.
