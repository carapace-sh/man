name: disable
description: '*(ALPHA)*  Disable (Uninstall) Policy Controller.'
flags:
    --all-memberships: If supplied, apply to all Policy Controllers memberships in the fleet.
    --fleet-default-member-config: Removes the fleet default configuration for policy controller.
    --location=: Location for the memberships.
    --memberships=!: IDs of the memberships or fully qualified identifiers for the memberships.
    --no-all-memberships&: If supplied, apply to all Policy Controllers memberships in the fleet.
    --no-fleet-default-member-config&: Removes the fleet default configuration for policy controller.
documentation:
    command: |-
        *(ALPHA)*  Uninstalls Policy Controller.

        ## EXAMPLES

        To uninstall Policy Controller, run:

          $ gcloud alpha container fleet policycontroller disable
    flag:
        all-memberships: If supplied, apply to all Policy Controllers memberships in the fleet.
        fleet-default-member-config: |-
            Removes the fleet default configuration for policy controller.
                  Memberships configured with the fleet default will maintain their current
                  configuration.
            +
                      $ {command} --fleet-default-member-config
        location: |-
            Location for the memberships.
            +
            To set the `location` attribute:
            * provide the argument `--memberships` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        memberships: |-
            IDs of the memberships or fully qualified identifiers for the memberships.
            +
            To set the `memberships` attribute:
            * provide the argument `--memberships` on the command line.
        no-all-memberships: If supplied, apply to all Policy Controllers memberships in the fleet.
        no-fleet-default-member-config: |
            Removes the fleet default configuration for policy controller.
                  Memberships configured with the fleet default will maintain their current
                  configuration.

                      $ {command} --fleet-default-member-config
