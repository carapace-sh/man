name: delete
description: '*(ALPHA)*  Delete routes.'
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute routes delete* deletes one or more Compute Engine routes.

        ## EXAMPLES

        To delete a route with the name 'route-name', run:

          $ gcloud alpha compute routes delete route-name

        To delete two routes with the names 'route-name1' and 'route-name2',
        run:

          $ gcloud alpha compute routes delete route-name1 route-name2
