name: list-code-reviews
description: Lists all the code reviews that the customer has created in the past 90 days.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results that are returned per call.
    --next-token=: If `nextToken` is returned, there are more results available.
    --provider-types=: List of provider types for filtering that needs to be applied before displaying the result.
    --repository-names=: List of repository names for filtering that needs to be applied before displaying the result.
    --states=: List of states for filtering that needs to be applied before displaying the result.
    --type=!: The type of code reviews to list in the response.
completion:
    flag:
        type:
            - PullRequest
            - RepositoryAnalysis
documentation:
    command: Lists all the code reviews that the customer has created in the past 90 days.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results that are returned per call. The default is 100.
        next-token: If `nextToken` is returned, there are more results available. The value of `nextToken` is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged.
        provider-types: List of provider types for filtering that needs to be applied before displaying the result. For example, `providerTypes=[GitHub]` lists code reviews from GitHub.
        repository-names: List of repository names for filtering that needs to be applied before displaying the result.
        states: |-
            List of states for filtering that needs to be applied before displaying the result. For example, `states=[Pending]` lists code reviews in the Pending state.

            The valid code review states are:

            - `Completed`: The code review is complete.
            - `Pending`: The code review started and has not completed or failed.
            - `Failed`: The code review failed.
            - `Deleting`: The code review is being deleted.
        type: The type of code reviews to list in the response.
