name: update
description: '*(ALPHA)*  Update a partner SSE gateway.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --symantec-location-uuid=: UUID of the Symantec location associated with this gateway.
    --symantec-target-host=: IPv4 address used as the destination for customer packets to the partner.
    --vni=: Virtual Network Identifier for the customer associated with this gateway.
documentation:
    command: |
        *(ALPHA)*  Update an existing partner gateway with additional fields.
        This is only supported for Symantec gateways.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `partner_sse_gateway` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        symantec-location-uuid: UUID of the Symantec location associated with this gateway.
        symantec-target-host: IPv4 address used as the destination for customer packets to the partner.
        vni: Virtual Network Identifier for the customer associated with this gateway.
