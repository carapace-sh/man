name: describe-trusted-advisor-checks
description: Returns information about all available Trusted Advisor checks, including the name, ID, category, description, and metadata.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --language=!: The ISO 639-1 code for the language that you want your checks to appear in.
documentation:
    command: |-
        Returns information about all available Trusted Advisor checks, including the name, ID, category, description, and metadata. You must specify a language code.

        The response contains a [TrustedAdvisorCheckDescription]() object for each check. You must set the Amazon Web Services Region to us-east-1.

        - You must have a Business, Enterprise On-Ramp, or Enterprise Support plan to use the Amazon Web Services Support API.
        - If you call the Amazon Web Services Support API from an account that doesn't have a Business, Enterprise On-Ramp, or Enterprise Support plan, the `SubscriptionRequiredException` error message appears. For information about changing your support plan, see [Amazon Web Services Support](http://aws.amazon.com/premiumsupport/).
        - The names and descriptions for Trusted Advisor checks are subject to change. We recommend that you specify the check ID in your code to uniquely identify a check.

        To call the Trusted Advisor operations in the Amazon Web Services Support API, you must use the US East (N. Virginia) endpoint. Currently, the US West (Oregon) and Europe (Ireland) endpoints don't support the Trusted Advisor operations. For more information, see [About the Amazon Web Services Support API](https://docs.aws.amazon.com/awssupport/latest/user/about-support-api.html#endpoint) in the *Amazon Web Services Support User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        language: |-
            The ISO 639-1 code for the language that you want your checks to appear in.

            The Amazon Web Services Support API currently supports the following languages for Trusted Advisor:

            - Chinese, Simplified - `zh`
            - Chinese, Traditional - `zh_TW`
            - English - `en`
            - French - `fr`
            - German - `de`
            - Indonesian - `id`
            - Italian - `it`
            - Japanese - `ja`
            - Korean - `ko`
            - Portuguese, Brazilian - `pt_BR`
            - Spanish - `es`
