name: search-products-as-admin
description: Gets information about the products for the specified portfolio or all products.
flags:
    --accept-language=: The language code.
    --filters=: The search filters.
    --page-size=: The maximum number of items to return with this call.
    --page-token=: The page token for the next set of results.
    --portfolio-id=: The portfolio identifier.
    --product-source=: Access level of the source of the product.
    --sort-by=: The sort field.
    --sort-order=: The sort order.
completion:
    flag:
        product-source:
            - ACCOUNT
        sort-by:
            - Title
            - VersionCount
            - CreationDate
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Gets information about the products for the specified portfolio or all products.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        filters: The search filters. If no search filters are specified, the output includes all products to which the administrator has access.
        page-size: The maximum number of items to return with this call.
        page-token: The page token for the next set of results. To retrieve the first set of results, use null.
        portfolio-id: The portfolio identifier.
        product-source: Access level of the source of the product.
        sort-by: The sort field. If no value is specified, the results are not sorted.
        sort-order: The sort order. If no value is specified, the results are not sorted.
