name: update-policy-store
description: Modifies the validation setting for a policy store.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deletion-protection=: Specifies whether the policy store can be deleted.
    --description=: Descriptive text that you can provide to help with identification of the current policy store.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --policy-store-id=!: Specifies the ID of the policy store that you want to update
    --validation-settings=!: A structure that defines the validation settings that want to enable for the policy store.
completion:
    flag:
        deletion-protection:
            - ENABLED
            - DISABLED
documentation:
    command: |-
        Modifies the validation setting for a policy store.

        Verified Permissions is [*eventually consistent*](https://wikipedia.org/wiki/Eventual_consistency) . It can take a few seconds for a new or changed element to propagate through the service and be visible in the results of other Verified Permissions operations.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deletion-protection: |-
            Specifies whether the policy store can be deleted. If enabled, the policy store can't be deleted.

            When you call `UpdatePolicyStore`, this parameter is unchanged unless explicitly included in the call.
        description: Descriptive text that you can provide to help with identification of the current policy store.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        policy-store-id: Specifies the ID of the policy store that you want to update
        validation-settings: A structure that defines the validation settings that want to enable for the policy store.
