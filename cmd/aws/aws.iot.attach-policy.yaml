name: attach-policy
description: Attaches the specified policy to the specified principal (certificate or other credential).
flags:
    --policy-name=!: The name of the policy to attach.
    --target=!: The [identity](https://docs.aws.amazon.com/iot/latest/developerguide/security-iam.html) to which the policy is attached.
documentation:
    command: |-
        Attaches the specified policy to the specified principal (certificate or other credential).

        Requires permission to access the [AttachPolicy](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        policy-name: The name of the policy to attach.
        target: The [identity](https://docs.aws.amazon.com/iot/latest/developerguide/security-iam.html) to which the policy is attached. For example, a thing group or a certificate.
