name: create
description: Create a notebook runtime.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: The description
    --display-name=!: The display name of the runtime to create.
    --labels=: Add labels to identify and group the runtime template.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: ID of the region or fully qualified identifier for the region.
    --runtime-id=: The id of the runtime to create.
    --runtime-template=!: ID of the runtime template or fully qualified identifier for the runtime template.
    --runtime-user=: User email for the runtime owner.
documentation:
    command: |
        Create a notebook runtime that can be used to run code from your notebook (IPYNB file).
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: The description
        display-name: The display name of the runtime to create.
        labels: Add labels to identify and group the runtime template.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            ID of the region or fully qualified identifier for the region.
            +
            To set the `region` attribute:
            * provide the argument `--region` on the command line;
            * set the property `colab/region`.
        runtime-id: The id of the runtime to create. If not specified, a random id will be generated.
        runtime-template: |-
            ID of the runtime template or fully qualified identifier for the runtime template.
            +
            To set the `name` attribute:
            * provide the argument `--runtime-template` on the command line.
        runtime-user: User email for the runtime owner. Runtimes can only be used by the owner. If a user is not provided, the gcloud user will be assumed to be the owner. The user cannot be a service account.
