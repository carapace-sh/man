name: create
description: '*(DEPRECATED)*  Create a node pool in an Anthos cluster on Azure.'
flags:
    --annotations=: Annotations for the node pool.
    --async: Return immediately, without waiting for the operation in progress to
    --azure-availability-zone=: Azure availability zone where the node pool will be created.
    --cluster=: cluster of the nodepool.
    --config-encryption-key-id=: URL the of the Azure Key Vault key (with its version) to use to encrypt / decrypt config data.
    --config-encryption-public-key=: RSA key of the Azure Key Vault public key to use for encrypting config data.
    --enable-autorepair: Enable node autorepair feature for a node pool.
    --location=: Google Cloud location for the nodepool.
    --max-nodes=!: Maximum number of nodes in the node pool.
    --max-pods-per-node=!: Maximum number of pods per node.
    --min-nodes=!: Minimum number of nodes in the node pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-autorepair&: Enable node autorepair feature for a node pool.
    --no-validate-only&: Validate the creation of the node pool, but don't actually perform it.
    --node-labels=: Labels assigned to the node pool's nodes.
    --node-taints=: Taints assigned to nodes of the node pool.
    --node-version=!: Kubernetes version to use for the node pool.
    --proxy-resource-group-id=!: The ARM ID the of the resource group containing proxy keyvault.
    --proxy-secret-id=!: The URL the of the proxy setting secret with its version.
    --root-volume-size=: Size of the root volume.
    --ssh-public-key=!: SSH public key to use for authentication.
    --subnet-id=!: Subnet ID of an existing VNET to use for the node pool.
    --tags=: Applies the given tags (comma separated) on the node pool.
    --validate-only: Validate the creation of the node pool, but don't actually perform it.
    --vm-size=: Azure Virtual Machine Size (e.g. Standard_DS1_v).
documentation:
    command: |+
        *(DEPRECATED)*  Create a node pool in an Anthos cluster on Azure.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/azure/deprecations/deprecation-announcement for more details.

    flag:
        annotations: Annotations for the node pool.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        azure-availability-zone: Azure availability zone where the node pool will be created.
        cluster: |-
            cluster of the nodepool.
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        config-encryption-key-id: URL the of the Azure Key Vault key (with its version) to use to encrypt / decrypt config data.
        config-encryption-public-key: RSA key of the Azure Key Vault public key to use for encrypting config data.
        enable-autorepair: |-
            Enable node autorepair feature for a node pool. Use --no-enable-autorepair to disable.
            +
              $ {command} --enable-autorepair
            +
            Node autorepair is disabled by default.
        location: |-
            Google Cloud location for the nodepool.
            +
            To set the `location` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_azure/location`.
        max-nodes: Maximum number of nodes in the node pool.
        max-pods-per-node: Maximum number of pods per node.
        min-nodes: Minimum number of nodes in the node pool.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-autorepair: |
            Enable node autorepair feature for a node pool. Use --no-enable-autorepair to disable.

              $ {command} --enable-autorepair

            Node autorepair is disabled by default.
        no-validate-only: Validate the creation of the node pool, but don't actually perform it.
        node-labels: Labels assigned to the node pool's nodes.
        node-taints: 'Taints assigned to nodes of the node pool. Node taint is of format key=value:effect. Effect must be one of: NoExecute, NoSchedule, PreferNoSchedule.'
        node-version: Kubernetes version to use for the node pool.
        proxy-resource-group-id: The ARM ID the of the resource group containing proxy keyvault.
        proxy-secret-id: The URL the of the proxy setting secret with its version.
        root-volume-size: Size of the root volume. The value must be a whole number followed by a size unit of `GB` for gigabyte, or `TB` for terabyte. If no size unit is specified, GB is assumed.
        ssh-public-key: SSH public key to use for authentication.
        subnet-id: Subnet ID of an existing VNET to use for the node pool.
        tags: |-
            Applies the given tags (comma separated) on the node pool. Example:
            +
              $ {command} EXAMPLE_NODE_POOL --tags=tag1=one,tag2=two
        validate-only: Validate the creation of the node pool, but don't actually perform it.
        vm-size: Azure Virtual Machine Size (e.g. Standard_DS1_v).
