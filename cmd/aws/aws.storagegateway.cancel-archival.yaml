name: cancel-archival
description: Cancels archiving of a virtual tape to the virtual tape shelf (VTS) after the archiving process is initiated.
flags:
    --gateway-arn=!: ""
    --tape-arn=!: The Amazon Resource Name (ARN) of the virtual tape you want to cancel archiving for.
documentation:
    command: Cancels archiving of a virtual tape to the virtual tape shelf (VTS) after the archiving process is initiated. This operation is only supported in the tape gateway type.
    flag:
        gateway-arn: ""
        tape-arn: The Amazon Resource Name (ARN) of the virtual tape you want to cancel archiving for.
