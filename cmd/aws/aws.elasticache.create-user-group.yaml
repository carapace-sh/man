name: create-user-group
description: 'For Valkey engine version 7.2 onwards and Redis OSS 6.0 to 7.1: Creates a user group.'
flags:
    --engine=!: Sets the engine listed in a user group.
    --tags=: A list of tags to be added to this resource.
    --user-group-id=!: The ID of the user group.
    --user-ids=: The list of user IDs that belong to the user group.
documentation:
    command: 'For Valkey engine version 7.2 onwards and Redis OSS 6.0 to 7.1: Creates a user group. For more information, see [Using Role Based Access Control (RBAC)](http://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Clusters.RBAC.html)'
    flag:
        engine: Sets the engine listed in a user group. The options are valkey or redis.
        tags: A list of tags to be added to this resource. A tag is a key-value pair. A tag key must be accompanied by a tag value, although null is accepted. Available for Valkey and Redis OSS only.
        user-group-id: The ID of the user group.
        user-ids: The list of user IDs that belong to the user group.
