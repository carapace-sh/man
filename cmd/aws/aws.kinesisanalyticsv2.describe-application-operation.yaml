name: describe-application-operation
description: Provides a detailed description of a specified application operation.
flags:
    --application-name=!: ""
    --operation-id=!: ""
documentation:
    command: |-
        Provides a detailed description of a specified application operation. To see a list of all the operations of an application, invoke the [ListApplicationOperations]() operation.

        This operation is supported only for Managed Service for Apache Flink.
    flag:
        application-name: ""
        operation-id: ""
