name: get-marketplace-resource
description: Verify the subscription and perform resource dependency checks on the requested Amazon Web Services Marketplace resource.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-arn=!: The Amazon Resource Name (ARN) that uniquely identifies an Amazon Web Services Marketplace resource.
    --resource-location=: The bucket path that you can specify to download the resource from Amazon S3.
    --resource-type=!: Specifies which type of Amazon Web Services Marketplace resource Image Builder retrieves.
completion:
    flag:
        resource-type:
            - COMPONENT_DATA
            - COMPONENT_ARTIFACT
documentation:
    command: Verify the subscription and perform resource dependency checks on the requested Amazon Web Services Marketplace resource. For Amazon Web Services Marketplace components, the response contains fields to download the components and their artifacts.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
