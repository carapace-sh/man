name: update-template-sync-config
description: Update template sync configuration parameters, except for the `templateName` and `templateType`.
flags:
    --branch=!: The repository branch for your template.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --repository-name=!: The repository name (for example, `myrepos/myrepo`).
    --repository-provider=!: The repository provider.
    --subdirectory=: A subdirectory path to your template bundle version.
    --template-name=!: The synced template name.
    --template-type=!: The synced template type.
completion:
    flag:
        repository-provider:
            - GITHUB
            - GITHUB_ENTERPRISE
            - BITBUCKET
        template-type:
            - ENVIRONMENT
            - SERVICE
documentation:
    command: Update template sync configuration parameters, except for the `templateName` and `templateType`. Repository details (branch, name, and provider) should be of a linked repository. A linked repository is a repository that has been registered with Proton. For more information, see [CreateRepository]().
    flag:
        branch: The repository branch for your template.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        repository-name: The repository name (for example, `myrepos/myrepo`).
        repository-provider: The repository provider.
        subdirectory: A subdirectory path to your template bundle version. When included, limits the template bundle search to this repository directory.
        template-name: The synced template name.
        template-type: The synced template type.
