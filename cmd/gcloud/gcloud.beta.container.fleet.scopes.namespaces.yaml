name: namespaces
description: '*(BETA)*  Fleet namespaces are the fleet equivalent of k8s cluster namespaces.'
documentation:
    command: |-
        *(BETA)*  This command group allows for manipulation of fleet namespaces.

        ## EXAMPLES

        Manage fleet namespaces:

          $ gcloud beta container fleet scopes namespaces --help

        Manage RBAC RoleBindings in a fleet namespace:

          $ gcloud beta container fleet scopes namespaces rbacrolebindings --help
