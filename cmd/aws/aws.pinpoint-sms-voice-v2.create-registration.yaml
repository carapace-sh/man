name: create-registration
description: Creates a new registration based on the **RegistrationType** field.
flags:
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --registration-type=!: The type of registration form to create.
    --tags=: An array of tags (key and value pairs) to associate with the registration.
documentation:
    command: Creates a new registration based on the **RegistrationType** field.
    flag:
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you don't specify a client token, a randomly generated token is used for the request to ensure idempotency.
        registration-type: The type of registration form to create. The list of **RegistrationTypes** can be found using the [DescribeRegistrationTypeDefinitions]() action.
        tags: An array of tags (key and value pairs) to associate with the registration.
