name: create-generated-template
description: Creates a template from existing resources that are not already managed with CloudFormation.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --generated-template-name=!: The name assigned to the generated template.
    --resources=: An optional list of resources to be included in the generated template.
    --stack-name=: An optional name or ARN of a stack to use as the base stack for the generated template.
    --template-configuration=: The configuration details of the generated template, including the `DeletionPolicy` and `UpdateReplacePolicy`.
documentation:
    command: Creates a template from existing resources that are not already managed with CloudFormation. You can check the status of the template generation using the `DescribeGeneratedTemplate` API action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generated-template-name: The name assigned to the generated template.
        resources: |-
            An optional list of resources to be included in the generated template.

            If no resources are specified,the template will be created without any resources. Resources can be added to the template using the `UpdateGeneratedTemplate` API action.
        stack-name: An optional name or ARN of a stack to use as the base stack for the generated template.
        template-configuration: The configuration details of the generated template, including the `DeletionPolicy` and `UpdateReplacePolicy`.
