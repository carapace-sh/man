name: update
description: Update a Secure Source Manager repository.
flags:
    --description=: Description of the repository.
    --no-validate-only&: If set to true, the request is validated and the user is provided with an expected result, but no actual change is made.
    --region=: Secure Source Manager location.
    --validate-only: If set to true, the request is validated and the user is provided with an expected result, but no actual change is made.
documentation:
    command: |
        Update a Secure Source Manager repository.
    flag:
        description: Description of the repository. Cannot exceed 500 characters.
        no-validate-only: If set to true, the request is validated and the user is provided with an expected result, but no actual change is made.
        region: |-
            Secure Source Manager location.
            +
            To set the `region` attribute:
            * provide the argument `repository` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        validate-only: If set to true, the request is validated and the user is provided with an expected result, but no actual change is made.
