name: update
description: '*(BETA)*  Update a fleet scope RBAC RoleBinding.'
flags:
    --clear-labels: Remove all labels.
    --custom-role=: Custom role to assign to principal.
    --group=: Group for the RBACRoleBinding to update to.
    --location=: Location for the rbacrolebinding.
    --no-clear-labels&: Remove all labels.
    --remove-labels=: List of label keys to remove.
    --role=: Predefined role to assign to principal (admin, edit, view).
    --scope=: Name of the rbacrolebinding.
    --update-labels=: List of label KEY=VALUE pairs to update.
    --user=: User for the RBACRoleBinding to update to.
completion:
    flag:
        role:
            - admin
            - edit
            - view
documentation:
    command: |-
        *(BETA)*  This command can fail for the following reasons:
        * The RoleBinding does not exist in the project.
        * The caller does not have permission to access the RoleBinding.

        ## EXAMPLES

        To update the RBAC RoleBinding `RBRB` in scope `SCOPE` in the active
        project to the `viewer` role:

          $ gcloud beta container fleet scopes rbacrolebindings update RBRB --scope=SCOPE --role=viewer

        To update the RBAC RoleBinding `RBRB` in scope `SCOPE` in the active
        project to the custom role `custom-role`:

          $ gcloud beta container fleet scopes rbacrolebindings update RBRB --scope=SCOPE --custom-role=custom-role

        To update the RBAC RoleBinding `RBRB` in scope `SCOPE` in the active
        project to the user `someone@google.com`:

          $ gcloud beta container fleet scopes rbacrolebindings update RBRB --scope=SCOPE --user=someone@google.com
    flag:
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        custom-role: Custom role to assign to principal.
        group: Group for the RBACRoleBinding to update to.
        location: |-
            Location for the rbacrolebinding.
            +
            To set the `location` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        role: 'Predefined role to assign to principal (admin, edit, view). _ROLE_ must be one of: *admin*, *edit*, *view*.'
        scope: |-
            Name of the rbacrolebinding.
            +
            To set the `scope` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--scope` on the command line.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        user: User for the RBACRoleBinding to update to.
