name: update-ip-set
description: Updates the IPSet specified by the IPSet ID.
flags:
    --activate: The updated Boolean value that specifies whether the IPSet is active or not.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --detector-id=!: The detectorID that specifies the GuardDuty service whose IPSet you want to update.
    --expected-bucket-owner=: The Amazon Web Services account ID that owns the Amazon S3 bucket specified in the **location** parameter.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip-set-id=!: The unique ID that specifies the IPSet that you want to update.
    --location=: The updated URI of the file that contains the IPSet.
    --name=: The unique ID that specifies the IPSet that you want to update.
    --no-activate: The updated Boolean value that specifies whether the IPSet is active or not.
documentation:
    command: Updates the IPSet specified by the IPSet ID.
    flag:
        activate: The updated Boolean value that specifies whether the IPSet is active or not.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        detector-id: |-
            The detectorID that specifies the GuardDuty service whose IPSet you want to update.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        expected-bucket-owner: The Amazon Web Services account ID that owns the Amazon S3 bucket specified in the **location** parameter.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip-set-id: The unique ID that specifies the IPSet that you want to update.
        location: The updated URI of the file that contains the IPSet.
        name: The unique ID that specifies the IPSet that you want to update.
