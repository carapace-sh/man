name: untag-resource
description: Detaches a key-value pair from a resource, as identified by its Amazon Resource Name (ARN).
flags:
    --resource-arn=!: The value of the resource that will have the tag removed.
    --tag-keys=!: TagKeys are key-value pairs assigned to ARNs that can be used to group and search for resources by type.
documentation:
    command: Detaches a key-value pair from a resource, as identified by its Amazon Resource Name (ARN). Resources are users, servers, roles, and other entities.
    flag:
        resource-arn: The value of the resource that will have the tag removed. An Amazon Resource Name (ARN) is an identifier for a specific AWS resource, such as a server, user, or role.
        tag-keys: TagKeys are key-value pairs assigned to ARNs that can be used to group and search for resources by type. This metadata can be attached to resources for any purpose.
