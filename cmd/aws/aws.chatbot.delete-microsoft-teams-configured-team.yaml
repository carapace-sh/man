name: delete-microsoft-teams-configured-team
description: Deletes the Microsoft Teams team authorization allowing for channels to be configured in that Microsoft Teams team.
flags:
    --team-id=!: The ID of the Microsoft Teams team authorized with AWS Chatbot.
documentation:
    command: Deletes the Microsoft Teams team authorization allowing for channels to be configured in that Microsoft Teams team. Note that the Microsoft Teams team must have no channels configured to remove it.
    flag:
        team-id: |-
            The ID of the Microsoft Teams team authorized with AWS Chatbot.

            To get the team ID, you must perform the initial authorization flow with Microsoft Teams in the AWS Chatbot console. Then you can copy and paste the team ID from the console. For more information, see [Step 1: Configure a Microsoft Teams client](https://docs.aws.amazon.com/chatbot/latest/adminguide/teams-setup.html#teams-client-setup) in the *AWS Chatbot Administrator Guide*.
