name: describe
description: '*(ALPHA)*  Describe an Apphub application service.'
flags:
    --application=: Name for the application
    --location=: The Cloud location for the service.
documentation:
    command: '*(ALPHA)*  Describe an Apphub application service.'
    flag:
        application: |-
            Name for the application
            +
            To set the `application` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--application` on the command line.
        location: |-
            The Cloud location for the service.
            +
            To set the `location` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
