name: create-certificate-provider
description: Creates an Amazon Web Services IoT Core certificate provider.
flags:
    --account-default-for-operations=!: A list of the operations that the certificate provider will use to generate certificates.
    --certificate-provider-name=!: The name of the certificate provider.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A string that you can optionally pass in the `CreateCertificateProvider` request to make sure the request is idempotent.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --lambda-function-arn=!: The ARN of the Lambda function that defines the authentication logic.
    --tags=: Metadata which can be used to manage the certificate provider.
documentation:
    command: |-
        Creates an Amazon Web Services IoT Core certificate provider. You can use Amazon Web Services IoT Core certificate provider to customize how to sign a certificate signing request (CSR) in IoT fleet provisioning. For more information, see [Customizing certificate signing using Amazon Web Services IoT Core certificate provider](https://docs.aws.amazon.com/iot/latest/developerguide/provisioning-cert-provider.html) from *Amazon Web Services IoT Core Developer Guide*.

        Requires permission to access the [CreateCertificateProvider](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.

        After you create a certificate provider, the behavior of [`CreateCertificateFromCsr` API for fleet provisioning](https://docs.aws.amazon.com/iot/latest/developerguide/fleet-provision-api.html#create-cert-csr) will change and all API calls to `CreateCertificateFromCsr` will invoke the certificate provider to create the certificates. It can take up to a few minutes for this behavior to change after a certificate provider is created.
    flag:
        account-default-for-operations: 'A list of the operations that the certificate provider will use to generate certificates. Valid value: `CreateCertificateFromCsr`.'
        certificate-provider-name: The name of the certificate provider.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A string that you can optionally pass in the `CreateCertificateProvider` request to make sure the request is idempotent.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        lambda-function-arn: The ARN of the Lambda function that defines the authentication logic.
        tags: Metadata which can be used to manage the certificate provider.
