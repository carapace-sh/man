name: start-failback-launch
description: Initiates a Job for launching the machine that is being failed back to from the specified Recovery Instance.
flags:
    --recovery-instance-ids=!: The IDs of the Recovery Instance whose failback launch we want to request.
    --tags=: The tags to be associated with the failback launch Job.
documentation:
    command: Initiates a Job for launching the machine that is being failed back to from the specified Recovery Instance. This will run conversion on the failback client and will reboot your machine, thus completing the failback process.
    flag:
        recovery-instance-ids: The IDs of the Recovery Instance whose failback launch we want to request.
        tags: The tags to be associated with the failback launch Job.
