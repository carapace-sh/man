name: reset-cluster-parameter-group
description: Sets one or more parameters of the specified parameter group to their default values and sets the source values of the parameters to "engine-default".
flags:
    --no-reset-all-parameters: If `true`, all parameters in the specified parameter group will be reset to their default values.
    --parameter-group-name=!: The name of the cluster parameter group to be reset.
    --parameters=: An array of names of parameters to be reset.
    --reset-all-parameters: If `true`, all parameters in the specified parameter group will be reset to their default values.
documentation:
    command: Sets one or more parameters of the specified parameter group to their default values and sets the source values of the parameters to "engine-default". To reset the entire parameter group specify the *ResetAllParameters* parameter. For parameter changes to take effect you must reboot any associated clusters.
    flag:
        parameter-group-name: The name of the cluster parameter group to be reset.
        parameters: |-
            An array of names of parameters to be reset. If *ResetAllParameters* option is not used, then at least one parameter name must be supplied.

            Constraints: A maximum of 20 parameters can be reset in a single request.
        reset-all-parameters: |-
            If `true`, all parameters in the specified parameter group will be reset to their default values.

            Default: `true`
