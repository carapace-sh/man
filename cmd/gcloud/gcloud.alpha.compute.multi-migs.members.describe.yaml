name: describe
description: '*(ALPHA)*  Describe a member of a multi-MIG.'
hidden: true
flags:
    --multi-mig=: The name of the Google Compute Multi-MIG.
    --region=: The name of the Google Compute Engine region.
documentation:
    command: '*(ALPHA)*  Describe a member of a multi-MIG.'
    flag:
        multi-mig: |-
            The name of the Google Compute Multi-MIG.
            +
            To set the `multi-mig` attribute:
            * provide the argument `member` on the command line with a fully specified name;
            * provide the argument `--multi-mig` on the command line.
        region: |-
            The name of the Google Compute Engine region.
            +
            Overrides the default compute/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `member` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `compute/region`.
