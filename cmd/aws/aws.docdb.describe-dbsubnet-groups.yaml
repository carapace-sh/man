name: describe-dbsubnet-groups
description: Returns a list of `DBSubnetGroup` descriptions.
flags:
    --dbsubnet-group-name=: The name of the subnet group to return details for.
    --filters=: This parameter is not currently supported.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: Returns a list of `DBSubnetGroup` descriptions. If a `DBSubnetGroupName` is specified, the list will contain only the descriptions of the specified `DBSubnetGroup`.
    flag:
        dbsubnet-group-name: The name of the subnet group to return details for.
        filters: This parameter is not currently supported.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token (marker) is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: Minimum 20, maximum 100.
