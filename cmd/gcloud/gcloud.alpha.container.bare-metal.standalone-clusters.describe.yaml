name: describe
description: '*(ALPHA)*  Describe an Anthos on bare metal standalone cluster.'
flags:
    --location=: Google Cloud location for the standalone_cluster.
documentation:
    command: '*(ALPHA)*  Describe an Anthos on bare metal standalone cluster.'
    flag:
        location: |-
            Google Cloud location for the standalone_cluster.
            +
            To set the `location` attribute:
            * provide the argument `standalone_cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
