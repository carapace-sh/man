name: create
description: Create a Database Migration Service conversion workspace.
flags:
    --destination-database-engine=!: Destination database engine type.
    --destination-database-provider=: Destination database provider.
    --destination-database-version=: Version number for the database engine.
    --display-name=: A user-friendly name for the conversion workspace.
    --global-settings=: A generic list of settings for the workspace.
    --no-async: Waits for the operation in progress to complete before returning.
    --region=: The Cloud region for the conversion_workspace.
    --source-database-engine=!: Source database engine type.
    --source-database-provider=: Source database provider.
    --source-database-version=: Version number for the database engine.
completion:
    flag:
        destination-database-engine:
            - POSTGRESQL
        destination-database-provider:
            - ALLOYDB
            - CLOUDSQL
        source-database-engine:
            - ORACLE
            - SQL_SERVER
        source-database-provider:
            - AMAZON_RDS
            - AZURE_MANAGED_INSTANCE
            - AZURE_SQL_DATABASE
            - CLOUDSQL
            - UNSPECIFIED
documentation:
    command: |
        Create a Database Migration Service conversion workspace.
    flag:
        destination-database-engine: 'Destination database engine type. _DESTINATION_DATABASE_ENGINE_ must be (only one value is supported): *POSTGRESQL*.'
        destination-database-provider: 'Destination database provider. _DESTINATION_DATABASE_PROVIDER_ must be one of: *ALLOYDB*, *CLOUDSQL*.'
        destination-database-version: |-
            Version number for the database engine.
            The version number must contain numbers and letters only.
            Example for PostgreSQL 17.0, version number will be 17.0.
        display-name: |-
            A user-friendly name for the conversion workspace. The display name can
            include letters, numbers, spaces, and hyphens, and must start with a letter.
            The maximum length allowed is 60 characters.
        global-settings: |-
            A generic list of settings for the workspace. The settings are database pair
            dependant and can indicate default behavior for the mapping rules engine or
            turn on or off specific features. An object containing a list of
            "key": "value" pairs.
        no-async: Waits for the operation in progress to complete before returning.
        region: |-
            The Cloud region for the conversion_workspace.
            +
            To set the `region` attribute:
            * provide the argument `conversion_workspace` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        source-database-engine: 'Source database engine type. _SOURCE_DATABASE_ENGINE_ must be one of: *ORACLE*, *SQL_SERVER*.'
        source-database-provider: 'Source database provider. _SOURCE_DATABASE_PROVIDER_ must be one of: *AMAZON_RDS*, *AZURE_MANAGED_INSTANCE*, *AZURE_SQL_DATABASE*, *CLOUDSQL*, *UNSPECIFIED*.'
        source-database-version: |-
            Version number for the database engine.
            The version number must contain numbers and letters only.
            Example for Oracle 21c, version number will be 21c.
