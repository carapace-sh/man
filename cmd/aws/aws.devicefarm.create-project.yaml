name: create-project
description: Creates a project.
flags:
    --default-job-timeout-minutes=: Sets the execution timeout value (in minutes) for a project.
    --name=!: The project's name.
    --vpc-config=: The VPC security groups and subnets that are attached to a project.
documentation:
    command: Creates a project.
    flag:
        default-job-timeout-minutes: Sets the execution timeout value (in minutes) for a project. All test runs in this project use the specified execution timeout value unless overridden when scheduling a run.
        name: The project's name.
        vpc-config: The VPC security groups and subnets that are attached to a project.
