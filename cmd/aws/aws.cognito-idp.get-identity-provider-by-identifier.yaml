name: get-identity-provider-by-identifier
description: Given the identifier of an identity provider (IdP), for example `examplecorp`, returns information about the user pool configuration for that IdP.
flags:
    --idp-identifier=!: The identifier that you assigned to your user pool.
    --user-pool-id=!: The ID of the user pool where you want to get information about the IdP.
documentation:
    command: Given the identifier of an identity provider (IdP), for example `examplecorp`, returns information about the user pool configuration for that IdP. For more information about IdPs, see [Third-party IdP sign-in](https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-identity-federation.html).
    flag:
        idp-identifier: The identifier that you assigned to your user pool. The identifier is an alternative name for an IdP that is distinct from the IdP name. For example, an IdP with a name of `MyIdP` might have an identifier of the email domain `example.com`.
        user-pool-id: The ID of the user pool where you want to get information about the IdP.
