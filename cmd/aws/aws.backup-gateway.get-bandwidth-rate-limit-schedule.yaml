name: get-bandwidth-rate-limit-schedule
description: Retrieves the bandwidth rate limit schedule for a specified gateway.
flags:
    --gateway-arn=!: The Amazon Resource Name (ARN) of the gateway.
documentation:
    command: Retrieves the bandwidth rate limit schedule for a specified gateway. By default, gateways do not have bandwidth rate limit schedules, which means no bandwidth rate limiting is in effect. Use this to get a gateway's bandwidth rate limit schedule.
    flag:
        gateway-arn: The Amazon Resource Name (ARN) of the gateway. Use the [`ListGateways`](https://docs.aws.amazon.com/aws-backup/latest/devguide/API_BGW_ListGateways.html) operation to return a list of gateways for your account and Amazon Web Services Region.
