name: remove-resource-policies
description: '*(ALPHA)*  Remove resource policies from Compute Engine VM instances.'
flags:
    --resource-policies=!: A list of resource policy names to be removed from the instance.
    --zone=: Zone of the instance to remove resource policies from.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute instances remove-resource-policies* removes resource policies from Compute Engine
        virtual instances.

        ## EXAMPLES

        To remove resource policy ``pol1'' from instance ``inst1'', run this:

          $ gcloud alpha compute instances remove-resource-policies inst1 --resource-policies=pol1
    flag:
        resource-policies: A list of resource policy names to be removed from the instance. The policies must exist in the same region as the instance.
        zone: |-
            Zone of the instance to remove resource policies from. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
