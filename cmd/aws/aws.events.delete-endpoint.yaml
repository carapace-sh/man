name: delete-endpoint
description: Delete an existing global endpoint.
flags:
    --name=!: The name of the endpoint you want to delete.
documentation:
    command: Delete an existing global endpoint. For more information about global endpoints, see [Making applications Regional-fault tolerant with global endpoints and event replication](https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-global-endpoints.html) in the *Amazon EventBridge User Guide* .
    flag:
        name: The name of the endpoint you want to delete. For example, `"Name":"us-east-2-custom_bus_A-endpoint"`..
