name: disassociate-resolver-rule
description: Removes the association between a specified Resolver rule and a specified VPC.
flags:
    --resolver-rule-id=!: The ID of the Resolver rule that you want to disassociate from the specified VPC.
    --vpcid=!: The ID of the VPC that you want to disassociate the Resolver rule from.
documentation:
    command: |-
        Removes the association between a specified Resolver rule and a specified VPC.

        If you disassociate a Resolver rule from a VPC, Resolver stops forwarding DNS queries for the domain name that you specified in the Resolver rule.
    flag:
        resolver-rule-id: The ID of the Resolver rule that you want to disassociate from the specified VPC.
        vpcid: The ID of the VPC that you want to disassociate the Resolver rule from.
