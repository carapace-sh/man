name: delete-evaluation-form
description: Deletes an evaluation form in the specified Amazon Connect instance.
flags:
    --evaluation-form-id=!: The unique identifier for the evaluation form.
    --evaluation-form-version=: The unique identifier for the evaluation form.
    --instance-id=!: The identifier of the Amazon Connect instance.
documentation:
    command: |-
        Deletes an evaluation form in the specified Amazon Connect instance.

        - If the version property is provided, only the specified version of the evaluation form is deleted.
        - If no version is provided, then the full form (all versions) is deleted.
    flag:
        evaluation-form-id: The unique identifier for the evaluation form.
        evaluation-form-version: The unique identifier for the evaluation form.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
