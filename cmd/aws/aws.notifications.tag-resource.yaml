name: tag-resource
description: Tags the resource with a tag key and value.
flags:
    --arn=!: The Amazon Resource Name (ARN) to use to tag a resource.
    --tags=!: A map of tags assigned to a resource.
documentation:
    command: |-
        Tags the resource with a tag key and value.

        For more information, see [Tagging your Amazon Web Services resources](https://docs.aws.amazon.com/tag-editor/latest/userguide/tagging.html) in the *Tagging Amazon Web Services Resources User Guide*.

        This is only supported for `NotificationConfigurations`.
    flag:
        arn: The Amazon Resource Name (ARN) to use to tag a resource.
        tags: A map of tags assigned to a resource. A tag is a string-to-string map of key-value pairs.
