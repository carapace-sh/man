name: modify-cache-parameter-group
description: Modifies the parameters of a cache parameter group.
flags:
    --cache-parameter-group-name=!: The name of the cache parameter group to modify.
    --parameter-name-values=!: An array of parameter names and values for the parameter update.
documentation:
    command: Modifies the parameters of a cache parameter group. You can modify up to 20 parameters in a single request by submitting a list parameter name and value pairs.
    flag:
        cache-parameter-group-name: The name of the cache parameter group to modify.
        parameter-name-values: An array of parameter names and values for the parameter update. You must supply at least one parameter name and value; subsequent arguments are optional. A maximum of 20 parameters may be modified per request.
