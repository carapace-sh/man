name: describe-transit-gateway-attachments
description: Describes one or more attachments between resources and transit gateways.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token for the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --transit-gateway-attachment-ids=: The IDs of the attachments.
documentation:
    command: Describes one or more attachments between resources and transit gateways. By default, all attachments are described. Alternatively, you can filter the results by attachment ID, attachment state, resource ID, or resource owner.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters. The possible values are:

            - `association.state` - The state of the association (`associating` | `associated` | `disassociating`).
            - `association.transit-gateway-route-table-id` - The ID of the route table for the transit gateway.
            - `resource-id` - The ID of the resource.
            - `resource-owner-id` - The ID of the Amazon Web Services account that owns the resource.
            - `resource-type` - The resource type. Valid values are `vpc` | `vpn` | `direct-connect-gateway` | `peering` | `connect`.
            - `state` - The state of the attachment. Valid values are `available` | `deleted` | `deleting` | `failed` | `failing` | `initiatingRequest` | `modifying` | `pendingAcceptance` | `pending` | `rollingBack` | `rejected` | `rejecting`.
            - `transit-gateway-attachment-id` - The ID of the attachment.
            - `transit-gateway-id` - The ID of the transit gateway.
            - `transit-gateway-owner-id` - The ID of the Amazon Web Services account that owns the transit gateway.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The token for the next page of results.
        transit-gateway-attachment-ids: The IDs of the attachments.
