name: get-resource-lftags
description: Returns the LF-tags applied to a resource.
flags:
    --catalog-id=: The identifier for the Data Catalog.
    --resource=!: The database, table, or column resource for which you want to return LF-tags.
    --show-assigned-lftags=: Indicates whether to show the assigned LF-tags.
documentation:
    command: Returns the LF-tags applied to a resource.
    flag:
        catalog-id: The identifier for the Data Catalog. By default, the account ID. The Data Catalog is the persistent metadata store. It contains database definitions, table definitions, and other control information to manage your Lake Formation environment.
        resource: The database, table, or column resource for which you want to return LF-tags.
        show-assigned-lftags: Indicates whether to show the assigned LF-tags.
