name: import-client-branding
description: Imports client branding.
flags:
    --device-type-android=: The branding information to import for Android devices.
    --device-type-ios=: The branding information to import for iOS devices.
    --device-type-linux=: The branding information to import for Linux devices.
    --device-type-osx=: The branding information to import for macOS devices.
    --device-type-web=: The branding information to import for web access.
    --device-type-windows=: The branding information to import for Windows devices.
    --resource-id=!: The directory identifier of the WorkSpace for which you want to import client branding.
documentation:
    command: |-
        Imports client branding. Client branding allows you to customize your WorkSpace's client login portal. You can tailor your login portal company logo, the support email address, support link, link to reset password, and a custom message for users trying to sign in.

        After you import client branding, the default branding experience for the specified platform type is replaced with the imported experience

        - You must specify at least one platform type when importing client branding.
        - You can import up to 6 MB of data with each request. If your request exceeds this limit, you can import client branding for different platform types using separate requests.
        - In each platform type, the `SupportEmail` and `SupportLink` parameters are mutually exclusive. You can specify only one parameter for each platform type, but not both.
        - Imported data can take up to a minute to appear in the WorkSpaces client.
    flag:
        device-type-android: The branding information to import for Android devices.
        device-type-ios: The branding information to import for iOS devices.
        device-type-linux: The branding information to import for Linux devices.
        device-type-osx: The branding information to import for macOS devices.
        device-type-web: The branding information to import for web access.
        device-type-windows: The branding information to import for Windows devices.
        resource-id: The directory identifier of the WorkSpace for which you want to import client branding.
