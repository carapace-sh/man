name: create-web-experience
description: Creates an Amazon Q Business web experience.
flags:
    --application-id=!: The identifier of the Amazon Q Business web experience.
    --browser-extension-configuration=: The browser extension configuration for an Amazon Q Business web experience.
    --client-token=: A token you provide to identify a request to create an Amazon Q Business web experience.
    --customization-configuration=: Sets the custom logo, favicon, font, and color used in the Amazon Q web experience.
    --identity-provider-configuration=: Information about the identity provider (IdP) used to authenticate end users of an Amazon Q Business web experience.
    --origins=: Sets the website domain origins that are allowed to embed the Amazon Q Business web experience.
    --role-arn=: The Amazon Resource Name (ARN) of the service role attached to your web experience.
    --sample-prompts-control-mode=: Determines whether sample prompts are enabled in the web experience for an end user.
    --subtitle=: A subtitle to personalize your Amazon Q Business web experience.
    --tags=: A list of key-value pairs that identify or categorize your Amazon Q Business web experience.
    --title=: The title for your Amazon Q Business web experience.
    --welcome-message=: The customized welcome message for end users of an Amazon Q Business web experience.
completion:
    flag:
        sample-prompts-control-mode:
            - ENABLED
            - DISABLED
documentation:
    command: Creates an Amazon Q Business web experience.
    flag:
        application-id: The identifier of the Amazon Q Business web experience.
        browser-extension-configuration: |-
            The browser extension configuration for an Amazon Q Business web experience.

            For Amazon Q Business application using external OIDC-compliant identity providers (IdPs). The IdP administrator must add the browser extension sign-in redirect URLs to the IdP application. For more information, see [Configure external OIDC identity provider for your browser extensions.](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/browser-extensions.html).
        client-token: A token you provide to identify a request to create an Amazon Q Business web experience.
        customization-configuration: Sets the custom logo, favicon, font, and color used in the Amazon Q web experience.
        identity-provider-configuration: Information about the identity provider (IdP) used to authenticate end users of an Amazon Q Business web experience.
        origins: |-
            Sets the website domain origins that are allowed to embed the Amazon Q Business web experience. The *domain origin* refers to the base URL for accessing a website including the protocol (`http/https`), the domain name, and the port number (if specified).

            You must only submit a *base URL* and not a full path. For example, `https://docs.aws.amazon.com`.
        role-arn: |-
            The Amazon Resource Name (ARN) of the service role attached to your web experience.

            The `roleArn` parameter is required when your Amazon Q Business application is created with IAM Identity Center. It is not required for SAML-based applications.
        sample-prompts-control-mode: Determines whether sample prompts are enabled in the web experience for an end user.
        subtitle: A subtitle to personalize your Amazon Q Business web experience.
        tags: 'A list of key-value pairs that identify or categorize your Amazon Q Business web experience. You can also use tags to help control access to the web experience. Tag keys and values can consist of Unicode letters, digits, white space, and any of the following symbols: _ . : / = + - @.'
        title: The title for your Amazon Q Business web experience.
        welcome-message: The customized welcome message for end users of an Amazon Q Business web experience.
