name: update
description: Update a multicast group range.
flags:
    --add-consumer-accept-list=: Add new value to consumer_accept_list list.
    --async: Return immediately, without waiting for the operation in progress to
    --clear-consumer-accept-list: Clear consumer_accept_list value and set to empty list.
    --clear-labels: Remove all labels.
    --consumer-accept-list=: Set consumer_accept_list to new value.
    --description=: The description for the multicast group range.
    --enable-logging: Whether to enable logging for this multicast group range.
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-consumer-accept-list&: Clear consumer_accept_list value and set to empty list.
    --no-clear-labels&: Remove all labels.
    --no-enable-logging&: Whether to enable logging for this multicast group range.
    --no-require-explicit-accept&: Whether an empty consumer accept list will reject all consumer projects.
    --remove-consumer-accept-list=: Remove existing value from consumer_accept_list list.
    --remove-labels=: List of label keys to remove.
    --require-explicit-accept: Whether an empty consumer accept list will reject all consumer projects.
    --update-labels=: List of label KEY=VALUE pairs to update.
documentation:
    command: |
        Update a multicast group range in the specified location of the current project.
    flag:
        add-consumer-accept-list: Add new value to consumer_accept_list list.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-consumer-accept-list: Clear consumer_accept_list value and set to empty list.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        consumer-accept-list: Set consumer_accept_list to new value.
        description: The description for the multicast group range.
        enable-logging: Whether to enable logging for this multicast group range. Use *--enable-logging* to enable and *--no-enable-logging* to disable.
        location: |-
            The location Id.
            +
            To set the `location` attribute:
            * provide the argument `multicast_group_range` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-consumer-accept-list: Clear consumer_accept_list value and set to empty list.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-enable-logging: Whether to enable logging for this multicast group range.
        no-require-explicit-accept: Whether an empty consumer accept list will reject all consumer projects.
        remove-consumer-accept-list: Remove existing value from consumer_accept_list list.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        require-explicit-accept: Whether an empty consumer accept list will reject all consumer projects. Use *--require-explicit-accept* to enable and *--no-require-explicit-accept* to disable.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
