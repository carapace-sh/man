name: update-alias
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Updates properties for an alias.
flags:
    --alias-id=!: A unique identifier for the alias that you want to update.
    --description=: A human-readable description of the alias.
    --name=: A descriptive label that is associated with an alias.
    --routing-strategy=: The routing configuration, including routing type and fleet target, for the alias.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Updates properties for an alias. Specify the unique identifier of the alias to be updated and the new property values.

        When reassigning an alias to a new fleet, provide an updated routing strategy. If successful, the updated alias record is returned.

        **Related actions**

        [All APIs by task](https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets)
    flag:
        alias-id: A unique identifier for the alias that you want to update. You can use either the alias ID or ARN value.
        description: A human-readable description of the alias.
        name: A descriptive label that is associated with an alias. Alias names do not need to be unique.
        routing-strategy: The routing configuration, including routing type and fleet target, for the alias.
