name: convert-application-code
description: Convert the application code.
hidden: true
flags:
    --region=!: ID of the region or fully qualified identifier for the region.
    --source-dialect=!: The source dialect of the code to be converted.
    --source-file=: A file path to the source code which needs to be converted.
    --source-folder=: A folder path to the source code files which needs to be converted.
    --target-dialect=!: The target dialect of the code to be converted.
    --target-path=: Path where the converted code should be written.
documentation:
    command: |
        Convert the provided source code from accessing the source database to
        accessing the destination database.
    flag:
        region: |-
            ID of the region or fully qualified identifier for the region.
            +
            To set the `region` attribute:
            * provide the argument `--region` on the command line.
        source-dialect: The source dialect of the code to be converted. This can only be ORACLE.
        source-file: |-
            A file path to the source code which needs to be converted.
            If the target-path is not specified, the source file is backed up and
            the original file is overwritten with the converted code.
        source-folder: |-
            A folder path to the source code files which needs to be converted.
            If the target-path is not specified, the source file is backed up and
            the original file is overwritten with the converted code.
        target-dialect: The target dialect of the code to be converted. This can only be POSTGRESQL.
        target-path: |-
            Path where the converted code should be written.
            This can be a directory or a file name.
            In case it is a directory, the file name will be the same as the source file.
            If it is not provied, source file is backed up and the original file
            is overwritten with the converted code.
