name: migrate
description: Request for migrating runtimes.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Google Cloud location of this runtime https://cloud.google.com/compute/docs/regions-zones/#locations.
    --network=!: ID of the network or fully qualified identifier for the network.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --post-startup-script-option=: Specifies the behavior of post startup script during migration.
    --service-account=: The service account to be included in the Compute Engine instance of the new Workbench Instance when the Runtime uses single user only mode for permission.
    --subnet-region=: Google Cloud region of this subnetwork https://cloud.google.com/compute/docs/regions-zones/#locations.
    --subnet=!: ID of the subnetwork or fully qualified identifier for the subnetwork.
completion:
    flag:
        post-startup-script-option:
            - POST_STARTUP_SCRIPT_OPTION_UNSPECIFIED
            - POST_STARTUP_SCRIPT_OPTION_SKIP
            - POST_STARTUP_SCRIPT_OPTION_RERUN
documentation:
    command: |
        Request for migrating notebook runtimes.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Google Cloud location of this runtime https://cloud.google.com/compute/docs/regions-zones/#locations.
            +
            To set the `location` attribute:
            * provide the argument `runtime` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `notebooks/location`.
        network: |-
            ID of the network or fully qualified identifier for the network.
            +
            To set the `network` attribute:
            * provide the argument `--network` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        post-startup-script-option: 'Specifies the behavior of post startup script during migration. _POST_STARTUP_SCRIPT_OPTION_ must be one of: *POST_STARTUP_SCRIPT_OPTION_UNSPECIFIED*, *POST_STARTUP_SCRIPT_OPTION_SKIP*, *POST_STARTUP_SCRIPT_OPTION_RERUN*.'
        service-account: The service account to be included in the Compute Engine instance of the new Workbench Instance when the Runtime uses single user only mode for permission. If not specified, the [Compute Engine default service account](https://cloud.google.com/compute/docs/access/service-accounts#default_service_account) is used. When the Runtime uses service account mode for permission, it will reuse the same service account, and this field must be empty.
        subnet: |-
            ID of the subnetwork or fully qualified identifier for the subnetwork.
            +
            To set the `subnet` attribute:
            * provide the argument `--subnet` on the command line.
        subnet-region: |-
            Google Cloud region of this subnetwork https://cloud.google.com/compute/docs/regions-zones/#locations.
            +
            To set the `subnet-region` attribute:
            * provide the argument `--subnet` on the command line with a fully specified name;
            * provide the argument `--subnet-region` on the command line.
