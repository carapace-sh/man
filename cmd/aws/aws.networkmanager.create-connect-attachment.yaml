name: create-connect-attachment
description: Creates a core network Connect attachment from a specified core network attachment.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The client token associated with the request.
    --core-network-id=!: The ID of a core network where you want to create the attachment.
    --edge-location=!: The Region where the edge is located.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --options=!: Options for creating an attachment.
    --routing-policy-label=: The routing policy label to apply to the Connect attachment for traffic routing decisions.
    --tags=: The list of key-value tags associated with the request.
    --transport-attachment-id=!: The ID of the attachment between the two connections.
documentation:
    command: |-
        Creates a core network Connect attachment from a specified core network attachment.

        A core network Connect attachment is a GRE-based tunnel attachment that you can use to establish a connection between a core network and an appliance. A core network Connect attachment uses an existing VPC attachment as the underlying transport mechanism.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The client token associated with the request.
        core-network-id: The ID of a core network where you want to create the attachment.
        edge-location: The Region where the edge is located.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        options: Options for creating an attachment.
        routing-policy-label: The routing policy label to apply to the Connect attachment for traffic routing decisions.
        tags: The list of key-value tags associated with the request.
        transport-attachment-id: The ID of the attachment between the two connections.
