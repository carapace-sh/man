name: abort-document-version-upload
description: Aborts the upload of the specified document version that was previously initiated by [InitiateDocumentVersionUpload]().
flags:
    --authentication-token=: Amazon WorkDocs authentication token.
    --document-id=!: The ID of the document.
    --version-id=!: The ID of the version.
documentation:
    command: Aborts the upload of the specified document version that was previously initiated by [InitiateDocumentVersionUpload](). The client should make this call only when it no longer intends to upload the document version, or fails to do so.
    flag:
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        document-id: The ID of the document.
        version-id: The ID of the version.
