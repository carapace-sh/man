name: detach-thing-principal
description: Detaches the specified principal from the specified thing.
flags:
    --principal=!: If the principal is a certificate, this value must be ARN of the certificate.
    --thing-name=!: The name of the thing.
documentation:
    command: |-
        Detaches the specified principal from the specified thing. A principal can be X.509 certificates, IAM users, groups, and roles, Amazon Cognito identities or federated identities.

        This call is asynchronous. It might take several seconds for the detachment to propagate.

        Requires permission to access the [DetachThingPrincipal](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        principal: If the principal is a certificate, this value must be ARN of the certificate. If the principal is an Amazon Cognito identity, this value must be the ID of the Amazon Cognito identity.
        thing-name: The name of the thing.
