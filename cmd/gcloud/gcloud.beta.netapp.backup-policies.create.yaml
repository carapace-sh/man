name: create
description: '*(BETA)*  Create a Cloud NetApp Backup Policy.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --daily-backup-limit=: Maximum number of daily backups to keep.
    --description=: A description of the Cloud NetApp Backup Policy
    --enabled=: The Boolean value indiciating whether backups are made automatically according to the schedules.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the backup_policy.
    --monthly-backup-limit=: Number of monthly backups to keep.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --weekly-backup-limit=: Number of weekly backups to keep.
documentation:
    command: |
        *(BETA)*  Creates a Backup Policy for Cloud NetApp Volumes.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        daily-backup-limit: |-
            Maximum number of daily backups to keep.
            Note that the minimum daily backup limit is 2.
        description: A description of the Cloud NetApp Backup Policy
        enabled: |-
            The Boolean value indiciating whether backups are made automatically according to the schedules.
                  If enabled, this will be applied to all volumes that have this backup policy attached and enforced on
                  the volume level. If not specified, the default is true.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the backup_policy.
            +
            To set the `location` attribute:
            * provide the argument `backup_policy` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        monthly-backup-limit: |-
            Number of monthly backups to keep.
            Note that the sum of daily, weekly and monthly backups
            should be greater than 1
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        weekly-backup-limit: |-
            Number of weekly backups to keep.
            Note that the sum of daily, weekly and monthly backups
            should be greater than 1
