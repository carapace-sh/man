name: delete-profile-object-type
description: Removes a ProfileObjectType from a specific domain as well as removes all the ProfileObjects of that type.
flags:
    --domain-name=!: The unique name of the domain.
    --object-type-name=!: The name of the profile object type.
documentation:
    command: Removes a ProfileObjectType from a specific domain as well as removes all the ProfileObjects of that type. It also disables integrations from this specific ProfileObjectType. In addition, it scrubs all of the fields of the standard profile that were populated from this ProfileObjectType.
    flag:
        domain-name: The unique name of the domain.
        object-type-name: The name of the profile object type.
