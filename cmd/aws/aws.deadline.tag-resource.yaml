name: tag-resource
description: Tags a resource using the resource's ARN and desired tags.
flags:
    --resource-arn=!: The ARN of the resource to apply tags to.
    --tags=: Each tag consists of a tag key and a tag value.
documentation:
    command: Tags a resource using the resource's ARN and desired tags.
    flag:
        resource-arn: The ARN of the resource to apply tags to.
        tags: Each tag consists of a tag key and a tag value. Tag keys and values are both required, but tag values can be empty strings.
