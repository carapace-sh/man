name: list-domain-names
description: Returns the name of all Elasticsearch domains owned by the current user's account.
flags:
    --engine-type=: Optional parameter to filter the output by domain engine type.
completion:
    flag:
        engine-type:
            - OpenSearch
            - Elasticsearch
documentation:
    command: Returns the name of all Elasticsearch domains owned by the current user's account.
    flag:
        engine-type: Optional parameter to filter the output by domain engine type. Acceptable values are 'Elasticsearch' and 'OpenSearch'.
