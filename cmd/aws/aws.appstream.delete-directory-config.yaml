name: delete-directory-config
description: Deletes the specified Directory Config object from AppStream 2.0.
flags:
    --directory-name=!: The name of the directory configuration.
documentation:
    command: Deletes the specified Directory Config object from AppStream 2.0. This object includes the information required to join streaming instances to an Active Directory domain.
    flag:
        directory-name: The name of the directory configuration.
