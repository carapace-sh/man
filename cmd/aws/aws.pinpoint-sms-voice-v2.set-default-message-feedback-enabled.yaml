name: set-default-message-feedback-enabled
description: Sets a configuration set's default for message feedback.
flags:
    --configuration-set-name=!: The name of the configuration set to use.
    --message-feedback-enabled!: Set to true to enable message feedback.
    --no-message-feedback-enabled!&: Set to true to enable message feedback.
documentation:
    command: Sets a configuration set's default for message feedback.
    flag:
        configuration-set-name: The name of the configuration set to use. This can be either the ConfigurationSetName or ConfigurationSetArn.
        message-feedback-enabled: Set to true to enable message feedback.
