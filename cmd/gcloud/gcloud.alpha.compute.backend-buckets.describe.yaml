name: describe
description: '*(ALPHA)*  Describe a backend bucket.'
flags:
    --global: If set, the backend bucket is global.
    --no-global&: If set, the backend bucket is global.
    --region=: Region of the backend bucket to describe.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute backend-buckets describe* displays all data associated with a backend bucket in a
        project.

        To describe a global backend bucket, run either of the following:

            $ gcloud alpha compute backend-buckets describe my-backend-bucket
              --gcs-bucket-name gcs-bucket-1
              --global

            $ gcloud alpha compute backend-buckets describe my-backend-bucket
              --gcs-bucket-name gcs-bucket-1

        To describe a regional backend bucket, run the following:

            $ gcloud alpha compute backend-buckets describe my-backend-bucket
              --gcs-bucket-name gcs-bucket-1
              --region=us-central1
    flag:
        global: If set, the backend bucket is global.
        no-global: If set, the backend bucket is global.
        region: Region of the backend bucket to describe. Overrides the default *compute/region* property value for this command invocation.
