name: delete
description: '*(ALPHA)*  Delete a Security Command Center notification config.'
flags:
    --api-version=&: ""
    --folder=: Folder where the notification config resides.
    --location=: Required if either data residency is enabled or the `notificationConfig`
    --organization=: Organization where the notification config resides.
completion:
    flag:
        api-version:
            - v1
            - v2enabled
documentation:
    command: |
        *(ALPHA)*  Delete a Security Command Center notification config.

        Notification configs that are created with Security Command Center API V2
        and later include a `location` attribute. If the `location` attribute is
        included in the resource name of a Notification configs, you must specify
        it when referencing the Notification config. For example, the following
        Notification configs name has `location=eu`:
        `organizations/123/locations/eu/notificationConfigs/test-config`.
    flag:
        api-version: |-
            This is a temporary flag to be used for testing the Security Command
            Center v2 api before its launch.
        folder: |-
            Folder where the notification config resides. Formatted as
            ``folders/456'' or just ``456''.
        location: |-
            Required if either data residency is enabled or the `notificationConfig`
            was created by using the API v2.
            +
            If data residency is enabled, specify the Security Command Center location
            in which the notification is stored.
            +
            If data residency is not enabled, include `/locations/```LOCATION'' in the
            full name or specify the `--location flag` only if the
            `notificationConfig` was created by using the Security Command Center API
            v2, in which case, the only valid location is `global`.
        organization: |-
            Organization where the notification config resides. Formatted as
            ``organizations/123'' or just ``123''.
