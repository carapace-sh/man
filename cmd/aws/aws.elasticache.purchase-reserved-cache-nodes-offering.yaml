name: purchase-reserved-cache-nodes-offering
description: Allows you to purchase a reserved cache node offering.
flags:
    --cache-node-count=: The number of cache node instances to reserve.
    --reserved-cache-node-id=: A customer-specified identifier to track this reservation.
    --reserved-cache-nodes-offering-id=!: The ID of the reserved cache node offering to purchase.
    --tags=: A list of tags to be added to this resource.
documentation:
    command: Allows you to purchase a reserved cache node offering. Reserved nodes are not eligible for cancellation and are non-refundable. For more information, see [Managing Costs with Reserved Nodes](https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/reserved-nodes.html).
    flag:
        cache-node-count: |-
            The number of cache node instances to reserve.

            Default: `1`
        reserved-cache-node-id: |-
            A customer-specified identifier to track this reservation.

            The Reserved Cache Node ID is an unique customer-specified identifier to track this reservation. If this parameter is not specified, ElastiCache automatically generates an identifier for the reservation.

            Example: myreservationID
        reserved-cache-nodes-offering-id: |-
            The ID of the reserved cache node offering to purchase.

            Example: `438012d3-4052-4cc7-b2e3-8d3372e0e706`
        tags: A list of tags to be added to this resource. A tag is a key-value pair. A tag key must be accompanied by a tag value, although null is accepted.
