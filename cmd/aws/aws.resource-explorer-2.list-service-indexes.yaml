name: list-service-indexes
description: Lists all Resource Explorer indexes across the specified Amazon Web Services Regions.
flags:
    --max-results=: The maximum number of index results to return in a single response.
    --next-token=: The pagination token from a previous `ListServiceIndexes` response.
    --regions=: A list of Amazon Web Services Regions to include in the search for indexes.
documentation:
    command: Lists all Resource Explorer indexes across the specified Amazon Web Services Regions. This operation returns information about indexes including their ARNs, types, and Regions.
    flag:
        max-results: The maximum number of index results to return in a single response. Valid values are between `1` and `100`.
        next-token: The pagination token from a previous `ListServiceIndexes` response. Use this token to retrieve the next set of results.
        regions: A list of Amazon Web Services Regions to include in the search for indexes. If not specified, indexes from all Regions are returned.
