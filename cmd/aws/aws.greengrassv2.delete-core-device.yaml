name: delete-core-device
description: Deletes a Greengrass core device, which is an IoT thing.
flags:
    --core-device-thing-name=!: The name of the core device.
documentation:
    command: Deletes a Greengrass core device, which is an IoT thing. This operation removes the core device from the list of core devices. This operation doesn't delete the IoT thing. For more information about how to delete the IoT thing, see [DeleteThing](https://docs.aws.amazon.com/iot/latest/apireference/API_DeleteThing.html) in the *IoT API Reference*.
    flag:
        core-device-thing-name: The name of the core device. This is also the name of the IoT thing.
