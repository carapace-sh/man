name: put-evaluations
description: Used by an Lambda function to deliver evaluation results to Config.
flags:
    --evaluations=: The assessments that the Lambda function performs.
    --no-test-mode: Use this parameter to specify a test run for `PutEvaluations`.
    --result-token=!: An encrypted token that associates an evaluation with an Config rule.
    --test-mode: Use this parameter to specify a test run for `PutEvaluations`.
documentation:
    command: Used by an Lambda function to deliver evaluation results to Config. This operation is required in every Lambda function that is invoked by an Config rule.
    flag:
        evaluations: The assessments that the Lambda function performs. Each evaluation identifies an Amazon Web Services resource and indicates whether it complies with the Config rule that invokes the Lambda function.
        result-token: An encrypted token that associates an evaluation with an Config rule. Identifies the rule and the event that triggered the evaluation.
        test-mode: |-
            Use this parameter to specify a test run for `PutEvaluations`. You can verify whether your Lambda function will deliver evaluation results to Config. No updates occur to your existing evaluations, and evaluation results are not sent to Config.

            When `TestMode` is `true`, `PutEvaluations` doesn't require a valid value for the `ResultToken` parameter, but the value cannot be null.
