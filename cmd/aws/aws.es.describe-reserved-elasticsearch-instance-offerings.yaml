name: describe-reserved-elasticsearch-instance-offerings
description: Lists available reserved Elasticsearch instance offerings.
flags:
    --max-results=: Set this value to limit the number of results returned.
    --next-token=: NextToken should be sent in case if earlier API call produced result containing NextToken.
    --reserved-elasticsearch-instance-offering-id=: The offering identifier filter value.
documentation:
    command: Lists available reserved Elasticsearch instance offerings.
    flag:
        max-results: Set this value to limit the number of results returned. If not specified, defaults to 100.
        next-token: NextToken should be sent in case if earlier API call produced result containing NextToken. It is used for pagination.
        reserved-elasticsearch-instance-offering-id: The offering identifier filter value. Use this parameter to show only the available offering that matches the specified reservation identifier.
