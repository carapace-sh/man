name: describe-scheduled-actions
description: Gets information about the scheduled actions that haven't run or that have not reached their end time.
flags:
    --auto-scaling-group-name=: The name of the Auto Scaling group.
    --end-time=: The latest scheduled start time to return.
    --max-records=: The maximum number of items to return with this call.
    --next-token=: The token for the next set of items to return.
    --scheduled-action-names=: The names of one or more scheduled actions.
    --start-time=: The earliest scheduled start time to return.
documentation:
    command: |-
        Gets information about the scheduled actions that haven't run or that have not reached their end time.

        To describe the scaling activities for scheduled actions that have already run, call the [DescribeScalingActivities](https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_DescribeScalingActivities.html) API.
    flag:
        auto-scaling-group-name: The name of the Auto Scaling group.
        end-time: The latest scheduled start time to return. If scheduled action names are provided, this property is ignored.
        max-records: The maximum number of items to return with this call. The default value is `50` and the maximum value is `100`.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        scheduled-action-names: |-
            The names of one or more scheduled actions. If you omit this property, all scheduled actions are described. If you specify an unknown scheduled action, it is ignored with no error.

            Array Members: Maximum number of 50 actions.
        start-time: The earliest scheduled start time to return. If scheduled action names are provided, this property is ignored.
