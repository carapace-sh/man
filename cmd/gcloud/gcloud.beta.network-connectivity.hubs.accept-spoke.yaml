name: accept-spoke
description: '*(BETA)*  Accept a spoke into a hub.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --spoke=!: URI of the spoke to accept
documentation:
    command: |-
        *(BETA)*  Accept a proposed or previously rejected VPC spoke. By accepting a spoke,
        you permit connectivity between the associated VPC network
        and other VPC networks that are attached to the same hub.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        spoke: URI of the spoke to accept
