name: create-state-template
description: Creates a state template.
flags:
    --data-extra-dimensions=: A list of vehicle attributes to associate with the payload published on the state template's MQTT topic.
    --description=: A brief description of the state template.
    --metadata-extra-dimensions=: A list of vehicle attributes to associate with user properties of the messages published on the state template's MQTT topic.
    --name=!: The name of the state template.
    --signal-catalog-arn=!: The ARN of the signal catalog associated with the state template.
    --state-template-properties=!: A list of signals from which data is collected.
    --tags=: Metadata that can be used to manage the state template.
documentation:
    command: |-
        Creates a state template. State templates contain state properties, which are signals that belong to a signal catalog that is synchronized between the Amazon Web Services IoT FleetWise Edge and the Amazon Web Services Cloud.

        Access to certain Amazon Web Services IoT FleetWise features is currently gated. For more information, see [Amazon Web Services Region and feature availability](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/fleetwise-regions.html) in the *Amazon Web Services IoT FleetWise Developer Guide*.
    flag:
        data-extra-dimensions: A list of vehicle attributes to associate with the payload published on the state template's MQTT topic. (See [Processing last known state vehicle data using MQTT messaging](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/process-visualize-data.html#process-last-known-state-vehicle-data)). For example, if you add `Vehicle.Attributes.Make` and `Vehicle.Attributes.Model` attributes, Amazon Web Services IoT FleetWise will enrich the protobuf encoded payload with those attributes in the `extraDimensions` field.
        description: A brief description of the state template.
        metadata-extra-dimensions: |-
            A list of vehicle attributes to associate with user properties of the messages published on the state template's MQTT topic. (See [Processing last known state vehicle data using MQTT messaging](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/process-visualize-data.html#process-last-known-state-vehicle-data)). For example, if you add `Vehicle.Attributes.Make` and `Vehicle.Attributes.Model` attributes, Amazon Web Services IoT FleetWise will include these attributes as User Properties with the MQTT message.

            Default: An empty array
        name: The name of the state template.
        signal-catalog-arn: The ARN of the signal catalog associated with the state template.
        state-template-properties: A list of signals from which data is collected. The state template properties contain the fully qualified names of the signals.
        tags: Metadata that can be used to manage the state template.
