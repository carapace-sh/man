name: describe-document-versions
description: Retrieves the document versions for the specified document.
flags:
    --authentication-token=: Amazon WorkDocs authentication token.
    --document-id=!: The ID of the document.
    --fields=: Specify "SOURCE" to include initialized versions and a URL for the source document.
    --include=: A comma-separated list of values.
    --limit=: The maximum number of versions to return with this call.
    --marker=: The marker for the next set of results.
documentation:
    command: |-
        Retrieves the document versions for the specified document.

        By default, only active versions are returned.
    flag:
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        document-id: The ID of the document.
        fields: Specify "SOURCE" to include initialized versions and a URL for the source document.
        include: A comma-separated list of values. Specify "INITIALIZED" to include incomplete versions.
        limit: The maximum number of versions to return with this call.
        marker: The marker for the next set of results. (You received this marker from a previous call.)
