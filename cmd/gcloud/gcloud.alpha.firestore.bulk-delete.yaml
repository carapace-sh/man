name: bulk-delete
description: '*(ALPHA)*  bulk delete Cloud Firestore documents.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --collection-ids=: List specifying which collection groups will be included in the operation.
    --database=: The database to operate on.
    --namespace-ids=: List specifying which namespaces will be included in the operation.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(ALPHA)*  bulk delete Cloud Firestore documents.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        collection-ids: |-
            List specifying which collection groups will be included in the operation.
            When omitted, all collection groups are included.
            +
            For example, to operate on only the `customers` and `orders`
            collections groups:
            +
              $ {command} --collection-ids='customers','orders'
        database: |-
            The database to operate on. The default value is `(default)`.
            +
            For example, to operate on database `foo`:
            +
              $ {command} --database='foo'
        namespace-ids: |-
            List specifying which namespaces will be included in the operation.
            When omitted, all namespaces are included.
            +
            This is only supported for Datastore Mode databases.
            +
            For example, to operate on only the `customers` and `orders` namespaces:
            +
              $ {command} --namespaces-ids='customers','orders'
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
