name: update-environment
description: Updates the environment description, deploys a new application version, updates the configuration settings to an entirely new configuration template, or updates select configuration option values in the running environment.
flags:
    --application-name=: The name of the application with which the environment is associated.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: If this parameter is specified, AWS Elastic Beanstalk updates the description of this environment.
    --environment-id=: The ID of the environment to update.
    --environment-name=: The name of the environment to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-name=: The name of the group to which the target environment belongs.
    --option-settings=: If specified, AWS Elastic Beanstalk updates the configuration set associated with the running environment and sets the specified configuration options to the requested value.
    --options-to-remove=: A list of custom user-defined configuration options to remove from the configuration set for this environment.
    --platform-arn=: The ARN of the platform, if used.
    --solution-stack-name=: This specifies the platform version that the environment will run after the environment is updated.
    --template-name=: If this parameter is specified, AWS Elastic Beanstalk deploys this configuration template to the environment.
    --tier=: This specifies the tier to use to update the environment.
    --version-label=: If this parameter is specified, AWS Elastic Beanstalk deploys the named application version to the environment.
documentation:
    command: |-
        Updates the environment description, deploys a new application version, updates the configuration settings to an entirely new configuration template, or updates select configuration option values in the running environment.

        Attempting to update both the release and configuration is not allowed and AWS Elastic Beanstalk returns an `InvalidParameterCombination` error.

        When updating the configuration settings to a new template or individual settings, a draft configuration is created and [DescribeConfigurationSettings]() for this environment returns two setting descriptions with different `DeploymentStatus` values.
    flag:
        application-name: The name of the application with which the environment is associated.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: If this parameter is specified, AWS Elastic Beanstalk updates the description of this environment.
        environment-id: |-
            The ID of the environment to update.

            If no environment with this ID exists, AWS Elastic Beanstalk returns an `InvalidParameterValue` error.

            Condition: You must specify either this or an EnvironmentName, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
        environment-name: |-
            The name of the environment to update. If no environment with this name exists, AWS Elastic Beanstalk returns an `InvalidParameterValue` error.

            Condition: You must specify either this or an EnvironmentId, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-name: The name of the group to which the target environment belongs. Specify a group name only if the environment's name is specified in an environment manifest and not with the environment name or environment ID parameters. See [Environment Manifest (env.yaml)](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/environment-cfg-manifest.html) for details.
        option-settings: If specified, AWS Elastic Beanstalk updates the configuration set associated with the running environment and sets the specified configuration options to the requested value.
        options-to-remove: A list of custom user-defined configuration options to remove from the configuration set for this environment.
        platform-arn: The ARN of the platform, if used.
        solution-stack-name: This specifies the platform version that the environment will run after the environment is updated.
        template-name: If this parameter is specified, AWS Elastic Beanstalk deploys this configuration template to the environment. If no such configuration template is found, AWS Elastic Beanstalk returns an `InvalidParameterValue` error.
        tier: |-
            This specifies the tier to use to update the environment.

            Condition: At this time, if you change the tier version, name, or type, AWS Elastic Beanstalk returns `InvalidParameterValue` error.
        version-label: If this parameter is specified, AWS Elastic Beanstalk deploys the named application version to the environment. If no such application version is found, returns an `InvalidParameterValue` error.
