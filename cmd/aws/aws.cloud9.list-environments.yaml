name: list-environments
description: Gets a list of Cloud9 development environment identifiers.
flags:
    --max-results=: The maximum number of environments to get identifiers for.
    --next-token=: During a previous call, if there are more than 25 items in the list, only the first 25 items are returned, along with a unique string called a *next token*.
documentation:
    command: |-
        Gets a list of Cloud9 development environment identifiers.

        Cloud9 is no longer available to new customers. Existing customers of Cloud9 can continue to use the service as normal. [Learn more"](http://aws.amazon.com/blogs/devops/how-to-migrate-from-aws-cloud9-to-aws-ide-toolkits-or-aws-cloudshell/)

        Cloud9 is no longer available to new customers. Existing customers of Cloud9 can continue to use the service as normal. [Learn more"](http://aws.amazon.com/blogs/devops/how-to-migrate-from-aws-cloud9-to-aws-ide-toolkits-or-aws-cloudshell/)
    flag:
        max-results: The maximum number of environments to get identifiers for.
        next-token: During a previous call, if there are more than 25 items in the list, only the first 25 items are returned, along with a unique string called a *next token*. To get the next batch of items in the list, call this operation again, adding the next token to the call. To get all of the items in the list, keep calling this operation with each subsequent next token that is returned, until no more next tokens are returned.
