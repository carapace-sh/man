name: reboot-dbshard-group
description: You might need to reboot your DB shard group, usually for maintenance reasons.
flags:
    --dbshard-group-identifier=!: The name of the DB shard group to reboot.
documentation:
    command: |-
        You might need to reboot your DB shard group, usually for maintenance reasons. For example, if you make certain modifications, reboot the DB shard group for the changes to take effect.

        This operation applies only to Aurora Limitless Database DBb shard groups.
    flag:
        dbshard-group-identifier: The name of the DB shard group to reboot.
