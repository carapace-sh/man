name: describe
description: '*(ALPHA)*  Describe an Artifact Registry container image.'
flags:
    --metadata-filter=: Additional filter to fetch metadata for a given qualified image reference.
    --no-show-all-metadata&: Include all metadata in the output.
    --no-show-build-details&: Include build metadata in the output.
    --no-show-deployment&: Include deployment metadata in the output.
    --no-show-image-basis&: Include base image metadata in the output.
    --no-show-package-vulnerability&: Include vulnerability metadata in the output.
    --no-show-provenance&: Include intoto provenance metadata in the output, in the provenance_summary section.
    --no-show-sbom-references&: Include SBOM metadata in the output.
    --show-all-metadata: Include all metadata in the output.
    --show-build-details: Include build metadata in the output.
    --show-deployment: Include deployment metadata in the output.
    --show-image-basis: Include base image metadata in the output.
    --show-package-vulnerability: Include vulnerability metadata in the output.
    --show-provenance: Include intoto provenance metadata in the output, in the provenance_summary section.
    --show-sbom-references: Include SBOM metadata in the output.
documentation:
    command: |-
        *(ALPHA)*  Reference an image by tag or digest using the format:

          LOCATION-docker.pkg.dev/PROJECT-ID/REPOSITORY-ID/IMAGE:tag
          LOCATION-docker.pkg.dev/PROJECT-ID/REPOSITORY-ID/IMAGE@sha256:digest

        This command can fail for the following reasons:
          * The repository format is invalid.
          * The specified image does not exist.
          * The active account does not have permission to run the command
          (`roles/artifactregistry.reader`, `roles/containeranalysis.admin` and
          `roles/serviceusage.serviceUsageViewer`).
    flag:
        metadata-filter: Additional filter to fetch metadata for a given qualified image reference.
        no-show-all-metadata: Include all metadata in the output. Metadata will be grouped by Grafeas kind, with an additional section for intoto provenance metadata.
        no-show-build-details: Include build metadata in the output.
        no-show-deployment: Include deployment metadata in the output.
        no-show-image-basis: Include base image metadata in the output.
        no-show-package-vulnerability: Include vulnerability metadata in the output.
        no-show-provenance: Include intoto provenance metadata in the output, in the provenance_summary section. To see all build metadata in the output, use --show-all-metadata or --show-build-details.
        no-show-sbom-references: Include SBOM metadata in the output.
        show-all-metadata: Include all metadata in the output. Metadata will be grouped by Grafeas kind, with an additional section for intoto provenance metadata.
        show-build-details: Include build metadata in the output.
        show-deployment: Include deployment metadata in the output.
        show-image-basis: Include base image metadata in the output.
        show-package-vulnerability: Include vulnerability metadata in the output.
        show-provenance: Include intoto provenance metadata in the output, in the provenance_summary section. To see all build metadata in the output, use --show-all-metadata or --show-build-details.
        show-sbom-references: Include SBOM metadata in the output.
