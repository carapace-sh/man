name: modify-private-dns-name-options
description: Modifies the options for instance hostnames for the specified instance.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --enable-resource-name-dns-aaaarecord: Indicates whether to respond to DNS queries for instance hostnames with DNS AAAA records.
    --enable-resource-name-dns-arecord: Indicates whether to respond to DNS queries for instance hostnames with DNS A records.
    --instance-id=!: The ID of the instance.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-enable-resource-name-dns-aaaarecord&: Indicates whether to respond to DNS queries for instance hostnames with DNS AAAA records.
    --no-enable-resource-name-dns-arecord&: Indicates whether to respond to DNS queries for instance hostnames with DNS A records.
    --private-dns-hostname-type=: The type of hostname for EC2 instances.
completion:
    flag:
        private-dns-hostname-type:
            - ip-name
            - resource-name
documentation:
    command: Modifies the options for instance hostnames for the specified instance.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        enable-resource-name-dns-aaaarecord: Indicates whether to respond to DNS queries for instance hostnames with DNS AAAA records.
        enable-resource-name-dns-arecord: Indicates whether to respond to DNS queries for instance hostnames with DNS A records.
        instance-id: The ID of the instance.
        private-dns-hostname-type: The type of hostname for EC2 instances. For IPv4 only subnets, an instance DNS name must be based on the instance IPv4 address. For IPv6 only subnets, an instance DNS name must be based on the instance ID. For dual-stack subnets, you can specify whether DNS names use the instance IPv4 address or the instance ID.
