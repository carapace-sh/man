name: create
description: '*(BETA)*  Create a Compute Engine managed instance group resize request.'
flags:
    --instances=: A comma-separated list of instance names.
    --region=: Region of the managed instance group to operate on.
    --requested-run-duration=: The time you need the requested VMs to run before being
    --resize-by=: The number of instances to create with this resize request.
    --resize-request=!: The name of the resize request to create.
    --zone=: Zone of the managed instance group to operate on.
documentation:
    command: '*(BETA)*  Create a Compute Engine managed instance group resize request.'
    flag:
        instances: |-
            A comma-separated list of instance names. The number of names
                    you provide determines the number of instances to create with this
                    resize request. The group's target size increases by this count.
        region: |-
            Region of the managed instance group to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        requested-run-duration: |-
            The time you need the requested VMs to run before being
                    automatically deleted. The value must be formatted as the number of
                    days, hours, minutes, or seconds followed by `d`, `h`, `m`, and `s`
                    respectively. For example, specify `30m` for a duration of 30
                    minutes or `1d2h3m4s` for 1 day, 2 hours, 3 minutes, and 4 seconds.
                    The value must be between `10m` (10 minutes) and `7d` (7 days).
            +
                    If you want the managed instance group to consume a reservation or use
                    FLEX_START provisioning model, then this flag is optional. Otherwise,
                    it's required.
        resize-by: |-
            The number of instances to create with this resize request.
                    Instances have automatically-generated names. The group's target size
                    increases by this number.
        resize-request: The name of the resize request to create.
        zone: |-
            Zone of the managed instance group to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
