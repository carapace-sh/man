name: get-vector-bucket
description: Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.
flags:
    --vector-bucket-arn=: The ARN of the vector bucket to retrieve information about.
    --vector-bucket-name=: The name of the vector bucket to retrieve information about.
documentation:
    command: |-
        Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.

        Returns vector bucket attributes. To specify the bucket, you must use either the vector bucket name or the vector bucket Amazon Resource Name (ARN).

        Permissions

        You must have the `s3vectors:GetVectorBucket` permission to use this operation.
    flag:
        vector-bucket-arn: The ARN of the vector bucket to retrieve information about.
        vector-bucket-name: The name of the vector bucket to retrieve information about.
