name: create
description: Create a Compute Engine unmanaged instance group.
flags:
    --description=: Specifies a textual description for the unmanaged instance group.
    --zone=: Zone of the instance group to create.
documentation:
    command: |-
        *gcloud compute instance-groups unmanaged create* creates a new Compute Engine unmanaged
        instance group.
        For example:

          $ gcloud compute instance-groups unmanaged create example-instance-group --zone us-central1-a

        The above example creates one unmanaged instance group called
        'example-instance-group' in the ``us-central1-a'' zone.
    flag:
        description: Specifies a textual description for the unmanaged instance group.
        zone: |-
            Zone of the instance group to create. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
