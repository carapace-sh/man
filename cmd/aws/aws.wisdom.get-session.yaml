name: get-session
description: Retrieves information for a specified session.
flags:
    --assistant-id=!: The identifier of the Wisdom assistant.
    --session-id=!: The identifier of the session.
documentation:
    command: Retrieves information for a specified session.
    flag:
        assistant-id: The identifier of the Wisdom assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
        session-id: The identifier of the session. Can be either the ID or the ARN. URLs cannot contain the ARN.
