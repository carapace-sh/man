name: list-volume-initiators
description: Lists iSCSI initiators that are connected to a volume.
flags:
    --volume-arn=!: The Amazon Resource Name (ARN) of the volume.
documentation:
    command: Lists iSCSI initiators that are connected to a volume. You can use this operation to determine whether a volume is being used or not. This operation is only supported in the cached volume and stored volume gateway types.
    flag:
        volume-arn: The Amazon Resource Name (ARN) of the volume. Use the [ListVolumes]() operation to return a list of gateway volumes for the gateway.
