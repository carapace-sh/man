name: restore
description: '*(ALPHA)*  Restore an AutonomousDatabase.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location id of the autonomousDatabase resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --restore-time=!: The time and date to restore the database to.
documentation:
    command: '*(ALPHA)*  Restore an AutonomousDatabase to the state at specified restore-time.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location id of the autonomousDatabase resource.
            +
            To set the `location` attribute:
            * provide the argument `autonomous_database` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        restore-time: The time and date to restore the database to.
