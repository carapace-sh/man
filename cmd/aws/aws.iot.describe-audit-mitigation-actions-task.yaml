name: describe-audit-mitigation-actions-task
description: Gets information about an audit mitigation task that is used to apply mitigation actions to a set of audit findings.
flags:
    --task-id=!: The unique identifier for the audit mitigation task.
documentation:
    command: Gets information about an audit mitigation task that is used to apply mitigation actions to a set of audit findings. Properties include the actions being applied, the audit checks to which they're being applied, the task status, and aggregated task statistics.
    flag:
        task-id: The unique identifier for the audit mitigation task.
