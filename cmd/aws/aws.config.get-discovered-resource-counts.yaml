name: get-discovered-resource-counts
description: Returns the resource types, the number of each resource type, and the total number of resources that Config is recording in this region for your Amazon Web Services account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit=: The maximum number of [ResourceCount]() objects returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
    --resource-types=: The comma-separated list that specifies the resource types that you want Config to return (for example, `"AWS::EC2::Instance"`, `"AWS::IAM::User"`).
documentation:
    command: "Returns the resource types, the number of each resource type, and the total number of resources that Config is recording in this region for your Amazon Web Services account.\n\n**Example**\n\n1. Config is recording three resource types in the US East (Ohio) Region for your account: 25 EC2 instances, 20 IAM users, and 15 S3 buckets.\n2. You make a call to the `GetDiscoveredResourceCounts` action and specify that you want all resource types.\n3. Config returns the following:\n   \n   - The resource types (EC2 instances, IAM users, and S3 buckets).\n   - The number of each resource type (25, 20, and 15).\n   - The total number of all resources (60).\n\nThe response is paginated. By default, Config lists 100 [ResourceCount]() objects on each page. You can customize this number with the `limit` parameter. The response includes a `nextToken` string. To get the next page of results, run the request again and specify the string for the `nextToken` parameter.\n\nIf you make a call to the [GetDiscoveredResourceCounts]() action, you might not immediately receive resource counts in the following situations:\n\n- You are a new Config customer.\n- You just enabled resource recording.\n\nIt might take a few minutes for Config to record and count your resources. Wait a few minutes and then retry the [GetDiscoveredResourceCounts]() action."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit: The maximum number of [ResourceCount]() objects returned on each page. The default is 100. You cannot specify a number greater than 100. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
        resource-types: |-
            The comma-separated list that specifies the resource types that you want Config to return (for example, `"AWS::EC2::Instance"`, `"AWS::IAM::User"`).

            If a value for `resourceTypes` is not specified, Config returns all resource types that Config is recording in the region for your account.

            If the configuration recorder is turned off, Config returns an empty list of [ResourceCount]() objects. If the configuration recorder is not recording a specific resource type (for example, S3 buckets), that resource type is not returned in the list of [ResourceCount]() objects.
