name: import-notebook
description: Imports a single `ipynb` file to a Spark enabled workgroup.
flags:
    --client-request-token=: A unique case-sensitive string used to ensure the request to import the notebook is idempotent (executes only once).
    --name=!: The name of the notebook to import.
    --notebook-s3-location-uri=: A URI that specifies the Amazon S3 location of a notebook file in `ipynb` format.
    --payload=: The notebook content to be imported.
    --type=!: The notebook content type.
    --work-group=!: The name of the Spark enabled workgroup to import the notebook to.
completion:
    flag:
        type:
            - IPYNB
documentation:
    command: Imports a single `ipynb` file to a Spark enabled workgroup. To import the notebook, the request must specify a value for either `Payload` or `NoteBookS3LocationUri`. If neither is specified or both are specified, an `InvalidRequestException` occurs. The maximum file size that can be imported is 10 megabytes. If an `ipynb` file with the same name already exists in the workgroup, throws an error.
    flag:
        client-request-token: |-
            A unique case-sensitive string used to ensure the request to import the notebook is idempotent (executes only once).

            This token is listed as not required because Amazon Web Services SDKs (for example the Amazon Web Services SDK for Java) auto-generate the token for you. If you are not using the Amazon Web Services SDK or the Amazon Web Services CLI, you must provide this token or the action will fail.
        name: The name of the notebook to import.
        notebook-s3-location-uri: A URI that specifies the Amazon S3 location of a notebook file in `ipynb` format.
        payload: The notebook content to be imported. The payload must be in `ipynb` format.
        type: The notebook content type. Currently, the only valid type is `IPYNB`.
        work-group: The name of the Spark enabled workgroup to import the notebook to.
