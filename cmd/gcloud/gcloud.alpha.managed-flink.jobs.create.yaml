name: create
description: '*(ALPHA)*  Create a Flink job from a Java jar.'
flags:
    --archives=: The extra archives to pass to the job.
    --async: Return immediately after job submission.
    --autotuning-mode=: Selects the autotuning mode for jobs.
    --class=: The main class of the Flink job.
    --deployment=: Deployment to run the job in.
    --dry-run: Return command used to submit a job without invoking API.
    --enable-output: Shows the output of the Flink client.
    --jars=: The extra jars to pass to the job.
    --job-type=: The type of job to run.
    --location=!: The location to run the job in.
    --max-parallelism=: The maximum parallelism of the job when in "elastic" autotuning mode.
    --min-parallelism=: The minimum parallelism of the job when in "elastic" autotuning mode.
    --name=: The name of the job.
    --network-config-subnetwork=: The subnetwork to use for the job.
    --network-config-vpc=: The network to use for the job.
    --no-async&: Return immediately after job submission.
    --no-dry-run&: Return command used to submit a job without invoking API.
    --no-enable-output&: Shows the output of the Flink client.
    --no-show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --parallelism=: The parallelism of the job when in "fixed" autotuning mode.
    --python-venv=: The path to the zip file to manage the virtualenv for Python dependencies.
    --show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --staging-location=!: The Google Cloud Storage staging location for the job.
    --workload-identity=: The workload identity to use for the job.
completion:
    flag:
        autotuning-mode:
            - elastic
            - fixed
        job-type:
            - auto
            - jar
            - python
            - sql
documentation:
    command: '*(ALPHA)*  Create a Flink job from a Java jar.'
    flag:
        archives: The extra archives to pass to the job. Can be a zip file containing resource files for the job.
        async: Return immediately after job submission.
        autotuning-mode: |-
            Selects the autotuning mode for jobs. _AUTOTUNING_MODE_ must be one of:
            +
            *elastic*::: The number of taskmanagers is scaled automatically according to workload.
            *fixed*::: The number of taskmanagers is fixed.
            :::
            +
        class: The main class of the Flink job. Required if the jar file manifest does not contain a main class.
        deployment: Deployment to run the job in.
        dry-run: Return command used to submit a job without invoking API.
        enable-output: Shows the output of the Flink client.
        jars: The extra jars to pass to the job. Can be a jar, python, or sql file.
        job-type: 'The type of job to run. If "auto" will be selected based on the file extension for the job argument. _JOB_TYPE_ must be one of: *auto*, *jar*, *python*, *sql*.'
        location: The location to run the job in.
        max-parallelism: The maximum parallelism of the job when in "elastic" autotuning mode.
        min-parallelism: The minimum parallelism of the job when in "elastic" autotuning mode. This will also be the initial parallelism of the job.
        name: The name of the job. The Flink job name will be used if not set.
        network-config-subnetwork: The subnetwork to use for the job.
        network-config-vpc: The network to use for the job.
        no-async: Return immediately after job submission.
        no-dry-run: Return command used to submit a job without invoking API.
        no-enable-output: Shows the output of the Flink client.
        no-show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        parallelism: The parallelism of the job when in "fixed" autotuning mode.
        python-venv: The path to the zip file to manage the virtualenv for Python dependencies. Required if the job type is python. Must start with gs://.
        show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        staging-location: The Google Cloud Storage staging location for the job. Must start with gs://
        workload-identity: The workload identity to use for the job. Managed Flink Default Workload Identity will be used if not specified.
