name: delete
description: Delete deployments.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --delete-policy=: Policy on how resources actuated by the deployment should be deleted.
    --location=: locations TBD
    --no-async&: Return immediately, without waiting for the operation in progress to
completion:
    flag:
        delete-policy:
            - abandon
            - delete
            - delete-policy-unspecified
documentation:
    command: Delete a deployment
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        delete-policy: |-
            Policy on how resources actuated by the deployment should be deleted. The accepted values are DELETE, ABANDON.
            DELETE = Delete resources actuated by the deployment.
            ABANDON = Abandon resources and only delete deployment metadata. _DELETE_POLICY_ must be one of: *abandon*, *delete*, *delete-policy-unspecified*.
        location: |-
            locations TBD
            +
            To set the `location` attribute:
            * provide the argument `deployment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `infra-manager/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
