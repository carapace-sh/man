name: describe
description: Show details for an Automation.
flags:
    --delivery-pipeline=: The name of the Cloud Deploy delivery pipeline.
    --region=: Location of the automation.
documentation:
    command: Show details for a specified automation.
    flag:
        delivery-pipeline: |-
            The name of the Cloud Deploy delivery pipeline.
            +

            To set the `delivery-pipeline` attribute:
            * provide the argument `automation` on the command line with a fully specified name;
            * provide the argument `--delivery-pipeline` on the command line;
            * set the property `deploy/delivery_pipeline`.
        region: |-
            Location of the automation.
            +

            To set the `region` attribute:
            * provide the argument `automation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
