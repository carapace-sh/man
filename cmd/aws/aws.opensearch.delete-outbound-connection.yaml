name: delete-outbound-connection
description: Allows the source Amazon OpenSearch Service domain owner to delete an existing outbound cross-cluster search connection.
flags:
    --connection-id=!: The ID of the outbound connection you want to permanently delete.
documentation:
    command: Allows the source Amazon OpenSearch Service domain owner to delete an existing outbound cross-cluster search connection. For more information, see [Cross-cluster search for Amazon OpenSearch Service](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cross-cluster-search.html).
    flag:
        connection-id: The ID of the outbound connection you want to permanently delete.
