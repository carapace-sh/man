name: put-keyword
description: Creates or updates a keyword configuration on an origination phone number or pool.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --keyword-action=: The action to perform for the new keyword when it is received.
    --keyword-message=!: The message associated with the keyword.
    --keyword=!: The new keyword to add.
    --origination-identity=!: The origination identity to use such as a PhoneNumberId, PhoneNumberArn, SenderId or SenderIdArn.
completion:
    flag:
        keyword-action:
            - AUTOMATIC_RESPONSE
            - OPT_OUT
            - OPT_IN
documentation:
    command: |-
        Creates or updates a keyword configuration on an origination phone number or pool.

        A keyword is a word that you can search for on a particular phone number or pool. It is also a specific word or phrase that an end user can send to your number to elicit a response, such as an informational message or a special offer. When your number receives a message that begins with a keyword, AWS End User Messaging SMS and Voice responds with a customizable message.

        If you specify a keyword that isn't valid, an error is returned.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        keyword: The new keyword to add.
        keyword-action: |-
            The action to perform for the new keyword when it is received.

            - AUTOMATIC\_RESPONSE: A message is sent to the recipient.
            - OPT\_OUT: Keeps the recipient from receiving future messages.
            - OPT\_IN: The recipient wants to receive future messages.
        keyword-message: The message associated with the keyword.
        origination-identity: |-
            The origination identity to use such as a PhoneNumberId, PhoneNumberArn, SenderId or SenderIdArn. You can use [DescribePhoneNumbers]() get the values for PhoneNumberId and PhoneNumberArn while [DescribeSenderIds]() can be used to get the values for SenderId and SenderIdArn.

            If you are using a shared AWS End User Messaging SMS and Voice resource then you must use the full Amazon Resource Name(ARN).
