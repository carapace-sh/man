name: update
description: Updates gcloud CLI command trees in the installation directory.
hidden: true
flags:
    --commands=: Update only the commands in this list.
    --directory=: Update this directory instead of the default installation directory.
    --force: Force existing CLI trees to be out of date.
    --no-force&: Force existing CLI trees to be out of date.
    --no-skip-completions&: Skip updating the static completion CLI tree.
    --skip-completions: Skip updating the static completion CLI tree.
    --tarball=: For packaging CLI trees.
documentation:
    command: |-
        A CLI tree is a module or JSON file that describes a command and its
        subcommands, flags, arguments, help text and TAB completers.
        *gcloud interactive* uses CLI trees for typeahead, command line completion,
        and as-you-type documentation.

        Most CLI tree files are cached in the *cli* subdirectory of the *gcloud*
        installation root directory. The cache is automatically updated by the
        Cloud SDK installers and the *gcloud components* command group.

        These CLIs are currently supported: {generators}.
    flag:
        commands: Update only the commands in this list.
        directory: Update this directory instead of the default installation directory.
        force: Force existing CLI trees to be out of date. This causes them to be regenerated.
        no-force: Force existing CLI trees to be out of date. This causes them to be regenerated.
        no-skip-completions: Skip updating the static completion CLI tree.
        skip-completions: Skip updating the static completion CLI tree.
        tarball: For packaging CLI trees. --commands specifies one command that is a relative path in this tarball. The tarball is extracted to a temporary directory and the command path is adjusted to point to the temporary directory.
