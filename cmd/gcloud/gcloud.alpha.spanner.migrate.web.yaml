name: web
description: '*(ALPHA)*  Run the web UI assistant for schema migrations.'
flags:
    --dataflow-template=: The google cloud storage path of the minimal downtime migration template to use to run the migration job.
    --log-level=: To configure the log level for the execution (INFO, VERBOSE).
    --no-open&: Open the Spanner migration tool web interface in the default browser.
    --no-show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --open: Open the Spanner migration tool web interface in the default browser.
    --port=: The port in which Spanner migration tool will run, defaults to 8080
    --show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
