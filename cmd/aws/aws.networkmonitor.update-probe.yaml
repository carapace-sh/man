name: update-probe
description: Updates a monitor probe.
flags:
    --destination-port=: The updated port for the probe destination.
    --destination=: The updated IP address for the probe destination.
    --monitor-name=!: The name of the monitor that the probe was updated for.
    --packet-size=: he updated packets size for network traffic between the source and destination.
    --probe-id=!: The ID of the probe to update.
    --protocol=: The updated network protocol for the destination.
    --state=: The state of the probe update.
completion:
    flag:
        protocol:
            - TCP
            - ICMP
        state:
            - PENDING
            - ACTIVE
            - INACTIVE
            - ERROR
            - DELETING
            - DELETED
documentation:
    command: |-
        Updates a monitor probe. This action requires both the `monitorName` and `probeId` parameters. Run `ListMonitors` to get a list of monitor names. Run `GetMonitor` to get a list of probes and probe IDs.

        You can update the following para create a monitor with probes using this command. For each probe, you define the following:

        - `state`—The state of the probe.
        - `destination`— The target destination IP address for the probe.
        - `destinationPort`—Required only if the protocol is `TCP`.
        - `protocol`—The communication protocol between the source and destination. This will be either `TCP` or `ICMP`.
        - `packetSize`—The size of the packets. This must be a number between `56` and `8500`.
        - (Optional) `tags` —Key-value pairs created and assigned to the probe.
    flag:
        destination: The updated IP address for the probe destination. This must be either an IPv4 or IPv6 address.
        destination-port: The updated port for the probe destination. This is required only if the `protocol` is `TCP` and must be a number between `1` and `65536`.
        monitor-name: The name of the monitor that the probe was updated for.
        packet-size: he updated packets size for network traffic between the source and destination. This must be a number between `56` and `8500`.
        probe-id: The ID of the probe to update.
        protocol: The updated network protocol for the destination. This can be either `TCP` or `ICMP`. If the protocol is `TCP`, then `port` is also required.
        state: The state of the probe update.
