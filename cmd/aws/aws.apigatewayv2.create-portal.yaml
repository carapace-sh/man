name: create-portal
description: Creates a portal.
flags:
    --authorization=!: The authentication configuration for the portal.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --endpoint-configuration=!: The domain configuration for the portal.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --included-portal-product-arns=:
        description: The ARNs of the portal products included in the portal.
        nargs: -1
    --logo-uri=: The URI for the portal logo image that is displayed in the portal header.
    --portal-content=!: The content of the portal.
    --rum-app-monitor-name=: The name of the Amazon CloudWatch RUM app monitor for the portal.
    --tags=: The collection of tags.
documentation:
    command: Creates a portal.
    flag:
        authorization: The authentication configuration for the portal.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        endpoint-configuration: The domain configuration for the portal. Use a default domain provided by API Gateway or provide a fully-qualified domain name that you own.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        included-portal-product-arns: The ARNs of the portal products included in the portal.
        logo-uri: The URI for the portal logo image that is displayed in the portal header.
        portal-content: The content of the portal.
        rum-app-monitor-name: The name of the Amazon CloudWatch RUM app monitor for the portal.
        tags: The collection of tags. Each tag element is associated with a given resource.
