name: delete-instance-profile
description: Deletes the specified instance profile.
flags:
    --instance-profile-identifier=!: The identifier of the instance profile to delete.
documentation:
    command: |-
        Deletes the specified instance profile.

        All migration projects associated with the instance profile must be deleted or modified before you can delete the instance profile.
    flag:
        instance-profile-identifier: The identifier of the instance profile to delete.
