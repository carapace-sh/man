name: list-access-points-for-directory-buckets
description: Returns a list of the access points that are owned by the Amazon Web Services account and that are associated with the specified directory bucket.
flags:
    --account-id=!: The Amazon Web Services account ID that owns the access points.
    --directory-bucket=: The name of the directory bucket associated with the access points you want to list.
    --max-results=: The maximum number of access points that you would like returned in the `ListAccessPointsForDirectoryBuckets` response.
    --next-token=: If `NextToken` is returned, there are more access points available than requested in the `maxResults` value.
documentation:
    command: |-
        Returns a list of the access points that are owned by the Amazon Web Services account and that are associated with the specified directory bucket.

        To list access points for general purpose buckets, see [ListAccesspoints](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_ListAccessPoints.html).

        To use this operation, you must have the permission to perform the `s3express:ListAccessPointsForDirectoryBuckets` action.

        For information about REST API errors, see [REST error responses](https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html#RESTErrorResponses).

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The Amazon Web Services account ID that owns the access points.
        directory-bucket: The name of the directory bucket associated with the access points you want to list.
        max-results: The maximum number of access points that you would like returned in the `ListAccessPointsForDirectoryBuckets` response. If the directory bucket is associated with more than this number of access points, the results include the pagination token `NextToken`. Make another call using the `NextToken` to retrieve more results.
        next-token: If `NextToken` is returned, there are more access points available than requested in the `maxResults` value. The value of `NextToken` is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged. Each pagination token expires after 24 hours.
