name: delete-monitor
description: Deletes a specified monitor.
flags:
    --monitor-name=!: The name of the monitor to delete.
documentation:
    command: |-
        Deletes a specified monitor.

        This action requires the `monitorName` parameter. Run `ListMonitors` to get a list of monitor names.
    flag:
        monitor-name: The name of the monitor to delete.
