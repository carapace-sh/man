documentation:
    command: '*(ALPHA)*  Create a validation'
    flag:
        cloud-sql-failover-instance: |-
            The identifying name of the Cloud SQL instance to fail over.
            Formatted like projects/{project_id}/instances/{instance_id}
        description: Optional user-provided description or notes. Min length 0, max length 2000.
        display-name: Human-readable name of the Validation.
        location: |-
            The location id of the validation resource.
            +
            To set the `location` attribute:
            * provide the argument `validation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
