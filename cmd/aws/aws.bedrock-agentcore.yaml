        --variants=!:
            description: The list of variants for the A/B test.
            nargs: -1
      documentation:
        command: Creates an A/B test for comparing agent configurations. A/B tests split traffic between a control variant and a treatment variant through a gateway, then evaluate performance using online evaluation configurations to determine which variant performs better.
