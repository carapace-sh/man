name: update-dataset-group
description: Replaces the datasets in a dataset group with the specified datasets.
flags:
    --dataset-arns=!: An array of the Amazon Resource Names (ARNs) of the datasets to add to the dataset group.
    --dataset-group-arn=!: The ARN of the dataset group.
documentation:
    command: |-
        Replaces the datasets in a dataset group with the specified datasets.

        The `Status` of the dataset group must be `ACTIVE` before you can use the dataset group to create a predictor. Use the [DescribeDatasetGroup](https://docs.aws.amazon.com/forecast/latest/dg/API_DescribeDatasetGroup.html) operation to get the status.
    flag:
        dataset-arns: An array of the Amazon Resource Names (ARNs) of the datasets to add to the dataset group.
        dataset-group-arn: The ARN of the dataset group.
