name: retrieve-tape-archive
description: Retrieves an archived virtual tape from the virtual tape shelf (VTS) to a tape gateway.
flags:
    --gateway-arn=!: The Amazon Resource Name (ARN) of the gateway you want to retrieve the virtual tape to.
    --tape-arn=!: The Amazon Resource Name (ARN) of the virtual tape you want to retrieve from the virtual tape shelf (VTS).
documentation:
    command: |-
        Retrieves an archived virtual tape from the virtual tape shelf (VTS) to a tape gateway. Virtual tapes archived in the VTS are not associated with any gateway. However after a tape is retrieved, it is associated with a gateway, even though it is also listed in the VTS, that is, archive. This operation is only supported in the tape gateway type.

        Once a tape is successfully retrieved to a gateway, it cannot be retrieved again to another gateway. You must archive the tape again before you can retrieve it to another gateway. This operation is only supported in the tape gateway type.
    flag:
        gateway-arn: |-
            The Amazon Resource Name (ARN) of the gateway you want to retrieve the virtual tape to. Use the [ListGateways]() operation to return a list of gateways for your account and Amazon Web Services Region.

            You retrieve archived virtual tapes to only one gateway and the gateway must be a tape gateway.
        tape-arn: The Amazon Resource Name (ARN) of the virtual tape you want to retrieve from the virtual tape shelf (VTS).
