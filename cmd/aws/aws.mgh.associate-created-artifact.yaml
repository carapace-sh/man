name: associate-created-artifact
description: Associates a created artifact of an AWS cloud resource, the target receiving the migration, with the migration task performed by a migration tool.
flags:
    --created-artifact=!: An ARN of the AWS resource related to the migration (e.g., AMI, EC2 instance, RDS instance, etc.)
    --dry-run=: Optional boolean flag to indicate whether any effect should take place.
    --migration-task-name=!: Unique identifier that references the migration task.
    --progress-update-stream=!: The name of the ProgressUpdateStream.
documentation:
    command: |-
        Associates a created artifact of an AWS cloud resource, the target receiving the migration, with the migration task performed by a migration tool. This API has the following traits:

        - Migration tools can call the `AssociateCreatedArtifact` operation to indicate which AWS artifact is associated with a migration task.
        - The created artifact name must be provided in ARN (Amazon Resource Name) format which will contain information about type and region; for example: `arn:aws:ec2:us-east-1:488216288981:image/ami-6d0ba87b`.
        - Examples of the AWS resource behind the created artifact are, AMI's, EC2 instance, or DMS endpoint, etc.
    flag:
        created-artifact: An ARN of the AWS resource related to the migration (e.g., AMI, EC2 instance, RDS instance, etc.)
        dry-run: Optional boolean flag to indicate whether any effect should take place. Used to test if the caller has permission to make the call.
        migration-task-name: Unique identifier that references the migration task. *Do not store personal data in this field.*
        progress-update-stream: The name of the ProgressUpdateStream.
