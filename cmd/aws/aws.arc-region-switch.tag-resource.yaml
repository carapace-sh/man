name: tag-resource
description: Adds or updates tags for a Region switch resource.
flags:
    --arn=!: The Amazon Resource Name (ARN) for a tag that you add to a resource.
    --tags=!: Tags that you add to a resource.
documentation:
    command: Adds or updates tags for a Region switch resource. You can assign metadata to your resources in the form of tags, which are key-value pairs.
    flag:
        arn: The Amazon Resource Name (ARN) for a tag that you add to a resource.
        tags: Tags that you add to a resource. You can add a maximum of 50 tags in Region switch.
