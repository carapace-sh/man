name: delete-project
description: Deletes an Evidently project.
flags:
    --project=!: The name or ARN of the project to delete.
documentation:
    command: Deletes an Evidently project. Before you can delete a project, you must delete all the features that the project contains. To delete a feature, use [DeleteFeature](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_DeleteFeature.html).
    flag:
        project: The name or ARN of the project to delete.
