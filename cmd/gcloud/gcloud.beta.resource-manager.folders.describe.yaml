name: describe
description: '*(BETA)*  Show metadata for a folder.'
documentation:
    command: |-
        *(BETA)*  Shows metadata for a folder, given a valid folder ID.

        This command can fail for the following reasons:
            * The folder specified does not exist.
            * The active account does not have permission to access the given
              folder.

        ## EXAMPLES

        The following command prints metadata for a folder with the ID `3589215982`:

          $ gcloud beta resource-manager folders describe 3589215982
