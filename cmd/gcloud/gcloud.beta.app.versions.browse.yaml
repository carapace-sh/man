name: browse
description: '*(BETA)*  Open the specified versions in a browser.'
flags:
    --launch-browser: Launch a browser if possible.
    --no-launch-browser&: Launch a browser if possible.
    --service=: If specified, only open versions from the given service.
documentation:
    command: '*(BETA)*  Open the specified versions in a browser.'
    flag:
        launch-browser: Launch a browser if possible. When disabled, only displays the URL. Enabled by default, use *--no-launch-browser* to disable.
        no-launch-browser: Launch a browser if possible. When disabled, only displays the URL.
        service: If specified, only open versions from the given service. If not specified, use the default service.
