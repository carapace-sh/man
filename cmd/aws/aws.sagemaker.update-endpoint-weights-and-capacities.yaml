name: update-endpoint-weights-and-capacities
description: Updates variant weight of one or more variants associated with an existing endpoint, or capacity of one variant associated with an existing endpoint.
flags:
    --desired-weights-and-capacities=!: An object that provides new capacity and weight values for a variant.
    --endpoint-name=!: The name of an existing SageMaker endpoint.
documentation:
    command: Updates variant weight of one or more variants associated with an existing endpoint, or capacity of one variant associated with an existing endpoint. When it receives the request, SageMaker sets the endpoint status to `Updating`. After updating the endpoint, it sets the status to `InService`. To check the status of an endpoint, use the [DescribeEndpoint](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_DescribeEndpoint.html) API.
    flag:
        desired-weights-and-capacities: An object that provides new capacity and weight values for a variant.
        endpoint-name: The name of an existing SageMaker endpoint.
