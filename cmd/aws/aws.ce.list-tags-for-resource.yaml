name: list-tags-for-resource
description: Returns a list of resource tags associated with the resource specified by the Amazon Resource Name (ARN).
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
documentation:
    command: Returns a list of resource tags associated with the resource specified by the Amazon Resource Name (ARN).
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource. For a list of supported resources, see [ResourceTag](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_ResourceTag.html).
