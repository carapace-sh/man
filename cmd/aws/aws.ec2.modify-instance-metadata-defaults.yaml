name: modify-instance-metadata-defaults
description: "Modifies the default instance metadata service (IMDS) settings at the account level in the specified Amazon Web Services\L Region."
flags:
    --dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --http-endpoint=: Enables or disables the IMDS endpoint on an instance.
    --http-put-response-hop-limit=: The maximum number of hops that the metadata token can travel.
    --http-tokens=: Indicates whether IMDSv2 is required.
    --instance-metadata-tags=: Enables or disables access to an instance's tags from the instance metadata.
    --no-dry-run&: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
completion:
    flag:
        http-endpoint:
            - disabled
            - enabled
            - no-preference
        http-tokens:
            - optional
            - required
            - no-preference
        instance-metadata-tags:
            - disabled
            - enabled
            - no-preference
documentation:
    command: |-
        Modifies the default instance metadata service (IMDS) settings at the account level in the specified Amazon Web Services          Region.

        To remove a parameter's account-level default setting, specify `no-preference`. If an account-level setting is cleared with `no-preference`, then the instance launch considers the other instance metadata settings. For more information, see [Order of precedence for instance metadata options](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-options.html#instance-metadata-options-order-of-precedence) in the *Amazon EC2 User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        http-endpoint: Enables or disables the IMDS endpoint on an instance. When disabled, the instance metadata can't be accessed.
        http-put-response-hop-limit: |-
            The maximum number of hops that the metadata token can travel. To indicate no preference, specify `-1`.

            Possible values: Integers from `1` to `64`, and `-1` to indicate no preference
        http-tokens: |-
            Indicates whether IMDSv2 is required.

            - `optional` – IMDSv2 is optional, which means that you can use either IMDSv2 or IMDSv1.
            - `required` – IMDSv2 is required, which means that IMDSv1 is disabled, and you must use IMDSv2.
        instance-metadata-tags: Enables or disables access to an instance's tags from the instance metadata. For more information, see [Work with instance tags using the instance metadata](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Using_Tags.html#work-with-tags-in-IMDS) in the *Amazon EC2 User Guide*.
