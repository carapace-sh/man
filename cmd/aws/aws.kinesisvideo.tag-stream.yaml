name: tag-stream
description: Adds one or more tags to a stream.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --stream-arn=: The Amazon Resource Name (ARN) of the resource that you want to add the tag or tags to.
    --stream-name=: The name of the stream that you want to add the tag or tags to.
    --tags=!: A list of tags to associate with the specified stream.
documentation:
    command: |-
        Adds one or more tags to a stream. A *tag* is a key-value pair (the value is optional) that you can define and assign to Amazon Web Services resources. If you specify a tag that already exists, the tag value is replaced with the value that you specify in the request. For more information, see [Using Cost Allocation Tags](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html) in the *Billing and Cost Management and Cost Management User Guide*.

        You must provide either the `StreamName` or the `StreamARN`.

        This operation requires permission for the `KinesisVideo:TagStream` action.

        A Kinesis video stream can support up to 50 tags.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        stream-arn: The Amazon Resource Name (ARN) of the resource that you want to add the tag or tags to.
        stream-name: The name of the stream that you want to add the tag or tags to.
        tags: A list of tags to associate with the specified stream. Each tag is a key-value pair (the value is optional).
