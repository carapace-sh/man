name: create
description: Create a framework.
flags:
    --category=: The category of the framework.
    --cloud-control-details=: The cloud control details that are directly added without any
    --description=: The description of the framework.
    --display-name=: The friendly name of the framework.
    --location=: The location id of the framework resource.
    --organization=: The organization id of the framework resource.
documentation:
    command: |
        Create a framework for a given organization and location.
    flag:
        category: |-
            The category of the framework. _CATEGORY_ must be one of:
            +
            *assured-workloads*::: An Assured Workloads framework.
            *custom-framework*::: A user-created framework.
            *data-security*::: A data security posture framework.
            *google-best-practices*::: A Google's best practices framework.
            *industry-defined-standard*::: An industry-defined framework.
            :::
            +
        cloud-control-details: |-
            The cloud control details that are directly added without any
            grouping in the framework.
            +
            *majorRevisionId*:::
            The major version of the cloud control.
            +
            *name*:::
            The name of the cloud control, in the format
            `organizations/{organization}/locations/{location}/cloudControls/{cloud-control}`.
            The only supported location is `global`.
            +
            *parameters*:::
            Parameters are key-value pairs that let you provide your custom location
            requirements, environment requirements, or other settings that are
            relevant to the cloud control. An example parameter is
            `{"name": "location","value": "us-west-1"}`.
            +
            *name*::::
            The name or key of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --cloud-control-details=majorRevisionId=int,name=string,parameters=[{name=string}] --cloud-control-details=majorRevisionId=int,name=string,parameters=[{name=string}]
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --cloud-control-details='[{"majorRevisionId": int, "name": "string", "parameters": [{"name": "string"}]}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --cloud-control-details=path_to_file.(yaml|json)
            +
            ```
        description: The description of the framework. The maximum length is 2000 characters.
        display-name: The friendly name of the framework. The maximum length is 200 characters.
        location: |-
            The location id of the framework resource.
            +
            To set the `location` attribute:
            * provide the argument `framework` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        organization: |-
            The organization id of the framework resource.
            +
            To set the `organization` attribute:
            * provide the argument `framework` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
