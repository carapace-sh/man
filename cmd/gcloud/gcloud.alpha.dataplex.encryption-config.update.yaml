name: update
description: '*(ALPHA)*  Update an Encryption Config.'
flags:
    --enable-metastore-encryption: Helps user to explicitly enable cmek encryption for dataplex metadata storage.
    --location=: The location of the Dataplex resource.
    --no-enable-metastore-encryption&: Helps user to explicitly enable cmek encryption for dataplex metadata storage.
    --organization=: The name of encryption config to use.
documentation:
    command: '*(ALPHA)*  Update an Encryption Config.'
    flag:
        enable-metastore-encryption: Helps user to explicitly enable cmek encryption for dataplex metadata storage.
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `encryption_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        no-enable-metastore-encryption: Helps user to explicitly enable cmek encryption for dataplex metadata storage.
        organization: |-
            The name of encryption config to use.
            +
            To set the `organization` attribute:
            * provide the argument `encryption_config` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
