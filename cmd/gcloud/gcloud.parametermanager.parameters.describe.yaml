name: describe
description: Gets a single Parameter Manager parameter.
flags:
    --location=: The location id of the parameter resource.
documentation:
    command: |
        Gets a single parameter resource.
    flag:
        location: |-
            The location id of the parameter resource.
            +
            To set the `location` attribute:
            * provide the argument `parameter` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
