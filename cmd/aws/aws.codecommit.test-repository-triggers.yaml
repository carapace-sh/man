name: test-repository-triggers
description: Tests the functionality of repository triggers by sending information to the trigger target.
flags:
    --repository-name=!: The name of the repository in which to test the triggers.
    --triggers=!: The list of triggers to test.
documentation:
    command: Tests the functionality of repository triggers by sending information to the trigger target. If real data is available in the repository, the test sends data from the last commit. If no data is available, sample data is generated.
    flag:
        repository-name: The name of the repository in which to test the triggers.
        triggers: The list of triggers to test.
