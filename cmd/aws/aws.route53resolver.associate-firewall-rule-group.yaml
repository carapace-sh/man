name: associate-firewall-rule-group
description: Associates a [FirewallRuleGroup]() with a VPC, to provide DNS filtering for the VPC.
flags:
    --creator-request-id=!: A unique string that identifies the request and that allows failed requests to be retried without the risk of running the operation twice.
    --firewall-rule-group-id=!: The unique identifier of the firewall rule group.
    --mutation-protection=: If enabled, this setting disallows modification or removal of the association, to help prevent against accidentally altering DNS firewall protections.
    --name=!: A name that lets you identify the association, to manage and use it.
    --priority=!: The setting that determines the processing order of the rule group among the rule groups that you associate with the specified VPC.
    --tags=: A list of the tag keys and values that you want to associate with the rule group association.
    --vpc-id=!: The unique identifier of the VPC that you want to associate with the rule group.
completion:
    flag:
        mutation-protection:
            - ENABLED
            - DISABLED
documentation:
    command: Associates a [FirewallRuleGroup]() with a VPC, to provide DNS filtering for the VPC.
    flag:
        creator-request-id: A unique string that identifies the request and that allows failed requests to be retried without the risk of running the operation twice. `CreatorRequestId` can be any unique string, for example, a date/time stamp.
        firewall-rule-group-id: The unique identifier of the firewall rule group.
        mutation-protection: If enabled, this setting disallows modification or removal of the association, to help prevent against accidentally altering DNS firewall protections. When you create the association, the default setting is `DISABLED`.
        name: A name that lets you identify the association, to manage and use it.
        priority: |-
            The setting that determines the processing order of the rule group among the rule groups that you associate with the specified VPC. DNS Firewall filters VPC traffic starting from the rule group with the lowest numeric priority setting.

            You must specify a unique priority for each rule group that you associate with a single VPC. To make it easier to insert rule groups later, leave space between the numbers, for example, use 101, 200, and so on. You can change the priority setting for a rule group association after you create it.

            The allowed values for `Priority` are between 100 and 9900.
        tags: A list of the tag keys and values that you want to associate with the rule group association.
        vpc-id: The unique identifier of the VPC that you want to associate with the rule group.
