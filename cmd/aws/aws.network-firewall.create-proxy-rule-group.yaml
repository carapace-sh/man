name: create-proxy-rule-group
description: Creates an Network Firewall [ProxyRuleGroup]()
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the proxy rule group.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --proxy-rule-group-name=!: The descriptive name of the proxy rule group.
    --rules=: Individual rules that define match conditions and actions for application-layer traffic.
    --tags=: The key:value pairs to associate with the resource.
documentation:
    command: |-
        Creates an Network Firewall [ProxyRuleGroup]()

        Collections of related proxy filtering rules. Rule groups help you manage and reuse sets of rules across multiple proxy configurations.

        To manage a proxy rule group's tags, use the standard Amazon Web Services resource tagging operations, [ListTagsForResource](), [TagResource](), and [UntagResource]().

        To retrieve information about proxy rule groups, use [ListProxyRuleGroups]() and [DescribeProxyRuleGroup]().

        To retrieve information about individual proxy rules, use [DescribeProxyRuleGroup]() and [DescribeProxyRule]().
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the proxy rule group.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        proxy-rule-group-name: The descriptive name of the proxy rule group. You can't change the name of a proxy rule group after you create it.
        rules: Individual rules that define match conditions and actions for application-layer traffic. Rules specify what to inspect (domains, headers, methods) and what action to take (allow, deny, alert).
        tags: The key:value pairs to associate with the resource.
