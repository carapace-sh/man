name: get-distribution-metric-data
description: Returns the data points of a specific metric for an Amazon Lightsail content delivery network (CDN) distribution.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --distribution-name=!: The name of the distribution for which to get metric data.
    --end-time=!: The end of the time interval for which to get metric data.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metric-name=!: The metric for which you want to return information.
    --period=!: The granularity, in seconds, for the metric data points that will be returned.
    --start-time=!: The start of the time interval for which to get metric data.
    --statistics=!:
        description: The statistic for the metric.
        nargs: -1
    --unit=!: The unit for the metric data request.
completion:
    flag:
        metric-name:
            - Requests
            - BytesDownloaded
            - BytesUploaded
            - TotalErrorRate
            - Http4xxErrorRate
            - Http5xxErrorRate
        unit:
            - Seconds
            - Microseconds
            - Milliseconds
            - Bytes
            - Kilobytes
            - Megabytes
            - Gigabytes
            - Terabytes
            - Bits
            - Kilobits
            - Megabits
            - Gigabits
            - Terabits
            - Percent
            - Count
            - Bytes/Second
            - Kilobytes/Second
            - Megabytes/Second
            - Gigabytes/Second
            - Terabytes/Second
            - Bits/Second
            - Kilobits/Second
            - Megabits/Second
            - Gigabits/Second
            - Terabits/Second
            - Count/Second
            - None
documentation:
    command: |-
        Returns the data points of a specific metric for an Amazon Lightsail content delivery network (CDN) distribution.

        Metrics report the utilization of your resources, and the error counts generated by them. Monitor and collect metric data regularly to maintain the reliability, availability, and performance of your resources.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        distribution-name: |-
            The name of the distribution for which to get metric data.

            Use the `GetDistributions` action to get a list of distribution names that you can specify.
        end-time: "The end of the time interval for which to get metric data.\n\nConstraints:\n\n- Specified in Coordinated Universal Time (UTC).\n- Specified in the Unix time format.\n  \n  For example, if you wish to use an end time of October 1, 2018, at 9 PM UTC, specify `1538427600` as the end time.\n\nYou can convert a human-friendly time to Unix time format using a converter like [Epoch converter](https://www.epochconverter.com/)."
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metric-name: "The metric for which you want to return information.\n\nValid distribution metric names are listed below, along with the most useful `statistics` to include in your request, and the published `unit` value.\n\n- **`Requests`** - The total number of viewer requests received by your Lightsail distribution, for all HTTP methods, and for both HTTP and HTTPS requests.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `None`.\n- **`BytesDownloaded`** - The number of bytes downloaded by viewers for GET, HEAD, and OPTIONS requests.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `None`.\n- **`BytesUploaded`** - The number of bytes uploaded to your origin by your Lightsail distribution, using POST and PUT requests.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `None`.\n- **`TotalErrorRate`** - The percentage of all viewer requests for which the response's HTTP status code was 4xx or 5xx.\n  \n  `Statistics`: The most useful statistic is `Average`.\n  \n  `Unit`: The published unit is `Percent`.\n- **`4xxErrorRate`** - The percentage of all viewer requests for which the response's HTTP status cod was 4xx. In these cases, the client or client viewer may have made an error. For example, a status code of 404 (Not Found) means that the client requested an object that could not be found.\n  \n  `Statistics`: The most useful statistic is `Average`.\n  \n  `Unit`: The published unit is `Percent`.\n- **`5xxErrorRate`** - The percentage of all viewer requests for which the response's HTTP status code was 5xx. In these cases, the origin server did not satisfy the requests. For example, a status code of 503 (Service Unavailable) means that the origin server is currently unavailable.\n  \n  `Statistics`: The most useful statistic is `Average`.\n  \n  `Unit`: The published unit is `Percent`."
        period: The granularity, in seconds, for the metric data points that will be returned.
        start-time: "The start of the time interval for which to get metric data.\n\nConstraints:\n\n- Specified in Coordinated Universal Time (UTC).\n- Specified in the Unix time format.\n  \n  For example, if you wish to use a start time of October 1, 2018, at 8 PM UTC, specify `1538424000` as the start time.\n\nYou can convert a human-friendly time to Unix time format using a converter like [Epoch converter](https://www.epochconverter.com/)."
        statistics: |-
            The statistic for the metric.

            The following statistics are available:

            - `Minimum` - The lowest value observed during the specified period. Use this value to determine low volumes of activity for your application.
            - `Maximum` - The highest value observed during the specified period. Use this value to determine high volumes of activity for your application.
            - `Sum` - All values submitted for the matching metric added together. You can use this statistic to determine the total volume of a metric.
            - `Average` - The value of Sum / SampleCount during the specified period. By comparing this statistic with the Minimum and Maximum values, you can determine the full scope of a metric and how close the average use is to the Minimum and Maximum values. This comparison helps you to know when to increase or decrease your resources.
            - `SampleCount` - The count, or number, of data points used for the statistical calculation.
        unit: |-
            The unit for the metric data request.

            Valid units depend on the metric data being requested. For the valid units with each available metric, see the `metricName` parameter.
