name: start-speaker-search-task
description: Starts a speaker search task.
flags:
    --call-leg=: Specifies which call leg to stream for speaker search.
    --client-request-token=: The unique identifier for the client request.
    --transaction-id=!: The transaction ID of the call being analyzed.
    --voice-connector-id=!: The Voice Connector ID.
    --voice-profile-domain-id=!: The ID of the voice profile domain that will store the voice profile.
completion:
    flag:
        call-leg:
            - Caller
            - Callee
documentation:
    command: |-
        Starts a speaker search task.

        Before starting any speaker search tasks, you must provide all notices and obtain all consents from the speaker as required under applicable privacy and biometrics laws, and as required under the [AWS service terms](https://aws.amazon.com/service-terms/) for the Amazon Chime SDK.
    flag:
        call-leg: Specifies which call leg to stream for speaker search.
        client-request-token: The unique identifier for the client request. Use a different token for different speaker search tasks.
        transaction-id: The transaction ID of the call being analyzed.
        voice-connector-id: The Voice Connector ID.
        voice-profile-domain-id: The ID of the voice profile domain that will store the voice profile.
