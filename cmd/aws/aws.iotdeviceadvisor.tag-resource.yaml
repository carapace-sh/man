name: tag-resource
description: Adds to and modifies existing tags of an IoT Device Advisor resource.
flags:
    --resource-arn=!: The resource ARN of an IoT Device Advisor resource.
    --tags=!: The tags to be attached to the IoT Device Advisor resource.
documentation:
    command: |-
        Adds to and modifies existing tags of an IoT Device Advisor resource.

        Requires permission to access the [TagResource](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        resource-arn: The resource ARN of an IoT Device Advisor resource. This can be SuiteDefinition ARN or SuiteRun ARN.
        tags: The tags to be attached to the IoT Device Advisor resource.
