name: get-bundles
description: Returns the bundles that you can apply to an Amazon Lightsail instance when you create it.
flags:
    --app-category=: Returns a list of bundles that are specific to Lightsail for Research.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-inactive: A Boolean value that indicates whether to include inactive (unavailable) bundles in the response of your request.
    --max-items=: The  total number of items to return in the command's output.
    --no-include-inactive: A Boolean value that indicates whether to include inactive (unavailable) bundles in the response of your request.
    --page-token=: The token to advance to the next page of results from your request.
