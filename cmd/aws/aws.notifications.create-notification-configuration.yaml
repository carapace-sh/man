name: create-notification-configuration
description: Creates a new `NotificationConfiguration`.
flags:
    --aggregation-duration=: The aggregation preference of the `NotificationConfiguration`.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=!: The description of the `NotificationConfiguration`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the `NotificationConfiguration`.
    --tags=: A map of tags assigned to a resource.
completion:
    flag:
        aggregation-duration:
            - LONG
            - SHORT
            - NONE
documentation:
    command: Creates a new `NotificationConfiguration`.
    flag:
        aggregation-duration: "The aggregation preference of the `NotificationConfiguration`.\n\n- Values:\n  \n  - `LONG`\n    \n    - Aggregate notifications for long periods of time (12 hours).\n  - `SHORT`\n    \n    - Aggregate notifications for short periods of time (5 minutes).\n  - `NONE`\n    \n    - Don't aggregate notifications."
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the `NotificationConfiguration`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the `NotificationConfiguration`. Supports RFC 3986's unreserved characters.
        tags: A map of tags assigned to a resource. A tag is a string-to-string map of key-value pairs.
