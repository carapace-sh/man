name: put-access-grants-instance-resource-policy
description: Updates the resource policy of the S3 Access Grants instance.
flags:
    --account-id=!: The Amazon Web Services account ID of the S3 Access Grants instance.
    --organization=: The Organization of the resource policy of the S3 Access Grants instance.
    --policy=!: The resource policy of the S3 Access Grants instance that you are updating.
documentation:
    command: |-
        Updates the resource policy of the S3 Access Grants instance.

        Permissions

        You must have the `s3:PutAccessGrantsInstanceResourcePolicy` permission to use this operation.

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The Amazon Web Services account ID of the S3 Access Grants instance.
        organization: The Organization of the resource policy of the S3 Access Grants instance.
        policy: The resource policy of the S3 Access Grants instance that you are updating.
