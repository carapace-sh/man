name: start-asset-bundle-export-job
description: Starts an Asset Bundle export job.
flags:
    --asset-bundle-export-job-id=!: The ID of the job.
    --aws-account-id=!: The ID of the Amazon Web Services account to export assets from.
    --cloud-formation-override-property-configuration=: An optional collection of structures that generate CloudFormation parameters to override the existing resource property values when the resource is exported to a new CloudFormation template.
    --export-format=!: The export data format.
    --include-all-dependencies: A Boolean that determines whether all dependencies of each resource ARN are recursively exported with the job.
    --include-folder-members=: A setting that indicates whether you want to include folder assets.
    --include-folder-memberships: A Boolean that determines if the exported asset carries over information about the folders that the asset is a member of.
    --include-permissions: A Boolean that determines whether all permissions for each resource ARN are exported with the job.
    --include-tags: A Boolean that determines whether all tags for each resource ARN are exported with the job.
    --no-include-all-dependencies&: A Boolean that determines whether all dependencies of each resource ARN are recursively exported with the job.
    --no-include-folder-memberships&: A Boolean that determines if the exported asset carries over information about the folders that the asset is a member of.
    --no-include-permissions&: A Boolean that determines whether all permissions for each resource ARN are exported with the job.
    --no-include-tags&: A Boolean that determines whether all tags for each resource ARN are exported with the job.
    --resource-arns=!: An array of resource ARNs to export.
    --validation-strategy=: An optional parameter that determines which validation strategy to use for the export job.
completion:
    flag:
        export-format:
            - CLOUDFORMATION_JSON
            - QUICKSIGHT_JSON
        include-folder-members:
            - RECURSE
            - ONE_LEVEL
            - NONE
documentation:
    command: |-
        Starts an Asset Bundle export job.

        An Asset Bundle export job exports specified Amazon Quick Sight assets. You can also choose to export any asset dependencies in the same job. Export jobs run asynchronously and can be polled with a `DescribeAssetBundleExportJob` API call. When a job is successfully completed, a download URL that contains the exported assets is returned. The URL is valid for 5 minutes and can be refreshed with a `DescribeAssetBundleExportJob` API call. Each Amazon Quick Sight account can run up to 5 export jobs concurrently.

        The API caller must have the necessary permissions in their IAM role to access each resource before the resources can be exported.
    flag:
        asset-bundle-export-job-id: The ID of the job. This ID is unique while the job is running. After the job is completed, you can reuse this ID for another job.
        aws-account-id: The ID of the Amazon Web Services account to export assets from.
        cloud-formation-override-property-configuration: |-
            An optional collection of structures that generate CloudFormation parameters to override the existing resource property values when the resource is exported to a new CloudFormation template.

            Use this field if the `ExportFormat` field of a `StartAssetBundleExportJobRequest` API call is set to `CLOUDFORMATION_JSON`.
        export-format: The export data format.
        include-all-dependencies: A Boolean that determines whether all dependencies of each resource ARN are recursively exported with the job. For example, say you provided a Dashboard ARN to the `ResourceArns` parameter. If you set `IncludeAllDependencies` to `TRUE`, any theme, dataset, and data source resource that is a dependency of the dashboard is also exported.
        include-folder-members: A setting that indicates whether you want to include folder assets. You can also use this setting to recusrsively include all subfolders of an exported folder.
        include-folder-memberships: A Boolean that determines if the exported asset carries over information about the folders that the asset is a member of.
        include-permissions: A Boolean that determines whether all permissions for each resource ARN are exported with the job. If you set `IncludePermissions` to `TRUE`, any permissions associated with each resource are exported.
        include-tags: A Boolean that determines whether all tags for each resource ARN are exported with the job. If you set `IncludeTags` to `TRUE`, any tags associated with each resource are exported.
        resource-arns: |-
            An array of resource ARNs to export. The following resources are supported.

            - `Analysis`
            - `Dashboard`
            - `DataSet`
            - `DataSource`
            - `RefreshSchedule`
            - `Theme`
            - `VPCConnection`

            The API caller must have the necessary permissions in their IAM role to access each resource before the resources can be exported.
        validation-strategy: An optional parameter that determines which validation strategy to use for the export job. If `StrictModeForAllResources` is set to `TRUE`, strict validation for every error is enforced. If it is set to `FALSE`, validation is skipped for specific UI errors that are shown as warnings. The default value for `StrictModeForAllResources` is `FALSE`.
