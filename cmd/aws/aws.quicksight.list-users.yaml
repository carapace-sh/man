name: list-users
description: Returns a list of all of the Amazon Quick Sight users belonging to this account.
flags:
    --aws-account-id=!: The ID for the Amazon Web Services account that the user is in.
    --max-results=: The maximum number of results to return from this request.
    --namespace=!: The namespace.
    --next-token=: A pagination token that can be used in a subsequent request.
documentation:
    command: Returns a list of all of the Amazon Quick Sight users belonging to this account.
    flag:
        aws-account-id: The ID for the Amazon Web Services account that the user is in. Currently, you use the ID for the Amazon Web Services account that contains your Amazon Quick Sight account.
        max-results: The maximum number of results to return from this request.
        namespace: The namespace. Currently, you should set this to `default`.
        next-token: A pagination token that can be used in a subsequent request.
