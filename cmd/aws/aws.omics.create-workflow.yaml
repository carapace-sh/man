name: create-workflow
description: Creates a private workflow.
flags:
    --accelerators=: The computational accelerator specified to run the workflow.
    --container-registry-map-uri=: (Optional) URI of the S3 location for the registry mapping file.
    --container-registry-map=: (Optional) Use a container registry map to specify mappings between the ECR private repository and one or more upstream registries.
    --definition-repository=: The repository information for the workflow definition.
    --definition-uri=: The S3 URI of a definition for the workflow.
    --definition-zip=: A ZIP archive containing the main workflow definition file and dependencies that it imports for the workflow.
    --description=: A description for the workflow.
    --engine=: The workflow engine for the workflow.
    --main=: The path of the main definition file for the workflow.
    --name=: Name (optional but highly recommended) for the workflow to locate relevant information in the CloudWatch logs and Amazon Web Services HealthOmics console.
    --parameter-template-path=: The path to the workflow parameter template JSON file within the repository.
    --parameter-template=: A parameter template for the workflow.
    --readme-markdown=: The markdown content for the workflow's README file.
    --readme-path=: The path to the workflow README markdown file within the repository.
    --readme-uri=: The S3 URI of the README file for the workflow.
    --request-id=!: An idempotency token to ensure that duplicate workflows are not created when Amazon Web Services HealthOmics submits retry requests.
    --storage-capacity=: The default static storage capacity (in gibibytes) for runs that use this workflow or workflow version.
    --storage-type=: The default storage type for runs that use this workflow.
    --tags=: Tags for the workflow.
    --workflow-bucket-owner-id=: The Amazon Web Services account ID of the expected owner of the S3 bucket that contains the workflow definition.
completion:
    flag:
        accelerators:
            - GPU
        engine:
            - WDL
            - NEXTFLOW
            - CWL
            - WDL_LENIENT
        storage-type:
            - STATIC
            - DYNAMIC
documentation:
    command: "Creates a private workflow. Before you create a private workflow, you must create and configure these required resources:\n\n- *Workflow definition file:* A workflow definition file written in WDL, Nextflow, or CWL. The workflow definition specifies the inputs and outputs for runs that use the workflow. It also includes specifications for the runs and run tasks for your workflow, including compute and memory requirements. The workflow definition file must be in `.zip` format. For more information, see [Workflow definition files](https://docs.aws.amazon.com/omics/latest/dev/workflow-definition-files.html) in Amazon Web Services HealthOmics.\n  \n  - You can use Amazon Q CLI to build and validate your workflow definition files in WDL, Nextflow, and CWL. For more information, see [Example prompts for Amazon Q CLI](https://docs.aws.amazon.com/omics/latest/dev/getting-started.html#omics-q-prompts) and the [Amazon Web Services HealthOmics Agentic generative AI tutorial](https://github.com/aws-samples/aws-healthomics-tutorials/tree/main/generative-ai) on GitHub.\n- *(Optional) Parameter template file:* A parameter template file written in JSON. Create the file to define the run parameters, or Amazon Web Services HealthOmics generates the parameter template for you. For more information, see [Parameter template files for HealthOmics workflows](https://docs.aws.amazon.com/omics/latest/dev/parameter-templates.html).\n- *ECR container images:* Create container images for the workflow in a private ECR repository, or synchronize images from a supported upstream registry with your Amazon ECR private repository.\n- *(Optional) Sentieon licenses:* Request a Sentieon license to use the Sentieon software in private workflows.\n\nFor more information, see [Creating or updating a private workflow in Amazon Web Services HealthOmics](https://docs.aws.amazon.com/omics/latest/dev/creating-private-workflows.html) in the *Amazon Web Services HealthOmics User Guide*."
    flag:
        accelerators: The computational accelerator specified to run the workflow.
        container-registry-map: (Optional) Use a container registry map to specify mappings between the ECR private repository and one or more upstream registries. For more information, see [Container images](https://docs.aws.amazon.com/omics/latest/dev/workflows-ecr.html) in the *Amazon Web Services HealthOmics User Guide*.
        container-registry-map-uri: (Optional) URI of the S3 location for the registry mapping file.
        definition-repository: The repository information for the workflow definition. This allows you to source your workflow definition directly from a code repository.
        definition-uri: The S3 URI of a definition for the workflow. The S3 bucket must be in the same region as the workflow.
        definition-zip: A ZIP archive containing the main workflow definition file and dependencies that it imports for the workflow. You can use a file with a ://fileb prefix instead of the Base64 string. For more information, see [Workflow definition requirements](https://docs.aws.amazon.com/omics/latest/dev/workflow-defn-requirements.html) in the *Amazon Web Services HealthOmics User Guide*.
        description: A description for the workflow.
        engine: The workflow engine for the workflow. This is only required if you have workflow definition files from more than one engine in your zip file. Otherwise, the service can detect the engine automatically from your workflow definition.
        main: 'The path of the main definition file for the workflow. This parameter is not required if the ZIP archive contains only one workflow definition file, or if the main definition file is named “main”. An example path is: `workflow-definition/main-file.wdl`.'
        name: Name (optional but highly recommended) for the workflow to locate relevant information in the CloudWatch logs and Amazon Web Services HealthOmics console.
        parameter-template: A parameter template for the workflow. If this field is blank, Amazon Web Services HealthOmics will automatically parse the parameter template values from your workflow definition file. To override these service generated default values, provide a parameter template. To view an example of a parameter template, see [Parameter template files](https://docs.aws.amazon.com/omics/latest/dev/parameter-templates.html) in the *Amazon Web Services HealthOmics User Guide*.
        parameter-template-path: The path to the workflow parameter template JSON file within the repository. This file defines the input parameters for runs that use this workflow. If not specified, the workflow will be created without a parameter template.
        readme-markdown: The markdown content for the workflow's README file. This provides documentation and usage information for users of the workflow.
        readme-path: The path to the workflow README markdown file within the repository. This file provides documentation and usage information for the workflow. If not specified, the `README.md` file from the root directory of the repository will be used.
        readme-uri: |-
            The S3 URI of the README file for the workflow. This file provides documentation and usage information for the workflow. Requirements include:

            - The S3 URI must begin with `s3://USER-OWNED-BUCKET/`
            - The requester must have access to the S3 bucket and object.
            - The max README content length is 500 KiB.
        request-id: An idempotency token to ensure that duplicate workflows are not created when Amazon Web Services HealthOmics submits retry requests.
        storage-capacity: The default static storage capacity (in gibibytes) for runs that use this workflow or workflow version. The `storageCapacity` can be overwritten at run time. The storage capacity is not required for runs with a `DYNAMIC` storage type.
        storage-type: The default storage type for runs that use this workflow. The `storageType` can be overridden at run time. `DYNAMIC` storage dynamically scales the storage up or down, based on file system utilization. `STATIC` storage allocates a fixed amount of storage. For more information about dynamic and static storage types, see [Run storage types](https://docs.aws.amazon.com/omics/latest/dev/workflows-run-types.html) in the *Amazon Web Services HealthOmics User Guide*.
        tags: Tags for the workflow. You can define up to 50 tags for the workflow. For more information, see [Adding a tag](https://docs.aws.amazon.com/omics/latest/dev/add-a-tag.html) in the *Amazon Web Services HealthOmics User Guide*.
        workflow-bucket-owner-id: The Amazon Web Services account ID of the expected owner of the S3 bucket that contains the workflow definition. If not specified, the service skips the validation.
