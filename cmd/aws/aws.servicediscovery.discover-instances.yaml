name: discover-instances
description: Discovers registered instances for a specified namespace and service.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --health-status=: The health status of the instances that you want to discover.
    --max-results=: The maximum number of instances that you want Cloud Map to return in the response to a `DiscoverInstances` request.
    --namespace-name=!: The `HttpName` name of the namespace.
    --optional-parameters=: Opportunistic filters to scope the results based on custom attributes.
    --owner-account=: The ID of the Amazon Web Services account that owns the namespace associated with the instance, as specified in the namespace `ResourceOwner` field.
    --query-parameters=: Filters to scope the results based on custom attributes for the instance (for example, `{version=v1, az=1a}`).
    --service-name=!: The name of the service that you specified when you registered the instance.
completion:
    flag:
        health-status:
            - HEALTHY
            - UNHEALTHY
            - ALL
            - HEALTHY_OR_ELSE_ALL
documentation:
    command: Discovers registered instances for a specified namespace and service. You can use `DiscoverInstances` to discover instances for any type of namespace. `DiscoverInstances` returns a randomized list of instances allowing customers to distribute traffic evenly across instances. For public and private DNS namespaces, you can also use DNS queries to discover instances.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        health-status: |-
            The health status of the instances that you want to discover. This parameter is ignored for services that don't have a health check configured, and all instances are returned.

            HEALTHY

            Returns healthy instances.

            UNHEALTHY

            Returns unhealthy instances.

            ALL

            Returns all instances.

            HEALTHY\_OR\_ELSE\_ALL

            Returns healthy instances, unless none are reporting a healthy state. In that case, return all instances. This is also called failing open.
        max-results: The maximum number of instances that you want Cloud Map to return in the response to a `DiscoverInstances` request. If you don't specify a value for `MaxResults`, Cloud Map returns up to 100 instances.
        namespace-name: The `HttpName` name of the namespace. The `HttpName` is found in the `HttpProperties` member of the `Properties` member of the namespace. In most cases, `Name` and `HttpName` match. However, if you reuse `Name` for namespace creation, a generated hash is added to `HttpName` to distinguish the two.
        optional-parameters: Opportunistic filters to scope the results based on custom attributes. If there are instances that match both the filters specified in both the `QueryParameters` parameter and this parameter, all of these instances are returned. Otherwise, the filters are ignored, and only instances that match the filters that are specified in the `QueryParameters` parameter are returned.
        owner-account: The ID of the Amazon Web Services account that owns the namespace associated with the instance, as specified in the namespace `ResourceOwner` field. For instances associated with namespaces that are shared with your account, you must specify an `OwnerAccount`.
        query-parameters: Filters to scope the results based on custom attributes for the instance (for example, `{version=v1, az=1a}`). Only instances that match all the specified key-value pairs are returned.
        service-name: The name of the service that you specified when you registered the instance.
