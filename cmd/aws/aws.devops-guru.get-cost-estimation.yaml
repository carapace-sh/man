name: get-cost-estimation
description: Returns an estimate of the monthly cost for DevOps Guru to analyze your Amazon Web Services resources.
flags:
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
documentation:
    command: Returns an estimate of the monthly cost for DevOps Guru to analyze your Amazon Web Services resources. For more information, see [Estimate your Amazon DevOps Guru costs](https://docs.aws.amazon.com/devops-guru/latest/userguide/cost-estimate.html) and [Amazon DevOps Guru pricing](http://aws.amazon.com/devops-guru/pricing/).
    flag:
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
