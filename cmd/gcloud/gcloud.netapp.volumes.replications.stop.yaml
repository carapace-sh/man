name: stop
description: Stop a Cloud NetApp Volume Replication.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --force: Indicates whether to stop replication forcefully while data transfer is in progress.
    --location=: The location of the replication.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-force&: Indicates whether to stop replication forcefully while data transfer is in progress.
    --volume=: ID of the volume or fully qualified identifier for the volume.
documentation:
    command: |
        Stop a Cloud NetApp Volume Replication.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        force: |-
            Indicates whether to stop replication forcefully while data transfer is in progress.
                  Warning! if force is true, this will abort any current transfers and can lead to data loss due to partial transfer.
                  If force is false, stop replication will fail while data transfer is in progress and you will need to retry later.
        location: |-
            The location of the replication.
            +
            To set the `location` attribute:
            * provide the argument `replication` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-force: |
            Indicates whether to stop replication forcefully while data transfer is in progress.
                  Warning! if force is true, this will abort any current transfers and can lead to data loss due to partial transfer.
                  If force is false, stop replication will fail while data transfer is in progress and you will need to retry later.
        volume: |-
            ID of the volume or fully qualified identifier for the volume.
            +
            To set the `volume` attribute:
            * provide the argument `--volume` on the command line.
