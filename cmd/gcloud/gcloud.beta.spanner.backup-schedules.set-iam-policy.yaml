name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a Cloud Spanner backup schedule.'
flags:
    --database=: The name of the Cloud Spanner database.
    --instance=: The name of the Cloud Spanner instance.
documentation:
    command: |
        *(BETA)*  Set the IAM policy for a Cloud Spanner backup schedule given a backup schedule ID and
        a file encoded in JSON or YAML that contains the IAM policy.
    flag:
        database: |-
            The name of the Cloud Spanner database.
            +

            To set the `database` attribute:
            * provide the argument `backup_schedule` on the command line with a fully specified name;
            * provide the argument `--database` on the command line.
        instance: |-
            The name of the Cloud Spanner instance.
            +

            To set the `instance` attribute:
            * provide the argument `backup_schedule` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
