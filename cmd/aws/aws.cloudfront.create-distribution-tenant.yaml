name: create-distribution-tenant
description: Creates a distribution tenant.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connection-group-id=: The ID of the connection group to associate with the distribution tenant.
    --customizations=: Customizations for the distribution tenant.
    --distribution-id=!: The ID of the multi-tenant distribution to use for creating the distribution tenant.
    --domains=!: The domains associated with the distribution tenant.
    --enabled: Indicates whether the distribution tenant should be enabled when created.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --managed-certificate-request=: The configuration for the CloudFront managed ACM certificate request.
    --name=!: The name of the distribution tenant.
    --no-enabled: Indicates whether the distribution tenant should be enabled when created.
    --parameters=: A list of parameter values to add to the resource.
    --tags=: ""
documentation:
    command: Creates a distribution tenant.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connection-group-id: The ID of the connection group to associate with the distribution tenant.
        customizations: Customizations for the distribution tenant. For each distribution tenant, you can specify the geographic restrictions, and the Amazon Resource Names (ARNs) for the ACM certificate and WAF web ACL. These are specific values that you can override or disable from the multi-tenant distribution that was used to create the distribution tenant.
        distribution-id: The ID of the multi-tenant distribution to use for creating the distribution tenant.
        domains: The domains associated with the distribution tenant. You must specify at least one domain in the request.
        enabled: Indicates whether the distribution tenant should be enabled when created. If the distribution tenant is disabled, the distribution tenant won't serve traffic.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        managed-certificate-request: The configuration for the CloudFront managed ACM certificate request.
        name: The name of the distribution tenant. Enter a friendly identifier that is unique within your Amazon Web Services account. This name can't be updated after you create the distribution tenant.
        parameters: A list of parameter values to add to the resource. A parameter is specified as a key-value pair. A valid parameter value must exist for any parameter that is marked as required in the multi-tenant distribution.
        tags: ""
