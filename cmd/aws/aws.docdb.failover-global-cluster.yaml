name: failover-global-cluster
description: Promotes the specified secondary DB cluster to be the primary DB cluster in the global cluster when failing over a global cluster occurs.
flags:
    --allow-data-loss: Specifies whether to allow data loss for this global cluster operation.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-cluster-identifier=!: The identifier of the Amazon DocumentDB global cluster to apply this operation.
    --no-allow-data-loss: Specifies whether to allow data loss for this global cluster operation.
    --no-switchover: Specifies whether to switch over this global database cluster.
    --switchover: Specifies whether to switch over this global database cluster.
    --target-db-cluster-identifier=!: The identifier of the secondary Amazon DocumentDB cluster that you want to promote to the primary for the global cluster.
documentation:
    command: |-
        Promotes the specified secondary DB cluster to be the primary DB cluster in the global cluster when failing over a global cluster occurs.

        Use this operation to respond to an unplanned event, such as a regional disaster in the primary region. Failing over can result in a loss of write transaction data that wasn't replicated to the chosen secondary before the failover event occurred. However, the recovery process that promotes a DB instance on the chosen seconday DB cluster to be the primary writer DB instance guarantees that the data is in a transactionally consistent state.
    flag:
        allow-data-loss: |-
            Specifies whether to allow data loss for this global cluster operation. Allowing data loss triggers a global failover operation.

            If you don't specify `AllowDataLoss`, the global cluster operation defaults to a switchover.

            Constraints:

            - Can't be specified together with the `Switchover` parameter.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-cluster-identifier: |-
            The identifier of the Amazon DocumentDB global cluster to apply this operation. The identifier is the unique key assigned by the user when the cluster is created. In other words, it's the name of the global cluster.

            Constraints:

            - Must match the identifier of an existing global cluster.
            - Minimum length of 1. Maximum length of 255.

            Pattern: `[A-Za-z][0-9A-Za-z-:._]*`
        switchover: |-
            Specifies whether to switch over this global database cluster.

            Constraints:

            - Can't be specified together with the `AllowDataLoss` parameter.
        target-db-cluster-identifier: |-
            The identifier of the secondary Amazon DocumentDB cluster that you want to promote to the primary for the global cluster. Use the Amazon Resource Name (ARN) for the identifier so that Amazon DocumentDB can locate the cluster in its Amazon Web Services region.

            Constraints:

            - Must match the identifier of an existing secondary cluster.
            - Minimum length of 1. Maximum length of 255.

            Pattern: `[A-Za-z][0-9A-Za-z-:._]*`
