name: get-endpoint
description: Retrieves information about the settings and attributes of a specific endpoint for an application.
flags:
    --application-id=!: The unique identifier for the application.
    --endpoint-id=!: The case insensitive unique identifier for the endpoint.
documentation:
    command: Retrieves information about the settings and attributes of a specific endpoint for an application.
    flag:
        application-id: The unique identifier for the application. This identifier is displayed as the **Project ID** on the Amazon Pinpoint console.
        endpoint-id: The case insensitive unique identifier for the endpoint. The identifier can't contain `$`, `{` or `}`.
