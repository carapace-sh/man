name: delete-connection
description: Delete an App Runner connection.
flags:
    --connection-arn=!: The Amazon Resource Name (ARN) of the App Runner connection that you want to delete.
documentation:
    command: Delete an App Runner connection. You must first ensure that there are no running App Runner services that use this connection. If there are any, the `DeleteConnection` action fails.
    flag:
        connection-arn: The Amazon Resource Name (ARN) of the App Runner connection that you want to delete.
