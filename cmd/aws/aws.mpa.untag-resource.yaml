name: untag-resource
description: Removes a resource tag.
flags:
    --resource-arn=!: Amazon Resource Name (ARN) for the resource you want to untag.
    --tag-keys=!: Array of tag key-value pairs that you want to untag.
documentation:
    command: Removes a resource tag. Each tag is a label consisting of a user-defined key and value. Tags can help you manage, identify, organize, search for, and filter resources.
    flag:
        resource-arn: Amazon Resource Name (ARN) for the resource you want to untag.
        tag-keys: Array of tag key-value pairs that you want to untag.
