name: create
description: Create a Distributed Cloud Edge Network subnet.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: An optional, textual description for the subnet.
    --ipv4-range=: The ranges of ipv4 addresses that are owned by this subnetwork in CIDR format.
    --ipv6-range=: The ranges of ipv6 addresses that are owned by this subnetwork in CIDR format.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The global location name.
    --network=!: The network that this subnetwork belongs to.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --vlan-id=: The ID of the VLAN to tag the subnetwork.
    --zone=: The name of the Google Distributed Cloud Edge zone.
documentation:
    command: |
        Create a new Distributed Cloud Edge Network subnet.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: An optional, textual description for the subnet.
        ipv4-range: The ranges of ipv4 addresses that are owned by this subnetwork in CIDR format.
        ipv6-range: The ranges of ipv6 addresses that are owned by this subnetwork in CIDR format.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `subnet` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        network: The network that this subnetwork belongs to.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        vlan-id: The ID of the VLAN to tag the subnetwork. If not specified we assign one automatically.
        zone: |-
            The name of the Google Distributed Cloud Edge zone.
            +
            To set the `zone` attribute:
            * provide the argument `subnet` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
