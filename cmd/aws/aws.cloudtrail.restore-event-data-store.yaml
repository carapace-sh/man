name: restore-event-data-store
description: Restores a deleted event data store specified by `EventDataStore`, which accepts an event data store ARN.
flags:
    --event-data-store=!: The ARN (or the ID suffix of the ARN) of the event data store that you want to restore.
documentation:
    command: Restores a deleted event data store specified by `EventDataStore`, which accepts an event data store ARN. You can only restore a deleted event data store within the seven-day wait period after deletion. Restoring an event data store can take several minutes, depending on the size of the event data store.
    flag:
        event-data-store: The ARN (or the ID suffix of the ARN) of the event data store that you want to restore.
