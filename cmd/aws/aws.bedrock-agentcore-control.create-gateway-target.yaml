name: create-gateway-target
description: Creates a target for a gateway.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --credential-provider-configurations=: The credential provider configurations for the target.
    --description=: The description of the gateway target.
    --gateway-identifier=!: The identifier of the gateway to create a target for.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the gateway target.
    --target-configuration=!: The configuration settings for the target, including endpoint information and schema definitions.
documentation:
    command: Creates a target for a gateway. A target defines an endpoint that the gateway can connect to.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If you don't specify this field, a value is randomly generated for you. If this token matches a previous request, the service ignores the request, but doesn't return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        credential-provider-configurations: The credential provider configurations for the target. These configurations specify how the gateway authenticates with the target endpoint.
        description: The description of the gateway target.
        gateway-identifier: The identifier of the gateway to create a target for.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the gateway target. The name must be unique within the gateway.
        target-configuration: The configuration settings for the target, including endpoint information and schema definitions.
