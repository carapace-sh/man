name: list-inference-profiles
description: Returns a list of inference profiles that you can use.
flags:
    --max-results=: The maximum number of results to return in the response.
    --next-token=: If the total number of results is greater than the `maxResults` value provided in the request, enter the token returned in the `nextToken` field in the response in this field to return the next batch of results.
    --type-equals=: Filters for inference profiles that match the type you specify.
completion:
    flag:
        type-equals:
            - SYSTEM_DEFINED
            - APPLICATION
documentation:
    command: Returns a list of inference profiles that you can use. For more information, see [Increase throughput and resilience with cross-region inference in Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html). in the Amazon Bedrock User Guide.
    flag:
        max-results: The maximum number of results to return in the response. If the total number of results is greater than this value, use the token returned in the response in the `nextToken` field when making another request to return the next batch of results.
        next-token: If the total number of results is greater than the `maxResults` value provided in the request, enter the token returned in the `nextToken` field in the response in this field to return the next batch of results.
        type-equals: |-
            Filters for inference profiles that match the type you specify.

            - `SYSTEM_DEFINED` – The inference profile is defined by Amazon Bedrock. You can route inference requests across regions with these inference profiles.
            - `APPLICATION` – The inference profile was created by a user. This type of inference profile can track metrics and costs when invoking the model in it. The inference profile may route requests to one or multiple regions.
