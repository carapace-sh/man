documentation:
    command: '*(BETA)*  Create a new Producer VPC spoke.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description of the spoke to create.
        exclude-export-ranges: |-
            Subnet IP address range(s) to hide from other VPC networks that are
                    connected through Network Connectivity Center.
        global: Indicates that the spoke is global.
        group: Group that the spoke will be part of. The group must already exist.
        hub: Hub that the spoke will attach to. The hub must already exist.
        include-export-ranges: |-
            Subnet IP address range(s) to export to other VPC networks that are
                    connected through Network Connectivity Center.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        network: |-
            Your VPC network that contains the peering to the Producer VPC,
                  which this spoke connects to the Hub. The peering must already exist and
                  be in the ACTIVE state.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        peering: |-
            Peering between your network and the Producer VPC, which this
                  spoke connects to the Hub. The peering must already exist and be in the
                  ACTIVATE state.
        region: A Google Cloud region. To see the names of regions, see [Viewing a list of available regions](https://cloud.google.com/compute/docs/regions-zones/viewing-regions-zones#viewing_a_list_of_available_regions).
