name: update-link
description: Updates the details for an existing link.
flags:
    --bandwidth=: The upload and download speed in Mbps.
    --description=: A description of the link.
    --global-network-id=!: The ID of the global network.
    --link-id=!: The ID of the link.
    --provider=: The provider of the link.
    --type=: The type of the link.
documentation:
    command: Updates the details for an existing link. To remove information for any of the parameters, specify an empty string.
    flag:
        bandwidth: The upload and download speed in Mbps.
        description: |-
            A description of the link.

            Constraints: Maximum length of 256 characters.
        global-network-id: The ID of the global network.
        link-id: The ID of the link.
        provider: |-
            The provider of the link.

            Constraints: Maximum length of 128 characters.
        type: |-
            The type of the link.

            Constraints: Maximum length of 128 characters.
