name: describe-predictor-backtest-export-job
description: Describes a predictor backtest export job created using the [CreatePredictorBacktestExportJob]() operation.
flags:
    --predictor-backtest-export-job-arn=!: The Amazon Resource Name (ARN) of the predictor backtest export job.
documentation:
    command: |-
        Describes a predictor backtest export job created using the [CreatePredictorBacktestExportJob]() operation.

        In addition to listing the properties provided by the user in the `CreatePredictorBacktestExportJob` request, this operation lists the following properties:

        - `CreationTime`
        - `LastModificationTime`
        - `Status`
        - `Message` (if an error occurred)
    flag:
        predictor-backtest-export-job-arn: The Amazon Resource Name (ARN) of the predictor backtest export job.
