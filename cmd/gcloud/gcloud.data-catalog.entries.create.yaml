completion:
    flag:
        type:
            - cluster
            - dashboard
            - database
            - database-schema
            - data-source-connection
            - data-stream
            - entry-type-unspecified
            - explore
            - feature-group
            - feature-online-store
            - feature-view
            - fileset
            - lake
            - look
            - model
            - routine
            - service
            - table
            - zone
documentation:
    command: |4-
        *(DEPRECATED)*  This command is deprecated. Please use `gcloud dataplex entries` instead.

        Create a Data Catalog entry.
    flag:
        description: Textual description of the entry.
        display-name: Human-readable name for the entry.
        entry-group: |-
            Entry group of the entry.
            +

            To set the `entry-group` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--entry-group` on the command line.
        fully-qualified-name: Fully qualified name of the resource.
        gcs-file-patterns: |-
            Patterns to identify a set of files in Google Cloud Storage. A star (```*```) may be used at
            the end of a pattern to match arbitrary files beginning with that pattern.
            +
            Examples of valid file patterns:
            - gs://bucket_name/```*``` - Matches all files in 'bucket_name'.
            - gs://bucket_name/file```*``` - Matches files prefixed by 'file' in 'bucket_name'.
            - gs://another_bucket/a.txt - Matches 'gs://another_bucket/a.txt'.
        kafka-cluster: Name of the entry representing Kafka cluster this topic is a part of.
        kafka-cluster-bootstrap-servers: |-
            A comma-separated list of host and port pairs that are the addresses of
            the Kafka brokers.
        kafka-topic: Name of the Kafka topic this Entry represents.
        linked-resource: |-
            Link to the resource in external system. If `--type` is not used,
            then `--linked-resource` may be provided.
        location: |-
            Location of the entry.
            +

            To set the `location` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        physical-schema-file: File contents with physical schema.
        physical-schema-type: Type of physical schema. Accepted values are avro, thrift, protobuf, parquet, orc
        schema: |-
            Inline schema for the entry. When specifying a schema via this argument, only column names
            and types should be provided. Column modes will default to NULLABLE, and column descriptions
            and nested subcolumns are not supported.
        schema-from-file: |-
            Path to a JSON or YAML file containing the schema for the entry. This can be used to specify
            schemas with column descriptions, column modes other than NULLABLE, and nested subcolumns. Use a full or relative path to a local file containing the value of schema.
        source-system-create-time: |-
            Creation timestamp of the resource in the external system. If `--type` is not used,
            then `--source-system-create-time` may be provided.
        source-system-update-time: |-
            Update timestamp of the resource in the external system. If `--type` is not used,
            then `--source-system-update-time` may be provided.
        type: 'Type of the entry. _TYPE_ must be one of: *cluster*, *dashboard*, *database*, *database-schema*, *data-source-connection*, *data-stream*, *entry-type-unspecified*, *explore*, *feature-group*, *feature-online-store*, *feature-view*, *fileset*, *lake*, *look*, *model*, *routine*, *service*, *table*, *zone*.'
        user-specified-system: |-
            External system from which the entry is fed. If `--type` is not used,
            then `--user-specified-system` must be provided.
        user-specified-type: |-
            Type of the entry coming from external system. If `--type` is not used,
            then `--user-specified-type` must be provided.
