name: get-credentials
description: Returns a database user name and temporary password with temporary authorization to log in to Amazon Redshift Serverless.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --custom-domain-name=: The custom domain name associated with the workgroup.
    --db-name=: The name of the database to get temporary authorization to log on to.
    --duration-seconds=: The number of seconds until the returned temporary password expires.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --workgroup-name=: The name of the workgroup associated with the database.
documentation:
    command: |-
        Returns a database user name and temporary password with temporary authorization to log in to Amazon Redshift Serverless.

        By default, the temporary credentials expire in 900 seconds. You can optionally specify a duration between 900 seconds (15 minutes) and 3600 seconds (60 minutes).

        The Identity and Access Management (IAM) user or role that runs GetCredentials must have an IAM policy attached that allows access to all necessary actions and resources.

        If the `DbName` parameter is specified, the IAM policy must allow access to the resource dbname for the specified database name.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        custom-domain-name: The custom domain name associated with the workgroup. The custom domain name or the workgroup name must be included in the request.
        db-name: |-
            The name of the database to get temporary authorization to log on to.

            Constraints:

            - Must be 1 to 64 alphanumeric characters or hyphens.
            - Must contain only uppercase or lowercase letters, numbers, underscore, plus sign, period (dot), at symbol (@), or hyphen.
            - The first character must be a letter.
            - Must not contain a colon ( : ) or slash ( / ).
            - Cannot be a reserved word. A list of reserved words can be found in [Reserved Words](https://docs.aws.amazon.com/redshift/latest/dg/r_pg_keywords.html) in the Amazon Redshift Database Developer Guide
        duration-seconds: The number of seconds until the returned temporary password expires. The minimum is 900 seconds, and the maximum is 3600 seconds.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        workgroup-name: The name of the workgroup associated with the database.
