name: untag-resource
description: Removes one or more tags from the specified Amazon Location resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource from which you want to remove tags.
    --tag-keys=!: The list of tag keys to remove from the specified resource.
documentation:
    command: Removes one or more tags from the specified Amazon Location resource.
    flag:
        resource-arn: |-
            The Amazon Resource Name (ARN) of the resource from which you want to remove tags.

            - Format example: `arn:aws:geo:region:account-id:resourcetype/ExampleResource`
        tag-keys: The list of tag keys to remove from the specified resource.
