name: update-app-version-resource
description: Updates the resource details in the Resilience Hub application.
flags:
    --additional-info=: Currently, there is no supported additional information for resources.
    --app-arn=!: Amazon Resource Name (ARN) of the Resilience Hub application.
    --app-components=: List of Application Components that this resource belongs to.
    --aws-account-id=: Amazon Web Services account that owns the physical resource.
    --aws-region=: Amazon Web Services region that owns the physical resource.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --excluded: Indicates if a resource is excluded from an Resilience Hub application.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --logical-resource-id=: Logical identifier of the resource.
    --no-excluded: Indicates if a resource is excluded from an Resilience Hub application.
    --physical-resource-id=: Physical identifier of the resource.
    --resource-name=: Name of the resource.
    --resource-type=: Type of resource.
documentation:
    command: |-
        Updates the resource details in the Resilience Hub application.

        - This action has no effect outside Resilience Hub.
        - This API updates the Resilience Hub application draft version. To use this resource for running resiliency assessments, you must publish the Resilience Hub application using the `PublishAppVersion` API.
        - To update application version with new `physicalResourceID`, you must call `ResolveAppVersionResources` API.
    flag:
        additional-info: Currently, there is no supported additional information for resources.
        app-arn: 'Amazon Resource Name (ARN) of the Resilience Hub application. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        app-components: List of Application Components that this resource belongs to. If an Application Component is not part of the Resilience Hub application, it will be added.
        aws-account-id: Amazon Web Services account that owns the physical resource.
        aws-region: Amazon Web Services region that owns the physical resource.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        excluded: |-
            Indicates if a resource is excluded from an Resilience Hub application.

            You can exclude only imported resources from an Resilience Hub application.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        logical-resource-id: Logical identifier of the resource.
        physical-resource-id: Physical identifier of the resource.
        resource-name: Name of the resource.
        resource-type: Type of resource.
