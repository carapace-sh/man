name: create-action-connector
description: Creates an action connector that enables Amazon Quick Sight to connect to external services and perform actions.
flags:
    --action-connector-id=!: A unique identifier for the action connector.
    --authentication-config=!: The authentication configuration for connecting to the external service.
    --aws-account-id=!: The Amazon Web Services account ID associated with the action connector.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: An optional description of the action connector.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A descriptive name for the action connector.
    --permissions=: The permissions configuration that defines which users, groups, or namespaces can access this action connector and what operations they can perform.
    --tags=: A list of tags to apply to the action connector for resource management and organization.
    --type=!: The type of action connector.
    --vpc-connection-arn=: The ARN of the VPC connection to use for secure connectivity to the external service.
completion:
    flag:
        type:
            - GENERIC_HTTP
            - SERVICENOW_NOW_PLATFORM
            - SALESFORCE_CRM
            - MICROSOFT_OUTLOOK
            - PAGERDUTY_ADVANCE
            - JIRA_CLOUD
            - ATLASSIAN_CONFLUENCE
            - AMAZON_S3
            - AMAZON_BEDROCK_AGENT_RUNTIME
            - AMAZON_BEDROCK_RUNTIME
            - AMAZON_BEDROCK_DATA_AUTOMATION_RUNTIME
            - AMAZON_TEXTRACT
            - AMAZON_COMPREHEND
            - AMAZON_COMPREHEND_MEDICAL
            - MICROSOFT_ONEDRIVE
            - MICROSOFT_SHAREPOINT
            - MICROSOFT_TEAMS
            - SAP_BUSINESSPARTNER
            - SAP_PRODUCTMASTERDATA
            - SAP_PHYSICALINVENTORY
            - SAP_BILLOFMATERIALS
            - SAP_MATERIALSTOCK
            - ZENDESK_SUITE
            - SMARTSHEET
            - SLACK
            - ASANA
            - BAMBOO_HR
documentation:
    command: Creates an action connector that enables Amazon Quick Sight to connect to external services and perform actions. Action connectors support various authentication methods and can be configured with specific actions from supported connector types like Amazon S3, Salesforce, JIRA.
    flag:
        action-connector-id: A unique identifier for the action connector. This ID must be unique within the Amazon Web Services account. The `ActionConnectorId` must not start with the prefix `quicksuite-`
        authentication-config: The authentication configuration for connecting to the external service. This includes the authentication type, base URL, and authentication metadata such as client credentials or API keys.
        aws-account-id: The Amazon Web Services account ID associated with the action connector.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: An optional description of the action connector.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A descriptive name for the action connector.
        permissions: The permissions configuration that defines which users, groups, or namespaces can access this action connector and what operations they can perform.
        tags: A list of tags to apply to the action connector for resource management and organization.
        type: The type of action connector.
        vpc-connection-arn: The ARN of the VPC connection to use for secure connectivity to the external service.
