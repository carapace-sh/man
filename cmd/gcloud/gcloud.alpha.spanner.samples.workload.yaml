name: workload
description: '*(ALPHA)*  Generate gRPC traffic for a given sample app''s backend service.'
flags:
    --duration=: Duration of time allowed to run before stopping the workload.
    --port=: Port of the running backend service.
    --target-qps=: Target requests per second.
documentation:
    command: |-
        *(ALPHA)*  Before sending traffic to the backend service, create the database and
        start the service with:

            $ gcloud alpha spanner samples init APPNAME --instance-id=INSTANCE_ID
            $ gcloud alpha spanner samples backend APPNAME --instance-id=INSTANCE_ID

        To run all three steps together, use:

            $ gcloud alpha spanner samples run APPNAME --instance-id=INSTANCE_ID
    flag:
        duration: Duration of time allowed to run before stopping the workload.
        port: Port of the running backend service.
        target-qps: Target requests per second.
