name: describe
description: '*(BETA)*  Describe a Cloud SQL integration against a Managed Microsoft AD domain.'
flags:
    --domain=: The fully-qualified domain name of the Microsoft Active Directory domain.
documentation:
    command: |
        *(BETA)*  Describe a Cloud SQL integration against a Managed Microsoft AD domain.

        Displays all details of a Cloud SQL integration given a valid integration ID.
    flag:
        domain: |-
            The fully-qualified domain name of the Microsoft Active Directory domain.
            +
            To set the `domain` attribute:
            * provide the argument `sql_integration` on the command line with a fully specified name;
            * provide the argument `--domain` on the command line.
