name: describe
description: Describe the inventory data for a Compute Engine VM instance.
flags:
    --location=: Location of the Compute Engine VM instance to describe.
    --view=: Specifies what information should be included in the
completion:
    flag:
        view:
            - basic
            - full
documentation:
    command: |
        Describe the inventory data for a Compute Engine VM instance.
    flag:
        location: |-
            Location of the Compute Engine VM instance to describe. If not specified, the property
            `compute/zone` is used. For details on setting properties,
            see: https://cloud.google.com/sdk/docs/properties
        view: |-
            Specifies what information should be included in the
            output. If unspecified, the default view is `basic`. _VIEW_ must be one of:
            +
            *basic*::: Output is limited to operating system details.
            *full*::: Output includes operating system details and package information.
            :::
            +
