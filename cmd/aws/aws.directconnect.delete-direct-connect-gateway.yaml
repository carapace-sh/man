name: delete-direct-connect-gateway
description: Deletes the specified Direct Connect gateway.
flags:
    --direct-connect-gateway-id=!: The ID of the Direct Connect gateway.
documentation:
    command: Deletes the specified Direct Connect gateway. You must first delete all virtual interfaces that are attached to the Direct Connect gateway and disassociate all virtual private gateways associated with the Direct Connect gateway.
    flag:
        direct-connect-gateway-id: The ID of the Direct Connect gateway.
