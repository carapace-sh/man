name: put-metric-data
description: Publishes metric data to Amazon CloudWatch.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dimensions=: The dimensions of the metric.
    --entity-metric-data=:
        description: Data for metrics that contain associated entity information.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metric-data=:
        description: The data for the metrics.
        nargs: -1
    --metric-name=: The name of the metric.
    --namespace=!: The namespace for the metric data.
    --no-strict-entity-validation: Whether to accept valid metric data when an invalid entity is sent.
    --statistic-values=: A set of statistical values describing the metric.
    --storage-resolution=: The storage resolution of the metric.
    --strict-entity-validation: Whether to accept valid metric data when an invalid entity is sent.
    --timestamp=: The time stamp used for the metric.
    --unit=: The unit of metric.
    --value=: The value for the metric.
documentation:
    command: |-
        Publishes metric data to Amazon CloudWatch. CloudWatch associates the data with the specified metric. If the specified metric does not exist, CloudWatch creates the metric. When CloudWatch creates a metric, it can take up to fifteen minutes for the metric to appear in calls to [ListMetrics](https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_ListMetrics.html).

        You can publish metrics with associated entity data (so that related telemetry can be found and viewed together), or publish metric data by itself. To send entity data with your metrics, use the `EntityMetricData` parameter. To send metrics without entity data, use the `MetricData` parameter. The `EntityMetricData` structure includes `MetricData` structures for the metric data.

        You can publish either individual values in the `Value` field, or arrays of values and the number of times each value occurred during the period by using the `Values` and `Counts` fields in the `MetricData` structure. Using the `Values` and `Counts` method enables you to publish up to 150 values per metric with one `PutMetricData` request, and supports retrieving percentile statistics on this data.

        Each `PutMetricData` request is limited to 1 MB in size for HTTP POST requests. You can send a payload compressed by gzip. Each request is also limited to no more than 1000 different metrics (across both the `MetricData` and `EntityMetricData` properties).

        Although the `Value` parameter accepts numbers of type `Double`, CloudWatch rejects values that are either too small or too large. Values must be in the range of -2^360 to 2^360. In addition, special values (for example, NaN, +Infinity, -Infinity) are not supported.

        You can use up to 30 dimensions per metric to further clarify what data the metric collects. Each dimension consists of a Name and Value pair. For more information about specifying dimensions, see [Publishing Metrics](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/publishingMetrics.html) in the *Amazon CloudWatch User Guide*.

        You specify the time stamp to be associated with each data point. You can specify time stamps that are as much as two weeks before the current date, and as much as 2 hours after the current day and time.

        Data points with time stamps from 24 hours ago or longer can take at least 48 hours to become available for [GetMetricData](https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_GetMetricData.html) or [GetMetricStatistics](https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_GetMetricStatistics.html) from the time they are submitted. Data points with time stamps between 3 and 24 hours ago can take as much as 2 hours to become available for [GetMetricData](https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_GetMetricData.html) or [GetMetricStatistics](https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_GetMetricStatistics.html).

        CloudWatch needs raw data points to calculate percentile statistics. If you publish data using a statistic set instead, you can only retrieve percentile statistics for this data if one of the following conditions is true:

        - The `SampleCount` value of the statistic set is 1 and `Min`, `Max`, and `Sum` are all equal.
        - The `Min` and `Max` are equal, and `Sum` is equal to `Min` multiplied by `SampleCount`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        entity-metric-data: |-
            Data for metrics that contain associated entity information. You can include up to two `EntityMetricData` objects, each of which can contain a single `Entity` and associated metrics.

            The limit of metrics allowed, 1000, is the sum of both `EntityMetricData` and `MetricData` metrics.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metric-data: |-
            The data for the metrics. Use this parameter if your metrics do not contain associated entities. The array can include no more than 1000 metrics per call.

            The limit of metrics allowed, 1000, is the sum of both `EntityMetricData` and `MetricData` metrics.
        namespace: |-
            The namespace for the metric data. You can use ASCII characters for the namespace, except for control characters which are not supported.

            To avoid conflicts with Amazon Web Services service namespaces, you should not specify a namespace that begins with `AWS/`
        strict-entity-validation: "Whether to accept valid metric data when an invalid entity is sent.\n\n- When set to `true`: Any validation error (for entity or metric data) will fail the entire request, and no data will be ingested. The failed operation will return a 400 result with the error.\n- When set to `false`: Validation errors in the entity will not associate the metric with the entity, but the metric data will still be accepted and ingested. Validation errors in the metric data will fail the entire request, and no data will be ingested.\n  \n  In the case of an invalid entity, the operation will return a `200` status, but an additional response header will contain information about the validation errors. The new header, `X-Amzn-Failure-Message` is an enumeration of the following values:\n  \n  - `InvalidEntity` - The provided entity is invalid.\n  - `InvalidKeyAttributes` - The provided `KeyAttributes` of an entity is invalid.\n  - `InvalidAttributes` - The provided `Attributes` of an entity is invalid.\n  - `InvalidTypeValue` - The provided `Type` in the `KeyAttributes` of an entity is invalid.\n  - `EntitySizeTooLarge` - The number of `EntityMetricData` objects allowed is 2.\n  - `MissingRequiredFields` - There are missing required fields in the `KeyAttributes` for the provided `Type`.\n  \n  For details of the requirements for specifying an entity, see [How to add related information to telemetry](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/adding-your-own-related-telemetry.html) in the *CloudWatch User Guide*.\n\nThis parameter is *required* when `EntityMetricData` is included."
