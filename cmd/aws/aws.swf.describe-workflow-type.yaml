name: describe-workflow-type
description: Returns information about the specified *workflow type*.
flags:
    --domain=!: The name of the domain in which this workflow type is registered.
    --workflow-type=!: The workflow type to describe.
documentation:
    command: "Returns information about the specified *workflow type*. This includes configuration settings specified when the type was registered and other information such as creation date, current status, etc.\n\n**Access Control**\n\nYou can use IAM policies to control this action's access to Amazon SWF resources as follows:\n\n- Use a `Resource` element with the domain name to limit the action to only specified domains.\n- Use an `Action` element to allow or deny permission to call this action.\n- Constrain the following parameters by using a `Condition` element with the appropriate keys.\n  \n  - `workflowType.name`: String constraint. The key is `swf:workflowType.name`.\n  - `workflowType.version`: String constraint. The key is `swf:workflowType.version`.\n\nIf the caller doesn't have sufficient permissions to invoke the action, or the parameter values fall outside the specified constraints, the action fails. The associated event attribute's `cause` parameter is set to `OPERATION_NOT_PERMITTED`. For details and example IAM policies, see [Using IAM to Manage Access to Amazon SWF Workflows](https://docs.aws.amazon.com/amazonswf/latest/developerguide/swf-dev-iam.html) in the *Amazon SWF Developer Guide*."
    flag:
        domain: The name of the domain in which this workflow type is registered.
        workflow-type: The workflow type to describe.
