name: create-message-template-attachment
description: Uploads an attachment file to the specified Amazon Q in Connect message template.
flags:
    --body=!: The body of the attachment file being uploaded.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --content-disposition=!: The presentation information for the attachment file.
    --knowledge-base-id=!: The identifier of the knowledge base.
    --message-template-id=!: The identifier of the message template.
    --name=!: The name of the attachment file being uploaded.
completion:
    flag:
        content-disposition:
            - ATTACHMENT
documentation:
    command: Uploads an attachment file to the specified Amazon Q in Connect message template. The name of the message template attachment has to be unique for each message template referenced by the `$LATEST` qualifier. The body of the attachment file should be encoded using base64 encoding. After the file is uploaded, you can use the pre-signed Amazon S3 URL returned in response to download the uploaded file.
    flag:
        body: The body of the attachment file being uploaded. It should be encoded using base64 encoding.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](http://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        content-disposition: The presentation information for the attachment file.
        knowledge-base-id: The identifier of the knowledge base. Can be either the ID or the ARN. URLs cannot contain the ARN.
        message-template-id: The identifier of the message template. Can be either the ID or the ARN. It cannot contain any qualifier.
        name: The name of the attachment file being uploaded. The name should include the file extension.
