name: create
description: Create an Eventarc channel.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --crypto-key=: Fully qualified name of the crypto key to use for customer-managed encryption.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location for the Eventarc channel, which should be either ``global'' or one of the supported regions.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --provider=!: ID of the provider or fully qualified identifier for the provider.
documentation:
    command: Create an Eventarc channel.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        crypto-key: Fully qualified name of the crypto key to use for customer-managed encryption. If this is unspecified, Google-managed keys will be used for encryption.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location for the Eventarc channel, which should be either ``global'' or one of the supported regions. Alternatively, set the [eventarc/location] property.
            +
            To set the `location` attribute:
            * provide the argument `channel` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `eventarc/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        provider: |-
            ID of the provider or fully qualified identifier for the provider.
            +
            To set the `provider` attribute:
            * provide the argument `--provider` on the command line.
