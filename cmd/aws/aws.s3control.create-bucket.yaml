name: create-bucket
description: This action creates an Amazon S3 on Outposts bucket.
flags:
    --acl=: The canned ACL to apply to the bucket.
    --bucket=!: The name of the bucket.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --create-bucket-configuration=: The configuration information for the bucket.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --grant-full-control=: Allows grantee the read, write, read ACP, and write ACP permissions on the bucket.
    --grant-read-acp=: Allows grantee to read the bucket ACL.
    --grant-read=: Allows grantee to list the objects in the bucket.
    --grant-write-acp=: Allows grantee to write the ACL for the applicable bucket.
    --grant-write=: Allows grantee to create, overwrite, and delete any object in the bucket.
    --no-object-lock-enabled-for-bucket: Specifies whether you want S3 Object Lock to be enabled for the new bucket.
    --object-lock-enabled-for-bucket: Specifies whether you want S3 Object Lock to be enabled for the new bucket.
    --outpost-id=: The ID of the Outposts where the bucket is being created.
completion:
    flag:
        acl:
            - private
            - public-read
            - public-read-write
            - authenticated-read
documentation:
    command: |-
        This action creates an Amazon S3 on Outposts bucket. To create an S3 bucket, see [Create Bucket](https://docs.aws.amazon.com/AmazonS3/latest/API/API_CreateBucket.html) in the *Amazon S3 API Reference*.

        Creates a new Outposts bucket. By creating the bucket, you become the bucket owner. To create an Outposts bucket, you must have S3 on Outposts. For more information, see [Using Amazon S3 on Outposts](https://docs.aws.amazon.com/AmazonS3/latest/userguide/S3onOutposts.html) in *Amazon S3 User Guide*.

        Not every string is an acceptable bucket name. For information on bucket naming restrictions, see [Working with Amazon S3 Buckets](https://docs.aws.amazon.com/AmazonS3/latest/userguide/BucketRestrictions.html#bucketnamingrules).

        S3 on Outposts buckets support:

        - Tags
        - LifecycleConfigurations for deleting expired objects

        For a complete list of restrictions and Amazon S3 feature limitations on S3 on Outposts, see [Amazon S3 on Outposts Restrictions and Limitations](https://docs.aws.amazon.com/AmazonS3/latest/userguide/S3OnOutpostsRestrictionsLimitations.html).

        For an example of the request syntax for Amazon S3 on Outposts that uses the S3 on Outposts endpoint hostname prefix and `x-amz-outpost-id` in your API request, see the [Examples](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_CreateBucket.html#API_control_CreateBucket_Examples) section.

        The following actions are related to `CreateBucket` for Amazon S3 on Outposts:

        - [PutObject](https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObject.html)
        - [GetBucket](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_GetBucket.html)
        - [DeleteBucket](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_DeleteBucket.html)
        - [CreateAccessPoint](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_CreateAccessPoint.html)
        - [PutAccessPointPolicy](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_PutAccessPointPolicy.html)
    flag:
        acl: |-
            The canned ACL to apply to the bucket.

            This is not supported by Amazon S3 on Outposts buckets.
        bucket: The name of the bucket.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        create-bucket-configuration: |-
            The configuration information for the bucket.

            This is not supported by Amazon S3 on Outposts buckets.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        grant-full-control: |-
            Allows grantee the read, write, read ACP, and write ACP permissions on the bucket.

            This is not supported by Amazon S3 on Outposts buckets.
        grant-read: |-
            Allows grantee to list the objects in the bucket.

            This is not supported by Amazon S3 on Outposts buckets.
        grant-read-acp: |-
            Allows grantee to read the bucket ACL.

            This is not supported by Amazon S3 on Outposts buckets.
        grant-write: |-
            Allows grantee to create, overwrite, and delete any object in the bucket.

            This is not supported by Amazon S3 on Outposts buckets.
        grant-write-acp: |-
            Allows grantee to write the ACL for the applicable bucket.

            This is not supported by Amazon S3 on Outposts buckets.
        object-lock-enabled-for-bucket: |-
            Specifies whether you want S3 Object Lock to be enabled for the new bucket.

            This is not supported by Amazon S3 on Outposts buckets.
        outpost-id: |-
            The ID of the Outposts where the bucket is being created.

            This ID is required by Amazon S3 on Outposts buckets.
