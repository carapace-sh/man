name: report-instance-status
description: Submits feedback about the status of an instance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: Descriptive text about the health state of your instance.
    --dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --end-time=: The time at which the reported instance health state ended.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instances=!: The instances.
    --no-dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --reason-codes=!: The reason codes that describe the health state of your instance.
    --start-time=: The time at which the reported instance health state began.
    --status=!: The status of all instances listed.
completion:
    flag:
        status:
            - ok
            - impaired
documentation:
    command: |-
        Submits feedback about the status of an instance. The instance must be in the `running` state. If your experience with the instance differs from the instance status returned by [DescribeInstanceStatus](), use [ReportInstanceStatus]() to report your experience with the instance. Amazon EC2 collects this information to improve the accuracy of status checks.

        Use of this action does not change the value returned by [DescribeInstanceStatus]().
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: Descriptive text about the health state of your instance.
        dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        end-time: The time at which the reported instance health state ended.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instances: The instances.
        reason-codes: |-
            The reason codes that describe the health state of your instance.

            - `instance-stuck-in-state`: My instance is stuck in a state.
            - `unresponsive`: My instance is unresponsive.
            - `not-accepting-credentials`: My instance is not accepting my credentials.
            - `password-not-available`: A password is not available for my instance.
            - `performance-network`: My instance is experiencing performance problems that I believe are network related.
            - `performance-instance-store`: My instance is experiencing performance problems that I believe are related to the instance stores.
            - `performance-ebs-volume`: My instance is experiencing performance problems that I believe are related to an EBS volume.
            - `performance-other`: My instance is experiencing performance problems.
            - `other`: \[explain using the description parameter]
        start-time: The time at which the reported instance health state began.
        status: The status of all instances listed.
