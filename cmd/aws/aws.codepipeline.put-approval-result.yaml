name: put-approval-result
description: Provides the response to a manual approval request to CodePipeline.
flags:
    --action-name=!: The name of the action for which approval is requested.
    --pipeline-name=!: The name of the pipeline that contains the action.
    --result=!: Represents information about the result of the approval request.
    --stage-name=!: The name of the stage that contains the action.
    --token=!: The system-generated token used to identify a unique approval request.
documentation:
    command: Provides the response to a manual approval request to CodePipeline. Valid responses include Approved and Rejected.
    flag:
        action-name: The name of the action for which approval is requested.
        pipeline-name: The name of the pipeline that contains the action.
        result: Represents information about the result of the approval request.
        stage-name: The name of the stage that contains the action.
        token: |-
            The system-generated token used to identify a unique approval request. The token for each open approval request can be obtained using the [GetPipelineState]() action. It is used to validate that the approval request corresponding to this token is still valid.

            For a pipeline where the execution mode is set to PARALLEL, the token required to approve/reject an approval request as detailed above is not available. Instead, use the `externalExecutionId` in the response output from the [ListActionExecutions]() action as the token in the approval request.
