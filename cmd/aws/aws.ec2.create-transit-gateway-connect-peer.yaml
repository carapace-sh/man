name: create-transit-gateway-connect-peer
description: Creates a Connect peer for a specified transit gateway Connect attachment between a transit gateway and an appliance.
flags:
    --bgp-options=: The BGP options for the Connect peer.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inside-cidr-blocks=!: The range of inside IP addresses that are used for BGP peering.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --peer-address=!: The peer IP address (GRE outer IP address) on the appliance side of the Connect peer.
    --tag-specifications=: The tags to apply to the Connect peer.
    --transit-gateway-address=: The peer IP address (GRE outer IP address) on the transit gateway side of the Connect peer, which must be specified from a transit gateway CIDR block.
    --transit-gateway-attachment-id=!: The ID of the Connect attachment.
documentation:
    command: |-
        Creates a Connect peer for a specified transit gateway Connect attachment between a transit gateway and an appliance.

        The peer address and transit gateway address must be the same IP address family (IPv4 or IPv6).

        For more information, see [Connect peers](https://docs.aws.amazon.com/vpc/latest/tgw/tgw-connect.html#tgw-connect-peer) in the *Amazon Web Services Transit Gateways Guide*.
    flag:
        bgp-options: The BGP options for the Connect peer.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        inside-cidr-blocks: The range of inside IP addresses that are used for BGP peering. You must specify a size /29 IPv4 CIDR block from the `169.254.0.0/16` range. The first address from the range must be configured on the appliance as the BGP IP address. You can also optionally specify a size /125 IPv6 CIDR block from the `fd00::/8` range.
        peer-address: The peer IP address (GRE outer IP address) on the appliance side of the Connect peer.
        tag-specifications: The tags to apply to the Connect peer.
        transit-gateway-address: The peer IP address (GRE outer IP address) on the transit gateway side of the Connect peer, which must be specified from a transit gateway CIDR block. If not specified, Amazon automatically assigns the first available IP address from the transit gateway CIDR block.
        transit-gateway-attachment-id: The ID of the Connect attachment.
