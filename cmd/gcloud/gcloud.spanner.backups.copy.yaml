name: copy
description: Copies a backup of a Cloud Spanner database.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --destination-backup=!: ID of the backup or fully qualified identifier for the backup.
    --destination-instance=: The Cloud Spanner instance for the backup.
    --encryption-type=: The encryption type of the copied backup.
    --expiration-date=: Expiration time of the backup, must be at least 6 hours and at most 366 days from the time when the source backup is created.
    --kms-key=!: ID of the key or fully qualified identifier for the key.
    --kms-keyring=: KMS keyring id of the key.
    --kms-keys=!: IDs of the keys or fully qualified identifiers for the keys.
    --kms-location=: Cloud location for the key.
    --kms-project=: Cloud project id for the key.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --retention-period=: Retention period of the backup relative from now, must be at least 6 hours and at most 366 days from the time when the source backup is created.
    --source-backup=!: ID of the backup or fully qualified identifier for the backup.
    --source-instance=: The Cloud Spanner instance for the backup.
completion:
    flag:
        encryption-type:
            - customer-managed-encryption
            - google-default-encryption
            - use-config-default-or-backup-encryption
documentation:
    command: Copies a backup of a Cloud Spanner database.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        destination-backup: |-
            ID of the backup or fully qualified identifier for the backup.
            +
            To set the `backup` attribute:
            * provide the argument `--destination-backup` on the command line.
        destination-instance: |-
            The Cloud Spanner instance for the backup.
            +
            To set the `instance` attribute:
            * provide the argument `--destination-backup` on the command line with a fully specified name;
            * provide the argument `--destination-instance` on the command line;
            * set the property `spanner/instance`.
        encryption-type: |-
            The encryption type of the copied backup. _ENCRYPTION_TYPE_ must be one of:
            +
            *customer-managed-encryption*::: Use the provided Cloud KMS key for encryption. If this option is selected, kms-key must be set.
            *google-default-encryption*::: Use Google default encryption.
            *use-config-default-or-backup-encryption*::: Use the default encryption configuration if one exists. otherwise use the same encryption configuration as the source backup.
            :::
            +
        expiration-date: Expiration time of the backup, must be at least 6 hours and at most 366 days from the time when the source backup is created. See `$ gcloud topic datetimes` for information on date/time formats.
        kms-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key` on the command line.
        kms-keyring: |-
            KMS keyring id of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-keys: |-
            IDs of the keys or fully qualified identifiers for the keys.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-keys` on the command line.
        kms-location: |-
            Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line.
        kms-project: |-
            Cloud project id for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        retention-period: Retention period of the backup relative from now, must be at least 6 hours and at most 366 days from the time when the source backup is created. See `$ gcloud topic datetimes` for information on duration formats.
        source-backup: |-
            ID of the backup or fully qualified identifier for the backup.
            +
            To set the `backup` attribute:
            * provide the argument `--source-backup` on the command line.
        source-instance: |-
            The Cloud Spanner instance for the backup.
            +
            To set the `instance` attribute:
            * provide the argument `--source-backup` on the command line with a fully specified name;
            * provide the argument `--source-instance` on the command line;
            * set the property `spanner/instance`.
