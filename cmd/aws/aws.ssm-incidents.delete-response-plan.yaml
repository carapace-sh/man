name: delete-response-plan
description: Deletes the specified response plan.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the response plan.
documentation:
    command: Deletes the specified response plan. Deleting a response plan stops all linked CloudWatch alarms and EventBridge events from creating an incident with this response plan.
    flag:
        arn: The Amazon Resource Name (ARN) of the response plan.
