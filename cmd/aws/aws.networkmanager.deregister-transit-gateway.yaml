name: deregister-transit-gateway
description: Deregisters a transit gateway from your global network.
flags:
    --global-network-id=!: The ID of the global network.
    --transit-gateway-arn=!: The Amazon Resource Name (ARN) of the transit gateway.
documentation:
    command: Deregisters a transit gateway from your global network. This action does not delete your transit gateway, or modify any of its attachments. This action removes any customer gateway associations.
    flag:
        global-network-id: The ID of the global network.
        transit-gateway-arn: The Amazon Resource Name (ARN) of the transit gateway.
