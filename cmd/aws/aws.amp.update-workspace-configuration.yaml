name: update-workspace-configuration
description: Use this operation to create or update the label sets, label set limits, and retention period of a workspace.
flags:
    --client-token=: You can include a token in your operation to make it an idempotent opeartion.
    --limits-per-label-set=: This is an array of structures, where each structure defines a label set for the workspace, and defines the active time series limit for each of those label sets.
    --retention-period-in-days=: Specifies how many days that metrics will be retained in the workspace.
    --workspace-id=!: The ID of the workspace that you want to update.
documentation:
    command: |-
        Use this operation to create or update the label sets, label set limits, and retention period of a workspace.

        You must specify at least one of `limitsPerLabelSet` or `retentionPeriodInDays` for the request to be valid.
    flag:
        client-token: You can include a token in your operation to make it an idempotent opeartion.
        limits-per-label-set: This is an array of structures, where each structure defines a label set for the workspace, and defines the active time series limit for each of those label sets. Each label name in a label set must be unique.
        retention-period-in-days: Specifies how many days that metrics will be retained in the workspace.
        workspace-id: The ID of the workspace that you want to update. To find the IDs of your workspaces, use the [ListWorkspaces](https://docs.aws.amazon.com/prometheus/latest/APIReference/API_ListWorkspaces.htm) operation.
