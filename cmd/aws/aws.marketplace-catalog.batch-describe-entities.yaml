name: batch-describe-entities
description: Returns metadata and content for multiple entities.
flags:
    --entity-request-list=!: List of entity IDs and the catalogs the entities are present in.
documentation:
    command: Returns metadata and content for multiple entities. This is the Batch version of the `DescribeEntity` API and uses the same IAM permission action as `DescribeEntity` API.
    flag:
        entity-request-list: List of entity IDs and the catalogs the entities are present in.
