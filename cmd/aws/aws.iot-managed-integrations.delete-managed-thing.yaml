name: delete-managed-thing
description: Delete a managed thing.
flags:
    --force: When set to `TRUE`, a forceful deteletion of the managed thing will occur.
    --identifier=!: The id of the managed thing.
    --no-force&: When set to `TRUE`, a forceful deteletion of the managed thing will occur.
documentation:
    command: Delete a managed thing. For direct-connected and hub-connected devices connecting with Managed integrations via a controller, all of the devices connected to it will have their status changed to `PENDING`. It is not possible to remove a cloud-to-cloud device.
    flag:
        force: When set to `TRUE`, a forceful deteletion of the managed thing will occur. When set to `FALSE`, a non-forceful deletion of the managed thing will occur.
        identifier: The id of the managed thing.
