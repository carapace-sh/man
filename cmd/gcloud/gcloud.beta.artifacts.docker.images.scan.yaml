name: scan
description: '*(BETA)*  Perform a vulnerability scan on a container image.'
flags:
    --additional-package-types=: (DEPRECATED) A comma-separated list of package types to scan in addition to OS packages.
    --async: Return immediately, without waiting for the operation in progress to
    --experimental-package-types=&: (DEPRECATED) A comma-separated list of experimental package types to scan in addition to OS packages and officially supported third party packages.
    --fake-extraction&: Whether to use fake packages/versions instead of performing extraction.
    --location=: The API location in which to perform package analysis.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-fake-extraction&: Whether to use fake packages/versions instead of performing extraction.
    --no-remote&: Whether the container image is located remotely or on your local machine.
    --no-verbose-errors&: Log internal errors.
    --remote: Whether the container image is located remotely or on your local machine.
    --skip-package-types=: A comma-separated list of package types to skip when scanning.
    --verbose-errors&: Log internal errors.
completion:
    flag:
        location:
            - asia
            - europe
            - us
documentation:
    command: |-
        *(BETA)*  You can scan a container image in a Google Cloud registry (Artifact Registry
        or Container Registry), or a local container image.

        Reference an image by tag or digest using any of the formats:

          Artifact Registry:
            LOCATION-docker.pkg.dev/PROJECT-ID/REPOSITORY-ID/IMAGE[:tag]
            LOCATION-docker.pkg.dev/PROJECT-ID/REPOSITORY-ID/IMAGE@sha256:digest

          Container Registry:
            [LOCATION.]gcr.io/PROJECT-ID/REPOSITORY-ID/IMAGE[:tag]
            [LOCATION.]gcr.io/PROJECT-ID/REPOSITORY-ID/IMAGE@sha256:digest

          Local:
            IMAGE[:tag]
    flag:
        additional-package-types: |-
            (DEPRECATED) A comma-separated list of package types to scan in addition to OS packages.
            +
            This flag is deprecated as scanning for all package types is now the default. To skip scanning for specific package types, use --skip-package-types. _ADDITIONAL_PACKAGE_TYPES_ must be one of:
            +
            *COMPOSER*::: PHP Composer package.
            *GO*::: Go standard library and third party packages.
            *MAVEN*::: Maven package.
            *NPM*::: NPM package.
            *NUGET*::: NuGet package.
            *PYTHON*::: Python package.
            *RUBYGEMS*::: RubyGems package.
            *RUST*::: Rust package.
            :::
            +
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        experimental-package-types: |-
            (DEPRECATED) A comma-separated list of experimental package types to scan in addition to OS packages and officially supported third party packages.
            +
            This flag is deprecated as scanning for all package types is now the default. To skip scanning for specific package types, use --skip-package-types.
        fake-extraction: Whether to use fake packages/versions instead of performing extraction. This flag is for test purposes only.
        location: |-
            The API location in which to perform package analysis. Consider choosing a location closest to where you are located. Proximity to the container image does not affect response time. _LOCATION_ must be one of:
            +
            *asia*::: Perform analysis in Asia
            *europe*::: Perform analysis in Europe
            *us*::: Perform analysis in the US
            :::
            +
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-fake-extraction: Whether to use fake packages/versions instead of performing extraction. This flag is for test purposes only.
        no-remote: Whether the container image is located remotely or on your local machine.
        no-verbose-errors: Log internal errors.
        remote: Whether the container image is located remotely or on your local machine.
        skip-package-types: |-
            A comma-separated list of package types to skip when scanning. _SKIP_PACKAGE_TYPES_ must be one of:
            +
            *COMPOSER*::: PHP Composer package.
            *GO*::: Go standard library and third party packages.
            *MAVEN*::: Maven package.
            *NPM*::: NPM package.
            *NUGET*::: NuGet package.
            *PYTHON*::: Python package.
            *RUBYGEMS*::: RubyGems package.
            *RUST*::: Rust package.
            :::
            +
        verbose-errors: Log internal errors.
