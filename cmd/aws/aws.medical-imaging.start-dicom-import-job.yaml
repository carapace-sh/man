name: start-dicom-import-job
description: Start importing bulk data into an `ACTIVE` data store.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: A unique identifier for API idempotency.
    --data-access-role-arn=!: The Amazon Resource Name (ARN) of the IAM role that grants permission to access medical imaging resources.
    --datastore-id=!: The data store identifier.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-owner-account-id=: The account ID of the source S3 bucket owner.
    --input-s3-uri=!: The input prefix path for the S3 bucket that contains the DICOM files to be imported.
    --job-name=: The import job name.
    --output-s3-uri=!: The output prefix of the S3 bucket to upload the results of the DICOM import job.
documentation:
    command: Start importing bulk data into an `ACTIVE` data store. The import job imports DICOM P10 files found in the S3 prefix specified by the `inputS3Uri` parameter. The import job stores processing results in the file specified by the `outputS3Uri` parameter.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique identifier for API idempotency.
        data-access-role-arn: The Amazon Resource Name (ARN) of the IAM role that grants permission to access medical imaging resources.
        datastore-id: The data store identifier.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-owner-account-id: The account ID of the source S3 bucket owner.
        input-s3-uri: The input prefix path for the S3 bucket that contains the DICOM files to be imported.
        job-name: The import job name.
        output-s3-uri: The output prefix of the S3 bucket to upload the results of the DICOM import job.
