name: create-service-template-version
description: Create a new major or minor version of a service template.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: When included, if two identical requests are made with the same client token, Proton returns the service template version that the first request created.
    --compatible-environment-templates=!:
        description: An array of environment template objects that are compatible with the new service template version.
        nargs: -1
    --description=: A description of the new version of a service template.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --major-version=: To create a new minor version of the service template, include a `major Version`.
    --source=!: An object that includes the template bundle S3 bucket path and name for the new version of a service template.
    --supported-component-sources=:
        description: An array of supported component sources.
        nargs: -1
    --tags=:
        description: An optional list of metadata items that you can associate with the Proton service template version.
        nargs: -1
    --template-name=!: The name of the service template.
documentation:
    command: Create a new major or minor version of a service template. A major version of a service template is a version that *isn't* backward compatible. A minor version of a service template is a version that's backward compatible within its major version.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: When included, if two identical requests are made with the same client token, Proton returns the service template version that the first request created.
        compatible-environment-templates: An array of environment template objects that are compatible with the new service template version. A service instance based on this service template version can run in environments based on compatible templates.
        description: A description of the new version of a service template.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        major-version: |-
            To create a new minor version of the service template, include a `major Version`.

            To create a new major and minor version of the service template, *exclude* `major Version`.
        source: An object that includes the template bundle S3 bucket path and name for the new version of a service template.
        supported-component-sources: |-
            An array of supported component sources. Components with supported sources can be attached to service instances based on this service template version.

            For more information about components, see [Proton components](https://docs.aws.amazon.com/proton/latest/userguide/ag-components.html) in the *Proton User Guide*.
        tags: |-
            An optional list of metadata items that you can associate with the Proton service template version. A tag is a key-value pair.

            For more information, see [Proton resources and tagging](https://docs.aws.amazon.com/proton/latest/userguide/resources.html) in the *Proton User Guide*.
        template-name: The name of the service template.
