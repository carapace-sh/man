name: attach-principal-policy
description: Attaches the specified policy to the specified principal (certificate or other credential).
flags:
    --policy-name=!: The policy name.
    --principal=!: The principal, which can be a certificate ARN (as returned from the CreateCertificate operation) or an Amazon Cognito ID.
documentation:
    command: |-
        Attaches the specified policy to the specified principal (certificate or other credential).

        **Note:** This action is deprecated and works as expected for backward compatibility, but we won't add enhancements. Use [AttachPolicy]() instead.

        Requires permission to access the [AttachPrincipalPolicy](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        policy-name: The policy name.
        principal: The principal, which can be a certificate ARN (as returned from the CreateCertificate operation) or an Amazon Cognito ID.
