name: get-ops-summary
description: View a summary of operations metadata (OpsData) based on specified filters and aggregators.
flags:
    --aggregators=: Optional aggregators that return counts of OpsData based on one or more expressions.
    --filters=: Optional filters used to scope down the returned OpsData.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: A token to start the list.
    --result-attributes=: The OpsData data type to return.
    --sync-name=: Specify the name of a resource data sync to get.
documentation:
    command: View a summary of operations metadata (OpsData) based on specified filters and aggregators. OpsData can include information about Amazon Web Services Systems Manager OpsCenter operational workitems (OpsItems) as well as information about any Amazon Web Services resource or service configured to report OpsData to Amazon Web Services Systems Manager Explorer.
    flag:
        aggregators: Optional aggregators that return counts of OpsData based on one or more expressions.
        filters: Optional filters used to scope down the returned OpsData.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: A token to start the list. Use this token to get the next set of results.
        result-attributes: The OpsData data type to return.
        sync-name: Specify the name of a resource data sync to get.
