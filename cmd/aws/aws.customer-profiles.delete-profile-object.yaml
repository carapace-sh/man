    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-name=!: The unique name of the domain.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --object-type-name=!: The name of the profile object type.
    --profile-id=!: The unique identifier of a customer profile.
    --profile-object-unique-key=!: The unique identifier of the profile object generated by the service.
documentation:
    command: Removes an object associated with a profile of a given ProfileObjectType.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
