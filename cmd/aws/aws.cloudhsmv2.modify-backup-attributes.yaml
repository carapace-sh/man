name: modify-backup-attributes
description: Modifies attributes for CloudHSM backup.
flags:
    --backup-id=!: The identifier (ID) of the backup to modify.
    --never-expires!: Specifies whether the service should exempt a backup from the retention policy for the cluster.
    --no-never-expires!: Specifies whether the service should exempt a backup from the retention policy for the cluster.
documentation:
    command: |-
        Modifies attributes for CloudHSM backup.

        **Cross-account use:** No. You cannot perform this operation on an CloudHSM backup in a different Amazon Web Services account.
    flag:
        backup-id: The identifier (ID) of the backup to modify. To find the ID of a backup, use the [DescribeBackups]() operation.
        never-expires: Specifies whether the service should exempt a backup from the retention policy for the cluster. `True` exempts a backup from the retention policy. `False` means the service applies the backup retention policy defined at the cluster.
