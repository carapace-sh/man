name: describe-security-profile
description: Gets information about a Device Defender security profile.
flags:
    --security-profile-name=!: The name of the security profile whose information you want to get.
documentation:
    command: |-
        Gets information about a Device Defender security profile.

        Requires permission to access the [DescribeSecurityProfile](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        security-profile-name: The name of the security profile whose information you want to get.
