name: update-site-rack-physical-properties
description: Update the physical and logistical details for a rack at a site.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --fiber-optic-cable-type=: The type of fiber that you will use to attach the Outpost to your network.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --maximum-supported-weight-lbs=: The maximum rack weight that this site can support.
    --optical-standard=: The type of optical standard that you will use to attach the Outpost to your network.
    --power-connector=: The power connector that Amazon Web Services should plan to provide for connections to the hardware.
    --power-draw-kva=: The power draw, in kVA, available at the hardware placement position for the rack.
    --power-feed-drop=: Indicates whether the power feed comes above or below the rack.
    --power-phase=: The power option that you can provide for hardware.
    --site-id=!: The ID or the Amazon Resource Name (ARN) of the site.
    --uplink-count=: Racks come with two Outpost network devices.
    --uplink-gbps=: The uplink speed the rack should support for the connection to the Region.
completion:
    flag:
        fiber-optic-cable-type:
            - SINGLE_MODE
            - MULTI_MODE
        maximum-supported-weight-lbs:
            - NO_LIMIT
            - MAX_1400_LBS
            - MAX_1600_LBS
            - MAX_1800_LBS
            - MAX_2000_LBS
        optical-standard:
            - OPTIC_10GBASE_SR
            - OPTIC_10GBASE_IR
            - OPTIC_10GBASE_LR
            - OPTIC_40GBASE_SR
            - OPTIC_40GBASE_ESR
            - OPTIC_40GBASE_IR4_LR4L
            - OPTIC_40GBASE_LR4
            - OPTIC_100GBASE_SR4
            - OPTIC_100GBASE_CWDM4
            - OPTIC_100GBASE_LR4
            - OPTIC_100G_PSM4_MSA
            - OPTIC_1000BASE_LX
            - OPTIC_1000BASE_SX
        power-connector:
            - L6_30P
            - IEC309
            - AH530P7W
            - AH532P6W
            - CS8365C
        power-draw-kva:
            - POWER_5_KVA
            - POWER_10_KVA
            - POWER_15_KVA
            - POWER_30_KVA
        power-feed-drop:
            - ABOVE_RACK
            - BELOW_RACK
        power-phase:
            - SINGLE_PHASE
            - THREE_PHASE
        uplink-count:
            - UPLINK_COUNT_1
            - UPLINK_COUNT_2
            - UPLINK_COUNT_3
            - UPLINK_COUNT_4
            - UPLINK_COUNT_5
            - UPLINK_COUNT_6
            - UPLINK_COUNT_7
            - UPLINK_COUNT_8
            - UPLINK_COUNT_12
            - UPLINK_COUNT_16
        uplink-gbps:
            - UPLINK_1G
            - UPLINK_10G
            - UPLINK_40G
            - UPLINK_100G
documentation:
    command: |-
        Update the physical and logistical details for a rack at a site. For more information about hardware requirements for racks, see [Network readiness checklist](https://docs.aws.amazon.com/outposts/latest/userguide/outposts-requirements.html#checklist) in the Amazon Web Services Outposts User Guide.

        To update a rack at a site with an order of `IN_PROGRESS`, you must wait for the order to complete or cancel the order.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        fiber-optic-cable-type: The type of fiber that you will use to attach the Outpost to your network.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        maximum-supported-weight-lbs: The maximum rack weight that this site can support. `NO_LIMIT` is over 2000lbs.
        optical-standard: |-
            The type of optical standard that you will use to attach the Outpost to your network. This field is dependent on uplink speed, fiber type, and distance to the upstream device. For more information about networking requirements for racks, see [Network](https://docs.aws.amazon.com/outposts/latest/userguide/outposts-requirements.html#facility-networking) in the Amazon Web Services Outposts User Guide.

            - `OPTIC_10GBASE_SR`: 10GBASE-SR
            - `OPTIC_10GBASE_IR`: 10GBASE-IR
            - `OPTIC_10GBASE_LR`: 10GBASE-LR
            - `OPTIC_40GBASE_SR`: 40GBASE-SR
            - `OPTIC_40GBASE_ESR`: 40GBASE-ESR
            - `OPTIC_40GBASE_IR4_LR4L`: 40GBASE-IR (LR4L)
            - `OPTIC_40GBASE_LR4`: 40GBASE-LR4
            - `OPTIC_100GBASE_SR4`: 100GBASE-SR4
            - `OPTIC_100GBASE_CWDM4`: 100GBASE-CWDM4
            - `OPTIC_100GBASE_LR4`: 100GBASE-LR4
            - `OPTIC_100G_PSM4_MSA`: 100G PSM4 MSA
            - `OPTIC_1000BASE_LX`: 1000Base-LX
            - `OPTIC_1000BASE_SX` : 1000Base-SX
        power-connector: "The power connector that Amazon Web Services should plan to provide for connections to the hardware. Note the correlation between `PowerPhase` and `PowerConnector`.\n\n- Single-phase AC feed\n  \n  - **L6-30P** – (common in US); 30A; single phase\n  - **IEC309 (blue)** – P+N+E, 6hr; 32 A; single phase\n- Three-phase AC feed\n  \n  - **AH530P7W (red)** – 3P+N+E, 7hr; 30A; three phase\n  - **AH532P6W (red)** – 3P+N+E, 6hr; 32A; three phase\n  - **CS8365C** – (common in US); 3P+E, 50A; three phase"
        power-draw-kva: The power draw, in kVA, available at the hardware placement position for the rack.
        power-feed-drop: Indicates whether the power feed comes above or below the rack.
        power-phase: |-
            The power option that you can provide for hardware.

            - Single-phase AC feed: 200 V to 277 V, 50 Hz or 60 Hz
            - Three-phase AC feed: 346 V to 480 V, 50 Hz or 60 Hz
        site-id: The ID or the Amazon Resource Name (ARN) of the site.
        uplink-count: |-
            Racks come with two Outpost network devices. Depending on the supported uplink speed at the site, the Outpost network devices provide a variable number of uplinks. Specify the number of uplinks for each Outpost network device that you intend to use to connect the rack to your network. Note the correlation between `UplinkGbps` and `UplinkCount`.

            - 1Gbps - Uplinks available: 1, 2, 4, 6, 8
            - 10Gbps - Uplinks available: 1, 2, 4, 8, 12, 16
            - 40 and 100 Gbps- Uplinks available: 1, 2, 4
        uplink-gbps: The uplink speed the rack should support for the connection to the Region.
