name: list-organization-admin-accounts
description: Lists the Security Hub administrator accounts.
flags:
    --feature=: The feature where the delegated administrator account is listed.
    --max-results=: The maximum number of items to return in the response.
    --next-token=: The token that is required for pagination.
completion:
    flag:
        feature:
            - SecurityHub
            - SecurityHubV2
documentation:
    command: Lists the Security Hub administrator accounts. Can only be called by the organization management account.
    flag:
        feature: The feature where the delegated administrator account is listed. Defaults to Security Hub if not specified.
        max-results: The maximum number of items to return in the response.
        next-token: The token that is required for pagination. On your first call to the `ListOrganizationAdminAccounts` operation, set the value of this parameter to `NULL`. For subsequent calls to the operation, to continue listing data, set the value of this parameter to the value returned from the previous response.
