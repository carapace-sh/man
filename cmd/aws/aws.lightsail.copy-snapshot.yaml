name: copy-snapshot
description: Copies a manual snapshot of an instance or disk as another manual snapshot, or copies an automatic snapshot of an instance or disk as a manual snapshot.
flags:
    --no-use-latest-restorable-auto-snapshot: A Boolean value to indicate whether to use the latest available automatic snapshot of the specified source instance or disk.
    --restore-date=: The date of the source automatic snapshot to copy.
    --source-region=!: The Amazon Web Services Region where the source manual or automatic snapshot is located.
    --source-resource-name=: The name of the source instance or disk from which the source automatic snapshot was created.
    --source-snapshot-name=: The name of the source manual snapshot to copy.
    --target-snapshot-name=!: The name of the new manual snapshot to be created as a copy.
    --use-latest-restorable-auto-snapshot: A Boolean value to indicate whether to use the latest available automatic snapshot of the specified source instance or disk.
completion:
    flag:
        source-region:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
            - eu-west-1
            - eu-west-2
            - eu-west-3
            - eu-central-1
            - ca-central-1
            - ap-south-1
            - ap-southeast-1
            - ap-southeast-2
            - ap-northeast-1
            - ap-northeast-2
            - eu-north-1
            - ap-southeast-3
documentation:
    command: |-
        Copies a manual snapshot of an instance or disk as another manual snapshot, or copies an automatic snapshot of an instance or disk as a manual snapshot. This operation can also be used to copy a manual or automatic snapshot of an instance or a disk from one Amazon Web Services Region to another in Amazon Lightsail.

        When copying a *manual snapshot*, be sure to define the `source region`, `source snapshot name`, and `target snapshot name` parameters.

        When copying an *automatic snapshot*, be sure to define the `source region`, `source resource name`, `target snapshot name`, and either the `restore date` or the `use latest restorable auto snapshot` parameters.
    flag:
        restore-date: |-
            The date of the source automatic snapshot to copy. Use the `get auto snapshots` operation to identify the dates of the available automatic snapshots.

            Constraints:

            - Must be specified in `YYYY-MM-DD` format.
            - This parameter cannot be defined together with the `use latest restorable auto snapshot` parameter. The `restore date` and `use latest restorable auto snapshot` parameters are mutually exclusive.
            - Define this parameter only when copying an automatic snapshot as a manual snapshot. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-keeping-automatic-snapshots).
        source-region: The Amazon Web Services Region where the source manual or automatic snapshot is located.
        source-resource-name: |-
            The name of the source instance or disk from which the source automatic snapshot was created.

            Constraint:

            - Define this parameter only when copying an automatic snapshot as a manual snapshot. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-keeping-automatic-snapshots).
        source-snapshot-name: |-
            The name of the source manual snapshot to copy.

            Constraint:

            - Define this parameter only when copying a manual snapshot as another manual snapshot.
        target-snapshot-name: The name of the new manual snapshot to be created as a copy.
        use-latest-restorable-auto-snapshot: |-
            A Boolean value to indicate whether to use the latest available automatic snapshot of the specified source instance or disk.

            Constraints:

            - This parameter cannot be defined together with the `restore date` parameter. The `use latest restorable auto snapshot` and `restore date` parameters are mutually exclusive.
            - Define this parameter only when copying an automatic snapshot as a manual snapshot. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-keeping-automatic-snapshots).
