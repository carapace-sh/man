name: list-triggers
description: Retrieves the names of all trigger resources in this Amazon Web Services account, or the resources with the specified tag.
flags:
    --dependent-job-name=: The name of the job for which to retrieve triggers.
    --max-results=: The maximum size of a list to return.
    --next-token=: A continuation token, if this is a continuation request.
    --tags=: Specifies to return only these tagged resources.
documentation:
    command: |-
        Retrieves the names of all trigger resources in this Amazon Web Services account, or the resources with the specified tag. This operation allows you to see which resources are available in your account, and their names.

        This operation takes the optional `Tags` field, which you can use as a filter on the response so that tagged resources can be retrieved as a group. If you choose to use tags filtering, only resources with the tag are retrieved.
    flag:
        dependent-job-name: The name of the job for which to retrieve triggers. The trigger that can start this job is returned. If there is no such trigger, all triggers are returned.
        max-results: The maximum size of a list to return.
        next-token: A continuation token, if this is a continuation request.
        tags: Specifies to return only these tagged resources.
