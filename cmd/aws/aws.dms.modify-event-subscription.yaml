name: modify-event-subscription
description: Modifies an existing DMS event notification subscription.
flags:
    --enabled=: A Boolean value; set to **true** to activate the subscription.
    --event-categories=: A list of event categories for a source type that you want to subscribe to.
    --sns-topic-arn=: The Amazon Resource Name (ARN) of the Amazon SNS topic created for event notification.
    --source-type=: The type of DMS resource that generates the events you want to subscribe to.
    --subscription-name=!: The name of the DMS event notification subscription to be modified.
documentation:
    command: Modifies an existing DMS event notification subscription.
    flag:
        enabled: A Boolean value; set to **true** to activate the subscription.
        event-categories: A list of event categories for a source type that you want to subscribe to. Use the `DescribeEventCategories` action to see a list of event categories.
        sns-topic-arn: The Amazon Resource Name (ARN) of the Amazon SNS topic created for event notification. The ARN is created by Amazon SNS when you create a topic and subscribe to it.
        source-type: |-
            The type of DMS resource that generates the events you want to subscribe to.

            Valid values: replication-instance | replication-task
        subscription-name: The name of the DMS event notification subscription to be modified.
