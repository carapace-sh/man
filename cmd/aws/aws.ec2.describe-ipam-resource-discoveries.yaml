name: describe-ipam-resource-discoveries
description: Describes IPAM resource discoveries.
flags:
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --filters=: The resource discovery filters.
    --ipam-resource-discovery-ids=: The IPAM resource discovery IDs.
    --max-results=: The maximum number of resource discoveries to return in one page of results.
    --next-token=: Specify the pagination token from a previous request to retrieve the next page of results.
    --no-dry-run&: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
documentation:
    command: Describes IPAM resource discoveries. A resource discovery is an IPAM component that enables IPAM to manage and monitor resources that belong to the owning account.
    flag:
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: The resource discovery filters.
        ipam-resource-discovery-ids: The IPAM resource discovery IDs.
        max-results: The maximum number of resource discoveries to return in one page of results.
        next-token: Specify the pagination token from a previous request to retrieve the next page of results.
