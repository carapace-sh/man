name: delete-dbcluster-parameter-group
description: Deletes a specified DB cluster parameter group.
flags:
    --dbcluster-parameter-group-name=!: The name of the DB cluster parameter group.
documentation:
    command: |-
        Deletes a specified DB cluster parameter group. The DB cluster parameter group to be deleted can't be associated with any DB clusters.

        For more information on Amazon Aurora, see [What is Amazon Aurora?](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html) in the *Amazon Aurora User Guide*.

        For more information on Multi-AZ DB clusters, see [Multi-AZ DB cluster deployments](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html) in the *Amazon RDS User Guide*.
    flag:
        dbcluster-parameter-group-name: |-
            The name of the DB cluster parameter group.

            Constraints:

            - Must be the name of an existing DB cluster parameter group.
            - You can't delete a default DB cluster parameter group.
            - Can't be associated with any DB clusters.
