name: put-resource-config
description: Records the configuration state for the resource provided in the request.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=!: The configuration object of the resource in valid JSON format.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-id=!: Unique identifier of the resource.
    --resource-name=: Name of the resource.
    --resource-type=!: The type of the resource.
    --schema-version-id=!: Version of the schema registered for the ResourceType in CloudFormation.
    --tags=: Tags associated with the resource.
documentation:
    command: |-
        Records the configuration state for the resource provided in the request. The configuration state of a resource is represented in Config as Configuration Items. Once this API records the configuration item, you can retrieve the list of configuration items for the custom resource type using existing Config APIs.

        The custom resource type must be registered with CloudFormation. This API accepts the configuration item registered with CloudFormation.

        When you call this API, Config only stores configuration state of the resource provided in the request. This API does not change or remediate the configuration of the resource.

        Write-only schema properites are not recorded as part of the published configuration item.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: |-
            The configuration object of the resource in valid JSON format. It must match the schema registered with CloudFormation.

            The configuration JSON must not exceed 64 KB.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        resource-id: Unique identifier of the resource.
        resource-name: Name of the resource.
        resource-type: |-
            The type of the resource. The custom resource type must be registered with CloudFormation.

            You cannot use the organization names “amzn”, “amazon”, “alexa”, “custom” with custom resource types. It is the first part of the ResourceType up to the first ::.
        schema-version-id: Version of the schema registered for the ResourceType in CloudFormation.
        tags: |-
            Tags associated with the resource.

            This field is not to be confused with the Amazon Web Services-wide tag feature for Amazon Web Services resources. Tags for `PutResourceConfig` are tags that you supply for the configuration items of your custom resources.
