name: list-applications
description: Retrieves a list of all of your applications.
flags:
    --max-results=: The upper bound of the number of results to return (cannot exceed 25).
    --next-token=: The token to use to get the next page of results after a previous API call.
documentation:
    command: Retrieves a list of all of your applications. Results are paginated.
    flag:
        max-results: The upper bound of the number of results to return (cannot exceed 25). If this parameter is omitted, it defaults to 25. This value is optional.
        next-token: The token to use to get the next page of results after a previous API call.
