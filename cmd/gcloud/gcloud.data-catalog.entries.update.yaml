name: update
description: '*(DEPRECATED)*  Update a Data Catalog entry.'
flags:
    --add-file-patterns=: A list of file patterns to add to the current list.
    --clear-file-patterns: If specified, clear the current list of file patterns.
    --description=: Textual description of the entry.
    --display-name=: Human-readable name for the entry.
    --entry-group=: Entry group of the entry.
    --kafka-cluster-bootstrap-servers=&: A comma-separated list of host and port pairs that are the addresses of
    --kafka-cluster=&: Name of the entry representing Kafka cluster this topic is a part of.
    --kafka-topic=&: Name of the Kafka topic this Entry represents.
    --linked-resource=: Link to the resource in external system.
    --location=: Location of the entry.
    --lookup-entry=: The name of the target resource whose entry to update.
    --no-clear-file-patterns&: If specified, clear the current list of file patterns.
    --physical-schema-file=&: File contents with physical schema.
    --physical-schema-type=!&: Type of physical schema.
    --remove-file-patterns=: A list of file patterns to remove from the current list.
    --schema-from-file=: Path to a JSON or YAML file containing the schema for the entry.
    --schema=: Inline schema for the entry.
    --user-specified-system=: External system from which the entry is fed.
    --user-specified-type=: Type of the entry coming from external system.
documentation:
    command: |4-
        *(DEPRECATED)*  This command is deprecated. Please use `gcloud dataplex entries` instead.

        Update a Data Catalog entry. The entry to update can either be specified directly, or
        the `--lookup-entry` flag may be used to update the entry corresponding to the lookup of the
        given resource.
    flag:
        add-file-patterns: A list of file patterns to add to the current list.
        clear-file-patterns: If specified, clear the current list of file patterns.
        description: Textual description of the entry.
        display-name: Human-readable name for the entry.
        entry-group: |-
            Entry group of the entry.
            +

            To set the `entry-group` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--entry-group` on the command line.
        kafka-cluster: Name of the entry representing Kafka cluster this topic is a part of.
        kafka-cluster-bootstrap-servers: |-
            A comma-separated list of host and port pairs that are the addresses of
            the Kafka brokers.
        kafka-topic: Name of the Kafka topic this Entry represents.
        linked-resource: |-
            Link to the resource in external system. If `--type` is not used,
            then `--linked-resource` may be provided.
        location: |-
            Location of the entry.
            +

            To set the `location` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        lookup-entry: |-
            The name of the target resource whose entry to update. This can be either the
            Google Cloud Platform resource name or the SQL name of a Google Cloud Platform
            resource. This flag allows one to update the entry corresponding to the lookup
            of the given resource, without needing to specify the entry directly.
        no-clear-file-patterns: If specified, clear the current list of file patterns.
        physical-schema-file: File contents with physical schema.
        physical-schema-type: Type of physical schema. Accepted values are avro, thrift, protobuf, parquet, orc
        remove-file-patterns: A list of file patterns to remove from the current list.
        schema: |-
            Inline schema for the entry. When specifying a schema via this argument, only column names
            and types should be provided. Column modes will default to NULLABLE, and column descriptions
            and nested subcolumns are not supported.
        schema-from-file: |-
            Path to a JSON or YAML file containing the schema for the entry. This can be used to specify
            schemas with column descriptions, column modes other than NULLABLE, and nested subcolumns. Use a full or relative path to a local file containing the value of schema.
        user-specified-system: External system from which the entry is fed. This can be updated for on prem entries.
        user-specified-type: Type of the entry coming from external system. This can be updated for on prem entries.
