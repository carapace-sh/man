name: get-notification-event
description: Returns a specified `NotificationEvent`.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the `NotificationEvent` to return.
    --locale=: The locale code of the language used for the retrieved `NotificationEvent`.
completion:
    flag:
        locale:
            - de_DE
            - en_CA
            - en_US
            - en_UK
            - es_ES
            - fr_CA
            - fr_FR
            - id_ID
            - it_IT
            - ja_JP
            - ko_KR
            - pt_BR
            - tr_TR
            - zh_CN
            - zh_TW
documentation:
    command: |-
        Returns a specified `NotificationEvent`.

        User Notifications stores notifications in the individual Regions you register as notification hubs and the Region of the source event rule. `GetNotificationEvent` only returns notifications stored in the same Region in which the action is called. User Notifications doesn't backfill notifications to new Regions selected as notification hubs. For this reason, we recommend that you make calls in your oldest registered notification hub. For more information, see [Notification hubs](https://docs.aws.amazon.com/notifications/latest/userguide/notification-hubs.html) in the *Amazon Web Services User Notifications User Guide*.
    flag:
        arn: The Amazon Resource Name (ARN) of the `NotificationEvent` to return.
        locale: The locale code of the language used for the retrieved `NotificationEvent`. The default locale is English `en_US`.
