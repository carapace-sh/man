name: create
description: '*(BETA)*  Create a Cloud NetApp Volume Quota Rule.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: A description of the Cloud NetApp Quota rule
    --disk-limit-mib=!: The disk limit in MiB for the quota rule.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the quota_rule.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --target=: The target of the quota rule.
    --type=!: String indicating the type of quota rule.
    --volume=: ID of the volume or fully qualified identifier for the volume.
documentation:
    command: |
        *(BETA)*  Create a Cloud NetApp Volume Quota Rule.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: A description of the Cloud NetApp Quota rule
        disk-limit-mib: The disk limit in MiB for the quota rule.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the quota_rule.
            +
            To set the `location` attribute:
            * provide the argument `quota_rule` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        target: |-
            The target of the quota rule.
            Identified by a Unix UID/GID, Windows SID, or null for default.
        type: |-
            String indicating the type of quota rule.
            The supported values are: 'DEFAULT_USER_QUOTA','DEFAULT_GROUP_QUOTA','INDIVIDUAL_USER_QUOTA','INDIVIDUAL_GROUP_QUOTA'
        volume: |-
            ID of the volume or fully qualified identifier for the volume.
            +
            To set the `volume` attribute:
            * provide the argument `--volume` on the command line.
