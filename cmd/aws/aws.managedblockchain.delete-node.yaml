name: delete-node
description: Deletes a node that your Amazon Web Services account owns.
flags:
    --member-id=: The unique identifier of the member that owns this node.
    --network-id=!: The unique identifier of the network that the node is on.
    --node-id=!: The unique identifier of the node.
documentation:
    command: |-
        Deletes a node that your Amazon Web Services account owns. All data on the node is lost and cannot be recovered.

        Applies to Hyperledger Fabric and Ethereum.
    flag:
        member-id: |-
            The unique identifier of the member that owns this node.

            Applies only to Hyperledger Fabric and is required for Hyperledger Fabric.
        network-id: |-
            The unique identifier of the network that the node is on.

            Ethereum public networks have the following `NetworkId`s:

            - `n-ethereum-mainnet`
        node-id: The unique identifier of the node.
