name: describe
description: '*(BETA)*  Show metadata for a Cloud NetApp Storage Pool.'
flags:
    --location=: The location of the storage_pool.
documentation:
    command: |
        *(BETA)*  Describe a Storage Pool
    flag:
        location: |-
            The location of the storage_pool.
            +
            To set the `location` attribute:
            * provide the argument `storage_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
