name: describe
description: '*(ALPHA)*  Show details of the data source.'
flags:
    --backup-vault=: The ID of the Backup Vault.
    --location=: Location ID of the resource.
documentation:
    command: '*(ALPHA)*  Show all configuration data associated with the specified data source.'
    flag:
        backup-vault: |-
            The ID of the Backup Vault.
            +
            To set the `backup-vault` attribute:
            * provide the argument `data_source` on the command line with a fully specified name;
            * provide the argument `--backup-vault` on the command line.
        location: |-
            Location ID of the resource.
            +

            To set the `location` attribute:
            * provide the argument `data_source` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
