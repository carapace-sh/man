name: delete-group
description: Deletes a group from WorkMail.
flags:
    --group-id=!: The identifier of the group to be deleted.
    --organization-id=!: The organization that contains the group.
documentation:
    command: Deletes a group from WorkMail.
    flag:
        group-id: |-
            The identifier of the group to be deleted.

            The identifier can be the *GroupId*, or *Groupname*. The following identity formats are available:

            - Group ID: 12345678-1234-1234-1234-123456789012 or S-1-1-12-1234567890-123456789-123456789-1234
            - Group name: group
        organization-id: The organization that contains the group.
