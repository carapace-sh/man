name: create-verified-access-endpoint
description: An Amazon Web Services Verified Access endpoint is where you define your application along with an optional endpoint-level access policy.
flags:
    --application-domain=: The DNS name for users to reach your application.
    --attachment-type=!: The type of attachment.
    --cidr-options=: The CIDR options.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive token that you provide to ensure idempotency of your modification request.
    --description=: A description for the Verified Access endpoint.
    --domain-certificate-arn=: The ARN of the public TLS/SSL certificate in Amazon Web Services Certificate Manager to associate with the endpoint.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --endpoint-domain-prefix=: A custom identifier that is prepended to the DNS name that is generated for the endpoint.
    --endpoint-type=!: The type of Verified Access endpoint to create.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --load-balancer-options=: The load balancer details.
    --network-interface-options=: The network interface details.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --policy-document=: The Verified Access policy document.
    --rds-options=: The RDS details.
    --security-group-ids=:
        description: The IDs of the security groups to associate with the Verified Access endpoint.
        nargs: -1
    --sse-specification=: The options for server side encryption.
    --tag-specifications=:
        description: The tags to assign to the Verified Access endpoint.
        nargs: -1
    --verified-access-group-id=!: The ID of the Verified Access group to associate the endpoint with.
completion:
    flag:
        attachment-type:
            - vpc
        endpoint-type:
            - load-balancer
            - network-interface
            - rds
            - cidr
documentation:
    command: An Amazon Web Services Verified Access endpoint is where you define your application along with an optional endpoint-level access policy.
    flag:
        application-domain: The DNS name for users to reach your application.
        attachment-type: The type of attachment.
        cidr-options: The CIDR options. This parameter is required if the endpoint type is `cidr`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive token that you provide to ensure idempotency of your modification request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        description: A description for the Verified Access endpoint.
        domain-certificate-arn: The ARN of the public TLS/SSL certificate in Amazon Web Services Certificate Manager to associate with the endpoint. The CN in the certificate must match the DNS name your end users will use to reach your application.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        endpoint-domain-prefix: A custom identifier that is prepended to the DNS name that is generated for the endpoint.
        endpoint-type: The type of Verified Access endpoint to create.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        load-balancer-options: The load balancer details. This parameter is required if the endpoint type is `load-balancer`.
        network-interface-options: The network interface details. This parameter is required if the endpoint type is `network-interface`.
        policy-document: The Verified Access policy document.
        rds-options: The RDS details. This parameter is required if the endpoint type is `rds`.
        security-group-ids: The IDs of the security groups to associate with the Verified Access endpoint. Required if `AttachmentType` is set to `vpc`.
        sse-specification: The options for server side encryption.
        tag-specifications: The tags to assign to the Verified Access endpoint.
        verified-access-group-id: The ID of the Verified Access group to associate the endpoint with.
