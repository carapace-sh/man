name: create-elasticsearch-domain
description: Creates a new Elasticsearch domain.
flags:
    --access-policies=: IAM access policy as a JSON-formatted string.
    --advanced-options=: Option to allow references to indices in an HTTP request body.
    --advanced-security-options=: Specifies advanced security options.
    --auto-tune-options=: Specifies Auto-Tune options.
    --cognito-options=: Options to specify the Cognito user and identity pools for Kibana authentication.
    --domain-endpoint-options=: Options to specify configuration that will be applied to the domain endpoint.
    --domain-name=!: The name of the Elasticsearch domain that you are creating.
    --ebsoptions=: Options to enable, disable and specify the type and size of EBS storage volumes.
    --elasticsearch-cluster-config=: Configuration options for an Elasticsearch domain.
    --elasticsearch-version=: String of format X.Y to specify version for the Elasticsearch domain eg.
    --encryption-at-rest-options=: Specifies the Encryption At Rest Options.
    --log-publishing-options=: Map of `LogType` and `LogPublishingOption`, each containing options to publish a given type of Elasticsearch log.
    --node-to-node-encryption-options=: Specifies the NodeToNodeEncryptionOptions.
    --snapshot-options=: Option to set time, in UTC format, of the daily automated snapshot.
    --tag-list=: A list of `Tag` added during domain creation.
    --vpcoptions=: Options to specify the subnets and security groups for VPC endpoint.
documentation:
    command: Creates a new Elasticsearch domain. For more information, see [Creating Elasticsearch Domains](http://docs.aws.amazon.com/elasticsearch-service/latest/developerguide/es-createupdatedomains.html#es-createdomains) in the *Amazon Elasticsearch Service Developer Guide*.
    flag:
        access-policies: IAM access policy as a JSON-formatted string.
        advanced-options: Option to allow references to indices in an HTTP request body. Must be `false` when configuring access to individual sub-resources. By default, the value is `true`. See [Configuration Advanced Options](http://docs.aws.amazon.com/elasticsearch-service/latest/developerguide/es-createupdatedomains.html#es-createdomain-configure-advanced-options) for more information.
        advanced-security-options: Specifies advanced security options.
        auto-tune-options: Specifies Auto-Tune options.
        cognito-options: Options to specify the Cognito user and identity pools for Kibana authentication. For more information, see [Amazon Cognito Authentication for Kibana](http://docs.aws.amazon.com/elasticsearch-service/latest/developerguide/es-cognito-auth.html).
        domain-endpoint-options: Options to specify configuration that will be applied to the domain endpoint.
        domain-name: 'The name of the Elasticsearch domain that you are creating. Domain names are unique across the domains owned by an account within an AWS region. Domain names must start with a lowercase letter and can contain the following characters: a-z (lowercase), 0-9, and - (hyphen).'
        ebsoptions: Options to enable, disable and specify the type and size of EBS storage volumes.
        elasticsearch-cluster-config: Configuration options for an Elasticsearch domain. Specifies the instance type and number of instances in the domain cluster.
        elasticsearch-version: String of format X.Y to specify version for the Elasticsearch domain eg. "1.5" or "2.3". For more information, see [Creating Elasticsearch Domains](http://docs.aws.amazon.com/elasticsearch-service/latest/developerguide/es-createupdatedomains.html#es-createdomains) in the *Amazon Elasticsearch Service Developer Guide*.
        encryption-at-rest-options: Specifies the Encryption At Rest Options.
        log-publishing-options: Map of `LogType` and `LogPublishingOption`, each containing options to publish a given type of Elasticsearch log.
        node-to-node-encryption-options: Specifies the NodeToNodeEncryptionOptions.
        snapshot-options: Option to set time, in UTC format, of the daily automated snapshot. Default value is 0 hours.
        tag-list: A list of `Tag` added during domain creation.
        vpcoptions: Options to specify the subnets and security groups for VPC endpoint. For more information, see [Creating a VPC](http://docs.aws.amazon.com/elasticsearch-service/latest/developerguide/es-vpc.html#es-creating-vpc) in *VPC Endpoints for Amazon Elasticsearch Service Domains*
