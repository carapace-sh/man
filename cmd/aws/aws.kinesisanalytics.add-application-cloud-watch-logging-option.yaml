name: add-application-cloud-watch-logging-option
description: This documentation is for version 1 of the Amazon Kinesis Data Analytics API, which only supports SQL applications.
flags:
    --application-name=!: The Kinesis Analytics application name.
    --cloud-watch-logging-option=!: Provides the CloudWatch log stream Amazon Resource Name (ARN) and the IAM role ARN.
    --current-application-version-id=!: The version ID of the Kinesis Analytics application.
documentation:
    command: |-
        This documentation is for version 1 of the Amazon Kinesis Data Analytics API, which only supports SQL applications. Version 2 of the API supports SQL and Java applications. For more information about version 2, see [Amazon Kinesis Data Analytics API V2 Documentation](/kinesisanalytics/latest/apiv2/Welcome.html).

        Adds a CloudWatch log stream to monitor application configuration errors. For more information about using CloudWatch log streams with Amazon Kinesis Analytics applications, see [Working with Amazon CloudWatch Logs](https://docs.aws.amazon.com/kinesisanalytics/latest/dev/cloudwatch-logs.html).
    flag:
        application-name: The Kinesis Analytics application name.
        cloud-watch-logging-option: 'Provides the CloudWatch log stream Amazon Resource Name (ARN) and the IAM role ARN. Note: To write application messages to CloudWatch, the IAM role that is used must have the `PutLogEvents` policy action enabled.'
        current-application-version-id: The version ID of the Kinesis Analytics application.
