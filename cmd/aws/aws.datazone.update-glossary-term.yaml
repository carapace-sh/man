name: update-glossary-term
description: Updates a business glossary term in Amazon DataZone.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-identifier=!: The identifier of the Amazon DataZone domain in which a business glossary term is to be updated.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --glossary-identifier=: The identifier of the business glossary in which a term is to be updated.
    --identifier=!: The identifier of the business glossary term that is to be updated.
    --long-description=: The long description to be updated as part of the `UpdateGlossaryTerm` action.
    --name=: The name to be updated as part of the `UpdateGlossaryTerm` action.
    --short-description=: The short description to be updated as part of the `UpdateGlossaryTerm` action.
    --status=: The status to be updated as part of the `UpdateGlossaryTerm` action.
    --term-relations=: The term relations to be updated as part of the `UpdateGlossaryTerm` action.
completion:
    flag:
        status:
            - ENABLED
            - DISABLED
documentation:
    command: |-
        Updates a business glossary term in Amazon DataZone.

        Prerequisites:

        - Glossary term must exist in the specified domain.
        - New name must not conflict with existing terms in the same glossary.
        - User must have permissions on the term.
        - The term must not be in DELETED status.
