name: set-policy
description: '*(ALPHA)*  Set Organization Policy.'
flags:
    --folder=: Folder ID.
    --organization=: Organization ID.
documentation:
    command: |-
        *(ALPHA)*  Sets an Organization Policy associated with the specified resource from
        a file that contains the JSON or YAML encoded Organization Policy.

        ## EXAMPLES

        Organization policy list constraint YAML file example:

          constraint: constraints/CONSTRAINT_NAME
          listPolicy:
            deniedValues:
            - VALUE_A

        Organization policy list constraint JSON file example:

          {
            "constraint": "constraints/CONSTRAINT_NAME",
            "listPolicy": {
              "deniedValues": ["VALUE_A"]
            }
          }

        The following command sets an Organization Policy for a constraint
        on project `foo-project` from file `/tmp/policy.yaml`:

          $ gcloud alpha resource-manager org-policies set-policy --project=foo-project /tmp/policy.yaml
    flag:
        folder: Folder ID.
        organization: Organization ID.
