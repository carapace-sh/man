name: update
description: Update a group.
flags:
    --clear-description: Clear existing description on group being updated.
    --clear-display-name: Clear existing display name on group being updated.
    --description=: Replace existing description on group being updated.
    --display-name=: Replace existing display name on group being updated.
    --dynamic-user-query=: Query that determines the memberships of the dynamic group.
    --labels=: One or more label entries that apply to the group.
    --no-clear-description&: Clear existing description on group being updated.
    --no-clear-display-name&: Clear existing display name on group being updated.
documentation:
    command: Update a group.
    flag:
        clear-description: Clear existing description on group being updated.
        clear-display-name: Clear existing display name on group being updated.
        description: Replace existing description on group being updated.
        display-name: Replace existing display name on group being updated.
        dynamic-user-query: |-
            Query that determines the memberships of the dynamic group.
            +
            Example of a query:
            `--dynamic-user-query="user.organizations.exists(org,org.title=='SWE')"`
        labels: |-
            One or more label entries that apply to the group. Currently supported labels contain a key
            with an empty value.
            +
            Google Groups are the default type of group and have a label with a key of
            'cloudidentity.googleapis.com/groups.discussion_forum' and an empty value.
            +
            Existing Google Groups can have an additional label with a key of
            'cloudidentity.googleapis.com/groups.security' and an empty value added to them.
            *This is an immutable change and the security label cannot be removed once added.*
            +
            Dynamic groups have a label with a key of 'cloudidentity.googleapis.com/groups.dynamic'.
            +
            Identity-mapped groups for Cloud Search have a label with a key of 'system/groups/external'
            and an empty value.
            +
            Examples: {"cloudidentity.googleapis.com/groups.discussion_forum": ""} or
            {"system/groups/external": ""}.
        no-clear-description: Clear existing description on group being updated.
        no-clear-display-name: |
            Clear existing display name on group being updated.
