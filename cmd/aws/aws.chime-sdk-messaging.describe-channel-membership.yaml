name: describe-channel-membership
description: Returns the full details of a user's channel membership.
flags:
    --channel-arn=!: The ARN of the channel.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
    --member-arn=!: The `AppInstanceUserArn` of the member.
    --sub-channel-id=: The ID of the SubChannel in the request.
documentation:
    command: |-
        Returns the full details of a user's channel membership.

        The `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call as the value in the header.
    flag:
        channel-arn: The ARN of the channel.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
        member-arn: The `AppInstanceUserArn` of the member.
        sub-channel-id: |-
            The ID of the SubChannel in the request. The response contains an `ElasticChannelConfiguration` object.

            Only required to get a user’s SubChannel membership details.
