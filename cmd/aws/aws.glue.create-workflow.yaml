name: create-workflow
description: Creates a new workflow.
flags:
    --default-run-properties=: A collection of properties to be used as part of each execution of the workflow.
    --description=: A description of the workflow.
    --max-concurrent-runs=: You can use this parameter to prevent unwanted multiple updates to data, to control costs, or in some cases, to prevent exceeding the maximum number of concurrent runs of any of the component jobs.
    --name=!: The name to be assigned to the workflow.
    --tags=: The tags to be used with this workflow.
documentation:
    command: Creates a new workflow.
    flag:
        default-run-properties: |-
            A collection of properties to be used as part of each execution of the workflow.

            Run properties may be logged. Do not pass plaintext secrets as properties. Retrieve secrets from a Glue Connection, Amazon Web Services Secrets Manager or other secret management mechanism if you intend to use them within the workflow run.
        description: A description of the workflow.
        max-concurrent-runs: You can use this parameter to prevent unwanted multiple updates to data, to control costs, or in some cases, to prevent exceeding the maximum number of concurrent runs of any of the component jobs. If you leave this parameter blank, there is no limit to the number of concurrent workflow runs.
        name: The name to be assigned to the workflow. It should be unique within your account.
        tags: The tags to be used with this workflow.
