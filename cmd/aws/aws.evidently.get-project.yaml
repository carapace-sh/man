name: get-project
description: Returns the details about one launch.
flags:
    --project=!: The name or ARN of the project that you want to see the details of.
documentation:
    command: Returns the details about one launch. You must already know the project name. To retrieve a list of projects in your account, use [ListProjects](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_ListProjects.html).
    flag:
        project: The name or ARN of the project that you want to see the details of.
