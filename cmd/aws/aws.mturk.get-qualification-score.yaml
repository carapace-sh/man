name: get-qualification-score
description: The `GetQualificationScore` operation returns the value of a Worker's Qualification for a given Qualification type.
flags:
    --qualification-type-id=!: The ID of the QualificationType.
    --worker-id=!: The ID of the Worker whose Qualification is being updated.
documentation:
    command: |-
        The `GetQualificationScore` operation returns the value of a Worker's Qualification for a given Qualification type.

        To get a Worker's Qualification, you must know the Worker's ID. The Worker's ID is included in the assignment data returned by the `ListAssignmentsForHIT` operation.

        Only the owner of a Qualification type can query the value of a Worker's Qualification of that type.
    flag:
        qualification-type-id: The ID of the QualificationType.
        worker-id: The ID of the Worker whose Qualification is being updated.
