name: list-locations
description: Returns a list of source and destination locations.
flags:
    --filters=: You can use API filters to narrow down the list of resources returned by `ListLocations`.
    --max-results=: The maximum number of locations to return.
    --next-token=: An opaque string that indicates the position at which to begin the next list of locations.
documentation:
    command: |-
        Returns a list of source and destination locations.

        If you have more locations than are returned in a response (that is, the response returns only a truncated list of your agents), the response contains a token that you can specify in your next request to fetch the next page of locations.
    flag:
        filters: You can use API filters to narrow down the list of resources returned by `ListLocations`. For example, to retrieve all tasks on a specific source location, you can use `ListLocations` with filter name `LocationType S3` and `Operator Equals`.
        max-results: The maximum number of locations to return.
        next-token: An opaque string that indicates the position at which to begin the next list of locations.
