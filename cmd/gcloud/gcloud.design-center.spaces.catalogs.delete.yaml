name: delete
description: Delete a catalog.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --force: If set to true, the catalog's children are also deleted.
    --location=: The location id of the catalog resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-force&: If set to true, the catalog's children are also deleted.
    --space=: The space id of the catalog resource.
documentation:
    command: Delete a catalog in a space.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        force: |-
            If set to true, the catalog's children are also deleted. If false, the
            catalog is only deleted if it has no children.
        location: |-
            The location id of the catalog resource.
            +
            To set the `location` attribute:
            * provide the argument `catalog` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-force: |-
            If set to true, the catalog's children are also deleted. If false, the
            catalog is only deleted if it has no children.
        space: |-
            The space id of the catalog resource.
            +
            To set the `space` attribute:
            * provide the argument `catalog` on the command line with a fully specified name;
            * provide the argument `--space` on the command line.
