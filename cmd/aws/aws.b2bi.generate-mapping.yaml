name: generate-mapping
description: Takes sample input and output documents and uses Amazon Bedrock to generate a mapping automatically.
flags:
    --input-file-content=!: Provide the contents of a sample X12 EDI file, either in JSON or XML format, to use as a starting point for the mapping.
    --mapping-type=!: 'Specify the mapping type: either `JSONATA` or `XSLT.`'
    --output-file-content=!: Provide the contents of a sample X12 EDI file, either in JSON or XML format, to use as a target for the mapping.
completion:
    flag:
        mapping-type:
            - JSONATA
            - XSLT
documentation:
    command: |-
        Takes sample input and output documents and uses Amazon Bedrock to generate a mapping automatically. Depending on the accuracy and other factors, you can then edit the mapping for your needs.

        Before you can use the AI-assisted feature for Amazon Web Services B2B Data Interchange you must enable models in Amazon Bedrock. For details, see [AI-assisted template mapping prerequisites](https://docs.aws.amazon.com/b2bi/latest/userguide/ai-assisted-mapping.html#ai-assist-prereq) in the *Amazon Web Services B2B Data Interchange User guide*.

        To generate a mapping, perform the following steps:

        1. Start with an X12 EDI document to use as the input.
        2. Call `TestMapping` using your EDI document.
        3. Use the output from the `TestMapping` operation as either input or output for your GenerateMapping call, along with your sample file.
    flag:
        input-file-content: Provide the contents of a sample X12 EDI file, either in JSON or XML format, to use as a starting point for the mapping.
        mapping-type: 'Specify the mapping type: either `JSONATA` or `XSLT.`'
        output-file-content: Provide the contents of a sample X12 EDI file, either in JSON or XML format, to use as a target for the mapping.
