name: describe-recommendations
description: 'End of support notice: On May 20, 2026, Amazon Web Services will end support for Amazon Web Services DMS Fleet Advisor;.'
flags:
    --filters=: Filters applied to the target engine recommendations described in the form of key-value pairs.
    --max-records=: The maximum number of records to include in the response.
    --next-token=: Specifies the unique pagination token that makes it possible to display the next page of results.
documentation:
    command: |-
        End of support notice: On May 20, 2026, Amazon Web Services will end support for Amazon Web Services DMS Fleet Advisor;. After May 20, 2026, you will no longer be able to access the Amazon Web Services DMS Fleet Advisor; console or Amazon Web Services DMS Fleet Advisor; resources. For more information, see [Amazon Web Services DMS Fleet Advisor end of support](https://docs.aws.amazon.com/dms/latest/userguide/dms_fleet.advisor-end-of-support.html).

        Returns a paginated list of target engine recommendations for your source databases.
    flag:
        filters: |-
            Filters applied to the target engine recommendations described in the form of key-value pairs.

            Valid filter names: `database-id` | `engine-name`
        max-records: The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, Fleet Advisor includes a pagination token in the response so that you can retrieve the remaining results.
        next-token: |-
            Specifies the unique pagination token that makes it possible to display the next page of results. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.

            If `NextToken` is returned by a previous response, there are more results available. The value of `NextToken` is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged.
