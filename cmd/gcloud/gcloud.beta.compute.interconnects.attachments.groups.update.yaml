name: update
description: '*(BETA)*  Update a Compute Engine interconnect attachment group.'
flags:
    --attachments=: Member interconnect attachments to add to the interconnect attachment
    --description=: An optional, textual description for the interconnect attachment group.
    --intended-availability-sla=: The availability SLA that the user intends this group to support.
    --update-mask=: Optional update mask to specify which fields to update.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute interconnects attachments groups update* is used to update interconnect attachment groups.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        attachments: |-
            Member interconnect attachments to add to the interconnect attachment
            group initially.
        description: An optional, textual description for the interconnect attachment group.
        intended-availability-sla: The availability SLA that the user intends this group to support.
        update-mask: |-
            Optional update mask to specify which fields to update. Use commas to
            separate masks. If not specified, all fields present in the command will
            be updated.
