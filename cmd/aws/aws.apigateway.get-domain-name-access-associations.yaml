name: get-domain-name-access-associations
description: Represents a collection on DomainNameAccessAssociations resources.
flags:
    --limit=: The maximum number of returned results per page.
    --position=: The current pagination position in the paged result set.
    --resource-owner=: The owner of the domain name access association.
completion:
    flag:
        resource-owner:
            - SELF
            - OTHER_ACCOUNTS
documentation:
    command: Represents a collection on DomainNameAccessAssociations resources.
    flag:
        limit: The maximum number of returned results per page. The default value is 25 and the maximum value is 500.
        position: The current pagination position in the paged result set.
        resource-owner: The owner of the domain name access association. Use `SELF` to only list the domain name access associations owned by your own account. Use `OTHER_ACCOUNTS` to list the domain name access associations with your private custom domain names that are owned by other AWS accounts.
