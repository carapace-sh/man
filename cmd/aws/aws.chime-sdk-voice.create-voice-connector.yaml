name: create-voice-connector
description: Creates an Amazon Chime SDK Voice Connector.
flags:
    --aws-region=: The AWS Region in which the Amazon Chime SDK Voice Connector is created.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --integration-type=: The connectors for use with Amazon Connect.
    --name=!: The name of the Voice Connector.
    --network-type=: The type of network for the Voice Connector.
    --no-require-encryption!: Enables or disables encryption for the Voice Connector.
    --require-encryption!: Enables or disables encryption for the Voice Connector.
    --tags=:
        description: The tags assigned to the Voice Connector.
        nargs: -1
completion:
    flag:
        aws-region:
            - us-east-1
            - us-west-2
            - ca-central-1
            - eu-central-1
            - eu-west-1
            - eu-west-2
            - ap-northeast-2
            - ap-northeast-1
            - ap-southeast-1
            - ap-southeast-2
        integration-type:
            - CONNECT_CALL_TRANSFER_CONNECTOR
            - CONNECT_ANALYTICS_CONNECTOR
        network-type:
            - IPV4_ONLY
            - DUAL_STACK
documentation:
    command: Creates an Amazon Chime SDK Voice Connector. For more information about Voice Connectors, see [Managing Amazon Chime SDK Voice Connector groups](https://docs.aws.amazon.com/chime-sdk/latest/ag/voice-connector-groups.html) in the *Amazon Chime SDK Administrator Guide*.
    flag:
        aws-region: 'The AWS Region in which the Amazon Chime SDK Voice Connector is created. Default value: `us-east-1` .'
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        integration-type: |-
            The connectors for use with Amazon Connect.

            The following options are available:

            - `CONNECT_CALL_TRANSFER_CONNECTOR` - Enables enterprises to integrate Amazon Connect with other voice systems to directly transfer voice calls and metadata without using the public telephone network. They can use Amazon Connect telephony and Interactive Voice Response (IVR) with their existing voice systems to modernize the IVR experience of their existing contact center and their enterprise and branch voice systems. Additionally, enterprises migrating their contact center to Amazon Connect can start with Connect telephony and IVR for immediate modernization ahead of agent migration.
            - `CONNECT_ANALYTICS_CONNECTOR` - Enables enterprises to integrate Amazon Connect with other voice systems for real-time and post-call analytics. They can use Amazon Connect Contact Lens with their existing voice systems to provides call recordings, conversational analytics (including contact transcript, sensitive data redaction, content categorization, theme detection, sentiment analysis, real-time alerts, and post-contact summary), and agent performance evaluations (including evaluation forms, automated evaluation, supervisor review) with a rich user experience to display, search and filter customer interactions, and programmatic access to data streams and the data lake. Additionally, enterprises migrating their contact center to Amazon Connect can start with Contact Lens analytics and performance insights ahead of agent migration.
        name: The name of the Voice Connector.
        network-type: The type of network for the Voice Connector. Either IPv4 only or dual-stack (IPv4 and IPv6).
        require-encryption: Enables or disables encryption for the Voice Connector.
        tags: The tags assigned to the Voice Connector.
