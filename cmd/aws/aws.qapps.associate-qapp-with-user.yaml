name: associate-qapp-with-user
description: This operation creates a link between the user's identity calling the operation and a specific Q App.
flags:
    --app-id=!: The ID of the Amazon Q App to associate with the user.
    --instance-id=!: The unique identifier of the Amazon Q Business application environment instance.
documentation:
    command: This operation creates a link between the user's identity calling the operation and a specific Q App. This is useful to mark the Q App as a *favorite* for the user if the user doesn't own the Amazon Q App so they can still run it and see it in their inventory of Q Apps.
    flag:
        app-id: The ID of the Amazon Q App to associate with the user.
        instance-id: The unique identifier of the Amazon Q Business application environment instance.
