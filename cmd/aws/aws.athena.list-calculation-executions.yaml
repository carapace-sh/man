name: list-calculation-executions
description: Lists the calculations that have been submitted to a session in descending order.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of calculation executions to return.
    --next-token=: A token generated by the Athena service that specifies where to continue pagination if a previous request was truncated.
    --session-id=!: The session ID.
    --state-filter=: A filter for a specific calculation execution state.
completion:
    flag:
        state-filter:
            - CREATING
            - CREATED
            - QUEUED
            - RUNNING
            - CANCELING
            - CANCELED
            - COMPLETED
            - FAILED
documentation:
    command: Lists the calculations that have been submitted to a session in descending order. Newer calculations are listed first; older calculations are listed later.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of calculation executions to return.
        next-token: A token generated by the Athena service that specifies where to continue pagination if a previous request was truncated. To obtain the next set of pages, pass in the `NextToken` from the response object of the previous page call.
        session-id: The session ID.
        state-filter: |-
            A filter for a specific calculation execution state. A description of each state follows.

            `CREATING` - The calculation is in the process of being created.

            `CREATED` - The calculation has been created and is ready to run.

            `QUEUED` - The calculation has been queued for processing.

            `RUNNING` - The calculation is running.

            `CANCELING` - A request to cancel the calculation has been received and the system is working to stop it.

            `CANCELED` - The calculation is no longer running as the result of a cancel request.

            `COMPLETED` - The calculation has completed without error.

            `FAILED` - The calculation failed and is no longer running.
