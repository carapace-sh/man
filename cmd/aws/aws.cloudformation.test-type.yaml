name: test-type
description: Tests a registered extension to make sure it meets all necessary requirements for being published in the CloudFormation registry.
flags:
    --arn=: The Amazon Resource Name (ARN) of the extension.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --log-delivery-bucket=: The S3 bucket to which CloudFormation delivers the contract test execution logs.
    --type-name=: The name of the extension to test.
    --type=: The type of the extension to test.
    --version-id=: The version of the extension to test.
completion:
    flag:
        type:
            - RESOURCE
            - MODULE
            - HOOK
documentation:
    command: |-
        Tests a registered extension to make sure it meets all necessary requirements for being published in the CloudFormation registry.

        - For resource types, this includes passing all contracts tests defined for the type.
        - For modules, this includes determining if the module's model meets all necessary requirements.

        For more information, see [Testing your public extension before publishing](https://docs.aws.amazon.com/cloudformation-cli/latest/userguide/publish-extension.html#publish-extension-testing) in the *CloudFormation Command Line Interface (CLI) User Guide*.

        If you don't specify a version, CloudFormation uses the default version of the extension in your account and Region for testing.

        To perform testing, CloudFormation assumes the execution role specified when the type was registered. For more information, see [RegisterType](https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_RegisterType.html).

        Once you've initiated testing on an extension using `TestType`, you can pass the returned `TypeVersionArn` into [DescribeType](https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_DescribeType.html) to monitor the current test status and test status description for the extension.

        An extension must have a test status of `PASSED` before it can be published. For more information, see [Publishing extensions to make them available for public use](https://docs.aws.amazon.com/cloudformation-cli/latest/userguide/resource-type-publish.html) in the *CloudFormation Command Line Interface (CLI) User Guide*.
    flag:
        arn: |-
            The Amazon Resource Name (ARN) of the extension.

            Conditional: You must specify `Arn`, or `TypeName` and `Type`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        log-delivery-bucket: |-
            The S3 bucket to which CloudFormation delivers the contract test execution logs.

            CloudFormation delivers the logs by the time contract testing has completed and the extension has been assigned a test type status of `PASSED` or `FAILED`.

            The user calling `TestType` must be able to access items in the specified S3 bucket. Specifically, the user needs the following permissions:

            - `GetObject`
            - `PutObject`

            For more information, see [Actions, Resources, and Condition Keys for Amazon S3](https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazons3.html) in the *Identity and Access Management User Guide*.
        type: |-
            The type of the extension to test.

            Conditional: You must specify `Arn`, or `TypeName` and `Type`.
        type-name: |-
            The name of the extension to test.

            Conditional: You must specify `Arn`, or `TypeName` and `Type`.
        version-id: |-
            The version of the extension to test.

            You can specify the version id with either `Arn`, or with `TypeName` and `Type`.

            If you don't specify a version, CloudFormation uses the default version of the extension in this account and Region for testing.
