name: create-project
description: Creates an Amazon DataZone project.
flags:
    --description=: The description of the Amazon DataZone project.
    --domain-identifier=!: The ID of the Amazon DataZone domain in which this project is created.
    --domain-unit-id=: The ID of the domain unit.
    --glossary-terms=: The glossary terms that can be used in this Amazon DataZone project.
    --name=!: The name of the Amazon DataZone project.
    --project-profile-id=: The ID of the project profile.
    --resource-tags=: The resource tags of the project.
    --user-parameters=: The user parameters of the project.
documentation:
    command: Creates an Amazon DataZone project.
    flag:
        description: The description of the Amazon DataZone project.
        domain-identifier: The ID of the Amazon DataZone domain in which this project is created.
        domain-unit-id: The ID of the domain unit. This parameter is not required and if it is not specified, then the project is created at the root domain unit level.
        glossary-terms: The glossary terms that can be used in this Amazon DataZone project.
        name: The name of the Amazon DataZone project.
        project-profile-id: The ID of the project profile.
        resource-tags: The resource tags of the project.
        user-parameters: The user parameters of the project.
