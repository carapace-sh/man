completion:
    flag:
        content-type:
            - unspecified
            - url-encoded
            - user-provided
        group-type:
            - aws-elb-load-balancer
            - gce-instance
        json-path-matcher-type:
            - exact-match
            - regex-match
        matcher-type:
            - contains-string
            - matches-json-path
            - matches-regex
            - not-contains-string
            - not-matches-json-path
            - not-matches-regex
        period:
            - "1"
            - "10"
            - "15"
            - "5"
        protocol:
            - http
            - https
            - tcp
        request-method:
            - get
            - post
        resource-type:
            - aws-ec2-instance
            - aws-elb-load-balancer
            - cloud-run-revision
            - gae-app
            - gce-instance
            - servicedirectory-service
            - uptime-url
        service-agent-auth:
            - oidc-token
documentation:
    command: |
        *(ALPHA)*  Create a new uptime check or synthetic monitor.

        Flags only apply to uptime checks unless noted that they apply to
        synthetic monitors.

        For information about the JSON/YAML format of an uptime check:
        https://cloud.google.com/monitoring/api/ref_v3/rest/v3/projects.uptimeCheckConfigs
    flag:
        body: |-
            The request body associated with the HTTP POST request.
                    Can only be set if `--protocol` is `http` or `https`.
        content-type: |-
            The content type header to use for the check, defaults to `unspecified`.
                    Can only be set if `--protocol` is `http` or `https`.
            +
            _CONTENT_TYPE_ must be one of:
            +
            *unspecified*::: Not specified
            *url-encoded*::: URL encoded
            *user-provided*::: User provided
            :::
            +
        custom-content-type: |-
            A user-provided content type header to use for the check.
                    Can only be set if `--protocol` is `http` or `https`.
        group-id: The group of resources being monitored.
        group-type: |-
            The resource type of the group members, defaults to `gce-instance`. _GROUP_TYPE_ must be one of:
            +
            *aws-elb-load-balancer*::: Uptime check against a group of Amazon ELB load balancers.
            *gce-instance*::: Uptime check against a group of instances from Google Cloud or Amazon Web Services.
            :::
            +
        headers: |-
            The list of headers to send as part of the uptime check
                          request. Can only be set if `--protocol` is `http` or `https`.
        json-path: |-
            JSONPath within the response output pointing to the expected content to match.
                        Only used if `--matcher-type` is `matches-json-path` or `not-matches-json-path`.
        json-path-matcher-type: |-
            The type of JSONPath match that is applied to the JSON output, defaults to
                        `exact-match`.
                        Only used if `--matcher-type` is `matches-json-path` or `not-matches-json-path`.
            +
            _JSON_PATH_MATCHER_TYPE_ must be one of:
            +
            *exact-match*::: Response matches exact string at JSONPath
            *regex-match*::: Response matches regex at JSONPath
            :::
            +
        mask-headers: |-
            Whether to encrypt the header information, defaults to `false`.
                    Can only be set if `--protocol` is `http` or `https`.
        matcher-content: String, regex or JSON content to match.
        matcher-type: |-
            The type of content matcher that is applied to the server output, defaults to
                    `contains-string`.
            +
            _MATCHER_TYPE_ must be one of:
            +
            *contains-string*::: Response contains string
            *matches-json-path*::: Response matches at JSONPath
            *matches-regex*::: Response matches regex
            *not-contains-string*::: Response does not contain string
            *not-matches-json-path*::: Response does not match at JSONPath
            *not-matches-regex*::: Response does not match regex
            :::
            +
        password: |-
            The password to use when authenticating with the HTTP server.
                    Can only be set if `--protocol` is `http` or `https`.
        path: |-
            The path to the page against which to run the check, defaults to `/`.
                    Can only be set if `--protocol` is `http` or `https`.
        period: |-
            The time between uptime check or synthetic monitor executions in
                          minutes, defaults to `1`. Can be set for synthetic monitors.
            +
            _PERIOD_ must be one of:
            +
            *1*::: One minute
            *10*::: Ten minutes
            *15*::: Fifteen minutes
            *5*::: Five minutes
            :::
            +
        pings-count: Number of ICMP pings to send alongside the request.
        port: |-
            The port on the server against which to run the check.
                    Defaults to `80` when `--protocol` is `http`.
                    Defaults to `443` when `--protocol` is `https`.
                    Required if `--protocol` is `tcp`.
        protocol: |-
            The protocol of the request, defaults to `http`. _PROTOCOL_ must be one of:
            +
            *http*::: An HTTP check.
            *https*::: An HTTPS check.
            *tcp*::: A TCP check.
            :::
            +
        regions: |-
            The list of regions from which the check is run. At least 3 regions must be selected.
                        Defaults to all available regions.
            +
            _field_ must be one of:
            +
            *asia-pacific*::: asia-southeast1
            *europe*::: europe-west1
            *south-america*::: southamerica-east1
            *usa-iowa*::: us-central1
            *usa-oregon*::: us-west1
            *usa-virginia*::: us-east4
            :::
            +
        request-method: |-
            The HTTP request method to use, defaults to `get`.
                    Can only be set if `--protocol` is `http` or `https`.
            +
            _REQUEST_METHOD_ must be one of:
            +
            *get*::: HTTP GET method
            *post*::: HTTP POST method
            :::
            +
        resource-labels: |-
            Values for all of the labels listed in the associated monitored resource descriptor.
                        See https://cloud.google.com/monitoring/api/resources for more information and allowed
                        keys.
        resource-type: |-
            Type of monitored resource, defaults to `uptime-url`. _RESOURCE_TYPE_ must be one of:
            +
            *aws-ec2-instance*::: Uptime check against an AWS EC2 instance.
            *aws-elb-load-balancer*::: Uptime check against an ElasticLoadBalancer.
            *cloud-run-revision*::: Uptime check against a Cloud Run revision.
            *gae-app*::: Uptime check against an App Engine module.
            *gce-instance*::: Uptime check against a Compute Engine instance.
            *servicedirectory-service*::: Uptime check against a Service Directory service.
            *uptime-url*::: Uptime check against a URL.
            :::
            +
        service-agent-auth: |-
            The type of authentication to use for the HTTP request.
                    Can only be set if `--protocol` is `https`.
            +
            _SERVICE_AGENT_AUTH_ must be (only one value is supported):
            +
            *oidc-token*::: OIDC Token authentication
            :::
            +
        status-classes: |-
            List of HTTP status classes. The uptime check only passes when the response
                          code is contained in this list. Defaults to `2xx`.
                          Can only be set if `--protocol` is `http` or `https`.
            +
            _status-class_ must be one of:
            +
            *1xx*::: Any response code from 100-199 inclusive
            *2xx*::: Any response code from 200-299 inclusive
            *3xx*::: Any response code from 300-399 inclusive
            *4xx*::: Any response code from 400-499 inclusive
            *5xx*::: Any response code from 500-599 inclusive
            *any*::: Any response code
            :::
            +
        status-codes: |-
            List of HTTP Status Codes. The uptime check will only pass if the response code
                          is present in this list.
                          Can only be set if `--protocol` is `http` or `https`.
        synthetic-target: |-
            The target of the Synthetic Monitor.
                    This is the fully qualified GCFv2 resource name.
        timeout: The maximum amount of time in seconds to wait for the request to complete, defaults to `60`. Can be set for synthetic monitors.
        user-labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        username: |-
            The username to use when authenticating with the HTTP server.
                    Can only be set if `--protocol` is `http` or `https`.
        validate-ssl: |-
            Whether to include SSL certificate validation as a part of the uptime check,
                    defaults to `false`.
                    Can only be set if `--protocol` is `http` or `https`.
