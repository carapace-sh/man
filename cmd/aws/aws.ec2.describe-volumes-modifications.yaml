name: describe-volumes-modifications
description: Describes the most recent volume modification request for the specified EBS volumes.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: The filters.
    --max-results=: The maximum number of results (up to a limit of 500) to be returned in a paginated request.
    --next-token=: The token returned from a previous paginated request.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --volume-ids=: The IDs of the volumes.
documentation:
    command: |-
        Describes the most recent volume modification request for the specified EBS volumes.

        For more information, see [Monitor the progress of volume modifications](https://docs.aws.amazon.com/ebs/latest/userguide/monitoring-volume-modifications.html) in the *Amazon EBS User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters.

            - `modification-state` - The current modification state (modifying | optimizing | completed | failed).
            - `original-iops` - The original IOPS rate of the volume.
            - `original-size` - The original size of the volume, in GiB.
            - `original-volume-type` - The original volume type of the volume (standard | io1 | io2 | gp2 | sc1 | st1).
            - `originalMultiAttachEnabled` - Indicates whether Multi-Attach support was enabled (true | false).
            - `start-time` - The modification start time.
            - `target-iops` - The target IOPS rate of the volume.
            - `target-size` - The target size of the volume, in GiB.
            - `target-volume-type` - The target volume type of the volume (standard | io1 | io2 | gp2 | sc1 | st1).
            - `targetMultiAttachEnabled` - Indicates whether Multi-Attach support is to be enabled (true | false).
            - `volume-id` - The ID of the volume.
        max-results: The maximum number of results (up to a limit of 500) to be returned in a paginated request. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
        volume-ids: The IDs of the volumes.
