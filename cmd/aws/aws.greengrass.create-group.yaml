name: create-group
description: Creates a group.
flags:
    --amzn-client-token=: A client token used to correlate requests and responses.
    --initial-version=: Information about the initial version of the group.
    --name=!: The name of the group.
    --tags=: Tag(s) to add to the new resource.
documentation:
    command: 'Creates a group. You may provide the initial version of the group or use ''''CreateGroupVersion'''' at a later time. Tip: You can use the ''''gg\_group\_setup'''' package (https://github.com/awslabs/aws-greengrass-group-setup) as a library or command-line application to create and deploy Greengrass groups.'
    flag:
        amzn-client-token: A client token used to correlate requests and responses.
        initial-version: Information about the initial version of the group.
