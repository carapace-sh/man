name: update-spicecapacity-configuration
description: Updates the SPICE capacity configuration for a Quick Sight account.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the SPICE configuration that you want to update.
    --purchase-mode=!: Determines how SPICE capacity can be purchased.
completion:
    flag:
        purchase-mode:
            - MANUAL
            - AUTO_PURCHASE
documentation:
    command: Updates the SPICE capacity configuration for a Quick Sight account.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the SPICE configuration that you want to update.
        purchase-mode: |-
            Determines how SPICE capacity can be purchased. The following options are available.

            - `MANUAL`: SPICE capacity can only be purchased manually.
            - `AUTO_PURCHASE`: Extra SPICE capacity is automatically purchased on your behalf as needed. SPICE capacity can also be purchased manually with this option.
