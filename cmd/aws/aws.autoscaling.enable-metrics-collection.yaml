name: enable-metrics-collection
description: Enables group metrics collection for the specified Auto Scaling group.
flags:
    --auto-scaling-group-name=!: The name of the Auto Scaling group.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --granularity=!: The frequency at which Amazon EC2 Auto Scaling sends aggregated data to CloudWatch.
    --metrics=: Identifies the metrics to enable.
documentation:
    command: |-
        Enables group metrics collection for the specified Auto Scaling group.

        You can use these metrics to track changes in an Auto Scaling group and to set alarms on threshold values. You can view group metrics using the Amazon EC2 Auto Scaling console or the CloudWatch console. For more information, see [Monitor CloudWatch metrics for your Auto Scaling groups and instances](https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-cloudwatch-monitoring.html) in the *Amazon EC2 Auto Scaling User Guide*.
    flag:
        auto-scaling-group-name: The name of the Auto Scaling group.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        granularity: The frequency at which Amazon EC2 Auto Scaling sends aggregated data to CloudWatch. The only valid value is `1Minute`.
        metrics: |-
            Identifies the metrics to enable.

            You can specify one or more of the following metrics:

            - `GroupMinSize`
            - `GroupMaxSize`
            - `GroupDesiredCapacity`
            - `GroupInServiceInstances`
            - `GroupPendingInstances`
            - `GroupStandbyInstances`
            - `GroupTerminatingInstances`
            - `GroupTotalInstances`
            - `GroupInServiceCapacity`
            - `GroupPendingCapacity`
            - `GroupStandbyCapacity`
            - `GroupTerminatingCapacity`
            - `GroupTotalCapacity`
            - `WarmPoolDesiredCapacity`
            - `WarmPoolWarmedCapacity`
            - `WarmPoolPendingCapacity`
            - `WarmPoolTerminatingCapacity`
            - `WarmPoolTotalCapacity`
            - `GroupAndWarmPoolDesiredCapacity`
            - `GroupAndWarmPoolTotalCapacity`

            If you specify `Granularity` and don't specify any metrics, all metrics are enabled.

            For more information, see [Amazon CloudWatch metrics for Amazon EC2 Auto Scaling](https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-metrics.html) in the *Amazon EC2 Auto Scaling User Guide*.
