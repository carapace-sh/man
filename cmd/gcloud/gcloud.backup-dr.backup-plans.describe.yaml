name: describe
description: Show details of the backup plan.
flags:
    --location=: Location ID of the resource.
documentation:
    command: Show all data associated with the specified backup plan.
    flag:
        location: |-
            Location ID of the resource.
            +

            To set the `location` attribute:
            * provide the argument `backup_plan` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
