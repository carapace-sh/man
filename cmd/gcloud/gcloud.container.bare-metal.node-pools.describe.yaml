name: describe
description: Describe a node pool in an Anthos cluster on bare metal.
flags:
    --cluster=: cluster of the node_pool.
    --location=: Google Cloud location for the node_pool.
documentation:
    command: Describe a node pool in an Anthos cluster on bare metal.
    flag:
        cluster: |-
            cluster of the node_pool.
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        location: |-
            Google Cloud location for the node_pool.
            +
            To set the `location` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
