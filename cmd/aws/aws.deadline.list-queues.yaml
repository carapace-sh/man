name: list-queues
description: Lists queues.
flags:
    --farm-id=!: The farm ID of the queue.
    --max-results=: The maximum number of results to return.
    --next-token=: The token for the next set of results, or `null` to start from the beginning.
    --principal-id=: The principal IDs to include in the list of queues.
    --status=: The status of the queues listed.
completion:
    flag:
        status:
            - IDLE
            - SCHEDULING
            - SCHEDULING_BLOCKED
documentation:
    command: Lists queues.
    flag:
        farm-id: The farm ID of the queue.
        max-results: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        next-token: The token for the next set of results, or `null` to start from the beginning.
        principal-id: The principal IDs to include in the list of queues.
        status: |-
            The status of the queues listed.

            - `ACTIVE`–The queues are active.
            - `SCHEDULING`–The queues are scheduling.
            - `SCHEDULING_BLOCKED`–The queue scheduling is blocked for these queues.
