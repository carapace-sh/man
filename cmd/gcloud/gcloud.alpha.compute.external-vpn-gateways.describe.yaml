name: describe
description: '*(ALPHA)*  Describe a Compute Engine external VPN gateway.'
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute external-vpn-gateways describe* is used to display all data associated with a Compute Engine
        external VPN gateway in a project.

        An external VPN gateway provides the information to Google Cloud
        about your on-premises side or another Cloud provider's VPN gateway.
