name: delete-kx-database
description: Deletes the specified database and all of its associated data.
flags:
    --client-token=!: A token that ensures idempotency.
    --database-name=!: The name of the kdb database that you want to delete.
    --environment-id=!: A unique identifier for the kdb environment.
documentation:
    command: Deletes the specified database and all of its associated data. This action is irreversible. You must copy any data out of the database before deleting it if the data is to be retained.
    flag:
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        database-name: The name of the kdb database that you want to delete.
        environment-id: A unique identifier for the kdb environment.
