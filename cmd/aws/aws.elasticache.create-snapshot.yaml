name: create-snapshot
description: Creates a copy of an entire cluster or replication group at a specific moment in time.
flags:
    --cache-cluster-id=: The identifier of an existing cluster.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-id=: The ID of the KMS key used to encrypt the snapshot.
    --replication-group-id=: The identifier of an existing replication group.
    --snapshot-name=!: A name for the snapshot being created.
    --tags=:
        description: A list of tags to be added to this resource.
        nargs: -1
documentation:
    command: |-
        Creates a copy of an entire cluster or replication group at a specific moment in time.

        This operation is valid for Valkey or Redis OSS only.
    flag:
        cache-cluster-id: The identifier of an existing cluster. The snapshot is created from this cluster.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-id: The ID of the KMS key used to encrypt the snapshot.
        replication-group-id: The identifier of an existing replication group. The snapshot is created from this replication group.
        snapshot-name: A name for the snapshot being created.
        tags: A list of tags to be added to this resource. A tag is a key-value pair. A tag key must be accompanied by a tag value, although null is accepted.
