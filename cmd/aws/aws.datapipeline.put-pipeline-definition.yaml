name: put-pipeline-definition
description: Adds tasks, schedules, and preconditions to the specified pipeline.
flags:
    --parameter-objects=: The parameter objects used with the pipeline.
    --parameter-values=: The parameter values used with the pipeline.
    --pipeline-id=!: The ID of the pipeline.
    --pipeline-objects=!: The objects that define the pipeline.
documentation:
    command: |-
        Adds tasks, schedules, and preconditions to the specified pipeline. You can use `PutPipelineDefinition` to populate a new pipeline.

        `PutPipelineDefinition` also validates the configuration as it adds it to the pipeline. Changes to the pipeline are saved unless one of the following three validation errors exists in the pipeline.

        1. An object is missing a name or identifier field.
        2. A string or reference field is empty.
        3. The number of objects in the pipeline exceeds the maximum allowed objects.
        4. The pipeline is in a FINISHED state.

        Pipeline object definitions are passed to the `PutPipelineDefinition` action and returned by the [GetPipelineDefinition]() action.
    flag:
        parameter-objects: The parameter objects used with the pipeline.
        parameter-values: The parameter values used with the pipeline.
        pipeline-id: The ID of the pipeline.
        pipeline-objects: The objects that define the pipeline. These objects overwrite the existing pipeline definition.
