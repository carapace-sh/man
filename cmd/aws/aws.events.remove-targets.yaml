name: remove-targets
description: Removes the specified targets from the specified rule.
flags:
    --event-bus-name=: The name or ARN of the event bus associated with the rule.
    --force: If this is a managed rule, created by an Amazon Web Services service on your behalf, you must specify `Force` as `True` to remove targets.
    --ids=!: The IDs of the targets to remove from the rule.
    --no-force: If this is a managed rule, created by an Amazon Web Services service on your behalf, you must specify `Force` as `True` to remove targets.
    --rule=!: The name of the rule.
documentation:
    command: |-
        Removes the specified targets from the specified rule. When the rule is triggered, those targets are no longer be invoked.

        A successful execution of `RemoveTargets` doesn't guarantee all targets are removed from the rule, it means that the target(s) listed in the request are removed.

        When you remove a target, when the associated rule triggers, removed targets might continue to be invoked. Allow a short period of time for changes to take effect.

        This action can partially fail if too many requests are made at the same time. If that happens, `FailedEntryCount` is non-zero in the response and each entry in `FailedEntries` provides the ID of the failed target and the error code.

        The maximum number of entries per request is 10.
    flag:
        event-bus-name: The name or ARN of the event bus associated with the rule. If you omit this, the default event bus is used.
        force: If this is a managed rule, created by an Amazon Web Services service on your behalf, you must specify `Force` as `True` to remove targets. This parameter is ignored for rules that are not managed rules. You can check whether a rule is a managed rule by using `DescribeRule` or `ListRules` and checking the `ManagedBy` field of the response.
        ids: The IDs of the targets to remove from the rule.
        rule: The name of the rule.
