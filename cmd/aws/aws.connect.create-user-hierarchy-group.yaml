name: create-user-hierarchy-group
description: Creates a new user hierarchy group.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --name=!: The name of the user hierarchy group.
    --parent-group-id=: The identifier for the parent hierarchy group.
    --tags=: The tags used to organize, track, or control access for this resource.
documentation:
    command: Creates a new user hierarchy group.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        name: The name of the user hierarchy group. Must not be more than 100 characters.
        parent-group-id: The identifier for the parent hierarchy group. The user hierarchy is created at level one if the parent group ID is null.
        tags: 'The tags used to organize, track, or control access for this resource. For example, { "Tags": {"key1":"value1", "key2":"value2"} }.'
