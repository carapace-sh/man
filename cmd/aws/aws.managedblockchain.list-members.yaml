name: list-members
description: Returns a list of the members in a network and properties of their configurations.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --is-owned: An optional Boolean value.
    --max-results=: The maximum number of members to return in the request.
    --name=: The optional name of the member to list.
    --network-id=!: The unique identifier of the network for which to list members.
    --next-token=: The pagination token that indicates the next set of results to retrieve.
    --no-is-owned: An optional Boolean value.
    --status=: An optional status specifier.
completion:
    flag:
        status:
            - CREATING
            - AVAILABLE
            - CREATE_FAILED
            - UPDATING
            - DELETING
            - DELETED
            - INACCESSIBLE_ENCRYPTION_KEY
documentation:
    command: |-
        Returns a list of the members in a network and properties of their configurations.

        Applies only to Hyperledger Fabric.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        is-owned: An optional Boolean value. If provided, the request is limited either to members that the current Amazon Web Services account owns (`true`) or that other Amazon Web Services accountsn own (`false`). If omitted, all members are listed.
        max-results: The maximum number of members to return in the request.
        name: The optional name of the member to list.
        network-id: The unique identifier of the network for which to list members.
        next-token: The pagination token that indicates the next set of results to retrieve.
        status: An optional status specifier. If provided, only members currently in this status are listed.
