documentation:
    command: |-
        Amazon Elastic Graphics reached end of life on January 8, 2024.

        Describes the Elastic Graphics accelerator associated with your instances.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        elastic-gpu-ids: The Elastic Graphics accelerator IDs.
        filters: |-
            The filters.

            - `availability-zone` - The Availability Zone in which the Elastic Graphics accelerator resides.
            - `elastic-gpu-health` - The status of the Elastic Graphics accelerator (`OK` | `IMPAIRED`).
            - `elastic-gpu-state` - The state of the Elastic Graphics accelerator (`ATTACHED`).
            - `elastic-gpu-type` - The type of Elastic Graphics accelerator; for example, `eg1.medium`.
            - `instance-id` - The ID of the instance to which the Elastic Graphics accelerator is associated.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results to return in a single call. To retrieve the remaining results, make another call with the returned `NextToken` value. This value can be between 5 and 1000.
        next-token: The token to request the next page of results.
