name: describe
description: Display information about a Filestore snapshot.
flags:
    --instance-location=: Location of the Filestore instance.
    --instance-region=: Region of the Filestore instance.
    --instance=!: Name of the Filestore instance the snapshot belongs to.
documentation:
    command: |
        Displays information about a Filestore snapshot given a valid snapshot
        name, as well as instance name and instance region.

        This command can fail for the following reasons:
          * The snapshot or instance specified does not exist.
          * The active account does not have permission to access the given
            snapshot.
    flag:
        instance: Name of the Filestore instance the snapshot belongs to.
        instance-location: Location of the Filestore instance.
        instance-region: Region of the Filestore instance.
