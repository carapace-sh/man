name: update-agent-action-group
description: Updates the configuration for an action group for an agent.
flags:
    --action-group-executor=: The Amazon Resource Name (ARN) of the Lambda function containing the business logic that is carried out upon invoking the action.
    --action-group-id=!: The unique identifier of the action group.
    --action-group-name=!: Specifies a new name for the action group.
    --action-group-state=: Specifies whether the action group is available for the agent to invoke or not when sending an [InvokeAgent](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_InvokeAgent.html) request.
    --agent-id=!: The unique identifier of the agent for which to update the action group.
    --agent-version=!: The unique identifier of the agent version for which to update the action group.
    --api-schema=: Contains either details about the S3 object containing the OpenAPI schema for the action group or the JSON or YAML-formatted payload defining the schema.
    --description=: Specifies a new name for the action group.
    --function-schema=: Contains details about the function schema for the action group or the JSON or YAML-formatted payload defining the schema.
    --parent-action-group-signature-params=: The configuration settings for a computer use action.
    --parent-action-group-signature=: Update the built-in or computer use action for this action group.
completion:
    flag:
        action-group-state:
            - ENABLED
            - DISABLED
        parent-action-group-signature:
            - AMAZON.UserInput
            - AMAZON.CodeInterpreter
            - ANTHROPIC.Computer
            - ANTHROPIC.Bash
            - ANTHROPIC.TextEditor
documentation:
    command: Updates the configuration for an action group for an agent.
    flag:
        action-group-executor: The Amazon Resource Name (ARN) of the Lambda function containing the business logic that is carried out upon invoking the action.
        action-group-id: The unique identifier of the action group.
        action-group-name: Specifies a new name for the action group.
        action-group-state: Specifies whether the action group is available for the agent to invoke or not when sending an [InvokeAgent](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_InvokeAgent.html) request.
        agent-id: The unique identifier of the agent for which to update the action group.
        agent-version: The unique identifier of the agent version for which to update the action group.
        api-schema: Contains either details about the S3 object containing the OpenAPI schema for the action group or the JSON or YAML-formatted payload defining the schema. For more information, see [Action group OpenAPI schemas](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-api-schema.html).
        description: Specifies a new name for the action group.
        function-schema: Contains details about the function schema for the action group or the JSON or YAML-formatted payload defining the schema.
        parent-action-group-signature: "Update the built-in or computer use action for this action group. If you specify a value, you must leave the `description`, `apiSchema`, and `actionGroupExecutor` fields empty for this action group.\n\n- To allow your agent to request the user for additional information when trying to complete a task, set this field to `AMAZON.UserInput`.\n- To allow your agent to generate, run, and troubleshoot code when trying to complete a task, set this field to `AMAZON.CodeInterpreter`.\n- To allow your agent to use an Anthropic computer use tool, specify one of the following values.\n  \n  Computer use is a new Anthropic Claude model capability (in beta) available with Anthropic Claude 3.7 Sonnet and Claude 3.5 Sonnet v2 only. When operating computer use functionality, we recommend taking additional security precautions, such as executing computer actions in virtual environments with restricted data access and limited internet connectivity. For more information, see [Configure an Amazon Bedrock Agent to complete tasks with computer use tools](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-computer-use.html).\n  \n  - `ANTHROPIC.Computer` - Gives the agent permission to use the mouse and keyboard and take screenshots.\n  - `ANTHROPIC.TextEditor` - Gives the agent permission to view, create and edit files.\n  - `ANTHROPIC.Bash` - Gives the agent permission to run commands in a bash shell.\n\nDuring orchestration, if your agent determines that it needs to invoke an API in an action group, but doesn't have enough information to complete the API request, it will invoke this action group instead and return an [Observation](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_Observation.html) reprompting the user for more information."
        parent-action-group-signature-params: |-
            The configuration settings for a computer use action.

            Computer use is a new Anthropic Claude model capability (in beta) available with Claude 3.7 Sonnet and Claude 3.5 Sonnet v2 only. For more information, see [Configure an Amazon Bedrock Agent to complete tasks with computer use tools](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-computer-use.html).
