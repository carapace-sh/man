name: list-commands
description: List all commands in your account.
flags:
    --command-parameter-name=: A filter that can be used to display the list of commands that have a specific command parameter name.
    --max-results=: The maximum number of results to return in this operation.
    --namespace=: The namespace of the command.
    --next-token=: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise `null` to receive the first set of results.
    --sort-order=: Specify whether to list the commands that you have created in the ascending or descending order.
completion:
    flag:
        namespace:
            - AWS-IoT
            - AWS-IoT-FleetWise
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: List all commands in your account.
    flag:
        command-parameter-name: A filter that can be used to display the list of commands that have a specific command parameter name.
        max-results: The maximum number of results to return in this operation. By default, the API returns up to a maximum of 25 results. You can override this default value to return up to a maximum of 100 results for this operation.
        namespace: The namespace of the command. By default, the API returns all commands that have been created for both `AWS-IoT` and `AWS-IoT-FleetWise` namespaces. You can override this default value if you want to return all commands that have been created only for a specific namespace.
        next-token: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise `null` to receive the first set of results.
        sort-order: Specify whether to list the commands that you have created in the ascending or descending order. By default, the API returns all commands in the descending order based on the time that they were created.
