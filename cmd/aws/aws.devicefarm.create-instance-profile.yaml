name: create-instance-profile
description: Creates a profile that can be applied to one or more private fleet device instances.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of your instance profile.
    --exclude-app-packages-from-cleanup=:
        description: An array of strings that specifies the list of app packages that should not be cleaned up from the device after a test run.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of your instance profile.
    --no-package-cleanup: When set to `true`, Device Farm removes app packages after a test run.
    --no-reboot-after-use: When set to `true`, Device Farm reboots the instance after a test run.
    --package-cleanup: When set to `true`, Device Farm removes app packages after a test run.
    --reboot-after-use: When set to `true`, Device Farm reboots the instance after a test run.
documentation:
    command: Creates a profile that can be applied to one or more private fleet device instances.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of your instance profile.
        exclude-app-packages-from-cleanup: |-
            An array of strings that specifies the list of app packages that should not be cleaned up from the device after a test run.

            The list of packages is considered only if you set `packageCleanup` to `true`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of your instance profile.
        package-cleanup: When set to `true`, Device Farm removes app packages after a test run. The default value is `false` for private devices.
        reboot-after-use: When set to `true`, Device Farm reboots the instance after a test run. The default value is `true`.
