name: get-table-objects
description: Returns the set of Amazon S3 objects that make up the specified governed table.
flags:
    --catalog-id=: The catalog containing the governed table.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --database-name=!: The database containing the governed table.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: Specifies how many values to return in a page.
    --next-token=: A continuation token if this is not the first call to retrieve these objects.
    --partition-predicate=: A predicate to filter the objects returned based on the partition keys defined in the governed table.
    --query-as-of-time=: The time as of when to read the governed table contents.
    --table-name=!: The governed table for which to retrieve objects.
    --transaction-id=: The transaction ID at which to read the governed table contents.
documentation:
    command: Returns the set of Amazon S3 objects that make up the specified governed table. A transaction ID or timestamp can be specified for time-travel queries.
    flag:
        catalog-id: The catalog containing the governed table. Defaults to the caller’s account.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        database-name: The database containing the governed table.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: Specifies how many values to return in a page.
        next-token: A continuation token if this is not the first call to retrieve these objects.
        partition-predicate: |-
            A predicate to filter the objects returned based on the partition keys defined in the governed table.

            - The comparison operators supported are: =, &gt;, &lt;, &gt;=, &lt;=
            - The logical operators supported are: AND
            - The data types supported are integer, long, date(yyyy-MM-dd), timestamp(yyyy-MM-dd HH:mm:ssXXX or yyyy-MM-dd HH:mm:ss"), string and decimal.
        query-as-of-time: The time as of when to read the governed table contents. If not set, the most recent transaction commit time is used. Cannot be specified along with `TransactionId`.
        table-name: The governed table for which to retrieve objects.
        transaction-id: The transaction ID at which to read the governed table contents. If this transaction has aborted, an error is returned. If not set, defaults to the most recent committed transaction. Cannot be specified along with `QueryAsOfTime`.
