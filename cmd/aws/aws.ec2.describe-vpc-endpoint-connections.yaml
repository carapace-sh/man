name: describe-vpc-endpoint-connections
description: Describes the VPC endpoint connections to your VPC endpoint services, including any endpoints that are pending your acceptance.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: The filters.
    --max-results=: The maximum number of results to return for the request in a single page.
    --next-token=: The token to retrieve the next page of results.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Describes the VPC endpoint connections to your VPC endpoint services, including any endpoints that are pending your acceptance.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters.

            - `ip-address-type` - The IP address type (`ipv4` | `ipv6`).
            - `service-id` - The ID of the service.
            - `vpc-endpoint-owner` - The ID of the Amazon Web Services account ID that owns the endpoint.
            - `vpc-endpoint-region` - The Region of the endpoint or `cross-region` to find endpoints for other Regions.
            - `vpc-endpoint-state` - The state of the endpoint (`pendingAcceptance` | `pending` | `available` | `deleting` | `deleted` | `rejected` | `failed`).
            - `vpc-endpoint-id` - The ID of the endpoint.
        max-results: The maximum number of results to return for the request in a single page. The remaining results of the initial request can be seen by sending another request with the returned `NextToken` value. This value can be between 5 and 1,000; if `MaxResults` is given a value larger than 1,000, only 1,000 results are returned.
        next-token: The token to retrieve the next page of results.
