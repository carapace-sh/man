name: start
description: '*(BETA)*  Start a transaction.'
flags:
    --transaction-file=: Path of the file which contains the transaction.
    --zone=!: Name of the managed zone whose record sets you want to manage.
documentation:
    command: |-
        *(BETA)*  This command starts a transaction.

        ## EXAMPLES

        To start a transaction, run:

          $ gcloud beta dns record-sets transaction start --zone=MANAGED_ZONE
    flag:
        transaction-file: Path of the file which contains the transaction.
        zone: Name of the managed zone whose record sets you want to manage.
