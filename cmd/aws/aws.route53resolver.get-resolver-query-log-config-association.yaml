name: get-resolver-query-log-config-association
description: Gets information about a specified association between a Resolver query logging configuration and an Amazon VPC.
flags:
    --resolver-query-log-config-association-id=!: The ID of the Resolver query logging configuration association that you want to get information about.
documentation:
    command: Gets information about a specified association between a Resolver query logging configuration and an Amazon VPC. When you associate a VPC with a query logging configuration, Resolver logs DNS queries that originate in that VPC.
    flag:
        resolver-query-log-config-association-id: The ID of the Resolver query logging configuration association that you want to get information about.
