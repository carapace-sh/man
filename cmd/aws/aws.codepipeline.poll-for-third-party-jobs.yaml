name: poll-for-third-party-jobs
description: Determines whether there are any third party jobs for a job worker to act on.
flags:
    --action-type-id=!: Represents information about an action type.
    --max-batch-size=: The maximum number of jobs to return in a poll for jobs call.
documentation:
    command: |-
        Determines whether there are any third party jobs for a job worker to act on. Used for partner actions only.

        When this API is called, CodePipeline returns temporary credentials for the S3 bucket used to store artifacts for the pipeline, if the action requires access to that S3 bucket for input or output artifacts.
    flag:
        action-type-id: Represents information about an action type.
        max-batch-size: The maximum number of jobs to return in a poll for jobs call.
