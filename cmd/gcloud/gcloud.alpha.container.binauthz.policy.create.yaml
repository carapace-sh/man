name: create
description: '*(ALPHA)*  Create a Binary Authorization platform policy.'
flags:
    --platform=: The platform that the policy belongs to.
    --policy-file=!: The JSON or YAML file containing the new policy.
documentation:
    command: |-
        ## EXAMPLES

        To create a policy for GKE in the current project:

            $ gcloud alpha container binauthz policy create my-policy --platform=gke --policy-file=my_policy.yaml

        To create a policy for GKE in a specific project:

            $ gcloud alpha container binauthz policy create my-policy --platform=gke --project=my-project-id \
              --policy-file=my_policy.yaml

        or

            $ gcloud alpha container binauthz policy create /projects/my-project-id/platforms/gke/policies/my-policy
            \
              --policy-file=my_policy.yaml
    flag:
        platform: |-
            The platform that the policy belongs to. PLATFORM must be one of the following: cloudRun, gke.
            +
            To set the `platform` attribute:
            * provide the argument `policy_resource_name` on the command line with a fully specified name;
            * provide the argument `--platform` on the command line.
        policy-file: The JSON or YAML file containing the new policy.
