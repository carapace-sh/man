name: create-transit-gateway-vpc-attachment
description: Attaches the specified VPC to the specified transit gateway.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --options=: The VPC attachment options.
    --subnet-ids=!: The IDs of one or more subnets.
    --tag-specifications=: The tags to apply to the VPC attachment.
    --transit-gateway-id=!: The ID of the transit gateway.
    --vpc-id=!: The ID of the VPC.
documentation:
    command: |-
        Attaches the specified VPC to the specified transit gateway.

        If you attach a VPC with a CIDR range that overlaps the CIDR range of a VPC that is already attached, the new VPC CIDR range is not propagated to the default propagation route table.

        To send VPC traffic to an attached transit gateway, add a route to the VPC route table using [CreateRoute]().
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        options: The VPC attachment options.
        subnet-ids: The IDs of one or more subnets. You can specify only one subnet per Availability Zone. You must specify at least one subnet, but we recommend that you specify two subnets for better availability. The transit gateway uses one IP address from each specified subnet.
        tag-specifications: The tags to apply to the VPC attachment.
        transit-gateway-id: The ID of the transit gateway.
        vpc-id: The ID of the VPC.
