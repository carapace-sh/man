flags:
    --location=: ID of the location or fully qualified identifier for the location.
documentation:
    command: |+
        *(DEPRECATED)*  Get Anthos Multi-Cloud server configuration for AWS.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/aws/deprecations/deprecation-announcement for more details.

    flag:
