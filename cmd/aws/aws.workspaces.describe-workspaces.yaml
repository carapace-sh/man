name: describe-workspaces
description: Describes the specified WorkSpaces.
flags:
    --bundle-id=: The identifier of the bundle.
    --directory-id=: The identifier of the directory.
    --limit=: The maximum number of items to return.
    --next-token=: If you received a `NextToken` from a previous call that was paginated, provide this token to receive the next set of results.
    --user-name=: The name of the directory user.
    --workspace-ids=: The identifiers of the WorkSpaces.
    --workspace-name=: The name of the user-decoupled WorkSpace.
documentation:
    command: |-
        Describes the specified WorkSpaces.

        You can filter the results by using the bundle identifier, directory identifier, or owner, but you can specify only one filter at a time.
    flag:
        bundle-id: The identifier of the bundle. All WorkSpaces that are created from this bundle are retrieved. You cannot combine this parameter with any other filter.
        directory-id: The identifier of the directory. In addition, you can optionally specify a specific directory user (see `UserName`). You cannot combine this parameter with any other filter.
        limit: The maximum number of items to return.
        next-token: If you received a `NextToken` from a previous call that was paginated, provide this token to receive the next set of results.
        user-name: The name of the directory user. You must specify this parameter with `DirectoryId`.
        workspace-ids: |-
            The identifiers of the WorkSpaces. You cannot combine this parameter with any other filter.

            Because the [CreateWorkspaces]() operation is asynchronous, the identifier it returns is not immediately available. If you immediately call [DescribeWorkspaces]() with this identifier, no information is returned.
        workspace-name: The name of the user-decoupled WorkSpace.
