name: disassociate-nat-gateway-address
description: Disassociates secondary Elastic IP addresses (EIPs) from a public NAT gateway.
flags:
    --association-ids=!: The association IDs of EIPs that have been associated with the NAT gateway.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --max-drain-duration-seconds=: The maximum amount of time to wait (in seconds) before forcibly releasing the IP addresses if connections are still in progress.
    --nat-gateway-id=!: The ID of the NAT gateway.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: |-
        Disassociates secondary Elastic IP addresses (EIPs) from a public NAT gateway. You cannot disassociate your primary EIP. For more information, see [Edit secondary IP address associations](https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-working-with.html#nat-gateway-edit-secondary) in the *Amazon VPC User Guide*.

        While disassociating is in progress, you cannot associate/disassociate additional EIPs while the connections are being drained. You are, however, allowed to delete the NAT gateway.

        An EIP is released only at the end of MaxDrainDurationSeconds. It stays associated and supports the existing connections but does not support any new connections (new connections are distributed across the remaining associated EIPs). As the existing connections drain out, the EIPs (and the corresponding private IP addresses mapped to them) are released.
    flag:
        association-ids: The association IDs of EIPs that have been associated with the NAT gateway.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        max-drain-duration-seconds: The maximum amount of time to wait (in seconds) before forcibly releasing the IP addresses if connections are still in progress. Default value is 350 seconds.
        nat-gateway-id: The ID of the NAT gateway.
