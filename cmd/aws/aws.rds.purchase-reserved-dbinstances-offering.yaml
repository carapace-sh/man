name: purchase-reserved-dbinstances-offering
description: Purchases a reserved DB instance offering.
flags:
    --dbinstance-count=: The number of instances to reserve.
    --reserved-dbinstance-id=: Customer-specified identifier to track this reservation.
    --reserved-dbinstances-offering-id=!: The ID of the Reserved DB instance offering to purchase.
    --tags=: ""
documentation:
    command: Purchases a reserved DB instance offering.
    flag:
        dbinstance-count: |-
            The number of instances to reserve.

            Default: `1`
        reserved-dbinstance-id: |-
            Customer-specified identifier to track this reservation.

            Example: myreservationID
        reserved-dbinstances-offering-id: |-
            The ID of the Reserved DB instance offering to purchase.

            Example: 438012d3-4052-4cc7-b2e3-8d3372e0e706
        tags: ""
