name: remove-notification-channel
description: Removes a notification channel from DevOps Guru.
flags:
    --id=!: The ID of the notification channel to be removed.
documentation:
    command: Removes a notification channel from DevOps Guru. A notification channel is used to notify you when DevOps Guru generates an insight that contains information about how to improve your operations.
    flag:
        id: The ID of the notification channel to be removed.
