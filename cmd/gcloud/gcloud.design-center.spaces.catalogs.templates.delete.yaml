name: delete
description: Delete a catalog template.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --catalog=: The catalog id of the template resource.
    --force: If set to true, the catalog template's children are also deleted.
    --location=: The location id of the template resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-force&: If set to true, the catalog template's children are also deleted.
    --space=: The space id of the template resource.
documentation:
    command: Delete a catalog template.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        catalog: |-
            The catalog id of the template resource.
            +
            To set the `catalog` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--catalog` on the command line.
        force: |-
            If set to true, the catalog template's children are also deleted. If false,
            the catalog template is only deleted if it has no children.
        location: |-
            The location id of the template resource.
            +
            To set the `location` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-force: |-
            If set to true, the catalog template's children are also deleted. If false,
            the catalog template is only deleted if it has no children.
        space: |-
            The space id of the template resource.
            +
            To set the `space` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--space` on the command line.
