name: copy
description: '*(ALPHA)*  Copy one BigQuery table to another.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --destination-dataset=: The id of the BigQuery dataset.
    --destination=!: ID of the table or fully qualified identifier for the table.
    --job-id=: A unique job ID to use for the request.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-overwrite&: Overwrite if the resource already exists.
    --overwrite: Overwrite if the resource already exists.
    --source-dataset=: The id of the BigQuery dataset.
    --source=!: ID of the table or fully qualified identifier for the table.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha bq tables copy* Copies one BigQuery table to another.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        destination: |-
            ID of the table or fully qualified identifier for the table.
            +
            To set the `source` attribute:
            * provide the argument `--destination` on the command line.
        destination-dataset: |-
            The id of the BigQuery dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `--destination` on the command line with a fully specified name;
            * provide the argument `--destination-dataset` on the command line;
            * provide the argument `--source-dataset` on the command line.
        job-id: A unique job ID to use for the request. If not specified a unique job id will be generated.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-overwrite: Overwrite if the resource already exists.
        overwrite: Overwrite if the resource already exists.
        source: |-
            ID of the table or fully qualified identifier for the table.
            +
            To set the `source` attribute:
            * provide the argument `--source` on the command line.
        source-dataset: |-
            The id of the BigQuery dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `--source` on the command line with a fully specified name;
            * provide the argument `--source-dataset` on the command line;
            * provide the argument `--destination-dataset` on the command line.
