name: update-maintenance-window-target
description: Modifies the target of an existing maintenance window.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: An optional description for the update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: A name for the update.
    --no-replace: If `True`, then all fields that are required by the [RegisterTargetWithMaintenanceWindow]() operation are also required for this API request.
    --owner-information=: User-provided value that will be included in any Amazon CloudWatch Events events raised while running tasks for these targets in this maintenance window.
    --replace: If `True`, then all fields that are required by the [RegisterTargetWithMaintenanceWindow]() operation are also required for this API request.
    --targets=:
        description: The targets to add or replace.
        nargs: -1
    --window-id=!: The maintenance window ID with which to modify the target.
    --window-target-id=!: The target ID to modify.
documentation:
    command: |-
        Modifies the target of an existing maintenance window. You can change the following:

        - Name
        - Description
        - Owner
        - IDs for an ID target
        - Tags for a Tag target
        - From any supported tag type to another. The three supported tag types are ID target, Tag target, and resource group. For more information, see [Target]().

        If a parameter is null, then the corresponding field isn't modified.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: An optional description for the update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A name for the update.
        owner-information: User-provided value that will be included in any Amazon CloudWatch Events events raised while running tasks for these targets in this maintenance window.
        replace: If `True`, then all fields that are required by the [RegisterTargetWithMaintenanceWindow]() operation are also required for this API request. Optional fields that aren't specified are set to null.
        targets: The targets to add or replace.
        window-id: The maintenance window ID with which to modify the target.
        window-target-id: The target ID to modify.
