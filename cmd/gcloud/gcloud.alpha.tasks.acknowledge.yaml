name: acknowledge
description: '*(ALPHA)*  Acknowledge the lease on a task in a pull queue.'
flags:
    --location=: The location where we want to manage the queue or task.
    --queue=: The queue the task belongs to.
    --schedule-time=!: The task's current schedule time.
documentation:
    command: '*(ALPHA)*  Acknowledge the lease on a task in a pull queue.'
    flag:
        location: The location where we want to manage the queue or task. If not specified, uses the location of the current project's App Engine app if there is an associated app.
        queue: The queue the task belongs to.
        schedule-time: |-
            The task's current schedule time. This restriction is to check that the
            caller is acknowledging the correct task.
