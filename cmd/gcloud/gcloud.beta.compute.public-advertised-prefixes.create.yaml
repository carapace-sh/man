name: create
description: '*(BETA)*  Creates a Compute Engine public advertised prefix.'
flags:
    --description=: Description of this public advertised prefix.
    --dns-verification-ip=: IP address to use for verification.
    --ipv6-access-type=: Specifies the IPv6 access type of the public advertised prefix.
    --pdp-scope=: Specifies how child public delegated prefix will be scoped.
    --range=!: IP range allocated to this public advertised prefix, in CIDR format.
completion:
    flag:
        ipv6-access-type:
            - internal
            - external
        pdp-scope:
            - GLOBAL
            - REGIONAL
documentation:
    command: |-
        ## EXAMPLES

        To create a public advertised prefix:

          $ gcloud beta compute public-advertised-prefixes create my-public-advertised-prefix --range=120.120.10.0/24 \
            --dns-verification-ip=120.120.10.15

        To create a v2 public advertised prefix:

          $ gcloud beta compute public-advertised-prefixes create my-v2-public-advertised-prefix --range=120.120.10.0/24 \
            --dns-verification-ip=120.120.10.15 --pdp-scope=REGIONAL
    flag:
        description: Description of this public advertised prefix.
        dns-verification-ip: IP address to use for verification. It must be within the IP range specified in --range.
        ipv6-access-type: 'Specifies the IPv6 access type of the public advertised prefix. _IPV6_ACCESS_TYPE_ must be one of: *internal*, *external*.'
        pdp-scope: 'Specifies how child public delegated prefix will be scoped. _PDP_SCOPE_ must be one of: *GLOBAL*, *REGIONAL*.'
        range: IP range allocated to this public advertised prefix, in CIDR format.
