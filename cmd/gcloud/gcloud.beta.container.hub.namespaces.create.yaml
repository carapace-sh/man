name: create
description: '*(BETA)*  *(REMOVED)*  Create a fleet namespace.'
hidden: true
flags:
    --scope=!: ID of the scope or fully qualified identifier for the scope.
documentation:
    command: |-
        *(BETA)*  *(REMOVED)*  Create a fleet namespace.

        This command has been removed as of version 447.0.0. Use `gcloud fleet scopes namespaces create` instead.

        This command can fail for the following reasons:
        * The project specified does not exist.
        * The project has a fleet namespace with the same name.
        * The caller does not have permission to access the given project.

        ## EXAMPLES

        To create a fleet namespace with name `NAMESPACE` in the active project, run:

          $ gcloud beta container hub namespaces create NAMESPACE

        To create a fleet namespace in fleet scope `SCOPE` in project `PROJECT_ID`
        with name
        `NAMESPACE`, run:

          $ gcloud beta container hub namespaces create NAMESPACE --scope=SCOPE --project=PROJECT_ID
    flag:
        scope: |-
            ID of the scope or fully qualified identifier for the scope.
            +
            To set the `scope` attribute:
            * provide the argument `--scope` on the command line.
