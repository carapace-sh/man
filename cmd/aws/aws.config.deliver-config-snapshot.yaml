name: deliver-config-snapshot
description: Schedules delivery of a configuration snapshot to the Amazon S3 bucket in the specified delivery channel.
flags:
    --delivery-channel-name=!: The name of the delivery channel through which the snapshot is delivered.
documentation:
    command: |-
        Schedules delivery of a configuration snapshot to the Amazon S3 bucket in the specified delivery channel. After the delivery has started, Config sends the following notifications using an Amazon SNS topic that you have specified.

        - Notification of the start of the delivery.
        - Notification of the completion of the delivery, if the delivery was successfully completed.
        - Notification of delivery failure, if the delivery failed.
    flag:
        delivery-channel-name: The name of the delivery channel through which the snapshot is delivered.
