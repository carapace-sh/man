name: describe
description: Describe a Dataplex datascan resource.
flags:
    --location=: Location of the Dataplex resource.
    --view=: Displays spec data based on the argument value.
completion:
    flag:
        view:
            - basic
            - full
documentation:
    command: |
        Displays all details of a Dataplex Datascan resource given a valid Datascan ID.
    flag:
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `datascan` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        view: |-
            Displays spec data based on the argument value. The default view is 'basic'. _VIEW_ must be one of:
            +
            *basic*::: Does not include spec data in response.
            +
            *full*::: Includes spec data in response.
            +
            :::
            +
