name: create-stage
description: Creates a new Stage resource that references a pre-existing Deployment for the API.
flags:
    --cache-cluster-enabled: Whether cache clustering is enabled for the stage.
    --cache-cluster-size=: The stage's cache capacity in GB.
    --canary-settings=: The canary deployment settings of this stage.
    --deployment-id=!: The identifier of the Deployment resource for the Stage resource.
    --description=: The description of the Stage resource.
    --documentation-version=: The version of the associated API documentation.
    --no-cache-cluster-enabled&: Whether cache clustering is enabled for the stage.
    --no-tracing-enabled&: Specifies whether active tracing with X-ray is enabled for the Stage.
    --rest-api-id=!: The string identifier of the associated RestApi.
    --stage-name=!: The name for the Stage resource.
    --tags=: The key-value map of strings.
    --tracing-enabled: Specifies whether active tracing with X-ray is enabled for the Stage.
    --variables=: A map that defines the stage variables for the new Stage resource.
completion:
    flag:
        cache-cluster-size:
            - "0.5"
            - "1.6"
            - "6.1"
            - "13.5"
            - "28.4"
            - "58.2"
            - "118"
            - "237"
documentation:
    command: Creates a new Stage resource that references a pre-existing Deployment for the API.
    flag:
        cache-cluster-enabled: Whether cache clustering is enabled for the stage.
        cache-cluster-size: The stage's cache capacity in GB. For more information about choosing a cache size, see [Enabling API caching to enhance responsiveness](https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-caching.html).
        canary-settings: The canary deployment settings of this stage.
        deployment-id: The identifier of the Deployment resource for the Stage resource.
        description: The description of the Stage resource.
        documentation-version: The version of the associated API documentation.
        rest-api-id: The string identifier of the associated RestApi.
        stage-name: The name for the Stage resource. Stage names can only contain alphanumeric characters, hyphens, and underscores. Maximum length is 128 characters.
        tags: The key-value map of strings. The valid character set is \[a-zA-Z+-=.\_:/]. The tag key can be up to 128 characters and must not start with `aws:`. The tag value can be up to 256 characters.
        tracing-enabled: Specifies whether active tracing with X-ray is enabled for the Stage.
        variables: A map that defines the stage variables for the new Stage resource. Variable names can have alphanumeric and underscore characters, and the values must match `[A-Za-z0-9-._~:/?#&=,]+`.
