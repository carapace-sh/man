name: remove-members
description: Remove member interconnect attachments from a Compute Engine interconnect attachment group.
flags:
    --attachments=!: Member interconnect attachments to add to or remove from the interconnect
documentation:
    command: |
        *gcloud compute interconnects attachments groups remove-members* is used to remove member interconnect attachments from an
        interconnect attachment group.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        attachments: |-
            Member interconnect attachments to add to or remove from the interconnect
            attachment group.
