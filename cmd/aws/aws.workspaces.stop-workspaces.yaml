name: stop-workspaces
description: Stops the specified WorkSpaces.
flags:
    --stop-workspace-requests=!: The WorkSpaces to stop.
documentation:
    command: |-
        Stops the specified WorkSpaces.

        You cannot stop a WorkSpace unless it has a running mode of `AutoStop` or `Manual` and a state of `AVAILABLE`, `IMPAIRED`, `UNHEALTHY`, or `ERROR`.
    flag:
        stop-workspace-requests: The WorkSpaces to stop. You can specify up to 25 WorkSpaces.
