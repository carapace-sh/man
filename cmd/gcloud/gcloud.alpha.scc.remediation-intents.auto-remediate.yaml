name: auto-remediate
description: '*(ALPHA)*  Command for semi-automatic remediation of SCC findings.'
flags:
    --git-config-path=!: Path to the git config file in YAML format to raise the PR.
    --org-id=!: The Google Cloud organization ID
    --root-dir-path=: The relative path to the root directory for the terraform
documentation:
    command: |
        *(ALPHA)*  Orchestrates the semi-automatic remediation process for SCC findings
        by calling the Remediation Intent APIs.
    flag:
        git-config-path: |-
            Path to the git config file in YAML format to raise the PR.
                       Format: /path/to/file.yaml. Sample Config file:
            +
                         remote: origin
                         main-branch-name: master
                         branch-prefix: iac-remediation-
                         reviewers: reviewer1,reviewer2
        org-id: The Google Cloud organization ID
        root-dir-path: |-
            The relative path to the root directory for the terraform
               repository.
            If not specified, the default value
               is assumed to be the current directory. The default is *.*.
