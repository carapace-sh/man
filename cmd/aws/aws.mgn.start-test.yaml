name: start-test
description: Launches a Test Instance for specific Source Servers.
flags:
    --account-id=: Start Test for Account ID.
    --source-server-ids=!: Start Test for Source Server IDs.
    --tags=: Start Test by Tags.
documentation:
    command: Launches a Test Instance for specific Source Servers. This command starts a LAUNCH job whose initiatedBy property is StartTest and changes the SourceServer.lifeCycle.state property to TESTING.
    flag:
        account-id: Start Test for Account ID.
        source-server-ids: Start Test for Source Server IDs.
        tags: Start Test by Tags.
