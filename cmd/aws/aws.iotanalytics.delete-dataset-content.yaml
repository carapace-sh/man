name: delete-dataset-content
description: Deletes the content of the specified dataset.
flags:
    --dataset-name=!: The name of the dataset whose content is deleted.
    --version-id=: The version of the dataset whose content is deleted.
documentation:
    command: Deletes the content of the specified dataset.
    flag:
        dataset-name: The name of the dataset whose content is deleted.
        version-id: The version of the dataset whose content is deleted. You can also use the strings "$LATEST" or "$LATEST\_SUCCEEDED" to delete the latest or latest successfully completed data set. If not specified, "$LATEST\_SUCCEEDED" is the default.
