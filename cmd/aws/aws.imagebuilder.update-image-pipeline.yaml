name: update-image-pipeline
description: Updates an image pipeline.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: Unique, case-sensitive identifier you provide to ensure idempotency of the request.
    --container-recipe-arn=: The Amazon Resource Name (ARN) of the container pipeline to update.
    --description=: The description of the image pipeline.
    --distribution-configuration-arn=: The Amazon Resource Name (ARN) of the distribution configuration that Image Builder uses to configure and distribute images that this image pipeline has updated.
    --enhanced-image-metadata-enabled: Collects additional information about the image being created, including the operating system (OS) version and package list.
    --execution-role=: The name or Amazon Resource Name (ARN) for the IAM role you create that grants Image Builder access to perform workflow actions.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --image-pipeline-arn=!: The Amazon Resource Name (ARN) of the image pipeline that you want to update.
    --image-recipe-arn=: The Amazon Resource Name (ARN) of the image recipe that will be used to configure images updated by this image pipeline.
    --image-scanning-configuration=: Contains settings for vulnerability scans.
    --image-tests-configuration=: The image test configuration of the image pipeline.
    --infrastructure-configuration-arn=!: The Amazon Resource Name (ARN) of the infrastructure configuration that Image Builder uses to build images that this image pipeline has updated.
    --logging-configuration=: Update logging configuration for the output image that's created when the pipeline runs.
    --no-enhanced-image-metadata-enabled: Collects additional information about the image being created, including the operating system (OS) version and package list.
    --schedule=: The schedule of the image pipeline.
    --status=: The status of the image pipeline.
    --workflows=:
        description: Contains the workflows to run for the pipeline.
        nargs: -1
completion:
    flag:
        status:
            - DISABLED
            - ENABLED
documentation:
    command: |-
        Updates an image pipeline. Image pipelines enable you to automate the creation and distribution of images. You must specify exactly one recipe for your image, using either a `containerRecipeArn` or an `imageRecipeArn`.

        UpdateImagePipeline does not support selective updates for the pipeline. You must specify all of the required properties in the update request, not just the properties that have changed.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier you provide to ensure idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html) in the *Amazon EC2 API Reference*.
        container-recipe-arn: The Amazon Resource Name (ARN) of the container pipeline to update.
        description: The description of the image pipeline.
        distribution-configuration-arn: The Amazon Resource Name (ARN) of the distribution configuration that Image Builder uses to configure and distribute images that this image pipeline has updated.
        enhanced-image-metadata-enabled: Collects additional information about the image being created, including the operating system (OS) version and package list. This information is used to enhance the overall experience of using EC2 Image Builder. Enabled by default.
        execution-role: The name or Amazon Resource Name (ARN) for the IAM role you create that grants Image Builder access to perform workflow actions.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        image-pipeline-arn: The Amazon Resource Name (ARN) of the image pipeline that you want to update.
        image-recipe-arn: The Amazon Resource Name (ARN) of the image recipe that will be used to configure images updated by this image pipeline.
        image-scanning-configuration: Contains settings for vulnerability scans.
        image-tests-configuration: The image test configuration of the image pipeline.
        infrastructure-configuration-arn: The Amazon Resource Name (ARN) of the infrastructure configuration that Image Builder uses to build images that this image pipeline has updated.
        logging-configuration: Update logging configuration for the output image that's created when the pipeline runs.
        schedule: The schedule of the image pipeline.
        status: The status of the image pipeline.
        workflows: Contains the workflows to run for the pipeline.
