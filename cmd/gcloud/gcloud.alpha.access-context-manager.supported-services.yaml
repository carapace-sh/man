name: supported-services
description: '*(ALPHA)*  Retrieve VPC Service Controls Supported Services.'
documentation:
    command: |-
        *(ALPHA)*  The gcloud alpha access-context-manager supported-services command group lets you list VPC Service Controls supported
        services and its properties.

        ## EXAMPLES

        To see all VPC Service Controls supported services:

          $ gcloud alpha access-context-manager supported-services list

        To see support information about VPC Service Controls supported services:

          $ gcloud alpha access-context-manager supported-services describe SERVICE_NAME
