name: describe-product-as-admin
description: Gets information about the specified product.
flags:
    --accept-language=: The language code.
    --id=: The product identifier.
    --name=: The product name.
    --source-portfolio-id=: The unique identifier of the shared portfolio that the specified product is associated with.
documentation:
    command: Gets information about the specified product. This operation is run with administrator access.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        id: The product identifier.
        name: The product name.
        source-portfolio-id: |-
            The unique identifier of the shared portfolio that the specified product is associated with.

            You can provide this parameter to retrieve the shared TagOptions associated with the product. If this parameter is provided and if TagOptions sharing is enabled in the portfolio share, the API returns both local and shared TagOptions associated with the product. Otherwise only local TagOptions will be returned.
