name: update-registry
description: Updates an existing registry which is used to hold a collection of schemas.
flags:
    --description=!: A description of the registry.
    --registry-id=!: This is a wrapper structure that may contain the registry name and Amazon Resource Name (ARN).
documentation:
    command: Updates an existing registry which is used to hold a collection of schemas. The updated properties relate to the registry, and do not modify any of the schemas within the registry.
    flag:
        description: A description of the registry. If description is not provided, this field will not be updated.
        registry-id: This is a wrapper structure that may contain the registry name and Amazon Resource Name (ARN).
