name: list-offering-promotions
description: Returns a list of offering promotions.
flags:
    --next-token=: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
documentation:
    command: Returns a list of offering promotions. Each offering promotion record contains the ID and description of the promotion. The API returns a `NotEligible` error if the caller is not permitted to invoke the operation. Contact [aws-devicefarm-support@amazon.com](mailto:aws-devicefarm-support@amazon.com) if you must be able to invoke this operation.
    flag:
        next-token: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
