name: describe-reserved-cache-nodes-offerings
description: Lists available reserved cache node offerings.
flags:
    --cache-node-type=: The cache node type filter value.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --duration=: Duration filter value, specified in years or seconds.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --marker=: An optional marker returned from a prior request.
    --max-items=: The  total number of items to return in the command's output.
    --max-records=: The maximum number of records to include in the response.
    --offering-type=: The offering type filter value.
