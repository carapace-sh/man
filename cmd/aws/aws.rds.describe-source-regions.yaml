name: describe-source-regions
description: Returns a list of the source Amazon Web Services Regions where the current Amazon Web Services Region can create a read replica, copy a DB snapshot from, or replicate automated backups from.
flags:
    --filters=: This parameter isn't currently supported.
    --marker=: An optional pagination token provided by a previous `DescribeSourceRegions` request.
    --max-records=: The maximum number of records to include in the response.
    --region-name=: The source Amazon Web Services Region name.
documentation:
    command: |-
        Returns a list of the source Amazon Web Services Regions where the current Amazon Web Services Region can create a read replica, copy a DB snapshot from, or replicate automated backups from.

        Use this operation to determine whether cross-Region features are supported between other Regions and your current Region. This operation supports pagination.

        To return information about the Regions that are enabled for your account, or all Regions, use the EC2 operation `DescribeRegions`. For more information, see [DescribeRegions](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DescribeRegions.html) in the *Amazon EC2 API Reference*.
    flag:
        filters: This parameter isn't currently supported.
        marker: An optional pagination token provided by a previous `DescribeSourceRegions` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        region-name: |-
            The source Amazon Web Services Region name. For example, `us-east-1`.

            Constraints:

            - Must specify a valid Amazon Web Services Region name.
