name: add-profile-permission
description: Adds cross-account permissions to a signing profile.
flags:
    --action=!: For cross-account signing.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --principal=!: The AWS principal receiving cross-account permissions.
    --profile-name=!: The human-readable name of the signing profile.
    --profile-version=: The version of the signing profile.
    --revision-id=: A unique identifier for the current profile revision.
    --statement-id=!: A unique identifier for the cross-account permission statement.
documentation:
    command: Adds cross-account permissions to a signing profile.
    flag:
        action: |-
            For cross-account signing. Grant a designated account permission to perform one or more of the following actions. Each action is associated with a specific API's operations. For more information about cross-account signing, see [Using cross-account signing with signing profiles](https://docs.aws.amazon.com/signer/latest/developerguide/signing-profile-cross-account.html) in the *AWS Signer Developer Guide*.

            You can designate the following actions to an account.

            - `signer:StartSigningJob`. This action isn't supported for container image workflows. For details, see [StartSigningJob]().
            - `signer:SignPayload`. This action isn't supported for AWS Lambda workflows. For details, see [SignPayload]()
            - `signer:GetSigningProfile`. For details, see [GetSigningProfile]().
            - `signer:RevokeSignature`. For details, see [RevokeSignature]().
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        principal: The AWS principal receiving cross-account permissions. This may be an IAM role or another AWS account ID.
        profile-name: The human-readable name of the signing profile.
        profile-version: The version of the signing profile.
        revision-id: A unique identifier for the current profile revision.
        statement-id: A unique identifier for the cross-account permission statement.
