name: terminate-client-vpn-connections
description: Terminates active Client VPN endpoint connections.
flags:
    --client-vpn-endpoint-id=!: The ID of the Client VPN endpoint to which the client is connected.
    --connection-id=: The ID of the client connection to be terminated.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --username=: The name of the user who initiated the connection.
documentation:
    command: Terminates active Client VPN endpoint connections. This action can be used to terminate a specific client connection, or up to five connections established by a specific user.
    flag:
        client-vpn-endpoint-id: The ID of the Client VPN endpoint to which the client is connected.
        connection-id: The ID of the client connection to be terminated.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        username: The name of the user who initiated the connection. Use this option to terminate all active connections for the specified user. This option can only be used if the user has established up to five connections.
