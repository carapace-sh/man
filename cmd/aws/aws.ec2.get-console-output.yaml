name: get-console-output
description: Gets the console output for the specified instance.
flags:
    --dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --instance-id=!: The ID of the instance.
    --latest: When enabled, retrieves the latest console output for the instance.
    --no-dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --no-latest: When enabled, retrieves the latest console output for the instance.
documentation:
    command: |-
        Gets the console output for the specified instance. For Linux instances, the instance console output displays the exact console output that would normally be displayed on a physical monitor attached to a computer. For Windows instances, the instance console output includes the last three system event log errors.

        For more information, see [Instance console output](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-console.html#instance-console-console-output) in the *Amazon EC2 User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        instance-id: The ID of the instance.
        latest: |-
            When enabled, retrieves the latest console output for the instance.

            Default: disabled (`false`)
