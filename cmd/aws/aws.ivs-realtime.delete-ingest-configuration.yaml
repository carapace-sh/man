name: delete-ingest-configuration
description: Deletes a specified IngestConfiguration, so it can no longer be used to broadcast.
flags:
    --arn=!: ARN of the IngestConfiguration.
    --force: Optional field to force deletion of the IngestConfiguration.
    --no-force: Optional field to force deletion of the IngestConfiguration.
documentation:
    command: Deletes a specified IngestConfiguration, so it can no longer be used to broadcast. An IngestConfiguration cannot be deleted if the publisher is actively streaming to a stage, unless `force` is set to `true`.
    flag:
        arn: ARN of the IngestConfiguration.
        force: 'Optional field to force deletion of the IngestConfiguration. If this is set to `true` when a participant is actively publishing, the participant is disconnected from the stage, followed by deletion of the IngestConfiguration. Default: `false`.'
