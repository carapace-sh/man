name: describe
description: describe an Image Import.
flags:
    --location=: Resource location.
documentation:
    command: |
        gcloud migration vms image-imports describe describes an Image Import resource with a nested Image Import Job.
        The Image Import Job resource tracks the image import progress.
        To use this command, you must enable VM Migration API in your project.
    flag:
        location: |-
            Resource location.
            +
            To set the `location` attribute:
            * provide the argument `image_import_name` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/region`.
