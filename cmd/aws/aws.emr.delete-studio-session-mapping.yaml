name: delete-studio-session-mapping
description: Removes a user or group from an Amazon EMR Studio.
flags:
    --identity-id=: The globally unique identifier (GUID) of the user or group to remove from the Amazon EMR Studio.
    --identity-name=: The name of the user name or group to remove from the Amazon EMR Studio.
    --identity-type=!: Specifies whether the identity to delete from the Amazon EMR Studio is a user or a group.
    --studio-id=!: The ID of the Amazon EMR Studio.
completion:
    flag:
        identity-type:
            - USER
            - GROUP
documentation:
    command: Removes a user or group from an Amazon EMR Studio.
    flag:
        identity-id: The globally unique identifier (GUID) of the user or group to remove from the Amazon EMR Studio. For more information, see [UserId](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_User.html#singlesignon-Type-User-UserId) and [GroupId](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_Group.html#singlesignon-Type-Group-GroupId) in the *IAM Identity Center Identity Store API Reference*. Either `IdentityName` or `IdentityId` must be specified.
        identity-name: The name of the user name or group to remove from the Amazon EMR Studio. For more information, see [UserName](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_User.html#singlesignon-Type-User-UserName) and [DisplayName](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_Group.html#singlesignon-Type-Group-DisplayName) in the *IAM Identity Center Store API Reference*. Either `IdentityName` or `IdentityId` must be specified.
        identity-type: Specifies whether the identity to delete from the Amazon EMR Studio is a user or a group.
        studio-id: The ID of the Amazon EMR Studio.
