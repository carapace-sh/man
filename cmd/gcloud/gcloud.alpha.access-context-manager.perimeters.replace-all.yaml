name: replace-all
description: '*(ALPHA)*  Replace all existing service perimeters.'
flags:
    --etag=: An etag which specifies the version of the Access Policy.
    --source-file=!: Path to a file containing a list of service perimeters.
documentation:
    command: |
        *(ALPHA)*  Replace all existing service perimeter in specified access policy with service perimeters
        specified in a file.

        ## EXAMPLES

        To replace all perimeters within a policy, using etag:

          $ gcloud alpha access-context-manager perimeters replace-all my-policy-number --source-file=path-to-file-containing-all-replacement-service-perimeters.yaml --etag=optional-latest-etag-of-policy

        To replace all perimeters within a policy, without using etag:

          $ gcloud alpha access-context-manager perimeters replace-all my-policy-number --source-file=path-to-file-containing-all-replacement-service-perimeters.yaml
    flag:
        etag: |-
            An etag which specifies the version of the Access Policy. Only etags
            that represent the latest version of the Access Policy will be accepted.
        source-file: |-
            Path to a file containing a list of service perimeters.
            +
            An service perimeter file is a YAML-formatted list of service perimeters,
            which are YAML objects representing a Condition as described in
            the API reference. For example:
            +
            ```
            - name: my_perimeter
              title: My Perimeter
              description: Perimeter for foo.
              perimeterType: PERIMETER_TYPE_REGULAR
              status:
                resources:
                - projects/0123456789
                accessLevels:
                - accessPolicies/my_policy/accessLevels/my_level
                restrictedServices:
                - storage.googleapis.com
            ```
            +
            For more information about the alpha version, see:
            https://cloud.google.com/access-context-manager/docs/reference/rest/v1alpha/accessPolicies.servicePerimeters
            For other versions, see:
            https://cloud.google.com/access-context-manager/docs/reference/rest/v1/accessPolicies.servicePerimeters
