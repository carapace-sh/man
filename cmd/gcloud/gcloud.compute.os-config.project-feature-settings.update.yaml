name: update
description: Update VM Manager project feature settings.
flags:
    --patch-and-config-feature-set=!: Specifies the feature set for VM Manager.
completion:
    flag:
        patch-and-config-feature-set:
            - full
            - limited
            - osconfig-b
            - osconfig-c
documentation:
    command: |
        Update VM Manager project feature settings.
    flag:
        patch-and-config-feature-set: |-
            Specifies the feature set for VM Manager. _PATCH_AND_CONFIG_FEATURE_SET_ must be one of:
            +
            *full*::: Full set of VM Manager functionality (alias for osconfig-c).
            *limited*::: Limited feature set. Enables only the basic set of features (alias for osconfig-b).
            *osconfig-b*::: Limited feature set. Enables only the basic set of features.
            *osconfig-c*::: Full set of VM Manager functionality.
            :::
            +
