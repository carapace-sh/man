name: upgrade
description: Upgrade an Edge Container cluster.
flags:
    --location=: Google Cloud location for the cluster.
    --schedule=!: Schedule to upgrade a cluster after the request is acknowledged by Google.
documentation:
    command: Upgrade an Edge Container cluster.
    flag:
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        schedule: |-
            Schedule to upgrade a cluster after the request is acknowledged by Google.
            Support values: IMMEDIATELY.
