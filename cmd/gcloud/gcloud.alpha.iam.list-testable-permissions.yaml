name: list-testable-permissions
description: '*(ALPHA)*  List IAM testable permissions for a resource.'
flags:
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
documentation:
    command: |-
        *(ALPHA)*  Testable permissions mean the permissions that user can add or remove in
        a role at a given resource.
        The resource can be referenced either via the full resource name or via a URI.

        ## EXAMPLES

        List testable permissions for a resource identified via full resource name:

          $ gcloud alpha iam list-testable-permissions //cloudresourcemanager.googleapis.com/organizations/1234567

        List testable permissions for a resource identified via URI:

          $ gcloud alpha iam list-testable-permissions https://www.googleapis.com/compute/v1/projects/example-project
    flag:
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
