name: post-comment-for-compared-commit
description: Posts a comment on the comparison between two commits.
flags:
    --after-commit-id=!: To establish the directionality of the comparison, the full commit ID of the after commit.
    --before-commit-id=: To establish the directionality of the comparison, the full commit ID of the before commit.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique, client-generated idempotency token that, when provided in a request, ensures the request cannot be repeated with a changed parameter.
    --content=!: The content of the comment you want to make.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --location=: The location of the comparison where you want to comment.
    --repository-name=!: The name of the repository where you want to post a comment on the comparison between commits.
documentation:
    command: Posts a comment on the comparison between two commits.
    flag:
        after-commit-id: To establish the directionality of the comparison, the full commit ID of the after commit.
        before-commit-id: To establish the directionality of the comparison, the full commit ID of the before commit. Required for commenting on any commit unless that commit is the initial commit.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: A unique, client-generated idempotency token that, when provided in a request, ensures the request cannot be repeated with a changed parameter. If a request is received with the same parameters and a token is included, the request returns information about the initial request that used that token.
        content: The content of the comment you want to make.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        location: The location of the comparison where you want to comment.
        repository-name: The name of the repository where you want to post a comment on the comparison between commits.
