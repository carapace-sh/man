name: invoke-agent
description: Sends a prompt for the agent to process and respond to.
flags:
    --agent-alias-id=!: The alias of the agent to use.
    --agent-id=!: The unique identifier of the agent to use.
    --bedrock-model-configurations=: Model performance settings for the request.
    --enable-trace: Specifies whether to turn on the trace or not to track the agent's reasoning process.
    --end-session: Specifies whether to end the session with the agent or not.
    --input-text=: The prompt text to send the agent.
    --memory-id=: The unique identifier of the agent memory.
    --no-enable-trace: Specifies whether to turn on the trace or not to track the agent's reasoning process.
    --no-end-session: Specifies whether to end the session with the agent or not.
    --prompt-creation-configurations=: Specifies parameters that control how the service populates the agent prompt for an `InvokeAgent` request.
    --session-id=!: The unique identifier of the session.
    --session-state=: Contains parameters that specify various attributes of the session.
    --source-arn=: The ARN of the resource making the request.
    --streaming-configurations=: Specifies the configurations for streaming.
documentation:
    command: |-
        Sends a prompt for the agent to process and respond to. Note the following fields for the request:

        - To continue the same conversation with an agent, use the same `sessionId` value in the request.
        - To activate trace enablement, turn `enableTrace` to `true`. Trace enablement helps you follow the agent's reasoning process that led it to the information it processed, the actions it took, and the final result it yielded. For more information, see [Trace enablement](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-test.html#trace-events).
        - End a conversation by setting `endSession` to `true`.
        - In the `sessionState` object, you can include attributes for the session or prompt or, if you configured an action group to return control, results from invocation of the action group.

        The response contains both **chunk** and **trace** attributes.

        The final response is returned in the `bytes` field of the `chunk` object. The `InvokeAgent` returns one chunk for the entire interaction.

        - The `attribution` object contains citations for parts of the response.
        - If you set `enableTrace` to `true` in the request, you can trace the agent's steps and reasoning process that led it to the response.
        - If the action predicted was configured to return control, the response returns parameters for the action, elicited from the user, in the `returnControl` field.
        - Errors are also surfaced in the response.
    flag:
        agent-alias-id: The alias of the agent to use.
        agent-id: The unique identifier of the agent to use.
        bedrock-model-configurations: Model performance settings for the request.
        enable-trace: Specifies whether to turn on the trace or not to track the agent's reasoning process. For more information, see [Trace enablement](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-test.html#trace-events).
        end-session: Specifies whether to end the session with the agent or not.
        input-text: |-
            The prompt text to send the agent.

            If you include `returnControlInvocationResults` in the `sessionState` field, the `inputText` field will be ignored.
        memory-id: The unique identifier of the agent memory.
        prompt-creation-configurations: Specifies parameters that control how the service populates the agent prompt for an `InvokeAgent` request. You can control which aspects of previous invocations in the same agent session the service uses to populate the agent prompt. This gives you more granular control over the contextual history that is used to process the current request.
        session-id: The unique identifier of the session. Use the same value across requests to continue the same conversation.
        session-state: |-
            Contains parameters that specify various attributes of the session. For more information, see [Control session context](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-session-state.html).

            If you include `returnControlInvocationResults` in the `sessionState` field, the `inputText` field will be ignored.
        source-arn: The ARN of the resource making the request.
        streaming-configurations: |-
            Specifies the configurations for streaming.

            To use agent streaming, you need permissions to perform the `bedrock:InvokeModelWithResponseStream` action.
