name: update-access-policy
description: Updates an OpenSearch Serverless access policy.
flags:
    --client-token=: Unique, case-sensitive identifier to ensure idempotency of the request.
    --description=: A description of the policy.
    --name=!: The name of the policy.
    --policy-version=!: The version of the policy being updated.
    --policy=: The JSON policy document to use as the content for the policy.
    --type=!: The type of policy.
completion:
    flag:
        type:
            - data
documentation:
    command: Updates an OpenSearch Serverless access policy. For more information, see [Data access control for Amazon OpenSearch Serverless](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-data-access.html).
    flag:
        client-token: Unique, case-sensitive identifier to ensure idempotency of the request.
        description: A description of the policy. Typically used to store information about the permissions defined in the policy.
        name: The name of the policy.
        policy: The JSON policy document to use as the content for the policy.
        policy-version: The version of the policy being updated.
        type: The type of policy.
