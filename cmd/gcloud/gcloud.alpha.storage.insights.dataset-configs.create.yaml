name: create
description: '*(ALPHA)*  Create a new dataset config for Insights.'
flags:
    --activity-data-retention-period-days=: Provide retention period for the activity data in the config.
    --auto-add-new-buckets: Automatically include any new buckets created if they satisfy criteria defined in config settings.
    --description=: Description for dataset config.
    --enable-organization-scope: If passed, the dataset config will be enabled on the organization.
    --exclude-bucket-names=: List of bucket names to be excluded.
    --exclude-bucket-prefix-regexes=: List of bucket prefix regexes to be excluded.
    --exclude-source-locations=: List of locations for projects to be excluded.
    --identity=: The type of service account used in the dataset config.
    --include-bucket-names=: List of bucket names be included.
    --include-bucket-prefix-regexes=: List of bucket prefix regexes to be included.
    --include-source-locations=: List of locations for projects to be included.
    --location=!: Provide location of the dataset config.
    --no-auto-add-new-buckets&: Automatically include any new buckets created if they satisfy criteria defined in config settings.
    --no-enable-organization-scope&: If passed, the dataset config will be enabled on the organization.
    --organization=!: Provide the source organization number.
    --retention-period-days=!: Provide retention period for the config.
    --source-folders-file=: CSV formatted file containing source folder IDs, one per line.
    --source-folders=: List of source folder IDs.
    --source-projects-file=: CSV formatted file containing source project numbers, one per line.
    --source-projects=: List of source project numbers.
completion:
    flag:
        identity:
            - IDENTITY_TYPE_PER_CONFIG
            - IDENTITY_TYPE_PER_PROJECT
documentation:
    command: |
        *(ALPHA)*  Create a new dataset config for Insights.
    flag:
        activity-data-retention-period-days: Provide retention period for the activity data in the config. This overrides the retention period for activity data. Otherwise, the `retention_period_days` value is used for activity data as well.
        auto-add-new-buckets: Automatically include any new buckets created if they satisfy criteria defined in config settings.
        description: Description for dataset config.
        enable-organization-scope: If passed, the dataset config will be enabled on the organization.
        exclude-bucket-names: List of bucket names to be excluded.
        exclude-bucket-prefix-regexes: List of bucket prefix regexes to be excluded. Allowed regex patterns are similar to those for the --include-bucket-prefix-regexes flag.
        exclude-source-locations: List of locations for projects to be excluded.
        identity: 'The type of service account used in the dataset config. _IDENTITY_TYPE_ must be one of: *IDENTITY_TYPE_PER_CONFIG*, *IDENTITY_TYPE_PER_PROJECT*.'
        include-bucket-names: List of bucket names be included.
        include-bucket-prefix-regexes: List of bucket prefix regexes to be included. The dataset config will include all the buckets that match with the prefix regex. Examples of allowed prefix regex patterns can be testbucket```*```, testbucket.```*```foo, testb.+foo```*``` . It should follow syntax specified in google/re2 on GitHub.
        include-source-locations: List of locations for projects to be included.
        location: Provide location of the dataset config.
        no-auto-add-new-buckets: Automatically include any new buckets created if they satisfy criteria defined in config settings.
        no-enable-organization-scope: If passed, the dataset config will be enabled on the organization.
        organization: Provide the source organization number.
        retention-period-days: Provide retention period for the config.
        source-folders: List of source folder IDs.
        source-folders-file: CSV formatted file containing source folder IDs, one per line.
        source-projects: List of source project numbers.
        source-projects-file: CSV formatted file containing source project numbers, one per line.
