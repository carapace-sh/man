name: describe-matchmaking-configurations
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Retrieves the details of FlexMatch matchmaking configurations.
flags:
    --limit=: The maximum number of results to return.
    --names=: A unique identifier for the matchmaking configuration(s) to retrieve.
    --next-token=: A token that indicates the start of the next sequential page of results.
    --rule-set-name=: A unique identifier for the matchmaking rule set.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Retrieves the details of FlexMatch matchmaking configurations.

        This operation offers the following options: (1) retrieve all matchmaking configurations, (2) retrieve configurations for a specified list, or (3) retrieve all configurations that use a specified rule set name. When requesting multiple items, use the pagination parameters to retrieve results as a set of sequential pages.

        If successful, a configuration is returned for each requested name. When specifying a list of names, only configurations that currently exist are returned.

        **Learn more**

        [Setting up FlexMatch matchmakers](https://docs.aws.amazon.com/gamelift/latest/flexmatchguide/matchmaker-build.html)
    flag:
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages. This parameter is limited to 10.
        names: A unique identifier for the matchmaking configuration(s) to retrieve. You can use either the configuration name or ARN value. To request all existing configurations, leave this parameter empty.
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
        rule-set-name: A unique identifier for the matchmaking rule set. You can use either the rule set name or ARN value. Use this parameter to retrieve all matchmaking configurations that use this rule set.
