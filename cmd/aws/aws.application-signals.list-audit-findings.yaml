name: list-audit-findings
description: Returns a list of audit findings that provide automated analysis of service behavior and root cause analysis.
flags:
    --audit-targets=!: A list of audit targets to filter the findings by.
    --auditors=: A list of auditor names to filter the findings by.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=!: The end of the time period to retrieve audit findings for.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of audit findings to return in one operation.
    --next-token=: Include this value, if it was returned by the previous operation, to get the next set of audit findings.
    --start-time=!: The start of the time period to retrieve audit findings for.
documentation:
    command: Returns a list of audit findings that provide automated analysis of service behavior and root cause analysis. These findings help identify the most significant observations about your services, including performance issues, anomalies, and potential problems. The findings are generated using heuristic algorithms based on established troubleshooting patterns.
    flag:
        audit-targets: A list of audit targets to filter the findings by. You can specify services, SLOs, or service operations to limit the audit findings to specific entities.
        auditors: |-
            A list of auditor names to filter the findings by. Only findings generated by the specified auditors will be returned.

            The following auditors are available for configuration:

            - `slo` - SloAuditor: Identifies SLO violations and detects breached thresholds during the Assessment phase.
            - `operation_metric` - OperationMetricAuditor: Detects anomalies in service operation metrics from Application Signals RED metrics during the Assessment phase
            - `service_quota` - ServiceQuotaAuditor: Monitors resource utilization against service quotas during the Assessment phase
            - `trace` - TraceAuditor: Performs deep-dive analysis of distributed traces, correlating traces with breached SLOs or abnormal RED metrics during the Analysis phase
            - `dependency_metric` - CriticalPathAuditor: Analyzes service dependency impacts and maps dependency relationships from Application Signals RED metrics during the Analysis phase
            - `top_contributor` - TopContributorAuditor: Identifies infrastructure-level contributors to issues by analyzing EMF logs of Application Signals RED metrics during the Analysis phase
            - `log` - LogAuditor: Extracts insights from application logs, categorizing error types and ranking severity by frequency during the Analysis phase

            `InitAuditor` and `Summarizer` auditors are not configurable as they are automatically triggered during the audit process.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: The end of the time period to retrieve audit findings for. When used in a raw HTTP Query API, it is formatted as epoch time in seconds. For example, `1698778057`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of audit findings to return in one operation. If you omit this parameter, the default of 10 is used.
        next-token: Include this value, if it was returned by the previous operation, to get the next set of audit findings.
        start-time: The start of the time period to retrieve audit findings for. When used in a raw HTTP Query API, it is formatted as epoch time in seconds. For example, `1698778057`
