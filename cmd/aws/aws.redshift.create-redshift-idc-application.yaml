name: create-redshift-idc-application
description: Creates an Amazon Redshift application for use with IAM Identity Center.
flags:
    --application-type=: The type of application being created.
    --authorized-token-issuer-list=:
        description: The token issuer list for the Amazon Redshift IAM Identity Center application instance.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role-arn=!: The IAM role ARN for the Amazon Redshift IAM Identity Center application instance.
    --idc-display-name=!: The display name for the Amazon Redshift IAM Identity Center application instance.
    --idc-instance-arn=!: The Amazon resource name (ARN) of the IAM Identity Center instance where Amazon Redshift creates a new managed application.
    --identity-namespace=: The namespace for the Amazon Redshift IAM Identity Center application instance.
    --redshift-idc-application-name=!: The name of the Redshift application in IAM Identity Center.
    --service-integrations=:
        description: A collection of service integrations for the Redshift IAM Identity Center application.
        nargs: -1
    --sso-tag-keys=:
        description: A list of tags keys that Redshift Identity Center applications copy to IAM Identity Center.
        nargs: -1
    --tags=:
        description: A list of tags.
        nargs: -1
completion:
    flag:
        application-type:
            - None
            - Lakehouse
documentation:
    command: Creates an Amazon Redshift application for use with IAM Identity Center.
    flag:
        application-type: The type of application being created. Valid values are `None` or `Lakehouse`. Use `Lakehouse` to enable Amazon Redshift federated permissions on cluster.
        authorized-token-issuer-list: The token issuer list for the Amazon Redshift IAM Identity Center application instance.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role-arn: The IAM role ARN for the Amazon Redshift IAM Identity Center application instance. It has the required permissions to be assumed and invoke the IDC Identity Center API.
        idc-display-name: The display name for the Amazon Redshift IAM Identity Center application instance. It appears in the console.
        idc-instance-arn: The Amazon resource name (ARN) of the IAM Identity Center instance where Amazon Redshift creates a new managed application.
        identity-namespace: The namespace for the Amazon Redshift IAM Identity Center application instance. It determines which managed application verifies the connection token.
        redshift-idc-application-name: The name of the Redshift application in IAM Identity Center.
        service-integrations: A collection of service integrations for the Redshift IAM Identity Center application.
        sso-tag-keys: A list of tags keys that Redshift Identity Center applications copy to IAM Identity Center. For each input key, the tag corresponding to the key-value pair is propagated.
        tags: A list of tags.
