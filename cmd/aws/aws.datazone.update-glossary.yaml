name: update-glossary
description: Updates the business glossary in Amazon DataZone.
flags:
    --client-token=: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
    --description=: The description to be updated as part of the `UpdateGlossary` action.
    --domain-identifier=!: The identifier of the Amazon DataZone domain in which a business glossary is to be updated.
    --identifier=!: The identifier of the business glossary to be updated.
    --name=: The name to be updated as part of the `UpdateGlossary` action.
    --status=: The status to be updated as part of the `UpdateGlossary` action.
completion:
    flag:
        status:
            - DISABLED
            - ENABLED
documentation:
    command: |-
        Updates the business glossary in Amazon DataZone.

        Prerequisites:

        - The glossary must exist in the given domain.
        - The caller must have the `datazone:UpdateGlossary` permission to update it.
        - When updating the name, the new name must be unique within the domain.
        - The glossary must not be deleted or in a terminal state.
    flag:
        client-token: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
        description: The description to be updated as part of the `UpdateGlossary` action.
        domain-identifier: The identifier of the Amazon DataZone domain in which a business glossary is to be updated.
        identifier: The identifier of the business glossary to be updated.
        name: The name to be updated as part of the `UpdateGlossary` action.
        status: The status to be updated as part of the `UpdateGlossary` action.
