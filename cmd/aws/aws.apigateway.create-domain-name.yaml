name: create-domain-name
description: Creates a new domain name.
flags:
    --certificate-arn=: The reference to an Amazon Web Services-managed certificate that will be used by edge-optimized endpoint or private endpoint for this domain name.
    --certificate-body=: \[Deprecated] The body of the server certificate that will be used by edge-optimized endpoint or private endpoint for this domain name provided by your certificate authority.
    --certificate-chain=: \[Deprecated] The intermediate certificates and optionally the root certificate, one after the other without any blank lines, used by an edge-optimized endpoint for this domain name.
    --certificate-name=: The user-friendly name of the certificate that will be used by edge-optimized endpoint or private endpoint for this domain name.
    --certificate-private-key=: \[Deprecated] Your edge-optimized endpoint's domain name certificate's private key.
    --domain-name=!: The name of the DomainName resource.
    --endpoint-configuration=: The endpoint configuration of this DomainName showing the endpoint types and IP address types of the domain name.
    --mutual-tls-authentication=: ""
    --ownership-verification-certificate-arn=: The ARN of the public certificate issued by ACM to validate ownership of your custom domain.
    --policy=: A stringified JSON policy document that applies to the `execute-api` service for this DomainName regardless of the caller and Method configuration.
    --regional-certificate-arn=: The reference to an Amazon Web Services-managed certificate that will be used by regional endpoint for this domain name.
    --regional-certificate-name=: The user-friendly name of the certificate that will be used by regional endpoint for this domain name.
    --routing-mode=: The routing mode for this domain name.
    --security-policy=: The Transport Layer Security (TLS) version + cipher suite for this DomainName.
    --tags=: The key-value map of strings.
completion:
    flag:
        routing-mode:
            - BASE_PATH_MAPPING_ONLY
            - ROUTING_RULE_ONLY
            - ROUTING_RULE_THEN_BASE_PATH_MAPPING
        security-policy:
            - TLS_1_0
            - TLS_1_2
documentation:
    command: Creates a new domain name.
    flag:
        certificate-arn: The reference to an Amazon Web Services-managed certificate that will be used by edge-optimized endpoint or private endpoint for this domain name. Certificate Manager is the only supported source.
        certificate-body: \[Deprecated] The body of the server certificate that will be used by edge-optimized endpoint or private endpoint for this domain name provided by your certificate authority.
        certificate-chain: \[Deprecated] The intermediate certificates and optionally the root certificate, one after the other without any blank lines, used by an edge-optimized endpoint for this domain name. If you include the root certificate, your certificate chain must start with intermediate certificates and end with the root certificate. Use the intermediate certificates that were provided by your certificate authority. Do not include any intermediaries that are not in the chain of trust path.
        certificate-name: The user-friendly name of the certificate that will be used by edge-optimized endpoint or private endpoint for this domain name.
        certificate-private-key: \[Deprecated] Your edge-optimized endpoint's domain name certificate's private key.
        domain-name: The name of the DomainName resource.
        endpoint-configuration: The endpoint configuration of this DomainName showing the endpoint types and IP address types of the domain name.
        mutual-tls-authentication: ""
        ownership-verification-certificate-arn: The ARN of the public certificate issued by ACM to validate ownership of your custom domain. Only required when configuring mutual TLS and using an ACM imported or private CA certificate ARN as the regionalCertificateArn.
        policy: A stringified JSON policy document that applies to the `execute-api` service for this DomainName regardless of the caller and Method configuration. Supported only for private custom domain names.
        regional-certificate-arn: The reference to an Amazon Web Services-managed certificate that will be used by regional endpoint for this domain name. Certificate Manager is the only supported source.
        regional-certificate-name: The user-friendly name of the certificate that will be used by regional endpoint for this domain name.
        routing-mode: The routing mode for this domain name. The routing mode determines how API Gateway sends traffic from your custom domain name to your private APIs.
        security-policy: The Transport Layer Security (TLS) version + cipher suite for this DomainName. The valid values are `TLS_1_0` and `TLS_1_2`.
        tags: The key-value map of strings. The valid character set is \[a-zA-Z+-=.\_:/]. The tag key can be up to 128 characters and must not start with `aws:`. The tag value can be up to 256 characters.
