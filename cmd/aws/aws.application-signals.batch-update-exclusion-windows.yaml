name: batch-update-exclusion-windows
description: Add or remove time window exclusions for one or more Service Level Objectives (SLOs).
flags:
    --add-exclusion-windows=:
        description: A list of exclusion windows to add to the specified SLOs.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --remove-exclusion-windows=:
        description: A list of exclusion windows to remove from the specified SLOs.
        nargs: -1
    --slo-ids=!:
        description: The list of SLO IDs to add or remove exclusion windows from.
        nargs: -1
documentation:
    command: Add or remove time window exclusions for one or more Service Level Objectives (SLOs).
    flag:
        add-exclusion-windows: A list of exclusion windows to add to the specified SLOs. You can add up to 10 exclusion windows per SLO.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        remove-exclusion-windows: A list of exclusion windows to remove from the specified SLOs. The window configuration must match an existing exclusion window.
        slo-ids: The list of SLO IDs to add or remove exclusion windows from.
