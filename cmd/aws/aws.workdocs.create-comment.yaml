name: create-comment
description: Adds a new comment to the specified document version.
flags:
    --authentication-token=: Amazon WorkDocs authentication token.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --document-id=!: The ID of the document.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-notify-collaborators: Set this parameter to TRUE to send an email out to the document collaborators after the comment is created.
    --notify-collaborators: Set this parameter to TRUE to send an email out to the document collaborators after the comment is created.
    --parent-id=: The ID of the parent comment.
    --text=!: The text of the comment.
    --thread-id=: The ID of the root comment in the thread.
    --version-id=!: The ID of the document version.
    --visibility=: The visibility of the comment.
completion:
    flag:
        visibility:
            - PUBLIC
            - PRIVATE
documentation:
    command: Adds a new comment to the specified document version.
    flag:
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        document-id: The ID of the document.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        notify-collaborators: Set this parameter to TRUE to send an email out to the document collaborators after the comment is created.
        parent-id: The ID of the parent comment.
        text: The text of the comment.
        thread-id: The ID of the root comment in the thread.
        version-id: The ID of the document version.
        visibility: The visibility of the comment. Options are either PRIVATE, where the comment is visible only to the comment author and document owner and co-owners, or PUBLIC, where the comment is visible to document owners, co-owners, and contributors.
