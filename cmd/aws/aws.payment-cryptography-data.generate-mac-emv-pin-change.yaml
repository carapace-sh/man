name: generate-mac-emv-pin-change
description: Generates an issuer script mac for EMV payment cards that use offline PINs as the cardholder verification method (CVM).
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --derivation-method-attributes=!: The attributes and data values to derive payment card specific confidentiality and integrity keys.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --message-data=!: The message data is the APDU command from the card reader or terminal.
    --new-encrypted-pin-block=!: The incoming new encrypted PIN block data for offline pin change on an EMV card.
    --new-pin-pek-identifier=!: The `keyARN` of the PEK protecting the incoming new encrypted PIN block.
    --pin-block-format=!: The PIN encoding format of the incoming new encrypted PIN block as specified in ISO 9564.
    --secure-messaging-confidentiality-key-identifier=!: The `keyARN` of the issuer master key (IMK-SMC) used to protect the PIN block data in the issuer script response.
    --secure-messaging-integrity-key-identifier=!: The `keyARN` of the issuer master key (IMK-SMI) used to authenticate the issuer script response.
completion:
    flag:
        pin-block-format:
            - ISO_FORMAT_0
            - ISO_FORMAT_1
            - ISO_FORMAT_3
documentation:
    command: |-
        Generates an issuer script mac for EMV payment cards that use offline PINs as the cardholder verification method (CVM).

        This operation generates an authenticated issuer script response by appending the incoming message data (APDU command) with the target encrypted PIN block in ISO2 format. The command structure and method to send the issuer script update to the card is not defined by this operation and is typically determined by the applicable payment card scheme.

        The primary inputs to this operation include the incoming new encrypted pinblock, PIN encryption key (PEK), issuer master key (IMK), primary account number (PAN), and the payment card derivation method.

        The operation uses two issuer master keys - secure messaging for confidentiality (IMK-SMC) and secure messaging for integrity (IMK-SMI). The SMC key is used to internally derive a key to secure the pin, while SMI key is used to internally derive a key to authenticate the script reponse as per the [EMV 4.4 - Book 2 - Security and Key Management](https://www.emvco.com/specifications/) specification.

        This operation supports Amex, EMV2000, EMVCommon, Mastercard and Visa derivation methods, each requiring specific input parameters. Users must follow the specific derivation method and input parameters defined by the respective payment card scheme.

        Use [GenerateMac]() operation when sending a script update to an EMV card that does not involve PIN change. When assigning IAM permissions, it is important to understand that [EncryptData]() using EMV keys and [GenerateMac]() perform similar functions to this command.

        **Cross-account use**: This operation can't be used across different Amazon Web Services accounts.

        **Related operations:**

        - [EncryptData]()
        - [GenerateMac]()
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        derivation-method-attributes: The attributes and data values to derive payment card specific confidentiality and integrity keys.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        message-data: The message data is the APDU command from the card reader or terminal. The target encrypted PIN block, after translation to ISO2 format, is appended to this message data to generate an issuer script response.
        new-encrypted-pin-block: The incoming new encrypted PIN block data for offline pin change on an EMV card.
        new-pin-pek-identifier: The `keyARN` of the PEK protecting the incoming new encrypted PIN block.
        pin-block-format: The PIN encoding format of the incoming new encrypted PIN block as specified in ISO 9564.
        secure-messaging-confidentiality-key-identifier: The `keyARN` of the issuer master key (IMK-SMC) used to protect the PIN block data in the issuer script response.
        secure-messaging-integrity-key-identifier: The `keyARN` of the issuer master key (IMK-SMI) used to authenticate the issuer script response.
