name: get-spot-placement-scores
description: Calculates the Spot placement score for a Region or Availability Zone based on the specified target capacity and compute requirements.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-requirements-with-metadata=: The attributes for the instance types.
    --instance-types=:
        description: The instance types.
        nargs: -1
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token returned from a previous paginated request.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-single-availability-zone: Specify `true` so that the response returns a list of scored Availability Zones.
    --page-size=: The size of each page to get in the AWS service call.
    --region-names=:
        description: The Regions used to narrow down the list of Regions to be scored.
        nargs: -1
    --single-availability-zone: Specify `true` so that the response returns a list of scored Availability Zones.
    --starting-token=: A token to specify where to start paginating.
    --target-capacity-unit-type=: The unit for the target capacity.
    --target-capacity=!: The target capacity.
completion:
    flag:
        target-capacity-unit-type:
            - vcpu
            - memory-mib
            - units
documentation:
    command: |-
        Calculates the Spot placement score for a Region or Availability Zone based on the specified target capacity and compute requirements.

        You can specify your compute requirements either by using `InstanceRequirementsWithMetadata` and letting Amazon EC2 choose the optimal instance types to fulfill your Spot request, or you can specify the instance types by using `InstanceTypes`.

        For more information, see [Spot placement score](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-placement-score.html) in the *Amazon EC2 User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-requirements-with-metadata: |-
            The attributes for the instance types. When you specify instance attributes, Amazon EC2 will identify instance types with those attributes.

            If you specify `InstanceRequirementsWithMetadata`, you can't specify `InstanceTypes`.
        instance-types: |-
            The instance types. We recommend that you specify at least three instance types. If you specify one or two instance types, or specify variations of a single instance type (for example, an `m3.xlarge` with and without instance storage), the returned placement score will always be low.

            If you specify `InstanceTypes`, you can't specify `InstanceRequirementsWithMetadata`.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        region-names: The Regions used to narrow down the list of Regions to be scored. Enter the Region code, for example, `us-east-1`.
        single-availability-zone: |-
            Specify `true` so that the response returns a list of scored Availability Zones. Otherwise, the response returns a list of scored Regions.

            A list of scored Availability Zones is useful if you want to launch all of your Spot capacity into a single Availability Zone.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        target-capacity: The target capacity.
        target-capacity-unit-type: The unit for the target capacity.
