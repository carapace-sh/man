documentation:
    command: |-
        *(BETA)*  *gcloud beta compute connect-to-serial-port* allows users to connect to, and interact with, a VM's
        virtual serial port using ssh as the secure, authenticated transport
        protocol.

        The user must first enable serial port access to a given VM by setting
        the 'serial-port-enable=true' metadata key-value pair. Setting
        'serial-port-enable' on the project-level metadata enables serial port
        access to all VMs in the project.

        This command uses the same SSH key pair as the `gcloud compute ssh`
        command and also ensures that the user's public SSH key is present in
        the project's metadata. If the user does not have a public SSH key,
        one is generated using ssh-keygen.

        ## EXAMPLES
        To connect to the serial port of the instance 'my-instance' in zone
        'us-central1-f', run:

          $ gcloud beta compute connect-to-serial-port my-instance --zone=us-central1-f
    flag:
        dry-run: If provided, the ssh command is printed to standard out rather than being executed.
        extra-args: |-
            Optional arguments can be passed to the serial port connection by
            passing key-value pairs to this flag, such as max-connections=N or
            replay-lines=N. See https://cloud.google.com/compute/docs/instances/interacting-with-serial-console for additional options.
        force-key-file-overwrite: |-
            If enabled, the gcloud command-line tool will regenerate and overwrite
            the files associated with a broken SSH key without asking for
            confirmation in both interactive and non-interactive environments.
            +
            If disabled, the files associated with a broken SSH key will not be
            regenerated and will fail in both interactive and non-interactive
            environments.
        location: |-
            If provided, the region in which the serial console connection will
            occur. Must be the region of the VM to connect to.
        no-dry-run: If provided, the ssh command is printed to standard out rather than being executed.
        no-force-key-file-overwrite: |-
            If enabled, the gcloud command-line tool will regenerate and overwrite
            the files associated with a broken SSH key without asking for
            confirmation in both interactive and non-interactive environments.

            If disabled, the files associated with a broken SSH key will not be
            regenerated and will fail in both interactive and non-interactive
            environments.
        port: |-
            The number of the requested serial port. Can be 1-4, default is 1.
            +
            Instances can support up to four serial ports. By default, this
            command will connect to the first serial port. Setting this flag
            will connect to the requested serial port.
        ssh-key-expiration: |-
            The time when the ssh key will be valid until, such as
            "2017-08-29T18:52:51.142Z." This is only valid if the instance is not
            using OS Login. See $ gcloud topic datetimes for information on time
            formats.
        ssh-key-expire-after: |-
            The maximum length of time an SSH key is valid for once created and
            installed, e.g. 2m for 2 minutes. See $ gcloud topic datetimes for
            information on duration formats.
        ssh-key-file: The path to the SSH key file. By default, this is ``~/.ssh/google_compute_engine''.
        zone: |-
            Zone of the instance to connect to. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
