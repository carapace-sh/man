name: put-file
description: Adds or updates a file in a branch in an CodeCommit repository, and generates a commit for the addition in the specified branch.
flags:
    --branch-name=!: The name of the branch where you want to add or update the file.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --commit-message=: A message about why this file was added or updated.
    --email=: An email address for the person adding or updating the file.
    --file-content=!: The content of the file, in binary object format.
    --file-mode=: The file mode permissions of the blob.
    --file-path=!: The name of the file you want to add or update, including the relative path to the file in the repository.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: The name of the person adding or updating the file.
    --parent-commit-id=: The full commit ID of the head commit in the branch where you want to add or update the file.
    --repository-name=!: The name of the repository where you want to add or update the file.
completion:
    flag:
        file-mode:
            - EXECUTABLE
            - NORMAL
            - SYMLINK
documentation:
    command: Adds or updates a file in a branch in an CodeCommit repository, and generates a commit for the addition in the specified branch.
    flag:
        branch-name: The name of the branch where you want to add or update the file. If this is an empty repository, this branch is created.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        commit-message: A message about why this file was added or updated. Although it is optional, a message makes the commit history for your repository more useful.
        email: An email address for the person adding or updating the file.
        file-content: The content of the file, in binary object format.
        file-mode: The file mode permissions of the blob. Valid file mode permissions are listed here.
        file-path: |-
            The name of the file you want to add or update, including the relative path to the file in the repository.

            If the path does not currently exist in the repository, the path is created as part of adding the file.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the person adding or updating the file. Although it is optional, a name makes the commit history for your repository more useful.
        parent-commit-id: |-
            The full commit ID of the head commit in the branch where you want to add or update the file. If this is an empty repository, no commit ID is required. If this is not an empty repository, a commit ID is required.

            The commit ID must match the ID of the head commit at the time of the operation. Otherwise, an error occurs, and the file is not added or updated.
        repository-name: The name of the repository where you want to add or update the file.
