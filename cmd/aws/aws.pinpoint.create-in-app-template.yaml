name: create-in-app-template
description: Creates a new message template for messages using the in-app message channel.
flags:
    --in-app-template-request=!: ""
    --template-name=!: The name of the message template.
documentation:
    command: Creates a new message template for messages using the in-app message channel.
    flag:
        in-app-template-request: ""
        template-name: The name of the message template. A template name must start with an alphanumeric character and can contain a maximum of 128 characters. The characters can be alphanumeric characters, underscores (\_), or hyphens (-). Template names are case sensitive.
