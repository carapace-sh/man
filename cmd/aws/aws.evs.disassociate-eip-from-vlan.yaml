name: disassociate-eip-from-vlan
description: Disassociates an Elastic IP address from a public HCX VLAN.
flags:
    --association-id=!: A unique ID for the Elastic IP address association.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: This parameter is not used in Amazon EVS currently.
    --environment-id=!: A unique ID for the environment containing the VLAN that the Elastic IP address disassociates from.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --vlan-name=!: The name of the VLAN.
documentation:
    command: Disassociates an Elastic IP address from a public HCX VLAN. This operation is only allowed for public HCX VLANs at this time.
    flag:
        association-id: A unique ID for the Elastic IP address association.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            This parameter is not used in Amazon EVS currently. If you supply input for this parameter, it will have no effect.

            A unique, case-sensitive identifier that you provide to ensure the idempotency of the environment creation request. If you do not specify a client token, a randomly generated token is used for the request to ensure idempotency.
        environment-id: A unique ID for the environment containing the VLAN that the Elastic IP address disassociates from.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        vlan-name: The name of the VLAN. `hcx` is the only accepted VLAN name at this time.
