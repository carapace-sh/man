name: enable
description: Enable a subordinate certificate authority.
flags:
    --location=: The location of the CERTIFICATE_AUTHORITY.
    --pool=: The parent CA Pool of the CERTIFICATE_AUTHORITY.
documentation:
    command: |-
        Enables a subordinate certificate authority. The
        subordinate certificate authority will be allowed to issue certificates once
        enabled.

        ## EXAMPLES

        To enable a subordinate CA:

            $ gcloud privateca subordinates enable server-tls1 --pool=my-pool --location=us-west1
    flag:
        location: |-
            The location of the CERTIFICATE_AUTHORITY.
            +
            To set the `location` attribute:
            * provide the argument `CERTIFICATE_AUTHORITY` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `privateca/location`.
        pool: |-
            The parent CA Pool of the CERTIFICATE_AUTHORITY.
            +
            To set the `pool` attribute:
            * provide the argument `CERTIFICATE_AUTHORITY` on the command line with a fully specified name;
            * provide the argument `--pool` on the command line.
