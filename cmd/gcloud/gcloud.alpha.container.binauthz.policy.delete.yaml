name: delete
description: '*(ALPHA)*  Delete a Binary Authorization platform policy.'
flags:
    --platform=: The platform that the policy belongs to.
documentation:
    command: |-
        ## EXAMPLES

        To delete a policy using its resource name:

          $ gcloud alpha container binauthz policy delete projects/my_proj/platforms/gke/policies/policy1

        To delete the same policy using flags:

          $ gcloud alpha container binauthz policy delete policy1 --platform=gke --project=my_proj
    flag:
        platform: |-
            The platform that the policy belongs to. PLATFORM must be one of the following: cloudRun, gke.
            +
            To set the `platform` attribute:
            * provide the argument `policy_resource_name` on the command line with a fully specified name;
            * provide the argument `--platform` on the command line.
