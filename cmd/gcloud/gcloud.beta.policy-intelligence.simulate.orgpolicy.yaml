name: orgpolicy
description: '*(BETA)*  Understand how changes to organization policies could affect your       resources.'
flags:
    --custom-constraints=: Path to the JSON or YAML file that contains the custom constraints
    --organization=!: Organization ID.
    --policies=: Path to the JSON or YAML file that contains the organization
documentation:
    command: |
        *(BETA)*  Understand how changes to organization policies could affect your
        resources.
    flag:
        custom-constraints: |-
            Path to the JSON or YAML file that contains the custom constraints
                  to simulate. Multiple custom constraints can be simulated by providing
                  multiple, comma-separated paths. For example:
                  `--custom-constraints=constraint1.json,constraint2.json`
        organization: Organization ID.
        policies: |-
            Path to the JSON or YAML file that contains the organization
                  policy to simulate. Multiple policies can be simulated by providing
                  multiple, comma-separated paths. For example: `--policies=p1.json,p2.json`
