name: list-tags-for-resource
description: Lists the tags of a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
documentation:
    command: Lists the tags of a resource. The caller account must be the same as the resource’s `OwnerAccountId`. Listing tags in other accounts is not supported.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource.
