name: cancel-command
description: Attempts to cancel the command specified by the Command ID.
flags:
    --command-id=!: The ID of the command you want to cancel.
    --instance-ids=: (Optional) A list of managed node IDs on which you want to cancel the command.
documentation:
    command: Attempts to cancel the command specified by the Command ID. There is no guarantee that the command will be terminated and the underlying process stopped.
    flag:
        command-id: The ID of the command you want to cancel.
        instance-ids: (Optional) A list of managed node IDs on which you want to cancel the command. If not provided, the command is canceled on every node on which it was requested.
