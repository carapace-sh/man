documentation:
    command: |
        *(ALPHA)*  Create PrincipalAccessBoundaryPolicy instance.
    flag:
        annotations: |-
            User defined annotations. See https://google.aip.dev/148#annotations for
            more details such as format and size limitations.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --annotations=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --annotations='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --annotations=path_to_file.(yaml|json)
            +
            ```
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        details-enforcement-version: |-
            The version number (for example, `1` or `latest`) that indicates which
            permissions are able to be blocked by the policy. If empty, the PAB policy
            version will be set to the most recent version number at the time of the
            policy's creation.
        details-rules: |-
            Required, A list of principal access boundary policy rules. The number of rules in a
            policy is limited to 500.
            +
            *description*:::
            The description of the principal access boundary policy rule. Must be less
            than or equal to 256 characters.
            +
            *effect*:::
            The access relationship of principals to the resources in this rule.
            +
            *resources*:::
            A list of Resource Manager resources. If a resource is listed in the rule,
            then the rule applies for that resource and its descendants. The number of
            resources in a policy is limited to 500 across all rules in the policy.
            +
            The following resource types are supported:
            +
            * Organizations, such as
            `//cloudresourcemanager.googleapis.com/organizations/123`.
            * Folders, such as `//cloudresourcemanager.googleapis.com/folders/123`.
            * Projects, such as `//cloudresourcemanager.googleapis.com/projects/123`
              or `//cloudresourcemanager.googleapis.com/projects/my-project-id`.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --details-rules=description=string,effect=string,resources=[string] --details-rules=description=string,effect=string,resources=[string]
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --details-rules='[{"description": "string", "effect": "string", "resources": ["string"]}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --details-rules=path_to_file.(yaml|json)
            +
            ```
        display-name: |-
            The description of the principal access boundary policy. Must be less than
            or equal to 63 characters.
        etag: |-
            The etag for the principal access boundary.
            If this is provided on update, it must match the server's etag.
        location: |-
            The location id of the principalAccessBoundaryPolicy resource.
            +
            To set the `location` attribute:
            * provide the argument `principal_access_boundary_policy` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            The organization id of the principalAccessBoundaryPolicy resource.
            +
            To set the `organization` attribute:
            * provide the argument `principal_access_boundary_policy` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
