name: delete-partition
description: Deletes a specified partition.
flags:
    --catalog-id=: The ID of the Data Catalog where the partition to be deleted resides.
    --database-name=!: The name of the catalog database in which the table in question resides.
    --partition-values=!: The values that define the partition.
    --table-name=!: The name of the table that contains the partition to be deleted.
documentation:
    command: Deletes a specified partition.
    flag:
        catalog-id: The ID of the Data Catalog where the partition to be deleted resides. If none is provided, the Amazon Web Services account ID is used by default.
        database-name: The name of the catalog database in which the table in question resides.
        partition-values: The values that define the partition.
        table-name: The name of the table that contains the partition to be deleted.
