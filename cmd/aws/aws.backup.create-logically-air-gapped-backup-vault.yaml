name: create-logically-air-gapped-backup-vault
description: Creates a logical container to where backups may be copied.
flags:
    --backup-vault-name=!: The name of a logical container where backups are stored.
    --backup-vault-tags=: The tags to assign to the vault.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creator-request-id=: The ID of the creation request.
    --encryption-key-arn=: The ARN of the customer-managed KMS key to use for encrypting the logically air-gapped backup vault.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-retention-days=!: The maximum retention period that the vault retains its recovery points.
    --min-retention-days=!: This setting specifies the minimum retention period that the vault retains its recovery points.
documentation:
    command: |-
        Creates a logical container to where backups may be copied.

        This request includes a name, the Region, the maximum number of retention days, the minimum number of retention days, and optionally can include tags and a creator request ID.

        Do not include sensitive data, such as passport numbers, in the name of a backup vault.
    flag:
        backup-vault-name: The name of a logical container where backups are stored. Logically air-gapped backup vaults are identified by names that are unique to the account used to create them and the Region where they are created.
        backup-vault-tags: The tags to assign to the vault.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        creator-request-id: |-
            The ID of the creation request.

            This parameter is optional. If used, this parameter must contain 1 to 50 alphanumeric or '-\_.' characters.
        encryption-key-arn: The ARN of the customer-managed KMS key to use for encrypting the logically air-gapped backup vault. If not specified, the vault will be encrypted with an Amazon Web Services-owned key managed by Amazon Web Services Backup.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-retention-days: The maximum retention period that the vault retains its recovery points.
        min-retention-days: |-
            This setting specifies the minimum retention period that the vault retains its recovery points.

            The minimum value accepted is 7 days.
