name: list-model-package-groups
description: Gets a list of the model groups in your Amazon Web Services account.
flags:
    --creation-time-after=: A filter that returns only model groups created after the specified time.
    --creation-time-before=: A filter that returns only model groups created before the specified time.
    --cross-account-filter-option=: A filter that returns either model groups shared with you or model groups in your own account.
    --max-results=: The maximum number of results to return in the response.
    --name-contains=: A string in the model group name.
    --next-token=: If the result of the previous `ListModelPackageGroups` request was truncated, the response includes a `NextToken`.
    --sort-by=: The field to sort results by.
    --sort-order=: The sort order for results.
completion:
    flag:
        cross-account-filter-option:
            - SameAccount
            - CrossAccount
        sort-by:
            - Name
            - CreationTime
        sort-order:
            - Ascending
            - Descending
documentation:
    command: Gets a list of the model groups in your Amazon Web Services account.
    flag:
        creation-time-after: A filter that returns only model groups created after the specified time.
        creation-time-before: A filter that returns only model groups created before the specified time.
        cross-account-filter-option: A filter that returns either model groups shared with you or model groups in your own account. When the value is `CrossAccount`, the results show the resources made discoverable to you from other accounts. When the value is `SameAccount` or `null`, the results show resources from your account. The default is `SameAccount`.
        max-results: The maximum number of results to return in the response.
        name-contains: A string in the model group name. This filter returns only model groups whose name contains the specified string.
        next-token: If the result of the previous `ListModelPackageGroups` request was truncated, the response includes a `NextToken`. To retrieve the next set of model groups, use the token in the next request.
        sort-by: The field to sort results by. The default is `CreationTime`.
        sort-order: The sort order for results. The default is `Ascending`.
