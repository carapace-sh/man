name: update-ec2-deep-inspection-configuration
description: Activates, deactivates Amazon Inspector deep inspection, or updates custom paths for your account.
flags:
    --activate-deep-inspection: Specify `TRUE` to activate Amazon Inspector deep inspection in your account, or `FALSE` to deactivate.
    --no-activate-deep-inspection: Specify `TRUE` to activate Amazon Inspector deep inspection in your account, or `FALSE` to deactivate.
    --package-paths=: The Amazon Inspector deep inspection custom paths you are adding for your account.
documentation:
    command: Activates, deactivates Amazon Inspector deep inspection, or updates custom paths for your account.
    flag:
        activate-deep-inspection: Specify `TRUE` to activate Amazon Inspector deep inspection in your account, or `FALSE` to deactivate. Member accounts in an organization cannot deactivate deep inspection, instead the delegated administrator for the organization can deactivate a member account using [BatchUpdateMemberEc2DeepInspectionStatus](https://docs.aws.amazon.com/inspector/v2/APIReference/API_BatchUpdateMemberEc2DeepInspectionStatus.html).
        package-paths: The Amazon Inspector deep inspection custom paths you are adding for your account.
