name: add-source-identifier-to-subscription
description: Adds a source identifier to an existing event notification subscription.
flags:
    --source-identifier=!: The identifier of the event source to be added.
    --subscription-name=!: The name of the event notification subscription you want to add a source identifier to.
documentation:
    command: Adds a source identifier to an existing event notification subscription.
    flag:
        source-identifier: |-
            The identifier of the event source to be added.

            Constraints:

            - If the source type is a DB instance, then a `DBInstanceIdentifier` must be supplied.
            - If the source type is a DB security group, a `DBSecurityGroupName` must be supplied.
            - If the source type is a DB parameter group, a `DBParameterGroupName` must be supplied.
            - If the source type is a DB snapshot, a `DBSnapshotIdentifier` must be supplied.
        subscription-name: The name of the event notification subscription you want to add a source identifier to.
