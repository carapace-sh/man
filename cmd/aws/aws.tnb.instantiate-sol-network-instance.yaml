name: instantiate-sol-network-instance
description: Instantiates a network instance.
flags:
    --additional-params-for-ns=: Provides values for the configurable properties.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --ns-instance-id=!: ID of the network instance.
    --tags=: A tag is a label that you assign to an Amazon Web Services resource.
documentation:
    command: |-
        Instantiates a network instance.

        A network instance is a single network created in Amazon Web Services TNB that can be deployed and on which life-cycle operations (like terminate, update, and delete) can be performed.

        Before you can instantiate a network instance, you have to create a network instance. For more information, see [CreateSolNetworkInstance](https://docs.aws.amazon.com/tnb/latest/APIReference/API_CreateSolNetworkInstance.html).
    flag:
        additional-params-for-ns: Provides values for the configurable properties.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ns-instance-id: ID of the network instance.
        tags: A tag is a label that you assign to an Amazon Web Services resource. Each tag consists of a key and an optional value. When you use this API, the tags are only applied to the network operation that is created. These tags are not applied to the network instance. Use tags to search and filter your resources or track your Amazon Web Services costs.
