name: update
description: '*(ALPHA)*  Updates the Fleet Observability Feature resource.'
flags:
    --logging-config=: Path of the YAML(or JSON) file that contains the logging configurations.
documentation:
    command: |-
        *(ALPHA)*  This command updates the Fleet Observability Feature in a fleet.

        ## EXAMPLES

        To describe the Fleet Observability Feature, run:

          $ gcloud alpha container fleet fleetobservability update --logging-config=LOGGING-CONFIG
    flag:
        logging-config: |-
            Path of the YAML(or JSON) file that contains the logging configurations.
            +
            The JSON file is formatted as follows, with camelCase field naming:
            +
            ```
            {
                "loggingConfig": {
                    "defaultConfig": {
                        "mode": "COPY"
                    },
                    "fleetScopeLogsConfig": {
                        "mode": "MOVE"
                    }
                }
            }
            ```
            +
            The YAML file is formatted as follows, with camelCase field naming:
            +
            ```
            ---
            loggingConfig:
              defaultConfig:
                mode: COPY
              fleetScopeLogsConfig:
                mode: MOVE
            ```
