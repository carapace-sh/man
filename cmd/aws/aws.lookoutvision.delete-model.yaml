name: delete-model
description: Deletes an Amazon Lookout for Vision model.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: ClientToken is an idempotency token that ensures a call to `DeleteModel` completes only once.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --model-version=!: The version of the model that you want to delete.
    --project-name=!: The name of the project that contains the model that you want to delete.
documentation:
    command: |-
        Deletes an Amazon Lookout for Vision model. You can't delete a running model. To stop a running model, use the [StopModel]() operation.

        It might take a few seconds to delete a model. To determine if a model has been deleted, call [ListModels]() and check if the version of the model (`ModelVersion`) is in the `Models` array.

        This operation requires permissions to perform the `lookoutvision:DeleteModel` operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            ClientToken is an idempotency token that ensures a call to `DeleteModel` completes only once. You choose the value to pass. For example, an issue might prevent you from getting a response from `DeleteModel`. In this case, safely retry your call to `DeleteModel` by using the same `ClientToken` parameter value.

            If you don't supply a value for ClientToken, the AWS SDK you are using inserts a value for you. This prevents retries after a network error from making multiple model deletion requests. You'll need to provide your own value for other use cases.

            An error occurs if the other input parameters are not the same as in the first request. Using a different value for `ClientToken` is considered a new call to `DeleteModel`. An idempotency token is active for 8 hours.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        model-version: The version of the model that you want to delete.
        project-name: The name of the project that contains the model that you want to delete.
