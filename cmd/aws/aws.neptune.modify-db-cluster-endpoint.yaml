name: modify-db-cluster-endpoint
description: Modifies the properties of an endpoint in an Amazon Neptune DB cluster.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-cluster-endpoint-identifier=!: The identifier of the endpoint to modify.
    --endpoint-type=: The type of the endpoint.
    --excluded-members=: List of DB instance identifiers that aren't part of the custom endpoint group.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --static-members=: List of DB instance identifiers that are part of the custom endpoint group.
documentation:
    command: Modifies the properties of an endpoint in an Amazon Neptune DB cluster.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-cluster-endpoint-identifier: The identifier of the endpoint to modify. This parameter is stored as a lowercase string.
        endpoint-type: 'The type of the endpoint. One of: `READER`, `WRITER`, `ANY`.'
        excluded-members: List of DB instance identifiers that aren't part of the custom endpoint group. All other eligible instances are reachable through the custom endpoint. Only relevant if the list of static members is empty.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        static-members: List of DB instance identifiers that are part of the custom endpoint group.
