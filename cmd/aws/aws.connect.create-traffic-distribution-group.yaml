name: create-traffic-distribution-group
description: Creates a traffic distribution group given an Amazon Connect instance that has been replicated.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=: A description for the traffic distribution group.
    --instance-id=!: The identifier of the Amazon Connect instance that has been replicated.
    --name=!: The name for the traffic distribution group.
    --tags=: The tags used to organize, track, or control access for this resource.
documentation:
    command: |-
        Creates a traffic distribution group given an Amazon Connect instance that has been replicated.

        The `SignInConfig` distribution is available only on a default `TrafficDistributionGroup` (see the `IsDefault` parameter in the [TrafficDistributionGroup](https://docs.aws.amazon.com/connect/latest/APIReference/API_TrafficDistributionGroup.html) data type). If you call `UpdateTrafficDistribution` with a modified `SignInConfig` and a non-default `TrafficDistributionGroup`, an `InvalidRequestException` is returned.

        For more information about creating traffic distribution groups, see [Set up traffic distribution groups](https://docs.aws.amazon.com/connect/latest/adminguide/setup-traffic-distribution-groups.html) in the *Amazon Connect Administrator Guide*.
    flag:
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        description: A description for the traffic distribution group.
        instance-id: The identifier of the Amazon Connect instance that has been replicated. You can find the `instanceId` in the ARN of the instance.
        name: The name for the traffic distribution group.
        tags: 'The tags used to organize, track, or control access for this resource. For example, { "Tags": {"key1":"value1", "key2":"value2"} }.'
