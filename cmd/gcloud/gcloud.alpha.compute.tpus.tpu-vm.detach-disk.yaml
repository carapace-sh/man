name: detach-disk
description: '*(ALPHA)*  Detach a disk from an instance.'
flags:
    --disk=!: Name of the disk to detach from the TPU VM.
    --zone=: The Cloud zone for the TPU.
documentation:
    command: |+
        *(ALPHA)*  *gcloud alpha compute tpus tpu-vm detach-disk* is used to detach a disk from a TPU VM. For example,

          $ gcloud compute tpus tpu-vm detach-disk example-tpu --disk=example-disk --zone=us-central1-a

        detaches the disk named `example-disk` from the TPU VM named
        `example-tpu` in zone ``us-central1-a''.

    flag:
        disk: Name of the disk to detach from the TPU VM.
        zone: |-
            The Cloud zone for the TPU.
            +
            To set the `zone` attribute:
            * provide the argument `tpu` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
