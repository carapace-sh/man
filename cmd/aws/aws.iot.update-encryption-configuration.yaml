name: update-encryption-configuration
description: Updates the encryption configuration.
flags:
    --encryption-type=!: The type of the Amazon Web Services Key Management Service (KMS) key.
    --kms-access-role-arn=: The Amazon Resource Name (ARN) of the IAM role assumed by Amazon Web Services IoT Core to call KMS on behalf of the customer.
    --kms-key-arn=: The ARN of the customer-managed KMS key.
completion:
    flag:
        encryption-type:
            - CUSTOMER_MANAGED_KMS_KEY
            - AWS_OWNED_KMS_KEY
documentation:
    command: Updates the encryption configuration. By default, all Amazon Web Services IoT Core data at rest is encrypted using Amazon Web Services owned keys. Amazon Web Services IoT Core also supports symmetric customer managed keys from Amazon Web Services Key Management Service (KMS). With customer managed keys, you create, own, and manage the KMS keys in your Amazon Web Services account. For more information, see [Data encryption](https://docs.aws.amazon.com/iot/latest/developerguide/data-encryption.html) in the *Amazon Web Services IoT Core Developer Guide*.
    flag:
        encryption-type: The type of the Amazon Web Services Key Management Service (KMS) key.
        kms-access-role-arn: The Amazon Resource Name (ARN) of the IAM role assumed by Amazon Web Services IoT Core to call KMS on behalf of the customer.
        kms-key-arn: The ARN of the customer-managed KMS key.
