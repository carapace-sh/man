name: create-api-key
description: Create an ApiKey resource.
flags:
    --customer-id=: An Amazon Web Services Marketplace customer identifier, when integrating with the Amazon Web Services SaaS Marketplace.
    --description=: The description of the ApiKey.
    --enabled: Specifies whether the ApiKey can be used by callers.
    --generate-distinct-id: Specifies whether (`true`) or not (`false`) the key identifier is distinct from the created API key value.
    --name=: The name of the ApiKey.
    --no-enabled&: Specifies whether the ApiKey can be used by callers.
    --no-generate-distinct-id&: Specifies whether (`true`) or not (`false`) the key identifier is distinct from the created API key value.
    --stage-keys=: DEPRECATED FOR USAGE PLANS - Specifies stages associated with the API key.
    --tags=: The key-value map of strings.
    --value=: Specifies a value of the API key.
documentation:
    command: Create an ApiKey resource.
    flag:
        customer-id: An Amazon Web Services Marketplace customer identifier, when integrating with the Amazon Web Services SaaS Marketplace.
        description: The description of the ApiKey.
        enabled: Specifies whether the ApiKey can be used by callers.
        generate-distinct-id: Specifies whether (`true`) or not (`false`) the key identifier is distinct from the created API key value. This parameter is deprecated and should not be used.
        name: The name of the ApiKey.
        stage-keys: DEPRECATED FOR USAGE PLANS - Specifies stages associated with the API key.
        tags: The key-value map of strings. The valid character set is \[a-zA-Z+-=.\_:/]. The tag key can be up to 128 characters and must not start with `aws:`. The tag value can be up to 256 characters.
        value: Specifies a value of the API key.
