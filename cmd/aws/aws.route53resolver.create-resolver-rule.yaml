name: create-resolver-rule
description: For DNS queries that originate in your VPCs, specifies which Resolver endpoint the queries pass through, one domain name that you want to forward to your network, and the IP addresses of the DNS resolvers in your network.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creator-request-id=!: A unique string that identifies the request and that allows failed requests to be retried without the risk of running the operation twice.
    --delegation-record=: DNS queries with the delegation records that match this domain name are forwarded to the resolvers on your network.
    --domain-name=: DNS queries for this domain name are forwarded to the IP addresses that you specify in `TargetIps`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: A friendly name that lets you easily find a rule in the Resolver dashboard in the Route 53 console.
    --resolver-endpoint-id=: The ID of the outbound Resolver endpoint that you want to use to route DNS queries to the IP addresses that you specify in `TargetIps`.
    --rule-type=!: When you want to forward DNS queries for specified domain name to resolvers on your network, specify `FORWARD` or `DELEGATE`.
    --tags=:
        description: A list of the tag keys and values that you want to associate with the endpoint.
        nargs: -1
    --target-ips=:
        description: The IPs that you want Resolver to forward DNS queries to.
        nargs: -1
completion:
    flag:
        rule-type:
            - FORWARD
            - SYSTEM
            - RECURSIVE
            - DELEGATE
documentation:
    command: For DNS queries that originate in your VPCs, specifies which Resolver endpoint the queries pass through, one domain name that you want to forward to your network, and the IP addresses of the DNS resolvers in your network.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        creator-request-id: A unique string that identifies the request and that allows failed requests to be retried without the risk of running the operation twice. `CreatorRequestId` can be any unique string, for example, a date/time stamp.
        delegation-record: DNS queries with the delegation records that match this domain name are forwarded to the resolvers on your network.
        domain-name: DNS queries for this domain name are forwarded to the IP addresses that you specify in `TargetIps`. If a query matches multiple Resolver rules (example.com and www.example.com), outbound DNS queries are routed using the Resolver rule that contains the most specific domain name (www.example.com).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A friendly name that lets you easily find a rule in the Resolver dashboard in the Route 53 console.
        resolver-endpoint-id: The ID of the outbound Resolver endpoint that you want to use to route DNS queries to the IP addresses that you specify in `TargetIps`.
        rule-type: |-
            When you want to forward DNS queries for specified domain name to resolvers on your network, specify `FORWARD` or `DELEGATE`.

            When you have a forwarding rule to forward DNS queries for a domain to your network and you want Resolver to process queries for a subdomain of that domain, specify `SYSTEM`.

            For example, to forward DNS queries for example.com to resolvers on your network, you create a rule and specify `FORWARD` for `RuleType`. To then have Resolver process queries for apex.example.com, you create a rule and specify `SYSTEM` for `RuleType`.

            Currently, only Resolver can create rules that have a value of `RECURSIVE` for `RuleType`.
        tags: A list of the tag keys and values that you want to associate with the endpoint.
        target-ips: |-
            The IPs that you want Resolver to forward DNS queries to. You can specify either Ipv4 or Ipv6 addresses but not both in the same rule. Separate IP addresses with a space.

            `TargetIps` is available only when the value of `Rule type` is `FORWARD`.
