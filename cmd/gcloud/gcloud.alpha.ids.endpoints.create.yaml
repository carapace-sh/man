name: create
description: '*(ALPHA)*  Create a Cloud IDS endpoint.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the endpoint.
    --enable-traffic-logs: Whether to enable traffic logs on the endpoint.
    --labels=: List of label KEY=VALUE pairs to add.
    --max-wait=: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously.
    --network=!: Name of the VPC network to monitor
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-traffic-logs&: Whether to enable traffic logs on the endpoint.
    --severity=!: Minimum severity of threats to report on.
    --threat-exceptions=: List of threat IDs to be excepted from alerting.
    --zone=: Zone of the endpoint.
completion:
    flag:
        severity:
            - INFORMATIONAL
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
documentation:
    command: |+
        *(ALPHA)*  Create an endpoint for the specified VPC network. Successful creation
        of an endpoint results in an endpoint in READY state. Check the
        progress of endpoint creation by using `gcloud alpha ids endpoints
        list`.

        For more examples, refer to the EXAMPLES section below.


    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        description: Description of the endpoint.
        enable-traffic-logs: Whether to enable traffic logs on the endpoint. Enabling traffic logs can generate a large number of logs which can increase costs in Cloud Logging.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        max-wait: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously. Ignored if --no-async isn't specified. See $ gcloud topic datetimes for information on time formats.
        network: Name of the VPC network to monitor
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-traffic-logs: Whether to enable traffic logs on the endpoint. Enabling traffic logs can generate a large number of logs which can increase costs in Cloud Logging.
        severity: 'Minimum severity of threats to report on. _SEVERITY_ must be one of: *INFORMATIONAL*, *LOW*, *MEDIUM*, *HIGH*, *CRITICAL*.'
        threat-exceptions: List of threat IDs to be excepted from alerting. Passing empty list clears the exceptions.
        zone: |-
            Zone of the endpoint.
            +
            To set the `zone` attribute:
            * provide the argument `endpoint` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
