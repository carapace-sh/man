name: create
description: '*(ALPHA)*  Create a new Cloud Media Asset asset.'
hidden: true
flags:
    --asset-config-file=: File path to an asset content file in JSON format.
    --asset-type=: Google Cloud Media Asset asset type.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Google Cloud location.
documentation:
    command: '*(ALPHA)*  Create a new Media Asset asset.'
    flag:
        asset-config-file: File path to an asset content file in JSON format. Use a full or relative path to a local file containing the value of asset_config_file.
        asset-type: |-
            Google Cloud Media Asset asset type.
            +
            To set the `asset_type` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--asset_type` on the command line.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `media_asset/location`.
