name: reject-engagement-invitation
description: This action rejects an `EngagementInvitation` that AWS shared.
flags:
    --catalog=!: This is the catalog that's associated with the engagement invitation.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identifier=!: This is the unique identifier of the rejected `EngagementInvitation`.
    --rejection-reason=: This describes the reason for rejecting the engagement invitation, which helps AWS track usage patterns.
documentation:
    command: This action rejects an `EngagementInvitation` that AWS shared. Rejecting an invitation indicates that the partner doesn't want to pursue the opportunity, and all related data will become inaccessible thereafter.
    flag:
        catalog: This is the catalog that's associated with the engagement invitation. Acceptable values are `AWS` or `Sandbox`, and these values determine the environment in which the opportunity is managed.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identifier: This is the unique identifier of the rejected `EngagementInvitation`. Providing the correct identifier helps to ensure that the intended invitation is rejected.
        rejection-reason: |-
            This describes the reason for rejecting the engagement invitation, which helps AWS track usage patterns. Acceptable values include the following:

            - *Customer problem unclear:* The customer's problem isn't understood.
            - *Next steps unclear:* The next steps required to proceed aren't understood.
            - *Unable to support:* The partner is unable to provide support due to resource or capability constraints.
            - *Duplicate of partner referral:* The opportunity is a duplicate of an existing referral.
            - *Other:* Any reason not covered by other values.
