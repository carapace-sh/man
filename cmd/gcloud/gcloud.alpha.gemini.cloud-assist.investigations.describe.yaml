name: describe
description: '*(ALPHA)*  Show metadata for an investigation.'
hidden: true
flags:
    --detail: Include extra information in the default output.
    --no-detail&: Include extra information in the default output.
    --no-raw&: Return the full, unaltered API response instead of the version formatted for human consumption.
    --raw: Return the full, unaltered API response instead of the version formatted for human consumption.
documentation:
    command: |-
        *(ALPHA)*  Shows metadata for an investigation given a valid investigation ID.

        This command can fail for the following reasons:
        * The investigation specified does not exist.
        * The active account does not have permission to access the given
        investigation.

        ## EXAMPLES

        The following command prints metadata for an investigation with the ID
        `example-foo-bar-1`:

          $ gcloud alpha gemini cloud-assist investigations describe example-foo-bar-1
    flag:
        detail: Include extra information in the default output.
        no-detail: Include extra information in the default output.
        no-raw: Return the full, unaltered API response instead of the version formatted for human consumption.
        raw: Return the full, unaltered API response instead of the version formatted for human consumption.
