name: purchase-scheduled-instances
description: You can no longer purchase Scheduled Instances.
flags:
    --client-token=: Unique, case-sensitive identifier that ensures the idempotency of the request.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --purchase-requests=!: The purchase requests.
documentation:
    command: |-
        You can no longer purchase Scheduled Instances.

        Purchases the Scheduled Instances with the specified schedule.

        Scheduled Instances enable you to purchase Amazon EC2 compute capacity by the hour for a one-year term. Before you can purchase a Scheduled Instance, you must call [DescribeScheduledInstanceAvailability]() to check for available schedules and obtain a purchase token. After you purchase a Scheduled Instance, you must call [RunScheduledInstances]() during each scheduled time period.

        After you purchase a Scheduled Instance, you can't cancel, modify, or resell your purchase.
    flag:
        client-token: Unique, case-sensitive identifier that ensures the idempotency of the request. For more information, see [Ensuring Idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        purchase-requests: The purchase requests.
