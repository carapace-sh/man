name: register-workspace-directory
description: Registers the specified directory.
flags:
    --active-directory-config=: The active directory config of the directory.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --directory-id=: The identifier of the directory.
    --enable-self-service: Indicates whether self-service capabilities are enabled or disabled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --idc-instance-arn=: The Amazon Resource Name (ARN) of the identity center instance.
    --microsoft-entra-config=: The details about Microsoft Entra config.
    --no-enable-self-service: Indicates whether self-service capabilities are enabled or disabled.
    --subnet-ids=: The identifiers of the subnets for your virtual private cloud (VPC).
    --tags=: The tags associated with the directory.
    --tenancy=: Indicates whether your WorkSpace directory is dedicated or shared.
    --user-identity-type=: The type of identity management the user is using.
    --workspace-directory-description=: Description of the directory to register.
    --workspace-directory-name=: The name of the directory to register.
    --workspace-type=: Indicates whether the directory's WorkSpace type is personal or pools.
completion:
    flag:
        tenancy:
            - DEDICATED
            - SHARED
        user-identity-type:
            - CUSTOMER_MANAGED
            - AWS_DIRECTORY_SERVICE
            - AWS_IAM_IDENTITY_CENTER
        workspace-type:
            - PERSONAL
            - POOLS
documentation:
    command: Registers the specified directory. This operation is asynchronous and returns before the WorkSpace directory is registered. If this is the first time you are registering a directory, you will need to create the workspaces\_DefaultRole role before you can register a directory. For more information, see [Creating the workspaces\_DefaultRole Role](https://docs.aws.amazon.com/workspaces/latest/adminguide/workspaces-access-control.html#create-default-role).
    flag:
        active-directory-config: The active directory config of the directory.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        directory-id: The identifier of the directory. You cannot register a directory if it does not have a status of Active. If the directory does not have a status of Active, you will receive an InvalidResourceStateException error. If you have already registered the maximum number of directories that you can register with Amazon WorkSpaces, you will receive a ResourceLimitExceededException error. Deregister directories that you are not using for WorkSpaces, and try again.
        enable-self-service: Indicates whether self-service capabilities are enabled or disabled.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        idc-instance-arn: The Amazon Resource Name (ARN) of the identity center instance.
        microsoft-entra-config: The details about Microsoft Entra config.
        subnet-ids: The identifiers of the subnets for your virtual private cloud (VPC). Make sure that the subnets are in supported Availability Zones. The subnets must also be in separate Availability Zones. If these conditions are not met, you will receive an OperationNotSupportedException error.
        tags: The tags associated with the directory.
        tenancy: Indicates whether your WorkSpace directory is dedicated or shared. To use Bring Your Own License (BYOL) images, this value must be set to `DEDICATED` and your Amazon Web Services account must be enabled for BYOL. If your account has not been enabled for BYOL, you will receive an InvalidParameterValuesException error. For more information about BYOL images, see [Bring Your Own Windows Desktop Images](https://docs.aws.amazon.com/workspaces/latest/adminguide/byol-windows-images.html).
        user-identity-type: The type of identity management the user is using.
        workspace-directory-description: Description of the directory to register.
        workspace-directory-name: The name of the directory to register.
        workspace-type: Indicates whether the directory's WorkSpace type is personal or pools.
