name: activate-pipeline
description: Validates the specified pipeline and starts processing pipeline tasks.
flags:
    --parameter-values=: A list of parameter values to pass to the pipeline at activation.
    --pipeline-id=!: The ID of the pipeline.
    --start-timestamp=: The date and time to resume the pipeline.
documentation:
    command: |-
        Validates the specified pipeline and starts processing pipeline tasks. If the pipeline does not pass validation, activation fails.

        If you need to pause the pipeline to investigate an issue with a component, such as a data source or script, call [DeactivatePipeline]().

        To activate a finished pipeline, modify the end date for the pipeline and then activate it.
    flag:
        parameter-values: A list of parameter values to pass to the pipeline at activation.
        pipeline-id: The ID of the pipeline.
        start-timestamp: The date and time to resume the pipeline. By default, the pipeline resumes from the last completed execution.
