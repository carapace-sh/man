name: list-object-parents
description: Lists parent objects that are associated with a given object in pagination fashion.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --consistency-level=: Represents the manner and timing in which the successful write or update of an object is reflected in a subsequent read operation of that same object.
    --directory-arn=!: The Amazon Resource Name (ARN) that is associated with the [Directory]() where the object resides.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-all-links-to-each-parent: When set to True, returns all [ListObjectParentsResponse$ParentLinks]().
    --max-results=: The maximum number of items to be retrieved in a single call.
    --next-token=: The pagination token.
    --no-include-all-links-to-each-parent: When set to True, returns all [ListObjectParentsResponse$ParentLinks]().
    --object-reference=!: The reference that identifies the object for which parent objects are being listed.
completion:
    flag:
        consistency-level:
            - SERIALIZABLE
            - EVENTUAL
documentation:
    command: Lists parent objects that are associated with a given object in pagination fashion.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        consistency-level: Represents the manner and timing in which the successful write or update of an object is reflected in a subsequent read operation of that same object.
        directory-arn: The Amazon Resource Name (ARN) that is associated with the [Directory]() where the object resides. For more information, see [arns]().
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-all-links-to-each-parent: When set to True, returns all [ListObjectParentsResponse$ParentLinks](). There could be multiple links between a parent-child pair.
        max-results: The maximum number of items to be retrieved in a single call. This is an approximate number.
        next-token: The pagination token.
        object-reference: The reference that identifies the object for which parent objects are being listed.
