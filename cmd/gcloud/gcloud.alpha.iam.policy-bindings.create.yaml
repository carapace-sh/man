name: create
description: '*(ALPHA)*  Create PolicyBinding instance.'
hidden: true
flags:
    --annotations=: User-defined annotations.
    --async: Return immediately, without waiting for the operation in progress to
    --condition-description=: Description of the expression.
    --condition-expression=: Textual representation of an expression in Common Expression Language
    --condition-location=: String indicating the location of the expression for error
    --condition-title=: Title for the expression, i.e. a short string describing
    --display-name=: The description of the policy binding.
    --etag=: The etag for the policy binding.
    --folder=: The folder id of the policyBinding resource.
    --location=: The location id of the policyBinding resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: The organization id of the policyBinding resource.
    --policy-kind=: The kind of the policy to attach in this binding.
    --policy=!: The resource name of the policy to be bound.
    --target-principal-set=: Full Resource Name used for principal access boundary policy bindings.
    --target-resource=: Full Resource Name used for access policy bindings
completion:
    flag:
        policy-kind:
            - access
            - principal-access-boundary
documentation:
    command: |
        *(ALPHA)*  Create PolicyBinding instance.
    flag:
        annotations: |-
            User-defined annotations. See https://google.aip.dev/148#annotations for
            more details such as format and size limitations.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --annotations=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --annotations='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --annotations=path_to_file.(yaml|json)
            +
            ```
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        condition-description: |-
            Description of the expression. This is a longer text which
            describes the expression, e.g. when hovered over it in a UI.
        condition-expression: |-
            Textual representation of an expression in Common Expression Language
            syntax.
        condition-location: |-
            String indicating the location of the expression for error
            reporting, e.g. a file name and a position in the file.
        condition-title: |-
            Title for the expression, i.e. a short string describing
            its purpose. This can be used e.g. in UIs which allow to enter the
            expression.
        display-name: |-
            The description of the policy binding. Must be less than or equal to 63
            characters.
        etag: |-
            The etag for the policy binding.
            If this is provided on update, it must match the server's etag.
        folder: |-
            The folder id of the policyBinding resource.
            +
            To set the `folder` attribute:
            * provide the argument `policy_binding` on the command line with a fully specified name;
            * provide the argument `--folder` on the command line. Must be specified for resource of type [iam.folders.locations.policyBindings].
        location: |-
            The location id of the policyBinding resource.
            +
            To set the `location` attribute:
            * provide the argument `policy_binding` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            The organization id of the policyBinding resource.
            +
            To set the `organization` attribute:
            * provide the argument `policy_binding` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line. Must be specified for resource of type [iam.organizations.locations.policyBindings].
        policy: |-
            The resource name of the policy to be bound. The binding parent and policy
            must belong to the same organization.
        policy-kind: |-
            The kind of the policy to attach in this binding. This field must be one of
            the following:
            +
            - Left empty (will be automatically set to the policy kind)
            - The input policy kind.
            +
            _POLICY_KIND_ must be one of:
            +
            *access*::: Access policy kind. Keep behind visibility label until Access Policy
            launch.
            *principal-access-boundary*::: Principal access boundary policy kind
            :::
            +
        target-principal-set: |-
            Full Resource Name used for principal access boundary policy bindings.
            The principal set must be directly parented by the policy binding's
            parent or same as the parent if the target is a
            project/folder/organization.
            +
            Examples:
            * For binding's parented by an organization:
              * Organization:
              `//cloudresourcemanager.googleapis.com/organizations/ORGANIZATION_ID`
              * Workforce Identity:
              `//iam.googleapis.com/locations/global/workforcePools/WORKFORCE_POOL_ID`
              * Workspace Identity:
              `//iam.googleapis.com/locations/global/workspace/WORKSPACE_ID`
            * For binding's parented by a folder:
              * Folder:
              `//cloudresourcemanager.googleapis.com/folders/FOLDER_ID`
            * For binding's parented by a project:
              * Project:
                * `//cloudresourcemanager.googleapis.com/projects/PROJECT_NUMBER`
                * `//cloudresourcemanager.googleapis.com/projects/PROJECT_ID`
              * Workload Identity Pool:
              `//iam.googleapis.com/projects/PROJECT_NUMBER/locations/LOCATION/workloadIdentityPools/WORKLOAD_POOL_ID`
        target-resource: |-
            Full Resource Name used for access policy bindings
            Examples:
            +
            * Organization:
            `//cloudresourcemanager.googleapis.com/organizations/ORGANIZATION_ID`
            * Folder: `//cloudresourcemanager.googleapis.com/folders/FOLDER_ID`
            * Project:
                * `//cloudresourcemanager.googleapis.com/projects/PROJECT_NUMBER`
                * `//cloudresourcemanager.googleapis.com/projects/PROJECT_ID`
