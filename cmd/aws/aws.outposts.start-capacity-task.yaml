name: start-capacity-task
description: Starts the specified capacity task.
flags:
    --asset-id=: The ID of the Outpost asset.
    --dry-run=: You can request a dry run to determine if the instance type and instance size changes is above or below available instance capacity.
    --instance-pools=!: The instance pools specified in the capacity task.
    --instances-to-exclude=: List of user-specified running instances that must not be stopped in order to free up the capacity needed to run the capacity task.
    --order-id=: The ID of the Amazon Web Services Outposts order associated with the specified capacity task.
    --outpost-identifier=!: The ID or ARN of the Outposts associated with the specified capacity task.
    --task-action-on-blocking-instances=: Specify one of the following options in case an instance is blocking the capacity task from running.
completion:
    flag:
        task-action-on-blocking-instances:
            - WAIT_FOR_EVACUATION
            - FAIL_TASK
documentation:
    command: Starts the specified capacity task. You can have one active capacity task for each order and each Outpost.
    flag:
        asset-id: The ID of the Outpost asset. An Outpost asset can be a single server within an Outposts rack or an Outposts server configuration.
        dry-run: You can request a dry run to determine if the instance type and instance size changes is above or below available instance capacity. Requesting a dry run does not make any changes to your plan.
        instance-pools: The instance pools specified in the capacity task.
        instances-to-exclude: List of user-specified running instances that must not be stopped in order to free up the capacity needed to run the capacity task.
        order-id: The ID of the Amazon Web Services Outposts order associated with the specified capacity task.
        outpost-identifier: The ID or ARN of the Outposts associated with the specified capacity task.
        task-action-on-blocking-instances: |-
            Specify one of the following options in case an instance is blocking the capacity task from running.

            - `WAIT_FOR_EVACUATION` - Checks every 10 minutes over 48 hours to determine if instances have stopped and capacity is available to complete the task.
            - `FAIL_TASK` - The capacity task fails.
