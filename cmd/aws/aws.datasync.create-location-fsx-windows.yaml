name: create-location-fsx-windows
description: Creates a transfer *location* for an Amazon FSx for Windows File Server file system.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain=: Specifies the name of the Windows domain that the FSx for Windows File Server file system belongs to.
    --fsx-filesystem-arn=!: Specifies the Amazon Resource Name (ARN) for the FSx for Windows File Server file system.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --password=!: Specifies the password of the user with the permissions to mount and access the files, folders, and file metadata in your FSx for Windows File Server file system.
    --security-group-arns=!: Specifies the ARNs of the Amazon EC2 security groups that provide access to your file system's preferred subnet.
    --subdirectory=: Specifies a mount path for your file system using forward slashes.
    --tags=: Specifies labels that help you categorize, filter, and search for your Amazon Web Services resources.
    --user=!: Specifies the user with the permissions to mount and access the files, folders, and file metadata in your FSx for Windows File Server file system.
documentation:
    command: |-
        Creates a transfer *location* for an Amazon FSx for Windows File Server file system. DataSync can use this location as a source or destination for transferring data.

        Before you begin, make sure that you understand how DataSync [accesses FSx for Windows File Server file systems](https://docs.aws.amazon.com/datasync/latest/userguide/create-fsx-location.html#create-fsx-location-access).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain: |-
            Specifies the name of the Windows domain that the FSx for Windows File Server file system belongs to.

            If you have multiple Active Directory domains in your environment, configuring this parameter makes sure that DataSync connects to the right file system.
        fsx-filesystem-arn: Specifies the Amazon Resource Name (ARN) for the FSx for Windows File Server file system.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        password: Specifies the password of the user with the permissions to mount and access the files, folders, and file metadata in your FSx for Windows File Server file system.
        security-group-arns: |-
            Specifies the ARNs of the Amazon EC2 security groups that provide access to your file system's preferred subnet.

            The security groups that you specify must be able to communicate with your file system's security groups. For information about configuring security groups for file system access, see the [*Amazon FSx for Windows File Server User Guide*](https://docs.aws.amazon.com/fsx/latest/WindowsGuide/limit-access-security-groups.html) .

            If you choose a security group that doesn't allow connections from within itself, do one of the following:

            - Configure the security group to allow it to communicate within itself.
            - Choose a different security group that can communicate with the mount target's security group.
        subdirectory: Specifies a mount path for your file system using forward slashes. This is where DataSync reads or writes data (depending on if this is a source or destination location).
        tags: Specifies labels that help you categorize, filter, and search for your Amazon Web Services resources. We recommend creating at least a name tag for your location.
        user: |-
            Specifies the user with the permissions to mount and access the files, folders, and file metadata in your FSx for Windows File Server file system.

            For information about choosing a user with the right level of access for your transfer, see [required permissions](https://docs.aws.amazon.com/datasync/latest/userguide/create-fsx-location.html#create-fsx-windows-location-permissions) for FSx for Windows File Server locations.
