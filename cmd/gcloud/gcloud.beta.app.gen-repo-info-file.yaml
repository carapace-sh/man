name: gen-repo-info-file
description: '*(BETA)*  [DEPRECATED] Saves repository information in a file.'
hidden: true
flags:
    --output-directory=: The directory in which to create the source context file.
    --output-file=: (Deprecated; use --output-directory instead.)
    --source-directory=: The path to directory containing the source code for the build.
documentation:
    command: |
        *(BETA)*  DEPRECATED, use `gcloud beta debug source gen-repo-info-file`
        instead.

        This command generates a source-context.json file, containing information on the
        source revision and remote repository associated with the given
        source directory.

        source-context.json contains information on the remote repository: the associated
        Cloud Repository if there is one, or the remote Git repository if
        there is no Cloud Repository.
    flag:
        output-directory: The directory in which to create the source context file. Defaults to the current directory, or the directory containing --output-file if that option is provided with a file name that includes a directory path.
        output-file: (Deprecated; use --output-directory instead.) Specifies the full name of the output file to contain a single source context.  The file name must be "source-context.json" in order to work with cloud diagnostic tools.
        source-directory: The path to directory containing the source code for the build.
