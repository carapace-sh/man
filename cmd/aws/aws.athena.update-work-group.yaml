name: update-work-group
description: Updates the workgroup with the specified name.
flags:
    --configuration-updates=: Contains configuration updates for an Athena SQL workgroup.
    --description=: The workgroup description.
    --state=: The workgroup state that will be updated for the given workgroup.
    --work-group=!: The specified workgroup that will be updated.
completion:
    flag:
        state:
            - ENABLED
            - DISABLED
documentation:
    command: Updates the workgroup with the specified name. The workgroup's name cannot be changed. Only `ConfigurationUpdates` can be specified.
    flag:
        configuration-updates: Contains configuration updates for an Athena SQL workgroup.
        description: The workgroup description.
        state: The workgroup state that will be updated for the given workgroup.
        work-group: The specified workgroup that will be updated.
