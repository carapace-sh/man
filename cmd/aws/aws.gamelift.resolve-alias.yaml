name: resolve-alias
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Attempts to retrieve a fleet ID that is associated with an alias.
flags:
    --alias-id=!: The unique identifier of the alias that you want to retrieve a fleet ID for.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Attempts to retrieve a fleet ID that is associated with an alias. Specify a unique alias identifier.

        If the alias has a `SIMPLE` routing strategy, Amazon GameLift Servers returns a fleet ID. If the alias has a `TERMINAL` routing strategy, the result is a `TerminalRoutingStrategyException`.

        **Related actions**

        [All APIs by task](https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets)
    flag:
        alias-id: The unique identifier of the alias that you want to retrieve a fleet ID for. You can use either the alias ID or ARN value.
