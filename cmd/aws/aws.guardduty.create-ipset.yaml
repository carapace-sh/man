name: create-ipset
description: Creates a new IPSet, which is called a trusted IP list in the console user interface.
flags:
    --activate!: A Boolean value that indicates whether GuardDuty is to start using the uploaded IPSet.
    --client-token=: The idempotency token for the create request.
    --detector-id=!: The unique ID of the detector of the GuardDuty account for which you want to create an IPSet.
    --expected-bucket-owner=: The Amazon Web Services account ID that owns the Amazon S3 bucket specified in the **location** parameter.
    --format=!: The format of the file that contains the IPSet.
    --location=!: The URI of the file that contains the IPSet.
    --name=!: The user-friendly name to identify the IPSet.
    --no-activate!&: A Boolean value that indicates whether GuardDuty is to start using the uploaded IPSet.
    --tags=: The tags to be added to a new IP set resource.
completion:
    flag:
        format:
            - TXT
            - STIX
            - OTX_CSV
            - ALIEN_VAULT
            - PROOF_POINT
            - FIRE_EYE
documentation:
    command: Creates a new IPSet, which is called a trusted IP list in the console user interface. An IPSet is a list of IP addresses that are trusted for secure communication with Amazon Web Services infrastructure and applications. GuardDuty doesn't generate findings for IP addresses that are included in IPSets. Only users from the administrator account can use this operation.
    flag:
        activate: A Boolean value that indicates whether GuardDuty is to start using the uploaded IPSet.
        client-token: The idempotency token for the create request.
        detector-id: |-
            The unique ID of the detector of the GuardDuty account for which you want to create an IPSet.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        expected-bucket-owner: The Amazon Web Services account ID that owns the Amazon S3 bucket specified in the **location** parameter.
        format: The format of the file that contains the IPSet.
        location: The URI of the file that contains the IPSet.
        name: |-
            The user-friendly name to identify the IPSet.

            Allowed characters are alphanumeric, whitespace, dash (-), and underscores (\_).
        tags: The tags to be added to a new IP set resource.
