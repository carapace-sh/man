name: notify-resource-deployment-status-change
description: Notify Proton of status changes to a provisioned resource when you use self-managed provisioning.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deployment-id=: The deployment ID for your provisioned resource.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --outputs=: The provisioned resource state change detail data that's returned by Proton.
    --resource-arn=!: The provisioned resource Amazon Resource Name (ARN).
    --status-message=: The deployment status message for your provisioned resource.
    --status=: The status of your provisioned resource.
completion:
    flag:
        status:
            - IN_PROGRESS
            - FAILED
            - SUCCEEDED
documentation:
    command: |-
        Notify Proton of status changes to a provisioned resource when you use self-managed provisioning.

        For more information, see [Self-managed provisioning](https://docs.aws.amazon.com/proton/latest/userguide/ag-works-prov-methods.html#ag-works-prov-methods-self) in the *Proton User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deployment-id: The deployment ID for your provisioned resource.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        outputs: The provisioned resource state change detail data that's returned by Proton.
        resource-arn: The provisioned resource Amazon Resource Name (ARN).
        status: The status of your provisioned resource.
        status-message: The deployment status message for your provisioned resource.
