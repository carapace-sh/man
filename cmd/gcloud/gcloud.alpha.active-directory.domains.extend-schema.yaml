name: extend-schema
description: '*(ALPHA)*  Initiate schema extension for a Managed Microsoft AD domain.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=!: Description of schema change.
    --ldif-file=!: Local LDIF file path that contains commands for schema extension.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Initiate schema extension for a Managed Microsoft AD domain.

        This command can fail for the following reasons:
          * The specified domain doesn't exist.
          * The specified domain is either being created or updated.
          * The specified domain is under maintenance.
          * The active account doesn't have permission to initiate schema extension on the specified domain.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description of schema change.
        ldif-file: Local LDIF file path that contains commands for schema extension. The file size can't be larger than 1 MB. Use a full or relative path to a local file containing the value of ldif_file.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
