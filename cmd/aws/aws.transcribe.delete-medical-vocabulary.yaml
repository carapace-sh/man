name: delete-medical-vocabulary
description: Deletes a custom medical vocabulary.
flags:
    --vocabulary-name=!: The name of the custom medical vocabulary you want to delete.
documentation:
    command: Deletes a custom medical vocabulary. To use this operation, specify the name of the custom vocabulary you want to delete using `VocabularyName`. Custom vocabulary names are case sensitive.
    flag:
        vocabulary-name: The name of the custom medical vocabulary you want to delete. Custom medical vocabulary names are case sensitive.
