name: describe-configuration-recorder-status
description: Returns the current status of the configuration recorder you specify as well as the status of the last recording event for the configuration recorders.
flags:
    --arn=: The Amazon Resource Name (ARN) of the configuration recorder that you want to specify.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-recorder-names=: The name of the configuration recorder.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --service-principal=: For service-linked configuration recorders, you can use the service principal of the linked Amazon Web Services service to specify the configuration recorder.
documentation:
    command: |-
        Returns the current status of the configuration recorder you specify as well as the status of the last recording event for the configuration recorders.

        For a detailed status of recording events over time, add your Config events to Amazon CloudWatch metrics and use CloudWatch metrics.

        If a configuration recorder is not specified, this operation returns the status for the customer managed configuration recorder configured for the account, if applicable.

        When making a request to this operation, you can only specify one configuration recorder.
    flag:
        arn: The Amazon Resource Name (ARN) of the configuration recorder that you want to specify.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-recorder-names: |-
            The name of the configuration recorder. If the name is not specified, the operation returns the status for the customer managed configuration recorder configured for the account, if applicable.

            When making a request to this operation, you can only specify one configuration recorder.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        service-principal: For service-linked configuration recorders, you can use the service principal of the linked Amazon Web Services service to specify the configuration recorder.
