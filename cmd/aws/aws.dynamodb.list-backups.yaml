name: list-backups
description: List DynamoDB backups that are associated with an Amazon Web Services account and weren't made with Amazon Web Services Backup.
flags:
    --backup-type=: The backups from the table specified by `BackupType` are listed.
    --exclusive-start-backup-arn=: '`LastEvaluatedBackupArn` is the Amazon Resource Name (ARN) of the backup last evaluated when the current page of results was returned, inclusive of the current page of results.'
    --limit=: Maximum number of backups to return at once.
    --table-name=: Lists the backups from the table specified in `TableName`.
    --time-range-lower-bound=: Only backups created after this time are listed.
    --time-range-upper-bound=: Only backups created before this time are listed.
completion:
    flag:
        backup-type:
            - USER
            - SYSTEM
            - AWS_BACKUP
            - ALL
documentation:
    command: |-
        List DynamoDB backups that are associated with an Amazon Web Services account and weren't made with Amazon Web Services Backup. To list these backups for a given table, specify `TableName`. `ListBackups` returns a paginated list of results with at most 1 MB worth of items in a page. You can also specify a maximum number of entries to be returned in a page.

        In the request, start time is inclusive, but end time is exclusive. Note that these boundaries are for the time at which the original backup was requested.

        You can call `ListBackups` a maximum of five times per second.

        If you want to retrieve the complete list of backups made with Amazon Web Services Backup, use the [Amazon Web Services Backup list API.](https://docs.aws.amazon.com/aws-backup/latest/devguide/API_ListBackupJobs.html)
    flag:
        backup-type: |-
            The backups from the table specified by `BackupType` are listed.

            Where `BackupType` can be:

            - `USER` - On-demand backup created by you. (The default setting if no other backup types are specified.)
            - `SYSTEM` - On-demand backup automatically created by DynamoDB.
            - `ALL` - All types of on-demand backups (USER and SYSTEM).
        exclusive-start-backup-arn: '`LastEvaluatedBackupArn` is the Amazon Resource Name (ARN) of the backup last evaluated when the current page of results was returned, inclusive of the current page of results. This value may be specified as the `ExclusiveStartBackupArn` of a new `ListBackups` operation in order to fetch the next page of results.'
        limit: Maximum number of backups to return at once.
        table-name: Lists the backups from the table specified in `TableName`. You can also provide the Amazon Resource Name (ARN) of the table in this parameter.
        time-range-lower-bound: Only backups created after this time are listed. `TimeRangeLowerBound` is inclusive.
        time-range-upper-bound: Only backups created before this time are listed. `TimeRangeUpperBound` is exclusive.
