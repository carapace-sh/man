name: get-integration
description: Returns information about one integration between CloudWatch Logs and OpenSearch Service.
flags:
    --integration-name=!: The name of the integration that you want to find information about.
documentation:
    command: Returns information about one integration between CloudWatch Logs and OpenSearch Service.
    flag:
        integration-name: The name of the integration that you want to find information about. To find the name of your integration, use [ListIntegrations](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_ListIntegrations.html)
