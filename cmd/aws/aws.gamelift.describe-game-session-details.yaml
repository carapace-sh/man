name: describe-game-session-details
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Retrieves additional game session properties, including the game session protection policy in force, a set of one or more game sessions in a specific fleet location.
flags:
    --alias-id=: A unique identifier for the alias associated with the fleet to retrieve all game sessions for.
    --fleet-id=: A unique identifier for the fleet to retrieve all game sessions active on the fleet.
    --game-session-id=: A unique identifier for the game session to retrieve.
    --limit=: The maximum number of results to return.
    --location=: A fleet location to get game session details for.
    --next-token=: A token that indicates the start of the next sequential page of results.
    --status-filter=: Game session status to filter results on.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Retrieves additional game session properties, including the game session protection policy in force, a set of one or more game sessions in a specific fleet location. You can optionally filter the results by current game session status.

        This operation can be used in the following ways:

        - To retrieve details for all game sessions that are currently running on all locations in a fleet, provide a fleet or alias ID, with an optional status filter. This approach returns details from the fleet's home Region and all remote locations.
        - To retrieve details for all game sessions that are currently running on a specific fleet location, provide a fleet or alias ID and a location name, with optional status filter. The location can be the fleet's home Region or any remote location.
        - To retrieve details for a specific game session, provide the game session ID. This approach looks for the game session ID in all fleets that reside in the Amazon Web Services Region defined in the request.

        Use the pagination parameters to retrieve results as a set of sequential pages.

        If successful, a `GameSessionDetail` object is returned for each game session that matches the request.

        **Learn more**

        [Find a game session](https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-sdk-client-api.html#gamelift-sdk-client-api-find)

        [All APIs by task](https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets)
    flag:
        alias-id: A unique identifier for the alias associated with the fleet to retrieve all game sessions for. You can use either the alias ID or ARN value.
        fleet-id: A unique identifier for the fleet to retrieve all game sessions active on the fleet. You can use either the fleet ID or ARN value.
        game-session-id: A unique identifier for the game session to retrieve.
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        location: A fleet location to get game session details for. You can specify a fleet's home Region or a remote location. Use the Amazon Web Services Region code format, such as `us-west-2`.
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
        status-filter: Game session status to filter results on. Possible game session statuses include `ACTIVE`, `TERMINATED`, `ACTIVATING` and `TERMINATING` (the last two are transitory).
