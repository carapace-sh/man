name: describe
description: '*(ALPHA)*  Gets a Workbench.'
hidden: true
flags:
    --location=: The location id of the workbench resource.
documentation:
    command: |
        *(ALPHA)*  Gets details of a single Workbench instance.

        describe <WORKBENCH_ID> --location=<LOCATION>
    flag:
        location: |-
            The location id of the workbench resource.
            +
            To set the `location` attribute:
