name: start-update
description: Updates instances in a managed instance group.
flags:
    --canary-version=: New instance template resource to be used.
    --force: If set, accepts any original or new version configurations without validation.
    --max-surge=: Maximum additional number of instances that can be created during the update process.
    --max-unavailable=: Maximum number of instances that can be unavailable during the update process.
    --minimal-action=: Use this flag to minimize disruption as much as possible or to
    --most-disruptive-allowed-action=: Use this flag to prevent an update if it requires more disruption
    --no-force&: If set, accepts any original or new version configurations without validation.
    --region=: Region of the managed instance group to operate on.
    --replacement-method=: Type of replacement method.
    --type=: Desired update type.
    --zone=: Zone of the managed instance group to operate on.
completion:
    flag:
        minimal-action:
            - refresh
            - replace
            - restart
        most-disruptive-allowed-action:
            - refresh
            - replace
            - restart
        replacement-method:
            - recreate
            - substitute
        type:
            - opportunistic
            - proactive
documentation:
    command: |
        *gcloud compute instance-groups managed rolling-action start-update* updates instances in a managed instance group,
        according to the given versions and the given update policy.

        An instance template version can be either a global or regional resource.
    flag:
        canary-version: 'New instance template resource to be used. Each version has the following format: template=TEMPLATE,target-size=FIXED_OR_PERCENT,[name=NAME]'
        force: If set, accepts any original or new version configurations without validation.
        max-surge: Maximum additional number of instances that can be created during the update process. This can be a fixed number (e.g. 5) or a percentage of size to the managed instance group (e.g. 10%). Defaults to 0 if the managed instance group has stateful configuration, or to the number of zones in which it operates otherwise.
        max-unavailable: Maximum number of instances that can be unavailable during the update process. This can be a fixed number (e.g. 5) or a percentage of size to the managed instance group (e.g. 10%). Defaults to the number of zones in which the managed instance group operates.
        minimal-action: |-
            Use this flag to minimize disruption as much as possible or to
                    apply a more disruptive action than is strictly necessary.
                    The MIG performs at least this action on each instance while
                    updating. If the update requires a more disruptive action than
                    the one specified here, then the more disruptive action is
                    performed. If you omit this flag, the update uses the
                    ``minimal-action'' value from the MIG's update policy, unless it
                    is not set in which case the default is ``replace''.
            +
            _MINIMAL_ACTION_ must be one of:
            +
            *refresh*::: Apply the new configuration without stopping VMs, if possible. For example, use ``refresh`` to apply changes that only affect metadata or additional disks.
            *restart*::: Apply the new configuration without replacing VMs, if possible. For example, stopping VMs and starting them again is sufficient to apply changes to machine type.
            *replace*::: Replace old VMs according to the --replacement-method flag.
            :::
            +
        most-disruptive-allowed-action: |-
            Use this flag to prevent an update if it requires more disruption
                    than you can afford. At most, the MIG performs the specified
                    action on each instance while updating. If the update requires
                    a more disruptive action than the one specified here, then
                    the update fails and no changes are made. If you omit this flag,
                    the update uses the ``most-disruptive-allowed-action'' value from
                    the MIG's update policy, unless it is not set in which case
                    the default is ``replace''.
            +
            _MOST_DISRUPTIVE_ALLOWED_ACTION_ must be one of:
            +
            *refresh*::: Apply the new configuration without stopping VMs, if possible. For example, use ``refresh`` to apply changes that only affect metadata or additional disks.
            *restart*::: Apply the new configuration without replacing VMs, if possible. For example, stopping VMs and starting them again is sufficient to apply changes to machine type.
            *replace*::: Replace old VMs according to the --replacement-method flag.
            :::
            +
        no-force: If set, accepts any original or new version configurations without validation.
        region: |-
            Region of the managed instance group to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        replacement-method: |-
            Type of replacement method. Specifies what action will be taken to update instances. Defaults to ``recreate`` if the managed instance group has stateful configuration, or to ``substitute`` otherwise. _REPLACEMENT_METHOD_ must be one of:
            +
            *recreate*::: Recreate instances and preserve the instance names. The instance IDs and creation timestamps might change.
            *substitute*::: Delete old instances and create instances with new names.
            :::
            +
        type: |-
            Desired update type. _TYPE_ must be one of:
            +
            *opportunistic*::: Do not proactively replace VMs. Create new VMs and delete old ones on resizes of the group and when you target specific VMs to be updated or recreated.
            *proactive*::: Replace instances proactively.
            :::
            +
        zone: |-
            Zone of the managed instance group to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
