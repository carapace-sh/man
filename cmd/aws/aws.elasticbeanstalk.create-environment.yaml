name: create-environment
description: Launches an AWS Elastic Beanstalk environment for the specified application using the specified configuration.
flags:
    --application-name=!: The name of the application that is associated with this environment.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cname-prefix=: If specified, the environment attempts to use this value as the prefix for the CNAME in your Elastic Beanstalk environment URL.
    --description=: Your description for this environment.
    --environment-name=: A unique name for the environment.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-name=: The name of the group to which the target environment belongs.
    --operations-role=: The Amazon Resource Name (ARN) of an existing IAM role to be used as the environment's operations role.
    --option-settings=: If specified, AWS Elastic Beanstalk sets the specified configuration options to the requested value in the configuration set for the new environment.
    --options-to-remove=: A list of custom user-defined configuration options to remove from the configuration set for this new environment.
    --platform-arn=: The Amazon Resource Name (ARN) of the custom platform to use with the environment.
    --solution-stack-name=: The name of an Elastic Beanstalk solution stack (platform version) to use with the environment.
    --tags=: Specifies the tags applied to resources in the environment.
    --template-name=: The name of the Elastic Beanstalk configuration template to use with the environment.
    --tier=: Specifies the tier to use in creating this environment.
    --version-label=: The name of the application version to deploy.
documentation:
    command: Launches an AWS Elastic Beanstalk environment for the specified application using the specified configuration.
    flag:
        application-name: The name of the application that is associated with this environment.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cname-prefix: If specified, the environment attempts to use this value as the prefix for the CNAME in your Elastic Beanstalk environment URL. If not specified, the CNAME is generated automatically by appending a random alphanumeric string to the environment name.
        description: Your description for this environment.
        environment-name: |-
            A unique name for the environment.

            Constraint: Must be from 4 to 40 characters in length. The name can contain only letters, numbers, and hyphens. It can't start or end with a hyphen. This name must be unique within a region in your account. If the specified name already exists in the region, Elastic Beanstalk returns an `InvalidParameterValue` error.

            If you don't specify the `CNAMEPrefix` parameter, the environment name becomes part of the CNAME, and therefore part of the visible URL for your application.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-name: The name of the group to which the target environment belongs. Specify a group name only if the environment's name is specified in an environment manifest and not with the environment name parameter. See [Environment Manifest (env.yaml)](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/environment-cfg-manifest.html) for details.
        operations-role: The Amazon Resource Name (ARN) of an existing IAM role to be used as the environment's operations role. If specified, Elastic Beanstalk uses the operations role for permissions to downstream services during this call and during subsequent calls acting on this environment. To specify an operations role, you must have the `iam:PassRole` permission for the role. For more information, see [Operations roles](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/iam-operationsrole.html) in the *AWS Elastic Beanstalk Developer Guide*.
        option-settings: If specified, AWS Elastic Beanstalk sets the specified configuration options to the requested value in the configuration set for the new environment. These override the values obtained from the solution stack or the configuration template.
        options-to-remove: A list of custom user-defined configuration options to remove from the configuration set for this new environment.
        platform-arn: |-
            The Amazon Resource Name (ARN) of the custom platform to use with the environment. For more information, see [Custom Platforms](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/custom-platforms.html) in the *AWS Elastic Beanstalk Developer Guide*.

            If you specify `PlatformArn`, don't specify `SolutionStackName`.
        solution-stack-name: |-
            The name of an Elastic Beanstalk solution stack (platform version) to use with the environment. If specified, Elastic Beanstalk sets the configuration values to the default values associated with the specified solution stack. For a list of current solution stacks, see [Elastic Beanstalk Supported Platforms](https://docs.aws.amazon.com/elasticbeanstalk/latest/platforms/platforms-supported.html) in the *AWS Elastic Beanstalk Platforms* guide.

            If you specify `SolutionStackName`, don't specify `PlatformArn` or `TemplateName`.
        tags: Specifies the tags applied to resources in the environment.
        template-name: |-
            The name of the Elastic Beanstalk configuration template to use with the environment.

            If you specify `TemplateName`, then don't specify `SolutionStackName`.
        tier: Specifies the tier to use in creating this environment. The environment tier that you choose determines whether Elastic Beanstalk provisions resources to support a web application that handles HTTP(S) requests or a web application that handles background-processing tasks.
        version-label: |-
            The name of the application version to deploy.

            Default: If not specified, Elastic Beanstalk attempts to deploy the sample application.
