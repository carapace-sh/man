name: update-automatic-tape-creation-policy
description: Updates the automatic tape creation policy of a gateway.
flags:
    --automatic-tape-creation-rules=!: An automatic tape creation policy consists of a list of automatic tape creation rules.
    --gateway-arn=!: ""
documentation:
    command: |-
        Updates the automatic tape creation policy of a gateway. Use this to update the policy with a new set of automatic tape creation rules. This is only supported for tape gateways.

        By default, there is no automatic tape creation policy.

        A gateway can have only one automatic tape creation policy.
    flag:
        automatic-tape-creation-rules: An automatic tape creation policy consists of a list of automatic tape creation rules. The rules determine when and how to automatically create new tapes.
        gateway-arn: ""
