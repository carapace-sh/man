name: detach-security-profile
description: Disassociates a Device Defender security profile from a thing group or from this account.
flags:
    --security-profile-name=!: The security profile that is detached.
    --security-profile-target-arn=!: The ARN of the thing group from which the security profile is detached.
documentation:
    command: |-
        Disassociates a Device Defender security profile from a thing group or from this account.

        Requires permission to access the [DetachSecurityProfile](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        security-profile-name: The security profile that is detached.
        security-profile-target-arn: The ARN of the thing group from which the security profile is detached.
