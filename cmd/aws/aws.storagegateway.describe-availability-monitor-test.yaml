name: describe-availability-monitor-test
description: Returns information about the most recent high availability monitoring test that was performed on the host in a cluster.
flags:
    --gateway-arn=!: ""
documentation:
    command: Returns information about the most recent high availability monitoring test that was performed on the host in a cluster. If a test isn't performed, the status and start time in the response would be null.
    flag:
        gateway-arn: ""
