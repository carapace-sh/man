name: publish-package-version
description: Creates a new package version containing one or more assets (or files).
flags:
    --asset-content=!: The content of the asset to publish.
    --asset-name=!: The name of the asset to publish.
    --asset-sha256=!: The SHA256 hash of the `assetContent` to publish.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-owner=: The 12-digit account number of the AWS account that owns the domain.
    --domain=!: The name of the domain that contains the repository that contains the package version to publish.
    --format=!: A format that specifies the type of the package version with the requested asset file.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --namespace=: The namespace of the package version to publish.
    --no-unfinished: Specifies whether the package version should remain in the `unfinished` state.
    --package-version=!: The package version to publish (for example, `3.5.2`).
    --package=!: The name of the package version to publish.
    --repository=!: The name of the repository that the package version will be published to.
    --unfinished: Specifies whether the package version should remain in the `unfinished` state.
completion:
    flag:
        format:
            - npm
            - pypi
            - maven
            - nuget
            - generic
            - ruby
            - swift
            - cargo
documentation:
    command: |-
        Creates a new package version containing one or more assets (or files).

        The `unfinished` flag can be used to keep the package version in the `Unfinished` state until all of its assets have been uploaded (see [Package version status](https://docs.aws.amazon.com/codeartifact/latest/ug/packages-overview.html#package-version-status.html%23package-version-status) in the *CodeArtifact user guide*). To set the package version’s status to `Published`, omit the `unfinished` flag when uploading the final asset, or set the status using [UpdatePackageVersionStatus](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_UpdatePackageVersionsStatus.html). Once a package version’s status is set to `Published`, it cannot change back to `Unfinished`.

        Only generic packages can be published using this API. For more information, see [Using generic packages](https://docs.aws.amazon.com/codeartifact/latest/ug/using-generic.html) in the *CodeArtifact User Guide*.
    flag:
        asset-content: The content of the asset to publish.
        asset-name: 'The name of the asset to publish. Asset names can include Unicode letters and numbers, and the following special characters: ``~ ! @ ^ & ( ) - ` _ + [ ] { } ; , . ` ``'
        asset-sha256: |-
            The SHA256 hash of the `assetContent` to publish. This value must be calculated by the caller and provided with the request (see [Publishing a generic package](https://docs.aws.amazon.com/codeartifact/latest/ug/using-generic.html#publishing-generic-packages) in the *CodeArtifact User Guide*).

            This value is used as an integrity check to verify that the `assetContent` has not changed after it was originally sent.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain: The name of the domain that contains the repository that contains the package version to publish.
        domain-owner: The 12-digit account number of the AWS account that owns the domain. It does not include dashes or spaces.
        format: |-
            A format that specifies the type of the package version with the requested asset file.

            The only supported value is `generic`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        namespace: The namespace of the package version to publish.
        package: The name of the package version to publish.
        package-version: The package version to publish (for example, `3.5.2`).
        repository: The name of the repository that the package version will be published to.
        unfinished: |-
            Specifies whether the package version should remain in the `unfinished` state. If omitted, the package version status will be set to `Published` (see [Package version status](https://docs.aws.amazon.com/codeartifact/latest/ug/packages-overview.html#package-version-status) in the *CodeArtifact User Guide*).

            Valid values: `unfinished`
