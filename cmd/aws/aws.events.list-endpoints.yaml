name: list-endpoints
description: List the global endpoints associated with this account.
flags:
    --home-region=: The primary Region of the endpoints associated with this account.
    --max-results=: The maximum number of results returned by the call.
    --name-prefix=: A value that will return a subset of the endpoints associated with this account.
    --next-token=: The token returned by a previous call, which you can use to retrieve the next set of results.
documentation:
    command: List the global endpoints associated with this account. For more information about global endpoints, see [Making applications Regional-fault tolerant with global endpoints and event replication](https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-global-endpoints.html) in the *Amazon EventBridge User Guide* .
    flag:
        home-region: 'The primary Region of the endpoints associated with this account. For example `"HomeRegion": "us-east-1"`.'
        max-results: The maximum number of results returned by the call.
        name-prefix: 'A value that will return a subset of the endpoints associated with this account. For example, `"NamePrefix": "ABC"` will return all endpoints with "ABC" in the name.'
        next-token: |-
            The token returned by a previous call, which you can use to retrieve the next set of results.

            The value of `nextToken` is a unique pagination token for each page. To retrieve the next page of results, make the call again using the returned token. Keep all other arguments unchanged.

            Using an expired pagination token results in an `HTTP 400 InvalidToken` error.
