name: stop-cis-session
description: Stops a CIS session.
flags:
    --message=!: The stop CIS session message.
    --scan-job-id=!: A unique identifier for the scan job.
    --session-token=!: The unique token that identifies the CIS session.
documentation:
    command: Stops a CIS session. This API is used by the Amazon Inspector SSM plugin to communicate with the Amazon Inspector service. The Amazon Inspector SSM plugin calls this API to stop a CIS scan session for the scan ID supplied by the service.
    flag:
        message: The stop CIS session message.
        scan-job-id: A unique identifier for the scan job.
        session-token: The unique token that identifies the CIS session.
