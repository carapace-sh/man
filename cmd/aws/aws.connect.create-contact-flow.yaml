name: create-contact-flow
description: Creates a flow for the specified Amazon Connect instance.
flags:
    --content=!: The JSON string that represents the content of the flow.
    --description=: The description of the flow.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --name=!: The name of the flow.
    --status=: Indicates the flow status as either `SAVED` or `PUBLISHED`.
    --tags=: The tags used to organize, track, or control access for this resource.
    --type=!: The type of the flow.
completion:
    flag:
        status:
            - PUBLISHED
            - SAVED
        type:
            - CONTACT_FLOW
            - CUSTOMER_QUEUE
            - CUSTOMER_HOLD
            - CUSTOMER_WHISPER
            - AGENT_HOLD
            - AGENT_WHISPER
            - OUTBOUND_WHISPER
            - AGENT_TRANSFER
            - QUEUE_TRANSFER
            - CAMPAIGN
documentation:
    command: |-
        Creates a flow for the specified Amazon Connect instance.

        You can also create and update flows using the [Amazon Connect Flow language](https://docs.aws.amazon.com/connect/latest/APIReference/flow-language.html).
    flag:
        content: |-
            The JSON string that represents the content of the flow. For an example, see [Example flow in Amazon Connect Flow language](https://docs.aws.amazon.com/connect/latest/APIReference/flow-language-example.html).

            Length Constraints: Minimum length of 1. Maximum length of 256000.
        description: The description of the flow.
        instance-id: The identifier of the Amazon Connect instance.
        name: The name of the flow.
        status: Indicates the flow status as either `SAVED` or `PUBLISHED`. The `PUBLISHED` status will initiate validation on the content. the `SAVED` status does not initiate validation of the content. `SAVED` | `PUBLISHED`.
        tags: 'The tags used to organize, track, or control access for this resource. For example, { "Tags": {"key1":"value1", "key2":"value2"} }.'
        type: The type of the flow. For descriptions of the available types, see [Choose a flow type](https://docs.aws.amazon.com/connect/latest/adminguide/create-contact-flow.html#contact-flow-types) in the *Amazon Connect Administrator Guide*.
