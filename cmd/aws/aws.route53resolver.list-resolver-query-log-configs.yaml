name: list-resolver-query-log-configs
description: Lists information about the specified query logging configurations.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=: An optional specification to return a subset of query logging configurations.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of query logging configurations that you want to return in the response to a `ListResolverQueryLogConfigs` request.
    --next-token=: For the first `ListResolverQueryLogConfigs` request, omit this value.
    --page-size=: The size of each page to get in the AWS service call.
    --sort-by=: The element that you want Resolver to sort query logging configurations by.
    --sort-order=: If you specified a value for `SortBy`, the order that you want query logging configurations to be listed in, `ASCENDING` or `DESCENDING`.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Lists information about the specified query logging configurations. Each configuration defines where you want Resolver to save DNS query logs and specifies the VPCs that you want to log queries for.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: |-
            An optional specification to return a subset of query logging configurations.

            If you submit a second or subsequent `ListResolverQueryLogConfigs` request and specify the `NextToken` parameter, you must use the same values for `Filters`, if any, as in the previous request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of query logging configurations that you want to return in the response to a `ListResolverQueryLogConfigs` request. If you don't specify a value for `MaxResults`, Resolver returns up to 100 query logging configurations.
        next-token: |-
            For the first `ListResolverQueryLogConfigs` request, omit this value.

            If there are more than `MaxResults` query logging configurations that match the values that you specify for `Filters`, you can submit another `ListResolverQueryLogConfigs` request to get the next group of configurations. In the next request, specify the value of `NextToken` from the previous response.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sort-by: "The element that you want Resolver to sort query logging configurations by.\n\nIf you submit a second or subsequent `ListResolverQueryLogConfigs` request and specify the `NextToken` parameter, you must use the same value for `SortBy`, if any, as in the previous request.\n\nValid values include the following elements:\n\n- `Arn`: The ARN of the query logging configuration\n- `AssociationCount`: The number of VPCs that are associated with the specified configuration\n- `CreationTime`: The date and time that Resolver returned when the configuration was created\n- `CreatorRequestId`: The value that was specified for `CreatorRequestId` when the configuration was created\n- `DestinationArn`: The location that logs are sent to\n- `Id`: The ID of the configuration\n- `Name`: The name of the configuration\n- `OwnerId`: The Amazon Web Services account number of the account that created the configuration\n- `ShareStatus`: Whether the configuration is shared with other Amazon Web Services accounts or shared with the current account by another Amazon Web Services account. Sharing is configured through Resource Access Manager (RAM).\n- `Status`: The current status of the configuration. Valid values include the following:\n  \n  - `CREATING`: Resolver is creating the query logging configuration.\n  - `CREATED`: The query logging configuration was successfully created. Resolver is logging queries that originate in the specified VPC.\n  - `DELETING`: Resolver is deleting this query logging configuration.\n  - `FAILED`: Resolver either couldn't create or couldn't delete the query logging configuration. Here are two common causes:\n    \n    - The specified destination (for example, an Amazon S3 bucket) was deleted.\n    - Permissions don't allow sending logs to the destination."
        sort-order: |-
            If you specified a value for `SortBy`, the order that you want query logging configurations to be listed in, `ASCENDING` or `DESCENDING`.

            If you submit a second or subsequent `ListResolverQueryLogConfigs` request and specify the `NextToken` parameter, you must use the same value for `SortOrder`, if any, as in the previous request.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
