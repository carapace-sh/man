name: describe-budgets
description: Lists the budgets that are associated with an account.
flags:
    --account-id=!: The `accountId` that is associated with the budgets that you want to describe.
    --max-results=: An integer that represents how many budgets a paginated response contains.
    --next-token=: The pagination token that you include in your request to indicate the next set of results that you want to retrieve.
    --show-filter-expression=: Specifies whether the response includes the filter expression associated with the budgets.
documentation:
    command: |-
        Lists the budgets that are associated with an account.

        The Request Syntax section shows the `BudgetLimit` syntax. For `PlannedBudgetLimits`, see the [Examples](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_budgets_DescribeBudgets.html#API_DescribeBudgets_Examples) section.
    flag:
        account-id: The `accountId` that is associated with the budgets that you want to describe.
        max-results: An integer that represents how many budgets a paginated response contains. The default is 100.
        next-token: The pagination token that you include in your request to indicate the next set of results that you want to retrieve.
        show-filter-expression: Specifies whether the response includes the filter expression associated with the budgets. By showing the filter expression, you can see detailed filtering logic applied to the budgets, such as Amazon Web Services services or tags that are being tracked.
