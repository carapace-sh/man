name: tag-resource
description: Adds or overwrites only the specified tags for the specified Application Migration Service resource or resources.
flags:
    --resource-arn=!: Tag resource by ARN.
    --tags=!: Tag resource by Tags.
documentation:
    command: Adds or overwrites only the specified tags for the specified Application Migration Service resource or resources. When you specify an existing tag key, the value is overwritten with the new value. Each resource can have a maximum of 50 tags. Each tag consists of a key and optional value.
    flag:
        resource-arn: Tag resource by ARN.
        tags: Tag resource by Tags.
