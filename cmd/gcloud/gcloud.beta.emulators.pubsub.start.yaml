name: start
description: '*(BETA)*  Start a local pubsub emulator.'
flags:
    --data-dir=: The directory to be used to store/retrieve data/config for an emulator run.
    --host-port=: The host:port to which the emulator should be bound.
documentation:
    command: |-
        *(BETA)*  This command starts a local pubsub emulator.

        On successful start up, you should expect to see:

        ```
        ...
        [pubsub] This is the Google Pub/Sub fake.
        [pubsub] Implementation may be incomplete or differ from the real system.
        ...
        [pubsub] INFO: Server started, listening on 8538
        ```
    flag:
        data-dir: |-
            The directory to be used to store/retrieve data/config for an emulator run. The default value is `<USER_CONFIG_DIR>/emulators/pubsub`. The value of USER_CONFIG_DIR can be found by running:
            +
              $ gcloud info --format='get(config.paths.global_config_dir)'
        host-port: The host:port to which the emulator should be bound. The default value is [::1]:8085.
