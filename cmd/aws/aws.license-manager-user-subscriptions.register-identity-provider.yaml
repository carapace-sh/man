name: register-identity-provider
description: Registers an identity provider for user-based subscriptions.
flags:
    --identity-provider=!: An object that specifies details for the identity provider to register.
    --product=!: The name of the user-based subscription product.
    --settings=: The registered identity provider’s product related configuration settings such as the subnets to provision VPC endpoints.
    --tags=: The tags that apply to the identity provider's registration.
documentation:
    command: Registers an identity provider for user-based subscriptions.
    flag:
        identity-provider: An object that specifies details for the identity provider to register.
        product: |-
            The name of the user-based subscription product.

            Valid values: `VISUAL_STUDIO_ENTERPRISE` | `VISUAL_STUDIO_PROFESSIONAL` | `OFFICE_PROFESSIONAL_PLUS` | `REMOTE_DESKTOP_SERVICES`
        settings: The registered identity provider’s product related configuration settings such as the subnets to provision VPC endpoints.
        tags: The tags that apply to the identity provider's registration.
