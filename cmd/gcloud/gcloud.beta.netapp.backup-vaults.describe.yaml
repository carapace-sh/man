name: describe
description: '*(BETA)*  Show metadata for a Cloud NetApp Volumes Backup Vault.'
flags:
    --location=: The location of the backup_vault.
documentation:
    command: |
        *(BETA)*  Describe a Backup Vault.
    flag:
        location: |-
            The location of the backup_vault.
            +
            To set the `location` attribute:
            * provide the argument `backup_vault` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
