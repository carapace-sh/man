name: update-kx-cluster-code-configuration
description: Allows you to update code configuration on a running cluster.
flags:
    --client-token=: A token that ensures idempotency.
    --cluster-name=!: The name of the cluster.
    --code=!: ""
    --command-line-arguments=: Specifies the key-value pairs to make them available inside the cluster.
    --deployment-configuration=: The configuration that allows you to choose how you want to update the code on a cluster.
    --environment-id=!: A unique identifier of the kdb environment.
    --initialization-script=: Specifies a Q program that will be run at launch of a cluster.
documentation:
    command: Allows you to update code configuration on a running cluster. By using this API you can update the code, the initialization script path, and the command line arguments for a specific cluster. The configuration that you want to update will override any existing configurations on the cluster.
    flag:
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        cluster-name: The name of the cluster.
        code: ""
        command-line-arguments: |-
            Specifies the key-value pairs to make them available inside the cluster.

            You cannot update this parameter for a `NO_RESTART` deployment.
        deployment-configuration: The configuration that allows you to choose how you want to update the code on a cluster.
        environment-id: A unique identifier of the kdb environment.
        initialization-script: |-
            Specifies a Q program that will be run at launch of a cluster. It is a relative path within *.zip* file that contains the custom code, which will be loaded on the cluster. It must include the file name itself. For example, `somedir/init.q`.

            You cannot update this parameter for a `NO_RESTART` deployment.
