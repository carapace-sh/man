name: create-ipam-resource-discovery
description: Creates an IPAM resource discovery.
flags:
    --client-token=: A client token for the IPAM resource discovery.
    --description=: A description for the IPAM resource discovery.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --no-dry-run&: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --operating-regions=: Operating Regions for the IPAM resource discovery.
    --tag-specifications=: Tag specifications for the IPAM resource discovery.
documentation:
    command: Creates an IPAM resource discovery. A resource discovery is an IPAM component that enables IPAM to manage and monitor resources that belong to the owning account.
    flag:
        client-token: A client token for the IPAM resource discovery.
        description: A description for the IPAM resource discovery.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        operating-regions: Operating Regions for the IPAM resource discovery. Operating Regions are Amazon Web Services Regions where the IPAM is allowed to manage IP address CIDRs. IPAM only discovers and monitors resources in the Amazon Web Services Regions you select as operating Regions.
        tag-specifications: Tag specifications for the IPAM resource discovery.
