name: create-case-rule
description: Creates a new case rule.
flags:
    --description=: The description of a case rule.
    --domain-id=!: Unique identifier of a Cases domain.
    --name=!: Name of the case rule.
    --rule=!: Represents what rule type should take place, under what conditions.
documentation:
    command: Creates a new case rule. In the Amazon Connect admin website, case rules are known as *case field conditions*. For more information about case field conditions, see [Add case field conditions to a case template](https://docs.aws.amazon.com/connect/latest/adminguide/case-field-conditions.html).
    flag:
        description: The description of a case rule.
        domain-id: Unique identifier of a Cases domain.
        name: Name of the case rule.
        rule: Represents what rule type should take place, under what conditions.
