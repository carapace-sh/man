name: update-kx-environment-network
description: Updates environment network to connect to your internal network by using a transit gateway.
flags:
    --client-token=: A token that ensures idempotency.
    --custom-dnsconfiguration=: A list of DNS server name and server IP.
    --environment-id=!: A unique identifier for the kdb environment.
    --transit-gateway-configuration=: Specifies the transit gateway and network configuration to connect the kdb environment to an internal network.
documentation:
    command: |-
        Updates environment network to connect to your internal network by using a transit gateway. This API supports request to create a transit gateway attachment from FinSpace VPC to your transit gateway ID and create a custom Route-53 outbound resolvers.

        Once you send a request to update a network, you cannot change it again. Network update might require termination of any clusters that are running in the existing network.
    flag:
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        custom-dnsconfiguration: A list of DNS server name and server IP. This is used to set up Route-53 outbound resolvers.
        environment-id: A unique identifier for the kdb environment.
        transit-gateway-configuration: Specifies the transit gateway and network configuration to connect the kdb environment to an internal network.
