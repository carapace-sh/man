name: describe-recipe
description: Returns the definition of a specific DataBrew recipe corresponding to a particular version.
flags:
    --name=!: The name of the recipe to be described.
    --recipe-version=: The recipe version identifier.
documentation:
    command: Returns the definition of a specific DataBrew recipe corresponding to a particular version.
    flag:
        name: The name of the recipe to be described.
        recipe-version: The recipe version identifier. If this parameter isn't specified, then the latest published version is returned.
