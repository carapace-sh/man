name: create
description: '*(ALPHA)*  Create a Dataplex Entry Link.'
flags:
    --entry-group=: The name of entry link to use.
    --entry-link-type=!: Required.
    --entry-references=!: Required.
    --location=: The location of the Dataplex resource.
documentation:
    command: '*(ALPHA)*  Create a Dataplex Entry Link.'
    flag:
        entry-group: |-
            The name of entry link to use.
            +
            To set the `entry-group` attribute:
            * provide the argument `entry_link` on the command line with a fully specified name;
            * provide the argument `--entry-group` on the command line.
        entry-link-type: 'Required. The type of the entry link. It is a resource name of the EntryLinkType. Example: `projects/my-project/locations/global/entryLinkTypes/my-link-type`'
        entry-references: |-
            Required. Path to a YAML or JSON file containing the entry references. The file should contain a list of dictionaries, each with "name", "type", and optional "path" keys. Example:
              -
                name: projects/test-project/locations/us-central1/entryGroups/my-entry-group/entries/my-entry-1
                type: SOURCE
                path: my_path
              -
                name: projects/test-project/locations/us-central1/entryGroups/my-entry-group/entries/my-entry-2
                type: TARGET
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `entry_link` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
