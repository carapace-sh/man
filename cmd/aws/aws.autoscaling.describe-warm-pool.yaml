name: describe-warm-pool
description: Gets information about a warm pool and its instances.
flags:
    --auto-scaling-group-name=!: The name of the Auto Scaling group.
    --max-records=: The maximum number of instances to return with this call.
    --next-token=: The token for the next set of instances to return.
documentation:
    command: |-
        Gets information about a warm pool and its instances.

        For more information, see [Warm pools for Amazon EC2 Auto Scaling](https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-warm-pools.html) in the *Amazon EC2 Auto Scaling User Guide*.
    flag:
        auto-scaling-group-name: The name of the Auto Scaling group.
        max-records: The maximum number of instances to return with this call. The maximum value is `50`.
        next-token: The token for the next set of instances to return. (You received this token from a previous call.)
