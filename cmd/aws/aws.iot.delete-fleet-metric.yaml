name: delete-fleet-metric
description: Deletes the specified fleet metric.
flags:
    --expected-version=: The expected version of the fleet metric to delete.
    --metric-name=!: The name of the fleet metric to delete.
documentation:
    command: |-
        Deletes the specified fleet metric. Returns successfully with no error if the deletion is successful or you specify a fleet metric that doesn't exist.

        Requires permission to access the [DeleteFleetMetric](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        expected-version: The expected version of the fleet metric to delete.
        metric-name: The name of the fleet metric to delete.
