completion:
    flag:
        action:
            - REBOOT_NODE
            - RESTART_SEARCH_PROCESS
            - RESTART_DASHBOARD
        status:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - FAILED
            - TIMED_OUT
documentation:
