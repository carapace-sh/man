name: list-tenant-resources
description: List all resources associated with a specific tenant.
flags:
    --filter=: A map of filter keys and values for filtering the list of tenant resources.
    --next-token=: A token returned from a previous call to `ListTenantResources` to indicate the position in the list of tenant resources.
    --page-size=: The number of results to show in a single call to `ListTenantResources`.
    --tenant-name=!: The name of the tenant to list resources for.
documentation:
    command: |-
        List all resources associated with a specific tenant.

        This operation returns a list of resources (email identities, configuration sets, or email templates) that are associated with the specified tenant. You can optionally filter the results by resource type.
    flag:
        filter: A map of filter keys and values for filtering the list of tenant resources. Currently, the only supported filter key is `RESOURCE_TYPE`.
        next-token: A token returned from a previous call to `ListTenantResources` to indicate the position in the list of tenant resources.
        page-size: The number of results to show in a single call to `ListTenantResources`. If the number of results is larger than the number you specified in this parameter, then the response includes a `NextToken` element, which you can use to obtain additional results.
        tenant-name: The name of the tenant to list resources for.
