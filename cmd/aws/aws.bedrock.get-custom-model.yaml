name: get-custom-model
description: Get the properties associated with a Amazon Bedrock custom model that you have created.
flags:
    --model-identifier=!: Name or Amazon Resource Name (ARN) of the custom model.
documentation:
    command: Get the properties associated with a Amazon Bedrock custom model that you have created. For more information, see [Custom models](https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html) in the [Amazon Bedrock User Guide](https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-service.html).
    flag:
        model-identifier: Name or Amazon Resource Name (ARN) of the custom model.
