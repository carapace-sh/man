name: update-cluster-software
description: Updates the platform software of a SageMaker HyperPod cluster for security patching.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-name=!: Specify the name or the Amazon Resource Name (ARN) of the SageMaker HyperPod cluster you want to update for security patching.
    --deployment-config=: The configuration to use when updating the AMI versions.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --image-id=: 'When configuring your HyperPod cluster, you can specify an image ID using one of the following options:'
    --instance-groups=: The array of instance groups for which to update AMI versions.
documentation:
    command: |-
        Updates the platform software of a SageMaker HyperPod cluster for security patching. To learn how to use this API, see [Update the SageMaker HyperPod platform software of a cluster](https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-operate.html#sagemaker-hyperpod-operate-cli-command-update-cluster-software).

        The `UpgradeClusterSoftware` API call may impact your SageMaker HyperPod cluster uptime and availability. Plan accordingly to mitigate potential disruptions to your workloads.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-name: Specify the name or the Amazon Resource Name (ARN) of the SageMaker HyperPod cluster you want to update for security patching.
        deployment-config: The configuration to use when updating the AMI versions.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        image-id: |-
            When configuring your HyperPod cluster, you can specify an image ID using one of the following options:

            - `HyperPodPublicAmiId`: Use a HyperPod public AMI
            - `CustomAmiId`: Use your custom AMI
            - `default`: Use the default latest system image

            If you choose to use a custom AMI (`CustomAmiId`), ensure it meets the following requirements:

            - Encryption: The custom AMI must be unencrypted.
            - Ownership: The custom AMI must be owned by the same Amazon Web Services account that is creating the HyperPod cluster.
            - Volume support: Only the primary AMI snapshot volume is supported; additional AMI volumes are not supported.

            When updating the instance group's AMI through the `UpdateClusterSoftware` operation, if an instance group uses a custom AMI, you must provide an `ImageId` or use the default as input. Note that if you don't specify an instance group in your `UpdateClusterSoftware` request, then all of the instance groups are patched with the specified image.
        instance-groups: The array of instance groups for which to update AMI versions.
