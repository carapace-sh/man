name: update-filter
description: Updates the filter specified by the filter name.
flags:
    --action=: Specifies the action that is to be applied to the findings that match the filter.
    --description=: The description of the filter.
    --detector-id=!: The unique ID of the detector that specifies the GuardDuty service where you want to update a filter.
    --filter-name=!: The name of the filter.
    --finding-criteria=: Represents the criteria to be used in the filter for querying findings.
    --rank=: Specifies the position of the filter in the list of current filters.
completion:
    flag:
        action:
            - NOOP
            - ARCHIVE
documentation:
    command: Updates the filter specified by the filter name.
    flag:
        action: Specifies the action that is to be applied to the findings that match the filter.
        description: The description of the filter. Valid characters include alphanumeric characters, and special characters such as hyphen, period, colon, underscore, parentheses (`{ }`, `[ ]`, and `( )`), forward slash, horizontal tab, vertical tab, newline, form feed, return, and whitespace.
        detector-id: |-
            The unique ID of the detector that specifies the GuardDuty service where you want to update a filter.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        filter-name: The name of the filter.
        finding-criteria: Represents the criteria to be used in the filter for querying findings.
        rank: Specifies the position of the filter in the list of current filters. Also specifies the order in which this filter is applied to the findings.
