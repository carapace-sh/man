name: describe-client-vpn-connections
description: Describes active client connections and connections that have been terminated within the last 60 minutes for the specified Client VPN endpoint.
flags:
    --client-vpn-endpoint-id=!: The ID of the Client VPN endpoint.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --max-results=: The maximum number of results to return for the request in a single page.
    --next-token=: The token to retrieve the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Describes active client connections and connections that have been terminated within the last 60 minutes for the specified Client VPN endpoint.
    flag:
        client-vpn-endpoint-id: The ID of the Client VPN endpoint.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters. Filter names and values are case-sensitive.

            - `connection-id` - The ID of the connection.
            - `username` - For Active Directory client authentication, the user name of the client who established the client connection.
        max-results: The maximum number of results to return for the request in a single page. The remaining results can be seen by sending another request with the nextToken value.
        next-token: The token to retrieve the next page of results.
