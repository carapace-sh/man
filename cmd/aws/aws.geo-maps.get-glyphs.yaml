name: get-glyphs
description: '`GetGlyphs` returns the map''s glyphs.'
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --font-stack=!: Name of the `FontStack` to retrieve.
    --font-unicode-range=!: A Unicode range of characters to download glyphs for.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: '`GetGlyphs` returns the map''s glyphs.'
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        font-stack: |-
            Name of the `FontStack` to retrieve.

            Example: `Amazon Ember Bold,Noto Sans Bold`.

            The supported font stacks are as follows:

            - Amazon Ember Bold
            - Amazon Ember Bold Italic
            - Amazon Ember Bold,Noto Sans Bold
            - Amazon Ember Bold,Noto Sans Bold,Noto Sans Arabic Bold
            - Amazon Ember Condensed RC BdItalic
            - Amazon Ember Condensed RC Bold
            - Amazon Ember Condensed RC Bold Italic
            - Amazon Ember Condensed RC Bold,Noto Sans Bold
            - Amazon Ember Condensed RC Bold,Noto Sans Bold,Noto Sans Arabic Condensed Bold
            - Amazon Ember Condensed RC Light
            - Amazon Ember Condensed RC Light Italic
            - Amazon Ember Condensed RC LtItalic
            - Amazon Ember Condensed RC Regular
            - Amazon Ember Condensed RC Regular Italic
            - Amazon Ember Condensed RC Regular,Noto Sans Regular
            - Amazon Ember Condensed RC Regular,Noto Sans Regular,Noto Sans Arabic Condensed Regular
            - Amazon Ember Condensed RC RgItalic
            - Amazon Ember Condensed RC ThItalic
            - Amazon Ember Condensed RC Thin
            - Amazon Ember Condensed RC Thin Italic
            - Amazon Ember Heavy
            - Amazon Ember Heavy Italic
            - Amazon Ember Light
            - Amazon Ember Light Italic
            - Amazon Ember Medium
            - Amazon Ember Medium Italic
            - Amazon Ember Medium,Noto Sans Medium
            - Amazon Ember Medium,Noto Sans Medium,Noto Sans Arabic Medium
            - Amazon Ember Regular
            - Amazon Ember Regular Italic
            - Amazon Ember Regular Italic,Noto Sans Italic
            - Amazon Ember Regular Italic,Noto Sans Italic,Noto Sans Arabic Regular
            - Amazon Ember Regular,Noto Sans Regular
            - Amazon Ember Regular,Noto Sans Regular,Noto Sans Arabic Regular
            - Amazon Ember Thin
            - Amazon Ember Thin Italic
            - AmazonEmberCdRC\_Bd
            - AmazonEmberCdRC\_BdIt
            - AmazonEmberCdRC\_Lt
            - AmazonEmberCdRC\_LtIt
            - AmazonEmberCdRC\_Rg
            - AmazonEmberCdRC\_RgIt
            - AmazonEmberCdRC\_Th
            - AmazonEmberCdRC\_ThIt
            - AmazonEmber\_Bd
            - AmazonEmber\_BdIt
            - AmazonEmber\_He
            - AmazonEmber\_HeIt
            - AmazonEmber\_Lt
            - AmazonEmber\_LtIt
            - AmazonEmber\_Md
            - AmazonEmber\_MdIt
            - AmazonEmber\_Rg
            - AmazonEmber\_RgIt
            - AmazonEmber\_Th
            - AmazonEmber\_ThIt
            - Noto Sans Black
            - Noto Sans Black Italic
            - Noto Sans Bold
            - Noto Sans Bold Italic
            - Noto Sans Extra Bold
            - Noto Sans Extra Bold Italic
            - Noto Sans Extra Light
            - Noto Sans Extra Light Italic
            - Noto Sans Italic
            - Noto Sans Light
            - Noto Sans Light Italic
            - Noto Sans Medium
            - Noto Sans Medium Italic
            - Noto Sans Regular
            - Noto Sans Semi Bold
            - Noto Sans Semi Bold Italic
            - Noto Sans Thin
            - Noto Sans Thin Italic
            - NotoSans-Bold
            - NotoSans-Italic
            - NotoSans-Medium
            - NotoSans-Regular
            - Open Sans Regular,Arial Unicode MS Regular
        font-unicode-range: |-
            A Unicode range of characters to download glyphs for. This must be aligned to multiples of 256.

            Example: `0-255.pdf`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
