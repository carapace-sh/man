name: restore-db-cluster-from-snapshot
description: Creates a new DB cluster from a DB snapshot or DB cluster snapshot.
flags:
    --availability-zones=:
        description: Provides the list of EC2 Availability Zones that instances in the restored DB cluster can be created in.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --copy-tags-to-snapshot: '*If set to `true`, tags are copied to any snapshot of the restored DB cluster that is created.*'
    --database-name=: Not supported.
    --db-cluster-identifier=!: The name of the DB cluster to create from the DB snapshot or DB cluster snapshot.
    --db-cluster-parameter-group-name=: The name of the DB cluster parameter group to associate with the new DB cluster.
    --db-subnet-group-name=: The name of the DB subnet group to use for the new DB cluster.
    --deletion-protection: A value that indicates whether the DB cluster has deletion protection enabled.
    --enable-cloudwatch-logs-exports=:
        description: The list of logs that the restored DB cluster is to export to Amazon CloudWatch Logs.
        nargs: -1
    --enable-iam-database-authentication: True to enable mapping of Amazon Identity and Access Management (IAM) accounts to database accounts, and otherwise false.
    --engine-version=: The version of the database engine to use for the new DB cluster.
    --engine=!: The database engine to use for the new DB cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-id=: The Amazon KMS key identifier to use when restoring an encrypted DB cluster from a DB snapshot or DB cluster snapshot.
    --no-copy-tags-to-snapshot: '*If set to `true`, tags are copied to any snapshot of the restored DB cluster that is created.*'
    --no-deletion-protection: A value that indicates whether the DB cluster has deletion protection enabled.
    --no-enable-iam-database-authentication: True to enable mapping of Amazon Identity and Access Management (IAM) accounts to database accounts, and otherwise false.
    --option-group-name=: '*(Not supported by Neptune)*'
    --port=: The port number on which the new DB cluster accepts connections.
    --serverless-v2-scaling-configuration=: Contains the scaling configuration of a Neptune Serverless DB cluster.
    --snapshot-identifier=!: The identifier for the DB snapshot or DB cluster snapshot to restore from.
    --storage-type=: Specifies the storage type to be associated with the DB cluster.
    --tags=:
        description: The tags to be assigned to the restored DB cluster.
        nargs: -1
    --vpc-security-group-ids=:
        description: A list of VPC security groups that the new DB cluster will belong to.
        nargs: -1
documentation:
    command: |-
        Creates a new DB cluster from a DB snapshot or DB cluster snapshot.

        If a DB snapshot is specified, the target DB cluster is created from the source DB snapshot with a default configuration and default security group.

        If a DB cluster snapshot is specified, the target DB cluster is created from the source DB cluster restore point with the same configuration as the original source DB cluster, except that the new DB cluster is created with the default security group.
    flag:
        availability-zones: Provides the list of EC2 Availability Zones that instances in the restored DB cluster can be created in.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        copy-tags-to-snapshot: '*If set to `true`, tags are copied to any snapshot of the restored DB cluster that is created.*'
        database-name: Not supported.
        db-cluster-identifier: |-
            The name of the DB cluster to create from the DB snapshot or DB cluster snapshot. This parameter isn't case-sensitive.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens
            - First character must be a letter
            - Cannot end with a hyphen or contain two consecutive hyphens

            Example: `my-snapshot-id`
        db-cluster-parameter-group-name: |-
            The name of the DB cluster parameter group to associate with the new DB cluster.

            Constraints:

            - If supplied, must match the name of an existing DBClusterParameterGroup.
        db-subnet-group-name: |-
            The name of the DB subnet group to use for the new DB cluster.

            Constraints: If supplied, must match the name of an existing DBSubnetGroup.

            Example: `mySubnetgroup`
        deletion-protection: A value that indicates whether the DB cluster has deletion protection enabled. The database can't be deleted when deletion protection is enabled. By default, deletion protection is disabled.
        enable-cloudwatch-logs-exports: The list of logs that the restored DB cluster is to export to Amazon CloudWatch Logs.
        enable-iam-database-authentication: |-
            True to enable mapping of Amazon Identity and Access Management (IAM) accounts to database accounts, and otherwise false.

            Default: `false`
        engine: |-
            The database engine to use for the new DB cluster.

            Default: The same as source

            Constraint: Must be compatible with the engine of the source
        engine-version: The version of the database engine to use for the new DB cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-id: |-
            The Amazon KMS key identifier to use when restoring an encrypted DB cluster from a DB snapshot or DB cluster snapshot.

            The KMS key identifier is the Amazon Resource Name (ARN) for the KMS encryption key. If you are restoring a DB cluster with the same Amazon account that owns the KMS encryption key used to encrypt the new DB cluster, then you can use the KMS key alias instead of the ARN for the KMS encryption key.

            If you do not specify a value for the `KmsKeyId` parameter, then the following will occur:

            - If the DB snapshot or DB cluster snapshot in `SnapshotIdentifier` is encrypted, then the restored DB cluster is encrypted using the KMS key that was used to encrypt the DB snapshot or DB cluster snapshot.
            - If the DB snapshot or DB cluster snapshot in `SnapshotIdentifier` is not encrypted, then the restored DB cluster is not encrypted.
        option-group-name: '*(Not supported by Neptune)*'
        port: |-
            The port number on which the new DB cluster accepts connections.

            Constraints: Value must be `1150-65535`

            Default: The same port as the original DB cluster.
        serverless-v2-scaling-configuration: |-
            Contains the scaling configuration of a Neptune Serverless DB cluster.

            For more information, see [Using Amazon Neptune Serverless](https://docs.aws.amazon.com/neptune/latest/userguide/neptune-serverless-using.html) in the *Amazon Neptune User Guide*.
        snapshot-identifier: |-
            The identifier for the DB snapshot or DB cluster snapshot to restore from.

            You can use either the name or the Amazon Resource Name (ARN) to specify a DB cluster snapshot. However, you can use only the ARN to specify a DB snapshot.

            Constraints:

            - Must match the identifier of an existing Snapshot.
        storage-type: |-
            Specifies the storage type to be associated with the DB cluster.

            Valid values: `standard`, `iopt1`

            Default: `standard`
        tags: The tags to be assigned to the restored DB cluster.
        vpc-security-group-ids: A list of VPC security groups that the new DB cluster will belong to.
