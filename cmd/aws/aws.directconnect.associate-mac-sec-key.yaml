name: associate-mac-sec-key
description: Associates a MAC Security (MACsec) Connection Key Name (CKN)/ Connectivity Association Key (CAK) pair with a Direct Connect connection.
flags:
    --cak=: The MAC Security (MACsec) CAK to associate with the connection.
    --ckn=: The MAC Security (MACsec) CKN to associate with the connection.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connection-id=!: The ID of the dedicated connection (dxcon-xxxx), interconnect (dxcon-xxxx), or LAG (dxlag-xxxx).
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --secret-arn=: The Amazon Resource Name (ARN) of the MAC Security (MACsec) secret key to associate with the connection.
documentation:
    command: |-
        Associates a MAC Security (MACsec) Connection Key Name (CKN)/ Connectivity Association Key (CAK) pair with a Direct Connect connection.

        You must supply either the `secretARN,` or the CKN/CAK (`ckn` and `cak`) pair in the request.

        For information about MAC Security (MACsec) key considerations, see [MACsec pre-shared CKN/CAK key considerations](https://docs.aws.amazon.com/directconnect/latest/UserGuide/direct-connect-mac-sec-getting-started.html#mac-sec-key-consideration) in the *Direct Connect User Guide*.
    flag:
        cak: |-
            The MAC Security (MACsec) CAK to associate with the connection.

            You can create the CKN/CAK pair using an industry standard tool.

            The valid values are 64 hexadecimal characters (0-9, A-E).

            If you use this request parameter, you must use the `ckn` request parameter and not use the `secretARN` request parameter.
        ckn: |-
            The MAC Security (MACsec) CKN to associate with the connection.

            You can create the CKN/CAK pair using an industry standard tool.

            The valid values are 64 hexadecimal characters (0-9, A-E).

            If you use this request parameter, you must use the `cak` request parameter and not use the `secretARN` request parameter.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connection-id: |-
            The ID of the dedicated connection (dxcon-xxxx), interconnect (dxcon-xxxx), or LAG (dxlag-xxxx).

            You can use [DescribeConnections](), [DescribeInterconnects](), or [DescribeLags]() to retrieve connection ID.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        secret-arn: |-
            The Amazon Resource Name (ARN) of the MAC Security (MACsec) secret key to associate with the connection.

            You can use [DescribeConnections]() or [DescribeLags]() to retrieve the MAC Security (MACsec) secret key.

            If you use this request parameter, you do not use the `ckn` and `cak` request parameters.
