name: delete
description: Delete a Memorystore for Redis Cluster backup.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup-collection=: The name of the Redis cluster backup collection.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Redis region of the backup.
documentation:
    command: |
        Delete a Memorystore for Redis Cluster backup.

        This command can fail for the following reasons:
          * The backup specified does not exist.
          * The active account does not have permission to access the given
            backup.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup-collection: |-
            The name of the Redis cluster backup collection.
            +
            To set the `backup-collection` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--backup-collection` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Redis region of the backup. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
