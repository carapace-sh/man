name: add
description: Create a new membership in an existing group.
flags:
    --expiration=: Optional time of expiration for the membership.
    --group-email=!: The email address of the group the new membership is being added to.
    --member-email=!: The email address of the group or user being added to a group.
    --roles=: A comma-separated list of roles for a member within the Group.
documentation:
    command: Create a new membership in an existing group.
    flag:
        expiration: |-
            Optional time of expiration for the membership. This is given as a duration from now, for
            example '30d', '6m', '3y' for 30 days, 6 months, or 3 years respectively.
        group-email: The email address of the group the new membership is being added to.
        member-email: The email address of the group or user being added to a group.
        roles: |-
            A comma-separated list of roles for a member within the Group. If not specified,
            MEMBER will be used as a default value.
