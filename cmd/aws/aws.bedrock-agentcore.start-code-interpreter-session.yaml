name: start-code-interpreter-session
description: Creates and initializes a code interpreter session in Amazon Bedrock.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --code-interpreter-identifier=!: The unique identifier of the code interpreter to use for this session.
    --name=: The name of the code interpreter session.
    --session-timeout-seconds=: The time in seconds after which the session automatically terminates if there is no activity.
    --trace-id=: The trace identifier for request tracking.
    --trace-parent=: The parent trace information for distributed tracing.
documentation:
    command: |-
        Creates and initializes a code interpreter session in Amazon Bedrock. The session enables agents to execute code as part of their response generation, supporting programming languages such as Python for data analysis, visualization, and computation tasks.

        To create a session, you must specify a code interpreter identifier and a name. The session remains active until it times out or you explicitly stop it using the `StopCodeInterpreterSession` operation.

        The following operations are related to `StartCodeInterpreterSession`:

        - [InvokeCodeInterpreter](https://docs.aws.amazon.com/API_InvokeCodeInterpreter.html)
        - [GetCodeInterpreterSession](https://docs.aws.amazon.com/API_GetCodeInterpreterSession.html)
        - [StopCodeInterpreterSession](https://docs.aws.amazon.com/API_StopCodeInterpreterSession.html)
    flag:
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. This parameter helps prevent the creation of duplicate sessions if there are temporary network issues.
        code-interpreter-identifier: The unique identifier of the code interpreter to use for this session. This identifier specifies which code interpreter environment to initialize for the session.
        name: The name of the code interpreter session. This name helps you identify and manage the session. The name does not need to be unique.
        session-timeout-seconds: The time in seconds after which the session automatically terminates if there is no activity. The default value is 900 seconds (15 minutes). The minimum allowed value is 60 seconds, and the maximum allowed value is 28800 seconds (8 hours).
        trace-id: The trace identifier for request tracking.
        trace-parent: The parent trace information for distributed tracing.
