name: update-trusted-token-issuer
description: Updates the name of the trusted token issuer, or the path of a source attribute or destination attribute for a trusted token issuer configuration.
flags:
    --name=: Specifies the updated name to be applied to the trusted token issuer configuration.
    --trusted-token-issuer-arn=!: Specifies the ARN of the trusted token issuer configuration that you want to update.
    --trusted-token-issuer-configuration=: Specifies a structure with settings to apply to the specified trusted token issuer.
documentation:
    command: |-
        Updates the name of the trusted token issuer, or the path of a source attribute or destination attribute for a trusted token issuer configuration.

        Updating this trusted token issuer configuration might cause users to lose access to any applications that are configured to use the trusted token issuer.
    flag:
        name: Specifies the updated name to be applied to the trusted token issuer configuration.
        trusted-token-issuer-arn: Specifies the ARN of the trusted token issuer configuration that you want to update.
        trusted-token-issuer-configuration: Specifies a structure with settings to apply to the specified trusted token issuer. The settings that you can provide are determined by the type of the trusted token issuer that you are updating.
