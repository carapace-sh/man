name: delete-workspace-service-account
description: Deletes a workspace service account from the workspace.
flags:
    --service-account-id=!: The ID of the service account to delete.
    --workspace-id=!: The ID of the workspace where the service account resides.
documentation:
    command: |-
        Deletes a workspace service account from the workspace.

        This will delete any tokens created for the service account, as well. If the tokens are currently in use, the will fail to authenticate / authorize after they are deleted.

        Service accounts are only available for workspaces that are compatible with Grafana version 9 and above.
    flag:
        service-account-id: The ID of the service account to delete.
        workspace-id: The ID of the workspace where the service account resides.
