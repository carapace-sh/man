name: list-projects
description: Lists Amazon DataZone projects.
flags:
    --domain-identifier=!: The identifier of the Amazon DataZone domain.
    --group-identifier=: The identifier of a group.
    --max-results=: The maximum number of projects to return in a single call to `ListProjects`.
    --name=: The name of the project.
    --next-token=: When the number of projects is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of projects, the response includes a pagination token named `NextToken`.
    --user-identifier=: The identifier of the Amazon DataZone user.
documentation:
    command: Lists Amazon DataZone projects.
    flag:
        domain-identifier: The identifier of the Amazon DataZone domain.
        group-identifier: The identifier of a group.
        max-results: The maximum number of projects to return in a single call to `ListProjects`. When the number of projects to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `ListProjects` to list the next set of projects.
        name: The name of the project.
        next-token: When the number of projects is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of projects, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `ListProjects` to list the next set of projects.
        user-identifier: The identifier of the Amazon DataZone user.
