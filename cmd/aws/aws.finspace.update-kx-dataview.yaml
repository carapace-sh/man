name: update-kx-dataview
description: Updates the specified dataview.
flags:
    --changeset-id=: A unique identifier for the changeset.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: A token that ensures idempotency.
    --database-name=!: The name of the database.
    --dataview-name=!: The name of the dataview that you want to update.
    --description=: The description for a dataview.
    --environment-id=!: A unique identifier for the kdb environment, where you want to update the dataview.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --segment-configurations=:
        description: The configuration that contains the database path of the data that you want to place on each selected volume.
        nargs: -1
documentation:
    command: Updates the specified dataview. The dataviews get automatically updated when any new changesets are ingested. Each update of the dataview creates a new version, including changeset details and cache configurations
    flag:
        changeset-id: A unique identifier for the changeset.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        database-name: The name of the database.
        dataview-name: The name of the dataview that you want to update.
        description: The description for a dataview.
        environment-id: A unique identifier for the kdb environment, where you want to update the dataview.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        segment-configurations: The configuration that contains the database path of the data that you want to place on each selected volume. Each segment must have a unique database path for each volume. If you do not explicitly specify any database path for a volume, they are accessible from the cluster through the default S3/object store segment.
