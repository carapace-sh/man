name: update-pool
description: Updates the configuration of an existing pool.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deletion-protection-enabled: When set to true the pool can't be deleted.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-deletion-protection-enabled: When set to true the pool can't be deleted.
    --no-self-managed-opt-outs-enabled: By default this is set to false.
    --no-shared-routes-enabled: Indicates whether shared routes are enabled for the pool.
    --no-two-way-enabled: By default this is set to false.
    --opt-out-list-name=: The OptOutList to associate with the pool.
    --pool-id=!: The unique identifier of the pool to update.
    --self-managed-opt-outs-enabled: By default this is set to false.
    --shared-routes-enabled: Indicates whether shared routes are enabled for the pool.
    --two-way-channel-arn=: The Amazon Resource Name (ARN) of the two way channel.
    --two-way-channel-role=: An optional IAM Role Arn for a service to assume, to be able to post inbound SMS messages.
    --two-way-enabled: By default this is set to false.
documentation:
    command: Updates the configuration of an existing pool. You can update the opt-out list, enable or disable two-way messaging, change the `TwoWayChannelArn`, enable or disable self-managed opt-outs, enable or disable deletion protection, and enable or disable shared routes.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deletion-protection-enabled: When set to true the pool can't be deleted.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        opt-out-list-name: |-
            The OptOutList to associate with the pool. Valid values are either OptOutListName or OptOutListArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        pool-id: |-
            The unique identifier of the pool to update. Valid values are either the PoolId or PoolArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        self-managed-opt-outs-enabled: By default this is set to false. When set to false and an end recipient sends a message that begins with HELP or STOP to one of your dedicated numbers, End User MessagingSMS automatically replies with a customizable message and adds the end recipient to the OptOutList. When set to true you're responsible for responding to HELP and STOP requests. You're also responsible for tracking and honoring opt-out requests.
        shared-routes-enabled: Indicates whether shared routes are enabled for the pool.
        two-way-channel-arn: The Amazon Resource Name (ARN) of the two way channel.
        two-way-channel-role: An optional IAM Role Arn for a service to assume, to be able to post inbound SMS messages.
        two-way-enabled: By default this is set to false. When set to true you can receive incoming text messages from your end recipients.
