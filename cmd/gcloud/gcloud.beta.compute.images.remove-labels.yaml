name: remove-labels
description: '*(BETA)*  Remove labels from Google Compute Engine images.'
flags:
    --all: Remove all labels from the resource.
    --labels=: A comma-separated list of label keys to remove from the resource.
    --no-all&: Remove all labels from the resource.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute images remove-labels* removes labels from a Google Compute Engine image.
    flag:
        all: Remove all labels from the resource.
        labels: A comma-separated list of label keys to remove from the resource.
        no-all: Remove all labels from the resource.
