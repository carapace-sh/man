name: add-interconnect
description: '*(BETA)*  Add interconnect to a Compute Engine wire group.'
flags:
    --cross-site-network=!: Name of the crossSiteNetwork to operate on.
    --endpoint-label=!: The endpoint label for the wire group.
    --interconnect-label=!: The interconnect label for the wire group endpoint.
    --interconnect=!: The interconnect for the wire group endpoint.
    --vlan-tags=!: The vlan tags for the interconnect on the wire group endpoint.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute interconnects wire-groups add-interconnect* is used to add interconnects to a wire group.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        cross-site-network: Name of the crossSiteNetwork to operate on.
        endpoint-label: The endpoint label for the wire group.
        interconnect: The interconnect for the wire group endpoint.
        interconnect-label: The interconnect label for the wire group endpoint.
        vlan-tags: The vlan tags for the interconnect on the wire group endpoint.
