name: describe
description: '*(ALPHA)*  Describe a long-running operation.'
flags:
    --location=: Certificate Manager location.
documentation:
    command: |
        *(ALPHA)*  Describe a Certificate Manager long-running operation.

        ## EXAMPLES

        To describe an operation with name simple-operation, run:

          $ gcloud alpha certificate-manager operations describe simple-operation
    flag:
        location: |-
            Certificate Manager location.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * default value of location is [global].
