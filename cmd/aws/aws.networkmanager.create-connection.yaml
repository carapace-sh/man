name: create-connection
description: Creates a connection between two devices.
flags:
    --connected-device-id=!: The ID of the second device in the connection.
    --connected-link-id=: The ID of the link for the second device.
    --description=: A description of the connection.
    --device-id=!: The ID of the first device in the connection.
    --global-network-id=!: The ID of the global network.
    --link-id=: The ID of the link for the first device.
    --tags=: The tags to apply to the resource during creation.
documentation:
    command: Creates a connection between two devices. The devices can be a physical or virtual appliance that connects to a third-party appliance in a VPC, or a physical appliance that connects to another physical appliance in an on-premises network.
    flag:
        connected-device-id: The ID of the second device in the connection.
        connected-link-id: The ID of the link for the second device.
        description: |-
            A description of the connection.

            Length Constraints: Maximum length of 256 characters.
        device-id: The ID of the first device in the connection.
        global-network-id: The ID of the global network.
        link-id: The ID of the link for the first device.
        tags: The tags to apply to the resource during creation.
