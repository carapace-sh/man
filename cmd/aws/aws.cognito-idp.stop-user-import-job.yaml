name: stop-user-import-job
description: Instructs your user pool to stop a running job that's importing users from a CSV file that contains their usernames and attributes.
flags:
    --job-id=!: The ID of a running user import job.
    --user-pool-id=!: The ID of the user pool that you want to stop.
documentation:
    command: Instructs your user pool to stop a running job that's importing users from a CSV file that contains their usernames and attributes. For more information about importing users from a CSV file, see [Importing users from a CSV file](https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-using-import-tool.html).
    flag:
        job-id: The ID of a running user import job.
        user-pool-id: The ID of the user pool that you want to stop.
