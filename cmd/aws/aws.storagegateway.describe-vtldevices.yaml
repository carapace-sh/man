name: describe-vtldevices
description: Returns a description of virtual tape library (VTL) devices for the specified tape gateway.
flags:
    --gateway-arn=!: ""
    --limit=: Specifies that the number of VTL devices described be limited to the specified number.
    --marker=: An opaque string that indicates the position at which to begin describing the VTL devices.
    --vtldevice-arns=: An array of strings, where each string represents the Amazon Resource Name (ARN) of a VTL device.
documentation:
    command: |-
        Returns a description of virtual tape library (VTL) devices for the specified tape gateway. In the response, Storage Gateway returns VTL device information.

        This operation is only supported in the tape gateway type.
    flag:
        gateway-arn: ""
        limit: Specifies that the number of VTL devices described be limited to the specified number.
        marker: An opaque string that indicates the position at which to begin describing the VTL devices.
        vtldevice-arns: |-
            An array of strings, where each string represents the Amazon Resource Name (ARN) of a VTL device.

            All of the specified VTL devices must be from the same gateway. If no VTL devices are specified, the result will contain all devices on the specified gateway.
