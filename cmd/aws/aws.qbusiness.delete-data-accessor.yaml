name: delete-data-accessor
description: Deletes a specified data accessor.
flags:
    --application-id=!: The unique identifier of the Amazon Q Business application.
    --data-accessor-id=!: The unique identifier of the data accessor to delete.
documentation:
    command: Deletes a specified data accessor. This operation permanently removes the data accessor and its associated IAM Identity Center application. Any access granted to the ISV through this data accessor will be revoked.
    flag:
        application-id: The unique identifier of the Amazon Q Business application.
        data-accessor-id: The unique identifier of the data accessor to delete.
