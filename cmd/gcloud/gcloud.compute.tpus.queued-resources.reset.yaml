name: reset
description: Reset a Queued Resource.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --zone=: The compute/zone of the Cloud TPU.
documentation:
    command: |
        Reset an existing Queued Resource.

        To get a list of Queued Resources for resetting, run:

          $ gcloud compute tpus queued-resources list
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        zone: |-
            The compute/zone of the Cloud TPU.
            +
            If not specified, will use `default` compute/zone.
            +

            To set the `zone` attribute:
            * provide the argument `queued_resource` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
