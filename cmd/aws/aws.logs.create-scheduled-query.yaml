name: create-scheduled-query
description: Creates a new Scheduled Query that runs CloudWatch Logs Insights queries on a schedule and delivers results to specified destinations.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: An optional description for the scheduled query to help identify its purpose.
    --destination-configuration=: Configuration for destinations where the query results will be delivered after successful execution.
    --execution-role-arn=!: The Amazon Resource Name (ARN) of the IAM role that CloudWatch Logs will assume to execute the scheduled query and deliver results to the specified destinations.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --log-group-identifiers=:
        description: The log group identifiers to query.
        nargs: -1
    --name=!: A unique name for the scheduled query within the region for an AWS account.
    --query-language=!: The query language to use for the scheduled query.
    --query-string=!: The CloudWatch Logs Insights query string to execute.
    --schedule-end-time=: The end time for the query schedule in Unix epoch time (seconds since January 1, 1970, 00:00:00 UTC).
    --schedule-expression=!: A cron expression that defines when the scheduled query runs.
    --schedule-start-time=: The start time for the query schedule in Unix epoch time (seconds since January 1, 1970, 00:00:00 UTC).
    --start-time-offset=: Time offset in seconds from the execution time for the start of the query time range.
    --state=: The initial state of the scheduled query.
    --tags=: An optional list of key-value pairs to associate with the resource.
    --timezone=: The timezone in which the schedule expression is evaluated.
completion:
    flag:
        query-language:
            - CWLI
            - SQL
            - PPL
        state:
            - ENABLED
            - DISABLED
documentation:
    command: Creates a new Scheduled Query that runs CloudWatch Logs Insights queries on a schedule and delivers results to specified destinations.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: An optional description for the scheduled query to help identify its purpose.
        destination-configuration: Configuration for destinations where the query results will be delivered after successful execution. You can configure delivery to S3 buckets or EventBridge event buses.
        execution-role-arn: The Amazon Resource Name (ARN) of the IAM role that CloudWatch Logs will assume to execute the scheduled query and deliver results to the specified destinations.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        log-group-identifiers: The log group identifiers to query. You can specify log group names or log group ARNs. If querying log groups in a source account from a monitoring account, you must specify the ARN of the log group.
        name: A unique name for the scheduled query within the region for an AWS account. The name can contain letters, numbers, underscores, hyphens, forward slashes, periods, and hash symbols.
        query-language: The query language to use for the scheduled query. Valid values are LogsQL (CloudWatch Logs Insights query language), PPL (OpenSearch Service Piped Processing Language), and SQL (OpenSearch Service Structured Query Language).
        query-string: The CloudWatch Logs Insights query string to execute. This is the actual query that will be run against your log data on the specified schedule.
        schedule-end-time: The end time for the query schedule in Unix epoch time (seconds since January 1, 1970, 00:00:00 UTC). If not specified, the schedule runs indefinitely.
        schedule-expression: 'A cron expression that defines when the scheduled query runs. The format is cron(fields) where fields consist of six space-separated values: minutes, hours, day\_of\_month, month, day\_of\_week, year.'
        schedule-start-time: The start time for the query schedule in Unix epoch time (seconds since January 1, 1970, 00:00:00 UTC). If not specified, the schedule starts immediately.
        start-time-offset: Time offset in seconds from the execution time for the start of the query time range. This defines the lookback period for the query (for example, 3600 for the last hour).
        state: The initial state of the scheduled query. Valid values are ENABLED (the query will run according to its schedule) and DISABLED (the query is paused and will not run). If not provided, defaults to ENABLED.
        tags: |-
            An optional list of key-value pairs to associate with the resource.

            For more information about tagging, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html)
        timezone: The timezone in which the schedule expression is evaluated. If not provided, defaults to UTC.
