name: create-vpc
description: Creates a VPC with the specified CIDR blocks.
flags:
    --amazon-provided-ipv6-cidr-block: Requests an Amazon-provided IPv6 CIDR block with a /56 prefix length for the VPC.
    --cidr-block=: The IPv4 network range for the VPC, in CIDR notation.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --instance-tenancy=: The tenancy options for instances launched into the VPC.
    --ipv4-ipam-pool-id=: The ID of an IPv4 IPAM pool you want to use for allocating this VPC's CIDR.
    --ipv4-netmask-length=: The netmask length of the IPv4 CIDR you want to allocate to this VPC from an Amazon VPC IP Address Manager (IPAM) pool.
    --ipv6-cidr-block-network-border-group=: The name of the location from which we advertise the IPV6 CIDR block.
    --ipv6-cidr-block=: The IPv6 CIDR block from the IPv6 address pool.
    --ipv6-ipam-pool-id=: The ID of an IPv6 IPAM pool which will be used to allocate this VPC an IPv6 CIDR.
    --ipv6-netmask-length=: The netmask length of the IPv6 CIDR you want to allocate to this VPC from an Amazon VPC IP Address Manager (IPAM) pool.
    --ipv6-pool=: The ID of an IPv6 address pool from which to allocate the IPv6 CIDR block.
    --no-amazon-provided-ipv6-cidr-block&: Requests an Amazon-provided IPv6 CIDR block with a /56 prefix length for the VPC.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --tag-specifications=: The tags to assign to the VPC.
completion:
    flag:
        instance-tenancy:
            - default
            - dedicated
            - host
documentation:
    command: |-
        Creates a VPC with the specified CIDR blocks.

        A VPC must have an associated IPv4 CIDR block. You can choose an IPv4 CIDR block or an IPAM-allocated IPv4 CIDR block. You can optionally associate an IPv6 CIDR block with a VPC. You can choose an IPv6 CIDR block, an Amazon-provided IPv6 CIDR block, an IPAM-allocated IPv6 CIDR block, or an IPv6 CIDR block that you brought to Amazon Web Services. For more information, see [IP addressing for your VPCs and subnets](https://docs.aws.amazon.com/vpc/latest/userguide/vpc-ip-addressing.html) in the *Amazon VPC User Guide*.

        By default, each instance that you launch in the VPC has the default DHCP options, which include only a default DNS server that we provide (AmazonProvidedDNS). For more information, see [DHCP option sets](https://docs.aws.amazon.com/vpc/latest/userguide/VPC_DHCP_Options.html) in the *Amazon VPC User Guide*.

        You can specify DNS options and tenancy for a VPC when you create it. You can't change the tenancy of a VPC after you create it. For more information, see [VPC configuration options](https://docs.aws.amazon.com/vpc/latest/userguide/create-vpc-options.html) in the *Amazon VPC User Guide*.
    flag:
        amazon-provided-ipv6-cidr-block: Requests an Amazon-provided IPv6 CIDR block with a /56 prefix length for the VPC. You cannot specify the range of IP addresses, or the size of the CIDR block.
        cidr-block: The IPv4 network range for the VPC, in CIDR notation. For example, `10.0.0.0/16`. We modify the specified CIDR block to its canonical form; for example, if you specify `100.68.0.18/18`, we modify it to `100.68.0.0/18`.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        instance-tenancy: |-
            The tenancy options for instances launched into the VPC. For `default`, instances are launched with shared tenancy by default. You can launch instances with any tenancy into a shared tenancy VPC. For `dedicated`, instances are launched as dedicated tenancy instances by default. You can only launch instances with a tenancy of `dedicated` or `host` into a dedicated tenancy VPC.

            **Important:** The `host` value cannot be used with this parameter. Use the `default` or `dedicated` values only.

            Default: `default`
        ipv4-ipam-pool-id: The ID of an IPv4 IPAM pool you want to use for allocating this VPC's CIDR. For more information, see [What is IPAM?](https://docs.aws.amazon.com/vpc/latest/ipam/what-is-it-ipam.html) in the *Amazon VPC IPAM User Guide*.
        ipv4-netmask-length: The netmask length of the IPv4 CIDR you want to allocate to this VPC from an Amazon VPC IP Address Manager (IPAM) pool. For more information about IPAM, see [What is IPAM?](https://docs.aws.amazon.com/vpc/latest/ipam/what-is-it-ipam.html) in the *Amazon VPC IPAM User Guide*.
        ipv6-cidr-block: |-
            The IPv6 CIDR block from the IPv6 address pool. You must also specify `Ipv6Pool` in the request.

            To let Amazon choose the IPv6 CIDR block for you, omit this parameter.
        ipv6-cidr-block-network-border-group: |-
            The name of the location from which we advertise the IPV6 CIDR block. Use this parameter to limit the address to this location.

            You must set `AmazonProvidedIpv6CidrBlock` to `true` to use this parameter.
        ipv6-ipam-pool-id: The ID of an IPv6 IPAM pool which will be used to allocate this VPC an IPv6 CIDR. IPAM is a VPC feature that you can use to automate your IP address management workflows including assigning, tracking, troubleshooting, and auditing IP addresses across Amazon Web Services Regions and accounts throughout your Amazon Web Services Organization. For more information, see [What is IPAM?](https://docs.aws.amazon.com/vpc/latest/ipam/what-is-it-ipam.html) in the *Amazon VPC IPAM User Guide*.
        ipv6-netmask-length: The netmask length of the IPv6 CIDR you want to allocate to this VPC from an Amazon VPC IP Address Manager (IPAM) pool. For more information about IPAM, see [What is IPAM?](https://docs.aws.amazon.com/vpc/latest/ipam/what-is-it-ipam.html) in the *Amazon VPC IPAM User Guide*.
        ipv6-pool: The ID of an IPv6 address pool from which to allocate the IPv6 CIDR block.
        tag-specifications: The tags to assign to the VPC.
