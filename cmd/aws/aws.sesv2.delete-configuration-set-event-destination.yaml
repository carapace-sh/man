name: delete-configuration-set-event-destination
description: Delete an event destination.
flags:
    --configuration-set-name=!: The name of the configuration set that contains the event destination to delete.
    --event-destination-name=!: The name of the event destination to delete.
documentation:
    command: |-
        Delete an event destination.

        *Events* include message sends, deliveries, opens, clicks, bounces, and complaints. *Event destinations* are places that you can send information about these events to. For example, you can send event data to Amazon EventBridge and associate a rule to send the event to the specified target.
    flag:
        configuration-set-name: The name of the configuration set that contains the event destination to delete.
        event-destination-name: The name of the event destination to delete.
