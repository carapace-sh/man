name: update-distribution-bundle
description: Updates the bundle of your Amazon Lightsail content delivery network (CDN) distribution.
flags:
    --bundle-id=: The bundle ID of the new bundle to apply to your distribution.
    --distribution-name=: The name of the distribution for which to update the bundle.
documentation:
    command: |-
        Updates the bundle of your Amazon Lightsail content delivery network (CDN) distribution.

        A distribution bundle specifies the monthly network transfer quota and monthly cost of your distribution.

        Update your distribution's bundle if your distribution is going over its monthly network transfer quota and is incurring an overage fee.

        You can update your distribution's bundle only one time within your monthly Amazon Web Services billing cycle. To determine if you can update your distribution's bundle, use the `GetDistributions` action. The `ableToUpdateBundle` parameter in the result will indicate whether you can currently update your distribution's bundle.
    flag:
        bundle-id: |-
            The bundle ID of the new bundle to apply to your distribution.

            Use the `GetDistributionBundles` action to get a list of distribution bundle IDs that you can specify.
        distribution-name: |-
            The name of the distribution for which to update the bundle.

            Use the `GetDistributions` action to get a list of distribution names that you can specify.
