name: create
description: '*(ALPHA)*  Creates a remediation intent resource.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --finding-name=: Canonical name of the SCC finding
    --no-async&: Return immediately, without waiting for the operation in progress to
    --parent=!: The parent resource to create the remediation intent under.
    --workflow-type=!: Type of the workflow to be created.
completion:
    flag:
        workflow-type:
            - semi-autonomous
            - manual
documentation:
    command: |-
        *(ALPHA)*  Create a Cloud Security Command Center (SCC)
        RemediationIntent resource.
        Created resource is returned as the response of the command.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *False*.
        finding-name: |-
            Canonical name of the SCC finding
                   Format: projects/{proj_id}/sources/{src_id}/locations/{loc_id}/findings/{finding_id}
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        parent: |-
            The parent resource to create the remediation intent under.
                   Format: organizations/{org_id}/locations/{loc_id}
        workflow-type: 'Type of the workflow to be created. _WORKFLOW_TYPE_ must be one of: *semi-autonomous*, *manual*.'
