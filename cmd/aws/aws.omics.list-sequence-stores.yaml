name: list-sequence-stores
description: Retrieves a list of sequence stores and returns each sequence store's metadata.
flags:
    --filter=: A filter to apply to the list.
    --max-results=: The maximum number of stores to return in one page of results.
    --next-token=: Specify the pagination token from a previous request to retrieve the next page of results.
documentation:
    command: |-
        Retrieves a list of sequence stores and returns each sequence store's metadata.

        For more information, see [Creating a HealthOmics sequence store](https://docs.aws.amazon.com/omics/latest/dev/create-sequence-store.html) in the *Amazon Web Services HealthOmics User Guide*.
    flag:
        filter: A filter to apply to the list.
        max-results: The maximum number of stores to return in one page of results.
        next-token: Specify the pagination token from a previous request to retrieve the next page of results.
