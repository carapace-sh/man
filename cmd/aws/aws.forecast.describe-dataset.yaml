name: describe-dataset
description: Describes an Amazon Forecast dataset created using the [CreateDataset](https://docs.aws.amazon.com/forecast/latest/dg/API_CreateDataset.html) operation.
flags:
    --dataset-arn=!: The Amazon Resource Name (ARN) of the dataset.
documentation:
    command: |-
        Describes an Amazon Forecast dataset created using the [CreateDataset](https://docs.aws.amazon.com/forecast/latest/dg/API_CreateDataset.html) operation.

        In addition to listing the parameters specified in the `CreateDataset` request, this operation includes the following dataset properties:

        - `CreationTime`
        - `LastModificationTime`
        - `Status`
    flag:
        dataset-arn: The Amazon Resource Name (ARN) of the dataset.
