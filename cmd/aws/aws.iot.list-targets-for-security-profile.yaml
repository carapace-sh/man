name: list-targets-for-security-profile
description: Lists the targets (thing groups) associated with a given Device Defender security profile.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The token for the next set of results.
    --security-profile-name=!: The security profile.
documentation:
    command: |-
        Lists the targets (thing groups) associated with a given Device Defender security profile.

        Requires permission to access the [ListTargetsForSecurityProfile](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at one time.
        next-token: The token for the next set of results.
        security-profile-name: The security profile.
