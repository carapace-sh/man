name: get-bots
description: |-
    Returns bot information as follows:

    - If you provide the `nameContains` field, the response includes information for the `$LATEST` version of all bots whose name contains the specified string.
flags:
    --max-results=: The maximum number of bots to return in the response that the request will return.
    --name-contains=: Substring to match in bot names.
    --next-token=: A pagination token that fetches the next page of bots.
documentation:
    command: |-
        Returns bot information as follows:

        - If you provide the `nameContains` field, the response includes information for the `$LATEST` version of all bots whose name contains the specified string.
        - If you don't specify the `nameContains` field, the operation returns information about the `$LATEST` version of all of your bots.

        This operation requires permission for the `lex:GetBots` action.
    flag:
        max-results: The maximum number of bots to return in the response that the request will return. The default is 10.
        name-contains: Substring to match in bot names. A bot will be returned if any part of its name matches the substring. For example, "xyz" matches both "xyzabc" and "abcxyz."
        next-token: A pagination token that fetches the next page of bots. If the response to this call is truncated, Amazon Lex returns a pagination token in the response. To fetch the next page of bots, specify the pagination token in the next request.
