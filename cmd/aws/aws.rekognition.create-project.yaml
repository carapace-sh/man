name: create-project
description: Creates a new Amazon Rekognition project.
flags:
    --auto-update=: Specifies whether automatic retraining should be attempted for the versions of the project.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --feature=: Specifies feature that is being customized.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --project-name=!: The name of the project to create.
    --tags=: A set of tags (key-value pairs) that you want to attach to the project.
completion:
    flag:
        auto-update:
            - ENABLED
            - DISABLED
        feature:
            - CONTENT_MODERATION
            - CUSTOM_LABELS
documentation:
    command: Creates a new Amazon Rekognition project. A project is a group of resources (datasets, model versions) that you use to create and manage a Amazon Rekognition Custom Labels Model or custom adapter. You can specify a feature to create the project with, if no feature is specified then Custom Labels is used by default. For adapters, you can also choose whether or not to have the project auto update by using the AutoUpdate argument. This operation requires permissions to perform the `rekognition:CreateProject` action.
    flag:
        auto-update: Specifies whether automatic retraining should be attempted for the versions of the project. Automatic retraining is done as a best effort. Required argument for Content Moderation. Applicable only to adapters.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        feature: Specifies feature that is being customized. If no value is provided CUSTOM\_LABELS is used as a default.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        project-name: The name of the project to create.
        tags: A set of tags (key-value pairs) that you want to attach to the project.
