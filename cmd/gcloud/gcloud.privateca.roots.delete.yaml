name: delete
description: Delete a Root Certificate Authority.
flags:
    --ignore-active-certificates: If this flag is set, the Certificate Authority will be deleted even if the Certificate Authority has un-revoked or un-expired certificates after the grace period.
    --ignore-dependent-resources: This field skips the integrity check that would normally prevent breaking a CA Pool if it is used by another cloud resource and allows the CA Pool to be in a state where it is not able to issue certificates.
    --location=: The location of the CERTIFICATE_AUTHORITY.
    --no-ignore-active-certificates&: If this flag is set, the Certificate Authority will be deleted even if the Certificate Authority has un-revoked or un-expired certificates after the grace period.
    --no-ignore-dependent-resources&: This field skips the integrity check that would normally prevent breaking a CA Pool if it is used by another cloud resource and allows the CA Pool to be in a state where it is not able to issue certificates.
    --no-skip-grace-period&: If this flag is set, the Certificate Authority will be deleted as soon as possible without a 30-day grace period where undeletion would have been allowed.
    --pool=: The parent CA Pool of the CERTIFICATE_AUTHORITY.
    --skip-grace-period: If this flag is set, the Certificate Authority will be deleted as soon as possible without a 30-day grace period where undeletion would have been allowed.
documentation:
    command: |-
        Delete a Root Certificate Authority. Deleted Root Certificate Authorities
        may be recovered with the `gcloud privateca roots undelete` command within a grace
        period of 30 days.

        Use the --skip-grace-period flag to delete as soon as possible without the
        30-day grace period to undelete.

        Note that any user-managed KMS keys or Google Cloud Storage buckets
        will not be affected by this operation. You will need to delete the user-
        managed resources separately once the CA is deleted. Any Google-managed
        resources will be cleaned up.

        The CA specified in this command MUST:

          1) be in the DISABLED or STAGED state.
          2) have no un-revoked or un-expired certificates. Use the revoke command
             to revoke any active certificates.

        Use the `--ignore-active-certificates` flag to remove 2) as a requirement.

        ## EXAMPLES

        To delete a root CA:

          $ gcloud privateca roots delete prod-root --pool=my-pool --location=us-west1

        To delete a CA while skipping the confirmation
        input:

          $ gcloud privateca roots delete prod-root --pool=my-pool --location=us-west1 --quiet

        To undo the deletion for a root CA:

          $ gcloud privateca roots undelete prod-root --pool=my-pool --location=us-west1
    flag:
        ignore-active-certificates: If this flag is set, the Certificate Authority will be deleted even if the Certificate Authority has un-revoked or un-expired certificates after the grace period.
        ignore-dependent-resources: This field skips the integrity check that would normally prevent breaking a CA Pool if it is used by another cloud resource and allows the CA Pool to be in a state where it is not able to issue certificates. Doing so may result in unintended and unrecoverable effects on any dependent resource(s) since the CA Pool would not be able to issue certificates.
        location: |-
            The location of the CERTIFICATE_AUTHORITY.
            +
            To set the `location` attribute:
            * provide the argument `CERTIFICATE_AUTHORITY` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `privateca/location`.
        no-ignore-active-certificates: If this flag is set, the Certificate Authority will be deleted even if the Certificate Authority has un-revoked or un-expired certificates after the grace period.
        no-ignore-dependent-resources: This field skips the integrity check that would normally prevent breaking a CA Pool if it is used by another cloud resource and allows the CA Pool to be in a state where it is not able to issue certificates. Doing so may result in unintended and unrecoverable effects on any dependent resource(s) since the CA Pool would not be able to issue certificates.
        no-skip-grace-period: If this flag is set, the Certificate Authority will be deleted as soon as possible without a 30-day grace period where undeletion would have been allowed. If you proceed, there will be no way to recover this CA.
        pool: |-
            The parent CA Pool of the CERTIFICATE_AUTHORITY.
            +
            To set the `pool` attribute:
            * provide the argument `CERTIFICATE_AUTHORITY` on the command line with a fully specified name;
            * provide the argument `--pool` on the command line.
        skip-grace-period: If this flag is set, the Certificate Authority will be deleted as soon as possible without a 30-day grace period where undeletion would have been allowed. If you proceed, there will be no way to recover this CA.
