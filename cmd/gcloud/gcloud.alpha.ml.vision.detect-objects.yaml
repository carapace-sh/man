name: detect-objects
description: '*(ALPHA)*  Detect and extract multiple objects in an image with object localization.'
flags:
    --model-version=: Model version to use for the feature.
completion:
    flag:
        model-version:
            - builtin/latest
            - builtin/stable
documentation:
    command: |
        *(ALPHA)*  Detect and extract multiple objects in an image with object localization.

        Object localization identifies multiple objects in an image
        and provides a LocalizedObjectAnnotation for each object in the image.
    flag:
        model-version: 'Model version to use for the feature. _MODEL_VERSION_ must be one of: *builtin/latest*, *builtin/stable*.'
