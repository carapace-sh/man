name: modify-db-cluster
description: Modify a setting for a DB cluster.
flags:
    --allow-major-version-upgrade: A value that indicates whether upgrades between different major versions are allowed.
    --apply-immediately: A value that specifies whether the modifications in this request and any pending modifications are asynchronously applied as soon as possible, regardless of the `PreferredMaintenanceWindow` setting for the DB cluster.
    --backup-retention-period=: The number of days for which automated backups are retained.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cloudwatch-logs-export-configuration=: The configuration setting for the log types to be enabled for export to CloudWatch Logs for a specific DB cluster.
    --copy-tags-to-snapshot: '*If set to `true`, tags are copied to any snapshot of the DB cluster that is created.*'
    --db-cluster-identifier=!: The DB cluster identifier for the cluster being modified.
    --db-cluster-parameter-group-name=: The name of the DB cluster parameter group to use for the DB cluster.
    --db-instance-parameter-group-name=: The name of the DB parameter group to apply to all instances of the DB cluster.
    --deletion-protection: A value that indicates whether the DB cluster has deletion protection enabled.
    --enable-iam-database-authentication: True to enable mapping of Amazon Identity and Access Management (IAM) accounts to database accounts, and otherwise false.
    --engine-version=: The version number of the database engine to which you want to upgrade.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --master-user-password=: Not supported by Neptune.
    --new-db-cluster-identifier=: The new DB cluster identifier for the DB cluster when renaming a DB cluster.
    --no-allow-major-version-upgrade: A value that indicates whether upgrades between different major versions are allowed.
    --no-apply-immediately: A value that specifies whether the modifications in this request and any pending modifications are asynchronously applied as soon as possible, regardless of the `PreferredMaintenanceWindow` setting for the DB cluster.
    --no-copy-tags-to-snapshot: '*If set to `true`, tags are copied to any snapshot of the DB cluster that is created.*'
    --no-deletion-protection: A value that indicates whether the DB cluster has deletion protection enabled.
    --no-enable-iam-database-authentication: True to enable mapping of Amazon Identity and Access Management (IAM) accounts to database accounts, and otherwise false.
    --option-group-name=: '*Not supported by Neptune.*'
    --port=: The port number on which the DB cluster accepts connections.
    --preferred-backup-window=: The daily time range during which automated backups are created if automated backups are enabled, using the `BackupRetentionPeriod` parameter.
    --preferred-maintenance-window=: The weekly time range during which system maintenance can occur, in Universal Coordinated Time (UTC).
    --serverless-v2-scaling-configuration=: Contains the scaling configuration of a Neptune Serverless DB cluster.
    --storage-type=: The storage type to associate with the DB cluster.
    --vpc-security-group-ids=:
        description: A list of VPC security groups that the DB cluster will belong to.
        nargs: -1
documentation:
    command: Modify a setting for a DB cluster. You can change one or more database configuration parameters by specifying these parameters and the new values in the request.
    flag:
        allow-major-version-upgrade: |-
            A value that indicates whether upgrades between different major versions are allowed.

            Constraints: You must set the allow-major-version-upgrade flag when providing an `EngineVersion` parameter that uses a different major version than the DB cluster's current version.
        apply-immediately: |-
            A value that specifies whether the modifications in this request and any pending modifications are asynchronously applied as soon as possible, regardless of the `PreferredMaintenanceWindow` setting for the DB cluster. If this parameter is set to `false`, changes to the DB cluster are applied during the next maintenance window.

            The `ApplyImmediately` parameter only affects `NewDBClusterIdentifier` values. If you set the `ApplyImmediately` parameter value to false, then changes to `NewDBClusterIdentifier` values are applied during the next maintenance window. All other changes are applied immediately, regardless of the value of the `ApplyImmediately` parameter.

            Default: `false`
        backup-retention-period: |-
            The number of days for which automated backups are retained. You must specify a minimum value of 1.

            Default: 1

            Constraints:

            - Must be a value from 1 to 35
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cloudwatch-logs-export-configuration: The configuration setting for the log types to be enabled for export to CloudWatch Logs for a specific DB cluster. See [Using the CLI to publish Neptune audit logs to CloudWatch Logs](https://docs.aws.amazon.com/neptune/latest/userguide/cloudwatch-logs.html#cloudwatch-logs-cli).
        copy-tags-to-snapshot: '*If set to `true`, tags are copied to any snapshot of the DB cluster that is created.*'
        db-cluster-identifier: |-
            The DB cluster identifier for the cluster being modified. This parameter is not case-sensitive.

            Constraints:

            - Must match the identifier of an existing DBCluster.
        db-cluster-parameter-group-name: The name of the DB cluster parameter group to use for the DB cluster.
        db-instance-parameter-group-name: |-
            The name of the DB parameter group to apply to all instances of the DB cluster.

            When you apply a parameter group using `DBInstanceParameterGroupName`, parameter changes aren't applied during the next maintenance window but instead are applied immediately.

            Default: The existing name setting

            Constraints:

            - The DB parameter group must be in the same DB parameter group family as the target DB cluster version.
            - The `DBInstanceParameterGroupName` parameter is only valid in combination with the `AllowMajorVersionUpgrade` parameter.
        deletion-protection: A value that indicates whether the DB cluster has deletion protection enabled. The database can't be deleted when deletion protection is enabled. By default, deletion protection is disabled.
        enable-iam-database-authentication: |-
            True to enable mapping of Amazon Identity and Access Management (IAM) accounts to database accounts, and otherwise false.

            Default: `false`
        engine-version: |-
            The version number of the database engine to which you want to upgrade. Changing this parameter results in an outage. The change is applied during the next maintenance window unless the `ApplyImmediately` parameter is set to true.

            For a list of valid engine versions, see [Engine Releases for Amazon Neptune](https://docs.aws.amazon.com/neptune/latest/userguide/engine-releases.html), or call [DescribeDBEngineVersions]().
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        master-user-password: Not supported by Neptune.
        new-db-cluster-identifier: |-
            The new DB cluster identifier for the DB cluster when renaming a DB cluster. This value is stored as a lowercase string.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens
            - The first character must be a letter
            - Cannot end with a hyphen or contain two consecutive hyphens

            Example: `my-cluster2`
        option-group-name: '*Not supported by Neptune.*'
        port: |-
            The port number on which the DB cluster accepts connections.

            Constraints: Value must be `1150-65535`

            Default: The same port as the original DB cluster.
        preferred-backup-window: |-
            The daily time range during which automated backups are created if automated backups are enabled, using the `BackupRetentionPeriod` parameter.

            The default is a 30-minute window selected at random from an 8-hour block of time for each Amazon Region.

            Constraints:

            - Must be in the format `hh24:mi-hh24:mi`.
            - Must be in Universal Coordinated Time (UTC).
            - Must not conflict with the preferred maintenance window.
            - Must be at least 30 minutes.
        preferred-maintenance-window: |-
            The weekly time range during which system maintenance can occur, in Universal Coordinated Time (UTC).

            Format: `ddd:hh24:mi-ddd:hh24:mi`

            The default is a 30-minute window selected at random from an 8-hour block of time for each Amazon Region, occurring on a random day of the week.

            Valid Days: Mon, Tue, Wed, Thu, Fri, Sat, Sun.

            Constraints: Minimum 30-minute window.
        serverless-v2-scaling-configuration: |-
            Contains the scaling configuration of a Neptune Serverless DB cluster.

            For more information, see [Using Amazon Neptune Serverless](https://docs.aws.amazon.com/neptune/latest/userguide/neptune-serverless-using.html) in the *Amazon Neptune User Guide*.
        storage-type: "The storage type to associate with the DB cluster.\n\nValid Values:\n\n- **`standard`**   –   ( *the default* ) Configures cost-effective database storage for applications with moderate to small I/O usage.\n- **`iopt1`**   –   Enables [I/O-Optimized storage](https://docs.aws.amazon.com/neptune/latest/userguide/storage-types.html#provisioned-iops-storage) that's designed to meet the needs of I/O-intensive graph workloads that require predictable pricing with low I/O latency and consistent I/O throughput.\n  \n  Neptune I/O-Optimized storage is only available starting with engine release 1.3.0.0."
        vpc-security-group-ids: A list of VPC security groups that the DB cluster will belong to.
