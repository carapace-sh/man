name: create-service
description: Create an App Runner service.
flags:
    --auto-scaling-configuration-arn=: The Amazon Resource Name (ARN) of an App Runner automatic scaling configuration resource that you want to associate with your service.
    --encryption-configuration=: An optional custom encryption key that App Runner uses to encrypt the copy of your source repository that it maintains and your service logs.
    --health-check-configuration=: The settings for the health check that App Runner performs to monitor the health of the App Runner service.
    --instance-configuration=: The runtime configuration of instances (scaling units) of your service.
    --network-configuration=: Configuration settings related to network traffic of the web application that the App Runner service runs.
    --observability-configuration=: The observability configuration of your service.
    --service-name=!: A name for the App Runner service.
    --source-configuration=!: The source to deploy to the App Runner service.
    --tags=: An optional list of metadata items that you can associate with the App Runner service resource.
documentation:
    command: |-
        Create an App Runner service. After the service is created, the action also automatically starts a deployment.

        This is an asynchronous operation. On a successful call, you can use the returned `OperationId` and the [ListOperations](https://docs.aws.amazon.com/apprunner/latest/api/API_ListOperations.html) call to track the operation's progress.
    flag:
        auto-scaling-configuration-arn: |-
            The Amazon Resource Name (ARN) of an App Runner automatic scaling configuration resource that you want to associate with your service. If not provided, App Runner associates the latest revision of a default auto scaling configuration.

            Specify an ARN with a name and a revision number to associate that revision. For example: `arn:aws:apprunner:us-east-1:123456789012:autoscalingconfiguration/high-availability/3`

            Specify just the name to associate the latest revision. For example: `arn:aws:apprunner:us-east-1:123456789012:autoscalingconfiguration/high-availability`
        encryption-configuration: An optional custom encryption key that App Runner uses to encrypt the copy of your source repository that it maintains and your service logs. By default, App Runner uses an Amazon Web Services managed key.
        health-check-configuration: The settings for the health check that App Runner performs to monitor the health of the App Runner service.
        instance-configuration: The runtime configuration of instances (scaling units) of your service.
        network-configuration: Configuration settings related to network traffic of the web application that the App Runner service runs.
        observability-configuration: The observability configuration of your service.
        service-name: A name for the App Runner service. It must be unique across all the running App Runner services in your Amazon Web Services account in the Amazon Web Services Region.
        source-configuration: The source to deploy to the App Runner service. It can be a code or an image repository.
        tags: An optional list of metadata items that you can associate with the App Runner service resource. A tag is a key-value pair.
