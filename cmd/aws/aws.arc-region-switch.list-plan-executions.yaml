name: list-plan-executions
description: Lists the executions of a Region switch plan.
flags:
    --max-results=: The number of objects that you want to return with this call.
    --next-token=: Specifies that you want to receive the next page of results.
    --plan-arn=!: The ARN for the plan.
    --state=: The state of the plan execution.
completion:
    flag:
        state:
            - inProgress
            - pausedByFailedStep
            - pausedByOperator
            - completed
            - completedWithExceptions
            - canceled
            - planExecutionTimedOut
            - pendingManualApproval
            - failed
            - pending
            - completedMonitoringApplicationHealth
documentation:
    command: Lists the executions of a Region switch plan. This operation returns information about both current and historical executions.
    flag:
        max-results: The number of objects that you want to return with this call.
        next-token: Specifies that you want to receive the next page of results. Valid only if you received a `nextToken` response in the previous request. If you did, it indicates that more output is available. Set this parameter to the value provided by the previous call's `nextToken` response to request the next page of results.
        plan-arn: The ARN for the plan.
        state: The state of the plan execution. For example, the plan execution might be In Progress.
