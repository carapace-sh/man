name: create-policy
description: Creates an IoT policy.
flags:
    --policy-document=!: The JSON document that describes the policy.
    --policy-name=!: The policy name.
    --tags=: Metadata which can be used to manage the policy.
documentation:
    command: |-
        Creates an IoT policy.

        The created policy is the default version for the policy. This operation creates a policy version with a version identifier of **1** and sets **1** as the policy's default version.

        Requires permission to access the [CreatePolicy](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        policy-document: The JSON document that describes the policy. **policyDocument** must have a minimum length of 1, with a maximum length of 2048, excluding whitespace.
        policy-name: The policy name.
        tags: |-
            Metadata which can be used to manage the policy.

            For URI Request parameters use format: ...key1=value1&amp;key2=value2...

            For the CLI command-line parameter use format: &amp;&amp;tags "key1=value1&amp;key2=value2..."

            For the cli-input-json file use format: "tags": "key1=value1&amp;key2=value2..."
