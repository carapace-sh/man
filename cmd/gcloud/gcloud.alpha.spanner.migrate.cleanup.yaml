name: cleanup
description: '*(ALPHA)*  Cleanup migration resources given a data migration job id.'
flags:
    --data-shard-ids=: Relevant to sharded migrations.
    --dataflow: Cleanup dataflow resource(s).
    --datastream: Cleanup datastream resource(s).
    --job-id=!: The job Id of an existing migration job.
    --log-level=: To configure the log level for the execution (INFO, VERBOSE).
    --monitoring: Cleanup monitoring dashboard(s).
    --no-dataflow&: Cleanup dataflow resource(s).
    --no-datastream&: Cleanup datastream resource(s).
    --no-monitoring&: Cleanup monitoring dashboard(s).
    --no-pub-sub&: Cleanup pubsub resource(s).
    --no-show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --pub-sub: Cleanup pubsub resource(s).
    --show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --target-profile=!: Flag for specifying connection profile for target database (e.g., "dialect=postgresql)".
