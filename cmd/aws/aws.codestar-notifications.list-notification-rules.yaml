name: list-notification-rules
description: Returns a list of the notification rules for an Amazon Web Services account.
flags:
    --filters=: The filters to use to return information by service or resource type.
    --max-results=: A non-negative integer used to limit the number of returned results.
    --next-token=: An enumeration token that, when provided in a request, returns the next batch of the results.
documentation:
    command: Returns a list of the notification rules for an Amazon Web Services account.
    flag:
        filters: |-
            The filters to use to return information by service or resource type. For valid values, see [ListNotificationRulesFilter]().

            A filter with the same name can appear more than once when used with OR statements. Filters with different names should be applied with AND statements.
        max-results: A non-negative integer used to limit the number of returned results. The maximum number of results that can be returned is 100.
        next-token: An enumeration token that, when provided in a request, returns the next batch of the results.
