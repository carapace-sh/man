name: create
description: Create a Looker instance.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --class-type=: The class type of the Looker instance.
    --consumer-network=!: The network name within the consumer project.
    --deny-maintenance-period-end-date=!: 'End date of the deny maintenance period in format: YYYY-MM-DD'
    --deny-maintenance-period-start-date=!: 'Start date of the deny maintenance period in format: YYYY-MM-DD'
    --deny-maintenance-period-time=!: Time in UTC when the period starts and ends.
    --edition=!: The edition of the Looker instance.
    --fips-enabled: This specifies whether FIPS is enabled on the Looker instance.
    --kms-key=: ID of the key or fully qualified identifier for the key.
    --maintenance-window-day=!: Day of week for maintenance window, in UTC time zone.
    --maintenance-window-time=!: Hour of day for maintenance window, in UTC time zone.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-fips-enabled&: This specifies whether FIPS is enabled on the Looker instance.
    --no-private-ip-enabled!&: This specifies whether private IP (PSA) is enabled on the Looker instance.
    --no-psc-enabled!&: This specifies whether Private Service Connect (PSC) is enabled on the Looker instance.
    --no-public-ip-enabled&: This specifies whether public IP is enabled on the Looker instance.
    --oauth-client-id=!: The client ID from an external OAuth application.
    --oauth-client-secret=!: The client secret from an external OAuth application.
    --private-ip-enabled!: This specifies whether private IP (PSA) is enabled on the Looker instance.
    --psc-allowed-vpcs=: List of VPCs that are allowed ingress into the Looker instance.
    --psc-enabled!: This specifies whether Private Service Connect (PSC) is enabled on the Looker instance.
    --public-ip-enabled: This specifies whether public IP is enabled on the Looker instance.
    --region=: The name of the Looker region of the instance.
    --reserved-range=: The name of a reserved IP address range within the consumer network to be used for private
completion:
    flag:
        class-type:
            - p1
            - r1
        edition:
            - core-embed-annual
            - core-enterprise-annual
            - core-standard
            - core-standard-annual
            - core-trial
            - core-trial-embed
            - core-trial-enterprise
            - core-trial-standard
            - nonprod-core-embed-annual
            - nonprod-core-enterprise-annual
            - nonprod-core-standard-annual
        maintenance-window-day:
            - friday
            - monday
            - saturday
            - sunday
            - thursday
            - tuesday
            - wednesday
documentation:
    command: |
        Create a new Looker instance.

        This command can fail for the following reasons:
          * An instance with the same name already exists.
          * The active account does not have permission to create instances.
          * `--async` flag is not passed
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        class-type: 'The class type of the Looker instance. _CLASS_TYPE_ must be one of: *p1*, *r1*.'
        consumer-network: The network name within the consumer project. This MUST be delared if enabling private IP.
        deny-maintenance-period-end-date: 'End date of the deny maintenance period in format: YYYY-MM-DD'
        deny-maintenance-period-start-date: 'Start date of the deny maintenance period in format: YYYY-MM-DD'
        deny-maintenance-period-time: |-
            Time in UTC when the period starts and ends.  A valid time of day must be
            specified in 24hr format (ex: 13:00, 17:30, 23:45).
        edition: |-
            The edition of the Looker instance. _EDITION_ must be one of:
            +
            *core-embed-annual*::: A Looker (Google Cloud core) product for deploying and maintaining external analytics and
            custom applications at scale. This can be purchased via an annual contract.
            +
            *core-enterprise-annual*::: A Looker (Google Cloud core) product with enhanced security features for a wide variety of
            internal BI and analytics use cases. This can be purchased via an annual contract.
            +
            *core-standard*::: A Looker (Google Cloud core) product for small organizations or teams with fewer than 50
            users. This will be billed monthly while the instance is active.
            +
            *core-standard-annual*::: A Looker (Google Cloud core) product for small organizations or teams with fewer than 50
            users. This can be purchased via an annual contract.
            +
            *core-trial*::: Trial edition of Looker.
            +
            *core-trial-embed*::: An embed trial edition of Looker (Google Cloud core) product.
            +
            *core-trial-enterprise*::: An enterprise trial edition of Looker (Google Cloud core) product.
            +
            *core-trial-standard*::: A standard trial edition of Looker (Google Cloud core) product.
            +
            *nonprod-core-embed-annual*::: A non-production edition of Looker (Google Cloud core) product for deploying and maintaining external analytics and
            custom applications at scale. This can be purchased via an annual contract.
            +
            *nonprod-core-enterprise-annual*::: A non-production edition of Looker (Google Cloud core) product with enhanced security features for a wide variety of
            internal BI and analytics use cases. This can be purchased via an annual contract.
            +
            *nonprod-core-standard-annual*::: A non-production edition of Looker (Google Cloud core) product for small organizations or teams with fewer than 50
            users. This can be purchased via an annual contract.
            +
            :::
            +
        fips-enabled: This specifies whether FIPS is enabled on the Looker instance.
        kms-key: |-
            ID of the key or fully qualified identifier for the key. To
            set the *kms-key* attribute:
            * provide the argument *--kms-key* on the command line.
        maintenance-window-day: 'Day of week for maintenance window, in UTC time zone. _MAINTENANCE_WINDOW_DAY_ must be one of: *friday*, *monday*, *saturday*, *sunday*, *thursday*, *tuesday*, *wednesday*.'
        maintenance-window-time: |-
            Hour of day for maintenance window, in UTC time zone. A valid time of day must be
            specified in 24hr format (ex: 13:00, 17:30, 23:45). Maintenance will be scheduled
            within 60 minutes.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-fips-enabled: |
            This specifies whether FIPS is enabled on the Looker instance.
        no-private-ip-enabled: |
            This specifies whether private IP (PSA) is enabled on the Looker instance.
            This flag is for creating a PSA (Private Service Access) instance.
        no-psc-enabled: |
            This specifies whether Private Service Connect (PSC) is enabled on the Looker instance.
        no-public-ip-enabled: |
            This specifies whether public IP is enabled on the Looker instance.
        oauth-client-id: |-
            The client ID from an external OAuth application.
            +
            OAuth Application Credentials - Looker Instance OAuth login settings. Setup an OAuth
            app that will allow users to authenticate and access the instance. For more
            information see: https://developers.google.com/identity/protocols/oauth2/web-server#creatingcred
        oauth-client-secret: |-
            The client secret from an external OAuth application.
            +
            OAuth Application Credentials - Looker Instance OAuth login settings. Setup an OAuth
            app that will allow users to authenticate and access the instance. For more
            information see: https://developers.google.com/identity/protocols/oauth2/web-server#creatingcred
        private-ip-enabled: |-
            This specifies whether private IP (PSA) is enabled on the Looker instance.
            This flag is for creating a PSA (Private Service Access) instance.
        psc-allowed-vpcs: List of VPCs that are allowed ingress into the Looker instance.
        psc-enabled: This specifies whether Private Service Connect (PSC) is enabled on the Looker instance.
        public-ip-enabled: This specifies whether public IP is enabled on the Looker instance. Enabled by default, use *--no-public-ip-enabled* to disable.
        region: |-
            The name of the Looker region of the instance. Overrides the default
            looker/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `looker/region`.
        reserved-range: |-
            The name of a reserved IP address range within the consumer network to be used for private
            service access connection.
