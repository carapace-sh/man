name: revert
description: '*(BETA)*  Revert a Filestore instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location of the Filestore instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --target-snapshot=!: Name of the Filestore snapshot to revert to.
documentation:
    command: |
        *(BETA)*  Revert a Filestore instance to the target snapshot.

        This command can fail for the following reasons:
          * The target snapshot does not exist.
          * The active account does not have permission to revert the instance.
          * The service tier of the instance does not support the operation.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location of the Filestore instance.
            +

            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `filestore/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        target-snapshot: Name of the Filestore snapshot to revert to.
