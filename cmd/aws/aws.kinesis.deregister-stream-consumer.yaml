name: deregister-stream-consumer
description: To deregister a consumer, provide its ARN.
flags:
    --consumer-arn=: The ARN returned by Kinesis Data Streams when you registered the consumer.
    --consumer-name=: The name that you gave to the consumer.
    --stream-arn=: The ARN of the Kinesis data stream that the consumer is registered with.
documentation:
    command: |-
        To deregister a consumer, provide its ARN. Alternatively, you can provide the ARN of the data stream and the name you gave the consumer when you registered it. You may also provide all three parameters, as long as they don't conflict with each other. If you don't know the name or ARN of the consumer that you want to deregister, you can use the [ListStreamConsumers]() operation to get a list of the descriptions of all the consumers that are currently registered with a given data stream. The description of a consumer contains its name and ARN.

        This operation has a limit of five transactions per second per stream.
    flag:
        consumer-arn: The ARN returned by Kinesis Data Streams when you registered the consumer. If you don't know the ARN of the consumer that you want to deregister, you can use the ListStreamConsumers operation to get a list of the descriptions of all the consumers that are currently registered with a given data stream. The description of a consumer contains its ARN.
        consumer-name: The name that you gave to the consumer.
        stream-arn: The ARN of the Kinesis data stream that the consumer is registered with. For more information, see [Amazon Resource Names (ARNs) and Amazon Web Services Service Namespaces](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html#arn-syntax-kinesis-streams).
