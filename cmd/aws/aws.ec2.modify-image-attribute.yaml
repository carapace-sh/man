name: modify-image-attribute
description: Modifies the specified attribute of the specified AMI.
flags:
    --attribute=: The name of the attribute to modify.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A new description for the AMI.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --image-id=!: The ID of the AMI.
    --imds-support=: Set to `v2.0` to indicate that IMDSv2 is specified in the AMI.
    --launch-permission=: A new launch permission for the AMI.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --operation-type=: The operation type.
    --organization-arns=:
        description: The Amazon Resource Name (ARN) of an organization.
        nargs: -1
    --organizational-unit-arns=:
        description: The Amazon Resource Name (ARN) of an organizational unit (OU).
        nargs: -1
    --product-codes=:
        description: Not supported.
        nargs: -1
    --user-groups=:
        description: The user groups.
        nargs: -1
    --user-ids=:
        description: The Amazon Web Services account IDs.
        nargs: -1
    --value=: The value of the attribute being modified.
completion:
    flag:
        operation-type:
            - add
            - remove
documentation:
    command: |-
        Modifies the specified attribute of the specified AMI. You can specify only one attribute at a time.

        To specify the attribute, you can use the `Attribute` parameter, or one of the following parameters: `Description`, `ImdsSupport`, or `LaunchPermission`.

        Images with an Amazon Web Services Marketplace product code cannot be made public.

        To enable the SriovNetSupport enhanced networking attribute of an image, enable SriovNetSupport on an instance and create an AMI from the instance.
    flag:
        attribute: |-
            The name of the attribute to modify.

            Valid values: `description` | `imdsSupport` | `launchPermission`
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A new description for the AMI.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        image-id: The ID of the AMI.
        imds-support: |-
            Set to `v2.0` to indicate that IMDSv2 is specified in the AMI. Instances launched from this AMI will have `HttpTokens` automatically set to `required` so that, by default, the instance requires that IMDSv2 is used when requesting instance metadata. In addition, `HttpPutResponseHopLimit` is set to `2`. For more information, see [Configure the AMI](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-IMDS-new-instances.html#configure-IMDS-new-instances-ami-configuration) in the *Amazon EC2 User Guide*.

            Do not use this parameter unless your AMI software supports IMDSv2. After you set the value to `v2.0`, you can't undo it. The only way to “reset” your AMI is to create a new AMI from the underlying snapshot.
        launch-permission: A new launch permission for the AMI.
        operation-type: The operation type. This parameter can be used only when the `Attribute` parameter is `launchPermission`.
        organization-arns: The Amazon Resource Name (ARN) of an organization. This parameter can be used only when the `Attribute` parameter is `launchPermission`.
        organizational-unit-arns: The Amazon Resource Name (ARN) of an organizational unit (OU). This parameter can be used only when the `Attribute` parameter is `launchPermission`.
        product-codes: Not supported.
        user-groups: The user groups. This parameter can be used only when the `Attribute` parameter is `launchPermission`.
        user-ids: The Amazon Web Services account IDs. This parameter can be used only when the `Attribute` parameter is `launchPermission`.
        value: The value of the attribute being modified. This parameter can be used only when the `Attribute` parameter is `description` or `imdsSupport`.
