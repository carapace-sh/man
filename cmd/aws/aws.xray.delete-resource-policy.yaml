name: delete-resource-policy
description: Deletes a resource policy from the target Amazon Web Services account.
flags:
    --policy-name=!: The name of the resource policy to delete.
    --policy-revision-id=: Specifies a specific policy revision to delete.
documentation:
    command: Deletes a resource policy from the target Amazon Web Services account.
    flag:
        policy-name: The name of the resource policy to delete.
        policy-revision-id: Specifies a specific policy revision to delete. Provide a `PolicyRevisionId` to ensure an atomic delete operation. If the provided revision id does not match the latest policy revision id, an `InvalidPolicyRevisionIdException` exception is returned.
