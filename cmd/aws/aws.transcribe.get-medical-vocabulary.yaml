name: get-medical-vocabulary
description: Provides information about the specified custom medical vocabulary.
flags:
    --vocabulary-name=!: The name of the custom medical vocabulary you want information about.
documentation:
    command: |-
        Provides information about the specified custom medical vocabulary.

        To view the status of the specified custom medical vocabulary, check the `VocabularyState` field. If the status is `READY`, your custom vocabulary is available to use. If the status is `FAILED`, `FailureReason` provides details on why your vocabulary failed.

        To get a list of your custom medical vocabularies, use the operation.
    flag:
        vocabulary-name: The name of the custom medical vocabulary you want information about. Custom medical vocabulary names are case sensitive.
