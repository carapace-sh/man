name: get-samlprovider
description: Returns the SAML provider metadocument that was uploaded when the IAM SAML provider resource object was created or updated.
flags:
    --samlprovider-arn=!: The Amazon Resource Name (ARN) of the SAML provider resource object in IAM to get information about.
documentation:
    command: |-
        Returns the SAML provider metadocument that was uploaded when the IAM SAML provider resource object was created or updated.

        This operation requires [Signature Version 4](https://docs.aws.amazon.com/general/latest/gr/signature-version-4.html).
    flag:
        samlprovider-arn: |-
            The Amazon Resource Name (ARN) of the SAML provider resource object in IAM to get information about.

            For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference*.
