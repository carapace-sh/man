name: delete
description: Delete a new association between a firewall policy and an network or folder resource.
flags:
    --firewall-policy-region=: Region of the firewall policy to delete.
    --firewall-policy=!: Firewall policy ID with which to delete association.
    --global-firewall-policy: If set, the firewall policy is global.
    --name=!: Name of the association to delete.
    --no-global-firewall-policy&: If set, the firewall policy is global.
documentation:
    command: |-
        *gcloud compute network-firewall-policies associations delete* is used to delete network firewall policy associations. An
        network firewall policy is a set of rules that controls access to various
        resources.
    flag:
        firewall-policy: Firewall policy ID with which to delete association.
        firewall-policy-region: Region of the firewall policy to delete. Overrides the default *compute/region* property value for this command invocation.
        global-firewall-policy: If set, the firewall policy is global.
        name: Name of the association to delete.
        no-global-firewall-policy: If set, the firewall policy is global.
