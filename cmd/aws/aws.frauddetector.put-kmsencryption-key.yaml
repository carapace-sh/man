name: put-kmsencryption-key
description: Specifies the KMS key to be used to encrypt content in Amazon Fraud Detector.
flags:
    --kms-encryption-key-arn=!: The KMS encryption key ARN.
documentation:
    command: Specifies the KMS key to be used to encrypt content in Amazon Fraud Detector.
    flag:
        kms-encryption-key-arn: |-
            The KMS encryption key ARN.

            The KMS key must be single-Region key. Amazon Fraud Detector does not support multi-Region KMS key.
