name: get-table
description: Gets details about a table.
flags:
    --name=: The name of the table.
    --namespace=: The name of the namespace the table is associated with.
    --table-arn=: The Amazon Resource Name (ARN) of the table.
    --table-bucket-arn=: The Amazon Resource Name (ARN) of the table bucket associated with the table.
documentation:
    command: |-
        Gets details about a table. For more information, see [S3 Tables](https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-tables.html) in the *Amazon Simple Storage Service User Guide*.

        Permissions

        You must have the `s3tables:GetTable` permission to use this operation.
    flag:
        name: The name of the table.
        namespace: The name of the namespace the table is associated with.
        table-arn: The Amazon Resource Name (ARN) of the table.
        table-bucket-arn: The Amazon Resource Name (ARN) of the table bucket associated with the table.
