name: start-dbcluster
description: Restarts the stopped cluster that is specified by `DBClusterIdentifier`.
flags:
    --dbcluster-identifier=!: The identifier of the cluster to restart.
documentation:
    command: Restarts the stopped cluster that is specified by `DBClusterIdentifier`. For more information, see [Stopping and Starting an Amazon DocumentDB Cluster](https://docs.aws.amazon.com/documentdb/latest/developerguide/db-cluster-stop-start.html).
    flag:
        dbcluster-identifier: 'The identifier of the cluster to restart. Example: `docdb-2019-05-28-15-24-52`'
