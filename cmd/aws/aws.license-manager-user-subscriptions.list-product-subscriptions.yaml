name: list-product-subscriptions
description: Lists the user-based subscription products available from an identity provider.
flags:
    --filters=: 'You can use the following filters to streamline results:'
    --identity-provider=!: An object that specifies details for the identity provider.
    --max-results=: The maximum number of results to return from a single request.
    --next-token=: A token to specify where to start paginating.
    --product=: The name of the user-based subscription product.
documentation:
    command: Lists the user-based subscription products available from an identity provider.
    flag:
        filters: |-
            You can use the following filters to streamline results:

            - Status
            - Username
            - Domain
        identity-provider: An object that specifies details for the identity provider.
        max-results: The maximum number of results to return from a single request.
        next-token: A token to specify where to start paginating. This is the nextToken from a previously truncated response.
        product: |-
            The name of the user-based subscription product.

            Valid values: `VISUAL_STUDIO_ENTERPRISE` | `VISUAL_STUDIO_PROFESSIONAL` | `OFFICE_PROFESSIONAL_PLUS` | `REMOTE_DESKTOP_SERVICES`
