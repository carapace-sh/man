name: create-route
description: Creates a Route for an API.
flags:
    --api-id=!: The API identifier.
    --api-key-required: Specifies whether an API key is required for the route.
    --authorization-scopes=:
        description: The authorization scopes supported by this route.
        nargs: -1
    --authorization-type=: The authorization type for the route.
    --authorizer-id=: The identifier of the Authorizer resource to be associated with this route.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --model-selection-expression=: The model selection expression for the route.
    --no-api-key-required: Specifies whether an API key is required for the route.
    --operation-name=: The operation name for the route.
    --request-models=: The request models for the route.
    --request-parameters=: The request parameters for the route.
    --route-key=!: The route key for the route.
    --route-response-selection-expression=: The route response selection expression for the route.
    --target=: The target for the route.
completion:
    flag:
        authorization-type:
            - NONE
            - AWS_IAM
            - CUSTOM
            - JWT
documentation:
    command: Creates a Route for an API.
    flag:
        api-id: The API identifier.
        api-key-required: Specifies whether an API key is required for the route. Supported only for WebSocket APIs.
        authorization-scopes: The authorization scopes supported by this route.
        authorization-type: The authorization type for the route. For WebSocket APIs, valid values are NONE for open access, AWS\_IAM for using AWS IAM permissions, and CUSTOM for using a Lambda authorizer For HTTP APIs, valid values are NONE for open access, JWT for using JSON Web Tokens, AWS\_IAM for using AWS IAM permissions, and CUSTOM for using a Lambda authorizer.
        authorizer-id: The identifier of the Authorizer resource to be associated with this route. The authorizer identifier is generated by API Gateway when you created the authorizer.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        model-selection-expression: The model selection expression for the route. Supported only for WebSocket APIs.
        operation-name: The operation name for the route.
        request-models: The request models for the route. Supported only for WebSocket APIs.
        request-parameters: The request parameters for the route. Supported only for WebSocket APIs.
        route-key: The route key for the route.
        route-response-selection-expression: The route response selection expression for the route. Supported only for WebSocket APIs.
        target: The target for the route.
