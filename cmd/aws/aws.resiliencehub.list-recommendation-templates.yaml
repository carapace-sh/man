name: list-recommendation-templates
description: Lists the recommendation templates for the Resilience Hub applications.
flags:
    --assessment-arn=: Amazon Resource Name (ARN) of the assessment.
    --max-results=: Maximum number of results to include in the response.
    --name=: The name for one of the listed recommendation templates.
    --next-token=: Null, or the token from a previous call to get the next set of results.
    --recommendation-template-arn=: The Amazon Resource Name (ARN) for a recommendation template.
    --reverse-order=: The default is to sort by ascending **startTime**.
    --status=: Status of the action.
documentation:
    command: Lists the recommendation templates for the Resilience Hub applications.
    flag:
        assessment-arn: 'Amazon Resource Name (ARN) of the assessment. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app-assessment/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        max-results: Maximum number of results to include in the response. If more results exist than the specified `MaxResults` value, a token is included in the response so that the remaining results can be retrieved.
        name: The name for one of the listed recommendation templates.
        next-token: Null, or the token from a previous call to get the next set of results.
        recommendation-template-arn: The Amazon Resource Name (ARN) for a recommendation template.
        reverse-order: The default is to sort by ascending **startTime**. To sort by descending **startTime**, set reverseOrder to `true`.
        status: Status of the action.
