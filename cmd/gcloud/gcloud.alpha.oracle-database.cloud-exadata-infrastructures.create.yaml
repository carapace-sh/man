documentation:
    command: '*(ALPHA)*  Creates a new ExadataInfrastructure.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        display-name: User friendly name for this resource.
        gcp-oracle-zone: |-
            The GCP Oracle zone where Oracle Exadata Infrastructure is hosted.
            Example: us-east4-b-r2.
            If not specified, the system will pick a zone based on availability.
        labels: |-
            Labels or tags associated with the resource.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the cloudExadataInfrastructure resource.
            +
            To set the `location` attribute:
            * provide the argument `cloud_exadata_infrastructure` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        maintenance-window-custom-action-timeout-mins: |-
            Determines the amount of time the system will wait before the start of each
            database server patching operation. Custom action timeout is in minutes and
            valid value is between 15 to 120 (inclusive).
        maintenance-window-days-of-week: |-
            Days during the week when maintenance should be performed. _MAINTENANCE_WINDOW_DAYS_OF_WEEK_ must be one of:
            +
            *friday*::: Friday
            *monday*::: Monday
            *saturday*::: Saturday
            *sunday*::: Sunday
            *thursday*::: Thursday
            *tuesday*::: Tuesday
            *wednesday*::: Wednesday
            :::
            +
        maintenance-window-hours-of-day: |-
            The window of hours during the day when maintenance should be performed.
            The window is a 4 hour slot. Valid values are:
              0 - represents time slot 0:00 - 3:59 UTC
              4 - represents time slot 4:00 - 7:59 UTC
              8 - represents time slot 8:00 - 11:59 UTC
              12 - represents time slot 12:00 - 15:59 UTC
              16 - represents time slot 16:00 - 19:59 UTC
              20 - represents time slot 20:00 - 23:59 UTC
        maintenance-window-is-custom-action-timeout-enabled: |-
            If true, enables the configuration of a custom action timeout (waiting
            period) between database server patching operations.
        maintenance-window-lead-time-week: |-
            Lead time window allows user to set a lead time to prepare for a down time.
            The lead time is in weeks and valid value is between 1 to 4.
        maintenance-window-months: |-
            Months during the year when maintenance should be performed. _MAINTENANCE_WINDOW_MONTHS_ must be one of:
            +
            *april*::: The month of April.
            *august*::: The month of August.
            *december*::: The month of December.
            *february*::: The month of February.
            *january*::: The month of January.
            *july*::: The month of July.
            *june*::: The month of June.
            *march*::: The month of March.
            *may*::: The month of May.
            *november*::: The month of November.
            *october*::: The month of October.
            *september*::: The month of September.
            :::
            +
        maintenance-window-patching-mode: |-
            Cloud CloudExadataInfrastructure node patching method, either "ROLLING"
            or "NONROLLING". Default value is ROLLING. _MAINTENANCE_WINDOW_PATCHING_MODE_ must be (only one value is supported):
            +
            :::
            +
        maintenance-window-preference: |-
            The maintenance window scheduling preference. _MAINTENANCE_WINDOW_PREFERENCE_ must be (only one value is supported):
            +
            :::
            +
        maintenance-window-weeks-of-month: |-
            Weeks during the month when maintenance should be performed. Weeks start on
            the 1st, 8th, 15th, and 22nd days of the month, and have a duration of 7
            days. Weeks start and end based on calendar dates, not days of the week.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-maintenance-window-is-custom-action-timeout-enabled: |-
            If true, enables the configuration of a custom action timeout (waiting
            period) between database server patching operations.
        properties-compute-count: The number of compute servers for the Exadata Infrastructure.
        properties-customer-contacts: |-
            The list of customer contacts.
            +
            *email*:::
            The email address used by Oracle to send notifications regarding databases
            and infrastructure.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --properties-customer-contacts=email=string --properties-customer-contacts=email=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --properties-customer-contacts='[{"email": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --properties-customer-contacts=path_to_file.(yaml|json)
            +
            ```
        properties-shape: |-
            The shape of the Exadata Infrastructure. The shape determines the
            amount of CPU, storage, and memory resources allocated to the instance.
        properties-storage-count: The number of Cloud Exadata storage servers for the Exadata Infrastructure.
        properties-total-storage-size-gb: |-
            The total storage allocated to the Exadata Infrastructure
            resource, in gigabytes (GB).
        request-id: |-
            An optional ID to identify the request. This value is used to identify
            duplicate requests. If you make a request with the same request ID
            and the original request is still in progress or completed, the server
            ignores the second request. This prevents clients from
            accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
