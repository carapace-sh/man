name: describe
description: '*(BETA)*  Get detailed information about a PersistentResource with a given id.'
flags:
    --region=: Cloud region for the persistent resource.
documentation:
    command: |-
        ## EXAMPLES

        To get the persistent resource with the PersistentResource id ``123'' under
        project ``example'' in region ``us-central1'', run:

          $ gcloud beta ai persistent-resources describe 123 --project=example --region=us-central1
    flag:
        region: |-
            Cloud region for the persistent resource.
            +
            To set the `region` attribute:
            * provide the argument `persistent_resource` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
