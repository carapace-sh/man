name: describe-addon-configuration
description: Returns configuration options.
flags:
    --addon-name=!: The name of the add-on.
    --addon-version=!: The version of the add-on.
documentation:
    command: Returns configuration options.
    flag:
        addon-name: The name of the add-on. The name must match one of the names returned by `DescribeAddonVersions`.
        addon-version: The version of the add-on. The version must match one of the versions returned by [`DescribeAddonVersions`](https://docs.aws.amazon.com/eks/latest/APIReference/API_DescribeAddonVersions.html) .
