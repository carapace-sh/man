name: get-instance-tpm-ek-pub
description: Gets the public endorsement key associated with the Nitro Trusted Platform Module (NitroTPM) for the specified instance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Specify this parameter to verify whether the request will succeed, without actually making the request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-id=!: The ID of the instance for which to get the public endorsement key.
    --key-format=!: The required public endorsement key format.
    --key-type=!: The required public endorsement key type.
    --no-dry-run: Specify this parameter to verify whether the request will succeed, without actually making the request.
completion:
    flag:
        key-format:
            - der
            - tpmt
        key-type:
            - rsa-2048
            - ecc-sec-p384
documentation:
    command: Gets the public endorsement key associated with the Nitro Trusted Platform Module (NitroTPM) for the specified instance.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Specify this parameter to verify whether the request will succeed, without actually making the request. If the request will succeed, the response is `DryRunOperation`. Otherwise, the response is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-id: The ID of the instance for which to get the public endorsement key.
        key-format: The required public endorsement key format. Specify `der` for a DER-encoded public key that is compatible with OpenSSL. Specify `tpmt` for a TPM 2.0 format that is compatible with tpm2-tools. The returned key is base64 encoded.
        key-type: The required public endorsement key type.
