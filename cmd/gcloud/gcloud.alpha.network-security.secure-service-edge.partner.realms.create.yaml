name: create
description: '*(ALPHA)*  Create a partner SSE realm.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --partner-network=: Partner network which will support the newly-created realm.
    --sse-pairing-key=!: Customer-provided key which uniquely identifies an unpaired customer realm.
    --vpc-name=: (DEPRECATED) Partner VPC which will support the newly-created realm.
documentation:
    command: |
        *(ALPHA)*  Create a new partner realm which supports the specified customer realm.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `partner_sse_realm` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * location is global by default.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        partner-network: Partner network which will support the newly-created realm.
        sse-pairing-key: Customer-provided key which uniquely identifies an unpaired customer realm.
        vpc-name: |-
            (DEPRECATED) Partner VPC which will support the newly-created realm.
            +
            Flag --vpc-name is deprecated. Use --partner-network instead.
