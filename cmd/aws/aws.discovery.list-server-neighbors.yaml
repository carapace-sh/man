name: list-server-neighbors
description: Retrieves a list of servers that are one network hop away from a specified server.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-id=!: Configuration ID of the server for which neighbors are being listed.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: Maximum number of results to return in a single page of output.
    --neighbor-configuration-ids=:
        description: List of configuration IDs to test for one-hop-away.
        nargs: -1
    --next-token=: Token to retrieve the next set of results.
    --no-port-information-needed: Flag to indicate if port and protocol information is needed as part of the response.
    --port-information-needed: Flag to indicate if port and protocol information is needed as part of the response.
documentation:
    command: Retrieves a list of servers that are one network hop away from a specified server.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-id: Configuration ID of the server for which neighbors are being listed.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: Maximum number of results to return in a single page of output.
        neighbor-configuration-ids: List of configuration IDs to test for one-hop-away.
        next-token: Token to retrieve the next set of results. For example, if you previously specified 100 IDs for `ListServerNeighborsRequest$neighborConfigurationIds` but set `ListServerNeighborsRequest$maxResults` to 10, you received a set of 10 results along with a token. Use that token in this query to get the next set of 10.
        port-information-needed: Flag to indicate if port and protocol information is needed as part of the response.
