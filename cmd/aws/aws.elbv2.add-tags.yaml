name: add-tags
description: Adds the specified tags to the specified Elastic Load Balancing resource.
flags:
    --resource-arns=!: The Amazon Resource Name (ARN) of the resource.
    --tags=!: The tags.
documentation:
    command: |-
        Adds the specified tags to the specified Elastic Load Balancing resource. You can tag your Application Load Balancers, Network Load Balancers, Gateway Load Balancers, target groups, trust stores, listeners, and rules.

        Each tag consists of a key and an optional value. If a resource already has a tag with the same key, `AddTags` updates its value.
    flag:
        resource-arns: The Amazon Resource Name (ARN) of the resource.
        tags: The tags.
