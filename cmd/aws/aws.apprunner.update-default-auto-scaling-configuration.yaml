name: update-default-auto-scaling-configuration
description: Update an auto scaling configuration to be the default.
flags:
    --auto-scaling-configuration-arn=!: The Amazon Resource Name (ARN) of the App Runner auto scaling configuration that you want to set as the default.
documentation:
    command: Update an auto scaling configuration to be the default. The existing default auto scaling configuration will be set to non-default automatically.
    flag:
        auto-scaling-configuration-arn: |-
            The Amazon Resource Name (ARN) of the App Runner auto scaling configuration that you want to set as the default.

            The ARN can be a full auto scaling configuration ARN, or a partial ARN ending with either `.../name` or `.../name/revision`. If a revision isn't specified, the latest active revision is set as the default.
