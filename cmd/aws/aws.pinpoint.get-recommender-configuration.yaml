name: get-recommender-configuration
description: Retrieves information about an Amazon Pinpoint configuration for a recommender model.
flags:
    --recommender-id=!: The unique identifier for the recommender model configuration.
documentation:
    command: Retrieves information about an Amazon Pinpoint configuration for a recommender model.
    flag:
        recommender-id: The unique identifier for the recommender model configuration. This identifier is displayed as the **Recommender ID** on the Amazon Pinpoint console.
