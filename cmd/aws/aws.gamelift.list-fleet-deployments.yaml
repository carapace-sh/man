name: list-fleet-deployments
description: |-
    **This API works with the following fleet types:** Container

    Retrieves a collection of container fleet deployments in an Amazon Web Services Region.
flags:
    --fleet-id=: A unique identifier for the container fleet.
    --limit=: The maximum number of results to return.
    --next-token=: A token that indicates the start of the next sequential page of results.
documentation:
    command: |-
        **This API works with the following fleet types:** Container

        Retrieves a collection of container fleet deployments in an Amazon Web Services Region. Use the pagination parameters to retrieve results as a set of sequential pages.

        **Request options**

        - Get a list of all deployments. Call this operation without specifying a fleet ID.
        - Get a list of all deployments for a fleet. Specify the container fleet ID or ARN value.

        **Results**

        If successful, this operation returns a list of deployments that match the request parameters. A NextToken value is also returned if there are more result pages to retrieve.

        Deployments are returned starting with the latest.
    flag:
        fleet-id: A unique identifier for the container fleet. You can use either the fleet ID or ARN value.
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
