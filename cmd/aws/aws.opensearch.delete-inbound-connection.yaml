name: delete-inbound-connection
description: Allows the destination Amazon OpenSearch Service domain owner to delete an existing inbound cross-cluster search connection.
flags:
    --connection-id=!: The ID of the inbound connection to permanently delete.
documentation:
    command: Allows the destination Amazon OpenSearch Service domain owner to delete an existing inbound cross-cluster search connection. For more information, see [Cross-cluster search for Amazon OpenSearch Service](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cross-cluster-search.html).
    flag:
        connection-id: The ID of the inbound connection to permanently delete.
