name: list-timeline-events
description: Lists timeline events for the specified incident record.
flags:
    --filters=: Filters the timeline events based on the provided conditional values.
    --incident-record-arn=!: The Amazon Resource Name (ARN) of the incident that includes the timeline event.
    --max-results=: The maximum number of results per page.
    --next-token=: The pagination token for the next set of items to return.
    --sort-by=: Sort timeline events by the specified key value pair.
    --sort-order=: Sorts the order of timeline events by the value specified in the `sortBy` field.
completion:
    flag:
        sort-by:
            - EVENT_TIME
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Lists timeline events for the specified incident record.
    flag:
        filters: |-
            Filters the timeline events based on the provided conditional values. You can filter timeline events with the following keys:

            - `eventReference`
            - `eventTime`
            - `eventType`

            Note the following when deciding how to use Filters:

            - If you don't specify a Filter, the response includes all timeline events.
            - If you specify more than one filter in a single request, the response returns timeline events that match all filters.
            - If you specify a filter with more than one value, the response returns timeline events that match any of the values provided.
        incident-record-arn: The Amazon Resource Name (ARN) of the incident that includes the timeline event.
        max-results: The maximum number of results per page.
        next-token: The pagination token for the next set of items to return. (You received this token from a previous call.)
        sort-by: Sort timeline events by the specified key value pair.
        sort-order: Sorts the order of timeline events by the value specified in the `sortBy` field.
