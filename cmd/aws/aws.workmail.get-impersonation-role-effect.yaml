name: get-impersonation-role-effect
description: Tests whether the given impersonation role can impersonate a target user.
flags:
    --impersonation-role-id=!: The impersonation role ID to test.
    --organization-id=!: The WorkMail organization where the impersonation role is defined.
    --target-user=!: The WorkMail organization user chosen to test the impersonation role.
documentation:
    command: Tests whether the given impersonation role can impersonate a target user.
    flag:
        impersonation-role-id: The impersonation role ID to test.
        organization-id: The WorkMail organization where the impersonation role is defined.
        target-user: |-
            The WorkMail organization user chosen to test the impersonation role. The following identity formats are available:

            - User ID: `12345678-1234-1234-1234-123456789012` or `S-1-1-12-1234567890-123456789-123456789-1234`
            - Email address: `user@domain.tld`
            - User name: `user`
