name: list-accounts
description: Lists all AWS accounts assigned to the user.
flags:
    --access-token=!: The token issued by the `CreateToken` API call.
    --max-results=: This is the number of items clients can request per page.
    --next-token=: (Optional) When requesting subsequent pages, this is the page token from the previous response output.
documentation:
    command: Lists all AWS accounts assigned to the user. These AWS accounts are assigned by the administrator of the account. For more information, see [Assign User Access](https://docs.aws.amazon.com/singlesignon/latest/userguide/useraccess.html#assignusers) in the *IAM Identity Center User Guide*. This operation returns a paginated response.
    flag:
        access-token: The token issued by the `CreateToken` API call. For more information, see [CreateToken](https://docs.aws.amazon.com/singlesignon/latest/OIDCAPIReference/API_CreateToken.html) in the *IAM Identity Center OIDC API Reference Guide*.
        max-results: This is the number of items clients can request per page.
        next-token: (Optional) When requesting subsequent pages, this is the page token from the previous response output.
