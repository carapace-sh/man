name: batch-get-prepared-statement
description: Returns the details of a single prepared statement or a list of up to 256 prepared statements for the array of prepared statement names that you provide.
flags:
    --prepared-statement-names=!: A list of prepared statement names to return.
    --work-group=!: The name of the workgroup to which the prepared statements belong.
documentation:
    command: Returns the details of a single prepared statement or a list of up to 256 prepared statements for the array of prepared statement names that you provide. Requires you to have access to the workgroup to which the prepared statements belong. If a prepared statement cannot be retrieved for the name specified, the statement is listed in `UnprocessedPreparedStatementNames`.
    flag:
        prepared-statement-names: A list of prepared statement names to return.
        work-group: The name of the workgroup to which the prepared statements belong.
