name: create
description: '*(ALPHA)*  Create a rollout sequence resource.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --display-name=: Display name of the rollout sequence to be created (optional).
    --labels=: Labels for the rollout sequence.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --stage-config=!: Path to the YAML file containing the stage configurations.
documentation:
    command: '*(ALPHA)*  Create a rollout sequence resource.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        display-name: Display name of the rollout sequence to be created (optional).
        labels: Labels for the rollout sequence.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        stage-config: |-
            Path to the YAML file containing the stage configurations. The YAML
            file should contain a list of stages. Fleet projects and soak_duration are required.
            If label_selector is not specified, there is no filtering.
            A fleet project is the project where the fleet is hosted.
            Example:
            +
            ```yaml
            - stage:
              fleet-projects:
              # Expected format: projects/{project}
              - projects/my-dev-project
              soak-duration: 604800s # 7 days
            - stage:
              fleet-projects:
              - projects/my-prod-project
              soak-duration: 604800s # 7 days
              label-selector: resource.labels.canary=='true'
            - stage:
              fleet-projects:
              # Expected format: projects/{project}
              - projects/my-prod-project
              soak-duration: 604800s # 7 days
              ```
            +
            Use a full or relative path to a local file containing the value of stage_config.
