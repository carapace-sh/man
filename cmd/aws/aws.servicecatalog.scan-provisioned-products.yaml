name: scan-provisioned-products
description: Lists the provisioned products that are available (not terminated).
flags:
    --accept-language=: The language code.
    --access-level-filter=: The access level to use to obtain results.
    --page-size=: The maximum number of items to return with this call.
    --page-token=: The page token for the next set of results.
documentation:
    command: |-
        Lists the provisioned products that are available (not terminated).

        To use additional filtering, see [SearchProvisionedProducts]().
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        access-level-filter: The access level to use to obtain results. The default is `User`.
        page-size: The maximum number of items to return with this call.
        page-token: The page token for the next set of results. To retrieve the first set of results, use null.
