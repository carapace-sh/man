name: get-relational-database-metric-data
description: Returns the data points of the specified metric for a database in Amazon Lightsail.
flags:
    --end-time=!: The end of the time interval from which to get metric data.
    --metric-name=!: The metric for which you want to return information.
    --period=!: The granularity, in seconds, of the returned data points.
    --relational-database-name=!: The name of your database from which to get metric data.
    --start-time=!: The start of the time interval from which to get metric data.
    --statistics=!: The statistic for the metric.
    --unit=!: The unit for the metric data request.
completion:
    flag:
        metric-name:
            - CPUUtilization
            - DatabaseConnections
            - DiskQueueDepth
            - FreeStorageSpace
            - NetworkReceiveThroughput
            - NetworkTransmitThroughput
        unit:
            - Seconds
            - Microseconds
            - Milliseconds
            - Bytes
            - Kilobytes
            - Megabytes
            - Gigabytes
            - Terabytes
            - Bits
            - Kilobits
            - Megabits
            - Gigabits
            - Terabits
            - Percent
            - Count
            - Bytes/Second
            - Kilobytes/Second
            - Megabytes/Second
            - Gigabytes/Second
            - Terabytes/Second
            - Bits/Second
            - Kilobits/Second
            - Megabits/Second
            - Gigabits/Second
            - Terabits/Second
            - Count/Second
            - None
documentation:
    command: |-
        Returns the data points of the specified metric for a database in Amazon Lightsail.

        Metrics report the utilization of your resources, and the error counts generated by them. Monitor and collect metric data regularly to maintain the reliability, availability, and performance of your resources.
    flag:
        end-time: "The end of the time interval from which to get metric data.\n\nConstraints:\n\n- Specified in Coordinated Universal Time (UTC).\n- Specified in the Unix time format.\n  \n  For example, if you wish to use an end time of October 1, 2018, at 8 PM UTC, then you input `1538424000` as the end time."
        metric-name: "The metric for which you want to return information.\n\nValid relational database metric names are listed below, along with the most useful `statistics` to include in your request, and the published `unit` value. All relational database metric data is available in 1-minute (60 seconds) granularity.\n\n- **`CPUUtilization`** - The percentage of CPU utilization currently in use on the database.\n  \n  `Statistics`: The most useful statistics are `Maximum` and `Average`.\n  \n  `Unit`: The published unit is `Percent`.\n- **`DatabaseConnections`** - The number of database connections in use.\n  \n  `Statistics`: The most useful statistics are `Maximum` and `Sum`.\n  \n  `Unit`: The published unit is `Count`.\n- **`DiskQueueDepth`** - The number of outstanding IOs (read/write requests) that are waiting to access the disk.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `Count`.\n- **`FreeStorageSpace`** - The amount of available storage space.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `Bytes`.\n- **`NetworkReceiveThroughput`** - The incoming (Receive) network traffic on the database, including both customer database traffic and AWS traffic used for monitoring and replication.\n  \n  `Statistics`: The most useful statistic is `Average`.\n  \n  `Unit`: The published unit is `Bytes/Second`.\n- **`NetworkTransmitThroughput`** - The outgoing (Transmit) network traffic on the database, including both customer database traffic and AWS traffic used for monitoring and replication.\n  \n  `Statistics`: The most useful statistic is `Average`.\n  \n  `Unit`: The published unit is `Bytes/Second`."
        period: |-
            The granularity, in seconds, of the returned data points.

            All relational database metric data is available in 1-minute (60 seconds) granularity.
        relational-database-name: The name of your database from which to get metric data.
        start-time: "The start of the time interval from which to get metric data.\n\nConstraints:\n\n- Specified in Coordinated Universal Time (UTC).\n- Specified in the Unix time format.\n  \n  For example, if you wish to use a start time of October 1, 2018, at 8 PM UTC, then you input `1538424000` as the start time."
        statistics: |-
            The statistic for the metric.

            The following statistics are available:

            - `Minimum` - The lowest value observed during the specified period. Use this value to determine low volumes of activity for your application.
            - `Maximum` - The highest value observed during the specified period. Use this value to determine high volumes of activity for your application.
            - `Sum` - All values submitted for the matching metric added together. You can use this statistic to determine the total volume of a metric.
            - `Average` - The value of Sum / SampleCount during the specified period. By comparing this statistic with the Minimum and Maximum values, you can determine the full scope of a metric and how close the average use is to the Minimum and Maximum values. This comparison helps you to know when to increase or decrease your resources.
            - `SampleCount` - The count, or number, of data points used for the statistical calculation.
        unit: The unit for the metric data request. Valid units depend on the metric data being requested. For the valid units with each available metric, see the `metricName` parameter.
