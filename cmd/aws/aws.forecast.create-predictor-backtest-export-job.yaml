name: create-predictor-backtest-export-job
description: Exports backtest forecasts and accuracy metrics generated by the [CreateAutoPredictor]() or [CreatePredictor]() operations.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destination=!: ""
    --format=: The format of the exported data, CSV or PARQUET.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --predictor-arn=!: The Amazon Resource Name (ARN) of the predictor that you want to export.
    --predictor-backtest-export-job-name=!: The name for the backtest export job.
    --tags=: Optional metadata to help you categorize and organize your backtests.
documentation:
    command: |-
        Exports backtest forecasts and accuracy metrics generated by the [CreateAutoPredictor]() or [CreatePredictor]() operations. Two folders containing CSV or Parquet files are exported to your specified S3 bucket.

        The export file names will match the following conventions:

        `<ExportJobName>_<ExportTimestamp>_<PartNumber>.csv`

        The &lt;ExportTimestamp&gt; component is in Java SimpleDate format (yyyy-MM-ddTHH-mm-ssZ).

        You must specify a [DataDestination]() object that includes an Amazon S3 bucket and an Identity and Access Management (IAM) role that Amazon Forecast can assume to access the Amazon S3 bucket. For more information, see [aws-forecast-iam-roles]().

        The `Status` of the export job must be `ACTIVE` before you can access the export in your Amazon S3 bucket. To get the status, use the [DescribePredictorBacktestExportJob]() operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        destination: ""
        format: The format of the exported data, CSV or PARQUET. The default value is CSV.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        predictor-arn: The Amazon Resource Name (ARN) of the predictor that you want to export.
        predictor-backtest-export-job-name: The name for the backtest export job.
        tags: |-
            Optional metadata to help you categorize and organize your backtests. Each tag consists of a key and an optional value, both of which you define. Tag keys and values are case sensitive.

            The following restrictions apply to tags:

            - For each resource, each tag key must be unique and each tag key must have one value.
            - Maximum number of tags per resource: 50.
            - Maximum key length: 128 Unicode characters in UTF-8.
            - Maximum value length: 256 Unicode characters in UTF-8.
            - Accepted characters: all letters and numbers, spaces representable in UTF-8, and + - = . _ : / @. If your tagging schema is used across other services and resources, the character restrictions of those services also apply.
            - Key prefixes cannot include any upper or lowercase combination of `aws:` or `AWS:`. Values can have this prefix. If a tag value has `aws` as its prefix but the key does not, Forecast considers it to be a user tag and will count against the limit of 50 tags. Tags with only the key prefix of `aws` do not count against your tags per resource limit. You cannot edit or delete tag keys with this prefix.
