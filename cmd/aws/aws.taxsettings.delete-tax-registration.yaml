name: delete-tax-registration
description: Deletes tax registration for a single account.
flags:
    --account-id=: Unique account identifier for the TRN information that needs to be deleted.
documentation:
    command: |-
        Deletes tax registration for a single account.

        This API operation can't be used to delete your tax registration in Brazil. Use the [Payment preferences](https://console.aws.amazon.com/billing/home#/paymentpreferences/paymentmethods) page in the Billing and Cost Management console instead.
    flag:
        account-id: Unique account identifier for the TRN information that needs to be deleted. If this isn't passed, the account ID corresponding to the credentials of the API caller will be used for this parameter.
