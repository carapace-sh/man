name: modify-traffic-mirror-session
description: Modifies a Traffic Mirror session.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description to assign to the Traffic Mirror session.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --packet-length=: The number of bytes in each packet to mirror.
    --remove-fields=:
        description: The properties that you want to remove from the Traffic Mirror session.
        nargs: -1
    --session-number=: The session number determines the order in which sessions are evaluated when an interface is used by multiple sessions.
    --traffic-mirror-filter-id=: The ID of the Traffic Mirror filter.
    --traffic-mirror-session-id=!: The ID of the Traffic Mirror session.
    --traffic-mirror-target-id=: The Traffic Mirror target.
    --virtual-network-id=: The virtual network ID of the Traffic Mirror session.
documentation:
    command: Modifies a Traffic Mirror session.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description to assign to the Traffic Mirror session.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        packet-length: |-
            The number of bytes in each packet to mirror. These are bytes after the VXLAN header. To mirror a subset, set this to the length (in bytes) to mirror. For example, if you set this value to 100, then the first 100 bytes that meet the filter criteria are copied to the target. Do not specify this parameter when you want to mirror the entire packet.

            For sessions with Network Load Balancer (NLB) traffic mirror targets, the default `PacketLength` will be set to 8500. Valid values are 1-8500. Setting a `PacketLength` greater than 8500 will result in an error response.
        remove-fields: |-
            The properties that you want to remove from the Traffic Mirror session.

            When you remove a property from a Traffic Mirror session, the property is set to the default.
        session-number: |-
            The session number determines the order in which sessions are evaluated when an interface is used by multiple sessions. The first session with a matching filter is the one that mirrors the packets.

            Valid values are 1-32766.
        traffic-mirror-filter-id: The ID of the Traffic Mirror filter.
        traffic-mirror-session-id: The ID of the Traffic Mirror session.
        traffic-mirror-target-id: The Traffic Mirror target. The target must be in the same VPC as the source, or have a VPC peering connection with the source.
        virtual-network-id: The virtual network ID of the Traffic Mirror session.
