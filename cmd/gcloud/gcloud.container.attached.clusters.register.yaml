name: register
description: Register an Attached cluster.
flags:
    --admin-groups=: Groups of users that can perform operations as a cluster administrator.
    --admin-users=: Users that can perform operations as a cluster administrator.
    --annotations=: Annotations for the cluster.
    --binauthz-evaluation-mode=: Set Binary Authorization evaluation mode for this cluster.
    --context=!: Context to use in the kubeconfig.
    --description=: Description for the cluster.
    --disable-cloud-monitoring: Disables managed collection for Cloud Monitoring in the cluster.
    --distribution=!: Set the base platform type of the cluster to attach.
    --enable-cloud-monitoring: Enables managed collection for Cloud Monitoring in the cluster.
    --enable-managed-prometheus: Enables managed collection for Managed Service for Prometheus in the cluster.
    --fleet-project=!: ID or number of the Fleet host project where the cluster is registered.
    --has-private-issuer: Indicates no publicly routable OIDC discovery endpoint exists
    --issuer-url=: Issuer url of the cluster to attach.
    --kubeconfig=: Path to the kubeconfig file.
    --location=: Google Cloud location for the cluster.
    --logging=: Set the components that have logging enabled.
    --no-disable-cloud-monitoring&: ""
    --no-enable-cloud-monitoring&: ""
    --no-enable-managed-prometheus&: ""
    --no-has-private-issuer&: Indicates no publicly routable OIDC discovery endpoint exists
    --no-skip-cluster-admin-check&: When this hidden flag is set, the cluster admin check will be skipped.
    --no-validate-only&: Validate the cluster to create, but don't actually perform it.
    --platform-version=!: Platform version to use for the cluster.
    --proxy-secret-name=!: Name of the Kubernetes secret that contains the HTTP/HTTPS
    --proxy-secret-namespace=!: Namespace of the Kubernetes secret that contains the HTTP/HTTPS
    --skip-cluster-admin-check&: When this hidden flag is set, the cluster admin check will be skipped.
    --system-component-labels=: Kubernetes labels to be applied to system component pods.
    --system-component-tolerations=: Kubernetes tolerations to be applied to system component pods.
    --tags=: Tag keys/values directly bound to this resource.
    --validate-only: Validate the cluster to create, but don't actually perform it.
    --workload-vulnerability-scanning=&: Sets the mode of the Kubernetes security posture API's workload vulnerability scanning.
completion:
    flag:
        binauthz-evaluation-mode:
            - DISABLED
            - PROJECT_SINGLETON_POLICY_ENFORCE
        workload-vulnerability-scanning:
            - disabled
            - enterprise
documentation:
    command: Register an Attached cluster.
    flag:
        admin-groups: Groups of users that can perform operations as a cluster administrator.
        admin-users: Users that can perform operations as a cluster administrator.
        annotations: Annotations for the cluster.
        binauthz-evaluation-mode: 'Set Binary Authorization evaluation mode for this cluster. _BINAUTHZ_EVALUATION_MODE_ must be one of: *DISABLED*, *PROJECT_SINGLETON_POLICY_ENFORCE*.'
        context: Context to use in the kubeconfig.
        description: Description for the cluster.
        disable-cloud-monitoring: |-
            Disables managed collection for Cloud Monitoring in the cluster.
            +
            Cloud Monitoring is enabled by default for all clusters. Beginning with
            cluster version 1.31, use --disable-cloud-monitoring to disable.
        distribution: |-
            Set the base platform type of the cluster to attach.
            +
            Examples:
            +
              $ {command} --distribution=aks
              $ {command} --distribution=eks
              $ {command} --distribution=generic
        enable-cloud-monitoring: |-
            Enables managed collection for Cloud Monitoring in the cluster.
            +
            Cloud Monitoring is enabled by default for all clusters. Beginning with
            cluster version 1.31, use --disable-cloud-monitoring to disable.
        enable-managed-prometheus: |-
            Enables managed collection for Managed Service for Prometheus in the cluster.
            +
            See https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#enable-mgdcoll-gke
            for more info.
            +
            Managed Prometheus is enabled by default for cluster versions 1.27 or greater,
            use --no-enable-managed-prometheus to disable.
        fleet-project: ID or number of the Fleet host project where the cluster is registered.
        has-private-issuer: |-
            Indicates no publicly routable OIDC discovery endpoint exists
            for the Kubernetes service account token issuer.
            +
            If this flag is set, gcloud will read the issuer URL and JWKs from the cluster's
            api server.
        issuer-url: Issuer url of the cluster to attach.
        kubeconfig: |-
            Path to the kubeconfig file.
            +
            If not provided, the default at ~/.kube/config will be used.
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_attached/location`.
        logging: |-
            Set the components that have logging enabled.
            +
            Examples:
            +
              $ {command} --logging=SYSTEM
              $ {command} --logging=SYSTEM,WORKLOAD
              $ {command} --logging=NONE
            +
            _COMPONENT_ must be one of: *NONE*, *SYSTEM*, *WORKLOAD*.
        no-disable-cloud-monitoring: |
            Disables managed collection for Cloud Monitoring in the cluster.

            Cloud Monitoring is enabled by default for all clusters. Beginning with
            cluster version 1.31, use --disable-cloud-monitoring to disable.
        no-enable-cloud-monitoring: |
            Enables managed collection for Cloud Monitoring in the cluster.

            Cloud Monitoring is enabled by default for all clusters. Beginning with
            cluster version 1.31, use --disable-cloud-monitoring to disable.
        no-enable-managed-prometheus: |
            Enables managed collection for Managed Service for Prometheus in the cluster.

            See https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#enable-mgdcoll-gke
            for more info.

            Managed Prometheus is enabled by default for cluster versions 1.27 or greater,
            use --no-enable-managed-prometheus to disable.
        no-has-private-issuer: |
            Indicates no publicly routable OIDC discovery endpoint exists
            for the Kubernetes service account token issuer.

            If this flag is set, gcloud will read the issuer URL and JWKs from the cluster's
            api server.
        no-skip-cluster-admin-check: |
            When this hidden flag is set, the cluster admin check will be skipped.
        no-validate-only: Validate the cluster to create, but don't actually perform it.
        platform-version: |-
            Platform version to use for the cluster.
            +
            To retrieve a list of valid versions, run:
            +
              $ gcloud alpha container attached get-server-config --location=LOCATION
            +
            Replace ``LOCATION'' with the target Google Cloud location for the cluster.
        proxy-secret-name: |-
            Name of the Kubernetes secret that contains the HTTP/HTTPS
            proxy configuration.
        proxy-secret-namespace: |-
            Namespace of the Kubernetes secret that contains the HTTP/HTTPS
            proxy configuration.
        skip-cluster-admin-check: |
            When this hidden flag is set, the cluster admin check will be skipped.
        system-component-labels: Kubernetes labels to be applied to system component pods.
        system-component-tolerations: Kubernetes tolerations to be applied to system component pods.
        tags: |-
            Tag keys/values directly bound to this resource.
            +
            The short name of a tag key or value can have a maximum length of 256
            characters. The permitted character set for the short name includes UTF-8
            encoded Unicode characters except single quotes, double quotes,
            backslashes, and forward slashes.
        validate-only: Validate the cluster to create, but don't actually perform it.
        workload-vulnerability-scanning: |
            Sets the mode of the Kubernetes security posture API's workload vulnerability scanning.
            To enable Advanced vulnerability insights mode explicitly set the flag to --workload-vulnerability-scanning=enterprise.

            To disable in an existing cluster, explicitly set the flag to --workload-vulnerability-scanning=disabled.
