name: describe-build
description: |-
    **This API works with the following fleet types:** EC2

    Retrieves properties for a custom game build.
flags:
    --build-id=!: A unique identifier for the build to retrieve properties for.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2

        Retrieves properties for a custom game build. To request a build resource, specify a build ID. If successful, an object containing the build properties is returned.

        **Learn more**

        [Upload a Custom Server Build](https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-build-intro.html)

        [All APIs by task](https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets)
    flag:
        build-id: A unique identifier for the build to retrieve properties for. You can use either the build ID or ARN value.
