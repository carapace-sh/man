name: search-index
description: The query search index.
flags:
    --index-name=: The search index name.
    --max-results=: The maximum number of results to return per page at one time.
    --next-token=: The token used to get the next set of results, or `null` if there are no additional results.
    --query-string=!: The search query string.
    --query-version=: The query version.
documentation:
    command: |-
        The query search index.

        Requires permission to access the [SearchIndex](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        index-name: The search index name.
        max-results: The maximum number of results to return per page at one time. This maximum number cannot exceed 100. The response might contain fewer results but will never contain more. You can use [`nextToken`](https://docs.aws.amazon.com/iot/latest/apireference/API_SearchIndex.html#iot-SearchIndex-request-nextToken) to retrieve the next set of results until `nextToken` returns `NULL`.
        next-token: The token used to get the next set of results, or `null` if there are no additional results.
        query-string: The search query string. For more information about the search query syntax, see [Query syntax](https://docs.aws.amazon.com/iot/latest/developerguide/query-syntax.html).
        query-version: The query version.
