name: stop-project-version
description: This operation applies only to Amazon Rekognition Custom Labels.
flags:
    --project-version-arn=!: The Amazon Resource Name (ARN) of the model version that you want to stop.
documentation:
    command: |-
        This operation applies only to Amazon Rekognition Custom Labels.

        Stops a running model. The operation might take a while to complete. To check the current status, call [DescribeProjectVersions](). Only applies to Custom Labels projects.

        This operation requires permissions to perform the `rekognition:StopProjectVersion` action.
    flag:
        project-version-arn: |-
            The Amazon Resource Name (ARN) of the model version that you want to stop.

            This operation requires permissions to perform the `rekognition:StopProjectVersion` action.
