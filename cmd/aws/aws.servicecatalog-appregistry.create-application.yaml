name: create-application
description: Creates a new application that is the top-level node in a hierarchy of related cloud resource abstractions.
flags:
    --client-token=!: A unique identifier that you provide to ensure idempotency.
    --description=: The description of the application.
    --name=!: The name of the application.
    --tags=: Key-value pairs you can use to associate with the application.
documentation:
    command: Creates a new application that is the top-level node in a hierarchy of related cloud resource abstractions.
    flag:
        client-token: A unique identifier that you provide to ensure idempotency. If you retry a request that completed successfully using the same client token and the same parameters, the retry succeeds without performing any further actions. If you retry a successful request using the same client token, but one or more of the parameters are different, the retry fails.
        description: The description of the application.
        name: The name of the application. The name must be unique in the region in which you are creating the application.
        tags: Key-value pairs you can use to associate with the application.
