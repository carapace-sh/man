name: delete-eks-anywhere-subscription
description: Deletes an expired or inactive subscription.
flags:
    --id=!: The ID of the subscription.
documentation:
    command: Deletes an expired or inactive subscription. Deleting inactive subscriptions removes them from the Amazon Web Services Management Console view and from list/describe API responses. Subscriptions can only be cancelled within 7 days of creation and are cancelled by creating a ticket in the Amazon Web Services Support Center.
    flag:
        id: The ID of the subscription.
