name: disable-import-findings-for-product
description: Disables the integration of the specified product with Security Hub.
flags:
    --product-subscription-arn=!: The ARN of the integrated product to disable the integration for.
documentation:
    command: Disables the integration of the specified product with Security Hub. After the integration is disabled, findings from that product are no longer sent to Security Hub.
    flag:
        product-subscription-arn: The ARN of the integrated product to disable the integration for.
