name: create-compute-node-group
description: Creates a managed set of compute nodes.
flags:
    --ami-id=: The ID of the Amazon Machine Image (AMI) that PCS uses to launch compute nodes (Amazon EC2 instances).
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --cluster-identifier=!: The name or ID of the cluster to create a compute node group in.
    --compute-node-group-name=!: A name to identify the cluster.
    --custom-launch-template=!: ""
    --iam-instance-profile-arn=!: The Amazon Resource Name (ARN) of the IAM instance profile used to pass an IAM role when launching EC2 instances.
    --instance-configs=!: A list of EC2 instance configurations that PCS can provision in the compute node group.
    --purchase-option=: Specifies how EC2 instances are purchased on your behalf.
    --scaling-configuration=!: Specifies the boundaries of the compute node group auto scaling.
    --slurm-configuration=: Additional options related to the Slurm scheduler.
    --spot-options=: ""
    --subnet-ids=!: The list of subnet IDs where the compute node group launches instances.
    --tags=: 1 or more tags added to the resource.
completion:
    flag:
        purchase-option:
            - ONDEMAND
            - SPOT
            - CAPACITY_BLOCK
documentation:
    command: Creates a managed set of compute nodes. You associate a compute node group with a cluster through 1 or more PCS queues or as part of the login fleet. A compute node group includes the definition of the compute properties and lifecycle management. PCS uses the information you provide to this API action to launch compute nodes in your account. You can only specify subnets in the same Amazon VPC as your cluster. You receive billing charges for the compute nodes that PCS launches in your account. You must already have a launch template before you call this API. For more information, see [Launch an instance from a launch template](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-launch-templates.html) in the *Amazon Elastic Compute Cloud User Guide for Linux Instances*.
    flag:
        ami-id: The ID of the Amazon Machine Image (AMI) that PCS uses to launch compute nodes (Amazon EC2 instances). If you don't provide this value, PCS uses the AMI ID specified in the custom launch template.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, the subsequent retries with the same client token return the result from the original successful request and they have no additional effect. If you don't specify a client token, the CLI and SDK automatically generate 1 for you.
        cluster-identifier: The name or ID of the cluster to create a compute node group in.
        compute-node-group-name: 'A name to identify the cluster. Example: `MyCluster`'
        custom-launch-template: ""
        iam-instance-profile-arn: The Amazon Resource Name (ARN) of the IAM instance profile used to pass an IAM role when launching EC2 instances. The role contained in your instance profile must have the `pcs:RegisterComputeNodeGroupInstance` permission and the role name must start with `AWSPCS` or must have the path `/aws-pcs/`. For more information, see [IAM instance profiles for PCS](https://docs.aws.amazon.com/pcs/latest/userguide/security-instance-profiles.html) in the *PCS User Guide*.
        instance-configs: A list of EC2 instance configurations that PCS can provision in the compute node group.
        purchase-option: Specifies how EC2 instances are purchased on your behalf. PCS supports On-Demand Instances, Spot Instances, and Amazon EC2 Capacity Blocks for ML. For more information, see [Amazon EC2 billing and purchasing options](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html) in the *Amazon Elastic Compute Cloud User Guide*. For more information about PCS support for Capacity Blocks, see [Using Amazon EC2 Capacity Blocks for ML with PCS](https://docs.aws.amazon.com/pcs/latest/userguide/capacity-blocks.html) in the *PCS User Guide*. If you don't provide this option, it defaults to On-Demand.
        scaling-configuration: Specifies the boundaries of the compute node group auto scaling.
        slurm-configuration: Additional options related to the Slurm scheduler.
        spot-options: ""
        subnet-ids: The list of subnet IDs where the compute node group launches instances. Subnets must be in the same VPC as the cluster.
        tags: 1 or more tags added to the resource. Each tag consists of a tag key and tag value. The tag value is optional and can be an empty string.
