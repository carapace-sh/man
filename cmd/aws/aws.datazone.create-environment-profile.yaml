name: create-environment-profile
description: Creates an Amazon DataZone environment profile.
flags:
    --aws-account-id=: The Amazon Web Services account in which the Amazon DataZone environment is created.
    --aws-account-region=: The Amazon Web Services region in which this environment profile is created.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of this Amazon DataZone environment profile.
    --domain-identifier=!: The ID of the Amazon DataZone domain in which this environment profile is created.
    --environment-blueprint-identifier=!: The ID of the blueprint with which this environment profile is created.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of this Amazon DataZone environment profile.
    --project-identifier=!: The identifier of the project in which to create the environment profile.
    --user-parameters=: The user parameters of this Amazon DataZone environment profile.
documentation:
    command: Creates an Amazon DataZone environment profile.
    flag:
        aws-account-id: The Amazon Web Services account in which the Amazon DataZone environment is created.
        aws-account-region: The Amazon Web Services region in which this environment profile is created.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of this Amazon DataZone environment profile.
        domain-identifier: The ID of the Amazon DataZone domain in which this environment profile is created.
        environment-blueprint-identifier: The ID of the blueprint with which this environment profile is created.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of this Amazon DataZone environment profile.
        project-identifier: The identifier of the project in which to create the environment profile.
        user-parameters: The user parameters of this Amazon DataZone environment profile.
