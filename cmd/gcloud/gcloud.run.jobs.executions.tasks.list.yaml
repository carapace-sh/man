    --abandoned: Include abandoned tasks.
    --cancelled: Include cancelled tasks.
    --completed: Include succeeded, failed, and cancelled tasks.
    --execution=!: ID of the Execution or fully qualified identifier for the Execution.
    --failed: Include failed tasks.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --no-completed: Include running and pending tasks.
    --no-started: Include pending and abandoned tasks.
    --no-uri&: Print a list of resource URIs instead of the default output, and change the
    --page-size=: Some services group resource list output into pages.
    --pending: Include pending tasks.
    --region=: Region in which the resource can be found.
