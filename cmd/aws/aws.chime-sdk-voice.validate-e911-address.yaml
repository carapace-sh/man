name: validate-e911-address
description: Validates an address to be used for 911 calls made with Amazon Chime SDK Voice Connectors.
flags:
    --aws-account-id=!: The AWS account ID.
    --city=!: The address city, such as `Portland`.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --country=!: The country in the address being validated as two-letter country code in ISO 3166-1 alpha-2 format, such as `US`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --postal-code=!: The dress postal code, such `04352`.
    --state=!: The address state, such as `ME`.
    --street-info=!: The address street information, such as `8th Avenue`.
    --street-number=!: The address street number, such as `200` or `2121`.
documentation:
    command: Validates an address to be used for 911 calls made with Amazon Chime SDK Voice Connectors. You can use validated addresses in a Presence Information Data Format Location Object file that you include in SIP requests. That helps ensure that addresses are routed to the appropriate Public Safety Answering Point.
    flag:
        aws-account-id: The AWS account ID.
        city: The address city, such as `Portland`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        country: The country in the address being validated as two-letter country code in ISO 3166-1 alpha-2 format, such as `US`. For more information, see [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) in Wikipedia.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        postal-code: The dress postal code, such `04352`.
        state: The address state, such as `ME`.
        street-info: The address street information, such as `8th Avenue`.
        street-number: The address street number, such as `200` or `2121`.
