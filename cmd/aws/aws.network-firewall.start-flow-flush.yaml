name: start-flow-flush
description: Begins the flushing of traffic from the firewall, according to the filters you define.
flags:
    --availability-zone=: The ID of the Availability Zone where the firewall is located.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --firewall-arn=!: The Amazon Resource Name (ARN) of the firewall.
    --flow-filters=!:
        description: Defines the scope a flow operation.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --minimum-flow-age-in-seconds=: The reqested `FlowOperation` ignores flows with an age (in seconds) lower than `MinimumFlowAgeInSeconds`.
    --vpc-endpoint-association-arn=: The Amazon Resource Name (ARN) of a VPC endpoint association.
    --vpc-endpoint-id=: A unique identifier for the primary endpoint associated with a firewall.
documentation:
    command: |-
        Begins the flushing of traffic from the firewall, according to the filters you define. When the operation starts, impacted flows are temporarily marked as timed out before the Suricata engine prunes, or flushes, the flows from the firewall table.

        While the flush completes, impacted flows are processed as midstream traffic. This may result in a temporary increase in midstream traffic metrics. We recommend that you double check your stream exception policy before you perform a flush operation.
    flag:
        availability-zone: |-
            The ID of the Availability Zone where the firewall is located. For example, `us-east-2a`.

            Defines the scope a flow operation. You can use up to 20 filters to configure a single flow operation.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        firewall-arn: The Amazon Resource Name (ARN) of the firewall.
        flow-filters: Defines the scope a flow operation. You can use up to 20 filters to configure a single flow operation.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        minimum-flow-age-in-seconds: The reqested `FlowOperation` ignores flows with an age (in seconds) lower than `MinimumFlowAgeInSeconds`. You provide this for start commands.
        vpc-endpoint-association-arn: The Amazon Resource Name (ARN) of a VPC endpoint association.
        vpc-endpoint-id: A unique identifier for the primary endpoint associated with a firewall.
