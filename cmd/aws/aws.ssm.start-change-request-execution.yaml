name: start-change-request-execution
description: Amazon Web Services Systems Manager Change Manager will no longer be open to new customers starting November 7, 2025. If you would like to use Change Manager, sign up prior to that date.
flags:
    --auto-approve: Indicates whether the change request can be approved automatically without the need for manual approvals.
    --change-details=: User-provided details about the change.
    --change-request-name=: The name of the change request associated with the runbook workflow to be run.
    --client-token=: The user-provided idempotency token.
    --document-name=!: The name of the change template document to run during the runbook workflow.
    --document-version=: The version of the change template document to run during the runbook workflow.
    --no-auto-approve: Indicates whether the change request can be approved automatically without the need for manual approvals.
    --parameters=: A key-value map of parameters that match the declared parameters in the change template document.
    --runbooks=!: Information about the Automation runbooks that are run during the runbook workflow.
    --scheduled-end-time=: The time that the requester expects the runbook workflow related to the change request to complete.
    --scheduled-time=: The date and time specified in the change request to run the Automation runbooks.
    --tags=: Optional metadata that you assign to a resource.
documentation:
    command: |-
        Amazon Web Services Systems Manager Change Manager will no longer be open to new customers starting November 7, 2025. If you would like to use Change Manager, sign up prior to that date. Existing customers can continue to use the service as normal. For more information, see [Amazon Web Services Systems Manager Change Manager availability change](https://docs.aws.amazon.com/systems-manager/latest/userguide/change-manager-availability-change.html).

        Creates a change request for Change Manager. The Automation runbooks specified in the change request run only after all required approvals for the change request have been received.
    flag:
        auto-approve: |-
            Indicates whether the change request can be approved automatically without the need for manual approvals.

            If `AutoApprovable` is enabled in a change template, then setting `AutoApprove` to `true` in `StartChangeRequestExecution` creates a change request that bypasses approver review.

            Change Calendar restrictions are not bypassed in this scenario. If the state of an associated calendar is `CLOSED`, change freeze approvers must still grant permission for this change request to run. If they don't, the change won't be processed until the calendar state is again `OPEN`.
        change-details: User-provided details about the change. If no details are provided, content specified in the **Template information** section of the associated change template is added.
        change-request-name: The name of the change request associated with the runbook workflow to be run.
        client-token: The user-provided idempotency token. The token must be unique, is case insensitive, enforces the UUID format, and can't be reused.
        document-name: The name of the change template document to run during the runbook workflow.
        document-version: The version of the change template document to run during the runbook workflow.
        parameters: A key-value map of parameters that match the declared parameters in the change template document.
        runbooks: |-
            Information about the Automation runbooks that are run during the runbook workflow.

            The Automation runbooks specified for the runbook workflow can't run until all required approvals for the change request have been received.
        scheduled-end-time: The time that the requester expects the runbook workflow related to the change request to complete. The time is an estimate only that the requester provides for reviewers.
        scheduled-time: |-
            The date and time specified in the change request to run the Automation runbooks.

            The Automation runbooks specified for the runbook workflow can't run until all required approvals for the change request have been received.
        tags: |-
            Optional metadata that you assign to a resource. You can specify a maximum of five tags for a change request. Tags enable you to categorize a resource in different ways, such as by purpose, owner, or environment. For example, you might want to tag a change request to identify an environment or target Amazon Web Services Region. In this case, you could specify the following key-value pairs:

            - `Key=Environment,Value=Production`
            - `Key=Region,Value=us-east-2`

            The `Array Members` maximum value is reported as 1000. This number includes capacity reserved for internal operations. When calling the `StartChangeRequestExecution` action, you can specify a maximum of 5 tags. You can, however, use the [AddTagsToResource]() action to add up to a total of 50 tags to an existing change request configuration.
