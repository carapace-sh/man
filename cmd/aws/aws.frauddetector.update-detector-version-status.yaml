name: update-detector-version-status
description: Updates the detector version’s status.
flags:
    --detector-id=!: The detector ID.
    --detector-version-id=!: The detector version ID.
    --status=!: The new status.
completion:
    flag:
        status:
            - DRAFT
            - ACTIVE
            - INACTIVE
documentation:
    command: 'Updates the detector version’s status. You can perform the following promotions or demotions using `UpdateDetectorVersionStatus`: `DRAFT` to `ACTIVE`, `ACTIVE` to `INACTIVE`, and `INACTIVE` to `ACTIVE`.'
    flag:
        detector-id: The detector ID.
        detector-version-id: The detector version ID.
        status: |-
            The new status.

            The only supported values are `ACTIVE` and `INACTIVE`
