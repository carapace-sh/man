name: set-resource-access-for-bucket
description: Sets the Amazon Lightsail resources that can access the specified Lightsail bucket.
flags:
    --access=!: The access setting.
    --bucket-name=!: The name of the bucket for which to set access to another Lightsail resource.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-name=!: The name of the Lightsail instance for which to set bucket access.
completion:
    flag:
        access:
            - allow
            - deny
documentation:
    command: |-
        Sets the Amazon Lightsail resources that can access the specified Lightsail bucket.

        Lightsail buckets currently support setting access for Lightsail instances in the same Amazon Web Services Region.
    flag:
        access: |-
            The access setting.

            The following access settings are available:

            - `allow` - Allows access to the bucket and its objects.
            - `deny` - Denies access to the bucket and its objects. Use this setting to remove access for a resource previously set to `allow`.
        bucket-name: The name of the bucket for which to set access to another Lightsail resource.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        resource-name: The name of the Lightsail instance for which to set bucket access. The instance must be in a running or stopped state.
