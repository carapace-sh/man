name: get-outpost-supported-instance-types
description: Gets the instance types that an Outpost can support in `InstanceTypeCapacity`.
flags:
    --asset-id=: The ID of the Outpost asset.
    --max-results=: ""
    --next-token=: ""
    --order-id=: The ID for the Amazon Web Services Outposts order.
    --outpost-identifier=!: The ID or ARN of the Outpost.
documentation:
    command: Gets the instance types that an Outpost can support in `InstanceTypeCapacity`. This will generally include instance types that are not currently configured and therefore cannot be launched with the current Outpost capacity configuration.
    flag:
        asset-id: The ID of the Outpost asset. An Outpost asset can be a single server within an Outposts rack or an Outposts server configuration.
        max-results: ""
        next-token: ""
        order-id: The ID for the Amazon Web Services Outposts order.
        outpost-identifier: The ID or ARN of the Outpost.
