name: create
description: '*(BETA)*  Create a Unit Operation.'
flags:
    --cancel: When true, attempt to cancel the operation.
    --deprovision: This flag can be used to specify an empty deprovision operation.
    --labels=: The labels on the resource, which can be used for categorization.
    --location=: For resources [parent-unit-operation, provision-release, rollout, unit, unit_operation, upgrade-release], provides fallback value for resource location attribute.
    --no-cancel&: When true, attempt to cancel the operation.
    --no-deprovision&: This flag can be used to specify an empty deprovision operation.
    --no-provision&: This flag can be used to specify an empty provision operation.
    --no-upgrade&: This flag can be used to specify an empty upgrade operation.
    --parent-unit-operation=!: ID of the parentUnitOperation or fully qualified identifier for the parentUnitOperation.
    --provision: This flag can be used to specify an empty provision operation.
    --provision-input-variables=: Set of input variables.
    --provision-release=!: ID of the release or fully qualified identifier for the release.
    --rollout=!: ID of the rolloutId or fully qualified identifier for the rolloutId.
    --schedule-start-time=: Start of operation.
    --unit=!: ID of the unit or fully qualified identifier for the unit.
    --upgrade: This flag can be used to specify an empty upgrade operation.
    --upgrade-input-variables=: Set of input variables.
    --upgrade-release=!: ID of the release or fully qualified identifier for the release.
documentation:
    command: '*(BETA)*  Create a Unit Operation'
    flag:
        cancel: |-
            When true, attempt to cancel the operation. Cancellation may fail if the
            operation is already executing. (Optional)
        deprovision: This flag can be used to specify an empty deprovision operation.
        labels: |-
            The labels on the resource, which can be used for categorization.
            similar to Kubernetes resource labels.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: For resources [parent-unit-operation, provision-release, rollout, unit, unit_operation, upgrade-release], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        no-cancel: |-
            When true, attempt to cancel the operation. Cancellation may fail if the
            operation is already executing. (Optional)
        no-deprovision: This flag can be used to specify an empty deprovision operation.
        no-provision: This flag can be used to specify an empty provision operation.
        no-upgrade: This flag can be used to specify an empty upgrade operation.
        parent-unit-operation: |-
            ID of the parentUnitOperation or fully qualified identifier for the parentUnitOperation.
            +
            To set the `unit-operation` attribute:
            * provide the argument `--parent-unit-operation` on the command line.
        provision: This flag can be used to specify an empty provision operation.
        provision-input-variables: |-
            Set of input variables. Maximum 100. (optional).
            +
            *type*:::
            Name of a supported variable type. Supported types are string, int, bool.
            +
            *value*:::
            String encoded value for the variable.
            +
            *variable*:::
            Name of the variable from actuation configs.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --provision-input-variables=type=string,value=string,variable=string --provision-input-variables=type=string,value=string,variable=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --provision-input-variables='[{"type": "string", "value": "string", "variable": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --provision-input-variables=path_to_file.(yaml|json)
            +
            ```
        provision-release: |-
            ID of the release or fully qualified identifier for the release.
            +
            To set the `release` attribute:
            * provide the argument `--provision-release` on the command line.
        rollout: |-
            ID of the rolloutId or fully qualified identifier for the rolloutId.
            +
            To set the `rollout` attribute:
            * provide the argument `--rollout` on the command line.
        schedule-start-time: |-
            Start of operation. If not set, will be set to the start of the next
            window. (optional)
        unit: |-
            ID of the unit or fully qualified identifier for the unit.
            +
            To set the `unit` attribute:
            * provide the argument `--unit` on the command line.
        upgrade: This flag can be used to specify an empty upgrade operation.
        upgrade-input-variables: |-
            Set of input variables. Maximum 100. (optional).
            +
            *type*:::
            Name of a supported variable type. Supported types are string, int, bool.
            +
            *value*:::
            String encoded value for the variable.
            +
            *variable*:::
            Name of the variable from actuation configs.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --upgrade-input-variables=type=string,value=string,variable=string --upgrade-input-variables=type=string,value=string,variable=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --upgrade-input-variables='[{"type": "string", "value": "string", "variable": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --upgrade-input-variables=path_to_file.(yaml|json)
            +
            ```
        upgrade-release: |-
            ID of the release or fully qualified identifier for the release.
            +
            To set the `release` attribute:
            * provide the argument `--upgrade-release` on the command line.
