name: create-map
description: Creates a map resource in your Amazon Web Services account, which provides map tiles of different styles sourced from global location data providers.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=!: Specifies the `MapConfiguration`, including the map style, for the map resource that you create.
    --description=: An optional description for the map resource.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --map-name=!: The name for the map resource.
    --pricing-plan=: No longer used.
    --tags=: Applies one or more tags to the map resource.
completion:
    flag:
        pricing-plan:
            - RequestBasedUsage
            - MobileAssetTracking
            - MobileAssetManagement
documentation:
    command: |-
        Creates a map resource in your Amazon Web Services account, which provides map tiles of different styles sourced from global location data providers.

        If your application is tracking or routing assets you use in your business, such as delivery vehicles or employees, you must not use Esri as your geolocation provider. See section 82 of the [Amazon Web Services service terms](http://aws.amazon.com/service-terms) for more details.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: Specifies the `MapConfiguration`, including the map style, for the map resource that you create. The map style defines the look of maps and the data provider for your map resource.
        description: An optional description for the map resource.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        map-name: |-
            The name for the map resource.

            Requirements:

            - Must contain only alphanumeric characters (A–Z, a–z, 0–9), hyphens (-), periods (.), and underscores (\_).
            - Must be a unique map resource name.
            - No spaces allowed. For example, `ExampleMap`.
        pricing-plan: No longer used. If included, the only allowed value is `RequestBasedUsage`.
        tags: |-
            Applies one or more tags to the map resource. A tag is a key-value pair helps manage, identify, search, and filter your resources by labelling them.

            Format: `"key" : "value"`

            Restrictions:

            - Maximum 50 tags per resource
            - Each resource tag must be unique with a maximum of one value.
            - Maximum key length: 128 Unicode characters in UTF-8
            - Maximum value length: 256 Unicode characters in UTF-8
            - Can use alphanumeric characters (A–Z, a–z, 0–9), and the following characters: + - = . _ : / @.
            - Cannot use "aws:" as a prefix for a key.
