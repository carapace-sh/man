name: batch-enable-standards
description: Enables the standards specified by the provided `StandardsArn`.
flags:
    --standards-subscription-requests=!: The list of standards checks to enable.
documentation:
    command: |-
        Enables the standards specified by the provided `StandardsArn`. To obtain the ARN for a standard, use the `DescribeStandards` operation.

        For more information, see the [Security Standards](https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards.html) section of the *Security Hub User Guide*.
    flag:
        standards-subscription-requests: The list of standards checks to enable.
