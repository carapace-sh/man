name: put-snapshot-block
description: Writes a block of data to a snapshot.
flags:
    --block-data=!: The data to write to the block.
    --block-index=!: The block index of the block in which to write the data.
    --checksum-algorithm=!: The algorithm used to generate the checksum.
    --checksum=!: A Base64-encoded SHA256 checksum of the data.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-length=!: The size of the data to write to the block, in bytes.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --progress=: The progress of the write process, as a percentage.
    --snapshot-id=!: The ID of the snapshot.
completion:
    flag:
        checksum-algorithm:
            - SHA256
documentation:
    command: |-
        Writes a block of data to a snapshot. If the specified block contains data, the existing data is overwritten. The target snapshot must be in the `pending` state.

        Data written to a snapshot must be aligned with 512-KiB sectors.

        You should always retry requests that receive server (`5xx`) error responses, and `ThrottlingException` and `RequestThrottledException` client error responses. For more information see [Error retries](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/error-retries.html) in the *Amazon Elastic Compute Cloud User Guide*.
    flag:
        block-data: |-
            The data to write to the block.

            The block data is not signed as part of the Signature Version 4 signing process. As a result, you must generate and provide a Base64-encoded SHA256 checksum for the block data using the **x-amz-Checksum** header. Also, you must specify the checksum algorithm using the **x-amz-Checksum-Algorithm** header. The checksum that you provide is part of the Signature Version 4 signing process. It is validated against a checksum generated by Amazon EBS to ensure the validity and authenticity of the data. If the checksums do not correspond, the request fails. For more information, see [Using checksums with the EBS direct APIs](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-accessing-snapshot.html#ebsapis-using-checksums) in the *Amazon Elastic Compute Cloud User Guide*.
        block-index: The block index of the block in which to write the data. A block index is a logical index in units of `512` KiB blocks. To identify the block index, divide the logical offset of the data in the logical volume by the block size (logical offset of data/`524288`). The logical offset of the data must be `512` KiB aligned.
        checksum: A Base64-encoded SHA256 checksum of the data. Only SHA256 checksums are supported.
        checksum-algorithm: The algorithm used to generate the checksum. Currently, the only supported algorithm is `SHA256`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-length: |-
            The size of the data to write to the block, in bytes. Currently, the only supported size is `524288` bytes.

            Valid values: `524288`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        progress: The progress of the write process, as a percentage.
        snapshot-id: |-
            The ID of the snapshot.

            If the specified snapshot is encrypted, you must have permission to use the KMS key that was used to encrypt the snapshot. For more information, see [Using encryption](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebsapis-using-encryption.html) in the *Amazon Elastic Compute Cloud User Guide*..
