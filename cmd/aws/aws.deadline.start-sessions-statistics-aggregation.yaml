name: start-sessions-statistics-aggregation
description: Starts an asynchronous request for getting aggregated statistics about queues and farms.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=!: The Linux timestamp of the date and time that the statistics end.
    --farm-id=!: The identifier of the farm that contains queues or fleets to return statistics for.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-by=!: The field to use to group the statistics.
    --period=: The period to aggregate the statistics.
    --resource-ids=!: A list of fleet IDs or queue IDs to gather statistics for.
    --start-time=!: The Linux timestamp of the date and time that the statistics start.
    --statistics=!: One to four statistics to return.
    --timezone=: The timezone to use for the statistics.
completion:
    flag:
        period:
            - HOURLY
            - DAILY
            - WEEKLY
            - MONTHLY
documentation:
    command: Starts an asynchronous request for getting aggregated statistics about queues and farms. Get the statistics using the `GetSessionsStatisticsAggregation` operation. You can only have one running aggregation for your Deadline Cloud farm. Call the `GetSessionsStatisticsAggregation` operation and check the `status` field to see if an aggregation is running. Statistics are available for 1 hour after you call the `StartSessionsStatisticsAggregation` operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: The Linux timestamp of the date and time that the statistics end.
        farm-id: The identifier of the farm that contains queues or fleets to return statistics for.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-by: The field to use to group the statistics.
        period: The period to aggregate the statistics.
        resource-ids: A list of fleet IDs or queue IDs to gather statistics for.
        start-time: The Linux timestamp of the date and time that the statistics start.
        statistics: One to four statistics to return.
        timezone: The timezone to use for the statistics. Use UTC notation such as "UTC+8."
