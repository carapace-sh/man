name: update-service-specific-credential
description: Sets the status of a service-specific credential to `Active` or `Inactive`.
flags:
    --service-specific-credential-id=!: The unique identifier of the service-specific credential.
    --status=!: The status to be assigned to the service-specific credential.
    --user-name=: The name of the IAM user associated with the service-specific credential.
completion:
    flag:
        status:
            - Active
            - Inactive
            - Expired
documentation:
    command: Sets the status of a service-specific credential to `Active` or `Inactive`. Service-specific credentials that are inactive cannot be used for authentication to the service. This operation can be used to disable a user's service-specific credential as part of a credential rotation work flow.
    flag:
        service-specific-credential-id: |-
            The unique identifier of the service-specific credential.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters that can consist of any upper or lowercased letter or digit.
        status: The status to be assigned to the service-specific credential.
        user-name: |-
            The name of the IAM user associated with the service-specific credential. If you do not specify this value, then the operation assumes the user whose credentials are used to call the operation.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
