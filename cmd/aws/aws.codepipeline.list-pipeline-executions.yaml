name: list-pipeline-executions
description: Gets a summary of the most recent executions for a pipeline.
flags:
    --filter=: The pipeline execution to filter on.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token that was returned from the previous `ListPipelineExecutions` call, which can be used to return the next set of pipeline executions in the list.
    --pipeline-name=!: The name of the pipeline for which you want to get execution summary information.
documentation:
    command: |-
        Gets a summary of the most recent executions for a pipeline.

        When applying the filter for pipeline executions that have succeeded in the stage, the operation returns all executions in the current pipeline version beginning on February 1, 2024.
    flag:
        filter: The pipeline execution to filter on.
        max-results: The maximum number of results to return in a single call. To retrieve the remaining results, make another call with the returned nextToken value. Pipeline history is limited to the most recent 12 months, based on pipeline execution start times. Default value is 100.
        next-token: The token that was returned from the previous `ListPipelineExecutions` call, which can be used to return the next set of pipeline executions in the list.
        pipeline-name: The name of the pipeline for which you want to get execution summary information.
