name: delete-version
description: '*(ALPHA)*  Delete an existing Vertex AI model version.'
flags:
    --region=: Cloud region for the model.
documentation:
    command: |-
        ## EXAMPLES

        To delete a model `123` of version `1234` under project `example` in region
        `us-central1`, run:

          $ gcloud alpha ai models delete-version 123@1234 --project=example --region=us-central1
    flag:
        region: |-
            Cloud region for the model.
            +
            To set the `region` attribute:
            * provide the argument `model_version` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
