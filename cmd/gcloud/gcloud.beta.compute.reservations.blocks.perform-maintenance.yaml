name: perform-maintenance
description: '*(BETA)*  Perform maintenance on a reservation block within a reservation.'
flags:
    --block-name=!: The name of the reservation block.
    --scope=: The maintenance scope to set for the reservation block.
    --zone=: Zone of the reservation to perform-maintenance.
completion:
    flag:
        scope:
            - all
            - running
            - unused
documentation:
    command: '*(BETA)*  Perform maintenance on a reservation block within a reservation.'
    flag:
        block-name: The name of the reservation block.
        scope: |-
            The maintenance scope to set for the reservation block. _SCOPE_ must be one of:
            +
            *all*::: Perform maintenance on all hosts in the reservation block.
            *running*::: Perform maintenance only on the hosts in the reservation block that have running VMs.
            *unused*::: Perform maintenance only on the hosts in the reservation block that don't have running VMs.
            :::
            +
        zone: |-
            Zone of the reservation to perform-maintenance. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
