name: get-job-runs
description: Retrieves metadata for all runs of a given job definition.
flags:
    --job-name=!: The name of the job definition for which to retrieve all job runs.
    --max-results=: The maximum size of the response.
    --next-token=: A continuation token, if this is a continuation call.
documentation:
    command: |-
        Retrieves metadata for all runs of a given job definition.

        `GetJobRuns` returns the job runs in chronological order, with the newest jobs returned first.
    flag:
        job-name: The name of the job definition for which to retrieve all job runs.
        max-results: The maximum size of the response.
        next-token: A continuation token, if this is a continuation call.
