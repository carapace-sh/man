name: describe-stream
description: Describes the specified Kinesis data stream.
flags:
    --exclusive-start-shard-id=: The shard ID of the shard to start with.
    --limit=: The maximum number of shards to return in a single call.
    --stream-arn=: The ARN of the stream.
    --stream-name=: The name of the stream to describe.
documentation:
    command: |-
        Describes the specified Kinesis data stream.

        This API has been revised. It's highly recommended that you use the [DescribeStreamSummary]() API to get a summarized description of the specified Kinesis data stream and the [ListShards]() API to list the shards in a specified data stream and obtain information about each shard.

        When invoking this API, you must use either the `StreamARN` or the `StreamName` parameter, or both. It is recommended that you use the `StreamARN` input parameter when you invoke this API.

        The information returned includes the stream name, Amazon Resource Name (ARN), creation time, enhanced metric configuration, and shard map. The shard map is an array of shard objects. For each shard object, there is the hash key and sequence number ranges that the shard spans, and the IDs of any earlier shards that played in a role in creating the shard. Every record ingested in the stream is identified by a sequence number, which is assigned when the record is put into the stream.

        You can limit the number of shards returned by each call. For more information, see [Retrieving Shards from a Stream](https://docs.aws.amazon.com/kinesis/latest/dev/kinesis-using-sdk-java-retrieve-shards.html) in the *Amazon Kinesis Data Streams Developer Guide*.

        There are no guarantees about the chronological order shards returned. To process shards in chronological order, use the ID of the parent shard to track the lineage to the oldest shard.

        This operation has a limit of 10 transactions per second per account.
    flag:
        exclusive-start-shard-id: |-
            The shard ID of the shard to start with.

            Specify this parameter to indicate that you want to describe the stream starting with the shard whose ID immediately follows `ExclusiveStartShardId`.

            If you don't specify this parameter, the default behavior for `DescribeStream` is to describe the stream starting with the first shard in the stream.
        limit: The maximum number of shards to return in a single call. The default value is 100. If you specify a value greater than 100, at most 100 results are returned.
        stream-arn: The ARN of the stream.
        stream-name: The name of the stream to describe.
