name: delete-workspace-api-key
description: Deletes a Grafana API key for the workspace.
flags:
    --key-name=!: The name of the API key to delete.
    --workspace-id=!: The ID of the workspace to delete.
documentation:
    command: |-
        Deletes a Grafana API key for the workspace.

        In workspaces compatible with Grafana version 9 or above, use workspace service accounts instead of API keys. API keys will be removed in a future release.
    flag:
        key-name: The name of the API key to delete.
        workspace-id: The ID of the workspace to delete.
