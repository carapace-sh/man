name: describe-model-card
description: Describes the content, creation time, and security configuration of an Amazon SageMaker Model Card.
flags:
    --model-card-name=!: The name or Amazon Resource Name (ARN) of the model card to describe.
    --model-card-version=: The version of the model card to describe.
documentation:
    command: Describes the content, creation time, and security configuration of an Amazon SageMaker Model Card.
    flag:
        model-card-name: The name or Amazon Resource Name (ARN) of the model card to describe.
        model-card-version: The version of the model card to describe. If a version is not provided, then the latest version of the model card is described.
