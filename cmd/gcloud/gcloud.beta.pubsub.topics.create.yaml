documentation:
    command: '*(BETA)*  Creates one or more Cloud Pub/Sub topics.'
    flag:
        aws-msk-ingestion-aws-role-arn: AWS role ARN to be used for Federated Identity authentication with MSK.
        aws-msk-ingestion-cluster-arn: ARN that uniquely identifies the MSK cluster.
        aws-msk-ingestion-service-account: Google Cloud service account to be used for Federated Identity authentication with MSK.
        aws-msk-ingestion-topic: Name of the MSK topic that Pub/Sub will import from.
        azure-event-hubs-ingestion-client-id: Azure Event Hubs client ID to use for ingestion.
        azure-event-hubs-ingestion-event-hub: Azure event hub from which to ingest data.
        azure-event-hubs-ingestion-namespace: Azure Event Hubs namespace from which to ingest data.
        azure-event-hubs-ingestion-resource-group: Azure Event Hubs resource group from within an Azure subscription.
        azure-event-hubs-ingestion-service-account: Google Cloud service account to be used for Federated Identity authentication with Azure Event Hubs.
        azure-event-hubs-ingestion-subscription-id: Azure Event Hubs subscription ID to use for ingestion.
        azure-event-hubs-ingestion-tenant-id: Azure Event Hubs tenant ID to use for ingestion.
        cloud-storage-ingestion-bucket: Cloud Storage bucket from which to ingest data.
        cloud-storage-ingestion-input-format: 'Format of the data in the Cloud Storage bucket. _INPUT_FORMAT_ must be one of: *text*, *avro*, *pubsub_avro*.'
        cloud-storage-ingestion-match-glob: Glob pattern used to match Cloud Storage objects that will be ingested. If unset, all objects will be ingested.
        cloud-storage-ingestion-minimum-object-create-time: Only Cloud Storage objects with a larger or equal creation timestamp will be ingested.
        cloud-storage-ingestion-text-delimiter: Delimiter to use with text format when partitioning the object.
        confluent-cloud-ingestion-bootstrap-server: Confluent Cloud bootstrap server. The format is url:port.
        confluent-cloud-ingestion-cluster-id: Confluent Cloud cluster ID.
        confluent-cloud-ingestion-identity-pool-id: Identity pool ID to be used for Federated Identity authentication with Confluent Cloud.
        confluent-cloud-ingestion-service-account: Google Cloud service account to be used for Federated Identity authentication with Confluent Cloud.
        confluent-cloud-ingestion-topic: Name of the Confluent Cloud topic that Pub/Sub will import from.
        first-revision-id: |-
            The id of the oldest
                  revision allowed for the specified schema.
        ingestion-log-severity: Log severity to use for ingestion.
        kinesis-ingestion-consumer-arn: Kinesis data streams consumer Amazon Resource Name (ARN) to use for ingestion.
        kinesis-ingestion-role-arn: AWS role ARN to be used for Federated Identity authentication with Kinesis.
        kinesis-ingestion-service-account: Google Cloud service account to be used for Federated Identity authentication with Kinesis.
        kinesis-ingestion-stream-arn: Kinesis data stream ARN from which to ingest data.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        last-revision-id: |-
            The id of the most recent
                  revision allowed for the specified schema
        message-encoding: 'The encoding of messages validated against the schema. _ENCODING_ must be one of: *json*, *binary*.'
        message-retention-duration: |-
            Indicates the minimum duration to retain a message after it is
            published to the topic. If this field is set, messages published to
            the topic in the last MESSAGE_RETENTION_DURATION are always available
            to subscribers. For instance, it allows any attached subscription to
            seek to a timestamp that is up to MESSAGE_RETENTION_DURATION in the
            past. If this field is not set, message retention is controlled by
            settings on individual subscriptions. The minimum is 10 minutes and
            the maximum is 31 days. Valid values are strings of the form INTEGER[UNIT], where UNIT is one of "s", "m", "h", and "d" for seconds, minutes, hours, and days, respectively. If the unit is omitted, seconds is assumed.
        message-storage-policy-allowed-regions: A list of one or more Cloud regions where messages are allowed to be stored at rest.
        message-storage-policy-enforce-in-transit: Whether or not to enforce in-transit guarantees for this topic using the allowed regions. This ensures that publishing, pulling, and push delivery are only handled in allowed Cloud regions.
        message-transforms-file: Path to YAML or JSON file containing message transforms.
        no-message-storage-policy-enforce-in-transit: Whether or not to enforce in-transit guarantees for this topic using the allowed regions. This ensures that publishing, pulling, and push delivery are only handled in allowed Cloud regions.
        schema: |-
            ID of the schema or fully qualified identifier for the schema.
            +
            To set the `schema` attribute:
            * provide the argument `--schema` on the command line.
        schema-project: |-
            Project ID of the Google Cloud project for the schema.
            +
            To set the `project` attribute:
            * provide the argument `--schema` on the command line with a fully specified name;
            * provide the argument `--schema-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
        tags: |-
            List of tags KEY=VALUE pairs to bind. Each item must be expressed as `<tag-key-namespaced-name>=<tag-value-short-name>`.
            Example: `123/environment=production,123/costCenter=marketing`
        topic-encryption-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--topic-encryption-key` on the command line.
        topic-encryption-key-keyring: |-
            The KMS keyring of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--topic-encryption-key` on the command line with a fully specified name;
            * provide the argument `--topic-encryption-key-keyring` on the command line.
        topic-encryption-key-location: |-
            The Google Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--topic-encryption-key` on the command line with a fully specified name;
            * provide the argument `--topic-encryption-key-location` on the command line.
        topic-encryption-key-project: |-
            The Google Cloud project for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--topic-encryption-key` on the command line with a fully specified name;
            * provide the argument `--topic-encryption-key-project` on the command line;
            * set the property `core/project`.
