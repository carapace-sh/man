name: describe-patch-groups
description: Lists all patch groups that have been registered with patch baselines.
flags:
    --filters=: Each element in the array is a structure containing a key-value pair.
    --max-results=: The maximum number of patch groups to return (per page).
    --next-token=: The token for the next set of items to return.
documentation:
    command: Lists all patch groups that have been registered with patch baselines.
    flag:
        filters: "Each element in the array is a structure containing a key-value pair.\n\nSupported keys for `DescribePatchGroups` include the following:\n\n- **`NAME_PREFIX`**\n  \n  Sample values: `AWS-` | `My-`.\n- **`OPERATING_SYSTEM`**\n  \n  Sample values: `AMAZON_LINUX` | `SUSE` | `WINDOWS`"
        max-results: The maximum number of patch groups to return (per page).
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
