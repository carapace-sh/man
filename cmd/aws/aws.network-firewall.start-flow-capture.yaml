name: start-flow-capture
description: Begins capturing the flows in a firewall, according to the filters you define.
flags:
    --availability-zone=: The ID of the Availability Zone where the firewall is located.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --firewall-arn=!: The Amazon Resource Name (ARN) of the firewall.
    --flow-filters=!: Defines the scope a flow operation.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --minimum-flow-age-in-seconds=: The reqested `FlowOperation` ignores flows with an age (in seconds) lower than `MinimumFlowAgeInSeconds`.
    --vpc-endpoint-association-arn=: The Amazon Resource Name (ARN) of a VPC endpoint association.
    --vpc-endpoint-id=: A unique identifier for the primary endpoint associated with a firewall.
documentation:
    command: |-
        Begins capturing the flows in a firewall, according to the filters you define. Captures are similar, but not identical to snapshots. Capture operations provide visibility into flows that are not closed and are tracked by a firewall's flow table. Unlike snapshots, captures are a time-boxed view.

        A flow is network traffic that is monitored by a firewall, either by stateful or stateless rules. For traffic to be considered part of a flow, it must share Destination, DestinationPort, Direction, Protocol, Source, and SourcePort.

        To avoid encountering operation limits, you should avoid starting captures with broad filters, like wide IP ranges. Instead, we recommend you define more specific criteria with `FlowFilters`, like narrow IP ranges, ports, or protocols.
    flag:
        availability-zone: |-
            The ID of the Availability Zone where the firewall is located. For example, `us-east-2a`.

            Defines the scope a flow operation. You can use up to 20 filters to configure a single flow operation.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        firewall-arn: The Amazon Resource Name (ARN) of the firewall.
        flow-filters: Defines the scope a flow operation. You can use up to 20 filters to configure a single flow operation.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        minimum-flow-age-in-seconds: |-
            The reqested `FlowOperation` ignores flows with an age (in seconds) lower than `MinimumFlowAgeInSeconds`. You provide this for start commands.

            We recommend setting this value to at least 1 minute (60 seconds) to reduce chance of capturing flows that are not yet established.
        vpc-endpoint-association-arn: The Amazon Resource Name (ARN) of a VPC endpoint association.
        vpc-endpoint-id: A unique identifier for the primary endpoint associated with a firewall.
