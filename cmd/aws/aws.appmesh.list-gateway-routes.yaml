name: list-gateway-routes
description: Returns a list of existing gateway routes that are associated to a virtual gateway.
flags:
    --limit=: The maximum number of results returned by `ListGatewayRoutes` in paginated output.
    --mesh-name=!: The name of the service mesh to list gateway routes in.
    --mesh-owner=: The Amazon Web Services IAM account ID of the service mesh owner.
    --next-token=: The `nextToken` value returned from a previous paginated `ListGatewayRoutes` request where `limit` was used and the results exceeded the value of that parameter.
    --virtual-gateway-name=!: The name of the virtual gateway to list gateway routes in.
documentation:
    command: Returns a list of existing gateway routes that are associated to a virtual gateway.
    flag:
        limit: The maximum number of results returned by `ListGatewayRoutes` in paginated output. When you use this parameter, `ListGatewayRoutes` returns only `limit` results in a single page along with a `nextToken` response element. You can see the remaining results of the initial request by sending another `ListGatewayRoutes` request with the returned `nextToken` value. This value can be between 1 and 100. If you don't use this parameter, `ListGatewayRoutes` returns up to 100 results and a `nextToken` value if applicable.
        mesh-name: The name of the service mesh to list gateway routes in.
        mesh-owner: The Amazon Web Services IAM account ID of the service mesh owner. If the account ID is not your own, then it's the ID of the account that shared the mesh with your account. For more information about mesh sharing, see [Working with shared meshes](https://docs.aws.amazon.com/app-mesh/latest/userguide/sharing.html).
        next-token: The `nextToken` value returned from a previous paginated `ListGatewayRoutes` request where `limit` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `nextToken` value.
        virtual-gateway-name: The name of the virtual gateway to list gateway routes in.
