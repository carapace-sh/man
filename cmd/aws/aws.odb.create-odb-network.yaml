name: create-odb-network
description: Creates an ODB network.
flags:
    --availability-zone-id=: The AZ ID of the AZ where the ODB network is located.
    --availability-zone=: The Amazon Web Services Availability Zone (AZ) where the ODB network is located.
    --backup-subnet-cidr=: The CIDR range of the backup subnet for the ODB network.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-subnet-cidr=!: The CIDR range of the client subnet for the ODB network.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --cross-region-s3-restore-sources-to-enable=:
        description: The cross-Region Amazon S3 restore sources to enable for the ODB network.
        nargs: -1
    --custom-domain-name=: The domain name to use for the resources in the ODB network.
    --default-dns-prefix=: The DNS prefix to the default DNS domain name.
    --display-name=!: A user-friendly name for the ODB network.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-access=: The Amazon Web Services Key Management Service (KMS) access configuration for the ODB network.
    --kms-policy-document=: The KMS policy document that defines permissions for key usage within the ODB network.
    --s3-access=: Specifies the configuration for Amazon S3 access from the ODB network.
    --s3-policy-document=: Specifies the endpoint policy for Amazon S3 access from the ODB network.
    --sts-access=: The Amazon Web Services Security Token Service (STS) access configuration for the ODB network.
    --sts-policy-document=: The STS policy document that defines permissions for token service usage within the ODB network.
    --tags=: The list of resource tags to apply to the ODB network.
    --zero-etl-access=: Specifies the configuration for Zero-ETL access from the ODB network.
completion:
    flag:
        kms-access:
            - ENABLED
            - DISABLED
        s3-access:
            - ENABLED
            - DISABLED
        sts-access:
            - ENABLED
            - DISABLED
        zero-etl-access:
            - ENABLED
            - DISABLED
documentation:
    command: Creates an ODB network.
    flag:
        availability-zone: |-
            The Amazon Web Services Availability Zone (AZ) where the ODB network is located.

            This operation requires that you specify a value for either `availabilityZone` or `availabilityZoneId`.
        availability-zone-id: |-
            The AZ ID of the AZ where the ODB network is located.

            This operation requires that you specify a value for either `availabilityZone` or `availabilityZoneId`.
        backup-subnet-cidr: "The CIDR range of the backup subnet for the ODB network.\n\nConstraints:\n\n- Must not overlap with the CIDR range of the client subnet.\n- Must not overlap with the CIDR ranges of the VPCs that are connected to the ODB network.\n- Must not use the following CIDR ranges that are reserved by OCI:\n  \n  - `100.106.0.0/16` and `100.107.0.0/16`\n  - `169.254.0.0/16`\n  - `224.0.0.0 - 239.255.255.255`\n  - `240.0.0.0 - 255.255.255.255`"
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-subnet-cidr: "The CIDR range of the client subnet for the ODB network.\n\nConstraints:\n\n- Must not overlap with the CIDR range of the backup subnet.\n- Must not overlap with the CIDR ranges of the VPCs that are connected to the ODB network.\n- Must not use the following CIDR ranges that are reserved by OCI:\n  \n  - `100.106.0.0/16` and `100.107.0.0/16`\n  - `169.254.0.0/16`\n  - `224.0.0.0 - 239.255.255.255`\n  - `240.0.0.0 - 255.255.255.255`"
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you don't specify a client token, the Amazon Web Services SDK automatically generates a client token and uses it for the request to ensure idempotency. The client token is valid for up to 24 hours after it's first used.
        cross-region-s3-restore-sources-to-enable: The cross-Region Amazon S3 restore sources to enable for the ODB network.
        custom-domain-name: The domain name to use for the resources in the ODB network.
        default-dns-prefix: The DNS prefix to the default DNS domain name. The default DNS domain name is oraclevcn.com.
        display-name: A user-friendly name for the ODB network.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-access: The Amazon Web Services Key Management Service (KMS) access configuration for the ODB network.
        kms-policy-document: The KMS policy document that defines permissions for key usage within the ODB network.
        s3-access: Specifies the configuration for Amazon S3 access from the ODB network.
        s3-policy-document: Specifies the endpoint policy for Amazon S3 access from the ODB network.
        sts-access: The Amazon Web Services Security Token Service (STS) access configuration for the ODB network.
        sts-policy-document: The STS policy document that defines permissions for token service usage within the ODB network.
        tags: The list of resource tags to apply to the ODB network.
        zero-etl-access: Specifies the configuration for Zero-ETL access from the ODB network.
