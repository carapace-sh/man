name: activate-type
description: Activates a public third-party extension, such as a resource or module, to make it available for use in stack templates in your current account and Region.
flags:
    --auto-update: Whether to automatically update the extension in this account and Region when a new *minor* version is published by the extension publisher.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --execution-role-arn=: The name of the IAM execution role to use to activate the extension.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --logging-config=: Contains logging configuration information for an extension.
    --major-version=: The major version of this extension you want to activate, if multiple major versions are available.
    --no-auto-update: Whether to automatically update the extension in this account and Region when a new *minor* version is published by the extension publisher.
    --public-type-arn=: The Amazon Resource Name (ARN) of the public extension.
    --publisher-id=: The ID of the extension publisher.
    --type-name-alias=: An alias to assign to the public extension in this account and Region.
    --type-name=: The name of the extension.
    --type=: The extension type.
    --version-bump=: Manually updates a previously-activated type to a new major or minor version, if available.
completion:
    flag:
        type:
            - RESOURCE
            - MODULE
            - HOOK
        version-bump:
            - MAJOR
            - MINOR
documentation:
    command: |-
        Activates a public third-party extension, such as a resource or module, to make it available for use in stack templates in your current account and Region. It can also create CloudFormation Hooks, which allow you to evaluate resource configurations before CloudFormation provisions them. Hooks integrate with both CloudFormation and Cloud Control API operations.

        After you activate an extension, you can use [SetTypeConfiguration](https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_SetTypeConfiguration.html) to set specific properties for the extension.

        To see which extensions have been activated, use [ListTypes](https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_ListTypes.html). To see configuration details for an extension, use [DescribeType](https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_DescribeType.html).

        For more information, see [Activate a third-party public extension in your account](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/registry-public-activate-extension.html) in the *CloudFormation User Guide*. For information about creating Hooks, see the [CloudFormation Hooks User Guide](https://docs.aws.amazon.com/cloudformation-cli/latest/hooks-userguide/what-is-cloudformation-hooks.html).
    flag:
        auto-update: |-
            Whether to automatically update the extension in this account and Region when a new *minor* version is published by the extension publisher. Major versions released by the publisher must be manually updated.

            The default is `true`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        execution-role-arn: The name of the IAM execution role to use to activate the extension.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        logging-config: Contains logging configuration information for an extension.
        major-version: |-
            The major version of this extension you want to activate, if multiple major versions are available. The default is the latest major version. CloudFormation uses the latest available *minor* version of the major version selected.

            You can specify `MajorVersion` or `VersionBump`, but not both.
        public-type-arn: |-
            The Amazon Resource Name (ARN) of the public extension.

            Conditional: You must specify `PublicTypeArn`, or `TypeName`, `Type`, and `PublisherId`.
        publisher-id: |-
            The ID of the extension publisher.

            Conditional: You must specify `PublicTypeArn`, or `TypeName`, `Type`, and `PublisherId`.
        type: |-
            The extension type.

            Conditional: You must specify `PublicTypeArn`, or `TypeName`, `Type`, and `PublisherId`.
        type-name: |-
            The name of the extension.

            Conditional: You must specify `PublicTypeArn`, or `TypeName`, `Type`, and `PublisherId`.
        type-name-alias: |-
            An alias to assign to the public extension in this account and Region. If you specify an alias for the extension, CloudFormation treats the alias as the extension type name within this account and Region. You must use the alias to refer to the extension in your templates, API calls, and CloudFormation console.

            An extension alias must be unique within a given account and Region. You can activate the same public resource multiple times in the same account and Region, using different type name aliases.
        version-bump: |-
            Manually updates a previously-activated type to a new major or minor version, if available. You can also use this parameter to update the value of `AutoUpdate`.

            - `MAJOR`: CloudFormation updates the extension to the newest major version, if one is available.
            - `MINOR`: CloudFormation updates the extension to the newest minor version, if one is available.
