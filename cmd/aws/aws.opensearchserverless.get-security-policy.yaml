name: get-security-policy
description: Returns information about a configured OpenSearch Serverless security policy.
flags:
    --name=!: The name of the security policy.
    --type=!: The type of security policy.
completion:
    flag:
        type:
            - encryption
            - network
documentation:
    command: Returns information about a configured OpenSearch Serverless security policy. For more information, see [Network access for Amazon OpenSearch Serverless](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-network.html) and [Encryption at rest for Amazon OpenSearch Serverless](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-encryption.html).
    flag:
        name: The name of the security policy.
        type: The type of security policy.
