name: cancel
description: Cancel a Cloud API Gateway operation.
flags:
    --location=: Cloud location for operation.
documentation:
    command: Cancel a Cloud API Gateway operation.
    flag:
        location: |-
            Cloud location for operation.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
