name: update-chap-credentials
description: Updates the Challenge-Handshake Authentication Protocol (CHAP) credentials for a specified iSCSI target.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --initiator-name=!: The iSCSI initiator that connects to the target.
    --secret-to-authenticate-initiator=!: The secret key that the initiator (for example, the Windows client) must provide to participate in mutual CHAP with the target.
    --secret-to-authenticate-target=: The secret key that the target must provide to participate in mutual CHAP with the initiator (e.g. Windows client).
    --target-arn=!: The Amazon Resource Name (ARN) of the iSCSI volume target.
documentation:
    command: |-
        Updates the Challenge-Handshake Authentication Protocol (CHAP) credentials for a specified iSCSI target. By default, a gateway does not have CHAP enabled; however, for added security, you might use it. This operation is supported in the volume and tape gateway types.

        When you update CHAP credentials, all existing connections on the target are closed and initiators must reconnect with the new credentials.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        initiator-name: The iSCSI initiator that connects to the target.
        secret-to-authenticate-initiator: |-
            The secret key that the initiator (for example, the Windows client) must provide to participate in mutual CHAP with the target.

            The secret key must be between 12 and 16 bytes when encoded in UTF-8.
        secret-to-authenticate-target: |-
            The secret key that the target must provide to participate in mutual CHAP with the initiator (e.g. Windows client).

            Byte constraints: Minimum bytes of 12. Maximum bytes of 16.

            The secret key must be between 12 and 16 bytes when encoded in UTF-8.
        target-arn: The Amazon Resource Name (ARN) of the iSCSI volume target. Use the [DescribeStorediSCSIVolumes]() operation to return the TargetARN for specified VolumeARN.
