name: update-vehicle
description: Updates a vehicle.
flags:
    --attribute-update-mode=: The method the specified attributes will update the existing attributes on the vehicle.
    --attributes=: Static information about a vehicle in a key-value pair.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --decoder-manifest-arn=: The ARN of the decoder manifest associated with this vehicle.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --model-manifest-arn=: The ARN of a vehicle model (model manifest) associated with the vehicle.
    --state-templates-to-add=:
        description: Associate state templates with the vehicle.
        nargs: -1
    --state-templates-to-remove=:
        description: Remove state templates from the vehicle.
        nargs: -1
    --state-templates-to-update=:
        description: Change the `stateTemplateUpdateStrategy` of state templates already associated with the vehicle.
        nargs: -1
    --vehicle-name=!: The unique ID of the vehicle to update.
completion:
    flag:
        attribute-update-mode:
            - Overwrite
            - Merge
documentation:
    command: |-
        Updates a vehicle.

        Access to certain Amazon Web Services IoT FleetWise features is currently gated. For more information, see [Amazon Web Services Region and feature availability](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/fleetwise-regions.html) in the *Amazon Web Services IoT FleetWise Developer Guide*.
    flag:
        attribute-update-mode: |-
            The method the specified attributes will update the existing attributes on the vehicle. Use`Overwite` to replace the vehicle attributes with the specified attributes. Or use `Merge` to combine all attributes.

            This is required if attributes are present in the input.
        attributes: |-
            Static information about a vehicle in a key-value pair. For example:

            `"engineType"` : `"1.3 L R2"`
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        decoder-manifest-arn: The ARN of the decoder manifest associated with this vehicle.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        model-manifest-arn: The ARN of a vehicle model (model manifest) associated with the vehicle.
        state-templates-to-add: Associate state templates with the vehicle.
        state-templates-to-remove: Remove state templates from the vehicle.
        state-templates-to-update: Change the `stateTemplateUpdateStrategy` of state templates already associated with the vehicle.
        vehicle-name: The unique ID of the vehicle to update.
