name: delete-application-reference-data-source
description: Deletes a reference data source configuration from the specified SQL-based Kinesis Data Analytics application's configuration.
flags:
    --application-name=!: The name of an existing application.
    --current-application-version-id=!: The current application version.
    --reference-id=!: The ID of the reference data source.
documentation:
    command: |-
        Deletes a reference data source configuration from the specified SQL-based Kinesis Data Analytics application's configuration.

        If the application is running, Kinesis Data Analytics immediately removes the in-application table that you created using the [AddApplicationReferenceDataSource]() operation.
    flag:
        application-name: The name of an existing application.
        current-application-version-id: The current application version. You can use the [DescribeApplication]() operation to get the current application version. If the version specified is not the current version, the `ConcurrentModificationException` is returned.
        reference-id: The ID of the reference data source. When you add a reference data source to your application using the [AddApplicationReferenceDataSource](), Kinesis Data Analytics assigns an ID. You can use the [DescribeApplication]() operation to get the reference ID.
