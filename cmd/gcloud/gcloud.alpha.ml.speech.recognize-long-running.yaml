documentation:
    command: |
        *(ALPHA)*  Get a transcript of audio up to 80 minutes in length. If the audio is
        under 60 seconds, you may also use `gcloud alpha ml speech recognize` to
        analyze it.
    flag:
        additional-language-codes: |-
            The BCP-47 language tags of other languages that the speech may be in.
            Up to 3 can be provided.
            +
            If alternative languages are listed, recognition result will contain recognition
            in the most likely language detected including the main language-code.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        audio-channel-count: 'The number of channels in the input audio data.  Set this for separate-channel-recognition. Valid values are: 1)LINEAR16 and FLAC are 1-8 2)OGG_OPUS are 1-254 3) MULAW, AMR, AMR_WB and SPEEX_WITH_HEADER_BYTE is only `1`.'
        audio-topic: |-
            (DEPRECATED) Description of the content, e.g. "Recordings of federal supreme court hearings from 2012".
            +
            The `audio-topic` flag is deprecated and will be removed. The Google Cloud Speech-to-text api does not use it, and only passes it through back into response.
        diarization-speaker-count: |-
            (DEPRECATED) Estimated number of speakers in the conversation being recognized.
            +
            The `--diarization-speaker-count` flag is deprecated. Use the `--min-diarization-speaker-count` and/or `--max-diarization-speaker-count` flag instead.
        enable-automatic-punctuation: Adds punctuation to recognition result hypotheses.
        enable-speaker-diarization: Enable speaker detection for each recognized word in the top alternative of the recognition result using an integer speaker_tag provided in the WordInfo.
        encoding: 'The type of encoding of the file. Required if the file format is not WAV or FLAC. _ENCODING_ must be one of: *alaw*, *amr*, *amr-wb*, *encoding-unspecified*, *flac*, *linear16*, *mp3*, *mulaw*, *ogg-opus*, *speex-with-header-byte*, *webm-opus*.'
        filter-profanity: If True, the server will attempt to filter out profanities, replacing all but the initial character in each filtered word with asterisks, e.g. ```f***```.
        hints: A list of strings containing word and phrase "hints" so that the speech recognition is more likely to recognize them. This can be used to improve the accuracy for specific words and phrases, for example, if specific commands are typically spoken by the user. This can also be used to add additional words to the vocabulary of the recognizer. See https://cloud.google.com/speech/limits#content.
        include-word-confidence: Include a list of words and the confidence for those words in the top result.
        include-word-time-offsets: If True, the top result includes a list of words with the start and end time offsets (timestamps) for those words. If False, no word-level time offset information is returned.
        interaction-type: |-
            (DEPRECATED) Determining the interaction type in the conversation.
            +
            The `interaction-type` flag is deprecated and will be removed. The Google Cloud Speech-to-text api does not use it, and only passes it through back into response. _INTERACTION_TYPE_ must be one of:
            +
            *dictation*::: Transcribe speech to text to create a written document, such as a text-message, email or report.
            *discussion*::: Multiple people in a conversation or discussion.
            *phone-call*::: A phone-call or video-conference in which two or more people, who are not in the same room, are actively participating.
            *presentation*::: One or more persons lecturing or presenting to others, mostly uninterrupted.
            *professionally-produced*::: Professionally produced audio (eg. TV Show, Podcast).
            *voicemail*::: A recorded message intended for another person to listen to.
            *voice-command*::: Transcribe voice commands, such as for controlling a device.
            *voice-search*::: Transcribe spoken questions and queries into text.
            :::
            +
        language: |-
            (DEPRECATED) The language of the supplied audio as a BCP-47 (https://www.rfc-editor.org/rfc/bcp/bcp47.txt) language tag. Example: "en-US". See https://cloud.google.com/speech/docs/languages for a list of the currently supported language codes.
            +
            The `--language` flag is deprecated. Use the `--language-code` flag instead.
        language-code: 'The language of the supplied audio as a BCP-47 (https://www.rfc-editor.org/rfc/bcp/bcp47.txt) language tag. Example: "en-US". See https://cloud.google.com/speech/docs/languages for a list of the currently supported language codes.'
        max-alternatives: Maximum number of recognition hypotheses to be returned. The server may return fewer than max_alternatives. Valid values are 0-30. A value of 0 or 1 will return a maximum of one.
        max-diarization-speaker-count: Maximum estimated number of speakers in the conversation being recognized.
        microphone-distance: |-
            (DEPRECATED) The distance at which the audio device is placed to record the conversation.
            +
            The `microphone-distance` flag is deprecated and will be removed. The Google Cloud Speech-to-text api does not use it, and only passes it through back into response. _MICROPHONE_DISTANCE_ must be one of:
            +
            *farfield*::: The speaker is more than 3 meters away from the microphone.
            *midfield*::: The speaker is within 3 meters of the microphone.
            *nearfield*::: The audio was captured from a microphone close to the speaker, generally within
             1 meter. Examples include a phone, dictaphone, or handheld microphone.
            :::
            +
        min-diarization-speaker-count: Minimum estimated number of speakers in the conversation being recognized.
        model: |-
            Select the model best suited to your domain to get best results. If you do not explicitly specify a model, Speech-to-Text will auto-select a model based on your other specified parameters. Some models are premium and cost more than standard models (although you can reduce the price by opting into https://cloud.google.com/speech-to-text/docs/data-logging). _MODEL_ must be one of:
            +
            *command_and_search*::: short queries such as voice commands or voice search.
            *default*::: audio that is not one of the specific audio models. For example, long-form audio. Ideally the audio is high-fidelity, recorded at a 16khz or greater sampling rate.
            *latest_long*::: Use this model for any kind of long form content such as media or spontaneous speech and conversations. Consider using this model in place of the video model, especially if the video model is not available in your target language. You can also use this in place of the default model.
            *latest_short*::: Use this model for short utterances that are a few seconds in length. It is useful for trying to capture commands or other single shot directed speech use cases. Consider using this model instead of the command and search model.
            *medical_conversation*::: Best for audio that originated from a conversation between a medical provider and patient.
            *medical_dictation*::: Best for audio that originated from dictation notes by a medical provider.
            *phone_call*::: audio that originated from a phone call (typically recorded at an 8khz sampling rate).
            *phone_call_enhanced*::: audio that originated from a phone call (typically recorded at an 8khz sampling rate). This is a premium model and can produce better results but costs more than the standard rate.
            *telephony*::: Improved version of the "phone_call" model, best for audio that originated from a phone call, typically recorded at an 8kHz sampling rate.
            *telephony_short*::: Dedicated version of the modern "telephony" model for short or even single-word utterances for audio that originated from a phone call, typically recorded at an 8kHz sampling rate.
            *video_enhanced*::: audio that originated from video or includes multiple speakers. Ideally the audio is recorded at a 16khz or greater sampling rate. This is a premium model that costs more than the standard rate.
            :::
            +
        naics-code: |-
            (DEPRECATED) The industry vertical to which this speech recognition request most closely applies.
            +
            The `naics-code` flag is deprecated and will be removed. The Google Cloud Speech-to-text api does not use it, and only passes it through back into response.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-automatic-punctuation: Adds punctuation to recognition result hypotheses.
        no-enable-speaker-diarization: Enable speaker detection for each recognized word in the top alternative of the recognition result using an integer speaker_tag provided in the WordInfo.
        no-filter-profanity: If True, the server will attempt to filter out profanities, replacing all but the initial character in each filtered word with asterisks, e.g. ```f***```.
        no-include-word-confidence: Include a list of words and the confidence for those words in the top result.
        no-include-word-time-offsets: If True, the top result includes a list of words with the start and end time offsets (timestamps) for those words. If False, no word-level time offset information is returned.
        no-separate-channel-recognition: Recognition result will contain a `channel_tag` field to state which channel that result belongs to. If this is not true, only the first channel will be recognized.
        original-media-type: |-
            (DEPRECATED) The media type of the original audio conversation.
            +
            The `original-media-type` flag is deprecated and will be removed. The Google Cloud Speech-to-text api does not use it, and only passes it through back into response. _ORIGINAL_MEDIA_TYPE_ must be one of:
            +
            *audio*::: The speech data is an audio recording.
            *video*::: The speech data originally recorded on a video.
            :::
            +
        original-mime-type: |-
            (DEPRECATED) Mime type of the original audio file. Examples: `audio/m4a`,  `audio/mp3`.
            +
            The `original-mime-type` flag is deprecated and will be removed. The Google Cloud Speech-to-text api does not use it, and only passes it through back into response.
        output-uri: Location to which the results should be written. Must be a Google Cloud Storage URI.
        recording-device-name: |-
            (DEPRECATED) The device used to make the recording.  Examples: `Nexus 5X`, `Polycom SoundStation IP 6000`
            +
            The `recording-device-name` flag is deprecated and will be removed. The Google Cloud Speech-to-text api does not use it, and only passes it through back into response.
        recording-device-type: |-
            (DEPRECATED) The device type through which the original audio was recorded on.
            +
            The `recording-device-type` flag is deprecated and will be removed. The Google Cloud Speech-to-text api does not use it, and only passes it through back into response. _RECORDING_DEVICE_TYPE_ must be one of:
            +
            *indoor*::: Speech was recorded indoors.
            *outdoor*::: Speech was recorded outdoors.
            *pc*::: Speech was recorded using a personal computer or tablet.
            *phone-line*::: Speech was recorded over a phone line.
            *smartphone*::: Speech was recorded on a smartphone.
            *vehicle*::: Speech was recorded in a vehicle.
            :::
            +
        sample-rate: The sample rate in Hertz. For best results, set the sampling rate of the audio source to 16000 Hz. If that's not possible, use the native sample rate of the audio source (instead of re-sampling).
        separate-channel-recognition: Recognition result will contain a `channel_tag` field to state which channel that result belongs to. If this is not true, only the first channel will be recognized.
