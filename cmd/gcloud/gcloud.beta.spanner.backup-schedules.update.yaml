name: update
description: '*(BETA)*  Update a Cloud Spanner backup schedule.'
flags:
    --cron=: Textual representation of the crontab.
    --database=: The Cloud Spanner database for the backup-schedule.
    --encryption-type=: The encryption type of the backup.
    --instance=: The Cloud Spanner instance for the backup-schedule.
    --kms-key=!: ID of the key or fully qualified identifier for the key.
    --kms-keyring=: KMS keyring id of the key.
    --kms-keys=!: IDs of the keys or fully qualified identifiers for the keys.
    --kms-location=: Cloud location for the key.
    --kms-project=: Cloud project id for the key.
    --retention-duration=: The retention duration of a backup that must be at least 6 hours and at most 366 days.
completion:
    flag:
        encryption-type:
            - customer-managed-encryption
            - google-default-encryption
            - use-database-encryption
documentation:
    command: '*(BETA)*  Update a Cloud Spanner backup schedule.'
    flag:
        cron: 'Textual representation of the crontab. User can customize the backup frequency and the backup version time using the cron expression. The version time must be in UTC timzeone. The backup will contain an externally consistent copy of the database at the version time. Allowed frequencies are 12 hour, 1 day, 1 week and 1 month. Examples of valid cron specifications: * `0 2/12 * * * ` : every 12 hours at (2, 14) hours past midnight in UTC. * `0 2,14 * * * ` : every 12 hours at (2,14) hours past midnight in UTC. * `0 2 * * * ` : once a day at 2 past midnight in UTC. * `0 2 * * 0 ` : once a week every Sunday at 2 past midnight in UTC. * `0 2 8 * * ` : once a month on 8th day at 2 past midnight in UTC.'
        database: |-
            The Cloud Spanner database for the backup-schedule.
            +
            To set the `database` attribute:
            * provide the argument `backup_schedule` on the command line with a fully specified name;
            * provide the argument `--database` on the command line.
        encryption-type: |-
            The encryption type of the backup. _ENCRYPTION_TYPE_ must be one of:
            +
            *customer-managed-encryption*::: Use the provided Cloud KMS key for encryption. If this option is selected, kms-key must be set.
            *google-default-encryption*::: Use Google default encryption.
            *use-database-encryption*::: Use the same encryption configuration as the database.
            :::
            +
        instance: |-
            The Cloud Spanner instance for the backup-schedule.
            +
            To set the `instance` attribute:
            * provide the argument `backup_schedule` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
        kms-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key` on the command line.
        kms-keyring: |-
            KMS keyring id of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-keys: |-
            IDs of the keys or fully qualified identifiers for the keys.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-keys` on the command line.
        kms-location: |-
            Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line.
        kms-project: |-
            Cloud project id for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line.
        retention-duration: The retention duration of a backup that must be at least 6 hours and at most 366 days. The backup is eligible to be automatically deleted once the retention period has elapsed.
