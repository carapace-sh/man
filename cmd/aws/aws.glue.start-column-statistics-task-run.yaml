name: start-column-statistics-task-run
description: Starts a column statistics task run, for a specified table and columns.
flags:
    --catalog-id=: The ID of the Data Catalog where the table reside.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --column-name-list=:
        description: A list of the column names to generate statistics.
        nargs: -1
    --database-name=!: The name of the database where the table resides.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --role=!: The IAM role that the service assumes to generate statistics.
    --sample-size=: The percentage of rows used to generate statistics.
    --security-configuration=: Name of the security configuration that is used to encrypt CloudWatch logs for the column stats task run.
    --table-name=!: The name of the table to generate statistics.
documentation:
    command: Starts a column statistics task run, for a specified table and columns.
    flag:
        catalog-id: The ID of the Data Catalog where the table reside. If none is supplied, the Amazon Web Services account ID is used by default.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        column-name-list: A list of the column names to generate statistics. If none is supplied, all column names for the table will be used by default.
        database-name: The name of the database where the table resides.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        role: The IAM role that the service assumes to generate statistics.
        sample-size: The percentage of rows used to generate statistics. If none is supplied, the entire table will be used to generate stats.
        security-configuration: Name of the security configuration that is used to encrypt CloudWatch logs for the column stats task run.
        table-name: The name of the table to generate statistics.
