name: search-entities
description: Searches for entities of the specified type.
flags:
    --entity-types=!: The entity types for which to search.
    --filters=: Optional filter to apply to the search.
    --max-results=: The maximum number of results to return in the response.
    --namespace-version=: The version of the user's namespace.
    --next-token=: The string that specifies the next page of results.
documentation:
    command: Searches for entities of the specified type. You can search for entities in your namespace and the public namespace that you're tracking.
    flag:
        entity-types: The entity types for which to search.
        filters: |-
            Optional filter to apply to the search. Valid filters are `NAME` `NAMESPACE`, `SEMANTIC_TYPE_PATH` and `REFERENCED_ENTITY_ID`. `REFERENCED_ENTITY_ID` filters on entities that are used by the entity in the result set. For example, you can filter on the ID of a property that is used in a state.

            Multiple filters function as OR criteria in the query. Multiple values passed inside the filter function as AND criteria.
        max-results: The maximum number of results to return in the response.
        namespace-version: The version of the user's namespace. Defaults to the latest version of the user's namespace.
        next-token: The string that specifies the next page of results. Use this when you're paginating results.
