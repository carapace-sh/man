name: create-load-balancer-tls-certificate
description: Creates an SSL/TLS certificate for an Amazon Lightsail load balancer.
flags:
    --certificate-alternative-names=: An array of strings listing alternative domains and subdomains for your SSL/TLS certificate.
    --certificate-domain-name=!: The domain name (`example.com`) for your SSL/TLS certificate.
    --certificate-name=!: The SSL/TLS certificate name.
    --load-balancer-name=!: The load balancer name where you want to create the SSL/TLS certificate.
    --tags=: The tag keys and optional values to add to the resource during create.
documentation:
    command: |-
        Creates an SSL/TLS certificate for an Amazon Lightsail load balancer.

        TLS is just an updated, more secure version of Secure Socket Layer (SSL).

        The `CreateLoadBalancerTlsCertificate` operation supports tag-based access control via resource tags applied to the resource identified by `load balancer name`. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        certificate-alternative-names: An array of strings listing alternative domains and subdomains for your SSL/TLS certificate. Lightsail will de-dupe the names for you. You can have a maximum of 9 alternative names (in addition to the 1 primary domain). We do not support wildcards (`*.example.com`).
        certificate-domain-name: The domain name (`example.com`) for your SSL/TLS certificate.
        certificate-name: |-
            The SSL/TLS certificate name.

            You can have up to 10 certificates in your account at one time. Each Lightsail load balancer can have up to 2 certificates associated with it at one time. There is also an overall limit to the number of certificates that can be issue in a 365-day period. For more information, see [Limits](http://docs.aws.amazon.com/acm/latest/userguide/acm-limits.html).
        load-balancer-name: The load balancer name where you want to create the SSL/TLS certificate.
        tags: |-
            The tag keys and optional values to add to the resource during create.

            Use the `TagResource` action to tag a resource after it's created.
