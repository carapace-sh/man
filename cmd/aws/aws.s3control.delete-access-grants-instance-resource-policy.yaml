name: delete-access-grants-instance-resource-policy
description: Deletes the resource policy of the S3 Access Grants instance.
flags:
    --account-id=!: The Amazon Web Services account ID of the S3 Access Grants instance.
documentation:
    command: |-
        Deletes the resource policy of the S3 Access Grants instance. The resource policy is used to manage cross-account access to your S3 Access Grants instance. By deleting the resource policy, you delete any cross-account permissions to your S3 Access Grants instance.

        Permissions

        You must have the `s3:DeleteAccessGrantsInstanceResourcePolicy` permission to use this operation.

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The Amazon Web Services account ID of the S3 Access Grants instance.
