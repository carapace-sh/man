name: list-control-insights-by-control-domain
description: Lists the latest analytics data for controls within a specific control domain across all active assessments.
flags:
    --control-domain-id=!: The unique identifier for the control domain.
    --max-results=: Represents the maximum number of results on a page or for an API request call.
    --next-token=: The pagination token that's used to fetch the next set of results.
documentation:
    command: |-
        Lists the latest analytics data for controls within a specific control domain across all active assessments.

        Control insights are listed only if the control belongs to the control domain that was specified and the control collected evidence on the `lastUpdated` date of `controlInsightsMetadata`. If neither of these conditions are met, no data is listed for that control.
    flag:
        control-domain-id: |-
            The unique identifier for the control domain.

            Audit Manager supports the control domains that are provided by Amazon Web Services Control Catalog. For information about how to find a list of available control domains, see [`ListDomains`](https://docs.aws.amazon.com/controlcatalog/latest/APIReference/API_ListDomains.html) in the Amazon Web Services Control Catalog API Reference.
        max-results: Represents the maximum number of results on a page or for an API request call.
        next-token: The pagination token that's used to fetch the next set of results.
