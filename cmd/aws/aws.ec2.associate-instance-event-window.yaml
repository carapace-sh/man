name: associate-instance-event-window
description: Associates one or more targets with an event window.
flags:
    --association-target=!: One or more targets associated with the specified event window.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --instance-event-window-id=!: The ID of the event window.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: |-
        Associates one or more targets with an event window. Only one type of target (instance IDs, Dedicated Host IDs, or tags) can be specified with an event window.

        For more information, see [Define event windows for scheduled events](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/event-windows.html) in the *Amazon EC2 User Guide*.
    flag:
        association-target: One or more targets associated with the specified event window.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        instance-event-window-id: The ID of the event window.
