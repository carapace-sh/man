name: delete
description: '*(BETA)*  Delete a Cloud Spanner session.'
flags:
    --database=: The Cloud Spanner database for the session.
    --instance=: The Cloud Spanner instance for the session.
documentation:
    command: '*(BETA)*  Delete a Cloud Spanner session.'
    flag:
        database: |-
            The Cloud Spanner database for the session.
            +
            To set the `database` attribute:
            * provide the argument `session` on the command line with a fully specified name;
            * provide the argument `--database` on the command line.
        instance: |-
            The Cloud Spanner instance for the session.
            +
            To set the `instance` attribute:
            * provide the argument `session` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
