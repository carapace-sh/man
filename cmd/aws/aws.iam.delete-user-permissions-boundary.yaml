name: delete-user-permissions-boundary
description: Deletes the permissions boundary for the specified IAM user.
flags:
    --user-name=!: The name (friendly name, not ARN) of the IAM user from which you want to remove the permissions boundary.
documentation:
    command: |-
        Deletes the permissions boundary for the specified IAM user.

        Deleting the permissions boundary for a user might increase its permissions by allowing the user to perform all the actions granted in its permissions policies.
    flag:
        user-name: The name (friendly name, not ARN) of the IAM user from which you want to remove the permissions boundary.
