name: update
description: Update a Cloud NetApp Volumes Backup Policies.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clear-labels: Remove all labels.
    --daily-backup-limit=: Maximum number of daily backups to keep.
    --description=: A description of the Cloud NetApp Backup Policy
    --enabled=: The Boolean value indiciating whether backups are made automatically according to the schedules.
    --location=: The location of the backup_policy.
    --monthly-backup-limit=: Number of monthly backups to keep.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Remove all labels.
    --remove-labels=: List of label keys to remove.
    --update-labels=: List of label KEY=VALUE pairs to update.
    --weekly-backup-limit=: Number of weekly backups to keep.
documentation:
    command: |
        Updates a Backup Policy
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        daily-backup-limit: |-
            Maximum number of daily backups to keep.
            Note that the minimum daily backup limit is 2.
        description: A description of the Cloud NetApp Backup Policy
        enabled: |-
            The Boolean value indiciating whether backups are made automatically according to the schedules.
                  If enabled, this will be applied to all volumes that have this backup policy attached and enforced on
                  the volume level. If not specified, the default is true.
        location: |-
            The location of the backup_policy.
            +
            To set the `location` attribute:
            * provide the argument `backup_policy` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        monthly-backup-limit: |-
            Number of monthly backups to keep.
            Note that the sum of daily, weekly and monthly backups
            should be greater than 1
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        weekly-backup-limit: |-
            Number of weekly backups to keep.
            Note that the sum of daily, weekly and monthly backups
            should be greater than 1
