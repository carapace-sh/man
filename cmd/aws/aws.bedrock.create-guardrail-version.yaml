name: create-guardrail-version
description: Creates a version of the guardrail.
flags:
    --client-request-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than once.
    --description=: A description of the guardrail version.
    --guardrail-identifier=!: The unique identifier of the guardrail.
documentation:
    command: Creates a version of the guardrail. Use this API to create a snapshot of the guardrail when you are satisfied with a configuration, or to compare the configuration with another version.
    flag:
        client-request-token: A unique, case-sensitive identifier to ensure that the API request completes no more than once. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html) in the *Amazon S3 User Guide*.
        description: A description of the guardrail version.
        guardrail-identifier: The unique identifier of the guardrail. This can be an ID or the ARN.
