name: stop-db-instance-automated-backups-replication
description: Stops automated backup replication for a DB instance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --source-db-instance-arn=!: The Amazon Resource Name (ARN) of the source DB instance for which to stop replicating automate backups, for example, `arn:aws:rds:us-west-2:123456789012:db:mydatabase`.
documentation:
    command: |-
        Stops automated backup replication for a DB instance.

        This command doesn't apply to RDS Custom, Aurora MySQL, and Aurora PostgreSQL.

        For more information, see [Replicating Automated Backups to Another Amazon Web Services Region](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReplicateBackups.html) in the *Amazon RDS User Guide.*
    flag:
