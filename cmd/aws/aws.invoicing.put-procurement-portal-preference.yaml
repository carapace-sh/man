name: put-procurement-portal-preference
description: Updates an existing procurement portal preference configuration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --contacts=!:
        description: Updated list of contact information for portal administrators and technical contacts.
        nargs: -1
    --einvoice-delivery-enabled!: Updated flag indicating whether e-invoice delivery is enabled for this procurement portal preference.
    --einvoice-delivery-preference=: Updated e-invoice delivery configuration including document types, attachment types, and customization settings for the portal.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-einvoice-delivery-enabled!: Updated flag indicating whether e-invoice delivery is enabled for this procurement portal preference.
    --no-purchase-order-retrieval-enabled!: Updated flag indicating whether purchase order retrieval is enabled for this procurement portal preference.
    --procurement-portal-instance-endpoint=: The updated endpoint URL where e-invoices will be delivered to the procurement portal.
    --procurement-portal-preference-arn=!: The Amazon Resource Name (ARN) of the procurement portal preference to update.
    --procurement-portal-shared-secret=: The updated shared secret or authentication credential for the procurement portal.
    --purchase-order-retrieval-enabled!: Updated flag indicating whether purchase order retrieval is enabled for this procurement portal preference.
    --selector=: ""
    --test-env-preference=: Updated configuration settings for the test environment of the procurement portal.
documentation:
    command: Updates an existing procurement portal preference configuration. This operation can modify settings for e-invoice delivery and purchase order retrieval.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        contacts: Updated list of contact information for portal administrators and technical contacts.
        einvoice-delivery-enabled: Updated flag indicating whether e-invoice delivery is enabled for this procurement portal preference.
        einvoice-delivery-preference: Updated e-invoice delivery configuration including document types, attachment types, and customization settings for the portal.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        procurement-portal-instance-endpoint: The updated endpoint URL where e-invoices will be delivered to the procurement portal. Must be a valid HTTPS URL.
        procurement-portal-preference-arn: The Amazon Resource Name (ARN) of the procurement portal preference to update.
        procurement-portal-shared-secret: The updated shared secret or authentication credential for the procurement portal. This value must be encrypted at rest.
        purchase-order-retrieval-enabled: Updated flag indicating whether purchase order retrieval is enabled for this procurement portal preference.
        selector: ""
        test-env-preference: Updated configuration settings for the test environment of the procurement portal.
