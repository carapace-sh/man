name: get-workflow-run
description: Returns information about a specified run of a workflow.
flags:
    --id=!: The ID of the workflow run.
    --project-name=!: The name of the project in the space.
    --space-name=!: The name of the space.
documentation:
    command: Returns information about a specified run of a workflow.
    flag:
        id: The ID of the workflow run. To retrieve a list of workflow run IDs, use [ListWorkflowRuns]().
        project-name: The name of the project in the space.
        space-name: The name of the space.
