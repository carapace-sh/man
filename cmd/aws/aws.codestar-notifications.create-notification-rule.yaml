name: create-notification-rule
description: Creates a notification rule for a resource.
flags:
    --client-request-token=: A unique, client-generated idempotency token that, when provided in a request, ensures the request cannot be repeated with a changed parameter.
    --detail-type=!: The level of detail to include in the notifications for this resource.
    --event-type-ids=!: A list of event types associated with this notification rule.
    --name=!: The name for the notification rule.
    --resource=!: The Amazon Resource Name (ARN) of the resource to associate with the notification rule.
    --status=: The status of the notification rule.
    --tags=: A list of tags to apply to this notification rule.
    --targets=!: A list of Amazon Resource Names (ARNs) of Amazon Simple Notification Service topics and Amazon Q Developer in chat applications clients to associate with the notification rule.
completion:
    flag:
        detail-type:
            - BASIC
            - FULL
        status:
            - ENABLED
            - DISABLED
documentation:
    command: Creates a notification rule for a resource. The rule specifies the events you want notifications about and the targets (such as Amazon Q Developer in chat applications topics or Amazon Q Developer in chat applications clients configured for Slack) where you want to receive them.
    flag:
        client-request-token: |-
            A unique, client-generated idempotency token that, when provided in a request, ensures the request cannot be repeated with a changed parameter. If a request with the same parameters is received and a token is included, the request returns information about the initial request that used that token.

            The Amazon Web Services SDKs prepopulate client request tokens. If you are using an Amazon Web Services SDK, an idempotency token is created for you.
        detail-type: The level of detail to include in the notifications for this resource. `BASIC` will include only the contents of the event as it would appear in Amazon CloudWatch. `FULL` will include any supplemental information provided by CodeStar Notifications and/or the service for the resource for which the notification is created.
        event-type-ids: A list of event types associated with this notification rule. For a list of allowed events, see [EventTypeSummary]().
        name: The name for the notification rule. Notification rule names must be unique in your Amazon Web Services account.
        resource: The Amazon Resource Name (ARN) of the resource to associate with the notification rule. Supported resources include pipelines in CodePipeline, repositories in CodeCommit, and build projects in CodeBuild.
        status: The status of the notification rule. The default value is `ENABLED`. If the status is set to `DISABLED`, notifications aren't sent for the notification rule.
        tags: A list of tags to apply to this notification rule. Key names cannot start with "`aws`".
        targets: A list of Amazon Resource Names (ARNs) of Amazon Simple Notification Service topics and Amazon Q Developer in chat applications clients to associate with the notification rule.
