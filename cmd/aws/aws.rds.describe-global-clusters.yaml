name: describe-global-clusters
description: Returns information about Aurora global database clusters.
flags:
    --filters=: A filter that specifies one or more global database clusters to describe.
    --global-cluster-identifier=: The user-supplied DB cluster identifier.
    --marker=: An optional pagination token provided by a previous `DescribeGlobalClusters` request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: |-
        Returns information about Aurora global database clusters. This API supports pagination.

        For more information on Amazon Aurora, see [What is Amazon Aurora?](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html) in the *Amazon Aurora User Guide*.

        This action only applies to Aurora DB clusters.
    flag:
        filters: |-
            A filter that specifies one or more global database clusters to describe. This parameter is case-sensitive.

            Currently, the only supported filter is `region`.

            If used, the request returns information about any global cluster with at least one member (primary or secondary) in the specified Amazon Web Services Regions.
        global-cluster-identifier: |-
            The user-supplied DB cluster identifier. If this parameter is specified, information from only the specific DB cluster is returned. This parameter isn't case-sensitive.

            Constraints:

            - If supplied, must match an existing DBClusterIdentifier.
        marker: An optional pagination token provided by a previous `DescribeGlobalClusters` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
