name: tag-resource
description: Adds or overwrites one or more tags for the specified CloudHSM cluster.
flags:
    --resource-id=!: The cluster identifier (ID) for the cluster that you are tagging.
    --tag-list=!: A list of one or more tags.
documentation:
    command: |-
        Adds or overwrites one or more tags for the specified CloudHSM cluster.

        **Cross-account use:** No. You cannot perform this operation on an CloudHSM resource in a different Amazon Web Services account.
    flag:
        resource-id: The cluster identifier (ID) for the cluster that you are tagging. To find the cluster ID, use [DescribeClusters]().
        tag-list: A list of one or more tags.
