name: update
description: '*(ALPHA)*  Update the parameters of a single QuotaPreference.'
flags:
    --allow-high-percentage-quota-decrease: If specified, allows you to reduce your effective limit by more than 10 percent.
    --allow-missing: If specified and the quota preference is not found, a new one will be created.
    --allow-quota-decrease-below-usage: If specified, allows you to reduce your effective limit below your quota usage.
    --dimensions=: Dimensions of the quota.
    --email=: An optional email address that can be used for quota related communication between the Google Cloud and the user in case the Google Cloud needs further information to make a decision on whether the user preferred quota can be granted.
    --folder=: Folder of the quota preference to update.
    --justification=: A short statement to justify quota increase requests.
    --no-allow-high-percentage-quota-decrease&: If specified, allows you to reduce your effective limit by more than 10 percent.
    --no-allow-missing&: If specified and the quota preference is not found, a new one will be created.
    --no-allow-quota-decrease-below-usage&: If specified, allows you to reduce your effective limit below your quota usage.
    --no-validate-only&: If specified, only validates the request, but does not actually update.
    --organization=: Organization of the quota preference to update.
    --preferred-value=!: Preferred value.
    --quota-id=!: ID of the quota, which is unique within the service.
    --service=!: Name of the service in which the quota is defined.
    --validate-only: If specified, only validates the request, but does not actually update.
documentation:
    command: |-
        *(ALPHA)*  This command updates an existing or creates a new QuotaPreference. It can
        updates the config in any states, not just the ones pending approval.

        ## EXAMPLES

        To update a quota preference with id `my-preference` in region `us-central1`
        that applies to the `default_limit` quota for `projects/12321`, run:

          $ gcloud alpha quotas preferences update my-preference
          --service=example.$$UNIVERSE_DOMAIN$$
          --project=12321
          --quota-id=default_limit
          --preferred-value=100
          --dimensions=region=us-central1


        To create a new quota preference for `organizations/789`, run:

          $ gcloud alpha quotas preferences update my-preference
          --service=example.$$UNIVERSE_DOMAIN$$
          --organization=789
          --quota-id=default_limit
          --preferred-value=200
          --allow-missing
    flag:
        allow-high-percentage-quota-decrease: If specified, allows you to reduce your effective limit by more than 10 percent. Default is false.
        allow-missing: If specified and the quota preference is not found, a new one will be created. Default is false.
        allow-quota-decrease-below-usage: If specified, allows you to reduce your effective limit below your quota usage. Default is false.
        dimensions: Dimensions of the quota.
        email: An optional email address that can be used for quota related communication between the Google Cloud and the user in case the Google Cloud needs further information to make a decision on whether the user preferred quota can be granted. The Google account for the email address must have quota update permission for the project, folder or organization this quota preference is for. If no contact email address is provided, or the provided email address does not have the required quota update permission, the quota preference request will be denied in case further information is required to make a decision.
        folder: Folder of the quota preference to update.
        justification: A short statement to justify quota increase requests.
        no-allow-high-percentage-quota-decrease: If specified, allows you to reduce your effective limit by more than 10 percent. Default is false.
        no-allow-missing: If specified and the quota preference is not found, a new one will be created. Default is false.
        no-allow-quota-decrease-below-usage: If specified, allows you to reduce your effective limit below your quota usage. Default is false.
        no-validate-only: If specified, only validates the request, but does not actually update. Note that a request being valid does not mean that the request is guaranteed to be fulfilled. Default is false.
        organization: Organization of the quota preference to update.
        preferred-value: Preferred value. Must be greater than or equal to -1. If set to -1, it means the value is "unlimited".
        quota-id: ID of the quota, which is unique within the service.
        service: Name of the service in which the quota is defined.
        validate-only: If specified, only validates the request, but does not actually update. Note that a request being valid does not mean that the request is guaranteed to be fulfilled. Default is false.
