name: create-studio-lifecycle-config
description: Creates a new Amazon SageMaker AI Studio Lifecycle Configuration.
flags:
    --studio-lifecycle-config-app-type=!: The App type that the Lifecycle Configuration is attached to.
    --studio-lifecycle-config-content=!: The content of your Amazon SageMaker AI Studio Lifecycle Configuration script.
    --studio-lifecycle-config-name=!: The name of the Amazon SageMaker AI Studio Lifecycle Configuration to create.
    --tags=: Tags to be associated with the Lifecycle Configuration.
completion:
    flag:
        studio-lifecycle-config-app-type:
            - JupyterServer
            - KernelGateway
            - CodeEditor
            - JupyterLab
documentation:
    command: Creates a new Amazon SageMaker AI Studio Lifecycle Configuration.
    flag:
        studio-lifecycle-config-app-type: The App type that the Lifecycle Configuration is attached to.
        studio-lifecycle-config-content: The content of your Amazon SageMaker AI Studio Lifecycle Configuration script. This content must be base64 encoded.
        studio-lifecycle-config-name: The name of the Amazon SageMaker AI Studio Lifecycle Configuration to create.
        tags: Tags to be associated with the Lifecycle Configuration. Each tag consists of a key and an optional value. Tag keys must be unique per resource. Tags are searchable using the Search API.
