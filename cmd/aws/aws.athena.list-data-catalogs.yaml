name: list-data-catalogs
description: Lists the data catalogs in the current Amazon Web Services account.
flags:
    --max-results=: Specifies the maximum number of data catalogs to return.
    --next-token=: A token generated by the Athena service that specifies where to continue pagination if a previous request was truncated.
    --work-group=: The name of the workgroup.
documentation:
    command: |-
        Lists the data catalogs in the current Amazon Web Services account.

        In the Athena console, data catalogs are listed as "data sources" on the **Data sources** page under the **Data source name** column.
    flag:
        max-results: Specifies the maximum number of data catalogs to return.
        next-token: A token generated by the Athena service that specifies where to continue pagination if a previous request was truncated. To obtain the next set of pages, pass in the NextToken from the response object of the previous page call.
        work-group: The name of the workgroup. Required if making an IAM Identity Center request.
