name: list-marketplace-model-endpoints
description: Lists the endpoints for models from Amazon Bedrock Marketplace in your Amazon Web Services account.
flags:
    --max-results=: The maximum number of results to return in a single call.
    --model-source-equals=: If specified, only endpoints for the given model source identifier are returned.
    --next-token=: The token for the next set of results.
documentation:
    command: Lists the endpoints for models from Amazon Bedrock Marketplace in your Amazon Web Services account.
    flag:
        max-results: The maximum number of results to return in a single call. If more results are available, the operation returns a `NextToken` value.
        model-source-equals: If specified, only endpoints for the given model source identifier are returned.
        next-token: The token for the next set of results. You receive this token from a previous `ListMarketplaceModelEndpoints` call.
