name: untag-resource
description: Removes the specified tag or tags from the specified CloudHSM cluster.
flags:
    --resource-id=!: The cluster identifier (ID) for the cluster whose tags you are removing.
    --tag-key-list=!: A list of one or more tag keys for the tags that you are removing.
documentation:
    command: |-
        Removes the specified tag or tags from the specified CloudHSM cluster.

        **Cross-account use:** No. You cannot perform this operation on an CloudHSM resource in a different Amazon Web Services account.
    flag:
        resource-id: The cluster identifier (ID) for the cluster whose tags you are removing. To find the cluster ID, use [DescribeClusters]().
        tag-key-list: A list of one or more tag keys for the tags that you are removing. Specify only the tag keys, not the tag values.
