name: delete-environment
description: Deletes a specific runtime environment.
flags:
    --environment-id=!: The unique identifier of the runtime environment you want to delete.
documentation:
    command: Deletes a specific runtime environment. The environment cannot contain deployed applications. If it does, you must delete those applications before you delete the environment.
    flag:
        environment-id: The unique identifier of the runtime environment you want to delete.
