name: get-builtin-intents
description: Gets a list of built-in intents that meet the specified criteria.
flags:
    --locale=: A list of locales that the intent supports.
    --max-results=: The maximum number of intents to return in the response.
    --next-token=: A pagination token that fetches the next page of intents.
    --signature-contains=: Substring to match in built-in intent signatures.
completion:
    flag:
        locale:
            - de-DE
            - en-AU
            - en-GB
            - en-IN
            - en-US
            - es-419
            - es-ES
            - es-US
            - fr-FR
            - fr-CA
            - it-IT
            - ja-JP
            - ko-KR
documentation:
    command: |-
        Gets a list of built-in intents that meet the specified criteria.

        This operation requires permission for the `lex:GetBuiltinIntents` action.
    flag:
        locale: A list of locales that the intent supports.
        max-results: The maximum number of intents to return in the response. The default is 10.
        next-token: A pagination token that fetches the next page of intents. If this API call is truncated, Amazon Lex returns a pagination token in the response. To fetch the next page of intents, use the pagination token in the next request.
        signature-contains: Substring to match in built-in intent signatures. An intent will be returned if any part of its signature matches the substring. For example, "xyz" matches both "xyzabc" and "abcxyz." To find the signature for an intent, see [Standard Built-in Intents](https://developer.amazon.com/public/solutions/alexa/alexa-skills-kit/docs/built-in-intent-ref/standard-intents) in the *Alexa Skills Kit*.
