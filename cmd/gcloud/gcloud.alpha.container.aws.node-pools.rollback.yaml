name: rollback
description: '*(ALPHA)*  *(DEPRECATED)*  Rollback a node pool in an Anthos cluster on AWS.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cluster=: cluster of the node_pool.
    --location=: Google Cloud location for the node_pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-respect-pdb&: Indicates whether the node pool rollback should respect pod disruption budget.
    --respect-pdb: Indicates whether the node pool rollback should respect pod disruption budget.
documentation:
    command: |+
        *(ALPHA)*  *(DEPRECATED)*  Rollback a node pool in an Anthos cluster on AWS.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/aws/deprecations/deprecation-announcement for more details.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster: |-
            cluster of the node_pool.
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        location: |-
            Google Cloud location for the node_pool.
            +
            To set the `location` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_aws/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-respect-pdb: |
            Indicates whether the node pool rollback should respect pod disruption budget.
        respect-pdb: Indicates whether the node pool rollback should respect pod disruption budget.
