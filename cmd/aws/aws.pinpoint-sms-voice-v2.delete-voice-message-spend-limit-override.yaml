name: delete-voice-message-spend-limit-override
description: Deletes an account level monthly spend limit override for sending voice messages.
documentation:
    command: Deletes an account level monthly spend limit override for sending voice messages. Deleting a spend limit override sets the `EnforcedLimit` equal to the `MaxLimit`, which is controlled by Amazon Web Services. For more information on spending limits (quotas) see [Quotas](https://docs.aws.amazon.com/sms-voice/latest/userguide/quotas.html) in the *End User MessagingSMS User Guide*.
