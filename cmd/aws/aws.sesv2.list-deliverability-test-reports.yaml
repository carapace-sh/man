name: list-deliverability-test-reports
description: Show a list of the predictive inbox placement tests that you've performed, regardless of their statuses.
flags:
    --next-token=: A token returned from a previous call to `ListDeliverabilityTestReports` to indicate the position in the list of predictive inbox placement tests.
    --page-size=: The number of results to show in a single call to `ListDeliverabilityTestReports`.
documentation:
    command: Show a list of the predictive inbox placement tests that you've performed, regardless of their statuses. For predictive inbox placement tests that are complete, you can use the `GetDeliverabilityTestReport` operation to view the results.
    flag:
        next-token: A token returned from a previous call to `ListDeliverabilityTestReports` to indicate the position in the list of predictive inbox placement tests.
        page-size: |-
            The number of results to show in a single call to `ListDeliverabilityTestReports`. If the number of results is larger than the number you specified in this parameter, then the response includes a `NextToken` element, which you can use to obtain additional results.

            The value you specify has to be at least 0, and can be no more than 1000.
