name: describe
description: '*(ALPHA)*  Describe a Managed Service for Apache Kafka cluster.'
flags:
    --full-view: Whether full cluster view is returned.
    --location=: ID of the location of the Managed Service for Apache Kafka resource.
    --no-full-view&: Whether full cluster view is returned.
documentation:
    command: |
        *(ALPHA)*  Describe a Managed Service for Apache Kafka cluster.
    flag:
        full-view: |-
            Whether full cluster view is returned. If provided, the cluster view will include
            everything, including data fetched from the Kafka cluster source of truth. If not provided, the
            API will default to the basic view that only includes the basic metadata of the cluster.
        location: |-
            ID of the location of the Managed Service for Apache Kafka resource. See
            https://cloud.google.com/managed-service-for-apache-kafka/docs/locations for a list of supported
            locations.
            +

            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-full-view: |
            Whether full cluster view is returned. If provided, the cluster view will include
            everything, including data fetched from the Kafka cluster source of truth. If not provided, the
            API will default to the basic view that only includes the basic metadata of the cluster.
