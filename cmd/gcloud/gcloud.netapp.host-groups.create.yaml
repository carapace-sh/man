name: create
description: Create a Cloud NetApp Host Group.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: A description of the Cloud NetApp Host Group
    --hosts=!: List of hosts in the host group.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the host_group.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --os-type=!: String indicating the OS type of the hosts in the host group.
    --type=!: String indicating the type of host group.
completion:
    flag:
        os-type:
            - LINUX
            - WINDOWS
            - ESXI
        type:
            - ISCSI_INITIATOR
documentation:
    command: |
        Create a Cloud NetApp Host Group.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: A description of the Cloud NetApp Host Group
        hosts: List of hosts in the host group.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the host_group.
            +
            To set the `location` attribute:
            * provide the argument `host_group` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        os-type: |-
            String indicating the OS type of the hosts in the host group.
            The supported values are: 'LINUX', 'WINDOWS', 'ESXI'. _OS_TYPE_ must be one of: *LINUX*, *WINDOWS*, *ESXI*.
        type: |-
            String indicating the type of host group.
            The supported values are: 'ISCSI_INITIATOR'. _TYPE_ must be (only one value is supported): *ISCSI_INITIATOR*.
