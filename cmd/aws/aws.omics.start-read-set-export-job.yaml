name: start-read-set-export-job
description: Starts a read set export job.
flags:
    --client-token=: To ensure that jobs don't run multiple times, specify a unique token for each job.
    --destination=!: A location for exported files in Amazon S3.
    --role-arn=!: A service role for the job.
    --sequence-store-id=!: The read set's sequence store ID.
    --sources=!: The job's source files.
documentation:
    command: |-
        Starts a read set export job. When the export job is finished, the read set is exported to an Amazon S3 bucket which can be retrieved using the `GetReadSetExportJob` API operation.

        To monitor the status of the export job, use the `ListReadSetExportJobs` API operation.
    flag:
        client-token: To ensure that jobs don't run multiple times, specify a unique token for each job.
        destination: A location for exported files in Amazon S3.
        role-arn: A service role for the job.
        sequence-store-id: The read set's sequence store ID.
        sources: The job's source files.
