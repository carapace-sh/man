name: update-call-analytics-category
description: Updates the specified Call Analytics category with new rules.
flags:
    --category-name=!: The name of the Call Analytics category you want to update.
    --input-type=: Choose whether you want to update a real-time or a post-call category.
    --rules=!: The rules used for the updated Call Analytics category.
completion:
    flag:
        input-type:
            - REAL_TIME
            - POST_CALL
documentation:
    command: |-
        Updates the specified Call Analytics category with new rules. Note that the `UpdateCallAnalyticsCategory` operation overwrites all existing rules contained in the specified category. You cannot append additional rules onto an existing category.

        To create a new category, see .
    flag:
        category-name: The name of the Call Analytics category you want to update. Category names are case sensitive.
        input-type: Choose whether you want to update a real-time or a post-call category. The input type you specify must match the input type specified when the category was created. For example, if you created a category with the `POST_CALL` input type, you must use `POST_CALL` as the input type when updating this category.
        rules: The rules used for the updated Call Analytics category. The rules you provide in this field replace the ones that are currently being used in the specified category.
