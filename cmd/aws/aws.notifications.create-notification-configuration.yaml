name: create-notification-configuration
description: Creates a new `NotificationConfiguration`.
flags:
    --aggregation-duration=: The aggregation preference of the `NotificationConfiguration`.
    --description=!: The description of the `NotificationConfiguration`.
    --name=!: The name of the `NotificationConfiguration`.
    --tags=: A map of tags assigned to a resource.
completion:
    flag:
        aggregation-duration:
            - LONG
            - SHORT
            - NONE
documentation:
    command: Creates a new `NotificationConfiguration`.
    flag:
        aggregation-duration: "The aggregation preference of the `NotificationConfiguration`.\n\n- Values:\n  \n  - `LONG`\n    \n    - Aggregate notifications for long periods of time (12 hours).\n  - `SHORT`\n    \n    - Aggregate notifications for short periods of time (5 minutes).\n  - `NONE`\n    \n    - Don't aggregate notifications."
        description: The description of the `NotificationConfiguration`.
        name: The name of the `NotificationConfiguration`. Supports RFC 3986's unreserved characters.
        tags: A map of tags assigned to a resource. A tag is a string-to-string map of key-value pairs.
