name: list-type-versions
description: Returns summary information about the versions of an extension.
flags:
    --arn=: The Amazon Resource Name (ARN) of the extension for which you want version summary information.
    --deprecated-status=: The deprecation status of the extension versions that you want to get summary information about.
    --max-results=: The maximum number of results to be returned with a single call.
    --next-token=: The token for the next set of items to return.
    --publisher-id=: The publisher ID of the extension publisher.
    --type-name=: The name of the extension for which you want version summary information.
    --type=: The kind of the extension.
completion:
    flag:
        deprecated-status:
            - LIVE
            - DEPRECATED
        type:
            - RESOURCE
            - MODULE
            - HOOK
documentation:
    command: Returns summary information about the versions of an extension.
    flag:
        arn: |-
            The Amazon Resource Name (ARN) of the extension for which you want version summary information.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
        deprecated-status: |-
            The deprecation status of the extension versions that you want to get summary information about.

            Valid values include:

            - `LIVE`: The extension version is registered and can be used in CloudFormation operations, dependent on its provisioning behavior and visibility scope.
            - `DEPRECATED`: The extension version has been deregistered and can no longer be used in CloudFormation operations.

            The default is `LIVE`.
        max-results: The maximum number of results to be returned with a single call. If the number of available results exceeds this maximum, the response includes a `NextToken` value that you can assign to the `NextToken` request parameter to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        publisher-id: |-
            The publisher ID of the extension publisher.

            Extensions published by Amazon aren't assigned a publisher ID.
        type: |-
            The kind of the extension.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
        type-name: |-
            The name of the extension for which you want version summary information.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
