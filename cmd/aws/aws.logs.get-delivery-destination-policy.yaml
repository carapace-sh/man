name: get-delivery-destination-policy
description: Retrieves the delivery destination policy assigned to the delivery destination that you specify.
flags:
    --delivery-destination-name=!: The name of the delivery destination that you want to retrieve the policy of.
documentation:
    command: Retrieves the delivery destination policy assigned to the delivery destination that you specify. For more information about delivery destinations and their policies, see [PutDeliveryDestinationPolicy](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutDeliveryDestinationPolicy.html).
    flag:
        delivery-destination-name: The name of the delivery destination that you want to retrieve the policy of.
