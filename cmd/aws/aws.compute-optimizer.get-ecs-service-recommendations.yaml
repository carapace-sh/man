name: get-ecs-service-recommendations
description: Returns Amazon ECS service recommendations.
flags:
    --account-ids=: Return the Amazon ECS service recommendations to the specified Amazon Web Services account IDs.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=: An array of objects to specify a filter that returns a more specific list of Amazon ECS service recommendations.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of Amazon ECS service recommendations to return with a single request.
    --next-token=: The token to advance to the next page of Amazon ECS service recommendations.
    --service-arns=: The ARN that identifies the Amazon ECS service.
documentation:
    command: |-
        Returns Amazon ECS service recommendations.

        Compute Optimizer generates recommendations for Amazon ECS services on Fargate that meet a specific set of requirements. For more information, see the [Supported resources and requirements](https://docs.aws.amazon.com/compute-optimizer/latest/ug/requirements.html) in the *Compute Optimizer User Guide*.
    flag:
        account-ids: |-
            Return the Amazon ECS service recommendations to the specified Amazon Web Services account IDs.

            If your account is the management account or the delegated administrator of an organization, use this parameter to return the Amazon ECS service recommendations to specific member accounts.

            You can only specify one account ID per request.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: An array of objects to specify a filter that returns a more specific list of Amazon ECS service recommendations.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: |-
            The maximum number of Amazon ECS service recommendations to return with a single request.

            To retrieve the remaining results, make another request with the returned `nextToken` value.
        next-token: The token to advance to the next page of Amazon ECS service recommendations.
        service-arns: |-
            The ARN that identifies the Amazon ECS service.

            The following is the format of the ARN:

            `arn:aws:ecs:region:aws_account_id:service/cluster-name/service-name`
