name: describe
description: '*(BETA)*  Show metadata for a Cloud NetApp Volumes Backup Policy.'
flags:
    --location=: The location of the backup_policy.
documentation:
    command: |
        *(BETA)*  Describe a Backup Policy
    flag:
        location: |-
            The location of the backup_policy.
            +
            To set the `location` attribute:
            * provide the argument `backup_policy` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
