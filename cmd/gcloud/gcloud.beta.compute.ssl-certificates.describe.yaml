name: describe
description: '*(BETA)*  Describe a Compute Engine SSL certificate.'
flags:
    --global: (Default) If set, the SSL certificate is global.
    --no-global&: (Default) If set, the SSL certificate is global.
    --region=: Region of the SSL certificate to describe.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute ssl-certificates describe* displays all data (except private keys) associated with
        Compute Engine SSL certificate resources in a project.
    flag:
        global: (Default) If set, the SSL certificate is global.
        no-global: (Default) If set, the SSL certificate is global.
        region: |-
            Region of the SSL certificate to describe. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
