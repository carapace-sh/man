name: put-geofence
description: Stores a geofence geometry in a given geofence collection, or updates the geometry of an existing geofence if a geofence ID is included in the request.
flags:
    --collection-name=!: The geofence collection to store the geofence in.
    --geofence-id=!: An identifier for the geofence.
    --geofence-properties=: Associates one of more properties with the geofence.
    --geometry=!: Contains the details to specify the position of the geofence.
documentation:
    command: Stores a geofence geometry in a given geofence collection, or updates the geometry of an existing geofence if a geofence ID is included in the request.
    flag:
        collection-name: The geofence collection to store the geofence in.
        geofence-id: An identifier for the geofence. For example, `ExampleGeofence-1`.
        geofence-properties: |-
            Associates one of more properties with the geofence. A property is a key-value pair stored with the geofence and added to any geofence event triggered with that geofence.

            Format: `"key" : "value"`
        geometry: |-
            Contains the details to specify the position of the geofence. Can be a circle, a polygon, or a multipolygon. `Polygon` and `MultiPolygon` geometries can be defined using their respective parameters, or encoded in Geobuf format using the `Geobuf` parameter. Including multiple geometry types in the same request will return a validation error.

            The geofence `Polygon` and `MultiPolygon` formats support a maximum of 1,000 total vertices. The `Geobuf` format supports a maximum of 100,000 vertices.
