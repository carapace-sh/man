name: list-trusted-entity-sets
description: Lists the trusted entity sets associated with the specified GuardDuty detector ID.
flags:
    --detector-id=!: The unique ID of the GuardDuty detector that is associated with this threat entity set.
    --max-results=: You can use this parameter to indicate the maximum number of items you want in the response.
    --next-token=: You can use this parameter when paginating results.
documentation:
    command: Lists the trusted entity sets associated with the specified GuardDuty detector ID. If you use this operation from a member account, the trusted entity sets that are returned as a response, belong to the administrator account.
    flag:
        detector-id: |-
            The unique ID of the GuardDuty detector that is associated with this threat entity set.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        max-results: You can use this parameter to indicate the maximum number of items you want in the response. The default value is 50.
        next-token: You can use this parameter when paginating results. Set the value of this parameter to null on your first call to the list action. For subsequent calls to the action, fill nextToken in the request with the value of NextToken from the previous response to continue listing data.
