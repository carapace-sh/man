name: untag-resource
description: Removes one or more tags from an OpenSearch Ingestion pipeline.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the pipeline to remove tags from.
    --tag-keys=!: The tag keys to remove.
documentation:
    command: Removes one or more tags from an OpenSearch Ingestion pipeline. For more information, see [Tagging Amazon OpenSearch Ingestion pipelines](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/tag-pipeline.html).
    flag:
        arn: The Amazon Resource Name (ARN) of the pipeline to remove tags from.
        tag-keys: The tag keys to remove.
