name: describe
description: '*(ALPHA)*  Display detailed information about a backend service.'
flags:
    --global: If set, the backend service is global.
    --no-global&: If set, the backend service is global.
    --region=: Region of the backend service to describe.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute backend-services describe* displays all data associated with a backend service in a project.
    flag:
        global: If set, the backend service is global.
        no-global: If set, the backend service is global.
        region: Region of the backend service to describe. Overrides the default *compute/region* property value for this command invocation.
