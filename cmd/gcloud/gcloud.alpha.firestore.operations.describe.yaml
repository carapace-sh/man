name: describe
description: '*(ALPHA)*  Retrieves information about a Cloud Firestore admin operation.'
flags:
    --database=: The database to operate on.
documentation:
    command: '*(ALPHA)*  Retrieves information about a Cloud Firestore admin operation.'
    flag:
        database: |-
            The database to operate on. The default value is `(default)`.
            +
            For example, to operate on database `foo`:
            +
              $ {command} --database='foo'
