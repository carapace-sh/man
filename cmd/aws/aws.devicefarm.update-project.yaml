name: update-project
description: Modifies the specified project name, given the project ARN and a new name.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the project whose name to update.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-job-timeout-minutes=: The number of minutes a test run in the project executes before it times out.
    --environment-variables=:
        description: A set of environment variables which are used by default for all runs in the project.
        nargs: -1
    --execution-role-arn=: An IAM role to be assumed by the test host for all runs in the project.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: A string that represents the new name of the project that you are updating.
    --vpc-config=: The VPC security groups and subnets that are attached to a project.
documentation:
    command: Modifies the specified project name, given the project ARN and a new name.
    flag:
        arn: The Amazon Resource Name (ARN) of the project whose name to update.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-job-timeout-minutes: The number of minutes a test run in the project executes before it times out.
        environment-variables: |-
            A set of environment variables which are used by default for all runs in the project. These environment variables are applied to the test run during the execution of a test spec file.

            For more information about using test spec files, please see [Custom test environments](https://docs.aws.amazon.com/devicefarm/latest/developerguide/custom-test-environments.html) in *AWS Device Farm.*
        execution-role-arn: An IAM role to be assumed by the test host for all runs in the project.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A string that represents the new name of the project that you are updating.
        vpc-config: The VPC security groups and subnets that are attached to a project.
