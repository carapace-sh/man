name: update-template-sync-config
description: Update template sync configuration parameters, except for the `templateName` and `templateType`.
flags:
    --branch=!: The repository branch for your template.
    --repository-name=!: The repository name (for example, `myrepos/myrepo`).
    --repository-provider=!: The repository provider.
    --subdirectory=: A subdirectory path to your template bundle version.
    --template-name=!: The synced template name.
    --template-type=!: The synced template type.
completion:
    flag:
        repository-provider:
            - GITHUB
            - GITHUB_ENTERPRISE
            - BITBUCKET
        template-type:
            - ENVIRONMENT
            - SERVICE
documentation:
    command: Update template sync configuration parameters, except for the `templateName` and `templateType`. Repository details (branch, name, and provider) should be of a linked repository. A linked repository is a repository that has been registered with Proton. For more information, see [CreateRepository]().
    flag:
        branch: The repository branch for your template.
        repository-name: The repository name (for example, `myrepos/myrepo`).
        repository-provider: The repository provider.
        subdirectory: A subdirectory path to your template bundle version. When included, limits the template bundle search to this repository directory.
        template-name: The synced template name.
        template-type: The synced template type.
