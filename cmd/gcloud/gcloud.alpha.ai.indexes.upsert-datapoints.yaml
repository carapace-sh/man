name: upsert-datapoints
description: '*(ALPHA)*  Upsert data points into the specified index.'
flags:
    --datapoints-from-file=!: Path to a local JSON file that contains the data points that need to be added to the index.
    --region=: Cloud region for the index.
    --update-mask=: Update mask is used to specify the fields to be
documentation:
    command: |-
        ## EXAMPLES

        To upsert datapoints into an index `123`, run:

          $ gcloud alpha ai indexes upsert-datapoints 123 --datapoints-from-file=example.json
          --project=example --region=us-central1
    flag:
        datapoints-from-file: Path to a local JSON file that contains the data points that need to be added to the index.
        region: |-
            Cloud region for the index.
            +
            To set the `region` attribute:
            * provide the argument `index` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
        update-mask: |-
            Update mask is used to specify the fields to be
            overwritten in the datapoints by the update. The fields specified in the
            update_mask are relative to each IndexDatapoint inside datapoints, not
            the full request.
            +
            Updatable fields:
            * Use --update-mask=`all_restricts` to update both `restricts` and `numeric_restricts`.
