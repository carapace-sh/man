name: list-deployments
description: Lists the deployments in a deployment group for an application registered with the user or Amazon Web Services account.
flags:
    --application-name=: The name of an CodeDeploy application associated with the user or Amazon Web Services account.
    --create-time-range=: A time range (start and end) for returning a subset of the list of deployments.
    --deployment-group-name=: The name of a deployment group for the specified application.
    --external-id=: The unique ID of an external resource for returning deployments linked to the external resource.
    --include-only-statuses=: 'A subset of deployments to list by status:'
    --next-token=: An identifier returned from the previous list deployments call.
documentation:
    command: Lists the deployments in a deployment group for an application registered with the user or Amazon Web Services account.
    flag:
        application-name: |-
            The name of an CodeDeploy application associated with the user or Amazon Web Services account.

            If `applicationName` is specified, then `deploymentGroupName` must be specified. If it is not specified, then `deploymentGroupName` must not be specified.
        create-time-range: A time range (start and end) for returning a subset of the list of deployments.
        deployment-group-name: |-
            The name of a deployment group for the specified application.

            If `deploymentGroupName` is specified, then `applicationName` must be specified. If it is not specified, then `applicationName` must not be specified.
        external-id: The unique ID of an external resource for returning deployments linked to the external resource.
        include-only-statuses: |-
            A subset of deployments to list by status:

            - `Created`: Include created deployments in the resulting list.
            - `Queued`: Include queued deployments in the resulting list.
            - `In Progress`: Include in-progress deployments in the resulting list.
            - `Succeeded`: Include successful deployments in the resulting list.
            - `Failed`: Include failed deployments in the resulting list.
            - `Stopped`: Include stopped deployments in the resulting list.
        next-token: An identifier returned from the previous list deployments call. It can be used to return the next set of deployments in the list.
