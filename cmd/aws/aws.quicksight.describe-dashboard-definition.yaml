name: describe-dashboard-definition
description: Provides a detailed description of the definition of a dashboard.
flags:
    --alias-name=: The alias name.
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the dashboard that you're describing.
    --dashboard-id=!: The ID for the dashboard.
    --version-number=: The version number for the dashboard.
documentation:
    command: |-
        Provides a detailed description of the definition of a dashboard.

        If you do not need to know details about the content of a dashboard, for instance if you are trying to check the status of a recently created or updated dashboard, use the [`DescribeDashboard`](https://docs.aws.amazon.com/quicksight/latest/APIReference/API_DescribeDashboard.html) instead.
    flag:
        alias-name: The alias name.
        aws-account-id: The ID of the Amazon Web Services account that contains the dashboard that you're describing.
        dashboard-id: The ID for the dashboard.
        version-number: The version number for the dashboard. If a version number isn't passed, the latest published dashboard version is described.
