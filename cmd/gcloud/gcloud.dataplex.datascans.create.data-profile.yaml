name: data-profile
description: Create a Dataplex data profile scan job.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --data-profile-spec-file=: path to the JSON/YAML file containing the spec for the data profile scan.
    --data-source-entity=: 'Dataplex entity that contains the data for the data profile scan, of the form: `projects/{project_number}/locations/{location_id}/lakes/{lake_id}/zones/{zone_id}/entities/{entity_id}`.'
    --data-source-resource=: 'Fully-qualified service resource name of the cloud resource that contains the data for the data profile scan, of the form: `//bigquery.googleapis.com/projects/{project_number}/datasets/{dataset_id}/tables/{table_id}`.'
    --description=: Description of the data profile scan.
    --display-name=: Display name of the data profile scan.
    --exclude-field-names=: Names of the fields to exclude from data profile.
    --export-results-table=: 'path to the resource table to export data profile scan results, of the form: `//bigquery.googleapis.com/projects/{project_number}/datasets/{dataset_id}/tables/{table_id}`.'
    --include-field-names=: Names of the fields to include in data profile.
    --incremental-field=: Field that contains values that monotonically increase over time (e.g. timestamp).
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the Dataplex resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-validate-only&: Validate the create action, but don't actually perform it.
    --on-demand=: If set, the scan runs one-time shortly after data profile scan creation.
    --row-filter=: A filter applied to all rows in a single data profile scan job.
    --sampling-percent=: The percentage of the records to be selected from the dataset for data profile scan.
    --schedule=: Cron schedule (https://en.wikipedia.org/wiki/Cron) for running scans periodically.
    --validate-only: Validate the create action, but don't actually perform it.
documentation:
    command: |-
        Represents a user-visible job which provides the insights for the
        related data source about the structure, content and relationships
        (such as null percent, cardinality, min/max/mean, etc).
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        data-profile-spec-file: 'path to the JSON/YAML file containing the spec for the data profile scan. The JSON representation reference: https://cloud.google.com/dataplex/docs/reference/rest/v1/DataProfileSpec'
        data-source-entity: 'Dataplex entity that contains the data for the data profile scan, of the form: `projects/{project_number}/locations/{location_id}/lakes/{lake_id}/zones/{zone_id}/entities/{entity_id}`.'
        data-source-resource: 'Fully-qualified service resource name of the cloud resource that contains the data for the data profile scan, of the form: `//bigquery.googleapis.com/projects/{project_number}/datasets/{dataset_id}/tables/{table_id}`.'
        description: Description of the data profile scan.
        display-name: Display name of the data profile scan.
        exclude-field-names: Names of the fields to exclude from data profile. If specified, the respective fields will be excluded from data profile, regardless of the fields specified in the `--include-field-names` flag.
        export-results-table: 'path to the resource table to export data profile scan results, of the form: `//bigquery.googleapis.com/projects/{project_number}/datasets/{dataset_id}/tables/{table_id}`. The table will be created if not present.'
        include-field-names: Names of the fields to include in data profile. If not specified, all fields at the time of profile scan job execution are included. The fields listed in the `--exclude-field-names` flag are excluded.
        incremental-field: Field that contains values that monotonically increase over time (e.g. timestamp).
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `datascan` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-validate-only: Validate the create action, but don't actually perform it.
        on-demand: If set, the scan runs one-time shortly after data profile scan creation.
        row-filter: A filter applied to all rows in a single data profile scan job.
        sampling-percent: The percentage of the records to be selected from the dataset for data profile scan.
        schedule: 'Cron schedule (https://en.wikipedia.org/wiki/Cron) for running scans periodically. To explicitly set a timezone to the cron tab, apply a prefix in the cron tab: "CRON_TZ=${IANA_TIME_ZONE}" or "TZ=${IANA_TIME_ZONE}". The ${IANA_TIME_ZONE} may only be a valid string from IANA time zone database. For example, `CRON_TZ=America/New_York 1 * * * *` or `TZ=America/New_York 1 * * * *`. This field is required for RECURRING scans.'
        validate-only: Validate the create action, but don't actually perform it.
