name: update-findings
description: '`UpdateFindings` is a deprecated operation.'
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=!: A collection of attributes that specify which findings you want to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --note=: The updated note for the finding.
    --record-state=: The updated record state for the finding.
completion:
    flag:
        record-state:
            - ACTIVE
            - ARCHIVED
documentation:
    command: |-
        `UpdateFindings` is a deprecated operation. Instead of `UpdateFindings`, use the `BatchUpdateFindings` operation.

        The `UpdateFindings` operation updates the `Note` and `RecordState` of the Security Hub aggregated findings that the filter attributes specify. Any member account that can view the finding can also see the update to the finding.

        Finding updates made with `UpdateFindings` aren't persisted if the same finding is later updated by the finding provider through the `BatchImportFindings` operation. In addition, Security Hub doesn't record updates made with `UpdateFindings` in the finding history.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: A collection of attributes that specify which findings you want to update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        note: The updated note for the finding.
        record-state: The updated record state for the finding.
