name: put-deliverability-dashboard-option
description: Enable or disable the Deliverability dashboard.
flags:
    --dashboard-enabled=!: Specifies whether to enable the Deliverability dashboard.
    --subscribed-domains=: An array of objects, one for each verified domain that you use to send email and enabled the Deliverability dashboard for.
documentation:
    command: |-
        Enable or disable the Deliverability dashboard. When you enable the Deliverability dashboard, you gain access to reputation, deliverability, and other metrics for the domains that you use to send email. You also gain the ability to perform predictive inbox placement tests.

        When you use the Deliverability dashboard, you pay a monthly subscription charge, in addition to any other fees that you accrue by using Amazon SES and other Amazon Web Services services. For more information about the features and cost of a Deliverability dashboard subscription, see [Amazon SES Pricing](http://aws.amazon.com/ses/pricing/).
    flag:
        dashboard-enabled: Specifies whether to enable the Deliverability dashboard. To enable the dashboard, set this value to `true`.
        subscribed-domains: An array of objects, one for each verified domain that you use to send email and enabled the Deliverability dashboard for.
