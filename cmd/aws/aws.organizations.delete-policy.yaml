name: delete-policy
description: Deletes the specified policy from your organization.
flags:
    --policy-id=!: The unique identifier (ID) of the policy that you want to delete.
documentation:
    command: |-
        Deletes the specified policy from your organization. Before you perform this operation, you must first detach the policy from all organizational units (OUs), roots, and accounts.

        This operation can be called only from the organization's management account or by a member account that is a delegated administrator.
    flag:
        policy-id: |-
            The unique identifier (ID) of the policy that you want to delete. You can get the ID from the [ListPolicies]() or [ListPoliciesForTarget]() operations.

            The [regex pattern](http://wikipedia.org/wiki/regex) for a policy ID string requires "p-" followed by from 8 to 128 lowercase or uppercase letters, digits, or the underscore character (\_).
