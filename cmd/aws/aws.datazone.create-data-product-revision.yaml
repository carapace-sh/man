name: create-data-product-revision
description: Creates a data product revision.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
    --description=: The description of the data product revision.
    --domain-identifier=!: The ID of the domain where the data product revision is created.
    --forms-input=: The metadata forms of the data product revision.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --glossary-terms=: The glossary terms of the data product revision.
    --identifier=!: The ID of the data product revision.
    --items=: The data assets of the data product revision.
    --name=!: The name of the data product revision.
documentation:
    command: |-
        Creates a data product revision.

        Prerequisites:

        - The original data product must exist in the given domain.
        - User must have permissions on the data product.
        - The domain must be valid and accessible.
        - The new revision name must comply with naming constraints (if required).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
        description: The description of the data product revision.
        domain-identifier: The ID of the domain where the data product revision is created.
        forms-input: The metadata forms of the data product revision.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        glossary-terms: The glossary terms of the data product revision.
