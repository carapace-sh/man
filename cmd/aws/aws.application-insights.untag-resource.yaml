name: untag-resource
description: Remove one or more tags (keys and values) from a specified application.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the application that you want to remove one or more tags from.
    --tag-keys=!: The tags (tag keys) that you want to remove from the resource.
documentation:
    command: Remove one or more tags (keys and values) from a specified application.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the application that you want to remove one or more tags from.
        tag-keys: |-
            The tags (tag keys) that you want to remove from the resource. When you specify a tag key, the action removes both that key and its associated tag value.

            To remove more than one tag from the application, append the `TagKeys` parameter and argument for each additional tag to remove, separated by an ampersand.
