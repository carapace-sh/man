name: create-cloud-exadata-infrastructure
description: Creates an Exadata infrastructure.
flags:
    --availability-zone-id=: The AZ ID of the AZ where the Exadata infrastructure is located.
    --availability-zone=: The name of the Availability Zone (AZ) where the Exadata infrastructure is located.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --compute-count=!: The number of database servers for the Exadata infrastructure.
    --customer-contacts-to-send-to-oci=:
        description: The email addresses of contacts to receive notification from Oracle about maintenance updates for the Exadata infrastructure.
        nargs: -1
    --database-server-type=: The database server model type of the Exadata infrastructure.
    --display-name=!: A user-friendly name for the Exadata infrastructure.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --maintenance-window=: The maintenance window configuration for the Exadata Cloud infrastructure.
    --shape=!: The model name of the Exadata infrastructure.
    --storage-count=!: The number of storage servers to activate for this Exadata infrastructure.
    --storage-server-type=: The storage server model type of the Exadata infrastructure.
    --tags=: The list of resource tags to apply to the Exadata infrastructure.
documentation:
    command: Creates an Exadata infrastructure.
    flag:
        availability-zone: |-
            The name of the Availability Zone (AZ) where the Exadata infrastructure is located.

            This operation requires that you specify a value for either `availabilityZone` or `availabilityZoneId`.

            Example: `us-east-1a`
        availability-zone-id: |-
            The AZ ID of the AZ where the Exadata infrastructure is located.

            This operation requires that you specify a value for either `availabilityZone` or `availabilityZoneId`.

            Example: `use1-az1`
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you don't specify a client token, the Amazon Web Services SDK automatically generates a client token and uses it for the request to ensure idempotency. The client token is valid for up to 24 hours after it's first used.
        compute-count: The number of database servers for the Exadata infrastructure. Valid values for this parameter depend on the shape. To get information about the minimum and maximum values, use the `ListDbSystemShapes` operation.
        customer-contacts-to-send-to-oci: The email addresses of contacts to receive notification from Oracle about maintenance updates for the Exadata infrastructure.
        database-server-type: The database server model type of the Exadata infrastructure. For the list of valid model names, use the `ListDbSystemShapes` operation.
        display-name: A user-friendly name for the Exadata infrastructure.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        maintenance-window: |-
            The maintenance window configuration for the Exadata Cloud infrastructure.

            This allows you to define when maintenance operations such as patching and updates can be performed on the infrastructure.
        shape: The model name of the Exadata infrastructure. For the list of valid model names, use the `ListDbSystemShapes` operation.
        storage-count: The number of storage servers to activate for this Exadata infrastructure. Valid values for this parameter depend on the shape. To get information about the minimum and maximum values, use the `ListDbSystemShapes` operation.
        storage-server-type: The storage server model type of the Exadata infrastructure. For the list of valid model names, use the `ListDbSystemShapes` operation.
        tags: The list of resource tags to apply to the Exadata infrastructure.
