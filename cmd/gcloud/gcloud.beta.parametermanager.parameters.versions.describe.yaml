name: describe
description: '*(BETA)*  Gets a single Parameter Manager parameter version.'
hidden: true
flags:
    --location=: The location id of the version resource.
    --parameter=: The parameter id of the version resource.
    --view=: View of the ParameterVersion.
completion:
    flag:
        view:
            - basic
            - full
documentation:
    command: |
        *(BETA)*  Gets a single parameter version, along with payload supplied by the user at the
        time of creation. If the payload contains any references to secrets, these will not be
        rendered in the output.
    flag:
        location: |-
            The location id of the version resource.
            +
            To set the `location` attribute:
            * provide the argument `version` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        parameter: |-
            The parameter id of the version resource.
            +
            To set the `parameter` attribute:
            * provide the argument `version` on the command line with a fully specified name;
            * provide the argument `--parameter` on the command line.
        view: |-
            View of the ParameterVersion.
            In the default FULL view, all metadata & payload associated with the
            ParameterVersion will be returned. _VIEW_ must be one of:
            +
            *basic*::: Include only the metadata for the resource.
            *full*::: Include metadata & other relevant payload data as well.
            This is the default view.
            :::
            +
