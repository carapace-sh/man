name: stop-browser-session
description: Terminates an active browser session in Amazon Bedrock.
flags:
    --browser-identifier=!: The unique identifier of the browser associated with the session.
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --session-id=!: The unique identifier of the browser session to stop.
    --trace-id=: The trace identifier for request tracking.
    --trace-parent=: The parent trace information for distributed tracing.
documentation:
    command: |-
        Terminates an active browser session in Amazon Bedrock. This operation stops the session, releases associated resources, and makes the session unavailable for further use.

        To stop a browser session, you must specify both the browser identifier and the session ID. Once stopped, a session cannot be restarted; you must create a new session using `StartBrowserSession`.

        The following operations are related to `StopBrowserSession`:

        - [StartBrowserSession](https://docs.aws.amazon.com/API_StartBrowserSession.html)
        - [GetBrowserSession](https://docs.aws.amazon.com/API_GetBrowserSession.html)
    flag:
        browser-identifier: The unique identifier of the browser associated with the session.
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error.
        session-id: The unique identifier of the browser session to stop.
        trace-id: The trace identifier for request tracking.
        trace-parent: The parent trace information for distributed tracing.
