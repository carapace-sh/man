name: upload-multipart-part
description: This operation uploads a part of an archive.
flags:
    --account-id=!: The `AccountId` value is the AWS account ID of the account that owns the vault.
    --body=: The data to upload.
    --checksum=: The SHA256 tree hash of the data being uploaded.
    --range=: Identifies the range of bytes in the assembled archive that will be uploaded in this part.
    --upload-id=!: The upload ID of the multipart upload.
    --vault-name=!: The name of the vault.
documentation:
    command: "This operation uploads a part of an archive. You can upload archive parts in any order. You can also upload them in parallel. You can upload up to 10,000 parts for a multipart upload.\n\nAmazon Glacier rejects your upload part request if any of the following conditions is true:\n\n- **SHA256 tree hash does not match**To ensure that part data is not corrupted in transmission, you compute a SHA256 tree hash of the part and include it in your request. Upon receiving the part data, Amazon S3 Glacier also computes a SHA256 tree hash. If these hash values don't match, the operation fails. For information about computing a SHA256 tree hash, see [Computing Checksums](https://docs.aws.amazon.com/amazonglacier/latest/dev/checksum-calculations.html).\n- **Part size does not match**The size of each part except the last must match the size specified in the corresponding [InitiateMultipartUpload]() request. The size of the last part must be the same size as, or smaller than, the specified size.\n  \n  If you upload a part whose size is smaller than the part size you specified in your initiate multipart upload request and that part is not the last part, then the upload part request will succeed. However, the subsequent Complete Multipart Upload request will fail.\n- **Range does not align**The byte range value in the request does not align with the part size specified in the corresponding initiate request. For example, if you specify a part size of 4194304 bytes (4 MB), then 0 to 4194303 bytes (4 MB - 1) and 4194304 (4 MB) to 8388607 (8 MB - 1) are valid part ranges. However, if you set a range value of 2 MB to 6 MB, the range does not align with the part size and the upload will fail.\n\nThis operation is idempotent. If you upload the same part multiple times, the data included in the most recent request overwrites the previously uploaded data.\n\nAn AWS account has full permission to perform all operations (actions). However, AWS Identity and Access Management (IAM) users don't have any permissions by default. You must grant them explicit permission to perform specific actions. For more information, see [Access Control Using AWS Identity and Access Management (IAM)](https://docs.aws.amazon.com/amazonglacier/latest/dev/using-iam-with-amazon-glacier.html).\n\nFor conceptual information and underlying REST API, see [Uploading Large Archives in Parts (Multipart Upload)](https://docs.aws.amazon.com/amazonglacier/latest/dev/uploading-archive-mpu.html) and [Upload Part](https://docs.aws.amazon.com/amazonglacier/latest/dev/api-upload-part.html) in the *Amazon Glacier Developer Guide*."
    flag:
        account-id: The `AccountId` value is the AWS account ID of the account that owns the vault. You can either specify an AWS account ID or optionally a single '`-`' (hyphen), in which case Amazon S3 Glacier uses the AWS account ID associated with the credentials used to sign the request. If you use an account ID, do not include any hyphens ('-') in the ID.
        body: The data to upload.
        checksum: The SHA256 tree hash of the data being uploaded.
        range: Identifies the range of bytes in the assembled archive that will be uploaded in this part. Amazon S3 Glacier uses this information to assemble the archive in the proper sequence. The format of this header follows RFC 2616. An example header is Content-Range:bytes 0-4194303/\*.
        upload-id: The upload ID of the multipart upload.
        vault-name: The name of the vault.
