name: delete-configured-table-analysis-rule
description: Deletes a configured table analysis rule.
flags:
    --analysis-rule-type=!: The analysis rule type to be deleted.
    --configured-table-identifier=!: The unique identifier for the configured table that the analysis rule applies to.
completion:
    flag:
        analysis-rule-type:
            - AGGREGATION
            - LIST
            - CUSTOM
documentation:
    command: Deletes a configured table analysis rule.
    flag:
        analysis-rule-type: The analysis rule type to be deleted. Configured table analysis rules are uniquely identified by their configured table identifier and analysis rule type.
        configured-table-identifier: The unique identifier for the configured table that the analysis rule applies to. Currently accepts the configured table ID.
