name: describe-association-executions
description: Views all executions for a specific association ID.
flags:
    --association-id=!: The association ID for which you want to view execution history details.
    --filters=: Filters for the request.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: A token to start the list.
documentation:
    command: Views all executions for a specific association ID.
    flag:
        association-id: The association ID for which you want to view execution history details.
        filters: |-
            Filters for the request. You can specify the following filters and values.

            ExecutionId (EQUAL)

            Status (EQUAL)

            CreatedTime (EQUAL, GREATER\_THAN, LESS\_THAN)
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: A token to start the list. Use this token to get the next set of results.
