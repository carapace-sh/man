# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: emr
description: Amazon EMR
commands:
    - name: add-instance-fleet
      description: Adds an instance fleet to a running cluster.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --cluster-id=!: The unique identifier of the cluster.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --instance-fleet=!: Specifies the configuration of the instance fleet.
      documentation:
        command: |-
            Adds an instance fleet to a running cluster.

            The instance fleet configuration is available only in Amazon EMR releases 4.8.0 and later, excluding 5.0.x.
        flag:
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cluster-id: The unique identifier of the cluster.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            instance-fleet: Specifies the configuration of the instance fleet.
    - name: add-instance-groups
      description: Adds one or more instance groups to a running cluster.
      flags:
        --cluster-id=!: Job flow in which to add the instance groups.
        --instance-groups=!:
            description: Instance groups to add.
            nargs: -1
      documentation:
        command: Adds one or more instance groups to a running cluster.
        flag:
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cluster-id: Job flow in which to add the instance groups.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            instance-groups: Instance groups to add.
    - name: add-steps
      description: Add a list of steps to a cluster
      flags:
        --cluster-id=!: A unique string that identifies a cluster
        --execution-role-arn=: You must grant the execution role the permissions needed to access the same IAM resources that the step can access
        --steps=:
            description: Specifies a list of steps to be executed by the cluster
            nargs: -1
      documentation:
        flag:
            cluster-id: |
                A unique string that identifies a cluster.
                The `create-cluster` command returns this identifier.
                You can use the `list-clusters` command to get cluster IDs.
            steps: |
                Specifies a list of steps to be executed by the cluster.
                Steps run only on the master node after applications are installed and are used to submit work to a cluster.
                A step can be specified using the shorthand syntax, by referencing a JSON file or by specifying an inline JSON structure.
                `Args` supplied with steps should be a comma-separated list of values (`Args=arg1,arg2,arg3`)
                or a bracket-enclosed list of values and key-value pairs (`Args=[arg1,arg2=value,arg4`).
    - name: add-tags
      description: Adds tags to an Amazon EMR resource, such as a cluster or an Amazon EMR Studio.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --resource-id=!: The Amazon EMR resource identifier to which tags will be added.
        --tags=!:
            description: A list of tags to associate with a resource.
            nargs: -1
      documentation:
        command: Adds tags to an Amazon EMR resource, such as a cluster or an Amazon EMR Studio. Tags make it easier to associate resources in various ways, such as grouping clusters to track your Amazon EMR resource allocation costs. For more information, see [Tag Clusters](https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-plan-tags.html).
        flag:
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            resource-id: The Amazon EMR resource identifier to which tags will be added. For example, a cluster identifier or an Amazon EMR Studio ID.
            tags: A list of tags to associate with a resource. Tags are user-defined key-value pairs that consist of a required key string with a maximum of 128 characters, and an optional value string with a maximum of 256 characters.
    - name: cancel-steps
      description: Cancels a pending step or steps in a running cluster.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --cluster-id=!: The `ClusterID` for the specified steps that will be canceled.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --step-cancellation-option=: The option to choose to cancel `RUNNING` steps.
        --step-ids=!:
            description: The list of `StepIDs` to cancel.
            nargs: -1
      completion:
        flag:
            step-cancellation-option:
                - SEND_INTERRUPT
                - TERMINATE_PROCESS
      documentation:
        command: Cancels a pending step or steps in a running cluster. Available only in Amazon EMR versions 4.8.0 and later, excluding version 5.0.0. A maximum of 256 steps are allowed in each CancelSteps request. CancelSteps is idempotent but asynchronous; it does not guarantee that a step will be canceled, even if the request is successfully submitted. When you use Amazon EMR releases 5.28.0 and later, you can cancel steps that are in a `PENDING` or `RUNNING` state. In earlier versions of Amazon EMR, you can only cancel steps that are in a `PENDING` state.
        flag:
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cluster-id: The `ClusterID` for the specified steps that will be canceled. Use [RunJobFlow]() and [ListClusters]() to get ClusterIDs.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            step-cancellation-option: The option to choose to cancel `RUNNING` steps. By default, the value is `SEND_INTERRUPT`.
            step-ids: The list of `StepIDs` to cancel. Use [ListSteps]() to get steps and their states for the specified cluster.
    - name: create-cluster
      description: Creates an Amazon EMR cluster with the specified configurations
      flags:
        --additional-info=: Specifies additional information during cluster creation
        --ami-version=: Specifies the version of Amazon Linux Amazon Machine Image (AMI) to use
        --applications=:
            description: Specifies the applications to install on the cluster
            nargs: -1
        --auto-scaling-role=: Specify --auto-scaling-role EMR_AutoScaling_DefaultRole if an automatic scaling policy is specified
        --auto-terminate: Specifies whether the cluster should terminate after completing all the steps
        --auto-termination-policy=: Auto termination policy for an Amazon EMR cluster
        --bootstrap-actions=:
            description: Specifies a list of bootstrap actions to run on each EC2 instance
            nargs: -1
        --configurations=: Specifies a JSON file that contains configuration classifications
        --custom-ami-id=: Specifies the AMI ID of a custom AMI to use when Amazon EMR provisions EC2 instances
        --ebs-root-volume-iops=: Specifies the IOPS, of the EBS root device volume of the Amazon Linux AMI that is used
        --ebs-root-volume-size=: Specifies the size, in GiB, of the EBS root device volume of the Amazon Linux AMI that is used
        --ebs-root-volume-throughput=: Specifies the throughput, in MiB/s, of the EBS root device volume of the Amazon Linux AMI that is used
        --ec2-attributes=: Configures cluster and Amazon EC2 instance configurations
        --emrfs=: Specifies EMRFS configuration options
        --enable-debugging: Specifies that the debugging tool is enabled for the cluster
        --extended-support: Reserved
        --instance-count=: Shortcut parameter as an alternative to --instance-groups when used together with --instance-type
        --instance-fleets=:
            description: Specifies the number and type of Amazon EC2 instances to create
            nargs: -1
        --instance-groups=:
            description: Specifies the number and type of Amazon EC2 instances to create
            nargs: -1
        --instance-type=: Shortcut parameter as an alternative to --instance-groups
        --kerberos-attributes=: Specifies required cluster attributes for Kerberos when Kerberos authentication is enabled
        --log-encryption-kms-key-id=: Specifies the KMS Id utilized for log encryption
        --log-uri=: Specifies the location in Amazon S3 to which log files are periodically written
        --managed-scaling-policy=: Managed scaling policy for an Amazon EMR cluster
        --monitoring-configuration=: Monitoring configuration for an Amazon EMR cluster
        --name=: The name of the cluster
        --no-auto-terminate: Specifies whether the cluster should terminate after completing all the steps
        --no-enable-debugging: Specifies that the debugging tool is enabled for the cluster
        --no-extended-support: Reserved
        --no-termination-protected: Specifies whether to lock the cluster to prevent the Amazon EC2 instances from being terminated by API call
        --no-unhealthy-node-replacement: Unhealthy node replacement for an Amazon EMR cluster
        --no-visible-to-all-users: Specifies whether the cluster is visible to all IAM users
        --os-release-label=: Specifies a particular Amazon Linux release for all nodes in a cluster launch request
        --placement-group-configs=:
            description: Placement group configuration for an Amazon EMR cluster
            nargs: -1
        --release-label=: Specifies the Amazon EMR release version
        --repo-upgrade-on-boot=: Amazon Linux AMIs connect to package repositories to install security updates
        --restore-from-hbase-backup=: Launches a new HBase cluster and populates it with data from a previous backup
        --scale-down-behavior=: Specifies the way that individual Amazon EC2 instances terminate
        --security-configuration=: Specifies the name of a security configuration to use for the cluster
        --service-role=: Specifies an IAM service role, which Amazon EMR requires to call other AWS services
        --step-concurrency-level=: This command specifies the step concurrency level of the cluster
        --step-execution-role-arn=: The IAM role ARN that will be used to execute steps on the cluster
        --steps=:
            description: Specifies a list of steps to be executed by the cluster
            nargs: -1
        --tags=:
            description: A list of tags to associate with a cluster
            nargs: -1
        --termination-protected: Specifies whether to lock the cluster to prevent the Amazon EC2 instances from being terminated by API call
        --unhealthy-node-replacement: Unhealthy node replacement for an Amazon EMR cluster
        --use-default-roles: Specifies that the cluster should use the default service role
        --visible-to-all-users: Specifies whether the cluster is visible to all IAM users
    - name: create-default-roles
      description: Creates the default IAM role EMR_EC2_DefaultRole and EMR_DefaultRole
      flags:
        --iam-endpoint=: The IAM endpoint to call for creating the roles
      documentation:
        command: |
            Creates the default IAM role EMR_EC2_DefaultRole and EMR_DefaultRole which can be used when creating the cluster using the create-cluster command.
            The default roles for EMR use managed policies, which are updated automatically to support future EMR functionality.

            If you do not have a Service Role and Instance Profile variable set for your create-cluster command in the AWS CLI config file,
            create-default-roles will automatically set the values for these variables with these default roles.
            If you have already set a value for Service Role or Instance Profile,
            create-default-roles will not automatically set the defaults for these variables in the AWS CLI config file.
            You can view settings for variables in the config file using the “aws configure get” command.
        flag:
            iam-endpoint: |
                The IAM endpoint to call for creating the roles.
                This is optional and should only be specified when a custom endpoint should be called for IAM operations.
    - name: create-hbase-backup
      description: Creates a HBase backup in S3
      flags:
        --cluster-id=!: A unique string that identifies a cluster
        --consistent: Performs a consistent backup
        --dir=!: The Amazon S3 location of the Hbase backup
      documentation:
        command: |
            Creates a HBase backup in S3.
            This command is only available when using Amazon EMR versionsearlier than 4.0.
        flag:
            cluster-id: |
                A unique string that identifies a cluster.
                The create-cluster command returns this identifier.
                You can use the list-clusters command to get cluster IDs.
            consistent: |
                Performs a consistent backup.
                Pauses all write operations to the HBase cluster during the backup process.
            dir: |
                The Amazon S3 location of the Hbase backup.
                Example: `s3://mybucket/mybackup`, where mybucket is the specified Amazon S3 bucket and mybackup is the specified backup location.
                The path argument must begin with `s3://`, which refers to an Amazon S3 bucket.
    - name: create-persistent-app-ui
