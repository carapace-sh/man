documentation:
    command: Returns a list of the broker nodes in the cluster.
    flag:
        cluster-arn: The Amazon Resource Name (ARN) that uniquely identifies the cluster.
        max-results: The maximum number of results to return in the response. If there are more results, the response includes a NextToken parameter.
