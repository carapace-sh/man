name: start-text-translation-job
description: Starts an asynchronous batch translation job.
flags:
    --client-token=!: A unique identifier for the request.
    --data-access-role-arn=!: The Amazon Resource Name (ARN) of an AWS Identity Access and Management (IAM) role that grants Amazon Translate read access to your input data.
    --input-data-config=!: Specifies the format and location of the input documents for the translation job.
    --job-name=: The name of the batch translation job to be performed.
    --output-data-config=!: Specifies the S3 folder to which your job output will be saved.
    --parallel-data-names=: The name of a parallel data resource to add to the translation job.
    --settings=: Settings to configure your translation output.
    --source-language-code=!: The language code of the input language.
    --target-language-codes=!: The target languages of the translation job.
    --terminology-names=: The name of a custom terminology resource to add to the translation job.
documentation:
    command: |-
        Starts an asynchronous batch translation job. Use batch translation jobs to translate large volumes of text across multiple documents at once. For batch translation, you can input documents with different source languages (specify `auto` as the source language). You can specify one or more target languages. Batch translation translates each input document into each of the target languages. For more information, see [Asynchronous batch processing](https://docs.aws.amazon.com/translate/latest/dg/async.html).

        Batch translation jobs can be described with the [DescribeTextTranslationJob]() operation, listed with the [ListTextTranslationJobs]() operation, and stopped with the [StopTextTranslationJob]() operation.
    flag:
        client-token: A unique identifier for the request. This token is generated for you when using the Amazon Translate SDK.
        data-access-role-arn: The Amazon Resource Name (ARN) of an AWS Identity Access and Management (IAM) role that grants Amazon Translate read access to your input data. For more information, see [Identity and access management](https://docs.aws.amazon.com/translate/latest/dg/identity-and-access-management.html) .
        input-data-config: Specifies the format and location of the input documents for the translation job.
        job-name: The name of the batch translation job to be performed.
        output-data-config: Specifies the S3 folder to which your job output will be saved.
        parallel-data-names: |-
            The name of a parallel data resource to add to the translation job. This resource consists of examples that show how you want segments of text to be translated. If you specify multiple target languages for the job, the parallel data file must include translations for all the target languages.

            When you add parallel data to a translation job, you create an *Active Custom Translation* job.

            This parameter accepts only one parallel data resource.

            Active Custom Translation jobs are priced at a higher rate than other jobs that don't use parallel data. For more information, see [Amazon Translate pricing](http://aws.amazon.com/translate/pricing/).

            For a list of available parallel data resources, use the [ListParallelData]() operation.

            For more information, see [Customizing your translations with parallel data](https://docs.aws.amazon.com/translate/latest/dg/customizing-translations-parallel-data.html).
        settings: |-
            Settings to configure your translation output. You can configure the following options:

            - Brevity: not supported.
            - Formality: sets the formality level of the output text.
            - Profanity: masks profane words and phrases in your translation output.
        source-language-code: The language code of the input language. Specify the language if all input documents share the same language. If you don't know the language of the source files, or your input documents contains different source languages, select `auto`. Amazon Translate auto detects the source language for each input document. For a list of supported language codes, see [Supported languages](https://docs.aws.amazon.com/translate/latest/dg/what-is-languages.html).
        target-language-codes: |-
            The target languages of the translation job. Enter up to 10 language codes. Each input file is translated into each target language.

            Each language code is 2 or 5 characters long. For a list of language codes, see [Supported languages](https://docs.aws.amazon.com/translate/latest/dg/what-is-languages.html).
        terminology-names: |-
            The name of a custom terminology resource to add to the translation job. This resource lists examples source terms and the desired translation for each term.

            This parameter accepts only one custom terminology resource.

            If you specify multiple target languages for the job, translate uses the designated terminology for each requested target language that has an entry for the source term in the terminology file.

            For a list of available custom terminology resources, use the [ListTerminologies]() operation.

            For more information, see [Custom terminology](https://docs.aws.amazon.com/translate/latest/dg/how-custom-terminology.html).
