name: set-iam-policy
description: Set the IAM policy for a Compute Engine reservation.
flags:
    --zone=: The name of the Google Compute Engine zone.
documentation:
    command: |
        Set the IAM policy for the given reservation as defined in a JSON or YAML file.
    flag:
        zone: |-
            The name of the Google Compute Engine zone.
            +
            To set the `zone` attribute:
            * provide the argument `reservation` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
