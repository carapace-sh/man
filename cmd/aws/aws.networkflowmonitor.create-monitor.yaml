name: create-monitor
description: Create a monitor for specific network flows between local and remote resources, so that you can monitor network performance for one or several of your workloads.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive string of up to 64 ASCII characters that you specify to make an idempotent API request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --local-resources=!: The local resources to monitor.
    --monitor-name=!: The name of the monitor.
    --remote-resources=: The remote resources to monitor.
    --scope-arn=!: The Amazon Resource Name (ARN) of the scope for the monitor.
    --tags=: The tags for a monitor.
documentation:
    command: Create a monitor for specific network flows between local and remote resources, so that you can monitor network performance for one or several of your workloads. For each monitor, Network Flow Monitor publishes detailed end-to-end performance metrics and a network health indicator (NHI) that informs you whether there were Amazon Web Services network issues for one or more of the network flows tracked by a monitor, during a time period that you choose.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive string of up to 64 ASCII characters that you specify to make an idempotent API request. Don't reuse the same client token for other API requests.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        local-resources: |-
            The local resources to monitor. A local resource in a workload is the location of the host, or hosts, where the Network Flow Monitor agent is installed. For example, if a workload consists of an interaction between a web service and a backend database (for example, Amazon Dynamo DB), the subnet with the EC2 instance that hosts the web service, which also runs the agent, is the local resource.

            Be aware that all local resources must belong to the current Region.
        monitor-name: The name of the monitor.
        remote-resources: |-
            The remote resources to monitor. A remote resource is the other endpoint in the bi-directional flow of a workload, with a local resource. For example, Amazon Dynamo DB can be a remote resource.

            When you specify remote resources, be aware that specific combinations of resources are allowed and others are not, including the following constraints:

            - All remote resources that you specify must all belong to a single Region.
            - If you specify Amazon Web Services services as remote resources, any other remote resources that you specify must be in the current Region.
            - When you specify a remote resource for another Region, you can only specify the `Region` resource type. You cannot specify a subnet, VPC, or Availability Zone in another Region.
            - If you leave the `RemoteResources` parameter empty, the monitor will include all network flows that terminate in the current Region.
        scope-arn: The Amazon Resource Name (ARN) of the scope for the monitor.
        tags: The tags for a monitor. You can add a maximum of 200 tags.
