name: create
description: '*(ALPHA)*  Create a Compute Engine multi-MIG.'
hidden: true
flags:
    --description=: Sets description to multi-MIG.
    --region=: The name of the Google Compute Engine region.
    --workload-policy=: Taking the resource policy ID and specifies a workload policy for multi-MIG.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute multi-migs create* creates a Compute Engine multi-MIG.
    flag:
        description: Sets description to multi-MIG.
        region: |-
            The name of the Google Compute Engine region.
            +
            Overrides the default compute/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `multi_mig` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `compute/region`.
        workload-policy: Taking the resource policy ID and specifies a workload policy for multi-MIG.
