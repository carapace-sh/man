name: list-tags-for-resource
description: List the tags for Config resource.
flags:
    --limit=: The maximum number of tags returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
    --resource-arn=!: The Amazon Resource Name (ARN) that identifies the resource for which to list the tags.
documentation:
    command: List the tags for Config resource.
    flag:
        limit: The maximum number of tags returned on each page. The limit maximum is 50. You cannot specify a number greater than 50. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
        resource-arn: |-
            The Amazon Resource Name (ARN) that identifies the resource for which to list the tags. The following resources are supported:

            - `ConfigurationRecorder`
            - `ConfigRule`
            - `OrganizationConfigRule`
            - `ConformancePack`
            - `OrganizationConformancePack`
            - `ConfigurationAggregator`
            - `AggregationAuthorization`
            - `StoredQuery`
