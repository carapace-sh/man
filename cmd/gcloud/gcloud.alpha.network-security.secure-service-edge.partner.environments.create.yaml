name: create
description: '*(ALPHA)*  Create a partner SSE environment.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --partner-facing-subnet-ranges=!: List of subnet ranges (in CIDR format) that are reserved for Google's use, such as `100.192.0.0/10,100.160.0.0/11`.
    --partner-network=!: Network in the current project which will support customer traffic.
    --security-service=!: Security service for this environment.
    --symantec-api-endpoint=!: Hostname of the Symantec API used to manage Symantec resources on the customer's behalf, such as `partner.com`.
completion:
    flag:
        security-service:
            - symantec-cloud-swg
documentation:
    command: |
        *(ALPHA)*  Create a new partner environment for customer realms.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `partner_sse_environment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * location is global by default.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        partner-facing-subnet-ranges: |-
            List of subnet ranges (in CIDR format) that are reserved for Google's use, such as `100.192.0.0/10,100.160.0.0/11`.
            These should not overlap with any ranges used by the partner in `partner-network`.
        partner-network: Network in the current project which will support customer traffic.
        security-service: 'Security service for this environment. _SECURITY_SERVICE_ must be (only one value is supported): *symantec-cloud-swg*.'
        symantec-api-endpoint: Hostname of the Symantec API used to manage Symantec resources on the customer's behalf, such as `partner.com`.
