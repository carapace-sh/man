name: reset-db-parameter-group
description: Modifies the parameters of a DB parameter group to the engine/system default value.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-parameter-group-name=!: The name of the DB parameter group.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-reset-all-parameters: Specifies whether (`true`) or not (`false`) to reset all parameters in the DB parameter group to default values.
    --parameters=: To reset the entire DB parameter group, specify the `DBParameterGroup` name and `ResetAllParameters` parameters.
    --reset-all-parameters: Specifies whether (`true`) or not (`false`) to reset all parameters in the DB parameter group to default values.
documentation:
    command: 'Modifies the parameters of a DB parameter group to the engine/system default value. To reset specific parameters, provide a list of the following: `ParameterName` and `ApplyMethod`. To reset the entire DB parameter group, specify the `DBParameterGroup` name and `ResetAllParameters` parameters. When resetting the entire group, dynamic parameters are updated immediately and static parameters are set to `pending-reboot` to take effect on the next DB instance restart or `RebootDBInstance` request.'
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-parameter-group-name: |-
            The name of the DB parameter group.

            Constraints:

            - Must match the name of an existing DBParameterGroup.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        parameters: |-
            To reset the entire DB parameter group, specify the `DBParameterGroup` name and `ResetAllParameters` parameters. To reset specific parameters, provide a list of the following: `ParameterName` and `ApplyMethod`. A maximum of 20 parameters can be modified in a single request.

            Valid Values (for Apply method): `pending-reboot`
        reset-all-parameters: |-
            Specifies whether (`true`) or not (`false`) to reset all parameters in the DB parameter group to default values.

            Default: `true`
