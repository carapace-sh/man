name: import
description: Import fleet membership for an Attached cluster.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --context=!: Context to use in the kubeconfig.
    --distribution=!: Set the base platform type of the cluster to attach.
    --fleet-membership-location=: Google Cloud location for the fleet_membership.
    --fleet-membership=!: ID of the fleet_membership or fully qualified identifier for the fleet_membership.
    --kubeconfig=: Path to the kubeconfig file.
    --location=: ID of the location or fully qualified identifier for the location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-skip-cluster-admin-check&: When this hidden flag is set, the cluster admin check will be skipped.
    --no-validate-only&: Validate the cluster to import, but don't actually perform it.
    --platform-version=!: Platform version to use for the cluster.
    --proxy-secret-name=!: Name of the Kubernetes secret that contains the HTTP/HTTPS
    --proxy-secret-namespace=!: Namespace of the Kubernetes secret that contains the HTTP/HTTPS
    --skip-cluster-admin-check&: When this hidden flag is set, the cluster admin check will be skipped.
    --validate-only: Validate the cluster to import, but don't actually perform it.
documentation:
    command: Import fleet membership for an Attached cluster.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        context: Context to use in the kubeconfig.
        distribution: |-
            Set the base platform type of the cluster to attach.
            +
            Examples:
            +
              $ {command} --distribution=aks
              $ {command} --distribution=eks
              $ {command} --distribution=generic
        fleet-membership: |-
            ID of the fleet_membership or fully qualified identifier for the fleet_membership.
            +
            To set the `fleet_membership` attribute:
            * provide the argument `--fleet-membership` on the command line.
        fleet-membership-location: |-
            Google Cloud location for the fleet_membership.
            +
            To set the `location` attribute:
            * provide the argument `--fleet-membership` on the command line with a fully specified name;
            * provide the argument `--fleet-membership-location` on the command line;
            * set the property `container_attached/location`.
        kubeconfig: |-
            Path to the kubeconfig file.
            +
            If not provided, the default at ~/.kube/config will be used.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line;
            * set the property `container_attached/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-skip-cluster-admin-check: |
            When this hidden flag is set, the cluster admin check will be skipped.
        no-validate-only: Validate the cluster to import, but don't actually perform it.
        platform-version: |-
            Platform version to use for the cluster.
            +
            To retrieve a list of valid versions, run:
            +
              $ gcloud alpha container attached get-server-config --location=LOCATION
            +
            Replace ``LOCATION'' with the target Google Cloud location for the cluster.
        proxy-secret-name: |-
            Name of the Kubernetes secret that contains the HTTP/HTTPS
            proxy configuration.
        proxy-secret-namespace: |-
            Namespace of the Kubernetes secret that contains the HTTP/HTTPS
            proxy configuration.
        skip-cluster-admin-check: |
            When this hidden flag is set, the cluster admin check will be skipped.
        validate-only: Validate the cluster to import, but don't actually perform it.
