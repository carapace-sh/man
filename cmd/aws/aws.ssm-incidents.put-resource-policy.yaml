name: put-resource-policy
description: Adds a resource policy to the specified response plan.
flags:
    --policy=!: Details of the resource policy.
    --resource-arn=!: The Amazon Resource Name (ARN) of the response plan to add the resource policy to.
documentation:
    command: Adds a resource policy to the specified response plan. The resource policy is used to share the response plan using Resource Access Manager (RAM). For more information about cross-account sharing, see [Cross-Region and cross-account incident management](https://docs.aws.amazon.com/incident-manager/latest/userguide/incident-manager-cross-account-cross-region.html).
    flag:
        policy: Details of the resource policy.
        resource-arn: The Amazon Resource Name (ARN) of the response plan to add the resource policy to.
