name: update
description: '*(BETA)*  Update a Unit.'
flags:
    --clear-labels: Clear labels value and set to empty map.
    --clear-tenant: Clear tenant value and set to null.
    --clear-unit-kind: Clear unit_kind value and set to null.
    --labels=: Set labels to new value.
    --location=: For resources [unit, tenant, unit-kind], provides fallback value for resource location attribute.
    --maintenance-pinned-until-time=: If present, it fixes the release on the unit until the given time; i.e.
    --no-clear-labels&: Clear labels value and set to empty map.
    --no-clear-tenant&: Clear tenant value and set to null.
    --no-clear-unit-kind&: Clear unit_kind value and set to null.
    --remove-labels=: Remove existing value from map labels.
    --tenant=!: ID of the tenant or fully qualified identifier for the tenant.
    --unit-kind=!: ID of the unitKind or fully qualified identifier for the unitKind.
    --update-labels=: Update labels value or add key value pair.
documentation:
    command: '*(BETA)*  Update a Unit'
    flag:
        clear-labels: Clear labels value and set to empty map.
        clear-tenant: Clear tenant value and set to null.
        clear-unit-kind: Clear unit_kind value and set to null.
        labels: |-
            Set labels to new value. The labels on the resource, which can be used for categorization.
            similar to Kubernetes resource labels.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: For resources [unit, tenant, unit-kind], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        maintenance-pinned-until-time: |-
            If present, it fixes the release on the unit until the given time; i.e.
            changes to the release field will be rejected. Rollouts should and will
            also respect this by not requesting an upgrade in the first place.
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-tenant: Clear tenant value and set to null.
        no-clear-unit-kind: Clear unit_kind value and set to null.
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        tenant: |-
            ID of the tenant or fully qualified identifier for the tenant.
            +
            To set the `tenant` attribute:
            * provide the argument `--tenant` on the command line.
        unit-kind: |-
            ID of the unitKind or fully qualified identifier for the unitKind.
            +
            To set the `unit-kind` attribute:
            * provide the argument `--unit-kind` on the command line.
        update-labels: |-
            Update labels value or add key value pair. The labels on the resource, which can be used for categorization.
            similar to Kubernetes resource labels.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-labels=path_to_file.(yaml|json)
            +
            ```
