name: list-game-servers
description: |-
    **This API works with the following fleet types:** EC2 (FleetIQ)

    Retrieves information on all game servers that are currently active in a specified game server group.
flags:
    --game-server-group-name=!: An identifier for the game server group to retrieve a list of game servers from.
    --limit=: The maximum number of results to return.
    --next-token=: A token that indicates the start of the next sequential page of results.
    --sort-order=: Indicates how to sort the returned data based on game server registration timestamp.
completion:
    flag:
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: |-
        **This API works with the following fleet types:** EC2 (FleetIQ)

        Retrieves information on all game servers that are currently active in a specified game server group. You can opt to sort the list by game server age. Use the pagination parameters to retrieve results in a set of sequential segments.

        **Learn more**

        [Amazon GameLift Servers FleetIQ Guide](https://docs.aws.amazon.com/gamelift/latest/fleetiqguide/gsg-intro.html)
    flag:
        game-server-group-name: An identifier for the game server group to retrieve a list of game servers from. Use either the name or ARN value.
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
        sort-order: Indicates how to sort the returned data based on game server registration timestamp. Use `ASCENDING` to retrieve oldest game servers first, or use `DESCENDING` to retrieve newest game servers first. If this parameter is left empty, game servers are returned in no particular order.
