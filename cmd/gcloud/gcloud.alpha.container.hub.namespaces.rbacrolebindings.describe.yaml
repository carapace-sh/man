name: describe
description: '*(ALPHA)*  *(REMOVED)*  Show fleet namespace RBAC RoleBinding information.'
hidden: true
flags:
    --location=: Location for the rbacrolebinding.
    --namespace=: Name of the rbacrolebinding.
documentation:
    command: |-
        *(ALPHA)*  *(REMOVED)*  Show fleet namespace RBAC RoleBinding information.

        This command has been removed as of version 447.0.0. Use `gcloud fleet scopes rbacrolebindings` instead.

        This command can fail for the following reasons:
        * The RoleBinding specified does not exist in the project.
        * The caller does not have permission to access the RoleBinding.

        ## EXAMPLES

        To print metadata for RBAC RoleBinding `RBRB` in the namespace `NAMESPACE`,
        run:

          $ gcloud alpha container hub namespaces rbacrolebindings describe RBRB --namespace=NAMESPACE
    flag:
        location: |-
            Location for the rbacrolebinding.
            +
            To set the `location` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        namespace: |-
            Name of the rbacrolebinding.
            +
            To set the `namespace` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--namespace` on the command line.
