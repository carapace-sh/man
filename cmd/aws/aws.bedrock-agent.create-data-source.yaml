name: create-data-source
description: Connects a knowledge base to a data source.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --data-deletion-policy=: The data deletion policy for the data source.
    --data-source-configuration=!: The connection configuration for the data source.
    --description=: A description of the data source.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --knowledge-base-id=!: The unique identifier of the knowledge base to which to add the data source.
    --name=!: The name of the data source.
    --server-side-encryption-configuration=: Contains details about the server-side encryption for the data source.
    --vector-ingestion-configuration=: Contains details about how to ingest the documents in the data source.
completion:
    flag:
        data-deletion-policy:
            - RETAIN
            - DELETE
documentation:
    command: |-
        Connects a knowledge base to a data source. You specify the configuration for the specific data source service in the `dataSourceConfiguration` field.

        You can't change the `chunkingConfiguration` after you create the data source connector.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        data-deletion-policy: |-
            The data deletion policy for the data source.

            You can set the data deletion policy to:

            - DELETE: Deletes all data from your data source that’s converted into vector embeddings upon deletion of a knowledge base or data source resource. Note that the **vector store itself is not deleted**, only the data. This flag is ignored if an Amazon Web Services account is deleted.
            - RETAIN: Retains all data from your data source that’s converted into vector embeddings upon deletion of a knowledge base or data source resource. Note that the **vector store itself is not deleted** if you delete a knowledge base or data source resource.
        data-source-configuration: The connection configuration for the data source.
        description: A description of the data source.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        knowledge-base-id: The unique identifier of the knowledge base to which to add the data source.
        name: The name of the data source.
        server-side-encryption-configuration: Contains details about the server-side encryption for the data source.
        vector-ingestion-configuration: Contains details about how to ingest the documents in the data source.
