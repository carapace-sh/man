name: create-plugin
description: Creates an Amazon Q Business plugin.
flags:
    --application-id=!: The identifier of the application that will contain the plugin.
    --auth-configuration=!: ""
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token that you provide to identify the request to create your Amazon Q Business plugin.
    --custom-plugin-configuration=: Contains configuration for a custom plugin.
    --display-name=!: A the name for your plugin.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --server-url=: The source URL used for plugin configuration.
    --tags=:
        description: A list of key-value pairs that identify or categorize the data source connector.
        nargs: -1
    --type=!: The type of plugin you want to create.
completion:
    flag:
        type:
            - SERVICE_NOW
            - SALESFORCE
            - JIRA
            - ZENDESK
            - CUSTOM
            - QUICKSIGHT
            - SERVICENOW_NOW_PLATFORM
            - JIRA_CLOUD
            - SALESFORCE_CRM
            - ZENDESK_SUITE
            - ATLASSIAN_CONFLUENCE
            - GOOGLE_CALENDAR
            - MICROSOFT_TEAMS
            - MICROSOFT_EXCHANGE
            - PAGERDUTY_ADVANCE
            - SMARTSHEET
            - ASANA
documentation:
    command: Creates an Amazon Q Business plugin.
    flag:
        application-id: The identifier of the application that will contain the plugin.
        auth-configuration: ""
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that you provide to identify the request to create your Amazon Q Business plugin.
        custom-plugin-configuration: Contains configuration for a custom plugin.
        display-name: A the name for your plugin.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        server-url: The source URL used for plugin configuration.
        tags: 'A list of key-value pairs that identify or categorize the data source connector. You can also use tags to help control access to the data source connector. Tag keys and values can consist of Unicode letters, digits, white space, and any of the following symbols: _ . : / = + - @.'
        type: The type of plugin you want to create.
