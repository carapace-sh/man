name: describe-instance-sql-ha-history-states
description: Describes the historical SQL Server High Availability states for Amazon EC2 instances that are enabled for Amazon EC2 High Availability for SQL Server monitoring.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --end-time=: The end data and time of the period for which to get historical SQL Server High Availability states.
    --filters=:
        description: One or more filters to apply to the results.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-ids=:
        description: The IDs of the SQL Server High Availability instances to describe.
        nargs: -1
    --max-results=: The maximum number of results to return for the request in a single page.
    --next-token=: The token to use to retrieve the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --start-time=: The start data and time of the period for which to get the historical SQL Server High Availability states.
documentation:
    command: Describes the historical SQL Server High Availability states for Amazon EC2 instances that are enabled for Amazon EC2 High Availability for SQL Server monitoring.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        end-time: |-
            The end data and time of the period for which to get historical SQL Server High Availability states. If omitted, the API returns historical states up to the current date and time.

            Timezone: UTC

            Format: `YYYY-MM-DDThh:mm:ss.sssZ`
        filters: |-
            One or more filters to apply to the results. Supported filters include:

            - `tag:<key>` - The tag key and value pair assigned to the instance. For example, to find all instances tagged with `Owner:TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.
            - `tag-key` - The tag key assigned to the instance.
            - `haStatus` - The SQL Server High Availability status of the SQL Server High Availability instance (`processing` | `active` | `standby` | `invalid`).
            - `sqlServerLicenseUsage` - The license type for the SQL Server license (`full` | `waived`).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-ids: The IDs of the SQL Server High Availability instances to describe. If omitted, the API returns historical states for all SQL Server High Availability instances.
        max-results: The maximum number of results to return for the request in a single page. The remaining results can be seen by sending another request with the returned `nextToken` value.
        next-token: The token to use to retrieve the next page of results.
        start-time: |-
            The start data and time of the period for which to get the historical SQL Server High Availability states. If omitted, the API returns all available historical states.

            Timezone: UTC

            Format: `YYYY-MM-DDThh:mm:ss.sssZ`
