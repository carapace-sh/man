name: describe-serverless-cache-snapshots
description: Returns information about serverless cache snapshots.
flags:
    --max-results=: The maximum number of records to include in the response.
    --next-token=: An optional marker returned from a prior request to support pagination of results from this operation.
    --serverless-cache-name=: The identifier of serverless cache.
    --serverless-cache-snapshot-name=: The identifier of the serverless cache’s snapshot.
    --snapshot-type=: The type of snapshot that is being described.
documentation:
    command: Returns information about serverless cache snapshots. By default, this API lists all of the customer’s serverless cache snapshots. It can also describe a single serverless cache snapshot, or the snapshots associated with a particular serverless cache. Available for Valkey, Redis OSS and Serverless Memcached only.
    flag:
        max-results: The maximum number of records to include in the response. If more records exist than the specified max-results value, a market is included in the response so that remaining results can be retrieved. Available for Valkey, Redis OSS and Serverless Memcached only.The default is 50. The Validation Constraints are a maximum of 50.
        next-token: An optional marker returned from a prior request to support pagination of results from this operation. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by max-results. Available for Valkey, Redis OSS and Serverless Memcached only.
        serverless-cache-name: The identifier of serverless cache. If this parameter is specified, only snapshots associated with that specific serverless cache are described. Available for Valkey, Redis OSS and Serverless Memcached only.
        serverless-cache-snapshot-name: The identifier of the serverless cache’s snapshot. If this parameter is specified, only this snapshot is described. Available for Valkey, Redis OSS and Serverless Memcached only.
        snapshot-type: The type of snapshot that is being described. Available for Valkey, Redis OSS and Serverless Memcached only.
