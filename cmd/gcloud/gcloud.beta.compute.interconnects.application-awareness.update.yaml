name: update
description: '*(BETA)*  Updates application awareness configuration of a Compute Engine interconnect.'
flags:
    --enabled: Enable or disable application awareness on the interconnect.
    --no-enabled&: Enable or disable application awareness on the interconnect.
    --profile-description=: Add profile description for application awareness.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute interconnects application-awareness update* allows the user to enable or disable application awareness on Interconnect,
        as well as add/update the description of the application awareness on Interconnect profile.
        For an example, refer to the *EXAMPLES* section below.
    flag:
        enabled: |-
            Enable or disable application awareness on the interconnect. Application awareness enablement will fail
            if the application awareness configuration is not specified. Use --no-enabled to disable
            it.
        no-enabled: |-
            Enable or disable application awareness on the interconnect. Application awareness enablement will fail
            if the application awareness configuration is not specified. Use --no-enabled to disable
            it.
        profile-description: Add profile description for application awareness.
