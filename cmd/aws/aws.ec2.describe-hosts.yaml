name: describe-hosts
description: Describes the specified Dedicated Hosts or all your Dedicated Hosts.
flags:
    --filter=: The filters.
    --host-ids=: The IDs of the Dedicated Hosts.
    --max-results=: The maximum number of results to return for the request in a single page.
    --next-token=: The token to use to retrieve the next page of results.
documentation:
    command: |-
        Describes the specified Dedicated Hosts or all your Dedicated Hosts.

        The results describe only the Dedicated Hosts in the Region you're currently using. All listed instances consume capacity on your Dedicated Host. Dedicated Hosts that have recently been released are listed with the state `released`.
    flag:
        filter: |-
            The filters.

            - `auto-placement` - Whether auto-placement is enabled or disabled (`on` | `off`).
            - `availability-zone` - The Availability Zone of the host.
            - `client-token` - The idempotency token that you provided when you allocated the host.
            - `host-reservation-id` - The ID of the reservation assigned to this host.
            - `instance-type` - The instance type size that the Dedicated Host is configured to support.
            - `state` - The allocation state of the Dedicated Host (`available` | `under-assessment` | `permanent-failure` | `released` | `released-permanent-failure`).
            - `tag-key` - The key of a tag assigned to the resource. Use this filter to find all resources assigned a tag with a specific key, regardless of the tag value.
        host-ids: The IDs of the Dedicated Hosts. The IDs are used for targeted instance launches.
        max-results: |-
            The maximum number of results to return for the request in a single page. The remaining results can be seen by sending another request with the returned `nextToken` value. This value can be between 5 and 500. If `maxResults` is given a larger value than 500, you receive an error.

            You cannot specify this parameter and the host IDs parameter in the same request.
        next-token: The token to use to retrieve the next page of results.
