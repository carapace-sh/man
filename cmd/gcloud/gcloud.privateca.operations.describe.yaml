name: describe
description: Describe an operation ran on the Private CA API.
hidden: true
flags:
    --location=: The location of the operation to describe.
documentation:
    command: |
        Get details about a Long Running Operation.
    flag:
        location: |-
            The location of the operation to describe.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
