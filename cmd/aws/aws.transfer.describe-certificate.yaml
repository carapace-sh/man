name: describe-certificate
description: Describes the certificate that's identified by the `CertificateId`.
flags:
    --certificate-id=!: An array of identifiers for the imported certificates.
documentation:
    command: |-
        Describes the certificate that's identified by the `CertificateId`.

        Transfer Family automatically publishes a Amazon CloudWatch metric called `DaysUntilExpiry` for imported certificates. This metric tracks the number of days until the certificate expires based on the `InactiveDate`. The metric is available in the `AWS/Transfer` namespace and includes the `CertificateId` as a dimension.
    flag:
        certificate-id: An array of identifiers for the imported certificates. You use this identifier for working with profiles and partner profiles.
