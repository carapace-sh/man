name: list-qualification-requests
description: The `ListQualificationRequests` operation retrieves requests for Qualifications of a particular Qualification type.
flags:
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: ""
    --qualification-type-id=: The ID of the QualificationType.
documentation:
    command: The `ListQualificationRequests` operation retrieves requests for Qualifications of a particular Qualification type. The owner of the Qualification type calls this operation to poll for pending requests, and accepts them using the AcceptQualification operation.
    flag:
        max-results: The maximum number of results to return in a single call.
        next-token: ""
        qualification-type-id: The ID of the QualificationType.
