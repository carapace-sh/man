name: list-tags-for-resource
description: List the tags for an AWS Device Farm resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource or resources for which to list tags.
documentation:
    command: List the tags for an AWS Device Farm resource.
    flag:
        resource-arn: 'The Amazon Resource Name (ARN) of the resource or resources for which to list tags. You can associate tags with the following Device Farm resources: `PROJECT`, `RUN`, `NETWORK_PROFILE`, `INSTANCE_PROFILE`, `DEVICE_INSTANCE`, `SESSION`, `DEVICE_POOL`, `DEVICE`, and `VPCE_CONFIGURATION`.'
