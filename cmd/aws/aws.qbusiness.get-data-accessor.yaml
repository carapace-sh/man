name: get-data-accessor
description: Retrieves information about a specified data accessor.
flags:
    --application-id=!: The unique identifier of the Amazon Q Business application.
    --data-accessor-id=!: The unique identifier of the data accessor to retrieve.
documentation:
    command: Retrieves information about a specified data accessor. This operation returns details about the data accessor, including its display name, unique identifier, Amazon Resource Name (ARN), the associated Amazon Q Business application and IAM Identity Center application, the IAM role for the ISV, the action configurations, and the timestamps for when the data accessor was created and last updated.
    flag:
        application-id: The unique identifier of the Amazon Q Business application.
        data-accessor-id: The unique identifier of the data accessor to retrieve.
