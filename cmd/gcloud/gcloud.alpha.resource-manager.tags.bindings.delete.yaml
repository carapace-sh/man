name: delete
description: '*(ALPHA)*  Deletes a TagBinding.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Region or zone of the resource to unbind from the TagValue.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --parent=!: Full resource name of the resource attached to the tagValue.
    --tag-value=!: Tag value name or namespaced name.
documentation:
    command: |-
        *(ALPHA)*  Deletes a TagBinding given the TagValue and the parent resource that the
        TagValue is attached to. The parent must be given as the full resource name.
        See: https://cloud.google.com/apis/design/resource_names#full_resource_name.
        The TagValue can be represented with its numeric id or
        its namespaced name of
        {parent_namespace}/{tag_key_short_name}/{tag_value_short_name}.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: Region or zone of the resource to unbind from the TagValue. This field is not required if the resource is a global resource like projects, folders and organizations.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        parent: Full resource name of the resource attached to the tagValue.
        tag-value: Tag value name or namespaced name. The name should be in the form tagValues/{numeric_id}. The namespaced name should be in the form {org_id}/{tag_key_short_name}/{short_name} where short_name must be 1-63 characters, beginning and ending with an alphanumeric character ([a-z0-9A-Z]) with dashes (-), underscores (_), dots (.), and alphanumerics between.
