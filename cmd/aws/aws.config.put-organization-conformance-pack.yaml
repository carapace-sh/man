name: put-organization-conformance-pack
description: Deploys conformance packs across member accounts in an Amazon Web Services Organization.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --conformance-pack-input-parameters=: A list of `ConformancePackInputParameter` objects.
    --delivery-s3-bucket=: The name of the Amazon S3 bucket where Config stores conformance pack templates.
    --delivery-s3-key-prefix=: The prefix for the Amazon S3 bucket.
    --excluded-accounts=: A list of Amazon Web Services accounts to be excluded from an organization conformance pack while deploying a conformance pack.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --organization-conformance-pack-name=!: Name of the organization conformance pack you want to create.
    --template-body=: A string that contains the full conformance pack template body.
    --template-s3-uri=: Location of file containing the template body.
documentation:
    command: |-
        Deploys conformance packs across member accounts in an Amazon Web Services Organization. For information on how many organization conformance packs and how many Config rules you can have per account, see [**Service Limits**](https://docs.aws.amazon.com/config/latest/developerguide/configlimits.html) in the *Config Developer Guide*.

        Only a management account and a delegated administrator can call this API. When calling this API with a delegated administrator, you must ensure Organizations `ListDelegatedAdministrator` permissions are added. An organization can have up to 3 delegated administrators.

        When you use `PutOrganizationConformancePack` to deploy conformance packs across member accounts, the operation can create Config rules and remediation actions without requiring `config:PutConfigRule` or `config:PutRemediationConfigurations` permissions in member account IAM policies.

        This API uses the `AWSServiceRoleForConfigConforms` service-linked role in each member account to create conformance pack resources. This service-linked role includes the permissions to create Config rules and remediation configurations, even if member account IAM policies explicitly deny these actions.

        This API enables organization service access for `config-multiaccountsetup.amazonaws.com` through the `EnableAWSServiceAccess` action and creates a service-linked role `AWSServiceRoleForConfigMultiAccountSetup` in the management or delegated administrator account of your organization. The service-linked role is created only when the role does not exist in the caller account. To use this API with delegated administrator, register a delegated administrator by calling Amazon Web Services Organization `register-delegate-admin` for `config-multiaccountsetup.amazonaws.com`.

        Prerequisite: Ensure you call `EnableAllFeatures` API to enable all features in an organization.

        You must specify either the `TemplateS3Uri` or the `TemplateBody` parameter, but not both. If you provide both Config uses the `TemplateS3Uri` parameter and ignores the `TemplateBody` parameter.

        Config sets the state of a conformance pack to CREATE\_IN\_PROGRESS and UPDATE\_IN\_PROGRESS until the conformance pack is created or updated. You cannot update a conformance pack while it is in this state.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        conformance-pack-input-parameters: A list of `ConformancePackInputParameter` objects.
        delivery-s3-bucket: |-
            The name of the Amazon S3 bucket where Config stores conformance pack templates.

            This field is optional. If used, it must be prefixed with `awsconfigconforms`.
        delivery-s3-key-prefix: |-
            The prefix for the Amazon S3 bucket.

            This field is optional.
        excluded-accounts: A list of Amazon Web Services accounts to be excluded from an organization conformance pack while deploying a conformance pack.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        organization-conformance-pack-name: Name of the organization conformance pack you want to create.
        template-body: A string that contains the full conformance pack template body. Structure containing the template body with a minimum length of 1 byte and a maximum length of 51,200 bytes.
        template-s3-uri: |-
            Location of file containing the template body. The uri must point to the conformance pack template (max size: 300 KB).

            You must have access to read Amazon S3 bucket. In addition, in order to ensure a successful deployment, the template object must not be in an [archived storage class](https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html) if this parameter is passed.
