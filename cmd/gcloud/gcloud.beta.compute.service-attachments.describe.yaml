    --region=: Region of the service attachment to describe.
    --show-nat-ips: Determines whether to include the NAT IPs of connected endpoints in the
documentation:
    command: '*(BETA)*  Display details about a Google Compute Engine service attachment.'
    flag:
        no-show-nat-ips: |-
            Determines whether to include the NAT IPs of connected endpoints in the
                    service attachment output. If enabled (--show-nat-ips), the output
                    will include the list of NAT IPs for each connected PSC endpoint and
                    any endpoints propagated from them.
        region: |-
            Region of the service attachment to describe. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        show-nat-ips: |-
            Determines whether to include the NAT IPs of connected endpoints in the
                    service attachment output. If enabled (--show-nat-ips), the output
                    will include the list of NAT IPs for each connected PSC endpoint and
                    any endpoints propagated from them.
