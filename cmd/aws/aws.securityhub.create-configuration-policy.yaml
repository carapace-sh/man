name: create-configuration-policy
description: Creates a configuration policy with the defined configuration.
flags:
    --configuration-policy=!: An object that defines how Security Hub is configured.
    --description=: The description of the configuration policy.
    --name=!: The name of the configuration policy.
    --tags=: User-defined tags associated with a configuration policy.
documentation:
    command: Creates a configuration policy with the defined configuration. Only the Security Hub delegated administrator can invoke this operation from the home Region.
    flag:
        configuration-policy: An object that defines how Security Hub is configured. It includes whether Security Hub is enabled or disabled, a list of enabled security standards, a list of enabled or disabled security controls, and a list of custom parameter values for specified controls. If you provide a list of security controls that are enabled in the configuration policy, Security Hub disables all other controls (including newly released controls). If you provide a list of security controls that are disabled in the configuration policy, Security Hub enables all other controls (including newly released controls).
        description: The description of the configuration policy.
        name: 'The name of the configuration policy. Alphanumeric characters and the following ASCII characters are permitted: `-, ., !, *, /`.'
        tags: User-defined tags associated with a configuration policy. For more information, see [Tagging Security Hub resources](https://docs.aws.amazon.com/securityhub/latest/userguide/tagging-resources.html) in the *Security Hub user guide*.
