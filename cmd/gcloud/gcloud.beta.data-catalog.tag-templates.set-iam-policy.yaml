name: set-iam-policy
description: '*(BETA)*  *(DEPRECATED)*  Set the IAM policy for a Data Catalog tag template.'
flags:
    --location=: Location of the tag template.
documentation:
    command: |4
        *(BETA)*  *(DEPRECATED)*  This command is deprecated. Please use `gcloud dataplex aspect-types` instead.

        Sets the IAM policy for the given Data Catalog tag template as
        defined in a JSON or YAML file.
    flag:
        location: |-
            Location of the tag template.
            +

            To set the `location` attribute:
            * provide the argument `tag_template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
