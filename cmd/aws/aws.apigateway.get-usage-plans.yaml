name: get-usage-plans
description: Gets all the usage plans of the caller's account.
flags:
    --key-id=: The identifier of the API key associated with the usage plans.
    --limit=: The maximum number of returned results per page.
    --position=: The current pagination position in the paged result set.
documentation:
    command: Gets all the usage plans of the caller's account.
    flag:
        key-id: The identifier of the API key associated with the usage plans.
        limit: The maximum number of returned results per page. The default value is 25 and the maximum value is 500.
        position: The current pagination position in the paged result set.
