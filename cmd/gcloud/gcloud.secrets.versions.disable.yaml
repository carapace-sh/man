name: disable
description: Disable the version of the provided secret.
flags:
    --etag=: Current entity tag (ETag) of the secret version.
    --location=!: ID of the location or fully qualified identifier for the location.
    --secret=: The secret of the version.
documentation:
    command: |-
        Disable the version of the provided secret. It can be re-enabled with
        `gcloud secrets versions enable`.

        ## EXAMPLES

        Disable version `123` of the secret named `my-secret`:

          $ gcloud secrets versions disable 123 --secret=my-secret

        Disable version `123` of the secret named `my-secret` using etag:

          $ gcloud secrets versions disable 123 --secret=my-secret --etag=123
    flag:
        etag: Current entity tag (ETag) of the secret version. If specified, the version is disabled only if the ETag provided matches the current version's ETag.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        secret: |-
            The secret of the version.
            +
            To set the `secret` attribute:
            * provide the argument `VERSION` on the command line with a fully specified name;
            * provide the argument `--secret` on the command line.
