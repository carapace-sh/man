name: retrieve-environment-info
description: Retrieves the compiled information from a [RequestEnvironmentInfo]() request.
flags:
    --environment-id=: The ID of the data's environment.
    --environment-name=: The name of the data's environment.
    --info-type=!: The type of information to retrieve.
completion:
    flag:
        info-type:
            - tail
            - bundle
documentation:
    command: |-
        Retrieves the compiled information from a [RequestEnvironmentInfo]() request.

        Related Topics

        - [RequestEnvironmentInfo]()
    flag:
        environment-id: |-
            The ID of the data's environment.

            If no such environment is found, returns an `InvalidParameterValue` error.

            Condition: You must specify either this or an EnvironmentName, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
        environment-name: |-
            The name of the data's environment.

            If no such environment is found, returns an `InvalidParameterValue` error.

            Condition: You must specify either this or an EnvironmentId, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
        info-type: The type of information to retrieve.
