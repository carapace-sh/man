name: list-subscription-requests
description: Lists Amazon DataZone subscription requests.
flags:
    --approver-project-id=: The identifier of the subscription request approver's project.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-identifier=!: The identifier of the Amazon DataZone domain.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of subscription requests to return in a single call to `ListSubscriptionRequests`.
    --next-token=: When the number of subscription requests is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of subscription requests, the response includes a pagination token named `NextToken`.
    --owning-project-id=: The identifier of the project for the subscription requests.
    --page-size=: The size of each page to get in the AWS service call.
    --sort-by=: Specifies the way to sort the results of this action.
    --sort-order=: Specifies the sort order for the results of this action.
    --starting-token=: A token to specify where to start paginating.
    --status=: Specifies the status of the subscription requests.
    --subscribed-listing-id=: The identifier of the subscribed listing.
completion:
    flag:
        sort-by:
            - CREATED_AT
            - UPDATED_AT
        sort-order:
            - ASCENDING
            - DESCENDING
        status:
            - PENDING
            - ACCEPTED
            - REJECTED
documentation:
    command: Lists Amazon DataZone subscription requests.
    flag:
        approver-project-id: The identifier of the subscription request approver's project.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-identifier: The identifier of the Amazon DataZone domain.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of subscription requests to return in a single call to `ListSubscriptionRequests`. When the number of subscription requests to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `ListSubscriptionRequests` to list the next set of subscription requests.
        next-token: When the number of subscription requests is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of subscription requests, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `ListSubscriptionRequests` to list the next set of subscription requests.
        owning-project-id: The identifier of the project for the subscription requests.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sort-by: Specifies the way to sort the results of this action.
        sort-order: Specifies the sort order for the results of this action.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status: |-
            Specifies the status of the subscription requests.

            This is not a required parameter, but if not specified, by default, Amazon DataZone returns only `PENDING` subscription requests.
        subscribed-listing-id: The identifier of the subscribed listing.
