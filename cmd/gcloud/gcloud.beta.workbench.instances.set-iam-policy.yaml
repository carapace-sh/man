name: set-iam-policy
description: '*(BETA)*  Sets the IAM policy for a workbench instance.'
flags:
    --location=: The location of the workbench instance.
documentation:
    command: |
        *(BETA)*  *gcloud beta workbench instances set-iam-policy* sets the IAM policy for a Notebook instance given an
        instance ID and a JSON or YAML file that describes the IAM policy.

        Note: Setting the IAM policy for an Instance replaces existing IAM bindings for
        that account.
    flag:
        location: |-
            The location of the workbench instance.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `notebooks/location`.
