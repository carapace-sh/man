name: list-connectors
description: Returns the list of all registered custom connectors in your Amazon Web Services account.
flags:
    --max-results=: Specifies the maximum number of items that should be returned in the result set.
    --next-token=: The pagination token for the next page of data.
documentation:
    command: Returns the list of all registered custom connectors in your Amazon Web Services account. This API lists only custom connectors registered in this account, not the Amazon Web Services authored connectors.
    flag:
        max-results: Specifies the maximum number of items that should be returned in the result set. The default for `maxResults` is 20 (for all paginated API operations).
        next-token: The pagination token for the next page of data.
