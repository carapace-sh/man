name: run
description: Execute a workflow and wait for the execution to complete.
flags:
    --call-log-level=: Level of call logging to apply during execution.
    --data=: JSON string with data that will be passed to the workflow as an argument.
    --disable-concurrency-quota-overflow-buffering: If set, the execution will not be backlogged when the concurrency quota is exhausted.
    --execution-history-level=: Level of execution history to apply during execution.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Cloud location for the workflow.
    --no-disable-concurrency-quota-overflow-buffering&: If set, the execution will not be backlogged when the concurrency quota is exhausted.
completion:
    flag:
        call-log-level:
            - log-all-calls
            - log-errors-only
            - log-none
            - none
        execution-history-level:
            - execution-history-basic
            - execution-history-detailed
            - none
documentation:
    command: Execute a workflow and wait for the execution to complete.
    flag:
        call-log-level: |-
            Level of call logging to apply during execution. _CALL_LOG_LEVEL_ must be one of:
            +
            *log-all-calls*::: Log all calls to subworkflows or library functions and their results.
            *log-errors-only*::: Log when a call is stopped due to an exception.
            *log-none*::: Perform no call logging.
            *none*::: No logging level specified.
            :::
            +
        data: JSON string with data that will be passed to the workflow as an argument.
        disable-concurrency-quota-overflow-buffering: If set, the execution will not be backlogged when the concurrency quota is exhausted. Backlogged executions start when the concurrency quota becomes available.
        execution-history-level: |-
            Level of execution history to apply during execution. _EXECUTION_HISTORY_LEVEL_ must be one of:
            +
            *execution-history-basic*::: Enable execution history basic feature.
            *execution-history-detailed*::: Enable execution history detailed feature.
            *none*::: No execution history level specified.
            :::
            +
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Cloud location for the workflow.  Alternatively, set the property [workflows/location].
            +
            To set the `location` attribute:
            * provide the argument `workflow` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `workflows/location`.
        no-disable-concurrency-quota-overflow-buffering: If set, the execution will not be backlogged when the concurrency quota is exhausted. Backlogged executions start when the concurrency quota becomes available.
