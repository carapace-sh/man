name: create-receipt-filter
description: Creates a new IP address filter.
flags:
    --filter=!: A data structure that describes the IP address filter to create, which consists of a name, an IP address range, and whether to allow or block mail from it.
documentation:
    command: |-
        Creates a new IP address filter.

        For information about setting up IP address filters, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/dg/receiving-email-ip-filtering-console-walkthrough.html).

        You can execute this operation no more than once per second.
    flag:
        filter: A data structure that describes the IP address filter to create, which consists of a name, an IP address range, and whether to allow or block mail from it.
