name: create-group
description: Creates a resource group with the specified name and description.
flags:
    --configuration=: A configuration associates the resource group with an Amazon Web Services service and specifies how the service can interact with the resources in the group.
    --criticality=: The critical rank of the application group on a scale of 1 to 10, with a rank of 1 being the most critical, and a rank of 10 being least critical.
    --description=: The description of the resource group.
    --display-name=: The name of the application group, which you can change at any time.
    --name=!: The name of the group, which is the identifier of the group in other operations.
    --owner=: A name, email address or other identifier for the person or group who is considered as the owner of this application group within your organization.
    --resource-query=: The resource query that determines which Amazon Web Services resources are members of this group.
    --tags=: The tags to add to the group.
documentation:
    command: |-
        Creates a resource group with the specified name and description. You can optionally include either a resource query or a service configuration. For more information about constructing a resource query, see [Build queries and groups in Resource Groups](https://docs.aws.amazon.com/ARG/latest/userguide/getting_started-query.html) in the *Resource Groups User Guide*. For more information about service-linked groups and service configurations, see [Service configurations for Resource Groups](https://docs.aws.amazon.com/ARG/latest/APIReference/about-slg.html).

        **Minimum permissions**

        To run this command, you must have the following permissions:

        - `resource-groups:CreateGroup`
    flag:
        configuration: |-
            A configuration associates the resource group with an Amazon Web Services service and specifies how the service can interact with the resources in the group. A configuration is an array of [GroupConfigurationItem]() elements. For details about the syntax of service configurations, see [Service configurations for Resource Groups](https://docs.aws.amazon.com/ARG/latest/APIReference/about-slg.html).

            A resource group can contain either a `Configuration` or a `ResourceQuery`, but not both.
        criticality: The critical rank of the application group on a scale of 1 to 10, with a rank of 1 being the most critical, and a rank of 10 being least critical.
        description: The description of the resource group. Descriptions can consist of letters, numbers, hyphens, underscores, periods, and spaces.
        display-name: The name of the application group, which you can change at any time.
        name: The name of the group, which is the identifier of the group in other operations. You can't change the name of a resource group after you create it. A resource group name can consist of letters, numbers, hyphens, periods, and underscores. The name cannot start with `AWS`, `aws`, or any other possible capitalization; these are reserved. A resource group name must be unique within each Amazon Web Services Region in your Amazon Web Services account.
        owner: A name, email address or other identifier for the person or group who is considered as the owner of this application group within your organization.
        resource-query: |-
            The resource query that determines which Amazon Web Services resources are members of this group. For more information about resource queries, see [Create a tag-based group in Resource Groups](https://docs.aws.amazon.com/ARG/latest/userguide/gettingstarted-query.html#gettingstarted-query-cli-tag).

            A resource group can contain either a `ResourceQuery` or a `Configuration`, but not both.
        tags: The tags to add to the group. A tag is key-value pair string.
