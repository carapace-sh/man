name: describe
description: '*(ALPHA)*  Describe a reCAPTCHA key''s policy.'
hidden: true
flags:
    --key=!: ID of the key or fully qualified identifier for the key.
documentation:
    command: |-
        ## EXAMPLES

        To describe a policy for a reCAPTCHA key:

            $ gcloud alpha recaptcha policies describe --key=test-key

        See [https://cloud.google.com/sdk/gcloud/reference/recaptcha/keys] for more
        details for recaptcha keys.
    flag:
        key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `key` attribute:
            * provide the argument `--key` on the command line.
