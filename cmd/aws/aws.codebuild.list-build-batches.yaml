name: list-build-batches
description: Retrieves the identifiers of your build batches in the current region.
flags:
    --filter=: A `BuildBatchFilter` object that specifies the filters for the search.
    --max-results=: The maximum number of results to return.
    --next-token=: The `nextToken` value returned from a previous call to `ListBuildBatches`.
    --sort-order=: Specifies the sort order of the returned items.
completion:
    flag:
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Retrieves the identifiers of your build batches in the current region.
    flag:
        filter: A `BuildBatchFilter` object that specifies the filters for the search.
        max-results: The maximum number of results to return.
        next-token: The `nextToken` value returned from a previous call to `ListBuildBatches`. This specifies the next item to return. To return the beginning of the list, exclude this parameter.
        sort-order: |-
            Specifies the sort order of the returned items. Valid values include:

            - `ASCENDING`: List the batch build identifiers in ascending order by identifier.
            - `DESCENDING`: List the batch build identifiers in descending order by identifier.
