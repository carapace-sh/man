name: cancel
description: '*(BETA)*  Cancel a long running operation.'
flags:
    --billing-account=: Billing account of the operation to cancel.
    --folder=: Folder of the operation to cancel.
    --location=!: Location of the operation.
    --organization=: Organization of the operation to cancel.
documentation:
    command: |-
        *(BETA)*  Cancel a long running operation with given OPERATION_ID in given LOCATION.
        This operation can be a copy_log_entries operation which is scheduled before.

        ## EXAMPLES

        To cancel an operation, run:

          $ gcloud beta logging operations cancel OPERATION_ID --location=LOCATION
    flag:
        billing-account: Billing account of the operation to cancel.
        folder: Folder of the operation to cancel.
        location: Location of the operation.
        organization: Organization of the operation to cancel.
