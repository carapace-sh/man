name: update-identity-propagation-config
description: Adds or updates services and authorized targets to configure what the Quick Sight IAM Identity Center application can access.
flags:
    --authorized-targets=:
        description: Specifies a list of application ARNs that represent the authorized targets for a service.
        nargs: -1
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the identity propagation configuration that you want to update.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --service=!: The name of the Amazon Web Services service that contains the authorized targets that you want to add or update.
completion:
    flag:
        service:
            - REDSHIFT
            - QBUSINESS
            - ATHENA
documentation:
    command: |-
        Adds or updates services and authorized targets to configure what the Quick Sight IAM Identity Center application can access.

        This operation is only supported for Quick Sight accounts using IAM Identity Center
    flag:
        authorized-targets: Specifies a list of application ARNs that represent the authorized targets for a service.
        aws-account-id: The ID of the Amazon Web Services account that contains the identity propagation configuration that you want to update.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        service: The name of the Amazon Web Services service that contains the authorized targets that you want to add or update.
