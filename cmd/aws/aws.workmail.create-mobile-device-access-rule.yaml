name: create-mobile-device-access-rule
description: Creates a new mobile device access rule for the specified WorkMail organization.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The idempotency token for the client request.
    --description=: The rule description.
    --device-models=:
        description: Device models that the rule will match.
        nargs: -1
    --device-operating-systems=:
        description: Device operating systems that the rule will match.
        nargs: -1
    --device-types=:
        description: Device types that the rule will match.
        nargs: -1
    --device-user-agents=:
        description: Device user agents that the rule will match.
        nargs: -1
    --effect=!: The effect of the rule when it matches.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The rule name.
    --not-device-models=:
        description: Device models that the rule **will not** match.
        nargs: -1
    --not-device-operating-systems=:
        description: Device operating systems that the rule **will not** match.
        nargs: -1
    --not-device-types=:
        description: Device types that the rule **will not** match.
        nargs: -1
    --not-device-user-agents=:
        description: Device user agents that the rule **will not** match.
        nargs: -1
    --organization-id=!: The WorkMail organization under which the rule will be created.
completion:
    flag:
        effect:
            - ALLOW
            - DENY
documentation:
    command: Creates a new mobile device access rule for the specified WorkMail organization.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The idempotency token for the client request.
        description: The rule description.
        device-models: Device models that the rule will match.
        device-operating-systems: Device operating systems that the rule will match.
        device-types: Device types that the rule will match.
        device-user-agents: Device user agents that the rule will match.
        effect: The effect of the rule when it matches. Allowed values are `ALLOW` or `DENY`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The rule name.
        not-device-models: Device models that the rule **will not** match. All other device models will match.
        not-device-operating-systems: Device operating systems that the rule **will not** match. All other device operating systems will match.
        not-device-types: Device types that the rule **will not** match. All other device types will match.
        not-device-user-agents: Device user agents that the rule **will not** match. All other device user agents will match.
        organization-id: The WorkMail organization under which the rule will be created.
