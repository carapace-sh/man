name: add-override
description: '*(BETA)*  Add overrides to Threat Prevention Profile.'
flags:
    --action=!: Action associated with antivirus, severity, or threat-id.
    --antivirus=: List of comma-separated protocols where each value in the list indicates the protocol of the antivirus threat.
    --async: Return immediately, without waiting for the operation in progress to
    --clear-labels: Remove all labels.
    --location=: location of the security_profile - Global.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Remove all labels.
    --organization=: Organization ID to which the changes should apply.
    --remove-labels=: List of label keys to remove.
    --severities=: List of comma-separated severities where each value in the list indicates the severity of the threat.
    --threat-ids=: List of comma-separated threat identifiers where each identifier in the list is a vendor-specified Signature ID representing a threat type.
    --update-labels=: List of label KEY=VALUE pairs to update.
completion:
    flag:
        action:
            - DEFAULT_ACTION
            - ALLOW
            - ALERT
            - DENY
documentation:
    command: |+
        *(BETA)*  Add antivirus, severities, or threat-ids to existing
        threat prevention profile with intended action on each specified.
        Check the updates of add-override command by using `gcloud network-security
        security-profiles threat-prevention list-override my-security-profile`.

        For more examples, refer to the EXAMPLES section below.

    flag:
        action: 'Action associated with antivirus, severity, or threat-id. _ACTION_ must be one of: *DEFAULT_ACTION*, *ALLOW*, *ALERT*, *DENY*.'
        antivirus: List of comma-separated protocols where each value in the list indicates the protocol of the antivirus threat.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *False*.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        location: |-
            location of the security_profile - Global.
            +
            To set the `location` attribute:
            * provide the argument `security_profile` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        organization: |-
            Organization ID to which the changes should apply.
            +
            To set the `organization` attribute:
            * provide the argument `security_profile` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        severities: List of comma-separated severities where each value in the list indicates the severity of the threat.
        threat-ids: List of comma-separated threat identifiers where each identifier in the list is a vendor-specified Signature ID representing a threat type.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
