name: remove
description: '*(ALPHA)*  Remove a public key from an Attestor.'
flags:
    --attestor=!: ID of the attestor or fully qualified identifier for the attestor.
documentation:
    command: |-
        ## EXAMPLES

        To remove a public key from the Attestor `my_attestor`:

          $ gcloud alpha container binauthz attestors public-keys remove 0638AADD940361EA2D7F14C58C124F0E663DA097 \
              --attestor=my_attestor
    flag:
        attestor: |-
            ID of the attestor or fully qualified identifier for the attestor.
            +
            To set the `name` attribute:
            * provide the argument `--attestor` on the command line.
