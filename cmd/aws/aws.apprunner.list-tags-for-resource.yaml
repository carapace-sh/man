name: list-tags-for-resource
description: List tags that are associated with for an App Runner resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource that a tag list is requested for.
documentation:
    command: List tags that are associated with for an App Runner resource. The response contains a list of tag key-value pairs.
    flag:
        resource-arn: |-
            The Amazon Resource Name (ARN) of the resource that a tag list is requested for.

            It must be the ARN of an App Runner resource.
