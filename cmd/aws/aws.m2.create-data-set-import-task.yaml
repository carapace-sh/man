name: create-data-set-import-task
description: Starts a data set import task for a specific application.
flags:
    --application-id=!: The unique identifier of the application for which you want to import data sets.
    --client-token=: Unique, case-sensitive identifier you provide to ensure the idempotency of the request to create a data set import.
    --import-config=!: The data set import task configuration.
documentation:
    command: Starts a data set import task for a specific application.
    flag:
        application-id: The unique identifier of the application for which you want to import data sets.
        client-token: Unique, case-sensitive identifier you provide to ensure the idempotency of the request to create a data set import. The service generates the clientToken when the API call is triggered. The token expires after one hour, so if you retry the API within this timeframe with the same clientToken, you will get the same response. The service also handles deleting the clientToken after it expires.
        import-config: The data set import task configuration.
