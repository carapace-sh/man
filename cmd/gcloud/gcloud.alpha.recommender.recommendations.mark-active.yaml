name: mark-active
description: '*(ALPHA)*  Mark Active operations for a recommendation.'
flags:
    --billing-account=: The Google Cloud Platform billing account ID to use for this invocation.
    --etag=!: Etag of the recommendation
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --location=!: Location
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --recommender=!: Recommender of the recommendations
documentation:
    command: |-
        *(ALPHA)*  Mark a recommendation's state as ACTIVE. Can be applied to recommendations
        in DISMISSED state. This currently supports the following parent entities:
        project, billing account, folder, and organization.

        ## EXAMPLES
        To mark a recommenation as ACTIVE:

         $ gcloud alpha recommender recommendations mark-active RECOMMENDATION_ID --project=${PROJECT} --location=${LOCATION}
         --recommender=${RECOMMENDER} --etag=etag
    flag:
        billing-account: The Google Cloud Platform billing account ID to use for this invocation.
        etag: Etag of the recommendation
        folder: The Google Cloud Platform folder ID to use for this invocation.
        location: Location
        organization: The Google Cloud Platform organization ID to use for this invocation.
        recommender: Recommender of the recommendations
