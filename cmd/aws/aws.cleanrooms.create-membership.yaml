name: create-membership
description: Creates a membership for a specific collaboration identifier and joins the collaboration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --collaboration-identifier=!: The unique ID for the associated collaboration.
    --default-job-result-configuration=: The default job result configuration that determines how job results are protected and managed within this membership.
    --default-result-configuration=: The default protected query result configuration as specified by the member who can receive results.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-log-status=: An indicator as to whether job logging has been enabled or disabled for the collaboration.
    --payment-configuration=: The payment responsibilities accepted by the collaboration member.
    --query-log-status=!: An indicator as to whether query logging has been enabled or disabled for the membership.
    --tags=: An optional label that you can assign to a resource when you create it.
completion:
    flag:
        job-log-status:
            - ENABLED
            - DISABLED
        query-log-status:
            - ENABLED
            - DISABLED
documentation:
    command: Creates a membership for a specific collaboration identifier and joins the collaboration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        collaboration-identifier: The unique ID for the associated collaboration.
        default-job-result-configuration: The default job result configuration that determines how job results are protected and managed within this membership. This configuration applies to all jobs.
        default-result-configuration: The default protected query result configuration as specified by the member who can receive results.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-log-status: |-
            An indicator as to whether job logging has been enabled or disabled for the collaboration.

            When `ENABLED`, Clean Rooms logs details about jobs run within this collaboration and those logs can be viewed in Amazon CloudWatch Logs. The default value is `DISABLED`.
        payment-configuration: |-
            The payment responsibilities accepted by the collaboration member.

            Not required if the collaboration member has the member ability to run queries.

            Required if the collaboration member doesn't have the member ability to run queries but is configured as a payer by the collaboration creator.
        query-log-status: |-
            An indicator as to whether query logging has been enabled or disabled for the membership.

            When `ENABLED`, Clean Rooms logs details about queries run within this collaboration and those logs can be viewed in Amazon CloudWatch Logs. The default value is `DISABLED`.
        tags: An optional label that you can assign to a resource when you create it. Each tag consists of a key and an optional value, both of which you define. When you use tagging, you can also use tag-based access control in IAM policies to control access to this resource.
