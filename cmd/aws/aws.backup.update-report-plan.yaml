name: update-report-plan
description: Updates the specified report plan.
flags:
    --idempotency-token=: A customer-chosen string that you can use to distinguish between otherwise identical calls to `UpdateReportPlanInput`.
    --report-delivery-channel=: The information about where to deliver your reports, specifically your Amazon S3 bucket name, S3 key prefix, and the formats of your reports.
    --report-plan-description=: An optional description of the report plan with a maximum 1,024 characters.
    --report-plan-name=!: The unique name of the report plan.
    --report-setting=: The report template for the report.
documentation:
    command: Updates the specified report plan.
    flag:
        idempotency-token: A customer-chosen string that you can use to distinguish between otherwise identical calls to `UpdateReportPlanInput`. Retrying a successful request with the same idempotency token results in a success message with no action taken.
        report-delivery-channel: The information about where to deliver your reports, specifically your Amazon S3 bucket name, S3 key prefix, and the formats of your reports.
        report-plan-description: An optional description of the report plan with a maximum 1,024 characters.
        report-plan-name: The unique name of the report plan. This name is between 1 and 256 characters, starting with a letter, and consisting of letters (a-z, A-Z), numbers (0-9), and underscores (\_).
        report-setting: |-
            The report template for the report. Reports are built using a report template. The report templates are:

            `RESOURCE_COMPLIANCE_REPORT | CONTROL_COMPLIANCE_REPORT | BACKUP_JOB_REPORT | COPY_JOB_REPORT | RESTORE_JOB_REPORT`

            If the report template is `RESOURCE_COMPLIANCE_REPORT` or `CONTROL_COMPLIANCE_REPORT`, this API resource also describes the report coverage by Amazon Web Services Regions and frameworks.
