name: retrieve
description: Queries a knowledge base and retrieves information from it.
flags:
    --guardrail-configuration=: Guardrail settings.
    --knowledge-base-id=!: The unique identifier of the knowledge base to query.
    --next-token=: If there are more results than can fit in the response, the response returns a `nextToken`.
    --retrieval-configuration=: Contains configurations for the knowledge base query and retrieval process.
    --retrieval-query=!: Contains the query to send the knowledge base.
documentation:
    command: Queries a knowledge base and retrieves information from it.
    flag:
        guardrail-configuration: Guardrail settings.
        knowledge-base-id: The unique identifier of the knowledge base to query.
        next-token: If there are more results than can fit in the response, the response returns a `nextToken`. Use this token in the `nextToken` field of another request to retrieve the next batch of results.
        retrieval-configuration: Contains configurations for the knowledge base query and retrieval process. For more information, see [Query configurations](https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html).
        retrieval-query: Contains the query to send the knowledge base.
