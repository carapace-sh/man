name: create
description: '*(BETA)*  *(REMOVED)*  Create an RBAC RoleBinding.'
hidden: true
flags:
    --group=: Group for the RoleBinding.
    --location=: Location for the rbacrolebinding.
    --namespace=: Name of the rbacrolebinding.
    --role=!: Role to assign.
    --user=: User for the RoleBinding.
completion:
    flag:
        role:
            - admin
            - edit
            - view
documentation:
    command: |-
        *(BETA)*  *(REMOVED)*  Create an RBAC RoleBinding.

        This command has been removed as of version 447.0.0. Use `gcloud fleet scopes rbacrolebindings create` instead.

        This command can fail for the following reasons:
        * The RBAC RoleBinding already exists.
        * The caller does not have permission to access the given namespace.

        ## EXAMPLES

        To create an admin RBAC RoleBinding `RBRB` in namespace `NAMESPACE` for user
        `person@google.com`, run:

          $ gcloud beta container hub namespaces rbacrolebindings create RBRB --namespace=NAMESPACE --role=admin
          --user=person@google.com

        To create a viewer RBAC RoleBinding `RBRB` in namespace `NAMESPACE` for group
        `people@google.com`, run:

          $ gcloud beta container hub namespaces rbacrolebindings create RBRB --namespace=NAMESPACE --role=viewer
          --group=people@google.com
    flag:
        group: Group for the RoleBinding.
        location: |-
            Location for the rbacrolebinding.
            +
            To set the `location` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        namespace: |-
            Name of the rbacrolebinding.
            +
            To set the `namespace` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--namespace` on the command line.
        role: 'Role to assign. _ROLE_ must be one of: *admin*, *edit*, *view*.'
        user: User for the RoleBinding.
