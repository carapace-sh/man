name: set-iam-policy
description: Set the IAM policy for a certificate template.
flags:
    --location=: The location of the Certificate Template.
documentation:
    command: |
        Sets the IAM policy for the given certificate template as defined in a JSON or YAML file.

        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.
    flag:
        location: |-
            The location of the Certificate Template.
            +
            To set the `location` attribute:
            * provide the argument `certificate_template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `privateca/location`.
