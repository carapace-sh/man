name: list-distributions-by-web-aclid
description: List the distributions that are associated with a specified WAF web ACL.
flags:
    --marker=: Use `Marker` and `MaxItems` to control pagination of results.
    --max-items=: The maximum number of distributions that you want CloudFront to return in the response body.
    --web-aclid=!: The ID of the WAF web ACL that you want to list the associated distributions.
documentation:
    command: List the distributions that are associated with a specified WAF web ACL.
    flag:
        marker: Use `Marker` and `MaxItems` to control pagination of results. If you have more than `MaxItems` distributions that satisfy the request, the response includes a `NextMarker` element. To get the next page of results, submit another request. For the value of `Marker`, specify the value of `NextMarker` from the last response. (For the first request, omit `Marker`.)
        max-items: The maximum number of distributions that you want CloudFront to return in the response body. The maximum and default values are both 100.
        web-aclid: |-
            The ID of the WAF web ACL that you want to list the associated distributions. If you specify "null" for the ID, the request returns a list of the distributions that aren't associated with a web ACL.

            For WAFV2, this is the ARN of the web ACL, such as `arn:aws:wafv2:us-east-1:123456789012:global/webacl/ExampleWebACL/a1b2c3d4-5678-90ab-cdef-EXAMPLE11111`.

            For WAF Classic, this is the ID of the web ACL, such as `a1b2c3d4-5678-90ab-cdef-EXAMPLE11111`.
