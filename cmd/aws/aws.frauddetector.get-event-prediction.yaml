name: get-event-prediction
description: Evaluates an event against a detector version.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --detector-id=!: The detector ID.
    --detector-version-id=: The detector version ID.
    --entities=!:
        description: The entity type (associated with the detector's event type) and specific entity ID representing who performed the event.
        nargs: -1
    --event-id=!: The unique ID used to identify the event.
    --event-timestamp=!: Timestamp that defines when the event under evaluation occurred.
    --event-type-name=!: The event type associated with the detector specified for the prediction.
    --event-variables=!: Names of the event type's variables you defined in Amazon Fraud Detector to represent data elements and their corresponding values for the event you are sending for evaluation.
    --external-model-endpoint-data-blobs=: The Amazon SageMaker model endpoint input data blobs.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: Evaluates an event against a detector version. If a version ID is not provided, the detector’s (`ACTIVE`) version is used.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        detector-id: The detector ID.
        detector-version-id: The detector version ID.
        entities: The entity type (associated with the detector's event type) and specific entity ID representing who performed the event. If an entity id is not available, use "UNKNOWN."
        event-id: The unique ID used to identify the event.
        event-timestamp: Timestamp that defines when the event under evaluation occurred. The timestamp must be specified using ISO 8601 standard in UTC.
        event-type-name: The event type associated with the detector specified for the prediction.
        event-variables: |-
            Names of the event type's variables you defined in Amazon Fraud Detector to represent data elements and their corresponding values for the event you are sending for evaluation.

            You must provide at least one eventVariable

            To ensure most accurate fraud prediction and to simplify your data preparation, Amazon Fraud Detector will replace all missing variables or values as follows:

            **For Amazon Fraud Detector trained models:**

            If a null value is provided explicitly for a variable or if a variable is missing, model will replace the null value or the missing variable (no variable name in the eventVariables map) with calculated default mean/medians for numeric variables and with special values for categorical variables.

            **For imported SageMaker models:**

            If a null value is provided explicitly for a variable, the model and rules will use “null” as the value. If a variable is not provided (no variable name in the eventVariables map), model and rules will use the default value that is provided for the variable.
        external-model-endpoint-data-blobs: The Amazon SageMaker model endpoint input data blobs.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
