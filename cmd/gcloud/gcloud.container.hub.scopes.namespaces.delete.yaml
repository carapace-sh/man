name: delete
description: Delete a fleet namespace.
flags:
    --scope=: the
documentation:
    command: |-
        This command can fail for the following reasons:
        * The project specified does not exist.
        * The namespace specified does not exist.
        * The caller does not have permission to access the given project or
        namespace.

        ## EXAMPLES

        To delete fleet namespace `NAMESPACE` in the active project:

          $ gcloud container hub scopes namespaces delete NAMESPACE

        To delete fleet namespace `NAMESPACE` in project `PROJECT_ID`:

          $ gcloud container hub scopes namespaces delete NAMESPACE --project=PROJECT_ID
    flag:
        scope: |-
            the
            +
            To set the `scope` attribute:
            * provide the argument `NAMESPACE` on the command line with a fully specified name;
            * provide the argument `--scope` on the command line.
