name: restore
description: '*(ALPHA)*  Restore a domain from the specified backup.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup=!: Name of the domain backup from which you want to restore the Managed Microsoft AD domain.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Restore a Managed Microsoft AD domain to a previous point in time when the
        backup was taken.

        This command can fail for the following reasons:
          * The specified domain doesn't exist.
          * The specified backup doesn't exist.
          * The active account doesn't have permission to restore the specified domain.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup: Name of the domain backup from which you want to restore the Managed Microsoft AD domain.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
