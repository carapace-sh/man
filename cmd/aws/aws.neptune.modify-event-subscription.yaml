name: modify-event-subscription
description: Modifies an existing event notification subscription.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enabled: A Boolean value; set to **true** to activate the subscription.
    --event-categories=: A list of event categories for a SourceType that you want to subscribe to.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enabled: A Boolean value; set to **true** to activate the subscription.
    --sns-topic-arn=: The Amazon Resource Name (ARN) of the SNS topic created for event notification.
    --source-type=: The type of source that is generating the events.
    --subscription-name=!: The name of the event notification subscription.
documentation:
    command: |-
        Modifies an existing event notification subscription. Note that you can't modify the source identifiers using this call; to change source identifiers for a subscription, use the [AddSourceIdentifierToSubscription]() and [RemoveSourceIdentifierFromSubscription]() calls.

        You can see a list of the event categories for a given SourceType by using the **DescribeEventCategories** action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enabled: A Boolean value; set to **true** to activate the subscription.
        event-categories: A list of event categories for a SourceType that you want to subscribe to. You can see a list of the categories for a given SourceType by using the **DescribeEventCategories** action.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        sns-topic-arn: The Amazon Resource Name (ARN) of the SNS topic created for event notification. The ARN is created by Amazon SNS when you create a topic and subscribe to it.
        source-type: |-
            The type of source that is generating the events. For example, if you want to be notified of events generated by a DB instance, you would set this parameter to db-instance. if this value is not specified, all events are returned.

            Valid values: db-instance | db-parameter-group | db-security-group | db-snapshot
        subscription-name: The name of the event notification subscription.
