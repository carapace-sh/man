name: list-streams
description: Returns an array of `StreamInfo` objects.
flags:
    --max-results=: The maximum number of streams to return in the response.
    --next-token=: If you specify this parameter, when the result of a `ListStreams` operation is truncated, the call returns the `NextToken` in the response.
    --stream-name-condition=: 'Optional: Returns only streams that satisfy a specific condition.'
documentation:
    command: Returns an array of `StreamInfo` objects. Each object describes a stream. To retrieve only streams that satisfy a specific condition, you can specify a `StreamNameCondition`.
    flag:
        max-results: The maximum number of streams to return in the response. The default is 10,000.
        next-token: If you specify this parameter, when the result of a `ListStreams` operation is truncated, the call returns the `NextToken` in the response. To get another batch of streams, provide this token in your next request.
        stream-name-condition: 'Optional: Returns only streams that satisfy a specific condition. Currently, you can specify only the prefix of a stream name as a condition.'
