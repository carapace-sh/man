name: deploy
description: '*(ALPHA)*  Deploy a model in Model Garden to a Vertex AI endpoint.'
flags:
    --accelerator-count=: The accelerator count to serve the model.
    --accelerator-type=: The accelerator type to serve the model.
    --accept-eula: When set, the user accepts the End User License Agreement (EULA) of the model.
    --asynchronous: If set to true, the command will terminate immediately and not keep polling the operation status.
    --container-args=: Comma-separated arguments passed to the command run by the container
    --container-command=: Entrypoint for the container image.
    --container-deployment-timeout-seconds=: Deployment timeout in seconds.
    --container-env-vars=: List of key-value pairs to set as environment variables.
    --container-grpc-ports=: Container ports to receive grpc requests at.
    --container-health-probe-exec=: Exec specifies the action to take.
    --container-health-probe-period-seconds=: How often (in seconds) to perform the health probe.
    --container-health-probe-timeout-seconds=: Number of seconds after which the health probe times out.
    --container-health-route=: HTTP path to send health checks to inside the container.
    --container-image-uri=: URI of the Model serving container file in the Container Registry
    --container-ports=: Container ports to receive http requests at.
    --container-predict-route=: HTTP path to send prediction requests to inside the container.
    --container-shared-memory-size-mb=: The amount of the VM memory to reserve as the shared memory for the model in
    --container-startup-probe-exec=: Exec specifies the action to take.
    --container-startup-probe-period-seconds=: How often (in seconds) to perform the startup probe.
    --container-startup-probe-timeout-seconds=: Number of seconds after which the startup probe times out.
    --enable-fast-tryout: If True, model will be deployed using faster deployment path.
    --endpoint-display-name=: Display name of the endpoint with the deployed model.
    --hugging-face-access-token=: The access token from Hugging Face needed to read the model artifacts of gated models.
    --machine-type=: The machine type to deploy the model to.
    --model=!: The model to be deployed.
    --no-accept-eula&: When set, the user accepts the End User License Agreement (EULA) of the model.
    --no-asynchronous&: If set to true, the command will terminate immediately and not keep polling the operation status.
    --no-enable-fast-tryout&: If True, model will be deployed using faster deployment path.
    --no-spot&: If true, schedule the deployment workload on Spot VM.
    --no-use-dedicated-endpoint&: If true, the endpoint will be exposed through a dedicated DNS.
    --region=: ID of the region or fully qualified identifier for the region.
    --reservation-affinity=: A ReservationAffinity can be used to configure a Vertex AI resource (e.g., a DeployedModel) to draw its Compute Engine resources from a Shared Reservation, or exclusively from on-demand capacity.
    --spot: If true, schedule the deployment workload on Spot VM.
    --use-dedicated-endpoint: If true, the endpoint will be exposed through a dedicated DNS.
documentation:
    command: |-
        ## EXAMPLES

        To deploy a Model Garden model `google/gemma2/gemma2-9b` under project
        `example` in region
        `us-central1`, run:

          $ gcloud ai model-garden models deploy
          --model=google/gemma2@gemma-2-9b
          --project=example
          --region=us-central1

        To deploy a Hugging Face model `meta-llama/Meta-Llama-3-8B` under project
        `example` in region `us-central1`, run:

          $ gcloud ai model-garden models deploy
          --model=meta-llama/Meta-Llama-3-8B
          --hugging-face-access-token={hf_token}
          --project=example
          --region=us-central1
    flag:
        accelerator-count: The accelerator count to serve the model. Accelerator count should be non-negative.
        accelerator-type: The accelerator type to serve the model. It should be a supported accelerator type from the verified deployment configurations of the model. Use `gcloud ai model-garden models list-deployment-config` to check the supported accelerator types.
        accept-eula: When set, the user accepts the End User License Agreement (EULA) of the model.
        asynchronous: If set to true, the command will terminate immediately and not keep polling the operation status.
        container-args: |-
            Comma-separated arguments passed to the command run by the container
            image. If not specified and no `--command` is provided, the container
            image's default command is used.
        container-command: |-
            Entrypoint for the container image. If not specified, the container
            image's default entrypoint is run.
        container-deployment-timeout-seconds: Deployment timeout in seconds.
        container-env-vars: List of key-value pairs to set as environment variables.
        container-grpc-ports: |-
            Container ports to receive grpc requests at. Must be a number between 1 and
            65535, inclusive.
        container-health-probe-exec: |-
            Exec specifies the action to take. Used by health probe. An example of this
            argument would be ["cat", "/tmp/healthy"].
        container-health-probe-period-seconds: |-
            How often (in seconds) to perform the health probe. Default to 10 seconds.
            Minimum value is 1.
        container-health-probe-timeout-seconds: |-
            Number of seconds after which the health probe times out. Defaults to 1 second.
            Minimum value is 1.
        container-health-route: HTTP path to send health checks to inside the container.
        container-image-uri: |-
            URI of the Model serving container file in the Container Registry
            (e.g. gcr.io/myproject/server:latest).
        container-ports: |-
            Container ports to receive http requests at. Must be a number between 1 and
            65535, inclusive.
        container-predict-route: HTTP path to send prediction requests to inside the container.
        container-shared-memory-size-mb: |-
            The amount of the VM memory to reserve as the shared memory for the model in
            megabytes.
        container-startup-probe-exec: |-
            Exec specifies the action to take. Used by startup probe. An example of this
            argument would be ["cat", "/tmp/healthy"].
        container-startup-probe-period-seconds: |-
            How often (in seconds) to perform the startup probe. Default to 10 seconds.
            Minimum value is 1.
        container-startup-probe-timeout-seconds: |-
            Number of seconds after which the startup probe times out. Defaults to 1 second.
            Minimum value is 1.
        enable-fast-tryout: If True, model will be deployed using faster deployment path. Useful for quick experiments. Not for production workloads. Only available for most popular models with certain machine types.
        endpoint-display-name: Display name of the endpoint with the deployed model.
        hugging-face-access-token: The access token from Hugging Face needed to read the model artifacts of gated models. It is only needed when the Hugging Face model to deploy is gated.
        machine-type: The machine type to deploy the model to. It should be a supported machine type from the deployment configurations of the model. Use `gcloud ai model-garden models list-deployment-config` to check the supported machine types.
        model: The model to be deployed. If it is a Model Garden model, it should be in the format of `{publisher_name}/{model_name}@{model_version_name}, e.g. `google/gemma2@gemma-2-2b`. If it is a Hugging Face model, it should be in the convention of Hugging Face models, e.g. `meta-llama/Meta-Llama-3-8B`. If it is a Custom Weights model, it should be in the format of `gs://{gcs_bucket_uri}`, e.g. `gs://-model-garden-public-us/llama3.1/Meta-Llama-3.1-8B-Instruct`.
        no-accept-eula: When set, the user accepts the End User License Agreement (EULA) of the model.
        no-asynchronous: If set to true, the command will terminate immediately and not keep polling the operation status.
        no-enable-fast-tryout: If True, model will be deployed using faster deployment path. Useful for quick experiments. Not for production workloads. Only available for most popular models with certain machine types.
        no-spot: If true, schedule the deployment workload on Spot VM.
        no-use-dedicated-endpoint: If true, the endpoint will be exposed through a dedicated DNS. Your request to the dedicated DNS will be isolated from other users' traffic and will have better performance and reliability.
        region: |-
            ID of the region or fully qualified identifier for the region.
            +
            To set the `region` attribute:
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
        reservation-affinity: A ReservationAffinity can be used to configure a Vertex AI resource (e.g., a DeployedModel) to draw its Compute Engine resources from a Shared Reservation, or exclusively from on-demand capacity.
        spot: If true, schedule the deployment workload on Spot VM.
        use-dedicated-endpoint: If true, the endpoint will be exposed through a dedicated DNS. Your request to the dedicated DNS will be isolated from other users' traffic and will have better performance and reliability.
