name: create-private-graph-endpoint
description: Create a private graph endpoint to allow private access from to the graph from within a VPC.
flags:
    --graph-identifier=!: The unique identifier of the Neptune Analytics graph.
    --subnet-ids=: Subnets in which private graph endpoint ENIs are created.
    --vpc-id=: The VPC in which the private graph endpoint needs to be created.
    --vpc-security-group-ids=: Security groups to be attached to the private graph endpoint..
documentation:
    command: |-
        Create a private graph endpoint to allow private access from to the graph from within a VPC. You can attach security groups to the private graph endpoint.

        VPC endpoint charges apply.
    flag:
        graph-identifier: The unique identifier of the Neptune Analytics graph.
        subnet-ids: Subnets in which private graph endpoint ENIs are created.
        vpc-id: The VPC in which the private graph endpoint needs to be created.
        vpc-security-group-ids: Security groups to be attached to the private graph endpoint..
