name: modify-migration-project
description: Modifies the specified migration project using the provided parameters.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A user-friendly description of the migration project.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-profile-identifier=: The name or Amazon Resource Name (ARN) for the instance profile.
    --migration-project-identifier=!: The identifier of the migration project.
    --migration-project-name=: A user-friendly name for the migration project.
    --schema-conversion-application-attributes=: The schema conversion application attributes, including the Amazon S3 bucket name and Amazon S3 role ARN.
    --source-data-provider-descriptors=: Information about the source data provider, including the name, ARN, and Amazon Web Services Secrets Manager parameters.
    --target-data-provider-descriptors=: Information about the target data provider, including the name, ARN, and Amazon Web Services Secrets Manager parameters.
    --transformation-rules=: The settings in JSON format for migration rules.
documentation:
    command: |-
        Modifies the specified migration project using the provided parameters.

        The migration project must be closed before you can modify it.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A user-friendly description of the migration project.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-profile-identifier: The name or Amazon Resource Name (ARN) for the instance profile.
        migration-project-identifier: The identifier of the migration project. Identifiers must begin with a letter and must contain only ASCII letters, digits, and hyphens. They can't end with a hyphen, or contain two consecutive hyphens.
        migration-project-name: A user-friendly name for the migration project.
        schema-conversion-application-attributes: The schema conversion application attributes, including the Amazon S3 bucket name and Amazon S3 role ARN.
        source-data-provider-descriptors: Information about the source data provider, including the name, ARN, and Amazon Web Services Secrets Manager parameters.
        target-data-provider-descriptors: Information about the target data provider, including the name, ARN, and Amazon Web Services Secrets Manager parameters.
        transformation-rules: The settings in JSON format for migration rules. Migration rules make it possible for you to change the object names according to the rules that you specify. For example, you can change an object name to lowercase or uppercase, add or remove a prefix or suffix, or rename objects.
