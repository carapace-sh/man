name: get-schema-version
description: Get the specified schema by its unique ID assigned when a version of the schema is created or registered.
flags:
    --schema-id=: This is a wrapper structure to contain schema identity fields.
    --schema-version-id=: The `SchemaVersionId` of the schema version.
    --schema-version-number=: The version number of the schema.
documentation:
    command: Get the specified schema by its unique ID assigned when a version of the schema is created or registered. Schema versions in Deleted status will not be included in the results.
    flag:
        schema-id: |-
            This is a wrapper structure to contain schema identity fields. The structure contains:

            - SchemaId$SchemaArn: The Amazon Resource Name (ARN) of the schema. Either `SchemaArn` or `SchemaName` and `RegistryName` has to be provided.
            - SchemaId$SchemaName: The name of the schema. Either `SchemaArn` or `SchemaName` and `RegistryName` has to be provided.
        schema-version-id: The `SchemaVersionId` of the schema version. This field is required for fetching by schema ID. Either this or the `SchemaId` wrapper has to be provided.
        schema-version-number: The version number of the schema.
