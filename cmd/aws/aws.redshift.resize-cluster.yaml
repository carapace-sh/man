name: resize-cluster
description: Changes the size of the cluster.
flags:
    --classic: A boolean value indicating whether the resize operation is using the classic resize process.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-identifier=!: The unique identifier for the cluster to resize.
    --cluster-type=: The new cluster type for the specified cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-classic: A boolean value indicating whether the resize operation is using the classic resize process.
    --node-type=: The new node type for the nodes you are adding.
    --number-of-nodes=: The new number of nodes for the cluster.
    --reserved-node-id=: The identifier of the reserved node.
    --target-reserved-node-offering-id=: The identifier of the target reserved node offering.
documentation:
    command: "Changes the size of the cluster. You can change the cluster's type, or change the number or type of nodes. The default behavior is to use the elastic resize method. With an elastic resize, your cluster is available for read and write operations more quickly than with the classic resize method.\n\nElastic resize operations have the following restrictions:\n\n- You can only resize clusters of the following types:\n  \n  - dc2.large\n  - dc2.8xlarge\n  - ra3.large\n  - ra3.xlplus\n  - ra3.4xlarge\n  - ra3.16xlarge\n- The type of nodes that you add must match the node type for the cluster."
    flag:
        classic: A boolean value indicating whether the resize operation is using the classic resize process. If you don't provide this parameter or set the value to `false`, the resize type is elastic.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-identifier: The unique identifier for the cluster to resize.
        cluster-type: The new cluster type for the specified cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        node-type: The new node type for the nodes you are adding. If not specified, the cluster's current node type is used.
        number-of-nodes: The new number of nodes for the cluster. If not specified, the cluster's current number of nodes is used.
        reserved-node-id: The identifier of the reserved node.
        target-reserved-node-offering-id: The identifier of the target reserved node offering.
