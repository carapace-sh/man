name: delete-signing-certificate
description: Deletes a signing certificate associated with the specified IAM user.
flags:
    --certificate-id=!: The ID of the signing certificate to delete.
    --user-name=: The name of the user the signing certificate belongs to.
documentation:
    command: |-
        Deletes a signing certificate associated with the specified IAM user.

        If you do not specify a user name, IAM determines the user name implicitly based on the Amazon Web Services access key ID signing the request. This operation works for access keys under the Amazon Web Services account. Consequently, you can use this operation to manage Amazon Web Services account root user credentials even if the Amazon Web Services account has no associated IAM users.
    flag:
        certificate-id: |-
            The ID of the signing certificate to delete.

            The format of this parameter, as described by its [regex](http://wikipedia.org/wiki/regex) pattern, is a string of characters that can be upper- or lower-cased letters or digits.
        user-name: |-
            The name of the user the signing certificate belongs to.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
