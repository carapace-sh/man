name: get-load-balancer-metric-data
description: Returns information about health metrics for your Lightsail load balancer.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=!: The end time of the period.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --load-balancer-name=!: The name of the load balancer.
    --metric-name=!: The metric for which you want to return information.
    --period=!: The granularity, in seconds, of the returned data points.
    --start-time=!: The start time of the period.
    --statistics=!: The statistic for the metric.
    --unit=!: The unit for the metric data request.
completion:
    flag:
        metric-name:
            - ClientTLSNegotiationErrorCount
            - HealthyHostCount
            - UnhealthyHostCount
            - HTTPCode_LB_4XX_Count
            - HTTPCode_LB_5XX_Count
            - HTTPCode_Instance_2XX_Count
            - HTTPCode_Instance_3XX_Count
            - HTTPCode_Instance_4XX_Count
            - HTTPCode_Instance_5XX_Count
            - InstanceResponseTime
            - RejectedConnectionCount
            - RequestCount
        unit:
            - Seconds
            - Microseconds
            - Milliseconds
            - Bytes
            - Kilobytes
            - Megabytes
            - Gigabytes
            - Terabytes
            - Bits
            - Kilobits
            - Megabits
            - Gigabits
            - Terabits
            - Percent
            - Count
            - Bytes/Second
            - Kilobytes/Second
            - Megabytes/Second
            - Gigabytes/Second
            - Terabytes/Second
            - Bits/Second
            - Kilobits/Second
            - Megabits/Second
            - Gigabits/Second
            - Terabits/Second
            - Count/Second
            - None
documentation:
    command: |-
        Returns information about health metrics for your Lightsail load balancer.

        Metrics report the utilization of your resources, and the error counts generated by them. Monitor and collect metric data regularly to maintain the reliability, availability, and performance of your resources.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: The end time of the period.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        load-balancer-name: The name of the load balancer.
        metric-name: "The metric for which you want to return information.\n\nValid load balancer metric names are listed below, along with the most useful `statistics` to include in your request, and the published `unit` value.\n\n- **`ClientTLSNegotiationErrorCount`** - The number of TLS connections initiated by the client that did not establish a session with the load balancer due to a TLS error generated by the load balancer. Possible causes include a mismatch of ciphers or protocols.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `Count`.\n- **`HealthyHostCount`** - The number of target instances that are considered healthy.\n  \n  `Statistics`: The most useful statistic are `Average`, `Minimum`, and `Maximum`.\n  \n  `Unit`: The published unit is `Count`.\n- **`HTTPCode_Instance_2XX_Count`** - The number of HTTP 2XX response codes generated by the target instances. This does not include any response codes generated by the load balancer.\n  \n  `Statistics`: The most useful statistic is `Sum`. Note that `Minimum`, `Maximum`, and `Average` all return `1`.\n  \n  `Unit`: The published unit is `Count`.\n- **`HTTPCode_Instance_3XX_Count`** - The number of HTTP 3XX response codes generated by the target instances. This does not include any response codes generated by the load balancer.\n  \n  `Statistics`: The most useful statistic is `Sum`. Note that `Minimum`, `Maximum`, and `Average` all return `1`.\n  \n  `Unit`: The published unit is `Count`.\n- **`HTTPCode_Instance_4XX_Count`** - The number of HTTP 4XX response codes generated by the target instances. This does not include any response codes generated by the load balancer.\n  \n  `Statistics`: The most useful statistic is `Sum`. Note that `Minimum`, `Maximum`, and `Average` all return `1`.\n  \n  `Unit`: The published unit is `Count`.\n- **`HTTPCode_Instance_5XX_Count`** - The number of HTTP 5XX response codes generated by the target instances. This does not include any response codes generated by the load balancer.\n  \n  `Statistics`: The most useful statistic is `Sum`. Note that `Minimum`, `Maximum`, and `Average` all return `1`.\n  \n  `Unit`: The published unit is `Count`.\n- **`HTTPCode_LB_4XX_Count`** - The number of HTTP 4XX client error codes that originated from the load balancer. Client errors are generated when requests are malformed or incomplete. These requests were not received by the target instance. This count does not include response codes generated by the target instances.\n  \n  `Statistics`: The most useful statistic is `Sum`. Note that `Minimum`, `Maximum`, and `Average` all return `1`.\n  \n  `Unit`: The published unit is `Count`.\n- **`HTTPCode_LB_5XX_Count`** - The number of HTTP 5XX server error codes that originated from the load balancer. This does not include any response codes generated by the target instance. This metric is reported if there are no healthy instances attached to the load balancer, or if the request rate exceeds the capacity of the instances (spillover) or the load balancer.\n  \n  `Statistics`: The most useful statistic is `Sum`. Note that `Minimum`, `Maximum`, and `Average` all return `1`.\n  \n  `Unit`: The published unit is `Count`.\n- **`InstanceResponseTime`** - The time elapsed, in seconds, after the request leaves the load balancer until a response from the target instance is received.\n  \n  `Statistics`: The most useful statistic is `Average`.\n  \n  `Unit`: The published unit is `Seconds`.\n- **`RejectedConnectionCount`** - The number of connections that were rejected because the load balancer had reached its maximum number of connections.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `Count`.\n- **`RequestCount`** - The number of requests processed over IPv4. This count includes only the requests with a response generated by a target instance of the load balancer.\n  \n  `Statistics`: The most useful statistic is `Sum`. Note that `Minimum`, `Maximum`, and `Average` all return `1`.\n  \n  `Unit`: The published unit is `Count`.\n- **`UnhealthyHostCount`** - The number of target instances that are considered unhealthy.\n  \n  `Statistics`: The most useful statistic are `Average`, `Minimum`, and `Maximum`.\n  \n  `Unit`: The published unit is `Count`."
        period: The granularity, in seconds, of the returned data points.
        start-time: The start time of the period.
        statistics: |-
            The statistic for the metric.

            The following statistics are available:

            - `Minimum` - The lowest value observed during the specified period. Use this value to determine low volumes of activity for your application.
            - `Maximum` - The highest value observed during the specified period. Use this value to determine high volumes of activity for your application.
            - `Sum` - All values submitted for the matching metric added together. You can use this statistic to determine the total volume of a metric.
            - `Average` - The value of Sum / SampleCount during the specified period. By comparing this statistic with the Minimum and Maximum values, you can determine the full scope of a metric and how close the average use is to the Minimum and Maximum values. This comparison helps you to know when to increase or decrease your resources.
            - `SampleCount` - The count, or number, of data points used for the statistical calculation.
        unit: The unit for the metric data request. Valid units depend on the metric data being requested. For the valid units with each available metric, see the `metricName` parameter.
