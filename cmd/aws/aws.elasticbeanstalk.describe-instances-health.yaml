name: describe-instances-health
description: Retrieves detailed information about the health of instances in your AWS Elastic Beanstalk.
flags:
    --attribute-names=: Specifies the response elements you wish to receive.
    --environment-id=: Specify the AWS Elastic Beanstalk environment by ID.
    --environment-name=: Specify the AWS Elastic Beanstalk environment by name.
    --next-token=: Specify the pagination token returned by a previous call.
documentation:
    command: Retrieves detailed information about the health of instances in your AWS Elastic Beanstalk. This operation requires [enhanced health reporting](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/health-enhanced.html).
    flag:
        attribute-names: Specifies the response elements you wish to receive. To retrieve all attributes, set to `All`. If no attribute names are specified, returns a list of instances.
        environment-id: Specify the AWS Elastic Beanstalk environment by ID.
        environment-name: Specify the AWS Elastic Beanstalk environment by name.
        next-token: Specify the pagination token returned by a previous call.
