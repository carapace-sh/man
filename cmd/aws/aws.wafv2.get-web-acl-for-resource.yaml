name: get-web-acl-for-resource
description: Retrieves the [WebACL]() for the specified resource.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource whose web ACL you want to retrieve.
documentation:
    command: |-
        Retrieves the [WebACL]() for the specified resource.

        This call uses `GetWebACL`, to verify that your account has permission to access the retrieved web ACL. If you get an error that indicates that your account isn't authorized to perform `wafv2:GetWebACL` on the resource, that error won't be included in your CloudTrail event history.

        For Amazon CloudFront, don't use this call. Instead, call the CloudFront action `GetDistributionConfig`. For information, see [GetDistributionConfig](https://docs.aws.amazon.com/cloudfront/latest/APIReference/API_GetDistributionConfig.html) in the *Amazon CloudFront API Reference*.

        **Required permissions for customer-managed IAM policies**

        This call requires permissions that are specific to the protected resource type. For details, see [Permissions for GetWebACLForResource](https://docs.aws.amazon.com/waf/latest/developerguide/security_iam_service-with-iam.html#security_iam_action-GetWebACLForResource) in the *WAF Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        resource-arn: |-
            The Amazon Resource Name (ARN) of the resource whose web ACL you want to retrieve.

            The ARN must be in one of the following formats:

            - For an Application Load Balancer: `arn:partition:elasticloadbalancing:region:account-id:loadbalancer/app/load-balancer-name/load-balancer-id`
            - For an Amazon API Gateway REST API: `arn:partition:apigateway:region::/restapis/api-id/stages/stage-name`
            - For an AppSync GraphQL API: `arn:partition:appsync:region:account-id:apis/GraphQLApiId`
            - For an Amazon Cognito user pool: `arn:partition:cognito-idp:region:account-id:userpool/user-pool-id`
            - For an App Runner service: `arn:partition:apprunner:region:account-id:service/apprunner-service-name/apprunner-service-id`
            - For an Amazon Web Services Verified Access instance: `arn:partition:ec2:region:account-id:verified-access-instance/instance-id`
            - For an Amplify application: `arn:partition:amplify:region:account-id:apps/app-id`
