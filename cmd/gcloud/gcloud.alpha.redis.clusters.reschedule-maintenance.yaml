name: reschedule-maintenance
description: '*(ALPHA)*  Reschedule maintenance window for a Memorystore for     Redis Cluster instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Redis region of the cluster.
    --reschedule-type=!: Reschedule type to use for the reschedule maintenance window.
    --schedule-time=: 'Time in RFC3339 format, for example: 2012-11-15T16:19:00.094Z'
completion:
    flag:
        reschedule-type:
            - immediate
            - specific-time
documentation:
    command: |
        *(ALPHA)*  Reschedule maintenance window for a Memorystore for
            Redis Cluster instance.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Redis region of the cluster. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
        reschedule-type: |-
            Reschedule type to use for the reschedule maintenance window. _RESCHEDULE_TYPE_ must be one of:
            +
            *immediate*::: Reschedule the maintenance to perform now.
            *specific-time*::: Reschedule the maintenance to a specific time.
            :::
            +
        schedule-time: 'Time in RFC3339 format, for example: 2012-11-15T16:19:00.094Z'
