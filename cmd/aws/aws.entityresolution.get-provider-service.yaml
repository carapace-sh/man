name: get-provider-service
description: Returns the `ProviderService` of a given name.
flags:
    --provider-name=!: The name of the provider.
    --provider-service-name=!: The ARN (Amazon Resource Name) of the product that the provider service provides.
documentation:
    command: Returns the `ProviderService` of a given name.
    flag:
        provider-name: The name of the provider. This name is typically the company name.
        provider-service-name: The ARN (Amazon Resource Name) of the product that the provider service provides.
