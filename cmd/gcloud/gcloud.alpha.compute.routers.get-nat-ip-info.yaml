name: get-nat-ip-info
description: '*(ALPHA)*  Display NAT IP information in a router.'
flags:
    --nat-name=: The NAT name to filter out NAT IP information
    --region=: Region of the router to get NAT IP info.
documentation:
    command: |-
        *(ALPHA)*  $ gcloud alpha compute routers get-nat-ip-info

        shows a mapping of IP:[usage, mode]
        allocated to each NAT via the specified router.
    flag:
        nat-name: The NAT name to filter out NAT IP information
        region: |-
            Region of the router to get NAT IP info. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
