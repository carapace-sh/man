name: update-privacy-budget-template
description: Updates the privacy budget template for the specified collaboration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --membership-identifier=!: A unique identifier for one of your memberships for a collaboration.
    --parameters=: Specifies the epsilon and noise parameters for the privacy budget template.
    --privacy-budget-template-identifier=!: A unique identifier for your privacy budget template that you want to update.
    --privacy-budget-type=!: Specifies the type of the privacy budget template.
completion:
    flag:
        privacy-budget-type:
            - DIFFERENTIAL_PRIVACY
            - ACCESS_BUDGET
documentation:
    command: Updates the privacy budget template for the specified collaboration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        membership-identifier: A unique identifier for one of your memberships for a collaboration. The privacy budget template is updated in the collaboration that this membership belongs to. Accepts a membership ID.
        parameters: Specifies the epsilon and noise parameters for the privacy budget template.
        privacy-budget-template-identifier: A unique identifier for your privacy budget template that you want to update.
        privacy-budget-type: Specifies the type of the privacy budget template.
