name: describe-capacity-reservations
description: Describes one or more of your Capacity Reservations.
flags:
    --capacity-reservation-ids=: The ID of the Capacity Reservation.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token to use to retrieve the next page of results.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Describes one or more of your Capacity Reservations. The results describe only the Capacity Reservations in the Amazon Web Services Region that you're currently using.
    flag:
        capacity-reservation-ids: The ID of the Capacity Reservation.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: "One or more filters.\n\n- `instance-type` - The type of instance for which the Capacity Reservation reserves capacity.\n- `owner-id` - The ID of the Amazon Web Services account that owns the Capacity Reservation.\n- `instance-platform` - The type of operating system for which the Capacity Reservation reserves capacity.\n- `availability-zone` - The Availability Zone of the Capacity Reservation.\n- `tenancy` - Indicates the tenancy of the Capacity Reservation. A Capacity Reservation can have one of the following tenancy settings:\n  \n  - `default` - The Capacity Reservation is created on hardware that is shared with other Amazon Web Services accounts.\n  - `dedicated` - The Capacity Reservation is created on single-tenant hardware that is dedicated to a single Amazon Web Services account.\n- `outpost-arn` - The Amazon Resource Name (ARN) of the Outpost on which the Capacity Reservation was created.\n- `state` - The current state of the Capacity Reservation. A Capacity Reservation can be in one of the following states:\n  \n  - `active`- The Capacity Reservation is active and the capacity is available for your use.\n  - `expired` - The Capacity Reservation expired automatically at the date and time specified in your request. The reserved capacity is no longer available for your use.\n  - `cancelled` - The Capacity Reservation was cancelled. The reserved capacity is no longer available for your use.\n  - `pending` - The Capacity Reservation request was successful but the capacity provisioning is still pending.\n  - `failed` - The Capacity Reservation request has failed. A request might fail due to invalid request parameters, capacity constraints, or instance limit constraints. Failed requests are retained for 60 minutes.\n- `start-date` - The date and time at which the Capacity Reservation was started.\n- `end-date` - The date and time at which the Capacity Reservation expires. When a Capacity Reservation expires, the reserved capacity is released and you can no longer launch instances into it. The Capacity Reservation's state changes to expired when it reaches its end date and time.\n- `end-date-type` - Indicates the way in which the Capacity Reservation ends. A Capacity Reservation can have one of the following end types:\n  \n  - `unlimited` - The Capacity Reservation remains active until you explicitly cancel it.\n  - `limited` - The Capacity Reservation expires automatically at a specified date and time.\n- `instance-match-criteria` - Indicates the type of instance launches that the Capacity Reservation accepts. The options include:\n  \n  - `open` - The Capacity Reservation accepts all instances that have matching attributes (instance type, platform, and Availability Zone). Instances that have matching attributes launch into the Capacity Reservation automatically without specifying any additional parameters.\n  - `targeted` - The Capacity Reservation only accepts instances that have matching attributes (instance type, platform, and Availability Zone), and explicitly target the Capacity Reservation. This ensures that only permitted instances can use the reserved capacity.\n- `placement-group-arn` - The ARN of the cluster placement group in which the Capacity Reservation was created."
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token to use to retrieve the next page of results.
