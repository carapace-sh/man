name: create
description: Create a Distributed Cloud Edge Network router.
flags:
    --asn=!: The locally assigned BGP ASN.
    --async: Return immediately, without waiting for the operation in progress to
    --description=: An optional, textual description for the router.
    --keepalive-interval-in-seconds=&: The interval in seconds between BGP keepalive messages that are sent to the peer.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The global location name.
    --network=!: The network that this subnetwork belongs to.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --zone=: The name of the Google Distributed Cloud Edge zone.
documentation:
    command: |
        Create a new Distributed Cloud Edge Network router.
    flag:
        asn: The locally assigned BGP ASN.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: An optional, textual description for the router.
        keepalive-interval-in-seconds: |
            The interval in seconds between BGP keepalive messages that are sent to the peer.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `router` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        network: The network that this subnetwork belongs to.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        zone: |-
            The name of the Google Distributed Cloud Edge zone.
            +
            To set the `zone` attribute:
            * provide the argument `router` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
