name: create-tenant
description: Create a tenant.
flags:
    --tags=: An array of objects that define the tags (keys and values) to associate with the tenant
    --tenant-name=!: The name of the tenant to create.
documentation:
    command: |-
        Create a tenant.

        *Tenants* are logical containers that group related SES resources together. Each tenant can have its own set of resources like email identities, configuration sets, and templates, along with reputation metrics and sending status. This helps isolate and manage email sending for different customers or business units within your Amazon SES API v2 account.
    flag:
        tags: An array of objects that define the tags (keys and values) to associate with the tenant
        tenant-name: The name of the tenant to create. The name can contain up to 64 alphanumeric characters, including letters, numbers, hyphens (-) and underscores (\_) only.
