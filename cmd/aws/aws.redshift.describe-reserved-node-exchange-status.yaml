name: describe-reserved-node-exchange-status
description: Returns exchange status details and associated metadata for a reserved-node exchange.
flags:
    --marker=: An optional pagination token provided by a previous `DescribeReservedNodeExchangeStatus` request.
    --max-records=: The maximum number of response records to return in each call.
    --reserved-node-exchange-request-id=: The identifier of the reserved-node exchange request.
    --reserved-node-id=: The identifier of the source reserved node in a reserved-node exchange request.
documentation:
    command: Returns exchange status details and associated metadata for a reserved-node exchange. Statuses include such values as in progress and requested.
    flag:
        marker: An optional pagination token provided by a previous `DescribeReservedNodeExchangeStatus` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by the `MaxRecords` parameter. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.
        max-records: The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `Marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.
        reserved-node-exchange-request-id: The identifier of the reserved-node exchange request.
        reserved-node-id: The identifier of the source reserved node in a reserved-node exchange request.
