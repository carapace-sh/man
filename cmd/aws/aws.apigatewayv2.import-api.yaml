name: import-api
description: Imports an API.
flags:
    --basepath=: Specifies how to interpret the base path of the API during import.
    --body=!: The OpenAPI definition.
    --fail-on-warnings=: Specifies whether to rollback the API creation when a warning is encountered.
documentation:
    command: Imports an API.
    flag:
        basepath: Specifies how to interpret the base path of the API during import. Valid values are ignore, prepend, and split. The default value is ignore. To learn more, see [Set the OpenAPI basePath Property](https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-import-api-basePath.html). Supported only for HTTP APIs.
        body: The OpenAPI definition. Supported only for HTTP APIs.
        fail-on-warnings: Specifies whether to rollback the API creation when a warning is encountered. By default, API creation continues if a warning is encountered.
