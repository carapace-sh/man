name: list-tags-for-resource
description: Returns a list of all tags associated with the specified Amazon Keyspaces resource.
flags:
    --max-results=: The total number of tags to return in the output.
    --next-token=: The pagination token.
    --resource-arn=!: The Amazon Resource Name (ARN) of the Amazon Keyspaces resource.
documentation:
    command: |-
        Returns a list of all tags associated with the specified Amazon Keyspaces resource.

        To read keyspace metadata using `ListTagsForResource`, the IAM principal needs `Select` action permissions for the specified resource and the system keyspace.
    flag:
        max-results: The total number of tags to return in the output. If the total number of tags available is more than the value specified, a `NextToken` is provided in the output. To resume pagination, provide the `NextToken` value as an argument of a subsequent API invocation.
        next-token: The pagination token. To resume pagination, provide the `NextToken` value as argument of a subsequent API invocation.
        resource-arn: The Amazon Resource Name (ARN) of the Amazon Keyspaces resource.
