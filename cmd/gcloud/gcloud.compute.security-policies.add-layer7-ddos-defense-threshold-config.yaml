name: add-layer7-ddos-defense-threshold-config
description: Add a layer7 ddos defense threshold config to a Compute Engine security policy.
flags:
    --auto-deploy-confidence-threshold=: The threshold of the confidence of an identified attack, over which auto-deploy takes action.
    --auto-deploy-expiration-sec=: The duration of actions, if any, taken by auto-deploy.
    --auto-deploy-impacted-baseline-threshold=: The threshold on the estimated impact to the baseline traffic of a suggested mitigation, below which auto-deploy takes action.
    --auto-deploy-load-threshold=: The threshold on backend's load, over which auto-deploy takes action.
    --detection-absolute-qps=: The absolute QPS of the incoming traffic, over which adaptive protection detects an attack.
    --detection-load-threshold=: The threshold on backend's load, over which adaptive protection detects an attack.
    --detection-relative-to-baseline-qps=: The QPS of the incoming traffic relative to the average baseline QPS, over which adaptive protection detects an attack.
    --threshold-config-name=!: The name for the threshold config.
    --traffic-granularity-configs=: Specify up to 2 configs matching a specifc type/value of traffic.
documentation:
    command: |-
        *gcloud compute security-policies add-layer7-ddos-defense-threshold-config* is used to add layer7 ddos defense threshold configs to security policies.

        ## EXAMPLES

        To add a layer7 ddos defense threshold config run the following command:

          $ gcloud compute security-policies add-layer7-ddos-defense-threshold-config NAME \
             --threshold-config-name=my-threshold-config-name \
             --auto-deploy-load-threshold=0.7 \
             --auto-deploy-confidence-threshold=0.8 \
             --auto-deploy-impacted-baseline-threshold=0.1 \
             --auto-deploy-expiration-sec=4800
             --detection-load-threshold=0.4
             --detection-absolute-qps=1000
             --detection-relative-to-baseline-qps=2.0
             --traffic-granularity-configs=type=HTTP_HEADER_HOST,value=www.my-test-host.com;type=HTTP_PATH,enableEachUniqueValue=true
    flag:
        auto-deploy-confidence-threshold: The threshold of the confidence of an identified attack, over which auto-deploy takes action.
        auto-deploy-expiration-sec: The duration of actions, if any, taken by auto-deploy.
        auto-deploy-impacted-baseline-threshold: The threshold on the estimated impact to the baseline traffic of a suggested mitigation, below which auto-deploy takes action.
        auto-deploy-load-threshold: The threshold on backend's load, over which auto-deploy takes action.
        detection-absolute-qps: The absolute QPS of the incoming traffic, over which adaptive protection detects an attack.
        detection-load-threshold: The threshold on backend's load, over which adaptive protection detects an attack.
        detection-relative-to-baseline-qps: The QPS of the incoming traffic relative to the average baseline QPS, over which adaptive protection detects an attack.
        threshold-config-name: The name for the threshold config.
        traffic-granularity-configs: Specify up to 2 configs matching a specifc type/value of traffic.
