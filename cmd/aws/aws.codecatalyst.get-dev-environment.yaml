name: get-dev-environment
description: Returns information about a Dev Environment for a source repository in a project.
flags:
    --id=!: The system-generated unique ID of the Dev Environment for which you want to view information.
    --project-name=!: The name of the project in the space.
    --space-name=!: The name of the space.
documentation:
    command: Returns information about a Dev Environment for a source repository in a project. Dev Environments are specific to the user who creates them.
    flag:
        id: The system-generated unique ID of the Dev Environment for which you want to view information. To retrieve a list of Dev Environment IDs, use [ListDevEnvironments]().
        project-name: The name of the project in the space.
        space-name: The name of the space.
