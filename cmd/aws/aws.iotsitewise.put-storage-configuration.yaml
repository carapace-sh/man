name: put-storage-configuration
description: Configures storage settings for IoT SiteWise.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --disallow-ingest-null-na-n: Describes the configuration for ingesting NULL and NaN data.
    --disassociated-data-storage=: Contains the storage configuration for time series (data streams) that aren't associated with asset properties.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --multi-layer-storage=: Identifies a storage destination.
    --no-disallow-ingest-null-na-n: Describes the configuration for ingesting NULL and NaN data.
    --retention-period=: ""
    --storage-type=!: The storage tier that you specified for your data.
    --warm-tier-retention-period=: Set this period to specify how long your data is stored in the warm tier before it is deleted.
    --warm-tier=: A service managed storage tier optimized for analytical queries.
completion:
    flag:
        disassociated-data-storage:
            - ENABLED
            - DISABLED
        storage-type:
            - SITEWISE_DEFAULT_STORAGE
            - MULTI_LAYER_STORAGE
        warm-tier:
            - ENABLED
            - DISABLED
documentation:
    command: Configures storage settings for IoT SiteWise.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        disallow-ingest-null-na-n: Describes the configuration for ingesting NULL and NaN data. By default the feature is allowed. The feature is disallowed if the value is `true`.
        disassociated-data-storage: "Contains the storage configuration for time series (data streams) that aren't associated with asset properties. The `disassociatedDataStorage` can be one of the following values:\n\n- `ENABLED` – IoT SiteWise accepts time series that aren't associated with asset properties.\n  \n  After the `disassociatedDataStorage` is enabled, you can't disable it.\n- `DISABLED` – IoT SiteWise doesn't accept time series (data streams) that aren't associated with asset properties.\n\nFor more information, see [Data streams](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/data-streams.html) in the *IoT SiteWise User Guide*."
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        multi-layer-storage: Identifies a storage destination. If you specified `MULTI_LAYER_STORAGE` for the storage type, you must specify a `MultiLayerStorage` object.
        retention-period: ""
        storage-type: |-
            The storage tier that you specified for your data. The `storageType` parameter can be one of the following values:

            - `SITEWISE_DEFAULT_STORAGE` – IoT SiteWise saves your data into the hot tier. The hot tier is a service-managed database.
            - `MULTI_LAYER_STORAGE` – IoT SiteWise saves your data in both the cold tier and the hot tier. The cold tier is a customer-managed Amazon S3 bucket.
        warm-tier: A service managed storage tier optimized for analytical queries. It stores periodically uploaded, buffered and historical data ingested with the CreaeBulkImportJob API.
        warm-tier-retention-period: Set this period to specify how long your data is stored in the warm tier before it is deleted. You can set this only if cold tier is enabled.
