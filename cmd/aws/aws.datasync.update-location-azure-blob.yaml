name: update-location-azure-blob
description: Modifies the following configurations of the Microsoft Azure Blob Storage transfer location that you're using with DataSync.
flags:
    --access-tier=: Specifies the access tier that you want your objects or files transferred into.
    --agent-arns=: (Optional) Specifies the Amazon Resource Name (ARN) of the DataSync agent that can connect with your Azure Blob Storage container.
    --authentication-type=: Specifies the authentication method DataSync uses to access your Azure Blob Storage.
    --blob-type=: Specifies the type of blob that you want your objects or files to be when transferring them into Azure Blob Storage.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cmk-secret-config=: Specifies configuration information for a DataSync-managed secret, such as an authentication token or set of credentials that DataSync uses to access a specific transfer location, and a customer-managed KMS key.
    --custom-secret-config=: Specifies configuration information for a customer-managed secret, such as an authentication token or set of credentials that DataSync uses to access a specific transfer location, and a customer-managed KMS key.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --location-arn=!: Specifies the ARN of the Azure Blob Storage transfer location that you're updating.
    --sas-configuration=: Specifies the SAS configuration that allows DataSync to access your Azure Blob Storage.
    --subdirectory=: Specifies path segments if you want to limit your transfer to a virtual directory in your container (for example, `/my/images`).
completion:
    flag:
        access-tier:
            - HOT
            - COOL
            - ARCHIVE
        authentication-type:
            - SAS
            - NONE
        blob-type:
            - BLOCK
documentation:
    command: |-
        Modifies the following configurations of the Microsoft Azure Blob Storage transfer location that you're using with DataSync.

        For more information, see [Configuring DataSync transfers with Azure Blob Storage](https://docs.aws.amazon.com/datasync/latest/userguide/creating-azure-blob-location.html).
    flag:
        access-tier: Specifies the access tier that you want your objects or files transferred into. This only applies when using the location as a transfer destination. For more information, see [Access tiers](https://docs.aws.amazon.com/datasync/latest/userguide/creating-azure-blob-location.html#azure-blob-access-tiers).
        agent-arns: |-
            (Optional) Specifies the Amazon Resource Name (ARN) of the DataSync agent that can connect with your Azure Blob Storage container. If you are setting up an agentless cross-cloud transfer, you do not need to specify a value for this parameter.

            You can specify more than one agent. For more information, see [Using multiple agents for your transfer](https://docs.aws.amazon.com/datasync/latest/userguide/multiple-agents.html).

            You cannot add or remove agents from a storage location after you initially create it.
        authentication-type: Specifies the authentication method DataSync uses to access your Azure Blob Storage. DataSync can access blob storage using a shared access signature (SAS).
        blob-type: Specifies the type of blob that you want your objects or files to be when transferring them into Azure Blob Storage. Currently, DataSync only supports moving data into Azure Blob Storage as block blobs. For more information on blob types, see the [Azure Blob Storage documentation](https://learn.microsoft.com/en-us/rest/api/storageservices/understanding-block-blobs--append-blobs--and-page-blobs).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cmk-secret-config: Specifies configuration information for a DataSync-managed secret, such as an authentication token or set of credentials that DataSync uses to access a specific transfer location, and a customer-managed KMS key.
        custom-secret-config: Specifies configuration information for a customer-managed secret, such as an authentication token or set of credentials that DataSync uses to access a specific transfer location, and a customer-managed KMS key.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        location-arn: Specifies the ARN of the Azure Blob Storage transfer location that you're updating.
        sas-configuration: Specifies the SAS configuration that allows DataSync to access your Azure Blob Storage.
        subdirectory: Specifies path segments if you want to limit your transfer to a virtual directory in your container (for example, `/my/images`).
