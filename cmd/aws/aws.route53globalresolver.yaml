                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            client-token: A unique, case-sensitive identifier to ensure idempotency. This means that making the same request multiple times with the same `clientToken` has the same result every time.
            dns-view-id: The ID of the DNS view to associate with this token.
            expires-at: The date and time when the token expires. Tokens can have a minimum expiration of 30 days and maximum of 365 days from creation.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            name: A descriptive name for the access token.
            tags: An array of user-defined keys and optional values. These tags can be used for categorization and organization.
    - name: create-dns-view
      description: Creates a DNS view within a Route 53 Global Resolver.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique string that identifies the request and ensures idempotency.
        --description=: An optional description for the DNS view.
        --dnssec-validation=: Whether to enable DNSSEC validation for DNS queries in this DNS view.
        --edns-client-subnet=: Whether to enable EDNS Client Subnet injection for DNS queries in this DNS view.
        --firewall-rules-fail-open=: Determines the behavior when Route 53 Global Resolver cannot apply DNS firewall rules due to service impairment.
