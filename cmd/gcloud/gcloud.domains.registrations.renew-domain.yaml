name: renew-domain
description: Renew a recently expired Cloud Domains registration.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-validate-only&: Don't actually renew registration.
    --validate-only: Don't actually renew registration.
    --yearly-price=: Accept the domain's yearly price in the interactive flow or by using this flag.
documentation:
    command: |-
        Use this method to renew domains that expired within the last 30 days.
        Renewing your domain extends it for one year from the previous expiration date
        and you are charged the yearly renewal price.

        ## EXAMPLES

        To renew a registration for ``example.com'' interactively, run:

          $ gcloud domains registrations renew-domain example.com

        To renew ``example.com'' with interactive prompts disabled, provide the
        --yearly-price flag. For example, run:

          $ gcloud domains registrations renew-domain example.com --yearly-price="12.00 USD" --quiet
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-validate-only: Don't actually renew registration. Only validate arguments.
        validate-only: Don't actually renew registration. Only validate arguments.
        yearly-price: Accept the domain's yearly price in the interactive flow or by using this flag. Use a number followed by a currency code, for example, "12.00 USD". Get the price by calling the renew-domain command without the --yearly-price flag.
