name: list-event-predictions
description: Gets a list of past predictions.
flags:
    --detector-id=: The detector ID.
    --detector-version-id=: The detector version ID.
    --event-id=: The event ID.
    --event-type=: The event type associated with the detector.
    --max-results=: The maximum number of predictions to return for the request.
    --next-token=: Identifies the next page of results to return.
    --prediction-time-range=: The time period for when the predictions were generated.
documentation:
    command: |-
        Gets a list of past predictions. The list can be filtered by detector ID, detector version ID, event ID, event type, or by specifying a time period. If filter is not specified, the most recent prediction is returned.

        For example, the following filter lists all past predictions for `xyz` event type - `{ "eventType":{ "value": "xyz" }” }`

        This is a paginated API. If you provide a null `maxResults`, this action will retrieve a maximum of 10 records per page. If you provide a `maxResults`, the value must be between 50 and 100. To get the next page results, provide the `nextToken` from the response as part of your request. A null `nextToken` fetches the records from the beginning.
    flag:
        detector-id: The detector ID.
        detector-version-id: The detector version ID.
        event-id: The event ID.
        event-type: The event type associated with the detector.
        max-results: The maximum number of predictions to return for the request.
        next-token: Identifies the next page of results to return. Use the token to make the call again to retrieve the next page. Keep all other arguments unchanged. Each pagination token expires after 24 hours.
        prediction-time-range: The time period for when the predictions were generated.
