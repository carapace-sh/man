name: delete-relational-database
description: Deletes a database in Amazon Lightsail.
flags:
    --final-relational-database-snapshot-name=: The name of the database snapshot created if `skip final snapshot` is `false`, which is the default value for that parameter.
    --no-skip-final-snapshot: Determines whether a final database snapshot is created before your database is deleted.
    --relational-database-name=!: The name of the database that you are deleting.
    --skip-final-snapshot: Determines whether a final database snapshot is created before your database is deleted.
documentation:
    command: |-
        Deletes a database in Amazon Lightsail.

        The `delete relational database` operation supports tag-based access control via resource tags applied to the resource identified by relationalDatabaseName. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        final-relational-database-snapshot-name: |-
            The name of the database snapshot created if `skip final snapshot` is `false`, which is the default value for that parameter.

            Specifying this parameter and also specifying the `skip final snapshot` parameter to `true` results in an error.

            Constraints:

            - Must contain from 2 to 255 alphanumeric characters, or hyphens.
            - The first and last character must be a letter or number.
        relational-database-name: The name of the database that you are deleting.
        skip-final-snapshot: |-
            Determines whether a final database snapshot is created before your database is deleted. If `true` is specified, no database snapshot is created. If `false` is specified, a database snapshot is created before your database is deleted.

            You must specify the `final relational database snapshot name` parameter if the `skip final snapshot` parameter is `false`.

            Default: `false`
