name: create-client-vpn-route
description: Adds a route to a network to a Client VPN endpoint.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --client-vpn-endpoint-id=!: The ID of the Client VPN endpoint to which to add the route.
    --description=: A brief description of the route.
    --destination-cidr-block=!: The IPv4 address range, in CIDR notation, of the route destination.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --target-vpc-subnet-id=!: The ID of the subnet through which you want to route traffic.
documentation:
    command: Adds a route to a network to a Client VPN endpoint. Each Client VPN endpoint has a route table that describes the available destination network routes. Each route in the route table specifies the path for traﬃc to speciﬁc resources or networks.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        client-vpn-endpoint-id: The ID of the Client VPN endpoint to which to add the route.
        description: A brief description of the route.
        destination-cidr-block: |-
            The IPv4 address range, in CIDR notation, of the route destination. For example:

            - To add a route for Internet access, enter `0.0.0.0/0`
            - To add a route for a peered VPC, enter the peered VPC's IPv4 CIDR range
            - To add a route for an on-premises network, enter the Amazon Web Services Site-to-Site VPN connection's IPv4 CIDR range
            - To add a route for the local network, enter the client CIDR range
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        target-vpc-subnet-id: |-
            The ID of the subnet through which you want to route traffic. The specified subnet must be an existing target network of the Client VPN endpoint.

            Alternatively, if you're adding a route for the local network, specify `local`.
