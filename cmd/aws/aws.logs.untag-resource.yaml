name: untag-resource
description: Removes one or more tags from the specified resource.
flags:
    --resource-arn=!: The ARN of the CloudWatch Logs resource that you're removing tags from.
    --tag-keys=!: The list of tag keys to remove from the resource.
documentation:
    command: Removes one or more tags from the specified resource.
    flag:
        resource-arn: |-
            The ARN of the CloudWatch Logs resource that you're removing tags from.

            The ARN format of a log group is `arn:aws:logs:Region:account-id:log-group:log-group-name`

            The ARN format of a destination is `arn:aws:logs:Region:account-id:destination:destination-name`

            For more information about ARN format, see [CloudWatch Logs resources and operations](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/iam-access-control-overview-cwl.html).
        tag-keys: The list of tag keys to remove from the resource.
