name: invoke-rest-api
description: Invokes the Apache Airflow REST API on the webserver with the specified inputs.
flags:
    --body=: The request body for the Apache Airflow REST API call, provided as a JSON object.
    --method=!: The HTTP method used for making Airflow REST API calls.
    --name=!: The name of the Amazon MWAA environment.
    --path=!: The Apache Airflow REST API endpoint path to be called.
    --query-parameters=: Query parameters to be included in the Apache Airflow REST API call, provided as a JSON object.
completion:
    flag:
        method:
            - GET
            - PUT
            - POST
            - PATCH
            - DELETE
documentation:
    command: Invokes the Apache Airflow REST API on the webserver with the specified inputs. To learn more, see [Using the Apache Airflow REST API](https://docs.aws.amazon.com/mwaa/latest/userguide/access-mwaa-apache-airflow-rest-api.html)
    flag:
        body: The request body for the Apache Airflow REST API call, provided as a JSON object.
        method: The HTTP method used for making Airflow REST API calls. For example, `POST`.
        name: The name of the Amazon MWAA environment. For example, `MyMWAAEnvironment`.
        path: The Apache Airflow REST API endpoint path to be called. For example, `/dags/123456/clearTaskInstances`. For more information, see [Apache Airflow API](https://airflow.apache.org/docs/apache-airflow/stable/stable-rest-api-ref.html)
        query-parameters: Query parameters to be included in the Apache Airflow REST API call, provided as a JSON object.
