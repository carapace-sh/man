name: stop-monitoring-members
description: Stops GuardDuty monitoring for the specified member accounts.
flags:
    --account-ids=!: A list of account IDs for the member accounts to stop monitoring.
    --detector-id=!: The unique ID of the detector associated with the GuardDuty administrator account that is monitoring member accounts.
documentation:
    command: |-
        Stops GuardDuty monitoring for the specified member accounts. Use the `StartMonitoringMembers` operation to restart monitoring for those accounts.

        With `autoEnableOrganizationMembers` configuration for your organization set to `ALL`, you'll receive an error if you attempt to stop monitoring the member accounts in your organization.
    flag:
        account-ids: A list of account IDs for the member accounts to stop monitoring.
        detector-id: |-
            The unique ID of the detector associated with the GuardDuty administrator account that is monitoring member accounts.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
