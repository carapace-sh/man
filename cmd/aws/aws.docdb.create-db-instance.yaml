name: create-db-instance
description: Creates a new instance.
flags:
    --auto-minor-version-upgrade: This parameter does not apply to Amazon DocumentDB.
    --availability-zone=: The Amazon EC2 Availability Zone that the instance is created in.
    --ca-certificate-identifier=: The CA certificate identifier to use for the DB instance's server certificate.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --copy-tags-to-snapshot: A value that indicates whether to copy tags from the DB instance to snapshots of the DB instance.
    --db-cluster-identifier=!: The identifier of the cluster that the instance will belong to.
    --db-instance-class=!: The compute and memory capacity of the instance; for example, `db.r5.large`.
    --db-instance-identifier=!: The instance identifier.
    --enable-performance-insights: A value that indicates whether to enable Performance Insights for the DB Instance.
    --engine=!: The name of the database engine to be used for this instance.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-auto-minor-version-upgrade: This parameter does not apply to Amazon DocumentDB.
    --no-copy-tags-to-snapshot: A value that indicates whether to copy tags from the DB instance to snapshots of the DB instance.
    --no-enable-performance-insights: A value that indicates whether to enable Performance Insights for the DB Instance.
    --performance-insights-kms-key-id=: The KMS key identifier for encryption of Performance Insights data.
    --preferred-maintenance-window=: The time range each week during which system maintenance can occur, in Universal Coordinated Time (UTC).
    --promotion-tier=: A value that specifies the order in which an Amazon DocumentDB replica is promoted to the primary instance after a failure of the existing primary instance.
    --tags=: The tags to be assigned to the instance.
documentation:
    command: Creates a new instance.
    flag:
        auto-minor-version-upgrade: |-
            This parameter does not apply to Amazon DocumentDB. Amazon DocumentDB does not perform minor version upgrades regardless of the value set.

            Default: `false`
        availability-zone: |-
            The Amazon EC2 Availability Zone that the instance is created in.

            Default: A random, system-chosen Availability Zone in the endpoint's Amazon Web Services Region.

            Example: `us-east-1d`
        ca-certificate-identifier: |-
            The CA certificate identifier to use for the DB instance's server certificate.

            For more information, see [Updating Your Amazon DocumentDB TLS Certificates](https://docs.aws.amazon.com/documentdb/latest/developerguide/ca_cert_rotation.html) and [Encrypting Data in Transit](https://docs.aws.amazon.com/documentdb/latest/developerguide/security.encryption.ssl.html) in the *Amazon DocumentDB Developer Guide*.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        copy-tags-to-snapshot: A value that indicates whether to copy tags from the DB instance to snapshots of the DB instance. By default, tags are not copied.
        db-cluster-identifier: The identifier of the cluster that the instance will belong to.
        db-instance-class: The compute and memory capacity of the instance; for example, `db.r5.large`.
        db-instance-identifier: |-
            The instance identifier. This parameter is stored as a lowercase string.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens.
            - The first character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.

            Example: `mydbinstance`
        enable-performance-insights: A value that indicates whether to enable Performance Insights for the DB Instance. For more information, see [Using Amazon Performance Insights](https://docs.aws.amazon.com/documentdb/latest/developerguide/performance-insights.html).
        engine: |-
            The name of the database engine to be used for this instance.

            Valid value: `docdb`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        performance-insights-kms-key-id: |-
            The KMS key identifier for encryption of Performance Insights data.

            The KMS key identifier is the key ARN, key ID, alias ARN, or alias name for the KMS key.

            If you do not specify a value for PerformanceInsightsKMSKeyId, then Amazon DocumentDB uses your default KMS key. There is a default KMS key for your Amazon Web Services account. Your Amazon Web Services account has a different default KMS key for each Amazon Web Services region.
        preferred-maintenance-window: |-
            The time range each week during which system maintenance can occur, in Universal Coordinated Time (UTC).

            Format: `ddd:hh24:mi-ddd:hh24:mi`

            The default is a 30-minute window selected at random from an 8-hour block of time for each Amazon Web Services Region, occurring on a random day of the week.

            Valid days: Mon, Tue, Wed, Thu, Fri, Sat, Sun

            Constraints: Minimum 30-minute window.
        promotion-tier: |-
            A value that specifies the order in which an Amazon DocumentDB replica is promoted to the primary instance after a failure of the existing primary instance.

            Default: 1

            Valid values: 0-15
        tags: The tags to be assigned to the instance. You can assign up to 10 tags to an instance.
