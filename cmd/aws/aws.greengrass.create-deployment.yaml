name: create-deployment
description: Creates a deployment.
flags:
    --amzn-client-token=: A client token used to correlate requests and responses.
    --deployment-id=: The ID of the deployment if you wish to redeploy a previous deployment.
    --deployment-type=!: The type of deployment.
    --group-id=!: The ID of the Greengrass group.
    --group-version-id=: The ID of the group version to be deployed.
completion:
    flag:
        deployment-type:
            - NewDeployment
            - Redeployment
            - ResetDeployment
            - ForceResetDeployment
documentation:
    command: Creates a deployment. ''CreateDeployment'' requests are idempotent with respect to the ''X-Amzn-Client-Token'' token and the request parameters.
    flag:
        amzn-client-token: A client token used to correlate requests and responses.
        deployment-id: The ID of the deployment if you wish to redeploy a previous deployment.
        deployment-type: The type of deployment. When used for ''CreateDeployment'', only ''NewDeployment'' and ''Redeployment'' are valid.
        group-id: The ID of the Greengrass group.
        group-version-id: The ID of the group version to be deployed.
