name: update
description: '*(ALPHA)*  Update a SaaS.'
hidden: true
flags:
    --add-locations=: Add new value to locations list.
    --clear-labels: Clear labels value and set to empty map.
    --clear-locations: Clear locations value and set to empty list.
    --labels=: Set labels to new value.
    --location=: Location ID
    --locations=: Set locations to new value.
    --no-clear-labels&: Clear labels value and set to empty map.
    --no-clear-locations&: Clear locations value and set to empty list.
    --remove-labels=: Remove existing value from map labels.
    --remove-locations=: Remove existing value from locations list.
    --update-labels=: Update labels value or add key value pair.
documentation:
    command: '*(ALPHA)*  Update a SaaS'
    flag:
        add-locations: |-
            Add new value to locations list. List of locations that the service is available in. Rollout refers to the
            list to generate a rollout plan.
            +
            *name*:::
            Name of location. Example flag usage: --locations=name=us-central1.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-locations=name=string --add-locations=name=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-locations='[{"name": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-locations=path_to_file.(yaml|json)
            +
            ```
        clear-labels: Clear labels value and set to empty map.
        clear-locations: Clear locations value and set to empty list.
        labels: |-
            Set labels to new value. The labels on the resource, which can be used for categorization.
            similar to Kubernetes resource labels.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            Location ID
            +
            To set the `location` attribute:
            * provide the argument `saas` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        locations: |-
            Set locations to new value. List of locations that the service is available in. Rollout refers to the
            list to generate a rollout plan.
            +
            *name*:::
            Name of location. Example flag usage: --locations=name=us-central1.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --locations=name=string --locations=name=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --locations='[{"name": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --locations=path_to_file.(yaml|json)
            +
            ```
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-locations: Clear locations value and set to empty list.
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        remove-locations: |-
            Remove existing value from locations list. List of locations that the service is available in. Rollout refers to the
            list to generate a rollout plan.
            +
            *name*:::
            Name of location. Example flag usage: --locations=name=us-central1.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-locations=name=string --remove-locations=name=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-locations='[{"name": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-locations=path_to_file.(yaml|json)
            +
            ```
        update-labels: |-
            Update labels value or add key value pair. The labels on the resource, which can be used for categorization.
            similar to Kubernetes resource labels.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-labels=path_to_file.(yaml|json)
            +
            ```
