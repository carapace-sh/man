name: confirm-transit-virtual-interface
description: Accepts ownership of a transit virtual interface created by another Amazon Web Services account.
flags:
    --direct-connect-gateway-id=!: The ID of the Direct Connect gateway.
    --virtual-interface-id=!: The ID of the virtual interface.
documentation:
    command: |-
        Accepts ownership of a transit virtual interface created by another Amazon Web Services account.

        After the owner of the transit virtual interface makes this call, the specified transit virtual interface is created and made available to handle traffic.
    flag:
        direct-connect-gateway-id: The ID of the Direct Connect gateway.
        virtual-interface-id: The ID of the virtual interface.
