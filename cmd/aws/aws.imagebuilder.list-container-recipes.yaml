name: list-container-recipes
description: Returns a list of container recipes.
flags:
    --filters=: 'Use the following filters to streamline results:'
    --max-results=: Specify the maximum number of items to return in a request.
    --next-token=: A token to specify where to start paginating.
    --owner=: Returns container recipes belonging to the specified owner, that have been shared with you.
completion:
    flag:
        owner:
            - Self
            - Shared
            - Amazon
            - ThirdParty
            - AWSMarketplace
documentation:
    command: Returns a list of container recipes.
    flag:
        filters: |-
            Use the following filters to streamline results:

            - `containerType`
            - `name`
            - `parentImage`
            - `platform`
        max-results: Specify the maximum number of items to return in a request.
        next-token: A token to specify where to start paginating. This is the nextToken from a previously truncated response.
        owner: Returns container recipes belonging to the specified owner, that have been shared with you. You can omit this field to return container recipes belonging to your account.
