name: associate-protect-configuration
description: Associate a protect configuration with a configuration set.
flags:
    --configuration-set-name=!: The name of the ConfigurationSet.
    --protect-configuration-id=!: The unique identifier for the protect configuration.
documentation:
    command: Associate a protect configuration with a configuration set. This replaces the configuration sets current protect configuration. A configuration set can only be associated with one protect configuration at a time. A protect configuration can be associated with multiple configuration sets.
    flag:
        configuration-set-name: The name of the ConfigurationSet.
        protect-configuration-id: The unique identifier for the protect configuration.
