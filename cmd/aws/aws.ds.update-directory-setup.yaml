name: update-directory-setup
description: Updates directory configuration for the specified update type.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --create-snapshot-before-update: Specifies whether to create a directory snapshot before performing the update.
    --directory-id=!: The identifier of the directory to update.
    --directory-size-update-settings=: Directory size configuration to apply during the update operation.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --network-update-settings=: Network configuration to apply during the directory update operation.
    --no-create-snapshot-before-update: Specifies whether to create a directory snapshot before performing the update.
    --os-update-settings=: Operating system configuration to apply during the directory update operation.
    --update-type=!: The type of update to perform on the directory.
completion:
    flag:
        update-type:
            - OS
            - NETWORK
            - SIZE
documentation:
    command: Updates directory configuration for the specified update type.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        create-snapshot-before-update: Specifies whether to create a directory snapshot before performing the update.
        directory-id: The identifier of the directory to update.
        directory-size-update-settings: Directory size configuration to apply during the update operation.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        network-update-settings: Network configuration to apply during the directory update operation.
        os-update-settings: Operating system configuration to apply during the directory update operation.
        update-type: The type of update to perform on the directory.
