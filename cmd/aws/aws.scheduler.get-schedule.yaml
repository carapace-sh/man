name: get-schedule
description: Retrieves the specified schedule.
flags:
    --group-name=: The name of the schedule group associated with this schedule.
    --name=!: The name of the schedule to retrieve.
documentation:
    command: Retrieves the specified schedule.
    flag:
        group-name: The name of the schedule group associated with this schedule. If you omit this, EventBridge Scheduler assumes that the schedule is associated with the default group.
        name: The name of the schedule to retrieve.
