name: get-command-execution
description: Gets information about the specific command execution on a single device.
flags:
    --execution-id=!: The unique identifier for the command execution.
    --include-result=: Can be used to specify whether to include the result of the command execution in the `GetCommandExecution` API response.
    --target-arn=!: The Amazon Resource Number (ARN) of the device on which the command execution is being performed.
documentation:
    command: Gets information about the specific command execution on a single device.
    flag:
        execution-id: The unique identifier for the command execution. This information is returned as a response of the `StartCommandExecution` API request.
        include-result: Can be used to specify whether to include the result of the command execution in the `GetCommandExecution` API response. Your device can use this field to provide additional information about the command execution. You only need to specify this field when using the `AWS-IoT` namespace.
        target-arn: The Amazon Resource Number (ARN) of the device on which the command execution is being performed.
