name: reset-dbcluster-parameter-group
description: Modifies the parameters of a DB cluster parameter group to the default value.
flags:
    --dbcluster-parameter-group-name=!: The name of the DB cluster parameter group to reset.
    --no-reset-all-parameters: A value that is set to `true` to reset all parameters in the DB cluster parameter group to their default values, and `false` otherwise.
    --parameters=: A list of parameter names in the DB cluster parameter group to reset to the default values.
    --reset-all-parameters: A value that is set to `true` to reset all parameters in the DB cluster parameter group to their default values, and `false` otherwise.
documentation:
    command: |-
        Modifies the parameters of a DB cluster parameter group to the default value. To reset specific parameters submit a list of the following: `ParameterName` and `ApplyMethod`. To reset the entire DB cluster parameter group, specify the `DBClusterParameterGroupName` and `ResetAllParameters` parameters.

        When resetting the entire group, dynamic parameters are updated immediately and static parameters are set to `pending-reboot` to take effect on the next DB instance restart or [RebootDBInstance]() request. You must call [RebootDBInstance]() for every DB instance in your DB cluster that you want the updated static parameter to apply to.
    flag:
        dbcluster-parameter-group-name: The name of the DB cluster parameter group to reset.
        parameters: A list of parameter names in the DB cluster parameter group to reset to the default values. You can't use this parameter if the `ResetAllParameters` parameter is set to `true`.
        reset-all-parameters: A value that is set to `true` to reset all parameters in the DB cluster parameter group to their default values, and `false` otherwise. You can't use this parameter if there is a list of parameter names specified for the `Parameters` parameter.
