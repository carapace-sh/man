name: list-type-registrations
description: Returns a list of registration tokens for the specified extension(s).
flags:
    --max-results=: The maximum number of results to be returned with a single call.
    --next-token=: The token for the next set of items to return.
    --registration-status-filter=: The current status of the extension registration request.
    --type-arn=: The Amazon Resource Name (ARN) of the extension.
    --type-name=: The name of the extension.
    --type=: The kind of extension.
completion:
    flag:
        registration-status-filter:
            - COMPLETE
            - IN_PROGRESS
            - FAILED
        type:
            - RESOURCE
            - MODULE
            - HOOK
documentation:
    command: Returns a list of registration tokens for the specified extension(s).
    flag:
        max-results: The maximum number of results to be returned with a single call. If the number of available results exceeds this maximum, the response includes a `NextToken` value that you can assign to the `NextToken` request parameter to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        registration-status-filter: |-
            The current status of the extension registration request.

            The default is `IN_PROGRESS`.
        type: |-
            The kind of extension.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
        type-arn: |-
            The Amazon Resource Name (ARN) of the extension.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
        type-name: |-
            The name of the extension.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
