name: update-app-monitor
description: Updates the configuration of an existing app monitor.
flags:
    --app-monitor-configuration=: A structure that contains much of the configuration data for the app monitor.
    --custom-events=: Specifies whether this app monitor allows the web client to define and send custom events.
    --cw-log-enabled: Data collected by RUM is kept by RUM for 30 days and then deleted.
    --deobfuscation-configuration=: A structure that contains the configuration for how an app monitor can deobfuscate stack traces.
    --domain-list=: List the domain names for which your application has administrative authority.
    --domain=: The top-level internet domain name for which your application has administrative authority.
    --name=!: The name of the app monitor to update.
    --no-cw-log-enabled&: Data collected by RUM is kept by RUM for 30 days and then deleted.
documentation:
    command: |-
        Updates the configuration of an existing app monitor. When you use this operation, only the parts of the app monitor configuration that you specify in this operation are changed. For any parameters that you omit, the existing values are kept.

        You can't use this operation to change the tags of an existing app monitor. To change the tags of an existing app monitor, use [TagResource](https://docs.aws.amazon.com/cloudwatchrum/latest/APIReference/API_TagResource.html).

        To create a new app monitor, use [CreateAppMonitor](https://docs.aws.amazon.com/cloudwatchrum/latest/APIReference/API_CreateAppMonitor.html).

        After you update an app monitor, sign in to the CloudWatch RUM console to get the updated JavaScript code snippet to add to your web application. For more information, see [How do I find a code snippet that I've already generated?](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM-find-code-snippet.html)
    flag:
        app-monitor-configuration: A structure that contains much of the configuration data for the app monitor. If you are using Amazon Cognito for authorization, you must include this structure in your request, and it must include the ID of the Amazon Cognito identity pool to use for authorization. If you don't include `AppMonitorConfiguration`, you must set up your own authorization method. For more information, see [Authorize your application to send data to Amazon Web Services](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM-get-started-authorization.html).
        custom-events: |-
            Specifies whether this app monitor allows the web client to define and send custom events. The default is for custom events to be `DISABLED`.

            For more information about custom events, see [Send custom events](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM-custom-events.html).
        cw-log-enabled: Data collected by RUM is kept by RUM for 30 days and then deleted. This parameter specifies whether RUM sends a copy of this telemetry data to Amazon CloudWatch Logs in your account. This enables you to keep the telemetry data for more than 30 days, but it does incur Amazon CloudWatch Logs charges.
        deobfuscation-configuration: A structure that contains the configuration for how an app monitor can deobfuscate stack traces.
        domain: The top-level internet domain name for which your application has administrative authority.
        domain-list: List the domain names for which your application has administrative authority. The `UpdateAppMonitor` allows either the domain or the domain list.
        name: The name of the app monitor to update.
