name: create
description: '*(BETA)*  Create a DnsThreatDetector resource.'
flags:
    --excluded-networks=: A list of Network resource names which are exempt from the configuration in
    --labels=: Labels as key value pairs.
    --location=: The location id of the dnsThreatDetector resource.
    --provider=!: The provider used for DNS threat analysis.
completion:
    flag:
        provider:
            - infoblox
documentation:
    command: '*(BETA)*  Create a DnsThreatDetector resource.'
    flag:
        excluded-networks: |-
            A list of Network resource names which are exempt from the configuration in
            this DnsThreatDetector.
            +
            Example:
            `projects/PROJECT_ID/global/networks/NETWORK_NAME`.
        labels: |-
            Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the dnsThreatDetector resource.
            +
            To set the `location` attribute:
            * provide the argument `dns_threat_detector` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        provider: |-
            The provider used for DNS threat analysis. _PROVIDER_ must be (only one value is supported):
            +
            *infoblox*::: The Infoblox DNS threat detecter.
            :::
            +
