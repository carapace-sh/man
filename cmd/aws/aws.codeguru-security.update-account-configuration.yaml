name: update-account-configuration
description: Use to update the encryption configuration for an account.
flags:
    --encryption-config=!: The customer-managed KMS key ARN you want to use for encryption.
documentation:
    command: Use to update the encryption configuration for an account.
    flag:
        encryption-config: The customer-managed KMS key ARN you want to use for encryption. If not specified, CodeGuru Security will use an AWS-managed key for encryption. If you previously specified a customer-managed KMS key and want CodeGuru Security to use an AWS-managed key for encryption instead, pass nothing.
