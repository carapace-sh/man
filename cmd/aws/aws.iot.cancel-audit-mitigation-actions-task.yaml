name: cancel-audit-mitigation-actions-task
description: Cancels a mitigation action task that is in progress.
flags:
    --task-id=!: The unique identifier for the task that you want to cancel.
documentation:
    command: |-
        Cancels a mitigation action task that is in progress. If the task is not in progress, an InvalidRequestException occurs.

        Requires permission to access the [CancelAuditMitigationActionsTask](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        task-id: The unique identifier for the task that you want to cancel.
