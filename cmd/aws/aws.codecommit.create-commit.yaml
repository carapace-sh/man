name: create-commit
description: Creates a commit for a repository on the tip of a specified branch.
flags:
    --author-name=: The name of the author who created the commit.
    --branch-name=!: The name of the branch where you create the commit.
    --commit-message=: The commit message you want to include in the commit.
    --delete-files=: The files to delete in this commit.
    --email=: The email address of the person who created the commit.
    --keep-empty-folders=: If the commit contains deletions, whether to keep a folder or folder structure if the changes leave the folders empty.
    --parent-commit-id=: The ID of the commit that is the parent of the commit you create.
    --put-files=: The files to add or update in this commit.
    --repository-name=!: The name of the repository where you create the commit.
    --set-file-modes=: The file modes to update for files in this commit.
documentation:
    command: Creates a commit for a repository on the tip of a specified branch.
    flag:
        author-name: The name of the author who created the commit. This information is used as both the author and committer for the commit.
        branch-name: The name of the branch where you create the commit.
        commit-message: The commit message you want to include in the commit. Commit messages are limited to 256 KB. If no message is specified, a default message is used.
        delete-files: The files to delete in this commit. These files still exist in earlier commits.
        email: The email address of the person who created the commit.
        keep-empty-folders: If the commit contains deletions, whether to keep a folder or folder structure if the changes leave the folders empty. If true, a ..gitkeep file is created for empty folders. The default is false.
        parent-commit-id: The ID of the commit that is the parent of the commit you create. Not required if this is an empty repository.
        put-files: The files to add or update in this commit.
        repository-name: The name of the repository where you create the commit.
        set-file-modes: The file modes to update for files in this commit.
