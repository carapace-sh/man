name: list-managed-notification-configurations
description: Returns a list of Managed Notification Configurations according to specified filters, ordered by creation time in reverse chronological order (newest first).
flags:
    --channel-identifier=: The identifier or ARN of the notification channel to filter configurations by.
    --max-results=: The maximum number of results to be returned in this call.
    --next-token=: The start token for paginated calls.
documentation:
    command: Returns a list of Managed Notification Configurations according to specified filters, ordered by creation time in reverse chronological order (newest first).
    flag:
        channel-identifier: The identifier or ARN of the notification channel to filter configurations by.
        max-results: The maximum number of results to be returned in this call. Defaults to 20.
        next-token: The start token for paginated calls. Retrieved from the response of a previous ListManagedNotificationChannelAssociations call. Next token uses Base64 encoding.
