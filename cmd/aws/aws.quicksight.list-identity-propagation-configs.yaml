name: list-identity-propagation-configs
description: Lists all services and authorized targets that the Quick Sight IAM Identity Center application can access.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contain the identity propagation configurations of.
    --max-results=: The maximum number of results to be returned.
    --next-token=: The token for the next set of results, or null if there are no more results.
documentation:
    command: |-
        Lists all services and authorized targets that the Quick Sight IAM Identity Center application can access.

        This operation is only supported for Quick Sight accounts that use IAM Identity Center.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contain the identity propagation configurations of.
        max-results: The maximum number of results to be returned.
        next-token: The token for the next set of results, or null if there are no more results.
