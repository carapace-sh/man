name: update-connection
description: Updates the information for an existing connection.
flags:
    --connected-link-id=: The ID of the link for the second device in the connection.
    --connection-id=!: The ID of the connection.
    --description=: A description of the connection.
    --global-network-id=!: The ID of the global network.
    --link-id=: The ID of the link for the first device in the connection.
documentation:
    command: Updates the information for an existing connection. To remove information for any of the parameters, specify an empty string.
    flag:
        connected-link-id: The ID of the link for the second device in the connection.
        connection-id: The ID of the connection.
        description: |-
            A description of the connection.

            Length Constraints: Maximum length of 256 characters.
        global-network-id: The ID of the global network.
        link-id: The ID of the link for the first device in the connection.
