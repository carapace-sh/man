name: update-environment
description: Updates the specified environment in Amazon DataZone.
flags:
    --blueprint-version=: The blueprint version to which the environment should be updated.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description to be updated as part of the `UpdateEnvironment` action.
    --domain-identifier=!: The identifier of the domain in which the environment is to be updated.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --glossary-terms=: The glossary terms to be updated as part of the `UpdateEnvironment` action.
    --identifier=!: The identifier of the environment that is to be updated.
    --name=: The name to be updated as part of the `UpdateEnvironment` action.
    --user-parameters=: The user parameters of the environment.
documentation:
    command: Updates the specified environment in Amazon DataZone.
    flag:
        blueprint-version: 'The blueprint version to which the environment should be updated. You can only specify the following string for this parameter: `latest`.'
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description to be updated as part of the `UpdateEnvironment` action.
        domain-identifier: The identifier of the domain in which the environment is to be updated.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        glossary-terms: The glossary terms to be updated as part of the `UpdateEnvironment` action.
        identifier: The identifier of the environment that is to be updated.
        name: The name to be updated as part of the `UpdateEnvironment` action.
        user-parameters: The user parameters of the environment.
