name: update-knowledge-base-template-uri
description: Updates the template URI of a knowledge base.
flags:
    --knowledge-base-id=!: The identifier of the knowledge base.
    --template-uri=!: The template URI to update.
documentation:
    command: Updates the template URI of a knowledge base. This is only supported for knowledge bases of type EXTERNAL. Include a single variable in `${variable}` format; this interpolated by Amazon Q in Connect using ingested content. For example, if you ingest a Salesforce article, it has an `Id` value, and you can set the template URI to `https://myInstanceName.lightning.force.com/lightning/r/Knowledge__kav/*${Id}*/view`.
    flag:
        knowledge-base-id: The identifier of the knowledge base. This should not be a QUICK\_RESPONSES type knowledge base. Can be either the ID or the ARN. URLs cannot contain the ARN.
        template-uri: The template URI to update.
