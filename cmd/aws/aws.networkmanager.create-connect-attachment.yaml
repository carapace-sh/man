name: create-connect-attachment
description: Creates a core network Connect attachment from a specified core network attachment.
flags:
    --client-token=: The client token associated with the request.
    --core-network-id=!: The ID of a core network where you want to create the attachment.
    --edge-location=!: The Region where the edge is located.
    --options=!: Options for creating an attachment.
    --tags=: The list of key-value tags associated with the request.
    --transport-attachment-id=!: The ID of the attachment between the two connections.
documentation:
    command: |-
        Creates a core network Connect attachment from a specified core network attachment.

        A core network Connect attachment is a GRE-based tunnel attachment that you can use to establish a connection between a core network and an appliance. A core network Connect attachment uses an existing VPC attachment as the underlying transport mechanism.
    flag:
        client-token: The client token associated with the request.
        core-network-id: The ID of a core network where you want to create the attachment.
        edge-location: The Region where the edge is located.
        options: Options for creating an attachment.
        tags: The list of key-value tags associated with the request.
        transport-attachment-id: The ID of the attachment between the two connections.
