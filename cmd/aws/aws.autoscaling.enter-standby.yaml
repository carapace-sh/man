name: enter-standby
description: Moves the specified instances into the standby state.
flags:
    --auto-scaling-group-name=!: The name of the Auto Scaling group.
    --instance-ids=: The IDs of the instances.
    --should-decrement-desired-capacity=!: Indicates whether to decrement the desired capacity of the Auto Scaling group by the number of instances moved to `Standby` mode.
documentation:
    command: |-
        Moves the specified instances into the standby state.

        If you choose to decrement the desired capacity of the Auto Scaling group, the instances can enter standby as long as the desired capacity of the Auto Scaling group after the instances are placed into standby is equal to or greater than the minimum capacity of the group.

        If you choose not to decrement the desired capacity of the Auto Scaling group, the Auto Scaling group launches new instances to replace the instances on standby.

        For more information, see [Temporarily removing instances from your Auto Scaling group](https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-enter-exit-standby.html) in the *Amazon EC2 Auto Scaling User Guide*.
    flag:
        auto-scaling-group-name: The name of the Auto Scaling group.
        instance-ids: The IDs of the instances. You can specify up to 20 instances.
        should-decrement-desired-capacity: Indicates whether to decrement the desired capacity of the Auto Scaling group by the number of instances moved to `Standby` mode.
