name: add-product
description: '*(ALPHA)*  Add a product to the specified product set.'
flags:
    --location=: The location of product set.
    --product=!: The id of the product to add to the product set.
documentation:
    command: '*(ALPHA)*  Add a product to the specified product set. One product can be added to at most 100 product sets.'
    flag:
        location: |-
            The location of product set.
            +
            To set the `location` attribute:
            * provide the argument `product_set` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        product: |-
            The id of the product to add to the product set. The product must be in the same project
            and location as the specified product set.
