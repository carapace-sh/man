name: create-opt-out-list
description: Creates a new opt-out list.
flags:
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --opt-out-list-name=!: The name of the new OptOutList.
    --tags=: An array of tags (key and value pairs) to associate with the new OptOutList.
documentation:
    command: |-
        Creates a new opt-out list.

        If the opt-out list name already exists, an error is returned.

        An opt-out list is a list of phone numbers that are opted out, meaning you can't send SMS or voice messages to them. If end user replies with the keyword "STOP," an entry for the phone number is added to the opt-out list. In addition to STOP, your recipients can use any supported opt-out keyword, such as CANCEL or OPTOUT. For a list of supported opt-out keywords, see [SMS opt out](https://docs.aws.amazon.com/pinpoint/latest/userguide/channels-sms-manage.html#channels-sms-manage-optout) in the End User MessagingSMS User Guide.
    flag:
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you don't specify a client token, a randomly generated token is used for the request to ensure idempotency.
        opt-out-list-name: The name of the new OptOutList.
        tags: An array of tags (key and value pairs) to associate with the new OptOutList.
