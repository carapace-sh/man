name: remove-permission
description: Revokes function-use permission from an Amazon Web Services service or another Amazon Web Services account.
flags:
    --function-name=!: The name or ARN of the Lambda function, version, or alias.
    --qualifier=: Specify a version or alias to remove permissions from a published version of the function.
    --revision-id=: Update the policy only if the revision ID matches the ID that's specified.
    --statement-id=!: Statement ID of the permission to remove.
documentation:
    command: Revokes function-use permission from an Amazon Web Services service or another Amazon Web Services account. You can get the ID of the statement from the output of [GetPolicy]().
    flag:
        function-name: |-
            The name or ARN of the Lambda function, version, or alias.

            **Name formats**

            - **Function name** – `my-function` (name-only), `my-function:v1` (with alias).
            - **Function ARN** – `arn:aws:lambda:us-west-2:123456789012:function:my-function`.
            - **Partial ARN** – `123456789012:function:my-function`.

            You can append a version number or alias to any of the formats. The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        qualifier: Specify a version or alias to remove permissions from a published version of the function.
        revision-id: Update the policy only if the revision ID matches the ID that's specified. Use this option to avoid modifying a policy that has changed since you last read it.
        statement-id: Statement ID of the permission to remove.
