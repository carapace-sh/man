name: list
description: '*(BETA)*  List the publisher models in Model Garden.'
flags:
    --can-deploy-hugging-face-models: Whether to only list Hugging Face models that can be deployed.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --full-resource-name: Whether to return the full resource name of the model.
    --limit=: Maximum number of resources to list.
    --model-filter=: Filter to apply to the model names or the display names of the list of models.
    --no-can-deploy-hugging-face-models&: Whether to only list Hugging Face models that can be deployed.
    --no-full-resource-name&: Whether to return the full resource name of the model.
    --page-size=: Some services group resource list output into pages.
    --sort-by=: Comma-separated list of resource field key names to sort by.
documentation:
    command: |-
        *(BETA)*  This command lists either all models in Model Garden or all Hugging
        Face models supported by Model Garden.

        ## EXAMPLES

        To list all models in Model Garden, run:

          $ gcloud ai model-garden models list

        To list Hugging Face models that can be deployed in Model Garden, run:

          $ gcloud ai model-garden models list --can-deploy-hugging-face-models

        To list models with `gemma` in their names, run:

          $ gcloud ai model-garden models list --model-filter=gemma

        Note: Since the number of Hugging Face models is large, the default limit is
        set to 500 with a page size of 100 when listing supported Hugging Face models.
        To override the limit or page size, specify the --limit or --page-size flags,
        respectively. To list all models in Model Garden, use `--limit=unlimited`.
    flag:
        can-deploy-hugging-face-models: Whether to only list Hugging Face models that can be deployed.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        full-resource-name: Whether to return the full resource name of the model.
        limit: |-
            Maximum number of resources to list. The default is *1000*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        model-filter: Filter to apply to the model names or the display names of the list of models.
        no-can-deploy-hugging-face-models: Whether to only list Hugging Face models that can be deployed.
        no-full-resource-name: Whether to return the full resource name of the model.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
