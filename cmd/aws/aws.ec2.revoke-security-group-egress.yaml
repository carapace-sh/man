name: revoke-security-group-egress
description: Removes the specified outbound (egress) rules from the specified security group.
flags:
    --cidr-ip=: Not supported.
    --cidr=: The IPv4 address range, in CIDR format
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --from-port=: Not supported.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-id=!: The ID of the security group.
    --group-owner=: The AWS account ID that owns the source security group
    --ip-permissions=:
        description: The sets of IP permissions.
        nargs: -1
    --ip-protocol=: Not supported.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --port=: The range of ports to allow or ICMP code
    --protocol=: The IP protoco
    --security-group-rule-ids=:
        description: The IDs of the security group rules.
        nargs: -1
    --source-group=: The name or ID of the source security group
    --source-security-group-name=: Not supported.
    --source-security-group-owner-id=: Not supported.
    --to-port=: Not supported.
documentation:
    command: |-
        Removes the specified outbound (egress) rules from the specified security group.

        You can specify rules using either rule IDs or security group rule properties. If you use rule properties, the values that you specify (for example, ports) must match the existing rule's values exactly. Each rule has a protocol, from and to ports, and destination (CIDR range, security group, or prefix list). For the TCP and UDP protocols, you must also specify the destination port or range of ports. For the ICMP protocol, you must also specify the ICMP type and code. If the security group rule has a description, you do not need to specify the description to revoke the rule.

        For a default VPC, if the values you specify do not match the existing rule's values, no error is returned, and the output describes the security group rules that were not revoked.

        Amazon Web Services recommends that you describe the security group to verify that the rules were removed.

        Rule changes are propagated to instances within the security group as quickly as possible. However, a small delay might occur.
    flag:
        cidr-ip: Not supported. Use a set of IP permissions to specify the CIDR.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        from-port: Not supported. Use a set of IP permissions to specify the port.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-id: The ID of the security group.
        ip-permissions: The sets of IP permissions. You can't specify a destination security group and a CIDR IP address range in the same set of permissions.
        ip-protocol: Not supported. Use a set of IP permissions to specify the protocol name or number.
        security-group-rule-ids: The IDs of the security group rules.
        source-security-group-name: Not supported. Use a set of IP permissions to specify a destination security group.
        source-security-group-owner-id: Not supported. Use a set of IP permissions to specify a destination security group.
        to-port: Not supported. Use a set of IP permissions to specify the port.
