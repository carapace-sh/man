name: list-suite-definitions
description: Lists the Device Advisor test suites you have created.
flags:
    --max-results=: The maximum number of results to return at once.
    --next-token=: A token used to get the next set of results.
documentation:
    command: |-
        Lists the Device Advisor test suites you have created.

        Requires permission to access the [ListSuiteDefinitions](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at once.
        next-token: A token used to get the next set of results.
