name: update
description: Update scopes.
flags:
    --location=: The location id of the scope resource.
    --log-scope=: The full resource name of the `LogScope`.
documentation:
    command: Update a scope
    flag:
        location: |-
            The location id of the scope resource.
            +
            To set the `location` attribute:
            * provide the argument `scope` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        log-scope: |-
            The full resource name of the `LogScope`. For example:
            +
                //logging.googleapis.com/projects/myproject/locations/global/logScopes/my-log-scope
