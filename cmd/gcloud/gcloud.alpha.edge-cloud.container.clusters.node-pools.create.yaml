name: create
description: '*(ALPHA)*  Create an Edge Container node pool.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cluster=: Cluster of the node pool.
    --labels=: List of label KEY=VALUE pairs to add.
    --local-disk-kms-key=: Google Cloud KMS key that will be used to secure local disks on nodes
    --location=: Google Cloud location for the node pool.
    --lro-timeout=: Overwrite the default LRO maximum timeout.
    --machine-filter=: Only machines matching this filter will be allowed to join the node
    --no-async&: Return immediately, without waiting for the operation in progress to
    --node-count=!: Default nodeCount used by this node pool.
    --node-labels=: Comma-delimited list of key-value pairs that comprise labels for the
    --node-location=!: Google Edge Cloud zone where nodes in this node pool will be created.
    --node-storage-schema=: Name for the storage schema of worker nodes.
    --node-system-partition-size-gib=&: ""
completion:
    flag:
        node-system-partition-size-gib:
            - "100"
            - "300"
documentation:
    command: '*(ALPHA)*  Create an Edge Container node pool.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster: |-
            Cluster of the node pool.
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        local-disk-kms-key: |-
            Google Cloud KMS key that will be used to secure local disks on nodes
            in this node pool. The Edge Container service account for this project
            must have `roles/cloudkms.cryptoKeyEncrypterDecrypter` on the key.
            +
            If not provided, a Google-managed key will be used instead.
        location: |-
            Google Cloud location for the node pool.
            +
            To set the `location` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        lro-timeout: Overwrite the default LRO maximum timeout.
        machine-filter: |-
            Only machines matching this filter will be allowed to join the node
            pool. The filtering language accepts strings like "name=<name>", and is
            documented in more detail at https://google.aip.dev/160.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        node-count: Default nodeCount used by this node pool.
        node-labels: |-
            Comma-delimited list of key-value pairs that comprise labels for the
            individual nodes in the node pool. This flag sets the Kubernetes
            labels, unlike `--labels` which sets the cloud resource labels.
        node-location: Google Edge Cloud zone where nodes in this node pool will be created.
        node-storage-schema: Name for the storage schema of worker nodes.
        node-system-partition-size-gib: |
            Specifies the system partition size in GiB for the worker nodes. This
            parameter is optional. Valid values are 100 and 300 to set the system
            partition size to 100GiB and 300GiB, respectively. If this parameter is
            not specified, the system partition is created using the default size
            specified in the system storage schema applicable to the worker nodes.
