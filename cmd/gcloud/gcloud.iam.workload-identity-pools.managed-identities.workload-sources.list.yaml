name: list
description: List workload identity pool managed identity workload sources.
hidden: true
flags:
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --location=: The location name.
    --managed-identity=!: ID of the workload identity pool managed identity or fully qualified identifier for the workload identity pool managed identity.
    --namespace=: The ID to use for the namespace.
    --page-size=: Some services group resource list output into pages.
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --workload-identity-pool=: The ID to use for the pool, which becomes the final component of the resource name.
documentation:
    command: List workload identity pool managed identity workload sources.
    flag:
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `--managed-identity` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        managed-identity: |-
            ID of the workload identity pool managed identity or fully qualified identifier for the workload identity pool managed identity.
            +
            To set the `managed-identity` attribute:
            * provide the argument `--managed-identity` on the command line.
        namespace: |-
            The ID to use for the namespace. This value must be 2-63 characters, and may contain the
            characters [a-z0-9-]. The prefix `gcp-` is reserved for use by Google, and may not be
            specified.
            +

            To set the `namespace` attribute:
            * provide the argument `--managed-identity` on the command line with a fully specified name;
            * provide the argument `--namespace` on the command line.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        workload-identity-pool: |-
            The ID to use for the pool, which becomes the final component of the resource name. This value
            should be 4-32 characters, and may contain the characters [a-z0-9-]. The prefix `gcp-` is
            reserved for use by Google, and may not be specified.
            +

            To set the `workload-identity-pool` attribute:
            * provide the argument `--managed-identity` on the command line with a fully specified name;
            * provide the argument `--workload-identity-pool` on the command line.
