name: update
description: '*(ALPHA)*  Update a Managed Service for Apache Kafka consumer group.'
flags:
    --cluster=: The cluster name.
    --location=: ID of the location of the Managed Service for Apache Kafka resource.
    --topics-file=!: The path to the JSON or YAML file containing the configuration of the topics to be updated for
documentation:
    command: |
        *(ALPHA)*  Update a Managed Service for Apache Kafka consumer group.
    flag:
        cluster: |-
            The cluster name.
            +

            To set the `cluster` attribute:
            * provide the argument `consumer_group` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        location: |-
            ID of the location of the Managed Service for Apache Kafka resource. See
            https://cloud.google.com/managed-service-for-apache-kafka/docs/locations for a list of supported
            locations.
            +

            To set the `location` attribute:
            * provide the argument `consumer_group` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        topics-file: |-
            The path to the JSON or YAML file containing the configuration of the topics to be updated for
            the consumer group. This also supports inline JSON or YAML. Required, sets `topics_file` value.
            +
            :::
            *Input Example:*
            +
            ```
            +
            --topics-file=string
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --topics-file=path_to_file.(yaml|json)
            +
            ```
