name: associate-service-action-with-provisioning-artifact
description: Associates a self-service action with a provisioning artifact.
flags:
    --accept-language=: The language code.
    --idempotency-token=: A unique identifier that you provide to ensure idempotency.
    --product-id=!: The product identifier.
    --provisioning-artifact-id=!: The identifier of the provisioning artifact.
    --service-action-id=!: The self-service action identifier.
documentation:
    command: Associates a self-service action with a provisioning artifact.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        idempotency-token: A unique identifier that you provide to ensure idempotency. If multiple requests from the same Amazon Web Services account use the same idempotency token, the same response is returned for each repeated request.
        product-id: The product identifier. For example, `prod-abcdzk7xy33qa`.
        provisioning-artifact-id: The identifier of the provisioning artifact. For example, `pa-4abcdjnxjj6ne`.
        service-action-id: The self-service action identifier. For example, `act-fs7abcd89wxyz`.
