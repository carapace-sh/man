name: create
description: Create a Cloud NetApp Volumes KMS Config.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: A description of the Cloud NetApp KMS Config
    --kms-key=!: ID of the kms_key or fully qualified identifier for the kms_key.
    --kms-keyring=: The KMS keyring of the kms_key
    --kms-location=: The Cloud location for the kms_key.
    --kms-project=: The Cloud project for the kms_key.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the kms_config.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        Creates a KMS (Key Management System) Config to encrypt Cloud NetApp Volumes, Storage Pools etc. using Customer Managed Encryption Keys (CMEK)
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: A description of the Cloud NetApp KMS Config
        kms-key: |-
            ID of the kms_key or fully qualified identifier for the kms_key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key` on the command line.
        kms-keyring: |-
            The KMS keyring of the kms_key
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-location: |-
            The Cloud location for the kms_key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        kms-project: |-
            The Cloud project for the kms_key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line;
            * set the property `core/project`.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the kms_config.
            +
            To set the `location` attribute:
            * provide the argument `kms_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
