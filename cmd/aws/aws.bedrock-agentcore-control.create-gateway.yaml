name: create-gateway
description: Creates a gateway for Amazon Bedrock Agent.
flags:
    --authorizer-configuration=!: The authorizer configuration for the gateway.
    --authorizer-type=!: The type of authorizer to use for the gateway.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --description=: The description of the gateway.
    --exception-level=: The level of detail in error messages returned when invoking the gateway.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-arn=: The Amazon Resource Name (ARN) of the KMS key used to encrypt data associated with the gateway.
    --name=!: The name of the gateway.
    --protocol-configuration=: The configuration settings for the protocol specified in the `protocolType` parameter.
    --protocol-type=!: The protocol type for the gateway.
    --role-arn=!: The Amazon Resource Name (ARN) of the IAM role that provides permissions for the gateway to access Amazon Web Services services.
    --tags=: A map of key-value pairs to associate with the gateway as metadata tags.
completion:
    flag:
        authorizer-type:
            - CUSTOM_JWT
        exception-level:
            - DEBUG
        protocol-type:
            - MCP
documentation:
    command: |-
        Creates a gateway for Amazon Bedrock Agent. A gateway serves as an integration point between your agent and external services.

        To create a gateway, you must specify a name, protocol type, and IAM role. The role grants the gateway permission to access Amazon Web Services services and resources.
    flag:
        authorizer-configuration: The authorizer configuration for the gateway.
        authorizer-type: The type of authorizer to use for the gateway.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, the service ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        description: The description of the gateway.
        exception-level: |-
            The level of detail in error messages returned when invoking the gateway.

            - If the value is `DEBUG`, granular exception messages are returned to help a user debug the gateway.
            - If the value is omitted, a generic error message is returned to the end user.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-arn: The Amazon Resource Name (ARN) of the KMS key used to encrypt data associated with the gateway.
        name: The name of the gateway. The name must be unique within your account.
        protocol-configuration: The configuration settings for the protocol specified in the `protocolType` parameter.
        protocol-type: The protocol type for the gateway.
        role-arn: The Amazon Resource Name (ARN) of the IAM role that provides permissions for the gateway to access Amazon Web Services services.
        tags: A map of key-value pairs to associate with the gateway as metadata tags.
