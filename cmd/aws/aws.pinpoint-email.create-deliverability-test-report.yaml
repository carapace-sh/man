name: create-deliverability-test-report
description: Create a new predictive inbox placement test.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --content=!: The HTML body of the message that you sent when you performed the predictive inbox placement test.
    --from-email-address=!: The email address that the predictive inbox placement test email was sent from.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --report-name=: A unique name that helps you to identify the predictive inbox placement test when you retrieve the results.
    --tags=: An array of objects that define the tags (keys and values) that you want to associate with the predictive inbox placement test.
documentation:
    command: Create a new predictive inbox placement test. Predictive inbox placement tests can help you predict how your messages will be handled by various email providers around the world. When you perform a predictive inbox placement test, you provide a sample message that contains the content that you plan to send to your customers. Amazon Pinpoint then sends that message to special email addresses spread across several major email providers. After about 24 hours, the test is complete, and you can use the `GetDeliverabilityTestReport` operation to view the results of the test.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        content: The HTML body of the message that you sent when you performed the predictive inbox placement test.
        from-email-address: The email address that the predictive inbox placement test email was sent from.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        report-name: A unique name that helps you to identify the predictive inbox placement test when you retrieve the results.
        tags: An array of objects that define the tags (keys and values) that you want to associate with the predictive inbox placement test.
