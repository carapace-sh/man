name: remove-rotation-schedule
description: '*(BETA)*  Remove the rotation schedule for a key.'
flags:
    --keyring=: The KMS keyring of the key.
    --location=: The Google Cloud location for the key.
documentation:
    command: |-
        *(BETA)*  Removes the rotation schedule for the given key.

        ## EXAMPLES

        The following command removes the rotation schedule for the key
        named `frodo` within the keyring `fellowship` and location `global`:

          $ gcloud beta kms keys remove-rotation-schedule frodo \
              --location=global \
              --keyring=fellowship
    flag:
        keyring: |-
            The KMS keyring of the key.
            +
            To set the `keyring` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--keyring` on the command line.
        location: |-
            The Google Cloud location for the key.
            +
            To set the `location` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
