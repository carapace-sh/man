name: add-cache
description: Configures one or more gateway local disks as cache for a gateway.
flags:
    --disk-ids=!: An array of strings that identify disks that are to be configured as working storage.
    --gateway-arn=!: ""
documentation:
    command: |-
        Configures one or more gateway local disks as cache for a gateway. This operation is only supported in the cached volume, tape, and file gateway type (see [How Storage Gateway works (architecture)](https://docs.aws.amazon.com/storagegateway/latest/userguide/StorageGatewayConcepts.html).

        In the request, you specify the gateway Amazon Resource Name (ARN) to which you want to add cache, and one or more disk IDs that you want to configure as cache.
    flag:
        disk-ids: An array of strings that identify disks that are to be configured as working storage. Each string has a minimum length of 1 and maximum length of 300. You can get the disk IDs from the [ListLocalDisks]() API.
        gateway-arn: ""
