name: create-rest-api
description: Creates a new RestApi resource.
flags:
    --api-key-source=: The source of the API key for metering requests according to a usage plan.
    --api-version=: A version identifier for the API.
    --binary-media-types=:
        description: The list of binary media types supported by the RestApi.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --clone-from=: The ID of the RestApi that you want to clone from.
    --description=: The description of the RestApi.
    --disable-execute-api-endpoint: Specifies whether clients can invoke your API by using the default `execute-api` endpoint.
    --endpoint-access-mode=: The endpoint access mode of the RestApi.
    --endpoint-configuration=: The endpoint configuration of this RestApi showing the endpoint types and IP address types of the API.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --minimum-compression-size=: A nullable integer that is used to enable compression (with non-negative between 0 and 10485760 (10M) bytes, inclusive) or disable compression (with a null value) on an API.
    --name=!: The name of the RestApi.
    --no-disable-execute-api-endpoint: Specifies whether clients can invoke your API by using the default `execute-api` endpoint.
    --policy=: A stringified JSON policy document that applies to this RestApi regardless of the caller and Method configuration.
    --security-policy=: The Transport Layer Security (TLS) version + cipher suite for this RestApi.
    --tags=: The key-value map of strings.
completion:
    flag:
        api-key-source:
            - HEADER
            - AUTHORIZER
        endpoint-access-mode:
            - BASIC
            - STRICT
        security-policy:
            - TLS_1_0
            - TLS_1_2
            - SecurityPolicy_TLS13_1_3_2025_09
            - SecurityPolicy_TLS13_1_3_FIPS_2025_09
            - SecurityPolicy_TLS13_1_2_PFS_PQ_2025_09
            - SecurityPolicy_TLS13_1_2_FIPS_PQ_2025_09
            - SecurityPolicy_TLS13_1_2_PQ_2025_09
            - SecurityPolicy_TLS13_1_2_2021_06
            - SecurityPolicy_TLS13_2025_EDGE
            - SecurityPolicy_TLS12_PFS_2025_EDGE
            - SecurityPolicy_TLS12_2018_EDGE
documentation:
    command: Creates a new RestApi resource.
    flag:
        api-key-source: 'The source of the API key for metering requests according to a usage plan. Valid values are: `HEADER` to read the API key from the `X-API-Key` header of a request. `AUTHORIZER` to read the API key from the `UsageIdentifierKey` from a custom authorizer.'
        api-version: A version identifier for the API.
        binary-media-types: The list of binary media types supported by the RestApi. By default, the RestApi supports only UTF-8-encoded text payloads.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        clone-from: The ID of the RestApi that you want to clone from.
        description: The description of the RestApi.
        disable-execute-api-endpoint: Specifies whether clients can invoke your API by using the default `execute-api` endpoint. By default, clients can invoke your API with the default `https://{api_id}.execute-api.{region}.amazonaws.com` endpoint. To require that clients use a custom domain name to invoke your API, disable the default endpoint
        endpoint-access-mode: The endpoint access mode of the RestApi. Only available for RestApis that use security policies that start with `SecurityPolicy_`.
        endpoint-configuration: The endpoint configuration of this RestApi showing the endpoint types and IP address types of the API.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        minimum-compression-size: A nullable integer that is used to enable compression (with non-negative between 0 and 10485760 (10M) bytes, inclusive) or disable compression (with a null value) on an API. When compression is enabled, compression or decompression is not applied on the payload if the payload size is smaller than this value. Setting it to zero allows compression for any payload size.
        name: The name of the RestApi.
        policy: A stringified JSON policy document that applies to this RestApi regardless of the caller and Method configuration.
        security-policy: The Transport Layer Security (TLS) version + cipher suite for this RestApi.
        tags: The key-value map of strings. The valid character set is \[a-zA-Z+-=.\_:/]. The tag key can be up to 128 characters and must not start with `aws:`. The tag value can be up to 256 characters.
