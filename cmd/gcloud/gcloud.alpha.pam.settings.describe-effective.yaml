name: describe-effective
description: '*(ALPHA)*  Show effective Privileged Access Manager (PAM) settings on a resource.'
flags:
    --folder=: The name of the folder
    --location=!: ID of the location or fully qualified identifier for the location.
    --organization=: The name of the organization
documentation:
    command: |
        *(ALPHA)*  Show effective Privileged Access Manager (PAM) settings on a resource. The "effective value"
        of a setting on a given resource refers to the final or active value of a setting
        configuration that is applied to a resource.  For each configuration type field in settings
        resource, a hierarchy evaluation will happen to calculate effective value on the resource
        node.
    flag:
        folder: |-
            The name of the folder
            +
            To set the `folder` attribute:
            * provide the argument `--location` on the command line with a fully specified name;
            * provide the argument `--folder` on the command line. Must be specified for resource of type [privilegedaccessmanager.folders.locations].
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        organization: |-
            The name of the organization
            +
            To set the `organization` attribute:
            * provide the argument `--location` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line. Must be specified for resource of type [privilegedaccessmanager.organizations.locations].
