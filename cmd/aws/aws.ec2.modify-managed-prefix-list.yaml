name: modify-managed-prefix-list
description: Modifies the specified managed prefix list.
flags:
    --add-entries=:
        description: One or more entries to add to the prefix list.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --current-version=: The current version of the prefix list.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ipam-prefix-list-resolver-sync-enabled: Indicates whether synchronization with an IPAM prefix list resolver should be enabled for this managed prefix list.
    --max-entries=: The maximum number of entries for the prefix list.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-ipam-prefix-list-resolver-sync-enabled: Indicates whether synchronization with an IPAM prefix list resolver should be enabled for this managed prefix list.
    --prefix-list-id=!: The ID of the prefix list.
    --prefix-list-name=: A name for the prefix list.
    --remove-entries=:
        description: One or more entries to remove from the prefix list.
        nargs: -1
documentation:
    command: |-
        Modifies the specified managed prefix list.

        Adding or removing entries in a prefix list creates a new version of the prefix list. Changing the name of the prefix list does not affect the version.

        If you specify a current version number that does not match the true current version number, the request fails.
    flag:
        add-entries: One or more entries to add to the prefix list.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        current-version: The current version of the prefix list.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ipam-prefix-list-resolver-sync-enabled: Indicates whether synchronization with an IPAM prefix list resolver should be enabled for this managed prefix list. When enabled, the prefix list CIDRs are automatically updated based on the associated resolver's CIDR selection rules.
        max-entries: |-
            The maximum number of entries for the prefix list. You cannot modify the entries of a prefix list and modify the size of a prefix list at the same time.

            If any of the resources that reference the prefix list cannot support the new maximum size, the modify operation fails. Check the state message for the IDs of the first ten resources that do not support the new maximum size.
        prefix-list-id: The ID of the prefix list.
        prefix-list-name: A name for the prefix list.
        remove-entries: One or more entries to remove from the prefix list.
