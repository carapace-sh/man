name: put-runtime-management-config
description: Sets the runtime management configuration for a function's version.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --function-name=!: The name or ARN of the Lambda function.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --qualifier=: Specify a version of the function.
    --runtime-version-arn=: The ARN of the runtime version you want the function to use.
    --update-runtime-on=!: Specify the runtime update mode.
completion:
    flag:
        update-runtime-on:
            - Auto
            - Manual
            - FunctionUpdate
documentation:
    command: Sets the runtime management configuration for a function's version. For more information, see [Runtime updates](https://docs.aws.amazon.com/lambda/latest/dg/runtimes-update.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        function-name: |-
            The name or ARN of the Lambda function.

            **Name formats**

            - **Function name** – `my-function`.
            - **Function ARN** – `arn:aws:lambda:us-west-2:123456789012:function:my-function`.
            - **Partial ARN** – `123456789012:function:my-function`.

            The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        qualifier: Specify a version of the function. This can be `$LATEST` or a published version number. If no value is specified, the configuration for the `$LATEST` version is returned.
        runtime-version-arn: |-
            The ARN of the runtime version you want the function to use.

            This is only required if you're using the **Manual** runtime update mode.
        update-runtime-on: |-
            Specify the runtime update mode.

            - **Auto (default)** - Automatically update to the most recent and secure runtime version using a [Two-phase runtime version rollout](https://docs.aws.amazon.com/lambda/latest/dg/runtimes-update.html#runtime-management-two-phase). This is the best choice for most customers to ensure they always benefit from runtime updates.
            - **Function update** - Lambda updates the runtime of your function to the most recent and secure runtime version when you update your function. This approach synchronizes runtime updates with function deployments, giving you control over when runtime updates are applied and allowing you to detect and mitigate rare runtime update incompatibilities early. When using this setting, you need to regularly update your functions to keep their runtime up-to-date.
            - **Manual** - You specify a runtime version in your function configuration. The function will use this runtime version indefinitely. In the rare case where a new runtime version is incompatible with an existing function, this allows you to roll back your function to an earlier runtime version. For more information, see [Roll back a runtime version](https://docs.aws.amazon.com/lambda/latest/dg/runtimes-update.html#runtime-management-rollback).
