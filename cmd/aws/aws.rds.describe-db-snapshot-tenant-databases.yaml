name: describe-db-snapshot-tenant-databases
description: Describes the tenant databases that exist in a DB snapshot.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-instance-identifier=: The ID of the DB instance used to create the DB snapshots.
    --db-snapshot-identifier=: The ID of a DB snapshot that contains the tenant databases to describe.
    --dbi-resource-id=: A specific DB resource identifier to describe.
    --filters=:
        description: A filter that specifies one or more tenant databases to describe.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --marker=: An optional pagination token provided by a previous `DescribeDBSnapshotTenantDatabases` request.
    --max-items=: The  total number of items to return in the command's output.
    --max-records=: The maximum number of records to include in the response.
    --page-size=: The size of each page to get in the AWS service call.
    --snapshot-type=: The type of DB snapshots to be returned.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: |-
        Describes the tenant databases that exist in a DB snapshot. This command only applies to RDS for Oracle DB instances in the multi-tenant configuration.

        You can use this command to inspect the tenant databases within a snapshot before restoring it. You can't directly interact with the tenant databases in a DB snapshot. If you restore a snapshot that was taken from DB instance using the multi-tenant configuration, you restore all its tenant databases.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-instance-identifier: |-
            The ID of the DB instance used to create the DB snapshots. This parameter isn't case-sensitive.

            Constraints:

            - If supplied, must match the identifier of an existing `DBInstance`.
        db-snapshot-identifier: |-
            The ID of a DB snapshot that contains the tenant databases to describe. This value is stored as a lowercase string.

            Constraints:

            - If you specify this parameter, the value must match the ID of an existing DB snapshot.
            - If you specify an automatic snapshot, you must also specify `SnapshotType`.
        dbi-resource-id: A specific DB resource identifier to describe.
        filters: |-
            A filter that specifies one or more tenant databases to describe.

            Supported filters:

            - `tenant-db-name` - Tenant database names. The results list only includes information about the tenant databases that match these tenant DB names.
            - `tenant-database-resource-id` - Tenant database resource identifiers. The results list only includes information about the tenant databases contained within the DB snapshots.
            - `dbi-resource-id` - DB instance resource identifiers. The results list only includes information about snapshots containing tenant databases contained within the DB instances identified by these resource identifiers.
            - `db-instance-id` - Accepts DB instance identifiers and DB instance Amazon Resource Names (ARNs).
            - `db-snapshot-id` - Accepts DB snapshot identifiers.
            - `snapshot-type` - Accepts types of DB snapshots.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        marker: An optional pagination token provided by a previous `DescribeDBSnapshotTenantDatabases` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-records: The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        snapshot-type: |-
            The type of DB snapshots to be returned. You can specify one of the following values:

            - `automated` – All DB snapshots that have been automatically taken by Amazon RDS for my Amazon Web Services account.
            - `manual` – All DB snapshots that have been taken by my Amazon Web Services account.
            - `shared` – All manual DB snapshots that have been shared to my Amazon Web Services account.
            - `public` – All DB snapshots that have been marked as public.
            - `awsbackup` – All DB snapshots managed by the Amazon Web Services Backup service.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
