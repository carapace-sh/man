name: describe-traffic-sources
description: Gets information about the traffic sources for the specified Auto Scaling group.
flags:
    --auto-scaling-group-name=!: The name of the Auto Scaling group.
    --max-records=: The maximum number of items to return with this call.
    --next-token=: The token for the next set of items to return.
    --traffic-source-type=: The traffic source type that you want to describe.
documentation:
    command: |-
        Gets information about the traffic sources for the specified Auto Scaling group.

        You can optionally provide a traffic source type. If you provide a traffic source type, then the results only include that traffic source type.

        If you do not provide a traffic source type, then the results include all the traffic sources for the specified Auto Scaling group.
    flag:
        auto-scaling-group-name: The name of the Auto Scaling group.
        max-records: The maximum number of items to return with this call. The maximum value is `50`.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        traffic-source-type: |-
            The traffic source type that you want to describe.

            The following lists the valid values:

            - `elb` if the traffic source is a Classic Load Balancer.
            - `elbv2` if the traffic source is a Application Load Balancer, Gateway Load Balancer, or Network Load Balancer.
            - `vpc-lattice` if the traffic source is VPC Lattice.
