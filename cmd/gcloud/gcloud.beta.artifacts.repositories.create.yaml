name: create
description: '*(BETA)*  Create an Artifact Registry repository.'
flags:
    --allow-snapshot-overwrites: (Maven only) Allow repository users to publish a snapshot that overwrites the same snapshot version in the repository.
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description for the repository.
    --kms-key=: Name of the encryption key that's used for encrypting the contents of the repository.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Location of the repository.
    --no-allow-snapshot-overwrites&: (Maven only) Allow repository users to publish a snapshot that overwrites the same snapshot version in the repository.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --repository-format=!: Format of the repository.
    --version-policy=: (Maven only) The package versions that the repository will store.
completion:
    flag:
        version-policy:
            - none
            - release
            - snapshot
documentation:
    command: |
        *(BETA)*  Create a new Artifact Registry repository.

        This command can fail for the following reasons:
          * A repository with the same name already exists.
          * The active account does not have permission to create repositories.
          * A valid repository format was not provided.
    flag:
        allow-snapshot-overwrites: (Maven only) Allow repository users to publish a snapshot that overwrites the same snapshot version in the repository.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description for the repository.
        kms-key: Name of the encryption key that's used for encrypting the contents of the repository.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Location of the repository. Overrides the default artifacts/location property value
            for this command invocation. To configure the default location, use the command:
            gcloud config set artifacts/location.
            +

            To set the `location` attribute:
            * provide the argument `repository` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        no-allow-snapshot-overwrites: |
            (Maven only) Allow repository users to publish a snapshot that overwrites the same snapshot version in the repository.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        repository-format: |-
            Format of the repository. REPOSITORY_FORMAT must be one of:
            +
             apt
                APT package format.
             docker
                Docker image format.
             googet
                GooGet package format.
             kfp
                KFP package format.
             maven
                Maven package format.
             npm
                NPM package format.
             python
                Python package format.
             yum
                YUM package format.
        version-policy: |-
            (Maven only) The package versions that the repository will store. _VERSION_POLICY_ must be one of:
            +
            *none*::: (Maven only) The repository doesn't validate the version type.
            *release*::: (Maven only) The repository accepts release versions only.
            *snapshot*::: (Maven only) The repository accepts snapshot versions only.
            :::
            +
