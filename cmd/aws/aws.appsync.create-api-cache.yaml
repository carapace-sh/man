name: create-api-cache
description: Creates a cache for the GraphQL API.
flags:
    --api-caching-behavior=!: Caching behavior.
    --api-id=!: The GraphQL API ID.
    --at-rest-encryption-enabled: At-rest encryption flag for cache.
    --health-metrics-config=: Controls how cache health metrics will be emitted to CloudWatch.
    --no-at-rest-encryption-enabled&: At-rest encryption flag for cache.
    --no-transit-encryption-enabled&: Transit encryption flag when connecting to cache.
    --transit-encryption-enabled: Transit encryption flag when connecting to cache.
    --ttl=!: TTL in seconds for cache entries.
    --type=!: The cache instance type.
completion:
    flag:
        api-caching-behavior:
            - FULL_REQUEST_CACHING
            - PER_RESOLVER_CACHING
            - OPERATION_LEVEL_CACHING
        health-metrics-config:
            - ENABLED
            - DISABLED
        type:
            - T2_SMALL
            - T2_MEDIUM
            - R4_LARGE
            - R4_XLARGE
            - R4_2XLARGE
            - R4_4XLARGE
            - R4_8XLARGE
            - SMALL
            - MEDIUM
            - LARGE
            - XLARGE
            - LARGE_2X
            - LARGE_4X
            - LARGE_8X
            - LARGE_12X
documentation:
    command: Creates a cache for the GraphQL API.
    flag:
        api-caching-behavior: |-
            Caching behavior.

            - **FULL\_REQUEST\_CACHING**: All requests from the same user are cached. Individual resolvers are automatically cached. All API calls will try to return responses from the cache.
            - **PER\_RESOLVER\_CACHING**: Individual resolvers that you specify are cached.
            - **OPERATION\_LEVEL\_CACHING**: Full requests are cached together and returned without executing resolvers.
        api-id: The GraphQL API ID.
        at-rest-encryption-enabled: At-rest encryption flag for cache. You cannot update this setting after creation.
        health-metrics-config: |-
            Controls how cache health metrics will be emitted to CloudWatch. Cache health metrics include:

            - NetworkBandwidthOutAllowanceExceeded: The network packets dropped because the throughput exceeded the aggregated bandwidth limit. This is useful for diagnosing bottlenecks in a cache configuration.
            - EngineCPUUtilization: The CPU utilization (percentage) allocated to the Redis process. This is useful for diagnosing bottlenecks in a cache configuration.

            Metrics will be recorded by API ID. You can set the value to `ENABLED` or `DISABLED`.
        transit-encryption-enabled: Transit encryption flag when connecting to cache. You cannot update this setting after creation.
        ttl: |-
            TTL in seconds for cache entries.

            Valid values are 1–3,600 seconds.
        type: |-
            The cache instance type. Valid values are

            - `SMALL`
            - `MEDIUM`
            - `LARGE`
            - `XLARGE`
            - `LARGE_2X`
            - `LARGE_4X`
            - `LARGE_8X` (not available in all regions)
            - `LARGE_12X`

            Historically, instance types were identified by an EC2-style value. As of July 2020, this is deprecated, and the generic identifiers above should be used.

            The following legacy instance types are available, but their use is discouraged:

            - **T2\_SMALL**: A t2.small instance type.
            - **T2\_MEDIUM**: A t2.medium instance type.
            - **R4\_LARGE**: A r4.large instance type.
            - **R4\_XLARGE**: A r4.xlarge instance type.
            - **R4\_2XLARGE**: A r4.2xlarge instance type.
            - **R4\_4XLARGE**: A r4.4xlarge instance type.
            - **R4\_8XLARGE**: A r4.8xlarge instance type.
