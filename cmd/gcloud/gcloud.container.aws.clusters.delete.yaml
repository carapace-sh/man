name: delete
description: '*(DEPRECATED)*  Delete an Anthos cluster on AWS.'
flags:
    --allow-missing: Allow idempotent deletion of cluster.
    --async: Return immediately, without waiting for the operation in progress to
    --ignore-errors: Force delete an AWS cluster.
    --location=: Google Cloud location for the cluster.
    --no-allow-missing&: Allow idempotent deletion of cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-ignore-errors&: Force delete an AWS cluster.
    --no-validate-only&: Validate the cluster to delete, but don't actually perform it.
    --validate-only: Validate the cluster to delete, but don't actually perform it.
documentation:
    command: |+
        *(DEPRECATED)*  Delete an Anthos cluster on AWS.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/aws/deprecations/deprecation-announcement for more details.

    flag:
        allow-missing: |-
            Allow idempotent deletion of cluster.
              The request will still succeed in case the cluster does not exist.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        ignore-errors: |-
            Force delete an AWS cluster.
              Deletion of the AWS cluster will succeed even if errors occur
              during deleting in-cluster resources. Using this parameter may
              result in orphaned resources in the cluster.
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_aws/location`.
        no-allow-missing: |
            Allow idempotent deletion of cluster.
              The request will still succeed in case the cluster does not exist.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-ignore-errors: |
            Force delete an AWS cluster.
              Deletion of the AWS cluster will succeed even if errors occur
              during deleting in-cluster resources. Using this parameter may
              result in orphaned resources in the cluster.
        no-validate-only: Validate the cluster to delete, but don't actually perform it.
        validate-only: Validate the cluster to delete, but don't actually perform it.
