documentation:
    command: |
        *(ALPHA)*  Update a Cloud Build Connection of type GitHub Enterprise.
    flag:
        app-id: App ID of the GitHub App in the GitHub Enterprise server.
        app-installation-id: Installation ID of the Cloud Build GitHub App.
        app-slug: |-
            App slug (url-friendly name) of the GitHub App. When seeing the configuration
            page of the App (e.g. in https://my-ghe-server.net/settings/apps/my-app), the app-slug
            is the last component of the URL path ("my-app" in that example).
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        host-uri: URI of the GitHub Enterprise server.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        private-key-secret-version: Secret containing the private key of the GitHub App.
        region: |-
            The Google Cloud region.
            +
            To set the `region` attribute:
            * provide the argument `connection` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `builds/region`.
        service-directory-service: Service Directory service resource to use for accessing the GitHub Enterprise Server. Necessary only if the server has no public access from the internet.
        ssl-ca-file: File containing the SSL_CA to be used.
        webhook-secret-secret-version: |-
            Secret containing the webhook secret string for validating webhook events generated by
            the GitHub App.
