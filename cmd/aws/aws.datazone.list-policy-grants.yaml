name: list-policy-grants
description: Lists policy grants.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-identifier=!: The ID of the domain where you want to list policy grants.
    --entity-identifier=!: The ID of the entity for which you want to list policy grants.
    --entity-type=!: The type of entity for which you want to list policy grants.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of grants to return in a single call to `ListPolicyGrants`.
    --next-token=: When the number of grants is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of grants, the response includes a pagination token named `NextToken`.
    --page-size=: The size of each page to get in the AWS service call.
    --policy-type=!: The type of policy that you want to list.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        entity-type:
            - DOMAIN_UNIT
            - ENVIRONMENT_BLUEPRINT_CONFIGURATION
            - ENVIRONMENT_PROFILE
            - ASSET_TYPE
        policy-type:
            - CREATE_DOMAIN_UNIT
            - OVERRIDE_DOMAIN_UNIT_OWNERS
            - ADD_TO_PROJECT_MEMBER_POOL
            - OVERRIDE_PROJECT_OWNERS
            - CREATE_GLOSSARY
            - CREATE_FORM_TYPE
            - CREATE_ASSET_TYPE
            - CREATE_PROJECT
            - CREATE_ENVIRONMENT_PROFILE
            - DELEGATE_CREATE_ENVIRONMENT_PROFILE
            - CREATE_ENVIRONMENT
            - CREATE_ENVIRONMENT_FROM_BLUEPRINT
            - CREATE_PROJECT_FROM_PROJECT_PROFILE
            - USE_ASSET_TYPE
documentation:
    command: Lists policy grants.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-identifier: The ID of the domain where you want to list policy grants.
        entity-identifier: The ID of the entity for which you want to list policy grants.
        entity-type: The type of entity for which you want to list policy grants.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of grants to return in a single call to `ListPolicyGrants`. When the number of grants to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `ListPolicyGrants` to list the next set of grants.
        next-token: When the number of grants is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of grants, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `ListPolicyGrants` to list the next set of grants.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        policy-type: The type of policy that you want to list.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
