name: is-authorized
description: Makes an authorization decision about a service request described in the parameters.
flags:
    --action=: Specifies the requested action to be authorized.
    --context=: Specifies additional context that can be used to make more granular authorization decisions.
    --entities=: (Optional) Specifies the list of resources and principals and their associated attributes that Verified Permissions can examine when evaluating the policies.
    --policy-store-id=!: Specifies the ID of the policy store.
    --principal=: Specifies the principal for which the authorization decision is to be made.
    --resource=: Specifies the resource for which the authorization decision is to be made.
documentation:
    command: Makes an authorization decision about a service request described in the parameters. The information in the parameters can also define additional context that Verified Permissions can include in the evaluation. The request is evaluated against all matching policies in the specified policy store. The result of the decision is either `Allow` or `Deny`, along with a list of the policies that resulted in the decision.
    flag:
        action: Specifies the requested action to be authorized. For example, is the principal authorized to perform this action on the resource?
        context: Specifies additional context that can be used to make more granular authorization decisions.
        entities: |-
            (Optional) Specifies the list of resources and principals and their associated attributes that Verified Permissions can examine when evaluating the policies. These additional entities and their attributes can be referenced and checked by conditional elements in the policies in the specified policy store.

            You can include only principal and resource entities in this parameter; you can't include actions. You must specify actions in the schema.
        policy-store-id: Specifies the ID of the policy store. Policies in this policy store will be used to make an authorization decision for the input.
        principal: Specifies the principal for which the authorization decision is to be made.
        resource: Specifies the resource for which the authorization decision is to be made.
