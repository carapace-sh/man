name: update-findings-feedback
description: Marks the specified GuardDuty findings as useful or not useful.
flags:
    --comments=: Additional feedback about the GuardDuty findings.
    --detector-id=!: The ID of the detector that is associated with the findings for which you want to update the feedback.
    --feedback=!: The feedback for the finding.
    --finding-ids=!: The IDs of the findings that you want to mark as useful or not useful.
completion:
    flag:
        feedback:
            - USEFUL
            - NOT_USEFUL
documentation:
    command: Marks the specified GuardDuty findings as useful or not useful.
    flag:
        comments: Additional feedback about the GuardDuty findings.
        detector-id: |-
            The ID of the detector that is associated with the findings for which you want to update the feedback.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        feedback: The feedback for the finding.
        finding-ids: The IDs of the findings that you want to mark as useful or not useful.
