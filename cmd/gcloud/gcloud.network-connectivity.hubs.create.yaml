name: create
description: Create a new hub.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the hub.
    --export-psc: This boolean controls whether Private Service Connect transitivity is enabled for the hub.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-export-psc&: This boolean controls whether Private Service Connect transitivity is enabled for the hub.
    --policy-mode=: Policy mode of the hub.
    --preset-topology=: Topology of the hub.
completion:
    flag:
        policy-mode:
            - policy-mode-unspecified
            - preset
        preset-topology:
            - hybrid-inspection
            - mesh
            - preset-topology-unspecified
            - star
documentation:
    command: Create a new hub with the given name.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description of the hub.
        export-psc: This boolean controls whether Private Service Connect transitivity is enabled for the hub.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-export-psc: This boolean controls whether Private Service Connect transitivity is enabled for the hub.
        policy-mode: 'Policy mode of the hub. _POLICY_MODE_ must be one of: *policy-mode-unspecified*, *preset*.'
        preset-topology: 'Topology of the hub. Only applicable when ``--policy-mode=PRESET''''. _PRESET_TOPOLOGY_ must be one of: *hybrid-inspection*, *mesh*, *preset-topology-unspecified*, *star*.'
