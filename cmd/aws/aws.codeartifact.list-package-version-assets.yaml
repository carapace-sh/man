name: list-package-version-assets
description: Returns a list of [AssetSummary](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_AssetSummary.html) objects for assets in a package version.
flags:
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the repository associated with the package version assets.
    --format=!: The format of the package that contains the requested package version assets.
    --max-results=: The maximum number of results to return per page.
    --namespace=: The namespace of the package version that contains the requested package version assets.
    --next-token=: The token for the next set of results.
    --package-version=!: A string that contains the package version (for example, `3.5.2`).
    --package=!: The name of the package that contains the requested package version assets.
    --repository=!: The name of the repository that contains the package that contains the requested package version assets.
completion:
    flag:
        format:
            - npm
            - pypi
            - maven
            - nuget
            - generic
            - ruby
            - swift
            - cargo
documentation:
    command: Returns a list of [AssetSummary](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_AssetSummary.html) objects for assets in a package version.
    flag:
        domain: The name of the domain that contains the repository associated with the package version assets.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        format: The format of the package that contains the requested package version assets.
        max-results: The maximum number of results to return per page.
        namespace: |-
            The namespace of the package version that contains the requested package version assets. The package component that specifies its namespace depends on its type. For example:

            The namespace is required requesting assets from package versions of the following formats:

            - Maven
            - Swift
            - generic

            <!--THE END-->

            - The namespace of a Maven package version is its `groupId`.
            - The namespace of an npm or Swift package version is its `scope`.
            - The namespace of a generic package is its `namespace`.
            - Python, NuGet, Ruby, and Cargo package versions do not contain a corresponding component, package versions of those formats do not have a namespace.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        package: The name of the package that contains the requested package version assets.
        package-version: A string that contains the package version (for example, `3.5.2`).
        repository: The name of the repository that contains the package that contains the requested package version assets.
