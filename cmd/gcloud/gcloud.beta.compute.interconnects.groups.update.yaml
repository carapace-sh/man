name: update
description: '*(BETA)*  Update a Compute Engine interconnect group.'
flags:
    --description=: An optional, textual description for the interconnect group.
    --intended-topology-capability=: The reliability the user intends this group to be capable of, in terms of
    --interconnects=: Member interconnects to set the interconnect group to contain.
    --update-mask=: Optional update mask to specify which fields to update.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute interconnects groups update* is used to update interconnect groups.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        description: An optional, textual description for the interconnect group.
        intended-topology-capability: |-
            The reliability the user intends this group to be capable of, in terms of
            the Interconnect product SLAs.
        interconnects: Member interconnects to set the interconnect group to contain.
        update-mask: |-
            Optional update mask to specify which fields to update. Use commas to
            separate masks. If not specified, all fields present in the command will
            be updated.
