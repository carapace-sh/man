    --accelerator-type=!: Accelerator type for the TPU.
    --async: Return immediately, without waiting for the operation in progress to
    --boot-disk=: Specifies the boot disk configuration.
    --data-disk=: Additional data disks for the TPU VM.
    --description=: Text description of the TPU.
    --guaranteed: If provided, the Node requested here will only be scheduled at the 'guaranteed' tier.
    --internal-ips: Indicates that the IP addresses for the node should be internal.
    --labels=: Resource labels to represent user-provided metadata.
    --metadata-from-file=: Same as `--metadata` except the value for the entry will be read from a local file.
    --metadata=: List of comma-separated metadata key-value pairs for the Cloud TPU VM node.
    --min-duration=&: The minimum period of time the Node is needed.
    --network=: Network that this TPU will be a part of.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-guaranteed&: If provided, the Node requested here will only be scheduled at the 'guaranteed' tier.
    --no-internal-ips&: Indicates that the IP addresses for the node should be internal.
    --no-reserved&: Specifies the request should be scheduled on reserved capacity.
    --no-shielded-secure-boot&: Specifies that the TPU instances are created with secure boot enabled.
    --no-spot&: If provided, the Node requested here will be created as Spot VMs.
    --node-count=!: The number of nodes in a multislice provision, also used to generate the qualified name for
    --node-id=!: Unqualified node identifier used to identify the node in the project once provisioned.
    --node-prefix=: Node prefix used to generate the qualified name of each node the multislice node provision.
    --range=: CIDR range for the TPU.
    --reservation-host-folder=: The folder hosting the reservation that the TPU should use.
    --reservation-host-organization=: The organization hosting the reservation that the TPU should use.
    --reservation-host-project=: The project hosting the reservation that the TPU should use.
    --reserved: Specifies the request should be scheduled on reserved capacity.
    --runtime-version=!: Runtime version for the TPU, such as `tpu-ubuntu2204-base`.
    --scopes=: List of comma-separated scopes to be made available for the service account.
