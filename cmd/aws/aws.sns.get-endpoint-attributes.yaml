name: get-endpoint-attributes
description: Retrieves the endpoint attributes for a device on one of the supported push notification services, such as GCM (Firebase Cloud Messaging) and APNS.
flags:
    --endpoint-arn=!: '`EndpointArn` for `GetEndpointAttributes` input.'
documentation:
    command: Retrieves the endpoint attributes for a device on one of the supported push notification services, such as GCM (Firebase Cloud Messaging) and APNS. For more information, see [Using Amazon SNS Mobile Push Notifications](https://docs.aws.amazon.com/sns/latest/dg/SNSMobilePush.html).
    flag:
        endpoint-arn: '`EndpointArn` for `GetEndpointAttributes` input.'
