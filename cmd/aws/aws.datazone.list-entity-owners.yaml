name: list-entity-owners
description: Lists the entity (domain units) owners.
flags:
    --domain-identifier=!: The ID of the domain where you want to list entity owners.
    --entity-identifier=!: The ID of the entity that you want to list.
    --entity-type=!: The type of the entity that you want to list.
    --max-results=: The maximum number of entities to return in a single call to `ListEntityOwners`.
    --next-token=: When the number of entities is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of entities, the response includes a pagination token named `NextToken`.
completion:
    flag:
        entity-type:
            - DOMAIN_UNIT
documentation:
    command: Lists the entity (domain units) owners.
    flag:
        domain-identifier: The ID of the domain where you want to list entity owners.
        entity-identifier: The ID of the entity that you want to list.
        entity-type: The type of the entity that you want to list.
        max-results: The maximum number of entities to return in a single call to `ListEntityOwners`. When the number of entities to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `ListEntityOwners` to list the next set of entities.
        next-token: When the number of entities is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of entities, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `ListEntityOwners` to list the next set of entities.
