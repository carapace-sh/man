name: create
description: Create an Eventarc channel connection.
flags:
    --activation-token=!: Activation token for the specified channel.
    --async: Return immediately, without waiting for the operation in progress to
    --channel=!: Subscriber channel for which to create the channel connection.
    --labels=: Labels to apply to the channel connection.
    --location=: The location for the Eventarc channel connection, which should be either ``global'' or one of the supported regions.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: Create an Eventarc channel connection.
    flag:
        activation-token: Activation token for the specified channel.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        channel: Subscriber channel for which to create the channel connection. This argument should be the full channel name, including project, location and the channel id.
        labels: Labels to apply to the channel connection.
        location: |-
            The location for the Eventarc channel connection, which should be either ``global'' or one of the supported regions. Alternatively, set the [eventarc/location] property.
            +
            To set the `location` attribute:
            * provide the argument `channel_connection` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `eventarc/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
