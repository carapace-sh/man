name: list-monitors
description: List all monitors in an account.
flags:
    --max-results=: The number of query results that you want to return with this call.
    --monitor-status=: The status of a monitor.
    --next-token=: The token for the next set of results.
completion:
    flag:
        monitor-status:
            - PENDING
            - ACTIVE
            - INACTIVE
            - ERROR
            - DELETING
documentation:
    command: List all monitors in an account. Optionally, you can list only monitors that have a specific status, by using the `STATUS` parameter.
    flag:
        max-results: The number of query results that you want to return with this call.
        monitor-status: |-
            The status of a monitor. The status can be one of the following

            - `PENDING`: The monitor is in the process of being created.
            - `ACTIVE`: The monitor is active.
            - `INACTIVE`: The monitor is inactive.
            - `ERROR`: Monitor creation failed due to an error.
            - `DELETING`: The monitor is in the process of being deleted.
        next-token: The token for the next set of results. You receive this token from a previous call.
