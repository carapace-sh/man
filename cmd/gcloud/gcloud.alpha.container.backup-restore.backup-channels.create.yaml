name: create
description: '*(ALPHA)*  Create a backup channel.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: The description of the backup channel.
    --destination-project=!: The project where Backups are allowed to be created.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Google Cloud location.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Create a Backup for GKE backup channel.

        ## EXAMPLES

        To create a backup channel ``my-backup-channel'' in project ``my-project'' in location ``us-central1'' with destination project ``projects/backup-project'', run:

          $ gcloud alpha container backup-restore backup-channels create my-backup-channel --project=my-project --location=us-central1 --destination-project=projects/backup-project
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: The description of the backup channel.
        destination-project: |-
            The project where Backups are allowed to be created.
            The format is `projects/{project}`.
            Project can be project number or project ID.
            E.g. `projects/1234567890` or `projects/my-project`.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `backup_channel` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
