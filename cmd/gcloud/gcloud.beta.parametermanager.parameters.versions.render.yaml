name: render
description: '*(BETA)*  Gets a single Parameter Manager parameter version render.'
hidden: true
flags:
    --location=: The location id of the version resource.
    --parameter=: The parameter id of the version resource.
documentation:
    command: |
        *(BETA)*  Gets a single parameter version render resource.
    flag:
        location: |-
            The location id of the version resource.
            +
            To set the `location` attribute:
            * provide the argument `version` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        parameter: |-
            The parameter id of the version resource.
            +
            To set the `parameter` attribute:
            * provide the argument `version` on the command line with a fully specified name;
            * provide the argument `--parameter` on the command line.
