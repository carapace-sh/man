name: delete-glossary
description: Deletes a business glossary in Amazon DataZone.
flags:
    --domain-identifier=!: The ID of the Amazon DataZone domain in which the business glossary is deleted.
    --identifier=!: The ID of the business glossary that is deleted.
documentation:
    command: |-
        Deletes a business glossary in Amazon DataZone.

        Prerequisites:

        - The glossary must be in DISABLED state.
        - The glossary must not have any glossary terms associated with it.
        - The glossary must exist in the specified domain.
        - The caller must have the `datazone:DeleteGlossary` permission in the domain and glossary.
        - Glossary should not be linked to any active metadata forms.
    flag:
        domain-identifier: The ID of the Amazon DataZone domain in which the business glossary is deleted.
        identifier: The ID of the business glossary that is deleted.
