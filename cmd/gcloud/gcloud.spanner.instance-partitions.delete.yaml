name: delete
description: Delete a Spanner instance partition. You can't delete the default instance partition using this command.
flags:
    --instance=: The Cloud Spanner instance for the instance partition.
documentation:
    command: Delete a Spanner instance partition. You can't delete the default instance partition using this command.
    flag:
        instance: |-
            The Cloud Spanner instance for the instance partition.
            +
            To set the `instance` attribute:
            * provide the argument `instance_partition` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
