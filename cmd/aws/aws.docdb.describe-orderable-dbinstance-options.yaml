name: describe-orderable-dbinstance-options
description: Returns a list of orderable instance options for the specified engine.
flags:
    --dbinstance-class=: The instance class filter value.
    --engine-version=: The engine version filter value.
    --engine=!: The name of the engine to retrieve instance options for.
    --filters=: This parameter is not currently supported.
    --license-model=: The license model filter value.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
    --vpc=: The virtual private cloud (VPC) filter value.
documentation:
    command: Returns a list of orderable instance options for the specified engine.
    flag:
        dbinstance-class: The instance class filter value. Specify this parameter to show only the available offerings that match the specified instance class.
        engine: The name of the engine to retrieve instance options for.
        engine-version: The engine version filter value. Specify this parameter to show only the available offerings that match the specified engine version.
        filters: This parameter is not currently supported.
        license-model: The license model filter value. Specify this parameter to show only the available offerings that match the specified license model.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token (marker) is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        vpc: The virtual private cloud (VPC) filter value. Specify this parameter to show only the available VPC or non-VPC offerings.
