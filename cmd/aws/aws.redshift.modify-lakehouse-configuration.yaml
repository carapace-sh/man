name: modify-lakehouse-configuration
description: Modifies the lakehouse configuration for a cluster.
flags:
    --catalog-name=: The name of the Glue data catalog that will be associated with the cluster enabled with Amazon Redshift federated permissions.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-identifier=!: The unique identifier of the cluster whose lakehouse configuration you want to modify.
    --dry-run: A boolean value that, if `true`, validates the request without actually modifying the lakehouse configuration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --lakehouse-idc-application-arn=: The Amazon Resource Name (ARN) of the IAM Identity Center application used for enabling Amazon Web Services IAM Identity Center trusted identity propagation on a cluster enabled with Amazon Redshift federated permissions.
    --lakehouse-idc-registration=: Modifies the Amazon Web Services IAM Identity Center trusted identity propagation on a cluster enabled with Amazon Redshift federated permissions.
    --lakehouse-registration=: Specifies whether to register or deregister the cluster with Amazon Redshift federated permissions.
    --no-dry-run: A boolean value that, if `true`, validates the request without actually modifying the lakehouse configuration.
completion:
    flag:
        lakehouse-idc-registration:
            - Associate
            - Disassociate
        lakehouse-registration:
            - Register
            - Deregister
documentation:
    command: Modifies the lakehouse configuration for a cluster. This operation allows you to manage Amazon Redshift federated permissions and Amazon Web Services IAM Identity Center trusted identity propagation.
    flag:
        catalog-name: |-
            The name of the Glue data catalog that will be associated with the cluster enabled with Amazon Redshift federated permissions.

            Constraints:

            - Must contain at least one lowercase letter.
            - Can only contain lowercase letters (a-z), numbers (0-9), underscores (\_), and hyphens (-).

            Pattern: `^[a-z0-9_-]*[a-z]+[a-z0-9_-]*$`

            Example: `my-catalog_01`
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-identifier: The unique identifier of the cluster whose lakehouse configuration you want to modify.
        dry-run: A boolean value that, if `true`, validates the request without actually modifying the lakehouse configuration. Use this to check for errors before making changes.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        lakehouse-idc-application-arn: The Amazon Resource Name (ARN) of the IAM Identity Center application used for enabling Amazon Web Services IAM Identity Center trusted identity propagation on a cluster enabled with Amazon Redshift federated permissions.
        lakehouse-idc-registration: Modifies the Amazon Web Services IAM Identity Center trusted identity propagation on a cluster enabled with Amazon Redshift federated permissions. Valid values are `Associate` or `Disassociate`.
        lakehouse-registration: Specifies whether to register or deregister the cluster with Amazon Redshift federated permissions. Valid values are `Register` or `Deregister`.
