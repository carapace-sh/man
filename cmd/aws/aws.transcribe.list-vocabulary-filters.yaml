name: list-vocabulary-filters
description: Provides a list of custom vocabulary filters that match the specified criteria.
flags:
    --max-results=: The maximum number of custom vocabulary filters to return in each page of results.
    --name-contains=: Returns only the custom vocabulary filters that contain the specified string.
    --next-token=: If your `ListVocabularyFilters` request returns more results than can be displayed, `NextToken` is displayed in the response with an associated string.
documentation:
    command: |-
        Provides a list of custom vocabulary filters that match the specified criteria. If no criteria are specified, all custom vocabularies are returned.

        To get detailed information about a specific custom vocabulary filter, use the operation.
    flag:
        max-results: The maximum number of custom vocabulary filters to return in each page of results. If there are fewer results than the value that you specify, only the actual results are returned. If you do not specify a value, a default of 5 is used.
        name-contains: Returns only the custom vocabulary filters that contain the specified string. The search is not case sensitive.
        next-token: If your `ListVocabularyFilters` request returns more results than can be displayed, `NextToken` is displayed in the response with an associated string. To get the next page of results, copy this string and repeat your request, including `NextToken` with the value of the copied string. Repeat as needed to view all your results.
