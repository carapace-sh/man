name: query
description: '*(BETA)*  *(REMOVED)*  Execute the user-specified SQL query on Dataflow.'
hidden: true
flags:
    --bigquery-dataset=: The BigQuery dataset ID.
    --bigquery-project=: The BigQuery project ID.
    --bigquery-table=!: ID of the BigQuery table or fully qualified identifier for the BigQuery table.
    --bigquery-write-disposition=: The behavior of the BigQuery write operation.
    --dataflow-kms-key=: The Cloud KMS key to protect the job resources.
    --disable-public-ips: The Cloud Dataflow workers must not use public IP addresses.
    --dry-run: Construct but do not run the SQL pipeline, for smoke testing.
    --job-name=!: The unique name to assign to the Cloud Dataflow job.
    --max-workers=: The maximum number of workers to run.
    --network=: The Compute Engine network for launching instances to run your pipeline.
    --no-disable-public-ips&: The Cloud Dataflow workers must not use public IP addresses.
    --no-dry-run&: Construct but do not run the SQL pipeline, for smoke testing.
    --num-workers=: The initial number of workers to use.
    --parameter=: Parameters to pass to a query.
    --parameters-file=: Path to a file containing query parameters in JSON format.
    --pubsub-create-disposition=: The behavior of the Pub/Sub create operation.
    --pubsub-project=: The Pub/Sub project ID.
    --pubsub-topic=!: ID of the Pub/Sub topic or fully qualified identifier for the Pub/Sub topic.
    --region=!: Region ID of the job's regional endpoint.
    --service-account-email=: The service account to run the workers as.
    --sql-launcher-template-engine=&: The template engine to use for the SQL launcher template.
    --sql-launcher-template=&: The full GCS path to a SQL launcher template spec, e.g. gs://dataflow-sql-templates-us-west1/cloud_dataflow_sql_launcher_template_20201208_RC00/sql_launcher_flex_template.
    --subnetwork=: The Compute Engine subnetwork for launching instances to run your pipeline.
    --worker-machine-type=: The type of machine to use for workers.
    --worker-region=: The region to run the workers in.
    --worker-zone=: The zone to run the workers in.
    --zone=: (DEPRECATED) The zone to run the workers in.
completion:
    flag:
        bigquery-write-disposition:
            - write-empty
            - write-truncate
            - write-append
        pubsub-create-disposition:
            - create-if-not-found
            - fail-if-not-found
        sql-launcher-template-engine:
            - flex
            - dynamic
documentation:
    command: |4-
        *(BETA)*  *(REMOVED)*  This command has been removed. Please see [Beam YAML](https://beam.apache.org/documentation/sdks/yaml/) and [Beam notebooks](https://cloud.google.com/dataflow/docs/guides/notebook-advanced#beam-sql) for alternatives.

        Execute the user-specified SQL query on Dataflow. Queries must comply to the ZetaSQL dialect (https://github.com/google/zetasql). Results may be written to either BigQuery or Cloud Pub/Sub.
    flag:
        bigquery-dataset: |-
            The BigQuery dataset ID.
            +
            To set the `bigquery-dataset` attribute:
            * provide the argument `--bigquery-table` on the command line with a fully specified name;
            * provide the argument `--bigquery-dataset` on the command line.
        bigquery-project: |-
            The BigQuery project ID.
            +
            To set the `bigquery-project` attribute:
            * provide the argument `--bigquery-table` on the command line with a fully specified name;
            * provide the argument `--bigquery-project` on the command line.
        bigquery-table: |-
            ID of the BigQuery table or fully qualified identifier for the BigQuery table.
            +
            To set the `bigquery-table` attribute:
            * provide the argument `--bigquery-table` on the command line.
        bigquery-write-disposition: 'The behavior of the BigQuery write operation. _BIGQUERY_WRITE_DISPOSITION_ must be one of: *write-empty*, *write-truncate*, *write-append*.'
        dataflow-kms-key: The Cloud KMS key to protect the job resources.
        disable-public-ips: The Cloud Dataflow workers must not use public IP addresses. Overrides the default *dataflow/disable_public_ips* property value for this command invocation.
        dry-run: Construct but do not run the SQL pipeline, for smoke testing.
        job-name: The unique name to assign to the Cloud Dataflow job.
        max-workers: The maximum number of workers to run.
        network: The Compute Engine network for launching instances to run your pipeline.
        no-disable-public-ips: The Cloud Dataflow workers must not use public IP addresses.
        no-dry-run: Construct but do not run the SQL pipeline, for smoke testing.
        num-workers: The initial number of workers to use.
        parameter: Parameters to pass to a query. Parameters must use the format name:type:value, for example min_word_count:INT64:250.
        parameters-file: 'Path to a file containing query parameters in JSON format. e.g. [{"parameterType": {"type": "STRING"}, "parameterValue": {"value": "foo"}, "name": "x"}, {"parameterType": {"type": "FLOAT64"}, "parameterValue": {"value": "1.0"}, "name": "y"}]'
        pubsub-create-disposition: 'The behavior of the Pub/Sub create operation. _PUBSUB_CREATE_DISPOSITION_ must be one of: *create-if-not-found*, *fail-if-not-found*.'
        pubsub-project: |-
            The Pub/Sub project ID.
            +
            To set the `pubsub-project` attribute:
            * provide the argument `--pubsub-topic` on the command line with a fully specified name;
            * provide the argument `--pubsub-project` on the command line.
        pubsub-topic: |-
            ID of the Pub/Sub topic or fully qualified identifier for the Pub/Sub topic.
            +
            To set the `pubsub-topic` attribute:
            * provide the argument `--pubsub-topic` on the command line.
        region: Region ID of the job's regional endpoint. Defaults to 'us-central1'.
        service-account-email: The service account to run the workers as.
        sql-launcher-template: The full GCS path to a SQL launcher template spec, e.g. gs://dataflow-sql-templates-us-west1/cloud_dataflow_sql_launcher_template_20201208_RC00/sql_launcher_flex_template. If None is specified, default to the latest release in the region. Note that older releases are not guaranteed to be compatible.
        sql-launcher-template-engine: The template engine to use for the SQL launcher template.
        subnetwork: The Compute Engine subnetwork for launching instances to run your pipeline.
        worker-machine-type: The type of machine to use for workers. Defaults to server-specified.
        worker-region: The region to run the workers in.
        worker-zone: The zone to run the workers in.
        zone: |-
            (DEPRECATED) The zone to run the workers in.
            +
            The --zone option is deprecated; use --worker-region or --worker-zone instead.
