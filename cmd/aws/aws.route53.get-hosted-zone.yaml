name: get-hosted-zone
description: Gets information about a specified hosted zone including the four name servers assigned to the hosted zone.
flags:
    --id=!: The ID of the hosted zone that you want to get information about.
documentation:
    command: |-
        Gets information about a specified hosted zone including the four name servers assigned to the hosted zone.

        `returns the VPCs associated with the specified hosted zone and does not reflect the VPC associations by Route 53 Profiles. To get the associations to a Profile, call the ListProfileAssociations API.`
    flag:
        id: The ID of the hosted zone that you want to get information about.
