name: get-finding-aggregator
description: The *aggregation Region* is now called the *home Region*.
flags:
    --finding-aggregator-arn=!: The ARN of the finding aggregator to return details for.
documentation:
    command: |-
        The *aggregation Region* is now called the *home Region*.

        Returns the current configuration in the calling account for cross-Region aggregation. A finding aggregator is a resource that establishes the home Region and any linked Regions.
    flag:
        finding-aggregator-arn: The ARN of the finding aggregator to return details for. To obtain the ARN, use `ListFindingAggregators`.
