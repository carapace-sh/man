name: update-workflow
description: Updates an existing workflow with new configuration settings.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --definition-s3-location=!: The Amazon S3 location where the updated workflow definition file is stored.
    --description=: An updated description for the workflow.
    --engine-version=: The version of the Amazon Managed Workflows for Apache Airflow Serverless engine that you want to use for the updated workflow.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --logging-configuration=: Updated logging configuration for the workflow.
    --network-configuration=: Updated network configuration for the workflow execution environment.
    --role-arn=!: The Amazon Resource Name (ARN) of the IAM role that Amazon Managed Workflows for Apache Airflow Serverless assumes when it executes the updated workflow.
    --trigger-mode=: The trigger mode for the workflow execution.
    --workflow-arn=!: The Amazon Resource Name (ARN) of the workflow you want to update.
documentation:
    command: Updates an existing workflow with new configuration settings. This operation allows you to modify the workflow definition, role, and other settings. When you update a workflow, Amazon Managed Workflows for Apache Airflow Serverless automatically creates a new version with the updated configuration and disables scheduling on all previous versions to ensure only one version is actively scheduled at a time. The update operation maintains workflow history while providing a clean transition to the new configuration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        definition-s3-location: The Amazon S3 location where the updated workflow definition file is stored.
        description: An updated description for the workflow.
        engine-version: The version of the Amazon Managed Workflows for Apache Airflow Serverless engine that you want to use for the updated workflow.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        logging-configuration: Updated logging configuration for the workflow.
        network-configuration: Updated network configuration for the workflow execution environment.
        role-arn: The Amazon Resource Name (ARN) of the IAM role that Amazon Managed Workflows for Apache Airflow Serverless assumes when it executes the updated workflow.
        trigger-mode: The trigger mode for the workflow execution.
        workflow-arn: The Amazon Resource Name (ARN) of the workflow you want to update.
