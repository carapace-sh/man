name: update
description: '*(ALPHA)*  Update Flag.'
hidden: true
flags:
    --annotations=: Set annotations to new value.
    --clear-annotations: Clear annotations value and set to empty map.
    --clear-description: Clear description value and set to null.
    --clear-evaluation-spec: Clear evaluation_spec value and set to null.
    --clear-labels: Clear labels value and set to empty map.
    --description=: Set description to new value.
    --evaluation-spec=: Set evaluation_spec to new value.
    --labels=: Set labels to new value.
    --location=: Location ID
    --no-clear-annotations&: Clear annotations value and set to empty map.
    --no-clear-description&: Clear description value and set to null.
    --no-clear-evaluation-spec&: Clear evaluation_spec value and set to null.
    --no-clear-labels&: Clear labels value and set to empty map.
    --remove-annotations=: Remove existing value from map annotations.
    --remove-labels=: Remove existing value from map labels.
    --update-annotations=: Update annotations value or add key value pair.
    --update-labels=: Update labels value or add key value pair.
documentation:
    command: '*(ALPHA)*  Update a Flag'
    flag:
        annotations: |-
            Set annotations to new value. Unstructured key-value map stored with a resource that may be set by
            external tools to store and retrieve arbitrary metadata. Annotations
            are not queryable and should be preserved when modifying objects.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --annotations=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --annotations='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --annotations=path_to_file.(yaml|json)
            +
            ```
        clear-annotations: Clear annotations value and set to empty map.
        clear-description: Clear description value and set to null.
        clear-evaluation-spec: Clear evaluation_spec value and set to null.
        clear-labels: Clear labels value and set to empty map.
        description: Set description to new value.
        evaluation-spec: |-
            Set evaluation_spec to new value. Specification of how the Flag value should be evaluated.
            +
            *defaultTarget*:::
            Default variant for the flag.
            +
            *variants*:::
            A list of variants.
            Variant is an identifier for a value (name assigned to a value).
            +
            *boolValue*::::
            Value is a single flag value for the variant.
            +
            *name*::::
            Name of the variant.
            Max length: 128 bytes.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --evaluation-spec=defaultTarget=string,variants=[{boolValue=boolean,name=string}]
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --evaluation-spec='{"defaultTarget": "string", "variants": [{"boolValue": boolean, "name": "string"}]}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --evaluation-spec=path_to_file.(yaml|json)
            +
            ```
        labels: |-
            Set labels to new value. The labels on the resource, which can be used for categorization.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            Location ID
            +
            To set the `location` attribute:
            * provide the argument `flag` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-clear-annotations: Clear annotations value and set to empty map.
        no-clear-description: Clear description value and set to null.
        no-clear-evaluation-spec: Clear evaluation_spec value and set to null.
        no-clear-labels: Clear labels value and set to empty map.
        remove-annotations: |-
            Remove existing value from map annotations. Sets `remove_annotations` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-annotations=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-annotations=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-annotations=path_to_file.(yaml|json)
            +
            ```
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        update-annotations: |-
            Update annotations value or add key value pair. Unstructured key-value map stored with a resource that may be set by
            external tools to store and retrieve arbitrary metadata. Annotations
            are not queryable and should be preserved when modifying objects.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-annotations=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-annotations='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-annotations=path_to_file.(yaml|json)
            +
            ```
        update-labels: |-
            Update labels value or add key value pair. The labels on the resource, which can be used for categorization.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-labels=path_to_file.(yaml|json)
            +
            ```
