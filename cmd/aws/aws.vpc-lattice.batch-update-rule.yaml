name: batch-update-rule
description: Updates the listener rules in a batch.
flags:
    --listener-identifier=!: The ID or ARN of the listener.
    --rules=!: The rules for the specified listener.
    --service-identifier=!: The ID or ARN of the service.
documentation:
    command: |-
        Updates the listener rules in a batch. You can use this operation to change the priority of listener rules. This can be useful when bulk updating or swapping rule priority.

        **Required permissions:** `vpc-lattice:UpdateRule`

        For more information, see [How Amazon VPC Lattice works with IAM](https://docs.aws.amazon.com/vpc-lattice/latest/ug/security_iam_service-with-iam.html) in the *Amazon VPC Lattice User Guide*.
    flag:
        listener-identifier: The ID or ARN of the listener.
        rules: The rules for the specified listener.
        service-identifier: The ID or ARN of the service.
