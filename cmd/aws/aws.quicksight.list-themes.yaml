name: list-themes
description: Lists all the themes in the current Amazon Web Services account.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the themes that you're listing.
    --max-results=: The maximum number of results to be returned per request.
    --next-token=: The token for the next set of results, or null if there are no more results.
    --type=: The type of themes that you want to list.
completion:
    flag:
        type:
            - QUICKSIGHT
            - CUSTOM
            - ALL
documentation:
    command: Lists all the themes in the current Amazon Web Services account.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the themes that you're listing.
        max-results: The maximum number of results to be returned per request.
        next-token: The token for the next set of results, or null if there are no more results.
        type: |-
            The type of themes that you want to list. Valid options include the following:

            - `ALL (default)`- Display all existing themes.
            - `CUSTOM` - Display only the themes created by people using Amazon Quick Sight.
            - `QUICKSIGHT` - Display only the starting themes defined by Quick Sight.
