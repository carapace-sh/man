name: get-insight-rule-report
description: This operation returns the time series data collected by a Contributor Insights rule.
flags:
    --end-time=!: The end time of the data to use in the report.
    --max-contributor-count=: The maximum number of contributors to include in the report.
    --metrics=: Specifies which metrics to use for aggregation of contributor values for the report.
    --order-by=: Determines what statistic to use to rank the contributors.
    --period=!: The period, in seconds, to use for the statistics in the `InsightRuleMetricDatapoint` results.
    --rule-name=!: The name of the rule that you want to see data from.
    --start-time=!: The start time of the data to use in the report.
documentation:
    command: "This operation returns the time series data collected by a Contributor Insights rule. The data includes the identity and number of contributors to the log group.\n\nYou can also optionally return one or more statistics about each data point in the time series. These statistics can include the following:\n\n- `UniqueContributors` -- the number of unique contributors for each data point.\n- `MaxContributorValue` -- the value of the top contributor for each data point. The identity of the contributor might change for each data point in the graph.\n  \n  If this rule aggregates by COUNT, the top contributor for each data point is the contributor with the most occurrences in that period. If the rule aggregates by SUM, the top contributor is the contributor with the highest sum in the log field specified by the rule's `Value`, during that period.\n- `SampleCount` -- the number of data points matched by the rule.\n- `Sum` -- the sum of the values from all contributors during the time period represented by that data point.\n- `Minimum` -- the minimum value from a single observation during the time period represented by that data point.\n- `Maximum` -- the maximum value from a single observation during the time period represented by that data point.\n- `Average` -- the average value from all contributors during the time period represented by that data point."
    flag:
        end-time: The end time of the data to use in the report. When used in a raw HTTP Query API, it is formatted as `yyyy-MM-dd'T'HH:mm:ss`. For example, `2019-07-01T23:59:59`.
        max-contributor-count: The maximum number of contributors to include in the report. The range is 1 to 100. If you omit this, the default of 10 is used.
        metrics: "Specifies which metrics to use for aggregation of contributor values for the report. You can specify one or more of the following metrics:\n\n- `UniqueContributors` -- the number of unique contributors for each data point.\n- `MaxContributorValue` -- the value of the top contributor for each data point. The identity of the contributor might change for each data point in the graph.\n  \n  If this rule aggregates by COUNT, the top contributor for each data point is the contributor with the most occurrences in that period. If the rule aggregates by SUM, the top contributor is the contributor with the highest sum in the log field specified by the rule's `Value`, during that period.\n- `SampleCount` -- the number of data points matched by the rule.\n- `Sum` -- the sum of the values from all contributors during the time period represented by that data point.\n- `Minimum` -- the minimum value from a single observation during the time period represented by that data point.\n- `Maximum` -- the maximum value from a single observation during the time period represented by that data point.\n- `Average` -- the average value from all contributors during the time period represented by that data point."
        order-by: Determines what statistic to use to rank the contributors. Valid values are `Sum` and `Maximum`.
        period: The period, in seconds, to use for the statistics in the `InsightRuleMetricDatapoint` results.
        rule-name: The name of the rule that you want to see data from.
        start-time: The start time of the data to use in the report. When used in a raw HTTP Query API, it is formatted as `yyyy-MM-dd'T'HH:mm:ss`. For example, `2019-07-01T23:59:59`.
