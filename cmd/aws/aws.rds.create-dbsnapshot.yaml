name: create-dbsnapshot
description: Creates a snapshot of a DB instance.
flags:
    --dbinstance-identifier=!: The identifier of the DB instance that you want to create the snapshot of.
    --dbsnapshot-identifier=!: The identifier for the DB snapshot.
    --tags=: ""
documentation:
    command: Creates a snapshot of a DB instance. The source DB instance must be in the `available` or `storage-optimization` state.
    flag:
        dbinstance-identifier: |-
            The identifier of the DB instance that you want to create the snapshot of.

            Constraints:

            - Must match the identifier of an existing DBInstance.
        dbsnapshot-identifier: |-
            The identifier for the DB snapshot.

            Constraints:

            - Can't be null, empty, or blank
            - Must contain from 1 to 255 letters, numbers, or hyphens
            - First character must be a letter
            - Can't end with a hyphen or contain two consecutive hyphens

            Example: `my-snapshot-id`
        tags: ""
