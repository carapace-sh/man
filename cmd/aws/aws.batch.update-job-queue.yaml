name: update-job-queue
description: Updates a job queue.
flags:
    --compute-environment-order=: Details the set of compute environments mapped to a job queue and their order relative to each other.
    --job-queue=!: The name or the Amazon Resource Name (ARN) of the job queue.
    --job-state-time-limit-actions=: The set of actions that Batch perform on jobs that remain at the head of the job queue in the specified state longer than specified times.
    --priority=: The priority of the job queue.
    --scheduling-policy-arn=: Amazon Resource Name (ARN) of the fair-share scheduling policy.
    --service-environment-order=: The order of the service environment associated with the job queue.
    --state=: Describes the queue's ability to accept new jobs.
completion:
    flag:
        state:
            - ENABLED
            - DISABLED
documentation:
    command: Updates a job queue.
    flag:
        compute-environment-order: |-
            Details the set of compute environments mapped to a job queue and their order relative to each other. This is one of the parameters used by the job scheduler to determine which compute environment runs a given job. Compute environments must be in the `VALID` state before you can associate them with a job queue. All of the compute environments must be either EC2 (`EC2` or `SPOT`) or Fargate (`FARGATE` or `FARGATE_SPOT`). EC2 and Fargate compute environments can't be mixed.

            All compute environments that are associated with a job queue must share the same architecture. Batch doesn't support mixing compute environment architecture types in a single job queue.
        job-queue: The name or the Amazon Resource Name (ARN) of the job queue.
        job-state-time-limit-actions: 'The set of actions that Batch perform on jobs that remain at the head of the job queue in the specified state longer than specified times. Batch will perform each action after `maxTimeSeconds` has passed. (**Note**: The minimum value for maxTimeSeconds is 600 (10 minutes) and its maximum value is 86,400 (24 hours).)'
        priority: The priority of the job queue. Job queues with a higher priority (or a higher integer value for the `priority` parameter) are evaluated first when associated with the same compute environment. Priority is determined in descending order. For example, a job queue with a priority value of `10` is given scheduling preference over a job queue with a priority value of `1`. All of the compute environments must be either EC2 (`EC2` or `SPOT`) or Fargate (`FARGATE` or `FARGATE_SPOT`). EC2 and Fargate compute environments can't be mixed.
        scheduling-policy-arn: Amazon Resource Name (ARN) of the fair-share scheduling policy. Once a job queue is created, the fair-share scheduling policy can be replaced but not removed. The format is `aws:Partition:batch:Region:Account:scheduling-policy/Name`. For example, `aws:aws:batch:us-west-2:123456789012:scheduling-policy/MySchedulingPolicy`.
        service-environment-order: The order of the service environment associated with the job queue. Job queues with a higher priority are evaluated first when associated with the same service environment.
        state: Describes the queue's ability to accept new jobs. If the job queue state is `ENABLED`, it can accept jobs. If the job queue state is `DISABLED`, new jobs can't be added to the queue, but jobs already in the queue can finish.
