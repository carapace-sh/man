name: validate-directory-service
description: '*(BETA)*  Validate directory service for a Cloud Netapp storage pool.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --directory-service-type=: String indicating directory service type for the Storage Pool
    --location=: The location of the storage_pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(BETA)*  Validate the directory service for a Cloud Netapp storage pool.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        directory-service-type: String indicating directory service type for the Storage Pool
        location: |-
            The location of the storage_pool.
            +
            To set the `location` attribute:
            * provide the argument `storage_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
