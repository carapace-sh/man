name: modify-vpc-endpoint
description: Modifies attributes of a specified VPC endpoint.
flags:
    --add-route-table-ids=: (Gateway endpoint) The IDs of the route tables to associate with the endpoint.
    --add-security-group-ids=: (Interface endpoint) The IDs of the security groups to associate with the endpoint network interfaces.
    --add-subnet-ids=: (Interface and Gateway Load Balancer endpoints) The IDs of the subnets in which to serve the endpoint.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dns-options=: The DNS options for the endpoint.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip-address-type=: The IP address type for the endpoint.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-private-dns-enabled: (Interface endpoint) Indicates whether a private hosted zone is associated with the VPC.
    --no-reset-policy: (Gateway endpoint) Specify `true` to reset the policy document to the default policy.
    --policy-document=: (Interface and gateway endpoints) A policy to attach to the endpoint that controls access to the service.
    --private-dns-enabled: (Interface endpoint) Indicates whether a private hosted zone is associated with the VPC.
    --remove-route-table-ids=: (Gateway endpoint) The IDs of the route tables to disassociate from the endpoint.
    --remove-security-group-ids=: (Interface endpoint) The IDs of the security groups to disassociate from the endpoint network interfaces.
    --remove-subnet-ids=: (Interface endpoint) The IDs of the subnets from which to remove the endpoint.
    --reset-policy: (Gateway endpoint) Specify `true` to reset the policy document to the default policy.
    --subnet-configurations=: The subnet configurations for the endpoint.
    --vpc-endpoint-id=!: The ID of the endpoint.
completion:
    flag:
        ip-address-type:
            - ipv4
            - dualstack
            - ipv6
documentation:
    command: Modifies attributes of a specified VPC endpoint. The attributes that you can modify depend on the type of VPC endpoint (interface, gateway, or Gateway Load Balancer). For more information, see the [Amazon Web Services PrivateLink Guide](https://docs.aws.amazon.com/vpc/latest/privatelink/).
    flag:
        add-route-table-ids: (Gateway endpoint) The IDs of the route tables to associate with the endpoint.
        add-security-group-ids: (Interface endpoint) The IDs of the security groups to associate with the endpoint network interfaces.
        add-subnet-ids: (Interface and Gateway Load Balancer endpoints) The IDs of the subnets in which to serve the endpoint. For a Gateway Load Balancer endpoint, you can specify only one subnet.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dns-options: The DNS options for the endpoint.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip-address-type: The IP address type for the endpoint.
        policy-document: (Interface and gateway endpoints) A policy to attach to the endpoint that controls access to the service. The policy must be in valid JSON format.
        private-dns-enabled: (Interface endpoint) Indicates whether a private hosted zone is associated with the VPC.
        remove-route-table-ids: (Gateway endpoint) The IDs of the route tables to disassociate from the endpoint.
        remove-security-group-ids: (Interface endpoint) The IDs of the security groups to disassociate from the endpoint network interfaces.
        remove-subnet-ids: (Interface endpoint) The IDs of the subnets from which to remove the endpoint.
        reset-policy: (Gateway endpoint) Specify `true` to reset the policy document to the default policy. The default policy allows full access to the service.
        subnet-configurations: The subnet configurations for the endpoint.
        vpc-endpoint-id: The ID of the endpoint.
