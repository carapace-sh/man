name: list-medical-scribe-jobs
description: Provides a list of Medical Scribe jobs that match the specified criteria.
flags:
    --job-name-contains=: Returns only the Medical Scribe jobs that contain the specified string.
    --max-results=: The maximum number of Medical Scribe jobs to return in each page of results.
    --next-token=: If your `ListMedicalScribeJobs` request returns more results than can be displayed, `NextToken` is displayed in the response with an associated string.
    --status=: Returns only Medical Scribe jobs with the specified status.
completion:
    flag:
        status:
            - QUEUED
            - IN_PROGRESS
            - FAILED
            - COMPLETED
documentation:
    command: |-
        Provides a list of Medical Scribe jobs that match the specified criteria. If no criteria are specified, all Medical Scribe jobs are returned.

        To get detailed information about a specific Medical Scribe job, use the operation.
    flag:
        job-name-contains: Returns only the Medical Scribe jobs that contain the specified string. The search is not case sensitive.
        max-results: The maximum number of Medical Scribe jobs to return in each page of results. If there are fewer results than the value that you specify, only the actual results are returned. If you do not specify a value, a default of 5 is used.
        next-token: If your `ListMedicalScribeJobs` request returns more results than can be displayed, `NextToken` is displayed in the response with an associated string. To get the next page of results, copy this string and repeat your request, including `NextToken` with the value of the copied string. Repeat as needed to view all your results.
        status: Returns only Medical Scribe jobs with the specified status. Jobs are ordered by creation date, with the newest job first. If you do not include `Status`, all Medical Scribe jobs are returned.
