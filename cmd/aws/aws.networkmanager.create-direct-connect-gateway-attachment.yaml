name: create-direct-connect-gateway-attachment
description: Creates an Amazon Web Services Direct Connect gateway attachment
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: client token
    --core-network-id=!: The ID of the Cloud WAN core network that the Direct Connect gateway attachment should be attached to.
    --direct-connect-gateway-arn=!: The ARN of the Direct Connect gateway attachment.
    --edge-locations=!:
        description: One or more core network edge locations that the Direct Connect gateway attachment is associated with.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --routing-policy-label=: The routing policy label to apply to the Direct Connect Gateway attachment for traffic routing decisions.
    --tags=:
        description: The key value tags to apply to the Direct Connect gateway attachment during creation.
        nargs: -1
documentation:
    command: Creates an Amazon Web Services Direct Connect gateway attachment
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: client token
        core-network-id: The ID of the Cloud WAN core network that the Direct Connect gateway attachment should be attached to.
        direct-connect-gateway-arn: The ARN of the Direct Connect gateway attachment.
        edge-locations: One or more core network edge locations that the Direct Connect gateway attachment is associated with.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        routing-policy-label: The routing policy label to apply to the Direct Connect Gateway attachment for traffic routing decisions.
        tags: The key value tags to apply to the Direct Connect gateway attachment during creation.
