name: list-problems
description: Lists the problems with your application.
flags:
    --account-id=: The Amazon Web Services account ID for the resource group owner.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --component-name=: The name of the component.
    --end-time=: The time when the problem ended, in epoch seconds.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token to request the next page of results.
    --resource-group-name=: The name of the resource group.
    --start-time=: The time when the problem was detected, in epoch seconds.
    --visibility=: Specifies whether or not you can view the problem.
completion:
    flag:
        visibility:
            - IGNORED
            - VISIBLE
documentation:
    command: Lists the problems with your application.
    flag:
        account-id: The Amazon Web Services account ID for the resource group owner.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        component-name: The name of the component.
        end-time: The time when the problem ended, in epoch seconds. If not specified, problems within the past seven days are returned.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results to return in a single call. To retrieve the remaining results, make another call with the returned `NextToken` value.
        next-token: The token to request the next page of results.
        resource-group-name: The name of the resource group.
        start-time: The time when the problem was detected, in epoch seconds. If you don't specify a time frame for the request, problems within the past seven days are returned.
        visibility: Specifies whether or not you can view the problem. If not specified, visible and ignored problems are returned.
