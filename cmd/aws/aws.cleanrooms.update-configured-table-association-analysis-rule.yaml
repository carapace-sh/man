name: update-configured-table-association-analysis-rule
description: Updates the analysis rule for a configured table association.
flags:
    --analysis-rule-policy=!: The updated analysis rule policy for the conﬁgured table association.
    --analysis-rule-type=!: The analysis rule type that you want to update.
    --configured-table-association-identifier=!: The identifier for the configured table association to update.
    --membership-identifier=!: A unique identifier for the membership that the configured table association belongs to.
completion:
    flag:
        analysis-rule-type:
            - AGGREGATION
            - LIST
            - CUSTOM
documentation:
    command: Updates the analysis rule for a configured table association.
    flag:
        analysis-rule-policy: The updated analysis rule policy for the conﬁgured table association.
        analysis-rule-type: The analysis rule type that you want to update.
        configured-table-association-identifier: The identifier for the configured table association to update.
        membership-identifier: A unique identifier for the membership that the configured table association belongs to. Currently accepts the membership ID.
