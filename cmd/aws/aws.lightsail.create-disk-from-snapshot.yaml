name: create-disk-from-snapshot
description: Creates a block storage disk from a manual or automatic snapshot of a disk.
flags:
    --add-ons=: An array of objects that represent the add-ons to enable for the new disk.
    --availability-zone=!: The Availability Zone where you want to create the disk (`us-east-2a`).
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --disk-name=!: The unique Lightsail disk name (`my-disk`).
    --disk-snapshot-name=: The name of the disk snapshot (`my-snapshot`) from which to create the new storage disk.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-use-latest-restorable-auto-snapshot: A Boolean value to indicate whether to use the latest available automatic snapshot.
    --restore-date=: The date of the automatic snapshot to use for the new disk.
    --size-in-gb=!: The size of the disk in GB (`32`).
    --source-disk-name=: The name of the source disk from which the source automatic snapshot was created.
    --tags=: The tag keys and optional values to add to the resource during create.
    --use-latest-restorable-auto-snapshot: A Boolean value to indicate whether to use the latest available automatic snapshot.
documentation:
    command: |-
        Creates a block storage disk from a manual or automatic snapshot of a disk. The resulting disk can be attached to an Amazon Lightsail instance in the same Availability Zone (`us-east-2a`).

        The `create disk from snapshot` operation supports tag-based access control via request tags and resource tags applied to the resource identified by `disk snapshot name`. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        add-ons: An array of objects that represent the add-ons to enable for the new disk.
        availability-zone: |-
            The Availability Zone where you want to create the disk (`us-east-2a`). Choose the same Availability Zone as the Lightsail instance where you want to create the disk.

            Use the GetRegions operation to list the Availability Zones where Lightsail is currently available.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        disk-name: The unique Lightsail disk name (`my-disk`).
        disk-snapshot-name: |-
            The name of the disk snapshot (`my-snapshot`) from which to create the new storage disk.

            Constraint:

            - This parameter cannot be defined together with the `source disk name` parameter. The `disk snapshot name` and `source disk name` parameters are mutually exclusive.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        restore-date: |-
            The date of the automatic snapshot to use for the new disk. Use the `get auto snapshots` operation to identify the dates of the available automatic snapshots.

            Constraints:

            - Must be specified in `YYYY-MM-DD` format.
            - This parameter cannot be defined together with the `use latest restorable auto snapshot` parameter. The `restore date` and `use latest restorable auto snapshot` parameters are mutually exclusive.
            - Define this parameter only when creating a new disk from an automatic snapshot. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-configuring-automatic-snapshots).
        size-in-gb: The size of the disk in GB (`32`).
        source-disk-name: |-
            The name of the source disk from which the source automatic snapshot was created.

            Constraints:

            - This parameter cannot be defined together with the `disk snapshot name` parameter. The `source disk name` and `disk snapshot name` parameters are mutually exclusive.
            - Define this parameter only when creating a new disk from an automatic snapshot. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-configuring-automatic-snapshots).
        tags: |-
            The tag keys and optional values to add to the resource during create.

            Use the `TagResource` action to tag a resource after it's created.
        use-latest-restorable-auto-snapshot: |-
            A Boolean value to indicate whether to use the latest available automatic snapshot.

            Constraints:

            - This parameter cannot be defined together with the `restore date` parameter. The `use latest restorable auto snapshot` and `restore date` parameters are mutually exclusive.
            - Define this parameter only when creating a new disk from an automatic snapshot. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-configuring-automatic-snapshots).
