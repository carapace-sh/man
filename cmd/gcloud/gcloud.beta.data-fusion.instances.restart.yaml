name: restart
description: '*(BETA)*  Restarts a Cloud Data Fusion instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Compute Engine region in which to create the instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(BETA)*  If run asynchronously with `--async`, exits after printing an operation
        that can be used to poll the status of the creation operation via:

          gcloud beta data-fusion instances restart operations list
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Compute Engine region in which to create the instance.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `datafusion/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
