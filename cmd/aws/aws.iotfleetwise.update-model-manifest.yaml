name: update-model-manifest
description: Updates a vehicle model (model manifest).
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A brief description of the vehicle model.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the vehicle model to update.
    --nodes-to-add=:
        description: A list of `fullyQualifiedName` of nodes, which are a general abstraction of signals, to add to the vehicle model.
        nargs: -1
    --nodes-to-remove=:
        description: A list of `fullyQualifiedName` of nodes, which are a general abstraction of signals, to remove from the vehicle model.
        nargs: -1
    --status=: The state of the vehicle model.
completion:
    flag:
        status:
            - ACTIVE
            - DRAFT
            - INVALID
            - VALIDATING
documentation:
    command: Updates a vehicle model (model manifest). If created vehicles are associated with a vehicle model, it can't be updated.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A brief description of the vehicle model.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the vehicle model to update.
        nodes-to-add: A list of `fullyQualifiedName` of nodes, which are a general abstraction of signals, to add to the vehicle model.
        nodes-to-remove: A list of `fullyQualifiedName` of nodes, which are a general abstraction of signals, to remove from the vehicle model.
        status: The state of the vehicle model. If the status is `ACTIVE`, the vehicle model can't be edited. If the status is `DRAFT`, you can edit the vehicle model.
