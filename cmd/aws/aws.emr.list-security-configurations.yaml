name: list-security-configurations
description: Lists all the security configurations visible to this account, providing their creation dates and times, and their names.
flags:
    --marker=: The pagination token that indicates the set of results to retrieve.
documentation:
    command: Lists all the security configurations visible to this account, providing their creation dates and times, and their names. This call returns a maximum of 50 clusters per call, but returns a marker to track the paging of the cluster list across multiple ListSecurityConfigurations calls.
    flag:
        marker: The pagination token that indicates the set of results to retrieve.
