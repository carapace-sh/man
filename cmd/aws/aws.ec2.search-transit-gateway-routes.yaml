name: search-transit-gateway-routes
description: Searches for routes in the specified transit gateway route table.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=!: One or more filters.
    --max-results=: The maximum number of routes to return.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --transit-gateway-route-table-id=!: The ID of the transit gateway route table.
documentation:
    command: Searches for routes in the specified transit gateway route table.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters. The possible values are:

            - `attachment.transit-gateway-attachment-id`- The id of the transit gateway attachment.
            - `attachment.resource-id` - The resource id of the transit gateway attachment.
            - `attachment.resource-type` - The attachment resource type. Valid values are `vpc` | `vpn` | `direct-connect-gateway` | `peering` | `connect`.
            - `prefix-list-id` - The ID of the prefix list.
            - `route-search.exact-match` - The exact match of the specified filter.
            - `route-search.longest-prefix-match` - The longest prefix that matches the route.
            - `route-search.subnet-of-match` - The routes with a subnet that match the specified CIDR filter.
            - `route-search.supernet-of-match` - The routes with a CIDR that encompass the CIDR filter. For example, if you have 10.0.1.0/29 and 10.0.1.0/31 routes in your route table and you specify supernet-of-match as 10.0.1.0/30, then the result returns 10.0.1.0/29.
            - `state` - The state of the route (`active` | `blackhole`).
            - `type` - The type of route (`propagated` | `static`).
        max-results: The maximum number of routes to return. If a value is not provided, the default is 1000.
        transit-gateway-route-table-id: The ID of the transit gateway route table.
