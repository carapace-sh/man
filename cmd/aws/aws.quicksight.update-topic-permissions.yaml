name: update-topic-permissions
description: Updates the permissions of a topic.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the topic that you want to update the permissions for.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --grant-permissions=:
        description: The resource permissions that you want to grant to the topic.
        nargs: -1
    --revoke-permissions=:
        description: The resource permissions that you want to revoke from the topic.
        nargs: -1
    --topic-id=!: The ID of the topic that you want to modify.
documentation:
    command: Updates the permissions of a topic.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the topic that you want to update the permissions for.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        grant-permissions: The resource permissions that you want to grant to the topic.
        revoke-permissions: The resource permissions that you want to revoke from the topic.
        topic-id: The ID of the topic that you want to modify. This ID is unique per Amazon Web Services Region for each Amazon Web Services account.
