name: create-flow-definition
description: Creates a flow definition.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --flow-definition-name=!: The name of your flow definition.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --human-loop-activation-config=: An object containing information about the events that trigger a human workflow.
    --human-loop-config=: An object containing information about the tasks the human reviewers will perform.
    --human-loop-request-source=: Container for configuring the source of human task requests.
    --output-config=!: An object containing information about where the human review results will be uploaded.
    --role-arn=!: The Amazon Resource Name (ARN) of the role needed to call other services on your behalf.
    --tags=: An array of key-value pairs that contain metadata to help you categorize and organize a flow definition.
documentation:
    command: Creates a flow definition.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        flow-definition-name: The name of your flow definition.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        human-loop-activation-config: An object containing information about the events that trigger a human workflow.
        human-loop-config: An object containing information about the tasks the human reviewers will perform.
        human-loop-request-source: Container for configuring the source of human task requests. Use to specify if Amazon Rekognition or Amazon Textract is used as an integration source.
        output-config: An object containing information about where the human review results will be uploaded.
        role-arn: The Amazon Resource Name (ARN) of the role needed to call other services on your behalf. For example, `arn:aws:iam::1234567890:role/service-role/AmazonSageMaker-ExecutionRole-20180111T151298`.
        tags: An array of key-value pairs that contain metadata to help you categorize and organize a flow definition. Each tag consists of a key and a value, both of which you define.
