name: list-dataset-groups
description: Returns a list of dataset groups.
flags:
    --max-results=: The maximum number of dataset groups to return.
    --next-token=: A token returned from the previous call to `ListDatasetGroups` for getting the next set of dataset groups (if they exist).
documentation:
    command: Returns a list of dataset groups. The response provides the properties for each dataset group, including the Amazon Resource Name (ARN). For more information on dataset groups, see [CreateDatasetGroup](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateDatasetGroup.html).
    flag:
        max-results: The maximum number of dataset groups to return.
        next-token: A token returned from the previous call to `ListDatasetGroups` for getting the next set of dataset groups (if they exist).
