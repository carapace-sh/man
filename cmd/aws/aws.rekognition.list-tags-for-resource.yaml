name: list-tags-for-resource
description: Returns a list of tags in an Amazon Rekognition collection, stream processor, or Custom Labels model.
flags:
    --resource-arn=!: Amazon Resource Name (ARN) of the model, collection, or stream processor that contains the tags that you want a list of.
documentation:
    command: |-
        Returns a list of tags in an Amazon Rekognition collection, stream processor, or Custom Labels model.

        This operation requires permissions to perform the `rekognition:ListTagsForResource` action.
    flag:
        resource-arn: Amazon Resource Name (ARN) of the model, collection, or stream processor that contains the tags that you want a list of.
