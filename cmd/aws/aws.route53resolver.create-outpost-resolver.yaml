name: create-outpost-resolver
description: Creates a Route 53 Resolver on an Outpost.
flags:
    --creator-request-id=!: A unique string that identifies the request and that allows failed requests to be retried without the risk of running the operation twice.
    --instance-count=: Number of Amazon EC2 instances for the Resolver on Outpost.
    --name=!: A friendly name that lets you easily find a configuration in the Resolver dashboard in the Route 53 console.
    --outpost-arn=!: The Amazon Resource Name (ARN) of the Outpost.
    --preferred-instance-type=!: The Amazon EC2 instance type.
    --tags=: A string that helps identify the Route 53 Resolvers on Outpost.
documentation:
    command: Creates a Route 53 Resolver on an Outpost.
    flag:
        creator-request-id: |-
            A unique string that identifies the request and that allows failed requests to be retried without the risk of running the operation twice.

            `CreatorRequestId` can be any unique string, for example, a date/time stamp.
        instance-count: Number of Amazon EC2 instances for the Resolver on Outpost. The default and minimal value is 4.
        name: A friendly name that lets you easily find a configuration in the Resolver dashboard in the Route 53 console.
        outpost-arn: The Amazon Resource Name (ARN) of the Outpost. If you specify this, you must also specify a value for the `PreferredInstanceType`.
        preferred-instance-type: The Amazon EC2 instance type. If you specify this, you must also specify a value for the `OutpostArn`.
        tags: A string that helps identify the Route 53 Resolvers on Outpost.
