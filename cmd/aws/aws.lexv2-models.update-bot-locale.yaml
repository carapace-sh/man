name: update-bot-locale
description: Updates the settings that a bot has for a specific locale.
flags:
    --bot-id=!: The unique identifier of the bot that contains the locale.
    --bot-version=!: The version of the bot that contains the locale to be updated.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The new description of the locale.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --generative-ai-settings=: Contains settings for generative AI features powered by Amazon Bedrock for your bot locale.
    --locale-id=!: The identifier of the language and locale to update.
    --nlu-intent-confidence-threshold=!: The new confidence threshold where Amazon Lex inserts the `AMAZON.FallbackIntent` and `AMAZON.KendraSearchIntent` intents in the list of possible intents for an utterance.
    --speech-detection-sensitivity=: The new sensitivity level for voice activity detection (VAD) in the bot locale.
    --voice-settings=: The new Amazon Polly voice Amazon Lex should use for voice interaction with the user.
completion:
    flag:
        speech-detection-sensitivity:
            - Default
            - HighNoiseTolerance
            - MaximumNoiseTolerance
documentation:
    command: Updates the settings that a bot has for a specific locale.
    flag:
        bot-id: The unique identifier of the bot that contains the locale.
        bot-version: The version of the bot that contains the locale to be updated. The version can only be the `DRAFT` version.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The new description of the locale.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generative-ai-settings: Contains settings for generative AI features powered by Amazon Bedrock for your bot locale. Use this object to turn generative AI features on and off. Pricing may differ if you turn a feature on. For more information, see LINK.
        locale-id: The identifier of the language and locale to update. The string must match one of the supported locales. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
        nlu-intent-confidence-threshold: The new confidence threshold where Amazon Lex inserts the `AMAZON.FallbackIntent` and `AMAZON.KendraSearchIntent` intents in the list of possible intents for an utterance.
        speech-detection-sensitivity: The new sensitivity level for voice activity detection (VAD) in the bot locale. This setting helps optimize speech recognition accuracy by adjusting how the system responds to background noise during voice interactions.
        voice-settings: The new Amazon Polly voice Amazon Lex should use for voice interaction with the user.
