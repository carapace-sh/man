name: get-identity-policies
description: Returns the requested sending authorization policies for the given identity (an email address or a domain).
flags:
    --identity=!: The identity for which the policies are retrieved.
    --policy-names=!: A list of the names of policies to be retrieved.
documentation:
    command: |-
        Returns the requested sending authorization policies for the given identity (an email address or a domain). The policies are returned as a map of policy names to policy contents. You can retrieve a maximum of 20 policies at a time.

        This operation is for the identity owner only. If you have not verified the identity, it returns an error.

        Sending authorization is a feature that enables an identity owner to authorize other senders to use its identities. For information about using sending authorization, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/dg/sending-authorization.html).

        You can execute this operation no more than once per second.
    flag:
        identity: |-
            The identity for which the policies are retrieved. You can specify an identity by using its name or by using its Amazon Resource Name (ARN). Examples: `user@example.com`, `example.com`, `arn:aws:ses:us-east-1:123456789012:identity/example.com`.

            To successfully call this operation, you must own the identity.
        policy-names: A list of the names of policies to be retrieved. You can retrieve a maximum of 20 policies at a time. If you do not know the names of the policies that are attached to the identity, you can use `ListIdentityPolicies`.
