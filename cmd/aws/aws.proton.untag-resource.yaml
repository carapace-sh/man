name: untag-resource
description: Remove a customer tag from a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to remove customer tags from.
    --tag-keys=!: A list of customer tag keys that indicate the customer tags to be removed from the resource.
documentation:
    command: |-
        Remove a customer tag from a resource. A tag is a key-value pair of metadata associated with an Proton resource.

        For more information, see [Proton resources and tagging](https://docs.aws.amazon.com/proton/latest/userguide/resources.html) in the *Proton User Guide*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to remove customer tags from.
        tag-keys: A list of customer tag keys that indicate the customer tags to be removed from the resource.
