name: assign-private-ip-addresses
description: Assigns the specified secondary private IP addresses to the specified network interface.
flags:
    --allow-reassignment: Indicates whether to allow an IP address that is already assigned to another network interface or instance to be reassigned to the specified network interface.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ipv4-prefix-count=: The number of IPv4 prefixes that Amazon Web Services automatically assigns to the network interface.
    --ipv4-prefixes=:
        description: One or more IPv4 prefixes assigned to the network interface.
        nargs: -1
    --network-interface-id=!: The ID of the network interface.
    --no-allow-reassignment: Indicates whether to allow an IP address that is already assigned to another network interface or instance to be reassigned to the specified network interface.
    --private-ip-addresses=:
        description: The IP addresses to be assigned as a secondary private IP address to the network interface.
        nargs: -1
    --secondary-private-ip-address-count=: The number of secondary IP addresses to assign to the network interface.
documentation:
    command: |-
        Assigns the specified secondary private IP addresses to the specified network interface.

        You can specify specific secondary IP addresses, or you can specify the number of secondary IP addresses to be automatically assigned from the subnet's CIDR block range. The number of secondary IP addresses that you can assign to an instance varies by instance type. For more information about Elastic IP addresses, see [Elastic IP Addresses](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/elastic-ip-addresses-eip.html) in the *Amazon EC2 User Guide*.

        When you move a secondary private IP address to another network interface, any Elastic IP address that is associated with the IP address is also moved.

        Remapping an IP address is an asynchronous operation. When you move an IP address from one network interface to another, check `network/interfaces/macs/mac/local-ipv4s` in the instance metadata to confirm that the remapping is complete.

        You must specify either the IP addresses or the IP address count in the request.

        You can optionally use Prefix Delegation on the network interface. You must specify either the IPv4 Prefix Delegation prefixes, or the IPv4 Prefix Delegation count. For information, see [Assigning prefixes to network interfaces](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-prefix-eni.html) in the *Amazon EC2 User Guide*.
    flag:
        allow-reassignment: Indicates whether to allow an IP address that is already assigned to another network interface or instance to be reassigned to the specified network interface.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ipv4-prefix-count: The number of IPv4 prefixes that Amazon Web Services automatically assigns to the network interface. You can't use this option if you use the `Ipv4 Prefixes` option.
        ipv4-prefixes: One or more IPv4 prefixes assigned to the network interface. You can't use this option if you use the `Ipv4PrefixCount` option.
        network-interface-id: The ID of the network interface.
        private-ip-addresses: |-
            The IP addresses to be assigned as a secondary private IP address to the network interface. You can't specify this parameter when also specifying a number of secondary IP addresses.

            If you don't specify an IP address, Amazon EC2 automatically selects an IP address within the subnet range.
        secondary-private-ip-address-count: The number of secondary IP addresses to assign to the network interface. You can't specify this parameter when also specifying private IP addresses.
