name: send-activation-code
description: Sends an activation code to a contact channel.
flags:
    --contact-channel-id=!: The Amazon Resource Name (ARN) of the contact channel.
documentation:
    command: Sends an activation code to a contact channel. The contact can use this code to activate the contact channel in the console or with the `ActivateChannel` operation. Incident Manager can't engage a contact channel until it has been activated.
    flag:
        contact-channel-id: The Amazon Resource Name (ARN) of the contact channel.
