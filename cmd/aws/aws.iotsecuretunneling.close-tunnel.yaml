name: close-tunnel
description: Closes a tunnel identified by the unique tunnel id.
flags:
    --delete=: When set to true, IoT Secure Tunneling deletes the tunnel data immediately.
    --tunnel-id=!: The ID of the tunnel to close.
documentation:
    command: |-
        Closes a tunnel identified by the unique tunnel id. When a `CloseTunnel` request is received, we close the WebSocket connections between the client and proxy server so no data can be transmitted.

        Requires permission to access the [CloseTunnel](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        delete: When set to true, IoT Secure Tunneling deletes the tunnel data immediately.
        tunnel-id: The ID of the tunnel to close.
