name: get-ipam-prefix-list-resolver-versions
description: Retrieves version information for an IPAM prefix list resolver.
flags:
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --filters=: One or more filters to limit the results.
    --ipam-prefix-list-resolver-id=!: The ID of the IPAM prefix list resolver whose versions you want to retrieve.
    --ipam-prefix-list-resolver-versions=: Specific version numbers to retrieve.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token for the next page of results.
    --no-dry-run&: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
documentation:
    command: |-
        Retrieves version information for an IPAM prefix list resolver.

        Each version is a snapshot of what CIDRs matched your rules at that moment in time. The version number increments every time the CIDR list changes due to infrastructure changes.

        **Version example:**

        **Initial State (Version 1)**

        Production environment:

        - vpc-prod-web (10.1.0.0/16) - tagged env=prod
        - vpc-prod-db (10.2.0.0/16) - tagged env=prod

        Resolver rule: Include all VPCs tagged env=prod

        **Version 1 CIDRs:** 10.1.0.0/16, 10.2.0.0/16

        **Infrastructure Change (Version 2)**

        New VPC added:

        - vpc-prod-api (10.3.0.0/16) - tagged env=prod

        IPAM automatically detects the change and creates a new version.

        **Version 2 CIDRs:** 10.1.0.0/16, 10.2.0.0/16, 10.3.0.0/16
    flag:
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: One or more filters to limit the results.
        ipam-prefix-list-resolver-id: The ID of the IPAM prefix list resolver whose versions you want to retrieve.
        ipam-prefix-list-resolver-versions: Specific version numbers to retrieve. If not specified, all versions are returned.
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token for the next page of results.
