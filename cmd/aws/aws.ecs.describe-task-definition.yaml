name: describe-task-definition
description: Describes a task definition.
flags:
    --include=: Determines whether to see the resource tags for the task definition.
    --task-definition=!: The `family` for the latest `ACTIVE` revision, `family` and `revision` (`family:revision`) for a specific revision in the family, or full Amazon Resource Name (ARN) of the task definition to describe.
documentation:
    command: |-
        Describes a task definition. You can specify a `family` and `revision` to find information about a specific task definition, or you can simply specify the family to find the latest `ACTIVE` revision in that family.

        You can only describe `INACTIVE` task definitions while an active task or service references them.
    flag:
        include: Determines whether to see the resource tags for the task definition. If `TAGS` is specified, the tags are included in the response. If this field is omitted, tags aren't included in the response.
        task-definition: The `family` for the latest `ACTIVE` revision, `family` and `revision` (`family:revision`) for a specific revision in the family, or full Amazon Resource Name (ARN) of the task definition to describe.
