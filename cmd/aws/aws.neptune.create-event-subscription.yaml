name: create-event-subscription
description: Creates an event notification subscription.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enabled: A Boolean value; set to **true** to activate the subscription, set to **false** to create the subscription but not active it.
    --event-categories=:
        description: A list of event categories for a SourceType that you want to subscribe to.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enabled: A Boolean value; set to **true** to activate the subscription, set to **false** to create the subscription but not active it.
    --sns-topic-arn=!: The Amazon Resource Name (ARN) of the SNS topic created for event notification.
    --source-ids=:
        description: The list of identifiers of the event sources for which events are returned.
        nargs: -1
    --source-type=: The type of source that is generating the events.
    --subscription-name=!: The name of the subscription.
    --tags=:
        description: The tags to be applied to the new event subscription.
        nargs: -1
documentation:
    command: |-
        Creates an event notification subscription. This action requires a topic ARN (Amazon Resource Name) created by either the Neptune console, the SNS console, or the SNS API. To obtain an ARN with SNS, you must create a topic in Amazon SNS and subscribe to the topic. The ARN is displayed in the SNS console.

        You can specify the type of source (SourceType) you want to be notified of, provide a list of Neptune sources (SourceIds) that triggers the events, and provide a list of event categories (EventCategories) for events you want to be notified of. For example, you can specify SourceType = db-instance, SourceIds = mydbinstance1, mydbinstance2 and EventCategories = Availability, Backup.

        If you specify both the SourceType and SourceIds, such as SourceType = db-instance and SourceIdentifier = myDBInstance1, you are notified of all the db-instance events for the specified source. If you specify a SourceType but do not specify a SourceIdentifier, you receive notice of the events for that source type for all your Neptune sources. If you do not specify either the SourceType nor the SourceIdentifier, you are notified of events generated from all Neptune sources belonging to your customer account.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enabled: A Boolean value; set to **true** to activate the subscription, set to **false** to create the subscription but not active it.
        event-categories: A list of event categories for a SourceType that you want to subscribe to. You can see a list of the categories for a given SourceType by using the **DescribeEventCategories** action.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        sns-topic-arn: The Amazon Resource Name (ARN) of the SNS topic created for event notification. The ARN is created by Amazon SNS when you create a topic and subscribe to it.
        source-ids: |-
            The list of identifiers of the event sources for which events are returned. If not specified, then all sources are included in the response. An identifier must begin with a letter and must contain only ASCII letters, digits, and hyphens; it can't end with a hyphen or contain two consecutive hyphens.

            Constraints:

            - If SourceIds are supplied, SourceType must also be provided.
            - If the source type is a DB instance, then a `DBInstanceIdentifier` must be supplied.
            - If the source type is a DB security group, a `DBSecurityGroupName` must be supplied.
            - If the source type is a DB parameter group, a `DBParameterGroupName` must be supplied.
            - If the source type is a DB snapshot, a `DBSnapshotIdentifier` must be supplied.
        source-type: |-
            The type of source that is generating the events. For example, if you want to be notified of events generated by a DB instance, you would set this parameter to db-instance. if this value is not specified, all events are returned.

            Valid values: `db-instance` | `db-cluster` | `db-parameter-group` | `db-security-group` | `db-snapshot` | `db-cluster-snapshot`
        subscription-name: |-
            The name of the subscription.

            Constraints: The name must be less than 255 characters.
        tags: The tags to be applied to the new event subscription.
