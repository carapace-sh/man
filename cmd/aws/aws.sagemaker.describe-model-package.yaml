name: describe-model-package
description: Returns a description of the specified model package, which is used to create SageMaker models or list them on Amazon Web Services Marketplace.
flags:
    --model-package-name=!: The name or Amazon Resource Name (ARN) of the model package to describe.
documentation:
    command: |-
        Returns a description of the specified model package, which is used to create SageMaker models or list them on Amazon Web Services Marketplace.

        If you provided a KMS Key ID when you created your model package, you will see the [KMS Decrypt](https://docs.aws.amazon.com/kms/latest/APIReference/API_Decrypt.html) API call in your CloudTrail logs when you use this API.

        To create models in SageMaker, buyers can subscribe to model packages listed on Amazon Web Services Marketplace.
    flag:
        model-package-name: |-
            The name or Amazon Resource Name (ARN) of the model package to describe.

            When you specify a name, the name must have 1 to 63 characters. Valid characters are a-z, A-Z, 0-9, and - (hyphen).
