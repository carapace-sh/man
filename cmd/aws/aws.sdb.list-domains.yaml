name: list-domains
description: The `ListDomains` operation lists all domains associated with the Access Key ID.
flags:
    --max-number-of-domains=: The maximum number of domain names you want returned.
    --next-token=: A string informing Amazon SimpleDB where to start the next list of domain names.
documentation:
    command: The `ListDomains` operation lists all domains associated with the Access Key ID. It returns domain names up to the limit set by [MaxNumberOfDomains](#MaxNumberOfDomains). A [NextToken](#NextToken) is returned if there are more than `MaxNumberOfDomains` domains. Calling `ListDomains` successive times with the `NextToken` provided by the operation returns up to `MaxNumberOfDomains` more domain names with each successive operation call.
    flag:
        max-number-of-domains: The maximum number of domain names you want returned. The range is 1 to 100. The default setting is 100.
        next-token: A string informing Amazon SimpleDB where to start the next list of domain names.
