name: create-image-builder-streaming-url
description: Creates a URL to start an image builder streaming session.
flags:
    --name=!: The name of the image builder.
    --validity=: The time that the streaming URL will be valid, in seconds.
documentation:
    command: Creates a URL to start an image builder streaming session.
    flag:
        name: The name of the image builder.
        validity: The time that the streaming URL will be valid, in seconds. Specify a value between 1 and 604800 seconds. The default is 3600 seconds.
