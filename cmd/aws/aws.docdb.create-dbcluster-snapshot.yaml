name: create-dbcluster-snapshot
description: Creates a snapshot of a cluster.
flags:
    --dbcluster-identifier=!: The identifier of the cluster to create a snapshot for.
    --dbcluster-snapshot-identifier=!: The identifier of the cluster snapshot.
    --tags=: The tags to be assigned to the cluster snapshot.
documentation:
    command: Creates a snapshot of a cluster.
    flag:
        dbcluster-identifier: |-
            The identifier of the cluster to create a snapshot for. This parameter is not case sensitive.

            Constraints:

            - Must match the identifier of an existing `DBCluster`.

            Example: `my-cluster`
        dbcluster-snapshot-identifier: |-
            The identifier of the cluster snapshot. This parameter is stored as a lowercase string.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens.
            - The first character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.

            Example: `my-cluster-snapshot1`
        tags: The tags to be assigned to the cluster snapshot.
