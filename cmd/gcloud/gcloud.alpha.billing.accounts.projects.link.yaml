name: link
description: '*(ALPHA)*  *(DEPRECATED)*  Link a project with a billing account.'
flags:
    --account-id=: (DEPRECATED) Specify a billing account ID.
    --billing-account=: Specify a billing account ID.
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  The `gcloud alpha billing accounts projects` group has been moved to `gcloud
        billing projects`. Please use the new, shorter commands instead.

        This command links a billing account to a project.

        If the specified billing account is open, this enables billing on the
        project.
    flag:
        account-id: |-
            (DEPRECATED) Specify a billing account ID. Billing account IDs are of the form `0X0X0X-0X0X0X-0X0X0X`. To see available IDs, run `$ gcloud billing accounts list`.
            +
            The `--account-id` flag has been renamed `--billing-account`.
        billing-account: Specify a billing account ID. Billing account IDs are of the form `0X0X0X-0X0X0X-0X0X0X`. To see available IDs, run `$ gcloud billing accounts list`.
