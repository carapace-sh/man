name: list-recipes
description: Lists all of the DataBrew recipes that are defined.
flags:
    --max-results=: The maximum number of results to return in this request.
    --next-token=: The token returned by a previous call to retrieve the next set of results.
    --recipe-version=: Return only those recipes with a version identifier of `LATEST_WORKING` or `LATEST_PUBLISHED`.
documentation:
    command: Lists all of the DataBrew recipes that are defined.
    flag:
        max-results: The maximum number of results to return in this request.
        next-token: The token returned by a previous call to retrieve the next set of results.
        recipe-version: |-
            Return only those recipes with a version identifier of `LATEST_WORKING` or `LATEST_PUBLISHED`. If `RecipeVersion` is omitted, `ListRecipes` returns all of the `LATEST_PUBLISHED` recipe versions.

            Valid values: `LATEST_WORKING` | `LATEST_PUBLISHED`
