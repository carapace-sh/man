name: create-export-image-task
description: Creates a task to export a WorkSpaces Applications image to an EC2 AMI.
flags:
    --ami-description=: An optional description for the exported AMI.
    --ami-name=!: The name for the exported EC2 AMI.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role-arn=!: The ARN of the IAM role that allows WorkSpaces Applications to create the AMI.
    --image-name=!: The name of the WorkSpaces Applications image to export.
    --tag-specifications=: The tags to apply to the exported AMI.
documentation:
    command: Creates a task to export a WorkSpaces Applications image to an EC2 AMI. This allows you to use your customized WorkSpaces Applications images with other AWS services or for backup purposes.
    flag:
        ami-description: An optional description for the exported AMI. This description will be applied to the resulting EC2 AMI.
        ami-name: The name for the exported EC2 AMI. This is a required field that must be unique within your account and region.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role-arn: The ARN of the IAM role that allows WorkSpaces Applications to create the AMI. The role must have permissions to copy images, describe images, and create tags, with a trust relationship allowing appstream.amazonaws.com to assume the role.
        image-name: The name of the WorkSpaces Applications image to export. The image must be in an available state and owned by your account.
        tag-specifications: The tags to apply to the exported AMI. These tags help you organize and manage your EC2 AMIs.
