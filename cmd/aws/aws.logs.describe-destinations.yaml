name: describe-destinations
description: Lists all your destinations.
flags:
    --destination-name-prefix=: The prefix to match.
    --limit=: The maximum number of items returned.
    --next-token=: The token for the next set of items to return.
documentation:
    command: Lists all your destinations. The results are ASCII-sorted by destination name.
    flag:
        destination-name-prefix: The prefix to match. If you don't specify a value, no prefix filter is applied.
        limit: The maximum number of items returned. If you don't specify a value, the default maximum value of 50 items is used.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
