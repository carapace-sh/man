name: list-command-executions
description: List all command executions.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --command-arn=: The Amazon Resource Number (ARN) of the command.
    --completed-time-filter=: List all command executions that completed any time before or after the date and time that you specify.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of results to return in this operation.
    --namespace=: The namespace of the command.
    --next-token=: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise `null` to receive the first set of results.
    --page-size=: The size of each page to get in the AWS service call.
    --sort-order=: Specify whether to list the command executions that were created in the ascending or descending order.
    --started-time-filter=: List all command executions that started any time before or after the date and time that you specify.
    --starting-token=: A token to specify where to start paginating.
    --status=: List all command executions for the device that have a particular status.
    --target-arn=: The Amazon Resource Number (ARN) of the target device.
completion:
    flag:
        namespace:
            - AWS-IoT
            - AWS-IoT-FleetWise
        sort-order:
            - ASCENDING
            - DESCENDING
        status:
            - CREATED
            - IN_PROGRESS
            - SUCCEEDED
            - FAILED
            - REJECTED
            - TIMED_OUT
documentation:
    command: |-
        List all command executions.

        - You must provide only the `startedTimeFilter` or the `completedTimeFilter` information. If you provide both time filters, the API will generate an error. You can use this information to retrieve a list of command executions within a specific timeframe.
        - You must provide only the `commandArn` or the `thingArn` information depending on whether you want to list executions for a specific command or an IoT thing. If you provide both fields, the API will generate an error.

        For more information about considerations for using this API, see [List command executions in your account (CLI)](https://docs.aws.amazon.com/iot/latest/developerguide/iot-remote-command-execution-start-monitor.html#iot-remote-command-execution-list-cli).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        command-arn: The Amazon Resource Number (ARN) of the command. You can use this information to list all command executions for a particular command.
        completed-time-filter: List all command executions that completed any time before or after the date and time that you specify. The date and time uses the format `yyyy-MM-dd'T'HH:mm`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of results to return in this operation.
        namespace: The namespace of the command.
        next-token: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise `null` to receive the first set of results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sort-order: Specify whether to list the command executions that were created in the ascending or descending order. By default, the API returns all commands in the descending order based on the start time or completion time of the executions, that are determined by the `startTimeFilter` and `completeTimeFilter` parameters.
        started-time-filter: List all command executions that started any time before or after the date and time that you specify. The date and time uses the format `yyyy-MM-dd'T'HH:mm`.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status: List all command executions for the device that have a particular status. For example, you can filter the list to display only command executions that have failed or timed out.
        target-arn: The Amazon Resource Number (ARN) of the target device. You can use this information to list all command executions for a particular device.
