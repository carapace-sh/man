name: create-presigned-url
description: Creates a presigned URL for an S3 POST operation to upload a file.
flags:
    --app-id=!: The unique identifier of the Q App the file is associated with.
    --card-id=!: The unique identifier of the card the file is associated with.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --file-contents-sha256=!: The Base64-encoded SHA-256 digest of the contents of the file to be uploaded.
    --file-name=!: The name of the file to be uploaded.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-id=!: The unique identifier of the Amazon Q Business application environment instance.
    --scope=!: Whether the file is associated with a Q App definition or a specific Q App session.
    --session-id=: The unique identifier of the Q App session the file is associated with, if applicable.
completion:
    flag:
        scope:
            - APPLICATION
            - SESSION
documentation:
    command: |-
        Creates a presigned URL for an S3 POST operation to upload a file. You can use this URL to set a default file for a `FileUploadCard` in a Q App definition or to provide a file for a single Q App run. The `scope` parameter determines how the file will be used, either at the app definition level or the app session level.

        The IAM permissions are derived from the `qapps:ImportDocument` action. For more information on the IAM policy for Amazon Q Apps, see [IAM permissions for using Amazon Q Apps](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/deploy-q-apps-iam-permissions.html).
    flag:
        app-id: The unique identifier of the Q App the file is associated with.
        card-id: The unique identifier of the card the file is associated with.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        file-contents-sha256: The Base64-encoded SHA-256 digest of the contents of the file to be uploaded.
        file-name: The name of the file to be uploaded.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-id: The unique identifier of the Amazon Q Business application environment instance.
        scope: Whether the file is associated with a Q App definition or a specific Q App session.
        session-id: The unique identifier of the Q App session the file is associated with, if applicable.
