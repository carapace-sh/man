name: delete
description: Delete a Google Cloud VMware Engine private cloud.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --delay-hours=: Number of hours to wait before deleting the private cloud.
    --location=: Location of the private cloud or cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
completion:
    flag:
        delay-hours:
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
            - "7"
            - "8"
documentation:
    command: |
        Marks a VMware Engine private cloud for deletion. The resource is deleted 3 hours after being marked for deletion. This process can be reversed by using `gcloud vmware private-clouds undelete`.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        delay-hours: 'Number of hours to wait before deleting the private cloud. Specifying a value of `0` for this field begins the deletion process immediately. _DELAY_HOURS_ must be one of: *0*, *1*, *2*, *3*, *4*, *5*, *6*, *7*, *8*.'
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `private_cloud` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
