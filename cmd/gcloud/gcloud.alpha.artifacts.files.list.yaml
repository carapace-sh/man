name: list
description: '*(ALPHA)*  List Artifact Registry files.'
flags:
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --location=: Location of the repository.
    --package=: List all files in a specified artifact, such as a container image or a language package.
    --page-size=: Some services group resource list output into pages.
    --repository=: ID of the repository or fully qualified identifier for the repository.
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --tag=: List all files in the artifact version with the specified tag.
documentation:
    command: |-
        *(ALPHA)*  List all Artifact Registry files in the specified repository and location.

        To specify the maximum number of files to list, use the --limit flag.
    flag:
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        location: |-
            Location of the repository.
            +
            To set the `location` attribute:
            * provide the argument `--repository` on the command line with a fully specified name;
            * set the property `artifacts/repository` with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        package: List all files in a specified artifact, such as a container image or a language package. If you do not use --tag or --version in the command, the command lists files in all versions of the artifact.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        repository: |-
            ID of the repository or fully qualified identifier for the repository.
            +
            To set the `repository` attribute:
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        tag: List all files in the artifact version with the specified tag. This flag only works with formats that use tags, such as container images. Use the --package flag to specify the artifact.
