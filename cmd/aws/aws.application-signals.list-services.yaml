name: list-services
description: Returns a list of services that have been discovered by Application Signals.
flags:
    --aws-account-id=: Amazon Web Services Account ID.
    --end-time=!: The end of the time period to retrieve information about.
    --include-linked-accounts: If you are using this operation in a monitoring account, specify `true` to include services from source accounts in the returned data.
    --max-results=: The maximum number of results to return in one operation.
    --next-token=: Include this value, if it was returned by the previous operation, to get the next set of services.
    --no-include-linked-accounts&: If you are using this operation in a monitoring account, specify `true` to include services from source accounts in the returned data.
    --start-time=!: The start of the time period to retrieve information about.
documentation:
    command: Returns a list of services that have been discovered by Application Signals. A service represents a minimum logical and transactional unit that completes a business function. Services are discovered through Application Signals instrumentation.
    flag:
        aws-account-id: Amazon Web Services Account ID.
        end-time: |-
            The end of the time period to retrieve information about. When used in a raw HTTP Query API, it is formatted as be epoch time in seconds. For example: `1698778057`

            Your requested start time will be rounded to the nearest hour.
        include-linked-accounts: If you are using this operation in a monitoring account, specify `true` to include services from source accounts in the returned data.
        max-results: The maximum number of results to return in one operation. If you omit this parameter, the default of 50 is used.
        next-token: Include this value, if it was returned by the previous operation, to get the next set of services.
        start-time: |-
            The start of the time period to retrieve information about. When used in a raw HTTP Query API, it is formatted as be epoch time in seconds. For example: `1698778057`

            Your requested start time will be rounded to the nearest hour.
