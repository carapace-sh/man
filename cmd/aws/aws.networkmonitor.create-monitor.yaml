name: create-monitor
description: Creates a monitor between a source subnet and destination IP address.
flags:
    --aggregation-period=: The time, in seconds, that metrics are aggregated and sent to Amazon CloudWatch.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier to ensure the idempotency of the request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --monitor-name=!: The name identifying the monitor.
    --probes=:
        description: Displays a list of all of the probes created for a monitor.
        nargs: -1
    --tags=: The list of key-value pairs created and assigned to the monitor.
documentation:
    command: |-
        Creates a monitor between a source subnet and destination IP address. Within a monitor you'll create one or more probes that monitor network traffic between your source Amazon Web Services VPC subnets and your destination IP addresses. Each probe then aggregates and sends metrics to Amazon CloudWatch.

        You can also create a monitor with probes using this command. For each probe, you define the following:

        - `source`—The subnet IDs where the probes will be created.
        - `destination`— The target destination IP address for the probe.
        - `destinationPort`—Required only if the protocol is `TCP`.
        - `protocol`—The communication protocol between the source and destination. This will be either `TCP` or `ICMP`.
        - `packetSize`—The size of the packets. This must be a number between `56` and `8500`.
        - (Optional) `tags` —Key-value pairs created and assigned to the probe.
    flag:
        aggregation-period: The time, in seconds, that metrics are aggregated and sent to Amazon CloudWatch. Valid values are either `30` or `60`. `60` is the default if no period is chosen.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier to ensure the idempotency of the request. Only returned if a client token was provided in the request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        monitor-name: The name identifying the monitor. It can contain only letters, underscores (\_), or dashes (-), and can be up to 200 characters.
        probes: Displays a list of all of the probes created for a monitor.
        tags: The list of key-value pairs created and assigned to the monitor.
