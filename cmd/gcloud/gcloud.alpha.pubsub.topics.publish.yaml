name: publish
description: '*(ALPHA)*  Publishes a message to the specified topic.'
flags:
    --attribute=: Comma-separated list of attributes.
    --message=: The body of the message to publish to the given topic name.
    --ordering-key=: The key for ordering delivery to subscribers.
documentation:
    command: |-
        *(ALPHA)*  Publishes a message to the specified topic name for testing and
        troubleshooting. Use with caution: all associated subscribers must
        be able to consume and acknowledge any message you publish,
        otherwise the system will continuously re-attempt delivery of the
        bad message for 7 days.
    flag:
        attribute: Comma-separated list of attributes. Each ATTRIBUTE has the form name="value". You can specify up to 100 attributes.
        message: |-
            The body of the message to publish to the given topic name.
            Information on message formatting and size limits can be found at:
            https://cloud.google.com/pubsub/docs/publisher#publish
        ordering-key: |-
            The key for ordering delivery to subscribers. All messages with
                      the same ordering key are sent to subscribers in the order that
                      Pub/Sub receives them.
