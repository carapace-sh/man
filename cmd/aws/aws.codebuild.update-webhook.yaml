name: update-webhook
description: Updates the webhook associated with an CodeBuild build project.
flags:
    --branch-filter=: A regular expression used to determine which repository branches are built when a webhook is triggered.
    --build-type=: Specifies the type of build this webhook will trigger.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filter-groups=:
        description: An array of arrays of `WebhookFilter` objects used to determine if a webhook event can trigger a build.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-rotate-secret: A boolean value that specifies whether the associated GitHub repository's secret token should be updated.
    --project-name=!: The name of the CodeBuild project.
    --pull-request-build-policy=: A PullRequestBuildPolicy object that defines comment-based approval requirements for triggering builds on pull requests.
    --rotate-secret: A boolean value that specifies whether the associated GitHub repository's secret token should be updated.
completion:
    flag:
        build-type:
            - BUILD
            - BUILD_BATCH
            - RUNNER_BUILDKITE_BUILD
documentation:
    command: |-
        Updates the webhook associated with an CodeBuild build project.

        If you use Bitbucket for your repository, `rotateSecret` is ignored.
    flag:
        branch-filter: |-
            A regular expression used to determine which repository branches are built when a webhook is triggered. If the name of a branch matches the regular expression, then it is built. If `branchFilter` is empty, then all branches are built.

            It is recommended that you use `filterGroups` instead of `branchFilter`.
        build-type: |-
            Specifies the type of build this webhook will trigger.

            `RUNNER_BUILDKITE_BUILD` is only available for `NO_SOURCE` source type projects configured for Buildkite runner builds. For more information about CodeBuild-hosted Buildkite runner builds, see [Tutorial: Configure a CodeBuild-hosted Buildkite runner](https://docs.aws.amazon.com/codebuild/latest/userguide/sample-runner-buildkite.html) in the *CodeBuild user guide*.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filter-groups: An array of arrays of `WebhookFilter` objects used to determine if a webhook event can trigger a build. A filter group must contain at least one `EVENT` `WebhookFilter`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        project-name: The name of the CodeBuild project.
        pull-request-build-policy: A PullRequestBuildPolicy object that defines comment-based approval requirements for triggering builds on pull requests. This policy helps control when automated builds are executed based on contributor permissions and approval workflows.
        rotate-secret: A boolean value that specifies whether the associated GitHub repository's secret token should be updated. If you use Bitbucket for your repository, `rotateSecret` is ignored.
