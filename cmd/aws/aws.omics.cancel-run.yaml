name: cancel-run
description: Cancels a run using its ID and returns a response with no body if the operation is successful.
flags:
    --id=!: The run's ID.
documentation:
    command: Cancels a run using its ID and returns a response with no body if the operation is successful. To confirm that the run has been cancelled, use the `ListRuns` API operation to check that it is no longer listed.
    flag:
        id: The run's ID.
