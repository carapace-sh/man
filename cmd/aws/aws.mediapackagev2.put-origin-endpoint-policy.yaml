name: put-origin-endpoint-policy
description: Attaches an IAM policy to the specified origin endpoint.
flags:
    --cdn-auth-configuration=: The settings for using authorization headers between the MediaPackage endpoint and your CDN.
    --channel-group-name=!: The name that describes the channel group.
    --channel-name=!: The name that describes the channel.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --origin-endpoint-name=!: The name that describes the origin endpoint.
    --policy=!: The policy to attach to the specified origin endpoint.
documentation:
    command: Attaches an IAM policy to the specified origin endpoint. You can attach only one policy with each request.
    flag:
        cdn-auth-configuration: |-
            The settings for using authorization headers between the MediaPackage endpoint and your CDN.

            For information about CDN authorization, see [CDN authorization in Elemental MediaPackage](https://docs.aws.amazon.com/mediapackage/latest/userguide/cdn-auth.html) in the MediaPackage user guide.
        channel-group-name: The name that describes the channel group. The name is the primary identifier for the channel group, and must be unique for your account in the AWS Region.
        channel-name: The name that describes the channel. The name is the primary identifier for the channel, and must be unique for your account in the AWS Region and channel group.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        origin-endpoint-name: The name that describes the origin endpoint. The name is the primary identifier for the origin endpoint, and and must be unique for your account in the AWS Region and channel.
        policy: The policy to attach to the specified origin endpoint.
