name: describe-launch-configurations
description: Gets information about the launch configurations in the account and Region.
flags:
    --launch-configuration-names=: The launch configuration names.
    --max-records=: The maximum number of items to return with this call.
    --next-token=: The token for the next set of items to return.
documentation:
    command: Gets information about the launch configurations in the account and Region.
    flag:
        launch-configuration-names: |-
            The launch configuration names. If you omit this property, all launch configurations are described.

            Array Members: Maximum number of 50 items.
        max-records: The maximum number of items to return with this call. The default value is `50` and the maximum value is `100`.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
