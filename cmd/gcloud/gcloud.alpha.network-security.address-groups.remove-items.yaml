name: remove-items
description: '*(ALPHA)*  Remove items from an address group.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --items=: Items to be removed from the address group.
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Remove items from an existing address group.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        items: Items to be removed from the address group.
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `address_group` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
