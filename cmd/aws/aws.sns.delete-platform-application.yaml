name: delete-platform-application
description: Deletes a platform application object for one of the supported push notification services, such as APNS and GCM (Firebase Cloud Messaging).
flags:
    --platform-application-arn=!: '`PlatformApplicationArn` of platform application object to delete.'
documentation:
    command: Deletes a platform application object for one of the supported push notification services, such as APNS and GCM (Firebase Cloud Messaging). For more information, see [Using Amazon SNS Mobile Push Notifications](https://docs.aws.amazon.com/sns/latest/dg/SNSMobilePush.html).
    flag:
        platform-application-arn: '`PlatformApplicationArn` of platform application object to delete.'
