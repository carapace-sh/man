name: create-push-notification-registration
description: Creates registration for a device token and a chat contact to receive real-time push notifications.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --contact-configuration=!: The contact configuration for push notification registration.
    --device-token=!: The push notification token issued by the Apple or Google gateways.
    --device-type=!: The device type to use when sending the message.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --pinpoint-app-arn=!: The Amazon Resource Name (ARN) of the Pinpoint application.
completion:
    flag:
        device-type:
            - GCM
            - APNS
            - APNS_SANDBOX
documentation:
    command: Creates registration for a device token and a chat contact to receive real-time push notifications. For more information about push notifications, see [Set up push notifications in Amazon Connect for mobile chat](https://docs.aws.amazon.com/connect/latest/adminguide/enable-push-notifications-for-mobile-chat.html) in the *Amazon Connect Administrator Guide*.
