name: add-tags-to-on-premises-instances
description: Adds tags to on-premises instances.
flags:
    --instance-names=!: The names of the on-premises instances to which to add tags.
    --tags=!: The tag key-value pairs to add to the on-premises instances.
documentation:
    command: Adds tags to on-premises instances.
    flag:
        instance-names: The names of the on-premises instances to which to add tags.
        tags: |-
            The tag key-value pairs to add to the on-premises instances.

            Keys and values are both required. Keys cannot be null or empty strings. Value-only tags are not allowed.
