name: export-system-policy
description: '*(ALPHA)*  Export the Binary Authorization system policy.'
flags:
    --location=: The region for which to get the system policy (or "global").
completion:
    flag:
        location:
            - global
            - africa-south1
            - asia-east1
            - asia-east2
            - asia-northeast1
            - asia-northeast2
            - asia-northeast3
            - asia-south1
            - asia-south2
            - asia-southeast1
            - asia-southeast2
            - australia-southeast1
            - australia-southeast2
            - europe-central2
            - europe-north1
            - europe-southwest1
            - europe-west1
            - europe-west10
            - europe-west12
            - europe-west2
            - europe-west3
            - europe-west4
            - europe-west6
            - europe-west8
            - europe-west9
            - me-central1
            - me-central2
            - me-west1
            - northamerica-northeast1
            - northamerica-northeast2
            - southamerica-east1
            - southamerica-west1
            - us-central1
            - us-central2
            - us-east1
            - us-east4
            - us-east5
            - us-east7
            - us-south1
            - us-west1
            - us-west2
            - us-west3
            - us-west4
            - us-west8
documentation:
    command: |-
        *(ALPHA)*  For reliability reasons, the system policy is updated one region at a time.
        Because of this precaution, the system policy can differ between regions
        during an update. Use --location to view the system policy of a specific
        region.

        If --location is not specified, an arbitrary region is used. (Specifically, a
        region in the last group of regions to receive updates. Since most changes are
        additions, this will show the minimal set of system images that are allowed
        in all regions.)

        ## EXAMPLES

        To view the system policy:

            $ gcloud alpha container binauthz policy export-system-policy

        To view the system policy in the region us-central1:

            $ gcloud alpha container binauthz policy export-system-policy --location=us-central1
    flag:
        location: 'The region for which to get the system policy (or "global"). _LOCATION_ must be one of: *global*, *africa-south1*, *asia-east1*, *asia-east2*, *asia-northeast1*, *asia-northeast2*, *asia-northeast3*, *asia-south1*, *asia-south2*, *asia-southeast1*, *asia-southeast2*, *australia-southeast1*, *australia-southeast2*, *europe-central2*, *europe-north1*, *europe-southwest1*, *europe-west1*, *europe-west10*, *europe-west12*, *europe-west2*, *europe-west3*, *europe-west4*, *europe-west6*, *europe-west8*, *europe-west9*, *me-central1*, *me-central2*, *me-west1*, *northamerica-northeast1*, *northamerica-northeast2*, *southamerica-east1*, *southamerica-west1*, *us-central1*, *us-central2*, *us-east1*, *us-east4*, *us-east5*, *us-east7*, *us-south1*, *us-west1*, *us-west2*, *us-west3*, *us-west4*, *us-west8*.'
