name: renew-lease
description: '*(ALPHA)*  Renew the lease on a task in a pull queue.'
flags:
    --lease-duration=!: The number of seconds for the desired new lease duration, starting from now.
    --location=: The location where we want to manage the queue or task.
    --queue=: The queue the task belongs to.
    --schedule-time=!: The task's current schedule time.
documentation:
    command: '*(ALPHA)*  Renew the lease on a task in a pull queue.'
    flag:
        lease-duration: The number of seconds for the desired new lease duration, starting from now. The maximum lease duration is 1 week.
        location: The location where we want to manage the queue or task. If not specified, uses the location of the current project's App Engine app if there is an associated app.
        queue: The queue the task belongs to.
        schedule-time: |-
            The task's current schedule time. This restriction is to check that the
            caller is renewing the correct task.
