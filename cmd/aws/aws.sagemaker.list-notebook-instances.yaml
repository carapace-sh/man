name: list-notebook-instances
description: Returns a list of the SageMaker AI notebook instances in the requester's account in an Amazon Web Services Region.
flags:
    --additional-code-repository-equals=: A filter that returns only notebook instances with associated with the specified git repository.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creation-time-after=: A filter that returns only notebook instances that were created after the specified time (timestamp).
    --creation-time-before=: A filter that returns only notebook instances that were created before the specified time (timestamp).
    --default-code-repository-contains=: A string in the name or URL of a Git repository associated with this notebook instance.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --last-modified-time-after=: A filter that returns only notebook instances that were modified after the specified time (timestamp).
    --last-modified-time-before=: A filter that returns only notebook instances that were modified before the specified time (timestamp).
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of notebook instances to return.
    --name-contains=: A string in the notebook instances' name.
    --next-token=: If the previous call to the `ListNotebookInstances` is truncated, the response includes a `NextToken`.
    --notebook-instance-lifecycle-config-name-contains=: A string in the name of a notebook instances lifecycle configuration associated with this notebook instance.
    --page-size=: The size of each page to get in the AWS service call.
    --sort-by=: The field to sort results by.
    --sort-order=: The sort order for results.
    --starting-token=: A token to specify where to start paginating.
    --status-equals=: A filter that returns only notebook instances with the specified status.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
            - Status
        sort-order:
            - Ascending
            - Descending
        status-equals:
            - Pending
            - InService
            - Stopping
            - Stopped
            - Failed
            - Deleting
            - Updating
documentation:
    command: Returns a list of the SageMaker AI notebook instances in the requester's account in an Amazon Web Services Region.
    flag:
        additional-code-repository-equals: A filter that returns only notebook instances with associated with the specified git repository.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        creation-time-after: A filter that returns only notebook instances that were created after the specified time (timestamp).
        creation-time-before: A filter that returns only notebook instances that were created before the specified time (timestamp).
        default-code-repository-contains: A string in the name or URL of a Git repository associated with this notebook instance. This filter returns only notebook instances associated with a git repository with a name that contains the specified string.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        last-modified-time-after: A filter that returns only notebook instances that were modified after the specified time (timestamp).
        last-modified-time-before: A filter that returns only notebook instances that were modified before the specified time (timestamp).
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of notebook instances to return.
        name-contains: A string in the notebook instances' name. This filter returns only notebook instances whose name contains the specified string.
        next-token: |-
            If the previous call to the `ListNotebookInstances` is truncated, the response includes a `NextToken`. You can use this token in your subsequent `ListNotebookInstances` request to fetch the next set of notebook instances.

            You might specify a filter or a sort order in your request. When response is truncated, you must use the same values for the filer and sort order in the next request.
        notebook-instance-lifecycle-config-name-contains: A string in the name of a notebook instances lifecycle configuration associated with this notebook instance. This filter returns only notebook instances associated with a lifecycle configuration with a name that contains the specified string.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sort-by: The field to sort results by. The default is `Name`.
        sort-order: The sort order for results.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status-equals: A filter that returns only notebook instances with the specified status.
