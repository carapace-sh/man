name: create-transit-gateway-prefix-list-reference
description: Creates a reference (route) to a prefix list in a specified transit gateway route table.
flags:
    --blackhole: Indicates whether to drop traffic that matches this route.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-blackhole: Indicates whether to drop traffic that matches this route.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --prefix-list-id=!: The ID of the prefix list that is used for destination matches.
    --transit-gateway-attachment-id=: The ID of the attachment to which traffic is routed.
    --transit-gateway-route-table-id=!: The ID of the transit gateway route table.
documentation:
    command: Creates a reference (route) to a prefix list in a specified transit gateway route table.
    flag:
