name: create-multi-region-endpoint
description: Creates a multi-region endpoint (global-endpoint).
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --details=!: Contains details of a multi-region endpoint (global-endpoint) being created.
    --endpoint-name=!: The name of the multi-region endpoint (global-endpoint).
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --tags=:
        description: An array of objects that define the tags (keys and values) to associate with the multi-region endpoint (global-endpoint).
        nargs: -1
documentation:
    command: |-
        Creates a multi-region endpoint (global-endpoint).

        The primary region is going to be the AWS-Region where the operation is executed. The secondary region has to be provided in request's parameters. From the data flow standpoint there is no difference between primary and secondary regions - sending traffic will be split equally between the two. The primary region is the region where the resource has been created and where it can be managed.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        details: Contains details of a multi-region endpoint (global-endpoint) being created.
        endpoint-name: The name of the multi-region endpoint (global-endpoint).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tags: An array of objects that define the tags (keys and values) to associate with the multi-region endpoint (global-endpoint).
