name: describe-metric-filters
description: Lists the specified metric filters.
flags:
    --filter-name-prefix=: The prefix to match.
    --limit=: The maximum number of items returned.
    --log-group-name=: The name of the log group.
    --metric-name=: Filters results to include only those with the specified metric name.
    --metric-namespace=: Filters results to include only those in the specified namespace.
    --next-token=: The token for the next set of items to return.
documentation:
    command: Lists the specified metric filters. You can list all of the metric filters or filter the results by log name, prefix, metric name, or metric namespace. The results are ASCII-sorted by filter name.
    flag:
        filter-name-prefix: The prefix to match. CloudWatch Logs uses the value that you set here only if you also include the `logGroupName` parameter in your request.
        limit: The maximum number of items returned. If you don't specify a value, the default is up to 50 items.
        log-group-name: The name of the log group.
        metric-name: Filters results to include only those with the specified metric name. If you include this parameter in your request, you must also include the `metricNamespace` parameter.
        metric-namespace: Filters results to include only those in the specified namespace. If you include this parameter in your request, you must also include the `metricName` parameter.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
