name: delete
description: '*(ALPHA)*  Delete an Artifact Registry repository.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location of the repository.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Delete an Artifact Registry repository. Before you delete a repository, ensure that any
        active dependencies on this repository are adjusted to use a new location.

        This command can fail for the following reasons:
          * The specified repository does not exist.
          * The active account does not have permission to delete repositories.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Location of the repository. Overrides the default artifacts/location property value
            for this command invocation. To configure the default location, use the command:
            gcloud config set artifacts/location.
            +

            To set the `location` attribute:
            * provide the argument `repository` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
