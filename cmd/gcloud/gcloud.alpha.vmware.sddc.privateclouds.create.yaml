name: create
description: '*(ALPHA)*  Create a VMware Engine private cloud.'
hidden: true
flags:
    --description=: Text describing the private cloud
    --labels=: List of label KEY=VALUE pairs to add.
    --management-ip-range=!: IP address range available to the private cloud for management access,
    --region=: Region of the private cloud or cluster.
    --vpc-network=!: Name of the virtual network for this private cloud
    --workload-ip-range=!: IP address range available to the private cloud in address/mask
documentation:
    command: |
        *(ALPHA)*  Create a VMware Engine private cloud. Private cloud creation is
        considered finished when the private cloud is in READY state. Check
        the progress of a private cloud using
        `gcloud alpha vmware privateclouds list`.
    flag:
        description: Text describing the private cloud
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        management-ip-range: |-
            IP address range available to the private cloud for management access,
            in address/mask format. For example,
            `--management-ip-range=10.0.1.0/29`.
        region: |-
            Region of the private cloud or cluster.
            +
            To set the `region` attribute:
            * provide the argument `privatecloud` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `vmware/region`.
        vpc-network: Name of the virtual network for this private cloud
        workload-ip-range: |-
            IP address range available to the private cloud in address/mask
            format. For example, `--workload-ip-range=10.0.1.0/29`.
