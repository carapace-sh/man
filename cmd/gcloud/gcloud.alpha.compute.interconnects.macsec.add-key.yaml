name: add-key
description: '*(ALPHA)*  Add pre-shared key to a Compute Engine interconnect MACsec configuration.'
flags:
    --key-name=!: A name of pre-shared key being added to MACsec configuration of the
    --start-time=: A RFC3339 timestamp on or after which the key is valid.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute interconnects macsec add-key* is used to add a pre-shared key to MACsec configuration of
        interconnect.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        key-name: |-
            A name of pre-shared key being added to MACsec configuration of the
            interconnect. The name must be 1-63 characters long, and comply with
            RFC1035.
        start-time: |-
            A RFC3339 timestamp on or after which the key is valid. startTime can be
            in the future. If the keychain has a single key, --start-time can be
            omitted. If the keychain has multiple keys, --start-time is mandatory for
            each key. The start times of two consecutive keys must be at least 6 hours
            apart.
