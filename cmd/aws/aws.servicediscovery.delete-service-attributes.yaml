name: delete-service-attributes
description: Deletes specific attributes associated with a service.
flags:
    --attributes=!: A list of keys corresponding to each attribute that you want to delete.
    --service-id=!: The ID or Amazon Resource Name (ARN) of the service from which the attributes will be deleted.
documentation:
    command: Deletes specific attributes associated with a service.
    flag:
        attributes: A list of keys corresponding to each attribute that you want to delete.
        service-id: The ID or Amazon Resource Name (ARN) of the service from which the attributes will be deleted. For services created in a namespace shared with your Amazon Web Services account, specify the service ARN. For more information about shared namespaces, see [Cross-account Cloud Map namespace sharing](https://docs.aws.amazon.com/cloud-map/latest/dg/sharing-namespaces.html) in the *Cloud Map Developer Guide*.
