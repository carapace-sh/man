name: update-global-settings
description: Updates whether the Amazon Web Services account is opted in to cross-account backup.
flags:
    --global-settings=: 'Inputs can include:'
documentation:
    command: Updates whether the Amazon Web Services account is opted in to cross-account backup. Returns an error if the account is not an Organizations management account. Use the `DescribeGlobalSettings` API to determine the current settings.
    flag:
        global-settings: |-
            Inputs can include:

            A value for `isCrossAccountBackupEnabled` and a Region. Example: `update-global-settings --global-settings isCrossAccountBackupEnabled=false --region us-west-2`.

            A value for Multi-party approval, styled as "Mpa": `isMpaEnabled`. Values can be true or false. Example: `update-global-settings --global-settings isMpaEnabled=false --region us-west-2`.
