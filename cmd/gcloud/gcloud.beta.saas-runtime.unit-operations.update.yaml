    --no-cancel&: When true, attempt to cancel the operation.
    --no-clear-labels&: Clear labels value and set to empty map.
    --no-clear-parent-unit-operation&: Clear parent_unit_operation value and set to null.
    --no-clear-provision-input-variables&: Clear provision_input_variables value and set to empty list.
    --no-clear-provision-release&: Clear provision_release value and set to null.
    --no-clear-rollout&: Clear rollout value and set to null.
    --no-clear-upgrade-input-variables&: Clear upgrade_input_variables value and set to empty list.
    --no-clear-upgrade-release&: Clear upgrade_release value and set to null.
    --no-deprovision&: This flag can be used to specify an empty deprovision operation.
    --no-provision&: This flag can be used to specify an empty provision operation.
    --no-upgrade&: This flag can be used to specify an empty upgrade operation.
    --parent-unit-operation=!: ID of the parentUnitOperation or fully qualified identifier for the parentUnitOperation.
    --provision: This flag can be used to specify an empty provision operation.
    --provision-input-variables=: Set provision_input_variables to new value.
    --provision-release=!: ID of the release or fully qualified identifier for the release.
    --remove-labels=: Remove existing value from map labels.
    --remove-provision-input-variables=: Remove existing value from provision_input_variables list.
    --remove-upgrade-input-variables=: Remove existing value from upgrade_input_variables list.
