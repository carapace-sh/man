name: update-feature-metadata
description: Updates the description and parameters of the feature group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description that you can write to better describe the feature.
    --feature-group-name=!: The name or Amazon Resource Name (ARN) of the feature group containing the feature that you're updating.
    --feature-name=!: The name of the feature that you're updating.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --parameter-additions=:
        description: A list of key-value pairs that you can add to better describe the feature.
        nargs: -1
    --parameter-removals=:
        description: A list of parameter keys that you can specify to remove parameters that describe your feature.
        nargs: -1
documentation:
    command: Updates the description and parameters of the feature group.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description that you can write to better describe the feature.
        feature-group-name: The name or Amazon Resource Name (ARN) of the feature group containing the feature that you're updating.
        feature-name: The name of the feature that you're updating.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        parameter-additions: A list of key-value pairs that you can add to better describe the feature.
        parameter-removals: A list of parameter keys that you can specify to remove parameters that describe your feature.
