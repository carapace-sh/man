name: get-container-services
description: Returns information about one or more of your Amazon Lightsail container services.
flags:
    --service-name=: The name of the container service for which to return information.
documentation:
    command: Returns information about one or more of your Amazon Lightsail container services.
    flag:
        service-name: |-
            The name of the container service for which to return information.

            When omitted, the response includes all of your container services in the Amazon Web Services Region where the request is made.
