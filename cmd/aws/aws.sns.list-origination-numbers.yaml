name: list-origination-numbers
description: Lists the calling Amazon Web Services account's dedicated origination numbers and their metadata.
flags:
    --max-results=: The maximum number of origination numbers to return.
    --next-token=: Token that the previous `ListOriginationNumbers` request returns.
documentation:
    command: Lists the calling Amazon Web Services account's dedicated origination numbers and their metadata. For more information about origination numbers, see [Origination numbers](https://docs.aws.amazon.com/sns/latest/dg/channels-sms-originating-identities-origination-numbers.html) in the *Amazon SNS Developer Guide*.
    flag:
        max-results: The maximum number of origination numbers to return.
        next-token: Token that the previous `ListOriginationNumbers` request returns.
