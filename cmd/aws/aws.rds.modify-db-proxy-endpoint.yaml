name: modify-db-proxy-endpoint
description: Changes the settings for an existing DB proxy endpoint.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-proxy-endpoint-name=!: The name of the DB proxy sociated with the DB proxy endpoint that you want to modify.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --new-db-proxy-endpoint-name=: The new identifier for the `DBProxyEndpoint`.
    --vpc-security-group-ids=: The VPC security group IDs for the DB proxy endpoint.
documentation:
    command: Changes the settings for an existing DB proxy endpoint.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-proxy-endpoint-name: The name of the DB proxy sociated with the DB proxy endpoint that you want to modify.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        new-db-proxy-endpoint-name: The new identifier for the `DBProxyEndpoint`. An identifier must begin with a letter and must contain only ASCII letters, digits, and hyphens; it can't end with a hyphen or contain two consecutive hyphens.
        vpc-security-group-ids: The VPC security group IDs for the DB proxy endpoint. When the DB proxy endpoint uses a different VPC than the original proxy, you also specify a different set of security group IDs than for the original proxy.
