name: create-hsm-configuration
description: Creates an HSM configuration that contains the information required by an Amazon Redshift cluster to store and use database encryption keys in a Hardware Security Module (HSM).
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=!: A text description of the HSM configuration to be created.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hsm-configuration-identifier=!: The identifier to be assigned to the new Amazon Redshift HSM configuration.
    --hsm-ip-address=!: The IP address that the Amazon Redshift cluster must use to access the HSM.
    --hsm-partition-name=!: The name of the partition in the HSM where the Amazon Redshift clusters will store their database encryption keys.
    --hsm-partition-password=!: The password required to access the HSM partition.
    --hsm-server-public-certificate=!: The HSMs public certificate file.
    --tags=:
        description: A list of tag instances.
        nargs: -1
documentation:
    command: |-
        Creates an HSM configuration that contains the information required by an Amazon Redshift cluster to store and use database encryption keys in a Hardware Security Module (HSM). After creating the HSM configuration, you can specify it as a parameter when creating a cluster. The cluster will then store its encryption keys in the HSM.

        In addition to creating an HSM configuration, you must also create an HSM client certificate. For more information, go to [Hardware Security Modules](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-HSM.html) in the Amazon Redshift Cluster Management Guide.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A text description of the HSM configuration to be created.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hsm-configuration-identifier: The identifier to be assigned to the new Amazon Redshift HSM configuration.
        hsm-ip-address: The IP address that the Amazon Redshift cluster must use to access the HSM.
        hsm-partition-name: The name of the partition in the HSM where the Amazon Redshift clusters will store their database encryption keys.
        hsm-partition-password: The password required to access the HSM partition.
        hsm-server-public-certificate: The HSMs public certificate file. When using Cloud HSM, the file name is server.pem.
        tags: A list of tag instances.
