name: list-recipes
description: Returns a list of available recipes.
flags:
    --domain=: Filters returned recipes by domain for a Domain dataset group.
    --max-results=: The maximum number of recipes to return.
    --next-token=: A token returned from the previous call to `ListRecipes` for getting the next set of recipes (if they exist).
    --recipe-provider=: The default is `SERVICE`.
completion:
    flag:
        domain:
            - ECOMMERCE
            - VIDEO_ON_DEMAND
        recipe-provider:
            - SERVICE
documentation:
    command: Returns a list of available recipes. The response provides the properties for each recipe, including the recipe's Amazon Resource Name (ARN).
    flag:
        domain: Filters returned recipes by domain for a Domain dataset group. Only recipes (Domain dataset group use cases) for this domain are included in the response. If you don't specify a domain, all recipes are returned.
        max-results: The maximum number of recipes to return.
        next-token: A token returned from the previous call to `ListRecipes` for getting the next set of recipes (if they exist).
        recipe-provider: The default is `SERVICE`.
