    --remove-default-object-acl-grant=: Removes default object ACL grant.
    --remove-labels=: Remove labels by their key names.
    --requester-pays: Allows you to configure a Cloud Storage bucket so that the requester pays all costs related to accessing the bucket and its objects.
    --retention-period=: Minimum [retention period](https://cloud.google.com/storage/docs/bucket-lock#retention-periods) for objects stored in the bucket, for example ``--retention-period=P1Y1M1DT5S''.
