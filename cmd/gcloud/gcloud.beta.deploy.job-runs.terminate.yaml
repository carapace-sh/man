name: terminate
description: '*(BETA)*  Terminates a Cloud Deploy job run.'
flags:
    --delivery-pipeline=: The delivery pipeline associated with the job_run.
    --override-deploy-policies=: Deploy policies to override
    --region=: The Cloud region for the job_run.
    --release=: The release associated with the job_run.
    --rollout=: The rollout associated with the job_run.
documentation:
    command: '*(BETA)*  Terminates a Cloud Deploy job run.'
    flag:
        delivery-pipeline: |-
            The delivery pipeline associated with the job_run.  Alternatively, set the property [deploy/delivery-pipeline].
            +
            To set the `delivery-pipeline` attribute:
            * provide the argument `job_run` on the command line with a fully specified name;
            * provide the argument `--delivery-pipeline` on the command line;
            * set the property `deploy/delivery_pipeline`.
        override-deploy-policies: Deploy policies to override
        region: |-
            The Cloud region for the job_run.  Alternatively, set the property [deploy/region].
            +
            To set the `region` attribute:
            * provide the argument `job_run` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
        release: |-
            The release associated with the job_run.
            +
            To set the `release` attribute:
            * provide the argument `job_run` on the command line with a fully specified name;
            * provide the argument `--release` on the command line.
        rollout: |-
            The rollout associated with the job_run.
            +
            To set the `rollout` attribute:
            * provide the argument `job_run` on the command line with a fully specified name;
            * provide the argument `--rollout` on the command line.
