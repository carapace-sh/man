name: create-hsm
description: Creates a new hardware security module (HSM) in the specified CloudHSM cluster.
flags:
    --availability-zone=!: The Availability Zone where you are creating the HSM.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-id=!: The identifier (ID) of the HSM's cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip-address=: The HSM's IP address.
documentation:
    command: |-
        Creates a new hardware security module (HSM) in the specified CloudHSM cluster.

        **Cross-account use:** No. You cannot perform this operation on an CloudHSM cluster in a different Amazon Web Service account.
    flag:
        availability-zone: The Availability Zone where you are creating the HSM. To find the cluster's Availability Zones, use [DescribeClusters]().
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-id: The identifier (ID) of the HSM's cluster. To find the cluster ID, use [DescribeClusters]().
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip-address: The HSM's IP address. If you specify an IP address, use an available address from the subnet that maps to the Availability Zone where you are creating the HSM. If you don't specify an IP address, one is chosen for you from that subnet.
