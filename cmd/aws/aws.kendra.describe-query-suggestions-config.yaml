name: describe-query-suggestions-config
description: Gets information on the settings of query suggestions for an index.
flags:
    --index-id=!: The identifier of the index with query suggestions that you want to get information on.
documentation:
    command: |-
        Gets information on the settings of query suggestions for an index.

        This is used to check the current settings applied to query suggestions.

        `DescribeQuerySuggestionsConfig` is currently not supported in the Amazon Web Services GovCloud (US-West) region.
    flag:
        index-id: The identifier of the index with query suggestions that you want to get information on.
