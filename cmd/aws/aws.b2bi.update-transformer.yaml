name: update-transformer
description: Updates the specified parameters for a transformer.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --edi-type=: Specifies the details for the EDI standard that is being used for the transformer.
    --file-format=: Specifies that the currently supported file formats for EDI transformations are `JSON` and `XML`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-conversion=: To update, specify the `InputConversion` object, which contains the format options for the inbound transformation.
    --mapping-template=: Specifies the mapping template for the transformer.
    --mapping=: Specify the structure that contains the mapping template and its language (either XSLT or JSONATA).
    --name=: Specify a new name for the transformer, if you want to update it.
    --output-conversion=: To update, specify the `OutputConversion` object, which contains the format options for the outbound transformation.
    --sample-document=: Specifies a sample EDI document that is used by a transformer as a guide for processing the EDI data.
    --sample-documents=: Specify a structure that contains the Amazon S3 bucket and an array of the corresponding keys used to identify the location for your sample documents.
    --status=: Specifies the transformer's status.
    --transformer-id=!: Specifies the system-assigned unique identifier for the transformer.
completion:
    flag:
        file-format:
            - XML
            - JSON
            - NOT_USED
        status:
            - active
            - inactive
documentation:
    command: Updates the specified parameters for a transformer. A transformer can take an EDI file as input and transform it into a JSON-or XML-formatted document. Alternatively, a transformer can take a JSON-or XML-formatted document as input and transform it into an EDI file.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        edi-type: Specifies the details for the EDI standard that is being used for the transformer. Currently, only X12 is supported. X12 is a set of standards and corresponding messages that define specific business documents.
        file-format: Specifies that the currently supported file formats for EDI transformations are `JSON` and `XML`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-conversion: To update, specify the `InputConversion` object, which contains the format options for the inbound transformation.
        mapping: Specify the structure that contains the mapping template and its language (either XSLT or JSONATA).
        mapping-template: |-
            Specifies the mapping template for the transformer. This template is used to map the parsed EDI file using JSONata or XSLT.

            This parameter is available for backwards compatibility. Use the [Mapping](https://docs.aws.amazon.com/b2bi/latest/APIReference/API_Mapping.html) data type instead.
        name: Specify a new name for the transformer, if you want to update it.
        output-conversion: To update, specify the `OutputConversion` object, which contains the format options for the outbound transformation.
        sample-document: Specifies a sample EDI document that is used by a transformer as a guide for processing the EDI data.
        sample-documents: Specify a structure that contains the Amazon S3 bucket and an array of the corresponding keys used to identify the location for your sample documents.
        status: Specifies the transformer's status. You can update the state of the transformer from `inactive` to `active`.
        transformer-id: Specifies the system-assigned unique identifier for the transformer.
