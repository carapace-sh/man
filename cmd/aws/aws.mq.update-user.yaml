name: update-user
description: Updates the information for an ActiveMQ user.
flags:
    --broker-id=!: The unique ID that Amazon MQ generates for the broker.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --console-access: Enables access to the the ActiveMQ Web Console for the ActiveMQ user.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --groups=:
        description: The list of groups (20 maximum) to which the ActiveMQ user belongs.
        nargs: -1
    --no-console-access: Enables access to the the ActiveMQ Web Console for the ActiveMQ user.
    --no-replication-user: Defines whether the user is intended for data replication.
    --password=: The password of the user.
    --replication-user: Defines whether the user is intended for data replication.
    --username=!: The username of the ActiveMQ user.
documentation:
    command: Updates the information for an ActiveMQ user.
    flag:
        broker-id: The unique ID that Amazon MQ generates for the broker.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        console-access: Enables access to the the ActiveMQ Web Console for the ActiveMQ user.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        groups: The list of groups (20 maximum) to which the ActiveMQ user belongs. This value can contain only alphanumeric characters, dashes, periods, underscores, and tildes (- . _ ~). This value must be 2-100 characters long.
        password: The password of the user. This value must be at least 12 characters long, must contain at least 4 unique characters, and must not contain commas, colons, or equal signs (,:=).
        replication-user: Defines whether the user is intended for data replication.
        username: The username of the ActiveMQ user. This value can contain only alphanumeric characters, dashes, periods, underscores, and tildes (- . _ ~). This value must be 2-100 characters long.
