        description: The description of the connectivity test.
        destination-cloud-sql-instance: A Cloud SQL instance URI as the destination endpoint.
        destination-forwarding-rule: A forwarding rule URI as the destination endpoint.
        destination-fqdn: A hostname as the destination endpoint. Only applicable for Google Kubernetes Engine.
        destination-gke-master-cluster: A cluster URI for Google Kubernetes Engine master as the destination endpoint.
        destination-instance: A Compute Engine instance URI as the destination endpoint.
        destination-ip-address: The IP address of the destination which can be an external or internal IP.
        destination-network: A VPC network URI where the destination is located.
        destination-port: |-
            The IP protocol port of the destination. Only applicable when protocol is
            TCP or UDP.
        destination-project: Project ID of the destination endpoint.
        destination-redis-cluster: A Redis cluster URI as the destination endpoint.
        destination-redis-instance: A Redis instance URI as the destination endpoint.
        labels: List of label KEY=VALUE pairs to add.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-bypass-firewall-checks: |
            This boolean controls whether to skip firewall checking. Use
            --no-bypass-firewall-checks to disable.
        no-clear-destination-cloud-sql-instance: |
            Clear existing destination Cloud SQL instance.
        no-clear-destination-forwarding-rule: |
            Clear existing destination forwarding rule.
        no-clear-destination-gke-master-cluster: |
            Clear existing destination cluster for Google Kubernetes Engine master.
        no-clear-destination-instance: Clear existing destination instance.
        no-clear-destination-ip-address: |
            Clear existing destination IP address.
        no-clear-destination-redis-cluster: |
            Clear existing destination Redis Cluster.
        no-clear-destination-redis-instance: |
            Clear existing destination Redis Instance.
        no-clear-source-app-engine-version: |
            Clear existing source App Engine version.
        no-clear-source-cloud-function: |
            Clear existing source Cloud function.
        no-clear-source-cloud-run-revision: |
            Clear existing source Cloud Run revision.
        no-clear-source-cloud-sql-instance: |
            Clear existing source Cloud SQL instance.
        no-clear-source-gke-master-cluster: |
            Clear existing source cluster for Google Kubernetes Engine master.
        no-clear-source-instance: |
            Clear existing source instance.
        no-clear-source-ip-address: |
            Clear existing source IP address.
        no-round-trip: |
            This boolean controls whether return traces (from the destination to the
            source) will be additionally calculated if packet successfully reaches
            the destination from the source. Use --no-round-trip to disable.
        other-projects: |-
            IDs of other projects involved in the connectivity test, besides
            the source and destination project.
        protocol: Type of protocol for the test. When not provided, "TCP" is assumed.
        round-trip: |-
            This boolean controls whether return traces (from the destination to the
            source) will be additionally calculated if packet successfully reaches
            the destination from the source. Use --no-round-trip to disable.
        source-app-engine-version: App Engine version URI as the source endpoint.
        source-cloud-function: A Cloud function URI as the source endpoint.
        source-cloud-run-revision: Cloud Run revision URI as the source endpoint.
        source-cloud-sql-instance: A Cloud SQL instance URI as the source endpoint.
        source-gke-master-cluster: A cluster URI for Google Kubernetes Engine master as the source endpoint.
        source-instance: A Compute Engine instance URI as the source endpoint.
        source-ip-address: The IP address of the source which can be an external or internal IP.
        source-network: A VPC network URI where the source is located.
        source-network-type: |-
            Type of the network where the source is located. _SOURCE_NETWORK_TYPE_ must be one of:
            +
            *gcp-network*::: Network in Google Cloud Platform.
            *non-gcp-network*::: Network outside Google Cloud Platform.
            :::
            +
        source-project: Project ID of the source endpoint.
