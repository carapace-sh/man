name: detect-sentiment
description: Inspects text and returns an inference of the prevailing sentiment (`POSITIVE`, `NEUTRAL`, `MIXED`, or `NEGATIVE`).
flags:
    --language-code=!: The language of the input documents.
    --text=!: A UTF-8 text string.
completion:
    flag:
        language-code:
            - en
            - es
            - fr
            - de
            - it
            - pt
            - ar
            - hi
            - ja
            - ko
            - zh
            - zh-TW
documentation:
    command: Inspects text and returns an inference of the prevailing sentiment (`POSITIVE`, `NEUTRAL`, `MIXED`, or `NEGATIVE`).
    flag:
        language-code: The language of the input documents. You can specify any of the primary languages supported by Amazon Comprehend. All documents must be in the same language.
        text: A UTF-8 text string. The maximum string size is 5 KB.
