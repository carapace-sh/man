name: register
description: Creates an IAM user for the on-premises instance
flags:
    --iam-user-arn=: The IAM user associated with the on-premises instance
    --instance-name=!: The name of the on-premises instance
    --tags=:
        description: The list of key/value pairs to tag the on-premises instance
        nargs: -1
documentation:
    command: |
        Creates an IAM user for the on-premises instance, if not provided,
        and saves the user’s credentials to an on-premises instance configuration file;
        registers the on-premises instance with AWS CodeDeploy; and optionally adds tags to the on-premises instance.
