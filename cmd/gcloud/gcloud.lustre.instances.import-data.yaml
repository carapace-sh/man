name: import-data
description: Imports data from Cloud Storage to Managed Lustre instance.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --gcs-path-uri=!: The URI to a Cloud Storage bucket, or a path within a bucket, using the
    --location=: The location id of the instance resource.
    --lustre-path=: The root directory path to the Managed Lustre file system.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --request-id=: UUID to identify requests.
    --service-account=!: ID of the serviceAccount or fully qualified identifier for the serviceAccount.
documentation:
    command: |
        Imports data from Cloud Storage to Managed Lustre instance.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        gcs-path-uri: |-
            The URI to a Cloud Storage bucket, or a path within a bucket, using the
            format `gs://<bucket_name>/<optional_path_inside_bucket>/`. If a path
            inside the bucket is specified, it must end with a forward slash (`/`).
        location: |-
            The location id of the instance resource.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        lustre-path: |-
            The root directory path to the Managed Lustre file system. Must start with
            `/`. Default is `/`. If you're importing data into Managed Lustre, any
            path other than the default must already exist on the file system.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        request-id: UUID to identify requests.
        service-account: |-
            ID of the serviceAccount or fully qualified identifier for the serviceAccount.
            +
            To set the `service-account` attribute:
            * provide the argument `--service-account` on the command line.
