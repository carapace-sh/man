name: gcs
description: '*(BETA)*  Import HL7v2 messages from Google Cloud Storage into a Cloud Healthcare API HL7v2 store.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --dataset=: Cloud Healthcare dataset.
    --gcs-uri=!: Cloud Storage source data locations.
    --location=: Google Cloud location.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(BETA)*  Import HL7v2 messages from Google Cloud Storage into a Cloud Healthcare API HL7v2 store.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        dataset: |-
            Cloud Healthcare dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `hl7v2_store` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
        gcs-uri: |-
            Cloud Storage source data locations. Each Cloud Storage object should
            be a text file that contains newline-delimited JSON objects. Each JSON
            object has a data field that contains a base64-encoded HL7v2 message.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `hl7v2_store` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
