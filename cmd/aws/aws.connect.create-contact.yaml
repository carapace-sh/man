name: create-contact
description: Only the VOICE, EMAIL, and TASK channels are supported.
flags:
    --attributes=: A custom key-value pair using an attribute map.
    --channel=!: The channel for the contact.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=: A description of the contact.
    --expiry-duration-in-minutes=: Number of minutes the contact will be active for before expiring
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --initiate-as=: Initial state of the contact when it's created.
    --initiation-method=!: Indicates how the contact was initiated.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --name=: The name of a the contact.
    --previous-contact-id=: The ID of the previous contact when creating a transfer contact.
    --references=: A formatted URL that is shown to an agent in the Contact Control Panel (CCP).
    --related-contact-id=: The identifier of the contact in this instance of Amazon Connect.
    --segment-attributes=: A set of system defined key-value pairs stored on individual contact segments (unique contact ID) using an attribute map.
    --user-info=: User details for the contact
completion:
    flag:
        channel:
            - VOICE
            - CHAT
            - TASK
            - EMAIL
        initiate-as:
            - CONNECTED_TO_USER
            - COMPLETED
        initiation-method:
            - INBOUND
            - OUTBOUND
            - TRANSFER
            - QUEUE_TRANSFER
            - CALLBACK
            - API
            - DISCONNECT
            - MONITOR
            - EXTERNAL_OUTBOUND
            - WEBRTC_API
            - AGENT_REPLY
            - FLOW
documentation:
    command: |-
        Only the VOICE, EMAIL, and TASK channels are supported.

        - For VOICE: The supported initiation method is `TRANSFER`. The contacts created with this initiation method have a subtype `connect:ExternalAudio`.
        - For EMAIL: The supported initiation methods are `OUTBOUND`, `AGENT_REPLY`, and `FLOW`.
        - For TASK: The supported initiation method is `API`. Contacts created with this API have a sub-type of `connect:ExternalTask`.

        Creates a new VOICE, EMAIL, or TASK contact.

        After a contact is created, you can move it to the desired state by using the `InitiateAs` parameter. While you can use API to create task contacts that are in the `COMPLETED` state, you must contact Amazon Web Services Support before using it for bulk import use cases. Bulk import causes your requests to be throttled or fail if your CreateContact limits aren't high enough.
    flag:
        attributes: |-
            A custom key-value pair using an attribute map. The attributes are standard Amazon Connect attributes, and can be accessed in flows just like any other contact attributes.

            There can be up to 32,768 UTF-8 bytes across all key-value pairs per contact. Attribute keys can include only alphanumeric, dash, and underscore characters.
        channel: |-
            The channel for the contact.

            The CHAT channel is not supported. The following information is incorrect. We're working to correct it.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        description: A description of the contact.
        expiry-duration-in-minutes: Number of minutes the contact will be active for before expiring
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        initiate-as: Initial state of the contact when it's created. Only TASK channel contacts can be initiated with `COMPLETED` state.
        initiation-method: |-
            Indicates how the contact was initiated.

            CreateContact only supports the following initiation methods. Valid values by channel are:

            - For VOICE: `TRANSFER` and the subtype `connect:ExternalAudio`
            - For EMAIL: `OUTBOUND` | `AGENT_REPLY` | `FLOW`
            - For TASK: `API`

            The other channels listed below are incorrect. We're working to correct this information.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        name: The name of a the contact.
        previous-contact-id: The ID of the previous contact when creating a transfer contact. This value can be provided only for external audio contacts. For more information, see [Integrate Amazon Connect Contact Lens with external voice systems](https://docs.aws.amazon.com/connect/latest/adminguide/contact-lens-integration.html) in the *Amazon Connect Administrator Guide*.
        references: 'A formatted URL that is shown to an agent in the Contact Control Panel (CCP). Tasks can have the following reference types at the time of creation: `URL` | `NUMBER` | `STRING` | `DATE` | `EMAIL` | `ATTACHMENT`.'
        related-contact-id: The identifier of the contact in this instance of Amazon Connect.
        segment-attributes: |-
            A set of system defined key-value pairs stored on individual contact segments (unique contact ID) using an attribute map. The attributes are standard Amazon Connect attributes. They can be accessed in flows.

            Attribute keys can include only alphanumeric, -, and \_.

            This field can be used to set Segment Contact Expiry as a duration in minutes.

            To set contact expiry, a ValueMap must be specified containing the integer number of minutes the contact will be active for before expiring, with `SegmentAttributes` like { `"connect:ContactExpiry": {"ValueMap" : { "ExpiryDuration": { "ValueInteger": 135}}}}`.
        user-info: |-
            User details for the contact

            UserInfo is required when creating an EMAIL contact with `OUTBOUND` and `AGENT_REPLY` contact initiation methods.
