name: create-aiprompt-version
description: Creates an Amazon Q in Connect AI Prompt version.
flags:
    --ai-prompt-id=!: The identifier of the Amazon Q in Connect AI prompt.
    --assistant-id=!: The identifier of the Amazon Q in Connect assistant.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --modified-time=: The time the AI Prompt was last modified.
documentation:
    command: Creates an Amazon Q in Connect AI Prompt version.
    flag:
        ai-prompt-id: The identifier of the Amazon Q in Connect AI prompt.
        assistant-id: The identifier of the Amazon Q in Connect assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](http://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/)..
        modified-time: The time the AI Prompt was last modified.
