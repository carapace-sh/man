name: create-protect-configuration
description: Create a new protect configuration.
flags:
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --deletion-protection-enabled: When set to true deletion protection is enabled.
    --no-deletion-protection-enabled: When set to true deletion protection is enabled.
    --tags=: An array of key and value pair tags that are associated with the resource.
documentation:
    command: Create a new protect configuration. By default all country rule sets for each capability are set to `ALLOW`. Update the country rule sets using `UpdateProtectConfigurationCountryRuleSet`. A protect configurations name is stored as a Tag with the key set to `Name` and value as the name of the protect configuration.
    flag:
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you don't specify a client token, a randomly generated token is used for the request to ensure idempotency.
        deletion-protection-enabled: When set to true deletion protection is enabled. By default this is set to false.
        tags: An array of key and value pair tags that are associated with the resource.
