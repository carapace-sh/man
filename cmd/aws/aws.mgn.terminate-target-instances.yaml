name: terminate-target-instances
description: Starts a job that terminates specific launched EC2 Test and Cutover instances.
flags:
    --account-id=: Terminate Target instance by Account ID
    --source-server-ids=!: Terminate Target instance by Source Server IDs.
    --tags=: Terminate Target instance by Tags.
documentation:
    command: Starts a job that terminates specific launched EC2 Test and Cutover instances. This command will not work for any Source Server with a lifecycle.state of TESTING, CUTTING\_OVER, or CUTOVER.
    flag:
        account-id: Terminate Target instance by Account ID
        source-server-ids: Terminate Target instance by Source Server IDs.
        tags: Terminate Target instance by Tags.
