name: list-objectives
description: Returns a paginated list of objectives from the Control Catalog.
flags:
    --max-results=: The maximum number of results on a page or for an API request call.
    --next-token=: The pagination token that's used to fetch the next set of results.
    --objective-filter=: An optional filter that narrows the results to a specific domain.
documentation:
    command: |-
        Returns a paginated list of objectives from the Control Catalog.

        You can apply an optional filter to see the objectives that belong to a specific domain. If you don’t provide a filter, the operation returns all objectives.
    flag:
        max-results: The maximum number of results on a page or for an API request call.
        next-token: The pagination token that's used to fetch the next set of results.
        objective-filter: |-
            An optional filter that narrows the results to a specific domain.

            This filter allows you to specify one domain ARN at a time. Passing multiple ARNs in the `ObjectiveFilter` isn’t supported.
