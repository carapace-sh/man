name: describe-application-versions
description: Retrieve a list of application versions.
flags:
    --application-name=: Specify an application name to show only application versions for that application.
    --max-records=: For a paginated request.
    --next-token=: For a paginated request.
    --version-labels=: Specify a version label to show a specific application version.
documentation:
    command: Retrieve a list of application versions.
    flag:
        application-name: Specify an application name to show only application versions for that application.
        max-records: |-
            For a paginated request. Specify a maximum number of application versions to include in each response.

            If no `MaxRecords` is specified, all available application versions are retrieved in a single response.
        next-token: |-
            For a paginated request. Specify a token from a previous response page to retrieve the next response page. All other parameter values must be identical to the ones specified in the initial request.

            If no `NextToken` is specified, the first page is retrieved.
        version-labels: Specify a version label to show a specific application version.
