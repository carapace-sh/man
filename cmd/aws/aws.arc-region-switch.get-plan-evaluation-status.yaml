name: get-plan-evaluation-status
description: Retrieves the evaluation status of a Region switch plan.
flags:
    --max-results=: The number of objects that you want to return with this call.
    --next-token=: Specifies that you want to receive the next page of results.
    --plan-arn=!: The Amazon Resource Name (ARN) of the Region switch plan to retrieve evaluation status for.
documentation:
    command: Retrieves the evaluation status of a Region switch plan. The evaluation status provides information about the last time the plan was evaluated and any warnings or issues detected.
    flag:
        max-results: The number of objects that you want to return with this call.
        next-token: Specifies that you want to receive the next page of results. Valid only if you received a `nextToken` response in the previous request. If you did, it indicates that more output is available. Set this parameter to the value provided by the previous call's `nextToken` response to request the next page of results.
        plan-arn: The Amazon Resource Name (ARN) of the Region switch plan to retrieve evaluation status for.
