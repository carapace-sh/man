name: add-flow-media-streams
description: Adds media streams to an existing flow.
flags:
    --flow-arn=!: The Amazon Resource Name (ARN) of the flow.
    --media-streams=!: The media streams that you want to add to the flow.
documentation:
    command: Adds media streams to an existing flow. After you add a media stream to a flow, you can associate it with a source and/or an output that uses the ST 2110 JPEG XS or CDI protocol.
    flag:
        flow-arn: The Amazon Resource Name (ARN) of the flow.
        media-streams: The media streams that you want to add to the flow.
