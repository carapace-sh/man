name: get-dedicated-ips
description: List the dedicated IP addresses that are associated with your Amazon Web Services account.
flags:
    --next-token=: A token returned from a previous call to `GetDedicatedIps` to indicate the position of the dedicated IP pool in the list of IP pools.
    --page-size=: The number of results to show in a single call to `GetDedicatedIpsRequest`.
    --pool-name=: The name of the IP pool that the dedicated IP address is associated with.
documentation:
    command: List the dedicated IP addresses that are associated with your Amazon Web Services account.
    flag:
        next-token: A token returned from a previous call to `GetDedicatedIps` to indicate the position of the dedicated IP pool in the list of IP pools.
        page-size: The number of results to show in a single call to `GetDedicatedIpsRequest`. If the number of results is larger than the number you specified in this parameter, then the response includes a `NextToken` element, which you can use to obtain additional results.
        pool-name: The name of the IP pool that the dedicated IP address is associated with.
