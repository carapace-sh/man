name: describe-multi-region-parameter-groups
description: Returns a list of multi-region parameter groups.
flags:
    --max-results=: The maximum number of records to include in the response.
    --multi-region-parameter-group-name=: The request for information on a specific multi-region parameter group.
    --next-token=: An optional token returned from a prior request.
documentation:
    command: Returns a list of multi-region parameter groups.
    flag:
        max-results: The maximum number of records to include in the response. If more records exist than the specified MaxResults value, a token is included in the response so that the remaining results can be retrieved.
        multi-region-parameter-group-name: The request for information on a specific multi-region parameter group.
        next-token: An optional token returned from a prior request. Use this token for pagination of results from this action. If this parameter is specified, the response includes only results beyond the token, up to the value specified by MaxResults.
