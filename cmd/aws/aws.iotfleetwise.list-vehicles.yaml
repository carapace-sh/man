name: list-vehicles
description: Retrieves a list of summaries of created vehicles.
flags:
    --attribute-names=: The fully qualified names of the attributes.
    --attribute-values=: Static information about a vehicle attribute value in string format.
    --list-response-scope=: 'When you set the `listResponseScope` parameter to `METADATA_ONLY`, the list response includes: vehicle name, Amazon Resource Name (ARN), creation time, and last modification time.'
    --max-results=: The maximum number of items to return, between 1 and 100, inclusive.
    --model-manifest-arn=: The Amazon Resource Name (ARN) of a vehicle model (model manifest).
    --next-token=: A pagination token for the next set of results.
completion:
    flag:
        list-response-scope:
            - METADATA_ONLY
documentation:
    command: |-
        Retrieves a list of summaries of created vehicles.

        This API operation uses pagination. Specify the `nextToken` parameter in the request to return more results.
    flag:
        attribute-names: The fully qualified names of the attributes. You can use this optional parameter to list the vehicles containing all the attributes in the request. For example, `attributeNames` could be "`Vehicle.Body.Engine.Type, Vehicle.Color`" and the corresponding `attributeValues` could be "`1.3 L R2, Blue`" . In this case, the API will filter vehicles with an attribute name `Vehicle.Body.Engine.Type` that contains a value of `1.3 L R2` AND an attribute name `Vehicle.Color` that contains a value of "`Blue`". A request must contain unique values for the `attributeNames` filter and the matching number of `attributeValues` filters to return the subset of vehicles that match the attributes filter condition.
        attribute-values: Static information about a vehicle attribute value in string format. You can use this optional parameter in conjunction with `attributeNames` to list the vehicles containing all the `attributeValues` corresponding to the `attributeNames` filter. For example, `attributeValues` could be "`1.3 L R2, Blue`" and the corresponding `attributeNames` filter could be "`Vehicle.Body.Engine.Type, Vehicle.Color`". In this case, the API will filter vehicles with attribute name `Vehicle.Body.Engine.Type` that contains a value of `1.3 L R2` AND an attribute name `Vehicle.Color` that contains a value of "`Blue`". A request must contain unique values for the `attributeNames` filter and the matching number of `attributeValues` filter to return the subset of vehicles that match the attributes filter condition.
        list-response-scope: 'When you set the `listResponseScope` parameter to `METADATA_ONLY`, the list response includes: vehicle name, Amazon Resource Name (ARN), creation time, and last modification time.'
        max-results: The maximum number of items to return, between 1 and 100, inclusive.
        model-manifest-arn: The Amazon Resource Name (ARN) of a vehicle model (model manifest). You can use this optional parameter to list only the vehicles created from a certain vehicle model.
        next-token: |-
            A pagination token for the next set of results.

            If the results of a search are large, only a portion of the results are returned, and a `nextToken` pagination token is returned in the response. To retrieve the next set of results, reissue the search request and include the returned token. When all results have been returned, the response does not contain a pagination token value.
