name: revoke-snapshot-access
description: Removes the ability of the specified Amazon Web Services account to restore the specified snapshot.
flags:
    --account-with-restore-access=!: The identifier of the Amazon Web Services account that can no longer restore the specified snapshot.
    --snapshot-arn=: The Amazon Resource Name (ARN) of the snapshot associated with the message to revoke access.
    --snapshot-cluster-identifier=: The identifier of the cluster the snapshot was created from.
    --snapshot-identifier=: The identifier of the snapshot that the account can no longer access.
documentation:
    command: |-
        Removes the ability of the specified Amazon Web Services account to restore the specified snapshot. If the account is currently restoring the snapshot, the restore will run to completion.

        For more information about working with snapshots, go to [Amazon Redshift Snapshots](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-snapshots.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        account-with-restore-access: The identifier of the Amazon Web Services account that can no longer restore the specified snapshot.
        snapshot-arn: The Amazon Resource Name (ARN) of the snapshot associated with the message to revoke access.
        snapshot-cluster-identifier: The identifier of the cluster the snapshot was created from. This parameter is required if your IAM user has a policy containing a snapshot resource element that specifies anything other than * for the cluster name.
        snapshot-identifier: The identifier of the snapshot that the account can no longer access.
