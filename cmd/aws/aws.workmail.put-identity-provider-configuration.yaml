name: put-identity-provider-configuration
description: Enables integration between IAM Identity Center (IdC) and WorkMail to proxy authentication requests for mailbox users.
flags:
    --authentication-mode=!: The authentication mode used in WorkMail.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-center-configuration=!: The details of the IAM Identity Center configuration.
    --organization-id=!: The ID of the WorkMail Organization.
    --personal-access-token-configuration=!: The details of the Personal Access Token configuration.
completion:
    flag:
        authentication-mode:
            - IDENTITY_PROVIDER_ONLY
            - IDENTITY_PROVIDER_AND_DIRECTORY
documentation:
    command: Enables integration between IAM Identity Center (IdC) and WorkMail to proxy authentication requests for mailbox users. You can connect your IdC directory or your external directory to WorkMail through IdC and manage access to WorkMail mailboxes in a single place. For enhanced protection, you could enable Multifactor Authentication (MFA) and Personal Access Tokens.
    flag:
        authentication-mode: The authentication mode used in WorkMail.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identity-center-configuration: The details of the IAM Identity Center configuration.
        organization-id: The ID of the WorkMail Organization.
        personal-access-token-configuration: The details of the Personal Access Token configuration.
