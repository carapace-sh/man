name: replay-recent-access
description: '*(BETA)*  Determine affected recent access attempts before IAM policy                 change deployment.'
hidden: true
documentation:
    command: |-
        *(BETA)*  Replay the most recent 1,000 access logs from the past 90 days using the
        simulated policy. For each log entry, the replay determines if setting the
        provided policy on the given resource would result in a change in the access
        state, e.g. a previously granted access becoming denied. Any differences found
        are returned.
