name: describe
description: '*(BETA)*  Describe a schema registry with all of its fields.'
flags:
    --location=: ID of the location of the Managed Service for Apache Kafka resource.
documentation:
    command: |-
        ## EXAMPLES

         Describe the schema registry with all of its fields:

          $ gcloud beta managed-kafka schema-registries describe --project=PROJECT_ID --location=LOCATION_ID
          --schema_registry=SCHEMA_REGISTRY_ID
    flag:
        location: |-
            ID of the location of the Managed Service for Apache Kafka resource. See
            https://cloud.google.com/managed-service-for-apache-kafka/docs/locations for a list of supported
            locations.
            +

            To set the `location` attribute:
            * provide the argument `schema_registry` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
