name: update-index
description: Updates an existing index in an OpenSearch Serverless collection.
flags:
    --id=!: The unique identifier of the collection containing the index to update.
    --index-name=!: The name of the index to update.
    --index-schema=: The updated JSON schema definition for the index, including field mappings and settings.
documentation:
    command: Updates an existing index in an OpenSearch Serverless collection. This operation allows you to modify the index schema, including adding new fields or changing field mappings. You can also enable automatic semantic enrichment ingestion and search. For more information, see [About automatic semantic enrichment](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-manage.html#serverless-semantic-enrichment).
    flag:
        id: The unique identifier of the collection containing the index to update.
        index-name: The name of the index to update.
        index-schema: The updated JSON schema definition for the index, including field mappings and settings.
