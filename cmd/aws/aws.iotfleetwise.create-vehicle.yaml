name: create-vehicle
description: Creates a vehicle, which is an instance of a vehicle model (model manifest).
flags:
    --association-behavior=: An option to create a new Amazon Web Services IoT thing when creating a vehicle, or to validate an existing Amazon Web Services IoT thing as a vehicle.
    --attributes=: Static information about a vehicle in a key-value pair.
    --decoder-manifest-arn=!: The ARN of a decoder manifest.
    --model-manifest-arn=!: The Amazon Resource Name ARN of a vehicle model.
    --state-templates=: Associate state templates with the vehicle.
    --tags=: Metadata that can be used to manage the vehicle.
    --vehicle-name=!: The unique ID of the vehicle to create.
completion:
    flag:
        association-behavior:
            - CreateIotThing
            - ValidateIotThingExists
documentation:
    command: |-
        Creates a vehicle, which is an instance of a vehicle model (model manifest). Vehicles created from the same vehicle model consist of the same signals inherited from the vehicle model.

        If you have an existing Amazon Web Services IoT thing, you can use Amazon Web Services IoT FleetWise to create a vehicle and collect data from your thing.

        For more information, see [Create a vehicle (AWS CLI)](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/create-vehicle-cli.html) in the *Amazon Web Services IoT FleetWise Developer Guide*.
    flag:
        association-behavior: |-
            An option to create a new Amazon Web Services IoT thing when creating a vehicle, or to validate an existing Amazon Web Services IoT thing as a vehicle.

            Default: ` `
        attributes: |-
            Static information about a vehicle in a key-value pair. For example: `"engineType"` : `"1.3 L R2"`

            To use attributes with Campaigns or State Templates, you must include them using the request parameters `dataExtraDimensions` and/or `metadataExtraDimensions` (for state templates only) when creating your campaign/state template.
        decoder-manifest-arn: The ARN of a decoder manifest.
        model-manifest-arn: The Amazon Resource Name ARN of a vehicle model.
        state-templates: Associate state templates with the vehicle. You can monitor the last known state of the vehicle in near real time.
        tags: Metadata that can be used to manage the vehicle.
        vehicle-name: The unique ID of the vehicle to create.
