name: read
description: Display log entries produced by Google Cloud Functions.
flags:
    --end-time=: Return only log entries which timestamps are not later than the specified time.
    --execution-id=: Execution ID for which logs are to be displayed.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --gen2: If enabled, this command will use Cloud Functions (Second generation).
    --limit=: Number of log entries to be fetched; must not be greater than 1000. Note that the most recent entries in the specified time range are returned, rather than the earliest.
    --min-log-level=: Minimum level of logs to be fetched.
    --no-gen2&: If enabled, this command will use Cloud Functions (Second generation).
    --no-uri&: Print a list of resource URIs instead of the default output, and change the
    --page-size=: Some services group resource list output into pages.
    --region=: Only show logs generated by functions in the region.
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --start-time=: Return only log entries in which timestamps are not earlier than the specified time.
    --uri: Print a list of resource URIs instead of the default output, and change the
completion:
    flag:
        min-log-level:
            - debug
            - info
            - error
documentation:
    command: Display log entries produced by Google Cloud Functions.
    flag:
        end-time: Return only log entries which timestamps are not later than the specified time. If *--end-time* is specified but *--start-time* is not, the command returns *--limit* latest log entries which appeared before --end-time. See *$ gcloud topic datetimes* for information on time formats.
        execution-id: Execution ID for which logs are to be displayed.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        gen2: If enabled, this command will use Cloud Functions (Second generation). If disabled with `--no-gen2`, Cloud Functions (First generation) will be used. If not specified, the value of this flag will be taken from the `functions/gen2` configuration property. If the `functions/gen2` configuration property is not set, defaults to looking up the given function and using its generation.
        limit: Number of log entries to be fetched; must not be greater than 1000. Note that the most recent entries in the specified time range are returned, rather than the earliest.
        min-log-level: 'Minimum level of logs to be fetched. _MIN_LOG_LEVEL_ must be one of: *debug*, *info*, *error*.'
        no-gen2: If enabled, this command will use Cloud Functions (Second generation). If disabled with `--no-gen2`, Cloud Functions (First generation) will be used. If not specified, the value of this flag will be taken from the `functions/gen2` configuration property. If the `functions/gen2` configuration property is not set, defaults to looking up the given function and using its generation.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        region: Only show logs generated by functions in the region. Overrides the default *functions/region* property value for this command invocation.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        start-time: Return only log entries in which timestamps are not earlier than the specified time. If *--start-time* is not specified, a default start time of 1 week ago is assumed. See $ gcloud topic datetimes for information on time formats.
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
