name: update-index
description: Updates an Amazon Q Business index.
flags:
    --application-id=!: The identifier of the Amazon Q Business application connected to the index.
    --capacity-configuration=: The storage capacity units you want to provision for your Amazon Q Business index.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the Amazon Q Business index.
    --display-name=: The name of the Amazon Q Business index.
    --document-attribute-configurations=:
        description: Configuration information for document metadata or fields.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --index-id=!: The identifier of the Amazon Q Business index.
documentation:
    command: Updates an Amazon Q Business index.
    flag:
        application-id: The identifier of the Amazon Q Business application connected to the index.
        capacity-configuration: The storage capacity units you want to provision for your Amazon Q Business index. You can add and remove capacity to fit your usage needs.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the Amazon Q Business index.
        display-name: The name of the Amazon Q Business index.
        document-attribute-configurations: Configuration information for document metadata or fields. Document metadata are fields or attributes associated with your documents. For example, the company department name associated with each document. For more information, see [Understanding document attributes](https://docs.aws.amazon.com/amazonq/latest/business-use-dg/doc-attributes-types.html#doc-attributes).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        index-id: The identifier of the Amazon Q Business index.
