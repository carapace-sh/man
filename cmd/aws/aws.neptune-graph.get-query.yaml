name: get-query
description: Retrieves the status of a specified query.
flags:
    --graph-identifier=!: The unique identifier of the Neptune Analytics graph.
    --query-id=!: The ID of the query in question.
documentation:
    command: |-
        Retrieves the status of a specified query.

        When invoking this operation in a Neptune Analytics cluster, the IAM user or role making the request must have the `neptune-graph:GetQueryStatus` IAM action attached.
    flag:
        graph-identifier: The unique identifier of the Neptune Analytics graph.
        query-id: The ID of the query in question.
