name: describe
description: Describe a Google Cloud VMware Engine node.
flags:
    --cluster=: Resource ID of the cluster
    --location=: Location of the private cloud or cluster.
    --private-cloud=: VMware Engine private cloud.
documentation:
    command: |
        Display data associated with a VMware Engine node, such as its name, state, node type, ip, fqdn.
    flag:
        cluster: |-
            Resource ID of the cluster
            +
            To set the `cluster` attribute:
            * provide the argument `node` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `node` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        private-cloud: |-
            VMware Engine private cloud.
            +
            To set the `private-cloud` attribute:
            * provide the argument `node` on the command line with a fully specified name;
            * provide the argument `--private-cloud` on the command line.
