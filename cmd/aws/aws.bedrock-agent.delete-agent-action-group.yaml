name: delete-agent-action-group
description: Deletes an action group in an agent.
flags:
    --action-group-id=!: The unique identifier of the action group to delete.
    --agent-id=!: The unique identifier of the agent that the action group belongs to.
    --agent-version=!: The version of the agent that the action group belongs to.
    --no-skip-resource-in-use-check: By default, this value is `false` and deletion is stopped if the resource is in use.
    --skip-resource-in-use-check: By default, this value is `false` and deletion is stopped if the resource is in use.
documentation:
    command: Deletes an action group in an agent.
    flag:
        action-group-id: The unique identifier of the action group to delete.
        agent-id: The unique identifier of the agent that the action group belongs to.
        agent-version: The version of the agent that the action group belongs to.
        skip-resource-in-use-check: By default, this value is `false` and deletion is stopped if the resource is in use. If you set it to `true`, the resource will be deleted even if the resource is in use.
