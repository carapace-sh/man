name: update-state-template
description: Updates a state template.
flags:
    --data-extra-dimensions=: A list of vehicle attributes to associate with the payload published on the state template's MQTT topic.
    --description=: A brief description of the state template.
    --identifier=!: The unique ID of the state template.
    --metadata-extra-dimensions=: A list of vehicle attributes to associate with user properties of the messages published on the state template's MQTT topic.
    --state-template-properties-to-add=: Add signals from which data is collected as part of the state template.
    --state-template-properties-to-remove=: Remove signals from which data is collected as part of the state template.
documentation:
    command: |-
        Updates a state template.

        Access to certain Amazon Web Services IoT FleetWise features is currently gated. For more information, see [Amazon Web Services Region and feature availability](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/fleetwise-regions.html) in the *Amazon Web Services IoT FleetWise Developer Guide*.
    flag:
        data-extra-dimensions: |-
            A list of vehicle attributes to associate with the payload published on the state template's MQTT topic. (See [Processing last known state vehicle data using MQTT messaging](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/process-visualize-data.html#process-last-known-state-vehicle-data)). For example, if you add `Vehicle.Attributes.Make` and `Vehicle.Attributes.Model` attributes, Amazon Web Services IoT FleetWise will enrich the protobuf encoded payload with those attributes in the `extraDimensions` field.

            Default: An empty array
        description: A brief description of the state template.
        identifier: The unique ID of the state template.
        metadata-extra-dimensions: A list of vehicle attributes to associate with user properties of the messages published on the state template's MQTT topic. (See [Processing last known state vehicle data using MQTT messaging](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/process-visualize-data.html#process-last-known-state-vehicle-data)). For example, if you add `Vehicle.Attributes.Make` and `Vehicle.Attributes.Model` attributes, Amazon Web Services IoT FleetWise will include these attributes as User Properties with the MQTT message.
        state-template-properties-to-add: Add signals from which data is collected as part of the state template.
        state-template-properties-to-remove: Remove signals from which data is collected as part of the state template.
