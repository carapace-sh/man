name: get-billing-group-cost-report
description: Retrieves the margin summary report, which includes the Amazon Web Services cost and charged amount (pro forma cost) by Amazon Web Services service for a specific billing group.
flags:
    --arn=!: The Amazon Resource Number (ARN) that uniquely identifies the billing group.
    --billing-period-range=: A time range for which the margin summary is effective.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-by=:
        description: A list of strings that specify the attributes that are used to break down costs in the margin summary reports for the billing group.
        nargs: -1
    --max-results=: The maximum number of margin summary reports to retrieve.
    --next-token=: The pagination token used on subsequent calls to get reports.
documentation:
    command: Retrieves the margin summary report, which includes the Amazon Web Services cost and charged amount (pro forma cost) by Amazon Web Services service for a specific billing group.
    flag:
        arn: The Amazon Resource Number (ARN) that uniquely identifies the billing group.
        billing-period-range: A time range for which the margin summary is effective. You can specify up to 12 months.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-by: A list of strings that specify the attributes that are used to break down costs in the margin summary reports for the billing group. For example, you can view your costs by the Amazon Web Services service name or the billing period.
        max-results: The maximum number of margin summary reports to retrieve.
        next-token: The pagination token used on subsequent calls to get reports.
