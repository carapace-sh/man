name: set-iam-policy
description: Set the IAM policy for a keyring.
flags:
    --location=: Location of the keyring.
documentation:
    command: |-
        Sets the IAM policy for the given keyring as defined in a JSON or YAML file.

        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.

        ## EXAMPLES
        The following command will read am IAM policy defined in a JSON file
        'policy.json' and set it for the keyring `fellowship` with location `global`:

          $ gcloud kms keyrings set-iam-policy fellowship policy.json --location=global
    flag:
        location: Location of the keyring.
