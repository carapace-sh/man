name: update-participant-role-config
description: Updates timeouts for when human chat participants are to be considered idle, and when agents are automatically disconnected from a chat due to idleness.
flags:
    --channel-configuration=!: The Amazon Connect channel you want to configure.
    --contact-id=!: The identifier of the contact in this instance of Amazon Connect.
    --instance-id=!: The identifier of the Amazon Connect instance.
documentation:
    command: |-
        Updates timeouts for when human chat participants are to be considered idle, and when agents are automatically disconnected from a chat due to idleness. You can set four timers:

        - Customer idle timeout
        - Customer auto-disconnect timeout
        - Agent idle timeout
        - Agent auto-disconnect timeout

        For more information about how chat timeouts work, see [Set up chat timeouts for human participants](https://docs.aws.amazon.com/connect/latest/adminguide/setup-chat-timeouts.html).
    flag:
        channel-configuration: The Amazon Connect channel you want to configure.
        contact-id: The identifier of the contact in this instance of Amazon Connect.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
