name: modify-ipam-prefix-list-resolver
description: Modifies an IPAM prefix list resolver.
flags:
    --description=: A new description for the IPAM prefix list resolver.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --ipam-prefix-list-resolver-id=!: The ID of the IPAM prefix list resolver to modify.
    --no-dry-run&: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --rules=: The updated CIDR selection rules for the resolver.
documentation:
    command: Modifies an IPAM prefix list resolver. You can update the description and CIDR selection rules. Changes to rules will trigger re-evaluation and potential updates to associated prefix lists.
    flag:
        description: A new description for the IPAM prefix list resolver.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ipam-prefix-list-resolver-id: The ID of the IPAM prefix list resolver to modify.
        rules: The updated CIDR selection rules for the resolver. These rules replace the existing rules entirely.
