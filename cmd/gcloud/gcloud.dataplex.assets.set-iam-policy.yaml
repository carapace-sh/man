name: set-iam-policy
description: Set the IAM policy to a Dataplex asset as defined in a JSON or YAML file.
flags:
    --lake=: The identifier of the Dataplex lake resource.
    --location=: The location of the Dataplex resource.
    --zone=: The identifier of the Dataplex zone resource.
documentation:
    command: |-
        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.
    flag:
        lake: |-
            The identifier of the Dataplex lake resource.
            +
            To set the `lake` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--lake` on the command line.
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        zone: |-
            The identifier of the Dataplex zone resource.
            +
            To set the `zone` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
