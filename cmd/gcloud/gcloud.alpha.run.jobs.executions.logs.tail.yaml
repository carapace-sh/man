name: tail
description: '*(ALPHA)*  Tail logs for Cloud Run job executions.'
flags:
    --log-filter=: Filter expression that specifies the log entries to return.
    --no-show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --region=: Region in which the resource can be found.
    --show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
documentation:
    command: |
        *(ALPHA)*  gcloud alpha run jobs executions logs tail tails log-entries for a particular
        Cloud Run job exeuction in real time.  The log entries are formatted for
        consumption in a terminal.
    flag:
        log-filter: 'Filter expression that specifies the log entries to return. Detailed information about filters can be found at: https://cloud.google.com/logging/docs/view/logging-query-language'
        no-show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        region: Region in which the resource can be found. Alternatively, set the property [run/region].
        show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
