name: describe-global-replication-groups
description: Returns information about a particular global replication group.
flags:
    --global-replication-group-id=: The name of the Global datastore
    --marker=: An optional marker returned from a prior request.
    --max-records=: The maximum number of records to include in the response.
    --show-member-info=: Returns the list of members that comprise the Global datastore.
documentation:
    command: Returns information about a particular global replication group. If no identifier is specified, returns information about all Global datastores.
    flag:
        global-replication-group-id: The name of the Global datastore
        marker: An optional marker returned from a prior request. Use this marker for pagination of results from this operation. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: The maximum number of records to include in the response. If more records exist than the specified MaxRecords value, a marker is included in the response so that the remaining results can be retrieved.
        show-member-info: Returns the list of members that comprise the Global datastore.
