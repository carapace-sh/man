name: describe-image-references
description: Describes your Amazon Web Services resources that are referencing the specified images.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --image-ids=!: The IDs of the images to check for resource references.
    --include-all-resource-types: Specifies whether to check all supported Amazon Web Services resource types for image references.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token returned from a previous paginated request.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-include-all-resource-types: Specifies whether to check all supported Amazon Web Services resource types for image references.
    --resource-types=: The Amazon Web Services resource types to check for image references.
documentation:
    command: |-
        Describes your Amazon Web Services resources that are referencing the specified images.

        For more information, see [Identify your resources referencing specified AMIs](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-ami-references.html) in the *Amazon EC2 User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        image-ids: The IDs of the images to check for resource references.
        include-all-resource-types: |-
            Specifies whether to check all supported Amazon Web Services resource types for image references. When specified, default values are applied for `ResourceTypeOptions`. For the default values, see [How AMI reference checks work](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-ami-references.html#how-ami-references-works) in the *Amazon EC2 User Guide*. If you also specify `ResourceTypes` with `ResourceTypeOptions`, your specified values override the default values.

            Supported resource types: `ec2:Instance` | `ec2:LaunchTemplate` | `ssm:Parameter` | `imagebuilder:ImageRecipe` | `imagebuilder:ContainerRecipe`

            Either `IncludeAllResourceTypes` or `ResourceTypes` must be specified.
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
        resource-types: |-
            The Amazon Web Services resource types to check for image references.

            Either `IncludeAllResourceTypes` or `ResourceTypes` must be specified.
