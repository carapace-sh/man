documentation:
    command: |
        Create a framework deployment for a given organization and location.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cloud-control-metadata: |-
            Required, The deployment mode and parameters for each of the cloud controls in
            the framework. Every cloud control in the framework includes
            metadata.
            +
            *cloudControlDetails*:::
            The cloud control name and parameters.
            +
            *majorRevisionId*::::
            The major version of the cloud control.
            +
            *name*::::
            The name of the cloud control, in the format
            `organizations/{organization}/locations/{location}/cloudControls/{cloud-control}`.
            The only supported location is `global`.
            +
            *parameters*::::
            Parameters are key-value pairs that let you provide your custom location
            requirements, environment requirements, or other settings that are
            relevant to the cloud control. An example parameter is
            `{"name": "location","value": "us-west-1"}`.
            +
            *name*:::::
            The name or key of the parameter.
            +
            *enforcementMode*:::
            The enforcement mode of the cloud control.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --cloud-control-metadata=cloudControlDetails={majorRevisionId=int,name=string,parameters=[{name=string}]},enforcementMode=string --cloud-control-metadata=cloudControlDetails={majorRevisionId=int,name=string,parameters=[{name=string}]},enforcementMode=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --cloud-control-metadata='[{"cloudControlDetails": {"majorRevisionId": int, "name": "string", "parameters": [{"name": "string"}]}, "enforcementMode": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --cloud-control-metadata=path_to_file.(yaml|json)
            +
            ```
        description: A user-provided description of the framework deployment.
        etag: |-
            To prevent concurrent updates from overwriting each other, always provide
            the `etag` when you update a framework deployment. You can also
            provide the `etag` when you delete a framework deployment, to help
            ensure that you're deleting the intended version of the
            framework deployment.
        framework: |-
            The major version of the framework. If not specified, the version
            corresponds to the latest version of the framework.
        framework-major-revision-id: |-
            The major version of the framework. If not specified, the version
            corresponds to the latest version of the framework.
        location: |-
            The location id of the frameworkDeployment resource.
            +
            To set the `location` attribute:
            * provide the argument `framework_deployment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            The organization id of the frameworkDeployment resource.
            +
            To set the `organization` attribute:
            * provide the argument `framework_deployment` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        target-resource-config-existing: |-
            The resource hierarchy node, in one of the following formats:
            +
            - `organizations/{organizationID}`
            - `folders/{folderID}`
            - `projects/{projectID}`
        target-resource-creation-config-folder-display-name: The display name of the folder.
        target-resource-creation-config-folder-parent: |-
            The parent of the folder, in the format
            `organizations/{organizationID}` or `folders/{folderID}`.
        target-resource-creation-config-project-billing-account-id: The billing account ID for the project.
        target-resource-creation-config-project-display-name: The display name of the project.
        target-resource-creation-config-project-parent: |-
            The parent of the project, in the format
            `organizations/{organizationID}` or `folders/{folderID}`.
