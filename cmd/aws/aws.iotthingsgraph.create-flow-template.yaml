name: create-flow-template
description: Creates a workflow template.
flags:
    --compatible-namespace-version=: The namespace version in which the workflow is to be created.
    --definition=!: The workflow `DefinitionDocument`.
documentation:
    command: Creates a workflow template. Workflows can be created only in the user's namespace. (The public namespace contains only entities.) The workflow can contain only entities in the specified namespace. The workflow is validated against the entities in the latest version of the user's namespace unless another namespace version is specified in the request.
    flag:
        compatible-namespace-version: |-
            The namespace version in which the workflow is to be created.

            If no value is specified, the latest version is used by default.
        definition: The workflow `DefinitionDocument`.
