name: describe-flow-operation
description: Returns key information about a specific flow operation.
flags:
    --availability-zone=: The ID of the Availability Zone where the firewall is located.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --firewall-arn=!: The Amazon Resource Name (ARN) of the firewall.
    --flow-operation-id=!: A unique identifier for the flow operation.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --vpc-endpoint-association-arn=: The Amazon Resource Name (ARN) of a VPC endpoint association.
    --vpc-endpoint-id=: A unique identifier for the primary endpoint associated with a firewall.
documentation:
    command: Returns key information about a specific flow operation.
    flag:
        availability-zone: |-
            The ID of the Availability Zone where the firewall is located. For example, `us-east-2a`.

            Defines the scope a flow operation. You can use up to 20 filters to configure a single flow operation.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        firewall-arn: The Amazon Resource Name (ARN) of the firewall.
        flow-operation-id: A unique identifier for the flow operation. This ID is returned in the responses to start and list commands. You provide to describe commands.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        vpc-endpoint-association-arn: The Amazon Resource Name (ARN) of a VPC endpoint association.
        vpc-endpoint-id: A unique identifier for the primary endpoint associated with a firewall.
