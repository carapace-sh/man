name: disassociate-delegation-signer-from-domain
description: Deletes a delegation signer (DS) record in the registry zone for this domain name.
flags:
    --domain-name=!: Name of the domain.
    --id=!: An internal identification number assigned to each DS record after it’s created.
documentation:
    command: Deletes a delegation signer (DS) record in the registry zone for this domain name.
    flag:
        domain-name: Name of the domain.
        id: An internal identification number assigned to each DS record after it’s created. You can retrieve it as part of DNSSEC information returned by [GetDomainDetail](https://docs.aws.amazon.com/Route53/latest/APIReference/API_domains_GetDomainDetail.html).
