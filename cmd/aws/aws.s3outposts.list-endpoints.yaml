name: list-endpoints
description: Lists endpoints associated with the specified Outpost.
flags:
    --max-results=: The maximum number of endpoints that will be returned in the response.
    --next-token=: If a previous response from this operation included a `NextToken` value, provide that value here to retrieve the next page of results.
documentation:
    command: |-
        Lists endpoints associated with the specified Outpost.

        Related actions include:

        - [CreateEndpoint](https://docs.aws.amazon.com/AmazonS3/latest/API/API_s3outposts_CreateEndpoint.html)
        - [DeleteEndpoint](https://docs.aws.amazon.com/AmazonS3/latest/API/API_s3outposts_DeleteEndpoint.html)
    flag:
        max-results: The maximum number of endpoints that will be returned in the response.
        next-token: If a previous response from this operation included a `NextToken` value, provide that value here to retrieve the next page of results.
