name: delete-pull-request-approval-rule
description: Deletes an approval rule from a specified pull request.
flags:
    --approval-rule-name=!: The name of the approval rule you want to delete.
    --pull-request-id=!: The system-generated ID of the pull request that contains the approval rule you want to delete.
documentation:
    command: Deletes an approval rule from a specified pull request. Approval rules can be deleted from a pull request only if the pull request is open, and if the approval rule was created specifically for a pull request and not generated from an approval rule template associated with the repository where the pull request was created. You cannot delete an approval rule from a merged or closed pull request.
    flag:
        approval-rule-name: The name of the approval rule you want to delete.
        pull-request-id: The system-generated ID of the pull request that contains the approval rule you want to delete.
