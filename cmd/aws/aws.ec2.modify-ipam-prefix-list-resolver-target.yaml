name: modify-ipam-prefix-list-resolver-target
description: Modifies an IPAM prefix list resolver target.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --desired-version=: The desired version of the prefix list to target.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ipam-prefix-list-resolver-target-id=!: The ID of the IPAM prefix list resolver target to modify.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --no-track-latest-version: Indicates whether the resolver target should automatically track the latest version of the prefix list.
    --track-latest-version: Indicates whether the resolver target should automatically track the latest version of the prefix list.
documentation:
    command: Modifies an IPAM prefix list resolver target. You can update version tracking settings and the desired version of the target prefix list.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        desired-version: The desired version of the prefix list to target. This allows you to pin the target to a specific version.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ipam-prefix-list-resolver-target-id: The ID of the IPAM prefix list resolver target to modify.
        track-latest-version: |-
            Indicates whether the resolver target should automatically track the latest version of the prefix list. When enabled, the target will always synchronize with the most current version.

            Choose this for automatic updates when you want your prefix lists to stay current with infrastructure changes without manual intervention.
