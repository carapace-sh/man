name: update
description: Update the database configuration of a Cloud Firestore database.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --database=: ID of the database or fully qualified identifier for the database.
    --delete-protection: If set to true, the Firestore database will be updated to have database delete protection
    --enable-pitr: If set to true, the Firestore database will be updated to enable Point In Time Recovery.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-delete-protection&: If set to true, the Firestore database will be updated to have database delete protection
    --no-enable-pitr&: If set to true, the Firestore database will be updated to enable Point In Time Recovery.
    --type=: The database type.
completion:
    flag:
        type:
            - datastore-mode
            - firestore-native
documentation:
    command: |
        Update the database configuration of a Cloud Firestore database.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        database: |-
            ID of the database or fully qualified identifier for the database.
            +
            To set the `database` attribute:
            * provide the argument `--database` on the command line;
            * the default value of argument [--database] is `(default)`.
        delete-protection: |-
            If set to true, the Firestore database will be updated to have database delete protection
            enabled. A database with delete protection enabled cannot be deleted. You can disable the
            delete protection via --no-delete-protection.
        enable-pitr: |-
            If set to true, the Firestore database will be updated to enable Point In Time Recovery. You can
            disable the this feature via --no-enable-pitr.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-delete-protection: |
            If set to true, the Firestore database will be updated to have database delete protection
            enabled. A database with delete protection enabled cannot be deleted. You can disable the
            delete protection via --no-delete-protection.
        no-enable-pitr: |
            If set to true, the Firestore database will be updated to enable Point In Time Recovery. You can
            disable the this feature via --no-enable-pitr.
        type: 'The database type. _TYPE_ must be one of: *datastore-mode*, *firestore-native*.'
