name: update-distribution
description: Updates an existing Amazon Lightsail content delivery network (CDN) distribution.
flags:
    --cache-behavior-settings=: An object that describes the cache behavior settings for the distribution.
    --cache-behaviors=: An array of objects that describe the per-path cache behavior for the distribution.
    --certificate-name=: The name of the SSL/TLS certificate that you want to attach to the distribution.
    --default-cache-behavior=: An object that describes the default cache behavior for the distribution.
    --distribution-name=!: The name of the distribution to update.
    --is-enabled=: Indicates whether to enable the distribution.
    --origin=: An object that describes the origin resource for the distribution, such as a Lightsail instance, bucket, or load balancer.
    --use-default-certificate=: Indicates whether the default SSL/TLS certificate is attached to the distribution.
    --viewer-minimum-tls-protocol-version=: Use this parameter to update the minimum TLS protocol version for the SSL/TLS certificate that's attached to the distribution.
completion:
    flag:
        viewer-minimum-tls-protocol-version:
            - TLSv1.1_2016
            - TLSv1.2_2018
            - TLSv1.2_2019
            - TLSv1.2_2021
documentation:
    command: |-
        Updates an existing Amazon Lightsail content delivery network (CDN) distribution.

        Use this action to update the configuration of your existing distribution.
    flag:
        cache-behavior-settings: |-
            An object that describes the cache behavior settings for the distribution.

            The `cacheBehaviorSettings` specified in your `UpdateDistributionRequest` will replace your distribution's existing settings.
        cache-behaviors: An array of objects that describe the per-path cache behavior for the distribution.
        certificate-name: |-
            The name of the SSL/TLS certificate that you want to attach to the distribution.

            Only certificates with a status of `ISSUED` can be attached to a distribution.

            Use the [GetCertificates](https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/API_GetCertificates.html) action to get a list of certificate names that you can specify.
        default-cache-behavior: An object that describes the default cache behavior for the distribution.
        distribution-name: |-
            The name of the distribution to update.

            Use the `GetDistributions` action to get a list of distribution names that you can specify.
        is-enabled: Indicates whether to enable the distribution.
        origin: |-
            An object that describes the origin resource for the distribution, such as a Lightsail instance, bucket, or load balancer.

            The distribution pulls, caches, and serves content from the origin.
        use-default-certificate: |-
            Indicates whether the default SSL/TLS certificate is attached to the distribution. The default value is `true`. When `true`, the distribution uses the default domain name such as `d111111abcdef8.cloudfront.net`.

            Set this value to `false` to attach a new certificate to the distribution.
        viewer-minimum-tls-protocol-version: Use this parameter to update the minimum TLS protocol version for the SSL/TLS certificate that's attached to the distribution.
