name: create-folder
description: Creates an empty shared folder.
flags:
    --aws-account-id=!: The ID for the Amazon Web Services account where you want to create the folder.
    --folder-id=!: The ID of the folder.
    --folder-type=: The type of folder.
    --name=: The name of the folder.
    --parent-folder-arn=: The Amazon Resource Name (ARN) for the parent folder.
    --permissions=: A structure that describes the principals and the resource-level permissions of a folder.
    --sharing-model=: An optional parameter that determines the sharing scope of the folder.
    --tags=: Tags for the folder.
completion:
    flag:
        folder-type:
            - SHARED
            - RESTRICTED
        sharing-model:
            - ACCOUNT
            - NAMESPACE
documentation:
    command: Creates an empty shared folder.
    flag:
        aws-account-id: The ID for the Amazon Web Services account where you want to create the folder.
        folder-id: The ID of the folder.
        folder-type: The type of folder. By default, `folderType` is `SHARED`.
        name: The name of the folder.
        parent-folder-arn: |-
            The Amazon Resource Name (ARN) for the parent folder.

            `ParentFolderArn` can be null. An empty `parentFolderArn` creates a root-level folder.
        permissions: |-
            A structure that describes the principals and the resource-level permissions of a folder.

            To specify no permissions, omit `Permissions`.
        sharing-model: An optional parameter that determines the sharing scope of the folder. The default value for this parameter is `ACCOUNT`.
        tags: Tags for the folder.
