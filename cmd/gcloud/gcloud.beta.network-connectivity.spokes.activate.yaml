name: activate
description: '*(BETA)*  Activate a spoke.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --global&: Indicates that the spoke is global.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: A Google Cloud region.
documentation:
    command: |-
        *(BETA)*  Activate a previously deactivated spoke. By activating a spoke,
        you permit connectivity between it and any other spokes that are
        attached to the same hub.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        global: Indicates that the spoke is global.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: A Google Cloud region. To see the names of regions, see [Viewing a list of available regions](https://cloud.google.com/compute/docs/regions-zones/viewing-regions-zones#viewing_a_list_of_available_regions).
