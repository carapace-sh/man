name: list-component-outputs
description: Get a list of component Infrastructure as Code (IaC) outputs.
flags:
    --component-name=!: The name of the component whose outputs you want.
    --deployment-id=: The ID of the deployment whose outputs you want.
    --next-token=: A token that indicates the location of the next output in the array of outputs, after the list of outputs that was previously requested.
documentation:
    command: |-
        Get a list of component Infrastructure as Code (IaC) outputs.

        For more information about components, see [Proton components](https://docs.aws.amazon.com/proton/latest/userguide/ag-components.html) in the *Proton User Guide*.
    flag:
        component-name: The name of the component whose outputs you want.
        deployment-id: The ID of the deployment whose outputs you want.
        next-token: A token that indicates the location of the next output in the array of outputs, after the list of outputs that was previously requested.
