name: search-contact-evaluations
description: Searches contact evaluations in an Amazon Connect instance, with optional filtering.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --search-criteria=: The search criteria to be used to return contact evaluations.
    --search-filter=: Filters to be applied to search results.
documentation:
    command: |-
        Searches contact evaluations in an Amazon Connect instance, with optional filtering.

        **Use cases**

        Following are common uses cases for this API:

        - Find contact evaluations by using specific search criteria.
        - Find contact evaluations that are tagged with a specific set of tags.

        **Important things to know**

        - A Search operation, unlike a List operation, takes time to index changes to resource (create, update or delete). If you don't see updated information for recently changed contact evaluations, try calling the API again in a few seconds. Contact Evaluations may not be fully backfilled with historical data in all regions yet, however all recently created Contact Evaluations should be available for search.

        **Endpoints**: See [Amazon Connect endpoints and quotas](https://docs.aws.amazon.com/general/latest/gr/connect_region.html).
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        search-criteria: The search criteria to be used to return contact evaluations.
        search-filter: Filters to be applied to search results.
