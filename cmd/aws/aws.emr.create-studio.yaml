name: create-studio
description: Creates a new Amazon EMR Studio.
flags:
    --auth-mode=!: Specifies whether the Studio authenticates users using IAM or IAM Identity Center.
    --default-s3-location=!: The Amazon S3 location to back up Amazon EMR Studio Workspaces and notebook files.
    --description=: A detailed description of the Amazon EMR Studio.
    --encryption-key-arn=: The KMS key identifier (ARN) used to encrypt Amazon EMR Studio workspace and notebook files when backed up to Amazon S3.
    --engine-security-group-id=!: The ID of the Amazon EMR Studio Engine security group.
    --idc-instance-arn=: The ARN of the IAM Identity Center instance to create the Studio application.
    --idc-user-assignment=: Specifies whether IAM Identity Center user assignment is `REQUIRED` or `OPTIONAL`.
    --idp-auth-url=: The authentication endpoint of your identity provider (IdP).
    --idp-relay-state-parameter-name=: The name that your identity provider (IdP) uses for its `RelayState` parameter.
    --name=!: A descriptive name for the Amazon EMR Studio.
    --service-role=!: The IAM role that the Amazon EMR Studio assumes.
    --subnet-ids=!: A list of subnet IDs to associate with the Amazon EMR Studio.
    --tags=: A list of tags to associate with the Amazon EMR Studio.
    --trusted-identity-propagation-enabled=: A Boolean indicating whether to enable Trusted identity propagation for the Studio.
    --user-role=: The IAM user role that users and groups assume when logged in to an Amazon EMR Studio.
    --vpc-id=!: The ID of the Amazon Virtual Private Cloud (Amazon VPC) to associate with the Studio.
    --workspace-security-group-id=!: The ID of the Amazon EMR Studio Workspace security group.
completion:
    flag:
        auth-mode:
            - SSO
            - IAM
        idc-user-assignment:
            - REQUIRED
            - OPTIONAL
documentation:
    command: Creates a new Amazon EMR Studio.
    flag:
        auth-mode: Specifies whether the Studio authenticates users using IAM or IAM Identity Center.
        default-s3-location: The Amazon S3 location to back up Amazon EMR Studio Workspaces and notebook files.
        description: A detailed description of the Amazon EMR Studio.
        encryption-key-arn: The KMS key identifier (ARN) used to encrypt Amazon EMR Studio workspace and notebook files when backed up to Amazon S3.
        engine-security-group-id: The ID of the Amazon EMR Studio Engine security group. The Engine security group allows inbound network traffic from the Workspace security group, and it must be in the same VPC specified by `VpcId`.
        idc-instance-arn: The ARN of the IAM Identity Center instance to create the Studio application.
        idc-user-assignment: Specifies whether IAM Identity Center user assignment is `REQUIRED` or `OPTIONAL`. If the value is set to `REQUIRED`, users must be explicitly assigned to the Studio application to access the Studio.
        idp-auth-url: The authentication endpoint of your identity provider (IdP). Specify this value when you use IAM authentication and want to let federated users log in to a Studio with the Studio URL and credentials from your IdP. Amazon EMR Studio redirects users to this endpoint to enter credentials.
        idp-relay-state-parameter-name: The name that your identity provider (IdP) uses for its `RelayState` parameter. For example, `RelayState` or `TargetSource`. Specify this value when you use IAM authentication and want to let federated users log in to a Studio using the Studio URL. The `RelayState` parameter differs by IdP.
        name: A descriptive name for the Amazon EMR Studio.
        service-role: The IAM role that the Amazon EMR Studio assumes. The service role provides a way for Amazon EMR Studio to interoperate with other Amazon Web Services services.
        subnet-ids: A list of subnet IDs to associate with the Amazon EMR Studio. A Studio can have a maximum of 5 subnets. The subnets must belong to the VPC specified by `VpcId`. Studio users can create a Workspace in any of the specified subnets.
        tags: A list of tags to associate with the Amazon EMR Studio. Tags are user-defined key-value pairs that consist of a required key string with a maximum of 128 characters, and an optional value string with a maximum of 256 characters.
        trusted-identity-propagation-enabled: A Boolean indicating whether to enable Trusted identity propagation for the Studio. The default value is `false`.
        user-role: The IAM user role that users and groups assume when logged in to an Amazon EMR Studio. Only specify a `UserRole` when you use IAM Identity Center authentication. The permissions attached to the `UserRole` can be scoped down for each user or group using session policies.
        vpc-id: The ID of the Amazon Virtual Private Cloud (Amazon VPC) to associate with the Studio.
        workspace-security-group-id: The ID of the Amazon EMR Studio Workspace security group. The Workspace security group allows outbound network traffic to resources in the Engine security group, and it must be in the same VPC specified by `VpcId`.
