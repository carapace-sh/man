name: export
description: '*(BETA)*  Writes skaffold and kubernetes files for local development.'
hidden: true
flags:
    --allow-secret-manager: Suppress warnings if secrets need to be pulled from secret manager.
    --application-default-credential: When connecting to Google Cloud Platform services, use the application default credential.
    --builder=: Build with a given Cloud Native Computing Foundation Buildpack builder.
    --cpu=: Container CPU limit.
    --dockerfile=: Dockerfile for the service image.
    --env-vars-file=: Path to a local YAML file with definitions for all environment variables.
    --env-vars=: List of key-value pairs to set as environment variables.
    --image=: Name for the built image.
    --kubernetes-file=: File containing yaml specifications for kubernetes resources.
    --local-port=: Local port to which the service connection is forwarded.
    --memory=: Container memory limit.
    --no-allow-secret-manager&: Suppress warnings if secrets need to be pulled from secret manager
    --no-application-default-credential&: When connecting to Google Cloud Platform services, use the application default credential.
    --no-readiness-probe&: Add a readiness probe to the list of containers that delays deployment stabilization until the application app has bound to $PORT
    --no-skaffold-file: Do not produce a skaffold.yaml file.
    --readiness-probe&: Add a readiness probe to the list of containers that delays deployment stabilization until the application app has bound to $PORT
    --secrets=: List of key-value pairs to set as secrets.
    --service-account=: When connecting to Google Cloud Platform services, use a service account key.
    --service-name=: Name of the service.
    --skaffold-file=: Location of the generated skaffold.yaml file.
    --source=: The directory containing the source to build.
documentation:
    command: |-
        *(BETA)*  Writes skaffold and kubernetes yaml that builds a docker image
        and runs it locally. In order to build and run the image, run

        > skaffold dev

        This command should be used if there is a need to make
        customizations to the development environment. Otherwise,
        the gcloud local dev command should be used instead.
    flag:
        allow-secret-manager: Suppress warnings if secrets need to be pulled from secret manager. Use *--allow-secret-manager* to enable and *--no-allow-secret-manager* to disable.
        application-default-credential: When connecting to Google Cloud Platform services, use the application default credential.
        builder: Build with a given Cloud Native Computing Foundation Buildpack builder.
        cpu: Container CPU limit. Limit is expressed as a number of CPUs. Fractional CPU limits are allowed (e.g. 1.5).
        dockerfile: Dockerfile for the service image.
        env-vars: List of key-value pairs to set as environment variables.
        env-vars-file: Path to a local YAML file with definitions for all environment variables.
        image: Name for the built image.
        kubernetes-file: File containing yaml specifications for kubernetes resources.
        local-port: Local port to which the service connection is forwarded. If this flag is not set, then a random port is chosen.
        memory: Container memory limit. Limit is expressed either as an integer representing the number of bytes or an integer followed by a unit suffix. Valid unit suffixes are "B", "KB", "MB", "GB", "TB", "KiB", "MiB", "GiB", "TiB", or "PiB".
        no-allow-secret-manager: Suppress warnings if secrets need to be pulled from secret manager
        no-application-default-credential: When connecting to Google Cloud Platform services, use the application default credential.
        no-readiness-probe: Add a readiness probe to the list of containers that delays deployment stabilization until the application app has bound to $PORT
        no-skaffold-file: Do not produce a skaffold.yaml file.
        readiness-probe: Add a readiness probe to the list of containers that delays deployment stabilization until the application app has bound to $PORT
        secrets: List of key-value pairs to set as secrets.
        service-account: When connecting to Google Cloud Platform services, use a service account key.
        service-name: Name of the service.
        skaffold-file: Location of the generated skaffold.yaml file.
        source: The directory containing the source to build. If not specified, the current directory is used.
