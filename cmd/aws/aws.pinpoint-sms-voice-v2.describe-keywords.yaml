name: describe-keywords
description: Describes the specified keywords or all keywords on your origination phone number or pool.
flags:
    --filters=: An array of keyword filters to filter the results.
    --keywords=: An array of keywords to search for.
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
    --origination-identity=!: The origination identity to use such as a PhoneNumberId, PhoneNumberArn, SenderId or SenderIdArn.
documentation:
    command: |-
        Describes the specified keywords or all keywords on your origination phone number or pool.

        A keyword is a word that you can search for on a particular phone number or pool. It is also a specific word or phrase that an end user can send to your number to elicit a response, such as an informational message or a special offer. When your number receives a message that begins with a keyword, End User MessagingSMS responds with a customizable message.

        If you specify a keyword that isn't valid, an error is returned.
    flag:
        filters: An array of keyword filters to filter the results.
        keywords: An array of keywords to search for.
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
        origination-identity: |-
            The origination identity to use such as a PhoneNumberId, PhoneNumberArn, SenderId or SenderIdArn. You can use [DescribePhoneNumbers]() to find the values for PhoneNumberId and PhoneNumberArn while [DescribeSenderIds]() can be used to get the values for SenderId and SenderIdArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
