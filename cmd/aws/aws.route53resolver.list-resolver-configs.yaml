name: list-resolver-configs
description: Retrieves the Resolver configurations that you have defined.
flags:
    --max-results=: The maximum number of Resolver configurations that you want to return in the response to a `ListResolverConfigs` request.
    --next-token=: (Optional) If the current Amazon Web Services account has more than `MaxResults` Resolver configurations, use `NextToken` to get the second and subsequent pages of results.
documentation:
    command: Retrieves the Resolver configurations that you have defined. Route 53 Resolver uses the configurations to manage DNS resolution behavior for your VPCs.
    flag:
        max-results: The maximum number of Resolver configurations that you want to return in the response to a `ListResolverConfigs` request. If you don't specify a value for `MaxResults`, up to 100 Resolver configurations are returned.
        next-token: |-
            (Optional) If the current Amazon Web Services account has more than `MaxResults` Resolver configurations, use `NextToken` to get the second and subsequent pages of results.

            For the first `ListResolverConfigs` request, omit this value.

            For the second and subsequent requests, get the value of `NextToken` from the previous response and specify that value for `NextToken` in the request.
