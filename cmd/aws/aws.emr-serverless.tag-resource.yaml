name: tag-resource
description: Assigns tags to resources.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) that identifies the resource to list the tags for.
    --tags=!: The tags to add to the resource.
documentation:
    command: Assigns tags to resources. A tag is a label that you assign to an Amazon Web Services resource. Each tag consists of a key and an optional value, both of which you define. Tags enable you to categorize your Amazon Web Services resources by attributes such as purpose, owner, or environment. When you have many resources of the same type, you can quickly identify a specific resource based on the tags you've assigned to it.
    flag:
        resource-arn: The Amazon Resource Name (ARN) that identifies the resource to list the tags for. Currently, the supported resources are Amazon EMR Serverless applications and job runs.
        tags: The tags to add to the resource. A tag is an array of key-value pairs.
