name: delete-tags
description: Deletes tags from a resource.
flags:
    --resource-name=!: The Amazon Resource Name (ARN) from which you want to remove the tag or tags.
    --tag-keys=!: The tag key that you want to delete.
documentation:
    command: Deletes tags from a resource. You must provide the ARN of the resource from which you want to delete the tag or tags.
    flag:
        resource-name: The Amazon Resource Name (ARN) from which you want to remove the tag or tags. For example, `arn:aws:redshift:us-east-2:123456789:cluster:t1`.
        tag-keys: The tag key that you want to delete.
