name: create-app-authorization
description: Creates an app authorization within an app bundle, which allows AppFabric to connect to an application.
flags:
    --app-bundle-identifier=!: The Amazon Resource Name (ARN) or Universal Unique Identifier (UUID) of the app bundle to use for the request.
    --app=!: The name of the application.
    --auth-type=!: The authorization type for the app authorization.
    --client-token=: Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --credential=!: Contains credentials for the application, such as an API key or OAuth2 client ID and secret.
    --tags=: A map of the key-value pairs of the tag or tags to assign to the resource.
    --tenant=!: Contains information about an application tenant, such as the application display name and identifier.
completion:
    flag:
        auth-type:
            - oauth2
            - apiKey
documentation:
    command: Creates an app authorization within an app bundle, which allows AppFabric to connect to an application.
    flag:
        app: |-
            The name of the application.

            Valid values are:

            - `SLACK`
            - `ASANA`
            - `JIRA`
            - `M365`
            - `M365AUDITLOGS`
            - `ZOOM`
            - `ZENDESK`
            - `OKTA`
            - `GOOGLE`
            - `DROPBOX`
            - `SMARTSHEET`
            - `CISCO`
        app-bundle-identifier: The Amazon Resource Name (ARN) or Universal Unique Identifier (UUID) of the app bundle to use for the request.
        auth-type: The authorization type for the app authorization.
        client-token: |-
            Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request. This lets you safely retry the request without accidentally performing the same operation a second time. Passing the same value to a later call to an operation requires that you also pass the same value for all other parameters. We recommend that you use a [UUID type of value](https://wikipedia.org/wiki/Universally_unique_identifier).

            If you don't provide this value, then Amazon Web Services generates a random one for you.

            If you retry the operation with the same `ClientToken`, but with different parameters, the retry fails with an `IdempotentParameterMismatch` error.
        credential: |-
            Contains credentials for the application, such as an API key or OAuth2 client ID and secret.

            Specify credentials that match the authorization type for your request. For example, if the authorization type for your request is OAuth2 (`oauth2`), then you should provide only the OAuth2 credentials.
        tags: A map of the key-value pairs of the tag or tags to assign to the resource.
        tenant: Contains information about an application tenant, such as the application display name and identifier.
