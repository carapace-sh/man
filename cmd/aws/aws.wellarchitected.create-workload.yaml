name: create-workload
description: Create a new workload.
flags:
    --account-ids=: ""
    --applications=: List of AppRegistry application ARNs associated to the workload.
    --architectural-design=: ""
    --aws-regions=: ""
    --client-request-token=!: ""
    --description=!: ""
    --discovery-config=: Well-Architected discovery configuration settings associated to the workload.
    --environment=!: ""
    --industry-type=: ""
    --industry=: ""
    --jira-configuration=: Jira configuration settings when creating a workload.
    --lenses=!: ""
    --non-aws-regions=: ""
    --notes=: ""
    --pillar-priorities=: ""
    --profile-arns=: The list of profile ARNs associated with the workload.
    --review-owner=: ""
    --review-template-arns=: The list of review template ARNs to associate with the workload.
    --tags=: The tags to be associated with the workload.
    --workload-name=!: ""
completion:
    flag:
        environment:
            - PRODUCTION
            - PREPRODUCTION
documentation:
    command: |-
        Create a new workload.

        The owner of a workload can share the workload with other Amazon Web Services accounts, users, an organization, and organizational units (OUs) in the same Amazon Web Services Region. Only the owner of a workload can delete it.

        For more information, see [Defining a Workload](https://docs.aws.amazon.com/wellarchitected/latest/userguide/define-workload.html) in the *Well-Architected Tool User Guide*.

        Either `AwsRegions`, `NonAwsRegions`, or both must be specified when creating a workload.

        You also must specify `ReviewOwner`, even though the parameter is listed as not being required in the following section.

        When creating a workload using a review template, you must have the following IAM permissions:

        - `wellarchitected:GetReviewTemplate`
        - `wellarchitected:GetReviewTemplateAnswer`
        - `wellarchitected:ListReviewTemplateAnswers`
        - `wellarchitected:GetReviewTemplateLensReview`
