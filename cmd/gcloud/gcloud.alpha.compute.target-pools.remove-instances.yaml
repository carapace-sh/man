name: remove-instances
description: '*(ALPHA)*  Remove instances from a target pool.'
flags:
    --instances-zone=: Zone of the instances to remove from the target pool.
    --instances=!: Specifies a list of instances to remove from the target pool.
    --region=: Region of the target pool to operate on.
    --zone=: Zone of the instances to remove from the target pool.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute target-pools remove-instances* is used to remove one or more instances from a
        target pool.
        For more information on health checks and load balancing, see
        [](https://cloud.google.com/compute/docs/load-balancing-and-autoscaling/)
    flag:
        instances: Specifies a list of instances to remove from the target pool.
        instances-zone: |-
            Zone of the instances to remove from the target pool. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
        region: Region of the target pool to operate on. If not specified, it will be set to the region of the instances. Overrides the default *compute/region* property value for this command invocation.
        zone: Zone of the instances to remove from the target pool. DEPRECATED, use --instances-zone. If not specified, you will be prompted to select a zone. Overrides the default *compute/zone* property value for this command invocation.
