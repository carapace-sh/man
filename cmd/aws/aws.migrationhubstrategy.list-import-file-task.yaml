name: list-import-file-task
description: Retrieves a list of all the imports performed.
flags:
    --max-results=: The total number of items to return.
    --next-token=: The token from a previous call that you use to retrieve the next set of results.
documentation:
    command: Retrieves a list of all the imports performed.
    flag:
        max-results: The total number of items to return. The maximum value is 100.
        next-token: The token from a previous call that you use to retrieve the next set of results. For example, if a previous call to this action returned 100 items, but you set `maxResults` to 10. You'll receive a set of 10 results along with a token. You then use the returned token to retrieve the next set of 10.
