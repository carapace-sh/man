name: associate-service-role-to-account
description: Associates a role with your account.
flags:
    --role-arn=!: The ARN of the service role you wish to associate with your account.
documentation:
    command: Associates a role with your account. AWS IoT Greengrass will use the role to access your Lambda functions and AWS IoT resources. This is necessary for deployments to succeed. The role must have at least minimum permissions in the policy ''AWSGreengrassResourceAccessRolePolicy''.
    flag:
        role-arn: The ARN of the service role you wish to associate with your account.
