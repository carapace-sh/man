name: delete-dbcluster-snapshot
description: Deletes a DB cluster snapshot.
flags:
    --dbcluster-snapshot-identifier=!: The identifier of the DB cluster snapshot to delete.
documentation:
    command: |-
        Deletes a DB cluster snapshot. If the snapshot is being copied, the copy operation is terminated.

        The DB cluster snapshot must be in the `available` state to be deleted.

        For more information on Amazon Aurora, see [What is Amazon Aurora?](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html) in the *Amazon Aurora User Guide*.

        For more information on Multi-AZ DB clusters, see [Multi-AZ DB cluster deployments](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html) in the *Amazon RDS User Guide*.
    flag:
        dbcluster-snapshot-identifier: |-
            The identifier of the DB cluster snapshot to delete.

            Constraints: Must be the name of an existing DB cluster snapshot in the `available` state.
