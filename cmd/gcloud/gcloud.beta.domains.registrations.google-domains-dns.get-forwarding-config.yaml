name: get-forwarding-config
description: '*(BETA)*  Get forwarding configuration of a specific Cloud Domains registration.'
documentation:
    command: |-
        *(BETA)*  Get forwarding configuration (deprecated) of a specific registration.

        ## EXAMPLES

        To get forwarding configuration of ``example.com'', run:

          $ gcloud domains registrations google-domains-dns get-forwarding-config
          example.com
