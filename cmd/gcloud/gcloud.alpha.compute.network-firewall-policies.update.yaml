name: update
description: '*(ALPHA)*  Update a Compute Engine network firewall policy.'
flags:
    --description=: An optional, textual description for the network firewall policy.
    --global: If set, the firewall policy is global.
    --no-global&: If set, the firewall policy is global.
    --region=: Region of the firewall policy to update.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute network-firewall-policies update* is used to update network firewall policies. A network
        firewall policy is a set of rules that controls access to various resources.
    flag:
        description: An optional, textual description for the network firewall policy.
        global: If set, the firewall policy is global.
        no-global: If set, the firewall policy is global.
        region: Region of the firewall policy to update. Overrides the default *compute/region* property value for this command invocation.
