name: describe-user
description: Describes the specified user.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --user-id=!: The identifier of the user account.
documentation:
    command: Describes the specified user. You can [find the instance ID in the Amazon Connect console](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) (it’s the final part of the ARN). The console does not display the user IDs. Instead, list the users and note the IDs provided in the output.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        user-id: The identifier of the user account.
