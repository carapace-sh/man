name: create-phone-number-order
description: Creates an order for phone numbers to be provisioned.
flags:
    --e164-phone-numbers=!: List of phone numbers, in E.164 format.
    --name=: Specifies the name assigned to one or more phone numbers.
    --product-type=!: The phone number product type.
completion:
    flag:
        product-type:
            - VoiceConnector
            - SipMediaApplicationDialIn
documentation:
    command: Creates an order for phone numbers to be provisioned. For numbers outside the U.S., you must use the Amazon Chime SDK SIP media application dial-in product type.
    flag:
        e164-phone-numbers: List of phone numbers, in E.164 format.
        name: Specifies the name assigned to one or more phone numbers.
        product-type: The phone number product type.
