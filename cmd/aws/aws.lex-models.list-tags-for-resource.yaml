name: list-tags-for-resource
description: Gets a list of tags associated with the specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to get a list of tags for.
documentation:
    command: Gets a list of tags associated with the specified resource. Only bots, bot aliases, and bot channels can have tags associated with them.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to get a list of tags for.
