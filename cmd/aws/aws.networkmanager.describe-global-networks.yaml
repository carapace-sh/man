name: describe-global-networks
description: Describes one or more global networks.
flags:
    --global-network-ids=: The IDs of one or more global networks.
    --max-results=: The maximum number of results to return.
    --next-token=: The token for the next page of results.
documentation:
    command: Describes one or more global networks. By default, all global networks are described. To describe the objects in your global network, you must use the appropriate `Get*` action. For example, to list the transit gateways in your global network, use [GetTransitGatewayRegistrations]().
    flag:
        global-network-ids: The IDs of one or more global networks. The maximum is 10.
        max-results: The maximum number of results to return.
        next-token: The token for the next page of results.
