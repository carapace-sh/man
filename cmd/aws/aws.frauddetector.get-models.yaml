name: get-models
description: Gets one or more models.
flags:
    --max-results=: The maximum number of objects to return for the request.
    --model-id=: The model ID.
    --model-type=: The model type.
    --next-token=: The next token for the subsequent request.
completion:
    flag:
        model-type:
            - ONLINE_FRAUD_INSIGHTS
            - TRANSACTION_FRAUD_INSIGHTS
            - ACCOUNT_TAKEOVER_INSIGHTS
documentation:
    command: |-
        Gets one or more models. Gets all models for the Amazon Web Services account if no model type and no model id provided. Gets all models for the Amazon Web Services account and model type, if the model type is specified but model id is not provided. Gets a specific model if (model type, model id) tuple is specified.

        This is a paginated API. If you provide a null `maxResults`, this action retrieves a maximum of 10 records per page. If you provide a `maxResults`, the value must be between 1 and 10. To get the next page results, provide the pagination token from the response as part of your request. A null pagination token fetches the records from the beginning.
    flag:
        max-results: The maximum number of objects to return for the request.
        model-id: The model ID.
        model-type: The model type.
        next-token: The next token for the subsequent request.
