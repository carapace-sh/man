name: delete
description: Delete backups.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup-collection=: The backupCollection id of the backup resource.
    --location=: The location id of the backup resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --request-id=: Idempotent request UUID.
documentation:
    command: Delete a backup
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup-collection: |-
            The backupCollection id of the backup resource.
            +
            To set the `backup-collection` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--backup-collection` on the command line.
        location: |-
            The location id of the backup resource.
            +
            To set the `location` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        request-id: Idempotent request UUID.
