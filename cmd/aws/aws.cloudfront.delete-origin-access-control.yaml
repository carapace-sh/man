name: delete-origin-access-control
description: Deletes a CloudFront origin access control.
flags:
    --id=!: The unique identifier of the origin access control that you are deleting.
    --if-match=: The current version (`ETag` value) of the origin access control that you are deleting.
documentation:
    command: |-
        Deletes a CloudFront origin access control.

        You cannot delete an origin access control if it's in use. First, update all distributions to remove the origin access control from all origins, then delete the origin access control.
    flag:
        id: The unique identifier of the origin access control that you are deleting.
        if-match: The current version (`ETag` value) of the origin access control that you are deleting.
