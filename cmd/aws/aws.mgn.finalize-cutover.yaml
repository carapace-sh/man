name: finalize-cutover
description: Finalizes the cutover immediately for specific Source Servers.
flags:
    --account-id=: Request to finalize Cutover by Source Account ID.
    --source-server-id=!: Request to finalize Cutover by Source Server ID.
documentation:
    command: 'Finalizes the cutover immediately for specific Source Servers. All AWS resources created by Application Migration Service for enabling the replication of these source servers will be terminated / deleted within 90 minutes. Launched Test or Cutover instances will NOT be terminated. The AWS Replication Agent will receive a command to uninstall itself (within 10 minutes). The following properties of the SourceServer will be changed immediately: dataReplicationInfo.dataReplicationState will be changed to DISCONNECTED; The SourceServer.lifeCycle.state will be changed to CUTOVER; The totalStorageBytes property fo each of dataReplicationInfo.replicatedDisks will be set to zero; dataReplicationInfo.lagDuration and dataReplicationInfo.lagDuration will be nullified.'
    flag:
        account-id: Request to finalize Cutover by Source Account ID.
        source-server-id: Request to finalize Cutover by Source Server ID.
