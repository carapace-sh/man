name: delete-managed-endpoint
description: Deletes a managed endpoint.
flags:
    --id=!: The ID of the managed endpoint.
    --virtual-cluster-id=!: The ID of the endpoint's virtual cluster.
documentation:
    command: Deletes a managed endpoint. A managed endpoint is a gateway that connects Amazon EMR Studio to Amazon EMR on EKS so that Amazon EMR Studio can communicate with your virtual cluster.
    flag:
        id: The ID of the managed endpoint.
        virtual-cluster-id: The ID of the endpoint's virtual cluster.
