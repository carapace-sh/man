name: create-account
description: Creates an Amazon Chime account under the administrator's AWS account.
flags:
    --name=!: The name of the Amazon Chime account.
documentation:
    command: Creates an Amazon Chime account under the administrator's AWS account. Only `Team` account types are currently supported for this action. For more information about different account types, see [Managing Your Amazon Chime Accounts](https://docs.aws.amazon.com/chime/latest/ag/manage-chime-account.html) in the *Amazon Chime Administration Guide*.
    flag:
        name: The name of the Amazon Chime account.
