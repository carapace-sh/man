name: analyze-move
description: Analyzes resource move.
flags:
    --blockers-only=: Determines whether to perform analysis against blockers only.
    --destination-folder=: The destination folder ID to perform the analysis.
    --destination-organization=: The destination organization ID to perform the analysis.
documentation:
    command: Analyze resource migration from its current resource hierarchy.
    flag:
        blockers-only: Determines whether to perform analysis against blockers only. Leaving it empty means the full analysis will be performed including warnings and blockers for the specified resource move.
        destination-folder: The destination folder ID to perform the analysis.
        destination-organization: The destination organization ID to perform the analysis.
