name: list-engagement-invitations
description: Retrieves a list of engagement invitations sent to the partner.
flags:
    --catalog=!: Specifies the catalog from which to list the engagement invitations.
    --engagement-identifier=: Retrieves a list of engagement invitation summaries based on specified filters.
    --max-results=: Specifies the maximum number of engagement invitations to return in the response.
    --next-token=: A pagination token used to retrieve additional pages of results when the response to a previous request was truncated.
    --participant-type=!: Specifies the type of participant for which to list engagement invitations.
    --payload-type=: Defines the type of payload associated with the engagement invitations to be listed.
    --sender-aws-account-id=: List of sender AWS account IDs to filter the invitations.
    --sort=: Specifies the sorting options for listing engagement invitations.
    --status=: Status values to filter the invitations.
completion:
    flag:
        participant-type:
            - SENDER
            - RECEIVER
documentation:
    command: Retrieves a list of engagement invitations sent to the partner. This allows partners to view all pending or past engagement invitations, helping them track opportunities shared by AWS.
    flag:
        catalog: Specifies the catalog from which to list the engagement invitations. Use `AWS` for production invitations or `Sandbox` for testing environments.
        engagement-identifier: Retrieves a list of engagement invitation summaries based on specified filters. The ListEngagementInvitations operation allows you to view all invitations that you have sent or received. You must specify the ParticipantType to filter invitations where you are either the SENDER or the RECEIVER. Invitations will automatically expire if not accepted within 15 days.
        max-results: Specifies the maximum number of engagement invitations to return in the response. If more results are available, a pagination token will be provided.
        next-token: A pagination token used to retrieve additional pages of results when the response to a previous request was truncated. Pass this token to continue listing invitations from where the previous call left off.
        participant-type: Specifies the type of participant for which to list engagement invitations. Identifies the role of the participant.
        payload-type: Defines the type of payload associated with the engagement invitations to be listed. The attributes in this payload help decide on acceptance or rejection of the invitation.
        sender-aws-account-id: List of sender AWS account IDs to filter the invitations.
        sort: Specifies the sorting options for listing engagement invitations. Invitations can be sorted by fields such as `InvitationDate` or `Status` to help partners view results in their preferred order.
        status: Status values to filter the invitations.
