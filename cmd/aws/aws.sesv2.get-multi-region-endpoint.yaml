name: get-multi-region-endpoint
description: Displays the multi-region endpoint (global-endpoint) configuration.
flags:
    --endpoint-name=!: The name of the multi-region endpoint (global-endpoint).
documentation:
    command: |-
        Displays the multi-region endpoint (global-endpoint) configuration.

        Only multi-region endpoints (global-endpoints) whose primary region is the AWS-Region where operation is executed can be displayed.
    flag:
        endpoint-name: The name of the multi-region endpoint (global-endpoint).
