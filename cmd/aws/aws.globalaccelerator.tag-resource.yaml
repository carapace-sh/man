name: tag-resource
description: Add tags to an accelerator resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the Global Accelerator resource to add tags to.
    --tags=!: The tags to add to a resource.
documentation:
    command: |-
        Add tags to an accelerator resource.

        For more information, see [Tagging in Global Accelerator](https://docs.aws.amazon.com/global-accelerator/latest/dg/tagging-in-global-accelerator.html) in the *Global Accelerator Developer Guide*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the Global Accelerator resource to add tags to. An ARN uniquely identifies a resource.
        tags: The tags to add to a resource. A tag consists of a key and a value that you define.
