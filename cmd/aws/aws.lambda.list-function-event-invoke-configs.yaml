name: list-function-event-invoke-configs
description: Retrieves a list of configurations for asynchronous invocation for a function.
flags:
    --function-name=!: The name or ARN of the Lambda function.
    --marker=: Specify the pagination token that's returned by a previous request to retrieve the next page of results.
    --max-items=: The maximum number of configurations to return.
documentation:
    command: |-
        Retrieves a list of configurations for asynchronous invocation for a function.

        To configure options for asynchronous invocation, use [PutFunctionEventInvokeConfig]().
    flag:
        function-name: |-
            The name or ARN of the Lambda function.

            **Name formats**

            - **Function name** - `my-function`.
            - **Function ARN** - `arn:aws:lambda:us-west-2:123456789012:function:my-function`.
            - **Partial ARN** - `123456789012:function:my-function`.

            The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        marker: Specify the pagination token that's returned by a previous request to retrieve the next page of results.
        max-items: The maximum number of configurations to return.
