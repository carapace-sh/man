name: list-stack-resources
description: Returns descriptions of all resources of the specified stack.
flags:
    --next-token=: The token for the next set of items to return.
    --stack-name=!: 'The name or the unique stack ID that is associated with the stack, which aren''t always interchangeable:'
documentation:
    command: |-
        Returns descriptions of all resources of the specified stack.

        For deleted stacks, ListStackResources returns resource information for up to 90 days after the stack has been deleted.
    flag:
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        stack-name: |-
            The name or the unique stack ID that is associated with the stack, which aren't always interchangeable:

            - Running stacks: You can specify either the stack's name or its unique stack ID.
            - Deleted stacks: You must specify the unique stack ID.
