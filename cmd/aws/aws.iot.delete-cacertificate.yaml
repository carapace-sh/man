name: delete-cacertificate
description: Deletes a registered CA certificate.
flags:
    --certificate-id=!: The ID of the certificate to delete.
documentation:
    command: |-
        Deletes a registered CA certificate.

        Requires permission to access the [DeleteCACertificate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        certificate-id: The ID of the certificate to delete. (The last part of the certificate ARN contains the certificate ID.)
