name: start-cutover
description: Launches a Cutover Instance for specific Source Servers.
flags:
    --account-id=: Start Cutover by Account IDs
    --source-server-ids=!: Start Cutover by Source Server IDs.
    --tags=: Start Cutover by Tags.
documentation:
    command: Launches a Cutover Instance for specific Source Servers. This command starts a LAUNCH job whose initiatedBy property is StartCutover and changes the SourceServer.lifeCycle.state property to CUTTING\_OVER.
    flag:
        account-id: Start Cutover by Account IDs
        source-server-ids: Start Cutover by Source Server IDs.
        tags: Start Cutover by Tags.
