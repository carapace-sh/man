name: deactivate-user
description: Deactivates the specified user, which revokes the user's access to Amazon WorkDocs.
flags:
    --authentication-token=: Amazon WorkDocs authentication token.
    --user-id=!: The ID of the user.
documentation:
    command: Deactivates the specified user, which revokes the user's access to Amazon WorkDocs.
    flag:
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        user-id: The ID of the user.
