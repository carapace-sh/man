name: get-campaign-version
description: Retrieves information about the status, configuration, and other settings for a specific version of a campaign.
flags:
    --application-id=!: The unique identifier for the application.
    --campaign-id=!: The unique identifier for the campaign.
    --version=!: The unique version number (Version property) for the campaign version.
documentation:
    command: Retrieves information about the status, configuration, and other settings for a specific version of a campaign.
    flag:
        application-id: The unique identifier for the application. This identifier is displayed as the **Project ID** on the Amazon Pinpoint console.
        campaign-id: The unique identifier for the campaign.
        version: The unique version number (Version property) for the campaign version.
