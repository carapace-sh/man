name: start-viewer-session-revocation
description: Starts the process of revoking the viewer session associated with a specified channel ARN and viewer ID.
flags:
    --channel-arn=!: The ARN of the channel associated with the viewer session to revoke.
    --viewer-id=!: The ID of the viewer associated with the viewer session to revoke.
    --viewer-session-versions-less-than-or-equal-to=: An optional filter on which versions of the viewer session to revoke.
documentation:
    command: Starts the process of revoking the viewer session associated with a specified channel ARN and viewer ID. Optionally, you can provide a version to revoke viewer sessions less than and including that version. For instructions on associating a viewer ID with a viewer session, see [Setting Up Private Channels](https://docs.aws.amazon.com/ivs/latest/userguide/private-channels.html).
    flag:
        channel-arn: The ARN of the channel associated with the viewer session to revoke.
        viewer-id: The ID of the viewer associated with the viewer session to revoke. Do not use this field for personally identifying, confidential, or sensitive information.
        viewer-session-versions-less-than-or-equal-to: 'An optional filter on which versions of the viewer session to revoke. All versions less than or equal to the specified version will be revoked. Default: 0.'
