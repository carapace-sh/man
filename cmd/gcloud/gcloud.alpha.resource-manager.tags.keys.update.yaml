documentation:
    command: |-
        *(ALPHA)*  Updates the TagKey's description given the TagKey's parent and short name
        or the TagKey's numeric id.
    flag:
        allowed-values-regex: User-assigned regex of allowed short names of TagValues under a TagKey.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: User-assigned description of the TagKey or TagValue. Must not exceed 256 characters.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
