name: list-service-states
description: Returns information about the last deployment and other change states of services.
flags:
    --attribute-filters=:
        description: A list of attribute filters to narrow down the services.
        nargs: -1
    --aws-account-id=: The Amazon Web Services account ID to filter service states by.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=!: The end of the time period to retrieve service state information for.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-linked-accounts: If you are using this operation in a monitoring account, specify `true` to include service states from source accounts in the returned data.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of service states to return in one operation.
    --next-token=: Include this value, if it was returned by the previous operation, to get the next set of service states.
    --no-include-linked-accounts: If you are using this operation in a monitoring account, specify `true` to include service states from source accounts in the returned data.
    --page-size=: The size of each page to get in the AWS service call.
    --start-time=!: The start of the time period to retrieve service state information for.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: Returns information about the last deployment and other change states of services. This API provides visibility into recent changes that may have affected service performance, helping with troubleshooting and change correlation.
    flag:
        attribute-filters: A list of attribute filters to narrow down the services. You can filter by platform, environment, or other service attributes.
        aws-account-id: The Amazon Web Services account ID to filter service states by. Use this to limit results to services from a specific account.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: The end of the time period to retrieve service state information for. When used in a raw HTTP Query API, it is formatted as epoch time in seconds. For example, `1698778057`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-linked-accounts: If you are using this operation in a monitoring account, specify `true` to include service states from source accounts in the returned data.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of service states to return in one operation. If you omit this parameter, the default of 20 is used.
        next-token: Include this value, if it was returned by the previous operation, to get the next set of service states.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        start-time: The start of the time period to retrieve service state information for. When used in a raw HTTP Query API, it is formatted as epoch time in seconds. For example, `1698778057`.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
