name: remove-bgp-peer
description: '*(BETA)*  Remove a BGP peer from a Compute Engine router.'
flags:
    --peer-name=: The name of the peer being removed.
    --peer-names=: The list of names for peers being removed.
    --region=: Region of the router to update.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute routers remove-bgp-peer* removes a BGP peer from a Compute Engine router.
    flag:
        peer-name: The name of the peer being removed.
        peer-names: The list of names for peers being removed.
        region: |-
            Region of the router to update. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
