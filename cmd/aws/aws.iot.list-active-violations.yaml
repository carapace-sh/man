name: list-active-violations
description: Lists the active violations for a given Device Defender security profile.
flags:
    --behavior-criteria-type=: The criteria for a behavior.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --list-suppressed-alerts: A list of all suppressed alerts.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The token for the next set of results.
    --no-list-suppressed-alerts: A list of all suppressed alerts.
    --page-size=: The size of each page to get in the AWS service call.
    --security-profile-name=: The name of the Device Defender security profile for which violations are listed.
    --starting-token=: A token to specify where to start paginating.
    --thing-name=: The name of the thing whose active violations are listed.
    --verification-state=: The verification state of the violation (detect alarm).
completion:
    flag:
        behavior-criteria-type:
            - STATIC
            - STATISTICAL
            - MACHINE_LEARNING
        verification-state:
            - FALSE_POSITIVE
            - BENIGN_POSITIVE
            - TRUE_POSITIVE
            - UNKNOWN
documentation:
    command: |-
        Lists the active violations for a given Device Defender security profile.

        Requires permission to access the [ListActiveViolations](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        behavior-criteria-type: The criteria for a behavior.
