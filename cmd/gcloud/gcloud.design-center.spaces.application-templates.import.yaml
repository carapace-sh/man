name: import
description: Import to an application template.
flags:
    --application-template-revision-uri=!: ID of the revision or fully qualified identifier for the revision.
    --application-template=: For resources [application-template-revision-uri, application_template], provides fallback value for resource application-template attribute.
    --location=: For resources [application-template-revision-uri, application_template, shared-template-revision-uri], provides fallback value for resource location attribute.
    --shared-template-revision-uri=!: ID of the revision or fully qualified identifier for the revision.
    --shared-template=: The sharedTemplate id of the revision resource.
    --space=: For resources [application-template-revision-uri, application_template, shared-template-revision-uri], provides fallback value for resource space attribute.
documentation:
    command: Imports to an existing application template from a given shared template or application template revision.
    flag:
        application-template: For resources [application-template-revision-uri, application_template], provides fallback value for resource application-template attribute. When the resource's full URI path is not provided, application-template will fallback to this flag value.
        application-template-revision-uri: |-
            ID of the revision or fully qualified identifier for the revision.
            +
            To set the `revision` attribute:
            * provide the argument `--application-template-revision-uri` on the command line.
        location: For resources [application-template-revision-uri, application_template, shared-template-revision-uri], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        shared-template: |-
            The sharedTemplate id of the revision resource.
            +
            To set the `shared-template` attribute:
            * provide the argument `--shared-template-revision-uri` on the command line with a fully specified name;
            * provide the argument `--shared-template` on the command line.
        shared-template-revision-uri: |-
            ID of the revision or fully qualified identifier for the revision.
            +
            To set the `revision` attribute:
            * provide the argument `--shared-template-revision-uri` on the command line.
        space: For resources [application-template-revision-uri, application_template, shared-template-revision-uri], provides fallback value for resource space attribute. When the resource's full URI path is not provided, space will fallback to this flag value.
