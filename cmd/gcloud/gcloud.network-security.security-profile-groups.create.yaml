name: create
description: Create a new Security Profile Group.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --custom-intercept-profile-location=: Location of the Security Profile.
    --custom-intercept-profile-organization=: Organization ID of the Security Profile.
    --custom-intercept-profile=!: ID of the Security Profile or fully qualified identifier for the Security Profile.
    --custom-mirroring-profile-location=: Location of the Security Profile.
    --custom-mirroring-profile-organization=: Organization ID of the Security Profile.
    --custom-mirroring-profile=!: ID of the Security Profile or fully qualified identifier for the Security Profile.
    --description=: Brief description of the security profile group
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: location of the security_profile_group - Global.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: Organization ID of Security Profile Group
    --security-profile-location=&: Flag to preserve backward compatibility.
    --security-profile-organization=&: Flag to preserve backward compatibility.
    --threat-prevention-profile-location=: Location of the Security Profile.
    --threat-prevention-profile-organization=: Organization ID of the Security Profile.
    --threat-prevention-profile=!: ID of the Security Profile or fully qualified identifier for the Security Profile.
documentation:
    command: |4+
        Create a new Security Profile Group with the given name.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *False*.
        custom-intercept-profile: |-
            ID of the Security Profile or fully qualified identifier for the Security Profile.
            +
            To set the `name` attribute:
            * provide the argument `--custom-intercept-profile` on the command line.
        custom-intercept-profile-location: |-
            Location of the Security Profile.
                  NOTE: Only `global` security profiles are supported.
            +

            To set the `location` attribute:
            * provide the argument `--custom-intercept-profile` on the command line with a fully specified name;
            * provide the argument `--custom-intercept-profile-location` on the command line;
            * provide the argument `--location` on the command line;
            * provide the argument `networksecurity.organizations.locations.securityProfileGroups` on the command line with a fully specified name.
        custom-intercept-profile-organization: |-
            Organization ID of the Security Profile.
            +
            To set the `organization` attribute:
            * provide the argument `--custom-intercept-profile` on the command line with a fully specified name;
            * provide the argument `--custom-intercept-profile-organization` on the command line;
            * provide the argument `--organization` on the command line;
            * provide the argument `networksecurity.organizations.locations.securityProfileGroups` on the command line with a fully specified name.
        custom-mirroring-profile: |-
            ID of the Security Profile or fully qualified identifier for the Security Profile.
            +
            To set the `name` attribute:
            * provide the argument `--custom-mirroring-profile` on the command line.
        custom-mirroring-profile-location: |-
            Location of the Security Profile.
                  NOTE: Only `global` security profiles are supported.
            +

            To set the `location` attribute:
            * provide the argument `--custom-mirroring-profile` on the command line with a fully specified name;
            * provide the argument `--custom-mirroring-profile-location` on the command line;
            * provide the argument `--location` on the command line;
            * provide the argument `networksecurity.organizations.locations.securityProfileGroups` on the command line with a fully specified name.
        custom-mirroring-profile-organization: |-
            Organization ID of the Security Profile.
            +
            To set the `organization` attribute:
            * provide the argument `--custom-mirroring-profile` on the command line with a fully specified name;
            * provide the argument `--custom-mirroring-profile-organization` on the command line;
            * provide the argument `--organization` on the command line;
            * provide the argument `networksecurity.organizations.locations.securityProfileGroups` on the command line with a fully specified name.
        description: Brief description of the security profile group
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            location of the security_profile_group - Global.
            +
            To set the `location` attribute:
            * provide the argument `SECURITY_PROFILE_GROUP` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            Organization ID of Security Profile Group
            +
            To set the `organization` attribute:
            * provide the argument `SECURITY_PROFILE_GROUP` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        security-profile-location: Flag to preserve backward compatibility.
        security-profile-organization: Flag to preserve backward compatibility.
        threat-prevention-profile: |-
            ID of the Security Profile or fully qualified identifier for the Security Profile.
            +
            To set the `name` attribute:
            * provide the argument `--threat-prevention-profile` on the command line.
        threat-prevention-profile-location: |-
            Location of the Security Profile.
                  NOTE: Only `global` security profiles are supported.
            +

            To set the `location` attribute:
            * provide the argument `--threat-prevention-profile` on the command line with a fully specified name;
            * provide the argument `--threat-prevention-profile-location` on the command line;
            * provide the argument `--security-profile-location` on the command line;
            * provide the argument `--location` on the command line;
            * provide the argument `networksecurity.organizations.locations.securityProfileGroups` on the command line with a fully specified name.
        threat-prevention-profile-organization: |-
            Organization ID of the Security Profile.
            +
            To set the `organization` attribute:
            * provide the argument `--threat-prevention-profile` on the command line with a fully specified name;
            * provide the argument `--threat-prevention-profile-organization` on the command line;
            * provide the argument `--security-profile-organization` on the command line;
            * provide the argument `--organization` on the command line;
            * provide the argument `networksecurity.organizations.locations.securityProfileGroups` on the command line with a fully specified name.
