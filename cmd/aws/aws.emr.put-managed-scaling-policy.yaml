name: put-managed-scaling-policy
description: Creates or updates a managed scaling policy for an Amazon EMR cluster.
flags:
    --cluster-id=!: Specifies the ID of an Amazon EMR cluster where the managed scaling policy is attached.
    --managed-scaling-policy=!: Specifies the constraints for the managed scaling policy.
documentation:
    command: Creates or updates a managed scaling policy for an Amazon EMR cluster. The managed scaling policy defines the limits for resources, such as Amazon EC2 instances that can be added or terminated from a cluster. The policy only applies to the core and task nodes. The master node cannot be scaled after initial configuration.
    flag:
        cluster-id: Specifies the ID of an Amazon EMR cluster where the managed scaling policy is attached.
        managed-scaling-policy: Specifies the constraints for the managed scaling policy.
