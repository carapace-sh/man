name: list-received-grants
description: Lists grants that are received.
flags:
    --filters=: Filters to scope the results.
    --grant-arns=: Amazon Resource Names (ARNs) of the grants.
    --max-results=: Maximum number of results to return in a single call.
    --next-token=: Token for the next set of results.
documentation:
    command: Lists grants that are received. Received grants are grants created while specifying the recipient as this Amazon Web Services account, your organization, or an organizational unit (OU) to which this member account belongs.
    flag:
        filters: |-
            Filters to scope the results. The following filters are supported:

            - `ProductSKU`
            - `LicenseIssuerName`
            - `LicenseArn`
            - `GrantStatus`
            - `GranterAccountId`
        grant-arns: Amazon Resource Names (ARNs) of the grants.
        max-results: Maximum number of results to return in a single call.
        next-token: Token for the next set of results.
