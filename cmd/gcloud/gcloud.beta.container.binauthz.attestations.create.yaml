name: create
description: '*(BETA)*  Create a Binary Authorization attestation.'
flags:
    --artifact-url=!: Container URL.
    --attestor-project=: Project ID of the Google Cloud project for the attestor.
    --attestor=!: ID of the attestor or fully qualified identifier for the attestor.
    --no-validate&: Whether to validate that the Attestation can be verified by the
    --note-project=: The Container Analysis project for the note.
    --note=!: ID of the note or fully qualified identifier for the note.
    --payload-file=: Path to file containing the payload over which the signature was
    --public-key-id=!: The ID of the public key that will be used to verify the signature
    --signature-file=!: Path to file containing the signature to store, or `-` to read
    --validate: Whether to validate that the Attestation can be verified by the
documentation:
    command: |-
        *(BETA)*  This command creates a Binary Authorization attestation for your project. The
        attestation is created for the specified artifact (e.g. a gcr.io container
        URL), associate with the specified attestor, and stored under the specified
        project.

        ## EXAMPLES

        To create an attestation in the project "my_proj" as the attestor with
        resource path "projects/foo/attestors/bar", run:

            $ gcloud beta container binauthz attestations create \
                --project=my_proj \
                --artifact-url=gcr.io/example-project/example-image@sha256:abcd \
                --attestor=projects/foo/attestors/bar \
                --signature-file=signed_artifact_attestation.pgp.sig \
                --public-key-id=AAAA0000000000000000FFFFFFFFFFFFFFFFFFFF

        To create an attestation in the project "my_proj" in note "projects/foo/notes/bar",
        run:

            $ gcloud beta container binauthz attestations create \
                --project=my_proj \
                --artifact-url='gcr.io/example-project/example-image@sha256:abcd' \
                --note=projects/foo/notes/bar \
                --signature-file=signed_artifact_attestation.pgp.sig \
                --public-key-id=AAAA0000000000000000FFFFFFFFFFFFFFFFFFFF
    flag:
        artifact-url: Container URL. May be in the `gcr.io/repository/image` format, or may optionally contain the `http` or `https` scheme
        attestor: |-
            ID of the attestor or fully qualified identifier for the attestor.
            +
            To set the `name` attribute:
            * provide the argument `--attestor` on the command line.
        attestor-project: |-
            Project ID of the Google Cloud project for the attestor.
            +
            To set the `project` attribute:
            * provide the argument `--attestor` on the command line with a fully specified name;
            * provide the argument `--attestor-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
        no-validate: |
            Whether to validate that the Attestation can be verified by the
            provided Attestor.
        note: |-
            ID of the note or fully qualified identifier for the note.
            +
            To set the `note` attribute:
            * provide the argument `--note` on the command line.
        note-project: |-
            The Container Analysis project for the note.
            +
            To set the `project` attribute:
            * provide the argument `--note` on the command line with a fully specified name;
            * provide the argument `--note-project` on the command line.
        payload-file: |-
            Path to file containing the payload over which the signature was
            calculated.
            +
            This defaults to the output of the standard payload command:
            +
                $ {grandparent_command} create-signature-payload
            +
            NOTE: If you sign a payload with e.g. different whitespace or
            formatting, you must explicitly provide the payload content via this
            flag.
        public-key-id: |-
            The ID of the public key that will be used to verify the signature
            of the created Attestation. This ID must match the one found on the
            Attestor resource(s) which will verify this Attestation.
            +
            For PKIX keys, this will be the URI-formatted `id` field of the
            associated Attestor public key.
            +
            For PGP keys, this must be the version 4, full 160-bit fingerprint,
            expressed as a 40 character hexadecimal string. See
            https://tools.ietf.org/html/rfc4880#section-12.2 for details.
        signature-file: |-
            Path to file containing the signature to store, or `-` to read
            signature from stdin.
        validate: |-
            Whether to validate that the Attestation can be verified by the
            provided Attestor.
