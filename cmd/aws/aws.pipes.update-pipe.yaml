name: update-pipe
description: Update an existing pipe.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the pipe.
    --desired-state=: The state the pipe should be in.
    --enrichment-parameters=: The parameters required to set up enrichment on your pipe.
    --enrichment=: The ARN of the enrichment resource.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-identifier=: The identifier of the KMS customer managed key for EventBridge to use, if you choose to use a customer managed key to encrypt pipe data.
    --log-configuration=: The logging configuration settings for the pipe.
    --name=!: The name of the pipe.
    --role-arn=!: The ARN of the role that allows the pipe to send data to the target.
    --source-parameters=: The parameters required to set up a source for your pipe.
    --target-parameters=: The parameters required to set up a target for your pipe.
    --target=: The ARN of the target resource.
completion:
    flag:
        desired-state:
            - RUNNING
            - STOPPED
documentation:
    command: |-
        Update an existing pipe. When you call `UpdatePipe`, EventBridge only the updates fields you have specified in the request; the rest remain unchanged. The exception to this is if you modify any Amazon Web Services-service specific fields in the `SourceParameters`, `EnrichmentParameters`, or `TargetParameters` objects. For example, `DynamoDBStreamParameters` or `EventBridgeEventBusParameters`. EventBridge updates the fields in these objects atomically as one and overrides existing values. This is by design, and means that if you don't specify an optional field in one of these `Parameters` objects, EventBridge sets that field to its system-default value during the update.

        For more information about pipes, see [Amazon EventBridge Pipes](https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes.html) in the Amazon EventBridge User Guide.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the pipe.
        desired-state: The state the pipe should be in.
        enrichment: The ARN of the enrichment resource.
        enrichment-parameters: The parameters required to set up enrichment on your pipe.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-identifier: |-
            The identifier of the KMS customer managed key for EventBridge to use, if you choose to use a customer managed key to encrypt pipe data. The identifier can be the key Amazon Resource Name (ARN), KeyId, key alias, or key alias ARN.

            To update a pipe that is using the default Amazon Web Services owned key to use a customer managed key instead, or update a pipe that is using a customer managed key to use a different customer managed key, specify a customer managed key identifier.

            To update a pipe that is using a customer managed key to use the default Amazon Web Services owned key, specify an empty string.

            For more information, see [Managing keys](https://docs.aws.amazon.com/kms/latest/developerguide/getting-started.html) in the *Key Management Service Developer Guide*.
        log-configuration: The logging configuration settings for the pipe.
        name: The name of the pipe.
        role-arn: The ARN of the role that allows the pipe to send data to the target.
        source-parameters: The parameters required to set up a source for your pipe.
        target: The ARN of the target resource.
        target-parameters: |-
            The parameters required to set up a target for your pipe.

            For more information about pipe target parameters, including how to use dynamic path parameters, see [Target parameters](https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes-event-target.html) in the *Amazon EventBridge User Guide*.
