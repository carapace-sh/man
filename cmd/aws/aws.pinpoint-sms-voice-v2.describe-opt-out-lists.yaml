name: describe-opt-out-lists
description: Describes the specified opt-out list or all opt-out lists in your account.
flags:
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
    --opt-out-list-names=: The OptOutLists to show the details of.
    --owner=: Use `SELF` to filter the list of Opt-Out List to ones your account owns or use `SHARED` to filter on Opt-Out List shared with your account.
completion:
    flag:
        owner:
            - SELF
            - SHARED
documentation:
    command: |-
        Describes the specified opt-out list or all opt-out lists in your account.

        If you specify opt-out list names, the output includes information for only the specified opt-out lists. Opt-out lists include only those that meet the filter criteria. If you don't specify opt-out list names or filters, the output includes information for all opt-out lists.

        If you specify an opt-out list name that isn't valid, an error is returned.
    flag:
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
        opt-out-list-names: |-
            The OptOutLists to show the details of. This is an array of strings that can be either the OptOutListName or OptOutListArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        owner: Use `SELF` to filter the list of Opt-Out List to ones your account owns or use `SHARED` to filter on Opt-Out List shared with your account. The `Owner` and `OptOutListNames` parameters can't be used at the same time.
