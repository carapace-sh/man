name: update-firewall-rule-group-association
description: Changes the association of a [FirewallRuleGroup]() with a VPC.
flags:
    --firewall-rule-group-association-id=!: The identifier of the [FirewallRuleGroupAssociation]().
    --mutation-protection=: If enabled, this setting disallows modification or removal of the association, to help prevent against accidentally altering DNS firewall protections.
    --name=: The name of the rule group association.
    --priority=: The setting that determines the processing order of the rule group among the rule groups that you associate with the specified VPC.
completion:
    flag:
        mutation-protection:
            - ENABLED
            - DISABLED
documentation:
    command: Changes the association of a [FirewallRuleGroup]() with a VPC. The association enables DNS filtering for the VPC.
    flag:
        firewall-rule-group-association-id: The identifier of the [FirewallRuleGroupAssociation]().
        mutation-protection: If enabled, this setting disallows modification or removal of the association, to help prevent against accidentally altering DNS firewall protections.
        name: The name of the rule group association.
        priority: |-
            The setting that determines the processing order of the rule group among the rule groups that you associate with the specified VPC. DNS Firewall filters VPC traffic starting from the rule group with the lowest numeric priority setting.

            You must specify a unique priority for each rule group that you associate with a single VPC. To make it easier to insert rule groups later, leave space between the numbers, for example, use 100, 200, and so on. You can change the priority setting for a rule group association after you create it.
