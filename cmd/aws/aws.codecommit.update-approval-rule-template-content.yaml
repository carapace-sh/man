name: update-approval-rule-template-content
description: Updates the content of an approval rule template.
flags:
    --approval-rule-template-name=!: The name of the approval rule template where you want to update the content of the rule.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --existing-rule-content-sha256=: The SHA-256 hash signature for the content of the approval rule.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --new-rule-content=!: The content that replaces the existing content of the rule.
documentation:
    command: Updates the content of an approval rule template. You can change the number of required approvals, the membership of the approval rule, and whether an approval pool is defined.
    flag:
        approval-rule-template-name: The name of the approval rule template where you want to update the content of the rule.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        existing-rule-content-sha256: The SHA-256 hash signature for the content of the approval rule. You can retrieve this information by using [GetPullRequest]().
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        new-rule-content: The content that replaces the existing content of the rule. Content statements must be complete. You cannot provide only the changes.
