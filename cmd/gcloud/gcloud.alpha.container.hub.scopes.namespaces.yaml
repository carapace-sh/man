name: namespaces
description: '*(ALPHA)*  Fleet namespaces are the fleet equivalent of k8s cluster namespaces.'
documentation:
    command: |-
        *(ALPHA)*  This command group allows for manipulation of fleet namespaces.

        ## EXAMPLES

        Manage fleet namespaces:

          $ gcloud alpha container hub scopes namespaces --help

        Manage RBAC RoleBindings in a fleet namespace:

          $ gcloud alpha container hub scopes namespaces rbacrolebindings --help
