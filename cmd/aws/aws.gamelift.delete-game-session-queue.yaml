name: delete-game-session-queue
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Deletes a game session queue.
flags:
    --name=!: A descriptive label that is associated with game session queue.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Deletes a game session queue. Once a queue is successfully deleted, unfulfilled [StartGameSessionPlacement](https://docs.aws.amazon.com/gamelift/latest/apireference/API_StartGameSessionPlacement.html) requests that reference the queue will fail. To delete a queue, specify the queue name.
    flag:
        name: A descriptive label that is associated with game session queue. Queue names must be unique within each Region. You can use either the queue ID or ARN value.
