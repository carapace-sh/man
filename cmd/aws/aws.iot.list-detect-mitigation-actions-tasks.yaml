name: list-detect-mitigation-actions-tasks
description: List of Device Defender ML Detect mitigation actions tasks.
flags:
    --end-time=!: The end of the time period for which ML Detect mitigation actions tasks are returned.
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The token for the next set of results.
    --start-time=!: A filter to limit results to those found after the specified time.
documentation:
    command: |-
        List of Device Defender ML Detect mitigation actions tasks.

        Requires permission to access the [ListDetectMitigationActionsTasks](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        end-time: The end of the time period for which ML Detect mitigation actions tasks are returned.
        max-results: The maximum number of results to return at one time. The default is 25.
        next-token: The token for the next set of results.
        start-time: A filter to limit results to those found after the specified time. You must specify either the startTime and endTime or the taskId, but not both.
