name: create-capacity-reservation
description: Creates a new Capacity Reservation with the specified attributes.
flags:
    --availability-zone-id=: The ID of the Availability Zone in which to create the Capacity Reservation.
    --availability-zone=: The Availability Zone in which to create the Capacity Reservation.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --commitment-duration=: Required for future-dated Capacity Reservations only.
    --delivery-preference=: Required for future-dated Capacity Reservations only.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --ebs-optimized: Indicates whether the Capacity Reservation supports EBS-optimized instances.
    --end-date-type=: Indicates the way in which the Capacity Reservation ends.
    --end-date=: The date and time at which the Capacity Reservation expires.
    --ephemeral-storage: '*Deprecated.*'
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-count=!: The number of instances for which to reserve capacity.
    --instance-match-criteria=: Indicates the type of instance launches that the Capacity Reservation accepts.
    --instance-platform=!: The type of operating system for which to reserve capacity.
    --instance-type=!: The instance type for which to reserve capacity.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-ebs-optimized: Indicates whether the Capacity Reservation supports EBS-optimized instances.
    --no-ephemeral-storage: '*Deprecated.*'
    --outpost-arn=: Not supported for future-dated Capacity Reservations.
    --placement-group-arn=: Not supported for future-dated Capacity Reservations.
    --start-date=: Required for future-dated Capacity Reservations only.
    --tag-specifications=: The tags to apply to the Capacity Reservation during launch.
    --tenancy=: Indicates the tenancy of the Capacity Reservation.
completion:
    flag:
        delivery-preference:
            - fixed
            - incremental
        end-date-type:
            - unlimited
            - limited
        instance-match-criteria:
            - open
            - targeted
        instance-platform:
            - Linux/UNIX
            - Red Hat Enterprise Linux
            - SUSE Linux
            - Windows
            - Windows with SQL Server
            - Windows with SQL Server Enterprise
            - Windows with SQL Server Standard
            - Windows with SQL Server Web
            - Linux with SQL Server Standard
            - Linux with SQL Server Web
            - Linux with SQL Server Enterprise
            - RHEL with SQL Server Standard
            - RHEL with SQL Server Enterprise
            - RHEL with SQL Server Web
            - RHEL with HA
            - RHEL with HA and SQL Server Standard
            - RHEL with HA and SQL Server Enterprise
            - Ubuntu Pro
        tenancy:
            - default
            - dedicated
documentation:
    command: |-
        Creates a new Capacity Reservation with the specified attributes. Capacity Reservations enable you to reserve capacity for your Amazon EC2 instances in a specific Availability Zone for any duration.

        You can create a Capacity Reservation at any time, and you can choose when it starts. You can create a Capacity Reservation for immediate use or you can request a Capacity Reservation for a future date.

        For more information, see [Reserve compute capacity with On-Demand Capacity Reservations](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html) in the *Amazon EC2 User Guide*.

        Your request to create a Capacity Reservation could fail if:

        - Amazon EC2 does not have sufficient capacity. In this case, try again at a later time, try in a different Availability Zone, or request a smaller Capacity Reservation. If your workload is flexible across instance types and sizes, try with different instance attributes.
        - The requested quantity exceeds your On-Demand Instance quota. In this case, increase your On-Demand Instance quota for the requested instance type and try again. For more information, see [Amazon EC2 Service Quotas](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-resource-limits.html) in the *Amazon EC2 User Guide*.
    flag:
        availability-zone: The Availability Zone in which to create the Capacity Reservation.
        availability-zone-id: The ID of the Availability Zone in which to create the Capacity Reservation.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [Ensure Idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        commitment-duration: |-
            Required for future-dated Capacity Reservations only. To create a Capacity Reservation for immediate use, omit this parameter.

            Specify a commitment duration, in seconds, for the future-dated Capacity Reservation.

            The commitment duration is a minimum duration for which you commit to having the future-dated Capacity Reservation in the `active` state in your account after it has been delivered.

            For more information, see [Commitment duration](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/cr-concepts.html#cr-commitment-duration).
        delivery-preference: |-
            Required for future-dated Capacity Reservations only. To create a Capacity Reservation for immediate use, omit this parameter.

            Indicates that the requested capacity will be delivered in addition to any running instances or reserved capacity that you have in your account at the requested date and time.

            The only supported value is `incremental`.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ebs-optimized: Indicates whether the Capacity Reservation supports EBS-optimized instances. This optimization provides dedicated throughput to Amazon EBS and an optimized configuration stack to provide optimal I/O performance. This optimization isn't available with all instance types. Additional usage charges apply when using an EBS- optimized instance.
        end-date: |-
            The date and time at which the Capacity Reservation expires. When a Capacity Reservation expires, the reserved capacity is released and you can no longer launch instances into it. The Capacity Reservation's state changes to `expired` when it reaches its end date and time.

            You must provide an `EndDate` value if `EndDateType` is `limited`. Omit `EndDate` if `EndDateType` is `unlimited`.

            If the `EndDateType` is `limited`, the Capacity Reservation is cancelled within an hour from the specified time. For example, if you specify 5/31/2019, 13:30:55, the Capacity Reservation is guaranteed to end between 13:30:55 and 14:30:55 on 5/31/2019.

            If you are requesting a future-dated Capacity Reservation, you can't specify an end date and time that is within the commitment duration.
        end-date-type: |-
            Indicates the way in which the Capacity Reservation ends. A Capacity Reservation can have one of the following end types:

            - `unlimited` - The Capacity Reservation remains active until you explicitly cancel it. Do not provide an `EndDate` if the `EndDateType` is `unlimited`.
            - `limited` - The Capacity Reservation expires automatically at a specified date and time. You must provide an `EndDate` value if the `EndDateType` value is `limited`.
        ephemeral-storage: '*Deprecated.*'
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-count: |-
            The number of instances for which to reserve capacity.

            You can request future-dated Capacity Reservations for an instance count with a minimum of 64 vCPUs. For example, if you request a future-dated Capacity Reservation for `m5.xlarge` instances, you must request at least 25 instances (*16 * m5.xlarge = 64 vCPUs*).

            Valid range: 1 - 1000
        instance-match-criteria: |-
            Indicates the type of instance launches that the Capacity Reservation accepts. The options include:

            - `open` - The Capacity Reservation automatically matches all instances that have matching attributes (instance type, platform, and Availability Zone). Instances that have matching attributes run in the Capacity Reservation automatically without specifying any additional parameters.
            - `targeted` - The Capacity Reservation only accepts instances that have matching attributes (instance type, platform, and Availability Zone), and explicitly target the Capacity Reservation. This ensures that only permitted instances can use the reserved capacity.

            If you are requesting a future-dated Capacity Reservation, you must specify `targeted`.

            Default: `open`
        instance-platform: The type of operating system for which to reserve capacity.
        instance-type: |-
            The instance type for which to reserve capacity.

            You can request future-dated Capacity Reservations for instance types in the C, M, R, I, T, and G instance families only.

            For more information, see [Instance types](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html) in the *Amazon EC2 User Guide*.
        outpost-arn: |-
            Not supported for future-dated Capacity Reservations.

            The Amazon Resource Name (ARN) of the Outpost on which to create the Capacity Reservation.
        placement-group-arn: |-
            Not supported for future-dated Capacity Reservations.

            The Amazon Resource Name (ARN) of the cluster placement group in which to create the Capacity Reservation. For more information, see [Capacity Reservations for cluster placement groups](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/cr-cpg.html) in the *Amazon EC2 User Guide*.
        start-date: |-
            Required for future-dated Capacity Reservations only. To create a Capacity Reservation for immediate use, omit this parameter.

            The date and time at which the future-dated Capacity Reservation should become available for use, in the ISO8601 format in the UTC time zone (`YYYY-MM-DDThh:mm:ss.sssZ`).

            You can request a future-dated Capacity Reservation between 5 and 120 days in advance.
        tag-specifications: The tags to apply to the Capacity Reservation during launch.
        tenancy: |-
            Indicates the tenancy of the Capacity Reservation. A Capacity Reservation can have one of the following tenancy settings:

            - `default` - The Capacity Reservation is created on hardware that is shared with other Amazon Web Services accounts.
            - `dedicated` - The Capacity Reservation is created on single-tenant hardware that is dedicated to a single Amazon Web Services account.
