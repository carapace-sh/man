name: list-created-artifacts
description: Lists the created artifacts attached to a given migration task in an update stream.
flags:
    --max-results=: Maximum number of results to be returned per page.
    --migration-task-name=!: Unique identifier that references the migration task.
    --next-token=: If a `NextToken` was returned by a previous call, there are more results available.
    --progress-update-stream=!: The name of the ProgressUpdateStream.
documentation:
    command: |-
        Lists the created artifacts attached to a given migration task in an update stream. This API has the following traits:

        - Gets the list of the created artifacts while migration is taking place.
        - Shows the artifacts created by the migration tool that was associated by the `AssociateCreatedArtifact` API.
        - Lists created artifacts in a paginated interface.
    flag:
        max-results: Maximum number of results to be returned per page.
        migration-task-name: Unique identifier that references the migration task. *Do not store personal data in this field.*
        next-token: If a `NextToken` was returned by a previous call, there are more results available. To retrieve the next page of results, make the call again using the returned token in `NextToken`.
        progress-update-stream: The name of the ProgressUpdateStream.
