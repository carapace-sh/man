name: list-exports
description: Lists the exports for a bot, bot locale, or custom vocabulary.
flags:
    --bot-id=: The unique identifier that Amazon Lex assigned to the bot.
    --bot-version=: The version of the bot to list exports for.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=: Provides the specification of a filter used to limit the exports in the response to only those that match the filter specification.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --locale-id=: Specifies the resources that should be exported.
    --max-results=: The maximum number of exports to return in each page of results.
    --next-token=: If the response from the `ListExports` operation contains more results that specified in the `maxResults` parameter, a token is returned in the response.
    --sort-by=: Determines the field that the list of exports is sorted by.
documentation:
    command: Lists the exports for a bot, bot locale, or custom vocabulary. Exports are kept in the list for 7 days.
    flag:
        bot-id: The unique identifier that Amazon Lex assigned to the bot.
        bot-version: The version of the bot to list exports for.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: Provides the specification of a filter used to limit the exports in the response to only those that match the filter specification. You can only specify one filter and one string to filter on.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        locale-id: Specifies the resources that should be exported. If you don't specify a resource type in the `filters` parameter, both bot locales and custom vocabularies are exported.
        max-results: The maximum number of exports to return in each page of results. If there are fewer results than the max page size, only the actual number of results are returned.
        next-token: |-
            If the response from the `ListExports` operation contains more results that specified in the `maxResults` parameter, a token is returned in the response.

            Use the returned token in the `nextToken` parameter of a `ListExports` request to return the next page of results. For a complete set of results, call the `ListExports` operation until the `nextToken` returned in the response is null.
        sort-by: Determines the field that the list of exports is sorted by. You can sort by the `LastUpdatedDateTime` field in ascending or descending order.
