name: describe
description: Get the details of a Event Threat Detection custom module.
flags:
    --folder=: Folder associated with the custom module.
    --organization=: Organization associated with the custom module.
    --parent=: Parent associated with the custom module.
documentation:
    command: |-
        Get the details of a Event Threat Detection custom module. It does not
        resolve INHERITED enablement states
        to ENABLED or DISABLED for modules created at ancestor levels. For example, if
        the module is enabled
        at the ancestor level, modules for all child resources will have the
        enablement state set to
        INHERITED. Use `gcloud scc manage custom-modules etd get-effective` to
        retrieve a custom module with its effective enablement state.

        ## EXAMPLES

        To get the details of a Event Threat Detection custom module with ID
        `123456` for organization `123`, run:

          $ gcloud scc manage custom-modules etd describe 123456 --organization=123

        To get the details of a Event Threat Detection custom module with ID
        `123456` for folder `456`, run:

          $ gcloud scc manage custom-modules etd describe 123456 --folder=456

        To get the details of a Event Threat Detection custom module with ID
        `123456` for project `789`, run:

          $ gcloud scc manage custom-modules etd describe 123456 --project=789

        You can also specify the parent more generally:

          $ gcloud scc manage custom-modules etd describe 123456 --parent=organizations/123

        Or just specify the fully qualified module name:

          $ gcloud scc manage custom-modules etd describe
          organizations/123/locations/global/eventThreatDetectionCustomModules/123456
    flag:
        folder: Folder associated with the custom module.
        organization: Organization associated with the custom module.
        parent: |-
            Parent associated with the custom module. Can be one of
                          organizations/<id>, projects/<id or name>, folders/<id>
