name: delete-channel
description: Immediately makes a channel and its memberships inaccessible and marks them for deletion.
flags:
    --channel-arn=!: The ARN of the channel being deleted.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
documentation:
    command: |-
        Immediately makes a channel and its memberships inaccessible and marks them for deletion. This is an irreversible process.

        The `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUserArn` or `AppInstanceBot` that makes the API call as the value in the header.
    flag:
        channel-arn: The ARN of the channel being deleted.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
