name: update
description: '*(ALPHA)*  Update an Anthos Config Controller instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --experimental-features=: Enable experimental features.
    --location=: The name of the Config Controller instance location.
    --man-block=: Master Authorized Network.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(ALPHA)*  Update an Anthos Config Controller instance.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        experimental-features: Enable experimental features. It can only be enabled in ALPHA version.
        location: |-
            The name of the Config Controller instance location. Currently, only ``us-central1'', ``us-east1'', ``us-east4'', ``us-east5'', ``us-west2'', ``northamerica-northeast1'', ``northamerica-northeast2'', ``europe-north1'', ``europe-west1'', ``europe-west3'', ``europe-west6'', ``australia-southeast1'', ``australia-southeast2'', ``asia-northeast1'', ``asia-northeast2'' and ``asia-southeast1'' are supported.
            +
            To set the `location` attribute:
            * provide the argument `name` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        man-block: Master Authorized Network. Allows access to the Kubernetes control plane from this block. Defaults to '0.0.0.0/0' if flag is not provided.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
