name: delete
description: '*(BETA)*  Deletes a Compute Engine organization firewall policy packet mirroring rule.'
flags:
    --firewall-policy=!: Short name of the firewall policy into which the rule should be deleted.
    --organization=: Organization which the organization firewall policy belongs to.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute firewall-policies mirroring-rules delete* is used to delete organization firewall policy packet mirroring
        rules.
    flag:
        firewall-policy: Short name of the firewall policy into which the rule should be deleted.
        organization: Organization which the organization firewall policy belongs to. Must be set if FIREWALL_POLICY is short name.
