name: create
description: '*(ALPHA)*  Create a Distributed Cloud Edge Network subnet.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --bonding-type=: Whether or not the VLAN being created will be present on bonded or non-bonded port types.
    --description=: An optional, textual description for the subnet.
    --ipv4-range=: The ranges of ipv4 addresses that are owned by this subnetwork in CIDR format.
    --ipv6-range=: The ranges of ipv6 addresses that are owned by this subnetwork in CIDR format.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The global location name.
    --network=!: The network that this subnetwork belongs to.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --vlan-id=: The ID of the VLAN to tag the subnetwork.
    --zone=: The name of the Google Distributed Cloud Edge zone.
completion:
    flag:
        bonding-type:
            - bonded
            - bonding-type-unspecified
            - non-bonded
documentation:
    command: |
        *(ALPHA)*  Create a new Distributed Cloud Edge Network subnet.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        bonding-type: 'Whether or not the VLAN being created will be present on bonded or non-bonded port types. If not specified, the VLAN will be created on both port types by default. _BONDING_TYPE_ must be one of: *bonded*, *bonding-type-unspecified*, *non-bonded*.'
        description: An optional, textual description for the subnet.
        ipv4-range: The ranges of ipv4 addresses that are owned by this subnetwork in CIDR format.
        ipv6-range: The ranges of ipv6 addresses that are owned by this subnetwork in CIDR format.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `subnet` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        network: The network that this subnetwork belongs to.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        vlan-id: The ID of the VLAN to tag the subnetwork. If not specified we assign one automatically.
        zone: |-
            The name of the Google Distributed Cloud Edge zone.
            +
            To set the `zone` attribute:
            * provide the argument `subnet` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
