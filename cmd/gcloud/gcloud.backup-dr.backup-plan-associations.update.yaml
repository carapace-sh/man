name: update
description: Update a specific backup plan within a backup plan association.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup-plan=!: ID of the Backup Plan or fully qualified identifier for the Backup Plan.
    --location=: The location of the Backup Plan Association.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --workload-project=: Cloud project id for the Backup Plan Association.
documentation:
    command: Update a specific backup plan within a backup plan association.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        backup-plan: |-
            ID of the Backup Plan or fully qualified identifier for the Backup Plan.
            +
            To set the `name` attribute:
            * provide the argument `--backup-plan` on the command line.
        location: |-
            The location of the Backup Plan Association.
            +
            To set the `location` attribute:
            * provide the argument `BACKUP_PLAN_ASSOCIATION` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        workload-project: |-
            Cloud project id for the Backup Plan Association.
            +
            To set the `workload-project` attribute:
            * provide the argument `BACKUP_PLAN_ASSOCIATION` on the command line with a fully specified name;
            * provide the argument `--workload-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
