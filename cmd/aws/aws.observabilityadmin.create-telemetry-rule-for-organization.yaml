name: create-telemetry-rule-for-organization
description: Creates a telemetry rule that applies across an Amazon Web Services Organization.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --rule-name=!: A unique name for the organization-wide telemetry rule being created.
    --rule=!: The configuration details for the organization-wide telemetry rule, including the resource type, telemetry type, destination configuration, and selection criteria for which resources the rule applies to across the organization.
    --tags=: The key-value pairs to associate with the organization telemetry rule resource for categorization and management purposes.
documentation:
    command: Creates a telemetry rule that applies across an Amazon Web Services Organization. This operation can only be called by the organization's management account or a delegated administrator account.
    flag:
