name: get-reference-metadata
description: Retrieves metadata for a reference genome.
flags:
    --id=!: The reference's ID.
    --reference-store-id=!: The reference's reference store ID.
documentation:
    command: Retrieves metadata for a reference genome. This operation returns the number of parts, part size, and MD5 of an entire file. This operation does not return tags. To retrieve the list of tags for a read set, use the `ListTagsForResource` API operation.
    flag:
        id: The reference's ID.
        reference-store-id: The reference's reference store ID.
