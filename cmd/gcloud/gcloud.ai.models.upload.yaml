name: upload
description: Upload a new model.
flags:
    --artifact-uri=: Path to the directory containing the Model artifact and any of its
    --container-args=: Comma-separated arguments passed to the command run by the container
    --container-command=: Entrypoint for the container image.
    --container-deployment-timeout-seconds=: Deployment timeout in seconds.
    --container-env-vars=: List of key-value pairs to set as environment variables.
    --container-grpc-ports=: Container ports to receive grpc requests at.
    --container-health-probe-exec=: Exec specifies the action to take.
    --container-health-probe-period-seconds=: How often (in seconds) to perform the health probe.
    --container-health-probe-timeout-seconds=: Number of seconds after which the health probe times out.
    --container-health-route=: HTTP path to send health checks to inside the container.
    --container-image-uri=!: URI of the Model serving container file in the Container Registry
    --container-ports=: Container ports to receive http requests at.
    --container-predict-route=: HTTP path to send prediction requests to inside the container.
    --container-shared-memory-size-mb=: The amount of the VM memory to reserve as the shared memory for the model in
    --container-startup-probe-exec=: Exec specifies the action to take.
    --container-startup-probe-period-seconds=: How often (in seconds) to perform the startup probe.
    --container-startup-probe-timeout-seconds=: Number of seconds after which the startup probe times out.
    --description=: Description of the model.
    --display-name=!: Display name of the model.
    --explanation-metadata-file=: Path to a local JSON file that contains the metadata describing the Model's input and output for explanation.
    --explanation-method=: Method used for explanation.
    --explanation-path-count=: Number of feature permutations to consider when approximating the Shapley values for explanation.
    --explanation-step-count=: Number of steps to approximate the path integral for explanation.
    --labels=: Labels with user-defined metadata to organize your Models.
    --model-id=: ID to use for the uploaded Model, which will become the final component of the model resource name.
    --parent-model=: Resource name of the model into which to upload the version.
    --region=: ID of the region or fully qualified identifier for the region.
    --smooth-grad-noise-sigma-by-feature=: Noise sigma by features for explanation.
    --smooth-grad-noise-sigma=: Single float value used to add noise to all the features for explanation.
    --smooth-grad-noisy-sample-count=: Number of gradient samples used for approximation at explanation.
    --version-aliases=: Aliases used to reference a model version instead of auto-generated version ID.
    --version-description=: Description of the model version.
documentation:
    command: |-
        ## EXAMPLES

        To upload a model under project ``example'' in region
        ``us-central1'', run:

          $ gcloud ai models upload --container-image-uri="gcr.io/example/my-image"
          --description=example-model --display-name=my-model
          --artifact-uri='gs://bucket/path' --project=example --region=us-central1
    flag:
        artifact-uri: |-
            Path to the directory containing the Model artifact and any of its
            supporting files.
        container-args: |-
            Comma-separated arguments passed to the command run by the container
            image. If not specified and no `--command` is provided, the container
            image's default command is used.
        container-command: |-
            Entrypoint for the container image. If not specified, the container
            image's default entrypoint is run.
        container-deployment-timeout-seconds: Deployment timeout in seconds.
        container-env-vars: List of key-value pairs to set as environment variables.
        container-grpc-ports: |-
            Container ports to receive grpc requests at. Must be a number between 1 and
            65535, inclusive.
        container-health-probe-exec: |-
            Exec specifies the action to take. Used by health probe. An example of this
            argument would be ["cat", "/tmp/healthy"].
        container-health-probe-period-seconds: |-
            How often (in seconds) to perform the health probe. Default to 10 seconds.
            Minimum value is 1.
        container-health-probe-timeout-seconds: |-
            Number of seconds after which the health probe times out. Defaults to 1 second.
            Minimum value is 1.
        container-health-route: HTTP path to send health checks to inside the container.
        container-image-uri: |-
            URI of the Model serving container file in the Container Registry
            (e.g. gcr.io/myproject/server:latest).
        container-ports: |-
            Container ports to receive http requests at. Must be a number between 1 and
            65535, inclusive.
        container-predict-route: HTTP path to send prediction requests to inside the container.
        container-shared-memory-size-mb: |-
            The amount of the VM memory to reserve as the shared memory for the model in
            megabytes.
        container-startup-probe-exec: |-
            Exec specifies the action to take. Used by startup probe. An example of this
            argument would be ["cat", "/tmp/healthy"].
        container-startup-probe-period-seconds: |-
            How often (in seconds) to perform the startup probe. Default to 10 seconds.
            Minimum value is 1.
        container-startup-probe-timeout-seconds: |-
            Number of seconds after which the startup probe times out. Defaults to 1 second.
            Minimum value is 1.
        description: Description of the model.
        display-name: Display name of the model.
        explanation-metadata-file: Path to a local JSON file that contains the metadata describing the Model's input and output for explanation.
        explanation-method: Method used for explanation. Accepted values are `integrated-gradients`, `xrai` and `sampled-shapley`.
        explanation-path-count: Number of feature permutations to consider when approximating the Shapley values for explanation.
        explanation-step-count: Number of steps to approximate the path integral for explanation.
        labels: |-
            Labels with user-defined metadata to organize your Models.
            +
            Label keys and values can be no longer than 64 characters
            (Unicode codepoints), can only contain lowercase letters, numeric
            characters, underscores and dashes. International characters are allowed.
            +
            See https://goo.gl/xmQnxf for more information and examples of labels.
        model-id: ID to use for the uploaded Model, which will become the final component of the model resource name.
        parent-model: |-
            Resource name of the model into which to upload the version. Only specify this field when uploading a new version.
            +
            Value should be provided in format: projects/``PROJECT_ID''/locations/``REGION''/models/``PARENT_MODEL_ID''
        region: |-
            ID of the region or fully qualified identifier for the region.
            +
            To set the `region` attribute:
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
        smooth-grad-noise-sigma: Single float value used to add noise to all the features for explanation. Only applicable to explanation method `integrated-gradients` or `xrai`.
        smooth-grad-noise-sigma-by-feature: Noise sigma by features for explanation. Noise sigma represents the standard deviation of the gaussian kernel that will be used to add noise to interpolated inputs prior to computing gradients. Only applicable to explanation method `integrated-gradients` or `xrai`.
        smooth-grad-noisy-sample-count: Number of gradient samples used for approximation at explanation. Only applicable to explanation method `integrated-gradients` or `xrai`.
        version-aliases: Aliases used to reference a model version instead of auto-generated version ID. The aliases mentioned in the flag will replace the aliases set in the model.
        version-description: Description of the model version.
