name: modify-dbsubnet-group
description: Modifies an existing DB subnet group.
flags:
    --dbsubnet-group-description=: The description for the DB subnet group.
    --dbsubnet-group-name=!: The name for the DB subnet group.
    --subnet-ids=!: The EC2 subnet IDs for the DB subnet group.
documentation:
    command: Modifies an existing DB subnet group. DB subnet groups must contain at least one subnet in at least two AZs in the Amazon Web Services Region.
    flag:
        dbsubnet-group-description: The description for the DB subnet group.
        dbsubnet-group-name: |-
            The name for the DB subnet group. This value is stored as a lowercase string. You can't modify the default subnet group.

            Constraints: Must match the name of an existing DBSubnetGroup. Must not be default.

            Example: `mydbsubnetgroup`
        subnet-ids: The EC2 subnet IDs for the DB subnet group.
