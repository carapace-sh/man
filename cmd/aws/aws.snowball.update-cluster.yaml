name: update-cluster
description: While a cluster's `ClusterState` value is in the `AwaitingQuorum` state, you can update some of the information associated with a cluster.
flags:
    --address-id=: The ID of the updated [Address]() object.
    --cluster-id=!: The cluster ID of the cluster that you want to update, for example `CID123e4567-e89b-12d3-a456-426655440000`.
    --description=: The updated description of this cluster.
    --forwarding-address-id=: The updated ID for the forwarding address for a cluster.
    --notification=: The new or updated [Notification]() object.
    --on-device-service-configuration=: Specifies the service or services on the Snow Family device that your transferred data will be exported from or imported into.
    --resources=: The updated arrays of [JobResource]() objects that can include updated [S3Resource]() objects or [LambdaResource]() objects.
    --role-arn=: The new role Amazon Resource Name (ARN) that you want to associate with this cluster.
    --shipping-option=: The updated shipping option value of this cluster's [ShippingDetails]() object.
completion:
    flag:
        shipping-option:
            - SECOND_DAY
            - NEXT_DAY
            - EXPRESS
            - STANDARD
documentation:
    command: While a cluster's `ClusterState` value is in the `AwaitingQuorum` state, you can update some of the information associated with a cluster. Once the cluster changes to a different job state, usually 60 minutes after the cluster being created, this action is no longer available.
    flag:
        address-id: The ID of the updated [Address]() object.
        cluster-id: The cluster ID of the cluster that you want to update, for example `CID123e4567-e89b-12d3-a456-426655440000`.
        description: The updated description of this cluster.
        forwarding-address-id: The updated ID for the forwarding address for a cluster. This field is not supported in most regions.
        notification: The new or updated [Notification]() object.
        on-device-service-configuration: Specifies the service or services on the Snow Family device that your transferred data will be exported from or imported into. Amazon Web Services Snow Family device clusters support Amazon S3 and NFS (Network File System).
        resources: The updated arrays of [JobResource]() objects that can include updated [S3Resource]() objects or [LambdaResource]() objects.
        role-arn: The new role Amazon Resource Name (ARN) that you want to associate with this cluster. To create a role ARN, use the [CreateRole](https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateRole.html) API action in Identity and Access Management (IAM).
        shipping-option: The updated shipping option value of this cluster's [ShippingDetails]() object.
