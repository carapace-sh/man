name: set-iam-policy
description: '*(ALPHA)*  *(DEPRECATED)*  Set the IAM policy for a Data Catalog entry group.'
flags:
    --location=: Location of the entry group.
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  This command is deprecated. Please use `gcloud dataplex entry-groups` instead.

        Set the IAM policy for the given Data Catalog entry group as
        defined in a JSON or YAML file.
    flag:
        location: |-
            Location of the entry group.
            +

            To set the `location` attribute:
            * provide the argument `entry_group` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
