documentation:
    command: |
        Create a new Artifact Registry repository.

        This command can fail for the following reasons:
          * A repository with the same name already exists.
          * The active account does not have permission to create repositories.
          * A valid repository format was not provided.
    flag:
        allow-sbom-generation: |
            Allow SBOM generation on the repository.
        allow-snapshot-overwrites: (Maven only) Allow repository users to publish a snapshot that overwrites the same snapshot version in the repository.
        allow-vulnerability-scanning: Allow vulnerability scanning on the repository.
        alternative-hostname: |
            An alternative hostname that a repository can be accessed through.
        alternative-hostname-default: |
            Whether this is the default repository for the alternative hostname if no repository matches the path prefix.
        alternative-hostname-path-prefix: |
            An alternative hostname path prefix that a repository can be accessed through.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description for the repository.
        disable-remote-validation: Do not make an HTTP request to validate the remote upstream. Not recommended when setting a custom remote upstream unless you are absolutely sure your upstream URI and any auth is valid.
        disable-sbom-generation: |
            Disable SBOM generation on the repository.
        disable-vulnerability-scanning: Disable vulnerability scanning on the repository.
        enable-ingestion-attestation: |
            Enable generating attestation with verifiable signature on imported files in remote repositories.
        immutable-tags: (Docker only) Prevent changes to tagged images in the repository. Tags cannot be deleted or moved to a different image digest, and tagged images cannot be deleted.
        kms-key: Name of the encryption key that's used for encrypting the contents of the repository.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Location of the repository. Overrides the default artifacts/location property value
            for this command invocation. To configure the default location, use the command:
            gcloud config set artifacts/location.
            +

            To set the `location` attribute:
            * provide the argument `repository` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        mode: |-
            Mode is the type of the repository - Standard, Virtual or Remote. _MODE_ must be one of:
            +
            *none*::: Repository mode not specified.
            *remote-repository*::: Remote repository mode - fetches data from upstream and caches it.
            *standard-repository*::: Standard repository mode - should be possible to write/read data to this repo.
            *virtual-repository*::: Virtual repository mode - aggregates data from several upstreams.
            :::
            +
        no-allow-sbom-generation: |
            Allow SBOM generation on the repository.
        no-allow-snapshot-overwrites: |
            (Maven only) Allow repository users to publish a snapshot that overwrites the same snapshot version in the repository.
        no-allow-vulnerability-scanning: |
            Allow vulnerability scanning on the repository.
        no-alternative-hostname-default: |
            Whether this is the default repository for the alternative hostname if no repository matches the path prefix.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disable-remote-validation: |
            Do not make an HTTP request to validate the remote upstream. Not recommended when setting a custom remote upstream unless you are absolutely sure your upstream URI and any auth is valid.
        no-disable-sbom-generation: |
            Disable SBOM generation on the repository.
        no-disable-vulnerability-scanning: |
            Disable vulnerability scanning on the repository.
        no-enable-ingestion-attestation: |
            Enable generating attestation with verifiable signature on imported files in remote repositories.
        no-immutable-tags: |
            (Docker only) Prevent changes to tagged images in the repository. Tags cannot be deleted or moved to a different image digest, and tagged images cannot be deleted.
        remote-apt-repo: |-
            (Apt only) Repository base for apt remote repository.
            REMOTE_APT_REPO must be one of: [debian, debian-snapshot, ubuntu].
        remote-apt-repo-path: (Apt only) Remaining URL path to apt remote repository.
        remote-docker-repo: |-
            (Docker only) Repo upstream for docker remote repository.
            REMOTE_DOCKER_REPO can be either:
              - one of the following enums: [docker-hub].
              - an http/https custom registry uri (ex: https://my.docker.registry)
        remote-go-repo: (Go only) Repo upstream for Go remote repository. "https://proxy.golang.org/" is the only valid value.
        remote-mvn-repo: |-
            (Maven only) Repo upstream for maven remote repository.
            REMOTE_MVN_REPO can be either:
              - one of the following enums: [maven-central].
              - an http/https custom registry uri (ex: https://my.maven.registry)
        remote-npm-repo: |-
            (Npm only) Repo upstream for npm remote repository.
            REMOTE_NPM_REPO can be either:
              - one of the following enums: [npmjs].
              - an http/https custom registry uri (ex: https://my.npm.registry)
        remote-password-secret-version: |-
            Secret Manager secret version that contains password for the
            remote repository upstream.
        remote-python-repo: |-
            (Python only) Repo upstream for python remote repository.
            REMOTE_PYTHON_REPO can be either:
              - one of the following enums: [pypi].
              - an http/https custom registry uri (ex: https://my.python.registry)
        remote-repo: 'An upstream for a given remote repository. Ex: "https://github.com", "https://docker.io/v2/" are valid values for their given formats of Go and Docker respectively.'
        remote-repo-config-desc: The description for the remote repository config.
        remote-username: Remote Repository upstream registry username.
        remote-yum-repo: |-
            (Yum only) Repository base for yum remote repository.
            REMOTE_YUM_REPO must be one of: [centos, centos-debug, centos-stream, centos-vault, epel, rocky].
        remote-yum-repo-path: (Yum only) Remaining URL path to yum remote repository.
        repository-format: |-
            Format of the repository. REPOSITORY_FORMAT must be one of:
            +
             apt
                APT package format.
             docker
                Docker image format.
             go
                Go module format.
             kfp
                KFP package format.
             maven
                Maven package format.
             npm
                NPM package format.
             python
                Python package format.
             yum
                YUM package format.
        service-directory-config: |
            Service Directory config link for using Private Networks. Format:
            projects/<project>/locations/<location>/namespaces/<namespace>/services/<service>
        upstream-policy-file: |-
            (Virtual Repositories only) is the upstreams for the Virtual Repository.
            Example of the file contents:
            [
              {
                "id": "test1",
                "repository": "projects/p1/locations/us-central1/repositories/repo1",
                "priority": 1
              },
              {
                "id": "test2",
                "repository": "projects/p2/locations/us-west2/repositories/repo2",
                "priority": 2
              }
            ]
        version-policy: |-
            (Maven only) The package versions that the repository will store. _VERSION_POLICY_ must be one of:
            +
            *none*::: (Maven only) The repository doesn't validate the version type.
            *release*::: (Maven only) The repository accepts release versions only.
            *snapshot*::: (Maven only) The repository accepts snapshot versions only.
            :::
            +
