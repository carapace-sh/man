name: delete
description: '*(ALPHA)*  Deletes a namespace.'
flags:
    --location=: The name of the region for the namespace.
documentation:
    command: '*(ALPHA)*  Deletes a namespace.'
    flag:
        location: |-
            The name of the region for the namespace.
            +
