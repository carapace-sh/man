name: describe-user-groups
description: Returns a list of user groups.
flags:
    --marker=: An optional marker returned from a prior request.
    --max-records=: The maximum number of records to include in the response.
    --user-group-id=: The ID of the user group.
documentation:
    command: Returns a list of user groups.
    flag:
        marker: An optional marker returned from a prior request. Use this marker for pagination of results from this operation. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by MaxRecords. &gt;
        max-records: The maximum number of records to include in the response. If more records exist than the specified MaxRecords value, a marker is included in the response so that the remaining results can be retrieved.
        user-group-id: The ID of the user group.
