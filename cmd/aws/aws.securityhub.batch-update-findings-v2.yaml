name: batch-update-findings-v2
description: Used by customers to update information about their investigation into a finding.
flags:
    --comment=: The updated value for a user provided comment about the finding.
    --finding-identifiers=: Provides information to identify a specific V2 finding.
    --metadata-uids=: The list of finding `metadata.uid` to indicate findings to update.
    --severity-id=: The updated value for the normalized severity identifier.
    --status-id=: The updated value for the normalized status identifier.
documentation:
    command: Used by customers to update information about their investigation into a finding. Requested by delegated administrator accounts or member accounts. Delegated administrator accounts can update findings for their account and their member accounts. Member accounts can update findings for their account. `BatchUpdateFindings` and `BatchUpdateFindingV2` both use `securityhub:BatchUpdateFindings` in the `Action` element of an IAM policy statement. You must have permission to perform the `securityhub:BatchUpdateFindings` action. Updates from `BatchUpdateFindingsV2` don't affect the value of f`inding_info.modified_time`, `finding_info.modified_time_dt`, `time`, `time_dt for a finding`. This API is in public preview and subject to change.
    flag:
        comment: The updated value for a user provided comment about the finding. Minimum character length 1. Maximum character length 512.
        finding-identifiers: Provides information to identify a specific V2 finding.
        metadata-uids: The list of finding `metadata.uid` to indicate findings to update. Finding `metadata.uid` is a globally unique identifier associated with the finding. Customers cannot use `MetadataUids` together with `FindingIdentifiers`.
        severity-id: The updated value for the normalized severity identifier. The severity ID is an integer with the allowed enum values \[0, 1, 2, 3, 4, 5, 99]. When customer provides the updated severity ID, the string sibling severity will automatically be updated in the finding.
        status-id: The updated value for the normalized status identifier. The status ID is an integer with the allowed enum values \[0, 1, 2, 3, 4, 5, 6, 99]. When customer provides the updated status ID, the string sibling status will automatically be updated in the finding.
