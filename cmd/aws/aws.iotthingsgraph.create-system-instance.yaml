name: create-system-instance
description: Creates a system instance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --definition=!: ""
    --flow-actions-role-arn=: The ARN of the IAM role that AWS IoT Things Graph will assume when it executes the flow.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --greengrass-group-name=: The name of the Greengrass group where the system instance will be deployed.
    --metrics-configuration=: ""
    --s3-bucket-name=: The name of the Amazon Simple Storage Service bucket that will be used to store and deploy the system instance's resource file.
    --tags=:
        description: Metadata, consisting of key-value pairs, that can be used to categorize your system instances.
        nargs: -1
    --target=!: The target type of the deployment.
completion:
    flag:
        target:
            - GREENGRASS
            - CLOUD
documentation:
    command: |-
        Creates a system instance.

        This action validates the system instance, prepares the deployment-related resources. For Greengrass deployments, it updates the Greengrass group that is specified by the `greengrassGroupName` parameter. It also adds a file to the S3 bucket specified by the `s3BucketName` parameter. You need to call `DeploySystemInstance` after running this action.

        For Greengrass deployments, since this action modifies and adds resources to a Greengrass group and an S3 bucket on the caller's behalf, the calling identity must have write permissions to both the specified Greengrass group and S3 bucket. Otherwise, the call will fail with an authorization error.

        For cloud deployments, this action requires a `flowActionsRoleArn` value. This is an IAM role that has permissions to access AWS services, such as AWS Lambda and AWS IoT, that the flow uses when it executes.

        If the definition document doesn't specify a version of the user's namespace, the latest version will be used by default.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        definition: ""
        flow-actions-role-arn: The ARN of the IAM role that AWS IoT Things Graph will assume when it executes the flow. This role must have read and write access to AWS Lambda and AWS IoT and any other AWS services that the flow uses when it executes. This value is required if the value of the `target` parameter is `CLOUD`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        greengrass-group-name: The name of the Greengrass group where the system instance will be deployed. This value is required if the value of the `target` parameter is `GREENGRASS`.
        metrics-configuration: ""
        s3-bucket-name: The name of the Amazon Simple Storage Service bucket that will be used to store and deploy the system instance's resource file. This value is required if the value of the `target` parameter is `GREENGRASS`.
        tags: Metadata, consisting of key-value pairs, that can be used to categorize your system instances.
        target: The target type of the deployment. Valid values are `GREENGRASS` and `CLOUD`.
