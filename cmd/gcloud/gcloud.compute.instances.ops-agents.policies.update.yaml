name: update
description: Update a Google Cloud Observability agents policy for the Ops Agent.
flags:
    --debug-dry-run&: If provided, the resulting OSPolicyAssignment will be printed to standard output and no actual changes are made.
    --file=!: YAML file with a subset of agents policy fields you wish to update.
    --no-debug-dry-run&: If provided, the resulting OSPolicyAssignment will be printed to standard output and no actual changes are made.
    --zone=!: Zone where the agents policy is located.
documentation:
    command: |-
        *gcloud compute instances ops-agents policies update* modifies a policy that facilitates agent management across
        Compute Engine instances based on user specified instance filters. This policy
        installs, specifies versioning, and removes Ops Agents.

        The command returns the content of the modified policy or an error indicating
        why the modification fails. The modified policy takes effect asynchronously.
        It can take 10-15 minutes for the VMs to enforce the newly modified policy.
    flag:
        debug-dry-run: If provided, the resulting OSPolicyAssignment will be printed to standard output and no actual changes are made.
        file: |-
            YAML file with a subset of agents policy fields you wish to update. For
            information about the agents policy format, see https://cloud.google.com/stackdriver/docs/solutions/agents/ops-agent/agent-policies#config-files.
        no-debug-dry-run: If provided, the resulting OSPolicyAssignment will be printed to standard output and no actual changes are made.
        zone: Zone where the agents policy is located.
