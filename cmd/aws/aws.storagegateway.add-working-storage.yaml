name: add-working-storage
description: Configures one or more gateway local disks as working storage for a gateway.
flags:
    --disk-ids=!: An array of strings that identify disks that are to be configured as working storage.
    --gateway-arn=!: ""
documentation:
    command: |-
        Configures one or more gateway local disks as working storage for a gateway. This operation is only supported in the stored volume gateway type. This operation is deprecated in cached volume API version 20120630. Use [AddUploadBuffer]() instead.

        Working storage is also referred to as upload buffer. You can also use the [AddUploadBuffer]() operation to add upload buffer to a stored volume gateway.

        In the request, you specify the gateway Amazon Resource Name (ARN) to which you want to add working storage, and one or more disk IDs that you want to configure as working storage.
    flag:
        disk-ids: An array of strings that identify disks that are to be configured as working storage. Each string has a minimum length of 1 and maximum length of 300. You can get the disk IDs from the [ListLocalDisks]() API.
        gateway-arn: ""
