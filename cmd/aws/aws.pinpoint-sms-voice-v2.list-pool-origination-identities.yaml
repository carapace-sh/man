name: list-pool-origination-identities
description: Lists all associated origination identities in your pool.
flags:
    --filters=: An array of PoolOriginationIdentitiesFilter objects to filter the results..
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
    --pool-id=!: The unique identifier for the pool.
documentation:
    command: |-
        Lists all associated origination identities in your pool.

        If you specify filters, the output includes information for only those origination identities that meet the filter criteria.
    flag:
        filters: An array of PoolOriginationIdentitiesFilter objects to filter the results..
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
        pool-id: |-
            The unique identifier for the pool. This value can be either the PoolId or PoolArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
