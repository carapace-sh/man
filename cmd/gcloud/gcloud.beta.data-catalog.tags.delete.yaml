name: delete
description: '*(BETA)*  *(DEPRECATED)*  Delete a Data Catalog entry tag.'
flags:
    --entry-group=: Entry group of the tag.
    --entry=: Entry of the tag.
    --location=: Location of the tag.
documentation:
    command: |4-
        *(BETA)*  *(DEPRECATED)*  This command is deprecated. Please use `gcloud dataplex entries` instead. Note that aspects - successors of tags - are part of the entry resource and are managed by `gcloud dataplex entries` command.

        Delete a Data Catalog entry tag.
    flag:
        entry: |-
            Entry of the tag.
            +

            To set the `entry` attribute:
            * provide the argument `tag` on the command line with a fully specified name;
            * provide the argument `--entry` on the command line.
        entry-group: |-
            Entry group of the tag.
            +

            To set the `entry-group` attribute:
            * provide the argument `tag` on the command line with a fully specified name;
            * provide the argument `--entry-group` on the command line.
        location: |-
            Location of the tag.
            +

            To set the `location` attribute:
            * provide the argument `tag` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
