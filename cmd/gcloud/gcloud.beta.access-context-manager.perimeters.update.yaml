name: update
description: '*(BETA)*  Update the enforced configuration for an existing Service Perimeter.'
flags:
    --add-access-levels=: Append the given values to the current access levels.
    --add-resources=: Append the given values to the current resources.
    --add-restricted-services=: Append the given values to the current restricted services.
    --add-vpc-allowed-services=: Append the given values to the current vpc allowed services.
    --clear-access-levels: Empty the current access levels.
    --clear-egress-policies: Empties existing enforced Egress Policies.
    --clear-ingress-policies: Empties existing enforced Ingress Policies.
    --clear-resources: Empty the current resources.
    --clear-restricted-services: Empty the current restricted services.
    --clear-vpc-allowed-services: Empty the current vpc allowed services.
    --description=: Long-form description of service perimeter.
    --enable-vpc-accessible-services: When specified restrict API calls within the Service Perimeter to the set of vpc allowed services.
    --etag=: The etag for the version of the Access Policy that this
    --no-clear-access-levels&: Empty the current access levels.
    --no-clear-egress-policies&: Empties existing enforced Egress Policies.
    --no-clear-ingress-policies&: Empties existing enforced Ingress Policies.
    --no-clear-resources&: Empty the current resources.
    --no-clear-restricted-services&: Empty the current restricted services.
    --no-clear-vpc-allowed-services&: Empty the current vpc allowed services.
    --no-enable-vpc-accessible-services&: When specified restrict API calls within the Service Perimeter to the set of vpc allowed services.
    --policy=: The ID of the access policy.
    --remove-access-levels=: Remove the given values from the current access levels.
    --remove-resources=: Remove the given values from the current resources.
    --remove-restricted-services=: Remove the given values from the current restricted services.
    --remove-vpc-allowed-services=: Remove the given values from the current vpc allowed services.
    --set-access-levels=: Completely replace the current access levels with the given values.
    --set-egress-policies=: Path to a file containing a list of Egress Policies.
    --set-ingress-policies=: Path to a file containing a list of Ingress Policies.
    --set-resources=: Completely replace the current resources with the given values.
    --set-restricted-services=: Completely replace the current restricted services with the given values.
    --title=: Short human-readable title of the service perimeter.
    --type=: Type of the perimeter.
completion:
    flag:
        type:
            - bridge
            - regular
documentation:
    command: '*(BETA)*  This command updates the enforced configuration (`status`) of a Service Perimeter.'
    flag:
        add-access-levels: Append the given values to the current access levels.
        add-resources: Append the given values to the current resources.
        add-restricted-services: Append the given values to the current restricted services.
        add-vpc-allowed-services: Append the given values to the current vpc allowed services.
        clear-access-levels: Empty the current access levels.
        clear-egress-policies: Empties existing enforced Egress Policies.
        clear-ingress-policies: Empties existing enforced Ingress Policies.
        clear-resources: Empty the current resources.
        clear-restricted-services: Empty the current restricted services.
        clear-vpc-allowed-services: Empty the current vpc allowed services.
        description: Long-form description of service perimeter.
        enable-vpc-accessible-services: When specified restrict API calls within the Service Perimeter to the set of vpc allowed services. To disable use '--no-enable-vpc-accessible-services'.
        etag: |-
            The etag for the version of the Access Policy that this
                          operation is to be performed on. If, at the time of the
                          operation, the etag for the Access Policy stored in Access
                          Context Manager is different from the specified etag, then the
                          commit operation will not be performed and the call will fail.
                          If etag is not provided, the operation will be performed as if a
                          valid etag is provided.
        no-clear-access-levels: Empty the current access levels.
        no-clear-egress-policies: Empties existing enforced Egress Policies.
        no-clear-ingress-policies: Empties existing enforced Ingress Policies.
        no-clear-resources: Empty the current resources.
        no-clear-restricted-services: Empty the current restricted services.
        no-clear-vpc-allowed-services: Empty the current vpc allowed services.
        no-enable-vpc-accessible-services: When specified restrict API calls within the Service Perimeter to the set of vpc allowed services. To disable use '--no-enable-vpc-accessible-services'.
        policy: |-
            The ID of the access policy.
            +
            To set the `policy` attribute:
            * provide the argument `perimeter` on the command line with a fully specified name;
            * provide the argument `--policy` on the command line;
            * set the property `access_context_manager/policy`.
        remove-access-levels: Remove the given values from the current access levels.
        remove-resources: Remove the given values from the current resources.
        remove-restricted-services: Remove the given values from the current restricted services.
        remove-vpc-allowed-services: Remove the given values from the current vpc allowed services.
        set-access-levels: Completely replace the current access levels with the given values.
        set-egress-policies: "Path to a file containing a list of Egress Policies.\n+\nThis file contains a list of YAML-compliant objects representing Egress Policies described in the API reference.\n+\nFor more information about the alpha version, see:\nhttps://cloud.google.com/access-context-manager/docs/reference/rest/v1alpha/accessPolicies.servicePerimeters\nFor more information about non-alpha versions, see: \nhttps://cloud.google.com/access-context-manager/docs/reference/rest/v1/accessPolicies.servicePerimeters"
        set-ingress-policies: "Path to a file containing a list of Ingress Policies.\n+\nThis file contains a list of YAML-compliant objects representing Ingress Policies described in the API reference.\n+\nFor more information about the alpha version, see:\nhttps://cloud.google.com/access-context-manager/docs/reference/rest/v1alpha/accessPolicies.servicePerimeters\nFor more information about non-alpha versions, see: \nhttps://cloud.google.com/access-context-manager/docs/reference/rest/v1/accessPolicies.servicePerimeters"
        set-resources: Completely replace the current resources with the given values.
        set-restricted-services: Completely replace the current restricted services with the given values.
        title: Short human-readable title of the service perimeter.
        type: |-
            Type of the perimeter.
            +
            A *regular* perimeter allows resources within this service perimeter
            to import and export data amongst themselves. A project may belong to
            at most one regular service perimeter.
            +
            A *bridge* perimeter allows resources in different regular service
            perimeters to import and export data between each other. A project may
            belong to multiple bridge service perimeters (only if it also belongs to a
            regular service perimeter). Both restricted and unrestricted service lists,
            as well as access level lists, must be empty.
            +
            _TYPE_ must be one of: *bridge*, *regular*.
