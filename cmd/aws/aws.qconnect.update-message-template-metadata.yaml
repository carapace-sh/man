name: update-message-template-metadata
description: Updates the Amazon Q in Connect message template metadata.
flags:
    --description=: The description of the message template.
    --grouping-configuration=: ""
    --knowledge-base-id=!: The identifier of the knowledge base.
    --message-template-id=!: The identifier of the message template.
    --name=: The name of the message template.
documentation:
    command: Updates the Amazon Q in Connect message template metadata. Note that any modification to the message template’s name, description and grouping configuration will applied to the message template pointed by the `$LATEST` qualifier and all available versions. Partial update is supported. If any field is not supplied, it will remain unchanged for the message template.
    flag:
        description: The description of the message template.
        grouping-configuration: ""
        knowledge-base-id: The identifier of the knowledge base. Can be either the ID or the ARN. URLs cannot contain the ARN.
        message-template-id: The identifier of the message template. Can be either the ID or the ARN. It cannot contain any qualifier.
        name: The name of the message template.
