completion:
    flag:
        instance-placement:
            - dedicated
            - default
            - host
        kubelet-config-cpu-manager-policy:
            - none
            - static
        root-volume-type:
            - gp2
            - gp3
documentation:
    command: |+
        *(ALPHA)*  *(DEPRECATED)*  Create a node pool in an Anthos cluster on AWS.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/aws/deprecations/deprecation-announcement for more details.

    flag:
        annotations: Annotations for the node pool.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        autoscaling-metrics: Autoscaling metrics to enable. For a list of valid metrics, refer to https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_EnableMetricsCollection.html. If granularity is specified but not any metrics, all metrics are enabled.
        autoscaling-metrics-granularity: Frequency at which EC2 Auto Scaling sends aggregated data to AWS CloudWatch. The only valid value is "1Minute".
        cluster: |-
            cluster of the node_pool.
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        config-encryption-kms-key-arn: Amazon Resource Name (ARN) of the AWS KMS key to encrypt the user data.
        enable-autorepair: |-
            Enable node autorepair feature for a node pool. Use --no-enable-autorepair to disable.
            +
              $ {command} --enable-autorepair
            +
            Node autorepair is disabled by default.
        iam-instance-profile: Name or ARN of the IAM instance profile associated with the node pool.
        image-type: |-
            Set the OS image type to use on node pool instances.
            +
            Examples:
            +
              $ {command} --image-type=windows
              $ {command} --image-type=ubuntu
        instance-placement: 'Type of the tenancy. _INSTANCE_PLACEMENT_ must be one of: *dedicated*, *default*, *host*.'
        instance-type: AWS EC2 instance type for the node pool's nodes.
        kubelet-config-cpu-cfs-quota: Enforce a Kubelet CPU CFS quota.
        kubelet-config-cpu-cfs-quota-period: Kubelet CPU CFS quota period, within the range "1ms" to "1s".
        kubelet-config-cpu-manager-policy: 'Kubelet CPU manager policy. _KUBELET_CONFIG_CPU_MANAGER_POLICY_ must be one of: *none*, *static*.'
        kubelet-config-pod-pids-limit: Kubelet maximum number of PIDS in any pod, within the range 1024 to 4194304.
        location: |-
            Google Cloud location for the node_pool.
            +
            To set the `location` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_aws/location`.
        max-nodes: Maximum number of nodes in the node pool.
        max-pods-per-node: Maximum number of pods per node.
        max-surge-update: |-
            Maximum number of extra (surge) nodes to be created beyond the current size of
            the node pool during its update process. Use --max-unavailable-update as well,
            if needed, to control the overall surge settings.
            +
            To create an extra node each time the node pool is rolling updated, run:
            +
              $ {command} --max-surge-update=1 --max-unavailable-update=0
        max-unavailable-update: |-
            Maximum number of nodes that can be simultaneously unavailable during this node
            pool's update process. Use --max-surge-update as well, if needed, to control the
            overall surge settings.
            +
            To update 3 nodes in parallel (1 + 2), but keep at least 4 nodes (6 - 2)
            available each time the node pool is rolling updated, run:
            +
              $ {command} --min-nodes=6 --max-surge-update=1 --max-unavailable-update=2
        min-nodes: Minimum number of nodes in the node pool.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-autorepair: |
            Enable node autorepair feature for a node pool. Use --no-enable-autorepair to disable.

              $ {command} --enable-autorepair

            Node autorepair is disabled by default.
        no-validate-only: Validate the node pool to create, but don't actually perform it.
        node-labels: Labels assigned to the node pool's nodes.
        node-taints: 'Taints assigned to nodes of the node pool. Node taint is of format key=value:effect. Effect must be one of: NoExecute, NoSchedule, PreferNoSchedule.'
        node-version: Kubernetes version to use for the node pool.
        proxy-secret-arn: ARN of the AWS Secrets Manager secret that contains a proxy configuration.
        proxy-secret-version-id: Version ID string of the AWS Secrets Manager secret that contains a proxy configuration.
        root-volume-iops: Number of I/O operations per second (IOPS) to provision for the root volume.
        root-volume-kms-key-arn: Amazon Resource Name (ARN) of the AWS KMS key to encrypt the root volume.
        root-volume-size: Size of the root volume. The value must be a whole number followed by a size unit of `GB` for gigabyte, or `TB` for terabyte. If no size unit is specified, GB is assumed.
        root-volume-throughput: Throughput to provision for the root volume, in MiB/s. Only valid if the volume type is GP3. If volume type is GP3 and throughput is not provided, it defaults to 125.
        root-volume-type: 'Type of the root volume. _ROOT_VOLUME_TYPE_ must be one of: *gp2*, *gp3*.'
        security-group-ids: IDs of additional security groups to add to the node pool's nodes.
        spot-instance-types: List of AWS EC2 instance types for creating a spot node pool's nodes. The specified instance types must have the same CPU architecture, the same number of CPUs and memory. You can use the Amazon EC2 Instance Selector tool (https://github.com/aws/amazon-ec2-instance-selector) to choose instance types with matching CPU and memory configurations.
        ssh-ec2-key-pair: Name of the EC2 key pair authorized to login to the node pool's nodes.
        subnet-id: Subnet ID of an existing VNET to use for the node pool.
        tags: |-
            Applies the given tags (comma separated) on the node pool. Example:
            +
              $ {command} EXAMPLE_NODE_POOL --tags=tag1=one,tag2=two
        validate-only: Validate the node pool to create, but don't actually perform it.
