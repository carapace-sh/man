name: get-connector-definition-version
description: Retrieves information about a connector definition version, including the connectors that the version contains.
flags:
    --connector-definition-id=!: The ID of the connector definition.
    --connector-definition-version-id=!: The ID of the connector definition version.
    --next-token=: The token for the next set of results, or ''null'' if there are no additional results.
documentation:
    command: Retrieves information about a connector definition version, including the connectors that the version contains. Connectors are prebuilt modules that interact with local infrastructure, device protocols, AWS, and other cloud services.
    flag:
        connector-definition-id: The ID of the connector definition.
        connector-definition-version-id: The ID of the connector definition version. This value maps to the ''Version'' property of the corresponding ''VersionInformation'' object, which is returned by ''ListConnectorDefinitionVersions'' requests. If the version is the last one that was associated with a connector definition, the value also maps to the ''LatestVersion'' property of the corresponding ''DefinitionInformation'' object.
        next-token: The token for the next set of results, or ''null'' if there are no additional results.
