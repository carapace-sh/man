name: untag-resource
description: Deletes a tag from an Amazon Web Services Payment Cryptography key.
flags:
    --resource-arn=!: The `KeyARN` of the key whose tags are being removed.
    --tag-keys=!: One or more tag keys.
documentation:
    command: |-
        Deletes a tag from an Amazon Web Services Payment Cryptography key.

        Tagging or untagging an Amazon Web Services Payment Cryptography key can allow or deny permission to the key.

        **Cross-account use:** This operation can't be used across different Amazon Web Services accounts.

        **Related operations:**

        - [ListTagsForResource](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_ListTagsForResource.html)
        - [TagResource](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_TagResource.html)
    flag:
        resource-arn: The `KeyARN` of the key whose tags are being removed.
        tag-keys: |-
            One or more tag keys. Don't include the tag values.

            If the Amazon Web Services Payment Cryptography key doesn't have the specified tag key, Amazon Web Services Payment Cryptography doesn't throw an exception or return a response. To confirm that the operation succeeded, use the [ListTagsForResource](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_ListTagsForResource.html) operation.
