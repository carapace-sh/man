name: start-asset-bundle-import-job
description: Starts an Asset Bundle import job.
flags:
    --asset-bundle-import-job-id=!: The ID of the job.
    --asset-bundle-import-source=!: The source of the asset bundle zip file that contains the data that you want to import.
    --aws-account-id=!: The ID of the Amazon Web Services account to import assets into.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --failure-action=: The failure action for the import job.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --override-parameters=: Optional overrides that are applied to the resource configuration before import.
    --override-permissions=: Optional permission overrides that are applied to the resource configuration before import.
    --override-tags=: Optional tag overrides that are applied to the resource configuration before import.
    --override-validation-strategy=: An optional validation strategy override for all analyses and dashboards that is applied to the resource configuration before import.
completion:
    flag:
        failure-action:
            - DO_NOTHING
            - ROLLBACK
documentation:
    command: |-
        Starts an Asset Bundle import job.

        An Asset Bundle import job imports specified QuickSight assets into an QuickSight account. You can also choose to import a naming prefix and specified configuration overrides. The assets that are contained in the bundle file that you provide are used to create or update a new or existing asset in your QuickSight account. Each QuickSight account can run up to 5 import jobs concurrently.

        The API caller must have the necessary `"create"`, `"describe"`, and `"update"` permissions in their IAM role to access each resource type that is contained in the bundle file before the resources can be imported.
    flag:
        asset-bundle-import-job-id: The ID of the job. This ID is unique while the job is running. After the job is completed, you can reuse this ID for another job.
        asset-bundle-import-source: The source of the asset bundle zip file that contains the data that you want to import. The file must be in `QUICKSIGHT_JSON` format.
        aws-account-id: The ID of the Amazon Web Services account to import assets into.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        failure-action: |-
            The failure action for the import job.

            If you choose `ROLLBACK`, failed import jobs will attempt to undo any asset changes caused by the failed job.

            If you choose `DO_NOTHING`, failed import jobs will not attempt to roll back any asset changes caused by the failed job, possibly keeping the QuickSight account in an inconsistent state.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        override-parameters: Optional overrides that are applied to the resource configuration before import.
        override-permissions: Optional permission overrides that are applied to the resource configuration before import.
        override-tags: Optional tag overrides that are applied to the resource configuration before import.
        override-validation-strategy: An optional validation strategy override for all analyses and dashboards that is applied to the resource configuration before import.
