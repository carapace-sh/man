name: describe-task-sets
description: Describes the task sets in the specified cluster and service.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster=!: The short name or full Amazon Resource Name (ARN) of the cluster that hosts the service that the task sets exist in.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include=:
        description: Specifies whether to see the resource tags for the task set.
        nargs: -1
    --service=!: The short name or full Amazon Resource Name (ARN) of the service that the task sets exist in.
    --task-sets=:
        description: The ID or full Amazon Resource Name (ARN) of task sets to describe.
        nargs: -1
documentation:
    command: Describes the task sets in the specified cluster and service. This is used when a service uses the `EXTERNAL` deployment controller type. For more information, see [Amazon ECS Deployment Types](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-types.html) in the *Amazon Elastic Container Service Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster: The short name or full Amazon Resource Name (ARN) of the cluster that hosts the service that the task sets exist in.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include: Specifies whether to see the resource tags for the task set. If `TAGS` is specified, the tags are included in the response. If this field is omitted, tags aren't included in the response.
        service: The short name or full Amazon Resource Name (ARN) of the service that the task sets exist in.
        task-sets: The ID or full Amazon Resource Name (ARN) of task sets to describe.
