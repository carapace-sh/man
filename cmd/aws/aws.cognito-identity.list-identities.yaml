name: list-identities
description: Lists the identities in an identity pool.
flags:
    --hide-disabled=: An optional boolean parameter that allows you to hide disabled identities.
    --identity-pool-id=!: An identity pool ID in the format REGION:GUID.
    --max-results=!: The maximum number of identities to return.
    --next-token=: A pagination token.
documentation:
    command: |-
        Lists the identities in an identity pool.

        You must use Amazon Web Services developer credentials to call this operation.
    flag:
        hide-disabled: An optional boolean parameter that allows you to hide disabled identities. If omitted, the ListIdentities API will include disabled identities in the response.
        identity-pool-id: An identity pool ID in the format REGION:GUID.
        max-results: The maximum number of identities to return.
        next-token: A pagination token.
