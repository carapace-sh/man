name: stream-direct-predict
description: '*(ALPHA)*  Run Vertex AI online stream direct prediction.'
flags:
    --json-request=!: Path to a local file containing the body of a JSON request.
    --region=: Cloud region for the endpoint.
documentation:
    command: |-
        *(ALPHA)*  `gcloud alpha ai endpoints stream-direct-predict` sends a stream direct prediction request to Vertex AI endpoint
           for the given inputs. The request limit is 10MB.

        ## EXAMPLES

        To stream direct predict against an endpoint ``123'' under project ``example''
        in region ``us-central1'', run:

          $ gcloud alpha ai endpoints stream-direct-predict 123 --project=example --region=us-central1
          --json-request=input.json
    flag:
        json-request: |-
            Path to a local file containing the body of a JSON request.
            +
            An example of a JSON request:
            +
                {
                  "inputs": [
                    {"dtype": "STRING", shape: [1], "string_val": ["hello world"]},
                    {"dtype": "INT32", shape: [1], "int_val": [42]}
                  ]
                }
            +
            This flag accepts "-" for stdin.
        region: |-
            Cloud region for the endpoint.
            +
            To set the `region` attribute:
            * provide the argument `endpoint` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
