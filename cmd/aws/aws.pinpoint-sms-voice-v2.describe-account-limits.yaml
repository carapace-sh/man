name: describe-account-limits
description: Describes the current End User MessagingSMS SMS Voice V2 resource quotas for your account.
flags:
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
documentation:
    command: |-
        Describes the current End User MessagingSMS SMS Voice V2 resource quotas for your account. The description for a quota includes the quota name, current usage toward that quota, and the quota's maximum value.

        When you establish an Amazon Web Services account, the account has initial quotas on the maximum number of configuration sets, opt-out lists, phone numbers, and pools that you can create in a given Region. For more information see [Quotas](https://docs.aws.amazon.com/sms-voice/latest/userguide/quotas.html) in the *End User MessagingSMS User Guide*.
    flag:
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
