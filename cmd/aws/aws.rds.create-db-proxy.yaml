name: create-db-proxy
description: Creates a new DB proxy.
flags:
    --auth=: The authorization mechanism that the proxy uses.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-proxy-name=!: The identifier for the proxy.
    --debug-logging: Specifies whether the proxy logs detailed connection and query information.
    --default-auth-scheme=: The default authentication scheme that the proxy uses for client connections to the proxy and connections from the proxy to the underlying database.
    --endpoint-network-type=: The network type of the DB proxy endpoint.
    --engine-family=!: The kinds of databases that the proxy can connect to.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --idle-client-timeout=: The number of seconds that a connection to the proxy can be inactive before the proxy disconnects it.
    --no-debug-logging: Specifies whether the proxy logs detailed connection and query information.
    --no-require-tls: Specifies whether Transport Layer Security (TLS) encryption is required for connections to the proxy.
    --require-tls: Specifies whether Transport Layer Security (TLS) encryption is required for connections to the proxy.
    --role-arn=!: The Amazon Resource Name (ARN) of the IAM role that the proxy uses to access secrets in Amazon Web Services Secrets Manager.
    --tags=: An optional set of key-value pairs to associate arbitrary data of your choosing with the proxy.
    --target-connection-network-type=: The network type that the proxy uses to connect to the target database.
    --vpc-security-group-ids=: One or more VPC security group IDs to associate with the new proxy.
    --vpc-subnet-ids=!: One or more VPC subnet IDs to associate with the new proxy.
completion:
    flag:
        default-auth-scheme:
            - IAM_AUTH
            - NONE
        endpoint-network-type:
            - IPV4
            - IPV6
            - DUAL
        engine-family:
            - MYSQL
            - POSTGRESQL
            - SQLSERVER
        target-connection-network-type:
            - IPV4
            - IPV6
documentation:
    command: Creates a new DB proxy.
    flag:
        auth: The authorization mechanism that the proxy uses.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-proxy-name: The identifier for the proxy. This name must be unique for all proxies owned by your Amazon Web Services account in the specified Amazon Web Services Region. An identifier must begin with a letter and must contain only ASCII letters, digits, and hyphens; it can't end with a hyphen or contain two consecutive hyphens.
        debug-logging: Specifies whether the proxy logs detailed connection and query information. When you enable `DebugLogging`, the proxy captures connection details and connection pool behavior from your queries. Debug logging increases CloudWatch costs and can impact proxy performance. Enable this option only when you need to troubleshoot connection or performance issues.
        default-auth-scheme: The default authentication scheme that the proxy uses for client connections to the proxy and connections from the proxy to the underlying database. Valid values are `NONE` and `IAM_AUTH`. When set to `IAM_AUTH`, the proxy uses end-to-end IAM authentication to connect to the database. If you don't specify `DefaultAuthScheme` or specify this parameter as `NONE`, you must specify the `Auth` option.
        endpoint-network-type: |-
            The network type of the DB proxy endpoint. The network type determines the IP version that the proxy endpoint supports.

            Valid values:

            - `IPV4` - The proxy endpoint supports IPv4 only.
            - `IPV6` - The proxy endpoint supports IPv6 only.
            - `DUAL` - The proxy endpoint supports both IPv4 and IPv6.

            Default: `IPV4`

            Constraints:

            - If you specify `IPV6` or `DUAL`, the VPC and all subnets must have an IPv6 CIDR block.
            - If you specify `IPV6` or `DUAL`, the VPC tenancy cannot be `dedicated`.
        engine-family: The kinds of databases that the proxy can connect to. This value determines which database network protocol the proxy recognizes when it interprets network traffic to and from the database. For Aurora MySQL, RDS for MariaDB, and RDS for MySQL databases, specify `MYSQL`. For Aurora PostgreSQL and RDS for PostgreSQL databases, specify `POSTGRESQL`. For RDS for Microsoft SQL Server, specify `SQLSERVER`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        idle-client-timeout: The number of seconds that a connection to the proxy can be inactive before the proxy disconnects it. You can set this value higher or lower than the connection timeout limit for the associated database.
        require-tls: Specifies whether Transport Layer Security (TLS) encryption is required for connections to the proxy. By enabling this setting, you can enforce encrypted TLS connections to the proxy.
        role-arn: The Amazon Resource Name (ARN) of the IAM role that the proxy uses to access secrets in Amazon Web Services Secrets Manager.
        tags: An optional set of key-value pairs to associate arbitrary data of your choosing with the proxy.
        target-connection-network-type: |-
            The network type that the proxy uses to connect to the target database. The network type determines the IP version that the proxy uses for connections to the database.

            Valid values:

            - `IPV4` - The proxy connects to the database using IPv4 only.
            - `IPV6` - The proxy connects to the database using IPv6 only.

            Default: `IPV4`

            Constraints:

            - If you specify `IPV6`, the database must support dual-stack mode. RDS doesn't support IPv6-only databases.
            - All targets registered with the proxy must be compatible with the specified network type.
        vpc-security-group-ids: One or more VPC security group IDs to associate with the new proxy.
        vpc-subnet-ids: One or more VPC subnet IDs to associate with the new proxy.
