name: get-deployment-strategy
description: Retrieves information about a deployment strategy.
flags:
    --deployment-strategy-id=!: The ID of the deployment strategy to get.
documentation:
    command: Retrieves information about a deployment strategy. A deployment strategy defines important criteria for rolling out your configuration to the designated targets. A deployment strategy includes the overall duration required, a percentage of targets to receive the deployment during each interval, an algorithm that defines how percentage grows, and bake time.
    flag:
        deployment-strategy-id: The ID of the deployment strategy to get.
