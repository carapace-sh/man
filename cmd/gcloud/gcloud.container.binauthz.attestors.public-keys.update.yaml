name: update
description: Update a public key on an Attestor.
flags:
    --attestor=!: ID of the attestor or fully qualified identifier for the attestor.
    --comment=: The comment describing the public key.
    --pgp-public-key-file=: The path to a file containing the updated ASCII-armored PGP public key.
documentation:
    command: |-
        ## EXAMPLES

        To update a PGP public key on an existing Attestor `my_attestor`:

          $ gcloud container binauthz attestors public-keys update \
              0638AADD940361EA2D7F14C58C124F0E663DA097 \
              --attestor=my_attestor \
              --pgp-public-key-file=my_key.pub
    flag:
        attestor: |-
            ID of the attestor or fully qualified identifier for the attestor.
            +
            To set the `name` attribute:
            * provide the argument `--attestor` on the command line.
        comment: The comment describing the public key.
        pgp-public-key-file: The path to a file containing the updated ASCII-armored PGP public key. Use a full or relative path to a local file containing the value of pgp_public_key_file.
