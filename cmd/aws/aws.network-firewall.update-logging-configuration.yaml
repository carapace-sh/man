name: update-logging-configuration
description: Sets the logging configuration for the specified firewall.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enable-monitoring-dashboard: A boolean that lets you enable or disable the detailed firewall monitoring dashboard on the firewall.
    --firewall-arn=: The Amazon Resource Name (ARN) of the firewall.
    --firewall-name=: The descriptive name of the firewall.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --logging-configuration=: Defines how Network Firewall performs logging for a firewall.
    --no-enable-monitoring-dashboard: A boolean that lets you enable or disable the detailed firewall monitoring dashboard on the firewall.
documentation:
    command: |-
        Sets the logging configuration for the specified firewall.

        To change the logging configuration, retrieve the [LoggingConfiguration]() by calling [DescribeLoggingConfiguration](), then change it and provide the modified object to this update call. You must change the logging configuration one [LogDestinationConfig]() at a time inside the retrieved [LoggingConfiguration]() object.

        You can perform only one of the following actions in any call to `UpdateLoggingConfiguration`:

        - Create a new log destination object by adding a single `LogDestinationConfig` array element to `LogDestinationConfigs`.
        - Delete a log destination object by removing a single `LogDestinationConfig` array element from `LogDestinationConfigs`.
        - Change the `LogDestination` setting in a single `LogDestinationConfig` array element.

        You can't change the `LogDestinationType` or `LogType` in a `LogDestinationConfig`. To change these settings, delete the existing `LogDestinationConfig` object and create a new one, using two separate calls to this update operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enable-monitoring-dashboard: |-
            A boolean that lets you enable or disable the detailed firewall monitoring dashboard on the firewall.

            The monitoring dashboard provides comprehensive visibility into your firewall's flow logs and alert logs. After you enable detailed monitoring, you can access these dashboards directly from the **Monitoring** page of the Network Firewall console.

            Specify `TRUE` to enable the the detailed monitoring dashboard on the firewall. Specify `FALSE` to disable the the detailed monitoring dashboard on the firewall.
        firewall-arn: |-
            The Amazon Resource Name (ARN) of the firewall.

            You must specify the ARN or the name, and you can specify both.
        firewall-name: |-
            The descriptive name of the firewall. You can't change the name of a firewall after you create it.

            You must specify the ARN or the name, and you can specify both.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        logging-configuration: Defines how Network Firewall performs logging for a firewall. If you omit this setting, Network Firewall disables logging for the firewall.
