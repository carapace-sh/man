name: create
description: '*(BETA)*  Create an Apigee API product.'
flags:
    --all-environments: Make all environments accessible through this API product.
    --all-proxies: Expose all available API proxies and their resources.
    --apis=: Comma-separated names of API proxies to which this API product is bound.
    --attributes=: Key-value attribute pairs that may be used to extend the default API product profile with customer-specific metadata.
    --description=: Overview of the API product.
    --display-name=: Name to be displayed in the UI or developer portal to developers registering for API access.
    --environments=: Environments to which the API product is bound.
    --internal-access: Prevent external access to this API product.
    --manual-approval: Require manual approval of developer requests to access this API product before their consumer keys can be used.
    --no-all-proxies&: Expose all available API proxies and their resources.
    --no-manual-approval&: Require manual approval of developer requests to access this API product before their consumer keys can be used.
    --oauth-scopes=: Comma-separated list of OAuth scopes that are validated at runtime.
    --organization=: Apigee organization containing the API product.
    --private-access: Hide this API product in the developer portal but make it accessible by external developers.
    --public-access: Make this API product visible to developers in the Apigee developer portal.
    --quota-interval=: Time interval over which the number of request messages is calculated.
    --quota-unit=: Time unit for `--quota-interval`.
    --quota=: Number of request messages permitted per app by this API product
    --resources=: API resources to be bundled in the API product, separated by `#` signs.
completion:
    flag:
        quota-unit:
            - minute
            - hour
            - day
            - month
documentation:
    command: |
        *(BETA)*  Create an Apigee API product.

        `gcloud beta apigee products create` publishes a collection of API proxy resources as an API
        product.

        API products combine their underlying API proxies with quota settings
        and metadata, to deliver customized and productized API bundles to
        the developer community.

        API products enable the repackaging of APIs on-the-fly, without having
        to do any additional coding or configuration. Apigee recommends
        starting with a simple API product including only required elements,
        and then provisioning credentials to apps to enable them to start
        testing those APIs.

        At minimum, a new API product requires an internal name, access
        policy, and declaration of what environments and API proxies to
        include in the product. If these aren't provided, interactive calls
        will prompt for the missing values, and non-interactive calls will
        fail.
    flag:
        all-environments: Make all environments accessible through this API product.
        all-proxies: Expose all available API proxies and their resources. Must be explicitly specified if neither `--apis` nor `--resources` is provided.
        apis: |-
            Comma-separated names of API proxies to which this API product is bound. Only
            those API proxies will be accessible through the new API product.
            +
            If not provided, all deployed API proxies will be included in the product, so
            long as they match the other parameters.
            +
            The API proxy names must already be deployed to the bound environments, or
            creation of the API product will fail. To get a list of deployed API proxies,
            run:
            +
                $ {grandparent_command} deployments list
            +
            To deploy an API proxy, run:
            +
                $ {grandparent_command} apis deploy
        attributes: Key-value attribute pairs that may be used to extend the default API product profile with customer-specific metadata. Up to 17 attributes can be specified.
        description: Overview of the API product. Include key information about the API product that is not captured by other fields.
        display-name: Name to be displayed in the UI or developer portal to developers registering for API access.
        environments: |-
            Environments to which the API product is bound. Requests to environments that are not listed are rejected, preventing developers from accessing those resources through API Proxies deployed in another environment.
            +
            For example, this can prevent resources associated with API proxies in a ``prod'' environment from also granting access to matching API proxies deployed in a ``test'' environment.
            +
            To get a list of available environments, run:
            +
                $ {grandparent_command} environments list
        internal-access: Prevent external access to this API product.
        manual-approval: Require manual approval of developer requests to access this API product before their consumer keys can be used. If unset, the consumer key is generated in an "approved" state and can be used immediately.
        no-all-proxies: Expose all available API proxies and their resources. Must be explicitly specified if neither `--apis` nor `--resources` is provided.
        no-manual-approval: Require manual approval of developer requests to access this API product before their consumer keys can be used. If unset, the consumer key is generated in an "approved" state and can be used immediately.
        oauth-scopes: Comma-separated list of OAuth scopes that are validated at runtime. Apigee validates that the scopes in any access token presented match the scopes defined in the OAuth policy assoicated with the API product.
        organization: |-
            Apigee organization containing the API product. If unspecified, the Cloud Platform project's associated organization will be used.
            +
            To set the `organization` attribute:
            * provide the argument `INTERNAL_NAME` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        private-access: Hide this API product in the developer portal but make it accessible by external developers.
        public-access: Make this API product visible to developers in the Apigee developer portal.
        quota: |-
            Number of request messages permitted per app by this API product
            for the specified `--quota-interval` and `--quota-unit`.
            +
            For example, to create an API product that allows 50 requests every twelve hours
            to every deployed API proxy, run:
            +
                $ {command} PRODUCT --all-environments --all-proxies --public-access --quota=50 --quota-interval=12 --quota-unit=hour
            +
            If specified, `--quota-interval` and `--quota-unit` must be specified too.
        quota-interval: |-
            Time interval over which the number of request messages is calculated.
            +
            If specified, `--quota` and `--quota-unit` must be specified too.
        quota-unit: |-
            Time unit for `--quota-interval`.
            +
            If specified, `--quota` and `--quota-interval` must be specified too.
            +
            _QUOTA_UNIT_ must be one of: *minute*, *hour*, *day*, *month*.
        resources: |-
            API resources to be bundled in the API product, separated by `#` signs.
            +
            By default, the resource paths are mapped from the `proxy.pathsuffix` variable.
            +
            The proxy path suffix is defined as the URI fragment following the
            ProxyEndpoint base path. For example, if ``/forecastrss'' is given as an element
            of this list, and the base path defined for the API proxy is `/weather`, then
            only requests to `/weather/forecastrss` are permitted by the API product.
            +
            Proxy paths can use asterisks as wildcards; `/**` indicates that all sub-URIs
            are included, whereas a single asterisk indicates that only URIs one level
            down are included.
            +
            By default, `/` supports the same resources as `/**` as well as the base path
            defined by the API proxy.
            +
            For example, if the base path of the API proxy is `/v1/weatherapikey`, then
            the API product supports requests to `/v1/weatherapikey` and to any sub-URIs,
            such as `/v1/weatherapikey/forecastrss`, `/v1/weatherapikey/region/CA`, and so
            on.
            +
            If not provided, all deployed API resources will be included in the product, so
            long as they match the other parameters.
            +
            The API proxy resources must already be deployed to the bound environments, or
            creation of the API product will fail.
