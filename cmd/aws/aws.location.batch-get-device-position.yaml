name: batch-get-device-position
description: Lists the latest device positions for requested devices.
flags:
    --device-ids=!: Devices whose position you want to retrieve.
    --tracker-name=!: The tracker resource retrieving the device position.
documentation:
    command: Lists the latest device positions for requested devices.
    flag:
        device-ids: |-
            Devices whose position you want to retrieve.

            - For example, for two devices: `device-ids=DeviceId1&device-ids=DeviceId2`
        tracker-name: The tracker resource retrieving the device position.
