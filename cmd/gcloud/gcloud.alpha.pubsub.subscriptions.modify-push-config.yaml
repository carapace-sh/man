name: modify-push-config
description: '*(ALPHA)*  Modifies the push configuration of a Cloud Pub/Sub subscription.'
flags:
    --no-push-no-wrapper!&: When set, the message data is delivered directly as the HTTP body.
    --no-push-no-wrapper-write-metadata&: When true, writes the Pub/Sub message metadata to `x-goog-pubsub-<KEY>:<VAL>` headers of the HTTP request.
    --push-auth-service-account=: Service account email used as the identity for the generated Open ID Connect token for authenticated push.
    --push-auth-token-audience=: Audience used in the generated Open ID Connect token for authenticated push.
    --push-endpoint=!: A URL to use as the endpoint for this subscription.
    --push-no-wrapper!: When set, the message data is delivered directly as the HTTP body.
    --push-no-wrapper-write-metadata: When true, writes the Pub/Sub message metadata to `x-goog-pubsub-<KEY>:<VAL>` headers of the HTTP request.
documentation:
    command: '*(ALPHA)*  Modifies the push configuration of a Cloud Pub/Sub subscription.'
    flag:
        no-push-no-wrapper: When set, the message data is delivered directly as the HTTP body. Use --no-push-no-wrapper to disable this flag.
        no-push-no-wrapper-write-metadata: When true, writes the Pub/Sub message metadata to `x-goog-pubsub-<KEY>:<VAL>` headers of the HTTP request. Writes the Pub/Sub message attributes to `<KEY>:<VAL>` headers of the HTTP request. Use --no-push-no-wrapper-write-metadata to disable this flag.
        push-auth-service-account: Service account email used as the identity for the generated Open ID Connect token for authenticated push.
        push-auth-token-audience: Audience used in the generated Open ID Connect token for authenticated push. If not specified, it will be set to the push-endpoint.
        push-endpoint: A URL to use as the endpoint for this subscription. This will also automatically set the subscription type to PUSH.
        push-no-wrapper: When set, the message data is delivered directly as the HTTP body. Use --no-push-no-wrapper to disable this flag.
        push-no-wrapper-write-metadata: When true, writes the Pub/Sub message metadata to `x-goog-pubsub-<KEY>:<VAL>` headers of the HTTP request. Writes the Pub/Sub message attributes to `<KEY>:<VAL>` headers of the HTTP request. Use --no-push-no-wrapper-write-metadata to disable this flag.
