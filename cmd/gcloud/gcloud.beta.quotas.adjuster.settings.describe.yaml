name: describe
description: '*(BETA)*  Gets details of the QuotaAdjusterSettings for a resource container.'
flags:
    --folder=: Folder of the container id.
    --organization=: Organization of the container id.
documentation:
    command: |-
        *(BETA)*  This command gets the QuotaAdjusterSettings for a resource container.

        ## EXAMPLES

        To get the QuotaAdjusterSettings for 'projects/12321', run:

          $ gcloud beta quotas adjuster settings describe --project=12321

        To get the QuotaAdjusterSettings for 'folders/123', run:

          $ gcloud beta quotas adjuster settings describe --folder=123
    flag:
        folder: Folder of the container id.
        organization: Organization of the container id.
