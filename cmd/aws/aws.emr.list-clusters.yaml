name: list-clusters
description: Provides the status of all clusters visible to this Amazon Web Services account.
flags:
    --cluster-states=: The cluster state filters to apply when listing clusters.
    --created-after=: The creation date and time beginning value filter for listing clusters.
    --created-before=: The creation date and time end value filter for listing clusters.
    --marker=: The pagination token that indicates the next set of results to retrieve.
documentation:
    command: Provides the status of all clusters visible to this Amazon Web Services account. Allows you to filter the list of clusters based on certain criteria; for example, filtering by cluster creation date and time or by status. This call returns a maximum of 50 clusters in unsorted order per call, but returns a marker to track the paging of the cluster list across multiple ListClusters calls.
    flag:
        cluster-states: The cluster state filters to apply when listing clusters. Clusters that change state while this action runs may be not be returned as expected in the list of clusters.
        created-after: The creation date and time beginning value filter for listing clusters.
        created-before: The creation date and time end value filter for listing clusters.
        marker: The pagination token that indicates the next set of results to retrieve.
