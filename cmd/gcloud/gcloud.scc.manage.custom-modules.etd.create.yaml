name: create
description: Create an Event Threat Detection custom module.
flags:
    --custom-config-file=!: Path to a JSON custom configuration file of the ETD custom module.
    --display-name=!: The display name of the custom module.
    --enablement-state=!: Sets the enablement state of the Event Threat Detection custom module.
    --folder=: Folder associated with the custom module.
    --module-type=!: Type of the custom module.
    --no-validate-only&: If present, the request is validated (including IAM checks) but no action is taken.
    --organization=: Organization associated with the custom module.
    --parent=: Parent associated with the custom module.
    --validate-only: If present, the request is validated (including IAM checks) but no action is taken.
documentation:
    command: |-
        ## EXAMPLES

        To create an Event Threat Detection custom module for organization `123`, run:

          $ gcloud scc manage custom-modules etd create --organization=organizations/123
              --display-name="test_display_name"
              --module-type="CONFIGURABLE_BAD_IP"
              --enablement-state="ENABLED"
              --custom-config-file=config.json
    flag:
        custom-config-file: Path to a JSON custom configuration file of the ETD custom module. Use a full or relative path to a local file containing the value of custom_config_file.
        display-name: The display name of the custom module.
        enablement-state: Sets the enablement state of the Event Threat Detection custom module. Valid options are ENABLED, DISABLED, OR INHERITED.
        folder: Folder associated with the custom module.
        module-type: Type of the custom module. For a list of valid module types please visit https://cloud.google.com/security-command-center/docs/custom-modules-etd-overview#custom_modules_and_templates.
        no-validate-only: If present, the request is validated (including IAM checks) but no action is taken.
        organization: Organization associated with the custom module.
        parent: |-
            Parent associated with the custom module. Can be one of
                          organizations/<id>, projects/<id or name>, folders/<id>
        validate-only: If present, the request is validated (including IAM checks) but no action is taken.
