name: delete-portfolio-share
description: Stops sharing the specified portfolio with the specified account or organization node.
flags:
    --accept-language=: The language code.
    --account-id=: The Amazon Web Services account ID.
    --organization-node=: The organization node to whom you are going to stop sharing.
    --portfolio-id=!: The portfolio identifier.
documentation:
    command: |-
        Stops sharing the specified portfolio with the specified account or organization node. Shares to an organization node can only be deleted by the management account of an organization or by a delegated administrator.

        Note that if a delegated admin is de-registered, portfolio shares created from that account are removed.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        account-id: The Amazon Web Services account ID.
        organization-node: The organization node to whom you are going to stop sharing.
        portfolio-id: The portfolio identifier.
