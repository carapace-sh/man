name: submit-container-state-change
description: This action is only used by the Amazon ECS agent, and it is not intended for use outside of the agent.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster=: The short name or full ARN of the cluster that hosts the container.
    --container-name=: The name of the container.
    --exit-code=: The exit code that's returned for the state change request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --network-bindings=:
        description: The network bindings of the container.
        nargs: -1
    --reason=: The reason for the state change request.
    --runtime-id=: The ID of the Docker container.
    --status=: The status of the state change request.
    --task=: The task ID or full Amazon Resource Name (ARN) of the task that hosts the container.
documentation:
    command: |-
        This action is only used by the Amazon ECS agent, and it is not intended for use outside of the agent.

        Sent to acknowledge that a container changed states.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster: The short name or full ARN of the cluster that hosts the container.
        container-name: The name of the container.
        exit-code: The exit code that's returned for the state change request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        network-bindings: The network bindings of the container.
        reason: The reason for the state change request.
        runtime-id: The ID of the Docker container.
        status: The status of the state change request.
        task: The task ID or full Amazon Resource Name (ARN) of the task that hosts the container.
