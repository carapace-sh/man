name: create-location-fsx-open-zfs
description: Creates a transfer *location* for an Amazon FSx for OpenZFS file system.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --fsx-filesystem-arn=!: The Amazon Resource Name (ARN) of the FSx for OpenZFS file system.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --protocol=!: The type of protocol that DataSync uses to access your file system.
    --security-group-arns=!:
        description: The ARNs of the security groups that are used to configure the FSx for OpenZFS file system.
        nargs: -1
    --subdirectory=: A subdirectory in the location's path that must begin with `/fsx`.
    --tags=:
        description: The key-value pair that represents a tag that you want to add to the resource.
        nargs: -1
documentation:
    command: |-
        Creates a transfer *location* for an Amazon FSx for OpenZFS file system. DataSync can use this location as a source or destination for transferring data.

        Before you begin, make sure that you understand how DataSync [accesses FSx for OpenZFS file systems](https://docs.aws.amazon.com/datasync/latest/userguide/create-openzfs-location.html#create-openzfs-access).

        Request parameters related to `SMB` aren't supported with the `CreateLocationFsxOpenZfs` operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        fsx-filesystem-arn: The Amazon Resource Name (ARN) of the FSx for OpenZFS file system.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        protocol: The type of protocol that DataSync uses to access your file system.
        security-group-arns: The ARNs of the security groups that are used to configure the FSx for OpenZFS file system.
        subdirectory: A subdirectory in the location's path that must begin with `/fsx`. DataSync uses this subdirectory to read or write data (depending on whether the file system is a source or destination location).
        tags: The key-value pair that represents a tag that you want to add to the resource. The value can be an empty string. This value helps you manage, filter, and search for your resources. We recommend that you create a name tag for your location.
