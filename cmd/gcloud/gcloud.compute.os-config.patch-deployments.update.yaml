name: update
description: Update patch deployment in a project.
flags:
    --file=!: The JSON or YAML file with the patch deployment to update.
documentation:
    command: |
        Updates a patch deployment in a project. To update the patch deployment,
        you must specify a configuration file.
    flag:
        file: |-
            The JSON or YAML file with the patch deployment to update. For
            information about the patch deployment format, see https://cloud.google.com/compute/docs/osconfig/rest/v1/projects.patchDeployments.
