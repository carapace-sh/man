name: delete-pipeline
description: Deletes a pipeline if there are no running instances of the pipeline.
flags:
    --client-request-token=!: A unique, case-sensitive identifier that you provide to ensure the idempotency of the operation.
    --pipeline-name=!: The name of the pipeline to delete.
documentation:
    command: Deletes a pipeline if there are no running instances of the pipeline. To delete a pipeline, you must stop all running instances of the pipeline using the `StopPipelineExecution` API. When you delete a pipeline, all instances of the pipeline are deleted.
    flag:
        client-request-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the operation. An idempotent operation completes no more than one time.
        pipeline-name: The name of the pipeline to delete.
