name: group-resources
description: Adds the specified resources to the specified group.
flags:
    --group=!: The name or the Amazon resource name (ARN) of the resource group to add resources to.
    --resource-arns=!: The list of Amazon resource names (ARNs) of the resources to be added to the group.
documentation:
    command: |-
        Adds the specified resources to the specified group.

        You can only use this operation with the following groups:

        - `AWS::EC2::HostManagement`
        - `AWS::EC2::CapacityReservationPool`
        - `AWS::ResourceGroups::ApplicationGroup`

        Other resource group types and resource types are not currently supported by this operation.

        **Minimum permissions**

        To run this command, you must have the following permissions:

        - `resource-groups:GroupResources`
    flag:
        group: The name or the Amazon resource name (ARN) of the resource group to add resources to.
        resource-arns: The list of Amazon resource names (ARNs) of the resources to be added to the group.
