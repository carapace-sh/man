name: delete-package-group
description: Deletes a package group.
flags:
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The domain that contains the package group to be deleted.
    --package-group=!: The pattern of the package group to be deleted.
documentation:
    command: Deletes a package group. Deleting a package group does not delete packages or package versions associated with the package group. When a package group is deleted, the direct child package groups will become children of the package group's direct parent package group. Therefore, if any of the child groups are inheriting any settings from the parent, those settings could change.
    flag:
        domain: The domain that contains the package group to be deleted.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        package-group: The pattern of the package group to be deleted.
