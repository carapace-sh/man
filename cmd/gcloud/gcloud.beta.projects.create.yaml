name: create
description: '*(BETA)*  Create a new project.'
flags:
    --enable-cloud-apis: Enable `cloudapis.googleapis.com` during creation.
    --folder=: ID for the folder to use as a parent
    --labels=: List of label KEY=VALUE pairs to add.
    --name=: Name for the project you want to create.
    --no-enable-cloud-apis&: Enable `cloudapis.googleapis.com` during creation.
    --no-set-as-default&: Set newly created project as [core/project] property.
    --organization=: ID for the organization to use as a parent
    --set-as-default: Set newly created project as [core/project] property.
    --tags=: List of tags KEY=VALUE pairs to bind.
documentation:
    command: |-
        *(BETA)*  Creates a new project with the given project ID. By default, projects are not
        created under a parent resource. To do so, use either the `--organization` or
        `--folder` flag.

        ## EXAMPLES

        The following command creates a project with ID `example-foo-bar-1`, name
        `Happy project` and label `type=happy`:

          $ gcloud beta projects create example-foo-bar-1 --name="Happy project" --labels=type=happy

        By default, projects are not created under a parent resource. The following
        command creates a project with ID `example-2` with parent `folders/12345`:

          $ gcloud beta projects create example-2 --folder=12345

        The following command creates a project with ID `example-3` with parent
        `organizations/2048`:

          $ gcloud beta projects create example-3 --organization=2048

        ## SEE ALSO

        {see_also}
    flag:
        enable-cloud-apis: Enable `cloudapis.googleapis.com` during creation. Enabled by default, use *--no-enable-cloud-apis* to disable.
        folder: ID for the folder to use as a parent
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        name: Name for the project you want to create. If not specified, will use project id as name.
        no-enable-cloud-apis: Enable `cloudapis.googleapis.com` during creation.
        no-set-as-default: Set newly created project as [core/project] property.
        organization: ID for the organization to use as a parent
        set-as-default: Set newly created project as [core/project] property.
        tags: |-
            List of tags KEY=VALUE pairs to bind.
            Each item must be expressed as
            `<tag-key-namespaced-name>=<tag-value-short-name>`.
            +
            Example: `123/environment=production,123/costCenter=marketing`
            +
            Note: Currently this field is in Preview.
