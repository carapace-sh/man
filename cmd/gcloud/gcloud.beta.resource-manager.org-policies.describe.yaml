name: describe
description: '*(BETA)*  Describe an Organization Policy.'
flags:
    --effective: Show the effective policy.
    --folder=: Folder ID.
    --no-effective&: Show the effective policy.
    --organization=: Organization ID.
documentation:
    command: |-
        *(BETA)*  Describes an Organization Policy associated with the specified resource.

        ## EXAMPLES

        The following command retrieves an Organization Policy
        for constraint `serviceuser.services` on project `foo-project`:

          $ gcloud beta resource-manager org-policies describe serviceuser.services --project=foo-project

        The following command retrieves the effective Organization Policy
        for constraint `serviceuser.services` on project `foo-project`:

          $ gcloud beta resource-manager org-policies describe serviceuser.services --project=foo-project --effective
    flag:
        effective: Show the effective policy.
        folder: Folder ID.
        no-effective: Show the effective policy.
        organization: Organization ID.
