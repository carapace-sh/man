name: stop-code-interpreter-session
description: Terminates an active code interpreter session in Amazon Bedrock.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --code-interpreter-identifier=!: The unique identifier of the code interpreter associated with the session.
    --session-id=!: The unique identifier of the code interpreter session to stop.
    --trace-id=: The trace identifier for request tracking.
    --trace-parent=: The parent trace information for distributed tracing.
documentation:
    command: |-
        Terminates an active code interpreter session in Amazon Bedrock. This operation stops the session, releases associated resources, and makes the session unavailable for further use.

        To stop a code interpreter session, you must specify both the code interpreter identifier and the session ID. Once stopped, a session cannot be restarted; you must create a new session using `StartCodeInterpreterSession`.

        The following operations are related to `StopCodeInterpreterSession`:

        - [StartCodeInterpreterSession](https://docs.aws.amazon.com/API_StartCodeInterpreterSession.html)
        - [GetCodeInterpreterSession](https://docs.aws.amazon.com/API_GetCodeInterpreterSession.html)
    flag:
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error.
        code-interpreter-identifier: The unique identifier of the code interpreter associated with the session.
        session-id: The unique identifier of the code interpreter session to stop.
        trace-id: The trace identifier for request tracking.
        trace-parent: The parent trace information for distributed tracing.
