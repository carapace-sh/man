name: get-recovery-point-index-details
description: This operation returns the metadata and details specific to the backup index associated with the specified recovery point.
flags:
    --backup-vault-name=!: The name of a logical container where backups are stored.
    --recovery-point-arn=!: An ARN that uniquely identifies a recovery point; for example, `arn:aws:backup:us-east-1:123456789012:recovery-point:1EB3B5E7-9EB0-435A-A80B-108B488B0D45`.
documentation:
    command: This operation returns the metadata and details specific to the backup index associated with the specified recovery point.
    flag:
        backup-vault-name: |-
            The name of a logical container where backups are stored. Backup vaults are identified by names that are unique to the account used to create them and the Region where they are created.

            Accepted characters include lowercase letters, numbers, and hyphens.
        recovery-point-arn: An ARN that uniquely identifies a recovery point; for example, `arn:aws:backup:us-east-1:123456789012:recovery-point:1EB3B5E7-9EB0-435A-A80B-108B488B0D45`.
