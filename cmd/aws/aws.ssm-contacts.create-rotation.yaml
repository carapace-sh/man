name: create-rotation
description: Creates a rotation in an on-call schedule.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --contact-ids=!: The Amazon Resource Names (ARNs) of the contacts to add to the rotation.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --idempotency-token=: A token that ensures that the operation is called only once with the specified details.
    --name=!: The name of the rotation.
    --recurrence=!: Information about the rule that specifies when a shift's team members rotate.
    --start-time=: The date and time that the rotation goes into effect.
    --tags=: Optional metadata to assign to the rotation.
    --time-zone-id=!: The time zone to base the rotation’s activity on in Internet Assigned Numbers Authority (IANA) format.
documentation:
    command: Creates a rotation in an on-call schedule.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        contact-ids: |-
            The Amazon Resource Names (ARNs) of the contacts to add to the rotation.

            Only the `PERSONAL` contact type is supported. The contact types `ESCALATION` and `ONCALL_SCHEDULE` are not supported for this operation.

            The order that you list the contacts in is their shift order in the rotation schedule. To change the order of the contact's shifts, use the [UpdateRotation]() operation.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        idempotency-token: A token that ensures that the operation is called only once with the specified details.
        name: The name of the rotation.
        recurrence: Information about the rule that specifies when a shift's team members rotate.
        start-time: The date and time that the rotation goes into effect.
        tags: Optional metadata to assign to the rotation. Tags enable you to categorize a resource in different ways, such as by purpose, owner, or environment. For more information, see [Tagging Incident Manager resources](https://docs.aws.amazon.com/incident-manager/latest/userguide/tagging.html) in the *Incident Manager User Guide*.
        time-zone-id: |-
            The time zone to base the rotation’s activity on in Internet Assigned Numbers Authority (IANA) format. For example: "America/Los\_Angeles", "UTC", or "Asia/Seoul". For more information, see the [Time Zone Database](https://www.iana.org/time-zones) on the IANA website.

            Designators for time zones that don’t support Daylight Savings Time rules, such as Pacific Standard Time (PST), are not supported.
