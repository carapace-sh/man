name: enable-enhanced-monitoring
description: Enables enhanced Kinesis data stream monitoring for shard-level metrics.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --shard-level-metrics=!: List of shard-level metrics to enable.
    --stream-arn=: The ARN of the stream.
    --stream-name=: The name of the stream for which to enable enhanced monitoring.
documentation:
    command: |-
        Enables enhanced Kinesis data stream monitoring for shard-level metrics.

        When invoking this API, you must use either the `StreamARN` or the `StreamName` parameter, or both. It is recommended that you use the `StreamARN` input parameter when you invoke this API.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        shard-level-metrics: |-
            List of shard-level metrics to enable.

            The following are the valid shard-level metrics. The value "`ALL`" enables every metric.

            - `IncomingBytes`
            - `IncomingRecords`
            - `OutgoingBytes`
            - `OutgoingRecords`
            - `WriteProvisionedThroughputExceeded`
            - `ReadProvisionedThroughputExceeded`
            - `IteratorAgeMilliseconds`
            - `ALL`

            For more information, see [Monitoring the Amazon Kinesis Data Streams Service with Amazon CloudWatch](https://docs.aws.amazon.com/kinesis/latest/dev/monitoring-with-cloudwatch.html) in the *Amazon Kinesis Data Streams Developer Guide*.
        stream-arn: The ARN of the stream.
        stream-name: The name of the stream for which to enable enhanced monitoring.
