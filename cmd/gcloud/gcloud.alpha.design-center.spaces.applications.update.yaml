    --clear-attributes: Set application.attributes back to default value.
    --clear-attributes-business-owners: Clear attributes_business_owners value and set to empty list.
    --clear-attributes-developer-owners: Clear attributes_developer_owners value and set to empty list.
    --clear-attributes-operator-owners: Clear attributes_operator_owners value and set to empty list.
    --clear-component-parameters: Clear component_parameters value and set to empty list.
    --clear-connection-configs: Clear connection_configs value and set to empty list.
    --clear-deployment-target: Set application.deploymentTarget back to default value.
    --clear-scope: Set application.scope back to default value.
