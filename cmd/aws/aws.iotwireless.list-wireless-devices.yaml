    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destination-name=: A filter to list only the wireless devices that use as uplink destination.
    --device-profile-id=: A filter to list only the wireless devices that use this device profile.
    --fuota-task-id=: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
