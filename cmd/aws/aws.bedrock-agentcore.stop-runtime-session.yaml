name: stop-runtime-session
description: Stops a session that is running in an running AgentCore Runtime agent.
flags:
    --agent-runtime-arn=!: The ARN of the agent that contains the session that you want to stop.
    --client-token=: Idempotent token used to identify the request.
    --qualifier=: Optional qualifier to specify an agent alias, such as `prod`code&gt; or `dev`.
    --runtime-session-id=!: The ID of the session that you want to stop.
documentation:
    command: Stops a session that is running in an running AgentCore Runtime agent.
    flag:
        agent-runtime-arn: The ARN of the agent that contains the session that you want to stop.
        client-token: Idempotent token used to identify the request. If you use the same token with multiple requests, the same response is returned. Use ClientToken to prevent the same request from being processed more than once.
        qualifier: Optional qualifier to specify an agent alias, such as `prod`code&gt; or `dev`. If you don't provide a value, the DEFAULT alias is used.
        runtime-session-id: The ID of the session that you want to stop.
