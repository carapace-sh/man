name: create-view-version
description: Publishes a new version of the view identifier.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --version-description=: The description for the version being published.
    --view-content-sha256=: Indicates the checksum value of the latest published view content.
    --view-id=!: The identifier of the view.
documentation:
    command: |-
        Publishes a new version of the view identifier.

        Versions are immutable and monotonically increasing.

        It returns the highest version if there is no change in content compared to that version. An error is displayed if the supplied ViewContentSha256 is different from the ViewContentSha256 of the `$LATEST` alias.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can find the instanceId in the ARN of the instance.
        version-description: The description for the version being published.
        view-content-sha256: Indicates the checksum value of the latest published view content.
        view-id: The identifier of the view. Both `ViewArn` and `ViewId` can be used.
