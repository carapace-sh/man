name: get-restore-testing-plan
description: Returns `RestoreTestingPlan` details for the specified `RestoreTestingPlanName`.
flags:
    --restore-testing-plan-name=!: Required unique name of the restore testing plan.
documentation:
    command: Returns `RestoreTestingPlan` details for the specified `RestoreTestingPlanName`. The details are the body of a restore testing plan in JSON format, in addition to plan metadata.
    flag:
        restore-testing-plan-name: Required unique name of the restore testing plan.
