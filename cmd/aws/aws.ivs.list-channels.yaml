name: list-channels
description: Gets summary information about all channels in your account, in the Amazon Web Services region where the API request is processed.
flags:
    --filter-by-name=: Filters the channel list to match the specified name.
    --filter-by-playback-restriction-policy-arn=: Filters the channel list to match the specified policy.
    --filter-by-recording-configuration-arn=: Filters the channel list to match the specified recording-configuration ARN.
    --max-results=: Maximum number of channels to return.
    --next-token=: The first channel to retrieve.
documentation:
    command: Gets summary information about all channels in your account, in the Amazon Web Services region where the API request is processed. This list can be filtered to match a specified name or recording-configuration ARN. Filters are mutually exclusive and cannot be used together. If you try to use both filters, you will get an error (409 ConflictException).
    flag:
        filter-by-name: Filters the channel list to match the specified name.
        filter-by-playback-restriction-policy-arn: Filters the channel list to match the specified policy.
        filter-by-recording-configuration-arn: Filters the channel list to match the specified recording-configuration ARN.
        max-results: 'Maximum number of channels to return. Default: 100.'
        next-token: The first channel to retrieve. This is used for pagination; see the `nextToken` response field.
