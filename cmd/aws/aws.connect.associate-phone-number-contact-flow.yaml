name: associate-phone-number-contact-flow
description: Associates a flow with a phone number claimed to your Amazon Connect instance.
flags:
    --contact-flow-id=!: The identifier of the flow.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --phone-number-id=!: A unique identifier for the phone number.
documentation:
    command: |-
        Associates a flow with a phone number claimed to your Amazon Connect instance.

        If the number is claimed to a traffic distribution group, and you are calling this API using an instance in the Amazon Web Services Region where the traffic distribution group was created, you can use either a full phone number ARN or UUID value for the `PhoneNumberId` URI request parameter. However, if the number is claimed to a traffic distribution group and you are calling this API using an instance in the alternate Amazon Web Services Region associated with the traffic distribution group, you must provide a full phone number ARN. If a UUID is provided in this scenario, you will receive a `ResourceNotFoundException`.
    flag:
        contact-flow-id: The identifier of the flow.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        phone-number-id: A unique identifier for the phone number.
