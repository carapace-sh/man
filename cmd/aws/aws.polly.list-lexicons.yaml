name: list-lexicons
description: Returns a list of pronunciation lexicons stored in an Amazon Web Services Region.
flags:
    --next-token=: An opaque pagination token returned from previous `ListLexicons` operation.
documentation:
    command: Returns a list of pronunciation lexicons stored in an Amazon Web Services Region. For more information, see [Managing Lexicons](https://docs.aws.amazon.com/polly/latest/dg/managing-lexicons.html).
    flag:
        next-token: An opaque pagination token returned from previous `ListLexicons` operation. If present, indicates where to continue the list of lexicons.
