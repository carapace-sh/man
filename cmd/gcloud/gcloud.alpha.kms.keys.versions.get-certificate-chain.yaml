name: get-certificate-chain
description: '*(ALPHA)*  Get a certificate chain for a given version.'
flags:
    --certificate-chain-type=: Certificate chain to retrieve.
    --key=: The containing key.
    --keyring=: Key ring of the key.
    --location=: Location of the keyring.
    --output-file=: Path to the output file to store PEM.
completion:
    flag:
        certificate-chain-type:
            - all
            - cavium
            - google-card
            - google-partition
documentation:
    command: |-
        *(ALPHA)*  Returns the PEM-format certificate chain for the specified key version.
        The optional flag `output-file` indicates the path to store the PEM. If not
        specified, the PEM will be printed to stdout.
    flag:
        certificate-chain-type: 'Certificate chain to retrieve. _CERTIFICATE_CHAIN_TYPE_ must be one of: *all*, *cavium*, *google-card*, *google-partition*.'
        key: The containing key.
        keyring: Key ring of the key.
        location: Location of the keyring.
        output-file: Path to the output file to store PEM.
