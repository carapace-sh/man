name: update-public-key
description: Update public key information.
flags:
    --id=!: The identifier of the public key that you are updating.
    --if-match=: The value of the `ETag` header that you received when retrieving the public key to update.
    --public-key-config=!: A public key configuration.
documentation:
    command: Update public key information. Note that the only value you can change is the comment.
    flag:
        id: The identifier of the public key that you are updating.
        if-match: 'The value of the `ETag` header that you received when retrieving the public key to update. For example: `E2QWRUHAPOMQZL`.'
        public-key-config: A public key configuration.
