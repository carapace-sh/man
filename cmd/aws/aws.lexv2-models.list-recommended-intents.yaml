name: list-recommended-intents
description: Gets a list of recommended intents provided by the bot recommendation that you can use in your bot.
flags:
    --bot-id=!: The unique identifier of the bot associated with the recommended intents.
    --bot-recommendation-id=!: The identifier of the bot recommendation that contains the recommended intents.
    --bot-version=!: The version of the bot that contains the recommended intents.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --locale-id=!: The identifier of the language and locale of the recommended intents.
    --max-results=: The maximum number of bot recommendations to return in each page of results.
    --next-token=: If the response from the ListRecommendedIntents operation contains more results than specified in the maxResults parameter, a token is returned in the response.
documentation:
    command: Gets a list of recommended intents provided by the bot recommendation that you can use in your bot. Intents in the response are ordered by relevance.
    flag:
        bot-id: The unique identifier of the bot associated with the recommended intents.
        bot-recommendation-id: The identifier of the bot recommendation that contains the recommended intents.
        bot-version: The version of the bot that contains the recommended intents.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        locale-id: The identifier of the language and locale of the recommended intents.
        max-results: The maximum number of bot recommendations to return in each page of results. If there are fewer results than the max page size, only the actual number of results are returned.
        next-token: If the response from the ListRecommendedIntents operation contains more results than specified in the maxResults parameter, a token is returned in the response. Use that token in the nextToken parameter to return the next page of results.
