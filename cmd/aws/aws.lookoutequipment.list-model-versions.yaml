name: list-model-versions
description: Generates a list of all model versions for a given model, including the model version, model version ARN, and status.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --created-at-end-time=: Filter results to return all the model versions created before this time.
    --created-at-start-time=: Filter results to return all the model versions created after this time.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-model-version=: Specifies the highest version of the model to return in the list.
    --max-results=: Specifies the maximum number of machine learning model versions to list.
    --min-model-version=: Specifies the lowest version of the model to return in the list.
    --model-name=!: Then name of the machine learning model for which the model versions are to be listed.
    --next-token=: If the total number of results exceeds the limit that the response can display, the response returns an opaque pagination token indicating where to continue the listing of machine learning model versions.
    --source-type=: Filter the results based on the way the model version was generated.
    --status=: Filter the results based on the current status of the model version.
completion:
    flag:
        source-type:
            - TRAINING
            - RETRAINING
            - IMPORT
        status:
            - IN_PROGRESS
            - SUCCESS
            - FAILED
            - IMPORT_IN_PROGRESS
            - CANCELED
documentation:
    command: Generates a list of all model versions for a given model, including the model version, model version ARN, and status. To list a subset of versions, use the `MaxModelVersion` and `MinModelVersion` fields.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        created-at-end-time: Filter results to return all the model versions created before this time.
        created-at-start-time: Filter results to return all the model versions created after this time.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-model-version: Specifies the highest version of the model to return in the list.
        max-results: Specifies the maximum number of machine learning model versions to list.
        min-model-version: Specifies the lowest version of the model to return in the list.
        model-name: Then name of the machine learning model for which the model versions are to be listed.
        next-token: If the total number of results exceeds the limit that the response can display, the response returns an opaque pagination token indicating where to continue the listing of machine learning model versions. Use this token in the `NextToken` field in the request to list the next page of results.
        source-type: Filter the results based on the way the model version was generated.
        status: Filter the results based on the current status of the model version.
