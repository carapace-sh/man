name: list-managed-schema-arns
description: Lists the major version families of each managed schema.
flags:
    --max-results=: The maximum number of results to retrieve.
    --next-token=: The pagination token.
    --schema-arn=: The response for ListManagedSchemaArns.
documentation:
    command: Lists the major version families of each managed schema. If a major version ARN is provided as SchemaArn, the minor version revisions in that family are listed instead.
    flag:
        max-results: The maximum number of results to retrieve.
        next-token: The pagination token.
        schema-arn: The response for ListManagedSchemaArns. When this parameter is used, all minor version ARNs for a major version are listed.
