name: get-import-job
description: Retrieves information about the status and settings of a specific import job for an application.
flags:
    --application-id=!: The unique identifier for the application.
    --job-id=!: The unique identifier for the job.
documentation:
    command: Retrieves information about the status and settings of a specific import job for an application.
    flag:
        application-id: The unique identifier for the application. This identifier is displayed as the **Project ID** on the Amazon Pinpoint console.
        job-id: The unique identifier for the job.
