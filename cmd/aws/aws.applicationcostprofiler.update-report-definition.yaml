name: update-report-definition
description: Updates existing report in AWS Application Cost Profiler.
flags:
    --destination-s3-location=!: Required.
    --format=!: Required.
    --report-description=!: Required.
    --report-frequency=!: Required.
    --report-id=!: Required.
completion:
    flag:
        format:
            - CSV
            - PARQUET
        report-frequency:
            - MONTHLY
            - DAILY
            - ALL
documentation:
    command: Updates existing report in AWS Application Cost Profiler.
    flag:
        destination-s3-location: Required. Amazon Simple Storage Service (Amazon S3) location where Application Cost Profiler uploads the report.
        format: Required. The format to use for the generated report.
        report-description: Required. Description of the report.
        report-frequency: Required. The cadence to generate the report.
        report-id: Required. ID of the report to update.
