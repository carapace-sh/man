name: list-gcloud
description: List the gcloud CLI command tree with flag, positional and help details.
hidden: true
flags:
    --branch=: The branch of the CLI subtree to generate as a dotted command path.
    --completions: List the static completion CLI tree.
    --no-completions&: List the static completion CLI tree.
documentation:
    command: List the gcloud CLI command tree with flag, positional and help details.
    flag:
        branch: The branch of the CLI subtree to generate as a dotted command path. Mainly used to generate test data. For example, for the `gcloud compute instances` branch use "compute.instances".
        completions: List the static completion CLI tree. This is a stripped down variant of the CLI tree that only contains the subcommand and flag name dictionaries. The tree is written as a Python source file (~1MiB) that loads fast (~30ms) as a .pyc file.
        no-completions: List the static completion CLI tree. This is a stripped down variant of the CLI tree that only contains the subcommand and flag name dictionaries. The tree is written as a Python source file (~1MiB) that loads fast (~30ms) as a .pyc file.
