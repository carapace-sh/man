name: get-environment
description: Retrieves information about an environment.
flags:
    --application-id=!: The ID of the application that includes the environment you want to get.
    --environment-id=!: The ID of the environment that you want to get.
documentation:
    command: Retrieves information about an environment. An environment is a deployment group of AppConfig applications, such as applications in a `Production` environment or in an `EU_Region` environment. Each configuration deployment targets an environment. You can enable one or more Amazon CloudWatch alarms for an environment. If an alarm is triggered during a deployment, AppConfig roles back the configuration.
    flag:
        application-id: The ID of the application that includes the environment you want to get.
        environment-id: The ID of the environment that you want to get.
