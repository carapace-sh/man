name: list-associated-assets
description: Retrieves a paginated list of associated assets.
flags:
    --asset-id=!: The ID of the asset to query.
    --hierarchy-id=: (Optional) If you don't provide a `hierarchyId`, all the immediate assets in the `traversalDirection` will be returned.
    --max-results=: The maximum number of results to return for each paginated request.
    --next-token=: The token to be used for the next set of paginated results.
    --traversal-direction=: The direction to list associated assets.
completion:
    flag:
        traversal-direction:
            - PARENT
            - CHILD
documentation:
    command: |-
        Retrieves a paginated list of associated assets.

        You can use this operation to do the following:

        - `CHILD` - List all child assets associated to the asset.
        - `PARENT` - List the asset's parent asset.
    flag:
        asset-id: The ID of the asset to query. This can be either the actual ID in UUID format, or else `externalId:` followed by the external ID, if it has one. For more information, see [Referencing objects with external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-id-references) in the *IoT SiteWise User Guide*.
        hierarchy-id: |-
            (Optional) If you don't provide a `hierarchyId`, all the immediate assets in the `traversalDirection` will be returned.

            The ID of the hierarchy by which child assets are associated to the asset. (This can be either the actual ID in UUID format, or else `externalId:` followed by the external ID, if it has one. For more information, see [Referencing objects with external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-id-references) in the *IoT SiteWise User Guide*.)

            For more information, see [Asset hierarchies](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/asset-hierarchies.html) in the *IoT SiteWise User Guide*.
        max-results: |-
            The maximum number of results to return for each paginated request.

            Default: 50
        next-token: The token to be used for the next set of paginated results.
        traversal-direction: |-
            The direction to list associated assets. Choose one of the following options:

            - `CHILD` – The list includes all child assets associated to the asset.
            - `PARENT` – The list includes the asset's parent asset.

            Default: `CHILD`
