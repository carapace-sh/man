name: stop-replication
description: For a given DMS Serverless replication configuration, DMS stops any and all ongoing DMS Serverless replications.
flags:
    --replication-config-arn=!: The Amazon Resource Name of the replication to stop.
documentation:
    command: For a given DMS Serverless replication configuration, DMS stops any and all ongoing DMS Serverless replications. This command doesn't deprovision the stopped replications.
    flag:
        replication-config-arn: The Amazon Resource Name of the replication to stop.
