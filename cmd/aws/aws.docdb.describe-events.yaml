name: describe-events
description: Returns events related to instances, security groups, snapshots, and DB parameter groups for the past 14 days.
flags:
    --duration=: The number of minutes to retrieve events for.
    --end-time=: The end of the time interval for which to retrieve events, specified in ISO 8601 format.
    --event-categories=: A list of event categories that trigger notifications for an event notification subscription.
    --filters=: This parameter is not currently supported.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
    --source-identifier=: The identifier of the event source for which events are returned.
    --source-type=: The event source to retrieve events for.
    --start-time=: The beginning of the time interval to retrieve events for, specified in ISO 8601 format.
completion:
    flag:
        source-type:
            - db-instance
            - db-parameter-group
            - db-security-group
            - db-snapshot
            - db-cluster
            - db-cluster-snapshot
documentation:
    command: Returns events related to instances, security groups, snapshots, and DB parameter groups for the past 14 days. You can obtain events specific to a particular DB instance, security group, snapshot, or parameter group by providing the name as a parameter. By default, the events of the past hour are returned.
    flag:
        duration: |-
            The number of minutes to retrieve events for.

            Default: 60
        end-time: |-
            The end of the time interval for which to retrieve events, specified in ISO 8601 format.

            Example: 2009-07-08T18:00Z
        event-categories: A list of event categories that trigger notifications for an event notification subscription.
        filters: This parameter is not currently supported.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token (marker) is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        source-identifier: |-
            The identifier of the event source for which events are returned. If not specified, then all sources are included in the response.

            Constraints:

            - If `SourceIdentifier` is provided, `SourceType` must also be provided.
            - If the source type is `DBInstance`, a `DBInstanceIdentifier` must be provided.
            - If the source type is `DBSecurityGroup`, a `DBSecurityGroupName` must be provided.
            - If the source type is `DBParameterGroup`, a `DBParameterGroupName` must be provided.
            - If the source type is `DBSnapshot`, a `DBSnapshotIdentifier` must be provided.
            - Cannot end with a hyphen or contain two consecutive hyphens.
        source-type: The event source to retrieve events for. If no value is specified, all events are returned.
        start-time: |-
            The beginning of the time interval to retrieve events for, specified in ISO 8601 format.

            Example: 2009-07-08T18:00Z
