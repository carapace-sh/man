name: get-monitor
description: Returns details about a specific monitor.
flags:
    --monitor-name=!: The name of the monitor that details are returned for.
documentation:
    command: |-
        Returns details about a specific monitor.

        This action requires the `monitorName` parameter. Run `ListMonitors` to get a list of monitor names.
    flag:
        monitor-name: The name of the monitor that details are returned for.
