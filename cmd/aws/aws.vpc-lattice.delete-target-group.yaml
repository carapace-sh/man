name: delete-target-group
description: Deletes a target group.
flags:
    --target-group-identifier=!: The ID or ARN of the target group.
documentation:
    command: Deletes a target group. You can't delete a target group if it is used in a listener rule or if the target group creation is in progress.
    flag:
        target-group-identifier: The ID or ARN of the target group.
