name: create-audit-suppression
description: Creates a Device Defender audit suppression.
flags:
    --check-name=!: ""
    --client-request-token=!: Each audit supression must have a unique client request token.
    --description=: The description of the audit suppression.
    --expiration-date=: The epoch timestamp in seconds at which this suppression expires.
    --resource-identifier=!: ""
    --suppress-indefinitely=: Indicates whether a suppression should exist indefinitely or not.
documentation:
    command: |-
        Creates a Device Defender audit suppression.

        Requires permission to access the [CreateAuditSuppression](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        check-name: ""
        client-request-token: Each audit supression must have a unique client request token. If you try to create a new audit suppression with the same token as one that already exists, an exception occurs. If you omit this value, Amazon Web Services SDKs will automatically generate a unique client request.
        description: The description of the audit suppression.
        expiration-date: The epoch timestamp in seconds at which this suppression expires.
        resource-identifier: ""
        suppress-indefinitely: Indicates whether a suppression should exist indefinitely or not.
