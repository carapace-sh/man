name: untag-resource
description: Removes the association of the specified tags from a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
    --tag-keys=!: An array of tag key values to unassociate with the resource.
documentation:
    command: Removes the association of the specified tags from a resource. For more information on tags see [Tags](https://docs.aws.amazon.com/sms-voice/latest/userguide/phone-numbers-tags.html) in the *End User MessagingSMS User Guide*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource.
        tag-keys: An array of tag key values to unassociate with the resource.
