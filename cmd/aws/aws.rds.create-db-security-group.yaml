name: create-db-security-group
description: Creates a new DB security group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-security-group-description=!: The description for the DB security group.
    --db-security-group-name=!: The name for the DB security group.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --tags=: Tags to assign to the DB security group.
documentation:
    command: |-
        Creates a new DB security group. DB security groups control access to a DB instance.

        A DB security group controls access to EC2-Classic DB instances that are not in a VPC.

        EC2-Classic was retired on August 15, 2022. If you haven't migrated from EC2-Classic to a VPC, we recommend that you migrate as soon as possible. For more information, see [Migrate from EC2-Classic to a VPC](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/vpc-migrate.html) in the *Amazon EC2 User Guide*, the blog [EC2-Classic Networking is Retiring – Here’s How to Prepare](http://aws.amazon.com/blogs/aws/ec2-classic-is-retiring-heres-how-to-prepare/), and [Moving a DB instance not in a VPC into a VPC](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.Non-VPC2VPC.html) in the *Amazon RDS User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-security-group-description: The description for the DB security group.
        db-security-group-name: |-
            The name for the DB security group. This value is stored as a lowercase string.

            Constraints:

            - Must be 1 to 255 letters, numbers, or hyphens.
            - First character must be a letter
            - Can't end with a hyphen or contain two consecutive hyphens
            - Must not be "Default"

            Example: `mysecuritygroup`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tags: Tags to assign to the DB security group.
