name: list-transformers
description: Lists the available transformers.
flags:
    --max-results=: Specifies the number of items to return for the API response.
    --next-token=: When additional results are obtained from the command, a `NextToken` parameter is returned in the output.
documentation:
    command: Lists the available transformers. A transformer can take an EDI file as input and transform it into a JSON-or XML-formatted document. Alternatively, a transformer can take a JSON-or XML-formatted document as input and transform it into an EDI file.
    flag:
        max-results: Specifies the number of items to return for the API response.
        next-token: When additional results are obtained from the command, a `NextToken` parameter is returned in the output. You can then pass the `NextToken` parameter in a subsequent command to continue listing additional resources.
