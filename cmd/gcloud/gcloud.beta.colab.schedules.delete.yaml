name: delete
description: '*(BETA)*  Delete a schedule.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Cloud region for the schedule.
documentation:
    command: |
        *(BETA)*  Delete a Colab Enterprise notebook execution schedule.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            Cloud region for the schedule.
            +
            To set the `region` attribute:
            * provide the argument `schedule` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `colab/region`.
