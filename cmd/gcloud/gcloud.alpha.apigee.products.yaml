name: products
description: '*(ALPHA)*  Manage Apigee API products.'
documentation:
    command: |
        *(ALPHA)*  Manage Apigee API products.

        `gcloud alpha apigee products` manipulates API products. These are collections of
        deployed API resources, combined with quota settings and metadata,
        used to deliver customized and productized API bundles to the
        developer community.
