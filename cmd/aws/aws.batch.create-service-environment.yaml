name: create-service-environment
description: Creates a service environment for running service jobs.
flags:
    --capacity-limits=!: The capacity limits for the service environment.
    --service-environment-name=!: The name for the service environment.
    --service-environment-type=!: The type of service environment.
    --state=: The state of the service environment.
    --tags=: The tags that you apply to the service environment to help you categorize and organize your resources.
completion:
    flag:
        service-environment-type:
            - SAGEMAKER_TRAINING
        state:
            - ENABLED
            - DISABLED
documentation:
    command: Creates a service environment for running service jobs. Service environments define capacity limits for specific service types such as SageMaker Training jobs.
    flag:
        capacity-limits: The capacity limits for the service environment. The number of instances a job consumes is the total number of instances requested in the submit training job request resource configuration.
        service-environment-name: The name for the service environment. It can be up to 128 characters long and can contain letters, numbers, hyphens (-), and underscores (\_).
        service-environment-type: The type of service environment. For SageMaker Training jobs, specify `SAGEMAKER_TRAINING`.
        state: The state of the service environment. Valid values are `ENABLED` and `DISABLED`. The default value is `ENABLED`.
        tags: The tags that you apply to the service environment to help you categorize and organize your resources. Each tag consists of a key and an optional value. For more information, see [Tagging your Batch resources](https://docs.aws.amazon.com/batch/latest/userguide/using-tags.html).
