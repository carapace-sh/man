name: update-account-settings
description: Updates the value of the `DeletionProtection` parameter.
flags:
    --deletion-protection=: A parameter to configure deletion protection.
documentation:
    command: Updates the value of the `DeletionProtection` parameter.
    flag:
        deletion-protection: A parameter to configure deletion protection. Deletion protection prevents a user from deleting a configuration profile or an environment if AppConfig has called either [GetLatestConfiguration](https://docs.aws.amazon.com/appconfig/2019-10-09/APIReference/API_appconfigdata_GetLatestConfiguration.html) or for the configuration profile or from the environment during the specified interval. The default interval for `ProtectionPeriodInMinutes` is 60.
