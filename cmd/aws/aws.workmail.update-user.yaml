name: update-user
description: Updates data for the user.
flags:
    --city=: Updates the user's city.
    --company=: Updates the user's company.
    --country=: Updates the user's country.
    --department=: Updates the user's department.
    --display-name=: Updates the display name of the user.
    --first-name=: Updates the user's first name.
    --hidden-from-global-address-list=: If enabled, the user is hidden from the global address list.
    --identity-provider-user-id=: User ID from the IAM Identity Center.
    --initials=: Updates the user's initials.
    --job-title=: Updates the user's job title.
    --last-name=: Updates the user's last name.
    --office=: Updates the user's office.
    --organization-id=!: The identifier for the organization under which the user exists.
    --role=: Updates the user role.
    --street=: Updates the user's street address.
    --telephone=: Updates the user's contact details.
    --user-id=!: The identifier for the user to be updated.
    --zip-code=: Updates the user's zip code.
completion:
    flag:
        role:
            - USER
            - RESOURCE
            - SYSTEM_USER
            - REMOTE_USER
documentation:
    command: Updates data for the user. To have the latest information, it must be preceded by a [DescribeUser]() call. The dataset in the request should be the one expected when performing another `DescribeUser` call.
    flag:
        city: Updates the user's city.
        company: Updates the user's company.
        country: Updates the user's country.
        department: Updates the user's department.
        display-name: Updates the display name of the user.
        first-name: Updates the user's first name.
        hidden-from-global-address-list: If enabled, the user is hidden from the global address list.
        identity-provider-user-id: User ID from the IAM Identity Center. If this parameter is empty it will be updated automatically when the user logs in for the first time to the mailbox associated with WorkMail.
        initials: Updates the user's initials.
        job-title: Updates the user's job title.
        last-name: Updates the user's last name.
        office: Updates the user's office.
        organization-id: The identifier for the organization under which the user exists.
        role: |-
            Updates the user role.

            You cannot pass *SYSTEM\_USER* or *RESOURCE*.
        street: Updates the user's street address.
        telephone: Updates the user's contact details.
        user-id: |-
            The identifier for the user to be updated.

            The identifier can be the *UserId*, *Username*, or *email*. The following identity formats are available:

            - User ID: 12345678-1234-1234-1234-123456789012 or S-1-1-12-1234567890-123456789-123456789-1234
            - Email address: user@domain.tld
            - User name: user
        zip-code: Updates the user's zip code.
