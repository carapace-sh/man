name: list-topic-rule-destinations
description: Lists all the topic rule destinations in your Amazon Web Services account.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
documentation:
    command: |-
        Lists all the topic rule destinations in your Amazon Web Services account.

        Requires permission to access the [ListTopicRuleDestinations](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at one time.
        next-token: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
