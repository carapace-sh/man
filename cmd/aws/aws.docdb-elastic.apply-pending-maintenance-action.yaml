name: apply-pending-maintenance-action
description: The type of pending maintenance action to be applied to the resource.
flags:
    --apply-action=!: The pending maintenance action to apply to the resource.
    --apply-on=: A specific date to apply the pending maintenance action.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --opt-in-type=!: A value that specifies the type of opt-in request, or undoes an opt-in request.
    --resource-arn=!: The Amazon DocumentDB Amazon Resource Name (ARN) of the resource to which the pending maintenance action applies.
completion:
    flag:
        opt-in-type:
            - IMMEDIATE
            - NEXT_MAINTENANCE
            - APPLY_ON
            - UNDO_OPT_IN
documentation:
    command: The type of pending maintenance action to be applied to the resource.
    flag:
        apply-action: "The pending maintenance action to apply to the resource.\n\nValid actions are:\n\n- `ENGINE_UPDATE`\n  \n  *`ENGINE_UPGRADE`*\n  \n  *`SECURITY_UPDATE`*\n  \n  *`OS_UPDATE`*\n  \n  *`MASTER_USER_PASSWORD_UPDATE`*"
        apply-on: 'A specific date to apply the pending maintenance action. Required if opt-in-type is `APPLY_ON`. Format: `yyyy/MM/dd HH:mm-yyyy/MM/dd HH:mm`'
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        opt-in-type: A value that specifies the type of opt-in request, or undoes an opt-in request. An opt-in request of type `IMMEDIATE` can't be undone.
        resource-arn: The Amazon DocumentDB Amazon Resource Name (ARN) of the resource to which the pending maintenance action applies.
