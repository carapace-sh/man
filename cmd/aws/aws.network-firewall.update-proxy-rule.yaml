name: update-proxy-rule
description: Updates the properties of the specified proxy rule.
flags:
    --action=: Depending on the match action, the proxy either stops the evaluation (if the action is terminal - allow or deny), or continues it (if the action is alert) until it matches a rule with a terminal action.
    --add-conditions=: Proxy rule conditions to add.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the proxy rule.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --proxy-rule-group-arn=: The Amazon Resource Name (ARN) of a proxy rule group.
    --proxy-rule-group-name=: The descriptive name of the proxy rule group.
    --proxy-rule-name=!: The descriptive name of the proxy rule.
    --remove-conditions=: Proxy rule conditions to remove.
    --update-token=!: A token used for optimistic locking.
completion:
    flag:
        action:
            - ALLOW
            - DENY
            - ALERT
documentation:
    command: Updates the properties of the specified proxy rule.
    flag:
        action: Depending on the match action, the proxy either stops the evaluation (if the action is terminal - allow or deny), or continues it (if the action is alert) until it matches a rule with a terminal action.
        add-conditions: Proxy rule conditions to add. Match criteria that specify what traffic attributes to examine. Conditions include operators (StringEquals, StringLike) and values to match against.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the proxy rule.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        proxy-rule-group-arn: |-
            The Amazon Resource Name (ARN) of a proxy rule group.

            You must specify the ARN or the name, and you can specify both.
        proxy-rule-group-name: |-
            The descriptive name of the proxy rule group. You can't change the name of a proxy rule group after you create it.

            You must specify the ARN or the name, and you can specify both.
        proxy-rule-name: The descriptive name of the proxy rule. You can't change the name of a proxy rule after you create it.
        remove-conditions: Proxy rule conditions to remove. Match criteria that specify what traffic attributes to examine. Conditions include operators (StringEquals, StringLike) and values to match against.
        update-token: |-
            A token used for optimistic locking. Network Firewall returns a token to your requests that access the proxy rule. The token marks the state of the proxy rule resource at the time of the request.

            To make changes to the proxy rule, you provide the token in your request. Network Firewall uses the token to ensure that the proxy rule hasn't changed since you last retrieved it. If it has changed, the operation fails with an `InvalidTokenException`. If this happens, retrieve the proxy rule again to get a current copy of it with a current token. Reapply your changes as needed, then try the operation again using the new token.
