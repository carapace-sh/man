name: export-serverless-cache-snapshot
description: Provides the functionality to export the serverless cache snapshot data to Amazon S3.
flags:
    --s3-bucket-name=!: Name of the Amazon S3 bucket to export the snapshot to.
    --serverless-cache-snapshot-name=!: The identifier of the serverless cache snapshot to be exported to S3.
documentation:
    command: Provides the functionality to export the serverless cache snapshot data to Amazon S3. Available for Valkey and Redis OSS only.
    flag:
        s3-bucket-name: Name of the Amazon S3 bucket to export the snapshot to. The Amazon S3 bucket must also be in same region as the snapshot. Available for Valkey and Redis OSS only.
        serverless-cache-snapshot-name: The identifier of the serverless cache snapshot to be exported to S3. Available for Valkey and Redis OSS only.
