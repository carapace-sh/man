name: describe
description: Describe a VMware Engine network policy.
flags:
    --location=: The resource name of the location.
documentation:
    command: |
        Describe a VMware Engine network policy.
    flag:
        location: |-
            The resource name of the location.
            +
            To set the `location` attribute:
            * provide the argument `network_policy` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/region`.
