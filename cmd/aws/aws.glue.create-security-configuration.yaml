name: create-security-configuration
description: Creates a new security configuration.
flags:
    --encryption-configuration=!: The encryption configuration for the new security configuration.
    --name=!: The name for the new security configuration.
documentation:
    command: Creates a new security configuration. A security configuration is a set of security properties that can be used by Glue. You can use a security configuration to encrypt data at rest. For information about using security configurations in Glue, see [Encrypting Data Written by Crawlers, Jobs, and Development Endpoints](https://docs.aws.amazon.com/glue/latest/dg/encryption-security-configuration.html).
    flag:
        encryption-configuration: The encryption configuration for the new security configuration.
        name: The name for the new security configuration.
