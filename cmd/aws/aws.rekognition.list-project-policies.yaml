name: list-project-policies
description: This operation applies only to Amazon Rekognition Custom Labels.
flags:
    --max-results=: The maximum number of results to return per paginated call.
    --next-token=: If the previous response was incomplete (because there is more results to retrieve), Amazon Rekognition Custom Labels returns a pagination token in the response.
    --project-arn=!: The ARN of the project for which you want to list the project policies.
documentation:
    command: |-
        This operation applies only to Amazon Rekognition Custom Labels.

        Gets a list of the project policies attached to a project.

        To attach a project policy to a project, call [PutProjectPolicy](). To remove a project policy from a project, call [DeleteProjectPolicy]().

        This operation requires permissions to perform the `rekognition:ListProjectPolicies` action.
    flag:
        max-results: The maximum number of results to return per paginated call. The largest value you can specify is 5. If you specify a value greater than 5, a ValidationException error occurs. The default value is 5.
        next-token: If the previous response was incomplete (because there is more results to retrieve), Amazon Rekognition Custom Labels returns a pagination token in the response. You can use this pagination token to retrieve the next set of results.
        project-arn: The ARN of the project for which you want to list the project policies.
