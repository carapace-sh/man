name: create-managed-thing
description: Creates a managed thing.
flags:
    --authentication-material-type=!: The type of authentication material used for device connectivity setup requests.
    --authentication-material=!: The authentication material defining the device connectivity setup requests.
    --brand=: The brand of the device.
    --capabilities=: The capabilities of the device such as light bulb.
    --capability-report=: A report of the capabilities for the managed thing.
    --capability-schemas=: The capability schemas that define the functionality and features supported by the managed thing, including device capabilities and their associated properties.
    --classification=: The classification of the managed thing such as light bulb or thermostat.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: An idempotency token.
    --credential-locker-id=: The identifier of the credential for the managed thing.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --meta-data=: The metadata for the managed thing.
    --model=: The model of the device.
    --name=: The name of the managed thing representing the physical device.
    --owner=: Owner of the device, usually an indication of whom the device belongs to.
    --role=!: The type of device used.
    --serial-number=: The serial number of the device.
    --tags=: A set of key/value pairs that are used to manage the managed thing.
completion:
    flag:
        authentication-material-type:
            - CUSTOM_PROTOCOL_QR_BAR_CODE
            - WIFI_SETUP_QR_BAR_CODE
            - ZWAVE_QR_BAR_CODE
            - ZIGBEE_QR_BAR_CODE
            - DISCOVERED_DEVICE
        role:
            - CONTROLLER
            - DEVICE
documentation:
    command: Creates a managed thing. A managed thing contains the device identifier, protocol supported, and capabilities of the device in a data model format defined by Managed integrations.
    flag:
        authentication-material: The authentication material defining the device connectivity setup requests. The authentication materials used are the device bar code.
        authentication-material-type: The type of authentication material used for device connectivity setup requests.
        brand: The brand of the device.
        capabilities: The capabilities of the device such as light bulb.
        capability-report: A report of the capabilities for the managed thing.
        capability-schemas: The capability schemas that define the functionality and features supported by the managed thing, including device capabilities and their associated properties.
        classification: The classification of the managed thing such as light bulb or thermostat.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: An idempotency token. If you retry a request that completed successfully initially using the same client token and parameters, then the retry attempt will succeed without performing any further actions.
        credential-locker-id: The identifier of the credential for the managed thing.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        meta-data: |-
            The metadata for the managed thing.

            The `managedThing` `metadata` parameter is used for associating attributes with a `managedThing` that can be used for grouping over-the-air (OTA) tasks. Name value pairs in `metadata` can be used in the `OtaTargetQueryString` parameter for the `CreateOtaTask` API operation.
        model: The model of the device.
        name: The name of the managed thing representing the physical device.
        owner: Owner of the device, usually an indication of whom the device belongs to. This value should not contain personal identifiable information.
        role: The type of device used. This will be the hub controller, cloud device, or AWS IoT device.
        serial-number: The serial number of the device.
        tags: A set of key/value pairs that are used to manage the managed thing.
