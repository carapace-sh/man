name: update
description: '*(BETA)*  Updates a Data Pipelines Pipeline.'
flags:
    --additional-experiments=: Default experiment flags for the job.
    --additional-user-labels=: Default user labels to be specified for the job.
    --dataflow-kms-key=: Default Cloud KMS key to protect the job resources.
    --dataflow-service-account-email=: Default service account to run the dataflow workers as.
    --disable-public-ips: Specifies that Cloud Dataflow workers must not use public IP addresses by default.
    --display-name=: Display name of the Data Pipelines pipeline.
    --enable-streaming-engine: Specifies that enabling Streaming Engine for the job by default.
    --flexrs-goal=: FlexRS goal for the flex template job.
    --max-workers=: Maximum number of workers to run by default.
    --network=: Default Compute Engine network for launching instances to run your pipeline.
    --no-disable-public-ips&: Specifies that Cloud Dataflow workers must not use public IP addresses by default.
    --no-enable-streaming-engine&: Specifies that enabling Streaming Engine for the job by default.
    --no-update&: Set this to true for streaming update jobs.
    --num-workers=: Initial number of workers to run by default.
    --parameters=: User defined parameters for the template.
    --region=: The Cloud region for the pipeline.
    --schedule=: Unix-cron format of the schedule for scheduling recurrent jobs.
    --scheduler-service-account-email=: Default service account used by the Cloud Scheduler job for launching jobs.
    --subnetwork=: Default Compute Engine subnetwork for launching instances to run your pipeline.
    --temp-location=: Default Google Cloud Storage location to stage temporary files.
    --template-file-gcs-location=: Location of the template file or container spec file in Google Cloud Storage.
    --template-type=: Type of the template.
    --time-zone=: Timezone ID.
    --transform-name-mappings=: Transform name mappings for the streaming update job.
    --update: Set this to true for streaming update jobs.
    --worker-machine-type=: Default type of machine to use for workers.
    --worker-region=: Default Compute Engine region in which worker processing will occur.
    --worker-zone=: Default Compute Engine zone in which worker processing will occur.
completion:
    flag:
        flexrs-goal:
            - COST_OPTIMIZED
            - SPEED_OPTIMIZED
        template-type:
            - classic
            - flex
documentation:
    command: '*(BETA)*  Updates a Data Pipelines Pipeline.'
    flag:
        additional-experiments: Default experiment flags for the job.
        additional-user-labels: Default user labels to be specified for the job. Keys and values must follow the restrictions specified in https://cloud.google.com/compute/docs/labeling-resources#restrictions.
        dataflow-kms-key: Default Cloud KMS key to protect the job resources. The key must be in same location as the job.
        dataflow-service-account-email: Default service account to run the dataflow workers as.
        disable-public-ips: Specifies that Cloud Dataflow workers must not use public IP addresses by default. Overrides the default *datapipelines/disable_public_ips* property value for this command invocation.
        display-name: Display name of the Data Pipelines pipeline.
        enable-streaming-engine: Specifies that enabling Streaming Engine for the job by default. Overrides the default *datapipelines/enable_streaming_engine* property value for this command invocation.
        flexrs-goal: 'FlexRS goal for the flex template job. _FLEXRS_GOAL_ must be one of: *COST_OPTIMIZED*, *SPEED_OPTIMIZED*.'
        max-workers: Maximum number of workers to run by default. Must be between 1 and 1000.
        network: Default Compute Engine network for launching instances to run your pipeline. If not specified here, defaults to the network 'default'.
        no-disable-public-ips: Specifies that Cloud Dataflow workers must not use public IP addresses by default.
        no-enable-streaming-engine: Specifies that enabling Streaming Engine for the job by default.
        no-update: Set this to true for streaming update jobs.
        num-workers: Initial number of workers to run by default. Must be between 1 and 1000. If not specified here, defaults to server-specified value.
        parameters: User defined parameters for the template.
        region: |-
            The Cloud region for the pipeline.
            +
            To set the `region` attribute:
            * provide the argument `pipeline` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        schedule: Unix-cron format of the schedule for scheduling recurrent jobs.
        scheduler-service-account-email: Default service account used by the Cloud Scheduler job for launching jobs.
        subnetwork: Default Compute Engine subnetwork for launching instances to run your pipeline.
        temp-location: Default Google Cloud Storage location to stage temporary files. If not set, defaults to the value for staging-location (Must be a URL beginning with 'gs://'.)
        template-file-gcs-location: Location of the template file or container spec file in Google Cloud Storage.
        template-type: |-
            Type of the template. Defaults to flex template. One of 'FLEX' or 'CLASSIC'. _TEMPLATE_TYPE_ must be one of:
            +
            *classic*::: Specifies a Classic template
            *flex*::: Specifies a Flex template.
            :::
            +
        time-zone: Timezone ID. This matches the timezone IDs used by the Cloud Scheduler API.
        transform-name-mappings: Transform name mappings for the streaming update job.
        update: Set this to true for streaming update jobs. Use *--update* to enable and *--no-update* to disable.
        worker-machine-type: Default type of machine to use for workers. If not specified here, defaults to server-specified value.
        worker-region: Default Compute Engine region in which worker processing will occur.
        worker-zone: Default Compute Engine zone in which worker processing will occur.
