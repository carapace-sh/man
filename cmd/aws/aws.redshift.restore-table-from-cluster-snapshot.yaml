name: restore-table-from-cluster-snapshot
description: Creates a new table from a table in an Amazon Redshift cluster snapshot.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-identifier=!: The identifier of the Amazon Redshift cluster to restore the table to.
    --enable-case-sensitive-identifier: Indicates whether name identifiers for database, schema, and table are case sensitive.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --new-table-name=!: The name of the table to create as a result of the current request.
    --no-enable-case-sensitive-identifier: Indicates whether name identifiers for database, schema, and table are case sensitive.
    --snapshot-identifier=!: The identifier of the snapshot to restore the table from.
    --source-database-name=!: The name of the source database that contains the table to restore from.
    --source-schema-name=: The name of the source schema that contains the table to restore from.
    --source-table-name=!: The name of the source table to restore from.
    --target-database-name=: The name of the database to restore the table to.
    --target-schema-name=: The name of the schema to restore the table to.
documentation:
    command: |-
        Creates a new table from a table in an Amazon Redshift cluster snapshot. You must create the new table within the Amazon Redshift cluster that the snapshot was taken from.

        You cannot use `RestoreTableFromClusterSnapshot` to restore a table with the same name as an existing table in an Amazon Redshift cluster. That is, you cannot overwrite an existing table in a cluster with a restored table. If you want to replace your original table with a new, restored table, then rename or drop your original table before you call `RestoreTableFromClusterSnapshot`. When you have renamed your original table, then you can pass the original name of the table as the `NewTableName` parameter value in the call to `RestoreTableFromClusterSnapshot`. This way, you can replace the original table with the table created from the snapshot.

        You can't use this operation to restore tables with [interleaved sort keys](https://docs.aws.amazon.com/redshift/latest/dg/t_Sorting_data.html#t_Sorting_data-interleaved).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-identifier: The identifier of the Amazon Redshift cluster to restore the table to.
        enable-case-sensitive-identifier: Indicates whether name identifiers for database, schema, and table are case sensitive. If `true`, the names are case sensitive. If `false` (default), the names are not case sensitive.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        new-table-name: The name of the table to create as a result of the current request.
        snapshot-identifier: The identifier of the snapshot to restore the table from. This snapshot must have been created from the Amazon Redshift cluster specified by the `ClusterIdentifier` parameter.
        source-database-name: The name of the source database that contains the table to restore from.
        source-schema-name: The name of the source schema that contains the table to restore from. If you do not specify a `SourceSchemaName` value, the default is `public`.
        source-table-name: The name of the source table to restore from.
        target-database-name: The name of the database to restore the table to.
        target-schema-name: The name of the schema to restore the table to.
