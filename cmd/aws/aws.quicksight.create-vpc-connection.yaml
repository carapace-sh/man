name: create-vpc-connection
description: Creates a new VPC connection.
flags:
    --aws-account-id=!: The Amazon Web Services account ID of the account where you want to create a new VPC connection.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dns-resolvers=:
        description: A list of IP addresses of DNS resolver endpoints for the VPC connection.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The display name for the VPC connection.
    --role-arn=!: The IAM role to associate with the VPC connection.
    --security-group-ids=!:
        description: A list of security group IDs for the VPC connection.
        nargs: -1
    --subnet-ids=!:
        description: A list of subnet IDs for the VPC connection.
        nargs: -1
    --tags=:
        description: A map of the key-value pairs for the resource tag or tags assigned to the VPC connection.
        nargs: -1
    --vpc-connection-id=!: The ID of the VPC connection that you're creating.
documentation:
    command: Creates a new VPC connection.
    flag:
        aws-account-id: The Amazon Web Services account ID of the account where you want to create a new VPC connection.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dns-resolvers: A list of IP addresses of DNS resolver endpoints for the VPC connection.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The display name for the VPC connection.
        role-arn: The IAM role to associate with the VPC connection.
        security-group-ids: A list of security group IDs for the VPC connection.
        subnet-ids: A list of subnet IDs for the VPC connection.
        tags: A map of the key-value pairs for the resource tag or tags assigned to the VPC connection.
        vpc-connection-id: The ID of the VPC connection that you're creating. This ID is a unique identifier for each Amazon Web Services Region in an Amazon Web Services account.
