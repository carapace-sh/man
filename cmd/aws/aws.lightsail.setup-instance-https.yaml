name: setup-instance-https
description: Creates an SSL/TLS certificate that secures traffic for your website.
flags:
    --certificate-provider=!: The certificate authority that issues the SSL/TLS certificate.
    --domain-names=!: The name of the domain and subdomains that were specified for the SSL/TLS certificate.
    --email-address=!: The contact method for SSL/TLS certificate renewal alerts.
    --instance-name=!: The name of the Lightsail instance.
completion:
    flag:
        certificate-provider:
            - LetsEncrypt
documentation:
    command: |-
        Creates an SSL/TLS certificate that secures traffic for your website. After the certificate is created, it is installed on the specified Lightsail instance.

        If you provide more than one domain name in the request, at least one name must be less than or equal to 63 characters in length.
    flag:
        certificate-provider: The certificate authority that issues the SSL/TLS certificate.
        domain-names: The name of the domain and subdomains that were specified for the SSL/TLS certificate.
        email-address: The contact method for SSL/TLS certificate renewal alerts. You can enter one email address.
        instance-name: The name of the Lightsail instance.
