name: get
description: Get Access Approval service account.
flags:
    --folder=: Folder number.
    --organization=: Organization number.
documentation:
    command: |-
        Retrieves the service account that is used by Access Approval to access KMS
        keys for signing approved approval requests.
    flag:
        folder: Folder number. Only one of --project, --folder, or --organization can be provided. If none are provided then it uses config property [core/project].
        organization: Organization number. Either --project, --folder, or --organization must be provided. If none are provided then it uses config property [core/project].
