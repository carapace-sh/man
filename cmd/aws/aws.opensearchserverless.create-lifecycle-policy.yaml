name: create-lifecycle-policy
description: Creates a lifecyle policy to be applied to OpenSearch Serverless indexes.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure idempotency of the request.
    --description=: A description of the lifecycle policy.
    --name=!: The name of the lifecycle policy.
    --policy=!: The JSON policy document to use as the content for the lifecycle policy.
    --type=!: The type of lifecycle policy.
completion:
    flag:
        type:
            - retention
documentation:
    command: Creates a lifecyle policy to be applied to OpenSearch Serverless indexes. Lifecycle policies define the number of days or hours to retain the data on an OpenSearch Serverless index. For more information, see [Creating data lifecycle policies](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-lifecycle.html#serverless-lifecycle-create).
    flag:
        client-token: A unique, case-sensitive identifier to ensure idempotency of the request.
        description: A description of the lifecycle policy.
        name: The name of the lifecycle policy.
        policy: The JSON policy document to use as the content for the lifecycle policy.
        type: The type of lifecycle policy.
