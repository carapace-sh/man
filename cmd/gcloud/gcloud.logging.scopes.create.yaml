name: create
description: Create a log scope.
flags:
    --description=: A textual description for the log scope.
    --folder=: Folder of the log scope to create.
    --organization=: Organization of the log scope to create.
    --resource-names=!: Comma-separated list of resource names in this log scope.
documentation:
    command: |-
        After creating a log scope, you can use it to view logs in 1 or more
        resources.

        ## EXAMPLES

        To create a log scope in a project, run:

          $ gcloud logging scopes create my-scope --resource-names=projects/my-project

        To create a log scope in a project with a description, run:

          $ gcloud logging scopes create my-scope --resource-names=projects/my-project --description="my
          custom log scope"

        To create a log scope that contains more than 1 resource, such as projects and
        views, run:

          $ gcloud logging scopes create my-scope
          --resource-names=projects/my-project,projects/my-project2,
          projects/my-project/locations/global/buckets/my-bucket/views/my-view1,
          projects/my-project/locations/global/buckets/my-bucket/views/my-view2,
    flag:
        description: A textual description for the log scope.
        folder: Folder of the log scope to create.
        organization: Organization of the log scope to create.
        resource-names: Comma-separated list of resource names in this log scope. It could be one or more parent resources or one or more views.  A log scope can include a maximum of 50 projects and a maximum of 100 resources in total. For example, projects/[PROJECT_ID], projects/[PROJECT_ID]/locations/[LOCATION_ID]/buckets/[BUCKET_ID]/views/[VIEW_ID]`
