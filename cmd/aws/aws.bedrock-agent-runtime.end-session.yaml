name: end-session
description: Ends the session.
flags:
    --session-identifier=!: The unique identifier for the session to end.
documentation:
    command: Ends the session. After you end a session, you can still access its content but you can’t add to it. To delete the session and it's content, you use the DeleteSession API operation. For more information about sessions, see [Store and retrieve conversation history and context with Amazon Bedrock sessions](https://docs.aws.amazon.com/bedrock/latest/userguide/sessions.html).
    flag:
        session-identifier: The unique identifier for the session to end. You can specify either the session's `sessionId` or its Amazon Resource Name (ARN).
