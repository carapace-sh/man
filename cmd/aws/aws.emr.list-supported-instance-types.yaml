name: list-supported-instance-types
description: A list of the instance types that Amazon EMR supports.
flags:
    --marker=: The pagination token that marks the next set of results to retrieve.
    --release-label=!: The Amazon EMR release label determines the [versions of open-source application packages](https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-release-app-versions-6.x.html) that Amazon EMR has installed on the cluster.
documentation:
    command: A list of the instance types that Amazon EMR supports. You can filter the list by Amazon Web Services Region and Amazon EMR release.
    flag:
        marker: The pagination token that marks the next set of results to retrieve.
        release-label: The Amazon EMR release label determines the [versions of open-source application packages](https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-release-app-versions-6.x.html) that Amazon EMR has installed on the cluster. Release labels are in the format `emr-x.x.x`, where x.x.x is an Amazon EMR release number such as `emr-6.10.0`. For more information about Amazon EMR releases and their included application versions and features, see the [*Amazon EMR Release Guide*](https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-release-components.html) .
