name: hadoop
description: '*(ALPHA)*  Submit a Hadoop job to a cluster.'
flags:
    --archives=: Comma separated list of archives to be provided to the job.
    --async: Return immediately, without waiting for the operation in progress to
    --bucket=: The Cloud Storage bucket to stage files in.
    --class=: The class containing the main method of the driver.
    --cluster-labels=: List of label KEY=VALUE pairs to add.
    --cluster=: The Dataproc cluster to submit the job to.
    --driver-log-levels=: A list of package to log4j log level pairs to configure driver logging.
    --driver-required-memory-mb=: The memory allocation requested by the job driver in megabytes (MB) for execution on the driver node group (it is used only by clusters with a driver node group).
    --driver-required-vcores=: The vCPU allocation requested by the job driver for execution on the driver node group (it is used only by clusters with a driver node group).
    --files=: Comma separated list of file paths to be provided to the job.
    --id=&: Set the ID of the job, which is usually autogenerated
    --jar=: The HCFS URI of jar file containing the driver jar.
    --jars=: Comma separated list of jar files to be provided to the MR and driver classpaths.
    --labels=: List of label KEY=VALUE pairs to add.
    --max-failures-per-hour=: Specifies the maximum number of times a job can be restarted per hour in event of failure.
    --max-failures-total=: Specifies the maximum total number of times a job can be restarted after the job fails.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --properties-file=: Path to a local file or a file in a Cloud Storage bucket containing
    --properties=: A list of key value pairs to configure Hadoop.
    --region=: Dataproc region to use.
    --ttl=&: The maximum duration this job is allowed to run before being killed automatically.
documentation:
    command: |-
        *(ALPHA)*  Submit a Hadoop job to a cluster.

        ## EXAMPLES

        To submit a Hadoop job that runs the main class of a jar, run:

          $ gcloud alpha dataproc jobs submit hadoop --cluster=my-cluster --jar=my_jar.jar -- arg1 arg2

        To submit a Hadoop job that runs a specific class of a jar, run:

          $ gcloud alpha dataproc jobs submit hadoop --cluster=my-cluster --class=org.my.main.Class \
              --jars=my_jar1.jar,my_jar2.jar -- arg1 arg2

        To submit a Hadoop job that runs a jar that is already on the cluster, run:

          $ gcloud alpha dataproc jobs submit hadoop --cluster=my-cluster \
              --jar=file:///usr/lib/hadoop-op/hadoop-op-examples.jar \
              -- wordcount gs://my_bucket/my_file.txt gs://my_bucket/output
    flag:
        archives: 'Comma separated list of archives to be provided to the job. must be one of the following file formats: .zip, .tar, .tar.gz, or .tgz.'
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        bucket: The Cloud Storage bucket to stage files in. Defaults to the cluster's configured bucket.
        class: The class containing the main method of the driver. Must be in a provided jar or jar that is already on the classpath
        cluster: The Dataproc cluster to submit the job to.
        cluster-labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            Labels of Dataproc cluster on which to place the job.
        driver-log-levels: 'A list of package to log4j log level pairs to configure driver logging. For example: root=FATAL,com.example=INFO'
        driver-required-memory-mb: The memory allocation requested by the job driver in megabytes (MB) for execution on the driver node group (it is used only by clusters with a driver node group).
        driver-required-vcores: The vCPU allocation requested by the job driver for execution on the driver node group (it is used only by clusters with a driver node group).
        files: Comma separated list of file paths to be provided to the job. A file path can either be a path to a local file or a path to a file already in a Cloud Storage bucket.
        id: Set the ID of the job, which is usually autogenerated
        jar: The HCFS URI of jar file containing the driver jar.
        jars: Comma separated list of jar files to be provided to the MR and driver classpaths.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        max-failures-per-hour: Specifies the maximum number of times a job can be restarted per hour in event of failure. Default is 0 (no retries after job failure).
        max-failures-total: Specifies the maximum total number of times a job can be restarted after the job fails. Default is 0 (no retries after job failure).
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        properties: A list of key value pairs to configure Hadoop.
        properties-file: |-
            Path to a local file or a file in a Cloud Storage bucket containing
            configuration properties for the job. The client machine running this command
            must have read permission to the file.
            +
            Specify properties in the form of property=value in the text file. For example:
            +
            ```
              # Properties to set for the job:
              key1=value1
              key2=value2
              # Comment out properties not used.
              # key3=value3
            ```
            +
            If a property is set in both `--properties` and `--properties-file`, the
            value defined in `--properties` takes precedence.
        region: Dataproc region to use. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default *dataproc/region* property value for this command invocation.
        ttl: The maximum duration this job is allowed to run before being killed automatically. Specified using a s, m, h, or d (seconds, minutes, hours, or days) suffix. The minimum value is 10 minutes (10m), and the maximum value is 14 days (14d) Run [gcloud topic datetimes] (https://cloud.google.com/sdk/gcloud/reference/topic/datetimes) for information on duration formats.
