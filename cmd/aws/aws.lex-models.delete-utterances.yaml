name: delete-utterances
description: Deletes stored utterances.
flags:
    --bot-name=!: The name of the bot that stored the utterances.
    --user-id=!: The unique identifier for the user that made the utterances.
documentation:
    command: |-
        Deletes stored utterances.

        Amazon Lex stores the utterances that users send to your bot. Utterances are stored for 15 days for use with the [GetUtterancesView]() operation, and then stored indefinitely for use in improving the ability of your bot to respond to user input.

        Use the `DeleteUtterances` operation to manually delete stored utterances for a specific user. When you use the `DeleteUtterances` operation, utterances stored for improving your bot's ability to respond to user input are deleted immediately. Utterances stored for use with the `GetUtterancesView` operation are deleted after 15 days.

        This operation requires permissions for the `lex:DeleteUtterances` action.
    flag:
        bot-name: The name of the bot that stored the utterances.
        user-id: The unique identifier for the user that made the utterances. This is the user ID that was sent in the [PostContent](http://docs.aws.amazon.com/lex/latest/dg/API_runtime_PostContent.html) or [PostText](http://docs.aws.amazon.com/lex/latest/dg/API_runtime_PostText.html) operation request that contained the utterance.
