name: get-guest-attributes
description: '*(BETA)*  Get the Guest Attributes for a compute instance.'
flags:
    --query-path=: Attribute path to query.
    --zone=: The name of the Google Compute Engine zone.
documentation:
    command: |
        *(BETA)*  Get the Guest Attributes for a compute instance.
    flag:
        query-path: |-
            Attribute path to query. Can be empty string or of the form `<namespace>/` or
            `<namespace>/<key>`. Default is the empty string.
        zone: |-
            The name of the Google Compute Engine zone.
            +
            To set the `zone` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
