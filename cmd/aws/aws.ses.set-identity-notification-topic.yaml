name: set-identity-notification-topic
description: Sets an Amazon Simple Notification Service (Amazon SNS) topic to use when delivering notifications.
flags:
    --identity=!: The identity (email address or domain) for the Amazon SNS topic.
    --notification-type=!: The type of notifications that are published to the specified Amazon SNS topic.
    --sns-topic=: The Amazon Resource Name (ARN) of the Amazon SNS topic.
completion:
    flag:
        notification-type:
            - Bounce
            - Complaint
            - Delivery
documentation:
    command: |-
        Sets an Amazon Simple Notification Service (Amazon SNS) topic to use when delivering notifications. When you use this operation, you specify a verified identity, such as an email address or domain. When you send an email that uses the chosen identity in the Source field, Amazon SES sends notifications to the topic you specified. You can send bounce, complaint, or delivery notifications (or any combination of the three) to the Amazon SNS topic that you specify.

        You can execute this operation no more than once per second.

        For more information about feedback notification, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/dg/monitor-sending-activity-using-notifications.html).
    flag:
        identity: |-
            The identity (email address or domain) for the Amazon SNS topic.

            You can only specify a verified identity for this parameter.

            You can specify an identity by using its name or by using its Amazon Resource Name (ARN). The following examples are all valid identities: `sender@example.com`, `example.com`, `arn:aws:ses:us-east-1:123456789012:identity/example.com`.
        notification-type: The type of notifications that are published to the specified Amazon SNS topic.
        sns-topic: The Amazon Resource Name (ARN) of the Amazon SNS topic. If the parameter is omitted from the request or a null value is passed, `SnsTopic` is cleared and publishing is disabled.
