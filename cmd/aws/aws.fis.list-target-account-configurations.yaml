name: list-target-account-configurations
description: Lists the target account configurations of the specified experiment template.
flags:
    --experiment-template-id=!: The ID of the experiment template.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token for the next page of results.
documentation:
    command: Lists the target account configurations of the specified experiment template.
    flag:
        experiment-template-id: The ID of the experiment template.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned nextToken value.
        next-token: The token for the next page of results.
