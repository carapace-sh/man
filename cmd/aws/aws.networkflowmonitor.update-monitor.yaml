name: update-monitor
description: Update a monitor to add or remove local or remote resources.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive string of up to 64 ASCII characters that you specify to make an idempotent API request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --local-resources-to-add=:
        description: Additional local resources to specify network flows for a monitor, as an array of resources with identifiers and types.
        nargs: -1
    --local-resources-to-remove=:
        description: The local resources to remove, as an array of resources with identifiers and types.
        nargs: -1
    --monitor-name=!: The name of the monitor.
    --remote-resources-to-add=:
        description: The remote resources to add, as an array of resources with identifiers and types.
        nargs: -1
    --remote-resources-to-remove=:
        description: The remote resources to remove, as an array of resources with identifiers and types.
        nargs: -1
documentation:
    command: Update a monitor to add or remove local or remote resources.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive string of up to 64 ASCII characters that you specify to make an idempotent API request. Don't reuse the same client token for other API requests.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        local-resources-to-add: Additional local resources to specify network flows for a monitor, as an array of resources with identifiers and types. A local resource in a workload is the location of hosts where the Network Flow Monitor agent is installed.
        local-resources-to-remove: The local resources to remove, as an array of resources with identifiers and types.
        monitor-name: The name of the monitor.
        remote-resources-to-add: |-
            The remote resources to add, as an array of resources with identifiers and types.

            A remote resource is the other endpoint in the flow of a workload, with a local resource. For example, Amazon Dynamo DB can be a remote resource.
        remote-resources-to-remove: |-
            The remote resources to remove, as an array of resources with identifiers and types.

            A remote resource is the other endpoint specified for the network flow of a workload, with a local resource. For example, Amazon Dynamo DB can be a remote resource.
