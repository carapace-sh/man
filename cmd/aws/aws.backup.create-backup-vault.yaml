name: create-backup-vault
description: Creates a logical container where backups are stored.
flags:
    --backup-vault-name=!: The name of a logical container where backups are stored.
    --backup-vault-tags=: The tags to assign to the backup vault.
    --creator-request-id=: A unique string that identifies the request and allows failed requests to be retried without the risk of running the operation twice.
    --encryption-key-arn=: The server-side encryption key that is used to protect your backups; for example, `arn:aws:kms:us-west-2:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab`.
documentation:
    command: |-
        Creates a logical container where backups are stored. A `CreateBackupVault` request includes a name, optionally one or more resource tags, an encryption key, and a request ID.

        Do not include sensitive data, such as passport numbers, in the name of a backup vault.
    flag:
        backup-vault-name: The name of a logical container where backups are stored. Backup vaults are identified by names that are unique to the account used to create them and the Amazon Web Services Region where they are created. They consist of letters, numbers, and hyphens.
        backup-vault-tags: The tags to assign to the backup vault.
        creator-request-id: |-
            A unique string that identifies the request and allows failed requests to be retried without the risk of running the operation twice. This parameter is optional.

            If used, this parameter must contain 1 to 50 alphanumeric or '-\_.' characters.
        encryption-key-arn: The server-side encryption key that is used to protect your backups; for example, `arn:aws:kms:us-west-2:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab`.
