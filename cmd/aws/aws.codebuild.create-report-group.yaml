name: create-report-group
description: Creates a report group.
flags:
    --export-config=!: A `ReportExportConfig` object that contains information about where the report group test results are exported.
    --name=!: The name of the report group.
    --tags=: A list of tag key and value pairs associated with this report group.
    --type=!: The type of report group.
completion:
    flag:
        type:
            - TEST
            - CODE_COVERAGE
documentation:
    command: Creates a report group. A report group contains a collection of reports.
    flag:
        export-config: A `ReportExportConfig` object that contains information about where the report group test results are exported.
        name: The name of the report group.
        tags: |-
            A list of tag key and value pairs associated with this report group.

            These tags are available for use by Amazon Web Services services that support CodeBuild report group tags.
        type: The type of report group.
