name: update-table
description: Modifies the provisioned throughput settings, global secondary indexes, or DynamoDB Streams settings for a given table.
flags:
    --attribute-definitions=: An array of attributes that describe the key schema for the table and indexes.
    --billing-mode=: Controls how you are charged for read and write throughput and how you manage capacity.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deletion-protection-enabled: Indicates whether deletion protection is to be enabled (true) or disabled (false) on the table.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-secondary-index-updates=: An array of one or more global secondary indexes for the table.
    --global-table-witness-updates=: A list of witness updates for a MRSC global table.
    --multi-region-consistency=: Specifies the consistency mode for a new global table.
    --no-deletion-protection-enabled: Indicates whether deletion protection is to be enabled (true) or disabled (false) on the table.
    --on-demand-throughput=: Updates the maximum number of read and write units for the specified table in on-demand capacity mode.
    --provisioned-throughput=: The new provisioned throughput settings for the specified table or index.
    --replica-updates=: A list of replica update actions (create, delete, or update) for the table.
    --sse-specification=: The new server-side encryption settings for the specified table.
    --stream-specification=: Represents the DynamoDB Streams configuration for the table.
    --table-class=: The table class of the table to be updated.
    --table-name=!: The name of the table to be updated.
    --warm-throughput=: Represents the warm throughput (in read units per second and write units per second) for updating a table.
completion:
    flag:
        billing-mode:
            - PROVISIONED
            - PAY_PER_REQUEST
        multi-region-consistency:
            - EVENTUAL
            - STRONG
        table-class:
            - STANDARD
            - STANDARD_INFREQUENT_ACCESS
documentation:
    command: |-
        Modifies the provisioned throughput settings, global secondary indexes, or DynamoDB Streams settings for a given table.

        You can only perform one of the following operations at once:

        - Modify the provisioned throughput settings of the table.
        - Remove a global secondary index from the table.
        - Create a new global secondary index on the table. After the index begins backfilling, you can use `UpdateTable` to perform other operations.

        `UpdateTable` is an asynchronous operation; while it's executing, the table status changes from `ACTIVE` to `UPDATING`. While it's `UPDATING`, you can't issue another `UpdateTable` request. When the table returns to the `ACTIVE` state, the `UpdateTable` operation is complete.
    flag:
        attribute-definitions: An array of attributes that describe the key schema for the table and indexes. If you are adding a new global secondary index to the table, `AttributeDefinitions` must include the key element(s) of the new index.
        billing-mode: |-
            Controls how you are charged for read and write throughput and how you manage capacity. When switching from pay-per-request to provisioned capacity, initial provisioned capacity values must be set. The initial provisioned capacity values are estimated based on the consumed read and write capacity of your table and global secondary indexes over the past 30 minutes.

            - `PAY_PER_REQUEST` - We recommend using `PAY_PER_REQUEST` for most DynamoDB workloads. `PAY_PER_REQUEST` sets the billing mode to [On-demand capacity mode](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html).
            - `PROVISIONED` - We recommend using `PROVISIONED` for steady workloads with predictable growth where capacity requirements can be reliably forecasted. `PROVISIONED` sets the billing mode to [Provisioned capacity mode](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/provisioned-capacity-mode.html).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deletion-protection-enabled: Indicates whether deletion protection is to be enabled (true) or disabled (false) on the table.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-secondary-index-updates: |-
            An array of one or more global secondary indexes for the table. For each index in the array, you can request one action:

            - `Create` - add a new global secondary index to the table.
            - `Update` - modify the provisioned throughput settings of an existing global secondary index.
            - `Delete` - remove a global secondary index from the table.

            You can create or delete only one global secondary index per `UpdateTable` operation.

            For more information, see [Managing Global Secondary Indexes](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.OnlineOps.html) in the *Amazon DynamoDB Developer Guide*.
        global-table-witness-updates: |-
            A list of witness updates for a MRSC global table. A witness provides a cost-effective alternative to a full replica in a MRSC global table by maintaining replicated change data written to global table replicas. You cannot perform read or write operations on a witness. For each witness, you can request one action:

            - `Create` - add a new witness to the global table.
            - `Delete` - remove a witness from the global table.

            You can create or delete only one witness per `UpdateTable` operation.

            For more information, see [Multi-Region strong consistency (MRSC)](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html#V2globaltables_HowItWorks.consistency-modes) in the Amazon DynamoDB Developer Guide
        multi-region-consistency: |-
            Specifies the consistency mode for a new global table. This parameter is only valid when you create a global table by specifying one or more [Create](https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_ReplicationGroupUpdate.html#DDB-Type-ReplicationGroupUpdate-Create) actions in the [ReplicaUpdates](https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_UpdateTable.html#DDB-UpdateTable-request-ReplicaUpdates) action list.

            You can specify one of the following consistency modes:

            - `EVENTUAL`: Configures a new global table for multi-Region eventual consistency (MREC). This is the default consistency mode for global tables.
            - `STRONG`: Configures a new global table for multi-Region strong consistency (MRSC).

            If you don't specify this field, the global table consistency mode defaults to `EVENTUAL`. For more information about global tables consistency modes, see [Consistency modes](https://docs.aws.amazon.com/V2globaltables_HowItWorks.html#V2globaltables_HowItWorks.consistency-modes) in DynamoDB developer guide.
        on-demand-throughput: Updates the maximum number of read and write units for the specified table in on-demand capacity mode. If you use this parameter, you must specify `MaxReadRequestUnits`, `MaxWriteRequestUnits`, or both.
        provisioned-throughput: The new provisioned throughput settings for the specified table or index.
        replica-updates: A list of replica update actions (create, delete, or update) for the table.
        sse-specification: The new server-side encryption settings for the specified table.
        stream-specification: |-
            Represents the DynamoDB Streams configuration for the table.

            You receive a `ValidationException` if you try to enable a stream on a table that already has a stream, or if you try to disable a stream on a table that doesn't have a stream.
        table-class: The table class of the table to be updated. Valid values are `STANDARD` and `STANDARD_INFREQUENT_ACCESS`.
        table-name: The name of the table to be updated. You can also provide the Amazon Resource Name (ARN) of the table in this parameter.
        warm-throughput: Represents the warm throughput (in read units per second and write units per second) for updating a table.
