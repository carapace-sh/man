name: get-resource-snapshot
description: Use this action to retrieve a specific snapshot record.
flags:
    --catalog=!: Specifies the catalog related to the request.
    --engagement-identifier=!: The unique identifier of the engagement associated with the snapshot.
    --resource-identifier=!: The unique identifier of the specific resource that was snapshotted.
    --resource-snapshot-template-identifier=!: he name of the template that defines the schema for the snapshot.
    --resource-type=!: Specifies the type of resource that was snapshotted.
    --revision=: Specifies which revision of the snapshot to retrieve.
completion:
    flag:
        resource-type:
            - Opportunity
documentation:
    command: Use this action to retrieve a specific snapshot record.
    flag:
        catalog: |-
            Specifies the catalog related to the request. Valid values are:

            - AWS: Retrieves the snapshot from the production AWS environment.
            - Sandbox: Retrieves the snapshot from a sandbox environment used for testing or development purposes.
        engagement-identifier: The unique identifier of the engagement associated with the snapshot. This field links the snapshot to a specific engagement context.
        resource-identifier: The unique identifier of the specific resource that was snapshotted. The format and constraints of this identifier depend on the ResourceType specified. For `Opportunity` type, it will be an `opportunity ID`
        resource-snapshot-template-identifier: he name of the template that defines the schema for the snapshot. This template determines which subset of the resource data is included in the snapshot and must correspond to an existing and valid template for the specified `ResourceType`.
        resource-type: 'Specifies the type of resource that was snapshotted. This field determines the structure and content of the snapshot payload. Valid value includes:`Opportunity`: For opportunity-related data.'
        revision: Specifies which revision of the snapshot to retrieve. If omitted returns the latest revision.
