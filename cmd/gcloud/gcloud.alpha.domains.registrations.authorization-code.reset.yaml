name: reset
description: '*(ALPHA)*  Resets authorization code of a specific Cloud Domains registration.'
documentation:
    command: |-
        *(ALPHA)*  Resets authorization code of a specific registration.

        You can call this API only after 60 days have elapsed since initial
        registration.

        ## EXAMPLES

        To reset authorization code of ``example.com'', run:

          $ gcloud alpha domains registrations authorization-code reset example.com
