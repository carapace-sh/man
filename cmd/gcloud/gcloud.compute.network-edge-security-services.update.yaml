name: update
description: Update a network edge security service.
flags:
    --description=: An optional, textual description for the network edge security service.
    --region=: Region of the network edge security service to update.
    --security-policy-region=: Region of the security policy to operate on.
    --security-policy=: The security policy that will be set for this network edge security service.
documentation:
    command: |-
        *gcloud compute network-edge-security-services update* is used to update network edge security services.

        ## EXAMPLES

        To attach a new security policy 'my-policy' to a network edge security service
        with the name 'my-service' in region 'us-central1', run:

          $ gcloud compute network-edge-security-services update my-service \
            --security-policy=my-policy \
            --region=us-central1

        To remove the security policy attached to a network edge security service
        with the name 'my-service' in region 'us-central1', run:

          $ gcloud compute network-edge-security-services update my-service \
            --security-policy="" \
            --region=us-central1
    flag:
        description: An optional, textual description for the network edge security service.
        region: Region of the network edge security service to update. Overrides the default *compute/region* property value for this command invocation.
        security-policy: The security policy that will be set for this network edge security service. To remove the policy from this network edge security service set the policy to an empty string.
        security-policy-region: Region of the security policy to operate on. Overrides the default *compute/region* property value for this command invocation.
