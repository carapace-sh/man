name: update
description: Update an existing Cloud Bigtable authorized view.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --definition-file=: Path to a JSON or YAML file containing a valid authorized view protobuf.
    --ignore-warnings: If true, changes that make the authorized view more restrictive are allowed.
    --instance=: Name of the Bigtable instance.
    --interactive: If provided, a diff is displayed with a prompt to proceed or cancel the update.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-ignore-warnings&: If true, changes that make the authorized view more restrictive are allowed.
    --no-interactive&: If provided, a diff is displayed with a prompt to proceed or cancel the update.
    --no-pre-encoded&: By default, Base64 encoding is applied to all binary fields ("rowPrefixes", "qualifiers" and
    --pre-encoded: By default, Base64 encoding is applied to all binary fields ("rowPrefixes", "qualifiers" and
    --table=: Name of the Bigtable table.
documentation:
    command: Update an existing Cloud Bigtable authorized view.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        definition-file: |-
            Path to a JSON or YAML file containing a valid authorized view protobuf.
            +
            The `name` field is ignored. The name is deduced from the other command line arguments.
            +
            Example:
            {
              "subsetView":
              {
                "rowPrefixes": ["store1"],
                "familySubsets":
                {
                  "column_family_name":
                  {
                    "qualifiers":["address"],
                    "qualifierPrefixes":["tel"]
                  }
                }
              },
              "deletionProtection": true
            }
        ignore-warnings: If true, changes that make the authorized view more restrictive are allowed.
        instance: |-
            Name of the Bigtable instance.
            +
            To set the `instance` attribute:
            * provide the argument `authorized_view` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        interactive: If provided, a diff is displayed with a prompt to proceed or cancel the update. Enabled by default, use *--no-interactive* to disable.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-ignore-warnings: |
            If true, changes that make the authorized view more restrictive are allowed.
        no-interactive: |
            If provided, a diff is displayed with a prompt to proceed or cancel the update.
        no-pre-encoded: |
            By default, Base64 encoding is applied to all binary fields ("rowPrefixes", "qualifiers" and
            "qualifierPrefixes") in the JSON or YAML definition file.

            Use this to indicate that all binary fields are already Base64-encoded and should be used
            directly.
        pre-encoded: |-
            By default, Base64 encoding is applied to all binary fields ("rowPrefixes", "qualifiers" and
            "qualifierPrefixes") in the JSON or YAML definition file.
            +
            Use this to indicate that all binary fields are already Base64-encoded and should be used
            directly.
        table: |-
            Name of the Bigtable table.
            +
            To set the `table` attribute:
            * provide the argument `authorized_view` on the command line with a fully specified name;
            * provide the argument `--table` on the command line.
