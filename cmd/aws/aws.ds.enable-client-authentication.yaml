name: enable-client-authentication
description: Enables alternative client authentication methods for the specified directory.
flags:
    --directory-id=!: The identifier of the specified directory.
    --type=!: The type of client authentication to enable.
completion:
    flag:
        type:
            - SmartCard
            - SmartCardOrPassword
documentation:
    command: Enables alternative client authentication methods for the specified directory.
    flag:
        directory-id: The identifier of the specified directory.
        type: The type of client authentication to enable. Currently only the value `SmartCard` is supported. Smart card authentication in AD Connector requires that you enable Kerberos Constrained Delegation for the Service User to the LDAP service in your self-managed AD.
