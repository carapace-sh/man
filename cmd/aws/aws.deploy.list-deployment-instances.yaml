name: list-deployment-instances
description: The newer `BatchGetDeploymentTargets` should be used instead because it works with all compute types.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deployment-id=!: The unique ID of a deployment.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-status-filter=:
        description: 'A subset of instances to list by status:'
        nargs: -1
    --instance-type-filter=:
        description: The set of instances in a blue/green deployment, either those in the original environment ("BLUE") or those in the replacement environment ("GREEN"), for which you want to view instance information.
        nargs: -1
    --max-items=: The  total number of items to return in the command's output.
    --next-token=: An identifier returned from the previous list deployment instances call.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: |-
        The newer `BatchGetDeploymentTargets` should be used instead because it works with all compute types. `ListDeploymentInstances` throws an exception if it is used with a compute platform other than EC2/On-premises or Lambda.

        Lists the instance for a deployment associated with the user or Amazon Web Services account.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deployment-id: The unique ID of a deployment.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-status-filter: |-
            A subset of instances to list by status:

            - `Pending`: Include those instances with pending deployments.
            - `InProgress`: Include those instances where deployments are still in progress.
            - `Succeeded`: Include those instances with successful deployments.
            - `Failed`: Include those instances with failed deployments.
            - `Skipped`: Include those instances with skipped deployments.
            - `Unknown`: Include those instances with deployments in an unknown state.
        instance-type-filter: The set of instances in a blue/green deployment, either those in the original environment ("BLUE") or those in the replacement environment ("GREEN"), for which you want to view instance information.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        next-token: An identifier returned from the previous list deployment instances call. It can be used to return the next set of deployment instances in the list.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
