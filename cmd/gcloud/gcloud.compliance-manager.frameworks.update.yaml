name: update
description: Update a framework.
hidden: true
flags:
    --add-category=: Add new value to category list.
    --add-cloud-control-details=: Add new value to cloud_control_details list.
    --category=: Set category to new value.
    --clear-category: Clear category value and set to empty list.
    --clear-cloud-control-details: Clear cloud_control_details value and set to empty list.
    --cloud-control-details=: Set cloud_control_details to new value.
    --description=: The description of the framework.
    --display-name=: The friendly name of the framework.
    --location=: The location id of the framework resource.
    --major-revision-id=: The major version ID of the framework to update.
    --no-clear-category&: Clear category value and set to empty list.
    --no-clear-cloud-control-details&: Clear cloud_control_details value and set to empty list.
    --organization=: The organization id of the framework resource.
    --remove-category=: Remove existing value from category list.
    --remove-cloud-control-details=: Remove existing value from cloud_control_details list.
documentation:
    command: |
        Update a specific framework.
    flag:
        add-category: |-
            Add new value to category list. _ADD_CATEGORY_ must be one of:
            +
            *assured-workloads*::: An Assured Workloads framework.
            *custom-framework*::: A user-created framework.
            *data-security*::: A data security posture framework.
            *google-best-practices*::: A Google's best practices framework.
            *industry-defined-standard*::: An industry-defined framework.
            :::
            +
        add-cloud-control-details: |-
            Add new value to cloud_control_details list. The cloud control details that are directly added without any
            grouping in the framework.
            +
            *majorRevisionId*:::
            The major version of the cloud control.
            +
            *name*:::
            The name of the cloud control, in the format
            `organizations/{organization}/locations/{location}/cloudControls/{cloud-control}`.
            The only supported location is `global`.
            +
            *parameters*:::
            Parameters are key-value pairs that let you provide your custom location
            requirements, environment requirements, or other settings that are
            relevant to the cloud control. An example parameter is
            `{"name": "location","value": "us-west-1"}`.
            +
            *name*::::
            The name or key of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-cloud-control-details=majorRevisionId=int,name=string,parameters=[{name=string}] --add-cloud-control-details=majorRevisionId=int,name=string,parameters=[{name=string}]
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-cloud-control-details='[{"majorRevisionId": int, "name": "string", "parameters": [{"name": "string"}]}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-cloud-control-details=path_to_file.(yaml|json)
            +
            ```
        category: |-
            Set category to new value. _CATEGORY_ must be one of:
            +
            *assured-workloads*::: An Assured Workloads framework.
            *custom-framework*::: A user-created framework.
            *data-security*::: A data security posture framework.
            *google-best-practices*::: A Google's best practices framework.
            *industry-defined-standard*::: An industry-defined framework.
            :::
            +
        clear-category: Clear category value and set to empty list.
        clear-cloud-control-details: Clear cloud_control_details value and set to empty list.
        cloud-control-details: |-
            Set cloud_control_details to new value. The cloud control details that are directly added without any
            grouping in the framework.
            +
            *majorRevisionId*:::
            The major version of the cloud control.
            +
            *name*:::
            The name of the cloud control, in the format
            `organizations/{organization}/locations/{location}/cloudControls/{cloud-control}`.
            The only supported location is `global`.
            +
            *parameters*:::
            Parameters are key-value pairs that let you provide your custom location
            requirements, environment requirements, or other settings that are
            relevant to the cloud control. An example parameter is
            `{"name": "location","value": "us-west-1"}`.
            +
            *name*::::
            The name or key of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --cloud-control-details=majorRevisionId=int,name=string,parameters=[{name=string}] --cloud-control-details=majorRevisionId=int,name=string,parameters=[{name=string}]
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --cloud-control-details='[{"majorRevisionId": int, "name": "string", "parameters": [{"name": "string"}]}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --cloud-control-details=path_to_file.(yaml|json)
            +
            ```
        description: The description of the framework. The maximum length is 2000 characters.
        display-name: The friendly name of the framework. The maximum length is 200 characters.
        location: |-
            The location id of the framework resource.
            +
            To set the `location` attribute:
            * provide the argument `framework` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        major-revision-id: The major version ID of the framework to update.
        no-clear-category: Clear category value and set to empty list.
        no-clear-cloud-control-details: Clear cloud_control_details value and set to empty list.
        organization: |-
            The organization id of the framework resource.
            +
            To set the `organization` attribute:
            * provide the argument `framework` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        remove-category: |-
            Remove existing value from category list. _REMOVE_CATEGORY_ must be one of:
            +
            *assured-workloads*::: An Assured Workloads framework.
            *custom-framework*::: A user-created framework.
            *data-security*::: A data security posture framework.
            *google-best-practices*::: A Google's best practices framework.
            *industry-defined-standard*::: An industry-defined framework.
            :::
            +
        remove-cloud-control-details: |-
            Remove existing value from cloud_control_details list. The cloud control details that are directly added without any
            grouping in the framework.
            +
            *majorRevisionId*:::
            The major version of the cloud control.
            +
            *name*:::
            The name of the cloud control, in the format
            `organizations/{organization}/locations/{location}/cloudControls/{cloud-control}`.
            The only supported location is `global`.
            +
            *parameters*:::
            Parameters are key-value pairs that let you provide your custom location
            requirements, environment requirements, or other settings that are
            relevant to the cloud control. An example parameter is
            `{"name": "location","value": "us-west-1"}`.
            +
            *name*::::
            The name or key of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-cloud-control-details=majorRevisionId=int,name=string,parameters=[{name=string}] --remove-cloud-control-details=majorRevisionId=int,name=string,parameters=[{name=string}]
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-cloud-control-details='[{"majorRevisionId": int, "name": "string", "parameters": [{"name": "string"}]}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-cloud-control-details=path_to_file.(yaml|json)
            +
            ```
