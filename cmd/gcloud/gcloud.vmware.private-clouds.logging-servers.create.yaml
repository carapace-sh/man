name: create
description: Create a Google Cloud VMware Engine logging-server.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --hostname=!: Fully-qualified domain name (FQDN) or IP Address of the logging server.
    --location=: Location of the private cloud or cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --port=!: Port number at which the logging server receives logs.
    --private-cloud=: VMware Engine private cloud.
    --protocol=!: Defines possible protocols used to send logs to
    --source-type=!: The type of component that produces logs that will be forwarded
completion:
    flag:
        protocol:
            - UDP
            - TCP
            - TLS
            - SSL
            - RELP
        source-type:
            - VCSA
            - ESXI
documentation:
    command: |
        Create a logging-server in a VMware Engine private cloud to forward VCSA or ESXI logs to it.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        hostname: Fully-qualified domain name (FQDN) or IP Address of the logging server.
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `logging_server` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        port: Port number at which the logging server receives logs.
        private-cloud: |-
            VMware Engine private cloud.
            +
            To set the `private-cloud` attribute:
            * provide the argument `logging_server` on the command line with a fully specified name;
            * provide the argument `--private-cloud` on the command line.
        protocol: |-
            Defines possible protocols used to send logs to
            a logging server. _PROTOCOL_ must be one of: *UDP*, *TCP*, *TLS*, *SSL*, *RELP*.
        source-type: |-
            The type of component that produces logs that will be forwarded
            to this logging server. _SOURCE_TYPE_ must be one of: *VCSA*, *ESXI*.
