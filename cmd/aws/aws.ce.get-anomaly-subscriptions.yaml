name: get-anomaly-subscriptions
description: Retrieves the cost anomaly subscription objects for your account.
flags:
    --max-results=: The number of entries a paginated response contains.
    --monitor-arn=: Cost anomaly monitor ARNs.
    --next-page-token=: The token to retrieve the next set of results.
    --subscription-arn-list=: A list of cost anomaly subscription ARNs.
documentation:
    command: Retrieves the cost anomaly subscription objects for your account. You can filter using a list of cost anomaly monitor Amazon Resource Names (ARNs).
    flag:
        max-results: The number of entries a paginated response contains.
        monitor-arn: Cost anomaly monitor ARNs.
        next-page-token: The token to retrieve the next set of results. Amazon Web Services provides the token when the response from a previous call has more results than the maximum page size.
        subscription-arn-list: A list of cost anomaly subscription ARNs.
