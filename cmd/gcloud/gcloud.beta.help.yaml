name: help
description: '*(BETA)*  Search gcloud help text.'
flags:
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --page-size=: Some services group resource list output into pages.
    --sort-by=: Comma-separated list of resource field key names to sort by.
documentation:
    command: |-
        *(BETA)*  If a full gcloud command is specified after the ``help'' operand, gcloud beta help
        prints a detailed help message for that command.

        Otherwise, gcloud beta help runs a search for all commands with help text matching
        the given argument or arguments. It prints the command name and a summary of
        the help text for any command that it finds as a result.

        To run a search directly, you can use remainder arguments, following a `--`.

        By default, command results are displayed in a table that shows the name
        of the command and snippets of the help text that relate to your search terms.

        By default, search results are sorted from most to least relevant by default,
        using a localized rating based on several heuristics. These heuristics may
        change in future runs of this command.

        ## EXAMPLES

        To get the help for the command `gcloud projects describe`, run:

          $ gcloud beta help projects describe

        To search for all commands whose help text contains the word `project`, run:

          $ gcloud beta help -- project

        To search for commands whose help text contains the word `project` and the
        string `--foo`, run:

          $ gcloud beta help -- project --foo

        To search and receive more than the default limit of 5 search results, run:

          $ gcloud beta help --limit=20 -- project

        To search for a term and sort the results by a different characteristic, such
        as command name, run:

          $ gcloud beta help --sort-by=name -- project
    flag:
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *5*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
             The default is *~relevance*.
