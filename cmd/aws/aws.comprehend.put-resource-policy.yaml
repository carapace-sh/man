name: put-resource-policy
description: Attaches a resource-based policy to a custom model.
flags:
    --policy-revision-id=: The revision ID that Amazon Comprehend assigned to the policy that you are updating.
    --resource-arn=!: The Amazon Resource Name (ARN) of the custom model to attach the policy to.
    --resource-policy=!: The JSON resource-based policy to attach to your custom model.
documentation:
    command: Attaches a resource-based policy to a custom model. You can use this policy to authorize an entity in another Amazon Web Services account to import the custom model, which replicates it in Amazon Comprehend in their account.
    flag:
        policy-revision-id: The revision ID that Amazon Comprehend assigned to the policy that you are updating. If you are creating a new policy that has no prior version, don't use this parameter. Amazon Comprehend creates the revision ID for you.
        resource-arn: The Amazon Resource Name (ARN) of the custom model to attach the policy to.
        resource-policy: |-
            The JSON resource-based policy to attach to your custom model. Provide your JSON as a UTF-8 encoded string without line breaks. To provide valid JSON for your policy, enclose the attribute names and values in double quotes. If the JSON body is also enclosed in double quotes, then you must escape the double quotes that are inside the policy:

            `"{\"attribute\": \"value\", \"attribute\": [\"value\"]}"`

            To avoid escaping quotes, you can use single quotes to enclose the policy and double quotes to enclose the JSON names and values:

            `'{"attribute": "value", "attribute": ["value"]}'`
