name: describe
description: Describe a Google Cloud VMware HCX activation key.
flags:
    --location=: Location of the private cloud or cluster.
    --private-cloud=: VMware Engine private cloud.
documentation:
    command: |
        Display data associated with an HCX activation key, such as the key itself, its resource name, and when it was created.
    flag:
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `hcx_activation_key` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        private-cloud: |-
            VMware Engine private cloud.
            +
            To set the `private-cloud` attribute:
            * provide the argument `hcx_activation_key` on the command line with a fully specified name;
            * provide the argument `--private-cloud` on the command line.
