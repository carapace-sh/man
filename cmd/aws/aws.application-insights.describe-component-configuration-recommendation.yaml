name: describe-component-configuration-recommendation
description: Describes the recommended monitoring configuration of the component.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --component-name=!: The name of the component.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --recommendation-type=: The recommended configuration type.
    --resource-group-name=!: The name of the resource group.
    --tier=!: The tier of the application component.
    --workload-name=: The name of the workload.
completion:
    flag:
        recommendation-type:
            - INFRA_ONLY
            - WORKLOAD_ONLY
            - ALL
        tier:
            - CUSTOM
            - DEFAULT
            - DOT_NET_CORE
            - DOT_NET_WORKER
            - DOT_NET_WEB_TIER
            - DOT_NET_WEB
            - SQL_SERVER
            - SQL_SERVER_ALWAYSON_AVAILABILITY_GROUP
            - MYSQL
            - POSTGRESQL
            - JAVA_JMX
            - ORACLE
            - SAP_HANA_MULTI_NODE
            - SAP_HANA_SINGLE_NODE
            - SAP_HANA_HIGH_AVAILABILITY
            - SAP_ASE_SINGLE_NODE
            - SAP_ASE_HIGH_AVAILABILITY
            - SQL_SERVER_FAILOVER_CLUSTER_INSTANCE
            - SHAREPOINT
            - ACTIVE_DIRECTORY
            - SAP_NETWEAVER_STANDARD
            - SAP_NETWEAVER_DISTRIBUTED
            - SAP_NETWEAVER_HIGH_AVAILABILITY
documentation:
    command: Describes the recommended monitoring configuration of the component.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        component-name: The name of the component.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        recommendation-type: The recommended configuration type.
        resource-group-name: The name of the resource group.
        tier: The tier of the application component.
        workload-name: The name of the workload. The name of the workload is required when the tier of the application component is `SAP_ASE_SINGLE_NODE` or `SAP_ASE_HIGH_AVAILABILITY`.
