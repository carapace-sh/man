name: create
description: '*(ALPHA)*  Create a GitHub Enterprise Config for use by Cloud Build.'
flags:
    --app-id=!: The app id of the GitHub app that should be associated with this config.
    --gcs-bucket=!: The Cloud Storage bucket containing the credential payload.
    --gcs-object=!: The Cloud Storage object containing the credential payload.
    --generation=: The object generation to read the credential payload from.
    --host-uri=!: The host uri of the GitHub Enterprise Server.
    --name=!: The name of the GitHub Enterprise config.
    --oauth-client-id-name=!: Secret Manager resource containing the oauth client id.
    --oauth-client-id-version-name=: Secret Manager SecretVersion resource containing the oauth client id.
    --oauth-secret-name=!: Secret Manager resource containing the oauth secret.
    --oauth-secret-version-name=: Secret Manager SecretVersion resource containing the oauth secret.
    --peered-network=: VPC network that should be used when making calls to the GitHub Enterprise Server.
    --private-key-name=!: Secret Manager resource containing the private key.
    --private-key-version-name=: Secret Manager SecretVersion resource containing the private key.
    --region=!: The region of the Cloud Build Service to use.
    --webhook-key=: The unique identifier that Cloud Build expects to be set as the value for
    --webhook-secret-name=!: Secret Manager resource containing the webhook key.
    --webhook-secret-version-name=: Secret Manager SecretVersion resource containing the webhook key.
documentation:
    command: '*(ALPHA)*  Create a GitHub Enterprise Config for use by Cloud Build.'
    flag:
        app-id: The app id of the GitHub app that should be associated with this config.
        gcs-bucket: The Cloud Storage bucket containing the credential payload.
        gcs-object: The Cloud Storage object containing the credential payload.
        generation: |-
            The object generation to read the credential payload from.
            +
            If this is not set, Cloud Build will read the latest version.
        host-uri: The host uri of the GitHub Enterprise Server.
        name: The name of the GitHub Enterprise config.
        oauth-client-id-name: Secret Manager resource containing the oauth client id.
        oauth-client-id-version-name: Secret Manager SecretVersion resource containing the oauth client id.
        oauth-secret-name: Secret Manager resource containing the oauth secret.
        oauth-secret-version-name: Secret Manager SecretVersion resource containing the oauth secret.
        peered-network: |-
            VPC network that should be used when making calls to the GitHub Enterprise Server.
            +
            If not specified, calls will be made over the public internet.
        private-key-name: Secret Manager resource containing the private key.
        private-key-version-name: Secret Manager SecretVersion resource containing the private key.
        region: |-
            The region of the Cloud Build Service to use.
            Must be set to a supported region
            name (e.g. `us-central1`).
            If unset, `builds/region`, which is the default
            region to use when working with Cloud Build resources, is used. If builds/region
            is unset, region is set to `global`.
        webhook-key: |-
            The unique identifier that Cloud Build expects to be set as the value for
            the query field `webhook_key` on incoming webhook requests.
            +
            If this is not set, Cloud Build will generate one on the user's behalf.
        webhook-secret-name: Secret Manager resource containing the webhook key.
        webhook-secret-version-name: Secret Manager SecretVersion resource containing the webhook key.
