name: get-comment
description: Returns the content of a comment made on a change, file, or commit in a repository.
flags:
    --comment-id=!: The unique, system-generated ID of the comment.
documentation:
    command: |-
        Returns the content of a comment made on a change, file, or commit in a repository.

        Reaction counts might include numbers from user identities who were deleted after the reaction was made. For a count of reactions from active identities, use GetCommentReactions.
    flag:
        comment-id: The unique, system-generated ID of the comment. To get this ID, use [GetCommentsForComparedCommit]() or [GetCommentsForPullRequest]().
