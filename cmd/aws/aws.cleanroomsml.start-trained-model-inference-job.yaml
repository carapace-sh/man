name: start-trained-model-inference-job
description: Defines the information necessary to begin a trained model inference job.
flags:
    --configured-model-algorithm-association-arn=: The Amazon Resource Name (ARN) of the configured model algorithm association that is used for this trained model inference job.
    --container-execution-parameters=: The execution parameters for the container.
    --data-source=!: Defines the data source that is used for the trained model inference job.
    --description=: The description of the trained model inference job.
    --environment=: The environment variables to set in the Docker container.
    --kms-key-arn=: The Amazon Resource Name (ARN) of the KMS key.
    --membership-identifier=!: The membership ID of the membership that contains the trained model inference job.
    --name=!: The name of the trained model inference job.
    --output-configuration=!: Defines the output configuration information for the trained model inference job.
    --resource-config=!: Defines the resource configuration for the trained model inference job.
    --tags=: The optional metadata that you apply to the resource to help you categorize and organize them.
    --trained-model-arn=!: The Amazon Resource Name (ARN) of the trained model that is used for this trained model inference job.
    --trained-model-version-identifier=: The version identifier of the trained model to use for inference.
documentation:
    command: Defines the information necessary to begin a trained model inference job.
    flag:
        configured-model-algorithm-association-arn: The Amazon Resource Name (ARN) of the configured model algorithm association that is used for this trained model inference job.
        container-execution-parameters: The execution parameters for the container.
        data-source: Defines the data source that is used for the trained model inference job.
        description: The description of the trained model inference job.
        environment: The environment variables to set in the Docker container.
        kms-key-arn: The Amazon Resource Name (ARN) of the KMS key. This key is used to encrypt and decrypt customer-owned data in the ML inference job and associated data.
        membership-identifier: The membership ID of the membership that contains the trained model inference job.
        name: The name of the trained model inference job.
        output-configuration: Defines the output configuration information for the trained model inference job.
        resource-config: Defines the resource configuration for the trained model inference job.
        tags: |-
            The optional metadata that you apply to the resource to help you categorize and organize them. Each tag consists of a key and an optional value, both of which you define.

            The following basic restrictions apply to tags:

            - Maximum number of tags per resource - 50.
            - For each resource, each tag key must be unique, and each tag key can have only one value.
            - Maximum key length - 128 Unicode characters in UTF-8.
            - Maximum value length - 256 Unicode characters in UTF-8.
            - If your tagging schema is used across multiple services and resources, remember that other services may have restrictions on allowed characters. Generally allowed characters are: letters, numbers, and spaces representable in UTF-8, and the following characters: + - = . _ : / @.
            - Tag keys and values are case sensitive.
            - Do not use aws:, AWS:, or any upper or lowercase combination of such as a prefix for keys as it is reserved for AWS use. You cannot edit or delete tag keys with this prefix. Values can have this prefix. If a tag value has aws as its prefix but the key does not, then Clean Rooms ML considers it to be a user tag and will count against the limit of 50 tags. Tags with only the key prefix of aws do not count against your tags per resource limit.
        trained-model-arn: The Amazon Resource Name (ARN) of the trained model that is used for this trained model inference job.
        trained-model-version-identifier: The version identifier of the trained model to use for inference. This specifies which version of the trained model should be used to generate predictions on the input data.
