name: rollback
description: '*(BETA)*  Rollback a node-pool upgrade.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cluster=: The cluster from which to rollback the node pool.
    --location=: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Compute region (e.g. us-central1) for a regional cluster.
    --respect-pdb=: Indicates whether node pool rollbacks should respect pod disruption budgets.
    --timeout=&: THIS ARGUMENT NEEDS HELP TEXT.
    --zone=: Compute zone (e.g. us-central1-a) for a zonal cluster.
documentation:
    command: |4
                *(BETA)*  Rollback a node-pool upgrade.

        Rollback is a method used after a canceled or failed node-pool upgrade. It
        makes a best-effort attempt to revert the pool back to its original state.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster: The cluster from which to rollback the node pool. Overrides the default *container/cluster* property value for this command invocation.
        location: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster. Overrides the default compute/region or compute/zone value for this command invocation. Prefer using this flag over the --region or --zone flags.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: Compute region (e.g. us-central1) for a regional cluster. Overrides the default compute/region property value for this command invocation.
        respect-pdb: Indicates whether node pool rollbacks should respect pod disruption budgets.
        timeout: THIS ARGUMENT NEEDS HELP TEXT.
        zone: Compute zone (e.g. us-central1-a) for a zonal cluster. Overrides the default compute/zone property value for this command invocation.
