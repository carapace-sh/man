name: update-interface
description: '*(BETA)*  Update an interface on a Compute Engine router.'
flags:
    --interconnect-attachment-region=: Region of the interconnectAttachment to operate on.
    --interconnect-attachment=: The interconnect attachment of the interface being updated.
    --interface-name=!: The name of the interface being updated.
    --ip-address=: The link local (IPv4) or ULA (IPv6) address of the router for this interface.
    --ip-version=: IP version of the interface.
    --mask-length=: The subnet mask for the IP range of the interface.
    --region=: Region of the router to update.
    --vpn-tunnel-region=: Region of the vpn tunnel to operate on.
    --vpn-tunnel=: The tunnel of the interface being updated.
completion:
    flag:
        ip-version:
            - IPV4
            - IPV6
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute routers update-interface* is used to update an interface on a Compute Engine
        router.
    flag:
        interconnect-attachment: The interconnect attachment of the interface being updated.
        interconnect-attachment-region: Region of the interconnectAttachment to operate on. If not specified it will be set to the region of the router. Overrides the default *compute/region* property value for this command invocation.
        interface-name: The name of the interface being updated.
        ip-address: The link local (IPv4) or ULA (IPv6) address of the router for this interface.
        ip-version: |-
            IP version of the interface. Possible values are IPV4 and IPV6. Defaults to IPV4. _IP_VERSION_ must be one of:
            +
            *IPV4*::: Interface with IPv4-based BGP.
            *IPV6*::: Interface with IPv6-based BGP.
            :::
            +
        mask-length: The subnet mask for the IP range of the interface. The interface IP address and BGP peer IP address must be selected from the subnet defined by this range.
        region: |-
            Region of the router to update. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        vpn-tunnel: The tunnel of the interface being updated.
        vpn-tunnel-region: Region of the vpn tunnel to operate on. If not specified it will be set to the region of the router. Overrides the default *compute/region* property value for this command invocation.
