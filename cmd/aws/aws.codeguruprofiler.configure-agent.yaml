name: configure-agent
description: Used by profiler agents to report their current state and to receive remote configuration updates.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --fleet-instance-id=: A universally unique identifier (UUID) for a profiling instance.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metadata=: Metadata captured about the compute platform the agent is running on.
    --profiling-group-name=!: The name of the profiling group for which the configured agent is collecting profiling data.
documentation:
    command: Used by profiler agents to report their current state and to receive remote configuration updates. For example, `ConfigureAgent` can be used to tell an agent whether to profile or not and for how long to return profiling data.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        fleet-instance-id: A universally unique identifier (UUID) for a profiling instance. For example, if the profiling instance is an Amazon EC2 instance, it is the instance ID. If it is an AWS Fargate container, it is the container's task ID.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metadata: |-
            Metadata captured about the compute platform the agent is running on. It includes information about sampling and reporting. The valid fields are:

            - `COMPUTE_PLATFORM` - The compute platform on which the agent is running
            - `AGENT_ID` - The ID for an agent instance.
            - `AWS_REQUEST_ID` - The AWS request ID of a Lambda invocation.
            - `EXECUTION_ENVIRONMENT` - The execution environment a Lambda function is running on.
            - `LAMBDA_FUNCTION_ARN` - The Amazon Resource Name (ARN) that is used to invoke a Lambda function.
            - `LAMBDA_MEMORY_LIMIT_IN_MB` - The memory allocated to a Lambda function.
            - `LAMBDA_REMAINING_TIME_IN_MILLISECONDS` - The time in milliseconds before execution of a Lambda function times out.
            - `LAMBDA_TIME_GAP_BETWEEN_INVOKES_IN_MILLISECONDS` - The time in milliseconds between two invocations of a Lambda function.
            - `LAMBDA_PREVIOUS_EXECUTION_TIME_IN_MILLISECONDS` - The time in milliseconds for the previous Lambda invocation.
        profiling-group-name: The name of the profiling group for which the configured agent is collecting profiling data.
