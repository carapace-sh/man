name: describe
description: '*(BETA)*  Gets a single Parameter Manager parameter.'
hidden: true
flags:
    --location=: The location id of the parameter resource.
documentation:
    command: |
        *(BETA)*  Gets a single parameter resource.
    flag:
        location: |-
            The location id of the parameter resource.
            +
            To set the `location` attribute:
            * provide the argument `parameter` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
