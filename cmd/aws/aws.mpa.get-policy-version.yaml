name: get-policy-version
description: Returns details for the version of a policy.
flags:
    --policy-version-arn=!: Amazon Resource Name (ARN) for the policy.
documentation:
    command: |-
        Returns details for the version of a policy. Policies define the permissions for team resources.

        The protected operation for a service integration might require specific permissions. For more information, see [How other services work with Multi-party approval](https://docs.aws.amazon.com/mpa/latest/userguide/mpa-integrations.html) in the *Multi-party approval User Guide*.
    flag:
        policy-version-arn: Amazon Resource Name (ARN) for the policy.
