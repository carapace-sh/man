name: export
description: Export an Artifact Registry package version.
flags:
    --gcs-destination=!: Google Cloud Storage path to export the artifact to.
    --location=: Location of the version.
    --package=: Package of the version.
    --repository=: Repository of the version.
documentation:
    command: |-
        Export files of an Artifact Registry package version to a Google Cloud Storage
        path.
    flag:
        gcs-destination: Google Cloud Storage path to export the artifact to.
        location: |-
            Location of the version.
            +
            To set the `location` attribute:
            * provide the argument `version` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        package: |-
            Package of the version.
            +
            To set the `package` attribute:
            * provide the argument `version` on the command line with a fully specified name;
            * provide the argument `--package` on the command line.
        repository: |-
            Repository of the version.
            +
            To set the `repository` attribute:
            * provide the argument `version` on the command line with a fully specified name;
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
