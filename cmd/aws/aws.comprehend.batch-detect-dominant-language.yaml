name: batch-detect-dominant-language
description: Determines the dominant language of the input text for a batch of documents.
flags:
    --text-list=!: A list containing the UTF-8 encoded text of the input documents.
documentation:
    command: Determines the dominant language of the input text for a batch of documents. For a list of languages that Amazon Comprehend can detect, see [Amazon Comprehend Supported Languages](https://docs.aws.amazon.com/comprehend/latest/dg/how-languages.html).
    flag:
        text-list: A list containing the UTF-8 encoded text of the input documents. The list can contain a maximum of 25 documents. Each document should contain at least 20 characters. The maximum size of each document is 5 KB.
