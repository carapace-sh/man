name: remove-datapoints
description: Remove data points from the specified index.
flags:
    --datapoint-ids=: List of index datapoint ids to be removed from the index.
    --datapoints-from-file=: Path to a local JSON file that contains the data points that need to be added to the index.
    --region=: Cloud region for the index.
documentation:
    command: |-
        ## EXAMPLES

        To remove datapoints from an index '123', run:

          $ gcloud ai indexes remove-datapoints 123 --datapoint-ids=example1,example2
          --project=example --region=us-central1

        Or put datapoint ids in a json file and run:

          $ gcloud ai indexes remove-datapoints 123 --datapoints-from-file=example.json
          --project=example --region=us-central1
    flag:
        datapoint-ids: List of index datapoint ids to be removed from the index.
        datapoints-from-file: Path to a local JSON file that contains the data points that need to be added to the index.
        region: |-
            Cloud region for the index.
            +
            To set the `region` attribute:
            * provide the argument `index` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
