name: describe
description: '*(ALPHA)*  Get metadata for a keyring.'
flags:
    --location=: The Google Cloud location for the keyring.
documentation:
    command: |-
        *(ALPHA)*  Returns metadata for the given keyring.

        ## EXAMPLES

        The following command returns the metadata for the keyring `towers`
        in the location `us-east1`:

          $ gcloud alpha kms keyrings describe towers --location=us-east1
    flag:
        location: |-
            The Google Cloud location for the keyring.
            +
            To set the `location` attribute:
            * provide the argument `keyring` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
