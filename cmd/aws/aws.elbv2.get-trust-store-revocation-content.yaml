name: get-trust-store-revocation-content
description: Retrieves the specified revocation file.
flags:
    --revocation-id=!: The revocation ID of the revocation file.
    --trust-store-arn=!: The Amazon Resource Name (ARN) of the trust store.
documentation:
    command: |-
        Retrieves the specified revocation file.

        This action returns a pre-signed S3 URI which is active for ten minutes.
    flag:
        revocation-id: The revocation ID of the revocation file.
        trust-store-arn: The Amazon Resource Name (ARN) of the trust store.
