name: migrate
description: '*(ALPHA)*  Migrate a Prometheus configuration file to Cloud Monitoring.'
flags:
    --channels-from-prometheus-alertmanager-yaml=: Prometheus alert manager YAML file to be converted to Cloud Monitoring notification channels.
    --policies-from-prometheus-alert-rules-yaml=: One or more Prometheus alert rule YAML files (separated by commas if multiple) to be converted to Cloud Alerting Policies.
documentation:
    command: |
        *(ALPHA)*  Creates new alerting policies and/or notification channels based on
        provided Prometheus files. The rules YAML file, which holds the alert
        rules, must be specified as a file through the
        `--policies-from-prometheus-alert-rules-yaml` flag.
    flag:
        channels-from-prometheus-alertmanager-yaml: Prometheus alert manager YAML file to be converted to Cloud Monitoring notification channels. Specifying this flag with the --policies-from-prometheus-alert-rules-yaml flag puts the newly created notification channels into the translated Alert Policies' definition. Use a full or relative path to a local file containing the value of channels_from_prometheus_alertmanager_yaml.
        policies-from-prometheus-alert-rules-yaml: 'One or more Prometheus alert rule YAML files (separated by commas if multiple) to be converted to Cloud Alerting Policies. Example: --policies-from-prometheus-alert-rules-yaml=rules_1.yaml,rules_2.yaml'
