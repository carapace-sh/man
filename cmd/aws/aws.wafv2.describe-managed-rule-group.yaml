name: describe-managed-rule-group
description: Provides high-level information for a managed rule group, including descriptions of the rules.
flags:
    --name=!: The name of the managed rule group.
    --scope=!: Specifies whether this is for a global resource type, such as a Amazon CloudFront distribution.
    --vendor-name=!: The name of the managed rule group vendor.
    --version-name=: The version of the rule group.
completion:
    flag:
        scope:
            - CLOUDFRONT
            - REGIONAL
documentation:
    command: Provides high-level information for a managed rule group, including descriptions of the rules.
    flag:
        name: The name of the managed rule group. You use this, along with the vendor name, to identify the rule group.
        scope: |-
            Specifies whether this is for a global resource type, such as a Amazon CloudFront distribution. For an Amplify application, use `CLOUDFRONT`.

            To work with CloudFront, you must also specify the Region US East (N. Virginia) as follows:

            - CLI - Specify the Region when you use the CloudFront scope: `--scope=CLOUDFRONT --region=us-east-1`.
            - API and SDKs - For all calls, use the Region endpoint us-east-1.
        vendor-name: The name of the managed rule group vendor. You use this, along with the rule group name, to identify a rule group.
        version-name: The version of the rule group. You can only use a version that is not scheduled for expiration. If you don't provide this, WAF uses the vendor's default version.
