name: describe
description: '*(ALPHA)*  Describe a worker pool.'
hidden: true
flags:
    --instance=: Instance name.
documentation:
    command: |
        *(ALPHA)*  Display the configuration of the specified worker pool.  Shows the current state of the
        worker pool, how many workers are in the pool, as well as the machine configuration for
        those workers (the Compute Engine machine-type as well as disk size).
    flag:
        instance: |-
            Instance name.
            +

            To set the `instance` attribute:
            * provide the argument `workerpool` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
