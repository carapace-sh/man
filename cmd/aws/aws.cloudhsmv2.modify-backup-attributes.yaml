name: modify-backup-attributes
description: Modifies attributes for CloudHSM backup.
flags:
    --backup-id=!: The identifier (ID) of the backup to modify.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --never-expires!: Specifies whether the service should exempt a backup from the retention policy for the cluster.
    --no-never-expires!: Specifies whether the service should exempt a backup from the retention policy for the cluster.
documentation:
    command: |-
        Modifies attributes for CloudHSM backup.

        **Cross-account use:** No. You cannot perform this operation on an CloudHSM backup in a different Amazon Web Services account.
    flag:
        backup-id: The identifier (ID) of the backup to modify. To find the ID of a backup, use the [DescribeBackups]() operation.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        never-expires: Specifies whether the service should exempt a backup from the retention policy for the cluster. `True` exempts a backup from the retention policy. `False` means the service applies the backup retention policy defined at the cluster.
