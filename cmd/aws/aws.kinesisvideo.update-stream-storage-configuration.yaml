name: update-stream-storage-configuration
description: Updates the storage configuration for an existing Kinesis video stream.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --current-version=!: The version of the stream whose storage configuration you want to change.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --stream-arn=: The Amazon Resource Name (ARN) of the stream for which you want to update the storage configuration.
    --stream-name=: The name of the stream for which you want to update the storage configuration.
    --stream-storage-configuration=!: The new storage configuration for the stream.
documentation:
    command: |-
        Updates the storage configuration for an existing Kinesis video stream.

        This operation allows you to modify the storage tier settings for a stream, enabling you to optimize storage costs and performance based on your access patterns.

        `UpdateStreamStorageConfiguration` is an asynchronous operation.

        You must have permissions for the `KinesisVideo:UpdateStreamStorageConfiguration` action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        current-version: The version of the stream whose storage configuration you want to change. To get the version, call either the `DescribeStream` or the `ListStreams` API.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        stream-arn: The Amazon Resource Name (ARN) of the stream for which you want to update the storage configuration.
        stream-name: The name of the stream for which you want to update the storage configuration.
        stream-storage-configuration: |-
            The new storage configuration for the stream. This includes the default storage tier that determines how stream data is stored and accessed.

            Different storage tiers offer varying levels of performance and cost optimization to match your specific use case requirements.
