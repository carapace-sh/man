name: get-case-audit-events
description: Returns the audit history about a specific case if it exists.
flags:
    --case-id=!: A unique identifier of the case.
    --domain-id=!: The unique identifier of the Cases domain.
    --max-results=: The maximum number of audit events to return.
    --next-token=: The token for the next set of results.
documentation:
    command: Returns the audit history about a specific case if it exists.
    flag:
        case-id: A unique identifier of the case.
        domain-id: The unique identifier of the Cases domain.
        max-results: The maximum number of audit events to return. When no value is provided, 25 is the default.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
