name: delete-document
description: Deletes the Amazon Web Services Systems Manager document (SSM document) and all managed node associations to the document.
flags:
    --document-version=: The version of the document that you want to delete.
    --force: Some SSM document types require that you specify a `Force` flag before you can delete the document.
    --name=!: The name of the document.
    --no-force&: Some SSM document types require that you specify a `Force` flag before you can delete the document.
    --version-name=: The version name of the document that you want to delete.
documentation:
    command: |-
        Deletes the Amazon Web Services Systems Manager document (SSM document) and all managed node associations to the document.

        Before you delete the document, we recommend that you use [DeleteAssociation]() to disassociate all managed nodes that are associated with the document.
    flag:
        document-version: The version of the document that you want to delete. If not provided, all versions of the document are deleted.
        force: Some SSM document types require that you specify a `Force` flag before you can delete the document. For example, you must specify a `Force` flag to delete a document of type `ApplicationConfigurationSchema`. You can restrict access to the `Force` flag in an Identity and Access Management (IAM) policy.
        name: The name of the document.
        version-name: The version name of the document that you want to delete. If not provided, all versions of the document are deleted.
