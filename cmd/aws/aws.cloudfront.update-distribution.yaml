name: update-distribution
description: Updates the configuration for a CloudFront distribution.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-root-object=: The object that you want CloudFront to return.
    --distribution-config=!: The distribution's configuration information.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The distribution's id.
    --if-match=: The value of the `ETag` header that you received when retrieving the distribution's configuration.
documentation:
    command: "Updates the configuration for a CloudFront distribution.\n\nThe update process includes getting the current distribution configuration, updating it to make your changes, and then submitting an `UpdateDistribution` request to make the updates.\n\n**To update a web distribution using the CloudFront API**\n\n1. Use `GetDistributionConfig` to get the current configuration, including the version identifier (`ETag`).\n2. Update the distribution configuration that was returned in the response. Note the following important requirements and restrictions:\n   \n   - You must copy the `ETag` field value from the response. (You'll use it for the `IfMatch` parameter in your request.) Then, remove the `ETag` field from the distribution configuration.\n   - You can't change the value of `CallerReference`.\n3. Submit an `UpdateDistribution` request, providing the updated distribution configuration. The new configuration replaces the existing configuration. The values that you specify in an `UpdateDistribution` request are not merged into your existing configuration. Make sure to include all fields: the ones that you modified and also the ones that you didn't."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        distribution-config: The distribution's configuration information.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id: The distribution's id.
        if-match: 'The value of the `ETag` header that you received when retrieving the distribution''s configuration. For example: `E2QWRUHAPOMQZL`.'
