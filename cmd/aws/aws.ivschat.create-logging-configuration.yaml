name: create-logging-configuration
description: Creates a logging configuration that allows clients to store and record sent messages.
flags:
    --destination-configuration=!: A complex type that contains a destination configuration for where chat content will be logged.
    --name=: Logging-configuration name.
    --tags=: Tags to attach to the resource.
documentation:
    command: Creates a logging configuration that allows clients to store and record sent messages.
    flag:
        destination-configuration: A complex type that contains a destination configuration for where chat content will be logged. There can be only one type of destination (`cloudWatchLogs`, `firehose`, or `s3`) in a `destinationConfiguration`.
        name: Logging-configuration name. The value does not need to be unique.
        tags: Tags to attach to the resource. Array of maps, each of the form `string:string (key:value)`. See [Best practices and strategies](https://docs.aws.amazon.com/tag-editor/latest/userguide/best-practices-and-strats.html) in *Tagging Amazon Web Services Resources and Tag Editor* for details, including restrictions that apply to tags and "Tag naming limits and requirements"; Amazon IVS Chat has no constraints on tags beyond what is documented there.
