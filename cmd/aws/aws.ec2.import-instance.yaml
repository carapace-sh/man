name: import-instance
description: We recommend that you use the [`ImportImage`](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ImportImage.html) API instead.
flags:
    --description=: A description for the instance being imported.
    --disk-images=: The disk image.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --launch-specification=: The launch specification.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --platform=!: The instance operating system.
completion:
    flag:
        platform:
            - Windows
documentation:
    command: |-
        We recommend that you use the [`ImportImage`](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ImportImage.html) API instead. For more information, see [Importing a VM as an image using VM Import/Export](https://docs.aws.amazon.com/vm-import/latest/userguide/vmimport-image-import.html) in the *VM Import/Export User Guide*.

        Creates an import instance task using metadata from the specified disk image.

        This API action supports only single-volume VMs. To import multi-volume VMs, use [ImportImage]() instead.

        For information about the import manifest referenced by this API action, see [VM Import Manifest](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/manifest.html).

        This API action is not supported by the Command Line Interface (CLI).
    flag:
        description: A description for the instance being imported.
        disk-images: The disk image.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        launch-specification: The launch specification.
        platform: The instance operating system.
