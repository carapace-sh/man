name: list-artifacts
description: Returns a list of end-to-end testing artifacts for a specified app, branch, and job.
flags:
    --app-id=!: The unique ID for an Amplify app.
    --branch-name=!: The name of a branch that is part of an Amplify app.
    --job-id=!: The unique ID for a job.
    --max-results=: The maximum number of records to list in a single response.
    --next-token=: A pagination token.
documentation:
    command: |-
        Returns a list of end-to-end testing artifacts for a specified app, branch, and job.

        To return the build artifacts, use the [GetJob](https://docs.aws.amazon.com/amplify/latest/APIReference/API_GetJob.html) API.

        For more information about Amplify testing support, see [Setting up end-to-end Cypress tests for your Amplify application](https://docs.aws.amazon.com/amplify/latest/userguide/running-tests.html) in the *Amplify Hosting User Guide*.
    flag:
        app-id: The unique ID for an Amplify app.
        branch-name: The name of a branch that is part of an Amplify app.
        job-id: The unique ID for a job.
        max-results: The maximum number of records to list in a single response.
        next-token: A pagination token. Set to null to start listing artifacts from start. If a non-null pagination token is returned in a result, pass its value in here to list more artifacts.
