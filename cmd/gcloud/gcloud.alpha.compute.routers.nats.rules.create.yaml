name: create
description: '*(ALPHA)*  Add a Rule to a Compute Engine NAT.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --match=!: CEL Expression used to identify traffic to which this rule applies.
    --nat=!: Name of the NAT that contains the Rule
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Region of the NAT to create.
    --router-region=&: 'Region of the router to operate on. '
    --router=!: Router to use for NAT.
    --source-nat-active-ips-region=&: 'Region of the addresss to operate on. '
    --source-nat-active-ips=: External IP Addresses to use for connections matching this rule.
    --source-nat-active-ranges-region=&: 'Region of the subnetworkss to operate on. '
    --source-nat-active-ranges=: Subnetworks from which addresses are used for connections matching this
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute routers nats rules create* is used to create a Rule on a Compute Engine NAT.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        match: |-
            CEL Expression used to identify traffic to which this rule applies.
            +
            * Supported attributes (Public NAT): destination.ip
            * Supported attributes (Private NAT): nexthop.hub
            * Supported methods (Public Nat): inIpRange
            * Supported operators (Public NAT): ||, ==
            * Supported operators (Private NAT): ==
            +
            Examples of allowed Match expressions (Public NAT):
            * 'inIpRange(destination.ip, "203.0.113.0/24")''
            * 'destination.ip == "203.0.113.7"'
            * 'destination.ip == "203.0.113.7" || inIpRange(destination.ip, "203.0.113.16/25")'
            +
            Example of allowed Match expression (Private NAT):
            * nexthop.hub == "//networkconnectivity.googleapis.com/projects/p1/locations/global/hubs/h1"
        nat: Name of the NAT that contains the Rule
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            Region of the NAT to create. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        router: Router to use for NAT.
        router-region: 'Region of the router to operate on. '
        source-nat-active-ips: |-
            External IP Addresses to use for connections matching this rule. This flag
            is supported only for Public NAT and is required when creating a Public NAT
            gateway.
            +
            These must be valid reserved external IP addresses in the same region.
        source-nat-active-ips-region: 'Region of the addresss to operate on. '
        source-nat-active-ranges: |-
            Subnetworks from which addresses are used for connections matching this
            rule. This flag is supported only for Private NAT and is required when
            creating a Private NAT gateway.
            +
            These must be subnetwork resources in the same region, with purpose set to
            PRIVATE_NAT.
        source-nat-active-ranges-region: 'Region of the subnetworkss to operate on. '
