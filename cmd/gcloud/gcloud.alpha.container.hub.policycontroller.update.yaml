name: update
description: '*(ALPHA)*  Updates the configuration of Policy Controller Feature.'
flags:
    --all-memberships: If supplied, apply to all Policy Controllers memberships in the fleet.
    --audit-interval=: How often Policy Controller will audit resources, in seconds.
    --clear-exemptable-namespaces: Removes any namespace exemptions, enabling Policy Controller on all namespaces.
    --constraint-violation-limit=: The number of violations stored on the constraint resource.
    --exemptable-namespaces=: Namespaces that Policy Controller should ignore, separated by commas if multiple are supplied.
    --location=: Location for the memberships.
    --log-denies: If set, log all denies and dry run failures.
    --memberships=!: IDs of the memberships or fully qualified identifiers for the memberships.
    --monitoring=: Monitoring backend options Policy Controller should export metrics to, separated by commas if multiple are supplied.
    --mutation: If set, enable support for mutation.
    --no-all-memberships&: If supplied, apply to all Policy Controllers memberships in the fleet.
    --no-clear-exemptable-namespaces&: Removes any namespace exemptions, enabling Policy Controller on all namespaces.
    --no-log-denies: If set, disable all log denies.
    --no-monitoring: Include this flag to disable the monitoring configuration of Policy Controller.
    --no-mutation: Disables mutation support.
    --no-referential-rules: Disables referential rules support.
    --origin=: If --origin=FLEET will set the configuration of the membership to
    --referential-rules: If set, enable support for referential constraints.
completion:
    flag:
        origin:
            - FLEET
documentation:
    command: |-
        *(ALPHA)*  Updates the configuration of the Policy Controller installation
        ## EXAMPLES

        To change the installed version, run:

          $ gcloud alpha container hub policycontroller update --version=VERSION

        To modify the audit interval to 120 seconds, run:

          $ gcloud alpha container hub policycontroller update --audit-interval=120
    flag:
        all-memberships: If supplied, apply to all Policy Controllers memberships in the fleet.
        audit-interval: How often Policy Controller will audit resources, in seconds.
        clear-exemptable-namespaces: Removes any namespace exemptions, enabling Policy Controller on all namespaces. Setting this flag will overwrite currently exempted namespaces, not append.
        constraint-violation-limit: The number of violations stored on the constraint resource. Must be greater than 0.
        exemptable-namespaces: Namespaces that Policy Controller should ignore, separated by commas if multiple are supplied.
        location: |-
            Location for the memberships.
            +
            To set the `location` attribute:
            * provide the argument `--memberships` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        log-denies: If set, log all denies and dry run failures. (To disable, use --no-log-denies)
        memberships: |-
            IDs of the memberships or fully qualified identifiers for the memberships.
            +
            To set the `memberships` attribute:
            * provide the argument `--memberships` on the command line.
        monitoring: 'Monitoring backend options Policy Controller should export metrics to, separated by commas if multiple are supplied.  Setting this flag will overwrite currently enabled backends, not append. Options: prometheus, cloudmonitoring'
        mutation: If set, enable support for mutation. (To disable, use --no-mutation)
        no-all-memberships: If supplied, apply to all Policy Controllers memberships in the fleet.
        no-clear-exemptable-namespaces: Removes any namespace exemptions, enabling Policy Controller on all namespaces. Setting this flag will overwrite currently exempted namespaces, not append.
        no-log-denies: If set, disable all log denies.
        no-monitoring: Include this flag to disable the monitoring configuration of Policy Controller.
        no-mutation: Disables mutation support.
        no-referential-rules: Disables referential rules support.
        origin: |-
            If --origin=FLEET will set the configuration of the membership to
                  the fleet default.
            +
            _ORIGIN_ must be (only one value is supported): *FLEET*.
        referential-rules: If set, enable support for referential constraints. (To disable, use --no-referential-rules)
