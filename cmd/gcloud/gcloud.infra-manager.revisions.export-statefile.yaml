name: export-statefile
description: Export a terraform state file.
flags:
    --deployment=: The deployment for the revision.
    --location=: The Cloud location for the revision.
documentation:
    command: This command generates a signed url to download a terraform state file.
    flag:
        deployment: |-
            The deployment for the revision.
            +
            To set the `deployment` attribute:
            * provide the argument `REVISION` on the command line with a fully specified name;
            * provide the argument `--deployment` on the command line.
        location: |-
            The Cloud location for the revision.
            +
            To set the `location` attribute:
            * provide the argument `REVISION` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `infra-manager/location`.
