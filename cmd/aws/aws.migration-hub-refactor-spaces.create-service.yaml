name: create-service
description: Creates an Amazon Web Services Migration Hub Refactor Spaces service.
flags:
    --application-identifier=!: The ID of the application which the service is created.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=: The description of the service.
    --endpoint-type=!: The type of endpoint to use for the service.
    --environment-identifier=!: The ID of the environment in which the service is created.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --lambda-endpoint=: The configuration for the Lambda endpoint type.
    --name=!: The name of the service.
    --tags=: The tags to assign to the service.
    --url-endpoint=: The configuration for the URL endpoint type.
    --vpc-id=: The ID of the VPC.
completion:
    flag:
        endpoint-type:
            - LAMBDA
            - URL
documentation:
    command: |-
        Creates an Amazon Web Services Migration Hub Refactor Spaces service. The account owner of the service is always the environment owner, regardless of which account in the environment creates the service. Services have either a URL endpoint in a virtual private cloud (VPC), or a Lambda function endpoint.

        If an Amazon Web Services resource is launched in a service VPC, and you want it to be accessible to all of an environment’s services with VPCs and routes, apply the `RefactorSpacesSecurityGroup` to the resource. Alternatively, to add more cross-account constraints, apply your own security group.
    flag:
        application-identifier: The ID of the application which the service is created.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        description: The description of the service.
        endpoint-type: The type of endpoint to use for the service. The type can be a URL in a VPC or an Lambda function.
        environment-identifier: The ID of the environment in which the service is created.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        lambda-endpoint: The configuration for the Lambda endpoint type.
        name: The name of the service.
        tags: The tags to assign to the service. A tag is a label that you assign to an Amazon Web Services resource. Each tag consists of a key-value pair..
        url-endpoint: The configuration for the URL endpoint type. When creating a route to a service, Refactor Spaces automatically resolves the address in the `UrlEndpointInput` object URL when the Domain Name System (DNS) time-to-live (TTL) expires, or every 60 seconds for TTLs less than 60 seconds.
        vpc-id: The ID of the VPC.
