name: list-certificates
description: Returns a list of the current certificates that have been imported into Transfer Family.
flags:
    --max-results=: The maximum number of items to return.
    --next-token=: When you can get additional results from the `ListCertificates` call, a `NextToken` parameter is returned in the output.
documentation:
    command: Returns a list of the current certificates that have been imported into Transfer Family. If you want to limit the results to a certain number, supply a value for the `MaxResults` parameter. If you ran the command previously and received a value for the `NextToken` parameter, you can supply that value to continue listing certificates from where you left off.
    flag:
        max-results: The maximum number of items to return.
        next-token: When you can get additional results from the `ListCertificates` call, a `NextToken` parameter is returned in the output. You can then pass in a subsequent command to the `NextToken` parameter to continue listing additional certificates.
