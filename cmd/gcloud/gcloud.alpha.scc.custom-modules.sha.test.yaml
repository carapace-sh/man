name: test
description: '*(ALPHA)*  Test a Security Health Analytics custom module.'
flags:
    --custom-config-from-file=: Path to a YAML file that contains the configuration for the Security Health Analytics custom module.
    --display-name=: Sets the display name of the Security Health Analytics custom module.
    --folder=: Folder where the Security Health Analytics custom module resides.
    --organization=: Organization where the Security Health Analytics custom module resides.
    --test-data-from-file=!: Path to a YAML file that contains the resource data to test the Security Health Analytics custom module against.
documentation:
    command: '*(ALPHA)*  Test a Security Health Analytics custom module.'
    flag:
        custom-config-from-file: Path to a YAML file that contains the configuration for the Security Health Analytics custom module. If not specified, the existing module with the given ID or resource name is used. Use a full or relative path to a local file containing the value of custom_config.
        display-name: Sets the display name of the Security Health Analytics custom module. This display name becomes the finding category for all findings that are returned by this the custom module. The display name must be between 1 and 128 characters, start with a lowercase letter, and contain alphanumeric characters or underscores only. Only relevant when `--custom-config-from-file` is also specified.
        folder: Folder where the Security Health Analytics custom module resides. Formatted as `folders/456` or just `456`.
        organization: Organization where the Security Health Analytics custom module resides. Formatted as `organizations/123` or just `123`.
        test-data-from-file: Path to a YAML file that contains the resource data to test the Security Health Analytics custom module against. Use a full or relative path to a local file containing the value of test_data.
