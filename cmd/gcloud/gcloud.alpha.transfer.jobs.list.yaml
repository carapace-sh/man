name: list
description: '*(ALPHA)*  List Transfer Service transfer jobs.'
flags:
    --expand-table: Include additional table columns (job name, source, destination, frequency, lastest operation name, job status) in command output.
    --job-names=: The names of the jobs you want to list.
    --job-statuses=: List only jobs with the statuses you specify.
    --job-type=: The type of the job you want to list.
    --limit=: Return the first items from the API up to this limit.
    --no-expand-table&: Include additional table columns (job name, source, destination, frequency, lastest operation name, job status) in command output.
    --page-size=: Retrieve batches of this many items from the API.
completion:
    flag:
        job-type:
            - transfer
            - replication
documentation:
    command: |
        *(ALPHA)*  List Transfer Service transfer jobs in a given project to show their
        configurations and latest operations.
    flag:
        expand-table: 'Include additional table columns (job name, source, destination, frequency, lastest operation name, job status) in command output. Tip: increase the size of your terminal before running the command.'
        job-names: The names of the jobs you want to list. Separate multiple job names with commas (e.g., --job-names=foo,bar). If not specified, all jobs will be listed.
        job-statuses: List only jobs with the statuses you specify. Options include 'enabled', 'disabled', 'deleted' (case insensitive). Separate multiple statuses with commas (e.g., --job-statuses=enabled,deleted). If not specified, all jobs will be listed.
        job-type: 'The type of the job you want to list. _JOB_TYPE_ must be one of: *transfer*, *replication*.'
        limit: Return the first items from the API up to this limit.
        no-expand-table: 'Include additional table columns (job name, source, destination, frequency, lastest operation name, job status) in command output. Tip: increase the size of your terminal before running the command.'
        page-size: Retrieve batches of this many items from the API.
