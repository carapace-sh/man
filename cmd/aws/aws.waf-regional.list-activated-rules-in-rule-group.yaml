name: list-activated-rules-in-rule-group
description: This is **AWS WAF Classic** documentation.
flags:
    --limit=: Specifies the number of `ActivatedRules` that you want AWS WAF to return for this request.
    --next-marker=: If you specify a value for `Limit` and you have more `ActivatedRules` than the value of `Limit`, AWS WAF returns a `NextMarker` value in the response that allows you to list another group of `ActivatedRules`.
    --rule-group-id=: The `RuleGroupId` of the [RuleGroup]() for which you want to get a list of [ActivatedRule]() objects.
documentation:
    command: |-
        This is **AWS WAF Classic** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.

        **For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.

        Returns an array of [ActivatedRule]() objects.
    flag:
        limit: Specifies the number of `ActivatedRules` that you want AWS WAF to return for this request. If you have more `ActivatedRules` than the number that you specify for `Limit`, the response includes a `NextMarker` value that you can use to get another batch of `ActivatedRules`.
        next-marker: If you specify a value for `Limit` and you have more `ActivatedRules` than the value of `Limit`, AWS WAF returns a `NextMarker` value in the response that allows you to list another group of `ActivatedRules`. For the second and subsequent `ListActivatedRulesInRuleGroup` requests, specify the value of `NextMarker` from the previous response to get information about another batch of `ActivatedRules`.
        rule-group-id: The `RuleGroupId` of the [RuleGroup]() for which you want to get a list of [ActivatedRule]() objects.
