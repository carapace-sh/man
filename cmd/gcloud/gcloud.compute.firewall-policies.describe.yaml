name: describe
description: Describe a Compute Engine organization firewall policy.
flags:
    --organization=: Organization in which the organization firewall policy is to be described.
documentation:
    command: |-
        *gcloud compute firewall-policies describe* is used to describe organization firewall policies. An
        organization firewall policy is a set of rules that controls access to various
        resources.
    flag:
        organization: Organization in which the organization firewall policy is to be described. Must be set if FIREWALL_POLICY is short name.
