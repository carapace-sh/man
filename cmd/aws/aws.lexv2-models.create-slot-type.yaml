name: create-slot-type
description: |-
    Creates a custom slot type

    To create a custom slot type, specify a name for the slot type and a set of enumeration values, the values that a slot of this type can assume.
flags:
    --bot-id=!: The identifier of the bot associated with this slot type.
    --bot-version=!: The identifier of the bot version associated with this slot type.
    --composite-slot-type-setting=: Specifications for a composite slot type.
    --description=: A description of the slot type.
    --external-source-setting=: Sets the type of external information used to create the slot type.
    --locale-id=!: The identifier of the language and locale that the slot type will be used in.
    --parent-slot-type-signature=: The built-in slot type used as a parent of this slot type.
    --slot-type-name=!: The name for the slot.
    --slot-type-values=: A list of `SlotTypeValue` objects that defines the values that the slot type can take.
    --value-selection-setting=: Determines the strategy that Amazon Lex uses to select a value from the list of possible values.
documentation:
    command: |-
        Creates a custom slot type

        To create a custom slot type, specify a name for the slot type and a set of enumeration values, the values that a slot of this type can assume.
    flag:
        bot-id: The identifier of the bot associated with this slot type.
        bot-version: The identifier of the bot version associated with this slot type.
        composite-slot-type-setting: Specifications for a composite slot type.
        description: A description of the slot type. Use the description to help identify the slot type in lists.
        external-source-setting: Sets the type of external information used to create the slot type.
        locale-id: The identifier of the language and locale that the slot type will be used in. The string must match one of the supported locales. All of the bots, intents, and slots used by the slot type must have the same locale. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
        parent-slot-type-signature: |-
            The built-in slot type used as a parent of this slot type. When you define a parent slot type, the new slot type has the configuration of the parent slot type.

            Only `AMAZON.AlphaNumeric` is supported.
        slot-type-name: The name for the slot. A slot type name must be unique within the intent.
        slot-type-values: A list of `SlotTypeValue` objects that defines the values that the slot type can take. Each value can have a list of synonyms, additional values that help train the machine learning model about the values that it resolves for a slot.
        value-selection-setting: |-
            Determines the strategy that Amazon Lex uses to select a value from the list of possible values. The field can be set to one of the following values:

            - `ORIGINAL_VALUE` - Returns the value entered by the user, if the user value is similar to the slot value.
            - `TOP_RESOLUTION` - If there is a resolution list for the slot, return the first value in the resolution list. If there is no resolution list, return null.

            If you don't specify the `valueSelectionSetting` parameter, the default is `ORIGINAL_VALUE`.
