name: list-investigations
description: Detective investigations lets you investigate IAM users and IAM roles using indicators of compromise.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filter-criteria=: Filters the investigation results based on a criteria.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --graph-arn=!: The Amazon Resource Name (ARN) of the behavior graph.
    --max-results=: Lists the maximum number of investigations in a page.
    --next-token=: Lists if there are more results available.
    --sort-criteria=: Sorts the investigation results based on a criteria.
documentation:
    command: Detective investigations lets you investigate IAM users and IAM roles using indicators of compromise. An indicator of compromise (IOC) is an artifact observed in or on a network, system, or environment that can (with a high level of confidence) identify malicious activity or a security incident. `ListInvestigations` lists all active Detective investigations.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filter-criteria: Filters the investigation results based on a criteria.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        graph-arn: The Amazon Resource Name (ARN) of the behavior graph.
        max-results: Lists the maximum number of investigations in a page.
        next-token: |-
            Lists if there are more results available. The value of nextToken is a unique pagination token for each page. Repeat the call using the returned token to retrieve the next page. Keep all other arguments unchanged.

            Each pagination token expires after 24 hours. Using an expired pagination token will return a Validation Exception error.
        sort-criteria: Sorts the investigation results based on a criteria.
