name: create
description: '*(ALPHA)*  Create a Compute Engine network policy.'
flags:
    --description=: An optional, textual description for the network policy.
    --region=: Region of the network policy to create.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute network-policies create* is used to create network policies. A network
        policy is a set of rules that classifies network traffic.
    flag:
        description: An optional, textual description for the network policy.
        region: Region of the network policy to create. Overrides the default *compute/region* property value for this command invocation.
