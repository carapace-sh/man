name: create-pricing-plan
description: Creates a pricing plan that is used for computing Amazon Web Services charges for billing groups.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you specify to ensure idempotency of the request.
    --description=: The description of the pricing plan.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the pricing plan.
    --pricing-rule-arns=:
        description: A list of Amazon Resource Names (ARNs) that define the pricing plan parameters.
        nargs: -1
    --tags=: A map that contains tag keys and tag values that are attached to a pricing plan.
documentation:
    command: Creates a pricing plan that is used for computing Amazon Web Services charges for billing groups.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you specify to ensure idempotency of the request. Idempotency ensures that an API request completes no more than one time. With an idempotent request, if the original request completes successfully, any subsequent retries complete successfully without performing any further actions.
        description: The description of the pricing plan.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the pricing plan. The names must be unique to each pricing plan.
        pricing-rule-arns: A list of Amazon Resource Names (ARNs) that define the pricing plan parameters.
        tags: A map that contains tag keys and tag values that are attached to a pricing plan.
