name: put-event-configuration
description: Updates the event configuration settings for the specified event data store or trail.
flags:
    --aggregation-configurations=:
        description: The list of aggregation configurations that you want to configure for the trail.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --context-key-selectors=:
        description: A list of context key selectors that will be included to provide enriched event data.
        nargs: -1
    --event-data-store=: The Amazon Resource Name (ARN) or ID suffix of the ARN of the event data store for which event configuration settings are updated.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-event-size=: The maximum allowed size for events to be stored in the specified event data store.
    --trail-name=: The name of the trail for which you want to update event configuration settings.
completion:
    flag:
        max-event-size:
            - Standard
            - Large
documentation:
    command: Updates the event configuration settings for the specified event data store or trail. This operation supports updating the maximum event size, adding or modifying context key selectors for event data store, and configuring aggregation settings for the trail.
    flag:
        aggregation-configurations: The list of aggregation configurations that you want to configure for the trail.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        context-key-selectors: A list of context key selectors that will be included to provide enriched event data.
        event-data-store: The Amazon Resource Name (ARN) or ID suffix of the ARN of the event data store for which event configuration settings are updated.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-event-size: The maximum allowed size for events to be stored in the specified event data store. If you are using context key selectors, MaxEventSize must be set to Large.
        trail-name: The name of the trail for which you want to update event configuration settings.
