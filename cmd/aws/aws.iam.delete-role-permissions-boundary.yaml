name: delete-role-permissions-boundary
description: Deletes the permissions boundary for the specified IAM role.
flags:
    --role-name=!: The name (friendly name, not ARN) of the IAM role from which you want to remove the permissions boundary.
documentation:
    command: |-
        Deletes the permissions boundary for the specified IAM role.

        You cannot set the boundary for a service-linked role.

        Deleting the permissions boundary for a role might increase its permissions. For example, it might allow anyone who assumes the role to perform all the actions granted in its permissions policies.
    flag:
        role-name: The name (friendly name, not ARN) of the IAM role from which you want to remove the permissions boundary.
