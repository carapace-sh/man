name: describe-orderable-dbinstance-options
description: Describes the orderable DB instance options for a specified DB engine.
flags:
    --availability-zone-group=: The Availability Zone group associated with a Local Zone.
    --dbinstance-class=: A filter to include only the available options for the specified DB instance class.
    --engine-version=: A filter to include only the available options for the specified engine version.
    --engine=!: The name of the database engine to describe DB instance options for.
    --filters=: This parameter isn't currently supported.
    --license-model=: A filter to include only the available options for the specified license model.
    --marker=: An optional pagination token provided by a previous DescribeOrderableDBInstanceOptions request.
    --max-records=: The maximum number of records to include in the response.
    --vpc=: Specifies whether to show only VPC or non-VPC offerings.
documentation:
    command: Describes the orderable DB instance options for a specified DB engine.
    flag:
        availability-zone-group: |-
            The Availability Zone group associated with a Local Zone. Specify this parameter to retrieve available options for the Local Zones in the group.

            Omit this parameter to show the available options in the specified Amazon Web Services Region.

            This setting doesn't apply to RDS Custom DB instances.
        dbinstance-class: A filter to include only the available options for the specified DB instance class.
        engine: |-
            The name of the database engine to describe DB instance options for.

            Valid Values:

            - `aurora-mysql`
            - `aurora-postgresql`
            - `custom-oracle-ee`
            - `custom-oracle-ee-cdb`
            - `custom-oracle-se2`
            - `custom-oracle-se2-cdb`
            - `db2-ae`
            - `db2-se`
            - `mariadb`
            - `mysql`
            - `oracle-ee`
            - `oracle-ee-cdb`
            - `oracle-se2`
            - `oracle-se2-cdb`
            - `postgres`
            - `sqlserver-ee`
            - `sqlserver-se`
            - `sqlserver-ex`
            - `sqlserver-web`
        engine-version: A filter to include only the available options for the specified engine version.
        filters: This parameter isn't currently supported.
        license-model: |-
            A filter to include only the available options for the specified license model.

            RDS Custom supports only the BYOL licensing model.
        marker: An optional pagination token provided by a previous DescribeOrderableDBInstanceOptions request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 1000.
        vpc: |-
            Specifies whether to show only VPC or non-VPC offerings. RDS Custom supports only VPC offerings.

            RDS Custom supports only VPC offerings. If you describe non-VPC offerings for RDS Custom, the output shows VPC offerings.
