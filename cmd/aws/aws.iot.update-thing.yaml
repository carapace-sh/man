name: update-thing
description: Updates the data for a thing.
flags:
    --attribute-payload=: A list of thing attributes, a JSON string containing name-value pairs.
    --expected-version=: The expected version of the thing record in the registry.
    --remove-thing-type=: Remove a thing type association.
    --thing-name=!: The name of the thing to update.
    --thing-type-name=: The name of the thing type.
documentation:
    command: |-
        Updates the data for a thing.

        Requires permission to access the [UpdateThing](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        attribute-payload: |-
            A list of thing attributes, a JSON string containing name-value pairs. For example:

            `{\"attributes\":{\"name1\":\"value2\"}}`

            This data is used to add new attributes or update existing attributes.
        expected-version: The expected version of the thing record in the registry. If the version of the record in the registry does not match the expected version specified in the request, the `UpdateThing` request is rejected with a `VersionConflictException`.
        remove-thing-type: Remove a thing type association. If **true**, the association is removed.
        thing-name: |-
            The name of the thing to update.

            You can't change a thing's name. To change a thing's name, you must create a new thing, give it the new name, and then delete the old thing.
        thing-type-name: The name of the thing type.
