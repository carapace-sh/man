name: start-scan-job
description: Starts scanning jobs for specific resources.
flags:
    --backup-vault-name=!: The name of a logical container where backups are stored.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role-arn=!: Specifies the IAM role ARN used to create the target recovery point; for example, `arn:aws:iam::123456789012:role/S3Access`.
    --idempotency-token=: A customer-chosen string that you can use to distinguish between otherwise identical calls to `StartScanJob`.
    --malware-scanner=!: Specifies the malware scanner used during the scan job.
    --recovery-point-arn=!: An Amazon Resource Name (ARN) that uniquely identifies a recovery point.
    --scan-base-recovery-point-arn=: An ARN that uniquely identifies the base recovery point to be used for incremental scanning.
    --scan-mode=!: Specifies the scan type use for the scan job.
    --scanner-role-arn=!: Specified the IAM scanner role ARN.
completion:
    flag:
        malware-scanner:
            - GUARDDUTY
        scan-mode:
            - FULL_SCAN
            - INCREMENTAL_SCAN
documentation:
    command: Starts scanning jobs for specific resources.
    flag:
        backup-vault-name: |-
            The name of a logical container where backups are stored. Backup vaults are identified by names that are unique to the account used to create them and the Amazon Web Services Region where they are created.

            Pattern: `^[a-zA-Z0-9\-\_]{2,50}$`
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role-arn: Specifies the IAM role ARN used to create the target recovery point; for example, `arn:aws:iam::123456789012:role/S3Access`.
        idempotency-token: A customer-chosen string that you can use to distinguish between otherwise identical calls to `StartScanJob`. Retrying a successful request with the same idempotency token results in a success message with no action taken.
        malware-scanner: Specifies the malware scanner used during the scan job. Currently only supports `GUARDDUTY`.
        recovery-point-arn: An Amazon Resource Name (ARN) that uniquely identifies a recovery point. This is your target recovery point for a full scan. If you are running an incremental scan, this will be your a recovery point which has been created after your base recovery point selection.
        scan-base-recovery-point-arn: An ARN that uniquely identifies the base recovery point to be used for incremental scanning.
        scan-mode: |-
            Specifies the scan type use for the scan job.

            Includes:

            - `FULL_SCAN` will scan the entire data lineage within the backup.
            - `INCREMENTAL_SCAN` will scan the data difference between the target recovery point and base recovery point ARN.
        scanner-role-arn: Specified the IAM scanner role ARN.
