name: detect-document
description: '*(ALPHA)*  Detect dense text in an image.'
flags:
    --language-hints=: List of languages to use for text detection.
    --model-version=: Model version to use for the feature.
completion:
    flag:
        model-version:
            - builtin/latest
            - builtin/stable
documentation:
    command: |
        *(ALPHA)*  Detect dense text in an image, such as books and research reports.

        Google Cloud Vision uses OCR (Optical Character Recognition) to analyze text.
        This is a premium feature for dense text such as books, research
        reports, and PDFs. To detect small amounts of text such as on signs, use
        `detect-text` instead. For more information on this feature, see the Google
        Cloud Vision documentation at https://cloud.google.com/vision/docs/.

        {language_hints}
    flag:
        language-hints: List of languages to use for text detection.
        model-version: 'Model version to use for the feature. _MODEL_VERSION_ must be one of: *builtin/latest*, *builtin/stable*.'
