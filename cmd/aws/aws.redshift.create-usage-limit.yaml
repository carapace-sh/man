name: create-usage-limit
description: Creates a usage limit for a specified Amazon Redshift feature on a cluster.
flags:
    --amount=!: The limit amount.
    --breach-action=: The action that Amazon Redshift takes when the limit is reached.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-identifier=!: The identifier of the cluster that you want to limit usage.
    --feature-type=!: The Amazon Redshift feature that you want to limit.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit-type=!: The type of limit.
    --period=: The time period that the amount applies to.
    --tags=:
        description: A list of tag instances.
        nargs: -1
completion:
    flag:
        breach-action:
            - log
            - emit-metric
            - disable
        feature-type:
            - spectrum
            - concurrency-scaling
            - cross-region-datasharing
        limit-type:
            - time
            - data-scanned
        period:
            - daily
            - weekly
            - monthly
documentation:
    command: Creates a usage limit for a specified Amazon Redshift feature on a cluster. The usage limit is identified by the returned usage limit identifier.
    flag:
        amount: The limit amount. If time-based, this amount is in minutes. If data-based, this amount is in terabytes (TB). The value must be a positive number.
        breach-action: The action that Amazon Redshift takes when the limit is reached. The default is log. For more information about this parameter, see [UsageLimit]().
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-identifier: The identifier of the cluster that you want to limit usage.
        feature-type: The Amazon Redshift feature that you want to limit.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit-type: The type of limit. Depending on the feature type, this can be based on a time duration or data size. If `FeatureType` is `spectrum`, then `LimitType` must be `data-scanned`. If `FeatureType` is `concurrency-scaling`, then `LimitType` must be `time`. If `FeatureType` is `cross-region-datasharing`, then `LimitType` must be `data-scanned`.
        period: The time period that the amount applies to. A `weekly` period begins on Sunday. The default is `monthly`.
        tags: A list of tag instances.
