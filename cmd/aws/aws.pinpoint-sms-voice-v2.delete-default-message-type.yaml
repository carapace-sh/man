name: delete-default-message-type
description: Deletes an existing default message type on a configuration set.
flags:
    --configuration-set-name=!: The name of the configuration set or the configuration set Amazon Resource Name (ARN) to delete the default message type from.
documentation:
    command: |-
        Deletes an existing default message type on a configuration set.

        A message type is a type of messages that you plan to send. If you send account-related messages or time-sensitive messages such as one-time passcodes, choose **Transactional**. If you plan to send messages that contain marketing material or other promotional content, choose **Promotional**. This setting applies to your entire Amazon Web Services account.
    flag:
        configuration-set-name: The name of the configuration set or the configuration set Amazon Resource Name (ARN) to delete the default message type from. The ConfigurationSetName and ConfigurationSetArn can be found using the [DescribeConfigurationSets]() action.
