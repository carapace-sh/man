name: enable-insight-rules
description: Enables the specified Contributor Insights rules.
flags:
    --rule-names=!: An array of the rule names to enable.
documentation:
    command: Enables the specified Contributor Insights rules. When rules are enabled, they immediately begin analyzing log data.
    flag:
        rule-names: An array of the rule names to enable. If you need to find out the names of your rules, use [DescribeInsightRules](https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_DescribeInsightRules.html).
