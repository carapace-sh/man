name: delete-cluster
description: Deletes a previously provisioned DAX cluster.
flags:
    --cluster-name=!: The name of the cluster to be deleted.
documentation:
    command: Deletes a previously provisioned DAX cluster. *DeleteCluster* deletes all associated nodes, node endpoints and the DAX cluster itself. When you receive a successful response from this action, DAX immediately begins deleting the cluster; you cannot cancel or revert this action.
    flag:
        cluster-name: The name of the cluster to be deleted.
