name: disassociate-faces
description: Removes the association between a `Face` supplied in an array of `FaceIds` and the User.
flags:
    --client-request-token=: Idempotent token used to identify the request to `DisassociateFaces`.
    --collection-id=!: The ID of an existing collection containing the UserID.
    --face-ids=!: An array of face IDs to disassociate from the UserID.
    --user-id=!: ID for the existing UserID.
documentation:
    command: Removes the association between a `Face` supplied in an array of `FaceIds` and the User. If the User is not present already, then a `ResourceNotFound` exception is thrown. If successful, an array of faces that are disassociated from the User is returned. If a given face is already disassociated from the given UserID, it will be ignored and not be returned in the response. If a given face is already associated with a different User or not found in the collection it will be returned as part of `UnsuccessfulDisassociations`. You can remove 1 - 100 face IDs from a user at one time.
    flag:
        client-request-token: Idempotent token used to identify the request to `DisassociateFaces`. If you use the same token with multiple `DisassociateFaces` requests, the same response is returned. Use ClientRequestToken to prevent the same request from being processed more than once.
        collection-id: The ID of an existing collection containing the UserID.
        face-ids: An array of face IDs to disassociate from the UserID.
        user-id: ID for the existing UserID.
