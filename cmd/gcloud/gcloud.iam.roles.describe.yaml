name: describe
description: Show metadata for a role.
flags:
    --organization=: Organization of the role you want to describe.
documentation:
    command: |-
        This command shows metadata for a role.

        This command can fail for the following reasons:
        * The role specified does not exist.
        * The active user does not have permission to access the given role.

        ## EXAMPLES

        To print metadata for the role ``spanner.databaseAdmin'' of the organization
        ``1234567'', run:

          $ gcloud iam roles describe roles/spanner.databaseAdmin --organization=1234567

        To print metadata for the role ``spanner.databaseAdmin'' of the project
        ``myproject'', run:

          $ gcloud iam roles describe roles/spanner.databaseAdmin --project=myproject

        To print metadata for a predefined role, ``spanner.databaseAdmin'', run:

          $ gcloud iam roles describe roles/spanner.databaseAdmin
    flag:
        organization: Organization of the role you want to describe.
