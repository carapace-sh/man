name: create-mlmodel
description: Creates a new `MLModel` using the `DataSource` and the recipe as information sources.
flags:
    --mlmodel-id=!: A user-supplied ID that uniquely identifies the `MLModel`.
    --mlmodel-name=: A user-supplied name or description of the `MLModel`.
    --mlmodel-type=!: The category of supervised learning that this `MLModel` will address.
    --parameters=: A list of the training parameters in the `MLModel`.
    --recipe-uri=: The Amazon Simple Storage Service (Amazon S3) location and file name that contains the `MLModel` recipe.
    --recipe=: The data recipe for creating the `MLModel`.
    --training-data-source-id=!: The `DataSource` that points to the training data.
completion:
    flag:
        mlmodel-type:
            - REGRESSION
            - BINARY
            - MULTICLASS
documentation:
    command: |-
        Creates a new `MLModel` using the `DataSource` and the recipe as information sources.

        An `MLModel` is nearly immutable. Users can update only the `MLModelName` and the `ScoreThreshold` in an `MLModel` without creating a new `MLModel`.

        `CreateMLModel` is an asynchronous operation. In response to `CreateMLModel`, Amazon Machine Learning (Amazon ML) immediately returns and sets the `MLModel` status to `PENDING`. After the `MLModel` has been created and ready is for use, Amazon ML sets the status to `COMPLETED`.

        You can use the `GetMLModel` operation to check the progress of the `MLModel` during the creation operation.

        `CreateMLModel` requires a `DataSource` with computed statistics, which can be created by setting `ComputeStatistics` to `true` in `CreateDataSourceFromRDS`, `CreateDataSourceFromS3`, or `CreateDataSourceFromRedshift` operations.
    flag:
        mlmodel-id: A user-supplied ID that uniquely identifies the `MLModel`.
        mlmodel-name: A user-supplied name or description of the `MLModel`.
        mlmodel-type: |-
            The category of supervised learning that this `MLModel` will address. Choose from the following types:

            - Choose `REGRESSION` if the `MLModel` will be used to predict a numeric value.
            - Choose `BINARY` if the `MLModel` result has two possible values.
            - Choose `MULTICLASS` if the `MLModel` result has a limited number of values.

            For more information, see the [Amazon Machine Learning Developer Guide](https://docs.aws.amazon.com/machine-learning/latest/dg).
        parameters: "A list of the training parameters in the `MLModel`. The list is implemented as a map of key-value pairs.\n\nThe following is the current set of training parameters:\n\n- `sgd.maxMLModelSizeInBytes` - The maximum allowed size of the model. Depending on the input data, the size of the model might affect its performance.\n  \n  The value is an integer that ranges from `100000` to `2147483648`. The default value is `33554432`.\n- `sgd.maxPasses` - The number of times that the training process traverses the observations to build the `MLModel`. The value is an integer that ranges from `1` to `10000`. The default value is `10`.\n- `sgd.shuffleType` - Whether Amazon ML shuffles the training data. Shuffling the data improves a model's ability to find the optimal solution for a variety of data types. The valid values are `auto` and `none`. The default value is `none`. We strongly recommend that you shuffle your data.\n- `sgd.l1RegularizationAmount` - The coefficient regularization L1 norm. It controls overfitting the data by penalizing large coefficients. This tends to drive coefficients to zero, resulting in a sparse feature set. If you use this parameter, start by specifying a small value, such as `1.0E-08`.\n  \n  The value is a double that ranges from `0` to `MAX_DOUBLE`. The default is to not use L1 normalization. This parameter can't be used when `L2` is specified. Use this parameter sparingly.\n- `sgd.l2RegularizationAmount` - The coefficient regularization L2 norm. It controls overfitting the data by penalizing large coefficients. This tends to drive coefficients to small, nonzero values. If you use this parameter, start by specifying a small value, such as `1.0E-08`.\n  \n  The value is a double that ranges from `0` to `MAX_DOUBLE`. The default is to not use L2 normalization. This parameter can't be used when `L1` is specified. Use this parameter sparingly."
        recipe: The data recipe for creating the `MLModel`. You must specify either the recipe or its URI. If you don't specify a recipe or its URI, Amazon ML creates a default.
        recipe-uri: The Amazon Simple Storage Service (Amazon S3) location and file name that contains the `MLModel` recipe. You must specify either the recipe or its URI. If you don't specify a recipe or its URI, Amazon ML creates a default.
        training-data-source-id: The `DataSource` that points to the training data.
