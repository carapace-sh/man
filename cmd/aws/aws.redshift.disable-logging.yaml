name: disable-logging
description: Stops logging information, such as queries and connection attempts, for the specified Amazon Redshift cluster.
flags:
    --cluster-identifier=!: The identifier of the cluster on which logging is to be stopped.
documentation:
    command: Stops logging information, such as queries and connection attempts, for the specified Amazon Redshift cluster.
    flag:
        cluster-identifier: |-
            The identifier of the cluster on which logging is to be stopped.

            Example: `examplecluster`
