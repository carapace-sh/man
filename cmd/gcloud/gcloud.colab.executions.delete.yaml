name: delete
description: Delete an execution.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Cloud region for the notebook execution job.
documentation:
    command: |
        Delete a Colab Enterprise notebook execution.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            Cloud region for the notebook execution job.
            +
            To set the `region` attribute:
            * provide the argument `execution` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `colab/region`.
