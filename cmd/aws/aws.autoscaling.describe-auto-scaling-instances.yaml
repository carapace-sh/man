name: describe-auto-scaling-instances
description: Gets information about the Auto Scaling instances in the account and Region.
flags:
    --instance-ids=: The IDs of the instances.
    --max-records=: The maximum number of items to return with this call.
    --next-token=: The token for the next set of items to return.
documentation:
    command: Gets information about the Auto Scaling instances in the account and Region.
    flag:
        instance-ids: |-
            The IDs of the instances. If you omit this property, all Auto Scaling instances are described. If you specify an ID that does not exist, it is ignored with no error.

            Array Members: Maximum number of 50 items.
        max-records: The maximum number of items to return with this call. The default value is `50` and the maximum value is `50`.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
