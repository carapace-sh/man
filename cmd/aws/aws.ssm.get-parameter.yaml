name: get-parameter
description: Get information about a single parameter by specifying the parameter name.
flags:
    --name=!: The name or Amazon Resource Name (ARN) of the parameter that you want to query.
    --no-with-decryption&: Return decrypted values for secure string parameters.
    --with-decryption: Return decrypted values for secure string parameters.
documentation:
    command: |-
        Get information about a single parameter by specifying the parameter name.

        Parameter names can't contain spaces. The service removes any spaces specified for the beginning or end of a parameter name. If the specified name for a parameter contains spaces between characters, the request fails with a `ValidationException` error.

        To get information about more than one parameter at a time, use the [GetParameters]() operation.
    flag:
        name: |-
            The name or Amazon Resource Name (ARN) of the parameter that you want to query. For parameters shared with you from another account, you must use the full ARN.

            To query by parameter label, use `"Name": "name:label"`. To query by parameter version, use `"Name": "name:version"`.

            For more information about shared parameters, see [Working with shared parameters](https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-shared-parameters.html) in the *Amazon Web Services Systems Manager User Guide*.
        with-decryption: Return decrypted values for secure string parameters. This flag is ignored for `String` and `StringList` parameter types.
