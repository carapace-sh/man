name: apply-security-groups-to-load-balancer
description: Associates one or more security groups with your load balancer in a virtual private cloud (VPC).
flags:
    --load-balancer-name=!: The name of the load balancer.
    --security-groups=!: The IDs of the security groups to associate with the load balancer.
documentation:
    command: |-
        Associates one or more security groups with your load balancer in a virtual private cloud (VPC). The specified security groups override the previously associated security groups.

        For more information, see [Security Groups for Load Balancers in a VPC](https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/elb-security-groups.html#elb-vpc-security-groups) in the *Classic Load Balancers Guide*.
    flag:
        load-balancer-name: The name of the load balancer.
        security-groups: The IDs of the security groups to associate with the load balancer. Note that you cannot specify the name of the security group.
