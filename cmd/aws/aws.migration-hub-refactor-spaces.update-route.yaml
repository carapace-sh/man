    --application-identifier=!: The ID of the application within which the route is being updated.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --environment-identifier=!: The ID of the environment in which the route is being updated.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --route-identifier=!: The unique identifier of the route to update.
completion:
    flag:
        activation-state:
            - ACTIVE
            - INACTIVE
