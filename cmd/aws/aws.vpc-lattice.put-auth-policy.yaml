name: put-auth-policy
description: Creates or updates the auth policy.
flags:
    --policy=!: The auth policy.
    --resource-identifier=!: The ID or ARN of the service network or service for which the policy is created.
documentation:
    command: |-
        Creates or updates the auth policy. The policy string in JSON must not contain newlines or blank lines.

        For more information, see [Auth policies](https://docs.aws.amazon.com/vpc-lattice/latest/ug/auth-policies.html) in the *Amazon VPC Lattice User Guide*.
    flag:
        policy: The auth policy. The policy string in JSON must not contain newlines or blank lines.
        resource-identifier: The ID or ARN of the service network or service for which the policy is created.
