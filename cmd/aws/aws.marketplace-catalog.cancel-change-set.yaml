name: cancel-change-set
description: Used to cancel an open change request.
flags:
    --catalog=!: Required.
    --change-set-id=!: Required.
documentation:
    command: Used to cancel an open change request. Must be sent before the status of the request changes to `APPLYING`, the final stage of completing your change request. You can describe a change during the 60-day request history retention period for API calls.
    flag:
        catalog: 'Required. The catalog related to the request. Fixed value: `AWSMarketplace`.'
        change-set-id: Required. The unique identifier of the `StartChangeSet` request that you want to cancel.
