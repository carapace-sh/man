name: list-permission-associations
description: Lists information about the managed permission and its associations to any resource shares that use this managed permission.
flags:
    --association-status=: Specifies that you want to list only those associations with resource shares that match this status.
    --default-version: When `true`, specifies that you want to list only those associations with resource shares that use the default version of the specified managed permission.
    --feature-set=: Specifies that you want to list only those associations with resource shares that have a `featureSet` with this value.
    --max-results=: Specifies the total number of results that you want included on each page of the response.
    --next-token=: Specifies that you want to receive the next page of results.
    --no-default-version&: When `true`, specifies that you want to list only those associations with resource shares that use the default version of the specified managed permission.
    --permission-arn=: Specifies the [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of the managed permission.
    --permission-version=: Specifies that you want to list only those associations with resource shares that use this version of the managed permission.
    --resource-type=: Specifies that you want to list only those associations with resource shares that include at least one resource of this resource type.
completion:
    flag:
        association-status:
            - ASSOCIATING
            - ASSOCIATED
            - FAILED
            - DISASSOCIATING
            - DISASSOCIATED
        feature-set:
            - CREATED_FROM_POLICY
            - PROMOTING_TO_STANDARD
            - STANDARD
documentation:
    command: Lists information about the managed permission and its associations to any resource shares that use this managed permission. This lets you see which resource shares use which versions of the specified managed permission.
    flag:
        association-status: Specifies that you want to list only those associations with resource shares that match this status.
        default-version: |-
            When `true`, specifies that you want to list only those associations with resource shares that use the default version of the specified managed permission.

            When `false` (the default value), lists associations with resource shares that use any version of the specified managed permission.
        feature-set: Specifies that you want to list only those associations with resource shares that have a `featureSet` with this value.
        max-results: Specifies the total number of results that you want included on each page of the response. If you do not include this parameter, it defaults to a value that is specific to the operation. If additional items exist beyond the number you specify, the `NextToken` response element is returned with a value (not null). Include the specified value as the `NextToken` request parameter in the next call to the operation to get the next part of the results. Note that the service might return fewer results than the maximum even when there are more results available. You should check `NextToken` after every operation to ensure that you receive all of the results.
        next-token: Specifies that you want to receive the next page of results. Valid only if you received a `NextToken` response in the previous request. If you did, it indicates that more output is available. Set this parameter to the value provided by the previous call's `NextToken` response to request the next page of results.
        permission-arn: Specifies the [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of the managed permission.
        permission-version: Specifies that you want to list only those associations with resource shares that use this version of the managed permission. If you don't provide a value for this parameter, then the operation returns information about associations with resource shares that use any version of the managed permission.
        resource-type: Specifies that you want to list only those associations with resource shares that include at least one resource of this resource type.
