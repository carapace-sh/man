name: deidentify
description: '*(BETA)*  Create a new Cloud Healthcare API dataset containing de-identified data from the source dataset.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --default-fhir-config: Deidentify FHIR data with default configurations.
    --destination-dataset=!: The name of the dataset resource to which the redacted data should be written
    --dicom-filter-tags=: Tags to be filtered.
    --location=: Google Cloud location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-default-fhir-config&: Deidentify FHIR data with default configurations.
    --text-redaction-mode=: Determines how to redact text from image.
completion:
    flag:
        text-redaction-mode:
            - all
documentation:
    command: |
        *(BETA)*  Create a new Cloud Healthcare API dataset containing de-identified data from the source dataset.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        default-fhir-config: Deidentify FHIR data with default configurations.
        destination-dataset: |-
            The name of the dataset resource to which the redacted data should be written
            (e.g., projects/{projectId}/locations/{locationId}/datasets/{datasetId}).
            The new dataset must not exist, or the request will fail.
        dicom-filter-tags: |-
            Tags to be filtered. Tags must be DICOM Data Elements, File Meta Elements, or
            Directory Structuring Elements, as defined at:
            http://dicom.nema.org/medical/dicom/current/output/html/part06.html#table_6-1,.
            They may be provided by "Keyword" or "Tag". For example "PatientID", "0010,0010".
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `dataset` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-default-fhir-config: |
            Deidentify FHIR data with default configurations.
        text-redaction-mode: |-
            Determines how to redact text from image. _TEXT_REDACTION_MODE_ must be (only one value is supported):
            +
            *all*::: Redact all text.
            +
            :::
            +
