name: untag-resource
description: Deletes the metadata tags from the Amazon RDS Performance Insights resource.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-arn=!: The Amazon RDS Performance Insights resource that the tags are added to.
    --service-type=!: List the tags for the Amazon Web Services service for which Performance Insights returns metrics.
    --tag-keys=!:
        description: The metadata assigned to an Amazon RDS Performance Insights resource consisting of a key-value pair.
        nargs: -1
completion:
    flag:
        service-type:
            - RDS
            - DOCDB
documentation:
    command: Deletes the metadata tags from the Amazon RDS Performance Insights resource.
    flag:
