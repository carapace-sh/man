name: describe
description: Show metadata of a backup for a Looker instance.
flags:
    --instance=: The name of the Looker instance.
    --region=: The name of the Looker region of the backup.
documentation:
    command: |
        Show metadata of a backup for a Looker instance.

        Displays all metadata associated with a backup of a Looker instance given a valid backup and
        instance name.

        This command can fail for the following reasons:
          * The instance specified does not exist.
          * The backup specified does not exist.
          * The active account does not have permission to access the given
            instance and backups.
    flag:
        instance: |-
            The name of the Looker instance.
            +
            To set the `instance` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        region: |-
            The name of the Looker region of the backup. Overrides the default
            looker/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `looker/region`.
