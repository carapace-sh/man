name: modify-hosts
description: Modify the auto-placement setting of a Dedicated Host.
flags:
    --auto-placement=: Specify whether to enable or disable auto-placement.
    --host-ids=!: The IDs of the Dedicated Hosts to modify.
    --host-maintenance=: Indicates whether to enable or disable host maintenance for the Dedicated Host.
    --host-recovery=: Indicates whether to enable or disable host recovery for the Dedicated Host.
    --instance-family=: Specifies the instance family to be supported by the Dedicated Host.
    --instance-type=: Specifies the instance type to be supported by the Dedicated Host.
completion:
    flag:
        auto-placement:
            - "on"
            - "off"
        host-maintenance:
            - "on"
            - "off"
        host-recovery:
            - "on"
            - "off"
documentation:
    command: |-
        Modify the auto-placement setting of a Dedicated Host. When auto-placement is enabled, any instances that you launch with a tenancy of `host` but without a specific host ID are placed onto any available Dedicated Host in your account that has auto-placement enabled. When auto-placement is disabled, you need to provide a host ID to have the instance launch onto a specific host. If no host ID is provided, the instance is launched onto a suitable host with auto-placement enabled.

        You can also use this API action to modify a Dedicated Host to support either multiple instance types in an instance family, or to support a specific instance type only.
    flag:
        auto-placement: Specify whether to enable or disable auto-placement.
        host-ids: The IDs of the Dedicated Hosts to modify.
        host-maintenance: Indicates whether to enable or disable host maintenance for the Dedicated Host. For more information, see [Host maintenance](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-maintenance.html) in the *Amazon EC2 User Guide*.
        host-recovery: Indicates whether to enable or disable host recovery for the Dedicated Host. For more information, see [Host recovery](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-recovery.html) in the *Amazon EC2 User Guide*.
        instance-family: |-
            Specifies the instance family to be supported by the Dedicated Host. Specify this parameter to modify a Dedicated Host to support multiple instance types within its current instance family.

            If you want to modify a Dedicated Host to support a specific instance type only, omit this parameter and specify **InstanceType** instead. You cannot specify **InstanceFamily** and **InstanceType** in the same request.
        instance-type: |-
            Specifies the instance type to be supported by the Dedicated Host. Specify this parameter to modify a Dedicated Host to support only a specific instance type.

            If you want to modify a Dedicated Host to support multiple instance types in its current instance family, omit this parameter and specify **InstanceFamily** instead. You cannot specify **InstanceType** and **InstanceFamily** in the same request.
