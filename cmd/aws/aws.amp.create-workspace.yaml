name: create-workspace
description: Creates a Prometheus workspace.
flags:
    --alias=: An alias that you assign to this workspace to help you identify it.
    --client-token=: A unique identifier that you can provide to ensure the idempotency of the request.
    --kms-key-arn=: (optional) The ARN for a customer managed KMS key to use for encrypting data within your workspace.
    --tags=: The list of tag keys and values to associate with the workspace.
documentation:
    command: Creates a Prometheus workspace. A workspace is a logical space dedicated to the storage and querying of Prometheus metrics. You can have one or more workspaces in each Region in your account.
    flag:
        alias: |-
            An alias that you assign to this workspace to help you identify it. It does not need to be unique.

            Blank spaces at the beginning or end of the alias that you specify will be trimmed from the value used.
        client-token: A unique identifier that you can provide to ensure the idempotency of the request. Case-sensitive.
        kms-key-arn: (optional) The ARN for a customer managed KMS key to use for encrypting data within your workspace. For more information about using your own key in your workspace, see [Encryption at rest](https://docs.aws.amazon.com/prometheus/latest/userguide/encryption-at-rest-Amazon-Service-Prometheus.html) in the *Amazon Managed Service for Prometheus User Guide*.
        tags: The list of tag keys and values to associate with the workspace.
