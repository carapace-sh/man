name: create-threat-entity-set
description: Creates a new threat entity set.
flags:
    --activate!: A boolean value that indicates whether GuardDuty should start using the uploaded threat entity set to generate findings.
    --client-token=: The idempotency token for the create request.
    --detector-id=!: The unique ID of the detector of the GuardDuty account for which you want to create a threat entity set.
    --expected-bucket-owner=: The Amazon Web Services account ID that owns the Amazon S3 bucket specified in the **location** parameter.
    --format=!: The format of the file that contains the threat entity set.
    --location=!: The URI of the file that contains the threat entity set.
    --name=!: A user-friendly name to identify the threat entity set.
    --no-activate!&: A boolean value that indicates whether GuardDuty should start using the uploaded threat entity set to generate findings.
    --tags=: The tags to be added to a new threat entity set resource.
completion:
    flag:
        format:
            - TXT
            - STIX
            - OTX_CSV
            - ALIEN_VAULT
            - PROOF_POINT
            - FIRE_EYE
documentation:
    command: Creates a new threat entity set. In a threat entity set, you can provide known malicious IP addresses and domains for your Amazon Web Services environment. GuardDuty generates findings based on the entries in the threat entity sets. Only users of the administrator account can manage entity sets, which automatically apply to member accounts.
    flag:
        activate: A boolean value that indicates whether GuardDuty should start using the uploaded threat entity set to generate findings.
        client-token: The idempotency token for the create request.
        detector-id: |-
            The unique ID of the detector of the GuardDuty account for which you want to create a threat entity set.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        expected-bucket-owner: The Amazon Web Services account ID that owns the Amazon S3 bucket specified in the **location** parameter.
        format: The format of the file that contains the threat entity set.
        location: 'The URI of the file that contains the threat entity set. The format of the `Location` URL must be a valid Amazon S3 URL format. Invalid URL formats will result in an error, regardless of whether you activate the entity set or not. For more information about format of the location URLs, see [Format of location URL under Step 2: Adding trusted or threat intelligence data](https://docs.aws.amazon.com/guardduty/latest/ug/guardduty-lists-create-activate.html) in the *Amazon GuardDuty User Guide*.'
        name: |-
            A user-friendly name to identify the threat entity set.

            The name of your list can include lowercase letters, uppercase letters, numbers, dash (-), and underscore (\_).
        tags: The tags to be added to a new threat entity set resource.
