name: untag-resource
description: Remove tags from an App Runner resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource that you want to remove tags from.
    --tag-keys=!: A list of tag keys that you want to remove.
documentation:
    command: Remove tags from an App Runner resource.
    flag:
        resource-arn: |-
            The Amazon Resource Name (ARN) of the resource that you want to remove tags from.

            It must be the ARN of an App Runner resource.
        tag-keys: A list of tag keys that you want to remove.
