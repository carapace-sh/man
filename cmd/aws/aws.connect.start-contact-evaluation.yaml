name: start-contact-evaluation
description: Starts an empty evaluation in the specified Amazon Connect instance, using the given evaluation form for the particular contact.
flags:
    --auto-evaluation-configuration=: Whether automated evaluations are enabled.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --contact-id=!: The identifier of the contact in this instance of Amazon Connect.
    --evaluation-form-id=!: The unique identifier for the evaluation form.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --tags=: The tags used to organize, track, or control access for this resource.
documentation:
    command: |-
        Starts an empty evaluation in the specified Amazon Connect instance, using the given evaluation form for the particular contact. The evaluation form version used for the contact evaluation corresponds to the currently activated version. If no version is activated for the evaluation form, the contact evaluation cannot be started.

        Evaluations created through the public API do not contain answer values suggested from automation.
    flag:
        auto-evaluation-configuration: Whether automated evaluations are enabled.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        contact-id: The identifier of the contact in this instance of Amazon Connect.
        evaluation-form-id: The unique identifier for the evaluation form.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        tags: 'The tags used to organize, track, or control access for this resource. For example, { "Tags": {"key1":"value1", "key2":"value2"} }.'
