name: delete-text-message-spend-limit-override
description: Deletes an account-level monthly spending limit override for sending text messages.
documentation:
    command: Deletes an account-level monthly spending limit override for sending text messages. Deleting a spend limit override will set the `EnforcedLimit` to equal the `MaxLimit`, which is controlled by Amazon Web Services. For more information on spend limits (quotas) see [Quotas](https://docs.aws.amazon.com/sms-voice/latest/userguide/quotas.html) in the *End User MessagingSMS User Guide*.
