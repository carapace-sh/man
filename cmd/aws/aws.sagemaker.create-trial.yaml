name: create-trial
description: Creates an SageMaker *trial*.
flags:
    --display-name=: The name of the trial as displayed.
    --experiment-name=!: The name of the experiment to associate the trial with.
    --metadata-properties=: ""
    --tags=: A list of tags to associate with the trial.
    --trial-name=!: The name of the trial.
documentation:
    command: |-
        Creates an SageMaker *trial*. A trial is a set of steps called *trial components* that produce a machine learning model. A trial is part of a single SageMaker *experiment*.

        When you use SageMaker Studio or the SageMaker Python SDK, all experiments, trials, and trial components are automatically tracked, logged, and indexed. When you use the Amazon Web Services SDK for Python (Boto), you must use the logging APIs provided by the SDK.

        You can add tags to a trial and then use the [Search](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_Search.html) API to search for the tags.

        To get a list of all your trials, call the [ListTrials](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_ListTrials.html) API. To view a trial's properties, call the [DescribeTrial](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_DescribeTrial.html) API. To create a trial component, call the [CreateTrialComponent](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateTrialComponent.html) API.
    flag:
        display-name: The name of the trial as displayed. The name doesn't need to be unique. If `DisplayName` isn't specified, `TrialName` is displayed.
        experiment-name: The name of the experiment to associate the trial with.
        metadata-properties: ""
        tags: A list of tags to associate with the trial. You can use [Search](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_Search.html) API to search on the tags.
        trial-name: The name of the trial. The name must be unique in your Amazon Web Services account and is not case-sensitive.
