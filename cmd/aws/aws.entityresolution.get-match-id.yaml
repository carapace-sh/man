name: get-match-id
description: Returns the corresponding Match ID of a customer record if the record has been processed in a rule-based matching workflow.
flags:
    --apply-normalization: Normalizes the attributes defined in the schema in the input data.
    --no-apply-normalization&: Normalizes the attributes defined in the schema in the input data.
    --record=!: The record to fetch the Match ID for.
    --workflow-name=!: The name of the workflow.
documentation:
    command: |-
        Returns the corresponding Match ID of a customer record if the record has been processed in a rule-based matching workflow.

        You can call this API as a dry run of an incremental load on the rule-based matching workflow.
    flag:
        apply-normalization: Normalizes the attributes defined in the schema in the input data. For example, if an attribute has an `AttributeType` of `PHONE_NUMBER`, and the data in the input table is in a format of 1234567890, Entity Resolution will normalize this field in the output to (123)-456-7890.
        record: The record to fetch the Match ID for.
        workflow-name: The name of the workflow.
