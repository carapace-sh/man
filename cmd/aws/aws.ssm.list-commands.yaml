name: list-commands
description: Lists the commands requested by users of the Amazon Web Services account.
flags:
    --command-id=: (Optional) If provided, lists only the specified command.
    --filters=: (Optional) One or more filters.
    --instance-id=: (Optional) Lists commands issued against this managed node ID.
    --max-results=: (Optional) The maximum number of items to return for this call.
    --next-token=: (Optional) The token for the next set of items to return.
documentation:
    command: Lists the commands requested by users of the Amazon Web Services account.
    flag:
        command-id: (Optional) If provided, lists only the specified command.
        filters: (Optional) One or more filters. Use a filter to return a more specific list of results.
        instance-id: |-
            (Optional) Lists commands issued against this managed node ID.

            You can't specify a managed node ID in the same command that you specify `Status` = `Pending`. This is because the command hasn't reached the managed node yet.
        max-results: (Optional) The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: (Optional) The token for the next set of items to return. (You received this token from a previous call.)
