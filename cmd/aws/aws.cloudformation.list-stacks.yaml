name: list-stacks
description: Returns the summary information for stacks whose status matches the specified `StackStatusFilter`.
flags:
    --next-token=: The token for the next set of items to return.
    --stack-status-filter=: Stack status to use as a filter.
documentation:
    command: Returns the summary information for stacks whose status matches the specified `StackStatusFilter`. Summary information for stacks that have been deleted is kept for 90 days after the stack is deleted. If no `StackStatusFilter` is specified, summary information for all stacks is returned (including existing stacks and stacks that have been deleted).
    flag:
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        stack-status-filter: Stack status to use as a filter. Specify one or more stack status codes to list only stacks with the specified status codes. For a complete list of stack status codes, see the `StackStatus` parameter of the [Stack]() data type.
