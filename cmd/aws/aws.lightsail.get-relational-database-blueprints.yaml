name: get-relational-database-blueprints
description: Returns a list of available database blueprints in Amazon Lightsail.
flags:
    --page-token=: The token to advance to the next page of results from your request.
documentation:
    command: |-
        Returns a list of available database blueprints in Amazon Lightsail. A blueprint describes the major engine version of a database.

        You can use a blueprint ID to create a new database that runs a specific database engine.
    flag:
        page-token: |-
            The token to advance to the next page of results from your request.

            To get a page token, perform an initial `GetRelationalDatabaseBlueprints` request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
