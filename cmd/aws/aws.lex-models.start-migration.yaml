name: start-migration
description: Starts migrating a bot from Amazon Lex V1 to Amazon Lex V2.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --migration-strategy=!: The strategy used to conduct the migration.
    --v1-bot-name=!: The name of the Amazon Lex V1 bot that you are migrating to Amazon Lex V2.
    --v1-bot-version=!: The version of the bot to migrate to Amazon Lex V2.
    --v2-bot-name=!: The name of the Amazon Lex V2 bot that you are migrating the Amazon Lex V1 bot to.
    --v2-bot-role=!: The IAM role that Amazon Lex uses to run the Amazon Lex V2 bot.
completion:
    flag:
        migration-strategy:
            - CREATE_NEW
            - UPDATE_EXISTING
documentation:
    command: |-
        Starts migrating a bot from Amazon Lex V1 to Amazon Lex V2. Migrate your bot when you want to take advantage of the new features of Amazon Lex V2.

        For more information, see [Migrating a bot](https://docs.aws.amazon.com/lex/latest/dg/migrate.html) in the *Amazon Lex developer guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        migration-strategy: |-
            The strategy used to conduct the migration.

            - `CREATE_NEW` - Creates a new Amazon Lex V2 bot and migrates the Amazon Lex V1 bot to the new bot.
            - `UPDATE_EXISTING` - Overwrites the existing Amazon Lex V2 bot metadata and the locale being migrated. It doesn't change any other locales in the Amazon Lex V2 bot. If the locale doesn't exist, a new locale is created in the Amazon Lex V2 bot.
        v1-bot-name: The name of the Amazon Lex V1 bot that you are migrating to Amazon Lex V2.
        v1-bot-version: The version of the bot to migrate to Amazon Lex V2. You can migrate the `$LATEST` version as well as any numbered version.
        v2-bot-name: |-
            The name of the Amazon Lex V2 bot that you are migrating the Amazon Lex V1 bot to.

            - If the Amazon Lex V2 bot doesn't exist, you must use the `CREATE_NEW` migration strategy.
            - If the Amazon Lex V2 bot exists, you must use the `UPDATE_EXISTING` migration strategy to change the contents of the Amazon Lex V2 bot.
        v2-bot-role: The IAM role that Amazon Lex uses to run the Amazon Lex V2 bot.
