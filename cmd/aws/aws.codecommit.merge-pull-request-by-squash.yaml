name: merge-pull-request-by-squash
description: Attempts to merge the source commit of a pull request into the specified destination branch for that pull request at the specified commit using the squash merge strategy.
flags:
    --author-name=: The name of the author who created the commit.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --commit-message=: The commit message to include in the commit information for the merge.
    --conflict-detail-level=: The level of conflict detail to use.
    --conflict-resolution-strategy=: Specifies which branch to use when resolving conflicts, or whether to attempt automatically merging two versions of a file.
    --conflict-resolution=: If AUTOMERGE is the conflict resolution strategy, a list of inputs to use when resolving conflicts during a merge.
    --email=: The email address of the person merging the branches.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --keep-empty-folders: If the commit contains deletions, whether to keep a folder or folder structure if the changes leave the folders empty.
    --no-keep-empty-folders: If the commit contains deletions, whether to keep a folder or folder structure if the changes leave the folders empty.
    --pull-request-id=!: The system-generated ID of the pull request.
    --repository-name=!: The name of the repository where the pull request was created.
    --source-commit-id=: The full commit ID of the original or updated commit in the pull request source branch.
completion:
    flag:
        conflict-detail-level:
            - FILE_LEVEL
            - LINE_LEVEL
        conflict-resolution-strategy:
            - NONE
            - ACCEPT_SOURCE
            - ACCEPT_DESTINATION
            - AUTOMERGE
documentation:
    command: Attempts to merge the source commit of a pull request into the specified destination branch for that pull request at the specified commit using the squash merge strategy. If the merge is successful, it closes the pull request.
    flag:
        author-name: The name of the author who created the commit. This information is used as both the author and committer for the commit.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        commit-message: The commit message to include in the commit information for the merge.
        conflict-detail-level: The level of conflict detail to use. If unspecified, the default FILE\_LEVEL is used, which returns a not-mergeable result if the same file has differences in both branches. If LINE\_LEVEL is specified, a conflict is considered not mergeable if the same file in both branches has differences on the same line.
        conflict-resolution: If AUTOMERGE is the conflict resolution strategy, a list of inputs to use when resolving conflicts during a merge.
        conflict-resolution-strategy: Specifies which branch to use when resolving conflicts, or whether to attempt automatically merging two versions of a file. The default is NONE, which requires any conflicts to be resolved manually before the merge operation is successful.
        email: The email address of the person merging the branches. This information is used in the commit information for the merge.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        keep-empty-folders: If the commit contains deletions, whether to keep a folder or folder structure if the changes leave the folders empty. If true, a .gitkeep file is created for empty folders. The default is false.
        pull-request-id: The system-generated ID of the pull request. To get this ID, use [ListPullRequests]().
        repository-name: The name of the repository where the pull request was created.
        source-commit-id: The full commit ID of the original or updated commit in the pull request source branch. Pass this value if you want an exception thrown if the current commit ID of the tip of the source branch does not match this commit ID.
