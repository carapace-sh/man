name: describe
description: '*(ALPHA)*  Describe an OS policy assignment report.'
flags:
    --instance=: Compute Engine VM instance.
    --location=: Location of the OS policy assignment.
documentation:
    command: |
        *(ALPHA)*  Describe an OS policy assignment report
        ## EXAMPLES

        To describe the report of an OS policy assignment `my-assignment` for an instance `my-instance` in location `us-central1-a`:

          $ gcloud alpha compute os-config os-policy-assignment-reports describe my-assignment --instance=my-instance --location=us-central1-a

        Or use the relative names or URI of the resource, assuming the project ID is `my-project`:

          $ gcloud alpha compute os-config os-policy-assignment-reports describe projects/my-project/locations/us-central1-a/instances/my-instance/osPolicyAssignments/my-assignment/report

          $ gcloud alpha compute os-config os-policy-assignment-reports describe  https://osconfig.googleapis.com/v1alpha/projects/my-project/locations/us-central1-a/instances/instance-name/osPolicyAssignments/assignment-id/report
    flag:
        instance: |-
            Compute Engine VM instance.
            +

            To set the `instance` attribute:
            * provide the argument `instance_os_policy_assignment` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        location: |-
            Location of the OS policy assignment.
            +

            To set the `location` attribute:
            * provide the argument `instance_os_policy_assignment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
