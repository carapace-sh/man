name: update-chat-response-configuration
description: Updates an existing chat response configuration in an Amazon Q Business application.
flags:
    --application-id=!: The unique identifier of the Amazon Q Business application containing the chat response configuration to update.
    --chat-response-configuration-id=!: The unique identifier of the chat response configuration to update within the specified application.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier to ensure idempotency of the request.
    --display-name=: The new human-readable name to assign to the chat response configuration, making it easier to identify among multiple configurations.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --response-configurations=!: The updated collection of response configuration settings that define how Amazon Q Business generates and formats responses to user queries.
documentation:
    command: Updates an existing chat response configuration in an Amazon Q Business application. This operation allows administrators to modify configuration settings, display name, and response parameters to refine how the system generates responses.
    flag:
        application-id: The unique identifier of the Amazon Q Business application containing the chat response configuration to update.
        chat-response-configuration-id: The unique identifier of the chat response configuration to update within the specified application.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier to ensure idempotency of the request. This helps prevent the same update from being processed multiple times if retries occur.
        display-name: The new human-readable name to assign to the chat response configuration, making it easier to identify among multiple configurations.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        response-configurations: The updated collection of response configuration settings that define how Amazon Q Business generates and formats responses to user queries.
