name: supported-services
description: '*(BETA)*  Retrieve VPC Service Controls Supported Services.'
documentation:
    command: |-
        *(BETA)*  The gcloud beta access-context-manager supported-services command group lets you list VPC Service Controls supported
        services and its properties.

        ## EXAMPLES

        To see all VPC Service Controls supported services:

          $ gcloud beta access-context-manager supported-services list

        To see support information about VPC Service Controls supported services:

          $ gcloud beta access-context-manager supported-services describe SERVICE_NAME
