name: get-lifecycle-policies
description: Gets summary information about all or the specified data lifecycle policies.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-policy-type=: '**\[Default policies only]** Specifies the type of default policy to get.'
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --policy-ids=: The identifiers of the data lifecycle policies.
    --resource-types=: The resource type.
    --state=: The activation state.
    --tags-to-add=: The tags to add to objects created by the policy.
    --target-tags=: The target tag for a policy.
completion:
    flag:
        default-policy-type:
            - VOLUME
            - INSTANCE
            - ALL
        state:
            - ENABLED
            - DISABLED
            - ERROR
documentation:
    command: |-
        Gets summary information about all or the specified data lifecycle policies.

        To get complete information about a policy, use [GetLifecyclePolicy](https://docs.aws.amazon.com/dlm/latest/APIReference/API_GetLifecyclePolicy.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-policy-type: |-
            **\[Default policies only]** Specifies the type of default policy to get. Specify one of the following:

            - `VOLUME` - To get only the default policy for EBS snapshots
            - `INSTANCE` - To get only the default policy for EBS-backed AMIs
            - `ALL` - To get all default policies
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        policy-ids: The identifiers of the data lifecycle policies.
        resource-types: The resource type.
        state: The activation state.
        tags-to-add: |-
            The tags to add to objects created by the policy.

            Tags are strings in the format `key=value`.

            These user-defined tags are added in addition to the Amazon Web Services-added lifecycle tags.
        target-tags: |-
            The target tag for a policy.

            Tags are strings in the format `key=value`.
