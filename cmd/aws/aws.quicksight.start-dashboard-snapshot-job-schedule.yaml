name: start-dashboard-snapshot-job-schedule
description: Starts an asynchronous job that runs an existing dashboard schedule and sends the dashboard snapshot through email.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that the dashboard snapshot job is executed in.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dashboard-id=!: The ID of the dashboard that you want to start a snapshot job schedule for.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --schedule-id=!: The ID of the schedule that you want to start a snapshot job schedule for.
documentation:
    command: |-
        Starts an asynchronous job that runs an existing dashboard schedule and sends the dashboard snapshot through email.

        Only one job can run simultaneously in a given schedule. Repeated requests are skipped with a `202` HTTP status code.

        For more information, see [Scheduling and sending Amazon Quick Sight reports by email](https://docs.aws.amazon.com/quicksight/latest/user/sending-reports.html) and [Configuring email report settings for a Amazon Quick Sight dashboard](https://docs.aws.amazon.com/quicksight/latest/user/email-reports-from-dashboard.html) in the *Amazon Quick Sight User Guide*.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that the dashboard snapshot job is executed in.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dashboard-id: The ID of the dashboard that you want to start a snapshot job schedule for.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        schedule-id: The ID of the schedule that you want to start a snapshot job schedule for. The schedule ID can be found in the Amazon Quick Sight console in the **Schedules** pane of the dashboard that the schedule is configured for.
