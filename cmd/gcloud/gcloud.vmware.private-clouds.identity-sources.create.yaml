name: create
description: Create a Google Cloud VMware Engine identity source.
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --base-groups-dn=!: The base distinguished name for groups.
    --base-users-dn=!: The base distinguished name for users.
    --domain-alias=: The domain alias of the identity source.
    --domain-password=!: Password of the user in the domain who has a minimum of read-only access to the base distinguished names of users and groups.
    --domain-user=!: ID of a user in the domain who has a minimum of read-only access to the base distinguished names of users and groups.
    --domain=!: The domain name of the identity source.
    --location=: Location of the private cloud or cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --primary-server=!: Primary domain controller LDAP server for the domain.
    --private-cloud=: VMware Engine private cloud.
    --protocol=!: The LDAP server connection protocol.
    --secondary-server=: Secondary domain controller LDAP server for the domain.
    --ssl-certificate-from-file=: Path to the root CA certificate files in CER format for the LDAPS server.
completion:
    flag:
        protocol:
            - LDAP
            - LDAPS
documentation:
    command: |
        Create a new identity source resource in a given private cloud.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        base-groups-dn: The base distinguished name for groups.
        base-users-dn: The base distinguished name for users.
        domain: The domain name of the identity source.
        domain-alias: The domain alias of the identity source.
        domain-password: Password of the user in the domain who has a minimum of read-only access to the base distinguished names of users and groups.
        domain-user: ID of a user in the domain who has a minimum of read-only access to the base distinguished names of users and groups.
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `identity_source` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        primary-server: |-
            Primary domain controller LDAP server for the domain.
            Format `ldap://hostname:port` or `ldaps://hostname:port`
        private-cloud: |-
            VMware Engine private cloud.
            +
            To set the `private-cloud` attribute:
            * provide the argument `identity_source` on the command line with a fully specified name;
            * provide the argument `--private-cloud` on the command line.
        protocol: 'The LDAP server connection protocol. _PROTOCOL_ must be one of: *LDAP*, *LDAPS*.'
        secondary-server: |-
            Secondary domain controller LDAP server for the domain.
            Format `ldap://hostname:port` or `ldaps://hostname:port`
        ssl-certificate-from-file: Path to the root CA certificate files in CER format for the LDAPS server. Can be passed multiple times.
