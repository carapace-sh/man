name: create-hub-content-presigned-urls
description: Creates presigned URLs for accessing hub content artifacts.
flags:
    --access-config=: Configuration settings for accessing the hub content, including end-user license agreement acceptance for gated models and expected S3 URL validation.
    --hub-content-name=!: The name of the hub content for which to generate presigned URLs.
    --hub-content-type=!: The type of hub content to access.
    --hub-content-version=: The version of the hub content.
    --hub-name=!: The name or Amazon Resource Name (ARN) of the hub that contains the content.
    --max-results=: The maximum number of presigned URLs to return in the response.
    --next-token=: A token for pagination.
completion:
    flag:
        hub-content-type:
            - Model
            - Notebook
            - ModelReference
documentation:
    command: Creates presigned URLs for accessing hub content artifacts. This operation generates time-limited, secure URLs that allow direct download of model artifacts and associated files from Amazon SageMaker hub content, including gated models that require end-user license agreement acceptance.
    flag:
        access-config: Configuration settings for accessing the hub content, including end-user license agreement acceptance for gated models and expected S3 URL validation.
        hub-content-name: The name of the hub content for which to generate presigned URLs. This identifies the specific model or content within the hub.
        hub-content-type: The type of hub content to access. Valid values include `Model`, `Notebook`, and `ModelReference`.
        hub-content-version: The version of the hub content. If not specified, the latest version is used.
        hub-name: The name or Amazon Resource Name (ARN) of the hub that contains the content. For public content, use `SageMakerPublicHub`.
        max-results: The maximum number of presigned URLs to return in the response. Default value is 100. Large models may contain hundreds of files, requiring pagination to retrieve all URLs.
        next-token: A token for pagination. Use this token to retrieve the next set of presigned URLs when the response is truncated.
