name: list-managed-job-templates
description: Returns a list of managed job templates.
flags:
    --max-results=: Maximum number of entries that can be returned.
    --next-token=: The token to retrieve the next set of results.
    --template-name=: An optional parameter for template name.
documentation:
    command: Returns a list of managed job templates.
    flag:
        max-results: Maximum number of entries that can be returned.
        next-token: The token to retrieve the next set of results.
        template-name: An optional parameter for template name. If specified, only the versions of the managed job templates that have the specified template name will be returned.
