name: stop-suite-run
description: Stops a Device Advisor test suite run that is currently running.
flags:
    --suite-definition-id=!: Suite definition ID of the test suite run to be stopped.
    --suite-run-id=!: Suite run ID of the test suite run to be stopped.
documentation:
    command: |-
        Stops a Device Advisor test suite run that is currently running.

        Requires permission to access the [StopSuiteRun](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        suite-definition-id: Suite definition ID of the test suite run to be stopped.
        suite-run-id: Suite run ID of the test suite run to be stopped.
