name: restore
description: '*(BETA)*  Restore a Filestore instance from a backup.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --file-share=!: File share to restore from the backup.
    --location=: Location of the Filestore instance to restore this backup to.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --source-backup-region=!: Region of the Filestore backup to restore from.
    --source-backup=!: Name of the Filestore backup to restore from.
    --zone=: The zone of the Filestore instance.
documentation:
    command: |
        *(BETA)*  Restore an existing Filestore instance from an existing backup.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        file-share: File share to restore from the backup.
        location: Location of the Filestore instance to restore this backup to.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        source-backup: Name of the Filestore backup to restore from.
        source-backup-region: Region of the Filestore backup to restore from.
        zone: |-
            The zone of the Filestore instance.
            +

            To set the `zone` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * provide the argument `--location` on the command line;
            * set the property `filestore/zone`.
