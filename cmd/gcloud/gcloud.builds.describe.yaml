name: describe
description: Get information about a particular build.
flags:
    --region=: The region of the Cloud Build Service to use.
documentation:
    command: Get information about a particular build.
    flag:
        region: |-
            The region of the Cloud Build Service to use.
            Must be set to a supported region name (e.g. `us-central1`).
            If unset, `builds/region`, which is the default region to use when working with Cloud Build resources, is used. If builds/region is unset, region is set to `global`.
            Note: Region must be specified in 2nd gen repo; `global` is not supported.
