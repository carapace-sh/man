name: create
description: '*(ALPHA)*  Create a Compute Engine router.'
flags:
    --advertisement-mode=: The new advertisement mode for this router.
    --asn=: The optional BGP autonomous system number (ASN) for this router.
    --async: Return immediately, without waiting for the operation in progress to
    --bgp-identifier-range=: The range of valid BGP Identifiers for this Router.
    --description=: An optional description of this router.
    --encrypted-interconnect-router: Indicates if a router is dedicated for use with encrypted interconnect attachments (VLAN attachments).
    --keepalive-interval=: The interval between BGP keepalive messages that are sent to the peer.
    --ncc-gateway=: The NCC gateway for this router.
    --network=: The network for this router
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-encrypted-interconnect-router&: Indicates if a router is dedicated for use with encrypted interconnect attachments (VLAN attachments).
    --region=: Region of the router to create.
    --resource-manager-tags=: Comma-separated list of Resource Manager tags to attach to the router.
    --set-advertisement-groups=: The list of pre-defined groups of IP ranges to dynamically
    --set-advertisement-ranges=: The list of individual IP ranges, in CIDR format, to dynamically
completion:
    flag:
        advertisement-mode:
            - CUSTOM
            - DEFAULT
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute routers create* is used to create a router to provide dynamic routing to VPN
        tunnels and interconnects.
    flag:
        advertisement-mode: |-
            The new advertisement mode for this router. _MODE_ must be one of:
            +
            *CUSTOM*::: Custom (user-configured) BGP advertisements.
            *DEFAULT*::: Default (Google-managed) BGP advertisements.
            :::
            +
        asn: The optional BGP autonomous system number (ASN) for this router. Must be a 16-bit or 32-bit private ASN as defined in https://tools.ietf.org/html/rfc6996, for example `--asn=64512`.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        bgp-identifier-range: The range of valid BGP Identifiers for this Router. Must be a link-local IPv4 range from 169.254.0.0/16, of size at least /30, even if the BGP sessions are over IPv6. It must not overlap with any IPv4 BGP session ranges. This is commonly called "router ID" by other vendors.
        description: An optional description of this router.
        encrypted-interconnect-router: Indicates if a router is dedicated for use with encrypted interconnect attachments (VLAN attachments).
        keepalive-interval: |-
            The interval between BGP keepalive messages that are sent to the peer. If set, this value must be between 20 and 60 seconds. The default is 20 seconds. See $ gcloud topic datetimes for information on duration formats.
            +
            BGP systems exchange keepalive messages to determine whether a link or host has failed or is no longer available. Hold time is the length of time in seconds that the BGP session is considered operational without any activity. After the hold time expires, the session is dropped.
            +
            Hold time is three times the interval at which keepalive messages are sent, and the hold time is the maximum number of seconds allowed to elapse between successive keepalive messages that BGP receives from a peer. BGP will use the smaller of either the local hold time value or the peer's  hold time value as the hold time for the BGP connection between the two peers.
        ncc-gateway: The NCC gateway for this router.
        network: The network for this router
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-encrypted-interconnect-router: Indicates if a router is dedicated for use with encrypted interconnect attachments (VLAN attachments).
        region: |-
            Region of the router to create. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        resource-manager-tags: |-
            Comma-separated list of Resource Manager tags to attach to the router. Key-value pairs must be provided in the form tagKeys/{TagKey_Numeric_ID}=tagValues/{TagValue_Numeric_ID}.
            See [Listing tag keys](https://cloud.google.com/resource-manager/docs/tags/tags-creating-and-managing#listing_keys).
        set-advertisement-groups: |-
            The list of pre-defined groups of IP ranges to dynamically
                          advertise on this router. This list can only be specified in
                          custom advertisement mode.
            +
            _GROUP_ must be (only one value is supported):
            +
            *ALL_SUBNETS*::: Automatically advertise all available subnets. This excludes any routes learned for subnets that use VPC Network Peering.
            :::
            +
        set-advertisement-ranges: |-
            The list of individual IP ranges, in CIDR format, to dynamically
                          advertise on this router. Each IP range can (optionally) be given a
                          text description DESC. For example, to advertise a specific range,
                          use `--set-advertisement-ranges=192.168.10.0/24`.  To store a
                          description with the range, use
                          `--set-advertisement-ranges=192.168.10.0/24=my-networks`. This
                          list can only be specified in custom advertisement mode.
