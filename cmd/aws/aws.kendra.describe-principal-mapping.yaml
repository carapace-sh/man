name: describe-principal-mapping
description: Describes the processing of `PUT` and `DELETE` actions for mapping users to their groups.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-source-id=: The identifier of the data source to check the processing of `PUT` and `DELETE` actions for mapping users to their groups.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-id=!: The identifier of the group required to check the processing of `PUT` and `DELETE` actions for mapping users to their groups.
    --index-id=!: The identifier of the index required to check the processing of `PUT` and `DELETE` actions for mapping users to their groups.
documentation:
    command: |-
        Describes the processing of `PUT` and `DELETE` actions for mapping users to their groups. This includes information on the status of actions currently processing or yet to be processed, when actions were last updated, when actions were received by Amazon Kendra, the latest action that should process and apply after other actions, and useful error messages if an action could not be processed.

        `DescribePrincipalMapping` is currently not supported in the Amazon Web Services GovCloud (US-West) region.
