name: list-trials
description: Lists the trials in your account.
flags:
    --created-after=: A filter that returns only trials created after the specified time.
    --created-before=: A filter that returns only trials created before the specified time.
    --experiment-name=: A filter that returns only trials that are part of the specified experiment.
    --max-results=: The maximum number of trials to return in the response.
    --next-token=: If the previous call to `ListTrials` didn't return the full set of trials, the call returns a token for getting the next set of trials.
    --sort-by=: The property used to sort results.
    --sort-order=: The sort order.
    --trial-component-name=: A filter that returns only trials that are associated with the specified trial component.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
        sort-order:
            - Ascending
            - Descending
documentation:
    command: Lists the trials in your account. Specify an experiment name to limit the list to the trials that are part of that experiment. Specify a trial component name to limit the list to the trials that associated with that trial component. The list can be filtered to show only trials that were created in a specific time range. The list can be sorted by trial name or creation time.
    flag:
        created-after: A filter that returns only trials created after the specified time.
        created-before: A filter that returns only trials created before the specified time.
        experiment-name: A filter that returns only trials that are part of the specified experiment.
        max-results: The maximum number of trials to return in the response. The default value is 10.
        next-token: If the previous call to `ListTrials` didn't return the full set of trials, the call returns a token for getting the next set of trials.
        sort-by: The property used to sort results. The default value is `CreationTime`.
        sort-order: The sort order. The default value is `Descending`.
        trial-component-name: A filter that returns only trials that are associated with the specified trial component.
