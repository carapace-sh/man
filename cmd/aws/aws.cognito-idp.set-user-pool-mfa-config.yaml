name: set-user-pool-mfa-config
description: Sets user pool multi-factor authentication (MFA) and passkey configuration.
flags:
    --email-mfa-configuration=: Sets configuration for user pool email message MFA and sign-in with one-time passwords (OTPs).
    --mfa-configuration=: Sets multi-factor authentication (MFA) to be on, off, or optional.
    --sms-mfa-configuration=: Configures user pool SMS messages for MFA.
    --software-token-mfa-configuration=: Configures a user pool for time-based one-time password (TOTP) MFA.
    --user-pool-id=!: The user pool ID.
    --web-authn-configuration=: The configuration of your user pool for passkey, or WebAuthn, authentication and registration.
completion:
    flag:
        mfa-configuration:
            - "OFF"
            - "ON"
            - OPTIONAL
documentation:
    command: |-
        Sets user pool multi-factor authentication (MFA) and passkey configuration. For more information about user pool MFA, see [Adding MFA](https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-mfa.html). For more information about WebAuthn passkeys see [Authentication flows](https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-authentication-flow-methods.html#amazon-cognito-user-pools-authentication-flow-methods-passkey).

        This action might generate an SMS text message. Starting June 1, 2021, US telecom carriers require you to register an origination phone number before you can send SMS messages to US phone numbers. If you use SMS text messages in Amazon Cognito, you must register a phone number with [Amazon Pinpoint](https://console.aws.amazon.com/pinpoint/home/). Amazon Cognito uses the registered number automatically. Otherwise, Amazon Cognito users who must receive SMS messages might not be able to sign up, activate their accounts, or sign in.

        If you have never used SMS text messages with Amazon Cognito or any other Amazon Web Services service, Amazon Simple Notification Service might place your account in the SMS sandbox. In [*sandbox mode*](https://docs.aws.amazon.com/sns/latest/dg/sns-sms-sandbox.html) , you can send messages only to verified phone numbers. After you test your app while in the sandbox environment, you can move out of the sandbox and into production. For more information, see [SMS message settings for Amazon Cognito user pools](https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-sms-settings.html) in the *Amazon Cognito Developer Guide*.
    flag:
        email-mfa-configuration: Sets configuration for user pool email message MFA and sign-in with one-time passwords (OTPs). Includes the subject and body of the email message template for sign-in and MFA messages. To activate this setting, your user pool must be in the [Essentials tier](https://docs.aws.amazon.com/cognito/latest/developerguide/feature-plans-features-essentials.html) or higher.
        mfa-configuration: |-
            Sets multi-factor authentication (MFA) to be on, off, or optional. When `ON`, all users must set up MFA before they can sign in. When `OPTIONAL`, your application must make a client-side determination of whether a user wants to register an MFA device. For user pools with adaptive authentication with threat protection, choose `OPTIONAL`.

            When `MfaConfiguration` is `OPTIONAL`, managed login doesn't automatically prompt users to set up MFA. Amazon Cognito generates MFA prompts in API responses and in managed login for users who have chosen and configured a preferred MFA factor.
        sms-mfa-configuration: Configures user pool SMS messages for MFA. Sets the message template and the SMS message sending configuration for Amazon SNS.
        software-token-mfa-configuration: Configures a user pool for time-based one-time password (TOTP) MFA. Enables or disables TOTP.
        user-pool-id: The user pool ID.
        web-authn-configuration: The configuration of your user pool for passkey, or WebAuthn, authentication and registration. You can set this configuration independent of the MFA configuration options in this operation.
