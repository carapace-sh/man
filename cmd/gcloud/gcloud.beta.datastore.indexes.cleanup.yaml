name: cleanup
description: '*(BETA)*  Remove unused datastore indexes based on your local index configuration.'
flags:
    --database=: The database to operate on.
documentation:
    command: |
        *(BETA)*  This command removes unused datastore indexes based on your local index
        configuration. Any indexes that exist that are not in the index file will be
        removed.
    flag:
        database: |-
            The database to operate on. If not specified, the CLI refers the
            `(default)` database by default.
            +
            For example, to operate on database `testdb`:
            +
              $ {command} --database='testdb'
