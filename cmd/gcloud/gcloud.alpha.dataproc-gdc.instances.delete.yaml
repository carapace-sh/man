name: delete
description: '*(ALPHA)*  Delete a Dataproc GDC service instance.'
hidden: true
flags:
    --allow-missing: If set to true, and the service instance is not found, the request will
    --async: Return immediately, without waiting for the operation in progress to
    --etag=: Optional.
    --location=: Location of the Dataproc GDC resource.
    --no-allow-missing&: If set to true, and the service instance is not found, the request will
    --no-async&: Return immediately, without waiting for the operation in progress to
    --request-id=: An optional request ID to identify requests.
documentation:
    command: '*(ALPHA)*  Delete a Dataproc GDC service instance.'
    flag:
        allow-missing: |-
            If set to true, and the service instance is not found, the request will
            succeed but no action will be taken on the server
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        etag: |-
            Optional. The etag of the service instance. If this is provided, it must
            match the server etag.
        location: |-
            Location of the Dataproc GDC resource.
            +

            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-allow-missing: |
            If set to true, and the service instance is not found, the request will
            succeed but no action will be taken on the server
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        request-id: |-
            An optional request ID to identify requests. If the service receives two identical
            instance delete requests with the same request_id, the second request is
            ignored and the operation that corresponds to the first request is returned for both.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
