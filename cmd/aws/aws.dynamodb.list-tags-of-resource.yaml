name: list-tags-of-resource
description: List all tags on an Amazon DynamoDB resource.
flags:
    --next-token=: An optional string that, if supplied, must be copied from the output of a previous call to ListTagOfResource.
    --resource-arn=!: The Amazon DynamoDB resource with tags to be listed.
documentation:
    command: |-
        List all tags on an Amazon DynamoDB resource. You can call ListTagsOfResource up to 10 times per second, per account.

        For an overview on tagging DynamoDB resources, see [Tagging for DynamoDB](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Tagging.html) in the *Amazon DynamoDB Developer Guide*.
    flag:
        next-token: An optional string that, if supplied, must be copied from the output of a previous call to ListTagOfResource. When provided in this manner, this API fetches the next page of results.
        resource-arn: The Amazon DynamoDB resource with tags to be listed. This value is an Amazon Resource Name (ARN).
