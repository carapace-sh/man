name: enable-rule
description: Enables the specified rule.
flags:
    --event-bus-name=: The name or ARN of the event bus associated with the rule.
    --name=!: The name of the rule.
documentation:
    command: |-
        Enables the specified rule. If the rule does not exist, the operation fails.

        When you enable a rule, incoming events might not immediately start matching to a newly enabled rule. Allow a short period of time for changes to take effect.
    flag:
        event-bus-name: The name or ARN of the event bus associated with the rule. If you omit this, the default event bus is used.
        name: The name of the rule.
