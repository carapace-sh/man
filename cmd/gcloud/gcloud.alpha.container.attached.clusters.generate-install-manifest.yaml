name: generate-install-manifest
description: '*(ALPHA)*  Generate Install Manifest for an Attached cluster.'
flags:
    --location=: Google Cloud location for the cluster.
    --output-file=: Path to the output file to store manifest.
    --platform-version=!: Platform version to use for the cluster.
    --proxy-secret-name=!: Name of the Kubernetes secret that contains the HTTP/HTTPS
    --proxy-secret-namespace=!: Namespace of the Kubernetes secret that contains the HTTP/HTTPS
documentation:
    command: '*(ALPHA)*  Generate Install Manifest for an Attached cluster.'
    flag:
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_attached/location`.
        output-file: Path to the output file to store manifest.
        platform-version: |-
            Platform version to use for the cluster.
            +
            To retrieve a list of valid versions, run:
            +
              $ gcloud alpha container attached get-server-config --location=LOCATION
            +
            Replace ``LOCATION'' with the target Google Cloud location for the cluster.
        proxy-secret-name: |-
            Name of the Kubernetes secret that contains the HTTP/HTTPS
            proxy configuration.
        proxy-secret-namespace: |-
            Namespace of the Kubernetes secret that contains the HTTP/HTTPS
            proxy configuration.
