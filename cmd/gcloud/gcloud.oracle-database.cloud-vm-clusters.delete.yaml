name: delete
description: Delete a CloudVmCluster.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --force: If set to true, all child resources for the VM Cluster will be deleted.
    --location=: The location id of the cloudVmCluster resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-force&: If set to true, all child resources for the VM Cluster will be deleted.
    --request-id=: An optional ID to identify the request.
documentation:
    command: Delete a CloudVmCluster.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        force: |-
            If set to true, all child resources for the VM Cluster will be deleted.
            A VM Cluster can only be deleted once all its child resources have been
            deleted.
        location: |-
            The location id of the cloudVmCluster resource.
            +
            To set the `location` attribute:
            * provide the argument `cloud_vm_cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-force: |-
            If set to true, all child resources for the VM Cluster will be deleted.
            A VM Cluster can only be deleted once all its child resources have been
            deleted.
        request-id: |-
            An optional ID to identify the request. This value is used to identify
            duplicate requests. If you make a request with the same request ID
            and the original request is still in progress or completed, the server
            ignores the second request. This prevents clients from
            accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
