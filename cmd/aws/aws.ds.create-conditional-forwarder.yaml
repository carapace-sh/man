name: create-conditional-forwarder
description: Creates a conditional forwarder associated with your Amazon Web Services directory.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --directory-id=!: The directory ID of the Amazon Web Services directory for which you are creating the conditional forwarder.
    --dns-ip-addrs=:
        description: The IP addresses of the remote DNS server associated with RemoteDomainName.
        nargs: -1
    --dns-ipv6-addrs=:
        description: The IPv6 addresses of the remote DNS server associated with RemoteDomainName.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --remote-domain-name=!: The fully qualified domain name (FQDN) of the remote domain with which you will set up a trust relationship.
documentation:
    command: Creates a conditional forwarder associated with your Amazon Web Services directory. Conditional forwarders are required in order to set up a trust relationship with another domain. The conditional forwarder points to the trusted domain.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        directory-id: The directory ID of the Amazon Web Services directory for which you are creating the conditional forwarder.
        dns-ip-addrs: The IP addresses of the remote DNS server associated with RemoteDomainName.
        dns-ipv6-addrs: The IPv6 addresses of the remote DNS server associated with RemoteDomainName.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        remote-domain-name: The fully qualified domain name (FQDN) of the remote domain with which you will set up a trust relationship.
