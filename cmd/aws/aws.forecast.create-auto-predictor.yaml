completion:
    flag:
        optimization-metric:
            - WAPE
            - RMSE
            - AverageWeightedQuantileLoss
            - MASE
            - MAPE
documentation:
    command: |-
        Creates an Amazon Forecast predictor.

        Amazon Forecast creates predictors with AutoPredictor, which involves applying the optimal combination of algorithms to each time series in your datasets. You can use [CreateAutoPredictor]() to create new predictors or upgrade/retrain existing predictors.

        **Creating new predictors**

        The following parameters are required when creating a new predictor:

        - `PredictorName` - A unique name for the predictor.
        - `DatasetGroupArn` - The ARN of the dataset group used to train the predictor.
        - `ForecastFrequency` - The granularity of your forecasts (hourly, daily, weekly, etc).
        - `ForecastHorizon` - The number of time-steps that the model predicts. The forecast horizon is also called the prediction length.

        When creating a new predictor, do not specify a value for `ReferencePredictorArn`.

        **Upgrading and retraining predictors**

        The following parameters are required when retraining or upgrading a predictor:

        - `PredictorName` - A unique name for the predictor.
        - `ReferencePredictorArn` - The ARN of the predictor to retrain or upgrade.

        When upgrading or retraining a predictor, only specify values for the `ReferencePredictorArn` and `PredictorName`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-config: The data configuration for your dataset group and any additional datasets.
        encryption-config: ""
        explain-predictor: Create an Explainability resource for the predictor.
        forecast-dimensions: |-
            An array of dimension (field) names that specify how to group the generated forecast.

            For example, if you are generating forecasts for item sales across all your stores, and your dataset contains a `store_id` field, you would specify `store_id` as a dimension to group sales forecasts for each store.
        forecast-frequency: |-
            The frequency of predictions in a forecast.

            Valid intervals are an integer followed by Y (Year), M (Month), W (Week), D (Day), H (Hour), and min (Minute). For example, "1D" indicates every day and "15min" indicates every 15 minutes. You cannot specify a value that would overlap with the next larger frequency. That means, for example, you cannot specify a frequency of 60 minutes, because that is equivalent to 1 hour. The valid values for each frequency are the following:

            - Minute - 1-59
            - Hour - 1-23
            - Day - 1-6
            - Week - 1-4
            - Month - 1-11
            - Year - 1

            Thus, if you want every other week forecasts, specify "2W". Or, if you want quarterly forecasts, you specify "3M".

            The frequency must be greater than or equal to the TARGET\_TIME\_SERIES dataset frequency.

            When a RELATED\_TIME\_SERIES dataset is provided, the frequency must be equal to the RELATED\_TIME\_SERIES dataset frequency.
        forecast-horizon: |-
            The number of time-steps that the model predicts. The forecast horizon is also called the prediction length.

            The maximum forecast horizon is the lesser of 500 time-steps or 1/4 of the TARGET\_TIME\_SERIES dataset length. If you are retraining an existing AutoPredictor, then the maximum forecast horizon is the lesser of 500 time-steps or 1/3 of the TARGET\_TIME\_SERIES dataset length.

            If you are upgrading to an AutoPredictor or retraining an existing AutoPredictor, you cannot update the forecast horizon parameter. You can meet this requirement by providing longer time-series in the dataset.
        forecast-types: The forecast types used to train a predictor. You can specify up to five forecast types. Forecast types can be quantiles from 0.01 to 0.99, by increments of 0.01 or higher. You can also specify the mean forecast with `mean`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        monitor-config: |-
            The configuration details for predictor monitoring. Provide a name for the monitor resource to enable predictor monitoring.

            Predictor monitoring allows you to see how your predictor's performance changes over time. For more information, see [Predictor Monitoring](https://docs.aws.amazon.com/forecast/latest/dg/predictor-monitoring.html).
        optimization-metric: The accuracy metric used to optimize the predictor.
        predictor-name: A unique name for the predictor
        reference-predictor-arn: |-
            The ARN of the predictor to retrain or upgrade. This parameter is only used when retraining or upgrading a predictor. When creating a new predictor, do not specify a value for this parameter.

            When upgrading or retraining a predictor, only specify values for the `ReferencePredictorArn` and `PredictorName`. The value for `PredictorName` must be a unique predictor name.
        tags: |-
            Optional metadata to help you categorize and organize your predictors. Each tag consists of a key and an optional value, both of which you define. Tag keys and values are case sensitive.

            The following restrictions apply to tags:

            - For each resource, each tag key must be unique and each tag key must have one value.
            - Maximum number of tags per resource: 50.
            - Maximum key length: 128 Unicode characters in UTF-8.
            - Maximum value length: 256 Unicode characters in UTF-8.
            - Accepted characters: all letters and numbers, spaces representable in UTF-8, and + - = . _ : / @. If your tagging schema is used across other services and resources, the character restrictions of those services also apply.
            - Key prefixes cannot include any upper or lowercase combination of `aws:` or `AWS:`. Values can have this prefix. If a tag value has `aws` as its prefix but the key does not, Forecast considers it to be a user tag and will count against the limit of 50 tags. Tags with only the key prefix of `aws` do not count against your tags per resource limit. You cannot edit or delete tag keys with this prefix.
        time-alignment-boundary: The time boundary Forecast uses to align and aggregate any data that doesn't align with your forecast frequency. Provide the unit of time and the time boundary as a key value pair. For more information on specifying a time boundary, see [Specifying a Time Boundary](https://docs.aws.amazon.com/forecast/latest/dg/data-aggregation.html#specifying-time-boundary). If you don't provide a time boundary, Forecast uses a set of [Default Time Boundaries](https://docs.aws.amazon.com/forecast/latest/dg/data-aggregation.html#default-time-boundaries).
