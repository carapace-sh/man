name: activate-email-contact
description: Activates an email contact using an activation code.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the resource.
    --code=!: The activation code for this email contact.
documentation:
    command: Activates an email contact using an activation code. This code is in the activation email sent to the email address associated with this email contact.
    flag:
        arn: The Amazon Resource Name (ARN) of the resource.
        code: |-
            The activation code for this email contact.

            An email contact has a maximum of five activation attempts. Activation codes expire after 12 hours and are generated by the [SendActivationCode](https://docs.aws.amazon.com/notificationscontacts/latest/APIReference/API_SendActivationCode.html) API action.
