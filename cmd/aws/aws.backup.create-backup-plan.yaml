name: create-backup-plan
description: Creates a backup plan using a backup plan name and backup rules.
flags:
    --backup-plan-tags=: The tags to assign to the backup plan.
    --backup-plan=!: The body of a backup plan.
    --creator-request-id=: Identifies the request and allows failed requests to be retried without the risk of running the operation twice.
documentation:
    command: |-
        Creates a backup plan using a backup plan name and backup rules. A backup plan is a document that contains information that Backup uses to schedule tasks that create recovery points for resources.

        If you call `CreateBackupPlan` with a plan that already exists, you receive an `AlreadyExistsException` exception.
    flag:
        backup-plan: The body of a backup plan. Includes a `BackupPlanName` and one or more sets of `Rules`.
        backup-plan-tags: The tags to assign to the backup plan.
        creator-request-id: |-
            Identifies the request and allows failed requests to be retried without the risk of running the operation twice. If the request includes a `CreatorRequestId` that matches an existing backup plan, that plan is returned. This parameter is optional.

            If used, this parameter must contain 1 to 50 alphanumeric or '-\_.' characters.
