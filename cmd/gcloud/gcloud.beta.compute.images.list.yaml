documentation:
    command: |
        *(BETA)*  *gcloud beta compute images list* displays all Google Compute Engine images in a project.
    flag:
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        image-zone: Zone to query. Returns the latest image available in the image family, for the specified zone. If not specified, returns the latest globally available image.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        no-preview-images: |
            Show images that are in limited preview. The preview image projects
            are: (none)
        no-show-deprecated: If provided, deprecated images are shown.
        no-show-preview-images: THIS ARGUMENT NEEDS HELP TEXT.
        no-standard-images: |
            List images from public image projects. The public image projects
            that are available include the following: cos-cloud, debian-cloud, rocky-linux-cloud, ubuntu-os-cloud, centos-cloud, fedora-coreos-cloud, opensuse-cloud, oracle-linux-cloud, rhel-cloud, rhel-sap-cloud, rocky-linux-accelerator-cloud, suse-cloud, suse-sap-cloud, ubuntu-os-accelerator-images, ubuntu-os-pro-cloud, windows-cloud, windows-sql-cloud.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        preview-images: |-
            Show images that are in limited preview. The preview image projects
            are: (none)
        regexp: |-
            (DEPRECATED)         Regular expression to filter the names of the results  on. Any names
                    that do not match the entire regular expression will be filtered out.
            +
            Flag `--regexp` is deprecated. Use `--filter="name~'REGEXP'"` instead.
        show-deprecated: If provided, deprecated images are shown.
        show-preview-images: THIS ARGUMENT NEEDS HELP TEXT.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        standard-images: |-
            List images from public image projects. The public image projects
            that are available include the following: cos-cloud, debian-cloud, rocky-linux-cloud, ubuntu-os-cloud, centos-cloud, fedora-coreos-cloud, opensuse-cloud, oracle-linux-cloud, rhel-cloud, rhel-sap-cloud, rocky-linux-accelerator-cloud, suse-cloud, suse-sap-cloud, ubuntu-os-accelerator-images, ubuntu-os-pro-cloud, windows-cloud, windows-sql-cloud. Enabled by default, use *--no-standard-images* to disable.
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
