name: chat-sync
description: Starts or continues a non-streaming Amazon Q Business conversation.
flags:
    --action-execution=: A request from an end user to perform an Amazon Q Business plugin action.
    --application-id=!: The identifier of the Amazon Q Business application linked to the Amazon Q Business conversation.
    --attachments=: A list of files uploaded directly during chat.
    --attribute-filter=: Enables filtering of Amazon Q Business web experience responses based on document attributes or metadata fields.
    --auth-challenge-response=: An authentication verification event response by a third party authentication server to Amazon Q Business.
    --chat-mode-configuration=: The chat mode configuration for an Amazon Q Business application.
    --chat-mode=: 'The `chatMode` parameter determines the chat modes available to Amazon Q Business users:'
    --client-token=: A token that you provide to identify a chat request.
    --conversation-id=: The identifier of the Amazon Q Business conversation.
    --parent-message-id=: The identifier of the previous system message in a conversation.
    --user-groups=: The group names that a user associated with the chat input belongs to.
    --user-id=: The identifier of the user attached to the chat input.
    --user-message=: A end user message in a conversation.
completion:
    flag:
        chat-mode:
            - RETRIEVAL_MODE
            - CREATOR_MODE
            - PLUGIN_MODE
documentation:
    command: Starts or continues a non-streaming Amazon Q Business conversation.
    flag:
        action-execution: A request from an end user to perform an Amazon Q Business plugin action.
        application-id: The identifier of the Amazon Q Business application linked to the Amazon Q Business conversation.
        attachments: A list of files uploaded directly during chat. You can upload a maximum of 5 files of upto 10 MB each.
        attribute-filter: Enables filtering of Amazon Q Business web experience responses based on document attributes or metadata fields.
        auth-challenge-response: An authentication verification event response by a third party authentication server to Amazon Q Business.
        chat-mode: |-
            The `chatMode` parameter determines the chat modes available to Amazon Q Business users:

            - `RETRIEVAL_MODE` - If you choose this mode, Amazon Q generates responses solely from the data sources connected and indexed by the application. If an answer is not found in the data sources or there are no data sources available, Amazon Q will respond with a "*No Answer Found*" message, unless LLM knowledge has been enabled. In that case, Amazon Q will generate a response from the LLM knowledge
            - `CREATOR_MODE` - By selecting this mode, you can choose to generate responses only from the LLM knowledge. You can also attach files and have Amazon Q generate a response based on the data in those files. If the attached files do not contain an answer for the query, Amazon Q will automatically fall back to generating a response from the LLM knowledge.
            - `PLUGIN_MODE` - By selecting this mode, users can choose to use plugins in chat to get their responses.

            If none of the modes are selected, Amazon Q will only respond using the information from the attached files.

            For more information, see [Admin controls and guardrails](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/guardrails.html), [Plugins](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/plugins.html), and [Response sources](https://docs.aws.amazon.com/amazonq/latest/business-use-dg/using-web-experience.html#chat-source-scope).
        chat-mode-configuration: The chat mode configuration for an Amazon Q Business application.
        client-token: A token that you provide to identify a chat request.
        conversation-id: The identifier of the Amazon Q Business conversation.
        parent-message-id: The identifier of the previous system message in a conversation.
        user-groups: The group names that a user associated with the chat input belongs to.
        user-id: The identifier of the user attached to the chat input.
        user-message: A end user message in a conversation.
