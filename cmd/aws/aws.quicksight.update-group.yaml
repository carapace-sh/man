name: update-group
description: Changes a group description.
flags:
    --aws-account-id=!: The ID for the Amazon Web Services account that the group is in.
    --description=: The description for the group that you want to update.
    --group-name=!: The name of the group that you want to update.
    --namespace=!: The namespace of the group that you want to update.
documentation:
    command: Changes a group description.
    flag:
        aws-account-id: The ID for the Amazon Web Services account that the group is in. Currently, you use the ID for the Amazon Web Services account that contains your Amazon Quick Sight account.
        description: The description for the group that you want to update.
        group-name: The name of the group that you want to update.
        namespace: The namespace of the group that you want to update.
