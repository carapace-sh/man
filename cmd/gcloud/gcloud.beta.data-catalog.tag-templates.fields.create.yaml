name: create
description: '*(BETA)*  *(DEPRECATED)*  Create a Data Catalog tag template field.'
flags:
    --display-name=: Display name of the tag template field.
    --location=: Location of the tag template field.
    --tag-template=: Tag template of the tag template field.
    --type=!: Type of the tag template field.
documentation:
    command: |4-
        *(BETA)*  *(DEPRECATED)*  This command is deprecated. Please use `gcloud dataplex aspect-types` instead.

        Create a Data Catalog tag template field.
    flag:
        display-name: Display name of the tag template field.
        location: |-
            Location of the tag template field.
            +

            To set the `location` attribute:
            * provide the argument `field` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        tag-template: |-
            Tag template of the tag template field.
            +

            To set the `tag-template` attribute:
            * provide the argument `field` on the command line with a fully specified name;
            * provide the argument `--tag-template` on the command line.
        type: |-
            Type of the tag template field. Choices are double, string, bool, timestamp, and enum.
            +
              To specify a string field:
                `type=string`
            +
              To specify an enum field with values 'A' and 'B':
                `type="enum(A|B)"`
