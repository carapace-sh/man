name: describe-audit-task
description: Gets information about a Device Defender audit.
flags:
    --task-id=!: The ID of the audit whose information you want to get.
documentation:
    command: |-
        Gets information about a Device Defender audit.

        Requires permission to access the [DescribeAuditTask](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        task-id: The ID of the audit whose information you want to get.
