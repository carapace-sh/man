name: put-notification-settings
description: Attaches a list of *notification settings* to a trust anchor.
flags:
    --notification-settings=!: A list of notification settings to be associated to the trust anchor.
    --trust-anchor-id=!: The unique identifier of the trust anchor.
documentation:
    command: |-
        Attaches a list of *notification settings* to a trust anchor.

        A notification setting includes information such as event name, threshold, status of the notification setting, and the channel to notify.

        **Required permissions:** `rolesanywhere:PutNotificationSettings`.
    flag:
        notification-settings: A list of notification settings to be associated to the trust anchor.
        trust-anchor-id: The unique identifier of the trust anchor.
