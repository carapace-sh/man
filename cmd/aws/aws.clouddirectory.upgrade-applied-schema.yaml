name: upgrade-applied-schema
description: Upgrades a single directory in-place using the `PublishedSchemaArn` with schema updates found in `MinorVersion`.
flags:
    --directory-arn=!: The ARN for the directory to which the upgraded schema will be applied.
    --dry-run=: Used for testing whether the major version schemas are backward compatible or not.
    --published-schema-arn=!: The revision of the published schema to upgrade the directory to.
documentation:
    command: 'Upgrades a single directory in-place using the `PublishedSchemaArn` with schema updates found in `MinorVersion`. Backwards-compatible minor version upgrades are instantaneously available for readers on all objects in the directory. Note: This is a synchronous API call and upgrades only one schema on a given directory per call. To upgrade multiple directories from one schema, you would need to call this API on each directory.'
    flag:
        directory-arn: The ARN for the directory to which the upgraded schema will be applied.
        dry-run: Used for testing whether the major version schemas are backward compatible or not. If schema compatibility fails, an exception would be thrown else the call would succeed but no changes will be saved. This parameter is optional.
        published-schema-arn: The revision of the published schema to upgrade the directory to.
