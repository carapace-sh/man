name: update-model-card
description: Update an Amazon SageMaker Model Card.
flags:
    --content=: The updated model card content.
    --model-card-name=!: The name or Amazon Resource Name (ARN) of the model card to update.
    --model-card-status=: The approval status of the model card within your organization.
completion:
    flag:
        model-card-status:
            - Draft
            - PendingReview
            - Approved
            - Archived
documentation:
    command: |-
        Update an Amazon SageMaker Model Card.

        You cannot update both model card content and model card status in a single call.
    flag:
        content: |-
            The updated model card content. Content must be in [model card JSON schema](https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html#model-cards-json-schema) and provided as a string.

            When updating model card content, be sure to include the full content and not just updated content.
        model-card-name: The name or Amazon Resource Name (ARN) of the model card to update.
        model-card-status: |-
            The approval status of the model card within your organization. Different organizations might have different criteria for model card review and approval.

            - `Draft`: The model card is a work in progress.
            - `PendingReview`: The model card is pending review.
            - `Approved`: The model card is approved.
            - `Archived`: The model card is archived. No more updates should be made to the model card, but it can still be exported.
