name: describe-sender-ids
description: Describes the specified SenderIds or all SenderIds associated with your Amazon Web Services account.
flags:
    --filters=: An array of SenderIdFilter objects to filter the results.
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
    --owner=: Use `SELF` to filter the list of Sender Ids to ones your account owns or use `SHARED` to filter on Sender Ids shared with your account.
    --sender-ids=: An array of SenderIdAndCountry objects to search for.
completion:
    flag:
        owner:
            - SELF
            - SHARED
documentation:
    command: |-
        Describes the specified SenderIds or all SenderIds associated with your Amazon Web Services account.

        If you specify SenderIds, the output includes information for only the specified SenderIds. If you specify filters, the output includes information for only those SenderIds that meet the filter criteria. If you don't specify SenderIds or filters, the output includes information for all SenderIds.

        f you specify a sender ID that isn't valid, an error is returned.
    flag:
        filters: An array of SenderIdFilter objects to filter the results.
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
        owner: Use `SELF` to filter the list of Sender Ids to ones your account owns or use `SHARED` to filter on Sender Ids shared with your account. The `Owner` and `SenderIds` parameters can't be used at the same time.
        sender-ids: |-
            An array of SenderIdAndCountry objects to search for.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
