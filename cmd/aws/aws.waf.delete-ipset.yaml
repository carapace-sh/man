name: delete-ipset
description: This is **AWS WAF Classic** documentation.
flags:
    --change-token=!: The value returned by the most recent call to [GetChangeToken]().
    --ipset-id=!: The `IPSetId` of the [IPSet]() that you want to delete.
documentation:
    command: |-
        This is **AWS WAF Classic** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.

        **For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.

        Permanently deletes an [IPSet](). You can't delete an `IPSet` if it's still used in any `Rules` or if it still includes any IP addresses.

        If you just want to remove an `IPSet` from a `Rule`, use [UpdateRule]().

        To permanently delete an `IPSet` from AWS WAF, perform the following steps:

        1. Update the `IPSet` to remove IP address ranges, if any. For more information, see [UpdateIPSet]().
        2. Use [GetChangeToken]() to get the change token that you provide in the `ChangeToken` parameter of a `DeleteIPSet` request.
        3. Submit a `DeleteIPSet` request.
    flag:
        change-token: The value returned by the most recent call to [GetChangeToken]().
        ipset-id: The `IPSetId` of the [IPSet]() that you want to delete. `IPSetId` is returned by [CreateIPSet]() and by [ListIPSets]().
