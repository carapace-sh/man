name: create
description: '*(ALPHA)*  Create a component.'
flags:
    --application-template=: The applicationTemplate id of the component resource.
    --display-name=: The component display name.
    --location=: The location id of the component resource.
    --parameters=: The component parameters.
    --shared-template-revision-uri=!: The shared template used to generate the component.
    --space=: The space id of the component resource.
documentation:
    command: '*(ALPHA)*  Create a component in an application template.'
    flag:
        application-template: |-
            The applicationTemplate id of the component resource.
            +
            To set the `application-template` attribute:
            * provide the argument `component` on the command line with a fully specified name;
            * provide the argument `--application-template` on the command line.
        display-name: The component display name.
        location: |-
            The location id of the component resource.
            +
            To set the `location` attribute:
            * provide the argument `component` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        parameters: |-
            The component parameters.
            +
            *key*:::
            The key of the parameter.
            +
            *value*:::
            The value of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --parameters=key=string,value={...} --parameters=key=string,value={...}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --parameters='[{"key": "string", "value": {...}}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --parameters=path_to_file.(yaml|json)
            +
            ```
        shared-template-revision-uri: The shared template used to generate the component.
        space: |-
            The space id of the component resource.
            +
            To set the `space` attribute:
            * provide the argument `component` on the command line with a fully specified name;
            * provide the argument `--space` on the command line.
