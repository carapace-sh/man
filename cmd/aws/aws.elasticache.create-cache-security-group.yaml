name: create-cache-security-group
description: Creates a new cache security group.
flags:
    --cache-security-group-name=!: A name for the cache security group.
    --description=!: A description for the cache security group.
    --tags=: A list of tags to be added to this resource.
documentation:
    command: |-
        Creates a new cache security group. Use a cache security group to control access to one or more clusters.

        Cache security groups are only used when you are creating a cluster outside of an Amazon Virtual Private Cloud (Amazon VPC). If you are creating a cluster inside of a VPC, use a cache subnet group instead. For more information, see [CreateCacheSubnetGroup](https://docs.aws.amazon.com/AmazonElastiCache/latest/APIReference/API_CreateCacheSubnetGroup.html).
    flag:
        cache-security-group-name: |-
            A name for the cache security group. This value is stored as a lowercase string.

            Constraints: Must contain no more than 255 alphanumeric characters. Cannot be the word "Default".

            Example: `mysecuritygroup`
        description: A description for the cache security group.
        tags: A list of tags to be added to this resource. A tag is a key-value pair. A tag key must be accompanied by a tag value, although null is accepted.
