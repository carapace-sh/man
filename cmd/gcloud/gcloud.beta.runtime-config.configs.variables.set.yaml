name: set
description: '*(BETA)*  Create or update variable resources.'
flags:
    --config-name=!: The name of the configuration resource to use.
    --fail-if-absent: Fail if a variable with the specified name does not exist.
    --fail-if-present: Fail if a variable with the specified name already exists.
    --is-text: If True, send and store the value as text.
    --no-fail-if-absent&: Fail if a variable with the specified name does not exist.
    --no-fail-if-present&: Fail if a variable with the specified name already exists.
    --no-is-text&: If True, send and store the value as text.
documentation:
    command: |-
        *(BETA)*  This command creates or updates a variable resource, setting its value to
        the specified string or file contents.
    flag:
        config-name: The name of the configuration resource to use.
        fail-if-absent: Fail if a variable with the specified name does not exist.
        fail-if-present: Fail if a variable with the specified name already exists.
        is-text: If True, send and store the value as text. Can be used if the value contains only text (UTF-8 encoded). This affects how the variable is transmitted on the wire and requires less quota on the backend.
        no-fail-if-absent: Fail if a variable with the specified name does not exist.
        no-fail-if-present: Fail if a variable with the specified name already exists.
        no-is-text: If True, send and store the value as text. Can be used if the value contains only text (UTF-8 encoded). This affects how the variable is transmitted on the wire and requires less quota on the backend.
