name: evaluate-user-consents
description: Check the consents for a particular user's data.
flags:
    --consent-list=: List of user consents to evaluate the access request against.
    --dataset=: Cloud Healthcare dataset.
    --location=: Google Cloud location.
    --page-size=: Limit on the number of user data mappings to return in a single response.
    --page-token=: Token to retrieve the next page of results.
    --request-attributes=: Comma-separated list of request attributes associated with this access request.
    --resource-attributes=: Comma-separated list of resource attributes associated with this access request.
    --response-view=: The requested view of information provided in the response (BASIC or FULL).
    --user-id=!: The unique identifier of the user to evaluate consents for.
completion:
    flag:
        response-view:
            - basic
            - full
            - response-view-unspecified
documentation:
    command: Check if each matching user data mapping in the given Cloud Healthcare API consent store is consented for a given use.
    flag:
        consent-list: |-
            List of user consents to evaluate the access request against. They must have the same
            user_id as the data to check access for, exist in the current consent_store, and have a
            state of either ACTIVE or DRAFT. A maximum of 100 consents can be provided here.
        dataset: |-
            Cloud Healthcare dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `consent_store` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `consent_store` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
        page-size: |-
            Limit on the number of user data mappings to return in a single response. If zero the
            default page size of 100 is used.
        page-token: Token to retrieve the next page of results.
        request-attributes: |-
            Comma-separated list of request attributes associated with this access request. Each
            attribute has the form "KEY=VALUE".
        resource-attributes: |-
            Comma-separated list of resource attributes associated with this access request. Each
            attribute has the form "KEY=VALUE". If no values are specified, then all data types are
            queried.
        response-view: 'The requested view of information provided in the response (BASIC or FULL). _RESPONSE_VIEW_ must be one of: *basic*, *full*, *response-view-unspecified*.'
        user-id: The unique identifier of the user to evaluate consents for.
