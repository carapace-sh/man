name: list-candidates-for-auto-mljob
description: List the candidates created for the job.
flags:
    --auto-mljob-name=!: List the candidates created for the job by providing the job's name.
    --candidate-name-equals=: List the candidates for the job and filter by candidate name.
    --max-results=: List the job's candidates up to a specified limit.
    --next-token=: If the previous response was truncated, you receive this token.
    --sort-by=: The parameter by which to sort the results.
    --sort-order=: The sort order for the results.
    --status-equals=: List the candidates for the job and filter by status.
completion:
    flag:
        sort-by:
            - CreationTime
            - Status
            - FinalObjectiveMetricValue
        sort-order:
            - Ascending
            - Descending
        status-equals:
            - Completed
            - InProgress
            - Failed
            - Stopped
            - Stopping
documentation:
    command: List the candidates created for the job.
    flag:
        auto-mljob-name: List the candidates created for the job by providing the job's name.
        candidate-name-equals: List the candidates for the job and filter by candidate name.
        max-results: List the job's candidates up to a specified limit.
        next-token: If the previous response was truncated, you receive this token. Use it in your next request to receive the next set of results.
        sort-by: The parameter by which to sort the results. The default is `Descending`.
        sort-order: The sort order for the results. The default is `Ascending`.
        status-equals: List the candidates for the job and filter by status.
