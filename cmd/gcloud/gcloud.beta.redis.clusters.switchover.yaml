name: switchover
description: '*(BETA)*  Switchover to a secondary cluster.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Redis region of the cluster.
documentation:
    command: |
        *(BETA)*  This command promotes the secondary cluster to become the new primary cluster. The old primary
        and other secondary clusters will automatically become the secondary clusters of this cluster.

        After the successful completion of this operation, the new primary cluster will accept both read
        and write requests.

        This command is only supported on secondary clusters.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Redis region of the cluster. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
