name: get-blacklist-reports
description: Retrieve a list of the blacklists that your dedicated IP addresses appear on.
flags:
    --blacklist-item-names=!: A list of IP addresses that you want to retrieve blacklist information about.
documentation:
    command: Retrieve a list of the blacklists that your dedicated IP addresses appear on.
    flag:
        blacklist-item-names: A list of IP addresses that you want to retrieve blacklist information about. You can only specify the dedicated IP addresses that you use to send email using Amazon SES or Amazon Pinpoint.
