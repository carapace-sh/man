name: create-gateway
description: Creates a gateway, which is a virtual or edge device that delivers industrial data streams from local servers to IoT SiteWise.
flags:
    --gateway-name=!: A unique name for the gateway.
    --gateway-platform=!: The gateway's platform.
    --gateway-version=: The version of the gateway to create.
    --tags=: A list of key-value pairs that contain metadata for the gateway.
documentation:
    command: Creates a gateway, which is a virtual or edge device that delivers industrial data streams from local servers to IoT SiteWise. For more information, see [Ingesting data using a gateway](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/gateway-connector.html) in the *IoT SiteWise User Guide*.
    flag:
        gateway-name: A unique name for the gateway.
        gateway-platform: The gateway's platform. You can only specify one platform in a gateway.
        gateway-version: |-
            The version of the gateway to create. Specify `3` to create an MQTT-enabled, V3 gateway and `2` to create a Classic streams, V2 gateway. If not specified, the default is `2` (Classic streams, V2 gateway).

            When creating a V3 gateway (`gatewayVersion=3`) with the `GreengrassV2` platform, you must also specify the `coreDeviceOperatingSystem` parameter.

            We recommend creating an MQTT-enabled gateway for self-hosted gateways and Siemens Industrial Edge gateways. For more information on gateway versions, see [Use Amazon Web Services IoT SiteWise Edge Edge gateways](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/gateways.html).
        tags: A list of key-value pairs that contain metadata for the gateway. For more information, see [Tagging your IoT SiteWise resources](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/tag-resources.html) in the *IoT SiteWise User Guide*.
