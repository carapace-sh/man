name: update
description: '*(ALPHA)*  Update a connection.'
flags:
    --add-destination-component-parameters=: Add new value to destination_component_parameters list.
    --add-source-component-parameters=: Add new value to source_component_parameters list.
    --application-template=: For resources [connection, destination-component-uri], provides fallback value for resource application-template attribute.
    --clear-destination-component-parameters: Clear destination_component_parameters value and set to empty list.
    --clear-source-component-parameters: Clear source_component_parameters value and set to empty list.
    --component=: The component id of the connection resource.
    --destination-component-parameters=: Set destination_component_parameters to new value.
    --destination-component-uri=!: ID of the component or fully qualified identifier for the component.
    --location=: For resources [connection, destination-component-uri], provides fallback value for resource location attribute.
    --no-clear-destination-component-parameters&: Clear destination_component_parameters value and set to empty list.
    --no-clear-source-component-parameters&: Clear source_component_parameters value and set to empty list.
    --remove-destination-component-parameters=: Remove existing value from destination_component_parameters list.
    --remove-source-component-parameters=: Remove existing value from source_component_parameters list.
    --source-component-parameters=: Set source_component_parameters to new value.
    --space=: For resources [connection, destination-component-uri], provides fallback value for resource space attribute.
documentation:
    command: '*(ALPHA)*  Update a connection between components in an application template.'
    flag:
        add-destination-component-parameters: |-
            Add new value to destination_component_parameters list. The parameters of the connection associated with the destination component.
            +
            *key*:::
            The key of the parameter.
            +
            *value*:::
            The value of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-destination-component-parameters=key=string,value={...} --add-destination-component-parameters=key=string,value={...}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-destination-component-parameters='[{"key": "string", "value": {...}}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-destination-component-parameters=path_to_file.(yaml|json)
            +
            ```
        add-source-component-parameters: |-
            Add new value to source_component_parameters list. The parameters of the connection associated with the source component.
            +
            *key*:::
            The key of the parameter.
            +
            *value*:::
            The value of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-source-component-parameters=key=string,value={...} --add-source-component-parameters=key=string,value={...}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-source-component-parameters='[{"key": "string", "value": {...}}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-source-component-parameters=path_to_file.(yaml|json)
            +
            ```
        application-template: For resources [connection, destination-component-uri], provides fallback value for resource application-template attribute. When the resource's full URI path is not provided, application-template will fallback to this flag value.
        clear-destination-component-parameters: Clear destination_component_parameters value and set to empty list.
        clear-source-component-parameters: Clear source_component_parameters value and set to empty list.
        component: |-
            The component id of the connection resource.
            +
            To set the `component` attribute:
            * provide the argument `connection` on the command line with a fully specified name;
            * provide the argument `--component` on the command line.
        destination-component-parameters: |-
            Set destination_component_parameters to new value. The parameters of the connection associated with the destination component.
            +
            *key*:::
            The key of the parameter.
            +
            *value*:::
            The value of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --destination-component-parameters=key=string,value={...} --destination-component-parameters=key=string,value={...}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --destination-component-parameters='[{"key": "string", "value": {...}}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --destination-component-parameters=path_to_file.(yaml|json)
            +
            ```
        destination-component-uri: |-
            ID of the component or fully qualified identifier for the component.
            +
            To set the `component` attribute:
            * provide the argument `--destination-component-uri` on the command line.
        location: For resources [connection, destination-component-uri], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        no-clear-destination-component-parameters: Clear destination_component_parameters value and set to empty list.
        no-clear-source-component-parameters: Clear source_component_parameters value and set to empty list.
        remove-destination-component-parameters: |-
            Remove existing value from destination_component_parameters list. The parameters of the connection associated with the destination component.
            +
            *key*:::
            The key of the parameter.
            +
            *value*:::
            The value of the parameter.
            +
            :::
