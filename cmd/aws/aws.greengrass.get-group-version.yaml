name: get-group-version
description: Retrieves information about a group version.
flags:
    --group-id=!: The ID of the Greengrass group.
    --group-version-id=!: The ID of the group version.
documentation:
    command: Retrieves information about a group version.
    flag:
        group-id: The ID of the Greengrass group.
        group-version-id: The ID of the group version. This value maps to the ''Version'' property of the corresponding ''VersionInformation'' object, which is returned by ''ListGroupVersions'' requests. If the version is the last one that was associated with a group, the value also maps to the ''LatestVersion'' property of the corresponding ''GroupInformation'' object.
