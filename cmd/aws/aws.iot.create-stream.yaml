name: create-stream
description: Creates a stream for delivering one or more large files in chunks over MQTT.
flags:
    --description=: A description of the stream.
    --files=!: The files to stream.
    --role-arn=!: An IAM role that allows the IoT service principal to access your S3 files.
    --stream-id=!: The stream ID.
    --tags=: Metadata which can be used to manage streams.
documentation:
    command: |-
        Creates a stream for delivering one or more large files in chunks over MQTT. A stream transports data bytes in chunks or blocks packaged as MQTT messages from a source like S3. You can have one or more files associated with a stream.

        Requires permission to access the [CreateStream](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        description: A description of the stream.
        files: The files to stream.
        role-arn: An IAM role that allows the IoT service principal to access your S3 files.
        stream-id: The stream ID.
        tags: Metadata which can be used to manage streams.
