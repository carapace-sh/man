name: update-phone-number-metadata
description: Updates a phone number’s metadata.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --phone-number-description=: The description of the phone number.
    --phone-number-id=!: The Amazon Resource Name (ARN) or resource ID of the phone number.
documentation:
    command: |-
        Updates a phone number’s metadata.

        To verify the status of a previous UpdatePhoneNumberMetadata operation, call the [DescribePhoneNumber](https://docs.aws.amazon.com/connect/latest/APIReference/API_DescribePhoneNumber.html) API.
    flag:
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        phone-number-description: The description of the phone number.
        phone-number-id: The Amazon Resource Name (ARN) or resource ID of the phone number.
