name: add-labels
description: '*(ALPHA)*  Add labels to Google Compute Engine snapshots.'
flags:
    --global: If set, the snapshot is global.
    --labels=!: A list of labels to add.
    --no-global&: If set, the snapshot is global.
    --region=: Region of the snapshot to operate on.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute snapshots add-labels* adds labels to a Google Compute Engine snapshot.
    flag:
        global: If set, the snapshot is global.
        labels: A list of labels to add.
        no-global: If set, the snapshot is global.
        region: Region of the snapshot to operate on. Overrides the default *compute/region* property value for this command invocation.
