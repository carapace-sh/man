    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --custom-vocabulary-item-list=!: A list of custom vocabulary items requested to be deleted.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --locale-id=!: The identifier of the language and locale where this custom vocabulary is used.
documentation:
    command: Delete a batch of custom vocabulary items for a given bot locale's custom vocabulary.
