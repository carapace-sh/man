name: create
description: '*(ALPHA)*  Create a SAC realm.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --partner-environment=&: URI of the Partner Environment to be used for this realm.
    --security-service=!: Security service supporting this realm.
    --symantec-secret=: ID of the Secret in Secret Manager containing the Symantec credentials.
completion:
    flag:
        security-service:
            - prisma-access
            - symantec-cloud-swg
documentation:
    command: |
        *(ALPHA)*  Create a new realm supported by the specified security service.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `sac_realm` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * location is global by default.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        partner-environment: |
            URI of the Partner Environment to be used for this realm. Only supported for internal users
            of SYMANTEC_CLOUD_SWG.
        security-service: 'Security service supporting this realm. _SECURITY_SERVICE_ must be one of: *prisma-access*, *symantec-cloud-swg*.'
        symantec-secret: ID of the Secret in Secret Manager containing the Symantec credentials.
