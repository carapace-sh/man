name: describe-user
description: Describes the user assigned to the specific file transfer protocol-enabled server, as identified by its `ServerId` property.
flags:
    --server-id=!: A system-assigned unique identifier for a server that has this user assigned.
    --user-name=!: The name of the user assigned to one or more servers.
documentation:
    command: |-
        Describes the user assigned to the specific file transfer protocol-enabled server, as identified by its `ServerId` property.

        The response from this call returns the properties of the user associated with the `ServerId` value that was specified.
    flag:
        server-id: A system-assigned unique identifier for a server that has this user assigned.
        user-name: The name of the user assigned to one or more servers. User names are part of the sign-in credentials to use the Transfer Family service and perform file transfer tasks.
