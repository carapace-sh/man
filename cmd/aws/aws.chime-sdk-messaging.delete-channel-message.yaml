name: delete-channel-message
description: Deletes a channel message.
flags:
    --channel-arn=!: The ARN of the channel.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
    --message-id=!: The ID of the message being deleted.
    --sub-channel-id=: The ID of the SubChannel in the request.
documentation:
    command: |-
        Deletes a channel message. Only admins can perform this action. Deletion makes messages inaccessible immediately. A background process deletes any revisions created by `UpdateChannelMessage`.

        The `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call as the value in the header.
    flag:
        channel-arn: The ARN of the channel.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
        message-id: The ID of the message being deleted.
        sub-channel-id: |-
            The ID of the SubChannel in the request.

            Only required when deleting messages in a SubChannel that the user belongs to.
