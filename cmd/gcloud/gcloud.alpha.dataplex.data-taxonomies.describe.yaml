name: describe
description: '*(ALPHA)*  Describe a Data Taxonomy.'
flags:
    --location=: Location of the Dataplex resource.
documentation:
    command: |
        *(ALPHA)*  Describe a Data Taxonomy.
        Displays all details of a Data Taxonomy given a valid Data Taxonomy ID.
    flag:
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `data_taxonomy` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
