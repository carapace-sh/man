name: list-insights
description: Returns a list of all insights checked for against the specified cluster.
flags:
    --cluster-name=!: The name of the Amazon EKS cluster associated with the insights.
    --filter=: The criteria to filter your list of insights for your cluster.
    --max-results=: The maximum number of identity provider configurations returned by `ListInsights` in paginated output.
    --next-token=: The `nextToken` value returned from a previous paginated `ListInsights` request.
documentation:
    command: |-
        Returns a list of all insights checked for against the specified cluster. You can filter which insights are returned by category, associated Kubernetes version, and status. The default filter lists all categories and every status.

        The following lists the available categories:

        - `UPGRADE_READINESS`: Amazon EKS identifies issues that could impact your ability to upgrade to new versions of Kubernetes. These are called upgrade insights.
        - `MISCONFIGURATION`: Amazon EKS identifies misconfiguration in your EKS Hybrid Nodes setup that could impair functionality of your cluster or workloads. These are called configuration insights.
    flag:
        cluster-name: The name of the Amazon EKS cluster associated with the insights.
        filter: The criteria to filter your list of insights for your cluster. You can filter which insights are returned by category, associated Kubernetes version, and status.
        max-results: The maximum number of identity provider configurations returned by `ListInsights` in paginated output. When you use this parameter, `ListInsights` returns only `maxResults` results in a single page along with a `nextToken` response element. You can see the remaining results of the initial request by sending another `ListInsights` request with the returned `nextToken` value. This value can be between 1 and 100. If you don't use this parameter, `ListInsights` returns up to 100 results and a `nextToken` value, if applicable.
        next-token: The `nextToken` value returned from a previous paginated `ListInsights` request. When the results of a `ListInsights` request exceed `maxResults`, you can use this value to retrieve the next page of results. This value is `null` when there are no more results to return.
