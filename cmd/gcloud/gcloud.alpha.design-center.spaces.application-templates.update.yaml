name: update
description: '*(ALPHA)*  Update an application template.'
flags:
    --add-application-parameters=: Add new value to application_parameters list.
    --application-parameters=: Set application_parameters to new value.
    --clear-application-parameters: Clear application_parameters value and set to empty list.
    --composition-type=: 'The composition type of the applicationTemplate: STANDARD OR COMPOSITE.'
    --description=: Application template description.
    --display-name=: Application template display name.
    --location=: The location id of the applicationTemplate resource.
    --no-clear-application-parameters&: Clear application_parameters value and set to empty list.
    --remove-application-parameters=: Remove existing value from application_parameters list.
    --space=: The space id of the applicationTemplate resource.
completion:
    flag:
        composition-type:
            - composite
            - standard
documentation:
    command: '*(ALPHA)*  Update an application template.'
    flag:
        add-application-parameters: |-
            Add new value to application_parameters list. Parameters to apply to all components in an application. You can specify
            projectID and region.
            +
            *key*:::
            The key of the parameter.
            +
            *value*:::
            The value of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-application-parameters=key=string,value={...} --add-application-parameters=key=string,value={...}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-application-parameters='[{"key": "string", "value": {...}}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-application-parameters=path_to_file.(yaml|json)
            +
            ```
        application-parameters: |-
            Set application_parameters to new value. Parameters to apply to all components in an application. You can specify
            projectID and region.
            +
            *key*:::
            The key of the parameter.
            +
            *value*:::
            The value of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --application-parameters=key=string,value={...} --application-parameters=key=string,value={...}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --application-parameters='[{"key": "string", "value": {...}}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --application-parameters=path_to_file.(yaml|json)
            +
            ```
        clear-application-parameters: Clear application_parameters value and set to empty list.
        composition-type: |-
            The composition type of the applicationTemplate: STANDARD OR COMPOSITE.
            This is a create time only param. In future, we may support conversion from
            STANDARD to COMPOSITE. _COMPOSITION_TYPE_ must be one of:
            +
            *composite*::: ApplicationCompositionType is COMPOSITE. The template is composed of
            STANDARD applicationTemplate(s) and might be having multiple root modules
            in terraform code.
            *standard*::: ApplicationCompositionType is STANDARD. The applicationTemplate or
            application is composed of components only of type service/workload/asset
            and has a single root module in terraform code.
            :::
            +
        description: Application template description.
        display-name: Application template display name.
        location: |-
            The location id of the applicationTemplate resource.
            +
            To set the `location` attribute:
            * provide the argument `application_template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-clear-application-parameters: Clear application_parameters value and set to empty list.
        remove-application-parameters: |-
            Remove existing value from application_parameters list. Parameters to apply to all components in an application. You can specify
            projectID and region.
            +
            *key*:::
            The key of the parameter.
            +
            *value*:::
            The value of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-application-parameters=key=string,value={...} --remove-application-parameters=key=string,value={...}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-application-parameters='[{"key": "string", "value": {...}}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-application-parameters=path_to_file.(yaml|json)
            +
            ```
        space: |-
            The space id of the applicationTemplate resource.
            +
            To set the `space` attribute:
            * provide the argument `application_template` on the command line with a fully specified name;
            * provide the argument `--space` on the command line.
