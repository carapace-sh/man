name: get-media
description: Returns the image bytes corresponding to a media object.
flags:
    --application-id=!: The identifier of the Amazon Q Business which contains the media object.
    --conversation-id=!: The identifier of the Amazon Q Business conversation.
    --media-id=!: The identifier of the media object.
    --message-id=!: The identifier of the Amazon Q Business message.
documentation:
    command: |-
        Returns the image bytes corresponding to a media object. If you have implemented your own application with the Chat and ChatSync APIs, and have enabled content extraction from visual data in Amazon Q Business, you use the GetMedia API operation to download the images so you can show them in your UI with responses.

        For more information, see [Extracting semantic meaning from images and visuals](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/extracting-meaning-from-images.html).
    flag:
        application-id: The identifier of the Amazon Q Business which contains the media object.
        conversation-id: The identifier of the Amazon Q Business conversation.
        media-id: The identifier of the media object. You can find this in the `sourceAttributions` returned by the `Chat`, `ChatSync`, and `ListMessages` API responses.
        message-id: The identifier of the Amazon Q Business message.
