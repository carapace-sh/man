name: export
description: Export SBOM files to Google Cloud Storage.
flags:
    --location=: If specified, all requests to Artifact Analysis for occurrences will go to location specified
    --uri=!: The URI of the Artifact Registry image the SBOM is exported for.
documentation:
    command: Export SBOM files to Google Cloud Storage.
    flag:
        location: If specified, all requests to Artifact Analysis for occurrences will go to location specified
        uri: The URI of the Artifact Registry image the SBOM is exported for. A 'gcr.io' image can also be used if redirection is enabled in Artifact Registry. Make sure 'artifactregistry.projectsettings.get' permission is granted to the current gcloud user to verify the redirection status.
