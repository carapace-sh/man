name: get-cost-forecast
description: Retrieves a forecast for how much Amazon Web Services predicts that you will spend over the forecast time period that you select, based on your past costs.
flags:
    --billing-view-arn=: The Amazon Resource Name (ARN) that uniquely identifies a specific billing view.
    --filter=: The filters that you want to use to filter your forecast.
    --granularity=!: How granular you want the forecast to be.
    --metric=!: Which metric Cost Explorer uses to create your forecast.
    --prediction-interval-level=: Cost Explorer always returns the mean forecast as a single point.
    --time-period=!: The period of time that you want the forecast to cover.
completion:
    flag:
        granularity:
            - DAILY
            - MONTHLY
            - HOURLY
        metric:
            - BLENDED_COST
            - UNBLENDED_COST
            - AMORTIZED_COST
            - NET_UNBLENDED_COST
            - NET_AMORTIZED_COST
            - USAGE_QUANTITY
            - NORMALIZED_USAGE_AMOUNT
documentation:
    command: Retrieves a forecast for how much Amazon Web Services predicts that you will spend over the forecast time period that you select, based on your past costs.
    flag:
        billing-view-arn: The Amazon Resource Name (ARN) that uniquely identifies a specific billing view. The ARN is used to specify which particular billing view you want to interact with or retrieve information from when making API calls related to Amazon Web Services Billing and Cost Management features. The BillingViewArn can be retrieved by calling the ListBillingViews API.
        filter: |-
            The filters that you want to use to filter your forecast. The `GetCostForecast` API supports filtering by the following dimensions:

            - `AZ`
            - `INSTANCE_TYPE`
            - `LINKED_ACCOUNT`
            - `OPERATION`
            - `PURCHASE_TYPE`
            - `REGION`
            - `SERVICE`
            - `USAGE_TYPE`
            - `USAGE_TYPE_GROUP`
            - `RECORD_TYPE`
            - `OPERATING_SYSTEM`
            - `TENANCY`
            - `SCOPE`
            - `PLATFORM`
            - `SUBSCRIPTION_ID`
            - `LEGAL_ENTITY_NAME`
            - `DEPLOYMENT_OPTION`
            - `DATABASE_ENGINE`
            - `INSTANCE_TYPE_FAMILY`
            - `BILLING_ENTITY`
            - `RESERVATION_ID`
            - `SAVINGS_PLAN_ARN`
        granularity: |-
            How granular you want the forecast to be. You can get 3 months of `DAILY` forecasts or 12 months of `MONTHLY` forecasts.

            The `GetCostForecast` operation supports only `DAILY` and `MONTHLY` granularities.
        metric: |-
            Which metric Cost Explorer uses to create your forecast. For more information about blended and unblended rates, see [Why does the "blended" annotation appear on some line items in my bill?](http://aws.amazon.com/premiumsupport/knowledge-center/blended-rates-intro/).

            Valid values for a `GetCostForecast` call are the following:

            - AMORTIZED\_COST
            - BLENDED\_COST
            - NET\_AMORTIZED\_COST
            - NET\_UNBLENDED\_COST
            - UNBLENDED\_COST
        prediction-interval-level: Cost Explorer always returns the mean forecast as a single point. You can request a prediction interval around the mean by specifying a confidence level. The higher the confidence level, the more confident Cost Explorer is about the actual value falling in the prediction interval. Higher confidence levels result in wider prediction intervals.
        time-period: The period of time that you want the forecast to cover. The start date must be equal to or no later than the current date to avoid a validation error.
