name: delete
description: Delete a workflow.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The Cloud location for the workflow.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        Delete a workflow and all of its executions.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The Cloud location for the workflow. Alternatively, set the property [workflows/location].
            +

            To set the `location` attribute:
            * provide the argument `workflow` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `workflows/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
