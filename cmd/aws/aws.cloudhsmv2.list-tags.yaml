name: list-tags
description: Gets a list of tags for the specified CloudHSM cluster.
flags:
    --max-results=: The maximum number of tags to return in the response.
    --next-token=: The `NextToken` value that you received in the previous response.
    --resource-id=!: The cluster identifier (ID) for the cluster whose tags you are getting.
documentation:
    command: |-
        Gets a list of tags for the specified CloudHSM cluster.

        This is a paginated operation, which means that each response might contain only a subset of all the tags. When the response contains only a subset of tags, it includes a `NextToken` value. Use this value in a subsequent `ListTags` request to get more tags. When you receive a response with no `NextToken` (or an empty or null value), that means there are no more tags to get.

        **Cross-account use:** No. You cannot perform this operation on an CloudHSM resource in a different Amazon Web Services account.
    flag:
        max-results: The maximum number of tags to return in the response. When there are more tags than the number you specify, the response contains a `NextToken` value.
        next-token: The `NextToken` value that you received in the previous response. Use this value to get more tags.
        resource-id: The cluster identifier (ID) for the cluster whose tags you are getting. To find the cluster ID, use [DescribeClusters]().
