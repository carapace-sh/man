name: create
description: '*(ALPHA)*  *(DEPRECATED)*  Create a Cloud IAP OAuth client in the project.'
flags:
    --display-name=!: User friendly name for the Cloud IAP OAuth client.
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  This command is deprecated and will be non-functional after the IAP OAuth Admin APIs are turned down. Jan 19, 2026: Google will discontinue support for the IAP OAuth Admin APIs. New projects will not be able to use these APIs. March 19, 2026: The IAP OAuth Admin APIs will be permanently shut down. Access to this feature will no longer be available.

        *gcloud alpha iap oauth-clients create* is used to create an OAuth client in the project to be used by Cloud IAP. To call
        this command, the Cloud OAuth brand for the project must exist and be set for 'internal only'.
        The new client is owned by Cloud IAP.
    flag:
        display-name: User friendly name for the Cloud IAP OAuth client.
