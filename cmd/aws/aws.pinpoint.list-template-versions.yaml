name: list-template-versions
description: Retrieves information about all the versions of a specific message template.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --next-token=: The string that specifies which page of results to return in a paginated response.
    --page-size=: The maximum number of items to include in each page of a paginated response.
    --template-name=!: The name of the message template.
    --template-type=!: The type of channel that the message template is designed for.
documentation:
    command: Retrieves information about all the versions of a specific message template.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        next-token: The string that specifies which page of results to return in a paginated response. This parameter is not supported for application, campaign, and journey metrics.
        page-size: The maximum number of items to include in each page of a paginated response. This parameter is not supported for application, campaign, and journey metrics.
        template-name: The name of the message template. A template name must start with an alphanumeric character and can contain a maximum of 128 characters. The characters can be alphanumeric characters, underscores (\_), or hyphens (-). Template names are case sensitive.
        template-type: 'The type of channel that the message template is designed for. Valid values are: EMAIL, PUSH, SMS, and VOICE.'
