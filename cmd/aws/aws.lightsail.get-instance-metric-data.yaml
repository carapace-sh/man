name: get-instance-metric-data
description: Returns the data points for the specified Amazon Lightsail instance metric, given an instance name.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=!: The end time of the time period.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-name=!: The name of the instance for which you want to get metrics data.
    --metric-name=!: The metric for which you want to return information.
    --period=!: The granularity, in seconds, of the returned data points.
    --start-time=!: The start time of the time period.
    --statistics=!:
        description: The statistic for the metric.
        nargs: -1
    --unit=!: The unit for the metric data request.
completion:
    flag:
        metric-name:
            - CPUUtilization
            - NetworkIn
            - NetworkOut
            - StatusCheckFailed
            - StatusCheckFailed_Instance
            - StatusCheckFailed_System
            - BurstCapacityTime
            - BurstCapacityPercentage
            - MetadataNoToken
        unit:
            - Seconds
            - Microseconds
            - Milliseconds
            - Bytes
            - Kilobytes
            - Megabytes
            - Gigabytes
            - Terabytes
            - Bits
            - Kilobits
            - Megabits
            - Gigabits
            - Terabits
            - Percent
            - Count
            - Bytes/Second
            - Kilobytes/Second
            - Megabytes/Second
            - Gigabytes/Second
            - Terabytes/Second
            - Bits/Second
            - Kilobits/Second
            - Megabits/Second
            - Gigabits/Second
            - Terabits/Second
            - Count/Second
            - None
documentation:
    command: |-
        Returns the data points for the specified Amazon Lightsail instance metric, given an instance name.

        Metrics report the utilization of your resources, and the error counts generated by them. Monitor and collect metric data regularly to maintain the reliability, availability, and performance of your resources.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: The end time of the time period.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-name: The name of the instance for which you want to get metrics data.
        metric-name: "The metric for which you want to return information.\n\nValid instance metric names are listed below, along with the most useful `statistics` to include in your request, and the published `unit` value.\n\n- **`BurstCapacityPercentage`** - The percentage of CPU performance available for your instance to burst above its baseline. Your instance continuously accrues and consumes burst capacity. Burst capacity stops accruing when your instance's `BurstCapacityPercentage` reaches 100%. For more information, see [Viewing instance burst capacity in Amazon Lightsail](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-viewing-instance-burst-capacity).\n  \n  `Statistics`: The most useful statistics are `Maximum` and `Average`.\n  \n  `Unit`: The published unit is `Percent`.\n- **`BurstCapacityTime`** - The available amount of time for your instance to burst at 100% CPU utilization. Your instance continuously accrues and consumes burst capacity. Burst capacity time stops accruing when your instance's `BurstCapacityPercentage` metric reaches 100%.\n  \n  Burst capacity time is consumed at the full rate only when your instance operates at 100% CPU utilization. For example, if your instance operates at 50% CPU utilization in the burstable zone for a 5-minute period, then it consumes CPU burst capacity minutes at a 50% rate in that period. Your instance consumed 2 minutes and 30 seconds of CPU burst capacity minutes in the 5-minute period. For more information, see [Viewing instance burst capacity in Amazon Lightsail](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-viewing-instance-burst-capacity).\n  \n  `Statistics`: The most useful statistics are `Maximum` and `Average`.\n  \n  `Unit`: The published unit is `Seconds`.\n- **`CPUUtilization`** - The percentage of allocated compute units that are currently in use on the instance. This metric identifies the processing power to run the applications on the instance. Tools in your operating system can show a lower percentage than Lightsail when the instance is not allocated a full processor core.\n  \n  `Statistics`: The most useful statistics are `Maximum` and `Average`.\n  \n  `Unit`: The published unit is `Percent`.\n- **`NetworkIn`** - The number of bytes received on all network interfaces by the instance. This metric identifies the volume of incoming network traffic to the instance. The number reported is the number of bytes received during the period. Because this metric is reported in 5-minute intervals, divide the reported number by 300 to find Bytes/second.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `Bytes`.\n- **`NetworkOut`** - The number of bytes sent out on all network interfaces by the instance. This metric identifies the volume of outgoing network traffic from the instance. The number reported is the number of bytes sent during the period. Because this metric is reported in 5-minute intervals, divide the reported number by 300 to find Bytes/second.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `Bytes`.\n- **`StatusCheckFailed`** - Reports whether the instance passed or failed both the instance status check and the system status check. This metric can be either 0 (passed) or 1 (failed). This metric data is available in 1-minute (60 seconds) granularity.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `Count`.\n- **`StatusCheckFailed_Instance`** - Reports whether the instance passed or failed the instance status check. This metric can be either 0 (passed) or 1 (failed). This metric data is available in 1-minute (60 seconds) granularity.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `Count`.\n- **`StatusCheckFailed_System`** - Reports whether the instance passed or failed the system status check. This metric can be either 0 (passed) or 1 (failed). This metric data is available in 1-minute (60 seconds) granularity.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `Count`.\n- **`MetadataNoToken`** - Reports the number of times that the instance metadata service was successfully accessed without a token. This metric determines if there are any processes accessing instance metadata by using Instance Metadata Service Version 1, which doesn't use a token. If all requests use token-backed sessions, such as Instance Metadata Service Version 2, then the value is 0.\n  \n  `Statistics`: The most useful statistic is `Sum`.\n  \n  `Unit`: The published unit is `Count`."
        period: |-
            The granularity, in seconds, of the returned data points.

            The `StatusCheckFailed`, `StatusCheckFailed_Instance`, and `StatusCheckFailed_System` instance metric data is available in 1-minute (60 seconds) granularity. All other instance metric data is available in 5-minute (300 seconds) granularity.
        start-time: The start time of the time period.
        statistics: |-
            The statistic for the metric.

            The following statistics are available:

            - `Minimum` - The lowest value observed during the specified period. Use this value to determine low volumes of activity for your application.
            - `Maximum` - The highest value observed during the specified period. Use this value to determine high volumes of activity for your application.
            - `Sum` - All values submitted for the matching metric added together. You can use this statistic to determine the total volume of a metric.
            - `Average` - The value of Sum / SampleCount during the specified period. By comparing this statistic with the Minimum and Maximum values, you can determine the full scope of a metric and how close the average use is to the Minimum and Maximum values. This comparison helps you to know when to increase or decrease your resources.
            - `SampleCount` - The count, or number, of data points used for the statistical calculation.
        unit: The unit for the metric data request. Valid units depend on the metric data being requested. For the valid units to specify with each available metric, see the `metricName` parameter.
