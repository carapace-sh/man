name: describe-reserved-instances
description: Describes the Amazon OpenSearch Service instances that you have reserved in a given Region.
flags:
    --max-results=: An optional parameter that specifies the maximum number of results to return.
    --next-token=: If your initial `DescribeReservedInstances` operation returns a `nextToken`, you can include the returned `nextToken` in subsequent `DescribeReservedInstances` operations, which returns results in the next page.
    --reserved-instance-id=: The reserved instance identifier filter value.
documentation:
    command: Describes the Amazon OpenSearch Service instances that you have reserved in a given Region. For more information, see [Reserved Instances in Amazon OpenSearch Service](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/ri.html).
    flag:
        max-results: An optional parameter that specifies the maximum number of results to return. You can use `nextToken` to get the next page of results.
        next-token: If your initial `DescribeReservedInstances` operation returns a `nextToken`, you can include the returned `nextToken` in subsequent `DescribeReservedInstances` operations, which returns results in the next page.
        reserved-instance-id: The reserved instance identifier filter value. Use this parameter to show only the reservation that matches the specified reserved OpenSearch instance ID.
