documentation:
    command: |
        *(BETA)*  Creates or updates a Cloud Run service.
    flag:
        add-cloudsql-instances: Append the given values to the current Cloud SQL instances.
        add-custom-audiences: Append the given values to the current custom audiences.
        add-volume: "Adds a volume to the Cloud Run resource. To add more than one volume, specify this flag multiple times. Volumes must have a `name` and `type` key. Only certain values are supported for `type`. Depending on the provided type, other keys will be required. The following types are supported with the specified additional keys:\n+\n*cloud-storage*: A volume representing a Cloud Storage bucket. This volume type is mounted using Cloud Storage FUSE. See https://cloud.google.com/storage/docs/gcs-fuse for the details and limitations of this filesystem.\n  Additional keys:  \n* bucket: (required) the name of the bucket to use as the source of this volume    \n* readonly: (optional) A boolean. If true, this volume will be read-only from all mounts.  \n* mount-options: (optional) A list of flags to pass to GCSFuse. Flags should be specified without leading dashes and separated by semicolons.      \n+\n*in-memory*: An ephemeral volume that stores data in the instance's memory. With this type of volume, data is not shared between instances and all data will be lost when the instance it is on is terminated.\n  Additional keys:  \n* size-limit: (optional) A quantity representing the maximum amount of memory allocated to this volume, such as \"512Mi\" or \"3G\". Data stored in an in-memory volume consumes the memory allocation of the container that wrote the data. If size-limit is not specified, the maximum size will be half the total memory limit of all containers.      \n+\n*nfs*: Represents a volume backed by an NFS server.\n  Additional keys:  \n* location: (required) The location of the NFS Server, in the form SERVER:/PATH    \n* readonly: (optional) A boolean. If true, this volume will be read-only from all mounts."
        add-volume-mount: Adds a mount to the current container. Must contain the keys `volume=NAME` and `mount-path=/PATH` where NAME is the name of a volume on this resource and PATH is the path within the container's filesystem to mount this volume.
        allow-unauthenticated: Whether to enable allowing unauthenticated access to the service. This may take a few moments to take effect. Use *--allow-unauthenticated* to enable and *--no-allow-unauthenticated* to disable.
        allow-unencrypted-build: |-
            (DEPRECATED) Whether to allow customer-managed encryption key (CMEK) deployments without encrypting the build process. This means that only the deployed container will be encrypted.
            +
            The flag --allow-unencrypted-build is deprecated. The CMEK compliance is now available for the build process of source-based deployments. For more details, see https://cloud.google.com/run/docs/securing/using-cmek#source-deploy
        args: Comma-separated arguments passed to the command run by the container image. If not specified and no '--command' is provided, the container image's default Cmd is used. Otherwise, if not specified, no arguments are passed. To reset this field to its default, pass an empty string.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        automatic-updates: Indicates whether automatic base image updates should be enabled for an image built from source. Use *--automatic-updates* to enable and *--no-automatic-updates* to disable.
        base-image: Specifies the base image to be used for automatic base image updates. When deploying from source using the Google Cloud buildpacks, this flag will also override the base image used for the application image. See https://cloud.google.com/run/docs/configuring/services/automatic-base-image-updates for more details.
        binary-authorization: Binary Authorization policy to check against. This must be set to "default".
        breakglass: Justification to bypass Binary Authorization policy constraints and allow the operation. See https://cloud.google.com/binary-authorization/docs/using-breakglass for more information. Next update or deploy command will automatically clear existing breakglass justification.
        build-env-vars-file: |-
            Path to a local YAML file with definitions for all build
                        environment variables. All existing build environment variables will
                        be removed before the new build environment variables are added.
                        Example YAML content:
            +
                          ```
                          KEY_1: "value1"
                          KEY_2: "value 2"
                          ```
        build-service-account: |-
            Specifies the service account to use to execute the build. Applies only
            to source deploy builds using the Build API.
        build-worker-pool: |-
            Name of the Cloud Build Custom Worker Pool that should be used to build
            the function. The format of this field is
            `projects/${PROJECT}/locations/${LOCATION}/workerPools/${WORKERPOOL}`
            where ${PROJECT} is the project id and ${LOCATION} is the location where
            the worker pool is defined and ${WORKERPOOL} is the short name of the
            worker pool.
        clear-base-image: Opts out of automatic base image updates.
        clear-binary-authorization: Remove any previously set Binary Authorization policy.
        clear-build-env-vars: Remove all build environment variables.
        clear-build-service-account: Clears the Cloud Build service account field.
        clear-build-worker-pool: Clears the Cloud Build Custom Worker Pool field.
        clear-cloudsql-instances: Empty the current Cloud SQL instances.
        clear-config-maps: Remove all config-maps.
        clear-custom-audiences: Empty the current custom audiences.
        clear-encryption-key-shutdown-hours: Remove any previously set CMEK key shutdown hours setting.
        clear-env-vars: Remove all environment variables.
        clear-key: Remove any previously set CMEK key reference.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        clear-network: Disconnect this Cloud Run service from the VPC network it is connected to.
        clear-network-tags: Clears all existing network tags from the Cloud Run service.
        clear-post-key-revocation-action-type: Remove any previously set post CMEK key revocation action type.
        clear-secrets: Remove all secrets.
        clear-volume-mounts: Remove all existing mounts from the current container.
        clear-volumes: Remove all existing volumes from the Cloud Run resource, including volumes mounted as secrets
        clear-vpc-connector: Remove the VPC connector for this resource.
        client-name: Name of the client handling the deployment. Defaults to ``global'' if this and --client-version are both unspecified.
        client-version: Version of the client handling the deployment. Defaults to the current gcloud version if this and --client-name are both unspecified.
        cluster: |-
            ID of the cluster or fully qualified identifier for the cluster.

            To set the `cluster` attribute:
            * provide the argument `--cluster` on the command line;
            * set the property `run/cluster`;
            * specify the cluster from a list of available clusters.
        cluster-location: |-
            Zone in which the cluster is located. Alternatively, set the property [run/cluster_location].

            To set the `location` attribute:
            * provide the argument `--cluster` on the command line with a fully specified name;
            * set the property `run/cluster` with a fully specified name;
            * specify the cluster from a list of available clusters with a fully specified name;
            * provide the argument `--cluster-location` on the command line;
            * set the property `run/cluster_location`;
            * specify the cluster location from a list of available zones.
        command: Entrypoint for the container image. If not specified, the container image's default Entrypoint is run. To reset this field to its default, pass an empty string.
        concurrency: Set the maximum number of concurrent requests allowed per container instance. Leave concurrency unspecified or provide the special value 'default' to receive the server default value.
        connectivity: |-
            (DEPRECATED) Defaults to 'external'. If 'external', the service can be invoked through the internet, in addition to through the cluster network.
            +
            The --connectivity flag is deprecated but will continue to be supported. Prefer to use the --ingress flag instead.
        container: |-
            Specifies a container by name. Flags following --container will apply to the specified container.
            +
            Flags that are not container-specific must be specified before --container.
        context: The name of the context in your kubectl config file to use for connecting.
        cpu: |-
            Set a CPU limit in Kubernetes cpu units.
            +
            Cloud Run supports values fractional values below 1, 1, 2, 4, and 8.  Some CPU values requires a minimum Memory `--memory` value.
        cpu-boost: Whether to allocate extra CPU to containers on startup to reduce the perceived latency of a cold start request. Enabled by default when unspecified on new services. Use *--cpu-boost* to enable and *--no-cpu-boost* to disable.
        cpu-throttling: Whether to throttle the CPU when the container is not actively serving requests. Use *--cpu-throttling* to enable and *--no-cpu-throttling* to disable.
        default-url: Toggles the default url for a run service. This is enabled by default if not specified. Use *--default-url* to enable and *--no-default-url* to disable.
        depends-on: List of container dependencies to add to the current container.
        deploy-health-check: Schedules a single instance of the Revision and waits for it to pass its startup probe for the deployment to succeed. If disabled, the startup probe runs only when the revision is first started via invocation or by setting min-instances. This check is enabled by default when unspecified. Use *--deploy-health-check* to enable and *--no-deploy-health-check* to disable.
        description: Provides an optional, human-readable description of the service.
        encryption-key-shutdown-hours: The number of hours to wait before an automatic shutdown server after CMEK key revocation is detected.
        env-vars-file: |-
            Path to a local YAML or ENV file with definitions for all environment
                        variables. All existing environment variables will be removed before
                        the new environment variables are added. Example YAML content:
            +
                          ```
                          KEY_1: "value1"
                          KEY_2: "value 2"
                          ```
                          Example ENV content:
            +
                          ```
                          KEY_1="value1"
                          KEY_2="value 2"
                          ```
        execution-environment: |-
            Selects the execution environment where the application will run. _EXECUTION_ENVIRONMENT_ must be one of:
            +
            *gen1*::: Run the application in a first generation execution environment.
            *gen2*::: Run the application in a second generation execution environment.
            :::
            +
        function: Specifies that the deployed object is a function. If a value is provided, that value is used as the entrypoint.
        gpu: Cloud Run supports values 0 or 1.  1 gpu also requires a minimum 4 `--cpu` value and  a minimum 16Gi `--memory` value.
        gpu-type: The GPU type to use.
        gpu-zonal-redundancy: Set GPU zonal redundancy. Use *--gpu-zonal-redundancy* to enable and *--no-gpu-zonal-redundancy* to disable.
        iap: Whether to enable IAP for the Service. Use *--iap* to enable and *--no-iap* to disable.
        image: Name of the container image to deploy (e.g. `us-docker.pkg.dev/cloudrun/container/hello:latest`). When used with --source, the image must be the URI of an Artifact Registry Docker repository in the Docker format ($REGION-docker.pkg.dev/$PROJECT/$REPOSITORY") or ($REGION-docker.pkg.dev/$PROJECT/$REPOSITORY/$IMAGE_NAME"). The image name must be the same as the name of the service.
        ingress: |-
            Set the ingress traffic sources allowed to call the service. For Cloud Run the `--[no-]allow-unauthenticated` flag separately controls the identities allowed to call the service. _INGRESS_ must be one of:
            +
            *all*::: Inbound requests from all sources are allowed.
            *internal*::: For Cloud Run, only inbound requests from VPC networks
            in the same project or VPC Service Controls perimeter, as well as
            Pub/Sub subscriptions and Eventarc events in the same project or VPC
            Service Controls perimeter are allowed. All other requests are rejected.
            See https://cloud.google.com/run/docs/securing/ingress for full details
            on the definition of internal traffic for Cloud Run.
            +
            *internal-and-cloud-load-balancing*::: Only inbound requests from Google Cloud Load Balancing or a traffic
            source allowed by the internal option are allowed.
            +
            :::
            +
        invoker-iam-check: Optionally disable invoker IAM checks. This feature is available by invitation only. More info at https://cloud.google.com/run/docs/securing/managing-access#invoker_check. Use *--invoker-iam-check* to enable and *--no-invoker-iam-check* to disable.
        key: CMEK key reference to encrypt the container with.
        kubeconfig: The absolute path to your kubectl config file. If not specified, the colon- or semicolon-delimited list of paths specified by $KUBECONFIG will be used. If $KUBECONFIG is unset, this defaults to `~/.kube/config`.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            An alias to --update-labels.
        liveness-probe: |-
            Comma separated settings for liveness probe in the form KEY=VALUE.
            Each key stands for a field of the probe described in
            https://cloud.google.com/run/docs/reference/rest/v1/Container#Probe.
            Currently supported keys are: initialDelaySeconds, timeoutSeconds, periodSeconds, failureThreshold, httpGet.port, httpGet.path, grpc.port, grpc.service.
            +
            For example, to set a probe with 10s timeout and HTTP probe requests
            sent to 8080 port of the container:
            +
                $ --liveness-probe=timeoutSeconds=10,httpGet.port=8080
            +
            To remove existing probe:
            +
                $ --liveness-probe=""
        max: The maximum number of container instances to run for this Service. This instance limit will be divided among all Revisions receiving a percentage of traffic and can be modified without deploying a new Revision.
        max-instances: The maximum number of container instances for this Revision to run or 'default' to remove. This setting is immutably set on each new Revision and modifying its value will deploy another Revision.
        memory: 'Set a memory limit. Ex: 1024Mi, 4Gi.'
        mesh: Enables Cloud Service Mesh using the specified mesh resource name. Mesh resource name must be in the format of projects/PROJECT/locations/global/meshes/MESH_NAME or MESH_NAME. Will default to the current project if only MESH_NAME is provided.
        min: The minimum number of container instances to run for this Service or 'default' to remove. These instances will be divided among all Revisions receiving a percentage of traffic and can be modified without deploying a new Revision.
        min-instances: The minimum number of container instances to run for this Revision  or 'default' to remove. This setting is immutably set on each new  Revision and modifying its value will deploy a another Revision. Consider using --min to set the minimum number of instances across all revisions of the Service which may be modified dynamically.
        namespace: |-
            Specific to Cloud Run for Anthos: Kubernetes namespace for the service.
            +
            To set the `namespace` attribute:
            * provide the argument `SERVICE` on the command line with a fully specified name;
            * specify the service name from an interactive prompt with a fully specified name;
            * provide the argument `--namespace` on the command line;
            * set the property `run/namespace`;
            * For Cloud Run on Kubernetes Engine, defaults to "default". Otherwise, defaults to project ID.;
            * provide the argument `project` on the command line;
            * set the property `core/project`.
        network: The VPC network that the Cloud Run service will be able to send traffic to. If --subnet is also specified, subnet must be a subnetwork of the network specified by this --network flag. To clear existing VPC network settings, use --clear-network.
        network-tags: Applies the given network tags (comma separated) to the Cloud Run service. To clear existing tags, use --clear-network-tags.
        no-allow-unauthenticated: Whether to enable allowing unauthenticated access to the service. This may take a few moments to take effect.
        no-allow-unencrypted-build: |-
            (DEPRECATED) Whether to allow customer-managed encryption key (CMEK) deployments without encrypting the build process. This means that only the deployed container will be encrypted.
            +
            The flag --allow-unencrypted-build is deprecated. The CMEK compliance is now available for the build process of source-based deployments. For more details, see https://cloud.google.com/run/docs/securing/using-cmek#source-deploy
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-automatic-updates: Indicates whether automatic base image updates should be enabled for an image built from source.
        no-build: When set, the cloud build step will be skipped and the provided will be extracted directly on the base image.
        no-clear-base-image: Opts out of automatic base image updates.
        no-clear-binary-authorization: Remove any previously set Binary Authorization policy.
        no-clear-build-env-vars: Remove all build environment variables.
        no-clear-build-service-account: Clears the Cloud Build service account field.
        no-clear-build-worker-pool: |
            Clears the Cloud Build Custom Worker Pool field.
        no-clear-cloudsql-instances: Empty the current Cloud SQL instances.
        no-clear-config-maps: Remove all config-maps.
        no-clear-custom-audiences: Empty the current custom audiences.
        no-clear-encryption-key-shutdown-hours: Remove any previously set CMEK key shutdown hours setting.
        no-clear-env-vars: Remove all environment variables.
        no-clear-key: Remove any previously set CMEK key reference.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-clear-network: Disconnect this Cloud Run service from the VPC network it is connected to.
        no-clear-network-tags: 'Clears all existing network tags from the Cloud Run service. '
        no-clear-post-key-revocation-action-type: Remove any previously set post CMEK key revocation action type.
        no-clear-secrets: Remove all secrets.
        no-clear-volume-mounts: Remove all existing mounts from the current container.
        no-clear-volumes: Remove all existing volumes from the Cloud Run resource, including volumes mounted as secrets
        no-clear-vpc-connector: Remove the VPC connector for this resource.
        no-cpu-boost: Whether to allocate extra CPU to containers on startup to reduce the perceived latency of a cold start request. Enabled by default when unspecified on new services.
        no-cpu-throttling: Whether to throttle the CPU when the container is not actively serving requests.
        no-default-url: Toggles the default url for a run service. This is enabled by default if not specified.
        no-deploy-health-check: Schedules a single instance of the Revision and waits for it to pass its startup probe for the deployment to succeed. If disabled, the startup probe runs only when the revision is first started via invocation or by setting min-instances. This check is enabled by default when unspecified.
        no-gpu-zonal-redundancy: Set GPU zonal redundancy.
        no-iap: Whether to enable IAP for the Service.
        no-invoker-iam-check: Optionally disable invoker IAM checks. This feature is available by invitation only. More info at https://cloud.google.com/run/docs/securing/managing-access#invoker_check.
        no-session-affinity: Whether to enable session affinity for connections to the service.
        no-traffic: |-
            True to avoid sending traffic to the revision being deployed. Setting this flag assigns any traffic assigned to the LATEST revision to the specific revision bound to LATEST before the deployment. The effect is that the revision being deployed will not receive traffic.
            +
            After a deployment with this flag the LATEST revision will not receive traffic on future deployments. To restore sending traffic to the LATEST revision by default, run the `gcloud run services update-traffic` command with `--to-latest`.
        no-use-http2: Whether to use HTTP/2 for connections to the service.
        platform: 'Target platform for running commands. Alternatively, set the property [run/platform]. '
        port: |-
            Container port to receive requests at. Also sets
            the $PORT environment variable. Must be a number between 1 and 65535, inclusive.
            To unset this field, pass the special value "default".
            If updating an existing service with a TCP startup probe pointing to the
            previous container port, this will also update the probe port.
        post-key-revocation-action-type: |-
            Action type after CMEK key revocation. _POST_KEY_REVOCATION_ACTION_TYPE_ must be one of:
            +
            *prevent-new*::: No new instances will be started after CMEK key revocation.
            *shut-down*::: No new instances will be started and the existing instances will be shut
            down after CMEK key revocation.
            +
            :::
            +
        readiness-probe: |-
            Comma separated settings for readiness probe in the form KEY=VALUE.
            Each key stands for a field of the probe described in
            https://cloud.google.com/run/docs/reference/rest/v1/Container#Probe.
            Currently supported keys are: timeoutSeconds, periodSeconds, failureThreshold, successThreshold, httpGet.port, httpGet.path, grpc.port, grpc.service.
            +
            For example, to set a probe with 10s timeout and HTTP probe requests
            sent to 8080 port of the container:
            +
                $ --readiness-probe=timeoutSeconds=10,httpGet.port=8080
            +
            To remove existing probe:
            +
                $ --readiness-probe=""
        region: Region in which the resource can be found. Alternatively, set the property [run/region].
        regions: Comma-separated list of regions in which the multi-region Service can be found.
        remove-build-env-vars: List of build environment variables to be removed.
        remove-cloudsql-instances: Remove the given values from the current Cloud SQL instances.
        remove-config-maps: List of config-maps to be removed.
        remove-containers: List of containers to remove.
        remove-custom-audiences: Remove the given values from the current custom audiences.
        remove-env-vars: List of environment variables to be removed.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        remove-secrets: List of secrets to be removed.
        remove-volume: Removes volumes from the Cloud Run resource.
        remove-volume-mount: Removes the volume mounted at the specified path from the current container.
        revision-suffix: Specify the suffix of the revision name. Revision names always start with the service name automatically. For example, specifying [--revision-suffix=v1] for a service named 'helloworld', would lead to a revision named 'helloworld-v1'. Set empty string to clear the suffix and resume server-assigned naming.
        scaling: The scaling mode to use for this resource. Flag value could be either "auto" for automatic scaling, or a positive integer to configure manual scaling with the given integer as a fixed instance count.
        service-account: the email address of an IAM service account associated with the revision of the service. The service account represents the identity of the running revision, and determines what permissions the revision has.
        service-max-instances: The maximum number of container instances for this Service to run. This instance limit will be divided among all Revisions receiving a percentage of traffic.
        service-min-instances: The minimum number of container instances to run for this Service or 'default' to remove. These instances will be divided among all Revisions receiving a percentage of traffic and can be modified without deploying a new Revision.
        session-affinity: Whether to enable session affinity for connections to the service. Use *--session-affinity* to enable and *--no-session-affinity* to disable.
        set-build-env-vars: List of key-value pairs to set as build environment variables. All existing build environment variables will be removed first.
        set-cloudsql-instances: Completely replace the current Cloud SQL instances with the given values.
        set-config-maps: List of key-value pairs to set as config-maps. All existing config-maps will be removed first.
        set-custom-audiences: Completely replace the current custom audiences with the given values.
        set-env-vars: List of key-value pairs to set as environment variables. All existing environment variables will be removed first.
        set-secrets: List of key-value pairs to set as secrets. All existing secrets will be removed first.
        source: The location of the source to build. If a Dockerfile is present in the source code directory, it will be built using that Dockerfile, otherwise it will use Google Cloud buildpacks. See https://cloud.google.com/run/docs/deploying-source-code for more details. The location can be a directory on a local disk or a gzipped archive file (.tar.gz) in Google Cloud Storage. If the source is a local directory, this command skips the files specified in the `--ignore-file`. If `--ignore-file` is not specified, use `.gcloudignore` file. If a `.gcloudignore` file is absent and a `.gitignore` file is present in the local source directory, gcloud will use a generated Git-compatible `.gcloudignore` file that respects your .gitignored files. The global `.gitignore` is not respected. For more information on `.gcloudignore`, see `gcloud topic gcloudignore`.
        startup-probe: |-
            Comma separated settings for startup probe in the form KEY=VALUE.
            Each key stands for a field of the probe described in
            https://cloud.google.com/run/docs/reference/rest/v1/Container#Probe.
            Currently supported keys are: initialDelaySeconds, timeoutSeconds, periodSeconds, failureThreshold, httpGet.port, httpGet.path, grpc.port, grpc.service, tcpSocket.port.
            +
            For example, to set a probe with 10s timeout and HTTP probe requests
            sent to 8080 port of the container:
            +
                $ --startup-probe=timeoutSeconds=10,httpGet.port=8080
            +
            To remove existing probe:
            +
                $ --startup-probe=""
        subnet: The VPC subnetwork that the Cloud Run service will get IPs from. The subnetwork must be `/26` or larger. If --network is also specified, subnet must be a subnetwork of the network specified by the --network flag. If --network is not specified, network will be looked up from this subnetwork. To clear existing VPC network settings, use --clear-network.
        tag: |-
            Traffic tag to assign to the newly
            created revision.
        timeout: Set the maximum request execution time (timeout). It is specified as a duration; for example, "10m5s" is ten minutes, and five seconds. If you don't specify a unit, seconds is assumed. For example, "10" is 10 seconds.
        update-annotations: List of annotation KEY=VALUE pairs to update. If an annotation exists, its value is modified. Otherwise, a new annotation is created.
        update-build-env-vars: List of key-value pairs to set as build environment variables.
        update-config-maps: List of key-value pairs to set as config-maps.
        update-env-vars: List of key-value pairs to set as environment variables.
        update-labels: List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
        update-secrets: List of key-value pairs to set as secrets.
        use-http2: Whether to use HTTP/2 for connections to the service. Use *--use-http2* to enable and *--no-use-http2* to disable.
        vpc-connector: Set a VPC connector for this resource.
        vpc-egress: |-
            Specify which of the outbound traffic to send through Direct VPC egress or the VPC connector for this resource. This resource must have Direct VPC egress enabled or a VPC connector to set this flag. _VPC_EGRESS_ must be one of:
            +
            *all*::: (DEPRECATED) Sends all outbound traffic through Direct VPC egress or the VPC connector. Provides the same functionality as 'all-traffic'. Prefer to use 'all-traffic' instead.
            *all-traffic*::: Sends all outbound traffic through Direct VPC egress or the VPC connector.
            *private-ranges-only*::: Default option. Sends outbound traffic to private IP addresses (RFC 1918 and Private Google Access IPs) through Direct VPC egress or the VPC connector.
            +
            Traffic to other Cloud Run services might require additional configuration. See https://cloud.google.com/run/docs/securing/private-networking#send_requests_to_other_services_and_services for more information.
            :::
            +
