name: batch-detect-entities
description: Inspects the text of a batch of documents for named entities and returns information about them.
flags:
    --language-code=!: The language of the input documents.
    --text-list=!: A list containing the UTF-8 encoded text of the input documents.
completion:
    flag:
        language-code:
            - en
            - es
            - fr
            - de
            - it
            - pt
            - ar
            - hi
            - ja
            - ko
            - zh
            - zh-TW
documentation:
    command: Inspects the text of a batch of documents for named entities and returns information about them. For more information about named entities, see [Entities](https://docs.aws.amazon.com/comprehend/latest/dg/how-entities.html) in the Comprehend Developer Guide.
    flag:
        language-code: The language of the input documents. You can specify any of the primary languages supported by Amazon Comprehend. All documents must be in the same language.
        text-list: A list containing the UTF-8 encoded text of the input documents. The list can contain a maximum of 25 documents. The maximum size of each document is 5 KB.
