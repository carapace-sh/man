name: create-studio-lifecycle-config
description: Creates a new Amazon SageMaker AI Studio Lifecycle Configuration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --studio-lifecycle-config-app-type=!: The App type that the Lifecycle Configuration is attached to.
    --studio-lifecycle-config-content=!: The content of your Amazon SageMaker AI Studio Lifecycle Configuration script.
    --studio-lifecycle-config-name=!: The name of the Amazon SageMaker AI Studio Lifecycle Configuration to create.
    --tags=: Tags to be associated with the Lifecycle Configuration.
completion:
    flag:
        studio-lifecycle-config-app-type:
            - JupyterServer
            - KernelGateway
            - CodeEditor
            - JupyterLab
documentation:
    command: Creates a new Amazon SageMaker AI Studio Lifecycle Configuration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        studio-lifecycle-config-app-type: The App type that the Lifecycle Configuration is attached to.
        studio-lifecycle-config-content: The content of your Amazon SageMaker AI Studio Lifecycle Configuration script. This content must be base64 encoded.
        studio-lifecycle-config-name: The name of the Amazon SageMaker AI Studio Lifecycle Configuration to create.
        tags: Tags to be associated with the Lifecycle Configuration. Each tag consists of a key and an optional value. Tag keys must be unique per resource. Tags are searchable using the Search API.
