name: create-instance
description: Enables you to programmatically create an Amazon Web Services Supply Chain instance by applying KMS keys and relevant information associated with the API without using the Amazon Web Services console.
flags:
    --client-token=: The client token for idempotency.
    --instance-description=: The AWS Supply Chain instance description.
    --instance-name=: The AWS Supply Chain instance name.
    --kms-key-arn=: The ARN (Amazon Resource Name) of the Key Management Service (KMS) key you provide for encryption.
    --tags=: The Amazon Web Services tags of an instance to be created.
    --web-app-dns-domain=: The DNS subdomain of the web app.
documentation:
    command: |-
        Enables you to programmatically create an Amazon Web Services Supply Chain instance by applying KMS keys and relevant information associated with the API without using the Amazon Web Services console.

        This is an asynchronous operation. Upon receiving a CreateInstance request, Amazon Web Services Supply Chain immediately returns the instance resource, instance ID, and the initializing state while simultaneously creating all required Amazon Web Services resources for an instance creation. You can use GetInstance to check the status of the instance. If the instance results in an unhealthy state, you need to check the error message, delete the current instance, and recreate a new one based on the mitigation from the error message.
    flag:
        client-token: The client token for idempotency.
        instance-description: The AWS Supply Chain instance description.
        instance-name: The AWS Supply Chain instance name.
        kms-key-arn: The ARN (Amazon Resource Name) of the Key Management Service (KMS) key you provide for encryption. This is required if you do not want to use the Amazon Web Services owned KMS key. If you don't provide anything here, AWS Supply Chain uses the Amazon Web Services owned KMS key.
        tags: The Amazon Web Services tags of an instance to be created.
        web-app-dns-domain: The DNS subdomain of the web app. This would be "example" in the URL "example.scn.global.on.aws". You can set this to a custom value, as long as the domain isn't already being used by someone else. The name may only include alphanumeric characters and hyphens.
